chargen.LifePathCharacterGenerator.desc=Das Lebenspfad-System liefert eine weitere alternative Methode der Charaktererschaffung, bei der du Erfahrungen und Ereignisse auswählst, die die Lebensgeschichte und den Hintergrund deines Charakters definieren. Diese Wahlmöglichkeiten stellen dir eine Vielzahl an Optionen zur Verfügung, mit denen du deine Attribute, Fertigkeiten, Ressourcen und Connections festlegen kannst.
chargen.LifePathCharacterGenerator=Lebenspfadsystem

chargen.PointBuyCharacterGenerator.desc=Verwende das Punktekaufsystem, wenn du einen maßgeschneiderten Charakter erstellen willst und es dir nichts ausmacht, etwas mehr Zeit zu investieren, um den Charakter genau so hinzubekommen, wie du ihn haben möchtest.
chargen.PointBuyCharacterGenerator=Punktekaufsystem

chargen.PriorityCharacterGenerator.desc=Dies ist das normale Erschaffungssystem aus dem Grundregelwerk.
chargen.PriorityCharacterGenerator=Prioritätensystem

chargen.SumToTenCharacterGenerator.desc=Wenn du auf der Suche nach etwas mehr Anpassungsmöglichkeiten bist, als das Prioritätensystem zulässt, ist die Summenmethode eine einfache Alternative. Im Grunde ist sie nur eine etwas andere Herangehensweise an das Prioritätensystem. Üblicherweise muss man den fünf Kategorien der Charaktererschaffung (SR6, S. 64) genau einmal Priorität A, einmal Priorität B, einmal Priorität C, einmal Priorität D und einmal Priorität E zuweisen. Wenn du stattdessen die Summenmethode verwendest, stehen dir 10 Punkte zur Verfügung, um damit fünf Prioritäten zu erwerben. Dabei ist Priorität E kostenlos, Priorität D kostet 1 Punkt, Priorität C 2 Punkte, Priorität B 3 Punkte und Priorität A 4 Punkte.<br/>Du kannst eine beliebige Kombination von Prioritäten erwerben, solange die Summe ihrer Kosten 10 ergibt.
chargen.SumToTenCharacterGenerator=Summenmethode

chargen.KarmaCharacterGenerator=Karmasystem
chargen.KarmaCharacterGenerator.desc=Mit diesem optionalen Charaktererschaffungssystem könnt ihr die Charakterentwicklung mit Karma (SR6, S. 71) auch schon für die Charaktererschaffung anwenden. Es ist für alle gedacht, die die größtmögliche Flexibilität haben wollen, wenn sie ihre Charaktere entwerfen, was allerdings mit etwas mehr Rechenarbeit einhergeht. Deswegen findet ihr in diesem Abschnitt einige Tabellen, in denen ihr schnell nachsehen könnt, wie viel Karma ein Attribut oder eine Fertigkeit auf einem bestimmten Wert kostet.

chargen.FreeCharacterGenerator=Keine Regeln
chargen.FreeCharacterGenerator.desc=Ignoriert alle Regeln und Beschränkungen.\n\nGedacht für die Leute, die ihren Charakter außerhalb Commlink erschaffen haben.

