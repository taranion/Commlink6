chargen.LifePathCharacterGenerator.desc=The Life Path system provides an alternative to character creation in which you choose which experiences and events make up your character’s history and background. These choices provide you with various options to choose your starting attributes, skills, resources, and contacts.
chargen.LifePathCharacterGenerator=Life Path System

chargen.PointBuyCharacterGenerator.desc=Use the Point Buy system when you want to make a highly customized character and don’t mind spending some extra time working out the points to get it just the way you want it.
chargen.PointBuyCharacterGenerator=Point Buy System

chargen.PriorityCharacterGenerator.desc=This is the regular generation system from the Core rules.
chargen.PriorityCharacterGenerator=Priority System

chargen.SumToTenCharacterGenerator.desc=If you’re looking for a little extra customization than the priority system allows you to achieve, Sum-to-Ten is an easy alternative. Sum-to-Ten is a modified approach to the priority system.
chargen.SumToTenCharacterGenerator=Sum to Ten System

chargen.KarmaCharacterGenerator=Karma System (German Rules)
chargen.KarmaCharacterGenerator.desc=A generation system based on Karma that was introduced in the german translation of the <i>Sixth World Companion</i>.<br/>\
 You basically get a pool of 1000 Karma und raise your character paying the usual Karma cost otherwise used in career mode.

chargen.FreeCharacterGenerator=No Rules
chargen.FreeCharacterGenerator.desc=Ignores all rules and restrictions and lets do what you want.\n\nIntended for users who created their character outside Commlink.

chargen.SR6LifepathCharacterGenerator=Lifepath
chargen.SR6LifepathCharacterGenerator.desc=The Life Path system provides an alternative to character creation in which you choose which experiences and events make up your character’s history and background. These choices provide you with various options to choose your starting attributes, skills, resources, and contacts.<br/>\
 Unlike Sum-to-Ten and Point Buy, which merely replace a single step of the character creation rules from the core rulebook, the Life Path system takes over most of the process.

