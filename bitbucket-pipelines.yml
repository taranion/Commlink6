image: maven:3.8.6-openjdk-18

pipelines:
  pull-requests:
    '**':
      - step:
          name: Build and test
          script:
            - mvn -U -B -s settings.xml clean install -Dgpg.skip
  default:
    - step:
        name: Build
        script:
          - mvn -U -B -s settings.xml clean install -DskipTests
        artifacts:
          - Commlink6/target/commlink6-*complete.jar
          - Commlink6/target/config.xml

    - step:
        name: Deploy to Development
        script: 
          - sed -i 's/STABILITY/develop/g' Mondtor/target/config.xml
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/develop'
              LOCAL_PATH: 'Commlink6/target/config.xml'
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/develop'
              LOCAL_PATH: 'Commlink6/target/commlink6*complete.jar'
    - step:
        name: Deploy to Staging
        deployment: Staging
        trigger: manual
        script:
          - sed -i 's/STABILITY/develop/g' Commlink6/target/config.xml
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/testing'
              LOCAL_PATH: 'Commlink6/target/config.xml'
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/testing'
              LOCAL_PATH: 'Commlink6/target/commlink6*complete.jar'
    - step:
        name: Deploy to Staging
        deployment: Staging
        trigger: manual
        script:
          - ls Commlink6/target
          - sed -i 's/STABILITY/testing/g' Commlink6/target/config.xml
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/stable'
              LOCAL_PATH: 'Commlink6/target/config.xml'
          - pipe: atlassian/scp-deploy:1.3.0
            variables:
              USER: bitbucket
              SERVER: eden.rpgframework.de
              REMOTE_PATH: '/var/www/html/commlink6-updates/stable'
              LOCAL_PATH: 'Commlink6/target/commlink6*complete.jar'
