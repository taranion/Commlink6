image: maven:3.8.6-openjdk-18

pipelines:
  pull-requests:
    '**':
      - step:
          name: Build and test
          script:
            - mvn -B -s settings.xml clean install
  default:
    - step:
        script: 
          - mvn -B -s settings.xml clean deploy
    - step:
        name: Deploy to Staging
        deployment: Staging
        trigger: manual
        caches:
          - maven
        script:
          - cd Commlink6 ; mvn -B -s settings clean package
          - pwd
