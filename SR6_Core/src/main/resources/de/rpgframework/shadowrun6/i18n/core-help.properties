spell.increase_reflexes.desc=Dieser Zauber erhöht die Initiative des Ziels. Jeder Erfolg bei der Spruchzaubereiprobe addiert +1 zum Initiativewert des Ziels, und für je 2 Erfolge erhält das Ziel +1W6 Initiativewürfel. Ein Charakter kann gleichzeitig nur von einem solchen Zauber profitieren, und das Maximum von 5W6 Initiativewürfeln kann nicht überschritten werden.



quality.mysticadept.desc=Magieradepten sind eine Kombination aus Zauberern und Adepten.\n\
 \u2022 Magieradepten können nicht astral projizieren.\n\
 \u2022 Magieradepten können astral wahrnehmen, wenn sie die Adeptenkraft Astrale Wahrnehmung kaufen.\n\
 \u2022 Magieradepten kaufen ihre Zauber, Rituale und/oder Alchemischen Zauber auf dieselbe Weise wie Zauberer.\n\
 \u2022 Magieradepten müssen ihre Kraftpunkte mit Karma kaufen.\n\
 \u2022 Magieradepten können Schutzgeistern folgen.\n\
 \u2022 Magieradepten können beliebige magische Fertigkeiten oder Fertigkeitsgruppen (Hexerei, Beschwören, Verzaubern) wählen.

quality.low_light_vision.desc=Der Charakter erhält eine natürliche Restlichtverstärkung, mit der er sogar bei bloßem Sternenlicht sehen kann.\nTeilbeleuchtung und Schwache Beleuchtung gelten als Gute Beleuchtung.\nRestlichtverstärkung ist nicht mit Cyberaugen kompatibel.

quality.first_impression.desc=Mit diesem Vorteil fällt es einem Charakter leicht, sich in neue Situationen, Gruppen und Arbeitsverhältnisse einzufügen. Wenn er eine Gang infiltriert, Connections in einem neuen Sprawl sucht, uneingeladen zu einem privaten Treffen kommt oder sich auf andere Weise einer neuen sozialen Umgebung anpasst, erhält der Charakter für das erste Zusammentreffen einen Würfelpoolmodifikator von +2 für entsprechende Soziale Proben wie Überreden oder Verhandlung. Bei folgenden Zusammenkünften zählt dieser Bonus nicht. Durch diesen Vorteil wird der Schlechte Ruf (S. 371) eines Charakters um 1 gesenkt.
quality.gearhead.desc=Der Rennpilot ist dafür zuständig, im richtigen Moment das Pedal durchzutreten. Er ist der geborene Fahrer, Flieger oder Kapitän. Wenn er am Steuer eines Fahrzeugs oder einer Drohne ist, begreift er intuitiv die Möglichkeiten und Grenzen des Geräts und kann wirklich alles aus der Maschine herausholen. Bei taktischen Kämpfen oder Verfolgungsjagden kann ein Rennpilot (nach Wahl des Spielers) für 1W6 Minuten die Geschwindigkeit oder das Handling eines Fahrzeugs oder einer Drohne, das oder die er steuert, um +1 erhöhen. Außerdem erhält er auf alle Schwierigen Manöver (Schwellenwert 3 oder höher) oder Stunts einen Würfelpoolmodifikator von +2. Dieser Bonus hält 1W6 Minuten lang an. Der Charakter kann die Laufzeit des Bonus um weitere 1W6 Minuten ausdehnen, wenn er das wünscht. Das allerdings überfordert das Fahrzeug oder die Drohne, was die Gefahr erheblichen Schadens mit sich bringt. Für jede Minute, die der Bonus zusätzlich genutzt wird, erleidet das Fahrzeug automatisch (ohne Widerstandsprobe) 1 Kästchen Schaden.
quality.guts.desc=Wenn man einem Insektengeist mit gifttropfenden Mandibeln gegenübersteht, braucht es Mut, um nicht schreiend davonzulaufen. Mut verleiht dem Charakter einen Würfelpoolmodifikator von +2 auf Proben zum Widerstand gegen Angst und Einschüchterung, einschließlich magisch - also durch Zauber oder Critterkräfte - hervorgerufener Furcht.
quality.high_pain_tolerance.desc=Hohe Schmerztoleranz lässt einen Charakter weiter austeilen, auch wenn er selbst schon viel eingesteckt hat. Ein Charakter mit Hoher Schmerztoleranz kann pro Stufe 1 Kästchen Schaden bei der Berechnung von Verletzungsmodifikatoren (siehe S. 172) ignorieren. Wenn ein Charakter diesen Vorteil also auf Stufe 2 besitzt, kann er 4 Kästchen Schaden erleiden und ohne Verletzungsmodifikator weitermachen, als hätte er nur 2 Kästchen Schaden. Erst beim fünften Kästchen käme der Verletzungsmodifikator von -1 zum Tragen. Dieser Vorteil darf nicht gemeinsam mit der Adeptenkraft Schmerzresistenz, einem Schmerzeditor oder Schadenskompensatoren genutzt werden.
quality.home_ground.desc=Wenn ein Charakter sein Viertel besser kennt als irgendjemand sonst  alle Abkürzungen, Verstecke und vertrauenswürdigen Leute , hat er wahrscheinlich den Vorteil Vertrautes Terrain. Er kennt die Familien, die hier leben, kennt deren Geschichte, weiß, was die Kinder tun, die ausgezogen sind, kennt die Straßen besser als GridGuide, weiß, was nicht auf GridGuide zu finden ist, und weiß, wo GridGuide falsch liegt. Er weiß, wie die Gangs ticken, wer für wen kämpft, und wer vor wem davonläuft. Aber dieser Vorteil behandelt nicht nur Straßen in der physischen Welt. Je nach Charakter kann sich Vertrautes Terrain auf verschiedene Gebiete beziehen. Beim Erwerb dieses Vorteils können Sie einen der folgenden Effekte wählen: \n Astrale Akklimatisierung: Der Charakter ist an die Hintergrundstrahlung seines Vertrauten Terrains gewöhnt. Er lebt schon ewig damit und hat Möglichkeiten gefunden, damit umzugehen. Er kann bis zu 2 Punkte Hintergrundstrahlung ignorieren. Wenn die Hintergrundstrahlung seines Vertrauten Terrains also 3 beträgt, werden seine Magieproben nur mit einem Malus von -1 belegt, bei 5 nur mit -3 und so weiter. Dieser Vorteil wirkt nur auf dem Vertrauten Terrain, nicht in anderen Gebieten. \n Digitales Territorium: Dadurch betrachten Decker oder Technomancer einen bestimmten Host als ihr Gebiet. Vielleicht gehört er ihnen wirklich, aber es ist in jedem Fall ein Ort, den sie oft genug besuchen, um ihn als Heimat zu betrachten. Auf alle Matrixproben in dem Vertrauten Host erhält der Charakter einen Würfelpoolbonus von +2. Die Boni durch andere Vorteile sind mit dem Vertrauten Terrain kompatibel. Wenn der Charakter seit mehr als sechs Monaten nicht mehr in diesem Host war, verliert er den Vorteil Vertrautes Terrain, weil er sich nicht mehr so gut auskennt, wie er sollte. \n Gute Bekannte: Der Charakter hat ein dichtes Netz von Beziehungen in seinem Viertel geknüpft. Die Leute, die er kennt, sind keine Connections, erkennen ihn aber als einen der Ihren an, reden bereitwillig mit ihm oder tun ihm sogar Gefallen. NSCs aus dem Vertrauten Terrain werden gegenüber dem Charakter als freundlich betrachtet (solange er sich nicht unfreundlich verhält). Der Charakter erhält bei Verhandlungen mit ihnen einen Bonus von +2 auf seinen Straßenruf (S. 371). \n Straßenpolitik: Der Charakter kennt die Gangs, die Geschäfte und die Netzwerke, die hinter den Kulissen des Gesetzes in seinem Vertrauten Terrain bestehen. Er erhält einen Würfelpoolmodifikator von +2 auf Wissensproben, die mit Gangs und deren Geschäften zu tun haben. \n Transporter: Der Charakter kennt die Straßennetze, Gassen, Tunnel usw. wie seine Westentasche. Er weiß, wo GridGuide falsch liegt und was veraltete Informationen sind. Wenn der Transporter sich auf Vertrautem Terrain bewegt, erhält er bei Proben zum Aufholen oder Abhängen einen Würfelpoolmodifikator von +2. \n Unauffindbar: Sich zu verstecken oder einfach zu verschwinden gehört zum Alltag eines Runners. Der Vorteil Unauffindbar bedeutet, dass der Charakter Verstecke, Unterschlupfe, verlassene Häuser und alle möglichen Orte kennt, die nicht von Gangs oder Squattern beansprucht werden. Wenn er schnell einen sicheren Ort braucht, erhält er einen Würfelpoolbonus von +2 auf Proben mit Intuition + der passenden Straßenwissensfertigkeit, um solch einen Ort zu finden. \nDieser Vorteil kann mehrfach erworben werden, wobei immer eine der obigen Kategorien ausgewählt wird. Die Ausdehnung und genaue Lage des vertrauten Terrains sollten Sie mit dem Spielleiter absprechen.
quality.human-looking.desc=Ein Metamensch mit diesem Vorteil kann in den meisten Fällen als Mensch durchgehen. Menschliche NSCs reagieren auf ihn bei Proben mit Sozialen Fertigkeiten (S. 139) neutral, selbst wenn sie besondere Vorurteile gegen Metamenschen haben. Metamenschliche NSCs, die Vorurteile gegen Menschen haben, können aber unfreundlich auf den Charakter reagieren, wenn sie ihn für einen Menschen halten oder es fragwürdig finden, dass er versucht, wie ein Mensch auszusehen. Nur Elfen, Zwerge und Orks dürfen diesen Vorteil erwerben.
quality.indomitable.desc=Körper und Verstand mögen ihre Grenzen haben, aber manche Leute haben den eisernen Willen, diese Grenzen zu überwinden. Jede Stufe von Durchsetzungskraft verleiht dem Charakter eine Erhöhung eines Charakterlimits (Geistig, Körperlich oder Sozial) um +1. Er kann bis zu drei Stufen des Vorteils erwerben und damit beliebige Kombinationen von Erhöhungen erreichen (ein Limit um +3, drei Limits um +1 oder ein Limit um +1 und eines um +2).
quality.juryrigger.desc=Technisches Improvisationstalent verleiht dem Charakter ein intuitives Verständnis für die inneren Abläufe und Funktionsweisen von elektronischen und mechanischen Geräten. Er kann das Kaputte reparieren, das Verschlissene instand setzen, die Effizienz eines Geräts erhöhen oder es zu Dingen zwingen, die so nicht vorgesehen waren. Charaktere mit diesem Vorteil erhalten einen Würfelpoolmodifikator von +2 auf Proben mit Fertigkeiten der Fertigkeitsgruppe Mechanik. Wenn der Spielleiter findet, dass das Vorhaben des Charakters tatsächlich durchführbar ist, kann er die Tabelle Bauen und Reparieren (S. 146) zum Festlegen des Schwellenwerts heranziehen und den Schwellenwert dann um 1 senken. Mit einer erfolgreichen Probe auf eine Mechanikfertigkeit kann Technisches Improvisationstalent zwar Erstaunliches erreichen, aber selten etwas Dauerhaftes. Einige Beispiele, was man damit erreichen kann: \n Ein kaputtes Gerät 1W6 Minuten lang noch einmal zum Funktionieren bringen. \n Ein elektronisches Gerät manipulieren, damit es 1W6 Kampfrunden lang mit einer um 1 höheren Gerätestufe funktioniert. \n Kurzzeitig (für 1W6 Minuten) mehr Leistung aus den Komponenten eines Fahrzeugs oder einer Drohne herausholen. Dadurch steigen Handling oder Sensor um +1. Wenn dazu noch der Vorteil Rennpilot genutzt wird, brennen die wichtigen Systeme nach der Überforderung durch. Danach ist das Gerät nur noch ein großer Briefbeschwerer. \n Aus seltsamen Komponenten ein Gerät oder eine Waffe zur einmaligen Benutzung basteln. Der Spielleiter entscheidet, ob dafür passende Teile verfügbar sind. \n Ein improvisiertes Mittel finden, um ein Sicherheitssystem wie Lichtschranken oder Druckplatten zu umgehen.
quality.lucky.desc=Würfel, Münzen und Karten fallen auffallend oft so, wie der Charakter es möchte, und der Umgebung bleibt staunend vor so viel Glück der Mund offen stehen. Der Vorteil Glück lässt einen Charakter ein Edgeattribut erwerben, das 1 Stufe höher sein kann als das Maximum für den jeweiligen Metatyp (so könnte ein Mensch sein Edge bis auf 8 anheben). Dieser Vorteil erhöht Edge nicht gratis. Man muss immer noch mit Karma dafür bezahlen, um es so hoch zu bringen. Dieser Vorteil darf nur einmal und nur mit Zustimmung des Spielleiters gewählt werden. Er kann nicht mit dem Vorteil Außergewöhnliches Attribut kombiniert werden. Durch diesen Vorteil wird der Schlechte Ruf (S. 371) eines Charakters um 1 gesenkt.
quality.magical_resistance.desc=Dies ist die wundersame Fähigkeit, einen Feuerball mit dem Kopf abzuwehren. Für je 6 Karma, die für Magieresistenz ausgegeben werden, erhält der Charakter einen Würfelpoolmodifikator von +1 auf Zauberwiderstandsproben. Dieser Vorteil ist allerdings dauerhaft aktiv, wodurch er auch hilfreiche Zauber wie Heilen behindert. Ein Charakter mit Magieresistenz kann nicht als Freiwilliges Ziel für Zauber gelten, die das zwingend vorschreiben. Solche Zauber schlagen automatisch fehl. Charaktere, die ein Magieattribut besitzen, können diesen Vorteil nicht erwerben.
quality.mentor_spirit.desc=Jeder braucht im Leben etwas Hilfe, selbst wenn sie von einer etwas durchscheinenden, substanzlosen Seite kommt. Ein Schutzgeist ist ein Geist oder ein Konzept, dem der Charakter folgt (s. Schutzgeister, S. 319). Er wird von dem Schutzgeist bei der Ausübung seiner Magie geleitet und erhält durch ihn gewisse Möglichkeiten und Einschränkungen. Ein Charakter kann seinen Schutzgeist wechseln, aber immer nur einen gleichzeitig haben. Um den Schutzgeist zu wechseln, muss der Charakter zuerst den aktuellen Schutzgeist mit Karma entfernen, als wäre er ein Nachteil. Dann muss er wieder Karma für den neuen Schutzgeist aufwenden. Diese Kosten stehen für den Aufwand und die Schwierigkeiten, die es mit sich bringt, seinem Schutzgeist zu entsagen und sich neu zu binden. Verschiedene Traditionen nennen ihre Schutzgeister anders. Hermetische Magier nennen sie eher Ideale, Schamanen eher Totems. Die Namen mögen unterschiedlich sein, aber die Auswirkungen sind dieselben. Dieser Vorteil darf nur von Charakteren mit einem Magieattribut gewählt werden.
quality.natural_athlete.desc=Ein Charakter mit diesem Vorteil besitzt eine unheimliche Eleganz, einen sanften Schritt und die beinahe übernatürliche Fähigkeit, sich geräuschlos zu bewegen. Manche Katzenhaften behaupten sogar, immer auf den Füßen zu landen, lassen aber selten zu, dass andere Leute sie fallen lassen, um das auszuprobieren. Dieser Vorteil verleiht einen Würfelpoolmodifikator von +2 auf Schleichenproben.
quality.natural_hardening.desc=Dieser Vorteil macht die neuralen Verbindungen eines Charakters unempfindlicher gegenüber Feedback. Dadurch erhält er 1 Punkt natürlichen Biofeedback-Filter, der kumulativ mit dem Programm Biofeedback-Filter oder der Firewall eines Technomancers ist.
quality.natural_immunity1.desc=Die Fähigkeit, den Schierlingsbecher ohne Folgen zu leeren, sollte man nie unterschätzen. Ein Charakter mit Natürlicher Immunität hat eine angeborene oder erworbene Unempfindlichkeit gegenüber einer Krankheit oder einem Toxin. Dieser Vorteil ist in zwei Stufen zu haben: Wenn man 4 Karma dafür ausgibt, wird der Charakter gegenüber einem einzelnen natürlichen Toxin oder einer natürlichen Krankheit immun. Natürliche Immunität wirkt nicht gegen magische Toxine oder Krankheiten wie MMVV. Spieler und Spielleiter müssen vereinbaren, welche Droge, welches Gift oder welche Krankheit zugelassen wird. Der Charakter kann alle sechs Stunden eine Dosis der Droge oder des Gifts zu sich nehmen oder sich einer Ansteckung aussetzen, ohne Folgen befürchten zu müssen. Zusätzliche Dosen oder Ansteckungsgefahren innerhalb dieser sechs Stunden wirken normal, aber der Charakter braucht zur Genesung nur die Hälfte der Zeit (aufgerundet). Ein Charakter, der gegenüber einer Krankheit eine Natürliche Immunität besitzt, kann dennoch Krankheitsträger sein und andere infizieren, auch wenn er selbst keine Symptome zeigt.
quality.natural_immunity2.desc=Die Fähigkeit, den Schierlingsbecher ohne Folgen zu leeren, sollte man nie unterschätzen. Ein Charakter mit Natürlicher Immunität hat eine angeborene oder erworbene Unempfindlichkeit gegenüber einer Krankheit oder einem Toxin. Dieser Vorteil ist in zwei Stufen zu haben: Wenn die vollen 10 Karma ausgegeben werden, ist der Charakter gegenüber einem synthetischen Gift oder einer Designerkrankheit immun. Natürliche Immunität wirkt nicht gegen magische Toxine oder Krankheiten wie MMVV. Spieler und Spielleiter müssen vereinbaren, welche Droge, welches Gift oder welche Krankheit zugelassen wird. Der Charakter kann alle sechs Stunden eine Dosis der Droge oder des Gifts zu sich nehmen oder sich einer Ansteckung aussetzen, ohne Folgen befürchten zu müssen. Zusätzliche Dosen oder Ansteckungsgefahren innerhalb dieser sechs Stunden wirken normal, aber der Charakter braucht zur Genesung nur die Hälfte der Zeit (aufgerundet). Ein Charakter, der gegenüber einer Krankheit eine Natürliche Immunität besitzt, kann dennoch Krankheitsträger sein und andere infizieren, auch wenn er selbst keine Symptome zeigt.
quality.photographic_memory.desc=Ein Charakter mit einem Fotografischen Gedächtnis kann sich an Zahlen, Daten, Fakten und alles, was er gesehen oder gehört hat, erinnern. Er erhält für alle Erinnerungsproben einen Würfelpoolmodifikator von +2.
quality.quick_healer.desc=Der Charakter erhält für alle Proben bei Genesung und Heilung, die von ihm oder für ihn abgelegt werden (einschließlich magischer Heilung), einen Würfelpoolmodifikator von +2.
quality.resistance_to1.desc=KOSTEN: 4 \nEin Charakter mit Pathogen- und Toxinresistenz kann mit Krankheiten und Drogen besser fertig werden als andere und erhält einen Würfelpoolmodifikator von +1 auf entsprechende Widerstandsproben. Diesen Vorteil gibt es in zwei Stufen: Für 4 Karma ist der Charakter entweder gegen Pathogene oder Toxine resistent, nicht gegenüber beiden.
quality.resistance_to2.desc=KOSTEN: 8 KARMA \nEin Charakter mit Pathogen- und Toxinresistenz kann mit Krankheiten und Drogen besser fertig werden als andere und erhält einen Würfelpoolmodifikator von +1 auf entsprechende Widerstandsproben. Diesen Vorteil gibt es in zwei Stufen: Für 8 Karma erhält er den Bonus von +1 in beiden Fällen.
quality.spirit_affinity.desc=Dieser Vorteil ist nur für Magieanwender erhältlich. Freundliche Geister führt dazu, dass ein Charakter auf eine Art von Geistern (s. Geister, S. 300) besonders eingestimmt ist. Diese Geister finden den Charakter interessant, fühlen sich zu ihm hingezogen und helfen ihm mit höherer Wahrscheinlichkeit. Vielleicht sind sie nicht willens, ihn anzugreifen, und benutzen, wenn sie dazu gezwungen werden, nichttödliche Mittel. Watcher und Diener können von diesem Vorteil nicht beeinflusst werden, da sie nicht herbeigerufen, sondern erschaffen werden. Freundliche Geister gewährt einem Zauberer 1 zusätzlichen Dienst von jedem Geist dieser Art sowie einen Würfelpoolmodifikator von +1 auf Bindenproben. Magieanwender können diesen Vorteil auch für eine Geisterart besitzen, die nicht Teil ihrer magischen Tradition ist.
quality.toughness.desc=Charaktere mit dem Vorteil Zähigkeit halten mehr Schaden aus als andere. Sie erhalten einen Würfelpoolmodifikator von +1 auf ihre Konstitution bei Schadenswiderstandsproben.
quality.will_to_live.desc=Für jede Stufe dieses Vorteils erhält der Charakter 1 Kästchen mehr für Überzähligen Schaden (siehe S. 172). Diese zusätzlichen Kästchen lassen den Charakter mehr Schaden aushalten, bevor er stirbt. Sie ändern nichts an seinem Zustandsmonitor; der Charakter wird also zur selben Zeit kampfunfähig wie ohne den Vorteil und erhält auch ganz normale Verletzungsmodifikatoren.


quality.astral_beacon.desc=Die astrale Signatur des Charakters ist - wie ein Leuchtfeuer - im Astralraum weithin sichtbar. Sie bleibt durch diesen Nachteil auch doppelt so lange erhalten, wie sie eigentlich sollte. Wenn man versucht, sie zu askennen, sinkt der Schwellenwert für die Askennenprobe außerdem um 1. Nur Charaktere, die ein Magieattribut besitzen, können diesen Nachteil haben.
quality.bad_luck.desc=Dieser Charakter ist wahrhaft verflucht. Das Schicksal wendet sich oft gegen ihn. Wenn er Edge einsetzt, würfeln Sie 1W6. Bei einer 1 wird der Punkt ausgegeben, hat aber den genau gegenteiligen Effekt. Wenn ein Charakter also zusätzliche Würfel bekommen wollte, bekommt er Würfel in gleicher Höhe abgezogen. Wenn er in einem Initiativedurchgang zuerst an der Reihe sein wollte, ist er stattdessen zuletzt dran. Wenn er Blitzangriff (S. 58) einsetzen wollte, erhält er stattdessen +0W6 und muss für diese Kampfrunde seinen Initiativewert als Initiativeergebnis nehmen. Wenn er einen Patzer ausbügeln wollte, wird der Patzer zu einem Kritischen Patzer. Die Wirkung des Unglücks tritt allerdings nur einmal pro Spielsitzung auf. Wenn das Schicksal dem Charakter einmal übel mitgespielt hat, lässt es ihn bis zur nächsten Spielsitzung in Ruhe, und er muss keinen W6 mehr würfeln, wenn er Edge einsetzt. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.bad_rep.desc=Ein Berüchtigter Charakter hat einen hartnäckigen, dunklen Fleck auf seinem Ruf. Er könnte sich früher bei Knight Errant durch besondere Brutalität gegenüber Shadowrunnern ausgezeichnet haben. Es könnte behauptet werden, er habe jemanden aus dem eigenen Team getötet. Wenn er Erwacht ist und aus einer verseuchten Region stammt, wird man ihn für einen toxischen Schamanen halten. Ob diese Verdächtigungen stimmen oder nicht, ist irrelevant. Der schlechte Ruf hat sich so verfestigt, dass jedermann den Charakter so sieht. Der Charakter beginnt das Spiel mit 3 Punkten Schlechtem Ruf (S. 371), die er nur loswerden kann, wenn er die Wurzel seines Schlechten Rufs beseitigt. Erst dann kann er den Nachteil mit Karma entfernen.
quality.code_of_honor.desc=Der Charakter folgt einem Ehrenkodex, der ihm verbietet, Angehörige einer bestimmten Gruppe zu töten. Er wählt eine Gruppe aus, deren Mitglieder er nicht tötet, und bei der er auch das Töten durch andere nicht zulässt. Solche Gruppen könnten Frauen, Kinder, Unschuldige oder bestimmte Metatypen sein. Ein Charakter kann sich auch dem Schutz bestimmter Paracritter verschreiben, wenn diese die Kraft Bewusstsein besitzen.Der Spielleiter muss dieser Auswahl zustimmen. Wenn die Gruppe (wie zum Beispiel Kinder) bei Runs eher selten vorkommt, kann der Spielleiter die Auswahl ablehnen. Wenn der Spieler unbedingt bei dieser Gruppe bleiben will, kann der Spielleiter ihm das Auswählen einer weiteren Gruppe erlauben (z.B. Frauen und Kinder), die aber mit größerer Wahrscheinlichkeit vorkommen muss. Ein Zauberer kann sich auch entscheiden, eine bestimmte Art von Geistern nicht zu vernichten, für die sein Schutzgeist einen Bonus zum Herbeirufen verleiht. Ein solcher Ehrenkodex aus Respekt vor dem Schutzgeist ist durchaus das Karma wert. Man kann diesen Nachteil nicht erwerben, indem man sich eine Gruppe aussucht, die es nicht gibt  wie etwa intelligente Hamster. Jedes Mal, wenn jemand versucht, ein Mitglied der gewählten Gruppe zu töten, muss der Charakter eine Probe auf Charisma + Willenskraft (4) ablegen. Wenn er die Probe nicht schafft, muss er sofort einschreiten. Wenn er selbst gezwungen ist, gegen Mitglieder der gewählten Gruppe vorzugehen, wird er sich immer für nichttödliche Methoden entscheiden. Einen Angehörigen dieser Gruppe zu töten wird der Charakter unter keinen Umständen auf sein Gewissen laden. Ein Ehrenkodex bringt einige Nachteile mit sich. Zum Beispiel können Zeugen übrig bleiben. Jeder Angehörige der gewählten Gruppe, den der Charakter am Leben lässt und der sich an den Charakter erinnern kann, erhöht die Prominenz des Charakters um 1. Und die möglichen Jobs werden für den Charakter auch weniger: Er wird keinen Auftrag annehmen, bei dem ein Mitglied der Gruppe getötet werden soll, und er wird gegenüber Aufträgen, bei denen ein Verletzen eines Mitglieds der Gruppe, auch durch Zufall, höchst wahrscheinlich ist, sehr reserviert sein. Auch wenn man nichttödliche Mittel benutzt, kann etwas schiefgehen. So könnte jemand eine lebensgefährliche Allergie haben, die ein eigentlich harmloses Betäubungsgift tödlich macht, oder nach einem Taserangriff einen Herzinfarkt erleiden. Daher würfelt der Spielleiter, immer wenn der Charakter gegen jemanden aus der gewählten Gruppe Gewalt anwendet oder zulässt, verdeckt mit 1W6. Bei einer 1 ergibt sich eine unvorhergesehene Komplikation der nichttödlichen Gewalt. Bei einem Metamenschen könnte es lebensbedrohlich werden, bei einem Geist könnte ein Versuch des Verbannens zum Freisetzen des Geistes führen. Der Spielleiter würfelt für den Charakter eine verdeckte Probe auf Wahrnehmung + Intuition [Geistig] (4), um zu sehen, ob er die Komplikation bemerkt. Wenn ein Angehöriger der gewählten Gruppe getötet oder vernichtet wird, egal ob absichtlich oder zufällig, verliert der Charakter für diesen Run 1 Punkt Karma pro getöteter Person aus seiner gewählten Gruppe. Der Ehrenkodex kann auch andere Formen annehmen, zum Beispiel: \n Credo des Assassinen: Der Charakter tötet niemanden, ohne dafür bezahlt zu werden. Er ist stolz darauf, präzise wie ein Assassine zuzuschlagen, keinen unnötigen Schaden anzurichten und unsichtbar zu bleiben. Charaktere, die sich für diese Version des Ehrenkodex entscheiden, verlieren 1 Punkt Karma für jeden unabsichtlichen oder unbezahlten Mord. Und jeder dieser Tode steigert ihre Prominenz um 1. \n Kriegerkodex: Ein Charakter, der sich dem Kriegerkodex verschrieben hat, achtet strikt auf seine persönliche Ehre. Im Jahr 2075 bedeutet das, dass der Charakter keine Unbewaffneten tötet, niemanden, der nicht darauf vorbereitet ist (wie eine Wache, die den Runner nicht bemerkt), mit tödlicher Gewalt angreift, und nicht zulässt, dass jemand getötet wird, der sich nicht verteidigen kann (wie durch Querschläger oder Scharfschützen). Der Charakter verliert für jede unbewaffnete oder nicht verteidigungsfähige Person, die er tötet oder deren Töten er zulässt, 1 Punkt Karma.
quality.codeblock.desc=Ein Charakter mit diesem Nachteil hat immer Schwierigkeiten mit einer bestimmten Matrixhandlung. Jedes Mal, wenn er diese Handlung durchführt, erhält er einen Würfelpoolmodifikator von -2 auf die Probe. Der Nachteil kann nur für Matrixhandlungen gewählt werden, die eine Probe verlangen (siehe S. 234). Ein Charakter kann Programmierniete nicht für Hacking-Handlungen wählen, die er wahrscheinlich nie durchführen wird.
quality.combat_paralysis.desc= Ein Charakter mit Kampflähmung ist in Kampfsituationen (auch im Astral- und Matrixkampf) wie gelähmt. In der ersten Kampfrunde muss der Charakter sein Initiativeergebnis halbieren (und abrunden). In den folgenden Kampfrunden legt er dann wie gewohnt Initiativeproben ab. Außerdem erhält der Charakter für Überraschungsproben einen Würfelpoolmodifikator von -3. Wenn er in einer Kampfsituation eine Selbstbeherrschungsprobe (S. 153) ablegen muss, steigt der Schwellenwert dafür um 1. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.dependents_occasional.desc=Ein Charakter mit diesem Nachteil ist für ihm Nahestehende finanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpflichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw. \nFür 3 Karma ist die Verpflichtung gelegentlich lästig: Sie könnte unangekündigt auftauchen (wenn der Charakter gerade dringend zu einem Treffen muss), könnte einen Gefallen, eine Schulter zum Ausweinen, Geld oder Liebesbeweise brauchen. Beispiele dafür sind faule Verwandte, Lebensabschnittspartner oder Kinder, die man nicht im Haus hat, für die man aber finanzielle und andere Verpflichtungen übernommen hat. Die Lebensstilkosten des Charakters steigen um 10 %.
quality.dependents_regular.desc=Ein Charakter mit diesem Nachteil ist für ihm Nahestehende finanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpflichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw. \nFür 6 Karma stört die Verpflichtung regelmäßig: Sie braucht regelmäßige Zuwendung, mischt sich ein oder lebt im selben Haushalt. Beispiele dafür sind Ehepartner oder Verwandte, die im selben Haushalt leben, Kinder mit geteiltem Sorgerecht, die (jedes zweite Wochenende) betreut werden, Kleinkinder oder junge Geschwister, um die man sich kümmern muss. Die Lebensstilkosten des Charakters steigen um 20 %.
quality.dependents_close.desc=Ein Charakter mit diesem Nachteil ist für ihm Nahestehende finanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpflichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw. \nFür 9 Karma besteht die Verpflichtung gegenüber nahen Verwandten oder Partnern, die dem Charakter wirklich am Herzen liegen. Zeit und Ressourcen des Charakters werden in diesem Fall stark beansprucht, vielleicht braucht die entsprechende Person sogar Pflege  in jedem Fall ist der Charakter in seiner Zeit deutlich eingeschränkt. Solche Verpflichtungen könnten sich durch das Zusammenleben im Familienverband, durch pflegebedürftige Angehörige oder ein alleiniges Sorgerecht für Kinder ergeben. Die Lebensstilkosten des Charakters steigen um 30 %.
quality.distinctive_style.desc=Ein Charakter mit diesem Nachteil besitzt mindestens ein auffälliges Merkmal, verhält sich auffällig oder fällt durch seine Persönlichkeit auf. Ein Auffälliger Stil kann sich zum Beispiel durch folgende Merkmale ergeben: Tätowierungen, die sich schwer verbergen lassen, Akzente oder besondere Sprechweisen, seltsame Kleidung, Narben, Gang- oder Gefängnistattoos, auffällige Cyberware oder nicht metamenschliche Bodytech wie etwa ein Schwanz. Denken Sie daran, dass das, was in einer Kultur sehr auffällt, in einer anderen ganz normal sein kann. In jedem Fall sorgt aber der Auffällige Stil dafür, dass man sich leicht an den Charakter erinnert. Wer versucht, ihn zu identifizieren, zu verfolgen oder zu finden (oder Erkundigungen über ihn einzuholen), erhält bei den entsprechenden Proben einen Würfelpoolbonus von +2. Wenn ein NSC eine Erinnerungsprobe ablegen muss, um sich an möglichst viel über den Charakter zu erinnern, sinkt der Schwellenwert dafür um 1 (bis zu einem Minimum von 1). Dieser Nachteil ist physischer Natur und gilt nicht für astrale Suchen. Er kann nur einmal gewählt werden. Der Nachteil ist nicht mit Unauffälligkeit kompatibel.
quality.elf_poser.desc=Ein Elfenposer ist ein Mensch, der gerne ein Elf wäre. Er sucht die Nähe von Elfen, spricht wie ein Elf und verändert sein Äußeres entsprechend. Charaktere mit diesem Nachteil nehmen kosmetische Operationen auf sich, um Elfenohren und -augen zu bekommen. Sie können durchaus als Elfen durchgehen und etwaige negative Soziale Modifikatoren umgehen, die sie als Nicht-Elfen hätten. Echte Elfen halten Elfenposer für peinlich, und viele Menschen halten sie für Opportunisten. Andere Metatypen finden Elfenposer einfach lächerlich. Wenn ein Elf das Geheimnis des Charakters aufdeckt, wird er sich wahrscheinlich feindselig und angeekelt verhalten (s. Tabelle Soziale Modifikatoren, S. 140). Ein aufgedeckter Elfenposer könnte von Menschen, die entsprechende Vorurteile hegen, als Rassenverräter betrachtet werden. Nur Menschen dürfen den Nachteil Elfenposer wählen. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.gremlins.desc=GCharaktere mit diesem Nachteil haben Schwierigkeiten mit Technologie. Auf unerklärliche Weise funktionieren Geräte nicht, Programme stürzen ab, Fahrzeuge starten nicht, Dinge werden plötzlich zerbrechlich und WiFi-Empfang wird instabil und voller Interferenzen. Für jede Stufe dieses Nachteils (bis maximal 4) wird eine 1 weniger benötigt, um einen Patzer (S. 47) zu erzielen, wenn der Charakter ein auch nur ansatzweise kompliziertes Gerät benutzen will. Ein Charakter mit einem Würfelpool von 8 und Gremlins 2 (8 Karma) würde schon bei 2 oder mehr Einsen (statt der normalen 4) einen Patzer würfeln. Der Spielleiter kann auch Proben für Handlungen verlangen, die eigentlich ohne Proben gelingen (wie das Einschalten eines Trideogeräts), um vielleicht einen Patzer zu provozieren. Der Spielleiter sollte bei der Beschreibung dieser Patzer hervorheben, wie unerklärlich oder seltsam die Fehlfunktionen sind. Einige Beispiel dafür wären: ein Ladestreifen, der bei einem wichtigen Schuss einfach aus der Pistole fällt; ein Tastenfeld, das beim Versuch, einen Alarm durch Codeeingabe zu beenden, plötzlich zu brennen beginnt; oder ein Kommlink, dessen Interface mitten im Satz auf Sperethiel umschaltet, während man gerade einen gesicherten Host betreten will. Denken Sie daran, dass Gremlins ein Nachteil ist: Er behindert den Charakter (und vielleicht sein Team). Der Charakter kann den Nachteil nicht absichtlich benutzen, um die Hightech-Ausrüstung eines Gegners durch bloßes Berühren zu beschädigen. Wenn der Charakter nur mithilfe dieses Nachteils versucht, etwas zu sabotieren, funktioniert das betreffende Gerät im Gegenteil einwandfrei. Natürlich könnte der Charakter auch gewöhnliche Mittel zur Sabotage einsetzen, die aber wieder von den Gremlins betroffen wären. Dieser Nachteil betrifft nur externe Ausrüstung, keine Bodytech wie Cyber- oder Bioware. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.incompetent.desc=Ein Charakter mit Inkompetenz ist in einer Fertigkeitsgruppe völlig unfähig und unwissend oder  was vielleicht noch schlimmer ist  hat ein ungefähres Wissen von den Fertigkeiten aus dieser Gruppe, aber weder die Koordination noch das Verständnis, wenn es darum geht, sie auch nur ansatzweise vernünftig einzusetzen. Egal wie viel Anstrengung er in diesen Bereich steckt, er kann ihn einfach nicht verstehen  es müsste schon ein Wunder geschehen, damit er irgendwie, irgendwann auch nur ein Anfänger in diesen Fertigkeiten wird. Inkompetenz kann nicht für Sprach- oder Wissensfertigkeiten gewählt werden. Der Charakter gilt bei allen Fertigkeiten innerhalb der Fertigkeitsgruppe als Ahnungslos (s. Kasten Fertigkeitsstufen, S. 131). Manchmal kann eine Erfolgsprobe für Handlungen nötig sein, die anderen Leuten automatisch gelingen. Charaktere dürfen die gewählte Fertigkeitsgruppe nicht besitzen. Wenn Ausrüstung einen Bonus auf betroffene Fertigkeiten verleiht oder eine betroffene Fertigkeit zur Benutzung braucht, erhält der Charakter keinen Bonus. Der Spielleiter kann Fertigkeitsgruppen, die in seinen Runs keine Rolle spielen, ablehnen. Ein Beispiel wäre die Fertigkeitsgruppe Natur für eine Kampagne, die in einer Arkologie spielt. Außerdem sollte der Vollständigkeit halber erwähnt werden, dass Charaktere niemals Inkompetenz für eine Fertigkeitsgruppe wählen können, zu deren Nutzung sie gar nicht in der Lage sind. Ein Nichtzauberer kann keine Inkompetenz für Hexerei, Beschwören oder Verzaubern wählen, Nichttechnomancer können keine Inkompetenz für Resonanz-Fertigkeiten erwerben und so weiter. Man kann diesen Nachteil nur einmal erwerben. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.insomnia1.desc=Ein Charakter mit diesem Nachteil hat Einschlafschwierigkeiten und fühlt sich selten richtig ausgeruht. Meist ist das nur lästig, aber bei Runnern kann es ein echtes Problem werden, wenn Ruhe nötig ist, um wieder aufmerksam und frisch zu werden. Schlaflosigkeit kann die Zeit verlängern, die ein Charakter zur Genesung von Geistigem Schaden braucht. Für 10 Karma muss der Charakter, bevor er die Probe mit Konstitution + Willenskraft zur Genesung von Geistigem Schaden ablegt, eine Probe auf Willenskraft + Intuition (4) schaffen. Wenn er sie schafft, wird seine Genesung nicht von Schlaflosigkeit behindert. Außerdem erhält er nach 8 Stunden Schlaf 1 Punkt Edge zurück. Wenn dem Charakter die Probe misslingt, wird die Zeit, die er zur Genesung braucht, verdoppelt. Er würde also nicht in einer Stunde, sondern innerhalb von zwei Stunden die entsprechenden Kästchen Geistigen Schaden ausheilen. Außerdem erhält er kein Edge zurück und kann auch weitere 24 Stunden keins zurückerhalten.
quality.insomnia2.desc=Ein Charakter mit diesem Nachteil hat Einschlafschwierigkeiten und fühlt sich selten richtig ausgeruht. Meist ist das nur lästig, aber bei Runnern kann es ein echtes Problem werden, wenn Ruhe nötig ist, um wieder aufmerksam und frisch zu werden. Schlaflosigkeit kann die Zeit verlängern, die ein Charakter zur Genesung von Geistigem Schaden braucht. Für 15 Karma führt eine gescheiterte Probe auf Willenskraft + Intuition (4) dazu, dass gar keine Genesung bei Geistigem Schaden stattfindet. Der Charakter muss es dann in einer späteren Ruhephase erneut versuchen. Außerdem müssen auch weitere 24 Stunden vergehen, bevor er wieder Edge zurückerhalten kann.
quality.loss_confidence.desc=Dieser Nachteil bedeutet, dass der Charakter aus irgendeinem Grund das Vertrauen in sich selbst und eine seiner Fähigkeiten verloren hat. Er war vielleicht ein versierter Decker, schaffte es aber nicht, sich in einen Stuffer Shack zu hacken. Oder er hat trotz aller Geschicklichkeit bei einfachem Klettern gepatzt und ist in einen Müllcontainer gefallen. In jedem Fall ist er von Selbstzweifeln geplagt. Bei Proben mit der betroffenen Fertigkeit erleidet er einen Würfelpoolmodifikator von -2. Wenn der Charakter bei der Fertigkeit eine Spezialisierung hat, kann er diese nicht nutzen. Die gewählte Fertigkeit muss für den Charakter wichtig sein, und er muss einiges in sie investiert haben. Nur Fertigkeiten mit Stufe 4 oder höher dürfen einen Charakter Verunsichert machen. Außerdem darf bei Proben mit der betroffenen Fertigkeit kein Edge eingesetzt werden.
quality.low_pain_tolerance.desc=Ein Charakter mit Niedriger Schmerztoleranz ist besonders schmerzempfindlich. Er erhält für je 2 volle Kästchen Schaden (statt der üblichen 3) einen Verletzungsmodifikator von -1. Dies gilt sowohl für Körperlichen als auch für Geistigen Schaden.
quality.ork_poser.desc=Ein Orkposer ist ein Elf oder Mensch, der von Goblin Rock oder hysterischen Orxploitation-Trends beeinflusst ist und sein Äußeres orkisch umwandelt. Verschiedene kosmetische Eingriffe und Hormongaben  wie implantierte Hauer, Wachstumshormone, Stimmband- oder Kehlkopfoperationen  lassen ihn durchaus als Ork durchgehen. Orkposer sind vielen Orks peinlich, aber manche tolerieren sie oder finden die Idee sogar schmeichelhaft. Ein Ork, der das Geheimnis des Charakters aufdeckt, wird sich entweder sehr feindselig verhalten oder den Charakter in die Familie aufnehmen wollen, wenn er durch ein Aufnahmeritual seine Orkheit beweist. Ein aufgedeckter Orkposer wird bei Menschen und Elfen wahrscheinlich stigmatisiert sein oder, wenn sie entsprechende Vorurteile habe, als Rasseverräter gelten. Nur Menschen und Elfen können Orkposer werden. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.


quality.scorched.desc=Ein Gezeichneter Charakter hat neurologische Probleme, die von Schaden durch Schwarzes IC, Psychotropes IC oder BTLs verursacht wurden. Die Probleme können Schwächen des Lang- oder Kurzzeitgedächtnisses, Blackouts, Migräne, Sinneseinschränkungen (bei Hören, Sehen, Riechen usw.) oder Persönlichkeitsstörungen wie Paranoia oder Angstneurosen sein. Der Spieler wählt eine bestimmte Auswirkung des Nachteils aus, die sich behindernd auswirken und dem Spielleiter Plotaufhänger bieten sollte. Immer, wenn der Charakter in die VR eintaucht oder einen BTL-Chip einschiebt, muss er eine Probe auf Konstitution + Willenskraft (4) ablegen. Wenn die Probe misslingt, erleidet er 6 Stunden lang die entsprechende Auswirkung. Ein Patzer oder Kritischer Patzer führt dazu, dass die Auswirkung 24 Stunden lang anhält. Man kann diesen Nachteil nur loswerden, wenn man sich medizinisch behandeln lässt und danach Karma ausgibt. Der Charakter behält aber Spuren seines Gezeichnet-Seins zurück. Wenn er wieder mal ein schlimmes Erlebnis mit Schwarzem IC, Psychotropem IC oder BTLs hat, kehrt der Nachteil zurück. Neben den körperlichen Auswirkungen des Nachteils ist der Charakter auch gegenüber dem ursprünglichen Auslöser empfindlicher. Wenn der Nachteil durch IC ausgelöst wurde, muss der Charakter, wenn er damit zu tun hat, eine Probe auf Willenskraft (3) schaffen, um nicht in Panik zu verfallen. Wenn er es schafft, sich dem IC zu stellen, das seinen Zustand des Gezeichnet-Seins ausgelöst hat, erhält er einen Würfelpoolmodifikator von -2 bei Schadenswiderstandsproben gegen Schaden durch dieses IC. Um den Nachteil durch BTLs zu erwerben, muss der Charakter zumindest eine Leichte BTL-Abhängigkeit und die nötige Ausrüstung haben, um BTL zu benutzen. Um den Nachteil für Schwarzes oder Psychotropes IC zu bekommen, muss der Charakter ein Decker oder Technomancer sein. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.sensitive_system.desc=Ein Charakter mit diesem Nachteil hat wegen einer Immunabstoßung Probleme mit Implantaten. Der Essenzverlust durch Cyberware wird verdoppelt. Bioware, egal wie sie entworfen oder gezüchtet wird, wird vom Körper abgestoßen und kann nicht implantiert werden. Bei Erwachten Charakteren und Technomancern, die nicht vorhaben, Bodytech zu implantieren, hat dieser Nachteil noch eine zusätzliche Auswirkung: Sie können Mana beziehungsweise Resonanz wie üblich benutzen, sind aber potenziell anfälliger für Entzug oder Schwund. Ein solcher Charakter mit diesem Nachteil muss vor der Entzugs- oder Schwundwiderstandsprobe eine Probe auf Willenskraft (2) ablegen. Ein Misslingen dieser Probe führt dazu, dass der Entzug oder Schwund für die folgende Widerstandsprobe um +2 steigt. Die Energie, die durch den Körper rast, verursacht bei ihm einfach mehr Schaden.
quality.simsense_vertigo.desc=Charaktere, die unter diesem Nachteil leiden, fühlen sich beim Umgang mit AR, VR und SimSinn (auch Smartlinks, Simrigs und Bildverbindungen) desorientiert. Sie erhalten einen Würfelpoolmodifikator von -2 auf alle Proben im Zusammenhang mit AR, VR oder SimSinn.
quality.sinner_national.desc=STAATLICHE SIN \nFür 5 Karma bekommt der Charakter eine Staatliche SIN. Seine Eltern waren legale Bürger eines Staates (wie der UCAS, CAS oder ADL), und er ist als Staatsbürger geboren. Er hat das Wahlrecht, kann sich Reisedokumente ausstellen lassen, zum Militär gehen oder für die Regierung arbeiten. Eine Staatliche SIN ist Voraussetzung für Sicherheitsfreigaben oder eine Karriere beim Militär. Ein Charakter mit Staatlicher SIN zahlt 15 % Steuern von seinem Bruttoeinkommen. Er ist auch nicht mit einem der Megakonzerne verbunden. Der Hauptnachteil einer Staatlichen SIN liegt darin, im System verzeichnet zu sein. Der Staat hat biometrische Daten (DNA, Fingerabdrücke, Retinamuster) von dem Charakter und tauscht diese über die Globale SIN-Registratur mit Behörden aus. Dadurch wird der Charakter, wenn bei einem Job etwas schiefgeht, viel leichter zu verfolgen. Außerdem verkaufen Staaten oft die Daten, die mit einer SIN verknüpft sind, an Konzerne. Leute mit legaler SIN bekommen dreimal so viel Werbung und Spam wie SINlose oder Leute mit gefälschter SIN. Und all diese Botschaften sind (basierend auf ihren Einkaufs- und Matrixnutzungsgewohnheiten) beunruhigend genau auf ihre Vorlieben abgestimmt.
quality.sinner_criminal.desc=KRIMINELLE SIN \nFür 10 Karma erhält der Charakter (von einem Staat oder Konzern) eine Kriminelle SIN, die seine ursprüngliche SIN ersetzt. Irgendwann in seinem Leben wurde der Charakter verhaftet, saß wegen eines Verbrechens im Gefängnis und ist nun für den Rest seines Lebens als Krimineller gebrandmarkt. Er ist von Gesetz wegen gezwungen, seine Kriminelle SIN dauernd zu senden. Ein Verstoß dagegen gilt als Verbrechen und kann zu einer neuerlichen Gefängnisstrafe führen. Die gesetzestreue Gesellschaft meidet ihn. Gesetzestreue Bürger würden noch eher mit einem SINlosen als mit einem Kriminellen zu tun haben wollen. Diese Kriminelle SIN führt dazu, dass die meisten SIN-Menschen dem Charakter mit Vorurteilen, Verdächtigungen oder offener Feindschaft begegnen. Oft wird ihm (in teuren Läden, bei Autohändlern, Museen usw.) der Zutritt verwehrt, und er wird es schwer haben, eine legale Anstellung zu finden. Er muss damit rechnen, jederzeit verhaftet und 48 Stunden lang zur Befragung festgehalten zu werden, wenn in seiner Nähe ein Verbrechen verübt wurde. Das Rechtssystem des Jahres 2075 ist eher ein Fließband als eine juristische Institution. Verdächtige werden bis zum Beweis der Unschuld als schuldig betrachtet, Indizien reichen für Verurteilungen, und die Höhe der Strafe hängt eher von der Laune des Richters als vom Vergehen ab. In dieser Umgebung hat die Polizei mehr Interesse daran, Fälle abzuschließen, als daran, Verbrechen aufzuklären. Sie wird versuchen, Leuten mit Krimineller SIN Verbrechen unterzuschieben, egal ob sie damit etwas zu tun haben oder nicht. Ein gewisser Grad an Anpassung von Indizien und Interpretation von Zeugenaussagen ist weit verbreitet. Beweisfälschung, um die Verurteilungsquoten erfüllen zu können, ist ebenfalls nicht unüblich. Magieanwender werden vom System noch härter angefasst als mundane Kriminelle. Wenn der Charakter ein Magieanwender mit Krimineller SIN ist, ist er bei den örtlichen Behörden registriert. Er muss mit häufigen, meist unregelmäßigen und unangekündigten Überprüfungen rechnen, ob er noch lebt und keine verbotenen Zauber, Foki oder andere magische Geräte benutzt. Der Staat oder der Konzern, der die Kriminelle SIN ausgestellt hat, wird den Charakter genau überwachen. Wenn er eine Adressänderung nicht meldet oder irgendwie den Anschein erweckt, sich der Überwachung entziehen zu wollen, wird er verhaftet. Außerdem muss er der Körperschaft, von der er die SIN hat, 15 % Steuern zahlen. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.sinner_corp_limit.desc=EINGESCHRÄNKTE KONZERN-SIN \nFür 15 Karma besitzt der Charakter eine Eingeschränkte Konzern-SIN, weil er, von außen kommend, eine Stellung in einem Megakonzern erworben hat. Er kann ein angeheuerter Lohnsklave oder dessen Kind sein, oder von jemandem aus dem Konzern wegen seiner Erfahrung, Fähigkeiten, Talente oder anderer Nützlichkeit angeworben worden sein. Meist ersetzt eine Eingeschränkte Konzern-SIN eine Staatliche SIN. Die Eingeschränkte Konzern-SIN wird in die Globale SIN-Registratur aufgenommen, zu der Behörden und Konzerne Zugang haben. Meist hält diese Eingeschränkte Konzern-SIN auch fest, ob der Charakter Erwacht ist. Sie ermöglicht dem Charakter meist eine Anstellung im betreffenden Megakonzern. Mit dieser SIN kann der Charakter als Lohnsklave oder als einfaches Mitglied der Konzernsicherheit oder des Konzernmilitärs arbeiten. Er könnte zwar die Sicherheitsfreigaben bekommen, die für seine Arbeit nötig sind, kann aber keine Führungspositionen einnehmen und kein Offizier oder Mitglied von Spezialtruppen (wie den Roten Samurai) werden. Charaktere mit Eingeschränkter Konzern-SIN hält man oft für eingeweiht in Konzerninterna oder mit Fähigkeiten gesegnet, die für die Konkurrenz interessant sein könnten. Daher werden sie manchmal zum Ziel von Extraktionen, selbst wenn sie nichts mehr mit dem Konzern zu tun haben. Die SINlosen oder Leute in den Schatten hegen oft Vorurteile oder Feindseligkeit gegenüber Leuten mit Eingeschränkter Konzern-SIN. Die SINlosen meinen, die Konzerne hielten sie absichtlich arm und machtlos, um sie besser ausbeuten zu können. Ein Charakter mit Eingeschränkter Konzern-SIN kann erleben, dass ihm persönlich für Handlungen des Konzerns die Schuld gegeben wird. Meist nützt es wenig, wenn er darauf hinweist, dass er im Konzern gar keinen Einfluss hat. Die SINlosen und Neo-Anarchisten halten den Charakter mit Eingeschränkter Konzern-SIN für einen korrupten Opportunisten, der sich an ein Unterdrückersystem verkauft hat. Der Charakter muss 20 % von seinem Bruttoeinkommen an seinen Konzern als Steuern zahlen.
quality.sinner_corporate.desc=KONZERNBÜRGER-SIN \n Für 25 Karma ist der Charakter ein Konzernbürger. Mit einer solchen SIN wurde er wahrscheinlich in einen Megakonzern geboren oder gehörte einem Konzern an, als dieser exterritorial wurde. Mindestens ein Elternteil war wahrscheinlich ebenfalls Konzernbürger. Der Charakter ist im Konzern aufgewachsen, wurde dort sozialisiert, erzogen, und fast jeder Aspekt seines Lebens wurde vom Konzern geregelt. Seine Fähigkeiten wurden ständig bewertet, er wurde auf eine Karriere, die zum Ergebnis dieser Bewertungen passte, vorbereitet, und der Konzern war seine ganze Welt. Ein Charakter mit Konzernbürger-SIN hatte das Potenzial und die Möglichkeit, in der Hierarchie des Konzerns aufzusteigen. Er könnte ein Zweigstellenleiter, Finanzstratege, Geheimagent, Offizier beim Konzernmilitär oder sogar Mitglied einer Spezialtruppe (wie der Roten Samurai von Renraku oder der Firewatch von Ares) gewesen sein. Mit einer Konzernbürger-SIN könnte der Charakter hochrangige Sicherheitsfreigaben und Zugang zu fast unbegrenzten Mitteln gehabt haben. Dann geschah etwas Unvorhergesehenes. Ein unverzeihlicher, teurer Fehler, Intrigen eines Rivalen, ein Vorgesetzter, der einen Sündenbock brauchte  etwas hat den Charakter aus dem Konzern in die kalten, unbarmherzigen Schatten gedrängt. In den Schatten ist diese SIN, die der Schlüssel zum Glück war, nun ein tödlicher Schwachpunkt. Die meisten Leute in den Schatten sehen Konzernbürger als privilegierte Minderheit, als Aristokraten in gepanzerten Limousinen, die auf sie herabschauen, sie unterdrücken, ausbeuten und ihnen ihre Grundrechte verweigern. Wenn die SINlosen etwas über die Konzernbürger-SIN des Charakters herausfinden, werden die Reaktionen von tiefem Misstrauen bis hin zu gewalttätiger Feindseligkeit reichen. Auch Verletzungen und Tod sind im Bereich des Möglichen. Die Loyalität des Charakters zum Konzern wird nie in Zweifel gezogen, was in einer Kultur, die gegen die Kons kämpft, unüberwindliche Schwierigkeiten machen kann. Es wurden schon Möchtegern-Runner wegen ihrer Konzernzugehörigkeit getötet. Zum Glück gilt eine Konzernbürger-SIN nur für den ausgebenden Konzern. Sie wird in der Globalen SIN-Registratur als legale SIN aufscheinen, aber keine weiteren Informationen enthalten. Konzernbürger bezahlen etwa 10 % Steuern vom Bruttoeinkommen an ihren Konzern.
quality.social_stress.desc=Der Sozialstress, ob er durch ein Trauma ausgelöst wurde oder angeboren ist, behindert den Charakter beim Umgang mit anderen durch belastende Emotionen. Für diesen Nachteil müssen ein bestimmter Grund und ein Auslöser festgelegt werden. Wenn sich der Charakter zum Beispiel als Überlebender nach dem Verlust eines engen Freundes schuldig fühlt, kann ein zufälliges Treffen mit jemandem, der diesem Freund ähnlich sieht, den Sozialstress auslösen. Wenn ein Charakter die Fertigkeit Führung oder Gebräuche einsetzt, wird die Anzahl an Einsen, die für einen Patzer erforderlich ist, um 1 gesenkt. Der Spielleiter sollte von solchen Charakteren mehr Soziale Proben verlangen, um ihre Reaktion auf die Umwelt zu bestimmen, besonders, wenn eine Situation entsteht, die mit dem Grund des Nachteils zu tun hat.
quality.spirit_bane.desc=FEin Charakter mit diesem Nachteil ist einer bestimmten Art von Geistern (s. Geister, S. 300) wirklich zuwider. Er hat vielleicht den Ruf, diese Art von Geistern oft zu verletzen, oder seine Aura stößt die Geister ab. In jedem Fall bedrängen solche Geister den Charakter, gehorchen nur unwillig oder wollen ihm oder seinen Freunden keine Gefallen tun. Wenn Geister dieser Art den Befehl bekommen, eine Gruppe anzugreifen, in der sich der Charakter befindet, stürzen sie sich zuerst auf ihn. Sie werden immer tödliche Gewalt gegen den Charakter einsetzen. Wenn der Charakter versucht, einen Geist dieser Art herbeizurufen oder zu binden, erhält er für die Probe einen Würfelpoolmodifikator von -2. Wenn er versucht, einen solchen Geist zu verbannen, erhält der Geist einen Würfelpoolbonus von +2 auf die Widerstandsprobe. Watcher und Diener können von diesem Nachteil nicht beeinflusst werden, da sie nicht herbeigerufen, sondern erschaffen werden. Dieser Nachteil darf nur von Magieanwendern gewählt werden. Magieanwender können diesen Nachteil auch für eine Geisterart besitzen, die nicht Teil ihrer magischen Tradition ist. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.uncouth.desc=Ein Charakter mit diesem Nachteil hat es schwer bei der Interaktion mit anderen Leuten. Er reagiert impulsiv, tendiert zu Überreaktionen und sagt oft ohne nachzudenken, was ihm in den Sinn kommt (er beleidigt Mr. Johnson, nennt einen betrunkenen Troll Trog oder schlägt einem anderen Runner ins Gesicht, wenn der einen harmlosen Spaß macht). Alle Sozialen Proben, die der Charakter ablegen muss, um nicht impulsiv oder unangebracht zu reagieren, erhalten einen Würfelpoolmodifikator von -2. Außerdem werden die Kosten für das Lernen von Sozialen Fertigkeiten (auch bei der Charaktererschaffung) verdoppelt, und ein Ungehobelter Charakter kann niemals Soziale Fertigkeitsgruppen erlernen. Ungehobelte Charaktere gelten bei Sozialen Fertigkeiten, die sie nicht mindestens auf Stufe 1 besitzen, als Ahnungslos (s. Kasten Fertigkeitsstufen, S. 131). Der Spielleiter kann von einem solchen Charakter auch Proben in sozialen Situationen verlangen, die normalen Charakteren keine Schwierigkeiten machen. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.uneducated.desc=Ein Ungebildeter Charakter ist nicht dumm - er hatte nur niemals Gelegenheit zum Lernen. Das kann daran liegen, dass er und seine Familie isolierte Squatter, Unterprivilegierte oder SINlos waren. Jedenfalls hatte der Charakter keinen Zugang zu Bildung. Er kann nur eingeschränkt lesen, schreiben und rechnen. Charaktere mit dem Nachteil Ungebildet gelten bei Technischen Fertigkeiten sowie Akademischen und Berufswissensfertigkeiten, die sie nicht besitzen, als Ahnungslos (s. Kasten Fertigkeitsstufen, S. 131) und können bei diesen Fertigkeiten nicht improvisieren. Der Spielleiter kann auch Erfolgsproben bei Aufgaben verlangen, die normalen Sprawlbewohnern selbstverständlich erscheinen. Außerdem verdoppeln sich die Karmakosten für das Erlernen oder Verbessern von Fertigkeiten dieser Kategorien (auch bei der Charaktererschaffung), und es ist gut möglich, dass der Charakter niemals Fertigkeitsgruppen erlernen kann, die zu diesen Fertigkeitskategorien gehören. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.unsteady_hands.desc=Ein Charakter mit Händezittern hat einen leichten Tremor, der die Fingerfertigkeit und Geschicklichkeit seiner Hände beeinträchtigt. Er erhält auf alle Proben, die mit Geschicklichkeit verbunden sind, einen Würfelpoolmodifikator von -2, wenn die Symptome auftreten. Die Ursache könnte körperlich (unbehandelte Gendefekte oder Nervenschädigungen), ein Trauma oder einfach das Alter sein. Bestimmte Medikamente können diese Symptome unter normalen Umständen kaschieren. Wenn es bei einem Run aber zu belastenden Situationen kommt, kann es sein, dass die Symptome dann wieder auftreten. Der Charakter muss nach einer belastenden Erfahrung (wie etwa einem Kampf) eine Probe auf Geschicklichkeit + Konstitution (4) ablegen. Wenn er die Probe schafft, leidet er (vorerst) nicht unter den Symptomen. Bei einem Scheitern leidet der Charakter bis zum Ende des Runs unter dem Händezittern und dem Malus.
quality.weak_immune_system.desc=Ein Charakter mit Schwachem Immunsystem widersteht Infektionen und Krankheiten schlechter. Erhöhen Sie die Kraft von Krankheiten für die Widerstandsprobe um +2. Ein Charakter mit Schwachem Immunsystem kann die Vorteile Natürliche Immunität sowie Pathogen- und Toxinresistenz nicht erwerben. Ein Schwaches Immunsystem ist oft die Folge einer Behandlung mit Immunsuppressiva bei einer Implantation, also kann man mit Recht annehmen, dass Charaktere mit starken Körpermodifikationen diesen Nachteil eher haben. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.

complexform.cleaner.desc=Illegale Handlungen hinterlassen in der Matrix Spuren, aber die Resonanz kann einige davon löschen. Dafür wird eine Erfolgsprobe auf Software + Resonanz [Stufe] abgelegt. Jeder Erfolg reduziert den Overwatch-Wert des Ziels um 1.
complexform.diffusion_of_attack.desc=Der Technomancer legt eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Wenn die Probegelingt, wird das betroffene Attribut des Ziels um die Anzahl der Nettoerfolge gesenkt. Man kann ein Attribut damit nicht unter 1 senken.
complexform.diffusion_of_sleaze.desc=Der Technomancer legt eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Wenn die Probegelingt, wird das betroffene Attribut des Ziels um die Anzahl der Nettoerfolge gesenkt. Man kann ein Attribut damit nicht unter 1 senken.
complexform.diffusion_of_dataprocessing.desc=Der Technomancer legt eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Wenn die Probegelingt, wird das betroffene Attribut des Ziels um die Anzahl der Nettoerfolge gesenkt. Man kann ein Attribut damit nicht unter 1 senken.
complexform.diffusion_of_firewall.desc=Der Technomancer legt eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Wenn die Probegelingt, wird das betroffene Attribut des Ziels um die Anzahl der Nettoerfolge gesenkt. Man kann ein Attribut damit nicht unter 1 senken.
complexform.editor.desc=Der Technomancer leitet lange genug Resonanz in eine Datei, um ihren Inhalt zu manipulieren. Dafür legt er eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Intuition + Datenverarbeitung des Besitzers der Datei ab. Er kann mit seinen Nettoerfolgen dieselben Änderungen vornehmen wie bei der Handlung Datei Editieren.
complexform.infusion_of_attack.desc=Die Resonanz fl ießt in das Zielgerät und erhöht das betroffene Attribut. Die Stufe der Komplexen Form muss mindestens so hoch sein wie das Zielattribut. Der Technomancer legt eine Probe auf Software + Resonanz [Stufe] ab. Das Attribut wird pro Erfolg um einen Punkt erhöht, bis maximal zum Doppelten des normalen Attributs. Überzählige Erfolge verfallen. Jedes Attribut kann gleichzeitig nur von einer Steigerung betroffen sein.\nWenn das betroffene Attribut durch ein Umkonfigurieren des Decks vertauscht wird, endet die Komplexe Form sofort.
complexform.infusion_of_sleaze.desc=Die Resonanz fl ießt in das Zielgerät und erhöht das betroffene Attribut. Die Stufe der Komplexen Form muss mindestens so hoch sein wie das Zielattribut. Der Technomancer legt eine Probe auf Software + Resonanz [Stufe] ab. Das Attribut wird pro Erfolg um einen Punkt erhöht, bis maximal zum Doppelten des normalen Attributs. Überzählige Erfolge verfallen. Jedes Attribut kann gleichzeitig nur von einer Steigerung betroffen sein.\nWenn das betroffene Attribut durch ein Umkonfigurieren des Decks vertauscht wird, endet die Komplexe Form sofort.
complexform.infusion_of_dataprocessing.desc=Die Resonanz fl ießt in das Zielgerät und erhöht das betroffene Attribut. Die Stufe der Komplexen Form muss mindestens so hoch sein wie das Zielattribut. Der Technomancer legt eine Probe auf Software + Resonanz [Stufe] ab. Das Attribut wird pro Erfolg um einen Punkt erhöht, bis maximal zum Doppelten des normalen Attributs. Überzählige Erfolge verfallen. Jedes Attribut kann gleichzeitig nur von einer Steigerung betroffen sein.\nWenn das betroffene Attribut durch ein Umkonfigurieren des Decks vertauscht wird, endet die Komplexe Form sofort.
complexform.infusion_of_firewall.desc=Die Resonanz fl ießt in das Zielgerät und erhöht das betroffene Attribut. Die Stufe der Komplexen Form muss mindestens so hoch sein wie das Zielattribut. Der Technomancer legt eine Probe auf Software + Resonanz [Stufe] ab. Das Attribut wird pro Erfolg um einen Punkt erhöht, bis maximal zum Doppelten des normalen Attributs. Überzählige Erfolge verfallen. Jedes Attribut kann gleichzeitig nur von einer Steigerung betroffen sein.\nWenn das betroffene Attribut durch ein Umkonfigurieren des Decks vertauscht wird, endet die Komplexe Form sofort.
complexform.pulse_storm.desc=Der Technomancer zieht Signale aus der Resonanz und umgibt das Ziel damit. Dafür ist eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Logik + Datenverarbeitung des Ziels erforderlich. Jeder Nettoerfolg erhöht das Rauschen des Ziels um 1.
complexform.puppeteer.desc=Der Technomancer überflutet das Ziel mit Resonanzbefehlen, wodurch es eine Matrixhandlung durchführen muss. Dafür wählt er ein Ziel und eine Matrixhandlung aus und legt dann eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Der Schwellenwert hängt von der Handlung ab: 1 für eine Freie Handlung, 2 für eine Einfache Handlung, 3 für eine Komplexe Handlung. Wenn die Probe gelingt, muss das Ziel als nächste Handlung die verlangte Matrixhandlung durchführen.
complexform.resonance_channel.desc=Statt über die Matrix kommuniziert der Technomancer durch einen Resonanzkanal. Dafür legt er eine Erfolgsprobe auf Software + Resonanz [Stufe] ab. Jeder Erfolg reduziert das Rauschen wegen Entfernung zum Ziel um 1.
complexform.resonance_spike.desc=Der Technomancer sendet einen Stachel aus destruktiver Resonanz gegen das Ziel, der Fehler und Schaden verursacht. Dafür legt er eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Willenskraft + Firewall ab. Für jeden Nettoerfolg erleidet das Ziel 1 Kästchen Matrixschaden, dem nicht widerstanden werden kann.
complexform.resonance_veil.desc=Diese Komplexe Form gaukelt dem Ziel einen Vorgang in der Matrix vor. Wenn der Technomancer bei einer Vergleichenden Probe auf Software + Resonanz [Stufe] gegen Intuition + Datenverarbeitung gewinnt, entsteht eine glaubwürdige Illusion. Selbst wenn das Ziel gute Gründe hat, sie nicht für real zu halten, muss es eine Matrixwahrnehmungsprobe mit einem Schwellenwert gleich den Nettoerfolgen des Technomancers ablegen, um sie zu durchschauen.
complexform.static_bomb.desc=Der Technomancer legt eine Vergleichende Probe auf Software + Resonanz [Stufe] gegen Intuition + Datenverarbeitung gegen alle Icons ab, die ihn entdeckt haben. Wenn es mehr als ein solches Icon gibt, widerstehen diese separat. Der Technomancer selbst braucht nur eine Probe abzulegen, deren Ergebnis mit den Ergebnissen der gegnerischen Icons verglichen wird. Jedes Icon, das der Technomancer besiegt, verliert seine Spur, und er wird davon nicht mehr entdeckt. Jedes Icon, das eine Marke auf ihm platziert hat, verliert seine Spur natürlich nicht.
complexform.static_veil.desc=Die Resonanz wabert um das Ziel herum und verbirgt es vor der GOD. Der Technomancer legt eine Erfolgsprobe auf Software + Resonanz [Stufe] ab. Der Schwellenwert beträgt 1, wenn sich das Ziel auf dem öffentlichen Gitter befindet, und 2 bei jedem anderen Gitter. Solange die Komplexe Form aufrechterhalten wird und das Ziel nicht das Gitter wechselt, steigt der Overwatch-Wert der Persona nicht durch die verstrichene Zeit (siehe S. 228). Durch illegale Handlungen des Ziels kann er aber immer noch steigen.
complexform.stitches.desc=Der Technomancer näht das Resonanzgewebe eines Sprites wieder zusammen. Dafür legt er eine Erfolgsprobe auf Software + Resonanz [Stufe] ab. Jeder Erfolg heilt bei dem Sprite 1 Kästchen Matrixschaden.
complexform.transcendent_grid.desc=Der Technomancer verbreitert seine Verbindung zur Matrix und verbindet sich mit allen Gittern gleichzeitig. Er erhält keinen Malus für gitterübergreifende Handlungen (da er sich auf allen Gittern gleichzeitig befi ndet), aber auch Gegner, die ihn als Ziel nehmen, erhalten keine. Er erhält auch durch die Benutzung des öffentlichen Gitters keinen Malus. Der Technomancer legt eine Erfolgsprobe auf Software + Resonanz [Stufe] ab. Die Wirkung der Komplexen Form hält für (Erfolge) Minuten an. Danach endet die Komplexe Form.
complexform.tattletale.desc=Die Resonanz kann auch die verräterischen Signale illegaler Aktivitäten in der Matrix nachahmen \u2013 sehr zum Leidwesen des Ziels dieser Komplexen Form. Der Technomancer legt eine Erfolgsprobe auf Software + Resonanz [Stufe] ab. Jeder Erfolg erhöht den Overwatch-Wert des Ziels um 1.\nDas funktioniert aber nur, wenn das Ziel bereits einen Overwatch-Wert hat.

program.browse.desc=Diese praktische Suchmaschine halbiert den Grundzeitraum für die Handlung Matrixsuche.
program.configurator.desc=Wenn der Charakter dieses Programm laufen lässt, wählt er eine Konfi guration für sein Deck aus, die sich von der gerade eingesetzten unterscheidet. Diese alternative Konfi guration wird vom Programm gespeichert. Beim nächsten Mal, wenn der Charakter sein Deck umkonfi guriert, kann er diese alternative Konfi guration auswählen, statt nur zwei Attribute oder Programme zu vertauschen, selbst wenn das bedeutet, dass das Programm Konfi gurator dadurch beendet wird. Die gespeicherte Konfi guration wird dadurch nicht verändert; er kann sie später erneut aufrufen, sofern das Programm Konfi gurator läuft.
program.edit.desc=Dieses Programm hat ein smartes Interface, das sich dem Stil des Charakters anpasst und ihm sogar Vorschläge machen kann, und macht dadurch das Editieren von Dateien leichter. Das Limit Datenverarbeitung des Charakters steigt um 2 für alle Editierenproben, die er ablegt, solange das Programm läuft.
program.encryption.desc=Dieses Programm verleiht dem Charakter einen Bonus von +1 auf sein Firewallattribut.
program.signal_scrub.desc=Dieses Programm analysiert Hintergrundrauschen und eingehende Signale und verleiht dem Charakter dadurch Rauschunterdrückung 2.
program.toolbox.desc=Dieses Programm zur Speicherverwaltung verleiht dem Charakter einen Bonus von +1 auf das Attribut Datenverarbeitung.
program.virtual_machine.desc=Dieses Programm schafft einen virtuellen Speicher im Deck des Charakters, was mehr Programme gleichzeitig laufen lässt, aber die Systemstabilität beeinträchtigt. Der Charakter kann zwei Programme mehr auf seinem Deck laufen lassen. Allerdings erleidet seine Persona jedes Mal, wenn sie Matrixschaden erhält, 1 Kästchen Matrixschaden zusätzlich (dem nicht widerstanden werden kann).

program.armor.desc=Dieses Programm wirkt zusammen mit der Firmware des Charakters als zweite Firewall. Der Charakter erhält einen Würfelpoolbonus von +2 für den Widerstand gegen Matrixschaden.
program.baby_monitor.desc=Dieses Programm basiert auf Algorithmen, die der Grid Overwatch Division gestohlen wurden. Es verfolgt die Aktivitäten des Charakters in der Matrix und sorgt dafür, dass er jederzeit seinen aktuellen Overwatch-Wert kennt.
program.biofeedback.desc=Wenn der Charakter angreift, versieht dieses Programm seine Angriffe gegen andere Icons mit gefährlichen Biofeedback-Signalen, wie sie von Schwarzem IC und den G-Men benutzt werden. Dieses Programm funktioniert nur gegen biologische Ziele (wie zum Beispiel Sicherheitsspinnen). Wenn der Angriff des Charakters erfolgreich Matrixschaden verursacht, wird das Ziel von derselben Menge an Geistigem (bei kaltem Sim) oder Körperlichem (bei heißem Sim) Schaden durch Biofeedback getroffen. Auch der Matrixschaden durch misslungene Angriffshandlungen gegen den Charakter wird beim Angreifer um Biofeedback-Schaden vermehrt. Schaden durch Biofeedback wird mit Willenskraft + Firewall widerstanden.
program.biofeedback_filter.desc=Dieses Programm dient als eine Art Firewall für das Sim-Modul und gewährt dem Charakter einen Würfelpoolbonus von +2 zum Widerstand gegen Schaden durch Biofeedback.
program.blackout.desc=Das ist die nettere Version des Programms Biofeedback. Es funktioniert genauso, verursacht aber (auch bei heißem Sim) nur Geistigen Schaden durch Biofeedback.
program.decryption.desc=Diese Analyse-Algorithmen verleihen dem Charakter einen Bonus von +1 auf das Attribut Angriff.
program.defuse.desc=Dieses Programm errichtet Barrieren zwischen dem Charakter und einer Datenbombe, wodurch er einen Würfelpoolbonus von +4 zum Widerstand gegen den Schaden durch Datenbomben erhält.
program.demolition.desc=Dieses Programm unterstützt die Programmierung von Datenbomben. Die Datenbomben des Charakters erhalten eine um 1 höhere Stufe, wenn er sie legt, solange das Programm läuft.
program.exploit.desc=Dieses Programm sucht und analysiert die Schwächen von Firewalls. Der Charakter erhält einen Bonus von +2 auf das Attribut Schleicher, wenn er die Handlung Eiliges Hacken durchführt.
program.fork.desc=Der Charakter kann mit diesem Programm eine einzelne Matrixhandlung gegen zwei Ziele gleichzeitig durchführen. Er legt nur eine Probe ab, die von allen Modifikatoren der beiden Ziele kumulativ beeinfl usst wird. Jedes Ziel verteidigt sich mit seinem eigenen Würfelpool. Die Auswirkungen der Handlung des Charakters werden für jedes Ziel separat bestimmt.
program.guard.desc=Dieses Programm sucht nach Schwachstellen des Charakters, um diese zu schützen. Er erleidet weniger zusätzlichen Schaden durch Marken des Angreifers (-1 pro Marke).
program.hammer.desc=Immer wenn der Charakter mit einer Handlung Matrixschaden verursacht, erhöht ihn dieses Offensivprogramm um +2. Das betrifft aber nicht den Matrixschaden, den Angreifer durch gescheiterte Angriffshandlungen erleiden.
program.lockdown.desc=Wenn der Charakter an einer Persona Schaden verursacht, wird diese Persona mit einer Linksperre belegt, bis er das Programm beendet oder sich der Gegner erfolgreich ausstöpselt.
program.mugger.desc=Dieses Programm verfolgt die Marken des Charakters aktiv und erhöht den zusätzlichen Schaden um +1 pro Marke.
program.shell.desc=Dieses Programm verleiht dem Charakter mit seinen Filter-Algorithmen einen Würfelpoolbonus von +1 zum Widerstand gegen Matrixschaden und Schaden durch Biofeedback. Dieser Bonus wirkt mit ähnlichen Boni anderer Programme kumulativ.
program.sneak.desc=Dieses Programm schickt den Matrixverkehr des Charakters über komplizierte Routen, wodurch er einen Würfelpoolbonus von +2 zur Verteidigung gegen die Handlung Icon Aufspüren erhält. Außerdem erfährt ein Halbgott, wenn er auf den Charakter fokussiert, seinen physischen Standort nicht, obwohl der Charakter immer noch von allen anderen Auswirkungen der Fokussierung getroffen wird.
program.stealth.desc=Dieses schlaue Programm verleiht dem Charakter einen Bonus von +1 auf das Attribut Schleicher.
program.track.desc=Dieses Programm späht die Ziele des Charakters für ihn aus und macht es leichter, sie in der physischen Welt zu fi nden. Der Charakter erhält einen Bonus von +2 auf Datenverarbeitung bei der Handlung Icon Aufspüren. Wenn sein Gegner das Programm Tarnkappe laufen hat, heben die beiden Wirkungen einander einfach auf. Das Programm hat in diesem Fall keine weitere Wirkung.
program.wrapper.desc=Dieses Programm überbrückt die Matrixprotokolle für Icons. Während es läuft, kann das Icon des Charakters durch die Handlung Icon Verändern beliebig gestaltet werden. In der Matrix könnte ein Hammer-Programm wie eine Musikdatei aussehen, eine Ares Predator wie ein Credstick und die Persona des Charakters wie ein Mitsubishi Nightsky. Andere Personas können die verwandelten Icons als das erkennen, was sie sind. Dazu muss diese Persona aber zumindest einen Verdacht haben, der es rechtfertigt, die dazugehörige Matrixwahrnehmungsprobe (S. 239) abzulegen.

item.combat_axe.desc=Ein zweihändiges Monster aus einer Wolframlegierung, mit einer oder zwei Klingen. Eine gehärtete Stoßspitze kann, mit einer Sprungfeder versehen, im Griff verborgen werden. Die Kampfaxt scheint vielleicht barbarisch oder primitiv, aber mit den Körpermodifi kationen des Jahres 2075 ist sie in den richtigen Händen tödlicher als eine Feuerwaffe. Also los, auf ins Mittelalter.
item.combat_knife.desc=Ein langes Kampfmesser im Stil des KABARs mit einer geschwärzten Klinge, das so konstruiert ist, dass man damit leicht Panzerung durchstoßen kann.
item.forearm_snap_blades.desc=Dies sind im Grunde Sporne, nur dass sie extern sind \u2013 schmerzlos anzubringen und zu entfernen. Eine Unterarmscheide verbirgt drei Klingen, die per WiFi-Verbindung oder durch spezielle Muskelbewegungen aus- und eingefahren werden können.
item.katana.desc=Das legendäre zweihändige Schwert der Samurai. Das Katana ist nicht nur zum Synonym für Straßensamurais, sondern sogar für Shadowrunner im Allgemeinen geworden, zumindest in den Trids: Jeder hat dort ein Katana, vom Decker bis zum Magier. Aber nur weil diese Waffe ein blödes Klischee ist, macht sie das nicht weniger gefährlich oder weniger hilfreich in einem Kampf.
item.knife.desc=Das normale Allzweckschneidwerkzeug. Messer gibt es in einer verwirrenden Vielzahl von Stilen, Farben und Formen, aber die Spielwerte ändern sich dadurch nicht. Normale Messer werden von den Armen und Verzweifelten benutzt \u2013 oder von den Vorsichtigen als Reservewaffe.
item.pole_arm.desc=Dies ist im Grunde nur eine Klinge am Ende eines sehr langen Stabes. Sie hat gewöhnlich einen Axtkopf, eine Gleve, eine Speerspitze oder ein ähnliches Verstümmelungsinstrument. Stangenwaffen sind nicht einfach zu handhaben und praktisch unmöglich zu verbergen, aber sie sind sowohl bei Trollen als auch bei Nahkämpfern beliebt, die besagte Trolle auf mehr als Armlänge entfernt halten wollen.
item.survival_knife.desc=Eine hochwertige Klinge \u2013 gerade auf der einen Klingenseite, gezahnt auf der anderen \u2013 mit mehreren Zubehörteilen, einschließlich einem GPS, einem Multitool im Miniaturformat, einem Mikrofeuerzeug und einem verborgenen Fach im Griff. Die Seiten der Klinge sind mit einer ungiftigen Chemikalie behandelt, die die Klinge im inerten Zustand schwärzt, um unerwünschte Lichtbrechungen zu vermeiden, aber aktiviert werden kann, um für zwei Stunden phosphoreszierendes Licht zu erzeugen. Alle Messer können Fleisch schneiden, aber ein Überlebensmesser ist besser darin, Seil und Holz zu schneiden oder anders als Werkzeug eingesetzt zu werden. Das Überlebensmesser ist die Art von Spielzeug, das jeder Profi braucht.
item.sword.desc=Es ist scharf, es ist schwer, und es schneidet einen verdammt weit auf. Diese einhändige Klinge ist in vielen verschiedenen Stilen (Wakizashi, Sax, Scimitar, Jian, Machete und so weiter) erhältlich und vielleicht nicht so beeindruckend wie ein Katana, aber etwas besser zu verstecken.
item.club.desc=Die Waffe, nach der die Fertigkeit benannt wurde. Ihre Spielwerte stehen für eine Reihe von Gegenständen, wie etwa Axtgriffe, Baseballschläger, Schraubenschlüssel, Brechstangen, Montiereisen oder Latten mit rostigen Nägeln darin. Ein Preis ist ebenfalls angegeben, aber es nicht besonders schwer, kostenlos einen Knüppel zu finden, wenn man weiß, wo man suchen muss.
item.extendable_baton.desc=Dieser ausfahrbare Knüppel kann zusammengeschoben und mit einer Handgelenkbewegung oder einem WiFi-Signal ausgefahren werden. Im eingezogenen Zustand ist er leichter zu verbergen (Tarnmodifikator 0 im zusammengeschobenen, +2 im ausgefahrenen Zustand).
item.sap.desc=Dies ist ein kleiner, federnder Knüppel oder ein fl aches Stück Eisen in einem fl exiblen Lederüberzug. Er ist speziell auf gute Tarnbarkeit ausgerichtet (Tarnmodifi kator -2).
item.staff.desc=Dieser große, schwere Stock ist bei Zauberern beliebt, die auf den traditionellen Look stehen. Erhältlich als Kompositstab, aus Hartholz, Stahl und anderen Materialien.
item.stun_baton.desc=Eine Standard-Aufruhrbekämpfungswaffe, die als das Werkzeug und Symbol der Konzern- und Regierungsunterdrücker gilt, aber auch für Runner nützlich ist. Er hat zehn Ladungen und lädt sich mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden wieder auf, wenn er am Stromnetz hängt.
item.telescope_staff.desc=Dies ist ein Metall- und Kompositstab, der auf eine vernünftige Größe zusammengeschoben werden kann, sodass man ihn so leicht wie einen Betäubungsschlagstock oder ein Schwert verbergen kann. Er kann ausgefahren und eingerastet werden, indem man ihn mit der richtigen Geschwindigkeit und im richtigen Winkel herumwirbelt oder ihn per WiFi-Befehl auslöst.
item.knucks.desc=Dies können traditionelle Faustwaffen wie klassische Schlagringe oder aber moderne \u201EHardliner-Handschuhe\u201D sein, die entlang der Knöchel und Handkante mit einer dünnen Schicht Densiplast versehen sind. Auf jeden Fall verstärken sie die Auswirkungen eines Schlagsdeutlich und machen ihn potenziell tödlich. Angriffe mit Schlagringen werden mit der Fertigkeit Waffenloser Kampf durchgeführt.
item.monofilament_whip.desc=Furchteinflößend. Tödlich. Kultig. Nur wenige Waffen werden auf der Straße mehr gefürchtet. Diese Monofi lamentschnur kann durch Knochen und Panzerung wie ein heißes Messer durch Butter schneiden. Die Schnur ist zwei Meter lang und zieht sich in den Griff der Waffe zurück, wenn sie nicht benutzt wird. Der Peitschenschwung, die beschwerte Spitze der Schnur und der tödliche Monofilamentfaden, aus dem die Schnur besteht, machen das Führen dieser Waffe für den Benutzer nicht ganz ungefährlich. Bei einem Patzer verfängt sich die beschwerte Spitze in etwas in der Nähe und muss entwirrt werden, bevor man einen weiteren vernünftigen Angriff mit der Peitsche durchführen kann. Bei einem Kritischen Patzer trifft man sich selbst mit der Peitsche und erleidet ihren Grundschaden (dem normal widerstanden wird).
item.shock_gloves.desc=Diese elektrisch isolierten Handschuhe besitzen ein Drahtgefl echt, das bei einem Schlag oder einer einfachen Berührung eine elektrische Entladung verursacht. Die Handschuhe verursachen Elektrizitätsschaden (S. 173) und sind für zehn Entladungen gut, bevor sie wieder aufgeladen werden müssen (mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden). Angriffe mit Schockhandschuhen werden mit der Fertigkeit Waffenloser Kampf durchgeführt. Beim Angriff mit Schockhandschuhen muss man sich entscheiden, ob man den Elektrizitätsschaden oder normalen waffenlosen Schaden verursachen will.
item.bow1.desc=Dies kann ein traditioneller Langbogen aus Fiberglas oder Holz oder auch ein moderner Compoundbogen sein. Beide sind archaische und seltene Waffen auf den Straßen des Jahres 2075, und beide haben den Vorteil, dass sie hackingsicher sind. Einen neuen Pfeil in einen Bogen einzulegen erfordert eine Einfache Handlung Waffe Bereitmachen.\nBögen haben eine Stufe, die die Mindeststärke angibt, die erforderlich ist, um den jeweiligen Bogen zu benutzen. Ein Charakter, der mit einem Bogen schießt, dessen Stufe höher ist als seine Stärke, erleidet pro Punkt, den seine Stärke kleiner ist als die Stufe des Bogens, einen Würfelpoolmodifikator von -3. Dieser Malus spiegelt die Schwierigkeiten wider, die der Charakter beim Spannen des Bogens und Einlegen des Pfeils hat. Die Stufe des Bogens wird außerdem für die Berechnung seiner Reichweite und seines Schadens herangezogen (die maximale Stufe beträgt 10). (Siehe GRW 426)
