item.nagelmesser(einziehbar)EinbauCybergliedmass.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nNagelmesser sind zwei bis drei Zentimeter lange Klingen aus verchromten Stahl oder Carbonfaser. Sie schießen entweder unter den Fingernägeln hervor oder ersetzen sie vollständig.
item.cyberhand/-fuss,Offensichtlich.desc=Offensichtliche Cybergliedmaße sind sofort als künstlich erkennbar, solange sie nicht von Kleidung bedeckt sind. Sie sind häufig verchromt oder in matten Farben gehalten, aber offensichtlich mechanisch. Einige Leute mögen sie so offensichtlich und ausgefallen wie möglich, andere finden die Künstlichkeit abstoßend und verstörend. In einigen Kreisen können sie die sozialen Beziehungen beeinflussen, besonders in den höheren Kreisen des Gesellschaft und bei Puristen.
item.handklinge(einziehbar)FuerNatuerlicheGliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nHandklingen klappen aus der Handseite gegenüber dem Daumen parallel zur Hand heraus. Sie sind immer dünn und scharf, aber es gibt sie in einer Vielzahl von Formen und Designs.
item.cybertorso,Synthetisch.desc=Synthetische Cybergliedmaßen sind als natürliche Gliedmaßen getarnt. Für die Entdeckung, dass sie kybernetisch sind, haben sie einen Tarnmodifikator von -8, wenn jemand nur hinschaut; aber auch synthetische Gliedmaßen sind offensichtlich künstlich, wenn man sie berührt.
item.schockhandFuerNatuerlicheGliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nEine Schockhand ist wie ein Schockhandschuh, der in die Handfläche eingebaut ist \u2013 perfekt, um allem einen fiesen Schlag zu versetzen, das damit in Berührung kommt. Eine Schockhand verursacht Elektrizitätsschaden (GRW S. 173) und hat zehn Ladungen. Wenn sie an eine Stromquelle angeschlossen wird, lädt sie sich mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden wieder auf.
item.handklinge(einziehbar)EinbauCybergliedmass.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nHandklingen klappen aus der Handseite gegenüber dem Daumen parallel zur Hand heraus. Sie sind immer dünn und scharf, aber es gibt sie in einer Vielzahl von Formen und Designs.
item.cyberarm,Ganz,Synthetisch.desc=Synthetische Cybergliedmaßen sind als natürliche Gliedmaßen getarnt. Für die Entdeckung, dass sie kybernetisch sind, haben sie einen Tarnmodifikator von -8, wenn jemand nur hinschaut; aber auch synthetische Gliedmaßen sind offensichtlich künstlich, wenn man sie berührt.
item.cyberbein,Ganz,Offensichtlich.desc=Offensichtliche Cybergliedmaße sind sofort als künstlich erkennbar, solange sie nicht von Kleidung bedeckt sind. Sie sind häufig verchromt oder in matten Farben gehalten, aber offensichtlich mechanisch. Einige Leute mögen sie so offensichtlich und ausgefallen wie möglich, andere finden die Künstlichkeit abstoßend und verstörend. In einigen Kreisen können sie die sozialen Beziehungen beeinflussen, besonders in den höheren Kreisen des Gesellschaft und bei Puristen.
item.sporn(einziehbar)FuerNatuerlicheGliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nSporne bestehen aus einer bis drei Klingen, die bis zu 30 Zentimeter lang sind und aus dem Handrücken oder zwischen den Knöcheln hervorschießen.


adeptpower.adrenaline_boost.desc            = Diese Kraft ermöglicht dem Adepten, einmal in einer Kampfrunde mehr zu tun. Er erhält für die aktuelle Kampfrunde pro Stufe dieser Kraft nach Aktivierung +2 auf sein Initiativeergebnis. Zu Beginn der Kampfrunde nach Aktivierung des Adrenalinschubs muss er einem Entzug in Höhe der Stufe der Kraft widerstehen.
adeptpower.astral_perception.desc           = Diese Kraft erlaubt es dem Adepten, die Trennung zwischen physischer Welt und Astralraum zu überwinden und astral wahrzunehmen. Dadurch wird er für die Dauer der Wirkung der Kraft zu einem Dualwesen und kann astrale Gestalten angreifen (und von ihnen angegriffen werden). Es gelten die normalen Regeln für astrale Wahrnehmung (S. 312).
adeptpower.attribute_boost.desc             = Der Adept greift auf seine innere Stärke zurück, um erstaunliche körperliche Leistungen zu vollbringen. Diese Kraft muss für ein bestimmtes Körperliches Attribut (Konstitution, Geschicklichkeit, Stärke oder Reaktion) erworben werden. Man darf die Kraft mehrmals für jeweils ein anderes Attribut erwerben. Diese Kraft kann nicht für Geistige oder Spezialattribute erworben werden.
adeptpower.combat_sense.desc                = Kampfsinn verleiht dem Adepten ein instinktives Gespür für alle potenziellen Bedrohungen in der Nähe. Für Verteidigungsproben gegen Fern- und Nahkampfangriffe erhält er pro Stufe in Kampfsinn einen Würfelpoolbonus von +1. Adepten mit dieser Kraft dürfen vor einer möglichen \u00DCberraschungssituation immer eine Wahrnehmungsprobe ablegen und haben den Vorteil, schon alarmiert zu sein, wenn die Probe gelingt.
adeptpower.critical_strike.desc             = Diese Kraft verbessert eine bestimmte Nahkampffertigkeit: entweder Waffenlosen Kampf, Knüppel, Klingenwaffen, Astralkampf oder eine spezielle Fertigkeit Exotische Nahkampfwaffe. Die Fertigkeit muss beim Erwerb der Kraft ausgewählt werden. Angriffe mit der gewählten Fähigkeit haben einen um +1 erhöhten Schadenscode. Kritischer Schlag ist mit Waffen und anderen Adeptenkräften kompatibel. Die Kraft kann mehrmals \u2013 für jeweils eine andere Nahkampffertigkeit \u2013 erworben werden.
adeptpower.danger_sense.desc                = Der Adept erfasst instinktiv seine Umgebung und erkennt Bedrohungen, die vielleicht nicht gleich sichtbar sind. Das ist das ungute Gefühl, das einen Charakter vor einer Falle zögern lässt, der Bauchinstinkt, der ihn gerade noch rechtzeitig beiseite springen lässt. Pro Stufe in dieser Kraft erhält der Adept einen Würfelpoolbonus von +1 auf \u00DCberraschungsproben.
adeptpower.enhanced_accuracy.desc           = Eine Waffe in der Hand des Adepten wird zur natürlichen Verlängerung seines Körpers. Beim Kauf der Kraft muss eine Kampffertigkeit (Pistolen, Schwere Waffen, Knüppel usw.) ausgewählt werden. Bei der Benutzung dieser Fertigkeit steigt die Präzision der Waffe um 1. Diese Kraft kann nicht für Waffenlosen Kampf erworben werden, aber sie kann mehrmals \u2013 für jeweils eine andere Kampffertigkeit \u2013 erworben werden.
adeptpower.enhanced_perception.desc         = Diese Kraft schärft alle Sinne des Adepten. Er erhält pro Stufe der Kraft bei allen Wahrnehmungs- und Askennenproben einen Würfelpoolbonus von +1.
adeptpower.improved_ability.desc            = Diese Kraft erhöht die Stufe einer bestimmten Kampf-, Körperlichen, Sozialen, Technischen oder Fahrzeugfertigkeit um ihre Stufe. Der Adept muss die Fertigkeit besitzen, um diese Kraft dafür zu erwerben. Die Kraft kann nicht für Fertigkeitsgruppen erworben werden. Die Fertigkeit darf durch diese Kraft maximal auf eine Stufe von [aktuelle Stufe x 1,5] (aufgerundet) erhöht werden.
adeptpower.improved_physical_attribute.desc = Diese Kraft erhöht eines der Körperlichen Attribute des Adepten (Konstitution, Stärke, Geschicklichkeit, Reaktion) um ihre Stufe. Das Attribut wird verstärkt, also kann sich dadurch auch das Körperliche Limit des Adepten erhöhen. Diese Kraft erlaubt es, das natürliche Attributsmaximum zu überschreiten, wobei auch hier die Gesamterhöhung eines Attributs aus allen Verstärkungen nicht höher als +4 sein kann.
adeptpower.improved_potential.desc          = Diese Kraft erlaubt es dem Adepten, eines seiner Charakterlimits (Körperliches, Geistiges oder Soziales Limit) pro Stufe der Kraft um 1 zu erhöhen. Das Limit muss beim Erwerb der Kraft ausgewählt werden. Die Kraft kann mehrmals \u2013 für jeweils ein anderes Charakterlimit \u2013 erworben werden.
adeptpower.improved_reflexes.desc           = Diese Kraft erhöht die Reaktionsfähigkeit eines Adepten wie Refl exbooster. Pro Stufe erhält der Adept +1 auf Reaktion (was auch die Initiative beeinfl usst) und +1W6 Initiativewürfel. Die höchste Stufe für Gesteigerte Refl exe ist 3, und die Erhöhung der Initiative und Reaktion ist nicht mit anderen technologischen und magischen Erhöhungen der Initiative kompatibel.
adeptpower.improved_sense.desc              = Diese Kraft verleiht dem Adepten eine Sinneswahrnehmung, die sein Metatyp normalerweise nicht hat. Diese Verbesserungen können Restlichtverstärkung oder Infrarotsicht, Ultra- oder Infraschallgehör und so weiter sein. Alle Sinnesverbesserungen, die Bioware oder Cyberware bieten können, können durch diese Kraft erlangt werden, solange sie keine Boni auf Wahrnehmungsproben ergeben oder nur durch WiFi funktionieren. Außerdem stehen neben den Verbesserungen, die unter Cyber- und Bioware angegeben sind, noch zusätzliche Möglichkeiten zur Verfügung: s. GRW 309
adeptpower.killing_hands.desc               = Diese Kraft verleiht den waffenlosen Angriffen des Adepten tödliche Wucht. Der Adept kann wählen, ob er im Waffenlosen Kampf Geistigen oder Körperlichen Schaden anrichten will. Die Todeskralle kann mit anderen Adeptenkräften kombiniert werden, die den Schaden im Waffenlosen Kampf erhöhen. Die Todeskralle ist magisch, also kann sie die magische Verteidigung einer Kreatur \u2013 wie etwa die Kraft Immunität gegen Normale Waffen \u2013 umgehen. Adepten, die die Kraft Astrale Wahrnehmung haben, können die Todeskralle im Astralkampf einsetzen.
adeptpower.kinesics.desc                    = Diese Kraft verleiht dem Adepten völlige Kontrolle über die nonverbalen Signale, die sein Körper, selbst in angespannten Situationen, aussendet. Das umfasst die Mimik, Bewegungen, Augenbewegungen, Puls- und Blutdruckschwankungen, sogar die Transpiration. Dadurch wird es schwierig, die Gemütslage und die Aufrichtigkeit des Adepten einzuschätzen. Der Adept erhält pro Stufe in dieser Kraft einen Würfelpoolbonus von +1 auf den Widerstand gegen Soziale und andere Proben, um seine Emotionen zu lesen, wie etwa Menschenkenntnis oder Askennen.
adeptpower.light_body.desc                  = Diese Kraft erlaubt es dem Adepten, unglaubliche Sprünge zu vollführen. Er kann bei der Berechnung seiner maximalen Sprungdistanz die Stufe der Kraft zu seiner Geschicklichkeit addieren. Außerdem erhält er pro Stufe der Kraft einen Würfelpoolbonus von +1 für die Akrobatikprobe, wenn er springt. Wenn er fällt, kann er die Fallhöhe für die Berechnung des Schadens um die Stufe der Kraft in Metern verringern.
adeptpower.missile_parry.desc               = Der Adept kann langsame Projektile wie Granaten, Pfeile, Wurfmesser oder Shuriken aus der Luft fangen. Diese Kraft verleiht dem Adepten einen Würfelpoolbonus von +1 pro Stufe der Kraft auf seinen Würfelpool zur Verteidigung gegen solche Fernkampfangriffe. Wenn er Nettoerfolge erzielt, kann er das Geschoss aus der Luft pfl ücken. Der Einsatz von Geschossparade erfordert mindestens eine freie Hand.
adeptpower.mystic_armor.desc                = Diese Kraft schützt den Adepten vor körperlichen Angriffen. Er erhält pro Stufe der Kraft 1 Punkt Panzerung (die kumulativ zu anderer Panzerung wirkt, aber nicht für die Panzerungsbehinderung einberechnet wird), die auch vor Schaden im Astralkampf schützt.
adeptpower.natural_immunity.desc            = Der Adept erhält pro Stufe der Kraft einen Würfelpoolbonus von +1 Bonus für den Widerstand gegen Toxine und Krankheiten.
adeptpower.pain_resistance.desc             = Diese Kraft erlaubt es dem Adepten, die Auswirkungen von Verletzungen zu ignorieren (senkt aber nicht den eigentlichen Schaden). Pro Stufe dieser Kraft kann der Adept bei der Berechnung von Verletzungsmodifi katoren 1 Kästchen ignorieren. Der Modifi kator von -1 würde bei Schmerzresistenz 1 also erst bei 4 statt der üblichen 3 Kästchen gelten. Wenn der Adept diese Kraft auf Stufe 2 besitzt, erhält er erst bei 5 Schadenskästchen den Modifi kator. Schmerzresistenz wirkt sowohl auf dem Geistigen als auch dem Körperlichen Schadensmonitor. Außerdem kann man mit dieser Kraft auch dem Schmerz durch Folter, Magie, Krankheit und so weiter widerstehen. Jede Stufe addiert +2 Würfel zu Proben des Adepten, um Schmerz zu widerstehen.
adeptpower.rapid_healing.desc               = Der Adept erholt sich durch seine Magie schneller von erlittenem Schaden. Er erhält pro Stufe der Kraft einen Würfelpoolbonus von +1 auf Genesungsproben. Außerdem darf er sich (oder einem anderen Charakter, der ihn heilt) für Proben auf magische oder mundane Heilung (wie etwa einen Zauber Heilen oder mit Erster Hilfe) einen Würfelpoolbonus von +1 pro Stufe der Kraft verleihen.
adeptpower.spell_resistance.desc            = Der Adept ist gegenüber Zaubersprüchen besonders widerstandfähig. Er erhält pro Stufe der Kraft einen Würfelpoolbonus von +1 bei Widerstandsproben gegen Zauber, Alchemische Erzeugnisse, Zauberrituale oder die Kraft Natürlicher Zauberspruch von Crittern (nicht aber gegen andere Critterkräfte). Magieresistenz wirkt nicht gegen Zauber, denen der Adept nicht widerstehen will.
adeptpower.traceless_walk.desc              = Der Adept kann sich über Oberfl ächen \u2013 sogar über Schnee, Sand oder dünnes Papier \u2013 bewegen, ohne sichtbare Spuren zu hinterlassen. Er erzeugt beim Kontakt mit der Oberfl äche kein Geräusch (kann aber indirekt andere Gegenstände dazu bringen, Geräusche zu machen). Jede Wahrnehmungsprobe, um den Adepten zu hören, erleidet einen Würfelpoolmodifi kator von -4. Der Adept löst keine Vibrations- oder Drucksensoren aus. Er kann zwar nicht über Flüssigkeiten gehen \u2013 schließlich ist er nur ein Adept, er kann keine Wunder vollbringen \u2013, aber er kann über Schnee gehen, ohne einzusinken. Der Adept kann durch nichtvisuelle Eindrücke wie etwa Geruch verfolgt werden, aber selbst solche Proben sind schwieriger und erhalten einen Würfelpoolmodifi kator von -2
adeptpower.voice_control.desc               = Der Adept hat eine erstaunliche Kontrolle über seine Stimme. Er kann die Lautstärke, Tonhöhe, Modulation und Phrasierung seiner Stimme nach Belieben verändern. Er kann seine Stimme verstellen und Geräusche innerhalb des metamenschlichen Hörbereichs (kein Infra- oder Ultraschall) oder anderer Leute Stimmen nachahmen. Wenn er damit eine Person oder ein Stimmerkennungssystem reinlegen will, ist dafür eine Vergleichende Probe auf Verkörperung + Charisma [Sozial] gegen die Gerätestufe x 2 oder gegen Wahrnehmung + Intuition [Geistig] der Person erforderlich. Für diese Probe erhält er einen Würfelpoolbonus in Höhe seiner Stufe in dieser Kraft. \nDer Adept kann außerdem seine Stimme anpassen, um positive soziale Auswirkungen zu erzielen, was ihm pro Stufe in dieser Kraft einen Bonus von +1 auf sein Soziales Limit verschafft.
adeptpower.wall_running.desc                = Der Adept kann über eine begrenzte Distanz glatte Wände oder andere vertikale Oberfl ächen hinaufl aufen. Dafür legt er eine Probe auf Laufen + Stärke [Magie] ab. Die Erfolge ergeben die Höhe in Metern, die er innerhalb einer Handlungsphase hinaufl aufen kann. Wenn er noch höher laufen will, braucht der Adept Tritte, Vorsprünge oder eine andere Möglichkeit zum Anhalten, um die Kraft erneut zu aktivieren. Wenn er eine vertikale Oberfläche entlang- statt hinauflaufen will, kann er das tun, indem er diese Kraft mit einer Komplexen Handlung Sprinten (S. 169) kombiniert. Am Ende seiner Bewegung fällt der Adept \u2013 wenn er sich nicht festhalten kann \u2013 von der Mauer, egal ob er sein Ziel erreicht hat oder nicht.

attribute.agility.desc             = Geschicklichkeit misst Merkmale wie Hand-Auge-Koordination, Gelenkigkeit, Schnelligkeit und Gleichgewichtssinn. Für das Erzielen von Treffern im Kampf ist Geschicklichkeit das wichtigste Attribut, denn man braucht ein wenig Koordination, um zu treffen \u2013 sowohl beim Schwingen eines Schwerts als auch beim Schießen mit einem Gewehr. Auch außerhalb des Kampfes ist Geschicklichkeit wichtig, wenn man etwa an Wachen vorbeischleichen oder eine Magnetkarte unauffällig von ihrem sicheren Aufbewahrungsort entfernen will.
attribute.body.desc                = Konstitution gibt die körperliche Gesundheit und Widerstandsfähigkeit an. Sie zeigt an, wie viel Schaden Ihr Charakter einstecken kann, wie gut er Schaden widerstehen kann, wie schnell er sich von Giften und Krankheiten erholt und \u00C4hnliches.
attribute.charisma.desc            = Charisma ist die Kraft der Persönlichkeit \u2013 die \u00DCberzeugungskraft und der Charme, mit denen Ihr Charakter Leute dazu bringt, zu tun, was er will, ohne dass er dazu eine Waffe ziehen muss. Es geht dabei nicht nur um gutes Aussehen, aber auch nicht ganz ohne Schönheit. Vor allem geht es darum, wie man sich das zunutze macht, was man hat: Stimme, Gesicht, Worte und all die anderen Kommunikationswerkzeuge. Und darum, die Leute, die man trifft, für sich zu gewinnen oder einzuschüchtern. Außerdem ist Charisma für Schamanen das Attribut, mit dem sie dem Entzug beim Zaubern widerstehen.
attribute.composure.desc           = Manche Situationen stellen sogar die Selbstbeherrschung erfahrener Runner auf die Probe. Wenn ein Charakter einer emotional überwältigenden Situation gegenübersteht, gibt es nur zwei Möglichkeiten: sich dem Kampf stellen oder zu einem zitternden Nervenbündel werden. Um herauszufi nden, was davon geschieht, legen Sie eine Probe auf Willenskraft + Charisma mit einem Schwellenwert je nach Stärke der Bedrohung ab. Wenn dieselbe Situation immer wieder vorkommt, kann man sich unter Umständen daran gewöhnen und keine Proben mehr brauchen. Auge in Auge einer Gruppe schwer bewaffneter Ganger gegenüberzustehen, mag furchteinfl ößend sein. Aber wenn ein Charakter das oft genug erlebt, wird die Angst geringer.
attribute.edge.desc                = Edge ist das Unberechenbare, das Etwas, das Ihrem Charakter beisteht, wenn er es braucht, das ihm aus der Klemme hilft, wenn es hart auf hart kommt. Edge fl ießt nicht in Würfelpools ein. Man gibt es stattdessen aus, um einen bestimmten Effekt zu erzeugen. Jeder Charakter hat mindestens einen Punkt Edge, kann aber auch mehr Punkte haben, wenn er die Vorteile dieses Attributs öfter nutzen will. Genaueres zu Edge und seinen Auswirkungen finden Sie in GRW S. 58.
attribute.essence.desc             = Essenz ist Metamenschlichkeit in Zahlen gegossen. Bei Shadowrun gibt es viele Möglichkeiten, seinen Körper zu verändern und über seine normalen Fähigkeiten hinaus zu entwickeln. So etwas hat aber oft seinen Preis und kann dazu führen, dass man einen Teil seiner Metamenschlichkeit verliert, was sich im Verlust von Essenzpunkten ausdrückt. Jeder Charakter beginnt mit einem Essenzwert von 6, der als Grenze der möglichen Veränderungen dient. Wenn die Essenz weg ist, kommt sie nicht mehr zurück (und wenn sie auf 0 sinkt, ist man tot). Außerdem beeinfl usst die Essenz das Magie- bzw. das Resonanzattribut: Essenzverluste führen zu Magie- bzw. Resonanzverlusten.
attribute.initiative_astral.desc   = Die Initiative regelt, wie schnell ein Charakter in Kampfsituationen reagiert.
attribute.initiative_matrix.desc   = Die Initiative regelt, wie schnell ein Charakter in Kampfsituationen reagiert.
attribute.initiative_physical.desc = Die Initiative regelt, wie schnell ein Charakter in Kampfsituationen reagiert.
attribute.intuition.desc           = Intuition ist das Bauchgefühl, der Instinkt, der Ihrem Charakter Dinge mitteilt, bevor sein logisches Gehirn sie erkennen kann. Intuition lässt ihn Hinterhalte vorausahnen, erkennen, dass etwas falsch ist, und jemandem, den er verfolgt, auf den Fersen bleiben.
attribute.judge_intentions.desc    = Das Einschätzen anderer Personen ist auch eine Instinktfrage. Ein Charakter kann seinem Instinkt folgen, wenn er abschätzen will, wie vertrauenswürdig jemand ist oder was er vorhat. Dafür wird eine Vergleichende Probe mit Intuition + Charisma gegen Willenskraft + Charisma des Ziels abgelegt. Das ist aber keine exakte Wissenschaft. Eine erfolgreiche Probe führt nicht dazu, dass das Ziel Sie nie verraten wird (schließlich können sich Einstellungen ändern). Und wer gut lügen kann, fi ndet leicht Vertrauen. Diese Probe vermittelt nur ein Bauchgefühl für die Vertrauenswürdigkeit einer anderen Person.
attribute.lift_carry.desc          = Ein Charakter kann ohne Probe 15 Kilogramm pro Stärkepunkt heben. Was darüber hinausgeht, erfordert eine Probe auf Konstitution + Stärke. Jeder Erfolg erhöht die maximale Hebeleistung um 15 Kilogramm. Das Gewicht (wie beim Gewichtheben) über den Kopf zu heben, ist schwieriger. Ein Charakter kann ohne Probe 5 Kilogramm pro Stärkepunkt über den Kopf heben. Jeder Erfolg bei der Probe auf Konstitution + Stärke erhöht dieses Maximum um 5 Kilogramm.\nEin Gewicht zu tragen ist etwas anderes, als es zu heben. Charaktere können Stärke x 10 Kilogramm mühelos tragen.
attribute.limit_astral.desc        = Wenn man sich im Astralraum umtun will, braucht man einen starken Geist, denn mehr wird man nach dem Verlassen des Körpers nicht haben. Der Geist ist zugleich Werkzeug und Limit im Astralraum. Das Astrale Limit ist gleich dem Geistigen oder Sozialen Limit \u2013 je nachdem, welches höher ist.
attribute.limit_mental.desc        = Ihr Charakter hat drei Charakterlimits \u2013 Körperliches Limit, Geistiges Limit und Soziales Limit \u2013, die von seinen Attributen (S. 53) abhängen. Diese Limits bilden ab, wie viel er aus seinem Körper, seinem Geist und seinem Charme herausholen kann (Elfen werden vielleicht davon enttäuscht sein, dass ihr Charme doch nicht grenzenlos ist).\nRegeltechnisch sagen Ihnen die Limits, wie viele der Erfolge Ihres Würfelwurfs Sie werten dürfen, um den Ausgang einer Probe zu bestimmen. Wenn Sie mehr Erfolge erzielen, als Ihr Limit beträgt, können Sie maximal Erfolge in Höhe Ihres Limits werten. Alle \u201Eüberzähligen\u201C Erfolge gehen verloren.
attribute.limit_physical.desc      = Ihr Charakter hat drei Charakterlimits \u2013 Körperliches Limit, Geistiges Limit und Soziales Limit \u2013, die von seinen Attributen (S. 53) abhängen. Diese Limits bilden ab, wie viel er aus seinem Körper, seinem Geist und seinem Charme herausholen kann (Elfen werden vielleicht davon enttäuscht sein, dass ihr Charme doch nicht grenzenlos ist).\nRegeltechnisch sagen Ihnen die Limits, wie viele der Erfolge Ihres Würfelwurfs Sie werten dürfen, um den Ausgang einer Probe zu bestimmen. Wenn Sie mehr Erfolge erzielen, als Ihr Limit beträgt, können Sie maximal Erfolge in Höhe Ihres Limits werten. Alle \u201Eüberzähligen\u201C Erfolge gehen verloren.
attribute.limit_social.desc        = Ihr Charakter hat drei Charakterlimits \u2013 Körperliches Limit, Geistiges Limit und Soziales Limit \u2013, die von seinen Attributen (S. 53) abhängen. Diese Limits bilden ab, wie viel er aus seinem Körper, seinem Geist und seinem Charme herausholen kann (Elfen werden vielleicht davon enttäuscht sein, dass ihr Charme doch nicht grenzenlos ist).\nRegeltechnisch sagen Ihnen die Limits, wie viele der Erfolge Ihres Würfelwurfs Sie werten dürfen, um den Ausgang einer Probe zu bestimmen. Wenn Sie mehr Erfolge erzielen, als Ihr Limit beträgt, können Sie maximal Erfolge in Höhe Ihres Limits werten. Alle \u201Eüberzähligen\u201C Erfolge gehen verloren.
attribute.logic.desc               = Logik misst die kalte, berechnende Kraft des rationalen Geistes Ihres Charakters. Wenn er komplizierte Maschinen reparieren oder ein verletztes Teammitglied versorgen will, hilft ihm Logik, zu einem sinnvollen Ergebnis zu kommen. Mit dem Attribut Logik widerstehen hermetische Magier außerdem dem Entzug, den sie erleiden, wenn sie ihre hilflosen Opfer mit Zaubersprüchen eindecken. Auch Decker profitieren stark von Logik, wenn sie die Angriffe und Gegenangriffe durchführen, die Teil ihrer Online-Schlachten sind.
attribute.magic.desc               = Wenn Sie zaubern oder auf andere Weise mit Magie umgehen wollen, muss Ihr Charakter das Magieattribut besitzen. Die meisten Leute haben dieses Attribut nicht. Magier, die Zauber wirken, und Adepten, die Magie kanalisieren und damit ihre körperlichen und geistigen Fähigkeiten erhöhen, brauchen dieses Merkmal. Das Magieattribut misst, wie gut Ihr Charakter mit den arkanen Künsten umgehen und mit wie viel Kraft er seine Magie wirken kann.
attribute.memory.desc              = Es gibt alle möglichen Gedächtnisstützen und sogar ein paar Bioware-Implantate, die helfen können, etwas im Gedächtnis zu behalten, aber es gibt keine Fertigkeit dazu. Wenn ein Charakter sich an etwas erinnern muss, legt er eine Probe auf Willenskraft + Logik ab. Schwellenwerte dafür können Sie der Tabelle Schwellenwerte bei Wissensfertigkeiten (S. 150) entnehmen. Wenn ein Charakter aktiv versucht, sich etwas einzuprägen, lassen Sie ihn zu diesem Zeitpunkt eine Probe auf Willenskraft + Logik ablegen und notieren Sie das Ergebnis. Jeder Erfolg verschafft ihm auf eine spätere Erinnerungsprobe zum selben Thema 1 Bonuswürfel.
attribute.movement.desc            = Charaktere können sich in Shadowrun auf drei Arten bewegen: Gehen, Laufen und Sprinten.\nDie maximale Bewegungsrate eines Charakters gilt für eine gesamte Kampfrunde (also für alle Initiativedurchgänge zusammen, nicht pro Initiativedurchgang) und ist von seiner Laufrate abhängig, die durch den Metatyp vorgegeben wird. Die Gehrate gibt an, wie weit sich ein Charakter in einer Kampfrunde bewegen kann, ohne zu laufen.\n\u201ELaufen\u201C bedeutet aber nicht, so schnell zu rennen, wie man kann \u2013 das wäre Sprinten. Man muss sich das Laufen eher als kontrolliertes Joggen vorstellen, womit man schnell vorwärts kommt, aber noch andere Handlungen, wenn auch mit Malus, durchführen kann. Sprinten bedeutet hingegen, sich schnellstmöglich von A nach B zu bewegen.
attribute.notoriety.desc           = Der Schlechte Ruf ist die negative Seite der Reputation eines Charakters. Wenn jemand wenig umgänglich, stur oder unfähig ist, ganz entschieden einen an der Waffel hat oder vom Pech verfolgt wird, dann spricht sich das herum. Schlechter Ruf kann auch für Kaltherzigkeit, Unzuverlässigkeit oder eine andere Charakterschwäche stehen, die andere dazu veranlasst, einen großen Bogen um den Charakter zu machen. Jeder Charakter beginnt mit einem Schlechten Ruf von 0.
attribute.public_awareness.desc    = Die Prominenz gibt an, wie gut ein Charakter den Medien, den Behörden und der \u00D6ffentlichkeit bekannt ist. Mit einigen wenigen Ausnahmen geben sich Shadowrunner immer große Mühe, dass die \u00D6ffentlichkeit nicht weiß, wer sie sind oder was sie tun. Konzerne und andere Auftraggeber heuern Runner an, wenn sie etwas diskret erledigt haben wollen, ohne dass allzu viel davon an die \u00D6ffentlichkeit dringt. Wenn ein Runner also seinen Job macht, sollte im Idealfall niemand etwas davon mitbekommen. Der beste Shadowrunner ist einer, von dem Joe Lohnsklave noch nie gehört hat. Nur wenn etwas schiefgeht oder die Situation es unvermeidlich macht, werden die Aktionen von Runnern öffentlich bekannt.
attribute.reaction.desc            = Reaktion misst Refl exe, Aufmerksamkeit und die Fähigkeit des Charakters, auf Vorgänge in der Umgebung zu reagieren. Bei der Bestimmung, wann Charaktere im Kampf handeln dürfen oder wie gut sie den Angriffen ihrer Gegner ausweichen können, spielt die Reaktion eine wichtige Rolle. Sie hilft Ihrem Charakter auch, schnell aus einer engen Gasse abzubiegen und die heulenden Ganger hinter sich abzuhängen.
attribute.resonance.desc           = Resonanz ist, ähnlich wie Magie für Magier und Adepten, das Spezialattribut für Technomancer. Technomancer interagieren mit der Matrix durch Geisteskraft, und die Resonanz misst die Stärke und Fähigkeit, mit der sie diese Umgebung beeinflussen und verändern können (s. Technomancer, S. 246). Nicht-Technomancer haben dieses Attribut nicht.
attribute.street_cred.desc         = Der Straßenruf repräsentiert das, was ein Charakter in seinem Leben in den Schatten geleistet hat. Je mehr er geleistet und erreicht hat, desto mehr wird er von seinesgleichen respektiert. Der Straßenruf ist abhängig vom gesamten von einem Charakter verdienten Karma. Für jeweils 10 Karmapunkte, die der Charakter verdient hat, erhält er einen Punkt Straßenruf. Oder anders gesagt: Der Straßenruf entspricht dem Gesamtkarma des Charakters, geteilt durch 10 und abgerundet (wobei allerdings noch andere Faktoren eine Rolle spielen können, etwa das Opfern von Straßenruf, um Schlechten Ruf zu senken). Der Spielleiter kann nach eigenem Ermessen für besonders bemerkenswerte Leistungen zusätzliche Straßenrufpunkte vergeben. Der Straßenruf dient als positiver Limitmodifi kator bei allen Proben auf Soziale Fertigkeiten in Situationen, in denen die Reputation des Charakters bekannt ist.
attribute.strength.desc            = Stärke gibt einfach an, wie stark Ihr Charakter ist. Je höher die Stärke ist, desto mehr Schaden verursacht der Charakter im Nahkampf und desto mehr kann er bewegen und tragen, wenn Dinge bewegt werden müssen. Oder getragen werden müssen. Stärke ist auch für athletische Tätigkeiten wie Klettern, Laufen oder Schwimmen wichtig.
attribute.willpower.desc           = Willenskraft ist die Entschlossenheit Ihres Charakters, sich gegen Widerstände durchzusetzen, der Erschöpfung beim Zaubern zu widerstehen und auf den Beinen zu bleiben, nachdem er eins mit dem Totschläger übergezogen bekommen hat. Wenn er sich einer toxischen Wildnis oder einer Gruppe lederbekleideter Orks mit Brecheisen gegenüber sieht, wird ihm seine Willenskraft helfen.

item.Schadenskompensator.desc                  = Schadenskompensator: Schadenskompensatoren sind im Wesentlichen\nBlockadevorrichtungen in den Nervenbahnen, die Schmerzen vom Körper ans Gehirn\nmelden. Der Charakter ignoriert eine Anzahl von Schadenskästchen (nach Wahl\nKörperlich, Geistig oder eine Kombination der beiden) in Höhe der Stufe des\nKompensators, bevor Verletzungsmodifkatoren ermittelt werden.
item.Zerebralbooster.desc                      = Zerebralbooster: Die Hirnwindungen werden mit zusätzlichem Nervengewebe verstärkt,\ndas die Hirnfunktionen insgesamt verbessert. Der Zerebralbooster erhöht das\nLogikattribut des Charakters um seine Stufe.
item.adrenalinpumpe.desc                       = Diese verbesserte Drüse wird im Unterleib implantiert und mit beiden Nebennieren\nverbunden. Im Ruhezustand ist die Pumpe lediglich ein Adrenalinreservoir. Wenn sie\naktiviert wird, kontrahiert ein kleiner Muskelsack und sendet einen Stoß\nkonzentrierten Adrenalins in den Blutkreislauf. Körperlicher und emotionaler Stress\nkönnen die Pumpe unbewusst aktivieren, wenn eine Selbstbeherrschungsprobe\nmisslingt; ansonsten kann man sie mit einer Freien Handlung aktivieren. Während\ndie Pumpe aktiv ist, ignoriert der Charakter Verletzungsmodifikatoren und wird nicht\nbewusstlos, selbst wenn sein Geistiger Zustandsmonitor ausgefüllt ist. Er kann sich\nnicht ausruhen, aber die Stufe der Adrenalinpumpe wird zu seiner Stärke,\nGeschicklichkeit, Reaktion und Willenskraft addiert. Die Pumpe arbeitet für \nStufe x 1W6 Kampfrunden (und kann auch nicht vorzeitig abgeschaltet werden). \nWenn die Zeit um ist, bricht der Charakter zusammen und erleidet Geistigen\nSchaden in Höhe der Anzahl der Kampfrunden, in denen die Pumpe aktiv war\n(diesem Schaden wird mit der natürlichen Konstitution + Willenskraft widerstanden).\nWenn die Wirkung aufhört, kehren die Attributswerte des Charakters auf ihr\nnormales Niveau zurück,\nund er kann Verletzungsmodi katoren oder Bewusstlosigkeit\ndurch Geistigen Schaden nicht länger\nignorieren. Nach dem Gebrauch braucht die Pumpe\n1 Stunde, um ihren Vorrat wiederaufzufüllen. Während\ndieser Zeit kann sie nicht aktiviert werden.\uFFFD
item.alchemiefokus.desc                        = Ein Alchemiefokus addiert seine Kraftstufe als Würfelpoolbonus zu Alchemieproben.
item.airburst_link.desc						   = Dieses Smartgunzubehör für Granat- und Raketenwerfer verwendet einen \u201Esmarten\u201D Entfernungsmesser, um das Explosivprojektil an einem Punkt in der Luft explodieren zu lassen, der weit genug vom Benutzer des Werfers entfernt und möglichst nahe am Ziel ist. Eine Airburst-Verbindung senkt die Abweichung einer verschossenen Granate oder (Lenk-)Rakete um 2 Meter pro Erfolg statt um 1 Meter pro Erfolg (s. Abweichung bestimmen, S. 183), wenn der WiFi-Zünder verwendet wird.
item.antidot-patch.desc                        = Ein Antidot-Patch addiert seine Stufe zu jeder\nToxinwiderstandsprobe, die innerhalb von 20 Minuten\nabgelegt wird, nachdem das Patch appliziert wurde.\nDas Zeitfenster, um ein Antidot-Patch erfolgreich\nanzuwenden, ist je nach Toxin häufig sehr eng (s. \nToxine, S. 410).
item.antimagiefokus.desc                       = Zauberfoki verstärken Hexereifertigkeiten. Jeder Zauberfokus wird bei seiner Herstellung\n auf eine der fünf Zauber- bzw. Ritualkategorien eingestimmt und kann nicht mehr\n verändert werden.\n\nAntimagiefoki addieren ihre Kraftstufe als Würfelpoolbonus zu Proben für das Bannen\n von Zaubern, solange der zu bannende Zauber der Kategorie des Fokus entspricht. Außerdem\naddiert der Fokus seine Kraftstufe als Würfelpoolbonus zu Zauberwiderstandsproben gegen\nZauber, deren Kategorie der des Zaubers entspricht.
item.apds.desc                                 = APDS-Geschosse (Armor-piercing discarding sabot) sind militärische, panzerbrechende Geschosse, die für hohe Geschwindigkeit und das Durchschlagen von Körperpanzerung entwickelt wurden.
item.ares_alpha_grenade_launcher.desc		   = Der fest verbaute Unterlauf-Granatenwerfer des Sturmgewehrs Ares Alpha
item.aresDragon.desc                           = Dieser vielseitige, stabile zweirotorige Frachthelikopter wird in der ganzen sechsten\nWelt in st\u00C3\u00A4dtischer und l\u00C3\u00A4ndlicher Umgebung f\u00C3\u00BCr viele verschiedene Zwecke\neingesetzt. Er wird h\u00C3\u00A4ufig f\u00C3\u00BCr den Transport schwerer Frachten verwendet. Die\nFirewatch-Teams von Knight Errant setzen ihn gelegentlich auch als Kombination\naus Truppentransporter und Gunship ein.
item.aresDuelist.desc                          = Diese mittelgroßem, grob anthropomorphe\nLäuferdrohne wurde entwickelt, um auf ihren zwei\nFüßen wie ein metamenschlicher Wachposten zu\npatroullieren, und ihre Primärbewaffnung besteht aus\nKlingenarmen. Außerdem wurde sie so designt, dass\nihr \u00C4ußeres der traditionellen Oyoroi-Samurairüstung\nder Roten Samurai  von Renraku ähnelt - vielleicht als\nsubtiler Stich in Richtung eines konkurrierenden \nMegas. Als Nischenmodell das selten eingesetzt wird,\nhat der Duelist zwei entscheidende Vorteile: Erstens \nkann ihr humanoides Profil dazu führen, dass sie auf \ngewisse Entfernung für einen (vielseitigeren) \nmetamenschlichen Wachposten  gehalten wird, was\nsie in Einrichtungen nützlich macht, die nur von einer\nRumpfmannschaft betrieben werden. Zweitens sind\nihre Klingenarme angeblich etwas wirksamer gegen\nGeister als die gewöhnliche Drohenbewaffnung aus\nKanonen und noch mehr Kanonen. Diese Drohne ist\nmit einer einzigartigen  Zielerfassung-[Schwerter]-\nAutosoft der Stufe 3 sowie einem paar \nStandardschwerter in speziellen Waffenhalterungen\nausgestattet. (Die montierten Schwerter können nicht\ndurch andere Waffen ersetzt werden, aber zusätzliche\nWaffenhalterungen können gemäß der normalen\nRegeln installiert werden.) Diese Drohne wird mit der\nFertigkeit Läufer gesteuert.
item.aresRoadmaster.desc                       = Das ist ein verdammtes Panzerfahrzeug, Chummer, und du solltest dankbar sein, dass man es legal kaufen kann. Der Roadmaster wird legal genutzt, um Güter über Land zu befördern, die einen sicheren Transport benötigen. Er hat die Geschwindigkeit und Manövrierfähigkeit eines Panzers und ist auch ähnlich subtil, aber Kleinfeuerwaffen und sogar Granaten machen ihm nichts aus. Für viele Teams ist das ein lohnender Tausch.
item.aresVenture.desc                          = Diese kleine, billige Vektorhubmaschine wird aus Standardteilen in umweltfreundlichen\nWerken hergestellt und weltweit von Schmugglern eingesetzt. Abgesehen davon,\ndass er bei Schmugglern mit wenig Geld sehr beliebt ist, wird der Venture f\u00C3\u00BCr eine\nVielzahl von legitimen, Sicherheits- und milit\u00C3\u00A4rischen Zwecken eingesetzt. Er wird\nh\u00C3\u00A4ufig als Fracht- oder Passagiertransporter verwendet, und es gibt auch schwer\nbewaffnete und gepanzerte Varianten f\u00C3\u00BCr Patrouillenaufgaben. Der Venture verkauft\nsich gut bei Kunden aus der dritten Welt.
item.artemisNightwing.desc                     = Der Nightwing ist ein \u00C3\u00A4lteres Ultraleichtflugzeug, das den urspr\u00C3\u00BCnglichen Modellen von\nEnde des 20. Jahrhunderts stark \u00C3\u00A4hnelt. Er hat einen gekapselten Elektormotor, um\nGer\u00C3\u00A4usche und Hitzeemissionen zu reduzieren - das hat den beworbenen Zweck,\nL\u00C3\u00A4rmbel\u00C3\u00A4stigung und Umwelteinfl\u00C3\u00BCsse zu minimieren, macht das gleiter\u00C3\u00A4hnliche\nFlugzeug aber auch ziemlich schwer entdeckbar. Der Nightwing ist bei \nFlugenthusiasten in l\u00C3\u00A4ndlichen Gebieten, Schmugglern und allen, die ein klassisches\nheimliches Eindringen bevorzugen, beliebt.
item.assault_cannon.desc                       = Diese Munition kann nur in Sturmkanonen verwendet werden, und sie ist auch die einzige Munitionsart, die von Sturmkanonen verschossen werden kann.
item.atemschutzmaske.desc                      = Eine Atemschutzmaske ist eine Filtermaske, die über\nMund und Nase getragen wird und vor Toxinen mit\nInhalationsvektor schützt (s. Toxine, S. 410). Sie addiert\nihre Stufe zu Toxinwiderstandsproben gegen Toxine\nmit Inhalationsvektor.
sensorfunction.atmosphere_sensor.desc          = Wettervorhersagen sind (dank der Umweltverschmutzung, des Erwachens und anderer Faktoren) notorisch unglaubwürdig, aber Athosphärensensoren bewahren einen mit einersekundengenauen Analyse der Geschehnisse in der Luft um einen herum davor, von Regen überrascht\nzu werden.
item.audioverbesserung.desc                    = Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum von Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Audioverbesserung addiert ihre Stufe zum Limit bei Wahrnehmungsproben zum Hören.
item.audioverbesserung_acc.desc                    = Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum von Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Audioverbesserung addiert ihre Stufe zum Limit bei Wahrnehmungsproben zum Hören.
item.audioverbindung.desc                      = Die Audioverbindung, das Audioäquivalent zur Bildverbindung, kann Audio (Aufnahmen, Soundtracks, Musik usw.) aus Quellen innerhalb des PANs des Benutzers (oder aus der Datenbuchse)direkt in seine Cyberohren abspielen. Eine Audioverbindung ist eine häufige Komponente von umfassenden AR-Umgebungen und fügt eine Geräuschkomponente hinzu.
item.autmatischerDietrich.desc                 = Diese Sperrpistole ist eine schnelle und effektive Methode, um mechanische Schlösser zu umgehen. Die Stufe des Automatischen Dietrichs wird zum Limit des Charakters addiert, wenn er ein mechanisches Schloss knackt.
item.aztechnologyCrawler.desc                  = Diese kleine Krabblerdrohne kann Treppen und andere\nHindernisse ohne Probleme überwinden. Sie wurde als\nFernaufklärer für raues ländliches oder städtisches\nGelände entwickelt und ist deshalb effizient und\nrobust. Ihr Pilotprogramm ist besser als bei den meisten\nanderen Drohnen ihrer Klasse. Diese Drohne wird mit \nder Fertigkeit Läufer gesteuert.
item.balanceverstärker.desc               = Der Balanceverstärker verstärkt den natürlichen Gleichgewichtssinn des Innenohrs. Der Charakter erhält einen Würfelpoolbonus von +1 auf alle Proben, bei denen es um das Gleichgewicht geht, wie etwa Klettern, das Gehen über einen schmalen Steg, das Landen nach einem Sprung und so weiter.
sensorfunction.motion_sensor.desc              = Dieser Sensor verwendet eine Mischung aus Ultraschall und niedrigenergetischem Infrarot, um Bewegung und drastische Veränderung in der Umgebungstemperatur zu entdecken. Die maximale Reichweite beträgt 25 Meter.
item.bildverbindung.desc                       = Eine implantierte Version der Bildverbindung (GRW S. 448)\nEine Bildverbindung ist ein Standardupgrade und zeigt visuelle Informationen (Text, Bilder, Filme, die aktuelle Uhrzeit und so weiter) im eigenen Blickfeld an. Die sind gewöhnlich AROs, aber man kann praktisch alles darauf anzeigen, was man will.\nEin team kann die Bildverbindung nutzen, um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung, um die AR wirklich zu "sehen" und an der modernen Welt teilzuhaben.
item.bildverbindung_acc.desc                   = Dieses Standardupgrade zeigt visuelle Informationen (Text, Bilder, Filme, die aktuelle Uhrzeit und so weiter) im eigenen Blickfeld an. Dies sind gewöhnlich AROs, aber man kann praktisch alles darauf anzeigen, was man will.\nEin Team kann die Bildverbindung nutzen, um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung, um die AR wirklich zu \u201Esehen\u201D und an der modernen Welt teilzuhaben.
item.bindungsfokus.desc                        = Geisterfoki verstärken die Beschwörungsfertigkeit eines Zauberers. Jeder Geisterfokus\nwird bei seiner Herstellung auf eine Geisterart eingestimmt, die danach nicht mehr \nverändert werden kann.\n\nEin Bindungsfokus addiert seine Kraftstufe zu Würfelpoolbonus zu Bindenproben,\nsolange die Art des zu bindenden Geistes zum Fokus passt.
item.bipod.desc								   = Dieser zweibeinige Ständer befindet sich unter der Waffe, wodurch sie von nah am Boden abgefeuert werden kann, während der Schütze sich in einer liegenden oder sitzenden Haltung befi ndet. Ein Zweibein kann an der Unterlaufhalterung einer Waffe befestigt werden und gewährt 2 Punkte Rückstoßkompensation, wenn es ausgeklappt ist.\nDas Anbringen eines Zweibeins dauert eine Minute. Das Aufoder Zusammenklappen eines Zweibeins erfordert eine Einfache Handlung, das Abmontieren eine Komplexe Handlung.
item.bliss.desc                                = Dieses Opiat wird aus Mohnpfl anzen gewonnen. Bliss (\u201EGlückseligkeit\u201C) ist ein Beruhigungsmittel, das seinen Namen den Empfi ndungen verdankt, die der Anwender verspürt.\nEin Spieler, der einen Bliss-Konsumenten rollenspielerisch darstellen will, sollte sich auf den Weltflucht-Aspekt konzentrieren, da die Droge die chaotische und unbefriedigende Welt ausblendet.
item.brecheisen.desc                           = Ein Brecheisen verdoppelt die effektive Stärke eines\nCharakters, wenn er versucht, eine Tür oder einen\nBehälter aufzubrechen.
item.camouflageseil,100m.desc                  = Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische\nReaktion dazu,dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren \nhinterlässt.
item.camouflageseil.desc                       = Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische\nReaktion dazu,dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren \nhinterlässt.
item.cessnaC750.desc                           = Dieses zweimotorige Propellerflugzeug kann Passagiere und leichte Fracht \ntransportieren oder als Aufkl\u00C3\u00A4rungsflugzeug dienen. Sein geringes Gewicht und seine\nWirtschaftlichkeit, zusammen mit dem erschwinglichen Preis und der weiten\nVerbreitung, haben daf\u00C3\u00BCr gesorgt, dass es auch bei Schmuggeloperationen \nVerwendung findet.
item.chem-patch.desc                           = Dies ist ein leeres Slap-Patch. Man kann es mit einer \nDosis einer Chemikalie oder eines Toxins (S. 410)\nfüllen und es später bei einem Patienten (oder sich \nselbst) anwenden.
item.chemical_protection.desc				   = Wasserresistente, nichtporöse, undurchlässige Materialien und eine Beschichtung aus neutralisierenden Stoffen schützen den Träger gegen chemische Angriffe mit Kontaktvektor (s. Toxine, S. 410). Addieren Sie die Stufe der Chemischen Isolierung bei Proben, um Toxinangriffen mit Kontaktvektor zu widerstehen.
item.chemical_seal.desc						   =  Die Chemische Versiegelung ist nur für Ganzkörperpanzerungen erhältlich, zu denen ein Helm gehört, und besteht aus einer luftdichten Umweltsteuerung, die mit einer Komplexen Handlung aktiviert werden kann (wenn man bereits die Panzerung trägt). Sie bietet vollständigen Schutz gegen Chemikalien mit Kontakt- und Inhalationsvektor, kann aber (wegen des begrenzten Luftvorrats) maximal 1 Stunde am Stück verwendet werden.
item.chemoanzug.desc                           = Dieser undurchlässige Ganzkörperanzug wird über\nKleidung oder Panzerung getragen und gewährt\nChemische Isolierung (S. 441) in Höhe seiner Stufe.\nEr darf nicht mit einem kompletten Hazmat-Anzug\nverwechselt werden, da er nicht vakuumversiegelt ist.\nWenn ein Chemoanzug über chemikalienresistenter\nPanzerung getragen wird, kommt nur die höchste Stufe\nan Chemischer Isolierung zur Anwendung.
item.chrysler-nissanJackrabbit.desc            = Dieser billige, allgegenwärtige Elektrokleinwagen wurde jahrzehntelang in Nordamerika hergestellt.Selbst nachdem die nordamerikanische Produktion eingestellt worden war, wurden Dutzende von generischen Kopien in der ganzen Dritten Welt in Lizens produziert. Schon die bloße Anzahl von Jackrabbits auf den Straßen bedeutet, dass die Ersatzteilproduktion für das ältere Modell weitergehen muss.
item.concealable_holster.desc			       = Dieses kleine Holster kann am Fußknöchel, am Unterarm, im Kreuz oder sonst wo getragen werden, wo es unwahrscheinlich ist, dass man es entdeckt. Das Tarnholster addiert einen Modifi kator von -1 zum Tarnmodifi kator (S. 422) des Gegenstands. Nur Pistolen und Taser passen in ein Tarnholster.
item.cram.desc                                 = Cram ist ein sehr beliebtes Aufputschmittel. Wenn die Wirkung der Droge nachlässt, bricht der Benutzer zusammen und erleidet 6 Kästchen Geistigen Schaden, denen nicht widerstanden werden kann.\nCram-Konsumenten sind hyperwachsam bis hin zur Paranoia. Sie reagieren schnell, oft ohne zu denken, und neigen zu irrationalen Ausbrüchen. Weitere Nebenwirkungen sind Nervosität und Zappeligkeit.
item.cs_tear_gas.desc                          = CS-Gas ist ein Reizstoff, der sich auf Augen, Haut und Schleimhäute auswirkt und dazu führt, dass sie brennen und Flüssigkeit absondern. Zusätzlich ruft es eine körperliche Panikreaktion hervor: Herzrasen, Atemnot und \u00C4hnliches. Gründliches Waschen mit Wasser und Seife kann das CS-Gas von der Haut des Opfers entfernen und die Wirkung der \u00DCbelkeit vorzeitig beenden. CS-Gas wird innerhalb von 2 Minuten nach Luftkontakt wirkungslos.
item.cyberaugeStufe1.desc                      = Cyberaugen bieten volle Sehschärfe auf beiden Augen und sind serienmäßig mit einer Bildverbindung ausgestattet. Außerdem bieten sie Kapazitäten für die Aufnahme von Sichtverstärkungen.
item.cyberaugeStufe3.desc                      = Cyberaugen bieten volle Sehschärfe auf beiden Augen und sind serienmäßig mit einer Bildverbindung ausgestattet. Außerdem bieten sie Kapazitäten für die Aufnahme von Sichtverstärkungen.
item.cyberaugenStufe2.desc                     = Cyberaugen bieten volle Sehschärfe auf beiden Augen und sind serienmäßig mit einer Bildverbindung ausgestattet. Außerdem bieten sie Kapazitäten für die Aufnahme von Sichtverstärkungen.
item.cyberaugenStufe4.desc                     = Cyberaugen bieten volle Sehschärfe auf beiden Augen und sind serienmäßig mit einer Bildverbindung ausgestattet. Außerdem bieten sie Kapazitäten für die Aufnahme von Sichtverstärkungen.
item.cyberdeck.desc                            = Das ist einfach gesagt das im Körper eingebaute Cyberdeck.\nDie Kosten beziehen sich nur auf den Einbau, hinzu kommen noch die Kosten für das eigentliche Deck.\nDie Gerätestufe richtet sich nach dem ingebauten Deck.
item.cyberdeck_cybergliedmass.desc             = Das ist einfach gesagt das Deck, das in ein Cybergliedmaß eingebaut wurde.\nDie Kosten sind nur für den Einbau, hinzu kommen die Kosten für das eigentliche Deck.\nDie Gerätestufe richtet sich nach dem Deck.
item.cyberohrenStufe1.desc                     = Normalerweise ersetzen Cyberohren nur das Innenohr, obwohl zusätzlich auch die Ohrmuschel ersetzt werden kann, wenn man das möchte. Cyberohren bieten normales Gehör (wie ein Mikrofon), eine Audioverbindung und Kapazität für Midifikationen und Audioverstärkungen.
item.cyberohrenStufe2.desc                     = Normalerweise ersetzen Cyberohren nur das Innenohr, obwohl zusätzlich auch die Ohrmuschel ersetzt werden kann, wenn man das möchte. Cyberohren bieten normales Gehör (wie ein Mikrofon), eine Audioverbindung und Kapazität für Midifikationen und Audioverstärkungen.
item.cyberohrenStufe3.desc                     = Normalerweise ersetzen Cyberohren nur das Innenohr, obwohl zusätzlich auch die Ohrmuschel ersetzt werden kann, wenn man das möchte. Cyberohren bieten normales Gehör (wie ein Mikrofon), eine Audioverbindung und Kapazität für Midifikationen und Audioverstärkungen.
item.cyberohrenStufe4.desc                     = Normalerweise ersetzen Cyberohren nur das Innenohr, obwohl zusätzlich auch die Ohrmuschel ersetzt werden kann, wenn man das möchte. Cyberohren bieten normales Gehör (wie ein Mikrofon), eine Audioverbindung und Kapazität für Midifikationen und Audioverstärkungen.
item.cyberspaceDesignsDalmatian.desc           = Diese große und robuste VTOL-Aufklärungsdrohne\nkann auf der Stelle schweben und hat für ihr geringes\nGewicht einen stabilen Rahmen. Im eingeklappten\nZustand ist sie etwa so groß wie ein Rasenmäher, im \naktiven Zustand etwa so groß wie ein großer\nHängegleiter. Sowohl Lone Star als auch Knight Errant\nproduzieren das Design in Lizenz für urbane Aufklärung\nund Patrouillen. Diese Drohne wird mit der Fertigkeit\nFlugzeuge gesteuert.
item.cyberwareblocker.desc                     = Cyberwareblocker sind aus Metall (Panzerung 16,\nStruktur 2) und werden an den Handgelenken oder\nFußknöcheln eines Gefangenen befestigt, damit er \nsich nicht schneller als mit einem Schlurfen bewegt\nund keine Cyberimplantatwaffen ausfährt.
sensorfunction.cyberware_scanner.desc                     = Dieser Millimeterwellenscanner ist hauptsächlich für die Entdeckung von Cyberware gedacht, kann aber nauch andre Kontrabande entdecken. Die maximale Reichweite beträgt 15 Meter.
item.datenbuchse.desc                          = Eine Datenbuchse verleiht einem ein Direktes Neuralinterface (GRW S. 219), was in vielen Situationen hilfreich sein kann. Außerdem ist sie mit einer einziehbaren Spule Mikrokabel (etwa einen Meter lang) ausgestattet, mit der man sich über einen Unversal-Datenport direkt mit jedem elektronischen Gerät verbinden kann.Datenbuchsen sind mit ihrem eigenen Speicher ausgestattet, um Dateien herunterzuladen oder zu speichern.\nZwei Datenbuchsenbesitzer könnnen sich mit einem Datenkabel verbinden, um eine private mentale Unterhaltung zu führen, die nicht abgehört werden kann.
item.datenschloss.desc                         = Diese spezielle Datenbuchse ist bei Kurieren, Spionen, Diplomaten und Verbindungsleuten beliebt. Das Datenschloss verwandelt den Charakter praktisch in einen wandelnden Datensafe. Es hat eine Gerätestufe in Höhe seiner Stufe und schützt die Daten vor allen Unbefugten (möglicherweise sogar vor dem Träger des Datenschlosses).\nDatenschlösser sind nicht WiFi-fähig, auf die kann nur über den Universal-datenport zugegriffen werden. Tatsächlich hat auch der Träger des Implantats keinen mentalen Zugriff auf die Daten - er ist nur der \u00DCberbringer.
item.deepweed.desc                             = Deepweed ist ein Narkotikum, das von karibischen Houngans aus einer Erwachten Variante des Seetangs entwickelt wurde. Es ist sehr verführerisch für Erwachte und wird manchmal dazu verwendet, Opfer für Besessenheit vorzubereiten.\nDeepweed zwingt einen magisch aktiven Anwender, astral wahrzunehmen, selbst wenn er ein Adept ist, der die Fähigkeit der astralen Wahrnehmung eigentlich nicht besitzt. Wenn die Wirkung abgeklungen ist, erleidet der Benutzer für einen Zeitraum, der der Wirkungsdauer der Droge entspricht, einen Modifikator von -1 auf alle Würfelpools und -1 auf alle Limits.\nMit erzwungener astraler Wahrnehmung gehen einige Gefahren einher, unter anderem die Gefahr, unerwünschte Aufmerksamkeit auf sich zu ziehen. Rollenspielerisch können sich die Auswirkungen von Deepweed darin äußern, dass der Charakter nicht ganz \u201Eda\u201C zu sein scheint, was ja in gewissem Sinne auch stimmt.
item.dietrich-set.desc                         = Diese mechanischen Einbruchswerkzeuge sind in den\nletzten Jahrhunderten nur marginal verbessert worden.\nSie sind notwendig für das Knacken von mechanischen\nSchlössern.
item.dmso-gelpack.desc                         = Dies ist die Munition für die Ares S-III Super Squirt (S. 432). Jedes DMSO-Gelpack ist mit einer CO 2 - Treibladung versehen und kann eine Dosis eines Toxins oder einer anderen Substanz aufnehmen (die separat gekauft werden muss).
item.docwagon-vertrag,GoldProJahr.desc         = Gehen Sie ohne ihn nicht nach draußen! DocWagon bietet erstklassige medizinische\nNotfalldienste rund um die Uhr, und sie kommen zu Ihnen! Ein DocWagon-Vertrag\nerfordert die Abgabe eine Gewebeprobe (die in einem sicheren Tresorraum \naufbewahrt wird, der streng von Wachleuten, Spinnen und Magiern bewacht wird)\nund beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip\nimplantiert wird und aktiviert werden kann, um DocWagon zu alarmieren. Dieser\nVitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von\nDocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls\nalarmiert. Weitere Details, insbesondere zu Reanimationen, HTR-Teams und \nzusätzlichen Kosten im Fall des Einsatzes, finden Sie auf S. 454f.
item.docwagon-vertrag,PlatinProJahr.desc       = Gehen Sie ohne ihn nicht nach draußen! DocWagon bietet erstklassige medizinische\nNotfalldienste rund um die Uhr, und sie kommen zu Ihnen! Ein DocWagon-Vertrag\nerfordert die Abgabe eine Gewebeprobe (die in einem sicheren Tresorraum \naufbewahrt wird, der streng von Wachleuten, Spinnen und Magiern bewacht wird)\nund beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip\nimplantiert wird und aktiviert werden kann, um DocWagon zu alarmieren. Dieser\nVitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von\nDocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls\nalarmiert. Weitere Details, insbesondere zu Reanimationen, HTR-Teams und \nzusätzlichen Kosten im Fall des Einsatzes, finden Sie auf S. 454f.
item.docwagon-vertrag,StandardProJahr.desc     = Gehen Sie ohne ihn nicht nach draußen! DocWagon bietet erstklassige medizinische\nNotfalldienste rund um die Uhr, und sie kommen zu Ihnen! Ein DocWagon-Vertrag\nerfordert die Abgabe eine Gewebeprobe (die in einem sicheren Tresorraum \naufbewahrt wird, der streng von Wachleuten, Spinnen und Magiern bewacht wird)\nund beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip\nimplantiert wird und aktiviert werden kann, um DocWagon zu alarmieren. Dieser\nVitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von\nDocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls\nalarmiert. Weitere Details, insbesondere zu Reanimationen, HTR-Teams und \nzusätzlichen Kosten im Fall des Einsatzes, finden Sie auf S. 454f.
item.docwagon-vertrag,SuperplatinProJahr.desc  = Gehen Sie ohne ihn nicht nach draußen! DocWagon bietet erstklassige medizinische\nNotfalldienste rund um die Uhr, und sie kommen zu Ihnen! Ein DocWagon-Vertrag\nerfordert die Abgabe eine Gewebeprobe (die in einem sicheren Tresorraum \naufbewahrt wird, der streng von Wachleuten, Spinnen und Magiern bewacht wird)\nund beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip\nimplantiert wird und aktiviert werden kann, um DocWagon zu alarmieren. Dieser\nVitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von\nDocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls\nalarmiert. Weitere Details, insbesondere zu Reanimationen, HTR-Teams und \nzusätzlichen Kosten im Fall des Einsatzes, finden Sie auf S. 454f.
item.dodgeScoot.desc                           = Dies ist ein Elektroroller mit einer Höchstgeschwindigkeit von ... ach, lassen wir das. Er ist kompakt, sparsam und richtig preiswert, aber kein Shadowrunner, der etwas auf sich hält, würde sich damit blicken lassen.
item.dreamchip.desc                            = Dreamchips sind handelsübliche SimSinn-Aufzeichnungen, die so modifi ziert wurden, dass sie einen BTL-Output liefern. Das können aufgemotzte Studioproduktionen sein, aber auch private Hinterhofproduktionen, die einen sehr persönlichen und intimen Blick in das Leben eines Fremden bieten. Beliebte Themen sind Heldenfantasien, aufgezeichnete Verbrechen und Pornografi e, bis hin zu Hardcore-Gewaltpornos und Snuff-Chips für den ausgefalleneren Geschmack.
item.dämpfer.desc                         = Dieses Implantat schützt den Nutzer sowohl vor plötzlichen Lautstärkeanstiegen als auch vor schädigenden Geräuschpegeln. Der Dämpfer gewährt einen Würfelpoolbonus von +2 bei Widerstandsproben gegen Schallangriffe, einschließlich Schockgranaten.
item.einweg-spritze.desc                       = Spritzen bestehen aus Kunststoff mit einer Metallnadel\nund sind für den einmaligen Gebrauch gedacht. Sie \nkönnen verwendet werden, um Toxine mit \nInjektionsvektor zu verabreichen. Ein unkooperatives\nOpfer muss eventuell zuerst immobilisiert oder \nzumindest festgehalten werden.
item.enterhakenkanone.desc                     = Diese Kanone kann einen Enterhaken und ein daran befestigtes Seil verschießen und\nverwendet dafür die Reichweiten für leichte Armbrüste. Sie ist mit einer internen\nWinde ausgestattet, um den Haken zurückzuziehen (oder kleine Gewichte \nheraufziehen). Verwenden Sie die Fertigkeit Exotische Fernkampfwaffe, um damit\nzu schießen. Microwire kann bis zu 100 Kilogramm Gewicht tragen. Standard- und\nCamouflageseil bis zu 400 Kilogramm.
item.entzauberungsfokus.desc                   = Wenn ein Entzauberungsfokus mit einem zu entzaubernden Gegenstand in Kontakt gebracht wird, darf der Besitzer die Kraftstufe des Fokus als Würfelpoolbonus zur Entzaubernprobe addieren.
item.eurocarWestwind3000.desc                  = Dieser geschmeidige, klassische, tiefliegende Rennwagen ist eine perfekte Mischung aus Geschäft und Vergnügen. Er bedient sowohl das Luxus- als auch das Leistungssegment und bleibt für die meisten Leute, die sich in den Schatten hocharbeiten, ein Wunschtraum. Sein sexy Design und der leistungsstarke Motor sorgen dafür, dass er unter Muscle-Car-Fans gleichbleibend beliebt bleibt.
item.explosive_rounds.desc                     = Diese Kugeln enthalten eine Hohlladung, die beim Aufprall explodiert und zersplittert. Explosivmunition zündet bei einem Kritischen Patzer fehl. Wenn das passiert, muss der Schütze einem \u201EAngriff\u201D mit einem Schadenscode gleich dem normalen Schaden der Waffe widerstehen (natürlich modifi ziert durch den Modifi kator der Explosivmunition). Der eigentliche Angriff verfehlt sein Ziel, und die Waffe wird zerstört.
item.federated-boeingCommuter.desc             = Dieses Kippfl\u00C3\u00BCgel-Passagierflugzeug wird h\u00C3\u00A4ufig als Shuttle zwischen St\u00C3\u00A4dten \neingesetzt, wo es zwischen konzernkontrollierten Flugh\u00C3\u00A4fen verkehrt und Sararim\u00C3\u00A4nner\num die ganze Welt transportiert. Shadowrunner werden es wahrscheinlich nicht\nals eigene Ausr\u00C3\u00BCstung verwenden, aber vielleicht treffen sie mal auf eins, besonders\nwenn sie gerade einen Extraktions- oder Bewachungsjob haben.
item.flash-bang.desc                           = Diese \u201EBetäubungs\u201D-Granaten explodieren in einem blendend hellen Licht und mit einer lauten Druckwelle, die sich gleichmäßig über einen Radius von 10 Metern ausbreitet.
item.flash-pak.desc                            = Dies ist eigentlich keine Granate, sondern ein elektronisches Gerät von der Größe einer Zigarettenschachtel, das vier Quarz-Halogen-Blitzlichter enthält, die in einer zufälligen, stroboskopartigen Sequenz aufblitzen, um Gegner zu blenden. Jeder, der in die Richtung des Flash-Packs schaut, erleidet wegen der Blitze einen Würfelpoolmodifikator von -4 auf alle Angriffsproben (Sichtgeräte, Brillen und ähnliches mit Blitzkompensation senken den Modifikator auf -2, Blitzkompensation in Cyberaugen oder als Retina-modifikation senkt ihn auf -1). Das Flash-Pack hat 10 Ladungen; wenn es aktiviert wird, verbraucht es eine Ladung pro Kampfrunde. Am Stromnetz lädt es sich mit einer Ladung pro 10 Sekunden wieder auf.
item.fletchette_rounds.desc                    = Die Ladung von Flechettemunition besteht aus winzigen, dicht gepackten Metallsplittern. Diese Kugel fl iegt als Schrapnellhagel auf ihr Ziel zu. Flechettemunition ist vernichtend gegen ungeschützte Ziele, aber nicht so wirksam gegen gehärtete Panzerung.
item.fire_resistance.desc					   = Flammhemmende, nicht entzündliche Materialien schützen den Träger gegen Feuerschaden (S. 174). Addieren Sie die Stufe der Feuerresistenz zum Panzerungswert, wenn Feuerangriffen widerstanden oder geprüft wird, ob die Panzerung Feuer fängt.
item.fn_p93_flashlight.desc					   = Eine integrierte feste Schulterstütze sowie eine Lampe, die Dunkelheitsmodifi katoren um eine Stufe reduziert (s. Umweltmodifikatoren, S. 175).
item.fokusformelGeisterfokus.desc              = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
item.fokusformelKraftfokus.desc                = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
item.fokusformelMetamagiefokus.desc            = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
item.fokusformelQui-fokus.desc                 = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
item.fokusformelVerzauberungsfokus.desc        = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
