item.großerSchmuggelbehälter.desc=Dies ist eine größere Version des Schmuggelbehälters (GRW S. 461). Er kann Gegenstände bis zur Größe einer schweren Pistole oder einer kleinen MP (nach Maßgabe des Spielleiters - denken Sie bei der Größe einfach an eine Butterbrotdose) aufnehmen. Etwas herauszunehmen oder hereinzulegen erfordert eine Komplexe Handlung.
