item.ar_gloves.desc=AR-Handschuhe sind in zahlreichen Stilen erhältlich und erlauben die manuelle Interaktion mit der Matrix im AR-Modus, sodass man virtuelle AROs \u201Eberühren\u201D und \u201Ehalten\u201D kann und eine taktile Rückmeldung erhält. AR-Handschuhe können das genaue Gewicht, die Temperatur und die Härte der berührten oder gehaltenen Objekte zurückmelden (nach Maßgabe des Spielleiters auch noch mehr).
item.biometric_reader.desc=Manchmal will jemand online sichergehen, dass man auch wirklich derjenige ist, für den man sich ausgibt. Dieses in der Hand gehaltene Gerät kann für Fingerabdrücke, Retinascans, Stimmmuster, Zungenabdrücke und so ziemlich alles andere verwendet werden, was kein DNA-Scan ist. Ein Charakter kann es verwenden, um seine Elektronik so zu blockieren, dass nur er selbst (oder eines seiner Körperteile) sie entsperren kann.
item.electronic_paper.desc=Dieses elektronische Blatt, das man falten oder aufrollen kann, gibt es in Größen vom Notizzettel bis hin zum Poster. Es zeigt digital Bilder, Text, Daten oder Video an und kann als Touchscreen dienen. Elektronisches Papier ist WiFi-fähig und kann kabellos beschrieben oder gelöscht werden. Manchmal bedecken Hackergangs die Oberflächen von Gebäuden mit elektronischem Papier, sodass sie sie andauernd mit sich verändernden Graffi ti beschreiben können, die sogar von Leuten gesehen werden können, die ohne AR-Bildverbindung herumlaufen.
item.printer.desc=Wenn man mal etwas als Ausdruck braucht (zum Beispiel wenn Mr. Johnson einen durch ein Zeitportal angeheuert hat), dann gibt es diesen Farbdrucker, an den bereits ein Papierbehälter montiert ist.
item.satellite_link.desc=Damit kann sich der User mit Kommunikationssatelliten im niedrigen Orbit verbinden und von Orten aus mit der Matrix interagieren, an denen es kein WiFi-Netzwerk gibt (was selten, aber leider immer noch möglich ist). Zu dieser Verbindung gehört eine tragbare Satellitenschüssel. Die Verbindung beschränkt das Rauschen aufgrund von Entfernung auf maximal -5.
item.subvocal_mic.desc=Das Zweitbeste nach Telepathie ist die Fähigkeit, auf jede Entfernung zu fl üstern. Dieses schwer zu entdeckende Mikrofon wird mit einem Klebestreifen am Hals befestigt und erlaubt gemurmelte Kommunikation, die von anderen kaum zu hören ist. Wahrnehmungsproben, mit denen versucht wird, das Gesagte zu hören, erleiden einen Würfelpoolmodifi kator von -4.
item.trid_projector.desc=Dieses Gerät projiziert ein Trideohologramm in einen fünf Meter durchmessenden Würfel neben oder über dem Gerät. Das Hologramm kann ziemlich realistisch sein, aber wenn man damit nicht gerade sehr kunstvoll umgeht, ist es ziemlich offensichtlich, dass es nur Trideo ist.
item.trodes.desc=Dieses Netz aus Elektroden und Ultraschallsendern \u2013 erhältlich als Stirnband, Netz oder Kappe \u2013 verleiht dem Benutzer ein Direktes Neuralinterface (DNI). Immer nützlich, wenn man zu zimperlich ist, um sich für eine Datenbuchse ein Loch in den Kopf bohren zu lassen. Wenn man Troden in Helmen und ähnlichem installiert, verbrauchen sie 2 Punkte Kapazität.

