item.standard_tag.desc=Ein ganz einfacher RFID-Chip (S.444)
item.datachip.desc=Für Gelegenheiten, bei denen man Daten physisch übergeben will \u2013 zum Beispiel wenn man Mr. Johnson die Projektspezifi kationen des neuen Cyberdecks der Konkurrenz persönlich bei einem Treffen geben will \u2013, kann ein Datenchip enorme Datenmengen in einem Chip von der Größe eines kleinen Fingers enthalten, auf den man von jedem elektronischen Gerät aus zugreifen kann. Datenchips sind nicht WiFi-fähig, also muss man sie in einen Universal-Datenport (den jedes Gerät hat) stecken, wenn man sie lesen oder auf sie schreiben will.
item.security_tag.desc=Sicherheitsbewusste Megakons implantieren Sicherheits-RFID-Chips häufig in ihren Sararimännern und geschätzten Bürgern, entweder um die Produktivität des Angestellten am Arbeitsplatz zu überwachen, Genehmigungen und Sicherheitszugänge zu gewähren oder zu verweigern, oder Angestellte im Falle einer Entführung oder Extraktion (oder einer Flucht) aufzuspüren.\nDieselben Chips werden bei inhaftierten und auf Bewährung freigelassenen Kriminellen verwendet, und Eltern und Schulen nutzen sie auch, um Schüler aufzuspüren. Sicherheitschips sind gegen EMP geschützt und können deshalb nicht mit einem RFID-Löscher gelöscht werden. Wenn ein Chip unter der Haut implantiert wird, ist eine Ausgedehnte Probe auf Medizin + Logik [Geistig] (10, 1 Minute) erforderlich, um ihn zu entfernen.
item.sensor_tag.desc=Ein Sensor-RFID-Chip kann mit einem einzelnen Sensor (der separat erworben werden muss) von bis zu Stufe 2 (s. Sensoren, S. 449) ausgerüstet werden. Er zeichnet dann für maximal 24 Stunden alles auf, was er kann. Man kann ihn so programmieren, dass er sich nach diesen 24 Stunden abschaltet oder weiter aufzeichnet und dabei Daten, die älter als 24 Stunden sind, überschreibt. Sensor-RFID-Chips werden häufi g für diagnostische Zwecke in verschiedenen Geräten, einschließlich Cyberware, verwendet.
item.sleath_tag.desc=Ein Spionage-RFID-Chip läuft immer auf Schleichfahrt (S. 232) und hat eine Schleicherstufe gleich seiner Gerätestufe. Er wird so hergestellt, dass er nicht wie ein RFID-Chip aussieht, was ihm einen zusätzlichen Tarnmodifi kator von -2 verleiht. Spionage-RFID-Chips werden von sicherheitsbewussten (und hinterhältigen) Megakons häufig als Backup für Sicherheits-RFID-Chips verwendet. Sie können auf dieselbe Weise implantiert werden wie SicherheitsRFID-Chips.

item.bug_scanner.desc=Dieses Gerät, auch als Funksignalscanner bekannt, lokalisiert WiFi-Geräte in einem Umkreis von 20 Metern. Der Scanner kann auch die Stärke eines Signals messen und seine Position zielgenau bestimmen. Um einen Wanzenscanner zu bedienen, ist eine Probe auf Elektronische Kriegsführung + Logik [Stufe] erforderlich. Ein Gerät, das auf Schleichfahrt läuft (wie etwa ein Spionage-RFID-Chip), kann Logik + Schleicher verwenden, um sich gegen den Scan zu verteidigen. Wenn man mit dem Wanzenscanner Nettoerfolge erzielt, entdeckt man das Gerät.
item.data_tap.desc=Dieses Hackingwerkzeug wird an einem Datenkabel angebracht. Sobald es am Kabel befestigt ist, kann man es über einen Universal-Datenport verwenden. Jedes Gerät, das direkt mit der Datenwanze verbunden ist, hat auch eine Direktverbindung mit den Geräten an beiden Enden des Kabels (s. Direktverbindungen, S. 229) und umgekehrt. Die Wanze kann wieder entfernt werden, ohne das Kabel zu beschädigen.
item.headjammer.desc=Dieses Gerät wird von Sicherheitspersonal verwendet, um implantierte Kommlinks zu neutralisieren. Wenn es am Kopf (oder einem anderen Körperteil) befestigt und aktiviert wird, funktioniert es genauso wie jeder andere Störsender, außer dass seine Wirkung auf den Träger und seine Bodytech beschränkt ist. Das Entfernen des Headkom-Blockers von jemandem, der nicht den richtigen Schlüssel hat, erfordert eine Ausgedehnte Probe auf Hardware + Logik [Geistig] (8, 1 Komplexe Handlung) oder auf Schlosser + Geschicklichkeit [Körperlich] (8, 1 Komplexe Handlung).\nWenn man den Headkom-Blocker von sich selbst entfernen will, ohne den richtigen Schlüssel zu haben, muss man eine Probe auf Entfesseln + Geschicklichkeit [Körperlich] (4) ablegen. Dies dauert eine Komplexe Handlung.
item.jammer_area.desc=Dieses Gerät flutet den Äther mit elektromagnetischen Störsignalen, um WiFi- und Funkkommunikation zu blockieren. Der Störsender erzeugt Rauschen in Höhe seiner Gerätestufe. Der Bereichsstörsender beeinflusst einen kugelförmigen Bereich \u2013 seine Stufe wird alle 5 Meter vom Zentrum des Bereichs um 1 gesenkt (ähnlich den Sprengwirkungsregeln für Granaten). \nDer Störsender beeinflusst nur Geräte (und Personas auf diesen Geräten), die sich im Störbereich befinden, aber im Störbereich beeinfl usst er alle Geräte. Wände und andere Hindernisse können das Störsignal an der Ausbreitung hindern oder seine Wirkung abschwächen (nach Maßgabe des Spielleiters).
item.jammer_direct.desc=Dieses Gerät fl utet den Äther mit elektromagnetischen Störsignalen, um WiFi- und Funkkommunikation zu blockieren. Der Störsender erzeugt Rauschen in Höhe seiner Gerätestufe. Der zielgerichtete Störsender beeinfl usst einen kegelförmigen Bereich mit einer Spannweite von 30 Grad \u2013 seine Stufe wird alle 20 Meter vom Zentrum des Bereichs um 1 gesenkt. Der Störsender beeinflusst nur Geräte (und Personas auf diesen Geräten), die sich im Störbereich befi nden, aber im Störbereich beeinflusst er alle Geräte.\nWände und andere Hindernisse können das Störsignal an der Ausbreitung hindern oder seine Wirkung abschwächen (nach Maßgabe des Spielleiters).
item.micro-transceiver.desc=Dieses klassische Kurzstrecken-Kommunikationsgerät wird von Profi s seit den 2050ern geschätzt. Er tut nichts Besonderes, sondern lässt einen einfach per Stimme mit anderen Mikro-Transceivern und Kommlinks \u2013 die man selbst (und die andere Person) auswählt \u2013 innerhalb einer Entfernung von einem Kilometer kommunizieren. Der Mikro-Transceiver besteht aus einem Ohrstöpsel und einem selbsthaftenden subvokalen Mikrofon (S. 443), die beide in schwer zu entdeckenden Designs erhältlich sind.
item.tag_eraser.desc=Dieses Handgerät erzeugt ein starkes elektromagnetisches Feld, das perfekt für das Ausbrennen von RFID-Chips und anderer ungeschützter Elektronik ist. Es ist wahrscheinlich stark genug, um ein Kommlink zu zerstören, und man sollte es \u2013 nur für den Fall der Fälle \u2013 auch nicht zu nahe an sein Cyberdeck lassen. Wenn man den Löscher in eine Entfernung von maximal 5 Millimeter zu einem elektronischen Gerät bringt und den Knopf drückt, erleidet das Gerät 10 Kästchen Matrixschaden (dem normal widerstanden wird). Die extrem kurze Reichweite macht es schwierig, den RFID-Löscher gegen Ziele wie Fahrzeuge, die meisten Drohnen, Magschlösser und Cyberware anzuwenden (und zu dem Zeitpunkt, an dem man sie geöffnet hat, um an die Elektronikinnereien zu kommen, hat man sowieso schon eine Menge Schaden angerichtet). Der RFID-Löscher hat eine Ladung und kann an einer Steckdose innerhalb von 10 Sekunden wiederaufgeladen werden.
item.white_noise_generator.desc=Dieses Gerät erzeugt ein Feld zufälligen Rauschens, maskiert so die Geräusche in seinem Wirkungsbereich und verhindert direkte Audioüberwachung. Alle Wahrnehmungsproben, um eine Unterhaltung innerhalb von (Stufe) Metern Entfernung von einem White-Noise-Generator mitzuhören, erleiden einen negativen Würfelpoolmodifikator in Höhe der Stufe des Generators. Wenn mehr als ein Generator verwendet wird, zählt nur die höchste Stufe.\nEin White-Noise-Generator ist in einer lauten Umgebung (wie etwa einem Nachtclub oder bei einer Schießerei) überflüssig und hilft weder gegen Videoüberwachung noch stört er WiFi-Signale.

item.agent1_3.desc=Diese Software wird in Cyberdecks verwendet und näher unter Programme (S. 241) beschrieben.
item.agent4_6.desc=Diese Software wird in Cyberdecks verwendet und näher unter Programme (S. 241) beschrieben.
item.autosoft.desc=Weitere Informationen über diese Programme für Drohnen fi nden Sie auf S. 267.
item.datasoft.desc=Der Begriff Datensoft umfasst eine große Bandbreite von Informationsdateien und Datenbanken, die Informationen über alle möglichen Themen enthalten, von Hydrofracking bis hin zu romantischer Poesie des 18. Jahrhunderts. Eine passende Datensoft verleiht zudem einen Bonus von +1 auf das Geistige Limit bei entsprechenden Wissensfertigkeitsproben.
item.mapsoft.desc=artensoft-Programme enthalten detaillierte Informationen über ein bestimmtes Gebiet, von Straßen über Geschäfts-/Wohngebietsaufl istungen bis hin zu topographischen, Zensus-, GPS- und Umweltdaten. Ein interaktives Interface erlaubt es, schnell die besten Routen zu bestimmen, den nächsten Ort der Wahl zu lokalisieren oder eigene maßgeschneiderte Karten zu erstellen. Mit einer WiFi-Verbindung aktualisiert sich die Karte automatisch mit den neuesten Daten von GridGuide. Das heißt natürlich auch, dass die Kartensoft von anderen genutzt werden kann, um die eigene Position aufzuspüren. Nach Maßgabe des Spielleiters gewähren Kartensofts einen Limitbonus von +1 für Navigationsproben in dem Gebiet, das sie abdecken.
item.shopsoft.desc=Shopping-Apps wie Clothes Horse, Caveat Emptour und Guns Near Me bieten Preisvergleiche und Käuferbewertungen, sowohl für Standardwaren als auch für Schwarzmarkteinkäufe. Shopsofts aktualisieren sich regelmäßig. Eine passende Shopsoft \u2013 es gibt eine für jede Art von Produkt wie Elektronik, Feuerwaffen, Nahkampfwaffen, Panzerung und so weiter \u2013 gewährt einen Bonus von +1 auf das Soziale Limit für alle Verfügbarkeits- und Verhandlungsproben, um solche Gegenstände zu kaufen oder zu verkaufen.
item.tutorsoft.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit. Die Lehrsoft legt Unterrichtsproben mit einem Würfelpool in Höhe des Doppelten ihrer Stufe ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren.

item.activesoft.desc=Aktionssofts ersetzen körperliche Aktionsfertigkeiten, also im Wesentlichen jede Aktionsfertigkeit, die nicht auf Magie oder Resonanz basiert. Um die Aktionssofts in nutzbares Muskelgedächtnis zu übersetzen, sind Talentleitungen (S. 461) und eine Talentbuchse (S. 457) erforderlich. Die Anzahl von Aktionssofts, die man gleichzeitig nutzen kann, ist \u2013 basierend auf der Stufe der Talentleitungen \u2013 begrenzt.
item.knowsoft.desc=Wissenssofts replizieren Wissensfertigkeiten und überschreiben aktiv das Wissen des Anwenders durch ihre eigenen Daten. Auf Wissenssofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl von Wissenssofts, die man gleichzeitig nutzen kann, wird durch die Stufe der Talentbuchse begrenzt.
item.linguasoft.desc=Linguasofts replizieren Sprachfertigkeiten und erlauben es dem Anwender, eine fremde Sprache zu sprechen, indem sie automatisch Signale aus dem Sprachkortex übersetzen. Gechippte Sprache kann unbeholfen und gestelzt klingen \u2013 aber das kann auch für jeden gelten, der eine Sprache spricht, die nicht seine Muttersprache ist. Auf Linguasofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl von Linguasofts, die man gleichzeitig nutzen kann, wird durch die Stufe der Talentbuchse begrenzt.

item.credstick_standard.desc=Das Bargeld des späten 21. Jahrhunderts. Ein beglaubigter Credstick ist nicht auf eine bestimmte Person registriert \u2013 die elektronischen Geldbeträge, die darauf kodiert sind, gehören dem Besitzer und erfordern keine spezielle ID oder Authentifi zierung. Die schlechte Nachricht ist, dass man ausgeraubt werden kann und alles Geld auf dem beglaubigten Credstick dann weg ist. Die gute Nachricht ist, dass beglaubigte Credsticks nicht zurückverfolgt werden können. Sie sind noch nicht einmal WiFi-fähig \u2013 man muss sie in einen Universal-Datenport stecken, um Geld von ihnen oder auf sie zu transferieren. Dadurch sind sie bei Shadowrunnern und den Mr. Johnsons, die sie anheuern, immer noch sehr beliebt.\nJede Art von Credstick kann nur eine gewisse Maximalmenge an Geld enthalten, wie in der Tabelle angegeben. Aber Achtung: Dies ist nur die Maximalmenge, die der Credstick enthalten kann, nicht die Menge, die immer darauf ist \u2013 also sollte man nicht aufgeregt werden, wenn man einen goldenen Credstick sieht, bis man ihn eingesteckt und sein Guthaben überprüft hat.\n\nBis ¥5.000
