item.crossbow_light.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen ausgerüstet, sodass das Nachladen keine Handlung Waffe Bereitmachen erfordert (wenn man nicht gerade ein Museumsstück verwendet). Armbrüste habe interne Magazine (m), die bis zu 4 Bolzen enthalten, und sind als Leichte, Mittlere und Schwere Version erhältlich.
item.crossbow_medium.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen ausgerüstet, sodass das Nachladen keine Handlung Waffe Bereitmachen erfordert (wenn man nicht gerade ein Museumsstück verwendet). Armbrüste habe interne Magazine (m), die bis zu 4 Bolzen enthalten, und sind als Leichte, Mittlere und Schwere Version erhältlich.
item.crossbow_heavy.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen ausgerüstet, sodass das Nachladen keine Handlung Waffe Bereitmachen erfordert (wenn man nicht gerade ein Museumsstück verwendet). Armbrüste habe interne Magazine (m), die bis zu 4 Bolzen enthalten, und sind als Leichte, Mittlere und Schwere Version erhältlich.
item.throwing_knife.desc=Es gibt eine große Bandbreite von aerodynamisch geformten, speziell ausbalancierten und muskelbetriebenen Wurfwaffen, von Wurfdornen über Pfeile bis hin zu Kunai und Shuriken. Ein Charakter kann mit einer Handlung Waffe Bereitmachen eine Anzahl von (Geschicklichkeit ÷ 2) Stück dieser Wurfwaffen bereitmachen.

item.defiance_ex_shocker.desc=Dieser hochbelastbare Taser feuert bis zu 4 Taserpfeile ab, deren Drähte bis zu 20 Meter lang sind. Die Drahtverbindung zur Batterie ermöglicht einen stärkeren Schock. Die meisten modernen Taser verwenden drahtose Pfeile, deshalb ist der Defiance EX-Shocker hier eine Ausnahme. Außerdem verfügt er über Kontakte, mit denen er im Nahkampf als Betäubungswaffe (Präzision 3, Schaden 8G(e), Reichweite 0) verwendet werden kann.
item.yamaha_pulsar.desc=Die Pfeile dieses Tasers enthalten drahtlose Kondensatoren, womit der Pulsar ohne unhandliche Drähte auskommt. Dafür ist er etwas weniger stark als der EX-Shocker, kann aber schneller feuern. Er verfügt nicht über die Nahkampfkontakte des EX-Shockers.
item.fichetti_tiffani.desc=Die Zielgruppen der Tiffani Needler sind gesellschaftliche Aufsteiger und Debütantinnen, weshalb sie in einer Vielzahl von Farben und Stilen erhältlich ist. Außerdem hat sie eine spezielle farbverändernde Beschichtung, die kabellos aktiviert werden kann. Das ist nützlich, wenn die Pistole zu den Schuhen oder der Handtasche passen soll. Die Needler kann nur Flechettemunition abfeuern (bereits in den Schadenscode eingerechnet).
item.streetline_special.desc=Die Streetline, eine kleine, leichte Waffe aus Kompositwerkstoffen, ist beim Bodensatz der Gesellschaft beliebt. Magnetanomaliedetektoren (MAD-Scanner, S. 365) erhalten für Versuche, sie zu entdecken, einen Würfelpoolmodifikator von -2.
item.walther_palm_pistol.desc=Dies ist ein klassischer zweiläufiger Derringer, bei dem die Läufe übereinander angeordnet sind. Für ihre Größe hat diese kleine Pistole ziemlich viel Kraft, dafür aber auch eine der kleinsten \u201EMagazin\u201D-Kapazitäten auf dem Markt \u2013 nur eine Kugel pro Lauf. Beide Läufe können mit einer kurzen Salve (s. Zu wenig Munition, S. 181) gleichzeitig abgefeuert werden.

item.ares_light_fire_70.desc=Die Ares Light Fire 70 ist eine der am weitesten verbreiteten Pistolen auf dem Markt. Für diese Pistole ist ein spezieller, exklusiv für sie entwickelter, laufmontierter Schalldämpfer erhältlich, der einen zusätzlichen Schalldämpfer-Würfelpoolmodifikator von -1 gewährt (insgesamt also -5). Der Schalldämpfer kostet 750 ¥.
item.ares_light_fire_75.desc=ie Light Fire 75 basiert auf einer der am weitesten verbreiteten Pistolen auf dem Markt und ist eine Waffe für Spezialkräfte, die über legale Kanäle normalerweise nicht erhältlich ist. Ein spezieller laufmontierter Schalldämpfer, der exklusiv für die Light Fire entwickelt wurde, ist bei dieser Waffe serienmäßig und gewährt einen Würfelpoolmodifi kator von -1 zusätzlich zu dem Modifi kator, der normalerweise durch Schalldämpfer gewährt wird. Zusätzlich zu dem integrierten Schalldämpfer enthält die Ares Light Fire 75 ein Smartgunsystem.
item.beretta_201T.desc=Diese leichte Seitenwaffe wird von vielen Sicherheitsleuten verwendet. Sie kann im Salvenmodus schießen. Da die 201T ohne weitere Einschränkungen als Leichte Pistole eingestuft wird, ist sie sehr beliebt bei Sicherheitsbehörden in Ländern, in denen Schwere und Automatikpistolen legal schwer erhältlich sind. Die Waffe ist mit einer abnehmbaren Schulterstütze ausgerüstet.
item.colt_america_l36.desc=Eine ehrwürdige Pistole mit einem sehr guten Ruf. Diese Feuerwaffe für Anfänger ist billig, leicht zu verbergen und fast allgegenwärtig. Eine perfekte Wegwerfwaffe.
item.fichetti_security_600.desc=Der hocheffi ziente Lademechanismus dieser leichten Seitenwaffe für Sicherheitskräfte erlaubt ein 30-Schuss-Magazin. Die Fichetti Security 600 ist mit einer abnehmbaren Schulterstütze und einem Lasermarkierer ausgerüstet.
item.taurus_omni_6.desc=Dieser zuverlässige, robuste Revolver ist speziell darauf ausgelegt, eine große Bandbreite von Munition zu verwenden. Der Omni-6 ist bei Hobbyschützen und Leuten beliebt, die ihre Waffe gerne von Hand laden, und wird mit austauschbaren Trommeln geliefert, sodass er entweder Hülsen- oder hülsenlose Munition für Leichte oder Schwere Pistolen aufnehmen kann. Wenn er Kugeln für Leichte Pistolen abfeuert, schießt der Omni-6 im halb-automatischen Modus (HM) und hat einen Schadenscode von 6K, mit Munition für Schwere Pistolen schießt er im Einzelschussmodus (EM), hat einen Schadenscode von 7K und eine DK von -1. Der Omni-6 ist mit einem integrierten Lasermarkierer ausgestattet.

item.ares_predator_v.desc=Die neueste Generation der \u2013 besonders bei Söldnern und Shadowrunnern \u2013 beliebtesten Handfeuerwaffe der Welt. Die Ares Predator V verfügt über eine verbesserte Ergonomie und Handhabung sowie ein integriertes Smartgunsystem. Einige Leute sagen, dass die Ares Predator V nicht besser sei als andere Pistolen ihrer Klasse, aber niemand kann bestreiten, dass sie eine bessere Markenwiedererkennung hat.
item.ares_viper_slivergun.desc=Die geschmeidige Slivergun paart die unstrittig überragende Kombination aus Salvenfeuerfähigkeit und eingebauter Schallunterdrückung (ein integrierter Schalldämpfer, S. 435) mit einer großen Magazinkapazität. Sie verschießt Metallsplitter, die als Flechettemunition zählen, was bereits in den Schadenscode der Waffe eingerechnet ist.
item.browning_ultra_power.desc=Diese ehrwürdige Seitenwaffe ist der Hauptkonkurrent der Ares Predator um den Titel der härtesten schweren Pistole der Welt. Sie verfügt über einen eingebauten aufmontierten Lasermarkierer und ist etwas billiger als die Predator.
item.colt_government_2066.desc=Diese von der Regierung ausgegebene Waffe ist dem legendären Colt M1911A1 nachempfunden und verwendet einen elektrischen Zündmechanismus, um die Treibladung der Patronen zu zünden. Dadurch, dass die meisten beweglichen Teile des Feuermechanismus entfernt wurden, hat diese Waffe den Ruf, außerordentlich zuverlässig zu sein.
item.remington_roomsweeper.desc=Dies ist eigentlich eher eine kurzläufi ge Schrotfl inte als eine Pistole. Wenn sie mit Flechette- statt normaler Munition geladen wird, verwendet sie die Reichweiten für Schwere Pistolen, aber die Regeln für Schrotflinten (s. Schrotflinten, S. 182).
item.ruger_super_warhawk.desc=Dieser Revolver ist so laut wie ein Linienfl ugzeug und doppelt so glänzend. Außerdem ist er eine der furchterregendsten Handfeuerwaffen der Welt. Die Variante mit Hülsenmunition ist einfach nur deshalb so beliebt, weil es reiner Nervenkitzel ist, die Munitionstrommel aufzuklappen und verbrauchtes Messing herausfallen zu lassen.

item.ares_crusader_ii.desc=Mit ihrem großen Magazin und der leichten Handhabung ist die Ares Crusader II eine der beliebtesten Waffen ihrer Klasse. Sie ist mit einem integrierten laufmontierten Gasventilsystem 2 zur Rückstoßkompensation und einem integrierten Smartgunsystem ausgestattet.
item.ceska_black_scorpion.desc=Diese klassische Automatikpistole bietet tarnbare Salvenfeuerfähigkeit. Sie ist mit einer ausklappbaren Schulterstütze ausgestattet.
item.steyr_tmp.desc=Diese Pistole mit Leichtbau-Polymerrahmen kann im vollautomatischen Modus feuern, ist dann aber durch ihr geringes Gewicht schwer zu kontrollieren. Sie ist mit einem eingebauten aufmontierten Lasermarkierer ausgestattet.
item.colt_cobra_tz120.desc=Mit ihrem einzigartigen Design und einer großen Bandbreite von Zubehör ist die Cobra-Serie von Colt sowohl bei Sicherheitskräften auf der ganzen Welt als auch im Trideo ziemlich beliebt. Die TZ-120 ist mit einer ausklappbaren Schulterstütze, einem aufmontierten Lasermarkierer und einem laufmontierten Gasventilsystem 2 ausgestattet.
item.fn_p93_praetor.desc=Diese Bullpup-Maschinenpistole wurde speziell für die schnellen Eingreifteams von Interpol gebaut, die unter der Befehlsgewalt des Konzerngerichtshofs stehen. Ihr spezielles Kammersystem gewährt 1 Punkt Rückstoßkompensation, und sie hat eine integrierte feste Schulterstütze sowie eine Lampe, die Dunkelheitsmodifi katoren um eine Stufe reduziert (s. Umweltmodifi katoren, S. 175). Der Besitz der FN P93 ist in den meisten Zuständigkeitsbereichen ein Verbrechen, wenn man kein legitimes Mitglied einer Truppe des Konzerngerichtshofs ist.
item.hk_227.desc=Die HK-227 ist die Maschinenpistole der Wahl für viele Konzern- und Militärsicherheitskräfte und ist mit einer einziehbaren Schulterstütze, einem Smartgunsystem und einem integrierten Schalldämpfer ausgestattet.
item.ingram_smartgun_x.desc=Eine Knarre der Spitzenklasse. Die Ingram Smartgun ist seit den 2050ern als Waffe der Wahl vieler legendärer Straßensamurai berühmt und ist mit einem Gasventilsystem 2, einem Smartgunsystem, einer ausziehbaren Schulterstütze und einem integrierten Schalldämpfer ausgestattet.
item.sck_model_100.desc=Shin Chou Kyogo ist ein Synonym für japanische Konzernsicherheit. Die Sicherheitskräfte fast jedes Japanokons \u2013 auch Renrakus berüchtigte Rote Samurai \u2013 sind mit der SCK 100 ausgerüstet. Die SCK 100 ist mit einem internen Smartgunsystem und einer ausklappbaren Schulterstütze ausgestattet.
item.uzi_iv.desc=Diese in die Jahre gekommene Maschinenpistole ist ein würdiger Nachkomme der berühmten israelischen Waffe. Sie ist mit einer ausklappbaren Schulterstütze und einem eingebauten aufmontierten Lasermarkierer ausgestattet.

item.ak_97.desc=Das AK-97 ist eine legendäre Waffe mit einer sagenumwobenen Zuverlässigkeit \u2013 man kann es zehn Jahre lang vergraben, dann wieder ausgraben und ohne Probleme sofort damit losschießen. Als die ganzen nanofaxproduzierten AK-147er zu Schlacke schmolzen, funktionierten die AK-97er einfach schön weiter.
item.ares_alpha.desc=Das Alpha wurde speziell für die Firewatch-Spezialeinheiten von Ares entwickelt und ist seitdem auf der ganzen Welt ein Bestseller, der sogar von den Special Forces der UCAS verwendet wird. Teilweise liegt das an seiner außergewöhnlich hohen Markenwiedererkennung, andererseits natürlich auch an seinem Unterlauf-Granatwerfer, dem Smartgunsystem und einem teuren Kammerdesign, das 2 Punkte Rückstoßkompensation gewährt.
item.colt_m23.desc=Dieses billige, massenproduzierte Sturmgewehr ohne irgendwelchen Schnickschnack wird sowohl von den Gangern und Piraten geliebt, die es in ihre Finger bekommen, als auch von den Profis, die nach etwas suchen, das sie von Grund auf modifi zieren können.
item.fn_har.desc=Dieses Sturmgewehr ist äußerst beliebt bei privaten Sicherheitskräften und Konzern-Spezialeinheiten. Es ist mit einem Lasermarkierer und einem Gasventilsystem 2 ausgestattet.
item.yamaha_raiden.desc=Dieses Sturmgewehr mit elektronischem Feuermechanismus markiert den aktuellen Stand der Technik. Das Raiden ist sehr genau und wurde schnell von den Sicherheitskräften der Japanokons und den Marines des Japanischen Kaiserreichs angenommen. Es ist mit einem integrierten Schalldämpfer und einem Smartgunsystem ausgestattet, und der elektronische Feuermechanismus gewährt 1 Punkt Rückstoßkompensation.

item.ares_desert_strike.desc=Dieses robuste Scharfschützengewehr ist für den Einsatz über weite Entfernung in rauer Umgebung gedacht. Das heißt, dass es ohne Materialien oder Technologien auskommt, die versagensanfällig sind. Es ist mit einer festen Schulterstütze mit Schockpolster und einem abnehmbaren Zielfernrohr ausgestattet.
item.cavalier_arms_crocket_ebr.desc=Das Crockett EBR wandert auf der Grenze zwischen Sturm- und Scharfschützengewehr und kann im Salvenmodus feuern. Es hat zwar nicht die Magazinkapazität eines echten Sturmgewehrs und auch nicht die Präzision der Waffe eines echten Scharfschützen, aber dafür ist es vielseitig und kann so leicht zwischen einer Scharfschützen- und einer Kampfrolle wechseln, wie man einen Schalter umlegt. Es ist mit einer festen Schulterstütze mit Schockpolster und einem abnehmbaren Zielfernrohr ausgestattet.
item.ranger_arms_sm5.desc=Dieses Scharfschützengewehr \u2013 eine legendäre Assassinenwaffe \u2013 ist mit einem Schalldämpfer, einem Zielfernrohr und einer festen Schulterstütze mit Schockpolster ausgestattet.\nDas SM-5 kann vollständig auseinandergenommen werden, sodass es in einen normalen Aktenkoffer passt. Das Zusammen- oder Auseinanderbauen erfordert eine Ausgedehnte Probe auf Gewehre + Logik [Geistig] (6, Komplexe Handlung). Das SM-5 ist zwar tödlich, aber auch empfi ndlich. Am Ende jeder Kampfrunde, in der die Waffe in einem Feuergefecht benutzt wird, in dem sich der Schütze mit der Waffe schnell bewegen muss, wird die Präzision des Gewehrs um 1 gesenkt (bis zu einem Minimum von 3).\nFalls das Gewehr im Kampf als Nahkampfwaffe oder zur Verteidigung gegen einen Nahkampfangriff benutzt wird, wird die Präzision um 2 gesenkt (wieder bis zu einem Minimum von 3). Durch eine Rekalibrierung der Waffe (was eine Stunde dauert) wird ihre normale Präzision wiederhergestellt.
item.remington_950.desc=Dieses Hochleistungsjagdgewehr mit Geradzugverschluss verwendet klassisches Holz als Material für den Schaft und verfügt über ein aufmontiertes Zielfernrohr, was es seit mehreren Jahrzehnten bei Jägern beliebt macht. Es kann kein unterlaufmontiertes Zubehör aufnehmen.
item.ruger_101.desc=Dieses futuristisch aussehende, gasbetriebene Sportgewehr ist die bevorzugte Waffe vieler professioneller Jäger und Hobbyschützen. Es ist mit einem eingebauten Zielfernrohr und einer festen Schulterstütze mit Schockpolster ausgestattet.

item.defiance_t250.desc=Diese halbautomatische Schrotflinte sieht man öfter auf den Straßen, wenn die Lage über Pistolen und Messer hinaus eskaliert, und sie ist in normaler Länge oder als kurzläufi ge Version erhältlich. Sie ist gasbetrieben, verfügt allerdings auch über einen sekundären Vorderschaftrepetierer für Situationen, in denen es wichtiger ist, eine Ladehemmung zu verhindern, als schnell einen zweiten Schuss abzugeben. Die kurzläufi ge Version hat einen Tarnmodifikator von +4, die Reichweiten einer Schweren Pistole und einen Schadenscode von 9K.
item.enfield_as7.desc=Diese militärische Sturmschrotfl inte verleiht ihrem Benutzer gewaltige Feuerkraft. Als Waffe für beengte Umgebungen und als allgemeine Kampffl inte wird sie universell gefürchtet. Sie kann entweder mit 10-Schuss-Munitionsstreifen oder mit einem speziellen 24-Schuss-Trommelmagazin bestückt werden. Die Enfi eld AS-7 ist mit einem eingebauten aufmontierten Lasermarkierer ausgestattet.
item.pjss_model_55.desc=Dies ist eine Waffe im klassischen Stil für einen klassischen Sport. Sie wird nur in kleiner Stückzahl gebaut und ist unter europäischen Jägern und Trapschützen als präzise und prestigeträchtige Waffe berühmt. Die feste Schulterstütze der Waffe ist mit einem integrierten Schockpolster ausgestattet. Beide Läufe können als kurze Salve (s. Zu wenig Munition, S. 181) gleichzeitig abgefeuert werden.

item.ares_s3_super_squirt.desc=Diese beliebte nichttödliche Waffe verschießt DMSO-Gelpacks. Das Dimethylsulfoxid sorgt dafür, dass Chemikalien durch die Haut vom Organismus aufgenommen werden. Der Angriff selbst verursacht keinen Schaden, aber wenn das Ziel getroffen wird, gibt das DMSO die entsprechende Substanz als Gift mit Kontaktvektor (s. Toxine, S. 410) direkt in den Blutkreislauf des Ziels ab. Die Super Squirt wird mit der Fertigkeit Pistolen abgefeuert, verwendet die Reichweiten für Leichte Pistolen und kann auf- und unterlaufmontiertes Zubehör aufnehmen.
item.fichetti_pain_inducer.desc=Für eine nichttödliche Waffe ist der Fichetti Pain Inducer nicht besonders human. Er sorgt dafür, dass man sich wie in einer Mikrowelle fühlt, von innen nach außen geröstet. Der Angriff wird wie ein Toxinangriff mit einer Kraft von 8 und einer Geschwindigkeit von Sofort behandelt. Das Ziel widersteht mit Konstitution + Willenskraft. Wenn die modifizierte Kraft das Geistige Limit des Ziels übertrifft, muss das Ziel seine nächste Handlungsphase damit verbringen, alles zu unternehmen, um vor den Schmerzen davonzulaufen. Der Angreifer kann den Strahl der Waffe weiter mit einer Komplexen Handlung auf das Ziel gerichtet halten, bis der Spielleiter bestimmt, dass das Ziel ausgewichen ist oder Deckung gefunden hat. Wenn das Ziel nicht aus dem Strahl der Waffe entkommen kann, ist es durch den Schmerz außer Gefecht gesetzt und erleidet einen negativen Würfelpoolmodifi kator gleich der modifi zierten Kraft, solange der Strahl auf es gerichtet ist.\nDer Pain Inducer verwendet die Reichweiten für Maschinenpistolen und kann auf- und unterlaufmontiertes Zubehör aufnehmen. Er hat zehn Ladungen; an einer Steckdose lädt er alle zehn Sekunden eine Ladung auf.
item.parashield_dart_pistol.desc=Diese industrielle Standardpfeilpistole verschießt Injektionspfeile (S. 436) mit Narcoject oder einer anderen Ladung. Sie wird mit der Fertigkeit Pistolen abgefeuert, verwendet die Reichweiten für Schwere Pistolen und kann aufmontiertes Zubehör aufnehmen.
item.parashield_dart_rifle.desc=Das Parashield Pfeilgewehr wurde ursprünglich entwickelt, um Großwild auf lange Entfernung nichttödlich zu erlegen, und verwendet Druckluft, um Injektionspfeile zu verschießen. Es ist mit einem aufmontierten Zielfernrohr ausgestattet. Das Parashield Pfeilgewehr wird mit der Fertigkeit Gewehre abgefeuert, verwendet die Reichweiten für Sturmgewehre und kann auf- und unterlaufmontiertes Zubehör aufnehmen.

item.ingram_valiant.desc=Dieses legendäre leichte Maschinengewehr ist bei Söldnereinheiten auf der ganzen Welt beliebt. Es ist mit einer festen Schulterstütze inklusive Schockpolster, einem Lasermarkierer und einem laufmontierten Gasventilsystem 2 ausgestattet.
item.stoner_ares_m202.desc=Dieses MMG packt eine gewaltige Feuerkraft in einen relativ leichten Rahmen aus besonders strapazierfähigen Verbundstoffen. Aufgrund seiner relativ geringen Größe ist es eine sehr beliebte Sekundärwaffe für schwere militärische Fahrzeuge. Trolle, für die Subtilität ein Fremdwort ist, putzen es manchmal mit allerlei Zubehör als persönliche Waffe heraus.
item.rpk_hmg.desc=Dieses schwere russische Maschinengewehr wird von den Streitkräften mehrerer osteuropäischer und nahöstlicher Länder verwendet, hauptsächlich als fahrzeugmontierte Unterstützungswaffe. Es ist mit einem abnehmbaren Dreibein ausgestattet und wird aus einer liegenden, sitzenden oder knienden Position abgefeuert, wenn es nicht auf einem Fahrzeug montiert ist.

item.ares_antioch-2.desc=Der Antioch-2 ist ein klassischer Granatwerfer, der mit einem integrierten Smartgunsystem ausgestattet ist. Er ist einer der erschwinglicheren Granatwerfer auf dem Markt.
item.armtech_mgl12.desc=Dieser Bullpup-Granatwerfer ist beliebt, weil er im halbautomatischen Modus feuern und deutlich mehr Minigranaten aufnehmen kann als seine Konkurrenzmodelle.
item.aztechnology_striker.desc=Der Striker ist ein extrem leichter Wegwerf-Raketenwerfer \u2013 perfekt, wenn man kurz zuschlagen und dann schnell und ohne Ballast verschwinden will.
item.krime_cannon.desc=Krime ist vielleicht nur ein kleiner Hersteller, aber seine Sturmkanone, die einfach nur Cannon genannt wird, ist eine billige schwere Waffe mit einer großen Portion Attitüde und Feuerkraft. Sie ist standardmäßig mit einer Trollmodifi kation ausgestattet und damit die erste Waffe in der Sechsten Welt, die für größere Kunden gedacht ist.
item.onotari_interceptor.desc=Dieser von Saeder-Krupp entwickelte militärische Lenkraketenwerfer kann Raketen und Lenkraketen jedes Typs verschießen. Er hat zwei separate Läufe und Feuerkammern und kann bis zu zwei Raketen gleichzeitig aufnehmen, die nicht vom selben Typ sein müssen. Aufgrund von Sicherheitserwägungen kann er nicht beide Läufe gleichzeitig abfeuern. Er ist mit einem internen Smartgunsystem ausgestattet.
item.panther_xxl.desc=Diese verdammt riesige Sturmkanone verwendet Munition, die ansonsten in den Hauptgeschützen vieler kleiner Panzer zu finden ist. Sie ist mit einem internen Smartgunsystem ausgestattet.

item.actioneer_business.desc=Dieser diskret gepanzerte Geschäftsanzug ist bei Mr. Johnsons, Unterhändlern und Schiebern beliebt, die hochklassigen Schutz Geschäftskleidung gepaart mit Stil haben wollen. Er enthält ein Tarnholster (S. 436) im Jackett.
item.armor_clothing.desc=Durch ihr leichtes ballistisches Gewebe sind diese Kleidungsstücke fast unmöglich als Panzerung zu erkennen. Sie bieten zwar nicht so viel Schutz wie echte Panzerung, sind aber in vielen verschiedenen Stilen erhältlich.
item.armor_jacket.desc=Die beliebteste Panzerung auf den Straßen gibt es in allen Stilen, die man sich nur vorstellen kann. Sie bietet guten Schutz, ohne zu viel Aufmerksamkeit auf sich zu ziehen. Aber denken Sie nicht einmal daran, sie auf einer Dinnerparty zu tragen.
item.armor_vest.desc=Diese moderne, fl exible Weste wird unter normaler Kleidung getragen und ist so entwickelt, dass sie dabei nicht aufträgt. Eine beliebte und kostengünstige Option.
item.chameleon_suit.desc=Dieser Ganzkörperanzug hat eine Rutheniumpolymerbeschichtung, die mit einem Sensorsystem verbunden ist. Die Sensoren scannen die Umgebung und replizieren die Bilder in der richtigen Perspektive auf der Rutheniumpolymerbeschichtung. Bei Schleichenproben, um sich zu verstecken, wird das entsprechende Limit um 2 erhöht. Ein Chamäleonanzug ist außerdem gepanzert, um seinem Träger Schutz zu bieten.
item.full_body_armor.desc=Diese Panzerung kann nicht verborgen werden und wird weltweit von Sicherheits- und Militäreinheiten bei Einsätzen getragen, bei denen es nicht um Heimlichkeit geht. Sie ist sowohl auf Einschüchterung als auch auf gute Beweglichkeit ausgelegt \u2013 mit einer ganzen Ansammlung von taktischen Holstern, Taschen und Gurten \u2013 und zieht mit Sicherheit Aufmerksamkeit auf sich.
item.lined_coat.desc=Dieser Mantel im Wildweststil ist weltweit seit 30 Jahren auf den rauen Straßen der Sprawls beliebt. Außer seinen Schutzeigenschaften gewährt dieser Mantel einen zusätzlichen Tarnmodifikator von -2, um Gegenstände unter ihm zu verstecken.
item.urban_explorer_jumpsuit.desc=Diese bunten Overalls wurden für Kuriere, Athleten und Parkourläufer entwickelt. Sie sind gut belüftet und atmungsaktiv, bieten durch eine eingebaute Panzerung aus leichtem Densiplast und Flüssigreaktivpanzerung aber auch einen überraschend guten Schutz. Urban Explorer Overalls sind mit einem eingebauten Musikplayer und einem Vitalmonitor ausgestattet.

item.helmet.desc=Helme gibt es in vielen verschiedenen Formen und Größen, und sie schützen die Rübe vor Verletzungen. Sie haben eine Kapazität von 6, um mit Zubehör wie Trodennetzen und Sichtverstärkungen ausgerüstet zu werden.
item.ballistic_shield.desc=Dieser große undurchsichtige Schild wird von SWAT-Teams und im Stadtkampf verwendet. Er enthält ein Fenster aus durchsichtigem Kunststoff und einen eingebauten Leiterrahmen an der Innenseite, sodass er zum Überklettern kleinerer Hindernisse verwendet werden kann.
item.riot_shield.desc=Als zusätzliche Maßnahme zur Aufstandsbekämpfung kann ein Schutzschild verwendet werden, um jedem einen Schlag zu versetzen, der ihn berührt, wobei er Elektrizitätsschaden (S. 173) verursacht. Der Schutzschild enthält 10 Ladungen; wenn er an eine Energiequelle angeschlossen wird, lädt er sich mit einer Geschwindigkeit von einer Ladung pro 10 Sekunden wieder auf.

