item.cyberholster.desc=Das Cyberholster hält und verbirgt einen Taser oder jede maximal pistolengroße Waffe, bis es aktiviert wird. Das Einschieben oder Ziehen der Waffe erfordert eine Einfache Handlung.\nEin Cyberholster kann auch als Schmuggelbehälter für Gegenstände benutzt werden, die nicht größer als eine Pistole sind (der SPielleiter hat hier das letzte Wort).
