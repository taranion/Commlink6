ritualfeature.anchored.desc      = Ein Verankertes Ritual muss an einem physischen Objekt oder einem Symbol mit mystischer Bedeutung verankert werden. Es könnte sich um etwas handeln, das speziell für das Ritual benutzt wird (wie ein Felsen oder Durchgang, an dem ein Hüter verankert wird), um mystische Zeichen (gemeißelt, gemalt, mit Blut oder Tinte geschrieben) oder um den Ritualplatz selbst. Dieser Ankerpunkt kann während der Dauer der Ritualwirkung relativ zur Gaiasphäre (dem Planeten) nicht bewegt werden, sonst bricht die Wirkung des Rituals sofort ab.
ritualfeature.material_link.desc = Das Ritual benötigt eine Materielle Verbindung zum Ziel: etwas, das einmal Teil des Ziels war. Materielle Verbindungen von Lebewesen sind nicht ewig für Rituale nutzbar. Genaueres dazu fi nden Sie im Kasten Materielle Verbindungen
ritualfeature.minion.desc        = Diese Rituale erschaffen halbautonome Wesen, meist zur Unterstützung des Zauberers, der sie geschaffen hat. Der erschaffene Diener ist an den Ritualleiter gebunden, der maximal so viele Diener gleichzeitig haben kann, wie sein Charismaattribut beträgt.
ritualfeature.spell.desc         = Dieses Ritual wird zusammen mit einem Zauber verwendet, den der Ritualleiter kennt. Einige Merkmale des Zaubers können sich dabei verändern, was in der Beschreibung des jeweiligen Rituals angegeben ist. Wenn der Ritualleiter für diesen Zauber Modifi katoren durch einen Schutzgeist erhält, gelten diese ebenfalls bei dem Ritual. Solche Rituale können durch Antimagie gebannt werden (siehe S. 294).
ritualfeature.spotter.desc       = Wenn das Ziel nicht im Blickfeld des Ritualleiters ist, muss er jemanden auswählen, der das Ziel an seiner Stelle sehen kann und als Späher dient. Der Späher muss ein Mitglied der Gruppe sein, die das Ritual durchführt \u2013 oder ein Geist, der an einen der Ritualteilnehmer gebunden ist \u2013, und muss das Ziel astral wahrnehmen können.

