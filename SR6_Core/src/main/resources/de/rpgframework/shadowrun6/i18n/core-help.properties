item.cyberunterarm,Synthetisch.desc=Synthetische Cybergliedmaßen sind als natürliche Gliedmaßen getarnt. Für die Entdeckung, dass sie kybernetisch sind, haben sie einen Tarnmodifikator von -8, wenn jemand nur hinschaut; aber auch synthetische Gliedmaßen sind offensichtlich künstlich, wenn man sie berührt.
item.cyberarm-gyrostabilisator.desc=Dieses Zubehör muss in einem partiellen oder ganzen Cyberarm installiert werden. Wenn der Gyrostabilisator aktiviert wird, schießen Gegengewichte aus dem Handgelenk, und ein kleiner Gyro dreht sich, um bessere Balance zu gewährleisten, den Rückstoß zu mindern und damit genaueres Schießen zu ermöglichen. Währenddessen werden kleine Kinder einen allerdings anstarren. Die Wirkung ist identisch mit der eine Gyrostabilisators, allerdings neutralisiert er nur 3 Punkte Rückstoß- und Bewegungsmodifikatoren, ide Wirkung ist nicht kumulativ.\nDas Aktivieren oder Deaktivieren des Sytems erfordert eine Einfache Handlung.
item.cyberunterschenkel,Offensichtlich.desc=Offensichtliche Cybergliedmaße sind sofort als künstlich erkennbar, solange sie nicht von Kleidung bedeckt sind. Sie sind häufig verchromt oder in matten Farben gehalten, aber offensichtlich mechanisch. Einige Leute mögen sie so offensichtlich und ausgefallen wie möglich, andere finden die Künstlichkeit abstoßend und verstörend. In einigen Kreisen können sie die sozialen Beziehungen beeinflussen, besonders in den höheren Kreisen des Gesellschaft und bei Puristen.
