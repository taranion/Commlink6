item.fokusformelZauberfokus.desc               = Wird zur Herstellung von Foki benötigt. Siehe Seite 306\n\nDie Formel definiert Art des Fokus \n(Geisterfokus, Kraftfokus, Metamagiefokus, Qui-Fokus, Verzauberungsfokus, \nWaffenfokus, Zauberfokus), seine Stufe, seine Gestalt (Stab, Totem, anderes...) und die \nMagische Tradition für die er nutzbar ist.
item.folding_stock.desc						   = Keine Beschreibung
item.fordAmerica.desc                          = Diese viertürige Limousine hat ein kleines Preisschild, einen großen Kofferraum und eine großzügige Sicherheitsausstattung, was sie jahrzehntelang zum meistverkauften Familienauto in Nordamerika machte, bevor sie diesen Titel an den Mercury Comet abgeben musste. Der Americar ist zuverlässig und wirtschaftlich, aber weder schnell noch sexy. Wenn man vier Metamenschen von A nach B transportieren muss, ist ein Ford Americar wahrscheinlich die einfachste und anonymste Methode dafür. Er fällt nicht auf und ist nicht modisch - und manchmal wird man getötet, wenn man auffällt.
item.formungsfokus.desc                        = Die Kraftstufe des Fokus wird zum Magieattribut seines \nBesitzers addiert, wenn bestimmt wird, wie stark er seine \nZauber formen kann.
item.fragmentation.desc                        = Diese klassischen Tötungsapparate verteilen eine tödliche Schrapnellwolke in einem großen Bereich und können weiche Ziele schwer verletzen.
item.full_body_armor_full_helmet.desc		   = Der passende Helm zu einer Ganzkörperpanzerung. Der Helm der Panzerung hat eine Kapazität von 6 und kann mit Sicht- und Audioverstärkungen ausgestattet werden.
item.full_body_armor_chemical_seal.desc		   = Die passende chemische Versiegelung für eine Ganzkörperpanzerung. Dies erlaubt vor toxischen Umgebungen und Angriffen zu schützen.
item.full_body_armor_environment_adaption.desc = Die Panzerung kann mit Umweltanpassung (heiße oder kalte Umgebungen) ausgestattet oder chemisch versiegelt werden
item.gamma_scopolamine.desc                    = Dieser besonders scheußliche Wirkstoff, der aus der Tollkirsche gewonnen wird, ist ein neuromuskulärer Blocker, der das Opfer lähmt. Die Wirkung des Toxins setzt sofort ein und verursacht Schwindel, Pupillenerweiterung, Sprachunfähigkeit, Delirium und Lähmung. Die Wirkung hält etwa eine Stunde an. Sobald die Primäreffekte abklingen, wirken die \u00DCberreste des Giftes für eine weitere Stunde als \u201EWahrheitsserum\u201C; die Willenskraft des Opfers sinkt für die verbleibende Wirkungsdauer um 3 (bis zu einem Minimum von 1).
item.gas-vent_system.desc					   = Gasventil-Rückstoßkompensationssysteme sind laufmontiert und lassen die Gase des Laufs einer Waffe in einem bestimmten Vektor entweichen, um dem Aufsteigen des Laufs entgegenzuwirken. Ein einmal eingebautes Gasventil kann nicht wieder entfernt werden. Gasventilsysteme gewähren eine Anzahl Punkte Rückstoßkompensation in Höhe ihrer Stufe.
item.gas_grenade.desc                          = Statt zu explodieren, gibt die Gasgranate eine Gaswolke in einem Bereich mit einem Radius von 10 Metern ab. Hierbei handelt es sich gewöhnlich um CS-/Tränengas, aber es können auch viele andere Chemikalien oder Toxine verwendet werden (s. Toxine, S. 410). Die Wolke existiert für etwa 4 Kampfrunden (kürzer bei Wind, länger in geschlossenen Räumen mit schlechter Lüftung, nach Maßgabe des Spielleiters).
item.gasmaske.desc                             = Dieses Atemgerät mit Sauerstoffversorgung bedeckt \ndas Gesicht vollständig und macht gegen Toxinangriffe\nmit Inhalationsvektor immun (s. Toxine, S. 410). Die\nGasmaske hat eine Luftversorgung für eine Stunde\n(Ersatz kostet 40 Nuyen) und kann an größere\nLufttanks angeschlossen werden. Sie kann nicht mit\neiner normalen Atemschutzmaske kombiniert werden.
item.geckotape-handschuhe.desc                 = Die äußere Schicht dieser Handschuhe besteht aus \neinem speziellen Trockenklebstoff, in dem Millionen\nvon mikroskopisch feinen Haaren enthalten sind, die\nan anderen Oberflächen haften. Einzeln sind diese\nHaftkräfte vernachlässigbar, aber zusammen sind sie\nstark genug, um sogar einen Troll kopfüber an einer\nDecke zu befestigen. Geckotape-Handschuhe \nkommen als Set, das Handschuhe, Kniepolster und \n\u00DCberziehsohlen enthält. Wenn man das Set trägt, \ngelten die Regeln für Klettern mit Ausrüstung \n(S. 134). Geckotape-Handschuhe sind in nassem \nZustand nutzlos.
sensorfunction.geiger_counter.desc                        = Dieser Sensor detektiert die Menge der ihn umgebenden Radioaktivität.
item.gel_rounds.desc                           = Diese weniger tödliche Munition verwendet eine harte, geleeartige Substanz, die eine sicherere Alternative zu Gummimunition ist. Gelmunition wird häufig bei der Aufstandsbekämpfung verwendet. Die gewöhnlich halbsteifen Kugeln werden beim Aufprall geplättet und verteilen ihre kinetische Energie dadurch auf einen größeren Bereich des Körpers. Gelmunition verursacht Geistigen Schaden (DK +1) und senkt das Körperliche Limit des Ziels um 2, wenn auf Niederschlag geprüft wird (s. Niederschlag, S. 195).
item.geruchsbooster.desc                       = Diese Cybernase verstärkt, identifiziert und zeichnet Gerüche auf und kann sie später wiedergeben. Die extrem verstärkten Geruchsfähigkeiten eines Schnüfflers eröffnen einem eine ganz neue Welt sensorischer Daten - man kann Dinge wahrnehmen, die sonst nur ein Bluthund wahrnehmen würde. Man kann die Emotionen von Leuten in ihrem Schweiß riechen (und, sofern vorhanden, die Herstellermarkierung ihrer maßgeschneiderten Pheromone), Spuren von Munitionstreibladungen oder biologische und chemische Kampfmittel - die Liste ließe sich praktisch endlos fortführen.\nEine Abschaltfunktion erlaubt es, intensive Gerüche komplett zu ignorieren - vielleicht die angenehmste Eigenschaft im täglichen Leben. Der Geruchsbooster kann sogar in der VR verwendet werden, um eine noch eindringlichere Erfahrung zu erschaffen.\nDie Stufe des Boosters wird als Würfelpoolbonus zu Wahrnehmungsproben addiert, die auf Geruch basieren.
sensorfunction.olfactory_sensor.desc                       = Der Geruchsscanner fängt die Moleküle in der Luft ein und analysiert sie. Er funktioniert genauso wie Geruchsbooster-Cyberware.
item.geschmacksbooster.desc                    = Diese verstärkten Geschmacksknospen  verstärken, identifizieren und zeichnen Geschmäcker auf und können sie später wiedergeben. Die extrem verstärkten Fähigkeiten eröffnen einem eine ganz neue Welt sensorischer Daten - man kann Dinge wahrnehmen, die sonst nur ein Bluthund wahrnehmen würde. Man kann die Emotionen von Leuten in ihrem Schweiß schmecken (und, sofern vorhanden, die Herstellermarkierung ihrer maßgeschneiderten Pheromone), Spuren von Munitionstreibladungen oder biologische und chemische Kampfmittel - die Liste ließe sich praktisch endlos fortführen.\nEine Abschaltfunktion erlaubt es, intensive Geschmäcker komplett zu ignorieren - vielleicht die angenehmste Eigenschaft im täglichen Leben. Er lässt einen außerdem Geschmacksdaten in der AR und VR mit einer 'Geschmacksspur' erleben \u2013 cavet emptor dabei, Chummer.\nDie Stufe des Boosters wird als Würfelpoolbonus zu Wahrnehmungsproben addiert, die auf Geschmack basieren.
item.gm-nissanDobermann.desc                   = Diese auf Ketten fahrende Perimeter-\n\u00DCberwachungsdrohne kann den ihr zugewiesenen\nBereich bei Tag und Nacht effektiv sichern. Sie ist mit\neiner normalen Waffenhalterung ausgestattet. Diese\nDrohne wird mit der Fertigkeit Bodenfahrzeuge \ngesteuert.
item.gmcBanshee.desc                           = Dieser \u00C3\u00BCberschallschnelle Panzer ist der klassische T-Bird, und er hat die Panzerung,\ndie Bewaffnung und die Sensoren, um es zu beweisen. Diese Vektorschubmaschine \nwird f\u00C3\u00BCr Aufkl\u00C3\u00A4rungs- und Kurierdienste eingesetzt und ist - durch ihre F\u00C3\u00A4higkeit, \nunter dem Radar mit hoher Geschwindigkeit durch Canyons zu fliegen - ein \nFavorit von Eliteschmugglern f\u00C3\u00BCr dramatische Grenz\u00C3\u00BCberquerungen.
item.gmcBulldog.desc                           = Dieser Dauerbestseller vom GM ist ein geräumiger (und gepanzerter!) Lieferwagen, der bei jedem beliebt ist - egal ob legale Fracht- und Logistikfirmen, Sicherheitsbehörden, Mafiacrews oder Shadowrunner. Er hat eine Menge Platz für Passagiere, Ausrüstung oder was auch immer man transportieren muss, und außerdem einen Motor und ein Fahrwerk, die eine Menge aushalten.
item.grosserSchmuggelbehaelter.desc			   = Dies ist eine größere Version des Schmuggelbehälters (S. 461). Er kann Gegenstände bis zur Größe einer Schweren Pistole oder einer kleinen MP (nach Maßgabe des Spielleiters \u2013 denken Sie bei der Größe einfach an eine Butterbrotdose) aufnehmen. Etwas herauszunehmen oder hineinzulegen erfordert eine Komplexe Handlung.
item.gussformfuerabdruckhandschuhe.desc        = Dieses Gerät nimmt einen Finger- oder Handabdruck\nund formt einen "Handschuh", den man tragen kann,\num den Abdruck zu imitieren und damit einige\nbiometrische Schlösser zu überlisten (s. Magschlösser,\nS. 362).
item.gyro_mount.desc						   = An diesem schweren Oberkörpergeschirr ist ein beweglicher, motorisierter und gyrostabilisierter Arm befestigt, der ein Sturmgewehr oder eine schwere Waffe aufnehmen kann. Das System neutralisiert bis zu 6 Punkte Rückstoß- und Bewegungsmodifi katoren. Das Befestigen oder Entfernen einer Waffe erfordert eine Einfache Handlung. Das Anlegen des Geschirrs dauert etwa fünf Minuten, während das Ablegen dank des Schnellöffners innerhalb einer Komplexen Handlung erfolgen kann.
item.harley-davidsonScorpion.desc              = Dieses Motorrad ist ein klassischer, schwerer, verchromter Chopper, gepanzert und designt, um einzuschüchtern. Es ist sehr beliebt bei einem bestimmten Typ von Go-Gangern, sowie Orks und Trollen, die sich nicht um so unwichtige Dinge wie "Verkörperung eines Klischees" kümmern. Dieses Motorrad ist sogar robust genug fürs Combatbiking.
item.hauttasche.desc                           = Diese Hautfalte kann irgendwo am Körper platziert werden. Eine nervenlose \u201EScheide\u201D\naus Fleisch, die durch die Falte verborgen wird, ist perfekt, um einen kleinen\nGegenstand zu verstecken \u2013 sie ist die Biowareversion des Schmuggelbehälters. Die\nHauttasche hat einen Tarnmodifkator von -10. Einen Gegenstand aus der Hauttasche\nzu nehmen oder in sie hineinzustecken erfordert eine Komplexe Handlung.
item.hazmat-anzug.desc                         = Der Hazmat-Anzug bedeckt den ganzen Körper und\nenthält einen internen Lufttank mit einer \nLuftversorgung für vier Stunden. Solange er nicht\nbeschädigt ist wird, bietet er Chemische Versiegelung\n(S. 441) und schützt vor Toxinangriffen mit Kontakt-\nund Inhalationsvektor (s. Toxine, S. 410). Viele Hazmat-\nAnzüge sind serienmäßig mit einem Geigerzähler\n(S. 450) ausgestattet.
item.herbeirufungsfokus.desc                   = Geisterfoki verstärken die Beschwörungsfertigkeit eines Zauberers. Jeder Geisterfokus\nwird bei seiner Herstellung auf eine Geisterart eingestimmt, die danach nicht mehr \nverändert werden kann.\n\nEin Herbeirufungsfokus addiert seine Kraftstufe als Würfelpoolbonus zu Herbeirufenproben,\nsolange die Art des herbeigerufenen Geistes zum Fokus passt.
item.hidden_arm_slide.desc					   = Diese Gleitschiene wird am Unterarm befestigt unter der Kleidung getragen und kann eine pistolengroße Waffe aufnehmen. Der Springarm kann mit einer Holdout-Pistole, einer leichten Pistole oder einem Taser ausgestattet werden. Aktiviert durch eine bestimmte Handbewegung, schiebt der Springarm die Waffe/das Objekt genau in die Hand des Charakters. Wenn man die Waffe im Springarm schnellzieht, beträgt der Schwellenwert für das Schnellziehen 2. Außerdem gewährt der Springarm einen zusätzlichen Tarnmodifi kator von -1 für die Waffe.
item.high_explosive.desc                       = Diese Granaten verursachen eine große Druckwelle und konzentrierte Schmerzen.
item.hochleistungsgelenke.desc                 = Eine Reihe von Prozeduren wie Beschichtung und erneute Nachschmierung der\nGelenkoberflächen sowie Verstärkung von Sehnen und Bändern führt zu einem\nfüssigeren Zusammenspiel von Muskeln und Gelenken. Hochleistungsgelenke\ngewähren einen Würfelpoolmodifkator von +1 auf die Fertigkeit Entfesseln und eine\nErhöhung von +1 auf das Körperliche Limit (kumulativ mit anderen Limitmodifkatoren).
item.hollow_points.desc                        = Hohlspitz- oder Dum-Dum-Geschosse haben eine ausgehöhlte Geschossspitze, sodass sie beim Aufprall \u201Eaufpilzen\u201D und sich ausdehnen. Dadurch werden sie zu tödlichen Fragmenten, ähnlich wie Flechettemunition, obwohl Hohlspitzmunition eine viel ältere Technologie ist. Wie Flechettemunition ist auch Hohlspitzmunition wirksamer gegen ungepanzerte Ziele und neigt dazu, an Panzerung hängenzubleiben.
item.hondaSpirit.desc                          = Dieser geschmeidige dreirädrige Zweisitzer wird von einem Elektromotor angetrieben und ist bei Pendlern sehr beliebt. Der Spirit hat ein blasenförmiges Verdeck für schlechtes Wetter, das mit einer chemischen Beschichtung versehen ist, die "garantiert 89% des sauren Regens neutralisiert".
item.horizonFlyingEye.desc                     = Diese kugelförmige Flugdrohne verwendet omnidirektionale Schubdüsen, um in der\nLuft zu bleiben. Sie ist etwa so groß wie ein Augapfel und kann sich selbst auf dem\nBoden vorwärtsrollen, muss aber fliegen, um Hindernisse wie etwas Treppen oder\nBordsteine zu überwinden. Diese Drohne wird mit der Fertigkeit Flugzeuge gesteuert.
item.horizonFlyingEyeMitFlash-pak.desc         = Diese kugelförmige Flugdrohne verwendet omnidirektionale Schubdüsen, um in der\nLuft zu bleiben. Sie ist etwa so groß wie ein Augapfel und kann sich selbst auf dem\nBoden vorwärtsrollen, muss aber fliegen, um Hindernisse wie etwas Treppen oder\nBordsteine zu überwinden. Diese Version beinhaltet ein Flash-Pak und eine \nRauchgranate. Die Detonation zerstört die Drohne. Diese Drohne wird mit der \nFertigkeit Flugzeuge gesteuert.
item.hyperschilddruese.desc                = Die Hyperschilddrüse wird auf der normalen Schilddrüse platziert und ersetzt ihre\nmetabolischen Funktionen. Der verbesserte Metabolismus produziert mehr Energie\nund lädt den Charakter praktisch auf. Weil er aufgeladen ist, braucht er auch mehr\nEnergie \u2013 um seinen optimierten Metabolismus mit Energie zu versorgen, muss er\ndoppelt so viel wie normal essen. Der Charakter erhält je +1 auf seine Konstitution,\nGeschicklichkeit, Reaktion und Stärke und muss 25 % mehr für seinen Lebensstil\nausgeben. Und vielleicht wird er ein bisschen hyperaktiv.
item.hyundaiShin-hyung.desc                    = Diese billige viertürige Sportlimousine ist ein schnelles, PS-starkes Auto für die Konzernjugend, die damit ihren Freunden auf sozial akzeptable und konstruktive Weise ihren Schneid beweisen kann. Der Shin-Hyung ist serienmäßig zu niedrigen Preisen zu haben, wird aber häufig so weit von Tunern und Straßenrennenfans modifiziert, dass er deutlich leistungsstärker und kaum noch wiederzuerkennen ist. Der Shin-Hyung ist erschwinglich, schnell und wendig. Was sonst braucht man noch? Damit ist er sowohl bei bei Triaden- und Yakuzamitgliedern als auch bei den wohlhabenderen Straßengangs und reichen Söhnchen beliebt geworden, die sich unters gemeine Volk mischen wollen.
item.imaging_scope.desc						   = Diese klassischen Fernrohre werden aufmontiert; das Befestigen oder Entfernen erfordert eine Einfache Handlung. Zielfernrohre sind mit einer Mikrokamera und Sichtvergrößerung ausgestattet und haben eine Kapazität von 3 für zusätzliche Sichtverstärkungen (S. 448).
item.infrarotsicht_capacity.desc               = Diese Sichtverstärkung ermöglicht das Sehen im infraroten Spektrum, wodurch man Hitzemuster erkennen kann. Das ist eine sehr praktische Methode, um Lebewesen in völliger Dunkelheit zu entdecken, um zu prüfen, ob ein Motor oder eine Maschine vor Kurzem gelaufen ist, und für ähnliche Zwecke.
item.infrarotsicht_essence.desc               = Diese Sichtverstärkung ermöglicht das Sehen im infraroten Spektrum, wodurch man Hitzemuster erkennen kann. Das ist eine sehr praktische Methode, um Lebewesen in völliger Dunkelheit zu entdecken, um zu prüfen, ob ein Motor oder eine Maschine vor Kurzem gelaufen ist, und für ähnliche Zwecke.
item.injection_darts.desc                      = Injektionspfeile sind für verschiedene Arten von Pfeilwaffen gedacht, wie etwa die Parashield Pfeilpistole oder das Parashield Pfeilgewehr. Jeder Injektionspfeil enthält eine Dosis einer Droge oder eines Toxins (die separat gekauft werden muss). Die Wirkung des Pfeils hängt von der geladenen Droge ab, aber um dem Ziel die Ladung erfolgreich zu verabreichen, muss der Angriff mit dem Pfeil mindestens 1 Nettoerfolg gegen ein ungepanzertes Ziel und mindestens 3 Nettoerfolge gegen ein gepanzertes Ziel erzielen. Dies ist ein Toxinangriff mit Injektionsvektor.
item.insulation.desc						   = Thermalfasern und hitzehaltende Materialien schützen den Träger gegen Kälteschaden (S. 175). Addieren Sie die Stufe der Thermischen Isolierung zum Panzerungswert, wenn Kälteangriffen widerstanden wird.
item.jazz.desc                                 = Jazz ist ein Aufputschmittel, mit dem ein durchschnittlicher Gesetzeshüter seine Chancen gegen einen aufgerüsteten Straßensamurai verbessern kann. \u00DCblicherweise wird es durch einen Einzel-Dosis-Inhalator (oder \u201EPopper\u201C) verabreicht.\nWenn die Wirkung nachlässt, bricht der Konsument zusammen und wird von Verzweifl ung und Elend überschwemmt. Außerdem leidet er über einen Zeitraum, der der Wirkungsdauer der Droge entspricht, an Desorientierung (S. 410).\nWenn Cram die Leute schon hyperaktiv und nervös macht, dann macht Jazz sie so zappelig und überdreht wie einen Zweijährigen auf Koffein. Rollenspielerisch ist ein Jazz-Konsument ein bis zum Anschlag aufgedrehter Typ mit mehr Energie, als er verbrennen kann.
sensorfunction.camera.desc                         = Kameras können Fotos, Videos und Trideos (einschließlich Ton) aufnehmen. Sie können mit Sicht- und Audioverstärkungen ausgestattet werden. (Beschreibung S. 447)
item.kamikaze.desc                             = Kamikaze ist eine Designer-Kampfdroge. Wenn die Wirkung nachlässt, bricht der Benutzer zusammen und erleidet für einen Zeitraum, der der Wirkungsdauer der Droge entspricht, -1 Reaktion, -1 Willenskraft und -2 auf alle Limits sowie 6 Kästchen Geistigen Schaden, denen nicht widerstanden werden kann.\nWiederholte Benutzung von Kamikaze hat vernichtende Auswirkungen auf den Metabolismus des Konsumenten.\nGrößere Dosen können Erregungszustände, Muskelzittern, plötzliche Euphorie und Pupillenerweiterung hervorrufen. Exzessive Dosen (an der Grenze zur \u00DCberdosis) verursachen Beklemmungsgefühle, Halluzinationen und unkontrollierte Muskelbewegungen. Noch höhere Dosen führen zum Tode. Kamikaze-Konsumenten sind halb wahnsinnig, fühlen sich überlegen und unbesiegbar und scheren sich nicht um ihr eigenes Wohlergehen. Es kann ganz unterhaltsam sein, ihnen zuzusehen, solange man nicht in ihrer Angriffsrichtung steht.
item.katalysatorstab.desc                      = Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische\nReaktion dazu,dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren \nhinterlässt. Der Katalysatorstab ist wiederverwendbar.
item.katzenaugen.desc                          = Diese transgenen bottichgezüchteten Implantate sind buchstäblich Katzenaugen mit\neinem modifizierten DNA-Profil und okzipitalen Verbindungsstrukturen. Die Struktur\nvon Katzenaugen verstärkt das Licht und verbessert die Nachtsicht, sodass sie\nRestlichtverstärkung bieten. Katzenaugen sind geschlitzt und reflektierend, genauso\nwie die einer Katze. Diese Bioware ist offensichtlich nicht kompatibel mit \nAugen-Cyberware.
item.kleber-loesungsmittel.desc                = Diese Spraydose enthält genug Lösungsmittel, um\netwa einen Quadratmeter schnelltrocknenden\nAerosol-Superkleber zu entfernen.
item.kletterausruestung.desc                   = Dies ist ein Rucksack voller Seil (mit 400 Kilogramm\nTragkraft), einem Klettergeschirr, Handschuhen,\nKarabinern, Steigeisen und weiteren Dingen, die für\ndas Klettern mit Ausrüstung benötigt werden (s. \nKlettern, S. 134).
item.kletterhandschuhe.desc                    = Diese Handschuhe bestehen aus einem speziellen Gewebe, das einen besseren Griff am Seil erlaubt und einen Würfelpoolbonus von +2 für alle Proben verleiht, bei denen es darum geht, sich am Seil festzuhalten. Diese Handschuhe sind notwendig, um ultradünnes Microwire zu verwenden, ohne sich die Hände aufzuschlitzen, während man daran herunterrutscht.
item.kommlink.desc                             = Die implantierte Version des Kommlinks (GRW S. 442) ist ohne zusätzliche Kosten mit einem Sim-Modul ausgestattet. \nIm allgemeinen werden Kommlinks mit einer Gerätestufe von weniger als 5 aus Sicherheitsgründen nicht im Schädel eingebaut.\nDer Preis bezieht sich nur auf den Einbau, das Kommlink muss noch separat bezahlt werden.
item.kommlink_cybergliedmasseinbau.desc        = Die implantierte Version des Kommlinks (GRW S. 442) ist ohne zusätzliche Kosten mit einem Sim-Modul ausgestattet. \nIm allgemeinen werden Kommlinks mit einer Gerätestufe von weniger als 5 aus Sicherheitsgründen nicht im Schädel eingebaut.\nDer Preis bezieht sich nur auf den Einbau, das Kommlink muss noch separat bezahlt werden.
item.kraftfokus.desc                           = Kraftfoki tragen ihren Namen zu Recht. Sie sind sehr mächtige Artefakte, die ihre Kraftstufe zu Hexerei-, Beschwörungs- und Verzauberungswürfelpools sowie zu allen Proben addieren, bei denen das Attribut Magie verwendet wird. Kraftfoki können jede Form annehmen, aber Ringe und Amulette sind besonders beliebt.
sensorfunction.laser_range_finder.desc              = Dieser einfache Sensor sendet einen Laserstrahl aus, der von der Oberfläche eines Ziels reflektiert und von einem Detektor erfasst wird, um die genaue Entfernung zum Ziel zu berechnen.
sensorfunction.laser_microphone.desc                  = Dieser ausgeklügelte Sensor wirft einen Laserstrahl gegen einen festen Gegenstand wie etwa eine Fensterscheibe, liest die Vibrationen auf der Oberfläche und übersetzt sie in die Geräusche, die auf der anderen Seite der Oberfläche ertönen. Die maximale Reichweite beträgt 100 Meter. Ein Lasermikrofon kann nicht die Audioverstärkung Richtungsdetektor aufnehmen.
item.laser_sight.desc					   	   =  Dieses Gerät verwendet einen Laserstrahl, um einen sichtbaren Punkt (in einer frei wählbaren Farbe) auf das Ziel zu projizieren. Dies erhöht die Präzision der Waffe um 1, was nicht mit Smartlink-Modifi katoren kumulativ ist. Der Lasermarkierer kann entweder unterlauf- oder aufmontiert werden. Das Aktivieren oder Deaktivieren des Lasermarkierers erfordert eine Einfache Handlung.
item.leuchtstab.desc                           = Wenn man den Leuchtstab knickt und schüttelt, erhält man für drei Stunden eine \nsanfte chemische Beleuchtung, die einen Radius von zehn Metern erhellt.
item.lockheedOptic-x2.desc                     = Diese VSTOL-Stealthdrohne ist, mit für den Transport\neingeklappten Flügeln, nur so groß wie ein Cyberdeck.\nMit ausgeklappten Flügeln ist sie so groß wie ein großer\nFalke. Ihre patentierte signaturreduzierende \nTechnologie macht sie bei Geheimdiensten und\nShadowrunnern sehr beliebt. Radarsysteme sowie\nWahrnehmungsproben auf Sicht und Gehör erhalten\neinen Würfelpoolmodifikator von -3 zum Entdecken\nder Optic-X2. Diese Drohne wird mit der Fertigkeit\nFlugzeuge gesteuert.
item.long_haul.desc                            = Long Haul ist eine Kombination aus synthetisierten Hormonen und anderen Chemikalien, die sich auf das Nervensystem auswirken. Es stimuliert das Gehirn und schaltet beim Anwender das Bedürfnis nach Schlaf aus. Ein Long-Haul-Konsument kann vier Tage lang wach bleiben \u2013 ohne Modifi katoren durch Müdigkeit oder Erschöpfung zu erleiden. Nach Ablauf dieses Zeitraums fällt er jedoch sofort für 8W6 Stunden in einen tiefen Schlaf. Wird der Charakter während dieses Erholungszeitraums wachgehalten, leidet er an Desorientierung (S. 410) und Halluzinationen und kann sich nicht konzentrieren.\nWird eine weitere Dosis Long Haul verabreicht, nachdem die Wirkungsdauer der ersten abgelaufen ist, kann der Charakter für weitere 1W6 \u00F7 2 Tage wach bleiben. Danach erleidet er 10 Kästchen Geistigen Schaden, denen nicht widerstanden werden kann, und schläft für 8W6 Stunden. Noch länger kann die Droge einen Charakter nicht wachhalten, egal wie viele zusätzliche Dosen er auch verabreicht bekommt.
item.low_light_vision_capacity.desc			= Dieses Zubehör erlaubt es einem, sogar dann noch normal zu sehen, wenn die einzige Lichtquelle die Sterne am Himmel sind. Es hilft allerdings nicht in totaler Dunkelheit.
item.low_light_vision_essence.desc			= Dieses Zubehör erlaubt es einem, sogar dann noch normal zu sehen, wenn die einzige Lichtquelle die Sterne am Himmel sind. Es hilft allerdings nicht in totaler Dunkelheit.
item.luftroehrenfilter.desc                = Dieses zusätzliche Organ wird am oberen Ende der Luftröhre implantiert. Es kann\nUnreinheiten aus der Luft absorbieren und sie davon abhalten, die Lunge zu erreichen.\nDer Luftröhrenfilter addiert seine Stufe als Würfelpoolmodifikator zu\nToxinwiderstandsproben gegen Toxine mit Inhalationsvektor.
sensorfunction.mad_scanner.desc                = Der MAD-Scanner (Magnetanomaliedetektion) wird für die Entdeckung von Waffen und anderen Metallkonzentrationen verwendet. Er hat eine maximale Reichweite von 5 Metern.
item.magnesiumfackel.desc                      = Anzünden und aktivieren für fünf Minuten helles Fackellicht.
item.magnetkarten-kopierer.desc                = Der Magnetkarten-Kopierer erlaubt es dem Benutzer,\nin Sekundenschnelle eine (gestohlene) Magnetkarte\nauszulesen. Danach kann eine neue Magnetkarte mit\neiner Hardware-Kiste, zehn Minuten Zeit und einer\nProbe auf Hardware + Logik [Geistig] (2) hergestellt\nwerden. Wenn sie verwendet wird, verwendet die\ngefälschte Magnetkarte ihre doppelte Stufe in einer\nvergleichenden Probe gegen das doppelte der \nMagschlossstufe (s. Magschlösser, S. 362). Einige \nSicherheitssysteme bemerken ungewöhnliche \nVerwendungen von "Zweitschlüsseln", etwa wenn \n"Dr. Müller" ein Labor betritt, das sie schon zuvor\nbetreten und noch nicht wieder verlassen hat.
item.magschloss.desc                           = Magschlösser sind elektronische Schlösser mit einer\nReihe von Zugangskontrolloptionen, von biometrischen\nScannern über Magnetkarten bis hin zu RFID-Karten.\nWeitere Informationen über Magschlösser und ihre\nOptionen finden Sie unter Magschlösser, S. 362.
item.magschlossknacker.desc                    = Diese Magschloss-"Rohkarte" kann in den Kartenleser\njedes Magschlosses eingeschoben werden und lässt\nihn glauben, dass eine legitime Zugangskarte \neingeschoben wurde (s. Magschlösser, S. 362).
item.maskierungsfokus.desc                     = Beim Widerstand gegen Askennenproben durch Maskierung\nwird die Kraftstufe des Fokus als Bonus zum Würfelpool \nseines Besitzers addiert. Die Anzahl der gebundenen Foki, \ndie der Initiat maskieren kann, steigt dadurch nicht.
item.materialienFuerMagischeRefugien.desc      = Magische Refugien siehe Seite 278!
item.massgeschneidertePheromone.desc       = Diese Pheromone sind speziell maßgeschneidert, um andere zu beeinflussen, und\nkönnen willentlich ausgestoßen werden. Sie addieren ihre Stufe als \nWürfelpoolmodifikator zu Fertigkeitsproben mit Fertigkeiten der Schauspielerei- und\nEinfluss-Fertigkeitsgruppe, aber nur, wenn sich die Person, gegen die der Charakter\ndie Pheromone einsetzt, in bequemer Unterhaltungsentfernung befindet \u2013 wenn sie\nihn nicht riechen kann, funktionieren die Pheromone nicht. Maßgeschneiderte\nPheromone wirken auch auf einen selbst, sodass man sich besser mit sich selbst fühlt:\nDas Soziale Limit erhöht sich um ihre Stufe. Maßgeschneiderte Pheromone haben keine\nAuswirkungen auf magische Fähigkeiten und Proben.
item.mct-nissanRoto-drohne.desc                = Die Roto-Drohne ist eine einfache Rotordrohne, die\nhochmodular und anpassbar ist. Um zu ermitteln, wie\nviele Waffenhalterungen und sonstige Anpassungen sie\naufnehmen kann, gilt ihr Rumpf als 3 höher als \nangegeben (und ja, das heißt, dass man sie mit einer\nSchweren Waffenhalterung ausrüsten kann). Diese\nDrohne wird mit der Fertigkeit Flugzeuge gesteuert.
item.mctFly-spy.desc                           = Diese Drohne von Mitsuhama hat die Größe und Form eines großen Insekts, kann aber \ndeutlich höher fliegen. Sie kann als "Auge am Himmel" dienen und ist - weil sie \nziemlich schwer zu entdecken ist - gut geeignet, um Leute zu beschatten. Diese\nDrohne wird mit der Fertigkeit Flugzeuge gesteuert.
item.medkit-nachfuellpack.desc                 = Nachfüllpack für Medkit (S. 454)
item.medkit.desc                               = Das Medkit enthält Medikamente, Verbände, \nWerkzeuge und ein (redseliges) Arzt-Expertensystem,\ndas den Nutzer bezüglich der gängigsten \nmedizinischen Notfälle (einschließlich \nKnochenbrüchen, Schusswunden, chemische \nWunden und Vergiftungen sowie der Behandlung \nvon Schock, Blutverlust und natürlich \nWiederbelebungen) beraten kann. Addieren Sie die \nStufe des Medkits zum Limit bei Proben auf erste \nHilfe. Ein Medkit der Stufe 3 oder niedriger passt in \neine Tasche, ein Medkit mit Stufe 4+ ist etwa \naktenkoffergroß. Das Medkit muss alle (Stufe) \nVerwendungen wiederaufgefüllt werden.\n
item.metall-handschellen.desc                  = Normale Metallhandschellen (Panzerung 16, Struktur 2)\nverfügen über ein mechanisches oder ein WiFi-\nkontrolliertes Schloss (s. Barrieren, S. 196).
item.metallhandschellen.desc                   = Normale Metallhandschellen (Panzerung 16, Struktur 2)\nverfügen über ein mechanisches oder ein WiFi-\nkontrolliertes Schloss (s. Barrieren, S. 196).
item.microwire,100m.desc                       = Dieses Seil besteht aus einer extrem dünnen (fast monofilamentdünnen) und\nwiderstandsfähigen Faser: eine große Länge davon kann auf sehr kleinem Raum\nverstaut werden, und es ist sehr schwer zu sehen. Der Nachteil ist, dass man es \nnur mit speziellen, schützenden Kletterhandschuhen greifen kann, ohne sich die\nHandaufzuschlitzen. Sonst verursacht das Seil 8K Schaden mit einer DK von -8.
item.mikrobombe.desc                           = Diese illegale Methode der Nötigung soll nicht nur einen Teil des Kopfes des Opfers beschädigen, sondern es töten.\nDie Bomben können fern- oder zeitgesteuert gezündet werden oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen.\nSie können auch in Cybergliedmaßen eingebaut werden, siehe dazu den Einbau Mikrobombe(Cybergliedmaß).
item.mikrobombe_cybergliedmass.desc            = Diese illegale Methode der Nötigung wird zusätzlich in ein Cybergliedmaß eingebaut und soll das ganze Gliedmaß aber nicht den oder den Träger töten.\nDie Bombe kann fern- oder zeitgesteuert gezündet werden oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgeht.
sensorfunction.omni_directional_microphone.desc                       = Ein normales omnidirektionales Audioaufnahmegerät. Ist gewöhnlich eingebaut in oder (kabellos) verbunden mit einem Kommlink oder einem anderen Aufnahmegerät.
item.mini-schweissgeraet.desc                  = Dieses tragbare Schweißgerät erzeugt einen kleinen\nLichtbogen, um Metalle zu schmelzen, entweder um\ndurch Metalle zu schneiden oder sie \nzusammenzuschweißen. Seine Energiequelle reicht für\n30 Minuten Betrieb. Der Lichtbogen erzeugt zwar eine\ngroße Hitze, ist aber viel zu klein, um eine gute Waffe\nabzugeben (das wäre, als würde man versuchen, \njemanden mit einem Feuerzeug zu stechen). Das Mini-\nSchweißgerät hat einen Schadenscode von 25, wenn \nman es verwendet, um durch Barrieren zu schneiden.
item.mini-schweißgerät.desc          = Dieses tragbare Schweißgerät erzeugt einen kleinen\nLichtbogen, um Metalle zu schmelzen, entweder um\ndurch Metalle zu schneiden oder sie \nzusammenzuschweißen. Seine Energiequelle reicht für\n30 Minuten Betrieb. Der Lichtbogen erzeugt zwar eine\ngroße Hitze, ist aber viel zu klein, um eine gute Waffe\nabzugeben (das wäre, als würde man versuchen, \njemanden mit einem Feuerzeug zu stechen). Das Mini-\nSchweißgerät hat einen Schadenscode von 25, wenn \nman es verwendet, um durch Barrieren zu schneiden.
item.mini-signalrakete.desc                    = Munition für den Mini-Sigalraketenwerfer.
item.mini-signalraketenkanone.desc             = Die Signalraketenkanone kann farbige Leuchtraketen bis zu 200 Meter hoch in die\nLuft schießen und dadurch ein paar Minuten lang ein Gebiet von der Größe eines\nHäuserblocks beleuchten, was den Modifikator für Teil- oder Schwache Beleuchtung\neliminiert. Wenn man damit auf jemanden schießt, komt die Fertigkeit Exotische\nFernkampfwaffe zur Anwendung. Die Mini-Signalrakete verursacht 5K Feuerschaden.
item.minischweissgeraettreibstoffkanister.desc = Zum Auffüllen des Mini-Schweißgeräts (S. 452).
item.mitsubishiNightsky.desc                   = Dekadent, sicher und Hightech - diese gepanzerte Limousine istnicht für Runner. Sie ist für Konzernexecs, Medienstars und Mr. Johnson; nur in ihrer Gesellschaft wird der gemeine Runner das geräumige Innere und die luxuriösen Annehmlichkeiten dieses Autos genießen.
item.mnemoverstaerker.desc                 = Dieses hochkonzentrierte Wachstum von grauer Substanz wird an den\nGedächtniszentren des Gehirns befestigt, was sowohl das Kurz- als auch das\nLangzeitgedächtnis verbessert. Die Stufe des Mnemoverstärkers addiert sich als\nWürfelpoolbonus zu Wissensfertigkeits-, Sprachfertigkeits- und gedächtnisbezogenen\nProben sowie zum Geistigen Limit.
item.monofilamentkettensaege.desc              = Die obere Seite jedes Kettensegments dieser tragbaren\nMotorsäge ist mit Monofilamentdraht bedeckt.\nDadurch ist die Säge ideal zum Durchschneiden von\nBäumen, Türen und anderen unbeweglichen Objekten.\nEine Monofilamentkettensäge ist zu unhandlich, um \neine gute Nahkampfwaffe abzugeben (verwenden Sie\ndie Fertigkeit Exotische Nahkampfwaffe). Gegen\nBarrieren wird der Schadenscode von 8K der\nMonofilamentkettensäge verdoppelt.
item.moodchip.desc                             = Moodchips konzentrieren sich auf die Gefühlsebene und besonders intensive emotionale Empfi ndungen. Die Themen können das gesamte Spektrum von Euphorie über sexuelle Erregung bis hin zu Angst und Hass umfassen. Wenn das BTL-Programm abgelaufen ist, bricht der Konsument meistens zusammen und verspürt oft für eine oder zwei Stunden die genau entgegengesetzte Emotion. Moodchips sind die häufi gsten BTLs auf der Straße. Das RAS-Override ist dabei oft deaktiviert, sodass der Benutzer sich frei bewegen kann, während er unter dem Einfl uss des Chips steht.
item.morganCutlass.desc                        = Dieses häufig gesehene Patrouillenboot ist mit einem paar schwerer, manuell\nbedienter Waffenhalterungen (die gewöhnlich mit LMGs ausgerüstet sind) und\neinem leistungfähigen Sensorpaket ausgestattet.
item.muskelstraffung.desc                      = Diese Behandlung verstärkt die Elastizität der Muskelfasern in existierenden Muskeln,\nwas zu einem verbesserten Muskeltonus und erhöhter Flexibilität führt und eine\ngeschmeidige, athletische Figur macht. Muskelstraffung addiert ihre Stufe zur\nGeschicklichkeit des Charakters. Diese Bioware ist nicht kompatibel mit der Cyberware\nKunstmuskeln.
item.muskelverstaerkung.desc               = Diese biologische Webbehandlung verstärkt existierendes Muskelgewebe, statt es\ndurch bottichgezüchtete Muskeln zu ersetzen. Speziell gezüchtete Muskelstränge\nwerden in existierende Muskelfasern gewoben, erhöhen die Muskelmasse und rohe\nStärke und sorgen auch für ein massigeres Aussehen. Muskelverstärkung addiert ihre\nStufe zur Stärke des Charakters. Diese Bioware ist nicht kompatibel mit der Cyberware\nKunstmuskeln.
item.myomerischesSeil,100m.desc                = Dieses Seil besteht aus einer speziellen Myomerfaser und kann (bis zu einer maximalen\nLänge von 30 Metern) ferngesteuert bewegt werden. Zum Beispiel kann man es wie \neine Schlange um ein Hindernis winden oder sich an einem Vorsprung winden\nlassen. Das Seil bewegt sich mit einer Rate von 2 Metern pro Kampfrunde
item.narcojet.desc                             = Dieses beliebte Betäubungsmittel wird meistens mit Pfeilpistolen verschossen. Es hat keine Nebenwirkungen.
item.nausea_gas.desc                           = Dieses oft bei der Aufruhrbekämpfung eingesetzte Gas verursacht \u00DCbelkeit und einen starken Brechreiz. Es verliert nach 2 Minuten Luftkontakt seine Wirkung.
item.neuro_stun_10.desc                        = Neuro-Stun ist farb- und geruchslos. Es ist der Industriestandard für Betäubungsgase zum Einsatz in Notfallsituationen und in unterschiedlichen Konzentrationen erhältlich.\nNeuro-Stun VIII wird nach 10 Minuten Luftkontakt unwirksam, Neuro-Stun IX und X nach 1 Minute.
item.neuro_stun_8.desc                         = Neuro-Stun ist farb- und geruchslos. Es ist der Industriestandard für Betäubungsgase zum Einsatz in Notfallsituationen und in unterschiedlichen Konzentrationen erhältlich.\nNeuro-Stun VIII wird nach 10 Minuten Luftkontakt unwirksam, Neuro-Stun IX und X nach 1 Minute.
item.neuro_stun_9.desc                         = Neuro-Stun ist farb- und geruchslos. Es ist der Industriestandard für Betäubungsgase zum Einsatz in Notfallsituationen und in unterschiedlichen Konzentrationen erhältlich.\nNeuro-Stun VIII wird nach 10 Minuten Luftkontakt unwirksam, Neuro-Stun IX und X nach 1 Minute.
item.nissanHound.desc                          = Dieser hochmoderne Transporthubschauber wird von den kaiserlich-japanischen\nMarineinfanteristen und Spezialeinheiten rund um den Globus verwendet.\nWenig \u00C3\u00BCberraschend ist er auch bei den schnellen Eingreiftruppen der Konzerne\nbeliebt, besonders bei denen, die zu Japanokons geh\u00C3\u00B6ren, einschlie\u00C3\u009Flich der roten\nSamurai von Renraku. Der Hound ist mit zwei Waffenhalterungen ausgestattet,\num sicherzustellen, dass sein wertvolle Fracht auch die hei\u00C3\u009Festen Starts und \nriskantesten Landungen \u00C3\u00BCberlebt.
item.nitro.desc                                = Diese gefährliche Mischung aus hochwirksamen Drogen ist ein besonders bei Trollgangs beliebtes Aufputschmittel, das einen Konsumenten leicht umbringen kann. Wenn die Wirkung der Droge nachlässt, erleidet der Benutzer für einen Zeitraum, der der Wirkungsdauer der Droge entspricht, -2 auf alle Limits sowie 9 Kästchen Geistigen Schaden, denen nicht widerstanden werden kann.\nNitro-Konsumenten bersten praktisch vor Energie, haben eine deutlich verringerte Aufmerksamkeitsspanne und reden ununterbrochen (auch mit sich selbst).
item.nonconductivity.desc					   = Elektrische Isolierung und nichtleitende Materialien schützen den Träger gegen Elektrizitätsschaden (S. 173). Addieren Sie die Stufe dieser Modifi kation zum Panzerungswert, wenn Elektrizitätsangriffen widerstanden wird.
item.northrupWasp.desc                         = Dieser Einmannhubschrauber wurde f\u00C3\u00BCr Polizei und Sicherheitsdienste entwickelt.\nEin Wasp - leichtgepanzert und mit einer schweren Waffenhalterung ausgestattet - \nist die Standardantwort der Konzernsicherheit auf immer mehr zunehmende\nShadowrunnerprobleme.
item.novacoke.desc                             = Dieses aus der Cocapfl anze gewonnene Aufputschmittel ist eine stark suchterzeugende Freizeitdroge. Nach Abklingen der Wirkung sinken für einen der Wirkungsdauer entsprechenden Zeitraum Charisma und Willenskraft des Konsumenten auf 1 und alle Limits um 1.
item.okulardrohne.desc                         = Dieses Zubehör wird pro Kauf nur in einen Augapfel eingebaut. Hierbei wird eine kleine Spyball-Drohne in der Augenhöhle platziert. Die Drohne funktioniert wie ein normales Cyberauge (mit allen relevanten Verstärkungen), bis man sie herausnimmt - dann kann man sie steuern, als wäre sie eine Horizon Flying Eye (S. 472).\nWährend sie auf diese Weise benutzt wird (und man nur ein Auge hat), erleidet man einen Würfelpoolmodifikator von -3 auf alle Aufgaben. Wenn man beide Augen durch Drohnen ersetzt, ist man blind, wenn beide Drohnen gleichzeitig außerhalb des Körper operieren. Eine Okulardrohne ist natürlich nicht als Retinamodifikation für natürliche Augen erhältlich.
item.orthoskin.desc                            = Orthoskin besteht aus einem Netz von Biofasern in der Haut, das das \u00C4quivalent\npersönlicher Panzerung liefert und gleichzeitig praktisch nicht von natürlicher Haut zu\nunterscheiden ist. Orthoskin addiert ihre Stufe zum Panzerungswert des Charakters\nund ist kumulativ mit anderer Panzerung, ohne sich auf die Belastung auszuwirken.\nOrthoskin kann nicht mit Bodytech für die Haut kombiniert werden, die Panzerung\nverleiht, wie etwa Dermalpanzerung. Durch den Einbau von Orthoskin verlieren Trolle\nihre natürlichen Knochenablagerungen in der Haut und damit ihren natürlichen\nPanzerungsbonus von +1.
item.pathogenabwehr.desc                       = Diese verbesserte Milz kann effektivere und aggressivere weiße Blutkörperchen für die\nBekämpfung von Pathogenen produzieren. Pathogenabwehr addiert ihre Stufe als\nWürfelpoolmodifikator zu Krankheitswiderstandsproben.
item.pepper_punch.desc                         = Pepper Punch ist ein Reizstoff, der CS und Capsaicin, das aus Peperoni gewonnen wird, sowie noch weitere Chemikalien enthält. Es wird üblicherweise als Flüssigspray zur Selbstverteidigung und Abschreckung verwendet. Oft wird es zusätzlich mit RFID-Chips oder speziellen Farbstoffen versetzt, um später die Zielpersonen identifi zieren zu können. Pepper Punch verursacht ein starkes Brennen an den betroffenen Hautpartien; besonders stark wirkt sich der Effekt in Augen, Nase oder Mund aus. Opfer, die es in die Augen bekommen, haben Seh- und Atemprobleme.
item.periscope.desc							   = Dieses justierbare Sichtgerät wird aufmontiert und erlaubt es, mit einer Waffe um die Ecke zu zielen, wobei der übliche Würfelpoolmodifi kator von -3 auf die Angriffsprobe auf -2 gesenkt wird. Ein Periskop kann mit allen Sichtverstärkungen auf S. 448 ausgerüstet werden.
item.personafix.desc                           = Personafi xe, auch P-Fixe genannt, sind die ungewöhnlichsten und gefährlichsten BTLs. Eine Kombination aus SimSinn und Talentsoft-Technologie verändert die grundlegende Persönlichkeit des Benutzers und installiert Gedächtnisroutinen bestimmter Verhaltensmuster. Unter dem Einfl uss des Chips wird der Konsument zu einer anderen Person. Sehr beliebt sind Chips, die auf historischen Persönlichkeiten oder berühmten Pop-Ikonen basieren. Die \u201EAngestellten\u201C in Bunraku(\u201EPuppen\u201C)-Salons werden unter den Einfl uss von Personafi x-BTLs gesetzt, manchmal in Kombination mit Datenfi lter-Cyberware, um die Anonymität der Kunden zu wahren. Häufig wird das RAS-Override deaktiviert, sodass der Benutzer sich frei bewegen kann, während er unter dem Einfl uss des Chips steht.
item.plastikhandschellen.desc                  = Einweg Plastikstreifen (Panzerung 6, Struktur 1) sind\nleicht und können in Bündeln mitgeführt werden.
item.plaststahlhandschellen.desc               = Moderne Plaststahlhandschellen (Panzerung 20,\nStruktur 2) werden beim Schließen \nzusammengeschmolzen und müssen aufgeschnitten\nwerden.
item.proteusLamprey.desc                       = Dieser Unterwasserschlitten wird für Unterwasserinspektionen und -transporte\nverwendet. Er bietet Mitnahmemöglichkeiten für bis zu vier mit eigener\nSauerstoffversorgung ausgerüstete Taucher (der Lamprey kommt einem U-Boot\nzwar recht nahe, schützt die Passagiere aber nicht vor dem Druck der Tiefe).\nMilitärmodelle des Lamprey werden für aquatische Operationen von Marine-\nspezialeinheiten - wie den UCAS Navy Seals - verwendet. Der Lamprey ist außerdem\nmit einer Drohnenhalterung für eine seetaugliche Drohne von höchstens mittlerer\nGröße ausgestattet, damit auch Gebiete in tiefen erkundet werden können, die für\ndie Passagiere nicht mehr sicher sind.
item.psyche.desc                               = Diese Designerdroge wird von Zauberern und Technomancern gleichermaßen geschätzt. Neben den angegebenen Auswirkungen erhält ein Erwachter Konsument zudem nur einen Würfelpoolmodifi kator von -1 für jeden aufrechterhaltenen Zauber (statt dem üblichen Modifi kator von -2). Psyche-Konsumenten sind gleichzeitig hyperaufmerksam und distanziert, lassen sich leicht von Details ablenken und sind oft von einzelnen Fakten oder Problemen besessen.
item.qi-fokus.desc                             = Auswirkungen und Verwendung nur für Adepten! Siehe Seite 318 GRW.
item.qui-fokus.desc                            = Auswirkungen und Verwendung nur f\uFFFDr Adepten! Siehe Seite 318 GRW.
item.quick_draw_holster.desc				   = Dieses leicht zugängliche Holster kann jede Waffe aufnehmen, die nicht größer als eine Automatikpistole ist. Es senkt den Schwellenwert für das Schnellziehen der geholsterten Waffe um 1 (s. Schnellziehen, S. 167).
sensorfunction.radio_signal_scanner.desc       = Dieser Sensor kann als Wanzenscanner (S. 445) verwendet werden.
item.reagenzien(1Dram).desc                    = Reagenzien und ihre Verwendung siehe Seite 316f GRW.
item.reagenzien1Dram.desc                      = Reagenzien und ihre Verwendung siehe Seite 316f GRW.
item.reagenzienInDram(stufe).desc              = Reagenzien und ihre Verwendung siehe Seite 316f GRW.
item.reflexrecorder.desc                       = Der erste Schritt für dieses besondere Rezept ist das Züchten zusätzlichen\nNeuralmaterials in einem kleinen Klumpen. Diesen Klumpen implantiert man dann im\nSchädel und befestigt ihn an den Nerven für die motorischen Reflexe. Und zack, hat\nman einen Metamenschen mit besserem Muskelgedächtnis. Der Reflexrekorder addiert\n1 zur Stufe einer bestimmten Fertigkeit, die mit einem Körperlichen Attribut verbunden\nist. Mehrere Rekorder können für mehrere Fertigkeiten implantiert werden, aber man\nkann nicht zwei Reflexrekorder für dieselbe Fertigkeit implantieren. Reflexrekorder sind\ninkompatibel mit Talentleitungen.
item.regular_ammo.desc                         = Diese auch Vollmantelgeschosse genannten Kugeln sind für verschiedene Anwendungen (gewöhnlich zum Töten) nützlich.
item.renault-fiatFokkerTundra-9.desc           = Dieser amphibische Jet ist gut f\u00C3\u00BCr den Transport von schwerer Fracht und \nPassagieren und braucht zum Landen kein Flugfeld. Er wird von \nKonzernlogistikabteilungen verwendet, um abgelegene Einrichtungen zu versorgen,\nund von J\u00C3\u00A4gern und Wilderern auf der Jagd nach Erwachten Wesen, um ihre \ngef\u00C3\u00A4hrliche Beute zu erreichen. Dieses Flugzeug ist amphibisch und serienm\u00C3\u00A4\u00C3\u009Fig\nmit Auftriebs- und Schwimmzubeh\u00C3\u00B6r ausgestattet, so dass es sowohl von Land\nals auch von Wasser abheben kann.
item.retinaduplikat_essence.desc               = In diese höchst illegale Modifikation kann die Aufnahme der Retina einer anderen Person geladen werden, um ein fast perfektes Duplikat zu erzeugen. Hierfür ist eine Vergleichende Probe zwischen der STufe der Retinamodifikation und der STufe des Retinascanners (siehe Sicherheitsscanner, S. 361) erforderlich.
item.retinaduplikat_capacity.desc              = In diese höchst illegale Modifikation kann die Aufnahme der Retina einer anderen Person geladen werden, um ein fast perfektes Duplikat zu erzeugen. Hierfür ist eine Vergleichende Probe zwischen der STufe der Retinamodifikation und der STufe des Retinascanners (siehe Sicherheitsscanner, S. 361) erforderlich.
sensorfunction.directional_microphone.desc                  = Mit diesem Mikrofon kann man weit entfernte Unterhaltungen belauschen. Feste Gegenstände oder laute Geräusche entlang des Lauschwegs stören hier natürlich. Es ist, als wäre man bis zu hundert Meter näher an dem, worauf man das Mikro richtet.
item.richtungsdetektor.desc                    = Dieses Audiozubehör lokalisiert die Quelle eines Geräuschs. Sie gewährt einen Bonus von +2 auf das Limit bei Wahrnehmungsproben, um die Quelle eines bestimmten Geräuschs zu finden.
item.richtungsdetektor_acc.desc                    = Dieses Audiozubehör lokalisiert die Quelle eines Geräuschs. Sie gewährt einen Bonus von +2 auf das Limit bei Wahrnehmungsproben, um die Quelle eines bestimmten Geräuschs zu finden.
item.riggerinterface.desc                      = Wenn ein Fahrzeug damit ausgerüstet wird, kann man -wenn man eine Riggerkontrolle hat- in das Fahrzeug springen und es direkt über VR steuern. Das Standardriggerinterface erlaubt die Kontrolle des Fahrzeugs entweder direkt über ein Datwenkabel oder über eine Wifi-Verbindung.
item.riggerkontrolleStufe1.desc                = Dieses Inplantat macht sich die Kraft des Mittelhirn in Bezug auf das Koordinieren roher Daten und Synchronisieren ausdrücklich für den Zweck zunutze, geriggte Fahrzeuge und Drohnen (und andere Gerätemit einem Riggerinterface, wie etwa Geschütztürme) zu steuern. Die Riggerkontrolle hat ein eingebautes Sim-Modul, also kann man sie als DNI für andere Geräte nutzen. Außerdem ist sie mit einem Universal-Datenport und einem einziehbaren Kabel von etwa einem Meter Länge ausgestattet (als hätte man eine kostenlose Datenbuchse).\nWenn man in ein Fahrzeug oder eine Drohne hineingesprungen ist, gewährt die Riggerkontolle ihre Stufe als Würfelpoolbonus auf alle Proben mit Fahrzeugfertigkeiten. Zusätzlich werden alle Limits des Fahrzeugs oder der Drohne (also Handling, Geschwindigkeit, Sensor oder Präzision bei montierten Waffen) um die Stufe der Riggerkontrolle erhöht (diese Werte werden nicht tatsächlich erhöht, sondern nur in ihrer Funktion als Limit bei Proben). Und als wäre das noch nicht genug, werden die Schwellenwerte für Fahrzeugproben um die Stufe der Riggerkontrolle gesenkt (bis zu einem Minimum von 1), wenn man hineingesprungen ist.
item.riggerkontrolleStufe2.desc                = Dieses Inplantat macht sich die Kraft des Mittelhirn in Bezug auf das Koordinieren roher Daten und Synchronisieren ausdrücklich für den Zweck zunutze, geriggte Fahrzeuge und Drohnen (und andere Gerätemit einem Riggerinterface, wie etwa Geschütztürme) zu steuern. Die Riggerkontrolle hat ein eingebautes Sim-Modul, also kann man sie als DNI für andere Geräte nutzen. Außerdem ist sie mit einem Universal-Datenport und einem einziehbaren Kabel von etwa einem Meter Länge ausgestattet (als hätte man eine kostenlose Datenbuchse).\nWenn man in ein Fahrzeug oder eine Drohne hineingesprungen ist, gewährt die Riggerkontolle ihre Stufe als Würfelpoolbonus auf alle Proben mit Fahrzeugfertigkeiten. Zusätzlich werden alle Limits des Fahrzeugs oder der Drohne (also Handling, Geschwindigkeit, Sensor oder Präzision bei montierten Waffen) um die Stufe der Riggerkontrolle erhöht (diese Werte werden nicht tatsächlich erhöht, sondern nur in ihrer Funktion als Limit bei Proben). Und als wäre das noch nicht genug, werden die Schwellenwerte für Fahrzeugproben um die Stufe der Riggerkontrolle gesenkt (bis zu einem Minimum von 1), wenn man hineingesprungen ist.
item.riggerkontrolleStufe3.desc                = Dieses Inplantat macht sich die Kraft des Mittelhirn in Bezug auf das Koordinieren roher Daten und Synchronisieren ausdrücklich für den Zweck zunutze, geriggte Fahrzeuge und Drohnen (und andere Gerätemit einem Riggerinterface, wie etwa Geschütztürme) zu steuern. Die Riggerkontrolle hat ein eingebautes Sim-Modul, also kann man sie als DNI für andere Geräte nutzen. Außerdem ist sie mit einem Universal-Datenport und einem einziehbaren Kabel von etwa einem Meter Länge ausgestattet (als hätte man eine kostenlose Datenbuchse).\nWenn man in ein Fahrzeug oder eine Drohne hineingesprungen ist, gewährt die Riggerkontolle ihre Stufe als Würfelpoolbonus auf alle Proben mit Fahrzeugfertigkeiten. Zusätzlich werden alle Limits des Fahrzeugs oder der Drohne (also Handling, Geschwindigkeit, Sensor oder Präzision bei montierten Waffen) um die Stufe der Riggerkontrolle erhöht (diese Werte werden nicht tatsächlich erhöht, sondern nur in ihrer Funktion als Limit bei Proben). Und als wäre das noch nicht genug, werden die Schwellenwerte für Fahrzeugproben um die Stufe der Riggerkontrolle gesenkt (bis zu einem Minimum von 1), wenn man hineingesprungen ist.
item.ritualfokus.desc                          = Zauberfoki verstärken Hexereifertigkeiten. Jeder Zauberfokus wird bei seiner Herstellung\n auf eine der fünf Zauber- bzw. Ritualkategorien eingestimmt und kann nicht mehr\n verändert werden.\n\nEin Ritualfokus addiert seine Kraftstufe als Würfelpoolbonus zu Ritualzaubereiproben (egal \nob der Besitzer Ritualleiter oder -teilnehmer ist). Wenn das Ritual keinen Zauberanteil hat, \nkann der Fokus trotzdem genutzt werden, allerdings nicht, wenn es einen Zauber der \nfalschen Kategorie beinhaltet.
item.roverModell2072.desc                      = In Europa aus lizenzrechtlichen Gründen unter dem Namen EMC Celine vertrieben, ist dieses Luxus-SUV das Top-Modell seiner Klasse und genauso ein Statussymbol wie der Bentley. Darüber hinaus ist es furchteinflößend groß und hat all das an Zubehör, was man bei einer Fahrt durch die Wildnis -  oder, was viel häufiger vorkommt, durch die hochklassigen Stadtviertel - braucht. Dieses teure Fahrzeug wird wegen seiner Kombination aus Status und Sicherheit bei diskreten Sicherheitsfirmen immer beliebter.
item.saeder-krupp-bentleyConcordat.desc        = Diese Luxuslimousine ist elegant, herrschaftlich und beeindruckend. Sie ist schnell und stark, bequem und sicher, opulent ausgestattet und - was am wichtigsten ist - ein echtes Statussymbol. Der SK-Bentley Concordat ist die Art von Auto, die von Simstars und Orxploitation-Rappern gefahren wird; ein Runner hinter dem Steuer eines solchen Autos hat echt das große Los gezogen - oder den Wagen gestohlen.
item.samuvaniOtter.desc                        = Dieses mittelgroße Boot wird hauptsächlich für Ausflüge, zum Angeln, für\nleichte Frachttransporte und Wartungsarbeiten verwendet. Das Otter ist fünf\nMeter lang, hat einen offenen Rumpf aus Fiberglas und ist ein vielseitiges\nAllzweckboot, das nirgendwo auffällt.
item.schlafregulator.desc                      = Der Schlafregulator ist eine Modifikation am Hypothalamus, die längere Perioden der\nWachheit erlaubt \u2013 ein unglaublich nützlicher Vorteil für jeden mit irgendeinem Beruf,\nnicht nur für Shadowrunner. Man braucht weniger Schlaf pro Tag, und der Schlaf, den\nman bekommt, ist tief und erholsam (außerdem ist man schwerer aufzuwecken). Der\nSchlafregulator lässt den Charakter mit drei Stunden Schlaf pro Nacht auskommen und\ndoppelt so lange wie normal wach bleiben, bevor er Schaden aus Erschöpfung durch\nSchlafentzug widerstehen muss. Die Ruhezeiten für Heilzwecke werden davon nicht\nbeeinflusst.
item.schloss.desc                              = Selbst in der kabellosen Welt der 2070er gibt es\nimmer noch einige mechanische Zylinder- oder\nKombinationsschlösser. Einige von ihnen gehören zu\nalter Infrastruktur, die immer noch da ist, um Geld zu \nsparen, andere gibt es aus Nostalgiegründen, und\nwieder andere sind da, weil Einbracher sie nicht \nerwarten. Weitere Details finden Sie auf S. 362.
item.schmerzeditor.desc                        = Dieser Klumpen spezialisierten Nervengewebes soll sensorische Stimuli filtern.\nWenn der Schmerzeditor aktiv ist, erlaubt dies dem Charakter, alle\nVerletzungsmodifikatoren zu ignorieren und sogar dann noch bei Bewusstsein zu\nbleiben, wenn der Geistige Zustandsmonitor vollständig ausgefüllt ist. Der Charakter\nfühlt keine Schmerzen \u2013 er hat keine Ahnung vom Ausmaß des Schadens, den er\nerlitten hat, wenn er sich nicht entweder selbst untersucht\n(eine Handlung Genau Beobachten) oder durch einen Vitalmonitor auf dem\nLaufenden gehalten wird. Im aktiven Zustand erhöht der Schmerzeditor die\nWillenskraft des Charakters um 1 und senkt seine Intuition um 1. Zusätzlich erleiden\nalle Wahrnehmungsproben, die auf dem Tastsinn basieren, einen\nWürfelpoolmodifikator von -4.
item.shock_pad.desc							   = Ein schockabsorbierendes Polster, das sich auf dem festen Schaft eines Gewehrs, einer Schrotflinte oder einer schweren Waffe befindet und 1 Punkt Rückstoßkompensation bietet.
item.schwereWaffenhalterung.desc               = Schwere Waffenhalterungen zählen als zwei Waffenhalterungen und können jede Art von Waffe und bis zu 500 Schuss Gurtmunition oder bis zu [Rumpf] (Lenk-) Raketen aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen. Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.selektivergeraeuschfilter.desc            = Eine implantierte Version desselektiven Geräuschfilters (S. 449), mit dem Unterschied, dass die amximal erhältliche Stufe 6 statt 3 beträgt.\n?einfügen S. 449?
item.selektivergeraeuschfilter_acc.desc        = Dieses Zubehör filtert Hintergrundgeräusche aus und erlaubt dem Anwender, sich auf \nbestimmte Geräusche oder Geräuschmuster zu konzentrieren. Es enthält sogar Sprach-,\nWort- und Geräuschmustererkennung. Mit jedem Stufenpunkt kann man eine\nbestimmte Geräuschgruppe (wie etwa die Schritte einer patrouillierenden Wache\noder die Rotoren eines entfernten Hubschraubers) auswählen und sich auf sie \nkonzentrieren. Man hört aktiv nur auf eine Geräuschgruppe gleichzeitig, aber man\nandere Geräuschgruppen für späteres Playback aufzeichnen oder sie autoimatisch\nüberwachen (zum Beispiel kann man einen Alarm festlegen für den Fall, dass in einer\nUnterhaltung ein bestimmtes Wort fällt oder sich der Atemrhythmus eines\nWachhunds ändert).
item.sensorarray.desc						   = Dieses Sensorpaket enthält bis zu acht der unter Sensorfunktionen aufgeführten Funktionen.
item.sequencer.desc                            = Ein elektronisches Gerät, das benötigt wird, um \nMagschlösser mit Tastatur zu knacken (s. Magschlösser,\nS. 362).
item.seven_7.desc                              = Dieses farb- und geruchlose Gas wurde speziell dafür entwickelt, chemische Schutzmaßnahmen zu umgehen. Neben dem Körperlichen Schaden ruft Seven-7 auch Krämpfe, \u00DCbelkeit und Sehstörungen hervor. Seven-7 oxidiert nach 10 Minuten Luftkontakt und wird wirkungslos.
item.shiawaseKanmuchi.desc                     = Diese vierbeinige "Wanzen"-Krabblerdrohne kann \nman auf den ersten Blick kaum von einem normalen \nInsekt unterscheiden. Sie ist ideal für das Eindringen\nin beengte Bereiche, und ihre mit Geckospitzen\nausgestatteten Extremitäten und ihr geringes Gewicht\nbefähigen sie dazu, auch an Wänden oder Decken\nentlangzukrabbeln. Auf der anderen Seite ist sie \nziemlich zerbrechlich und kann schon durch einen\nRFID-Löscher oder daurch, dass man auf sie tritt,\nzerstört werden. Diese Drohne wird mit der Fertigkeit\nLäufer gesteuert.
item.shock_frills.desc						   =  Diese Streifen aus \u201EFell\u201D werden bei Aktivierung durch eine Einfache Handlung elektrisch aufgeladen, stehen dann von der Panzerung ab und verursachen bei jedem, der den Träger berührt, Elektrizitätsschaden. Für den Angriff mit den Schockstreifen wird die Fertigkeit Waffenloser Kampf verwendet. Die Schockstreifen enthalten 10 Ladungen; wenn sie an eine Energiequelle angeschlossen werden, wird alle 10 Sekunden eine Ladung wieder aufgeladen.
item.sichtvergroesserung.desc         = Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man weit entfernte Ziele besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im Fernkampf fi nden Sie auf GRW S. 176.)
item.sichtvergroesserung_cybereye.desc         = Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man weit entfernte Ziele besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im Fernkampf fi nden Sie auf GRW S. 176.)
item.sichtverbesserung_auge.desc               = Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines durchschnittlichen Metamenschen ähnelt. Sichtverbesserung addiert ihre Stufe als positiven Modifi kator auf das Limit bei visuellen Wahrnehmungsproben.
item.signaturschleier.desc                     = Ein Signaturschleier addiert seine Kraftstufe zum Initiatengrad seines Besitzers beim erhöhen des Schwellenwerts für die Askennenprobe eines Beobachters durch Flexible Signatur.
item.sikorsky-bellMicroskimmer.desc            = Diese scheibenförmige, geräuscharme und haltbare Schwebedrohne ist kleiner als ein\nFrisbee und kann sogar über Wasser schweben. Sie bewegt sich auf einem kleinen und\nrecht schwachen Luftkissen. Sie ist leichter zu entdecken als die Kanmushi, aber immer\nnoch sehr klein. Diese Drohne wird mit der Fertigkeit Bodenfahrzeuge gesteuert:\ndie Spezialisierung Hovercrafts kann verwendet werden.
item.silencer.desc							   = Dieses laufmontierte Zubehör dämpft das Geräusch und den Blitz der Entladung einer Waffe. Es kann nicht mit Revolvern oder Schrotfl inten verwendet werden und führt zu einem Würfelpoolmodifi kator von -4 auf alle Wahrnehmungsproben, um die Anwendung der Waffe zu bemerken oder den Schützen zu lokalisieren. Das Anbringen oder Entfernen eines Schalldämpfers erfordert eine Komplexe Handlung.
item.ares_lf_silencer.desc					   = Dieses laufmontierte Zubehör dämpft das Geräusch und den Blitz der Entladung einer Waffe. Es kann nicht mit Revolvern oder Schrotfl inten verwendet werden und führt zu einem Würfelpoolmodifi kator von -4 auf alle Wahrnehmungsproben, um die Anwendung der Waffe zu bemerken oder den Schützen zu lokalisieren. Das Anbringen oder Entfernen eines Schalldämpfers erfordert eine Komplexe Handlung.
item.sichtervergroesserung.desc				   = Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man weit entfernte Ziele besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im Fernkampf fi nden Sie auf S. 176.
item.sim_module.desc						   = Dieses Kommlink-Upgrade verleiht dem Benutzer SimSinn-Erfahrung, indem es Computerdaten in neurale Signale übersetzt, die SimSinn-Programme und die Erweiterte Realität direkt erlebbar machen. Auf ein Sim-Modul muss über ein Direktes Neuralinterface (Troden, Datenbuchse oder implantiertes Kommlink) zugegriffen werden.\nSim-Module sind ein Muss für alle Arten von Virtueller Realität, einschließlich VR-Clubs, VR-Spielen, SimSinn und finstereren virtuellen Vergnügungen.
item.sim_module_hot.desc					   = Dieses Kommlink-Upgrade verleiht dem Benutzer SimSinn-Erfahrung, indem es Computerdaten in neurale Signale übersetzt, die SimSinn-Programme und die Erweiterte Realität direkt erlebbar machen. Auf ein Sim-Modul muss über ein Direktes Neuralinterface (Troden, Datenbuchse oder implantiertes Kommlink) zugegriffen werden.\nSim-Module sind ein Muss für alle Arten von Virtueller Realität, einschließlich VR-Clubs, VR-Spielen, SimSinn und finstereren virtuellen Vergnügungen.\nSim-Module können für heißes Sim modifiziert werden, was einem die volle (und gefährliche) Bandbreite der VR-Erfahrung eröffnet.
item.simrig.desc                               = Dies ist die implantierte Version eines Simrigs. Dieser SimSinn-Rekorder kann sensorische und emotionale Daten seines Trägers aufzeichnen. Simrigs werden für die Produktion der meisten SimSInn-Chips auf dem Markt verwendet. Man braucht außerdem noch ein funktionierendes Sim-Modul (mit DNI), um eine Aufzeichnung zu machen.
item.singlesensor.desc						   = Dies ist ein Sensor, der nur eine der unter Sensorfunktionen aufgeführten Funktionen ausführen kann.
item.smart_firing_platform.desc			       = Dieses immobile, robotische Dreibein ist mit einem ferngesteuerten Drehzapfen ausgestattet, der einen Feuerwinkel von 180 Grad mit einer Neigung von 60 Grad erlaubt. Man kann an der Plattform eine mit Smartgunsystem ausgestattete Waffe befestigen, die dann von dem Pilotprogramm (Stufe 3) der Plattform abgefeuert wird. Die Plattform ist mit einer Zielerfassungs-Autosoft (Stufe 3) ausgerüstet und kann mit zusätzlichen Autosofts \u2013 gewöhnlich einer Clearsight-Autosoft \u2013 upgegradet werden. Man muss die Parameter festlegen, auf wen genau die Plattform schießen soll und auf wen nicht; diese Parameter werden dann vom Pilotprogramm der Plattform befolgt (s. Pilotprogramme, S. 267). Die Plattform gewährt 5 Punkte Rückstoßkompensation. Sie hat einen Initiativewert von Pilot x 2 und 4W6 Initiativewürfel, wenn sie autonom handelt (s. Initiative bei Drohnen, S. 268).
item.smartgun_system_internal.desc			   = Dieses System verbindet eine Feueroder Projektilwaffe direkt mit dem Smartlink des Charakters. Es enthält eine kleine Kamera und einen Laserentfernungsmesser und überwacht den Munitionsstand, die Hitzeentwicklung und Materialbelastung. Wenn man ein Smartlink hat, kann man allein mit einem Gedanken zwischen Feuermodi wechseln, ein Magazin auswerfen und die Waffe abfeuern, ohne den Abzug zu betätigen. Mit der Kamera kann man (mit einem Würfelpoolmodifi kator von -3) um Ecken schießen, ohne sich selbst dem Gegenfeuer auszusetzen. Das System verwendet fortschrittliche Berechnungssoftware, die präzise berechnete Flugbahnen und eine hohe Präzision über jede Entfernung erlaubt.\nWenn man ein Smartlink benutzt, erhöht das Smartgunsystem die Präzision der Waffe um 2. Auf die Smartguneigenschaften greift man entweder mit einem Datenkabel zu, das mit einem Sichtgerät (z. B. einer Brille oder \u2013 wenn man Cyberaugen hat \u2013 einer Datenbuchse) verbunden ist, oder über eine WiFi-Verbindung, die mit einem Direkten Neuralinterface (DNI) zusammenarbeitet.
item.smartgun_system_external.desc			   = Dieses System verbindet eine Feueroder Projektilwaffe direkt mit dem Smartlink des Charakters. Es enthält eine kleine Kamera und einen Laserentfernungsmesser und überwacht den Munitionsstand, die Hitzeentwicklung und Materialbelastung. Wenn man ein Smartlink hat, kann man allein mit einem Gedanken zwischen Feuermodi wechseln, ein Magazin auswerfen und die Waffe abfeuern, ohne den Abzug zu betätigen. Mit der Kamera kann man (mit einem Würfelpoolmodifi kator von -3) um Ecken schießen, ohne sich selbst dem Gegenfeuer auszusetzen. Das System verwendet fortschrittliche Berechnungssoftware, die präzise berechnete Flugbahnen und eine hohe Präzision über jede Entfernung erlaubt.\nWenn man ein Smartlink benutzt, erhöht das Smartgunsystem die Präzision der Waffe um 2. Auf die Smartguneigenschaften greift man entweder mit einem Datenkabel zu, das mit einem Sichtgerät (z. B. einer Brille oder \u2013 wenn man Cyberaugen hat \u2013 einer Datenbuchse) verbunden ist, oder über eine WiFi-Verbindung, die mit einem Direkten Neuralinterface (DNI) zusammenarbeitet.\nEin externes Smartgunsystem kann mit einer Ausgedehnten Probe auf Waffenbau +Logik [Geistig] (4, 1 Stunde) auf- oder unterlaufmontiert werden. Die kleine Kamera hat eine Kapazität von 1 und kann mit Sichtverstärkungen (S. 448) ausgerüstet werden.
item.smartlink_capacity.desc				   = Eine Cyberaugen-implantierte Version des Smartlinks (S.448). Ein Smartlink, das in einem natürlichen Auge oder einem Paar Cyberaugen installiert wird, ist effektiver als ein Smartlink, das in einem externen Gerät installiert wird (s. Smartgunsystem, S. 435).
item.smartlink_essence.desc				   = Eine implantierte Version des Smartlinks (S.448). Ein Smartlink, das in einem natürlichen Auge oder einem Paar Cyberaugen installiert wird, ist effektiver als ein Smartlink, das in einem externen Gerät installiert wird (s. Smartgunsystem, S. 435).
item.smoke.desc                                = \u00C4hnlich wie eine Gasgranate gibt eine Rauchgranate eine Rauchwolke in einem Bereich mit einem Radius von 10 Metern ab. Die Wolke schränkt die Sicht ein und verursacht bei entsprechenden Proben Sichtbarkeitsmodifi katoren für Rauch (S. 176). Die Wolke existiert für etwa 4 Kampfrunden (kürzer bei Wind, länger in geschlossenen Räumen mit schlechter Lüftung, nach Maßgabe des Spielleiters).
item.spare_clip.desc						   = Ein Ersatzladestreifen ist nicht ab Werk geladen, kann aber die maximal mögliche Geschossanzahl für die jeweilige Waffe aufnehmen. Jeder Ladestreifen ist genau auf die Waffe angepasst, für die er gekauft wird, aber sie kosten alle dasselbe. Und ja, technisch gesehen handelt es sich hier um ein Stangenmagazin, aber das Slangwort dafür ist so verbreitet, dass die Dinger heutzutage sogar in den Katalogen als Streifen bezeichnet werden.
item.speed_loader.desc						   = Der Schnelllader ist eine einfache Vorrichtung, die einen Ring von Kugeln hält, die dadurch schneller in die Trommel eines Revolvers geladen werden können. Jeder Schnelllader ist speziell für die Waffe angepasst, für die er entwickelt wurde. Mit einem Schnelllader kann man einen Revolver mittels einer Komplexen Handlung vollständig laden, statt eine Kugel nach der anderen reinschieben zu müssen (s. Tabelle Waffen Nachladen, S. 165).
item.spleenbombe.desc                          = Diese illegale Methode der Nötigung soll nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen.\nDie Bomben können fern- oder zeitgesteuert gezündet werden oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen.\nSie können auch in Cybergliedmaßen eingebaut werden, siehe dazu den Einbau Spleenbombe(Cybergliedmaß).
item.spleenbombe_cybergliedmass.desc           = Diese illegale Methode der Nötigung wird zusätzlich in ein Cybergliedmaß eingebaut und soll eine spezielle Komponente, nicht das ganze Gliedmaß oder gar den Träger zerstören.\nDie Bomben können fern- oder zeitgesteuert gezündet werden oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen.
item.spruehkleber.desc                         = Dieser schnelltrocknende Aerosol-Superkleber erlaubt\nes, zwei feste Oberflächen schnell aneinanderzukleben,\nund enthält genug Kleber für ungefähr einen \nQuadratmeter (genug, um eine Außentür oder ein\nPanoramafenster zuzukleben). Der Kleber braucht 1\nKampfrunde, um auszuhärten. Er hat eine Konstitution\nund Stärke von jeweils 5 für den Fall, dass man ihn\naufbrechen will (dies erfolgt über eine Vergleichende\nProbe auf Konstitution + Stärke).
item.standardseil,100m.desc                    = Standardseil mit einer Tragkraft von 400 Kilogramm.
item.standardwaffenhalterung.desc              = Standardwaffenhalterungen können eine maximal sturmgewehrgroße Waffe und 250 Schuss Munition aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen. Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.steelLynx.desc                            = Die Steel Lynx, eine echte Bodenkampfmaschine, hat\nvier Räder udn eine schwere Waffenhalterung.\nDiese Drohne wird mit der Fertigkeit Bodenfahrzeuge\ngesteuert.
item.stick_n_shock.desc                        = Schockermunition verursacht elektrischen Geistigen Schaden gleich dem Schadenscode der Waffe -2. Sie hat eine pauschale DK von -5, die die DK der Waffe ersetzt, statt sie zu modifi zieren.
item.stim-patch.desc                           = Dieses Patch entfernt eine Anzahl von Kästchen \ngeistigen Schaden in Höhe seiner Stufe. Diese \nWirkung hält für (Stufe*10) Minuten an - nach dieser \nZeit erleidet der Patient (Stufe+1) geistigen Schaden,\ndem nicht widerstanden werden kann (und der zu \ndiesem Zeitpunkt auch leicht auf den körperlichen\nZustandsmonitor überlaufen kann). Während ein \nStim-Patch wirkt, kann der Charakter sich nicht \nausruhen. Die häufige Verwendung von Stim-Patches\nkann das Ablegen von Abhängigkeitsproben \nerfordern. Behandeln Sie dies wie eine Abhängigkeit\nmit Abhängigkeitswert 2 und Abhängigkeits-\nSchwellenwert 1.
item.stimmenmodulator.desc                     = Dieses Implantat verleiht einem das absolute Gehör und eine enorme stimmliche Flexibilität und Verzerrungsfähigkeiten. Man kann ohne Anstrengung mit erhöhter Lautstärke (bis zu 100 Dezibel) sprechen, die Stimme verändern, um perfekte Vogelrufe, lieblichen Gesang oder unheimliche stimmliche Eindrücke hervorzubringen. Der Modulator kann außerdem eine aufgezeichnete Stimme wiedergeben (und mehr oder weniger gut imitieren).\nAddieren sie die Stufe des Modulators als Würfelpoolbonus zu Verkörperungsproben.
item.survival-kit.desc                         = Eine Auswahl von \u00DCberlebensausrüstung in einer widerstandsfähigen Tasche. Enthält\nein Messer, ein Feuerzeug, Streichhölzer, einen Kompass, eine leichte Isolationsdecke,\nNahrungsriegel für mehrere Tage, eine Wasserreinigungseinheit und noch mehr.\nGut für die Notfalltasche.
item.suzukiMirage.desc                         = Dieses japanische Rennmotorrad ist eine geschmeidige Maschine, die nur auf Geschwindigkeit ausgelegtund bei dem anderen Typ von Go-Gangern beliebt ist. Man sollte erwähnen, dass sowohl die Scorpion als auch die Mirage bei den Cutters beliebt sind, aber die Ancientszeigen eine deutliche Präferenz für die Mirage und ihre Schwestermodelle. Wie die Scorpion wird auch die Mirage beim Combatbiking verwendet.
item.symbionten.desc                           = Maßgeschneiderte Mikroorganismen im Blutkreislauf beschleunigen die Heilung des\nCharakters dramatisch. Symbionten addieren ihre Stufe als Würfelpoolmodifikator zu\nGenesungsproben (Körperlich und Geistig). Allerdings haben sie auch ungewöhnliche\nNahrungsanforderungen, die erfüllt werden müssen, um sie am Leben zu halten. Der\nCharakter muss pro Monat (Stufe x 200) Nuyen für spezielle Symbiontennahrung\nausgeben, wenn er nicht gerade einen Oberschicht- oder besseren Lebensstil hat.
item.synapsenbeschleuniger.desc                = Die Nervenzellen, aus denen das Rückenmark besteht, werden mit dieser Bioware\nerweitert und repliziert, was eine höhere neurale Bandbreite erlaubt. Das Ergebnis ist\neine viel schnellere Reaktionszeit. Der Synapsenbeschleuniger gewährt pro Stufenpunkt\njeweils einen Bonus von +1 auf die Reaktion (Initiative und Körperliches Limit werden\nentsprechend angepasst) und +1W6 Initiativewürfel. Er kann nicht mit irgendeiner\nanderen Form von Reaktions- oder Initiativeverbesserung kombiniert werden.
item.synthacardium.desc                        = Ein künstlich verbesserter Herzmuskel führt dazu, dass kardiovaskuläre Funktionen\neffizienter ausgeführt werden, wodurch das Herz das Blut besser mit Sauerstoff\nversorgen kann. Das Synthacardium addiert seine Stufe als Würfelpoolbonus zu Proben\nmit Fertigkeiten der Athletik-Fertigkeitsgruppe.
item.talentbuchse.desc                         = Diese Headware interpretiert Wissens- und Linguasofts für das gehirn, sodass amn sie nutzen kann, als wären sie die eigenen Fähigkeiten. Sie kann auch Aktionssofts laufen lassen, die aber nur als Wissensfertigkeiten funktionieren, solange man keine Talentleitungen hat.\nDie Summe aller gleichzeitig laufenden Fertigkeiten auf einer Talentbuchse kann das Doppelte ihrer Stufe nicht überschreiten, und die maximale Stufe der darauf laufenden fertigkeit ist gleich der Stufe der Talentbuchse. Das Starten von Fertigkeiten aus dem Speicher und das Anhalten von fertigkeiten erfordern jeweils eine freie Handlung. Man kann für Fertigkeiten, die man durch eine Talentbuchse hat, kein Edge einsetzen.\nWenn man mehr als eine Talentbuchse hat, kann man nur eine von ihnen gleichzeitig in Betriebsetzen.
item.taschenlampe.desc                         = Im Jahr 2075 haben die meisten Taschenlampen eine sehr lange Lebensdauer und\nsind superhell. Haltbarkeit und Helligkeit hängen von der Größe ab - je größer,\ndesto besser. Taschenlampen gibt es auch in Versionen für Restlichtverstärkung\nund Infrarot, die die Sichtmodifikatoren für Restlichtverstärkung bzw. Infrarotsicht\nsenken. Eine Taschenlampe kann auch an einer Waffe auf- oder unterlaufmontiert\nwerden (s. Halterung, S. 419).
item.taser_dart.desc                           = Diese Pfeile sind für Taser gedacht.
item.taucherausruestung.desc                   = In der Taucherausrüstung sind ein Neoprenanzug, eine Gesichtsmaske mit Schnorchel,\nein Atemregler, ein Lufttank für 2 Stunden Luft und eine aufblasbare Weste für eine\nschnelle Rückkehr an die Wasseroberfläche enthalten. Der Atemregler und der \nLufttank schützen wie eine Gasmaske gegen Toxine mit Inhalationsvektor. Der\nNeoprenanzug gewährt 1 Punkt Resistenz gegen Kälteschaden (S. 175). WiFi-Signale\nfunktionieren unter Wasser nicht sehr gut, aber die WiFi-Systeme der \nTaucherausrüstung helfen bei der Vorbereitung und Wartung.
item.thermal_dampening.desc					   = Diese inneren Schichten schwächen die Wärmesignatur des Trägers ab, indem sie Hitze absorbieren oder freisetzen, um eine Oberfl ächentemperatur zu erreichen, die der umgebenden Lufttemperatur gleicht. Addieren Sie die Stufe dieser Modifikation zum Limit für jede Schleichenprobe gegen Infrarotsicht oder Wärmesensoren.
item.thermal_smoke.desc                        = Diese Granate ist identisch mit der Rauchgranate, außer dass der Rauch heiße Partikel enthält, die Infrarotsicht behindern. Wenden Sie die Sichtbarkeitsmodifikatoren für IR-Rauch (S. 176) an. Die Wolke existiert für etwa 4 Kampfrunden (kürzer bei Wind, länger in geschlossenen Räumen mit schlechter Lüftung, nach Maßgabe des Spielleiters).
item.thermit-brennstab.desc                    = Thermitgel ist ein entzündliches Material, das mit einer\nextrem hohen Temperatur brennt. Es wird mithilfe\neines Brennstabs - einer Stange aus Thermit und \nSauerstoff mit einem Griff und einer Halterung - \nappliziert, der verwendet werden kann, um Löcher in\nEisen, Stahl und sogar Plaststahl zu brennen. Der\nThermit-Brennstab verursacht Feuerschaden mit einem\nSchadenscode von 30K. Er muss sehr vorsichtig\ngehandhabt werden und kann deshalb nicht als Waffe\nverwendet werden (es sei denn, das Ziel ist gefesselt\noder bewusstlos oder so - autsch).
item.thrombozytenfabrik.desc                   = Eine Thrombozytenfabrik erhöht die Fähigkeit des Körpers, mit Körperlichem Schaden\nfertig zu werden, indem sie die Produktion von Blutplättchen im Knochenmark und\nihre Konzentration im Blut erhöht, was dabei hilft, Blutungen schneller zu stoppen.\nJedes Mal, wenn der Charakter 2 oder mehr Kästchen Schaden auf seinem Körperlichen\nZustandsmonitor erleiden würde, wird der Schaden um ein Kästchen gesenkt.
item.toxinextraktor.desc                       = Ein speziell kultivierter Zellklumpen in der Leber verbessert ihre Filterfähigkeiten.\nDer Toxinextraktor addiert seine Stufe als Würfelpoolmodifikator zu allen \nToxinwiderstandsproben.
item.toyotaGopher.desc                         = Dies ist ein klassischer Pick-up mit einer guten Geländeaufhängung, hervorragender Manövrierfähigkeit und einem treuen Kundenstamm. Er ist wartungsfreundlich und ein bisschen altmodisch, findet aber in Dritte-Welt-Ländern und ländlichen Regionen, besonders in den NAN, weite Verbreitung. Er ist vielleicht nicht das coolste Auto, das man fahren kann, aber sein leistungsstarker Motor und der große Laderaum sind sicherlich praktisch, wenn man mal schwere Lasten transportieren muss.
item.tracer.desc                               = Leuchtspurmunition brennt auf ihrer Flugbahn und macht es dem Schützen leichter, das Ziel zu erfassen. Diese Munitionsart kann nur in vollautomatischen Waffen werden und bildet eine Ausnahme von der Regel, dass pro Streifen nur eine Munitionsart verwendet werden darf. Leuchtspurgeschosse ersetzen jedes dritte Geschoss in einem Streifen. Sie erhöhen die Präzision der Waffe um 1, wenn man mehr als eine Kugel pro Handlungsphase verschießt (kumulativ mit einem Lasermarkierer, aber nicht mit einer Smartgun).
item.tragbaresGehaeuse.desc                    = Ein tragbares Gerät für eine Menge an Einzelsensoren bis zur Kapazität. Für Details zur möglichen Größe und daraus resultierenden Grenzen bitte auf Seite 449/450 nachlesen.
item.tranq-patch.desc                          = Dieses Patch verursacht geistigen Schaden in Höhe\nseiner Stufe, dem nur mit Konstitution widerstanden\nwird.
item.trauma-patch.desc                         = Wenn ein Trauma-Patch bei einem sterbenden \nPatienten angewandt wird, erlaubt ihm dies, sofort\neine Stabilisierungsprobe (siehe Stabilisierung, S. 207)\nabzulegen, bei der er seine Konstitution statt Erste\nHilfe oder Medizin verwendet.
item.tripchip.desc                             = Tripchips ähneln den Moodchips. Sie produzieren vor allem Sinnes-Output und überfl uten den Benutzer mit interessanten und ungewöhnlichen Empfi ndungen. Das können ganz einfache Effekte sein, aber auch komplexere Simulationen, etwa sich unter Wasser aufzuhalten und zu bewegen. Der letzte Schrei ist eine absichtlich hervorgerufene Synästhesie mit voll aufgedrehten Sinnesleveln und deaktiviertem RAS-Override, was den Benutzer die Umwelt auf eine ganz neue Weise wahrnehmen lässt.
item.tripod.desc							   = Das Dreibein bietet eine stabile Basis, um eine Waffe von nah am Boden abzufeuern, während der Schütze kniet oder sitzt. Ein Dreibein kann an der Unterlaufhalterung einer Waffe befestigt werden und bietet 6 Punkte Rückstoßkompensation, wenn es ausgeklappt ist. Das Anbringen eines Dreibeins dauert eine Minute. Das Auf- oder Zusammenklappen eines Dreibeins erfordert wie das Abmontieren eine Komplexe Handlung.
item.ultraschall.desc                          = Der Ultraschallsensor besteht aus einem Emitter, der kontinuierlich Ultraschallimpulse emittiert, und einem Empfänger, der die Echos dieser Impulse aufnimmt, um daraus eine topographische Ultraschallkarte zu\nerstellen. Ultraschall ist perfekt, um Strukturen zu \n"sehen", Entfernungen zwischen Objekten zu \nberechnen und Dinge wahrzunehmen, die für das \nnackte Auge unsichtbar sind (wie etwa Leute, die\ndurch einen Unsichtbarkeitszauber verborgen sind); er\nkann allerdings weder mit Farben noch mit Helligkeit\numgehen. Er kann auch keine Materialien wie Glas\ndurchdringen, die für optische Sensoren transparent\nsind. Man kann ihn in den passiven Modus schalten,\nsodass er keine Ultraschallimpulse emittiert, sondern nur\nUltraschall aus anderen Quellen aufnimmt, wie etwa\nvon Bewegungsmeldern oder anderen \nUltraschallsensoren im aktiven Modus (oder von\nFledermäusen).
sensorfunction.ultrasound.desc                    = Ein Ultraschallsensor besteht aus einem Emitter, der kontinuierlich Ultraschallimpulse emittiert, und einem Empfänger, der die Echos dieser Impulse aufnimmt, um daraus eine topographische Ultraschallkarte zu erstellen.\nUltraschall ist perfekt, um Strukturen zu 'sehen', Entfernungen zwischen Objekten zu berechnen und Dinge wahrzunehmen, die für das nackte Auge unsichtbar sind (wie etwa Leute, die durch einen Unsichtbarkeitszauber verborgen sind); er kann allerdings weder mit Farbe noch mit Helligkeit umgehen. Er kann auch keine Materialien wie Glas durchdringen, die für optische Sensoren transparent sind.\nMan kann ihn in den passiven Modus schalten, sodass er keine Ultraschallimpulse emittiert, sondern nur Ultraschall aus anderen Quellen aufnimmt, wie etwa von Bewegungsmeldern oder anderen Ultraschallsensoren im aktiven Modus (oder von Fledermäusen).\nIm normalen Modus ersetzt er die normale Sicht. Zwischen aktivem, passivem Sonar und deaktivierten Zusatnd kann mit einer freien Handlung hin- und hergeschaltet werden.
item.ultraschallsensor.desc					   =  Diese Cyberware funktioniert genauso Wiedergabe (oder den Verkauf, wenn man wirklich intereswie der Ultraschallsensor (S. 450). Im aktiven Zustand ersetzt sie die normale Sicht. Mit einer Freien Handlung kann zwischen aktivem Sonar, passivem Sonar und deaktiviertem Zustand hin und hergeschaltet werden.
item.urban_explorer_jumpsuit_helmet.desc	   = Helm passend zum Urban Explorer Overall
item.verbannungsfokus.desc                     = Geisterfoki verstärken die Beschwörungsfertigkeit eines Zauberers. Jeder Geisterfokus\nwird bei seiner Herstellung auf eine Geisterart eingestimmt, die danach nicht mehr \nverändert werden kann.\n\nEin Verbannungsfokus addiert seine Kraftstufe als Würfelpoolbonus zu Verbannungsproben,\nsolange die Art des zu verbannenden Geistes zum Fokus passt.
item.vitalmonitor.desc                         = Dieses kompakte Gerät misst Lebenszeichen - \nHerzfrequenz, Blutdruck, Temperatur und so weiter. \nDer Vitalmonitor kann außerdem Blut-, Schweiß- und\nHautproben analysieren. Er wird von medizinischen\nDienstleistern und Patienten verwendet, die ihren\nGesundheitszustand überwachen müssen, und kann \nals Armband getragen oder in Kleidung oder \nKommlinks integriert werden.
item.vulkanElectronaut.desc                    = Dieses Mini-U-Boot für zwei Personen ist das billigste Modell seiner Klasse und\nin vielen verschiedenen Ausstattungen für verschiedene Zwecke erhältlich.\nEs wird häufig für Patrouillen, Kurzstreckenerkundung und Lieferungen verwendet,\naber es kann auch wirksam von Shadowrunnerteams eingesetzt werden, die nach\neinem unerwarteten Weg in nautische Ziele suchen.
item.waffenfokus.desc                          = Ein Waffenfokus hat, wenig überraschend, immer die Form einer Nahkampfwaffe.\nEr unterstützt mit seiner Macht die Nahkampfangriffe seines Besitzers. Im Kampf auf der\nphysischen Ebene addiert er seine Kraftstufe als Würfelpoolbonus zu Nahkampfangriffsproben.\nDer Charakter kämpft immer noch mit seinen Körperlichen Attributen und Fertigkeiten;\nder Waffenfokus macht den Kampf nur effektiver.\nEin Waffenfokus wirkt auch gegen astrale Gestalten, wenn sein Besitzer dabei astral wahrnimmt oder \nastral projiziert. Er addiert seine Kraftstufe als Würfelpoolbonus zu Astralkampfproben, \nwenn der Charakter in benutzt. In aktiviertem Zustand kann der Charakter den Fokus auch\nauf die Astralebene mit nehmen. Der Schaden mit dem Waffenfokus ist im Astralkampf\ngenauso hoch wie im Kampf auf der physischen Ebene, nur dass im Astralraum Charisma\n statt Stärke benutzt wird. Außerdem kann man wählen, ob er Geistigen oder Körperlichen Schaden anrichten soll\n(s. Astralkampf, S. 314).
item.wandmontiertesGehaeuse.desc               = Ein wandmontiertes Gehäuse für die Aufnahme von bis zu Kapazität Einzelsensoren.
item.yamahaGrowler.desc                        = Dies ist ein unverwüstliches Geländemotorrad, das bei Motocrossrennen und anderen Extremsportevents genutzt wird. Foto- und Videoaufnahmen zeigen das Motorrad und seinen Fahrer meistens staub- und schlammverkrustet. Es ist beliebt bei Leuten, die nach einem Kick suchen, Wildnisfans und Drogenschmugglern, die nur wenig Frachtraum brauchen.
item.yongkangGaiaTrinity.desc                  = Dieses kleine Schnellboot ist als Schmugglerboot bekannt. Es wird gewöhnlich\ndirekt vor Ort mittels vorgefertigter Komponenten gebaut, wobei die Nutzlast\ndirekt in den Rumpf eingebaut wird. Bei der Ankunft wird das Boot um seine\nFracht herum auseinandergenommen, wobei der Gewinn aus der Fracht die\nTatsache kompensiert, dass das Boot nur einmal verwendet wurde.
item.zahnbehaelter.desc                        = Diese hohlen Zähne sind die älteste Cyberware auf dem Markt, und es gibt sie als Lager- und als zerbrechliches Modell. \nDas Lagermodell wird verwendet, um wirklich winzige Kontrabande von der Größe eines Datenchips oder eines wirklich kleinen RFID-Chips zu schmuggeln. Die Gegenstände könne über ein WiFi-Signal oder eine versteckte Arretierung entfernt werden.\nDas zerbrechliche Modell löst eine damit verbundene Wirkung (wie etwa die Aktivierung eines Peilsignals oder das Freisetzen eines tödlichen Gifts in den Mund - aber immer schön daran denken, was was ist!) durch ein WiFi-Signal aus oder dadurch, dass man hart auf den Zahn beißt.\n
item.zauberformelHeilung.desc                  = Wird zum Erlernen von Zaubern benötigt. Siehe Seite 289
item.zauberformelIllusion.desc                 = Wird zum Erlernen von Zaubern benötigt. Siehe Seite 289
item.zauberformelKampf.desc                    = Wird zum Erlernen von Zaubern benötigt. Siehe Seite 289
item.zauberformelManipulation.desc             = Wird zum Erlernen von Zaubern benötigt. Siehe Seite 289
item.zauberformelWahrnehmung.desc              = Wird zum Erlernen von Zaubern benötigt. Siehe Seite 289
item.zauberspeicher.desc                       = Wenn ein charakter einen Zauber durch einen Zauberspeicher wirkt, erhält der \nZauberspeicher den Zauber aufrecht, wodurch der Charakter den Würfelpoolmalus für das\n Aufrechterhalten umgehen kann. Ein Zauber, der von einem Zauberspeicher aufrecht erhalten werden soll,\ndarf keine höhere Kraftstufe als der Fokus haben und muss zur Kategorie des Zaubers passen.\nWenn der Zauber, den der Fokus aufrecht erhält, verdrängt wird, bleibt der Fokus weiter \naktiv und gebunden, erhält aber nichts mehr aufrecht. Ein Zauberspeicher kann keine Ritualzauber aufrecht\n erhalten.
item.zauberspruchfokus.desc                    = Zauberfoki verstärken Hexereifertigkeiten. Jeder Zauberfokus wird bei seiner Herstellung\n auf eine der fünf Zauber- bzw. Ritualkategorien eingestimmt und kann nicht mehr\n verändert werden.\n\nEin Zauberspruchfokus addiert seine Kraftstufe als Würfelpoolbonus zu Spruchzauberreiproben, \nsolange der Zauber der Kategorie des Fokus entspricht.
item.zen.desc                                  = Dieses psychedelische Halluzinogen ist besonders beliebt bei Leuten, die der Realität entkommen oder tranceähnliche Zustände erreichen wollen.
item.zentrierungsfokus.desc                    = Ein Zentrierungsfokus addiert seine Kraftstufe zum Initiatengrad\nseines Besitzers, wenn dieser die Metamagie Zentrierung für Entzugswiderstandsproben\neinsetzt.

lifestyle.high.desc                    = Ein Oberschicht-Lebensstil bietet ein geräumiges Haus oder eine großzügige Eigentumswohnung, gutes Essen und die Technologie, die das Leben leichter macht. Der Charakter hat nicht die gleichen Vergünstigungen wie die ganz Großen, aber es wollen ihm auch nicht so viele Leute an den Kragen.\nDie Wohnung liegt in einer sicheren Zone oder wird durch gute, solide Bestechungsgelder an den örtlichen Polizeikonzern oder Gangboss geschützt. Der Runner kann sich einen Haushaltsservice oder genügend Technologie dafür leisten.\nDies ist der Lebensstil der Gutsituierten auf beiden Seiten des Gesetzes: Manager in mittlerer Position, Syndikatsbosse der mittleren Laufbahn und \u00C4hnliches.
lifestyle.low.desc                     = In diesem Lebensstil hat der Charakter ein Apartment, und niemand wird ihn großartig belästigen, solange er die Tür sorgfältig verriegelt. Er kann sich regelmäßige Mahlzeiten leisten; das Nutrisoy mag zwar nicht besonders schmecken, aber immerhin ist es heiß. Strom und Wasser sind zu bestimmten rationierten Zeiten verfügbar. Die Sicherheit hängt davon ab, wie regelmäßig die Zahlungen an die örtliche Straßengang sind. Fabrikarbeiter, Kleinkriminelle und andere Leute, die erst am Anfang ihrer Karriere stehen oder gerade eine schlechte Zeit durchmachen, haben einen Unterschicht-Lebensstil.
lifestyle.luxury.desc                  = Dieser Lebensstil bietet von allem das Beste: piekfeine Wohnung, haufenweise Hightech-Spielzeug, das beste Futter, die edelsten Getränke usw. Der Charakter hat Hausangestellte, Dienstmädchen oder hochentwickelte Drohnen, die die Hausarbeit erledigen. Er lebt in einer hübschen Villa, einem schicken Loft oder der Penthouse-Suite eines Tophotels. Die häuslichen Sicherheitsmaßnahmen sind erstklassig, es gibt gut ausgebildete Wachen, astrale Sicherheit und kurze Reaktionszeiten. Das hauseigene Multimediasystem ist besser als in öffentlichen Kinos und erlaubt Zugriffe von jedem Punkt der Wohnstätte aus. Der Charakter steht auf der VIP-Liste diverser exklusiver Restaurants und Clubs, sowohl realer als auch virtueller. Dies ist der Lebensstil für die Gewinner in der Welt von Shadowrun: Konzernvorstände, hohe Regierungsbeamte, Yakuzabosse und die Handvoll Shadowrunner, die den großen Fang gemacht haben (und lange genug leben, um davon zu profitieren).
lifestyle.middle.desc                  = Der Mittelschicht-Lebensstil bietet ein nettes Häuschen oder eine Eigentumswohnung mit immer noch einer Menge Komfort. Ein Charakter mit diesem Lebensstil ernährt sich von Nutrisoy und kann sich hin und wieder auch natürliche Nahrungsmittel leisten, doch immerhin hat der Autokoch eine vollständige Geschmackspalette. Dies ist der Lebensstil der durchschnittlich erfolgreichen Gehaltsempfänger und Kriminellen.
lifestyle.squatter.desc                = Das Leben stinkt \u2013 und die meiste Zeit tut es der Charakter auch. Er isst billiges Nutrisoy und Hefe, der er tropfenweise Aromastoffe hinzugibt. Er lebt in einem besetzten Haus, das vielleicht ein bisschen aufgemöbelt wurde, eventuell umgebaut zu einem Schlafsaal oder aber in schrankgroße Räume unterteilt, zusammen mit anderen Squattern. Oder er mietet sich nachts in einem Sarghotel ein. Das Einzige, was noch schlimmer ist als der Squatter-Lebensstil, ist das Leben auf der Straße.
lifestyle.street.desc                  = Der Charakter lebt auf der Straße \u2013 oder in der Kanalisation, in Lüftungsschächten, zerfallenen Gebäuden oder wo auch immer er gerade unterkommen kann. Mahlzeiten gibt es, wann immer man irgendwo etwas fi ndet, Körperpfl ege ist nur ein Wort, und die einzige Sicherheit ist die, für die man selbst sorgen kann. Dieser Lebensstil liegt ganz unten auf der sozialen Leiter und wird von Verlierern aller Sorten gepflegt.

lifestyleoption.corporate_owned.desc   = Das Domizil liegt innerhalb des Territoriums eines Konzerns, zum Beispiel in einem Wohnkomplex für Lohnsklaven oder in einer Arkologie. Der Maximalwert und Ausgangswert der Kategorie Komfort & Grundversorgung steigen um jeweils 1. Auch die Kategorie Sicherheit steigt um 1 über den Ausgangswert. Die verfügbaren Lebensstilpunkte sinken um 3. Wenn der mit dieser Option verbundene Lebensstil nicht mindestens 3 Lebensstilpunkte bietet, ist damit kein Leben auf Konzerngebiet möglich. Um diese Lebensstiloption zu wählen, muss der Charakter den Nachteil SIN-Mensch (Eingeschränkte Konzern-SIN oder Konzernbürger-SIN) haben (s. SR5, S. 94).
lifestyleoption.cramped.desc           = Es ist nicht klein, es ist gemütlich \u2013 so jedenfalls hatte der Vermieter es beschrieben. Es gibt gerade genug Platz zum Leben, für viel mehr aber auch nicht. Hobbys und Heimarbeit kann man vergessen, ebenso die Beine auszustrecken, wenn man sitzt \u2013 es ist einfach nicht genug Platz. Alle Fertigkeitsproben, bei denen Logik verwendet wird und die in dieser Wohnung abgelegt werden, haben einen Limit-Malus von -2 (bis zu einem Minimum von 1).
lifestyleoption.dangerous_area.desc    = \u201EIst das nicht da, wo gestern dieser Typ erschossen wurde?\u201C Die Gegend, in der der Charakter wohnt, ist besonders gefährlich, ein Sündenpfuhl des Verbrechens und der Gewalt. Sicherheitsdienste und Polizei sind dort überfordert, sie reagieren nur auf die schlimmsten Vorkommnisse und dann auch meistens mit Verzögerung. Hier in der Gegend passt jeder auf sich selbst auf. Wenigstens ist die Miete hier niedriger, aber man sollte keine Wertsachen in seiner Wohnung lassen. Alle Proben für High Threat Response (siehe S. 355) sowie andere Sicherheitsreaktionen erfolgen eine Stufe niedriger, als für die Gegend normalerweise üblich wäre.
lifestyleoption.difficult_to_find.desc = \u201EWo wohnst du? An der Ecke von was?\u201C Die Wohnung des Charakters ist sehr schwer zu finden oder liegt in einer abgelegenen, wenig bekannten Gegend der Stadt. Jeder braucht eine Wegbeschreibung oder eine gute Karte, um die Adresse zu fi nden, und selbst dann verlaufen sich noch viele. Beim Pizzaservice hat der Charakter es längst aufgegeben, er trifft sich mit dem Boten an der nächsten Kreuzung. Alle Schleichenproben (außer vom Charakter selbst) in der Nähe der Adresse erhalten einen Würfelpoolmodifikator von -2.
lifestyleoption.extra_secure.desc      = Der Charakter lebt in einer besonders sicheren Ecke. Vielleicht ist das Wohngebiet von einer Mauer umgeben, wird von einem besonders wachsamen Sicherheitsdienstleister beschützt, gehört zum Revier einer altruistischen Gang oder liegt ganz in der Nähe eines besonders mächtigen Individuums, mit dem sich niemand gern anlegen möchte. Was auch immer der Grund ist, die Sicherheit der Behausung des Charakters ist höher als für die Gegend typisch. Alle Würfe für High Threat Response (siehe S. 355) sowie andere Sicherheitsreaktionen erfolgen eine Stufe höher, als für die Gegend normalerweise üblich wäre.
lifestyleoption.special_work_area.desc = Zur Wohnung gehört eine Werkstatt, eine Garage, ein Büroraum, ein Atelier oder irgendein anderer größerer Raum, in dem sich ein spezieller Arbeitsbereich unterbringen lässt. Spezialausrüstung kann darin nach eigenen Vorstellungen und Bedürfnissen aufgebaut werden, wodurch sich kleinere und größere Arbeiten schnell und einfach erledigen lassen.\nFertigkeitsproben, die dort abgelegt werden und den Raum und seine Gerätschaften nutzen, haben einen Bonus von +2 auf das jeweilige Limit.

magicOrResonance.adept.desc            = \u2022 Adepten kanalisieren Mana in ihren Körper, um ihre natürlichen Fähigkeiten zu steigern, wodurch ihre Talente und Fertigkeiten viel mächtiger werden.\n\u2022 Adepten können nicht astral projizieren (S. 313).\n\u2022 Adepten können den Astralraum nur wahrnehmen, wenn sie die Kraft Astrale Wahrnehmung (S. 308) kaufen.\n\u2022 Adepten können die Fertigkeit Askennen nur lernen, wenn sie die Kraft Astrale Wahrnehmung besitzen.\n\u2022 Adepten können keine Fertigkeiten aus den Fertigkeitsgruppen Hexerei, Beschwören, oder Verzaubern verwenden.\n\u2022 Adepten können Schutzgeistern (S. 319) folgen.\n\u2022 Adepten erhalten Adeptenkräfte (S. 308), die mit Kraftpunkten bezahlt werden. Adepten erhalten eine Anzahl von Kraftpunkten gleich ihrem Magieattribut.
magicOrResonance.aspectedmagician.desc = Aspektzauberer sind Zauberer, die auf einen Aspekt der Magie beschränkt sind.\n\u2022 Aspektzauberer können nicht astral projizieren.\n\u2022 Aspektzauberer können astral wahrnehmen.\n\u2022 Aspektzauberer müssen sich für eine einzige der folgenden drei Fertigkeitsgruppen entscheiden:\n\u2022 Hexerei (Spruchzauberei und verwandte Fertigkeiten)\n\u2022 Beschwören (Herbeirufen und verwandte Fertigkeiten)\n\u2022 Verzaubern (Alchemie und verwandte Fertigkeiten)\n\u2022 Aspektzauberer können keine Fertigkeiten aus den beiden nicht gewählten Fertigkeitsgruppen verwenden.\n\u2022 Aspektzauberer können Antimagie nur lernen, wenn sie die Fertigkeitsgruppe Hexerei gewählt haben.\n\u2022 Aspektzauberer können Schutzgeistern (S. 319) folgen.\n\u2022 Bei der Charaktererschaffung dürfen Aspektzauberer, die Zauber wirken, Rituale durchführen oder Alchemische Erzeugnisse herstellen, eine maximale Anzahl an entsprechenden Formeln gleich ihrer Magie x 2 erlernen (d.h., ein Magieattribut von 4 erlaubt 8 Zauber, 8 Rituale oder 8 Alchemische Zauber, je nach gewählter Fertigkeitsgruppe).
magicOrResonance.magician.desc         = \u2022 Zauberer können astral wahrnehmen.\n\u2022 Zauberer können astral projizieren.\n\u2022 Zauberer können beliebige magische Fertigkeiten oder Fertigkeitsgruppen (Hexerei, Beschwören, Verzaubern) wählen.\n\u2022 Zauberer können Zauber wirken, Geister beschwören und magische Gegenstände verzaubern.\n\u2022 Zauberer können Schutzgeistern (S. 319) folgen.\n\u2022 Bei der Charaktererschaffung dürfen Zauberer, die Zauber wirken, Rituale durchführen oder Alchemische Erzeugnisse herstellen, eine maximale Anzahl an Formeln aus jeder Gruppe gleich ihrer Magie x 2 erlernen (d.h., ein Magieattribut von 4 erlaubt 8 Zauber, 8 Rituale und 8 Alchemische Zauber).
magicOrResonance.mysticadept.desc      = \u2022 Magieradepten sind eine Kombination aus Zauberern und Adepten.\n\u2022 Magieradepten können nicht astral projizieren.\n\u2022 Magieradepten können astral wahrnehmen, wenn sie die Adeptenkraft Astrale Wahrnehmung kaufen.\n\u2022 Magieradepten kaufen ihre Zauber, Rituale und/oder Alchemischen Zauber auf dieselbe Weise wie Zauberer.\n\u2022 Magieradepten müssen ihre Kraftpunkte mit Karma kaufen (bei der Charaktererschaffung erhalten sie für 5 Karma 1 Kraftpunkt, mit einem Maximum an Kraftpunkten gleich ihrem Magieattribut).\n\u2022 Magieradepten können Schutzgeistern (S. 319) folgen.\n\u2022 Magieradepten können beliebige magische Fertigkeiten oder Fertigkeitsgruppen (Hexerei, Beschwören, Verzaubern) wählen.
magicOrResonance.technomancer.desc     = Technomancer sind Metamenschen mit der mysteriösen (geradezu mystischen) Gabe, ohne technische Geräte mit der Matrix zu interagieren. Sie haben nicht nur diese übernatürlich wirkende Fähigkeit, sondern können auch Dinge bewerkstelligen, die kein Computer könnte oder können sollte.

mentorspirit.bear.desc = Dieser Schutzgeist steht für Schutz und Stärke. Er ist ein Heiler und kann niemanden im Stich lassen, ohne einen guten Grund dafür zu haben. Außerdem verteidigt er die Wesen, die unter seinem Schutz stehen. Bär ist aber mehr als nur ein sanfter Heiler: Er ist ein wild entschlossener Beschützer, der im Kampf seine eigene Sicherheit ignoriert, wenn er oder einer seiner Schutzbefohlenen verletzt wird.
mentorspirit.cat.desc=Katze wird von Kulturen auf der ganzen Welt verehrt. Sie wird häufig als Hüterin mystischer Geheimnisse gesehen - auch jener über das Leben nach dem Tode. Sie kennt sicher viele Geheimnisse, teilt sie aber nur selten und weiht erst recht niemanden ein, der unwürdig ist. Sie ist verstohlen, schlau und arrogant. Katze spielt mit ihren Opfern  bedroht sie, verfolgt und verwirrt sie , bevor sie dann erbarmungslos zuschlägt. \nVORTEILE \nAllgemein: +2 Würfel für Akrobatik- oder Schleichenproben (nach Wahl des Spielers) \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Illusion \nAdept: 2 Stufen Leichter Körper gratis \nNACHTEILE \nZauberer, die Katze folgen, spielen mit ihren Opfern. Wenn der Charakter zu Kampfbeginn eine Probe auf Charisma + Willenskraft (3) nicht schafft, kann er keinen Angriff durchführen, der sein Ziel handlungsunfähig machen würde (z.B. keinen Kampfzauber mit einer Kraftstufe wirken, die das Ziel ausschalten würde). Wenn der Charakter Körperlichen Schaden erleidet, hört dieses Herumspielen sofort auf. \nÄhnliche Archetypen: Heimlichkeit, Mysterium
mentorspirit.dog.desc=Hund ist ein loyaler Freund. Er kämpft erbittert für den Schutz der Seinen und seines Heims. Hund schützt die Leute vor schädlicher Magie und gefährlichen Geistern. Er ist loyal, großzügig und hilft jenen, die freundlich zu ihm sind. Er ist zielstrebig bis an die Grenze zur Sturheit. \nVORTEILE \nAllgemein: +2 Würfel für Spurenlesenproben \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Wahrnehmung \nAdept: 2 Geschärfte Sinne gratis \nNACHTEILE \nEin Zauberer, der Hund folgt, ist unverbrüchlich loyal. Er kann niemanden im Stich lassen, seine Freunde verraten oder es zulassen, dass jemand sich für ihn opfert, wenn ihm keine Probe auf Charisma + Willenskraft (3) gelingt. \nÄhnliche Archetypen: Freundschaft, Loyalität
mentorspirit.dragonslayer.desc=Dieser heldenhafteste aller Schutzgeister ist zugleich der lebenslustigste. Er kämpft natürlich für die Seinen gegen alle Gefahren, schätzt aber Partys und Vergnügen noch viel mehr. Er ist ein großer Bruder, der sich freundlich für alles interessiert, was seine Familie macht. Manchmal ist er ein wenig naiv, aber er ist ein verlässlicher Freund und ein tödlicher Feind. Die Drachen, die er tötet, haben sich mit der Zeit verändert: Im Moment sind seine bestialischen Feinde das Verbrechen, die Umweltverschmutzung, Korruption  und natürlich echte Drachen. Drachentöter kämpft und spielt mit harten Bandagen. Einen einmal geleisteten Eid wird er niemals brechen. Drachentöter verhält sich ehrenvoll und höflich und verlangt das auch von seiner Umgebung. \nVORTEILE \nAllgemein: +2 Würfel für eine Soziale Fertigkeit nach Wahl des Spielers \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Kampf \nAdept: Einmal Erhöhte Präzision (Fertigkeit) und 1 Stufe Gefahrensinn gratis \nNACHTEILE \nWenn ein Anhänger des Drachentöters (absichtlich oder unabsichtlich) ein Versprechen bricht, erleidet er einen Würfelpoolmodifikator von -1 auf alle Handlungen, bis er es wiedergutgemacht hat. \nÄhnliche Archetypen: Abenteuer, Heldentum
mentorspirit.eagle.desc=Adler fliegt von allen Vögeln am höchsten und wird in vielen Kulturen für den edelsten aller Vögel gehalten. Er ist ein stolzer Einzelgänger, der alles, was in der Welt geschieht, von oben betrachtet. Adler ist ein nobler Verteidiger der Reinheit der Natur. Er ist gegenüber anderen Meinungen intolerant und misstraut der Technologie und ihren Erzeugnissen zutiefst. Wer die Natur schädigt, ist Adlers Feind, und Adler wird große Gefahren auf sich nehmen, um Verschmutzer und andere Übeltäter zu besiegen. \nVORTEILE \nAllgemein: +2 Würfel für Wahrnehmungsproben \nZauberer: +2 Würfel für das Herbeirufen von Luftgeistern \nAdept: 1 Stufe Kampfsinn gratis \nNACHTEILE \nEin Anhänger von Adler erhält den Nachteil Allergie (Schadstoffe, Leicht) (S. 88) ohne Karmabonus. \nÄhnliche Archetypen: Der Hüter, Natur
mentorspirit.firebringer.desc=Feuerbringer hat das Geheimnis des Feuers aus dem Himmel gestohlen und der Metamenschheit zum Geschenk gemacht. Er ist eine gütige und achtsame Gestalt, aber seine guten Absichten bringen ihn oft in Schwierigkeiten, und seine Pläne entwickeln sich oft anders, als er dachte. Er ist ein Schöpfer und Former, der aus dem Urschlamm Neues schafft und ihm den feurigen Atem des Lebens einhaucht. Anhänger des Feuerbringers streben nach Verbesserungen für andere Leute, auch auf eigene Kosten. Die meisten seiner Anhänger verschreiben sich mit ganzen Herzen einem großen Ziel. \nVORTEILE \nAllgemein: +2 Würfel für Handwerk- oder Alchemieproben (nach Wahl des Spielers) \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Manipulation \nAdept: 1 Stufe Verbesserte Fertigkeit (Fertigkeit); nicht für Kampffertigkeiten \nNACHTEILE \nWenn jemand eindringlich um Hilfe bittet, kann ein Anhänger des Feuerbringers diese nicht verweigern, wenn ihm keine Probe auf Charisma + Willenskraft (3) gelingt. \nÄhnliche Archetypen: Erfindung, Großzügigkeit
mentorspirit.mountain.desc=Berg ist im Herzen der Erde verwurzelt und wächst zugleich in den Himmel. Er hat unendliche Kraft und Ausdauer, ist aber wenig flexibel. Berg ist stur und unnachgiebig, und Zauberer, die Berg folgen, lassen sich, wenn sie sich einmal eine Meinung gebildet haben, nur schwer umstimmen. \nVORTEILE \nAllgemein: +2 Würfel für Survivalproben \nZauberer: +2 Würfel für Antimagieproben und Verankerte Rituale \nAdept: 1 Stufe Mystischer Panzer gratis \nNACHTEILE \nWenn ein Anhänger von Berg einen Plan gefasst hat, bleibt er dabei. Er muss eine Probe auf Charisma + Willenskraft (3) schaffen, um ein geplantes Vorgehen aufzugeben und einem neuen Plan zu folgen. Wenn die Probe misslingt, muss er dem ursprünglichen Plan folgen  wenn nötig auch alleine. Genauso muss er eine Probe auf Charisma + Willenskraft (3) schaffen, um bei irgendetwas ganz ohne Plan vorzugehen. \nÄhnliche Archetypen: Ausdauer, Sturheit
mentorspirit.rat.desc=Ratte ist überall, wo Metamenschen leben und ihren Abfall abladen, weil sie davon lebt. Sie ist ein Aasfresser, ein verstohlener Dieb, der sich nimmt, was er zum Überleben braucht. Ratte hasst es, ins Offene zu kommen, und hält sich lieber im Schatten. Sie vermeidet Kämpfe, wann immer es geht. Wenn sie aber kämpfen muss, dann kämpft sie, um schnell zu töten und schnell wieder zu verschwinden. \nVORTEILE \nAllgemein: +2 Würfel für Schleichenproben \nZauberer: +2 Würfel für Alchemieproben beim Sammeln von Reagenzien; außerdem darf der Charakter Reagenzien aller Traditionen benutzen, ohne dass darunter ihre Wirksamkeit leidet \nAdept: 2 Stufen Natürliche Immunität gratis \nNACHTEILE \nEin Charakter, der Ratte folgt, muss eine Probe auf Charisma + Willenskraft (3) schaffen, um im Kampf nicht sofort zu fliehen. Wenn er nicht fliehen kann, muss er kämpfen. \nÄhnliche Archetypen: Plünderung, Überleben
mentorspirit.raven.desc=Rabe ist weltweit als Unglücksbote verschrien. Er ist ein Täuscher und Blender - finster und hinterlistig. Rabe lebt von den Hinterlassenschaften von Krieg und Chaos, löst diese aber nicht selbst aus - er ergreift nur die Gelegenheiten, die sich ihm bieten. Rabe liebt gutes Essen und schlägt nur selten eine Einladung aus. Rabe ist ein Vetter von Kojote, der mit Rabe zwar den Hang zum Schwindel, nicht aber dessen Düsternis und Hang zum Gemetzel teilt. \nVORTEILE \nAllgemein: +2 Würfel für Überredenproben \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Manipulation \nAdept: Spurloser Schritt oder 1 Stufe Stimmkontrolle gratis \nNACHTEILE \nEin Anhänger von Rabe muss eine Probe auf Charisma + Willenskraft (3) schaffen, um das Unglück anderer nicht zu seinem Vorteil zu nutzen, oder um sich einen schlauen Trick oder Scherz zu verkneifen, selbst wenn dieser seinen Freunden zum Nachteil gereichen würde. \nÄhnliche Archetypen: Täuschung, Unheil
mentorspirit.sea.desc=Meer ist die Wiege allen Lebens. Es ist undurchschaubar und unberechenbar - ruhig und angenehm im einen Moment, furchterregend und zerstörerisch im nächsten. Obwohl Meer unendlich reich ist, wacht es eifersüchtig über alles, was es in die Finger bekommt. Meer kann ein mächtiger Verbündeter sein, aber es muss ständig mit großer Vorsicht umworben werden. \nVORTEILE \nAllgemein: +2 Würfel für Schwimmenproben \nZauberer: +2 Würfel für das Herbeirufen von Wassergeistern \nAdept: 1 Stufe Verbesserte Fertigkeit auf eine Athletikfertigkeit (nach Wahl des Spielers) \nNACHTEILE \nEin Anhänger von Meer muss eine Probe auf Charisma + Willenskraft (3) schaffen, um etwas herzugeben, das ihm gehört, oder auf irgendeine Weise wohltätig zu sein. \nÄhnliche Archetypen: Chaos, Gier
mentorspirit.seducer.desc=Der Verführer ist die Verkörperung des Verlangens. Er hat etliche Laster, die er häufig befriedigen muss. Er stachelt zu Eifersucht und Gier an und trachtet danach, die Begierden anderer zu wecken. Direkte Konfrontationen vermeidet er, liebt es aber, wenn andere für oder um ihn kämpfen. Er existiert, um die Schwächen anderer auszunutzen, und zögert nicht, diejenigen zu opfern, die ihm im Weg stehen. \nVORTEILE \nAllgemein: +2 Würfel für Überredenproben \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Illusion \nAdept: 1 Stufe Verbesserte Fertigkeit für eine Fertigkeit aus den Gruppen Schauspielerei oder Einfluss (nach Wahl des Spielers) \nNACHTEILE \nDer Charakter muss eine Probe auf Charisma + Willenskraft (3) schaffen, um einem Laster oder einer Neigung (Drogen, BTLs, Sex usw.) nicht bei erster Gelegenheit nachzugeben. \nÄhnliche Archetypen: Verführerin, Verlockung
mentorspirit.shark.desc=Hai ist ein gnadenloser, kalter Jäger. Alle, die am Meer leben, kennen seine Macht. Wenn Hai zuschlägt, tut er das ohne Gnade und wird vom Blut seiner Beute in Raserei versetzt. Haizauberer sind ruhelose Wanderer und wilde, tödliche Kämpfer. Ein Haizauberer findet, dass nur ein toter Feind ein guter Feind ist. Wenn Hai herausgefordert wird, hält er sich nicht mit Drohungen auf, sondern schlägt zu, um zu töten. \nVORTEILE \nAllgemein: +2 Würfel für Proben auf Waffenlosen Kampf \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Kampf \nAdept: Todeskralle gratis \nNACHTEILE \nDer Charakter kann zum Berserker werden, wenn er im Kampf Körperlichen Schaden erleidet. Legen Sie (mit Verletzungsmodifikatoren) eine Probe auf Charisma + Willenskraft ab. Der Charakter verfällt für 3 Runden minus 1 Runde pro Erfolg in einen Berserkerrausch. 3 oder mehr Erfolge können den Berserkerrausch komplett verhindern. Wenn der Charakter bereits im Berserkerrausch ist, erhöht sich die Dauer entsprechend. In diesem Zustand stürzt sich der Charakter auf seine(n) Gegner, ohne auf seine eigene Sicherheit zu achten. Wenn er seine(n) Gegner vor Ablauf des Berserkerrausches kampfunfähig macht, attackiert er die leblosen Körper. \nÄhnliche Archetypen: Gewalt, Hunger
mentorspirit.snake.desc=Schlange ist weise und kennt viele Geheimnisse. Sie gibt klugen Rat, verlangt dafür aber immer einen Preis. Anhänger von Schlange kämpfen nur, um sich und andere zu schützen. Sie sind davon besessen, Geheimnisse zu entdecken, und nehmen dafür auch große Risiken auf sich. Sie tauschen ihr Wissen mit anderen gegen alles, was sie dafür bekommen können. \nVORTEILE \nAllgemein: +2 Würfel für Arkanaproben \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Wahrnehmung \nAdept: 2 Stufen Körpersprache gratis \nNACHTEILE \nEinem Anhänger von Schlange muss eine Probe auf Charisma + Willenskraft (3) gelingen, damit er Hinweisen auf Geheimnisse oder Wissen, das nur wenigen bekannt ist, nicht folgt. \n Ähnliche Archetypen: Neugier, Wissen
mentorspirit.thunderbird.desc=Donnervogel ist die majestätische Verkörperung des Sturms. Seine Schwingen sind dunkle Wolken, Schnabel und Krallen sind Blitze, und sein Schrei ist Donnergrollen. Donnervogel ist eine Urgewalt - oft wild, aber nötig für das Überleben des Landes und das Aufrechterhalten des Lebenskreislaufs. Man muss diese Gewalt respektieren und sich ihr vorsichtig nähern, um nicht ihren Zorn zu wecken. \nVORTEILE \nAllgemein: +2 Würfel für Einschüchternproben \nZauberer: +2 Würfel für das Herbeirufen von Luftgeistern \nAdept: Einmal Kritischer Schlag (Fertigkeit) gratis \nNACHTEILE \nEin Anhänger von Donnervogel muss eine Probe auf Charisma + Willenskraft (3) schaffen, um auf eine Beleidigung nicht scharf zu reagieren. \nÄhnliche Archetypen: Krieg, Zorn
mentorspirit.wise_warrior.desc=Der Weise Krieger beherrscht die Kriegskunst, denn für ihn ist die Schlacht eine Übung für Geist und Körper. Er studiert die Taktik seiner Feinde und besiegt sie durch eine Mischung aus überlegener Strategie und Kampfkraft. Der Weise Krieger handelt nicht aus Barbarei oder Kriegslust, sondern aus Weisheit und Wissen. Weise Krieger müssen dem Ehrenkodex des Kriegers folgen und sich entsprechend benehmen. \nVORTEILE \nAllgemein: +2 Würfel für Führungs- oder Unterrichtsproben (nach Wahl des Spielers) \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Kampf \nAdept: 1 Stufe Verbesserte Fertigkeit für eine Kampffertigkeit \nNACHTEILE \nWenn sich ein Anhänger des Weisen Kriegers (absichtlich oder unabsichtlich) ehrlos oder unhöflich verhält, erhält er einen Würfelpoolmodifikator von -1 auf alle Handlungen, bis er für sein Verhalten gebüßt hat. \nÄhnliche Archetypen: Pfilicht, Weisheit
mentorspirit.wolf.desc=Wolf ist auf der ganzen Welt als Jäger und Krieger bekannt. Er widmet sich hingebungsvoll seinem Rudel. Wolf gewinnt jeden Kampf seines Lebens - außer seinem letzten. Anhänger von Wolf sind ihrer Familie und ihren Freunden gegenüber bis in den Tod loyal. Sie zeigen im Kampf niemals Feigheit und halten immer ihr Wort. \nVORTEILE \nAllgemein: +2 Würfel für Spurenlesenproben \nZauberer: +2 Würfel für Zauber, Rituale und Alchemische Erzeugnisse der Kategorie Kampf \nAdept: 2 Stufen Attributsschub (Geschicklichkeit) gratis \nNACHTEILE \nEin Anhänger von Wolf muss eine Probe auf Charisma + Willenskraft (3) schaffen, um sich aus einem Kampf zurückzuziehen. \nÄhnliche Archetypen: Jagd, Kameradschaft

metatype.dwarf.desc = Wie zu erwarten, sind Zwerge kleiner und untersetzter als Menschen. Sie sind ziemlich stark und sehr zäh. Zwerge erholen sich schnell von Schaden, egal ob durch Schläge auf den Kopf oder Gift. Oder durch Schläge auf den Kopf mit einer Keule, die in Giftpflanzen eingewickelt ist. Zwerge arbeiten hart und werden von Konzernen hoch geschätzt, daher sind sie besser in die Menschengemeinde integriert als andere Metatypen. Sie werden aber immer noch wegen ihrer Größe diskriminiert und müssen sich anstrengen, damit ihnen eine Welt, die für Menschen entworfen ist, besser zugänglich wird.
metatype.elf.desc   = Elfen sind größer und schlanker als Menschen und haben spitze Ohren. Sie haben die extrem nervige Gabe, geschickter als Menschen zu sein \u2013 und sie sehen auch noch besser aus. Außerdem leben sie länger und sehen mit vierzig oder fünfzig immer noch jung aus. Ab und zu geben sie mit diesen Vorzügen an \u2013 gegenüber Menschen oder jedem, der in Hörweite kommt. Die meisten Elfen erschienen während des Erwachens zeitgleich mit den anderen Metatypen. Es gibt aber Gerüchte, dass sich ein paar Elfen während der magischen Ebbe der Fünften Welt irgendwo verborgen hielten und viel älter sind,
metatype.human.desc = Der Mensch ist von allen Metatypen (vielleicht mit einer Ausnahme) am längsten auf der Erde vertreten. Man kennt und liebt sie \u2013 und wenn Sie das lesen, sind Sie höchstwahrscheinlich selbst einer. Sie besitzen recht gut ausbalancierte Fähigkeiten und haben meist etwas mehr Glück (regeltechnisch also mehr Edge) als die anderen Metatypen.
metatype.ork.desc   = Orks sehen wie die Kreaturen aus, die seit fast 150 Jahren in Fantasy-Filmen und -Trideos massenweise hingemetzelt werden. Sie haben starke Brauenwülste, vorstehende Hauer, sind groß und breit und haben es schwer, nicht als gedankenlos brutale Barbaren abgestempelt zu werden. Das wird dadurch nicht leichter, dass etliche Orks sich fröhlich dem Vorurteil entsprechend verhalten, statt gegen es anzukämpfen. Daher gibt es unterschwellige Spannungen zwischen Orks und Menschen, weswegen die beiden Metatypen lieber in getrennten Vierteln leben. Elfen und Orks hingegen leben nicht einmal gerne im selben Land zusammen. Orks haben, trotz aller Vorurteile, alle möglichen Berufe in allen möglichen Umgebungen: von der finsteren Gasse bis zum Konzernaufsichtsrat. Sie haben eine geringere Lebensspanne als Menschen und wollen deshalb oft so viel wie möglich von ihren wenigen Jahren haben.
metatype.troll.desc = Neben Trollen sehen Orks wie ganz gewöhnliche Bürger aus. Orks sind im Schnitt vielleicht knapp einen Viertelmeter größer als Menschen, aber Trolle sind über einen halben Meter größer als Orks. Orks sehen vielleicht wie monströse Menschen aus; Trolle dagegen sehen wie die entfernt menschliche Version einer Albtraumgestalt aus. Mit ihren dicken, gewundenen Hörnern (die einige von ihnen abschneiden, andere hingegen stolz polieren), spitzen Kalziumablagerungen an ihren Gelenken und Muskeln, die so groß wie junge Schweine sind, sehen Trolle aus, als wären sie geschaffen, um zu zerstören. Die meisten von ihnen können diesem Vorurteil voll entsprechen. Aber nicht alle Trolle wollen Schaden verursachen oder aushalten. Sie versuchen, im Leben verschiedene Rollen einzunehmen, aber ihre Größe und die vielen Vorurteile machen ihnen das schwer. Orks haben mit Trollen die wenigsten Schwierigkeiten, und die beiden Metatypen bewohnen oft dieselben Viertel. In den meisten Sprawls sind das nicht gerade die reichsten Gegenden.

quality.addiction_burnout.desc  = Mindestens 3 Dosen oder 3 Stunden Zeit für das Verhalten:\nEin Ausgebrannter Süchtiger ist im letzten Stadium der Abhängigkeit. Er muss sein Verlangen jeden Tag stillen. Wenn er die Dosierung nicht erreicht hat, erhält er wegen der Entzugserscheinungen einen Würfelpoolmodifi kator von -6 auf alle Proben mit Geistigen Attributen (bei psychischer Abhängigkeit) bzw. Körperlichen Attributen (bei körperlicher Abhängigkeit).\nWeil die Abhängigkeit jetzt jedem, auch dem zufälligen, Beobachter auffällt, erhält der Charakter einen Würfelpoolmodifi kator von -3 auf alle Sozialen Proben, egal ob er auf Entzug ist oder nicht.
quality.addiction_mild.desc     = 1 Dosis oder 1 Stunde Zeit für das Verhalten\nEinmal im Monat verspürt der Charakter ein leichtes Verlangen. Wenn er die Entzugsprobe nicht schafft, leidet er unter Entzugserscheinungen und muss aktiv nach der Substanz suchen oder zu dem Verhalten hin drängen. Bei einem Run könnte das dazu führen, dass mühsam und akkurat erstellte Zeitpläne durcheinander kommen, weil ein Charakter bei einem Buchmacher spielen oder einen BTL-Chip einschieben muss, statt einsatzbereit zu sein. Solange der Charakter Entzugserscheinungen hat, erhält er einen Würfelpoolmodifi kator von -2 auf alle Proben mit Geistigen Attributen (bei psychischer Abhängigkeit) bzw. Körperlichen Attributen (bei körperlicher Abhängigkeit). Wenn der Charakter die Entzugsprobe schafft, leidet er nicht unter Entzugserscheinungen und braucht die Substanz oder die Gewohnheit nicht, bis er (in einem Monat) die nächste Entzugsprobe ablegen muss. Diesen Monat kann er clean bleiben.
quality.addiction_moderate.desc = 1 Dosis oder 1 Stunde Zeit für das Verhalten\nMittlere Abhängigkeit führt etwa alle zwei Wochen zu einem Verlangen. Solange der Charakter Entzugserscheinungen hat, erhält er einen Würfelpoolmodifi kator von -4 auf alle Proben mit Geistigen Attributen (bei psychischer Abhängigkeit) bzw. Körperlichen Attributen (bei körperlicher Abhängigkeit).
quality.addiction_severe.desc   = 2 Dosen oder 2 Stunden Zeit für das Verhalten: Die Abhängigkeit gerät außer Kontrolle. Der Süchtige hat jede Woche ein Verlangen, das befriedigt werden muss. Wenn die Entzugsprobe scheitert, erleidet der Charakter wegen der Entzugserscheinungen einen Würfelpoolmodifi kator von -4 auf alle Proben mit Geistigen Attributen (bei psychischer Abhängigkeit) bzw. Körperlichen Attributen (bei körperlicher Abhängigkeit).\nAußerdem erhält er für alle Sozialen Proben einen Würfelpoolmodifi kator von -2, egal ob er auf Entzug ist oder nicht.\nEine so schwere Abhängigkeit lässt sich kaum verbergen, selbst wenn der Charakter seinen Schuss bekommen hat. Die geistigen und körperlichen Symptome der Abhängigkeit sind bei genauer Betrachtung deutlich zu sehen.
quality.allergy_common_mild.desc      = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters häufig vor. Beispiele: Sonnenlicht, Meeresfrüchte, Bienengift, Pollen, Smog, WiFi-Signale, Soja, Weizen.\n\
 Die Symptome sind unangenehm und lenken ab. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -2 auf Proben mit Körperlichen Attributen.
quality.allergy_common_extreme.desc   = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters häufig vor. Beispiele: Sonnenlicht, Meeresfrüchte, Bienengift, Pollen, Smog, WiFi-Signale, Soja, Weizen.\n\
 Eine so schwere Allergie löst einen anaphylaktischen Schock aus. Der Charakter erhält für alle Proben einen Würfelpoolmodifi kator von -6 und windet sich unter extremen Schmerzen. Er erleidet alle 30 Sekunden, in denen er dem Allergen ausgesetzt ist, 1 Kästchen Körperlichen Schaden, dem nicht widerstanden werden kann. Erste Hilfe, Medizin oder magische Heilung können weiteren Schaden durch den anaphylaktischen Schock verhindern.
quality.allergy_common_moderate.desc  = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters häufig vor. Beispiele: Sonnenlicht, Meeresfrüchte, Bienengift, Pollen, Smog, WiFi-Signale, Soja, Weizen.\n\
 Der Kontakt mit dem Allergen ruft starke Schmerzen hervor. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -4 auf Proben mit Körperlichen Attributen.
quality.allergy_common_severe.desc     = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters häufig vor. Beispiele: Sonnenlicht, Meeresfrüchte, Bienengift, Pollen, Smog, WiFi-Signale, Soja, Weizen.\n\
 Der Kontakt mit dem Allergen löst extreme Schmerzen und Körperlichen Schaden aus. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -4 auf alle Proben. Außerdem erleidet er pro Minute, in der er dem Allergen ausgesetzt ist, 1 Kästchen Körperlichen Schaden, dem nicht widerstanden werden kann.
quality.allergy_mild.desc        = Die Symptome sind unangenehm und lenken ab. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -2 auf Proben mit Körperlichen Attributen.
quality.allergy_uncommon_mild.desc   = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters selten vor. Beispiele: Silber, Gold, Gras, Antibiotika.\n\
 Die Symptome sind unangenehm und lenken ab. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -2 auf Proben mit Körperlichen Attributen.
quality.allergy_uncommon_moderate.desc   = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters selten vor. Beispiele: Silber, Gold, Gras, Antibiotika.\n\
 Der Kontakt mit dem Allergen ruft starke Schmerzen hervor. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -4 auf Proben mit Körperlichen Attributen.
quality.allergy_uncommon_severe.desc   = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters selten vor. Beispiele: Silber, Gold, Gras, Antibiotika.\n\
 Der Kontakt mit dem Allergen löst extreme Schmerzen und Körperlichen Schaden aus. Solange der Charakter dem Allergen ausgesetzt ist, erhält er einen Würfelpoolmodifi kator von -4 auf alle Proben. Außerdem erleidet er pro Minute, in der er dem Allergen ausgesetzt ist, 1 Kästchen Körperlichen Schaden, dem nicht widerstanden werden kann.
quality.allergy_uncommon_extreme.desc   = Die Substanz oder Umweltbedingung kommt in der normalen Umgebung des Charakters selten vor. Beispiele: Silber, Gold, Gras, Antibiotika.\n\
 Eine so schwere Allergie löst einen anaphylaktischen Schock aus. Der Charakter erhält für alle Proben einen Würfelpoolmodifi kator von -6 und windet sich unter extremen Schmerzen. Er erleidet alle 30 Sekunden, in denen er dem Allergen ausgesetzt ist, 1 Kästchen Körperlichen Schaden, dem nicht widerstanden werden kann. Erste Hilfe, Medizin oder magische Heilung können weiteren Schaden durch den anaphylaktischen Schock verhindern.
quality.ambidextrous.desc             = Ein beidhändiger Charakter kann Gegenstände mit beiden Händen gleich gut benutzen. Ohne diesen Vorteil erhält man bei jeder Handlung (zum Beispiel beim Schießen), die nur mit der Nebenhand durchgeführt wird, einen Würfelpoolmodifikator von -2 (s. Angreifer benutzt Nebenhand, S. 179).
quality.analytical_mind.desc          = Ein Analytischer Geist hat eine Begabung dafür, Informationen logisch zu analysieren, Problemlösungen zu finden und wichtige von unwichtigen Informationen zu unterscheiden. Das ist beim Dechiffrieren, Lösen von Rätseln, Erkennen von Fallen und Durchkämmen von Datensätzen hilfreich. Dieser Vorteil gewährt dem Charakter einen Würfelpoolmodifikator von +2 auf alle Proben mit Logik, bei denen es um das Erkennen von Mustern, Analysieren oder Finden von Hinweisen oder das Lösen von Rätseln geht. Außerdem senkt dieser Vorteil die Zeit, die der Charakter für das Lösen solcher Aufgaben braucht, um die Hälfte (aufgerundet).
quality.aptitude.desc                 = Durch diesen Vorteil kann man besser werden als die Besten der Welt. Das normale Maximum für Fertigkeiten beträgt 12, aber gelegentlich gibt es einen Charakter, der die Grenzen sprengen kann und in einer bestimmten Fertigkeit geradezu überirdisch gut ist. Mit diesem Vorteil darf ein Charakter eine Fertigkeit bei der Erschaffung auf Stufe 7 lernen und diese später bis auf Stufe 13 erhöhen. Diesen Vorteil darf ein Charakter nur einmal (nur für eine einzige Fertigkeit) wählen.
quality.astral_beacon                 = Die astrale Signatur des Charakters ist \u2013 wie ein Leuchtfeuer \u2013 im Astralraum weithin sichtbar. Sie bleibt durch diesen Nachteil auch doppelt so lange erhalten, wie sie eigentlich sollte. Wenn man versucht, sie zu askennen, sinkt der Schwellenwert für die Askennenprobe außerdem um 1. Nur Charaktere, die ein Magieattribut besitzen, können diesen Nachteil haben.
quality.astral_chameleon.desc         = Durch diesen Vorteil verschwimmt die astrale Signatur eines Charakters vor dem Hintergrund des Astralraums und wird dadurch schwerer zu entdecken. Alle astralen Spuren, die der Charakter hinterlässt, bleiben nur halb so lange (aufgerundet) bestehen wie üblich. Wer die astrale Signatur, die der Charakter hinterlassen hat, askennen will, erhält dafür einen Würfelpoolmodifi kator von -2 auf seine Askennenprobe. Nur Charaktere, die ein Magieattribut haben und astrale Spuren hinterlassen können, dürfen diesen Vorteil haben.
quality.bad_luck                      = Dieser Charakter ist wahrhaft verflucht. Das Schicksal wendet sich oft gegen ihn. Wenn er Edge einsetzt, würfeln Sie 1W6. Bei einer 1 wird der Punkt ausgegeben, hat aber den genau gegenteiligen Effekt. Wenn ein Charakter also zusätzliche Würfel bekommen wollte, bekommt er Würfel in gleicher Höhe abgezogen. Wenn er in einem Initiativedurchgang zuerst an der Reihe sein wollte, ist er stattdessen zuletzt dran. Wenn er Blitzangriff (S. 58) einsetzen wollte, erhält er stattdessen +0W6 und muss für diese Kampfrunde seinen Initiativewert als Initiativeergebnis nehmen. Wenn er einen Patzer ausbügeln wollte, wird der Patzer zu einem Kritischen Patzer. Die Wirkung des Unglücks tritt allerdings nur einmal pro Spielsitzung auf. Wenn das Schicksal dem Charakter einmal übel mitgespielt hat, lässt es ihn bis zur nächsten Spielsitzung in Ruhe, und er muss keinen W6 mehr würfeln, wenn er Edge einsetzt.\nDurch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.bad_rep                       = Ein Berüchtigter Charakter hat einen hartnäckigen, dunklen Fleck auf seinem Ruf. Er könnte sich früher bei Knight Errant durch besondere Brutalität gegenüber Shadowrunnern ausgezeichnet haben. Es könnte behauptet werden, er habe jemanden aus dem eigenen Team getötet. Wenn er Erwacht ist und aus einer verseuchten Region stammt, wird man ihn für einen toxischen Schamanen halten. Ob diese Verdächtigungen stimmen oder nicht, ist irrelevant. Der schlechte Ruf hat sich so verfestigt, dass jedermann den Charakter so sieht. Der Charakter beginnt das Spiel mit 3 Punkten Schlechtem Ruf (S. 371), die er nur loswerden kann, wenn er die Wurzel seines Schlechten Rufs beseitigt. Erst dann kann er den Nachteil mit Karma entfernen.
quality.bilingual.desc                = Ein Charakter mit diesem Vorteil liest, schreibt und spricht eine zweite Sprache fließend. Er kann eine zweite Sprache als Muttersprache wählen (s. Sprachfertigkeiten, S. 151). Dieser Vorteil kann nur während der Charaktererschaffung gewählt werden. Dadurch erhält der Charakter eine zweite Sprache gratis.
quality.blandness.desc                = Der Charakter taucht in jeder Menge unter, wird selten bemerkt und leicht vergessen. Er ist in jeder Hinsicht eine unauffällige Erscheinung. Wer versucht, den Charakter zu beschreiben, bringt kaum mehr heraus als: \u201Edurchschnittlich groß, durchschnittlicher Körperbau, durchschn... ich glaube, braunes Haar\u201C.\nDer Schwellenwert für Proben, mit denen sich jemand an genaue Merkmale des Charakters erinnern will, steigt um 1. Eine durchschnittlich schwere Erinnerungsprobe (Schwellenwert 2) wird dadurch zum Beispiel schwierig (Schwellenwert 3).
quality.catlike.desc                  = Ein Charakter mit diesem Vorteil besitzt eine unheimliche Eleganz, einen sanften Schritt und die beinahe übernatürliche Fähigkeit, sich geräuschlos zu bewegen. Manche Katzenhaften behaupten sogar, immer auf den Füßen zu landen, lassen aber selten zu, dass andere Leute sie fallen lassen, um das auszuprobieren. Dieser Vorteil verleiht einen Würfelpoolmodifikator von +2 auf Schleichenproben.
quality.code_of_honor                 = Der Charakter folgt einem Ehrenkodex, der ihm verbietet, Angehörige einer bestimmten Gruppe zu töten. Er wählt eine Gruppe aus, deren Mitglieder er nicht tötet, und bei der er auch das Töten durch andere nicht zulässt. Solche Gruppen könnten Frauen, Kinder, Unschuldige oder bestimmte Metatypen sein. Ein Charakter kann sich auch dem Schutz bestimmter Paracritter verschreiben, wenn diese die Kraft Bewusstsein besitzen.\nWenn ein Angehöriger der gewählten Gruppe getötet oder vernichtet wird, egal ob absichtlich oder zufällig, verliert der Charakter für diesen Run 1 Punkt Karma pro getöteter Person aus seiner gewählten Gruppe.\nDer Ehrenkodex kann auch andere Formen annehmen, zum Beispiel: "Credo des Assasinen" oder "Kriegerkodex"
quality.codeblock                     = Ein Charakter mit diesem Nachteil hat immer Schwierigkeiten mit einer bestimmten Matrixhandlung. Jedes Mal, wenn er diese Handlung durchführt, erhält er einen Würfelpoolmodifikator von -2 auf die Probe. Der Nachteil kann nur für Matrixhandlungen gewählt werden, die eine Probe verlangen (siehe S. 234). Ein Charakter kann Programmierniete nicht für Hacking-Handlungen wählen, die er wahrscheinlich nie durchführen wird.
quality.codeslinger.desc              = Einsen und Nullen sind für das Programmiergenie quasi die Muttersprache. Der Charakter beherrscht eine bestimmte Matrixhandlung (die er beim Erwerb dieses Vorteils festlegt) besonders gut und erhält, wenn er sie durchführt, einen Würfelpoolmodifi kator von +2. Dieser Vorteil kann nur für Matrixhandlungen (S. 234) gewählt werden, die eine Probe erfordern.
quality.combat_paralysis              = Ein Charakter mit Kampfl ähmung ist in Kampfsituationen (auch im Astral- und Matrixkampf) wie gelähmt. In der ersten Kampfrunde muss der Charakter sein Initiativeergebnis halbieren (und abrunden). In den folgenden Kampfrunden legt er dann wie gewohnt Initiativeproben ab. Außerdem erhält der Charakter für Überraschungsproben einen Würfelpoolmodifi kator von -3. Wenn er in einer Kampfsituation eine Selbstbeherrschungsprobe (S. 153) ablegen muss, steigt der Schwellenwert dafür um 1. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.dependents_close              = Ein Charakter mit diesem Nachteil ist für ihm Nahestehende fi nanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpfl ichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw.\nFür 9 Karma besteht die Verpfl ichtung gegenüber nahen Verwandten oder Partnern, die dem Charakter wirklich am Herzen liegen. Zeit und Ressourcen des Charakters werden in diesem Fall stark beansprucht, vielleicht braucht die entsprechende Person sogar Pfl ege \u2013 in jedem Fall ist der Charakter in seiner Zeit deutlich eingeschränkt. Solche Verpflichtungen könnten sich durch das Zusammenleben im Familienverband, durch pfl egebedürftige Angehörige oder ein alleiniges Sorgerecht für Kinder ergeben. Die Lebensstilkosten des Charakters steigen um 30 %.
quality.dependents_occasional         = Ein Charakter mit diesem Nachteil ist für ihm Nahestehende fi nanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpfl ichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw.\nFür 3 Karma ist die Verpflichtung gelegentlich lästig: Sie könnte unangekündigt auftauchen (wenn der Charakter gerade dringend zu einem Treffen muss), könnte einen Gefallen, eine Schulter zum Ausweinen, Geld oder Liebesbeweise brauchen. Beispiele dafür sind faule Verwandte, Lebensabschnittspartner oder Kinder, die man nicht im Haus hat, für die man aber fi nanzielle und andere Verpfl ichtungen übernommen hat. Die Lebensstilkosten des Charakters steigen um 10 %
quality.dependents_regular            = Ein Charakter mit diesem Nachteil ist für ihm Nahestehende fi nanziell oder emotional verantwortlich. Solche Personen können Kinder, Eltern, Partner, Verwandte oder alte Freunde sein. Deren Bedürfnisse zu erfüllen sollte den Charakter einiges an Zeit und Geld kosten. Die Zeit zum Lernen neuer Fertigkeiten oder zum Verbessern vorhandener Fertigkeiten steigt um 50 % (aufgerundet). Wie viel Zeit man zum Lernen braucht, können Sie dem Abschnitt Charakterentwicklung ab S. 103 entnehmen. Außerdem erhöht sich der Zeitbedarf für Langzeitprojekte um 50 % (aufgerundet). Personen, denen der Charakter verpfl ichtet ist, können auch auf andere Weise hinderlich sein. Sie könnten im Weg stehen, bei dem Charakter einziehen, sich in dessen Arbeit einmischen, sich das Auto ausleihen, zu unpassenden Gelegenheiten anrufen usw.\nFür 6 Karma stört die Verpfl ichtung regelmäßig: Sie braucht regelmäßige Zuwendung, mischt sich ein oder lebt im selben Haushalt. Beispiele dafür sind Ehepartner oder Verwandte, die im selben Haushalt leben, Kinder mit geteiltem Sorgerecht, die (jedes zweite Wochenende) betreut werden, Kleinkinder oder junge Geschwister, um die man sich kümmern muss. Die Lebensstilkosten des Charakters steigen um 20 %.
quality.distinctive_style             = Ein Charakter mit diesem Nachteil besitzt mindestens ein auffälliges Merkmal, verhält sich auffällig oder fällt durch seine Persönlichkeit auf. Ein Auffälliger Stil kann sich zum Beispiel durch folgende Merkmale ergeben: Tätowierungen, die sich schwer verbergen lassen, Akzente oder besondere Sprechweisen, seltsame Kleidung, Narben, Gang- oder Gefängnistattoos, auffällige Cyberware oder nicht metamenschliche Bodytech wie etwa ein Schwanz. Denken Sie daran, dass das, was in einer Kultur sehr auffällt, in einer anderen ganz normal sein kann.\nIn jedem Fall sorgt aber der Auffällige Stil dafür, dass man sich leicht an den Charakter erinnert. Wer versucht, ihn zu identifizieren, zu verfolgen oder zu fi nden (oder Erkundigungen über ihn einzuholen), erhält bei den entsprechenden Proben einen Würfelpoolbonus von +2. Wenn ein NSC eine Erinnerungsprobe ablegen muss, um sich an möglichst viel über den Charakter zu erinnern, sinkt der Schwellenwert dafür um 1 (bis zu einem Minimum von 1).\nDieser Nachteil ist physischer Natur und gilt nicht für astrale Suchen. Er kann nur einmal gewählt werden. Der Nachteil ist nicht mit Unauffälligkeit kompatibel.
quality.double_jointed.desc           = Ein Charakter mit Gummigelenken ist außergewöhnlich gelenkig und kann seinen Körper in ganz extreme Haltungen verbiegen. Er erhält einen Würfelpoolmodifi kator von +2 auf Entfesselnproben. Außerdem kann er sich nach Maßgabe des Spielleiters durch enge \u00D6ffnungen oder in kleine Räume zwängen, die weniger Gelenkigen unzugänglich sind. Und er kann Leute in Bars oder auf Partys damit prächtig beeindrucken.
quality.elf_poser                     = Ein Elfenposer ist ein Mensch, der gerne ein Elf wäre. Er sucht die Nähe von Elfen, spricht wie ein Elf und verändert sein Äußeres entsprechend. Charaktere mit diesem Nachteil nehmen kosmetische Operationen auf sich, um Elfenohren und -augen zu bekommen. Sie können durchaus als Elfen durchgehen und etwaige negative Soziale Modifikatoren umgehen, die sie als Nicht-Elfen hätten.\nEchte Elfen halten Elfenposer für peinlich, und viele Menschen halten sie für Opportunisten. Andere Metatypen finden Elfenposer einfach lächerlich. Wenn ein Elf das Geheimnis des Charakters aufdeckt, wird er sich wahrscheinlich feindselig und angeekelt verhalten (s. Tabelle Soziale Modifikatoren, S. 140). Ein aufgedeckter Elfenposer könnte von Menschen, die entsprechende Vorurteile hegen, als \u201ERassenverräter\u201C betrachtet werden.\nNur Menschen dürfen den Nachteil Elfenposer wählen. Durch diesen Nachteil erhöht sich der Schlechte Ruf (S. 371) eines Charakters um 1.
quality.exceptional_attribute.desc    = Der Vorteil Außergewöhnliches Attribut ermöglicht charismatische Trolle oder geschickte Zwerge. Damit kann man ein Attribut auf einen Wert steigern, der 1 Punkt über dem natürlichen Maximum des jeweiligen Metatyps liegt. So könnte ein Ork mit dem Vorteil Außergewöhnliches Attribut zum Beispiel eine natürliche Stärke von 9 (statt 8) besitzen. Dieser Vorteil kann auch für die Spezialattribute Magie und Resonanz gewählt werden. Edge kann dadurch nicht erhöht werden. Dafür gibt es einen anderen Vorteil namens Glück. Ein Charakter darf nur ein einziges Außergewöhnliches Attribut besitzen, und das auch nur mit Zustimmung des Spielleiters. Außerdem darf er, wenn er diesen Vorteil hat, den Vorteil Glück nicht mehr erwerben.
quality.first_impression              = Mit diesem Vorteil fällt es einem Charakter leicht, sich in neue Situationen, Gruppen und Arbeitsverhältnisse einzufügen. Wenn er eine Gang infi ltriert, Connections in einem neuen Sprawl sucht, uneingeladen zu einem privaten Treffen kommt oder sich auf andere Weise einer neuen sozialen Umgebung anpasst, erhält der Charakter für das erste Zusammentreffen einen Würfelpoolmodifi kator von +2 für entsprechende Soziale Proben wie \u00DCberreden oder Verhandlung. Bei folgenden Zusammenkünften zählt dieser Bonus nicht. Durch diesen Vorteil wird der Schlechte Ruf (S. 371) eines Charakters um 1 gesenkt.
quality.focused_concentration.desc    = Ein Technomancer oder Magieanwender mit dem Vorteil Erhöhte Konzentrationsfähigkeit kann Mana oder Resonanz präziser manipulieren als andere. Diese Genauigkeit senkt den körperlichen und geistigen Stress des Charakters beim Umgang mit Magie oder Resonanz. Der Charakter kann einen Zauber oder eine Komplexe Form mit einer Kraftstufe oder Stufe gleich seiner Stufe in Erhöhter Konzentrationsfähigkeit aufrechterhalten, ohne dafür einen Malus zu erleiden. Zum Beispiel könnte ein Zauberer mit Erhöhte Konzentrationsfähigkeit 3 einen Zauber Panzerung mit Kraftstufe 3 aufrechterhalten, ohne den Malus auf Würfelpools für das Aufrechterhalten eines Zaubers zu erleiden. Das Aufrechterhalten zusätzlicher Zauber oder Komplexer Formen verursacht den üblichen Würfelpoolmodifi kator von -2 pro Zauber bzw. Komplexer Form. Dieser Vorteil steht nur Magieanwendern, die Zauber wirken können, und Technomancern zur Verfügung.
