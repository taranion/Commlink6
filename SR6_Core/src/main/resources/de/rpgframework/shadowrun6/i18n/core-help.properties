quality.natural_athlete               = Ein Charakter mit diesem Vorteil besitzt eine angeborene Kombination von Fitness, Gleichgewichtssinn und athletischem oder akrobatischem Talent. Er ist vielleicht kein Weltklasseathlet und müsste erst durch Training alles aus sich herausholen, ist aber für seine Größe und Gewichtsklasse in hervorragender körperlicher Verfassung. Ein Bewegungstalent erhält einen Würfelpoolmodifi kator von +2 auf alle Laufen- und Akrobatikproben.
