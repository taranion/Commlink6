item.credstick_ebony.desc=Das Bargeld des späten 21. Jahrhunderts. Ein beglaubigter Credstick ist nicht auf eine bestimmte Person registriert \u2013 die elektronischen Geldbeträge, die darauf kodiert sind, gehören dem Besitzer und erfordern keine spezielle ID oder Authentifi zierung. Die schlechte Nachricht ist, dass man ausgeraubt werden kann und alles Geld auf dem beglaubigten Credstick dann weg ist. Die gute Nachricht ist, dass beglaubigte Credsticks nicht zurückverfolgt werden können. Sie sind noch nicht einmal WiFi-fähig \u2013 man muss sie in einen Universal-Datenport stecken, um Geld von ihnen oder auf sie zu transferieren. Dadurch sind sie bei Shadowrunnern und den Mr. Johnsons, die sie anheuern, immer noch sehr beliebt.\nJede Art von Credstick kann nur eine gewisse Maximalmenge an Geld enthalten, wie in der Tabelle angegeben. Aber Achtung: Dies ist nur die Maximalmenge, die der Credstick enthalten kann, nicht die Menge, die immer darauf ist \u2013 also sollte man nicht aufgeregt werden, wenn man einen goldenen Credstick sieht, bis man ihn eingesteckt und sein Guthaben überprüft hat.\n\nBis ¥1.000.000

item.fake_license.desc=Für alle, die nicht die normalen legalen Kanäle benutzen können oder wollen, gibt es gefälschte Lizenzen für alle Arten von eingeschränkten Gegenständen oder Aktivitäten. Gegenstände ohne Buchstabe neben ihrer Verfügbarkeit benötigen keine Lizenz. Für Gegenstände, die Verboten sind, gibt es keine Lizenzen. Lizenzen gibt es also nur für Eingeschränkte Gegenstände. Jede Art von Erlaubnis für einen Gegenstand/eine Aktivität erfordert eine separate Lizenz.\nDinge, die eine Lizenz erfordern, umfassen die Jagd (mit Bogen und Gewehr), den Besitz einer Feuerwaffe, das verdeckte Tragen einer Feuerwaffe (separate Lizenz), Spruchzauberei und jede Art von Eingeschränkter Ausrüstung oder Bodytech.\nGenauso wie SINs im Wesentlichen nur auf dem Kommlink existieren, existieren Lizenzen auf der SIN und sind mit ihr verbunden. Wenn man eine gefälschte Lizenz für das verdeckte Tragen einer Waffe kauft, kauft man sie nicht für Murderman, den professionellen Shadowrunner, sondern für John Doe, eine von Murdermans gefälschten SINs. Jede Lizenz muss einer bestimmten (gefälschten) SIN nach Wahl des Spielers zugewiesen werden.\nVerwenden Sie die Stufe der gefälschten Lizenz gegen Verifizierungssysteme (s. Gefälschte SINs, S. 366).

item.binoculars.desc=Ferngläser werden gewöhnlich in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Sie sind in optischen (ohne Möglichkeit des Einbaus zusätzlicher Sichtverstärkungen) und elektronischen Versionen (die mit Sichtverstärkungen ausgestattet werden können) erhältlich.
item.binoculars_optical.desc=Ferngläser werden gewöhnlich in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Sie sind in optischen (ohne Möglichkeit des Einbaus zusätzlicher Sichtverstärkungen) und elektronischen Versionen (die mit Sichtverstärkungen ausgestattet werden können) erhältlich.
item.camera.desc=Kameras können Fotos, Videos und Trideos (einschließlich Ton) aufnehmen. Sie können mit Sicht- und Audioverstärkungen ausgestattet werden
item.microcamera.desc=Kameras können Fotos, Videos und Trideos (einschließlich Ton) aufnehmen. Sie können mit Sicht- und Audioverstärkungen ausgestattet werden
item.contacts.desc=Die neuesten Anzeigegeräte werden direkt auf den Augen getragen. Sie sind praktisch nicht zu entdecken, bieten aber auch nur wenig Raum für Sichtverstärkungen.\nKontaktlinsen müssen kabellos sein; sie haben keinen Platz für einen Universal-Datenport.
item.glasses.desc=Brillen sind Linsen in einem Leichtbaurahmen, der auf der Nase getragen wird. Sie sind in zahlreichen Stilen erhältlich, und eine Brille mit Sichtverstärkungen ist nur bei genauem Hinsehen von einer normalen oder Sonnenbrille zu unterscheiden.
item.goggles.desc=Ein Sichtgerät ist relativ groß und wuchtig und wird am Kopf befestigt, wodurch es schwer zu entfernen ist. Sichtgeräte können eine große Bandbreite an Sichtverstärkungen aufnehmen.
item.imaging_scope_single.desc=Dies sind Sichtverstärker und Anzeigegeräte, die gewöhnlich auf Waffen montiert werden (s. Feuerwaffenzubehör, S. 434).
item.monocle.desc=Ein Monokel wird an einem Stirnband oder Helm mit einem herunterklappbaren Arm oder (für den altmodischen Look) an einer Kette getragen.

item.balanceverstaerker.desc=Der Balanceverstärker verstärkt den natürlichen Gleichgewichtssinn des Innenohrs. Der Charakter erhält einen Würfelpoolbonus von +1 für alle Proben, bei denen es um das Gleichgewicht geht, wie etwa das Klettern, das Gehen über einen schmalen Steg, das Landen nach einem Sprung und so weiter.
item.daempfer.desc=Dieses Implantat schützt den Nutzer sowohl vor plötzlichen Lautstärkeanstiegen als auch vor schädigenden Geräuschpegeln. Der Dämpfer gewährt einen Würfelpoolbonus von +2 bei Widerstandsproben gegen Schallangriffe, einschließlich Schockgranaten.
item.selektiverGeraeuschfilter.desc=Eine implantierte Version des Selektiven Geräuschfilters (S. 449), mit dem Unterschied, dass die maximal erhältliche Stufe 6 statt 3 beträgt.


item.reflexbooster3.desc=Diese hochinvasive, schmerzhafte, lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um einen in eine neue Welt zu katapultieren, in der sich alles um einen herum in Zeitlupe zu bewegen scheint. Das System enthält sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger manuell zu aktivieren oder zu deaktivieren erfordert eine Komplexe Handlung, per WiFi erfordert es eine Einfache Handlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (Initiative und Körperliches Limit werden entsprechend angepasst) und +1 Initiativewürfel. Reflexbooster können nicht mit irgendeiner anderen Form von Reaktions- oder Initiativeverbesserung kombiniert werden.
item.internerLufttank.desc=Der interne Lufttank ersetzt einen Teil eines Lungenflügels durch eine interne Druckluftreserve, mit der man den Atem für (Stufe) Stunden anhalten kann. Dies erlaubt ausgedehnte Unterwasseroperationen und kompletten Schutz vor Toxinangriffen mit Inhalationsvektor, solange man den Atem anhält. Das Aktivieren oder Deaktivieren des Tanks erfordert eine Einfache Handlung. Das Auffüllen des Lufttanks mit Druckluft durch ein Ventil (das sich unter dem Brustkorb befindet) dauert fünf Minuten, aber man kann ihn auch durch sechs Stunden normales Atmen wiederauffüllen.
item.talentleitungen.desc=Talentleitungen sind ein System von neuromuskulären Steuerungseinheiten, die das natürliche Nervensystem des Körpers überbrücken. Sie können mithilfe des \u201EMuskelgedächtnisses\u201D, das durch eine Talentbuchse eingespielt wird, Muskelbewegungen unterstützen oder vollständig überbrücken. Dieses System erlaubt die Verwendung von Aktionssofts mit einer Stufe, die maximal so hoch sein darf wie die Stufe der Talentleitungen. Dafür muss die entsprechende Aktionssoft auf einer ebenfalls implantierten Talentbuchse laufen. Talentleitungen sind nicht kompatibel mit Reflexrekordern.
item.enterhakenkanone.desc=Dies ist eine implantierte Version der Enterhakenkanone. Sie enthält kein Seil, aber man kann ein externes Seil daran befestigen, bevor man den Enterhaken verschießt.
item.kompositknochenTitan.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit verbessert (und das Körpergewicht erhöht). Kompositknochen gibt es in drei Varianten\: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für Widerstand gegen physischen Schaden, etwas Panzerung (kumulativ mit anderer Panzerung, ohne sich auf die Belastung auszuwirken) und verändern den waffenlosen Schaden, den man austeilt. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.reflexbooster1.desc=Diese hochinvasive, schmerzhafte, lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um einen in eine neue Welt zu katapultieren, in der sich alles um einen herum in Zeitlupe zu bewegen scheint. Das System enthält sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger manuell zu aktivieren oder zu deaktivieren erfordert eine Komplexe Handlung, per WiFi erfordert es eine Einfache Handlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (Initiative und Körperliches Limit werden entsprechend angepasst) und +1 Initiativewürfel. Reflexbooster können nicht mit irgendeiner anderen Form von Reaktions- oder Initiativeverbesserung kombiniert werden.
item.reaktionsverbesserung.desc=Diese Bodyware beschleunigt die Reaktion, indem bestimmte, isolierte Wirbel in der Wirbelsäule durch superleitendes Material ersetzt werden. Die Reaktionsverbesserung addiert ihre Stufe zur Reaktion (Initiative und Körperliches Limit werden entsprechend angepasst). Reaktionsverbesserung ist nicht kompatibel mit anderer Bodytech, die die Reaktion verbessert, einschließlich Reflexboostern.
item.kompositknochenKunststoff.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit verbessert (und das Körpergewicht erhöht). Kompositknochen gibt es in drei Varianten\: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für Widerstand gegen physischen Schaden, etwas Panzerung (kumulativ mit anderer Panzerung, ohne sich auf die Belastung auszuwirken) und verändern den waffenlosen Schaden, den man austeilt. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.kunstmuskeln.desc=Warum Zeit mit Krafttraining verschwenden, wenn man die Kraft auch einfach einbauen kann? Bottichgezüchtete synthetische Muskeln ersetzen oder verstärken die eigenen, und Calciumbehandlungen und Skelettverstärkung tragen zur Gesamtstärke bei. Kunstmuskeln erhöhen sowohl die Stärke als auch die Geschicklichkeit um ihre Stufe. Sie sind nicht kompatibel mit anderer Bodytech für die Muskeln, wie etwa der Bioware Muskelstraffung oder Muskelverstärkung.
item.kompositknochenAluminium.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit verbessert (und das Körpergewicht erhöht). Kompositknochen gibt es in drei Varianten\: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für Widerstand gegen physischen Schaden, etwas Panzerung (kumulativ mit anderer Panzerung, ohne sich auf die Belastung auszuwirken) und verändern den waffenlosen Schaden, den man austeilt. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.schmuggelbehaelter.desc=Für Gegenstände, die nicht in eine Fingerspitze passen, aber trotzdem nicht gefunden werden dürfen, kann man Schmuggelbehälter an Stellen im Körper implantieren, die leicht ausgehöhlt oder ersetzt werden können. Dazu gehören die Rippen und der Platz zwischen ihnen, Hüftknochen, Schulterblätter und so weiter. Diese Behälter können Mini- und kleine Gegenstände aufnehmen (gewöhnlich nichts, was größer ist als eine leichte Pistole; der Spielleiter wird schon Bescheid sagen, wenn etwas zu groß ist). Der Behälter hat einen Tarnmodifikator von -10. Einen Gegenstand hineinzulegen oder herauszunehmen erfordert eine Komplexe Handlung.
item.reflexbooster2.desc=Diese hochinvasive, schmerzhafte, lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um einen in eine neue Welt zu katapultieren, in der sich alles um einen herum in Zeitlupe zu bewegen scheint. Das System enthält sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger manuell zu aktivieren oder zu deaktivieren erfordert eine Komplexe Handlung, per WiFi erfordert es eine Einfache Handlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (Initiative und Körperliches Limit werden entsprechend angepasst) und +1 Initiativewürfel. Reflexbooster können nicht mit irgendeiner anderen Form von Reaktions- oder Initiativeverbesserung kombiniert werden.
item.fingerkuppenbehaelter.desc=Dieser Behälter ist im ausgehöhlten letzten Glied eines Fingers versteckt. Er hat eine Arretierung, bei der der Fingernagel angehoben werden kann, um auf den Behälter zuzugreifen, oder auch die ganze Fingerspitze entfernt werden kann. Ein  Fingerkuppenbehälter kann mikrogroße Gegenstände aufnehmen, wie etwa eine Mikrodrohne, einen RFID- oder Datenchip. Einen Gegenstand darin zu verstauen oder herauszunehmen erfordert eine Komplexe Handlung. Gegenstände, die im Fingerkuppenbehälter verwahrt werden, sind vollständig verborgen, und der Fingerkuppenbehälter selbst hat einen Tarnmodifikator von -10. Ein beliebter Trick ist es, im Fingerkuppenbehälter eine Monofilamentpeitsche  aufzubewahren, wobei die Fingerspitze als beschwerte Schnurspitze dient. Das Ausfahren einer Monofilamentpeitsche aus einem Fingerkuppenbehälter erfordert eine Einfache Handlung, das Aufrollen eine Komplexe Handlung. Wie viele Handlungen Leute brauchen, um nicht mehr davon beeindruckt zu sein, was gerade eben aus dem Finger kam \u2013 wer weiß?
item.dermalpanzerung.desc=Hartkunststoff- und Keramikfaserplatten werden in die Haut implantiert. Die Platten sind deutlich sichtbar und noch deutlicher fühlbar, aber sie können im Hinblick auf Farbe und Oberflächenstruktur kosmetisch angepasst werden. Dermalpanzerung verleiht einen Panzerungsbonus in Höhe ihrer Stufe (kumulativ mit anderer Panzerung, ohne sich auf die Belastung auszuwirken). Dermalpanzerung ist nicht mit anderer Bodytech für die Haut kompatibel, die Panzerung verleiht, wie etwa Orthoskin. Durch den Einbau von Dermalpanzerung verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit ihren natürlichen Panzerungsbonus von +1.

item.lasermikrofon.desc=Dieser ausgeklügelte Sensor wirft einen Laserstrahl gegen einen festen Gegenstand wie etwa eine Fensterscheibe, liest die Vibrationen auf der Oberfläche und übersetzt sie in die Geräusche, die auf der anderen Seite der Oberfläche ertönen. Die maximale Reichweite beträgt 100 Meter. Ein  Lasermikrofon kann nicht die Audioverstärkung  Richtungsdetektor aufnehmen.
item.kopfhoerer.desc=Ein komplettes Headset mit verstellbaren Kopfriemen. Ohrstöpsel sind schwerer zu entdecken, aber Kopfhörer haben mehr Kapazität.
item.ohrstoepsel.desc=Diese ergonomischen Ohrstöpsel sind schwer zu entdecken und noch schwerer von den normalen Ohrstöpseln zu unterscheiden, die Bestandteil jedes Musikspielers und Kommlinks sind.
item.richtmikrofon.desc=Mit diesem Mikrofon kann man weit entfernte Unterhaltungen belauschen. Festew Gegenstände oder laute Geräusche entlang des Lauschwegs stören hier natürlich. Es ist, als wäre man bis zu hundert Meter näher an dem, worauf man das Mikro richtet.
item.mikrofon.desc=Ein normales omnidirektionales Audioaufnahmegerät. Ist gewöhnlich eingebaut in oder (kabellos) verbunden mit einem Kommlink oder einem anderen Aufnahmegerät. Mikroversionen sind mit Kapazität 1 erhältlich und haben dann auch nur eine maximale Reichweite von 5 Metern.

item.bildverbindung.desc=Dieses Standardupgrade zeigt visuelle Informationen (Text, Filme, Bilder, die aktuelle  Uhrzeit und so weiter) im eigenen Blickfeld an. Dies sind gewöhnlich AROs, aber man  kann praktisch alles darauf anzeigen, was man will. Ein Team kann die Bilverbindung nutzen,  um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung  um die AR "wirklich" zu sehen und an der modernen Welt teilzuhaben.
item.bildverbindung_essence.desc=Dieses Standardupgrade zeigt visuelle Informationen (Text, Filme, Bilder, die aktuelle  Uhrzeit und so weiter) im eigenen Blickfeld an. Dies sind gewöhnlich AROs, aber man  kann praktisch alles darauf anzeigen, was man will. Ein Team kann die Bilverbindung nutzen,  um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung  um die AR "wirklich" zu sehen und an der modernen Welt teilzuhaben.
item.bindungsfokus.desc=Geisterfoki verstärken die Beschwörungsfertigkeit eines Zauberers. Jeder Geisterfokus wird bei seiner Herstellung auf eine Geisterart eingestimmt, die danach nicht mehr  verändert werden kann.  Ein Bindungsfokus addiert seine Kraftstufe zu Würfelpoolbonus zu Bindenproben, solange die Art des zu bindenden Geistes zum Fokus passt.
item.blitzkompensation.desc=Dieses Zubehör schützt sowohl vor blendenen Lichtblitzen als auch vor einfachem  blendendem Licht. Es verringert die Sichtmodifkatoren für blendendes Licht und senkt den Malus  durch Blitzlichter, wie etwa durch ein Flashpack.
item.blitzkompensation_capacity.desc=Dieses Zubehör schützt sowohl vor blendenen Lichtblitzen als auch vor einfachem  blendendem Licht. Es verringert die Sichtmodifkatoren für blendendes Licht und senkt den Malus  durch Blitzlichter, wie etwa durch ein Flashpack.
item.blitzkompensation_essence.desc=Dieses Zubehör schützt sowohl vor blendenen Lichtblitzen als auch vor einfachem  blendendem Licht. Es verringert die Sichtmodifkatoren für blendendes Licht und senkt den Malus  durch Blitzlichter, wie etwa durch ein Flashpack.
item.brille.desc=Brillen sind Linsen in einem Leichtbaurahmen, der auf der Nase getragen wird. Sie sind  in zahlreichen Stilen erhältlich, und eine Brille mit Sichtverstärkungen ist nur bei genauem  Hinsehen von einer normalen oder Sonnenbrille zu unterscheiden.
item.endoskop.desc=Dieses Glasfaserkabel ist mindestens einen Meter lang, wobei die ersten 20cm auf jeder  Seite aus myomerischem Seil (S. 454) und einer optischen Linse bestehen. Es erlaubt dem  Benutzer, um die Ecke, unter Türspalten hindurch oder in Enge Spalten hineinzuschauen. Endoskope sind in mehreren Längen erhältlich, allerdings können längere Segmente  unhandlich sein.
item.fernglasElektronisch.desc=Ferngläser werden gewöhnlich in der Hand gehalten und sind mit eingebauer  Sichtverbesserung ausgestattet. Sie sind in optischen (ohne Möglichkeit des Einbaus  zusätzlicher Sichtverstärkungen) und elektronischen Versionen (die mit mit  Sichtverstärkungen ausgestattet werden können) erhältlich.
item.fernglasOptisch.desc=Ferngläser werden gewöhnlich in der Hand gehalten und sind mit eingebauer  Sichtverbesserung ausgestattet. Sie sind in optischen (ohne Möglichkeit des Einbaus  zusätzlicher Sichtverstärkungen) und elektronischen Versionen (die mit mit  Sichtverstärkungen ausgestattet werden können) erhältlich.
item.infrarotsicht.desc=Diese Sichtverstärkung ermöglicht das sehen im infraroten Spektrum, wodurch man  Hitzemuster erkennen kann. Das ist eine sehr praktische Methode, um Lebewesen in  völliger Dunkelheit zu entdecken, um zu prüfen, ob ein Motor oder eine Maschine vor  Kurzem gelaufen ist, und für ähnliche Zwecke.
item.kamera.desc=Kameras können Fotos, Videos und Trideos (einschließlich Ton) aufnehmen. Sie können  mit Sicht- und Audioverstärkungen ausgestattet werden. Es ist auch eine Mikrokamera mit Kapazität 1  erhältlich.
item.kontaktlinsen.desc=Die neuesten Anzeigegeräte werden direkt auf den Augen getragen. Sie sind praktisch  nicht zu entdecken, bieten aber auch nur wenig Raum für Sichtverstärkungen. Kontaktlinsen  müssen kabellos sein; sie haben keinen Platz für einen Universal-Datenport.
item.mage-sight-brille.desc=Dieses schwere Sichtgerät ist mit einem myomerischen Seil (Seite 454) verbunden, das um ein  Glasfaserkabel gewunden ist, das in einer optischen Linse endet. Das Seil ist in Längen von 10,  20 oder 30 Metern erhältlich.
item.mikrokamera.desc=Eine Mikrokamera mit Kapazität 1.
item.monokel.desc=Ein Monokel wird an einem Stirnband oder Helm mit einem herunterklappbaren Arm  oder (für den altmodischen Look) an einer Kette getragen.
item.periskop.desc=Das Periskop ist eine L-förmige Röhre mit zwei Spiegeln und erlaubt es dem Benutzer,  um Ecken herum zu sehen, zu schießen oder Zauber zu wirken.
item.low_light_vision.desc=Dieses Zubehör erlaubt es einem, sogar dann noch normal zu sehen, wenn die einzige  Lichtquelle die Sterne am Himmel sind. Es hilft allerdings nicht in totaler Dunkelheit.
item.sichtgeraet.desc=Ein Sichtgerät ist relativ groß und wuchtig und wird am Kopf befestigt, wodurch es  schwer zu entfernen ist. Sichtgeräte können eine große Bandbreite an  Sichtverstärkungen aufnehmen.
item.sichtverbesserung.desc=Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm  eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines  durchschnittlichen Metamenschen ähnelt. Sichtverbesserung addiert ihre Stufe als  positiven Modifikator auf das Limit bei visuellen Wahrnehmungsproben.  Wifi-Vorteil\: Die Sichtverbesserung addiert ihre Stufe als Würfelpoolmodifikator auf visuelle  Wahrnehmungsproben.
item.sichtverbesserung_capacity.desc=Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm  eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines  durchschnittlichen Metamenschen ähnelt. Sichtverbesserung addiert ihre Stufe als  positiven Modifikator auf das Limit bei visuellen Wahrnehmungsproben.  Wifi-Vorteil\: Die Sichtverbesserung addiert ihre Stufe als Würfelpoolmodifikator auf visuelle  Wahrnehmungsproben.
item.sichtverbesserung_essence.desc=Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm  eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines  durchschnittlichen Metamenschen ähnelt. Sichtverbesserung addiert ihre Stufe als  positiven Modifikator auf das Limit bei visuellen Wahrnehmungsproben.  Wifi-Vorteil\: Die Sichtverbesserung addiert ihre Stufe als Würfelpoolmodifikator auf visuelle  Wahrnehmungsproben.
item.sichtvergroesserung.desc=Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man  weit entfernte Zeile besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im  Fernkampf finden Sie auf Seite 176.
item.sichtvergroesserung_capacity.desc=Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man  weit entfernte Zeile besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im  Fernkampf finden Sie auf Seite 176.
item.sichtvergroesserung_essence.desc=Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-fache, wodurch man  weit entfernte Zeile besser sehen kann. Regeln zum Einsatz von Sichtvergrößerung im  Fernkampf finden Sie auf Seite 176.
item.smartlink.desc=Dieses Zubehör arbeitet mit einem Smartgunsystem zusammen und verleiht einem erst die vollen Vorteile des Systems. Die Smartgun teilt ihrem Benutzer die Entfernung zu  verschiedenen Zielen mit, den Munitionsstand (und -typ), die Hitzeentwicklung, die  mechanische Belastung und so weiter. Ohne ein Smartlink sendet ein Smartgunsystem  nur Daten, die von niemandem empfangen werden und deshalb keine Wirkung haben.\nEin Smartlink, das in einem natürlichen Auge oder in Cyberaugen installiert wird, ist \neffektiver als ein Smartlink in einem externen Gerät (s. Smartgunsystem, Seite 435)
item.zielfernrohr.desc=Dies sind Sichtverstärker und Anzeigegeräte, die gewöhnlich auf Waffen montiert \nwerden. (s. Feuerwaffenzubehör, S. 434)


item.cybergunSchwerePistoleEinbauCybergliedmass.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nCyberguns werden im Allgemeinen in einen Arm eingebaut, aber man könnte sie auch in ein Bein oder sogar in den Torso einbauen. Sie unterscheiden sich von Cyberholstern insofern, als die Waffe selbst direkt kontrolliert und abgefeuert werden kann, wie eine Erweiterung des eigenen Körpers.\nJe nach Größe der Waffe nehmen Cyberguns Teile des Unterarms ein oder ersetzen den Arm komplett, wobei die funktionalen Teile des Arms um die Waffe herumgebaut werden. Kleiner Cyberguns feuern durch ein verborgenes Loch in der Handfläche oder den Knöcheln, währendbei größeren Cyberguns die Hand am Handgelenk zurückklappt.\nZur zusätzlichen Tarnung werden Cyberguns hauptsächlich aus nichtmetallischen Materialien gebaut, und alle mechanischen Teile werden in die Struktur des (Cyber-)Arms integriert. Alle Cyberguns haben interne Magazine (m) und können mit einem versteckten externen Munitionsport ausgerüstet werden. Sobald man allerdings einen Streifen an der Seite des Unterarms oder an der Rückseite des Ellenbogens einschiebt, wird die Cyberguns ziemlich offensichtlich. Lasermarkierer und Schalldämpfer sind ebenfalls erhältlich; anderes Waffenzubehör kann in Cyberguns nicht eingebaut werden. Alle Cyberguns sind serienmäßig mit einem Smartgunssystem (GRW S. 435) ausgerüstet.
item.cybergliedverstaerkungStaerke.desc=Cybergliedverstärkungen erhöhen Stärke oder Geschicklichkeit eines Cyberglieds(\!) oder gewähren einen Panzerungsbonus in Höhe ihrer Stufe (der kumulativ mit sonstiger Panzerung ist, ohne sich auf die Belastung auszuwirken).\nJede Gliedmaße kann nur eine Verstärkung von jeder Art haben (man kann nicht im selben Cybergleid zweimal die Stärke um 3 erhöhen), aber man kann eine Verstärkung durch eine andere ersetzen, die man haben will.
item.sporn(einziehbar)EinbauCybergliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nSporne bestehen aus einer bis drei Klingen, die bis zu 30 Zentimeter lang sind und aus dem Handrücken oder zwischen den Knöcheln hervorschießen.
item.cyber-springarm.desc=Der Cyber-Springarm, eine integrierte Version des Springarms (GRW S. 436), verbirgt eine Holdout-Pistole, einen Taser oder eine leichte Pistole im Cyberarm. Als freie Handlung kann die Waffe im Springarm bereitgemacht werden.
item.nagelmesser(einziehbar)FuerNatuerlicheGliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nNagelmesser sind zwei bis drei Zentimeter lange Klingen aus verchromten Stahl oder Carbonfaser. Sie schießen entweder unter den Fingernägeln hervor oder ersetzen sie vollständig.
item.sprunghydraulik.desc=Dieses Zubehör muss in zwei Cyberbeine jeweils mit derselben Stufe eingebaut werden. Jeder Stufenpunkt addiert +1 zum körperlichen Limit für Sprünge und Sprints, addiert 20 % zur maximalen Sprungdistanz und senkt die Fallhöhe für die Berechnung von Fallschaden um 2 Meter.
item.cybergunAutomatikpistoleEinbauCybergliedmass.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nCyberguns werden im Allgemeinen in einen Arm eingebaut, aber man könnte sie auch in ein Bein oder sogar in den Torso einbauen. Sie unterscheiden sich von Cyberholstern insofern, als die Waffe selbst direkt kontrolliert und abgefeuert werden kann, wie eine Erweiterung des eigenen Körpers.\nJe nach Größe der Waffe nehmen Cyberguns Teile des Unterarms ein oder ersetzen den Arm komplett, wobei die funktionalen Teile des Arms um die Waffe herumgebaut werden. Kleiner Cyberguns feuern durch ein verborgenes Loch in der Handfläche oder den Knöcheln, währendbei größeren Cyberguns die Hand am Handgelenk zurückklappt.\nZur zusätzlichen Tarnung werden Cyberguns hauptsächlich aus nichtmetallischen Materialien gebaut, und alle mechanischen Teile werden in die Struktur des (Cyber-)Arms integriert. Alle Cyberguns haben interne Magazine (m) und können mit einem versteckten externen Munitionsport ausgerüstet werden. Sobald man allerdings einen Streifen an der Seite des Unterarms oder an der Rückseite des Ellenbogens einschiebt, wird die Cyberguns ziemlich offensichtlich. Lasermarkierer und Schalldämpfer sind ebenfalls erhältlich; anderes Waffenzubehör kann in Cyberguns nicht eingebaut werden. Alle Cyberguns sind serienmäßig mit einem Smartgunssystem (GRW S. 435) ausgerüstet.
item.cybergunHoldout-pistoleEinbauCybergleidmass.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nCyberguns werden im Allgemeinen in einen Arm eingebaut, aber man könnte sie auch in ein Bein oder sogar in den Torso einbauen. Sie unterscheiden sich von Cyberholstern insofern, als die Waffe selbst direkt kontrolliert und abgefeuert werden kann, wie eine Erweiterung des eigenen Körpers.\nJe nach Größe der Waffe nehmen Cyberguns Teile des Unterarms ein oder ersetzen den Arm komplett, wobei die funktionalen Teile des Arms um die Waffe herumgebaut werden. Kleiner Cyberguns feuern durch ein verborgenes Loch in der Handfläche oder den Knöcheln, währendbei größeren Cyberguns die Hand am Handgelenk zurückklappt.\nZur zusätzlichen Tarnung werden Cyberguns hauptsächlich aus nichtmetallischen Materialien gebaut, und alle mechanischen Teile werden in die Struktur des (Cyber-)Arms integriert. Alle Cyberguns haben interne Magazine (m) und können mit einem versteckten externen Munitionsport ausgerüstet werden. Sobald man allerdings einen Streifen an der Seite des Unterarms oder an der Rückseite des Ellenbogens einschiebt, wird die Cyberguns ziemlich offensichtlich. Lasermarkierer und Schalldämpfer sind ebenfalls erhältlich; anderes Waffenzubehör kann in Cyberguns nicht eingebaut werden. Alle Cyberguns sind serienmäßig mit einem Smartgunssystem (GRW S. 435) ausgerüstet.
