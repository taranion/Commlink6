skill.academic_knowledge.desc     = Akademisches Wissen ist mit dem Attribut Logik verbunden. Diese Art von Wissen umfasst universitäre Fächer wie Geschichte, Naturwissenschaften, Design, Technologie, Magietheorie und das Wissen um die Personen und Organisationen, die auf diesen Gebieten ihre Finger im Spiel haben. Auch die Geisteswissenschaften (Kulturwissenschaften, Kunst, Philosophie und so weiter) gehören in diese Kategorie.
skill.aeronautics_mechanic.desc   = Diese Fertigkeit ermöglicht das Reparieren oder Umbauen von Luftfahrzeugen, wenn die benötigten Werkzeuge und Teile vorhanden sind. Siehe Bauen und Reparieren, S. 146.
skill.alchemy.desc                = Alchemie dient dazu, Substanzen herzustellen, die Zaubersprüche speichern können. Meist dient Alchemie zum Brauen von Tränken, Destillieren von magischen Reagenzien oder sogar zur Herstellung von Orichalkum.
skill.animal_handling.desc        = Diese Fertigkeit umfasst das Trainieren, Versorgen, Reiten (wenn das möglich ist) und die Führung von nichtbewussten Tieren. Kompetente Tierführer können auch mehrere Tiere führen. Es ist sogar möglich, sich einem unausgebildeten Tier zu nähern und ein Vertrauensverhältnis aufzubauen \u2013 oder zumindest nicht gefressen zu werden.
skill.arcana.desc                 = Arkana regelt den Entwurf magischer Formeln, die zur Erschaffung von Zaubern, Foki und allen anderen Arten von magischen Manipulationen verwendet werden. Diese Fertigkeit ist auch nötig, um Formeln zu verstehen, die man kauft oder findet.
skill.archery.desc                = Diese Fertigkeit wird zum Schießen mit sehnenbestückten Projektilwaffen benutzt. Ein Charakter mit dieser Fertigkeit ist mit vielen Arten von Bögen und Armbrüsten sowie den verschiedensten Pfeilarten vertraut.
skill.armorer.desc                = Waffenbau umfasst ein weites Feld von Fähigkeiten zum Bauen und Reparieren von Waffen und Panzerungen. Wie bei allen Mechanikfertigkeiten sind dazu die passenden Werkzeuge und Teile nötig. Schwellenwerte und Informationen über die Auswirkung von Erfolgen fi nden Sie unter Bauen und Reparieren.
skill.artificing.desc             = Die Fertigkeit Fokusherstellung braucht man zur Herstellung magischer Foki. Sie kann auch forensisch eingesetzt werden, um Informationen über die Herstellung und den Zweck eines existierenden Fokus zu askennen. Siehe Fokusherstellung, S. 305.
skill.artisan.desc                = Diese Fertigkeit umfasst sowohl künstlerisches Schaffen als auch die handwerkliche Herstellung von Gegenständen, die sonst auf Fließbändern produziert werden. Die besten Künstler der Welt müssen auch etwas von ihrem Handwerk verstehen.
skill.assensing.desc              = Askennen ist die Fähigkeit eines Magieanwenders, Phänomene im Astralraum zu erkennen und zu interpretieren. Sie erlaubt, Informationen durch das Lesen von Auren zu erhalten. Nur Charaktere, die astral wahrnehmen können, dürfen diese Fertigkeit erwerben. Näheres dazu fi nden Sie unter Astrale Wahrnehmung, S. 312.
skill.astral_combat.desc          = Diese Fertigkeit ist für den Kampf im Astralraum erforderlich. Außerdem sind beim Kampf im Astralraum andere Attribute und Fähigkeiten wichtig als in der körperlichen Welt. Siehe dazu Astralkampf, S. 314.
skill.automatics.desc             = Die Fertigkeit Schnellfeuerwaffen ermöglicht das Bedienen von Feuerwaffen, die größer als Pistolen, aber kleiner als Gewehre sind. Diese Kategorie umfasst Maschinenpistolen und andere vollautomatische Karabiner.
skill.automotive_mechanic.desc    = Diese Fertigkeit dient zur Wartung, Reparatur und zum Umbau aller Arten von Bodenfahrzeugen \u2013 von Autos über Raddrohnen bis hin zu Panzern. Auch dafür sind die richtigen Werkzeuge, Teile und Zeit nötig. Siehe Bauen und Reparieren, S. 146.
skill.banishing.desc              = Verbannen dient dazu, die Verbindung zu unterbrechen, die einen Geist in der körperlichen Welt hält. Verbannte Geister müssen auf ihre Heimatebene zurückkehren und müssen keine noch ausstehenden Dienste mehr leisten.
skill.binding.desc                = Binden dient dazu, einen herbeigerufenen Geist längerfristig zu zusätzlichen Diensten zu zwingen. Siehe Binden, S. 300.
skill.biotechnology.desc          = Biotechnologie wird von \u00C4rzten und Wissenschaftlern benutzt, um Körperteile wachsen zu lassen. Diese Fertigkeit ist die Grundlage für das Klonen und die Herstellung von Bioware. Mit der richtigen Ausrüstung kann man mit dieser Fertigkeit beschädigte Bioware reparieren, neues Gewebe klonen oder Bioware im Körper eines Ziels entdecken. Das Implantieren oder Entfernen von Bioware ist damit nicht möglich.
skill.blades.desc                 = Schneiden und Schnetzeln! Die Fertigkeit Klingenwaffen wird für schneidende und stechende Nahkampfwaffen benutzt. Man kann allerlei Klingenwaffen, wie Dolche, Schwerter und \u00C4xte, damit führen.
skill.chemistry.desc              = Chemie erlaubt dem Charakter, chemische Reaktionen hervorzurufen und chemische Verbindungen \u2013 von Drogen über Parfums bis hin zu Biopolymeren wie NuSkin \u2013 herzustellen. Chemie kann auch genutzt werden, um chemische Verbindungen zu analysieren.
skill.clubs.desc                  = Als Knüppel gelten stumpfe Nahkampfwaffen. Mit dieser Fertigkeit kann man stumpfe Gegenstände wie Baseballschläger, Krücken oder Streitkolben als Waffen nutzen.
skill.compiling.desc              = Kompilieren steht für die Fähigkeit, die Nullen und Einsen der Maschinensprache und die Rhythmen der Resonanz in Sprites zu übersetzen. Siehe Sprites, S. 252.
skill.computer.desc               = Die Fertigkeit Computer ist die Grundlage für die Interaktion mit der Matrix. Sie steht für die Fähigkeit, Computer und andere mit der Matrix verbundene Geräte zu benutzen. Diese Fertigkeit konzentriert sich auf das Verständnis von verschiedenen Betriebssystemen. Mit ihr kann ein Charakter keinen Code ausnutzen (wie mit Hacking) und auch nicht an Mainframes basteln (wie mit Hardware). Siehe Einsatz von Computer, S. 223.
skill.con.desc                    = \u00DCberreden erlaubt es, einen NSC hereinzulegen oder zu manipulieren. Diese Fertigkeit hat auch viel mit dem Vorspiegeln von Vertrauenswürdigkeit zu tun, die das Prinzip hinter dem \u00DCberreden ist.
skill.counterspelling.desc        = Antimagie ist eine defensive Fertigkeit, mit deren Hilfe man sich gegen magische Angriffe verteidigen und aufrechterhaltene Zauber bannen kann. Siehe Antimagie, S. 294.
skill.cybercombat.desc            = Matrixkampf wird von Hackern für Kämpfe in der Matrix benutzt. Siehe Einsatz von Matrixkampf, S. 223.
skill.cybertechnology.desc        = Kybernetik ermöglicht das Herstellen, Warten und Reparieren von kybernetischen Teilen. Ein Charakter kann mit den richtigen Werkzeugen und Teilen sogar neue Cyberware herstellen.\nKybernetik ist keine chirurgische Fertigkeit. Charaktere können damit keine Cyberware implantieren oder entfernen. Die Fertigkeit kann aber benutzt werden, um Cybergliedmaßen zu modifizieren oder zu verbessern. Siehe Bauen und Reparieren, S. 146.
skill.decompiling.desc            = Dekompilieren ermöglicht es einem Charakter, zuvor kompilierte Sprites zu vernichten. Siehe Sprites, S. 252.
skill.demolitions.desc            = Diese Fertigkeit wird zur Vorbereitung, Platzierung, Detonation \u2013 und häufi g auch zum Entschärfen \u2013 von chemischen Sprengstoffen benutzt. Siehe Sprengstoffe, S. 438.
skill.disenchanting.desc          = Mit dieser Fertigkeit kann man magische Verzauberungen von Gegenständen entfernen. Siehe Entzaubern, S. 307.
skill.disguise.desc               = Verkleiden umfasst das nichtmagische Verändern des \u00C4ußeren mit Schminke oder Verkleidungen. Siehe Einsatz von Verkleiden, S. 135.
skill.diving.desc                 = Tauchen umfasst eine Vielzahl von Handlungen, die unter Wasser stattfinden. Die Fertigkeit kann beim Tauchen, beim Schwimmen unter Wasser, bei der Benutzung komplizierter Tauchgeräte und beim Luftanhalten benutzt werden.
skill.electronic_warfare.desc     = Elektronische Kriegsführung bildet die Basis militärischer Signalaufklärung. Sie umfasst das Verschlüsseln, Stören, Täuschen und Entschlüsseln elektronischer Kommunikationssysteme. Wenn der Charakter die richtige Ausrüstung hat, kann er diese Fertigkeit nutzen, um Signale aus beliebigen Kommunikationssystemen zu manipulieren oder sogar zu übernehmen. Siehe Einsatz von Elektronischer Kriegsführung, S. 223.
skill.escapeartist.desc           = Entfesseln misst die Fähigkeit eines Charakters, mit manueller Geschicklichkeit und Verrenkungen aus Fesseln zu entkommen. Siehe Einsatz von Entfesseln, S. 135.
skill.etiquette.desc              = Gebräuche steht für das Verständnis und das Erkennen von angemessenem Sozialverhalten. Die Fertigkeit dient als eine Art soziale Version von Schleichen und ermöglicht es, unerkannt durch verschiedene soziale Situationen zu kommen. Außerdem kann sie ein gesellschaftliches Sicherheitsnetz sein, wenn ein Spieler eine soziale Situation verpatzt, die der Charakter aber bewältigt hätte. Siehe Einsatz von Gebräuche, S. 141.
skill.exoticClose.desc            = Manchmal ist eine gewöhnliche Klinge oder ein Knüppel nicht genug, und man braucht etwas Ausgefalleneres. Oder Seltsameres.\nDiese Fertigkeit muss für jede exotische Nahkampfwaffe separat erworben werden. Beispiele dafür sind Monofilamentpeitschen oder -kettensägen.
skill.exoticRanged.desc           = Manchmal ist eine gewöhnliche Schusswaffe nicht genug, und man braucht etwas Ausgefalleneres. Oder Seltsameres.\nDiese Fertigkeit muss für jede exotische Fernkampfwaffe separat erworben werden. Beispiele dafür sind Blasrohre, Gyrojet-Pistolen, Flammenwerfer und Laser.
skill.first_aid.desc              = Erste Hilfe ist die Fähigkeit, Notfallmedizin wie ein Sanitäter zu betreiben. Sie kann genutzt werden, um Verletzungen zu behandeln und Charaktere zu stabilisieren, damit sie nicht sterben. Erste Hilfe kann nicht für chirurgische Eingriffe oder zum Reparieren beschädigter Implantate benutzt werden. Näheres dazu finden Sie unter Heilung ab S. 204.
skill.forgery.desc                = Fälschen ermöglicht die Herstellung gefälschter Gegenstände oder das Verändern existierender Gegenstände für eigene Zwecke. Je nach Art der Fälschung sind unterschiedliche Werkzeuge, Materialien oder Vorlagen nötig. Siehe Einsatz von Fälschen, S. 146.
skill.freefall.desc               = Diese Fertigkeit deckt Sprünge aus jeder Höhe \u2013 vom Sprung aus dem zweiten Stock bis zum Absprung aus einem hoch fliegenden Flugzeug \u2013 ab. Wenn der Fall irgendwie gesteuert oder verlangsamt werden soll, wird diese Fertigkeit benutzt, also zum Beispiel beim Fallschirmspringen, Fliegen mit Wingsuit oder beim schnellen Abseilen, beim Bungeespringen oder mit der Seilrutsche.
skill.gunnery.desc                = Die Fertigkeit Geschütze wird zum Schießen mit fahrzeugmontierten Waffen, unabhängig von der Art der Waffenhalterung, benutzt. Sie umfasst sowohl die Bedienung von Hand als auch über Sensoren (S. 186).
skill.gymnastics.desc             = Akrobatik misst das Balancegefühl, die Koordination und generelle Bewegungsfähigkeit. Weitere Informationen zur Anwendung von Akrobatik fi nden Sie unter Einsatz von Akrobatik, S. 134.
skill.hacking.desc                = Hacking dient zum Entdecken und Ausnutzen von Sicherheitslücken in Computern und anderer Elektronik. Genaueres dazu fi nden Sie unter Einsatz von Hacking, S. 223.
skill.hardware.desc               = Hardware steht für die Fähigkeit eines Charakters, elektronische Geräte zu bauen und zu reparieren. Dazu sind ein Arbeitsplatz, Material, Werkzeug und genügend Zeit notwendig. Siehe Bauen und Reparieren, S. 146.
skill.heavyweapons.desc           = Die Fertigkeit Schwere Waffen umfasst die Benutzung aller Fernkampfwaffen, die größer als Sturmgewehre sind \u2013 wie etwa Granatwerfer, Maschinengewehre und Sturmkanonen. Die Fertigkeit gilt nur für in der Hand geführte und nicht fahrzeugmontierte Waffen. Wenn man eine fahrzeugmontierte Waffe benutzen will, braucht man die Fertigkeit Geschütze.
skill.impersonation.desc          = Verkörperung steht für die Fähigkeit, in die Rolle einer anderen Person zu schlüpfen und sie in Stimme und Verhalten nachzuahmen. Die Fertigkeit ist durch die körperlichen Voraussetzungen eines Charakters begrenzt. Ein Zwerg kann vielleicht per Kommlink die Stimme eines Trolls nachmachen, aber wenn er dem Ziel gegenübersteht, wird die Illusion verfliegen.
skill.industrial_mechanic.desc    = Industriemechanik beschäftigt sich mit dem Reparieren oder Umbauen von großen Maschinen wie Fertigungsstraßen, Generatoren, Industrierobotern, Lüftungs- und Heizungstechnik und so weiter. Siehe Bauen und Reparieren, S. 146.
skill.instruction.desc            = Unterricht steht für die Fähigkeit, anderen Leuten etwas beizubringen. Die Fertigkeitsstufe regelt, wie gut man neues Wissen vermitteln kann und bis zu welcher Komplexität man eine Fertigkeit lehren kann. Siehe Einsatz von Unterricht, S. 142.
skill.interest.desc               = Es mag seltsam klingen, aber viele Runner haben Hobbys, die über das Schießen und Zaubern hinausgehen. Hobbywissen entsteht aus Interessen, die man zum Spaß oder zur Entspannung verfolgt. Es gibt keine Grenzen und Beschränkungen für Hobbywissen, das ein Charakter haben kann.
skill.intimidation.desc           = Einschüchtern dient dazu, gefährlicher zu wirken als andere Leute, um diese dazu zu bringen, zu tun, was man möchte. Die Fertigkeit kann in verschiedenen Zusammenhängen \u2013 von der Verhandlung bis zum Verhör \u2013 eingesetzt werden. Einschüchtern wird als Vergleichende Probe auf Einschüchtern + Charisma [Sozial] gegen Einschüchtern + Willenskraft [Sozial] des Ziels abgehandelt. Modifikatoren dafür finden Sie in der Tabelle Soziale Modifikatoren, S. 140.
skill.language.desc               = Sprache ist die Fähigkeit, mit geschriebenen oder gesprochenen Worten in einer bestimmten Sprache zu kommunizieren. Charaktere, die mehrere Sprachen beherrschen wollen, müssen für jede Sprache eine separate Fertigkeit erwerben.
skill.leadership.desc             = Führung dient dazu, Leute zu führen und zu motivieren. Im Gegensatz zu \u00DCberreden verlässt man sich bei Führung eher auf Autorität als auf Täuschung. Diese Fertigkeit ist besonders hilfreich, wenn ein Teammitglied erschüttert ist oder jemand gebeten wird, etwas zu tun, womit er sich nicht wohlfühlt. Die Fertigkeit Führung soll aber nicht als Ersatz für schlechte Zusammenarbeit im Team dienen. Siehe Einsatz von Führung, S. 141.
skill.locksmith.desc              = Diese Fertigkeit umfasst das Bauen, Reparieren, Manipulieren und \u00D6ffnen von mechanischen und elektronischen Schlössern. Meist werden mechanische Schließsysteme als Antiquitäten gesehen, aber als Ersatzsysteme oder \u00DCberraschung fi ndet man sie immer noch. Elektronische Schlösser sind viel weiter verbreitet und lassen sich mit dieser Fertigkeit gut manipulieren. Siehe Türen, Fenster und Schlösser, S. 362.
skill.longarms.desc               = Die Fertigkeit Gewehre dient zur Benutzung von Langwaffen wie Jagd- und Scharfschützengewehren. In diese Kategorie fallen auch Waffen wie Schrotflinten, die im Schulteranschlag abgefeuert werden.
skill.medicine.desc               = Medizin wird für größere Eingriffe wie Chirurgie benutzt. Auch bei länger dauernder Behandlung von Krankheiten oder für Diagnosen kann die Fertigkeit angewandt werden. Sie ist auch zur Implantation oder Entfernung von Cyber- und Bioware nutzbar, ermöglicht aber an den Systemen selbst keine Reparaturen oder Wartung. Näheres dazu finden Sie unter Heilung ab S. 204.
skill.native_language.desc        = Sprache ist die Fähigkeit, mit geschriebenen oder gesprochenen Worten in einer bestimmten Sprache zu kommunizieren. Charaktere, die mehrere Sprachen beherrschen wollen, müssen für jede Sprache eine separate Fertigkeit erwerben.
skill.native_language2.desc       = Sprache ist die Fähigkeit, mit geschriebenen oder gesprochenen Worten in einer bestimmten Sprache zu kommunizieren. Charaktere, die mehrere Sprachen beherrschen wollen, müssen für jede Sprache eine separate Fertigkeit erwerben.
skill.nautical_mechanic.desc      = Seefahrtmechanik beschäftigt sich mit Wartung, Reparatur und Umbau von Wasserfahrzeugen. Auch für diese Fertigkeit braucht man Teile, Werkzeug und Zeit. Siehe Bauen und Reparieren, S. 146.
skill.navigation.desc             = Mit der Fertigkeit Navigation können Technologie und Instinkt einen Charakter durch verschiedene Gelände führen. Sie ermöglicht das Lesen von Karten, die Benutzung von GPS-Geräten und AR-Wegweisern sowie die Orientierung an Geländemerkmalen oder nach dem eigenen Gefühl. Navigation kann in Umgebungen mit und ohne AR genutzt werden.
skill.negotiating.desc            = Verhandlung steht für die Fähigkeit, Charisma, Kommunikationstechniken und Psychologie bei Geschäften einzusetzen, um sich in eine bessere Position zu bringen.
skill.palming.desc                = Diese Fertigkeit ermöglicht dem Charakter, unbemerkt kleine Gegenstände zu stehlen, zu verbergen oder weiterzugeben.
skill.perception.desc             = Wahrnehmung ermöglicht es, das Besondere im Alltag wahrzunehmen, und ist eine der wichtigsten Fertigkeiten für Shadowrunner. Siehe Einsatz von Wahrnehmung, S. 137.
skill.performance.desc            = Diese Fertigkeit repräsentiert die Fähigkeiten und das Handwerkszeug, die man für die darstellenden Künste braucht. Der Aufführende kann mit dieser Fertigkeit ein Publikum unterhalten und vielleicht sogar in seinen Bann ziehen. Siehe Einsatz von Vorführung, S. 142.
skill.pilot_aerospace.desc        = Als Raumfahrzeuge gelten Fahrzeuge, die zu suborbitalem oder Raumflug bei niedriger Schwerkraft oder Schwerelosigkeit fähig sind.
skill.pilot_aircraft.desc         = Diese Fertigkeit wird zum Lenken bemannter oder unbemannter Flugzeuge benutzt, die innerhalb der Atmosphäre fliegen.
skill.pilot_exotic_vehicle1.desc  = Diese Fertigkeit muss für jedes exotische Fahrzeug separat erworben werden. Das Fahrzeug kann mit dieser Fertigkeit auch ferngesteuert werden, sofern das möglich ist.
skill.pilot_exotic_vehicle2.desc  = Diese Fertigkeit muss für jedes exotische Fahrzeug separat erworben werden. Das Fahrzeug kann mit dieser Fertigkeit auch ferngesteuert werden, sofern das möglich ist.
skill.pilot_ground_craft.desc     = Mit dieser Fertigkeit lenkt man alle Bodenfahrzeuge, die nicht auf Beinen laufen. Die Fertigkeit wird sowohl zur direkten als auch zur Fernsteuerung benutzt.
skill.pilot_walker.desc           = Alle \u201EFahrzeuge\u201C, die auf zwei oder mehr Beinen laufen, werden mit dieser Fertigkeit gelenkt. Der Charakter kann den Läufer direkt oder fernsteuern.
skill.pilot_watercraft.desc       = Diese Fertigkeit dient zum Lenken von Wasserfahrzeugen \u2013 entweder direkt oder per Fernlenkung.
skill.pistols.desc                = Diese Fertigkeit dient zum Schießen mit Handfeuerwaffen wie Tasern, Einzelschusspistolen, Halbautomatiken und Revolvern.
skill.professional_knowledge.desc = Berufswissen umfasst das Wissen über gewöhnliche Berufe, wie Journalismus, Handel, Technik und \u00C4hnliche. Dieses Wissen kann bei einer Recherche, vor allem in der Welt der Konzerne, nützlich sein.
skill.registering.desc            = Mit dieser Fertigkeit kann ein Technomancer Sprites in der Matrix registrieren, wodurch Gitter sie als berechtigt anerkennen. Siehe Sprites, S. 252.
skill.ritual_spellcasting.desc    = Ritualzauberei dient dazu, Ritualzauber zu wirken. Siehe Ritualzauberei, S. 294.
skill.running.desc                = Laufen dient dem \u00DCberwinden von Entfernungen in kurzer Zeit. Näheres dazu fi nden Sie unter Einsatz von Laufen, S. 136.
skill.sneaking.desc               = Sie müssen an einen Ort, an dem Sie nichts zu suchen haben? Diese Fertigkeit erlaubt Ihnen, in verschiedenen Situationen unauffällig zu bleiben. Siehe Einsatz von Heimlichkeitsfertigkeiten, S. 135.
skill.software.desc               = Software wird benutzt, um Programme zu schreiben und zu manipulieren. Siehe Einsatz von Software, S. 223. Auch Technomancer benutzen Software, um ihre Komplexen Formen zu weben (s. Weben, S. 249).
skill.spellcasting.desc           = Die Fertigkeit Spruchzauberei erlaubt es dem Charakter, Mana als Energie für Effekte zu nutzen, die man \u201EZaubersprüche\u201C nennt. Siehe Spruchzauberei, S. 279.
skill.street_knowledge.desc       = Straßenwissen ist mit dem Attribut Intuition verbunden. Diese Art Wissen beschäftigt sich mit den wichtigen Personen in einer Stadt und damit, wie man auf der Straße zu etwas kommt. Man kennt die Leute in verschiedenen Vierteln, weiß, wen man wozu befragen kann und wo man etwas findet. Die Informationen, die diese Wissensfertigkeit abdeckt, ändern sich schnell und häufi g, aber die Instinkte des Charakters ermöglichen ihm, auf dem Laufenden zu bleiben.
skill.summoning.desc              = Mit dieser Fertigkeit werden Geister herbeigerufen. Siehe Herbeirufen, S. 299.
skill.survival.desc               = Sie sind in der Wüste mit nichts als einem Becher, einem Poncho und einer Eisenstange? Dann brauchen Sie diese
skill.swimming.desc               = Diese Fertigkeit steht für die Fähigkeit des Charakters, in verschiedenen Gewässerarten zu schwimmen. Die Stufe der Fertigkeit beeinfl usst, wie weit und wie schnell er schwimmen kann. Siehe Einsatz von Schwimmen, S. 136.
skill.throwing.desc               = Wurfwaffen ist eine breit gefächerte Fertigkeit zum Werfen von Gegenständen, die als Waffen dienen.
skill.tracking.desc               = Diese Fertigkeit ermöglicht das Erkennen der Spuren von Metamenschen und anderem Wild im Gelände und das Verfolgen dieser Spuren. Sie erlaubt es auch, unmarkierte Wege und Wildpfade in verschiedenen Umgebungen zu fi nden. Siehe Einsatz von Spurenlesen, S. 136.
skill.unarmed.desc                = Diese Fertigkeit steht für Selbstverteidigung und Angriffe, bei denen der Körper die Hauptwaffe ist. Dazu gehören allerlei Kampfkünste, der Einsatz von Cyberimplantatwaffen und die Kampfstile, die sich für diese Waffen entwickelt haben.

spell.acidstream.desc               = Diese Zauber erzeugen eine stark ätzende Flüssigkeit, die auf das Ziel spritzt, schreckliche Verbrennungen verursacht und organisches Material und Metall zersetzt. Behandeln Sie dies als Säureschaden (S. 175), mit entsprechenden Auswirkungen auf den beein\u001E ussten Bereich und darin befindliche Gegenstände. Die Säure löst sich schnell auf, aber der angerichtete Schaden bleibt. Säurestrahl trifft ein Ziel, Säurewelle ist ein Flächenzauber.
spell.agony.desc                    = Schmerz ruft die Illusion heftiger Schmerzen hervor und ist bei Zauberern, die in der Klemme stecken, sehr beliebt. Jeder Nettoerfolg, den der Zauberer erzielt, fügt dem Ziel temporär 1 Kästchen Körperlichen und 1 Kästchen Geistigen Schaden zu. Dabei handelt es sich allerdings nicht um wirklichen Schaden, nur um eine Messgröße für die Wirkung des Zaubers. Das Ziel erleidet alle Auswirkungen, inklusive Verletzungsmodi fikatoren, die durch Schaden in der gleichen Höhe hervorgerufen würden. Wenn die Schadenskästchen des Ziels dadurch vollständig gefüllt werden, windet es sich vor Schmerzen und ist unfähig, sich zu bewegen oder zu handeln. Wenn der Zauber endet, endet auch der Schmerz sofort, und die vermeintlichen Schadenskästchen verschwinden. Schmerz trifft ein einzelnes Ziel. Massenschmerz ist ein Flächenzauber.
spell.analyze_device.desc           = Dieser Zauber lässt das Ziel die Funktion und Bedienung eines Geräts oder Ausrüstungsstücks erkennen, das sich innerhalb der Sinnesreichweite befindet. Dem Wirken des Zaubers wird mit dem Objektwiderstand (S. 290) widerstanden. Jeder Nettoerfolg kann verwendet werden, um eine Information über das Gerät zu erlangen, die nicht sofort offensichtlich ist (man würde also beispielsweise nicht erfahren, dass das Gerät von Renraku ist, wenn das entsprechende Logo groß darauf prangt, sondern eher, wozu das Gerät eigentlich dient). Jeder Nettoerfolg verleiht dem Ziel, solange der Zauber aufrechterhalten wird, außerdem einen Würfelpoolbonus von +1 bei der Benutzung des Geräts. Außerdem darf das Ziel, wenn es improvisieren muss, um das Gerät zu bedienen, den dabei üblichen Würfelpoolmodifikator von -1 ignorieren.
spell.analyze_magic.desc            = Dieser Zauber erlaubt dem Ziel, ein magisches Objekt (wie etwa einen Fokus, ein Alchemisches Erzeugnis, ein Magisches Refugium oder ein aktives Ritual) innerhalb der Sinnesreichweite zu analysieren. Die Nettoerfolge der Spruchzaubereiprobe werden als Erfolge auf der Tabelle Askennen (S. 312) gewertet, außer dass das Ziel dafür nicht astral wahrnehmen muss.
spell.analyze_truth.desc            = Das Ziel kann erkennen, ob die Aussagen einer Person wahr sind (oder diese sie zumindest für wahr hält). Der Zauber benötigt mindestens 1 Nettoerfolg, um die Wahrheit einer ausgewählten Aussage zu bestimmen. Der Zauber wirkt nicht auf schriftliche Informationen oder solche, die durch technologische Medien verbreitet werden. Das Ziel muss die fragliche Aussage selbst hören (und die Person muss sich innerhalb der Sinnesreichweite befinden), um ihren Wahrheitsgehalt bewerten zu können.
spell.animate.desc                  = Dieser Zauber sorgt dafür, dass sich unbelebte Gegenstände bewegen. Der Gegenstand bewegt sich so, wie es zu ihm passt (Bälle können rollen, Teppiche könnten kriechen, humanoide Statuen können gehen usw.). Der Zauber sorgt für eine eingeschränkte Beweglichkeit, wodurch zum Beispiel Statuen dahinwatscheln können, als hätten sie Gelenke. Der Gegenstand widersteht dem Zauber mit seinem Objektwiderstand (S. 290). Schwerere Gegenstände (ab 200 Kilogramm Masse) haben einen höheren Widerstand (+2 pro vollen 200 Kilogramm). Das Steuern eines Gegenstandes benötigt eine Einfache Handlung. Man kann dem Gegenstand auch befehlen, sich in der gleichen Richtung weiterzubewegen, während man sich auf etwas anderes konzentriert. Der Zauberer hat nur eine ungefähre Kontrolle über die Bewegung des Gegenstands und kann keine Teile davon (wie etwa den Arm einer Statue) separat bewegen (feinere Manipulationen erfordern einen Zauber wie etwa Zauberfinger, S. 290). Die maximale Bewegungsrate der Gegenstände beträgt (Kraftstufe) Meter pro Kampfrunde, wobei der Spielleiter das letzte Wort über die tatsächlich erreichbare Geschwindigkeit hat. Wenn der Gegenstand von jemandem festgehalten wird, muss der Zauberer bei einer Vergleichenden Probe auf Kraftstufe x 2 gegen Konstitution + Stärke des Gegners gewinnen, um den Gegenstand freizubekommen. Wenn der Gegenstand befestigt ist, legt der Spielleiter einen Schwellenwert für die Probe mit Kraftstufe x 2 fest. Belebung beeinflusst ein einzelnes, lebloses Objekt. Massenbelebung ist ein Flächenzauber, der mehrere Objekte (wie etwa die Reinigungsgeräte in einer Besenkammer) gleichzeitig bewegen kann.
spell.antidote.desc                 = Dieser Zauber hilft dem Ziel, die Wirkung eines Toxins zu überstehen. Der Zauber wird nach einer Vergiftung gewirkt, aber bevor das Ziel seine Toxinwiderstandsprobe ablegen muss. Wie viel Zeit man dafür hat, hängt von der Geschwindigkeit des Gifts ab. Die Erfolge der Spruchzaubereiprobe gelten direkt als zusätzliche Erfolge bei der Toxinwiderstandsprobe.
spell.armor.desc                    = Dieser Zauber erzeugt ein leuchtendes Feld magischer Energie um das Ziel, das gegen Körperlichen Schaden schützt. Er gewährt einen Panzerungsbonus in Höhe der Anzahl der Erfolge bei der Spruchzaubereiprobe, der kumulativ mit anderer Panzerung wirkt. Bei der Berechnung von Panzerungsbehinderung (s. Panzerung und Belastung, S. 171) muss dieser Panzerungsbonus nicht berücksichtigt werden.
spell.balllightning.desc            = Diese Zauber erzeugen elektrische Entladungen, die Elektrizitätsschaden (S. 173) verursachen. Blitzstrahl trifft ein einzelnes Ziel. Kugelblitz ist ein Flächenzauber.
spell.blast.desc                    = Diese Zauber treffen ihr(e) Ziel(e) mit einer unsichtbaren psychokinetischen Macht - wie ein Faustschlag, der Geistigen Schaden verursacht. Schlag erfordert die Berührung des Ziels. Stoß trifft ein einzelnes Ziel. Druckwelle ist ein Flächenzauber.
spell.bugs.desc                     = Diese Zauber lassen die Opfer glauben, dass auf ihrem ganzen Körper Insekten herumkrabbeln, sie beißen und in verschiedene Körperöffnungen kriechen. Die Insekten sehen real aus, hören sich real an, riechen und schmecken sogar real. Die Illusion ist häufig genug ausreichend, dass jedes Ziel, das dem Zauber nicht widersteht, panisch wird. Jeder Nettoerfolg bei der Spruchzaubereiprobe senkt das Initiativeergebnis des Opfers um 2. Wenn der Zauber aufrechterhalten wird, findet diese Reduktion des Initiativeergebnisses zu Beginn jeder Kampfrunde statt. Verlorene Punkte vom Initiativeergebnis werden nicht zurückgewonnen, wenn der Zauber endet. Viecher trifft ein einzelnes Ziel. Schwarm ist ein Flächenzauber.
spell.chaos.desc                    = Diese Zauber erzeugen einen Sturm von widersprüchlichen Sinneseindrücken, die die Opfer völlig durcheinanderbringen. Pro Nettoerfolg bei der Spruchzaubereiprobe erleidet das Ziel wegen der Ablenkung einen Würfelpoolmodifikator von -1 auf alle Proben. Verwirrung trifft ein einzelnes Ziel. Massenverwirrung ist ein Flächenzauber. Chaos ist die physische Version von Verwirrung, wirkt also auch gegen technologische Systeme und Sichtgeräte. Chaotische Welt ist die Flächenvariante von Chaos.
spell.chaoticworld.desc             = Diese Zauber erzeugen einen Sturm von widersprüchlichen Sinneseindrücken, die die Opfer völlig durcheinanderbringen. Pro Nettoerfolg bei der Spruchzaubereiprobe erleidet das Ziel wegen der Ablenkung einen Würfelpoolmodifikator von -1 auf alle Proben. Verwirrung trifft ein einzelnes Ziel. Massenverwirrung ist ein Flächenzauber. Chaos ist die physische Version von Verwirrung, wirkt also auch gegen technologische Systeme und Sichtgeräte. Chaotische Welt ist die Flächenvariante von Chaos.
spell.clairaudience.desc            = Das Ziel kann entfernte Geräusche hören, als wäre es innerhalb der Sinnesreichweite vor Ort. Der Lauschpunkt kann innerhalb der Reichweite des Zaubers mit einer Komplexen Handlung bewegt werden. Solange das Ziel Hellhören einsetzt, kann es sein normales Gehör nicht benutzen. Der Zauber überträgt keine optischen Eindrücke, nur Geräusche. Dabei können nur Geräusche wahrgenommen werden, die das Ziel mit seinem normalen Gehör wahrnehmen könnte; Gehörverbesserungen wirken hier nicht.
spell.clairvoyance.desc             = Das Ziel kann entfernte Dinge sehen, als wäre es innerhalb der Sinnesreichweite vor Ort. Der Sichtpunkt kann innerhalb der Reichweite des Zaubers mit einer Komplexen Handlung bewegt werden. Solange das Ziel Hellsicht einsetzt, kann es weder seine normale Sicht noch astrale Wahrnehmung benutzen. Der Zauber überträgt keine Geräusche, nur optische Eindrücke; die Sicht profitiert nicht von Sichtverbesserungen. Man kann auf Ziele, die man mit Hellsicht wahrnimmt, keine Zauber wirken.
spell.clout.desc                    = Diese Zauber treffen ihr(e) Ziel(e) mit einer unsichtbaren psychokinetischen Macht - wie ein Faustschlag, der Geistigen Schaden verursacht. Schlag erfordert die Berührung des Ziels. Stoß trifft ein einzelnes Ziel. Druckwelle ist ein Flächenzauber.
spell.combat_sense.desc             = Das Ziel kann unterbewusst Kämpfe und andere gefährliche Situationen innerhalb der Sinnesreichweite analysieren. Es nimmt Ereignisse bereits Sekundenbruchteile vor ihrem Eintreten wahr. Jeder Erfolg bei der Spruchzaubereiprobe verleiht dem Ziel +1 Würfel für \u00DCberraschungsproben und für Verteidigungsproben gegen Nah- und Fernkampfangriffe, solange der Zauber aufrechterhalten wird. Während dieser Zauber aufrechterhalten wird, darf das Ziel vor einer möglichen \u00DCberraschungssituation (S. 191) immer eine Wahrnehmungsprobe ablegen und hat den Vorteil, schon alarmiert zu sein, wenn die Probe gelingt.
spell.confusion.desc                = Diese Zauber erzeugen einen Sturm von widersprüchlichen Sinneseindrücken, die die Opfer völlig durcheinanderbringen. Pro Nettoerfolg bei der Spruchzaubereiprobe erleidet das Ziel wegen der Ablenkung einen Würfelpoolmodifikator von -1 auf alle Proben. Verwirrung trifft ein einzelnes Ziel. Massenverwirrung ist ein Flächenzauber. Chaos ist die physische Version von Verwirrung, wirkt also auch gegen technologische Systeme und Sichtgeräte. Chaotische Welt ist die Flächenvariante von Chaos.
spell.control_actions.desc          = Diese Zauber erzeugen einen Sturm von widersprüchlichen Sinneseindrücken, die die Opfer völlig durcheinanderbringen. Pro Nettoerfolg bei der Spruchzaubereiprobe erleidet das Ziel wegen der Ablenkung einen Würfelpoolmodifikator von -1 auf alle Proben. Verwirrung trifft ein einzelnes Ziel. Massenverwirrung ist ein Flächenzauber. Chaos ist die physische Version von Verwirrung, wirkt also auch gegen technologische Systeme und Sichtgeräte. Chaotische Welt ist die Flächenvariante von Chaos.
spell.control_thoughts.desc         = Der Zauberer übernimmt die Kontrolle über den Geist des Ziels und gibt diesem vor, was es denken soll. Der Zauberer gibt mentale Befehle als Einfache Handlung, und das Ziel muss diesen folgen, als wären sie seine eigenen Ideen. Gedanken Beherrschen wirkt nur gegen ein einzelnes lebendes Ziel. Mob-Bewusstsein wirkt gegen alle lebenden Ziele im Wirkungsbereich. Die Opfer des Mob-Bewusstseins können einzeln (jeweils mit einer Einfache Handlung) gesteuert werden oder als Gruppe alle denselben Befehl erhalten (mit einer einzelnen Einfache Handlung).
spell.cure_disease.desc             = Dieser Zauber wird irgendwann nach einer Infektion auf einen Patienten gewirkt, um ihm beim \u00DCberwinden der Krankheit zu helfen. Der infizierte Charakter erhält für seine Krankheitswiderstandsprobe(n) zusätzliche Würfel in Höhe der Erfolge des Zauberers, bis er sich erholt (oder stirbt). Allerdings wird durch diesen Zauber kein Schaden geheilt, den die Krankheit bereits verursacht hat (dazu benötigt man den Zauber Heilen).
spell.deathtouch.desc               = Todeshand, Manablitz und Manaball kanalisieren destruktive magische Energie in ein Ziel und verursachen Körperlichen Schaden, indem sie die Zellen des Körpers des Ziels (oder die "Manastruktur" astral aktiver Wesen) zerstören. Da es sich um Manazauber handelt, wirken diese Zauber nur gegen lebende und magische Ziele. Widerstandsproben werden mit Willenskraft abgelegt. Todeshand erfordert die Berührung des Ziels. Manablitz trifft ein einzelnes Ziel. Manaball ist ein Flächenzauber.
spell.decrease_attribute.desc       = Dieser Zauber schwächt das Ziel, indem er ein bestimmtes Attribut senkt. Es gibt für jedes Geistige und Körperliche Attribut eine eigene Version dieses Zaubers, nicht aber für die Spezialattribute Edge, Essenz, Magie oder Resonanz. Der Zauber kann sowohl gegen natürliche als auch gegen verstärkte Attribute wirken. Dieser Zauber wird als Vergleichende Probe auf Spruchzauberei + Magie [Kraftstufe] gegen [Zielattribut] + Willenskraftes Ziels gewirkt. Wenn der Zauberer gewinnt, wird das Attribut um die Anzahl der Nettoerfolge reduziert. Wenn ein Körperliches Attribut auf 0 sinkt, ist das Opfer bewegungsunfähig und paralysiert. Wenn ein Geistiges Attribut auf 0 sinkt, ist das Ziel vollkommen verwirrt und steht einfach nur in der Gegend herum. Das Senken eines Attributs verändert auch abgeleitete Werte, die von diesem Attribut abhängen (wie etwa den Initiativewert bei Intuition oder Reaktion oder die Anzahl der Schadenskästchen bei Konstitution), solange der Zauber aufrechterhalten wird.
spell.detect_enemies.desc           = Das Ziel kann lebende Wesen innerhalb der Sinnesreichweite entdecken, die ihm gegenüber feindlich gesinnt sind. Der Zauber kann keine Fallen entdecken (weil diese nicht lebendig sind) und auch niemanden, der einfach blindwütig in die Menge schießen will (weil die Feindschaft nicht direkt gegen das Ziel des Zaubers gerichtet ist). Der Zauber kann aber Feinde entdecken, die einen Hinterhalt oder \u00DCberraschungsangriff gegen das Ziel planen.
spell.detect_enemies_extended.desc  = Das Ziel kann lebende Wesen innerhalb der Sinnesreichweite entdecken, die ihm gegenüber feindlich gesinnt sind. Der Zauber kann keine Fallen entdecken (weil diese nicht lebendig sind) und auch niemanden, der einfach blindwütig in die Menge schießen will (weil die Feindschaft nicht direkt gegen das Ziel des Zaubers gerichtet ist). Der Zauber kann aber Feinde entdecken, die einen Hinterhalt oder \u00DCberraschungsangriff gegen das Ziel planen.
spell.detect_individual.desc        = Das Ziel kann die Anwesenheit einer bestimmten Person innerhalb der Sinnesreichweite feststellen. Die Person muss beim Wirken des Zaubers angegeben werden. Es muss sich um jemanden handeln, den das Ziel kennt oder zumindest einmal getroffen hat.
spell.detect_life.desc              = Das Ziel entdeckt alle Lebewesen (aber keine Geister) innerhalb der Sinnesreichweite und erfährt ihre Anzahl und ihre Aufenthaltsorte relativ zur eigenen Position. In einem dicht bevölkerten Gebiet ist dieser Zauber praktisch nutzlos, weil er nur eine verschwommene Masse von Lebensspuren anzeigt.
spell.detect_lifeform.desc          = Das Ziel entdeckt alle Angehörigen einer bestimmten Lebensform innerhalb der Sinnesreichweite und erfährt ihre Anzahl und ihre Aufenthaltsorte relativ zur eigenen Position. Es handelt sich hier eigentlich um viele verschiedene Zauber, die für jede Lebensform (Orks, Elfen, Drachen usw.) separat erlernt werden müssen. Geister sind auch hier keine erlaubten Lebensformen; sie werden mit dem Zauber Magie Entdecken entdeckt.
spell.detect_lifeform_extended.desc = Das Ziel entdeckt alle Angehörigen einer bestimmten Lebensform innerhalb der Sinnesreichweite und erfährt ihre Anzahl und ihre Aufenthaltsorte relativ zur eigenen Position. Es handelt sich hier eigentlich um viele verschiedene Zauber, die für jede Lebensform (Orks, Elfen, Drachen usw.) separat erlernt werden müssen. Geister sind auch hier keine erlaubten Lebensformen; sie werden mit dem Zauber Magie Entdecken entdeckt.
spell.detect_live_extended.desc     = Das Ziel entdeckt alle Lebewesen (aber keine Geister) innerhalb der Sinnesreichweite und erfährt ihre Anzahl und ihre Aufenthaltsorte relativ zur eigenen Position. In einem dicht bevölkerten Gebiet ist dieser Zauber praktisch nutzlos, weil er nur eine verschwommene Masse von Lebensspuren anzeigt.
spell.detect_magic.desc             = Das Ziel entdeckt die Präsenz aller Foki, Zauber, Hüter, Magischer Refugien, Alchemischer Erzeugnisse, Rituale und Geister innerhalb der Sinnesreichweite. Es kann keine Erwachten Charaktere oder Critter, astralen Signaturen, abgelaufenen oder bereits ausgelösten Alchemischen Erzeugnisse oder Wirkungen permanenter Zauber, die bereits permanent sind, entdecken.
spell.detect_magic_extended.desc    = Das Ziel entdeckt die Präsenz aller Foki, Zauber, Hüter, Magischer Refugien, Alchemischer Erzeugnisse, Rituale und Geister innerhalb der Sinnesreichweite. Es kann keine Erwachten Charaktere oder Critter, astralen Signaturen, abgelaufenen oder bereits ausgelösten Alchemischen Erzeugnisse oder Wirkungen permanenter Zauber, die bereits permanent sind, entdecken.
spell.detect_object.desc            = Das Ziel entdeckt alle Gegenstände der angegebenen Objektkategorie innerhalb der Sinnesreichweite und erfährt ihre Anzahl und ihre Aufenthaltsorte relativ zur eigenen Position. Jede Objektkategorie muss mit einem eigenen Zauber (Feuerwaffen Entdecken, Computer Entdecken, Sprengstoffe Entdecken usw.) aufgespürt werden. Diese Zauber müssen separat erlernt und gewirkt werden.
spell.detox.desc                    = Entgiftung senkt die Nebenwirkungen von Giften und Drogen. Die Kraftstufe des Zaubers muss mindestens so hoch wie der Grundschadenscode des Toxins sein. Ein einziger Erfolg genügt, um alle Symptome zu beseitigen. Entgiftung heilt oder verhindert keinen Schaden durch Toxine, beseitigt aber jegliche Nebenwirkungen (wie Schwindel, Halluzinationen, \u00DCbelkeit, Schmerzen usw.). Entgiftung ist bei den Leuten, die es sich leisten können, das Katerbekämpfungsmittel der Wahl.
spell.entertainment.desc            = Diese Flächenzauber erzeugen offensichtliche, aber unterhaltsame Illusionen. Die Erfolge bei der Spruchzaubereiprobe geben an, wie detailliert, interessant oder fesselnd das Publikum die Illusion findet. Der Zauberer kann fast alles hervorrufen, was er sich vorstellen kann, oder etwas reproduzieren, das er erlebt hat. Unterhaltung beeinflusst den Geist der Ziele und kann nicht von technologischen Sensoren entdeckt werden. Trideo-Unterhaltung ist ein physischer Zauber und kann von lebenden und unbelebten Zielen wahrgenommen werden. Diese Zauber dienen sowohl der Unterhaltung als auch künstlerischen Zwecken. Die Unterhaltungsindustrie sieht Illusionisten buchstäblich als Spezialeffekt-Zauberer. Magische Designer und Künstler erfinnden ständig neue und interessante Illusionen, die meist weit über das hinausgehen, was in der wirklichen Welt erfahrbar wäre. Nur die Reichen können es sich leisten, diese Darbietungen live mitzuerleben.
spell.fireball.desc                 = Diese Zauber erzeugen Flammen, die ihre Ziele verbrennen, was zugleich schmerzhaft und furchtbar einschüchternd ist. Diese Zauber verursachen Feuerschaden (S. 174). Die Flammen verschwinden sofort wieder, nachdem sie das Ziel getroffen haben, können aber brennbares Material entzünden, das dann auch nach dem Zauber weiterbrennt. Flammenwerfer trifft ein einzelnes Ziel. Feuerball ist ein Flächenzauber.
spell.flamethrower.desc             = Diese Zauber erzeugen Flammen, die ihre Ziele verbrennen, was zugleich schmerzhaft und furchtbar einschüchternd ist. Diese Zauber verursachen Feuerschaden (S. 174). Die Flammen verschwinden sofort wieder, nachdem sie das Ziel getroffen haben, können aber brennbares Material entzünden, das dann auch nach dem Zauber weiterbrennt. Flammenwerfer trifft ein einzelnes Ziel. Feuerball ist ein Flächenzauber.
spell.fling.desc                    = Dieser Zauber schleudert psychokinetisch einen einzelnen Gegenstand von höchstens (Kraftstufe) Kilogramm Masse auf ein Ziel. Statt der normalen Wurfwaffenprobe wird die Spruchzaubereiprobe verwendet, wobei Schaden und Reichweite mit Magie statt Stärke bestimmt werden. Verwenden Sie die Reichweiten für normale Granaten (s. Tabelle Waffenreichweiten, S. 185).
spell.heal.desc                     = Heilen wirkt gegen körperliche Verletzungen. Der Zauber heilt eine Anzahl von Körperlichen Schadenskästchen gleich der Anzahl der Erfolge bei der Spruchzaubereiprobe. Erfolge können auch verwendet werden, um die Zeit zu reduzieren, bis die Wirkung permanent wird. Dabei verkürzt jeder so verwendete Erfolg die benötigte Zeit um 1 Kampfrunde. Man kann die Erfolge beliebig zwischen Heilung und Beschleunigung aufteilen. Alle Schadenskästchen, die nach dem Zauber verbleiben, können nur noch mit der Zeit durch Genesung (S. 205) geheilt werden.
spell.hush.desc                     = Diese Zauber erzeugen ein Feld, in dem Geräusche gedämpft werden. Schallangriffe aus dem Feld heraus oder in es hinein (auch von Critterkräften wie Lähmendes Heulen) werden pro Erfolg bei der Spruchzaubereiprobe um 1 reduziert. Wer versucht, Geräusche aus oder von hinter dem Feld wahrzunehmen, muss dem Zauber zuerst widerstehen. Schweigen ist ein Manazauber und wirkt daher nur gegen Lebewesen und magische Schallangriffe oder Critterkräfte. Stille ist ein physischer Zauber und wirkt daher auch gegen technologische Geräte. Er ist nützlich für das Stören von Alarmen, \u00DCberwachungsgeräten, Sonar und Kommunikation und kann auch technologische Schallwaffen beeinträchtigen.
spell.ice_sheet.desc                = Dieser Zauber erschafft eine rutschige Eisfläche, die den Wirkungsbereich bedeckt. Charakteren, die sich auf dem Eis bewegen, muss eine Probe auf Geschicklichkeit + Reaktion gelingen, damit sie nicht hinfallen. Der Schwellenwert entspricht der Anzahl der Erfolge bei der Spruchzaubereiprobe. Fahrzeuge müssen sofort eine Fahrzeugprobe ablegen, um nicht zu verunfallen (siehe S. 202). Die Eisdecke schmilzt bei Raumtemperatur vom Rand her mit einer Geschwindigkeit von 1 Quadratmeter pro Minute. Wenn es wärmer oder kälter ist, schmilzt sie schneller oder langsamer. Wenn die Umgebungstemperatur unter dem Gefrierpunkt liegt, schmilzt sie gar nicht.
spell.ignite.desc                   = Dieser Zauber regt die Molekularbewegung im Ziel an, wodurch es Feuer fängt, sobald die Wirkung permanent ist. Unbelebte Ziele widerstehen dem Zauber mit ihrem Objektwiderstand. Sobald das Ziel Feuer gefangen hat, brennt es weiter, bis es verbrannt ist oder gelöscht wird. Gegen lebende Ziele wird der Zauber mit einer Vergleichenden Probe auf Spruchzauberei + Magie [Kraftstufe] gegen Konstitution + Reaktion abgewickelt. Wenn der Zauber gelingt, wird das Ziel von Hitze und Flammen eingehüllt und beginnt zu brennen, sobald die Wirkung permanent ist (s. Feuerschaden, S. 174).
spell.imprinvisibility.desc         = Diese Zauber machen das Ziel durch den Gesichtssinn (auch durch Restlichtverstärkung, Infrarotsicht und andere Sinne, die optisch funktionieren) schwerer wahrnehmbar. Das Ziel ist weiter durch Berührung, Geruch, Gehör (dazu zählt auch Ultraschall) und sogar Geschmack (falls es dazu kommt) zu entdecken. Seine Aura ist durch astrale Wahrnehmung ebenfalls zu "sehen" Jeder, der das Ziel potenziell sehen könnte, muss zuerst dem Zauber widerstehen, um es wirklich zu sehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der das Ziel später sehen möchte. Selbst wenn der Unsichtbarkeit widerstanden wird, kann das Ziel durch eine genügend gute Schleichenprobe unentdeckt bleiben. Angriffe gegen ein unsichtbares Ziel erleiden den Malus für Blindes Feuern, wenn der Angreifer nicht in der Lage ist, es anders wahrzunehmen. Unsichtbarkeit beeinflusst den Geist der Betrachter. Verbesserte Unsichtbarkeit imitiert die Umgebung des Ziels aus allen Blickwinkeln und wirkt dadurch auch gegen technologische Sensoren.
spell.increase_attribute.desc       = Dieser Zauber erhöht bei einem freiwilligen Ziel ein natürliches oder verstärktes Attribut. Es gibt für jedes Geistige und Körperliche Attribut eine eigene Version dieses Zaubers, nicht aber für die Spezialattribute Edge, Essenz, Magie oder Resonanz. Die Kraftstufe des Zaubers muss mindestens so hochsein wie der (verstärkte) Wert des Zielattributs. Das Attributwird pro Erfolg bei der Spruchzaubereiprobe um 1 erhöht,wobei dermaximale Bonus von +4 (durch die Summe allerVerbesserungen) auf ein Attribut nicht überschritten werdenkann. \u00DCberzählige Erfolge verfallen. Jedes Attribut kanngleichzeitig nur von einem solchen Zauber betroffen sein. Das Steigern eines Attributs kann auch abgeleitete Wertebeeinflussen, die von diesem Attribut abhängen (ein Steigern der Reaktion beeinflusst die Initiative, eine Steigerung der Konstitution kann vorübergehend zusätzliche Kästchen auf dem Körperlichen Zustandsmonitor erzeugen usw.).
spell.influence.desc                = Der Zauberer p\u001E anzt eine einzelne Suggestion in den Geist des Opfers ein, die wie ein mächtiger posthypnotischer Befehl wirkt. Damit kann man das Ziel zum Beispiel dazu bringen, FizzyFluid für das beste Getränk der Welt zu halten, den Namen seines besten Freundes zu vergessen oder den Zauberer durch eine Tür einzulassen. Das Ziel folgt dieser Suggestion, als wäre es seine eigene Idee. Wenn es den Widerspruch zwischen Idee und Realität erkennt (weil zum Beispiel FizzyFluid ganz anders schmeckt als gedacht), kann es dem Zauber nach den normalen Beherrschungsregeln (s.o.) widerstehen. In jedem Fall verschwindet die Suggestion von selbst nach einer Anzahl von Minuten in Höhe der Nettoerfolge bei der Spruchzaubereiprobe.
spell.invisibility.desc             = Diese Zauber machen das Ziel durch den Gesichtssinn (auch durch Restlichtverstärkung, Infrarotsicht und andere Sinne, die optisch funktionieren) schwerer wahrnehmbar. Das Ziel ist weiter durch Berührung, Geruch, Gehör (dazu zählt auch Ultraschall) und sogar Geschmack (falls es dazu kommt) zu entdecken. Seine Aura ist durch astrale Wahrnehmung ebenfalls zu "sehen". Jeder, der das Ziel potenziell sehen könnte, muss zuerst dem Zauber widerstehen, um es wirklich zu sehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der das Ziel später sehen möchte. Selbst wenn der Unsichtbarkeit widerstanden wird, kann das Ziel durch eine genügend gute Schleichenprobe unentdeckt bleiben. Angriffe gegen ein unsichtbares Ziel erleiden den Malus für Blindes Feuern, wenn der Angreifer nicht in der Lage ist, es anders wahrzunehmen. Unsichtbarkeit beeinflusst den Geist der Betrachter. Verbesserte Unsichtbarkeit imitiert die Umgebung des Ziels aus allen Blickwinkeln und wirkt dadurch auch gegen technologische Sensoren.
spell.knockout.desc                 = Diese Zauber kanalisieren magische Energie direkt in ihr Ziel und verursachen Geistigen Schaden. Sie werden manchmal als "Schlafzauber" bezeichnet, weil sie Ziele bewusstlos machen können, ohne sie zu töten, falls man mal höflichere Gewalt bevorzugt. Schockhand erfordert die Berührung des Ziels. Betäubungsblitz trifft ein einzelnes Ziel. Betäubungsball ist ein Flächenzauber.
spell.levitate.desc                 = Levitieren erlaubt es, eine Person oder einen Gegenstand telekinetisch hochzuheben und durch die Luft zu bewegen. Der Schwellenwert für die Zauberprobe beträgt die Masse des Ziels in Kilogramm dividiert durch 200 (aufgerundet). Das Ziel kann innerhalb des Blickfelds des Zauberers mit einer Bewegungsrate von (Kraftstufe) Metern pro Kampfrunde bewegt werden. Wenn der Zauberer versucht, einen Gegenstand zu levitieren, der von einem Lebewesen gehalten wird, oder ein unwilliges Lebewesen zu levitieren, kann sich dieses Wesen mit Konstitution + Stärke gegen die Spruchzaubereiprobe wehren. Man kann sich mit diesem Zauber auch selbst levitieren, wenn man einen höheren Beobachtungspunkt braucht oder ohne Fallschirm abspringen will.
spell.light.desc                    = Dieser Zauber erzeugt eine mobile Lichtquelle, die einen Bereich mit einem Radius gleich der Kraftstufe des Zaubers in Metern beleuchtet. Der Zauber kann nicht verwendet werden, um ein Ziel zu blenden, kann aber Beleuchtungsmodifikatoren durch Dunkelheit abschwächen. Jeder Erfolg bei der Spruchzaubereiprobe senkt einen Malus durch fehlende Beleuchtung um 1.
spell.lightningbolt.desc            = Diese Zauber kanalisieren magische Energie direkt in ihr Ziel und verursachen Geistigen Schaden. Sie werden manchmal als \u201ESchlafzauber\u201C bezeichnet, weil sie Ziele bewusstlos machen können, ohne sie zu töten, falls man mal höflichere Gewalt bevorzugt. Betäubungsblitz trifft ein einzelnes Ziel.
spell.magic_fingers.desc            = Zauberfinger erzeugt einen psychokinetischen Effekt, der als eine Art ?unsichtbare Hand? Gegenstände halten oder manipulieren kann. Die Erfolge bei der Spruchzaubereiprobe werden zur Stärke und Geschicklichkeit dieser Zauber\u001F nger, wodurch sich das Gewicht der Gegenstände ergibt, die die Zauberfinger heben oder tragen können. Man kann mit Zauberfingern auch Fertigkeiten auf Entfernung einsetzen, wobei die Kraftstufe des Zaubers das jeweilige Charakterlimit ersetzt. Die Zauberfinger sind nicht sehr geschickt, daher können (nach Maßgabe des Spielleiters) auch einfache Aufgaben, wie etwa das Aufheben einer Münze, eine Probe erfordern. Man kann die Zauberfinger wie seine echten Hände zum Kämpfen, Schlösserknacken oder für andere Handlungen einsetzen. Die Zauberfinger können Gegenstände im Blickfeld des Zauberers manipulieren. Sollen mehrere Gegenstände gleichzeitig manipuliert werden, dürfen diese dabei nicht mehr als etwa einen Meter voneinander entfernt sein (die ?Spannweite? der magischen Arme). Dieser Zauber kann beim Entschärfen von Bomben oder für andere gefährliche Tätigkeiten sehr nützlich sein. Man kann allerdings keine Berührungszauber auf ein Ziel wirken, das man nur mit den Zauberfingern berührt.
spell.mana_barrier.desc             = Dieser Zauber erzeugt eine unsichtbare Barriere aus magischer Energie. Die Barriere kann als Halbkugel mit einem Radius gleich dem normalen Radius der Flächenwirkung erschaffen werden, oder aber als Wand mit einer Höhe gleich der Kraftstufe und einer Länge gleich der Kraftstufe x 2. Die Manabarriere hat eine Strukturstufe gleich der Anzahl der Erfolge folgt den normalen Regeln für Manabarrieren (S. 315). Die Barriere schränkt die körperliche Bewegung von Lebewesen oder physischen Gegenständen nicht ein, hält aber Geister, aktivierte Foki, Dualwesen und Zauber auf der Ebene auf, auf der sie gewirkt wurde (physisch oder astral). Wenn die Barriere im Astralraum gewirkt wird, hält sie dort auch astrale Gestalten auf und behindert die Sicht.
spell.manaball.desc                 = Todeshand, Manablitz und Manaball kanalisieren destruktive magische Energie in ein Ziel und verursachen Körperlichen Schaden, indem sie die Zellen des Körpers des Ziels (oder die "Manastruktur" astral aktiver Wesen) zerstören. Da es sich um Manazauber handelt, wirken diese Zauber nur gegen lebende und magische Ziele. Widerstandsproben werden mit Willenskraft abgelegt. Todeshand erfordert die Berührung des Ziels. Manablitz trifft ein einzelnes Ziel. Manaball ist ein Flächenzauber.
spell.manabolt.desc                 = Todeshand, Manablitz und Manaball kanalisieren destruktive magische Energie in ein Ziel und verursachen Körperlichen Schaden, indem sie die Zellen des Körpers des Ziels (oder die "Manastruktur" astral aktiver Wesen) zerstören. Da es sich um Manazauber handelt, wirken diese Zauber nur gegen lebende und magische Ziele. Widerstandsproben werden mit Willenskraft abgelegt. Todeshand erfordert die Berührung des Ziels. Manablitz trifft ein einzelnes Ziel. Manaball ist ein Flächenzauber.
spell.mask.desc                     = Dieser Zauber erfordert die Berührung des Ziels. Das Ziel nimmt eine andere körperliche Erscheinungsform (mit der gleichen grundsätzlichen Größe und Form wie die eigene Gestalt) nach Wahl des Zauberers an. Der Zauber kann auch die Stimme, den Geruch und andere körperliche Merkmale des Ziels verändern. Wer diese Illusion durchschauen will, muss zuerst erfolgreich dem Zauber widerstehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der dem Zauber später widerstehen möchte. Maske beeinflusst den Geist der Betrachter. Physische Maske erschafft eine Illusion, die auch gegen technologische Sensoren wirkt.
spell.mass_animate.desc             = Dieser Zauber sorgt dafür, dass sich unbelebte Gegenstände bewegen. Der Gegenstand bewegt sich so, wie es zu ihm passt (Bälle können rollen, Teppiche könnten kriechen, humanoide Statuen können gehen usw.). Der Zauber sorgt für eine eingeschränkte Beweglichkeit, wodurch zum Beispiel Statuen dahinwatscheln können, als hätten sie Gelenke. Der Gegenstand widersteht dem Zauber mit seinem Objektwiderstand (S. 290). Schwerere Gegenstände (ab 200 Kilogramm Masse) haben einen höheren Widerstand (+2 pro vollen 200 Kilogramm). Das Steuern eines Gegenstandes benötigt eine Einfache Handlung. Man kann dem Gegenstand auch befehlen, sich in der gleichen Richtung weiterzubewegen, während man sich auf etwas anderes konzentriert. Der Zauberer hat nur eine ungefähre Kontrolle über die Bewegung des Gegenstands und kann keine Teile davon (wie etwa den Arm einer Statue) separat bewegen (feinere Manipulationen erfordern einen Zauber wie etwa Zauberfinger, S. 290). Die maximale Bewegungsrate der Gegenstände beträgt (Kraftstufe) Meter pro Kampfrunde, wobei der Spielleiter das letzte Wort über die tatsächlich erreichbare Geschwindigkeit hat. Wenn der Gegenstand von jemandem festgehalten wird, muss der Zauberer bei einer Vergleichenden Probe auf Kraftstufe x 2 gegen Konstitution + Stärke des Gegners gewinnen, um den Gegenstand freizubekommen. Wenn der Gegenstand befestigt ist, legt der Spielleiter einen Schwellenwert für die Probe mit Kraftstufe x 2 fest. Belebung beeinflusst ein einzelnes, lebloses Objekt. Massenbelebung ist ein Flächenzauber, der mehrere Objekte (wie etwa die Reinigungsgeräte in einer Besenkammer) gleichzeitig bewegen kann.
spell.massagony.desc                = Schmerz ruft die Illusion heftiger Schmerzen hervor und ist bei Zauberern, die in der Klemme stecken, sehr beliebt. Jeder Nettoerfolg, den der Zauberer erzielt, fügt dem Ziel temporär 1 Kästchen Körperlichen und 1 Kästchen Geistigen Schaden zu. Dabei handelt es sich allerdings nicht um wirklichen Schaden, nur um eine Messgröße für die Wirkung des Zaubers. Das Ziel erleidet alle Auswirkungen, inklusive Verletzungsmodi fikatoren, die durch Schaden in der gleichen Höhe hervorgerufen würden. Wenn die Schadenskästchen des Ziels dadurch vollständig gefüllt werden, windet es sich vor Schmerzen und ist unfähig, sich zu bewegen oder zu handeln. Wenn der Zauber endet, endet auch der Schmerz sofort, und die vermeintlichen Schadenskästchen verschwinden. Schmerz trifft ein einzelnes Ziel. Massenschmerz ist ein Flächenzauber.
spell.massconfusion.desc            = Diese Zauber erzeugen einen Sturm von widersprüchlichen Sinneseindrücken, die die Opfer völlig durcheinanderbringen. Pro Nettoerfolg bei der Spruchzaubereiprobe erleidet das Ziel wegen der Ablenkung einen Würfelpoolmodifikator von -1 auf alle Proben. Verwirrung trifft ein einzelnes Ziel. Massenverwirrung ist ein Flächenzauber. Chaos ist die physische Version von Verwirrung, wirkt also auch gegen technologische Systeme und Sichtgeräte. Chaotische Welt ist die Flächenvariante von Chaos.
spell.mind_probe.desc               = Dieser Zauber erlaubt es dem Ziel, den Geist einer Person (die beim Wirken des Zaubers ausgewählt wird) innerhalb der Sinnesreichweite zu durchforsten. Das Opfer ist sich dieses Eindringens bewusst, kennt aber nicht unbedingt die Quelle des Zaubers. Die Anzahl der Nettoerfolge bei der Spruchzaubereiprobe gibt an, welche Art von Informationen das Ziel erhalten kann (s. Tabelle Geistessonde). Das Ziel kann, solange der Zauber aufrechterhalten wird, pro Komplexer Handlung nach einer Information suchen. Ein erneuter Einsatz der Geistessonde gegen dasselbe Opfer vor Ablauf einer Anzahl von Stunden gleich der Willenskraft des Opfers führt zu einem kumulativen Würfelpoolmodifikator von -2 auf die Spruchzaubereiprobe.
spell.mindlink.desc                 = Telepathie erlaubt dem Zauberer und einem freiwilligen Ziel, mental miteinander zu kommunizieren und dabei Worte, Emotionen und geistige Bilder auszutauschen. Ein Erfolg bei der Spruchzaubereiprobe genügt, um die Verbindung herzustellen. Da das Ziel freiwillig mitmachen muss, wird die Spruchzaubereiprobe als normale Erfolgsprobe abgewickelt. Das Ziel muss innerhalb der Sinnesreichweite bleiben, damit die Verbindung funktioniert.
spell.mob_control.desc              = Der Zauberer kann das Ziel des Zaubers steuern, als wäre es eine Marionette. Das Bewusstsein des Ziels bleibt unbeeinträchtigt, aber der Zauberer steuert den Körper des Ziels. Wenn er das Ziel zu Handlungen zwingt, muss er dafür seine eigenen Fertigkeiten einsetzen. Um ein Ziel eine Handlung ausführen zu lassen, ist eine Komplexe Handlung erforderlich. Handlungen Beherrschen wirkt nur gegen ein einzelnes lebendes Ziel. Mob-Kontrolle wirkt gegen alle lebenden Ziele im Wirkungsbereich. Die Opfer der Mob-Kontrolle können einzeln (jeweils mit einer Komplexen Handlung) gesteuert werden oder als Gruppe alle dieselbe Handlung ausführen(- mit einer einzelnen Komplexen Handlung).Der Zauberer kann das Ziel des Zaubers steuern, als wäre es eine Marionette. Das Bewusstsein des Ziels bleibt unbeeinträchtigt, aber der Zauberer steuert den Körper des Ziels. Wenn er das Ziel zu Handlungen zwingt, muss er dafür seine eigenen Fertigkeiten einsetzen. Um ein Ziel eine Handlung ausführen zu lassen, ist eine Komplexe Handlung erforderlich. Handlungen Beherrschen wirkt nur gegen ein einzelnes lebendes Ziel. Mob-Kontrolle wirkt gegen alle lebenden Ziele im Wirkungsbereich. Die Opfer der Mob-Kontrolle können einzeln (jeweils mit einer Komplexen Handlung) gesteuert werden oder als Gruppe alle dieselbe Handlung ausführen(- mit einer einzelnen Komplexen Handlung).Mobe-
spell.mob_mind.desc                 = Der Zauberer übernimmt die Kontrolle über den Geist des Ziels und gibt diesem vor, was es denken soll. Der Zauberer gibt mentale Befehle als Einfache Handlung, und das Ziel muss diesen folgen, als wären sie seine eigenen Ideen. Gedanken Beherrschen wirkt nur gegen ein einzelnes lebendes Ziel. Mob-Bewusstsein wirkt gegen alle lebenden Ziele im Wirkungsbereich. Die Opfer des Mob-Bewusstseins können einzeln (jeweils mit einer Einfache Handlung) gesteuert werden oder als Gruppe alle denselben Befehl erhalten (mit einer einzelnen Einfache Handlung).
spell.oxygenate.desc                = Dieser Zauber reichert das Blut eines freiwilligen Ziels mit Sauerstoff an. Dadurch erhält es pro Erfolg bei der Spruchzaubereiprobe +1 auf die Konstitution zum Widerstand gegen Ersticken, Erwürgen, die Auswirkungen von eingeatmeten Gasen oder andere Auswirkungen von Sauerstoffmangel. Außerdem erlaubt der Zauber dem Ziel, unter Wasser zu atmen.
spell.phantasm.desc                 = Diese Flächenzauber rufen überzeugende Illusionen von Gegenständen, Kreaturen und Szenen hervor, die der Zauberer auswählt. Er kann Illusionen von allem erzeugen, was er schon mal gesehen hat - von einer Blume über einen Credstick bis hin zu einem feuerspeienden Drachen -, solange die Illusion nicht größer ist als der Wirkungsbereich des Zaubers. Wer die Illusion durchschauen will, muss dem Zauber erfolgreich widerstehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der dem Zauber später widerstehen möchte. Trugbild wirkt nur gegen lebende Betrachter, Trideo-Trugbild auch gegen technologische Sensoren.
spell.physical_barrier.desc         = Dieser Zauber erschafft ein durchsichtiges, leuchtendes Kraftfeld mit je 1 Punkt Panzerungs- und Strukturstufe pro Erfolg bei der Spruchzaubereiprobe. Die Barriere kann als Halbkugel mit einem Radius gleich dem normalen Radius der Flächenwirkung erschaffen werden, oder aber als Wand mit einer Höhe gleich der Kraftstufe und einer Länge gleich der Kraftstufe x 2. Eine Physische Barriere erschafft eine feste Wand. Alles bis zur Größe eines Moleküls (also auch Luft und andere Gase) kann hindurch. Alles, was größer ist, trifft auf die Barriere wie auf eine normale Wand. Die Wand ist durchsichtig, schimmert aber leicht, was einen Malus wie bei Leichtem Nebel (S. 176) hervorruft. Die Barriere behindert Spruchzauberei nicht (wenn man von dem Sichtmodifikator absieht), es sei denn, es handelt sich um Zauber mit physischen Komponenten (wie etwa indirekte Kampfzauber). Die Barriere kann durch physische Angriffe zerstört werden, regeneriert aber, solange sie aufrechterhalten wird, zu Beginn jeder Kampfrunde ihre gesamte Strukturstufe. Wenn die Strukturstufe der Barriere auf 0 gesenkt wird, bricht sie zusammen, und der Zauber endet.
spell.physicalmask.desc             = Dieser Zauber erfordert die Berührung des Ziels. Das Ziel nimmt eine andere körperliche Erscheinungsform (mit der gleichen grundsätzlichen Größe und Form wie die eigene Gestalt) nach Wahl des Zauberers an. Der Zauber kann auch die Stimme, den Geruch und andere körperliche Merkmale des Ziels verändern. Wer diese Illusion durchschauen will, muss zuerst erfolgreich dem Zauber widerstehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der dem Zauber später widerstehen möchte. Maske beeinflusst den Geist der Betrachter. Physische Maske erschafft eine Illusion, die auch gegen technologische Sensoren wirkt.
spell.poltergeist.desc              = Dieser Zauber nimmt alle kleinen Objekte (bis zu einem Kilogramm Masse) innerhalb des Wirkungsbereichs auf und wirbelt sie in zufälligen Mustern durch die Luft. Dadurch entsteht eine Sichtbehinderung wie bei Leichtem Nebel (S. 176). Jede Person innerhalb des Bereichs wird von dem fliegenden Gerümpel getroffen und erleidet in jeder Kampfrunde 2 Kästchen Geistigen Schaden, dem mit Konstitution + Panzerung widerstanden wird. In besonders vollgerümpelten Bereichen kann mehr Schaden verursacht werden, und es kann auch zu Körperlichem Schaden kommen, wenn der Spielleiter die herumfliegenden Gegenstände für hinreichend gefährlich hält (wie Nägel oder Glasscherben). Wenn keine Gegenstände herumliegen, erzeugt der Zauber nur gespenstische Geräusche.
spell.powerball.desc                = Diese Zauber kanalisieren destruktive magische Energie in ihre Ziele und verursachen Körperlichen Schaden. Das Ziel wird von innen heraus gekocht wie ein Würstchen in der Mikrowelle. Weil es sich um physische Energie handelt, wirkt der Zauber sowohl gegen lebende als auch unbelebte Ziele. Die Widerstandsprobe wird mit Konstitution abgelegt. Energieschlag erfordert die Berührung des Ziels. Energieblitz trifft ein einzelnes Ziel. Energieball ist ein Flächenzauber.
spell.powerbolt.desc                = Diese Zauber kanalisieren destruktive magische Energie in ihre Ziele und verursachen Körperlichen Schaden. Das Ziel wird von innen heraus gekocht wie ein Würstchen in der Mikrowelle. Weil es sich um physische Energie handelt, wirkt der Zauber sowohl gegen lebende als auch unbelebte Ziele. Die Widerstandsprobe wird mit Konstitution abgelegt. Energieschlag erfordert die Berührung des Ziels. Energieblitz trifft ein einzelnes Ziel. Energieball ist ein Flächenzauber.
spell.prophylaxis.desc              = Dieser Zauber verleiht dem Ziel pro Erfolg bei der Spruchzaubereiprobe 1 zusätzlichen Würfel für den Widerstand gegen Infektionen, Drogen und Toxine. Der Zauber unterscheidet nicht zwischen schädlichen und nützlichen Substanzen, also widersteht das Ziel auch Medikamenten und anderen hilfreichen Drogen. Die Boni durch hilfreiche Drogen werden pro Erfolg bei der Spruchzaubereiprobe um 1 reduziert. Drei oder mehr Erfolge negieren alle Effekte, die keinen Bonus oder Malus bringen.
spell.punch.desc                    = Diese Zauber treffen ihr(e) Ziel(e) mit einer unsichtbaren psychokinetischen Macht - wie ein Faustschlag, der Geistigen Schaden verursacht. Schlag erfordert die Berührung des Ziels. Stoß trifft ein einzelnes Ziel. Druckwelle ist ein Flächenzauber.
spell.resist_pain.desc              = Schmerzresistenz erlaubt dem Ziel, Schmerzen durch Verletzungen zu ignorieren, was die Verletzungsmodifikatoren durch Körperlichen und Geistigen Schaden reduziert. Jeder Erfolg bei der Spruchzaubereiprobe lässt das Ziel bei der Berechnung von Verletzungsmodi\u001F katoren jeweils ein Kästchen Schaden auf beiden Zustandsmonitoren ignorieren. Der Zauber entfernt nicht den Schaden selbst; nur die Verletzungsmodifikatoren werden gesenkt. Wenn alle Kästchen eines Zustandsmonitors voll sind, wird das Ziel immer noch bewusstlos. Der Zauber ist insofern permanent, als die Erhöhung der Endorphinkonzentration im Körper des Ziels nicht vergeht. Wenn das Ziel so viel Schaden erleidet, dass die ignorierten Kästchen überschritten werden, oder wenn die Verletzungen geheilt werden, endet die Wirkung des Zaubers. Eine Person kann nur unter dem Ein\u001E uss eines einzelnen Zaubers Schmerzresistenz gleichzeitig stehen (dessen mit den meisten Erfolgen, wenn mehrere gewirkt wurden).
spell.shadow.desc                   = Schatten erzeugt eine Kugel aus Dunkelheit mit einem Radius gleich der Kraftstufe des Zaubers in Metern. Der Beleuchtungsmalus (S. 176) steigt pro zwei Erfolge um eine Kategorie: 2 Erfolge für Teilbeleuchtung, 4 Erfolge für Schwache Beleuchtung und 6 Erfolge für Völlige Dunkelheit. Dieser Zauber kann nicht mehr als Völlige Dunkelheit hervorrufen.
spell.shatter.desc                  = Diese Zauber kanalisieren destruktive magische Energie in ihre Ziele und verursachen Körperlichen Schaden. Das Ziel wird von innen heraus gekocht wie ein Würstchen in der Mikrowelle. Weil es sich um physische Energie handelt, wirkt der Zauber sowohl gegen lebende als auch unbelebte Ziele. Die Widerstandsprobe wird mit Konstitution abgelegt. Energieschlag erfordert die Berührung des Ziels. Energieblitz trifft ein einzelnes Ziel. Energieball ist ein Flächenzauber.
spell.silence.desc                  = Diese Zauber erzeugen ein Feld, in dem Geräusche gedämpft werden. Schallangriffe aus dem Feld heraus oder in es hinein (auch von Critterkräften wie Lähmendes Heulen) werden pro Erfolg bei der Spruchzaubereiprobe um 1 reduziert. Wer versucht, Geräusche aus oder von hinter dem Feld wahrzunehmen, muss dem Zauber zuerst widerstehen. Schweigen ist ein Manazauber und wirkt daher nur gegen Lebewesen und magische Schallangriffe oder Critterkräfte. Stille ist ein physischer Zauber und wirkt daher auch gegen technologische Geräte. Er ist nützlich für das Stören von Alarmen, \u00DCberwachungsgeräten, Sonar und Kommunikation und kann auch technologische Schallwaffen beeinträchtigen.
spell.stabilize.desc                = Dieser Zauber kann ein Ziel mit vollem Körperlichem Schadensmonitorstabilisieren und verhindern, dass es stirbt. Die Kraftstufe des Zaubers muss mindestens so hoch sein wie der bereits vorhandene \u00DCberschüssige Schaden, wenn der Zauber beginnt. Erst wenn die Zauberwirkung permanent ist, ist das Ziel wirklich stabilisiert. Erfolge reduzieren die dafür benötigte Zeit um 1 Kampfrunde pro Erfolg. Wenn der Zauber erfolgreich ist, wird das Ziel stabilisiert und erleidet keinen weiteren \u00DCberschüssigen Schaden (siehe S. 207).
spell.stealth.desc                  = Leiser Schritt macht ein Ziel durch normales oder verstärktes Gehör schwerer wahrnehmbar. Das Ziel bewegt sich leise, bis zur Geräuschlosigkeit. Dinge, die nicht direkt vom Ziel berührt werden, können normale Geräusche machen. Wenn also ein Charakter unter diesem Zauber steht und an die Tür klopft, verursacht er kein Geräusch. Wenn er die Tür eintritt, wird diese beim Aufprall auf dem Boden ganz normal Lärm machen. Jeder, der das Ziel potenziell hören könnte, muss zuerst dem Zauber widerstehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der dem Zauber später widerstehen möchte. Selbst wenn dem Zauber widerstanden wurde, kann das Ziel unhörbar bleiben, wenn es eine genügend erfolgreiche Schleichenprobe ablegt.
spell.stunball.desc                 = Diese Zauber kanalisieren magische Energie direkt in ihr Ziel und verursachen Geistigen Schaden. Sie werden manchmal als "Schlafzauber" bezeichnet, weil sie Ziele bewusstlos machen können, ohne sie zu töten, falls man mal höflichere Gewalt bevorzugt. Schockhand erfordert die Berührung des Ziels. Betäubungsblitz trifft ein einzelnes Ziel. Betäubungsball ist ein Flächenzauber.
spell.stunbolt.desc                 = Diese Zauber kanalisieren magische Energie direkt in ihr Ziel und verursachen Geistigen Schaden. Sie werden manchmal als "Schlafzauber" bezeichnet, weil sie Ziele bewusstlos machen können, ohne sie zu töten, falls man mal höflichere Gewalt bevorzugt. Schockhand erfordert die Berührung des Ziels. Betäubungsblitz trifft ein einzelnes Ziel. Betäubungsball ist ein Flächenzauber.
spell.swarm.desc                    = Diese Zauber lassen die Opfer glauben, dass auf ihrem ganzen Körper Insekten herumkrabbeln, sie beißen und in verschiedene Körperöffnungen kriechen. Die Insekten sehen real aus, hören sich real an, riechen und schmecken sogar real. Die Illusion ist häufig genug ausreichend, dass jedes Ziel, das dem Zauber nicht widersteht, panisch wird. Jeder Nettoerfolg bei der Spruchzaubereiprobe senkt das Initiativeergebnis des Opfers um 2. Wenn der Zauber aufrechterhalten wird, findet diese Reduktion des Initiativeergebnisses zu Beginn jeder Kampfrunde statt. Verlorene Punkte vom Initiativeergebnis werden nicht zurückgewonnen, wenn der Zauber endet. Viecher trifft ein einzelnes Ziel. Schwarm ist ein Flächenzauber.
spell.toxicwave.desc                = Diese Zauber erzeugen eine stark ätzende Flüssigkeit, die auf das Ziel spritzt, schreckliche Verbrennungen verursacht und organisches Material und Metall zersetzt. Behandeln Sie dies als Säureschaden (S. 175), mit entsprechenden Auswirkungen auf den beein\u001E ussten Bereich und darin befindliche Gegenstände. Die Säure löst sich schnell auf, aber der angerichtete Schaden bleibt. Säurestrahl trifft ein Ziel, Säurewelle ist ein Flächenzauber.
spell.tridentertainment.desc        = Diese Flächenzauber erzeugen offensichtliche, aber unterhaltsame Illusionen. Die Erfolge bei der Spruchzaubereiprobe geben an, wie detailliert, interessant oder fesselnd das Publikum die Illusion findet. Der Zauberer kann fast alles hervorrufen, was er sich vorstellen kann, oder etwas reproduzieren, das er erlebt hat. Unterhaltung beeinflusst den Geist der Ziele und kann nicht von technologischen Sensoren entdeckt werden. Trideo-Unterhaltung ist ein physischer Zauber und kann von lebenden und unbelebten Zielen wahrgenommen werden. Diese Zauber dienen sowohl der Unterhaltung als auch künstlerischen Zwecken. Die Unterhaltungsindustrie sieht Illusionisten buchstäblich als Spezialeffekt-Zauberer. Magische Designer und Künstler erfinnden ständig neue und interessante Illusionen, die meist weit über das hinausgehen, was in der wirklichen Welt erfahrbar wäre. Nur die Reichen können es sich leisten, diese Darbietungen live mitzuerleben.
spell.tridphantasm.desc             = Diese Flächenzauber rufen überzeugende Illusionen von Gegenständen, Kreaturen und Szenen hervor, die der Zauberer auswählt. Er kann Illusionen von allem erzeugen, was er schon mal gesehen hat - von einer Blume über einen Credstick bis hin zu einem feuerspeienden Drachen -, solange die Illusion nicht größer ist als der Wirkungsbereich des Zaubers. Wer die Illusion durchschauen will, muss dem Zauber erfolgreich widerstehen. Die Erfolge bei der Spruchzaubereiprobe dienen als Schwellenwert für jeden, der dem Zauber später widerstehen möchte. Trugbild wirkt nur gegen lebende Betrachter, Trideo-Trugbild auch gegen technologische Sensoren.

spirit.spirit_of_air.desc     = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303
spirit.spirit_of_earth.desc   = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303
spirit.spirit_of_beasts.desc  = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303
spirit.spirit_of_fire.desc    = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303
spirit.spirit_of_man.desc     = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303
spirit.spirit_of_water.desc   = Geister sind Bewohner der Metaebenen. Man begegnet ihnen normalerweise nur, wenn sie beschworen werden, aber es gibt auch viele Freie Geister, die ungebunden auf der physischen Ebene leben.\nSiehe auch GRW 303

tradition.hermetic.desc = Hermetische Magier verlassen sich auf Logik, Training und das Vollziehen geplanter Abläufe. Intuition und Improvisation haben bei ihrer Art des Zauberns wenig zu suchen. Sie haben gelernt, die Magie zu lenken, und glauben, dass das Universum \u2013 sowohl die magischen als auch die mundanen Teile \u2013 von Energieströmen durchfl ossen wird, die man mit komplexen Symbolen, Formeln und arkanem Wissen manipulieren kann. Diese Tradition war auch schon vor dem Erwachen weit verbreitet (wenn auch ineffektiv). Ihre Abläufe und Zugänge übten wegen ihres formalisierten und intellektuellen Wesens schon früh Anziehungskraft auf Konzerne und Regierungen aus. Im hermetischen Denken wird das Wirken von Zaubern dadurch möglich, dass der Magier dem Universum seinen Willen aufzwingt. Dementsprechend ausgeprägt ist auch das Ego mancher Hermetiker. Hermetiker sind Gelehrte und haben oft ganze Bibliotheken voller magischer Informationen, aus denen sie Zauber entwickeln.
tradition.shaman.desc   = Schamanen finden mithilfe von Mana eine Balance zwischen der Natur und ihrem eigenen Willen. Sie glauben an Harmonie und Bestimmung, betrachten die Welt und wirken ihre Magie durch Emotion. Sie respektieren die Gabe der Magie, die sie mit dem Fluss des Lebensgeistes verbindet. Für Schamanen ist die Erde ein lebendes Wesen, und ihre Kinder sind Geister, die jenen Hilfe und Führung zukommen lassen, die sie unterstützen. Es sind die Geister des Himmels, der Berge, Vögel, Ratten und sogar Metamenschen. Schamanismus gibt es schon viel länger als Hermetik, und er ist auf der ganzen Welt verbreitet. Dennoch wurde er bis zum Großen Geistertanz von der Welt nicht ernst genommen. Für Schamanen ist das Wirken von Zaubern ein Bitten um Kraft bei einer mächtigen Entität, wie etwa einem Schutzgeist.\nSchamanen\ nennen\ ihre\ Refugien\ u201EMedizinhüttenu201C.\ Medizinhütten\ (auch\ als\ Schwitzhütte,\ Inipi,\ Kiva,\ Temazcal\ und\ unter\ noch\ anderen\ Namen\ bekannt)\ können\ verschiedene\ Formen\ annehmen = von einer kleinen Hütte, die mit Tierhäuten gedeckt ist, über ein Loch in der Erde, das sorgsam mit \u00C4sten bedeckt ist, bis hin zu einem kleinen Zimmer in der Stadt, das voll mit Fellen, Gemälden und künstlerisch wertvollem Müll ist.

metamagic.adept_centering.desc=Mit der Adeptenzentrierung kann ein Adept negative Würfelpoolmodifikatoren (wie zum Beispiel Umweltmodifi katoren) bei Proben mit Körperlichen oder Kampffertigkeiten verringern, indem er gleichzeitig eine bestimmte mundane Handlung durchführt. Diese Handlung ist etwas, das der Adept durchführt, um sich besser auf sein Tun zu konzentrieren (er zentriert sich also). Beispiele sind Gesänge oder Schreie \u2013 es kann eine beliebige Handlung sein, solange sie auffällig ist. Der Adept kann, solange er seine bevorzugte Methode des Zentrierens ausführen kann, negative Würfelpoolmodifi katoren um seinen Initiatengrad verringern. Die Zentrierung erfordert eine Freie Handlung während der Handlungsphase des Adepten.
metamagic.centering.desc=Ein Zauberer, der die Zentrierung beherrscht, kann Entzug besser widerstehen. Indem er eine mundane Handlung durchführt, die zu seiner Tradition passt, seinen Geist beruhigt und Störungen ausblendet, erhält er zu allen Entzugswiderstandsproben einen Würfelpoolbonus in Höhe seines Initiatengrads. Zentrieren ist eine Freie Handlung. Die genaue Technik ist etwas, das der Zauberer selbst auswählt (und natürlich zu seiner Tradition passen muss). Das können lateinische Sprechgesänge, das Spielen eines Instruments, Tanz, Gesang, geheimnisvolle Gesten, das Anrufen uralter Götter oder Ähnliches sein \u2013 Hauptsache, es ist auffällig.\nWenn der Zauberer am Durchführen seiner Zentrierungstechnik gehindert wird, kann er Zentrierung nicht einsetzen.
metamagic.fixation.desc=Der Zauberer lässt Karma in ein Alchemisches Erzeugnis fl ießen, um es länger haltbar zu machen. Wenn er das Erzeugnis herstellt, kann er zwischen 1 Karma und Karma in Höhe der Kraftstufe des Erzeugnisses ausgeben. Wenn die Wirksamkeit des Erzeugnisses zu schwinden beginnt, verliert es 1 Stufe Wirksamkeit pro Tag statt pro Stunde. Außerdem erhält das Erzeugnis beim Widerstand gegen das Trennen (S.307) einen Bonus in Höhe des Karmas, das der Zauberer dafür ausgegeben hat.
metamagic.flexible_signature.desc=Der Charakter kann seine astrale Signatur (S. 311) nach Belieben ändern. Er kann sie so verändern, dass sie nicht zu seiner Identifi zierung taugt, die astrale Signatur eines anderen Zauberers, den er askennt hat, vortäuschen, oder einfach das Verschwinden seiner astralen Signatur beschleunigen. Wenn jemand versucht, die verfälschte Signatur zu askennen, steigt der Schwellenwert dafür um den Initiatengrad des Charakters. Wenn also ein Initiat des 2. Grades eine verfälschte Signatur hinterlässt, könnte ein anderer Zauberer diese mit 3 Erfolgen wie üblich askennen, aber erst mit 5 Erfolgen die Wahrheit hinter der Fälschung sehen. Man kann nur astrale Signaturen nachahmen, die man selbst askennt hat, und der Spielleiter kann dafür eine Erinnerungsprobe verlangen. \nMan kann auch die Haltbarkeit seiner astralen Signatur um seinen Initiatengrad in Stunden verringern. Ein Initiat des 2. Grades kann also bei allen Wirkungen mit Kraftstufe 2 oder weniger gar keine Signatur hinterlassen, und die Signatur auf einer Wirkung mit Kraftstufe 5 würde nur 3 Stunden lang halten.
metamagic.masking.desc=Der Charakter lernt, das Aussehen seiner Aura und seiner astralen Gestalt zu verändern. Er kann sie mundan aussehen lassen \u2013 oder so, als sei sein Magieattribut um bis zu seinen Initiatengrad höher oder niedriger als in Wirklichkeit.\nWenn jemand versucht, die maskierte Aura des Charakters zu askennen, wird die Askennenprobe eine Vergleichende Probe gegen seine Magie + Initiatengrad. Wenn der Gegner Nettoerfolge erzielt, sieht er sowohl die Maskierung als auch die echte Aura des Charakters. Wenn der Charakter astral wahrnehmen kann, kann er seine Aura sogar als etwas anderes (die eines Geistes oder Fokus) aussehen lassen, was sich auf astralen Kostümpartys immer gut macht. Der Charakter kann mit dieser Metamagie auch eine Anzahl von gebundenen Foki bis zu seinem Initiatengrad maskieren.
metamagic.power_points.desc=Ein Adept kann statt einer metamagischen Fähigkeit einen Kraftpunkt erhalten. Er kann das jedes Mal machen, wenn er einen neuen Initiatengrad erreicht.
metamagic.quickening.desc=Der Charakter kann einen aufrechterhaltenen Zauber in eine Art Schleife zwingen, sodass dieser sich selbst ohne sein Zutun aufrechterhält. Um einen Zauber zu intensivieren, muss der Charakter eine Komplexe Handlung aufwenden und Karma ausgeben, während er den Zauber aufrechterhält. Er kann zwischen 1 Karma und der Kraftstufe des Zaubers in Karma ausgeben. Der Zauber erhält gegen Versuche, ihn zu bannen (siehe S. 294), einen Würfelpoolbonus in Höhe des Karmas, das der Charakter für ihn ausgegeben hat.
metamagic.spell_shapening.desc=Der Charakter kann seine Flächenzauber umformen, wodurch sie allerdings schwerer zu wirken sind. Für einen Würfelpoolmodifi kator von jeweils -1 auf die Spruchzaubereiprobe kann der Zauberer den Wirkungsradius des Zaubers um 1 Meter vergrößern, um 1 Meter verringern oder eine kugelförmige \u201EBlase\u201C von 1 Meter Radius innerhalb des Wirkungsbereichs erschaffen, die nicht von der Zauberwirkung betroffen ist. Der Einsatz dieser Metamagie muss beim Wirken des Flächenzaubers angesagt werden. Der Charakter darf keinen höheren Malus in Kauf nehmen, als sein Magieattribut beträgt.
metamagic.shielding.desc=Ein Charakter mit der Metamagie Abschirmung kann sich und andere besser gegen feindliche Zauber schützen. Wenn der Zauberer Zauberabwehr ansagt, kann er dafür zusätzliche Würfel in Höhe seines Initiatengrads verwenden. Diese Zusatzwürfel sind nicht für andere Arten der Antimagie, wie das Bannen, nutzbar.

echo.attack_upgrade.desc=Das Attribut Angriff der Lebenden Persona des Technomancers steigt um 1. Dieses Echo darf zweimal gewählt werden.
echo.data_processing_upgrade.desc=Das Attribut Datenverarbeitung der Lebenden Persona des Technomancers steigt um 1. Dieses Echo darf zweimal gewählt werden.
echo.firewall_upgrade.desc=Das Attribut Firewall der Lebenden Persona des Technomancers steigt um 1. Dieses Echo darf zweimal gewählt werden.
echo.mind_over_machine.desc=Der Technomancer erhält die Vorteile einer Riggerkontrolle der Stufe 1. Er kann dieses Echo insgesamt dreimal wählen, was bis zu einer \u201ERiggerkontrolle\u201C der Stufe 3 führen kann.
echo.neurofilter.desc=Der Technomancer erhält einen Würfelpoolbonus von +1 zum Widerstand gegen Schaden durch Biofeedback. Dieses Echo darf zweimal gewählt werden.
echo.overclocking.desc=Der Technomancer beschleunigt seine Lebende Persona, damit er in der Matrix schneller handeln kann. Er erhält für die VR mit heißem Sim einen zusätzlichen W6 für Initiative.
echo.resonance_link.desc=Dieses Echo erlaubt dem Technomancer, mit einem anderen, ausgewählten Technomancer seiner Wahl eine empathische Einweg-Verbindung aufzubauen. Solange er verbunden ist, kann er die Stimmung und Emotionen des anderen erkennen. Er weiß, wenn dieser angegriffen wird oder unter Stress steht, Schmerz empfi ndet oder in Gefahr ist. Diese Verbindung wirkt nur in der Richtung des Technomancers (sein Partner erfährt nichts über ihn). Wenn beide dieses Echo füreinander auswählen, ist aber eine Verbindung in beide Richtungen möglich.
echo.resonance_program.desc=Dieses Echo erlaubt es, die Wirkung eines Standard- oder Hackingprogramms (siehe S. 242) nachzuahmen. Jedes Mal, wenn der Technomancer dieses Echo wählt, muss er ein Programm zur Nachahmung auswählen. Er kann dieses Echo mehrmals, jeweils für ein Programm, erwerben.
echo.sleaze_upgrade.desc=Das Attribut Schleicher der Lebenden Persona des Technomancers steigt um 1. Dieses Echo darf zweimal gewählt werden.
