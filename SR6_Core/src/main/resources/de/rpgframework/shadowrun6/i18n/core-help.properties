item.cybergliedverstaerkungGeschicklichkeit.desc=Cybergliedverstärkungen erhöhen Stärke oder Geschicklichkeit eines Cyberglieds(\!) oder gewähren einen Panzerungsbonus in Höhe ihrer Stufe (der kumulativ mit sonstiger Panzerung ist, ohne sich auf die Belastung auszuwirken).\nJede Gliedmaße kann nur eine Verstärkung von jeder Art haben (man kann nicht im selben Cybergleid zweimal die Stärke um 3 erhöhen), aber man kann eine Verstärkung durch eine andere ersetzen, die man haben will.
item.cybertorso,Offensichtlich.desc=Offensichtliche Cybergliedmaße sind sofort als künstlich erkennbar, solange sie nicht von Kleidung bedeckt sind. Sie sind häufig verchromt oder in matten Farben gehalten, aber offensichtlich mechanisch. Einige Leute mögen sie so offensichtlich und ausgefallen wie möglich, andere finden die Künstlichkeit abstoßend und verstörend. In einigen Kreisen können sie die sozialen Beziehungen beeinflussen, besonders in den höheren Kreisen des Gesellschaft und bei Puristen.
