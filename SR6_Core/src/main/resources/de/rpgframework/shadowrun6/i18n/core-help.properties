item.schockhandEinbauCybergliedmasse.desc=Cyberimplantatwaffen sind beliebt bei den Bewohnern urbaner Ödlande wie der der Barrens und bei Straßensamurais, die nirgendwohin unbewaffnet hingehen wollen.\nSeit mittlerweile einem Vierteljahrhundert sind Cyber-Nahkampfwaffen das klassische Lieblingsspielzeug der Messerklauen, vom Straßenschläger bis hin zum professionellen Straßensamurai. Sie können per Muskelbewegung, neuralem Impuls oder WiFi-Signal ausgelöst werden. \nEine Schockhand ist wie ein Schockhandschuh, der in die Handfläche eingebaut ist \u2013 perfekt, um allem einen fiesen Schlag zu versetzen, das damit in Berührung kommt. Eine Schockhand verursacht Elektrizitätsschaden (GRW S. 173) und hat zehn Ladungen. Wenn sie an eine Stromquelle angeschlossen wird, lädt sie sich mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden wieder auf.
