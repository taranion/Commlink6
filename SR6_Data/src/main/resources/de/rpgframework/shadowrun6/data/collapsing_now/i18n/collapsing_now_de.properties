adeptpower.improved_mental_attribute.desc=Lege beim Erwerb dieser Kraft ein Geistiges Attribut (Willenskraft, Logik, Intuition oder Charisma) fest. Dieses Attribut erhält eine permanente Steigerung in Höhe der Stufe dieser Kraft. Das Attribut kann maximal auf das 1,5-Fache (aufgerundet) der gegenwärtigen Stufe oder um +4 erhöht werden (je nachdem, was niedriger ist).
