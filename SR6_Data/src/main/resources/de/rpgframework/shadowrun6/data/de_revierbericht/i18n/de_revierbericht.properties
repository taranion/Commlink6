item.rabotti.desc=Verleiht den Vorteil Unauffälligkeit (SR6, S. 76) in Unterschichtvierteln und Einkaufsbezirken bis Mittelschicht. \n \n Dass Reinigungspersonal, Müllleute, Straßenkinder, Pizzalieferanten, Flyerverteiler und Bettler eine Art eingebauten Unsichtbarkeitszauber haben, ist hinlänglich bekannt. Im stark industrialisierten Pott kommt der Rabotti-Overall zur Liste urbaner Tarnkleidungen hinzu. Rabottis sind ungelernte Hilfsarbeiter, oft Tagelöhner, die hier wie anderswo dazu genutzt bzw. missbraucht werden, Bedarfsspitzen in den Fabriken abzudecken oder auch dauerhaft in sklavereiähnlichen Fesselverträgen zu schuften, bis sie zur Original Rheinischen Fleischwurst verarbeitet werden (ich übertreibe natürlich - aber mit jedem Jahr etwas weniger, scheint mir). Hilfsarbeiter erhalten zwar im Regelfall bei Einstellung einen Arbeitsoverall vom Arbeitgeber, wer aber schon fertig eingekleidet mit speckigem Overall, Jacke, schweren Arbeitsstiefeln und sogar Werkshelm an der Straßenecke steht, wird bevorzugt genommen. Jeder gesparte Cent zählt. Outfits dieser Art sind bei verschiedenen Kleiderkippen und in vielen Ausführungen erhältlich, auch gepanzert oder feuerresistent für den Einsatz am Schmelzofen. Kaufen, notfalls wieder verdrecken, und keiner schaut euch zweimal an, wenn ihr nicht gerade ins Umfeld der Kö-Klasse geht.
item.krim_ultra.desc=Schaden gilt für Stahlkugeln. Mit der Ultra Kombat können auch Minigranaten verschossen werden, die Schaden je nach ihrem Typ verursachen. Die Stufe gibt wie bei Bögen die Mindeststärke an, die man braucht, um die Waffe bedienen zu können. \n \n Seit einigen Jahren erfreuen sich Fletschen wieder wachsender Beliebtheit im Pott. Mit den wachsenden Sicherheitsvorkehrungen am Fußballstadion entdeckten zunächst Ultras ihre Liebe zu den quasi unscanbaren Schleudern aus Karbon- und Kunststoffverbindungen, um Bengalos und anderes Feuerwerk in den Fanblock des Gegners zu schießen. Das führte zu einem reichlich debilen Wettrüsten unter den Hools, bei dem auch zunehmend technisierte Zwillen zum Einsatz kamen. Der Nimbus 2000 unter den Hightech-Fletschen ist die Krime Ultra Kombat, die gezielt für Leute mit extremer Kraft (seien wir ehrlich: Orks und Trolle) entwickelt wurde. Die Ultra Kombat verfügt über Protektoren für den Unterarm und ein integriertes Smartsystem, das Entfernungen und berechnete Flugbahnen von Massivgeschossen in Echtzeit anzeigt, um perfekte Zielgenauigkeit zu bieten.
item.wirtz_sw11.desc=Kann nur Wirtz-Sondermunition verwenden, diese kostet das Dreifache der jeweiligen Munitions- bzw. Minigranatenart (s. SR6, S. 262). Angriffswerte mit Minigranaten: -/6/8/4/2 \n \n Vor über 50 Jahren führte Wirtz die legendäre SW31 "DemoControl" ein - und damit ein patentiertes Spezialkalibersystem, das bis heute das Fundament des wirtschaftlichen Erfolgs der Waffenschmiede ist. Beworben als "Allzweckwerfer", bot die SW31 die Möglichkeit, sowohl normale Munition als auch Minigranaten zu verfeuern. Die Idee war, Polizei- und Sicherheitskräften eine Vielzweck-Einsatzwaffe anzubieten, die je nach Situation mit scharfer Munition, Gummischrot oder auch Tränengas-Granaten zur Aufstandsbekämpfung geladen werden konnte. Vertriebstechnisch stand dabei von vornherein ein möglichst niedriger Anschaffungspreis der Waffe im Vordergrund: Wer auf Wirtz umgestiegen ist, hat zur Belieferung mit der Wirtz-Sondermunition keine Alternative. Im Laufe der Jahre wurde die Vielfalt verfügbarer Munitions- und Granatentypen für das Wirtz-Sonderkalibersystem so stark erweitert, dass heutzutage alle Munitions- und Granatentypen im Wirtz-Kaliber verfügbar sind (die einzige Ausnahme ist aufgrund von Lizenzstreitigkeiten APDS).
item.wirtz_sw31.desc=Kann nur Wirtz-Sondermunition verwenden, diese kostet das Dreifache der jeweiligen Munitions- bzw. Minigranatenart (s. SR6, S. 262). Angriffswerte mit Minigranaten: -/6/8/4/2 \n \n Vor über 50 Jahren führte Wirtz die legendäre SW31 "DemoControl" ein - und damit ein patentiertes Spezialkalibersystem, das bis heute das Fundament des wirtschaftlichen Erfolgs der Waffenschmiede ist. Beworben als "Allzweckwerfer", bot die SW31 die Möglichkeit, sowohl normale Munition als auch Minigranaten zu verfeuern. Die Idee war, Polizei- und Sicherheitskräften eine Vielzweck-Einsatzwaffe anzubieten, die je nach Situation mit scharfer Munition, Gummischrot oder auch Tränengas-Granaten zur Aufstandsbekämpfung geladen werden konnte. Vertriebstechnisch stand dabei von vornherein ein möglichst niedriger Anschaffungspreis der Waffe im Vordergrund: Wer auf Wirtz umgestiegen ist, hat zur Belieferung mit der Wirtz-Sondermunition keine Alternative. Im Laufe der Jahre wurde die Vielfalt verfügbarer Munitions- und Granatentypen für das Wirtz-Sonderkalibersystem so stark erweitert, dass heutzutage alle Munitions- und Granatentypen im Wirtz-Kaliber verfügbar sind (die einzige Ausnahme ist aufgrund von Lizenzstreitigkeiten APDS).
item.wirtz_sw64.desc=Kann nur Wirtz-Sondermunition verwenden, diese kostet das Dreifache der jeweiligen Munitions- bzw. Minigranatenart (s. SR6, S. 262). Angriffswerte mit Minigranaten: -/6/8/4/2. Variables Munitionssystem. \n \n Vor über 50 Jahren führte Wirtz die legendäre SW31 "DemoControl" ein - und damit ein patentiertes Spezialkalibersystem, das bis heute das Fundament des wirtschaftlichen Erfolgs der Waffenschmiede ist. Beworben als "Allzweckwerfer", bot die SW31 die Möglichkeit, sowohl normale Munition als auch Minigranaten zu verfeuern. Die Idee war, Polizei- und Sicherheitskräften eine Vielzweck-Einsatzwaffe anzubieten, die je nach Situation mit scharfer Munition, Gummischrot oder auch Tränengas-Granaten zur Aufstandsbekämpfung geladen werden konnte. Vertriebstechnisch stand dabei von vornherein ein möglichst niedriger Anschaffungspreis der Waffe im Vordergrund: Wer auf Wirtz umgestiegen ist, hat zur Belieferung mit der Wirtz-Sondermunition keine Alternative. Im Laufe der Jahre wurde die Vielfalt verfügbarer Munitions- und Granatentypen für das Wirtz-Sonderkalibersystem so stark erweitert, dass heutzutage alle Munitions- und Granatentypen im Wirtz-Kaliber verfügbar sind (die einzige Ausnahme ist aufgrund von Lizenzstreitigkeiten APDS).
item.underground_helmet.desc=Ein kompatibler Lufttank (mit Luft für 2 Stunden) ist für 600 Euro erhältlich. \n \n Ein zeitgemäßer Grubenhelm verfügt über eine Gasmaskenfunktion und kann per Knopfdruck am Hals versiegelt werden. Ein meist rechts am Kopf sitzender Stutzen kann bei Auftreten giftiger Gase mit einem hoffentlich vorhandenen externen Drucklufttank verbunden werden. Außerdem verfügt ein moderner Helm für gewöhnlich über eine Helmlampe, ein Sichtmodul mit Restlichtverstärkung sowie eine Ultraschallverbindung nebst passendem Hochleistungs-Emitter links und rechts des Gesichtsfeldes.
item.golf_gti_basic.desc=Auch außerhalb der Duellisten-Szene genießt der Golf GTI speziell unter Jugendlichen große Beliebtheit im Plex. Er ist das perfekte Single-Auto, das eine sportliche Fahrweise mit ausreichend Platz für die Kumpels am Wochenende oder den Kleinumzug innerhalb des Plexes bietet. Der absolute Trumpf freilich sind der geringe Achsstand und die damit einhergehende Wendigkeit, die dem GTI in den oft engen Straßen der Innenstädte einen entscheidenden Vorteil bietet.
item.golf_gti_duel.desc=Tiefergelegt, hochglanzpoliert, mit massiven Front- und Heckspoilern und dezent in die Karosserie integrierten Waffensystemen - die Streitwagen der Duellisten im Plex könnten kaum weiter entfernt sein von den roh zusammengeflanschten Schrottkarren der Berliner Autobahnkrieger. Ein besonderer Platz im Herzen der RRP-Duellisten gehört (neben dem BMW M8) der Golf-GTI-Reihe von Volkswagen, die mit solider Motorleistung zu relativ kleinem Preis für viele Duellisten das Einstiegsmodell in die Szene ist. Manche Autobahnkrieger bleiben ihrem GTI ein Leben lang treu und rüsten den Kleinboliden so weit auf, dass er es problemlos mit Shin-Hyung- und Westwind-Sportwagen aufnehmen kann (zumindest, sofern diese nicht ebenfalls getunt sind).
item.dassault_paynalion.desc= Zur Erschließung neuer Abnehmer stellte Dassault auf der interSEC 2080 in Berlin den Paynalion vor. Der ist zwar mit 650.000 Euro immer noch alles andere als billig, holt aber aus jedem Cent das Optimum an Volksüberwachung und exzessiver Gewalt heraus. Die Einsparung von über 50 Prozent gegenüber dem weiterhin erhältlichen Paynalton wird durch die Umstellung von einer Vektorschub- auf eine Rotormaschine erzielt, was sich auch positiv auf die Wartungs- und Treibstoffkosten auswirkt. Erhalten bleiben Panzerung, Bewaffnung, die elektronische Angriffs- und Abwehrtechnik sowie (mit leichten Abstrichen) die Sensorsuite. Auch das zentrale Schubaggregat wurde beibehalten, die vier voll schwenkbaren Manöverdüsen wurden allerdings durch zwei unabhängig voneinander dreh- und kippbare Rotoraggregate ersetzt.
item.myrmidon.desc=Senkt die Bewegungsrate im Gehen um 2 Meter und die Reichweite der Handlung Sprinten um 3 Meter. \n \n Die Myrmidon ist eine vollversiegelte Hartschalenpanzerung aus verstärktem Durastahl, deren reines Gewicht auch den kräftigsten Elitesoldaten binnen kürzester Zeit zu Boden schicken sollte. Dass dies nicht geschieht, liegt am integrierten Exoframe. Dieser trägt einen Teil des Gewichts, dient als Kraftverstärker für die Bewegungen des Trägers und absorbiert einen Teil der kinetischen Landungsenergie bei Sprüngen bzw. Stürzen. Vom Tragegefühl und der Beweglichkeit her entspricht die Myrmidon einer mittleren Militärpanzerung. Ein Highlight der Panzerung ist - neben der im Helm enthaltenen High-End-Sensorik - der hinter der rechten Schulter verbaute "Einsatzarm", der im Prinzip eine fest verbaute und autonom agierende Drohne mit Waffenhalterung und Bildverbindung ist. Diese scannt nonstop die Umgebung speziell im Rücken des S-K-Soldaten, kann aber natürlich auch auf frontale Ziele ausgerichtet werden. Um "Rüttler" durch Autofeuer zu minimieren, wird der Arm in aller Regel nur mit einer Steyr TMP bzw. einer vergleichbaren Automatikpistole bestückt und zum Niederhalten verwendet. Zusätzliche Einsatzkraft bekommt die Myrmidon durch zwei Granatwerfer mit je drei Abschussrohren, wobei der Schulterwerfer nur mit solchen Granaten bestückt wird, die ungenau platziert werden können, etwa (IR-)Rauchgranaten.
item.myrmidon.item.thermal_damping.desc=Gegner können kein Edge durch temperaturbasierte Wahrnehmung erhalten.
item.myrmidon.item.myrmidon_drone.desc=Der bewegliche Waffenarm entspricht einer festverbauten Drohne.
item.myrmidon.item.myrmidon_commlink.desc=Kommlink (Gerätestufe 7)
item.man_wyvern.desc=Link-Busse sind autonom fahrende Fahrgastzellen, die sich auf gemeinsamen Strecken zu dicht hintereinanderfahrenden Kolonnen verbinden. Als Hybrid zwischen Taxi und Bus werden sie in vielen Metropolregionen und Sprawls eingesetzt, um Bus- und Haustürdienste in Randzonen anzubieten. Speziell im Rhein-Ruhr-Plex sind sie weitverbreitet, wo sie in frequenzschwachen Zeiten in das FTS-Transportboxsystem eingebunden werden und die „letzte Meile“ zwischen Verteilzentren und kleinen bis mittelgroßen Abnehmern wie Kiosken, Supermärkten, Handwerksbetrieben und mittelständischen Produzenten abdecken.
