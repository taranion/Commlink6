mentorspirit.bergsteiger.desc=Eine Anhängerin von Bergsteiger legt viel Wert auf gute Vorbereitung und umsichtiges Vorgehen, wenn sie sich einer Herausforderung stellt - und sie liebt Herausforderungen! Sollte sie der Aufgabe nicht gewachsen sein, nimmt sie klaglos jede Konsequenz ihres Handelns an, und sei sie noch so unangenehm. Denn welchen Wert hat eine Erfahrung, wenn man aus ihr keine Lehren zieht? \n\nVorteile: Allgemein: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal, Zauberer: Edge-Boosts beim Herbeirufen von Erdgeistern kosten 1 Edge weniger als normal, Adept: 1 Geschärfter Sinn, Richtungssinn und 1 Stufe Schmerzresistenz gratis. \n\nIn der harten Welt der Hochgebirge gibt es keinen Platz für Versager. Wenn ein Teamkamerad, Schutzbefohlener oder Auftraggeber (nach Maßgabe der Spielleitung) selbstverschuldet in Schwierigkeiten gerät und die Anhängerin von Bergsteiger ihm helfen will, muss ihr eine Probe auf Willenskraft + Willenskraft (4) gelingen. Misslingt die Probe, darf sie während der gesamten Mission kein Edge mehr einsetzen.

item.thermo_clothing.desc=Thermokleidung setzt sich in der Regel aus mindestens drei Schichten zusammen, von der langen Unterhose bis zur wind- und wasserabweisenden Jacke und Hose. In Summe bietet sie nicht nur guten Schutz gegen Kälte, sondern hat auch eine gewisse Verteidigungswirkung - auch wenn das nicht ihr primärer Zweck ist.
item.hiking_gear_base.desc=Charaktere die mit passender Wanderausrüstung in den Bergen unterwegs sind, können besser mit den Strapazen umgehen, mit denen sie sich dabei konfrontiert sehen. Wenn sie infolge der Wandererung den Status Erschöpft erhalten würden, wird dessen Stufe um 1 gesenkt. 
item.hiking_gear_complete.desc=Charaktere die mit passender Wanderausrüstung in den Bergen unterwegs sind, können besser mit den Strapazen umgehen, mit denen sie sich dabei konfrontiert sehen. Wenn sie infolge der Wandererung den Status Erschöpft erhalten würden, wird dessen Stufe um 1 gesenkt. Benutzen sie einen vollständigen Ausrüstungssatz, erhalten sie außerdem 1 Edge bei Natur- und Wahrnehmungs-Proben im Hochgebirge.
item.snow_googles.desc=Die etwas klobig wirkende Schneebrille schützt die Augen nicht nur vor der kalten Witterung, sondern auch vor der durch die Reflexion im Schnee verstärkten UV-Strahlung und der dadurch hervorgerufenen Schneeblindheit. Zudem bietet sie Sichtunterstützung bei dichtem Schneetreiben.
item.ski_base.desc=Ski erleichtern das Vorankommen auf offenen Schneeflächen. Sie senken die Stufe des Status Erschöpft um 1 Stufe, wenn er infolge der Bewegung durch verschneites Gelände entsteht. Sie erlauben Geschwindigkeiten von 30, bei Abfahrten 60 und mehr und gewähren bei entsprechenden Athletik-Proben 1 Edge.
item.snow_shoes.desc=Schneeschuhe erleichtern die Bewegung durch tiefen Schnee auch in schwierigem Gelände und bei Anstiegen. Sie senken die Stufe des Status Erschöpft um 1 Stufe, wenn er durch die Bewegung in solchem Gelände entsteht, und gewähren bei entsprechenden Athletik-Proben 1 Edge.
item.ski_smart.desc=Die SmartSki der Schweizer Firma Victorinox können sowohl die Form von Ski aus auch die von Schneeschuhen annehmen - oder die eines Gürtels, wenn keines von beidem benötigt wird. Die Veränderung erfordert eine Haupthandlung.
item.ares_murmeltier.desc=Der Schlafsack bietet Kälteresistenz 3. Ist er mit dem Zelt verbunden und sind dessen Solarkollektoren ausreichendem Sonnenlicht ausgesetzt, regeneriert sich alle 8 Stunden ein verbrauchter Punkt dieses Wertes.
item.avalance_airbag.desc=Der Lawinenrucksack enthält einen Airbag, der seinem Träger im Fall einer Lawine zusätzlichen Auftrieb verleiht, sodass für alle späteren Proben zur Rettung 1 Edge zusätzlich zur Verfügung steht.
item.spin_alpin.desc=Der NotFaltGleiter ist eine Wearable-Drohne, die als Weste oder Jacke vertrieben wird und ähnlich wie ein Fallschirm funktioniert - stürzt man aus dem Berg, entfaltet sich ein Gleitschirm, der es erlaubt, Abstand zum Felsen zu gewinnen und sicher zu landen. Die Drohne lässt sich sogar mit speziell angepassten Rucksäcken kombinieren. 
