item.baer_e_sperber.desc=Ein E-Roller aus der Berliner Fahrzeugmanufaktur BÆR, bei denen selbst ALI einräumen muss, dass von ihnen wohl keine Gefahr ausgeht.
item.baer_schlachtkreuzer.desc=Was das KombatKar für Touristen, ist der Schlachtkreuzer für alle, die auch auf F-Straßen lebend ans Ziel kommen wollen. Die besten Fahrzeuge zu diesem Zweck werden in Berlin von der Lichtenberger Fahrzeugmanufaktur BÆR gebaut bzw. auf Basis grundsolider Modelle wie dem 2062er Mercury Comet Cruiser zusammengeschraubt. MCC sind von Haus aus praktisch unkaputtbar und ob gebraucht oder als Ersatzteilspender immer noch überall zu kriegen. Die Motoren werden bis zum Maximum aufgebohrt oder gleich ganz durch Multifuel-Maschinen aus erbeuteten Militärbeständen ersetzt. Die Fake-Waffen der Kombatmage-Fanboys sucht man hier vergeblich. Vom Rammsporn am Kühlergrill über die Dachluke mit Maschinengewehrhalterung bis hin zu den Granatwerferdosen im Heck ist hier alles darauf ausgelegt, durch Barrikaden zu brechen und etwaige Verfolger mit einem Höchstmaß an Gewalt auszuschalten. Standardausstattung: Dachluke mit Waffenhalterung (Schwer, Extern, Drehbar montiert, Manuell), Multifuel-Motor, Rammbock
item.bessere_dreckskarre.desc=Die typische Berliner Dreckskarre besitzt entweder das verrostete Chassis irgendeines Autos, das vor 2060 hergestellt wurde, oder ist ein erkennbares Flickwerk, das nur irgendwie den Ätzregen abhalten soll (falls überhaupt, denn Cabrios sind wegen ihres \u201EIhr könnt mir gar nix, ihr Ärsche\u201C-Faktors sehr beliebt). Unterbau und Federung sind grundsolide, unempfindlich gegen Schlaglöcher und einfach zu reparieren. Der Nachteil besteht darin, dass Dreckskarren wegen des fehlenden Autopiloten sämtliche ALI-Alarme losgehen lassen und daher selbst in vielen Norm-Bezirken die Anwesenheit der Polente heraufbeschwören.
item.drecks_van.desc=Die typische Berliner Dreckskarre besitzt entweder das verrostete Chassis irgendeines Autos, das vor 2060 hergestellt wurde, oder ist ein erkennbares Flickwerk, das nur irgendwie den Ätzregen abhalten soll (falls überhaupt, denn Cabrios sind wegen ihres \u201EIhr könnt mir gar nix, ihr Ärsche\u201C-Faktors sehr beliebt). Unterbau und Federung sind grundsolide, unempfindlich gegen Schlaglöcher und einfach zu reparieren. Der Nachteil besteht darin, dass Dreckskarren wegen des fehlenden Autopiloten sämtliche ALI-Alarme losgehen lassen und daher selbst in vielen Norm-Bezirken die Anwesenheit der Polente heraufbeschwören.
item.dreckskarre.desc=Die typische Berliner Dreckskarre besitzt entweder das verrostete Chassis irgendeines Autos, das vor 2060 hergestellt wurde, oder ist ein erkennbares Flickwerk, das nur irgendwie den Ätzregen abhalten soll (falls überhaupt, denn Cabrios sind wegen ihres \u201EIhr könnt mir gar nix, ihr Ärsche\u201C-Faktors sehr beliebt). Unterbau und Federung sind grundsolide, unempfindlich gegen Schlaglöcher und einfach zu reparieren. Der Nachteil besteht darin, dass Dreckskarren wegen des fehlenden Autopiloten sämtliche ALI-Alarme losgehen lassen und daher selbst in vielen Norm-Bezirken die Anwesenheit der Polente heraufbeschwören.
item.rattenbike.desc=Das typische Berliner Rattenbike ist eine aus mehreren Enduros zusammengeflanschte Geländemaschine, die zwar keine Schönheitswettbewerbe gewinnt und in keinen Konzernsektor hineingelassen wird, dich aber sicher selbst durch die beschissensten Nebenstraßen der Anarchobezirke bringt. Auch in Normbezirken und ALI-kontrollierten Gebieten wie der Autobahn werden Rattenbikes oft toleriert, da eine Kollision mit \u201Eordentlichen\u201C Fahrzeugen meist zulasten des Rattenbike-Fahrers ausgeht.
item.e-rikscha.desc=Ein E-Rikscha aus der Berliner Fahrzeugmanufaktur BÆR.
item.tuk_tuk.desc=Ein ätzend langsames Gefährt aus der Berliner Fahrzeugmanufaktur BÆR.

item.junkdog.desc=Ursprünglich entwickelt für spektakuläre Drohnenkämpfe, haben Junkdogs längst einen festen Platz als Wachhund, Kurier oder treuer Begleiter für Critterjäger. Und wenn einer dieser rasselnden Hetzer dich kriegt, ist ein verrosteter Biss in den Hintern noch die kleinste Sorge, die dich plagt. Cybersporne, Giftzähne, Gasbehälter, Taser, ja sogar Maschinenpistolen packen sie da rein. Selten sind diese Biester dabei allein unterwegs. Geruchscanner hat Stufe 5.
item.junkdog.item.weapon_junkdog_bite.desc=Gebiss der Junkdog
item.kuznechik.desc=Immer wieder gehen Lieferdrohnen verloren, werden gehackt oder vom Himmel geschossen, beim Abladen mit Netzen und Seilen gekapert und anschließend zerlegt und in Einzelteilen verkauft. Leistungsstärkere Modelle hingegen werden zuweilen von meist jugendlichen Tüftlern zu einer \u201EReiterdrohne\u201C umgerüstet. Diese auch \u201EKuznechik\u201C (russ. Heuschrecke) oder \u201ESpatz\u201C genannten Gefährte sind im Prinzip Flugdrohnen mit aufmontiertem Sitz, ein paar Griffen zum Festhalten und einer Neuverdrahtung der Steuerung, die es dem waghalsigen Piloten erlaubt, die Drohne per Kabelverbindung direkt zu steuern. Mit Riggerkonsole, falls verfügbar, oder videospielartig und lebensmüde mit einer gehackten Spielzeugdrohnen-App auf dem VolksKOMM.
item.ruhrmetall_selket.desc=Die Stärke des Selket liegt wie beim Vorgänger SSP2 \u201ESkorpion\u201C in der hohen Beweglichkeit des Fahrzeugs: Auf Straßen kann das Fahrzeug auf sechs einzeln angetriebenen Rädern schnell jeden Einsatzort erreichen.\nBei unwegsamem Gelände, Panzersperren oder anderen Barrikaden hebt sich der Selket auf \u201EZehenspitzen\u201C und krabbelt über Hindernisse einfach hinweg. Bei Einsatz als Läufer: Handling 4/3, Beschleunigung 8, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 60.

item.volkskomm.desc=Das kostenlos von BERVAG und Berliner Rat ausgegebene VolksKOMM basiert auf dem MSI Securitas, einem exklusiv für den Sternschutz entwickelten Sondermodell mit zusätzlichen Hardwaresperren. Das Betriebssystem ist eine auf das Minimum beschränkte Version des Ætherlink Orion OS.\nDas VolksKOMM kann nicht für heißes Sim modifiziert werden und auch nicht auf Schleichfahrt gehen. Auch ist es nicht möglich, die verbaute Hardware zu verändern, neue Software zu installieren oder die bestehende Software zu bearbeiten oder zu löschen. Trotzdem ist es ein voll funktionsfähiges Kommlink, das alle üblichen legalen Anwendungen wie Telefonie mit oder ohne Bild, Nachrichtenversand, AR/VR-Zugang, Nutzung als Musik- oder Trideoplayer, Credstickport, Voice Control usw. ermöglicht.\nDie fest mit dem VolksKOMM verbundene VolksSIN lässt sich um Lizenzen erweitern, wobei Waffenlizenzen ausgenommen sind. Die Übertragung der VolksSIN auf ein anderes Kommlink ist problemlos möglich; dabei wird allerdings das VolksKOMM bis zu einer Rücksetzung im MSI-Werk funktionslos und landet meistens im Müll.
