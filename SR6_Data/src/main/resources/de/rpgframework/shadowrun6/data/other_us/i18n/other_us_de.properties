#Age of Rust
item.buzzard_transit=Buzzard Transit
item.buzzard_transit.page=15
item.buzzard_transit.prodname=Zeit des Rost

item.buzzard_transit.desc=Der Buzzard-Van verfügt über zwei Dachfächer, in denen Drohnen vom Typ Cyberspace Designs Quadrotor (SR6, S. 303) untergebracht werden können, sowie einen Slot für eine Aztechnology Crawler (SR6, S. 303) unterhalb der hinteren Ladetür. Diese Drohnen sind jedoch nicht im Preis des Vans inbegriffen. Der Van verfügt über eine Reihe von einprogrammierten Befehlen für diese Drohnen, um sie in der Nähe des Vans zu steuern und Gegenstände zu laden oder zu entladen. Wie üblich nutzen die Drohnen ihre Pilotstufe, wenn sie diese Befehle ausführen.

