item.krime_wageslave.desc=Dieses dreirädrige Ein-Personen-Fahrzeug ist als extrem preisgünstiges Modell für den Weg zur Arbeit und zurück, für kleine Einkaufe und für sonst nicht viel gedacht und wird auch so beworben. In Bewertungen wird das Fahrzeug dafür gescholten, dass es übergroß sei und nicht „aufrecht“ und damit legal innerhalb von Einkaufszentren benutzt werden könne wie andere EPFs auf dem Markt. Es bietet allerdings einem Troll ausreichend Platz und kann voll beladen (gerade noch) Highway-Geschwindigkeit erreichen. Bei einem rein elektrischen Modell ist der Mangel von GridGuide als Standardoption für den Antrieb Modell Rocket Jockey ziemlich vielsagend. Der Preis macht das Fahrzeug bei Trollen in aller Welt beliebt.
item.krime_bazoo_basic.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. 
item.krime_bazoo_red.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. Das Sportmodell Redline hat mit Doppelturbo und drohnenbalancierter Kurbelwelle.
item.krime_bazoo_chrome.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. Das Modell Chrome hat Doppelturbo und drohnenbalancierter Kurbelwelle vom Redline, sowie voll verchromten Karosserieteilen, die erträgliche Spaltmaße haben. 
item.krime_big_bazoo_basic.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. Der Big Bazoo verbessert diese Kapazität noch mit einer Geländeaufhängung, verstärkten Stoßfängern und einem eingebauten Überrollkäfig, sodass er als einziges unmodifiziertes Serienfahrzeug an der diesjährigen kanadischen Rallyemeisterschaft teilnehmen konnte. 
item.krime_big_bazoo_red.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. Der Big Bazoo verbessert diese Kapazität noch mit einer Geländeaufhängung, verstärkten Stoßfängern und einem eingebauten Überrollkäfig, sodass er als einziges unmodifiziertes Serienfahrzeug an der diesjährigen kanadischen Rallyemeisterschaft teilnehmen konnte. Das Sportmodell Redline hat mit Doppelturbo und drohnenbalancierter Kurbelwelle.
item.krime_big_bazoo_chrome.desc=Der Beitrag von Krime Motors zum lukrativen Kleinwagenmarkt ist ein eher unwürdig aussehendes Auto, das denen der alten UdSSR ähnelt. Beim Standardmodell sind die Spaltmaße extrem, der Motor ist laut und leistungsschwach, die drei Scheinwerfer (der auf dem Dach ist ein Infrarotscheinwerfer) sind nicht aufeinander abgestimmt, und ehrlich gesagt stinkt etwas in diesem Auto gewaltig. Aber die Aufhängung in Trollstärke und die robuste Kraftübertragung, die deutlich mehr Gewicht schafft, als man von einem Wagen dieser Größe erwarten würde, haben dem Modell bei Fahrern eine gewisse Beliebtheit verschafft, die genug davon haben, dass Kleinwagen nur Wegwerf-Drekskarren sind, die kaum vom Fleck kommen. Der Big Bazoo verbessert diese Kapazität noch mit einer Geländeaufhängung, verstärkten Stoßfängern und einem eingebauten Überrollkäfig, sodass er als einziges unmodifiziertes Serienfahrzeug an der diesjährigen kanadischen Rallyemeisterschaft teilnehmen konnte. Das Modell Chrome hat Doppelturbo und drohnenbalancierter Kurbelwelle vom Redline, sowie voll verchromten Karosserieteilen, die erträgliche Spaltmaße haben. 
item.krime_sv-2.desc=Krime ist nur selten Opfer erfolgreicher Industriespionage, aber das "Projekt Crashtest" in Winnipeg sickerte in die Matrix durch. Man konnte ein Wrack nach dem anderen sehen, wenn die SV-2 (Safety Vehicle Model 2) extrem intensiven Aufpralltests unterzogen wurden. Aber die Gruppe, die versuchte, das SV-2 zu diskreditieren, schaffte es nicht, die Dummies rauszuschneiden, die aus jedem Wrack vollkommen unbeschädigt rausgezogen wurden. Das führte zu einer riesigen Flut an Vorbestellungen auf Krimes Matrix-Seiten für "diesen Sportwagen aus dem Crashtest", bevor irgendwelche anderen Details über das Auto bekannt wurden – sogar vor der offiziellen Bestätigung, dass es überhaupt existierte. Die Leistungsdaten, die dann bekannt wurden, ordneten den "Sportwagen" dann in die Kategorie der meisten mittleren Limousinen ein. Das lag an der eher beschränkten Leistungsfähigkeit des Antriebs vom Typ Motor King, hat aber das Sicherheitsimage des Wagens nur zusätzlich gestärkt und es zu einem begehrten Produkt für finanziell einigermaßen gutgestellte Eltern gemacht, die ihren Kindern das erste Auto kaufen wollen, oder für Fahrer, die etwas sportlich Aussehendes und Sicheres haben wollen, das nie zu schnell für den Highway wird.
item.krime_prowler.desc=Krime hatte ursprünglich nicht vor, diese Fahrzeuge an Polizei und Sicherheitsfirmen zu vermarkten – ursprünglich waren sie für Straßengangs und militante Troll-Policlubs gedacht. Die beiden ersten gingen sogar an wichtige Anführer der Söhne Saurons! Aber nach einer Undercover-Aktion, bei der sich Polizisten in Las Vegas als Runner ausgaben, wurde die Produktion angehalten, während die Gesetzeshüter überlegten, welche Verbrechen Krime Motors zur Last gelegt werden konnten. Die Fahrbereitschaft der Polizei analysierte den Wagen als Teil der Ermittlungen und kam zu dem Schluss, dass er fast alles zu bieten hatte, was die Polizei selbst brauchte. Mit Krime wurde eine Übereinkunft erzielt, sodass der Wagen auf den Markt kommen konnte, aber nur für die Polizei und lizenzierte Sicherheitsfirmen. Dafür würden die Anklagen fallen gelassen. Mit einigen polizeispezifischen Modifikationen ab Werk – darunter GridGuide als Standard für den Grid-Goblin-Antrieb – könnte der Krime Prowler bald zum Bestseller unter den "Abfangwagen" der Polizei werden.
item.krime_detruck.desc=Im Moment ist immer noch nicht bekannt, wie Krime die DeLorean Motor Company mit den Rechten für ihr einziges Modell übernehmen konnte, aber Krime begann sofort, ein neues Modell herauszubringen, das auf dem berühmten Design basiert, das bis heute in Filmen und Videospielen eingesetzt wird. Die Entscheidung für das Design als Sport-Truck hat allerdings alle überrascht und definitiv das Interesse geweckt. Die Zahl der Vorbestellungen überschreitet schon die Produktion des ersten (zugegebenermaßen sehr beschränkten) Produktionslaufs, obwohl der Preis sehr hoch und die offiziellen Leistungsdaten eher mäßig sind. Manche Leute gehen davon aus, dass die enorme Produktion an Ersatzteilen, die Verlässlichkeit, der Werterhalt und die aufsehenerregenden Linien den Verkauf des Fahrzeugs stark ankurbeln. Die meisten Fahrzeuge werden von Kleingewerbetreibenden gekauft, die den Wert ihrer Firma durch physischen Besitz statt durch Nuyen auf der Bank erhöhen wollen; gleichzeitig ist das auffällige Auto ein rollender Werbeträger. Mit Chassis und Karosserie aus rostfreiem Stahl – abgesehen vom Unterbau, der aus gepanzerter Keramik besteht, die auf dem zivilen Markt ganz neu ist – kann das Fahrzeug Rost, saurem Regen, Fallout von Schmelzwerken und anderen schädlichen Einflüssen der Sechsten Welt widerstehen.
item.krime_dix.desc=Als die spanische Armee eine extrem verrückte Entwicklung in Auftrag gab, bei der es um einen Lkw mit 10 Tonnen Zuladung ging, der an existierender Infrastruktur minimalen Schaden verursachen und die Besatzung wie ein leichter Panzer mit einer gepanzerten Kabine schützen sollte, glaubte kaum jemand daran, dass das zu schaffen sei. Dann kam das Design des Krime Motors Dix, der alle diese Aufgaben erfüllte und außerdem noch geländegängig war, was gar nicht verlangt war. Dieses Halbkettenfahrzeug, dessen Ketten mit langlebigem Synthgummi überzogen sind, hat einen Multifuel-Zehnzylindermotor mit zehn Litern Hubraum (der stammt von SpIn und ist als DragonSlayer bekannt), eine Seilwinde mit einer Tonne Zugkraft hinter der Kabine und ansonsten keinerlei Ausstattung, außer dass sich die Sitze jedem Metatyp anpassen. Im Moment wird das Modell von Streitkräften in aller Welt evaluiert, und es sieht so aus, als würde das eine überraschende Erfolgsstory werden. Anmerkung: Alternative Konfiguration mit 2 Sitzen erhältlich.
item.krime_barco.desc=Krimes Beitrag zur Seefahrt ist dieses einfache Fischerboot, das mit seinem kräftigen Diesel-Demon-Multifuel-Motor oder, wenn man die Schiffsschrauben anhebt, mit einem einfachen Segel angetrieben werden kann. Es ist für Trollmaße gebaut und hat eine um 50 Prozent größere Tiefkühlanlage als die Konkurrenz, was ihm einige Aufmerksamkeit und etliche Flottenaufträge verschafft hat. Sekundärantrieb Segel (Handling 5, Beschleunigung 4, Geschwindigkeitsintervall 10, Höchstgeschwindigkeit 50).
item.krime_tankette.desc=Manchmal wird das Fahrzeug als "Baskischer Panzer" beworben. Es handelt sich um ein Ein-Personen-Kampf-Kettenfahrzeug, das versucht, die Nische zwischen Bodenkampfdrohnen und leichten Panzern mit mehreren Besatzmitgliedern zu besetzen. Man macht sich zwar darüber lustig, dass das Fahrzeug für die Aufgaben einer Kampfdrohne zu groß und für die eines leichten Panzers zu klein ist, aber in der Rolle einer Feldbefehlsstelle für Kampfdrohnen oder einer gepanzerten Aufklärungseinheit erringt es weltweit immer mehr Aufmerksamkeit. Besonders bei Gruppen, die demonstrieren wollen, dass ein Metamensch Teil der Kommandohierarchie einer Drohneneinheit sein kann. Die Krime Euskaldunak hat zwei Waffenhalterungen und kommt ab Werk mit einer Krime Cannon als Hauptbewaffnung und einem koaxial montierten Sturmgewehr Krime Happiness und 25 Prozent Rabatt auf die Waffen. Eine andere populäre Option ist es, das Sturmgewehr durch ein starkes Senderelais zu ersetzen, aber das macht man oft im Feld mit improvisierten Teilen.
