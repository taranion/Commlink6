item.krime_vester.desc=Old Man Krime (ja, versucht noch mal, er existiert!) wollte schon immer ein Glücksspieler auf einem Mississippidampfer im Wilden Westen sein! Aber immer, wenn er sich passend kleiden wollte, war der Derringer ein Problem, weil er verdammt viel zu klein war! Eine Holdout für einen Real-Sized Soldier braucht besondere Modifikationen, und dafür sorgte Old Man Krime eines Tages. Jede Vester wird nach seinen Originalentwürfen und Anforderungen gebaut, was einen ordentlichen Griff und großkalibrige Durchschlagskraft für die Momente erlaubt, wenn dieser dreckige Mistkerl beim Geben betrügt!
item.krime_heater.desc=Schicke Knarren funktionieren auch, klar. Aber sie sind kompliziert, haben winzig kleine Teile und sind nicht besonders effektiv, wenn man "überdimensionierte" Hände hat – besonders, wenn sie mit Sicherungen am Griff designt wurden. Ha! Von wegen überdimensioniert! Die Krime Heater ist unsere Art, klarzustellen, dass wir keine Flossen in Konfektionsgröße haben! Sie ist groß und kräftig, schießt verlässlich und hat Teile, die groß genug für einfaches Zerlegen und Reinigen sind! Warum sollte man eine Waffe benutzen, die sich toll verkauft, wenn man eine haben kann, die wirklich für eine vernünftige Größe entworfen wurde?!
item.krime_varmint.desc=Es ist eine Tatsache: Schädlingsbekämpfungswaffen sind Mist. (Eine Meldung der Abteilung für Sachen, die wir uns aus der Nase ziehen! Kommt zu Besuch und begrüßt Norman! Er fühlt sich einsam.) Sie wurden allesamt für die Fünfte Welt entworfen, als man mit Schädlingen noch leicht fertigwurde. Schon mal eine Dämonenratte gesehen? Schon mal versucht, eine zu kochen, die ein halbes Dutzend Kugeln im Leib hatte, weil sie mit einer "Schädlingspistole" ausgeschaltet wurde? Wer das erlebt hat, findet bei Krime eine bessere Lösung! Eine schwere Pistole mit langem Lauf, besonders verlässlichem Design und einer Schulterstütze, die als Holster dienen kann. Dazu kommen noch zwei Taschen an diesem Holster für die zwei mitgelieferten Ersatzmagazine! Außerdem gibt es Kimme und Korn (auf 30 Meter eingestellt) und ein Klappvisier bis 100 Meter! Kombiniert das mit dem Reinigungsset , das sich ebenfalls im Holster befindet, und dem Gürtelclip zur Befestigung, und ihr habt eine vollkommen autarke Survival-Waffe, die nur wenig größer als die alltäglichen Selbstverteidigungsmittel ist! Zur Selbstverteidigung, zur Jagd für den Eintopf oder einfach aus Spaß am Schießen - die Krime Varmint enttäuscht nie!
item.krime_chatter.desc=Bei Krime greifen wir zu, wenn sich etwas als gut erweist, und lassen es nie wieder los! Genau das machten wir, als Nathan Thiessen mit seinem besonderen System des Doppelhub-Gasdruckreglers zu uns kam! Verlässlich, minimaler Rückstoß und mit kompakter Bauform. Dazu kommt die Überarbeitung der Anforderungen, die von der lettischen Armee an die Ausrüstung der Soldaten der Etappe (Logistik) gestellt werden. Diesmal wurde besonders auf die Eignung des Waffensystems für Metamenschen geachtet, und nur Krime konnte alle Forderungen erfüllen. Dazu kamen noch die ausgedehnten Tests unter Einsatzbedingungen in unserer neuen Anlage in Winnipeg, UCAS! Das Standardmagazin fasst zwanzig Schuss, und mit der optionalen Trommel mit sechzig Schuss kann die Chatter sogar die stärkste Opposition niederhalten!
item.krime_tradition.desc=Old Man Krime (er existiert, verflucht noch mal!) hat uns immer gelehrt, daran zu denken, woher wir kommen, damit wir wissen, wohin wir gehen. Also sahen wir uns traditionelle Feuerwaffen, die von einem Massenpublikum gewünscht werden, genau an, und dabei fiel uns die alte klassische Tommy Gun auf. Es gibt ein Stangenmagazin mit 30 Schuss oder eine Trommel mit 75 Schuss für "lange Diskussionen", und das Ganze entweder in einem günstigen Modell ohne Verschalung, einer modernen verchromten Version im Straßenstil oder einem traditionellen Look in brüniertem Stahl und Holz. Außerdem bieten wir: Updates am Lademechanismus, die ihn zuverlässiger machen, einen Einschub in der Schulterstütze für viele verschiedene Kommlinks für taktische Zwecke, eine klassische Rückstoßkompensation von Cutz und Bohrungen für ein aufmontiertes Smartgunsystem Radio Shack S4.2. Die neue offizielle Bewaffnung des Gefängnispersonals von Lone Star Correctional. Erhältlich als Einsteigermodell, im modernen Stra-ßenstil oder im klassischen Gangster-Look!
item.krime_saint.desc=Wenn es hart auf hart kommt, geht es oft nur um die Feuerkraft. Den einen Schuss, der dafür sorgt, dass ihr heil nach Hause kommt - und der andere Scheißkerl in einen Sarg! Den verzweifelten Schuss, der den fleischfressenden Critter umlegt, der euch das Gesicht abfressen will! Den Präzisionstreffer, der dafür sorgt, dass der Pappkamerad am Schießstand nicht mehr über euch lacht! Das Design des Saint Nicholas wurde von vielen nichttraditionellen Quellen inspiriert, ist leichtgewichtig und kann jedem Ziel, das euch verärgert hat, schwere Treffer verpassen! Eine schlanke Waffe, die durchschlagskräftige Munition mit einer der kleinsten Bauformen auf dem Markt verbindet! Dazu kommen unsere patentierten Magazine "Lucky-7" und "Blackjack-21", der modernste Mündungsfeuerdämpfer, den Krime jemals gebaut hat, und der Segen eines Heiligen – dieser Karabiner erlaubt es, in Frieden heimzugehen. Oder im Krieg!
item.krime_akm_97.desc=Wegen der Auflösungsprobleme des AK-147 arbeitete das russische Militär beim Neuentwurf des AK-97 eng mit Evo zusammen und machte sich die Verbesserungen der konventionellen Produktion und Materialien seit Erscheinen des klassischen Gewehrs 1997 zunutze. Die Waffe besteht zum Teil aus neuen Materialien, wie der Legierung Firmlite-7 für die Magazine und für einige Teile im Inneren der Waffe sowie dem sapphirinverstärkten Glasfasergestell, behält aber traditionelle Konzepte wie den verchromten Lauf bei. Und sie wird von Metamenschen statt von Drohnen hergestellt! Das modernisierte AKM-97 hat außerdem eine verbesserte Ergonomie wie Feuerwahl-, Sicherungs- und Repetierhebel an beiden Seiten und Visiere, die auch von Linkshändern leicht bedient werden können. Das Design wurde verschiedenen Herstellern weltweit zur Verfügung gestellt, erfüllt aber immer die anspruchsvollen Vorgaben des russischen Militärs, was die Gewehre für Regierungen in aller Welt verfügbar macht.
item.krime_akm_97_carbine.desc=Wegen der Auflösungsprobleme des AK-147 arbeitete das russische Militär beim Neuentwurf des AK-97 eng mit Evo zusammen und machte sich die Verbesserungen der konventionellen Produktion und Materialien seit Erscheinen des klassischen Gewehrs 1997 zunutze. Die Waffe besteht zum Teil aus neuen Materialien, wie der Legierung Firmlite-7 für die Magazine und für einige Teile im Inneren der Waffe sowie dem sapphirinverstärkten Glasfasergestell, behält aber traditionelle Konzepte wie den verchromten Lauf bei. Und sie wird von Metamenschen statt von Drohnen hergestellt! Das modernisierte AKM-97 hat außerdem eine verbesserte Ergonomie wie Feuerwahl-, Sicherungs- und Repetierhebel an beiden Seiten und Visiere, die auch von Linkshändern leicht bedient werden können. Das Design wurde verschiedenen Herstellern weltweit zur Verfügung gestellt, erfüllt aber immer die anspruchsvollen Vorgaben des russischen Militärs, was die Gewehre für Regierungen in aller Welt verfügbar macht.
item.krime_ditch.desc=Manchmal ist es einfach besser, abzuhauen, damit man noch einen weiteren Tag erlebt, und manchmal braucht man etwas, das einem hilft, die harte Zeit durchzustehen, bis der Druck nachlässt. Krime kennt diese Schwierigkeiten und hat an einer kompakten Kombination aus Gewehr und Schrotflinte gearbeitet, für die ihr jegliche Munition benutzen könnt, die ihr erbeuten könnt. Die Krime Ditch ist eine Bockbüchsflinte mit einem Sturmgewehrlauf oben und einem glatten Lauf unten, der dank einer Innovation in der Büchsenmachertechnik sowohl hülsenlose als auch Hülsenmunition verwenden kann! Der Nutzen im Kampf ist zweifelhaft, aber die Waffe schützt gegen eine kleine Gegnerzahl und sorgt dafür, dass man Fleisch für den improvisierten Eintopf hat! Die günstige Lösung für Notfälle! Jetzt mit ausklappbarer Schulterstütze, die einen eingebauten Munitionsbehälter bietet! Mit verchromtem Schaft oder in brüniertem Stahl erhältlich.
item.krime_ditch_shotgun.desc=Schrotflintenlauf der Krime Ditch.
item.krime_stopper_ii.desc=Die Stopper-II, die nach umfangreichen Kundenrezensionen und -vorschlägen neu designt wurde, bietet größeren Metamenschen immer noch eine wirksame Verteidigungsoption für Straße und Heim. Die neue Version ist als Bockflinte in Pistolengröße konstruiert, die weiter fünf Schuss im unteren Lauf trägt, um das Nachladen in angespannten Situationen zu erleichtern. Die Krime Stopper-II lässt sich damit nun für den zweiten Schuss schneller und einfacher auf das Ziel ausrichten. Ab Werk oder zum Nachrüsten gibt es viele verschiedene Pistolengriffe, wodurch diese wundervolle Waffe erstmals auch für kleinere Kunden verfügbar wird! Seht euch unser Modell Shopkeeper mit der ausklappbaren Schulterstütze an, und das Modell Homeguard mit dem Daumenloch im Schaft, das Platz für fünf weitere Schuss bietet!
item.krime_junior.desc="Kann nicht endlich jemand an die Kinder denken?!", schrie uns jemand entgegen, als wir unsere Herstellungs- und Verkaufsstrategien wieder einmal vor Gericht verteidigen mussten. Ernsthaft - unsere Anwälte saugen uns aus. Daher beschlossen wir bei Krime, dass wir ihnen nicht noch einen Scheck in den Rachen schieben wollten und stattdessen wir es sein würden, die an die Kinder denken! Sie sind schließlich unsere zukünftigen Kunden - und mit dem Krime Junior auch unsere gegenwärtigen Kunden! Die Waffe ist ein Kleinkalibergewehr aus gewichtssparendem Material mit einem robusten Mechanismus, der den Rückstoß auf ein sehr gut tolerierbares Maß dämpft, und sie hat ein spezielles Kommlink von Meta Link im Schaft. Auf dem Kommlink sind viele Lehrsofts vorinstalliert, die den Kindern etwas über Waffensicherheit, Umgang mit und Wartung von Waffen beibringen und auch die Schussergebnisse aufzeichnen - und alles unter der Anleitung von Unca Krime! Die Waffe ist ab Werk in vielen verschiedenen Farben erhältlich, die auch nachträglich verändert werden können, wenn sie an jüngere Geschwister weitergegeben wird, die Unca Krimes Haus neu einfärben wollen. Die im Moment beliebteste Wahl für Pfadfinder in aller Welt!
itemmod.krime_metalink.desc=Integriertes Kommlink der Krime Junior (mit Lehrsoft Gewehre 1).
item.krime_soldier.desc=Das Gewehr, mit dem unser Konzept des Real-Sized Soldier anfing! Nach zwei Jahren Forschung und Entwicklung bis zur Marktreife und sehr interessiert von über einem Dutzend Streitkräften beobachtet, kombiniert das Krime Soldier ein ordentliches Kaliber mit einem extrem verlässlichen Mechanismus und einem Standard-Granatwerfer als Sekundärwaffe. Das Krime Soldier ist ein Sturmgewehr stattlicher Größe für Soldaten stattlicher Größe! Bestellt vor dem großen Ansturm und erhaltet einen Krime Smiley-Button gratis!
item.krime_grenade_launcher.desc=Unterlauf-Granatwerfer der Krime Soldier.
item.krime_kar_97.desc=Dieses leichte Maschinengewehr basiert auf dem AKM-97, hat einen längeren und schwereren Lauf, ein integriertes Zweibein, kann eine spezielle Trommel mit 114 Schuss oder die normalen Magazine des AK-97 und AKM-97 nutzen und wird an Milizen und Nationalgarden vermarktet, die normalerweise AKs benutzen. Es gibt Bohrungen für externe Smartgunsysteme russischen Typs, und nur das Logo und das Fehlen einer vernünftigen Oberflächenbehandlung zeigen, dass es sich um eine Waffe von Krime handelt.
item.krime_monster.desc=Fünfzehn Millimeter Schmerz! Das ist es, was Das Monster bietet, und was es euren Zielen bringt! Das Monster wurde als materialzerstörende Waffe und zur Bekämpfung schwach gepanzerter Ziele entwickelt. Man muss es in Aktion sehen, um die Durchschlagskraft zu glauben - diese Waffe zerfetzt die Konkurrenz in der Luft, und nur ein Real-Sized Soldier kann sie bändigen, und selbst er braucht ein Dreibein oder eine Waffenhalterung auf einem Fahrzeug! Wenn ihr höhere Feuerraten als bei einer Sturmkanone braucht, aber genauso viel Schaden anrichten wollt, liefert das Krime Monster genau das immer und immer und immer und immer und immer wieder.
item.krime_confederate.desc=[Lade Krime_Confederate_Commercial_2.trideo][Sprache festlegen = Englisch][Englisch nicht gefunden, Standardwert = Amerikanisch][Begleittext = Ja] Bubba: "Hey Cletus, was jagen wir heute?" Cletus: [Holt Krime Confederate aus der Packung] "TRUCKS!" [Bubba tanzt wie ein verdammter Trottel herum und feuert verschiedene Waffen von Krime zur Melodie von "Dueling Banjos" ab, während Cletus die doppelläufige Krime Confederate aufklappt, sie lädt und dann auf das ungekennzeichnete Wrack eines Ares Roadmaster feuert.] Cletus: "Die Krime Confederate!"
item.krime_t_shirt_cannon.desc=Also: Concrete Dreams waren in der Stadt! Sie brauchten eine Lösung für ein sehr ausgefallenes Problem: Der Moshpit war zu groß. Die Leute weiter hinten hatten keine Chance, die T-Shirts zu kriegen, die während des Konzerts von der Bühne geworfen wurden. Weil sie ihr Publikum auf jeden Fall glücklich machen wollen, fragten sie bei uns wegen eines Mechanismus nach, der keine Feuerwaffe war, und den sie daher weltweit mitnehmen konnten, um ihre Gratis-Shirts an die ganze verdammte Menge verteilen zu können, egal, wie groß das Publikum ist. Mit "keine Feuerwaffe" hätten sie uns fast abgeschreckt - was wären wir denn ohne? -, aber dann boten sie an, noch eine Kiste echten Scotch draufzulegen, und wir konnten nur noch sagen: "VERKAUFT!" Es brauchte ein paar Experimente, weil wir die T-Shirts eher Richtung Orbit schossen als in die Menge, und dann mussten wir noch herausfinden, wie es ging, ohne die Leute zu verletzen. Scheiß-Jammerlappen - ich hätte liebend gerne eine Story, wie ich auf einem Konzert von Concrete Dreams verletzt wurde! Im Endeffekt basiert die T-Shirt-Kanone auf der traditionellen Krime Cannon, aber sie schießt mithilfe von Luftdruck und kann mit halber Kraft von einem Ende einer Arena zum anderen schießen! Wir bieten diese Präzisionswerkzeuge auch personalisiert mit dem Logo eurer Band an!
item.krime_escalation.desc=Old Man Krime (scheiße noch mal, es gibt ihn!) fuhr einmal zur Arbeit und kam in eine Spam-Zone, mit der die Firewall seines Trucks nicht fertigwurde. Er fluchte immer noch, als er zur Arbeit kam, und verlangte, dass wir etwas dagegen unternehmen; dann beruhigte er sich mit einem Dutzend Whiskeys pur. Aber unser Designteam vergaß das improvisierte Meeting nicht und tauchte in die tiefsten Winkel der Geschichte ab, um eine Lösung für das Problem zu finden. Sie schafften es nie, das Zielfindungssystem so hinzukriegen, dass es die Spam-Sender gezielt aufspürte, aber sie schafften es, einen verflucht guten Raketenwerfer zu entwickeln, um Old Man Krimes Bedürfnis zu erfüllen, Sachen in die Luft zu jagen. Ein sehr intuitives Design, das man nach ein paar Trainingsnachmittagen bedienen kann, und es ist gleichzeitig leicht genug, dass ein Real-Sized Soldier noch genügend Ersatzraketen mitnehmen kann, damit es nützlich ist. Bestellt jetzt gleich, und ihr bekommt den Signaldetektor gratis dazu!
itemmod.krime_matrix_scanner.desc=Matrix-Signalscanner der Krime Escalation
item.krime_calliope.desc=Nach der Perfektionierung des Krime Escalation zog Krime bei der Arbeit an einer fahrzeugmontierten Version seine Raketenproduktion ins Kalkül, die schon bei vielen Parteien Interesse geweckt hatte. Unser Team testete verschiedene Konzepte, trat dann einfach alles in die Tonne und verwendete das einfachste Design: einen Werfer mit zehn Schuss, der auf Pickups mit einer halben Tonne und mehr Zuladung und auf das Dach jedes Mehrzweckfahrzeugs auf dem Markt montiert werden kann! Man kann damit mit erschreckender Präzision einzelne Raketen abfeuern oder einen Bereich mit dem belegen, was wir im Handbuch die "Zwillingsfäuste des Schmerzes" nennen! Lasst den Feind nicht die Überhand gewinnen, schlagt mit den beiden Fäusten des Calliope zu!
item.krime_calliope_gun.desc=Raketenwerfer der Krime Calliope.
item.krime_ripper_weapon.desc=Maschinengewehr der Krime Ripper.
item.krime_ripper.desc=In unserer Partnerschaft mit Radio Shack haben wir bei Krime konsequent an der Entwicklung eines Anti-Drohnen-Systems für den internationalen Markt gearbeitet. Es sollte ein schnell einsetzbares System sein, das mit allen Anforderungen der Luftabwehr gegen Drohnen zurechtkommen musste. Es nutzt ein Radarsystem der Serie KPX-7 zusammen mit einem TRS-8000-Zielcomputer, dazu die neueste Smartguntechnologie von Radio Shack und ein Paar Maschinengewehre Marke Krime Wave! Das System kann in unserem patentierten Anhängerpaket Martrend flach zusammengefaltet werden, das von jedem Mehrzweckfahrzeug gezogen werden kann, das jemals auf den Markt kam, und natürlich auch von schwereren Fahrzeugen! Mit seinem eigenen Multifuel-Antrieb ist es genau das eigenständige Luftabwehrsystem, von dem ihr nicht wusstet, dass ihr es braucht!
item.krime_carpet.desc=Wenn es hart auf hart kommt, rufen die Harten die Luftdrohnen. Wenn die Luftdrohnen es ernst meinen, belegen sie das Gebiet mit einem Bombenteppich. Der Krime Carpet ist dazu gedacht, an einer gewöhnlichen Waffenhalterung montiert zu werden, hat das klassische, verlässliche Sensorpaket Radio Shack K-221 und das Smart-Abwurfsystem SX4.2. Die einzelne mittig angebrachte Granate legt das Zentrum des Zielgebiets fest, und die umgebenden fünf Granaten bedecken es mit einem Einschlagsteppich, was dafür sorgt, dass das Ziel getroffen und auch allen anderen in der Nähe der Tag versaut wird. Zum Einsatz kommen konventionelle Handgranaten aller Art, und unsere eigenen Granatenpakete Lucky-7 stehen für schnelles Nachladen zur Verfügung!
item.krime_stun_bayonet.desc=Manchmal muss man direkt in den Nahkampf, ohne vorher die Waffe wechseln zu können. Für die Fälle, in denen man das ganze Blut nicht gebrauchen kann, bietet Krime ein Betäubungsbajonett an, das im Grunde wie ein Betäubungsschlagstock funktioniert. Anmerkung: Enthält 5 Ladungen, die sich am Stromnetz mit einer Geschwindigkeit von 1 Ladung pro 10 Sekunden aufladen lassen.
item.krime_smartgun_dual.desc=Manchmal möchte man nicht, dass das Smartgunsystem überall sendet, aber dann verbraucht es den Platz, an dem sonst ein Lasermarkierer sitzen könnte. Endlich muss man sich nicht mehr für eins von beiden entscheiden! Unser neues Dualmodus-Smartgunsystem kann nach Belieben als Lasermarkierer oder als Smartgunsystem benutzt werden. Ein physischer Schalter legt den Modus fest, und feindliche Decker können die Smartgun bei aktivierter Sicherheit nicht mehr lahmlegen! Wir bei Krime arbeiten mit unseren Partnern von Radio Shack zusammen, um die bestmögliche Elektronik für das System zu bieten, und wir sind bereit, zehn Prozent des Kaufpreises zurückzuzahlen, wenn ein System nicht funktioniert! Jetzt bestellen und fünf Prozent Rabatt für Krime-Wein erhalten! Anmerkung: Das System hat eine Gerätestufe von 1.
item.krime_offline_support.desc=Nicht alle auf der Welt haben Zugang zur Matrix - oder ausreichend Zugang, um an die detaillierte und benötigte Dokumentation der Konzerne zu kommen. Wir bei Krime wissen, dass viele unserer Kunden nicht auf der Sonnenseite des Lebens stehen und einige von ihnen wegen der winzig kleinen Knöpfe keine Elektronik finden können, die sie einfach benutzen könnten. Für diese Leute gibt es eine winzig kleine Checkbox auf unseren Bestellformularen, mit der sie Offline-Supportlösungen zu ihren Bestellungen bei der Fabrik oder dem örtlichen Waffenladen auswählen können. Dabei sind auch ein Krime-Stoßstangenaufkleber, ein Krime-Smiley-Button und eine Flasche Schmiermittel von Krime inklusive!
item.krime_loudener.desc=Natürlich gibt es gibt es Schalldämpfer auf dem Markt, die eure Waffe fast flüsterleise machen, aber wir bei Krime standen schon immer auf dem Standpunkt, dass Lautstärke zählt! Produktion, Verkauf, Musik, SOUND! Warum nur die Nachbarn wecken, wenn man es mit einem Einbrecher zu tun hat, wenn man das ganze Viertel wecken und zu Hilfe rufen kann?! Der Krime Loudener erhöht die Lautstärke einer Feuerwaffe um eine Stufe. Leichte Pistolen klingen wie echte Pistolen! Gewehre klingen wie Schrotflinten! Schrotflinten klingen wie Sturmkanonen! Sturmkanonen klingen wie Stadterneuerung!!! Und im Gegensatz zu Schalldämpfern funktioniert dieses Produkt auch bei Revolvern und Schrotflinten! Und es wirkt zusätzlich als Mündungsbremse, sodass sich der Rückstoß ein bisschen leichter anfühlt! Holt euch den Krime Verstärker und WECKT DIE NACHBARN WIRKLICH!!! Anmerkung: Der Krime Loudener wird am Lauf montiert und verändert die Angriffswerte wie folgt: +1/+1/+1/–/–.
item.krime_tripod.desc=Rückstoß ist lästig, besonders bei den größeren Waffen auf dem Markt. Wie denen von Krime! Nach ein wenig Marktforschung und Analyse in unserem liebsten Stripclub verbesserten wir deshalb die Effektivität des traditionellen Dreibeins! Die Kombination von traditioneller Waffentechnologie und den neuesten Felskletterwerkzeugen führt dazu, dass das selbstverankernde Dreibein genau das ist, was man braucht! Die Sprengkartuschen können Felshaken mit einem sehr befriedigenden Krachen in den härtesten Beton treiben, und dann wird das Dreibein zu einem Teil des Bodens und hält euer Feuer im Ziel! Die schnellöffnenden Bügel lassen jederzeit eine Verlegung zu, und auch ohne die Felshaken funktioniert es als traditionelles Dreibein! Jetzt kaufen und die Chance erhalten, Ersatzkartuschen und -anker zu bestellen, bevor die Bestellmengen die Produktionskapazität übersteigen! Anmerkungen: Neutralisiert als Dreibein die Angriffswertmodifikatoren für halbautomatisches und Salvenfeuer und senkt den Angriffswertmodifikator für vollautomatisches Feuer auf -3, wenn es korrekt ausgeklappt wurde. Mit eingesetzten Felsankern wird auch der Angriffswertmodifikator für vollautomatisches Feuer neutralisiert. Das Aus- oder Einklappen erfordert eine Nebenhandlung, das Auslösen der Anker eine weitere Nebenhandlung.
item.krime_tripod_pitons.desc=Ersatzanker für das Krime Selbstverankernde Dreibein
item.krime_keeper.desc=Wollt ihr eure Waffe behalten? Wenn ja, dann kümmert euch um sie! Das Krime Keeper kann für viele verschiedene Kaliber und Lauflängen eingesetzt werden und bietet das Beste auf dem Gebiet der günstigen Reinigungsmaßnahmen und nicht ölbasierten Schmiermittel! Funktioniert bei Waffen von Krime und anderen Herstellern und bietet eine Softwarelösung zum Nachbestellen von Verbrauchsgütern im Set! Inklusive Lehrsoft für Feuerwaffenwartung und einem Krime-Troll-Smiley-Button!
item.krime_drum.desc=Krime Trommelmagazin
ammotype.krime_power.desc=Manchmal wird das Geräusch von Schüssen einfach langweilig. Es ist übel, aber irgendwann ist es nicht mehr aufregend, wenn man hört, wie ein Einbrecher beschossen wird, der das Haus unsicher macht, in dem man wohnt. Besonders, weil die meisten von jemandem beschossen werden, der unter eurer Wohnung lebt! Tja, da können wir nichts machen, aber Krime kann Feuerwaffen wieder interessanter machen! Krime Powermunition erhöht Mündungsblitz und akustischen Widerhall (das bedeutet "Schussgeräusch" - wieder was gelernt!) um eine Stufe! Leichte Pistolen klingen wie echte Pistolen! Gewehre klingen wie Schrotflinten! Schrotflinten klingen wie Sturmkanonen! Und Sturmkanonen klingen, als würde eure Mama euch nach Hause rufen, um eure Lebensentscheidungen zu überdenken!
ammotype.krime_penetrator.desc=Habt ihr jemals mit Schrot auf einen Paracritter geschossen, der euch dann einfach nur verächtlich angesehen hat? Old Man Krime ist das passiert. Offen gesagt wäre er wahrscheinlich weniger gekränkt, wenn sich das verfluchte Ding auf ihn gestürzt hätte. Aber er ist kein Mann, der einen solchen Affront einfach auf sich beruhen lässt, egal, welcher Scheißer dafür verantwortlich ist. Er schnappte sich seinen Notvorrat an Rum, sperrte sich in der Werkstatt ein und kam nur raus, um zu kacken und Essen aus der Kantine zu verschlingen. Dann kam er mit der Penetrators Schrotmunition raus! Also, eigentlich kam das Schrot zuerst, als es die Panzerplatte an der Werkstatttür durchschlug. Das Schrot besteht aus verchromtem Wolfram, die Treibladung ist gewaltig, knapp unterhalb der Belastungsgrenze heutiger Schrotflinten, was bedeutet, dass Old Man Krime jetzt nach dem Paracritter jagt, der ihn schief angesehen hatte! Und ihr könnt jetzt auch diese Munition haben!
ammotype.krime_heat.desc=Alte Technologie erhält durch Miniaturisierung ein neues Leben - die berüchtigten HEAT-Geschosse können die Größe einer Schrotflinten-Vollkugel erhalten. Diese Munition kann konventionelle Panzerplatten durchschlagen, wie sie bei schwach gepanzerten Zielen auf dem Schlachtfeld häufig sind, und ist auch nützlich, um richtige Panzerung zu schwächen und folgenden Schüssen eine höhere Chance auf einen Durchschlag zu verschaffen! Jetzt bestellen und einen Ratgeber für Erste Hilfe erhalten, der sich der Behandlung von Wunden durch diese Munition widmet! Nur für Schrotflinten erhältlich. Anmerkungen: Die Patrone in der Kammer explodiert bei einem Patzer, und die Hand des Schützen erleidet den Schaden der Munition. Bei einem Kritischen Patzer explodiert die gesamte Munition in der Waffe, und der Schütze erhält den gesamten Schaden aller Geschosse. In beiden Fällen wird die Waffe dabei zerstört.
ammotype.krime_laser.desc=Nein, das sind nicht wirklich Laser, aber wir arbeiten dran. Stattdessen lösen sie das Problem von Leuchtspurgeschossen, die andere ballistische Eigenschaften als normale "Kugeln" haben. Wir haben lange und mit etlichen Flaschen Wein an diesem Konzept gearbeitet und dann erkannt, dass wir an den ballistischen Eigenschaften der normalen Geschosse gar nichts ändern mussten. Wir mussten nur alle normalen Geschosse durch Leuchtspur ersetzen! Und wenn man sie aus automatischen Waffen abfeuert, sieht das aus wie ein verfluchter Laser! In Schachteln zu zehn Stück oder vorgeladen in Gürteln zu haben!
ammotype.krime_punisher.desc=Ihr habt gesprochen, und Krime hat euch erhört! Munition für Sturmkanonen ist scheißteuer und schwer zu bekommen, weil ein paar Länder Explosivmunition nicht mögen! Das ist jetzt vorbei – die Krime-Punisher-Munition ist zwar nur Blei im Stahlmantel (langweilig, wissen wir), aber sie wird aus einer KANONE abgefeuert! Und ihr könnt die Jungs am Schießstand endlich davon überzeugen, dass ihr die Kanone mitbringen dürft! Punisher-Munition bestraft euren Feind MAXIMAL!
ammotype.krime_selfdefense.desc=Klar, Krime hat den Ruf, an alle möglichen zwielichtigen Leute zu verkaufen. Wir versichern euch, dass das eine absurde Lüge ist. Nur die renommiertesten Waffenhändler führen unsere Ware! Aber bei der Selbstverteidigung im eigenen Heim gibt es viele Optionen auf dem Markt – sie alle helfen unseren Kunden dabei, sich zu verteidigen, helfen den Leuten in Blau dabei, endlich die echten Schurken zu fassen, und so weiter. Aber sie erfüllen immer nur einen dieser Zwecke. JETZT NICHT MEHR! Krime Splash bietet drei Vorteile in einem Geschoss! Die Außenhülle besteht aus einem Material, das sich beim Aufschlag verflüssigt und das Ziel mit einer nicht abwaschbaren Farbe bedeckt, die man beim Kauf wählt. Diese Farbe ist nur der Mantel über einer tüchtigen Portion glitzernder Mikro-RFID-Chips, die dem Ziel unter die Haut dringen, wenn seine Kleidung nicht wasserdicht oder chemisch isoliert ist. Diese Chips glitzern unter der Haut und senden zugleich in der Matrix. Schließlich kommt der Hauptteil, der euch schützt, solange der Eindringling euch noch gegenübersteht: ein einfaches Gelgeschoss, das genauso wirkt wie alle anderen auf dem Markt, die von fast allen Sicherheitskräften auf der Erde und auch etlichen außerhalb des Planeten benutzt werden! Schaltet sie an Ort und Stelle aus oder lasst sie gefasst werden – mit nur einer Kugel!
item.krime_cleaner.desc=Aufräumen ist nicht leicht – manchmal will man einfach eine Granate reinschmeißen und die Versicherung abkassieren. Krime hat die Lösung für solche Bedürfnisse! Die Cleaner-Granate bietet ein Sammelsurium an konzentrierten Reinigungsmitteln, die die Farben von Geweben schonen! Werft einfach die Granate in einen Raum, wartet fünf Minuten bei einer netten Tasse Soykaff, dann wischt alles sauber! Krime: mehr als nur Waffen! Jetzt durch internationale Übereinkünfte verboten.
item.krime_party.desc=Eine Splitter- und eine Schockgranate bekamen ein Kind, nachdem sie mit ein bisschen Feuerwerk und, äh, Papierschlangen rumgespielt haben? Die Krime Party ist eine Party im Kleinformat – die Scheißer im Raum werden umgelegt, die Überlebenden werden aufgemischt, und alle Stolperdrähte werden mit Licht und farbenfrohem Papier sichtbar gemacht. Jetzt mit der AR-Push-Technologie von MCT –zwingt allen im Zielbereich Musik eurer Wahl ins Ohr! Startet eine echte KRIME PARTY! Anmerkung: Macht zusätzlich 10B, 8B, 6B, 15m.
item.krime_runner.desc=Granate trifft auf einfache Drohne – das war das Konzept der Ablenkungsmaßnahme Krime Runner! Ein kräftiger Lautsprecher, der beliebige Sounds rausbrüllt, die ihr hochgeladen habt, und das Hindernisvermeidungssystem sorgt dafür, dass die Drohne auf ihrem Doppelkettenchassis mit 360 Grad Beweglichkeit immer weiterläuft. Schreit Schimpfworte aus sicherer Entfernung, macht Einbruchsgeräusche in einem Flur, während ihr durch einen anderen schleicht, treibt den Hund in den Wahnsinn! Recycelbar und versucht, zu einem Ursprungspunkt zurückzukehren, den man einprogrammieren kann!
item.krime_cocktails.desc=Einer unserer Erfinder trank einmal zu Mittag ein bisschen zu viel und beschloss, den absolut besten Cocktail zu machen, den Krime jemals verkauft hatte! Fünf Hauttransplantationen und eine Gehirnerschütterung später hatte er es geschafft – die Brandgranate Krime Cocktail! Diese napalmartige Geheimmischung raucht wie weißer Phosphor, ist viel humaner und eignet sich für den militärischen Einsatz oder für das Freudenfeuer am Wochenende! Immer noch von keinen wichtigen Ländern oder Megakonzernen verboten!
item.krime_stinger.desc=Schockgranaten sind schön und gut, aber sie werden immer weniger effektiv, weil Geräusch- und Blitzkompensationssysteme immer weiter verbreitet sind. Krime bereichert den Markt der kampfunfähig machenden Granaten mit der Stinger! Statt auf Blitz und Donner setzt die Krime Stinger auf eine Überwältigung des Ziels durch physische Einwirkung! Sie besteht aus einer recycelten Gummifassung und enthält 144 Gelkugeln, die bei der Detonation in alle Richtungen schießen, und Personen, die damit direkt in Kontakt kommen, erleben einen wirklich schwarzen Tag! Die Krime Stinger – legt sicher ein paar Drekbirnen flach!

item.krime_cleaner.variant.mini.desc=Aufräumen ist nicht leicht – manchmal will man einfach eine Granate reinschmeißen und die Versicherung abkassieren. Krime hat die Lösung für solche Bedürfnisse! Die Cleaner-Granate bietet ein Sammelsurium an konzentrierten Reinigungsmitteln, die die Farben von Geweben schonen! Werft einfach die Granate in einen Raum, wartet fünf Minuten bei einer netten Tasse Soykaff, dann wischt alles sauber! Krime: mehr als nur Waffen! Jetzt durch internationale Übereinkünfte verboten.
