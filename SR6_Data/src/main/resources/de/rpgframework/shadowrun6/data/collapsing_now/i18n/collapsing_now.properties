dataset.name=Collapsing Now
dataset.name.short=COLL
dataset.desc=<b>DO THE COLLAPSE!</b><br/><br/>\
 Some are careful, others are chaotic. Some are new, others old. Some are ruthlessly calculating and logical, others have only the barest acquaintance with sanity. But they’re all in the shadows, they’re all dangerous, and they’re all things you need to know.<br/><br/>\
 <em>Collapsing Now</em> details ten organizations poised to make an impact on the ever-shifting structures of the Sixth Word—ten organizations shadowrunners could encounter. Maybe they’ll be helpful, maybe harmful, maybe both, but whatever the case, runners need to know what they’re about. Because the last thing a good runner ever wants to be is surprised.<br/><br/>\
 <em>Collapsing Now</em> is a Runner Resource bookfor Shadowrun, Sixth World.

