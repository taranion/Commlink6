quality.shifter_functional_tail=Functional Tail
quality.shifter_functional_tail.page=16
quality.shifter_functional_tail.desc=Read the specific tail description
quality.shifter_functional_tail.choice.variant.balance=Balance
quality.shifter_functional_tail.choice.variant.balance.desc=Usually between one and two meters long, a balance tail is not under your conscious control. It functions instinctively by twitching, swaying, and wrapping around things at random to improve your balance. You gain a bonus point of Edge for all Athletic tests related to balance, climbing, gymnastics, or jumping. This Edge must be used on the test or it is lost.
quality.shifter_functional_tail.choice.variant.paddle=Paddle
quality.shifter_functional_tail.choice.variant.paddle.desc=An alligator’s or dolphins’ powerful tail strokes propel them through the water faster. You gain a bonus point of Edge on all Athletics (Swimming) tests, and an additional +2 meters of movement per hit when sprinting while swimming.
quality.shifter_functional_tail.choice.variant.prehensile=Prehensile
quality.shifter_functional_tail.choice.variant.prehensile.desc=This functions like the balance tail, except you can control it as if it were an extra limb. The tail can pick up items, though it lacks fine digits and has difficulty with fine manipulation. Basic tasks that normally do not require tests such as pressing a button or pulling a trigger require a successful Body + Agility (3) test for you to pull off. The tail has an effective Strength attribute equal to half your Strength (round down). Snake forms are an exception to this and use their full Strength attribute. You can hang by your tail when desired. Prehensile tails do not provide extra actions or attacks.
