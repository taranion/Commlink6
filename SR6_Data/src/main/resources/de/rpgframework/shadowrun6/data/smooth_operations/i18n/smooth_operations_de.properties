mentorspirit.chaos=Chaos
mentorspirit.chaos.page=116
mentorspirit.chaos.disadvantage=Du bist ein unverbesserliches Klatschmaul, das versucht, Unruhe zu stiften, am liebsten in Freundschaften. Deshalb kannst du auch keine belastenden Geheimnisse für dich behalten. Außerdem musst du, wann immer du (nach Entscheidung der Spielleitung) eine öffentliche Situation als zu ruhig oder ausgeglichen empfindest, eine Probe auf Willenskraft + Intuition (3) ablegen. Misslingt sie, bist du gezwungen, auf irgendeine Art für Unruhe zu sorgen, sei es durch einen Angriff, Lügen oder indem du auf irgendwem einen Drink verschüttest.
mentorspirit.moon=Mondin
mentorspirit.moon.page=116
mentorspirit.moon.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, bevor du eine direkte Konfrontation beginnen kannst; ein Misslingen bedeutet, dass du keine Handlung unternehmen kannst, die konfrontativ ist. Verhandlungen gelten nicht als Konfrontation (Mondin liebt Diskussionen), aber ein Streit zählt sehr wohl in diese Kategorie.
mentorspirit.peacemaker=Friedensstifter
mentorspirit.peacemaker.page=117
mentorspirit.peacemaker.disadvantage=Du siehst sogar in Angehörigen der Gegenseite potenzielle Freundschaften und versuchst alles, um zu vermeiden, dass du jemandem wehtust, es sei denn, es ist in einer Situation wirklich zwingend notwendig. Zu Beginn eines Kampfes musst du eine Probe auf Intuition + Charisma (3) ablegen; ein Misslingen bedeutet, dass du während dieses Kampfes keine Handlungen durchführen kannst, die bei jemandem körperlichen Schaden hervorrufen. Am Beginn einer neuen Kampfrunde kannst du dich entscheiden, die Probe zu wiederholen, wenn du beim ersten Versuch versagt hast und du oder ein Mitglied deines Teams in der vorigen Kampfrunde Schaden erlitten haben.

