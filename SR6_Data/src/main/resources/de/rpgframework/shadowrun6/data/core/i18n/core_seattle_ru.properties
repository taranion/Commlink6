item.ballistic_hood.desc=Менее приметный, чем шлем или маска, этот капюшон из баллистической ткани добавляет +1 к значению защиты брони.
item.ballistic_hood_armor.desc=Менее приметный, чем шлем или маска, этот капюшон из баллистической ткани добавляет +1 к значению защиты брони.
item.disposable_cloak.desc=Повседневный аксессуар сиэтлских улиц от дождя со стандартным водоотталкивающим покрытием.
item.armorweave_cloak.desc=Плащ из прочной бронеткани (+1 к значению защиты) с ёмкостью 4 для модификаций брони.
item.tres_chick_cloak.desc=Роскошный дизайнерский плащ с защитой от дождя и лёгким бронированием.
item.water_repellent_coating.desc=Специальное водоотталкивающее покрытие для борьбы с вечными сиэтлскими дождями.
item.mapmaster_sensor_fob.desc=Портативный лидарный сенсорный брелок для точной навигации в туннелях Подземного Сиэтла без связи с Матрицей.
item.mapmaster_drone.desc=Мини-дрон на базе Flying Eye с лидаром и сонаром для автоматического трёхмерного картирования туннелей.
