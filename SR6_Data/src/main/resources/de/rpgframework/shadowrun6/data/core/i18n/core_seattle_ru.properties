quality.you_get_used_to_it.desc=Оберн полон токсинов — от воздуха и воды до грязи, в которой вы играли ребёнком. Выживают не все, но те, кто выжил, становятся закалёнными.<br/>Получите +1 к Телу для любых проверок сопротивления токсинам.
quality.i_belong_here.desc=Люди, проводящие время рядом с охраной, учатся общаться с ней так, чтобы всё проходило гладко. В Бельвю это знают лучше всего: копы здесь, чтобы защищать их, а не арестовывать.<br/>Вы получаете очко Преимущества на все социальные взаимодействия с местной службой безопасности.
quality.salish_shaman.desc=Учились ли вы у шаманов сэлишей или изгнанника с острова Совета, ваше использование реагентов вдвое эффективнее.<br/>Использование реагентов для вашей традиции требует вдвое меньше обычного количества (с округлением вверх, минимум 1).
quality.big_brothers_blindspot.desc=На заднем дворе мегакорпораций категории ААА уединение — редкость. У вас обострённое чутьё на слежку, позволяющее ускользать от камер.<br/>Получите бонусное очко Преимущества на проверки Скрытности при уклонении от технического наблюдения (камеры, сенсоры).
quality.northgate_optimist.desc=Пребывание в Эверетте наполняет вас энергией и энтузиазмом, заражающим окружающих.<br/>Персонажи получают бонусное очко Преимущества на любые социальные проверки с жителями или работниками Эверетта.

quality.bilko_contacts.desc=В прошлом вы обзавелись преданным контактом в Форт-Льюисе. Снаряжение или информацию достать легче и дешевле.<br/>Доступность снаряжения снижается на -1/-2, а показатель связи контакта увеличивается на +1/+2.
quality.water_born.desc=Вы провели столько времени на островах, что жизнь в воде стала вашей второй натурой.<br/>Базовая скорость плавания увеличивается на 1 метр за каждый уровень этого качества (максимум 2).
quality.the_briar_patch.desc=Матрица в Пуйаллупе полна слепых зон. Те, кто здесь вырос, знают все лазейки.<br/>При взломе из Пуйаллупа снижайте показатель ОС на 1 за каждое выполненное незаконное действие.
quality.what_doesnt_kill_you.desc=Пуйаллуп — суровое место: кислотный туман, пепел и болезни. Те, кто выжил, стали крепче.<br/>Замените один кубик в пуле на дикий кубик при любых проверках сопротивления болезням или токсинам.
quality.good_ol_folks.desc=Вы выросли в сельской местности и знаете, как сойти за «деревенского парня».<br/>Получите очко Преимущества при социальных взаимодействиях с сельскими жителями.
quality.clean_living.desc=Вы выросли в житнице и всегда питались лучшей натуральной едой.<br/>Увеличьте Тело на 1 без затрат Кармы, но увеличивайте расходы на образ жизни на 500 ¥ в месяц.
quality.import_export.desc=С таким количеством портов грех не знать, что прибывает в город.<br/>Получите особый контакт (фиксер из Такомы) со связью 3 или 4 и Преимуществом на переговоры о сделках.
quality.import_export.choice.variant.regular.desc=Обычный
quality.import_export.choice.variant.better.desc=Улучшенный
quality.mental_mapmaker.desc=Вы так долго жили в Подземном Сиэтле, что способны удерживать трёхмерную карту в голове.<br/>Вы никогда не заблудитесь в замкнутых помещениях и туннелях, даже в полной темноте.

