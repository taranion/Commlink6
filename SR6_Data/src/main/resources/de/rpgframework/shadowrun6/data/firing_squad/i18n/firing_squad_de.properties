martialart.52blocks.desc=Dieser Stil ist unter vielen Namen bekannt, hat sich  aus Kampfstilen afroamerikanischer Sklaven entwickelt und wurde im 20. Jahrhundert von Insassen der amerikanischen Haftanstalten weiterentwickelt. Der Stil ist höchst defensiv und mobil, wie aus den \u201E52 Blocks\u201C abzulesen ist, die ihm den Namen gaben, und umfasst auch Schlag- und Messer-Techniken.
martialart.aikido.desc=Aikido ist weithin als pazifistische Kampfkunst bekannt und ist eine \u201Eweiche\u201C Kampfkunst, die darauf setzt, die Kraft des Gegners gegen ihn selbst zu wenden. Die Techniken sind fast ausschließlich defensiv und konzentrieren sich auf das Entwaffnen und Behindern von Angreifern, ohne diesen Schaden zuzufügen. Aikido hat auch ein starkes spirituelles Element und kombiniert traditionelle buddhistische und Shinto-Glaubensinhalte mit einer Philosophie des Friedens und der Gewaltlosigkeit.<br/>Ähnliche Stile: Baguazhang (China), Taijiquan (China)
martialart.arnis.desc=Arnis (auch als Arnis de mano, Escrima oder Kali bekannt) ist ein Überbegriff für mehrere philippinische Kampfkünste und setzt auf den Einsatz von Paaren von Rattan-Stöcken (baston) oder Dolchen (baraw/daga) sowie auf längere stumpfe und Klingenwaffen, waffenlose Schläge und Gelenksperren.<br/>Ähnliche Stile: Banshay (Myanmar), Gatka/Shastar Vidya (Indien), Krabi-Krabong (Thailand), Nguni-Stockkampf (Azanien)
martialart.bartitsu.desc=Diese Kampfkunst ist als die \u201EGentleman-Kampfkunst\u201C bekannt, die von literarischen Helden wie Sherlock Holmes und John Steed berühmt gemacht wurde; sie nutzt Gehstöcke oder Regenschirme \u2013 die man in alten Zeiten durchaus alltäglich dabeihatte \u2013 als Waffen zur Selbstverteidigung.<br/>Ähnliche Stile: Bataireacht (Tír na nÓg)
martialart.boxing.desc=Ah, die guten alten Faustschläge. Boxen ist die uralte Kunst, jemanden zu verprügeln, bis er zu Boden geht \u2013 hoffentlich, bevor man selbst verprügelt wird, bis man zu Boden geht. Die Stile einzelner Boxer sind sehr unterschiedlich \u2013 einige sind höchst mobil und decken den Gegner mit einem Hagel von Schlägen ein, andere halten einfach die Angriffe des Gegners aus, bis sie ihn mit einem einzigen Schlag umhauen. Das wichtigste Unterscheidungsmerkmal ist, dass sich Boxen, anders als andere Kampfkünste, nur auf die Fäuste verlässt.<br/>Ähnliche Stile: Dornálaiocht (Tír na nÓg)
martialart.capoeira.desc=Capoeira wurde in Amazonien (damals Brasilien) von Sklaven afrikanischer Abstammung entwickelt, die ihre Kampfkunst als Tanz tarnten, um nicht erwischt zu werden. Weil die Hände der Sklaven oft in Ketten lagen und sie sich mit den Armen nicht effektiv verteidigen oder angreifen konnten, setzt Capoeira vor allem auf weite Ausweichbewegungen und Beintechniken wie Tritte und Beinfeger.<br/>Ähnliche Stile: Engolo (Angola)
martialart.chakram_fighting.desc=Das Chakram ist ursprünglich eine Wurfwaffe vom indischen Subkontinent, die aber in weiten Teilen Asiens benutzt wurde. Es hat meistens die Gestalt eines geschärften Rings, der als Schmuck getragen wird, bis er im Kampf gebraucht wird. Das Chakram kann auch als geschärfter Schlagring getragen werden, wenn man bereit ist, Schnitte in der eigenen Hand zu riskieren.<br/>Ähnliche Stile: Shurikenjutsu (Japan)
martialart.close_quarters_combat.desc=Ein Überbegriff für praktisch ausgerichtete, \u201Etaktische\u201C Kampfkünste, die für den Einsatz bei Polizei und Militär entwickelt wurden und keine traditionellen Stile sind, die ins Heute übernommen wurden. Sie umfassen häufig verschiedene Ringen- und Schlag-Techniken, darunter auch solche mit Schlagstöcken, das Entwaffnen und Methoden des Einsatzes von Feuerwaffen als Nahkampfwaffen.<br/>Ähnliche Stile: Krav Maga, MCMAP, Systema
martialart.european_fencing_longsword.desc=Das Langschwert ist eine von vielen Waffen, die die Fahne der \u201Ehistorischen europäischen Kampfkünste\u201C hochhalten, und ist das archetypische Schwert, das im mittelalterlichen Europa eingesetzt wurde. Seine Renaissance in der Sechsten Welt lag an der Wiederentdeckung von Handbüchern, die von Meistern wie Fiore dei Liberi und Johann Liechtenauer geschrieben wurden. In der Folge gewann es an Beliebtheit bei Straßensamurai, die das Katana für überschätzt halten. Ursprünglich war diese Waffe für das Schlachtfeld gedacht, aber das Fechten mit dem Langschwert ist perfekt für Leute geeignet, die Horden von Gegnern mit einem Schlag niedermähen wollen.
martialart.european_fencing_rapier.desc=Hierbei handelt es sich nicht um modernes Sportfechten, sondern eher um die Kampfstile von Bonetti, Capo Ferro, Thibault, Agrippa und diesem einen klassischen Flachfilm-Duell aus den 1980ern. Der Großteil des Fechtens im 21. Jahrhundert basiert auf Techniken, die ihren Ursprung in Frankreich und Italien haben, wobei in den letzten Jahren auch der spanische Stil la verdadera destreza an Beliebtheit gewonnen hat. Europäische Duellanten führten zu ihren Rapieren oft Waffen wie Dolche in der Nebenhand, was als Tradition bis in die modernen Zeiten überlebt hat.
martialart.jeet_kune_do.desc=Der Stil des Jeet Kune Do wurde vom legendären Kampfkünstler Bruce Lee entwickelt, indem er Elemente vieler existierender Kampfkünste kombinierte und dabei alles aufnahm, \u201Ewas funktionierte\u201C. Diese Philosophie verfolgen auch die Anwender der Mixed Martial Arts, die oft sowohl Ringen- als auch Schlag-Stile studieren (eine populäre Kombination besteht aus Jiu Jitsu und Muay Thai), um im Ring effektiv zu sein.<br/>Ähnliche Stile: Hapkido (Korea)
martialart.jogo_do_pao.desc=Jogo do Pao wurde in Portugal entwickelt und ist im Grunde der Kampf mit dem Stab. Es hat sich aus Techniken entwickelt, die Bewohner ländlicher Gebiete nutzten, um wilde Tiere mit langen Wanderstöcken abzuwehren. Seine Popularität ging zurück, als immer mehr Leute in die Städte zogen, aber es gab genügend Anhänger, dass sich der Stil bis in die Sechste Welt retten konnte.<br/>Ähnliche Stile: Ball de bastons (iberische Halbinsel), Canne de combat (Frankreich)
martialart.jujutsu.desc=Jiu Jitsu ist (wie seine Sportvariante Judo) ein waffenloser Kampfstil aus Japan, der vor allem auf Griff-, Festhalte- und Wurftechniken setzt. Diese Kampfkunst wird oft von Polizisten gelernt, um Verdächtige zu entwaffnen und festzunehmen, und von Rausschmeißern, um unerwünschte Gäste nach draußen zu geleiten.<br/>Ähnliche Stile: Malla-yuddha (Indien), Sambo (Russland), Shuai Jiao (China)
martialart.karate.desc=Karate ist eine der ersten asiatischen Kampfkünste, mit denen die westliche Welt in Kontakt kam, stammt aus Okinawa und nutzt vor allem Schläge, wobei im Besonderen Fäuste und andere Teile der Hand zum Einsatz kommen (\u201EKarate\u201C bedeutet \u201Eleere Hand\u201C). Tritt-Techniken sind im Karate relativ weit verbreitet, Ringen und Waffeneinsatz eher seltener.<br/>Ähnliche Stile: Tang Soo Do (Korea)
martialart.kenjutsu.desc=Kenjutsu ist bei Straßensamurai und allen Leuten, die in Hörweite eines Liebhabers japanischer Kultur sind, ein bekannter Begriff und bezeichnet den Kampf mit dem japanischen Schwert. Es wird sehr stark mit dem Katana assoziiert, aber die meisten Kenjutsu-Stile umfassen auch Techniken zum Einsatz des Kodachi/ Wakizashi (des kurzen Schwerts) und des Tanto (des Dolchs) sowie die verwandte Kunst des Battojutsu/ Iaijutsu (die Kunst, das Schwert mit einer einzigen Bewegung zu ziehen und anzugreifen). Die Sportvariante Kendo ist in Japan sehr populär.<br/>Ähnliche Stile: Geom Beop (Korea)
martialart.kickboxing.desc=Wie man schon am Namen sehen kann, ist Kickboxen eine Art des Boxens, bei der auch die Füße zum Einsatz kommen \u2013 und oft auch Ellbogen, Knie und andere Körperteile wie der Kopf. Ähnlich wie die verwandte Kampfkunst, die nur Fäuste einsetzt, konzentriert sich das Kickboxen fast ausschließlich auf Schläge, und Ringenangriffe oder Waffengebrauch kommen nur selten vor (obwohl es Kickbox-Stile gibt, die auch auf Waffen setzen).<br/>Ähnliche Stile: Lethwei (Myanmar), Muay Boran/Muay Thai (Thailand), Muay Lao (Laos), Musti-yuddha (Indien), Pradal Serey (Kambodscha), Sanshou (China)
martialart.kung_fu.desc=Eigentlich bezeichnet der Begriff Kung Fu eine Gruppe von Kampfkunststilen, wird aber meistens für die \u201Eäußeren\u201C oder \u201Eharten\u201C Stile verwendet, die sich durch dynamische, körperlich anstrengende Techniken mit starker Betonung auf Schläge auszeichnen.<br/>Populäre Beispiele für Kung-Fu-Stile sind der Stil der Fünf Tiere, der Shaolin-Stil, Wing Chun und Wushu.<br/>Ähnliche Stile: Silat/Pentjak-Silat (Indonesien), Silat Melayu (Malaysia), Shorinji kempo (Japan)
martialart.kung_fu_18.desc=Historisch gesehen war das Studium des bewaffneten Kampfes genauso Teil vieler Kampfkünste wie das der waffenlosen Techniken. In China waren die vier wichtigsten Waffen der Kampfkünste der Speer (qiang), der Stab (gun), der Säbel (dao) und das gerade Schwert (jian). Dazu kamen exotischere Waffen wie Hellebarde, Dreifachstab und der Seilspeer.<br/>Ähnliche Stile: Bojutsu (Japan), Kobudo (Okinawa), Stabkampf
martialart.kyujutsu.desc=Kyujutsu ist eine japanische Art des Bogenschießens, bei der meistens lange Bögen namens yumi zum Einsatz kommen, die manchmal größer als der Schütze selbst sein können. Diese Kampfkunst wurde ursprünglich von den Samurai betrieben und kam mit der Einführung von Feuerwaffen aus der Mode, wurde aber aus kulturellen und praktischen Gründen in der Sechsten Welt wieder populär.<br/>Ähnliche Stile: Türkisches Bogenschießen (Türkei)
martialart.ninjutsu.desc=Ninjas sind in der Populärkultur zwar vor allem als Assassinen bekannt, waren historisch betrachtet aber eher Einbrecher und Spione. Im Gegensatz zu den Samurai (und Runnern ganz ähnlich) waren Ninjas bereit, alle möglichen \u201Eunehrenhaften\u201C Techniken einzusetzen, um Kämpfe zu gewinnen und ihre Ziele zu erreichen. Heimlichkeit und das schnelle Ausschalten von Gegnern waren die wichtigsten Gebote des Ninjutsu (manchmal auch als taijutsu bekannt). Ninja-Kampfkünste umfassen auch viele Waffen-Techniken, vor allem den Gebrauch von Shuriken.
martialart.okichitaw.desc=Okichitaw ist eine der wenigen ursprünglich nordamerikanischen Kampfkünste, die bis in die Sechste Welt überlebt haben, und stammt von den Cree der Great Plains in Nordamerika. Der Stil ist sehr aggressiv und setzt auf das Ausschalten von Gegnern, indem man sie schnell zu Boden bringt. Die Hauptwaffe des Okichitaw ist die Gewehrschaft-Kriegskeule, obwohl auch Tomahawk und Dolch eingesetzt werden.
martialart.parkour.desc=Parkour ist bei genauerer Betrachtung eigentlich keine Kampfkunst und wurde als Form der schnellen und effektiven Bewegung durch unwegsame städtische Umgebungen entwickelt. Viele Techniken, die bei Parkour eingesetzt werden, können an Kampfkünste angepasst werden, um einen taktischen Vorteil gegenüber dem Gegner zu bekommen oder einfach nur schnell vor einem Kampf zu fliehen, den man nicht hätte beginnen sollen.
martialart.tae_kwon_do.desc=Wie sein japanisches Pendant Karate entstand Taekwondo aus einheimischen (in diesem Fall koreanischen) Kampfstilen und äußeren Einflüssen des Kung Fu aus China. Taekwondo ist berühmt für beeindruckende hohe und Drehtritte, die oft von schnellen Schlägen mit der Hand begleitet werden, und ist in Korea immer noch eine der populärsten Kampfsportarten.<br/>Ähnliche Stile: Savate (Frankreich)
martialart.the_cowboy_way.desc=Die Kampfkunst, die heute als Cowboykampf bezeichnet wird, wurde durch Flachfilme populär, die im amerikanischen Westen spielten. Sie setzt auf das Fesseln des Feindes mit dem Lasso aus der Entfernung und hat ihre Ursprünge wahrscheinlich bei den Hunnen und anderen Nomadenvölkern Zentralasiens. Die Zugabe von Faustschlägen, Revolvertricks und großen Hüten ist fast sicher amerikanischen Ursprungs.<br/>Ähnliche Stile: Latigo y daga (Philippinen), Nawajutsu (Japan), Peitschenkampf
martialart.wrestling.desc=Ringen ist zwar eine extrem weit gefasste Kategorie (ähnlich wie Kung Fu), besteht aber allgemein betrachtet darin, einen Teil des Gegners (oder seiner Kleidung) zu ergreifen, ihn dann zu einer Brezel zu verbiegen und auf den Boden zu drücken, bis er winselnd aufgibt. In manchen Fällen, wie im japanischen Sumo, kann man auch siegen, indem man den Gegner aus dem Ring drängt.
martialart.careomeleg.desc=Diese berühmte elfische Kampfkunst setzt auf schnelle, akkurate Treffer (waffenlos und mit verschiedenen Klingenwaffen) und eine höchst bewegliche Verteidigung, was oft zu der Behauptung geführt hat, es gäbe bei Carromeleg \u201Ekeine Kampfpositionen\u201C. Immer wieder wird behauptet, dieser Stil stamme eigentlich aus einem früheren Zeitalter der Welt, und traditionell gesinnte Lehrer nehmen nur Elfen als Schüler auf. Aber eine Handvoll der Meister dieser Kunst haben begonnen, ihren Stil auch Nicht-Elfen zu vermitteln, was zu vielen Unstimmigkeiten innerhalb der Carromeleg-Gemeinde geführt hat (so sind die Dinge nun mal).
martialart.gun_kata.desc=Gun Kata (auch als Gun Fu bekannt) ist in den Flachfilmen des 20. Jahrhunderts eher eine Show- als eine Kampfkunst, hat aber in einem Zeitalter der übernatürlich und technologisch verbesserten Reflexe und Zielgenauigkeit eine neue praktische Bedeutung erlangt.<br/>Der Stil setzt auf die Verwendung von Pistolen im Nahund Fernkampf, und viele Kampfkünstler modifizieren ihre Waffen, um deren Stabilität im Nahkampf zu erhöhen (oder die lästigen Warnungen der Smartlinks über \u201Efalsche Schusspositionen\u201C abzuschalten).<br/>Gun Kata hat sich ein bisschen vom Showcharakter seiner Ursprünge erhalten, und die Stilisten der Kunst setzen auch Akrobatik und Kunstschüsse ein.
martialart.hapsum_do.desc=Adepten setzen viele Kampfkunststile mit furchterregender Effektivität ein, aber Hapsum-Do (oder der Weg des Vereinigten Mana) ist der erste Kampfkunststil, der speziell entworfen wurde, um sich die übernatürlichen Kräfte von Adepten zunutze zu machen.<br/>Großmeister \u201EBarghest\u201C Knorr, ein Adept, der die Welt bereist, um seine Techniken zu vermitteln, gilt weithin als Erfinder des Stils. Hapsum-Do ähnelt anderen \u201Ehybriden\u201C Kampfkünsten, bei denen Ringen- und Schlag-Techniken benutzt werden (und ist daher in mancher Hinsicht auch für Nicht-Adepten nützlich), aber einige Techniken setzen auf die Erwachten Fähigkeiten des Kämpfers, um effektiv zu wirken.
martialart.lone_star_tactical.desc=Diese beiden Kampfsysteme, die von den Polizeifirmen  entwickelt wurden, deren Namen sie tragen, sind bei genauerer Betrachtung Interpretationen der Sechsten Welt von Nahkampftechniken des 20. Jahrhunderts. Die Anwender beider Stile schwören, dass ihr Ansatz völlig anders sei als der jeweils andere. Aber in Wirklichkeit haben es Knight Errant und Lone Star in ihrem Dienst mit denselben Situationen zu tun, und die Ansätze beider Kons zum Umgang mit diesen Situationen sind im Prinzip ähnlich. Der Hauptunterschied zwischen den beiden Stilen besteht darin, dass Knight Errant mehr auf das Entwaffnen einzelner Personen setzt (man kann nie wissen, ob man es mit einem SIN-Menschen zu tun hat, der eine Beschwerde mit nachfolgenden PR-Schwierigkeiten einreicht), Lone Star hingegen eher auf Aufstandsbekämpfung Wert legt.
martialart.knight_errant_tactical.desc=Diese beiden Kampfsysteme, die von den Polizeifirmen  entwickelt wurden, deren Namen sie tragen, sind bei genauerer Betrachtung Interpretationen der Sechsten Welt von Nahkampftechniken des 20. Jahrhunderts. Die Anwender beider Stile schwören, dass ihr Ansatz völlig anders sei als der jeweils andere. Aber in Wirklichkeit haben es Knight Errant und Lone Star in ihrem Dienst mit denselben Situationen zu tun, und die Ansätze beider Kons zum Umgang mit diesen Situationen sind im Prinzip ähnlich. Der Hauptunterschied zwischen den beiden Stilen besteht darin, dass Knight Errant mehr auf das Entwaffnen einzelner Personen setzt (man kann nie wissen, ob man es mit einem SIN-Menschen zu tun hat, der eine Beschwerde mit nachfolgenden PR-Schwierigkeiten einreicht), Lone Star hingegen eher auf Aufstandsbekämpfung Wert legt.
martialart.oni_ryu_taijutsu.desc=Die Oni Do Kai sind eine Gruppe von Yakuza-\u201ENinjas\u201C (Freiberuflern), die beinahe vollständig aus Orks und Trollen besteht. Schon früh erkannten die Mitglieder der Oni Do Kai, dass ihre beeindruckende Größe und Stärke in dem Land ein Nachteil sein könnte, das Judo und Jiu Jitsu hervorbrachte, und passten ihren Stil des Ninjutsu an, sodass diese Schwächen zu Stärken wurden \u2013 und so entstand Oni-ryu Taijutsu.<br/>Niemand weiß genau, warum die Oni Do Kai beschlossen, ihre Techniken an Außenseiter zu vermitteln, aber das hat die Orks und Trolle in Japan (und in anderen Ländern mit großen japanischen Gemeinden) nicht davon abgehalten, scharenweise Kurse zu buchen. Nachdem sich die Oni Do Kai mehr oder weniger an die Öffentlichkeit gewagt hatten, taten es ihr andere Kampfkunstgruppen gleich, die Stile für Orks und Trolle entwickelten (mit Namen wie Trog Kwan D
martialart.sangre_y_acero.desc=Nach der Erfindung brauchbarer Cybergliedmaßen in den 2030ern war es nur eine Frage der Zeit, bis jemand Cybergliedmaßen entwarf, die für den Kampf optimiert waren. Sangre y Acero (auch bekannt als Etzilitzli und Ars Cybernetica) entstand in den Gladiatorengruben von Tenochtitlán und setzt die Vorteile von Cybergliedmaßen, vor allem gegen andere Nahkampfwaffen, bestmöglich ein.
martialart.wildcat.desc=Als die Sioux Wildcats 2080 endlich das Verbot von Cyberware für ihre Einheiten aufhoben, konnte noch niemand sagen, ob ihre eigene Kampfkunst darunter leiden oder davon profitieren würde. Es ist immer noch nicht klar, aber der Stil (eine Mischung aus Okichitaw, Aikido, Karate und Muay Thai, bei der Gegner so schnell wie möglich ausgeschaltet werden sollen) ist so effektiv wie eh und je \u2013 vor allem gegen Gegner ohne Bodytech, wie die Erzrivalen von den Tír Ghosts.


technique.baton_lock.desc=In den Händen eines geübten Kämpfers können Stöcke verschiedener Länge zum Festhalten eingesetzt werden. Beim Einsatz einer stumpfen Waffe kannst du jede Technik der Kategorie Ringen, die du gelernt hast, einsetzen, als hättest du keine Waffe, und kannst dabei den Schaden der Waffe (wenn angebracht inklusive Erhöhung durch Präzise Schläge) statt des waffenlosen Grundschadens verwenden.
technique.ballestra.desc=Senke den Würfelpolmalus für Ziel ansagen mit Klingenwaffen um 1.
technique.bending_of_the_reed_melee.desc=Du erhältst 1 Edge zusätzlich, wenn du die Nebenhandlung Ausweichen gegen Nahkampfangriffe durchführst.
technique.bending_of_the_reed_ranged.desc=Du erhältst 1 Edge zusätzlich, wenn du die Nebenhandlung Ausweichen gegen Fernkampfangriffe durchführst.
technique.close_quarter_firearms_handguns.desc=Beim Einsatz einer Holdout-, Leichten, Schweren oder Automatikpistole oder eines Tasers im Nahkampf kann diese Feuerwaffe als Knüppel gelten, was Kampfkunsttechniken betrifft. Die Spielleiterin entscheidet, ob ein Schlag mit einer nicht verstärkten Waffe dieser Schaden zufügt oder sie sogar zerstört.
technique.close_quarter_firearms.desc=Beim Einsatz eines Gewehrs oder einer Maschinenpistole im Nahkampf kann diese Feuerwaffe als Knüppel gelten, was Kampfkunsttechniken betrifft. Die Spielleiterin entscheidet, ob ein Schlag mit einer nicht verstärkten Waffe dieser Schaden zufügt oder sie sogar zerstört.
technique.defiant_dance.desc=Wenn sich ein Charakter in einem Ringen-Griff (SR6, S. 113) befindet, kann er versuchen, sich loszureißen, indem er eine Probe auf Athletik + Geschicklichkeit ablegt, statt seine normale Probe auf Nahkampf + Stärke zu verwenden. Die Nettoerfolge des Gegners bei der ursprünglichen Vergleichenden Stärkeprobe, um den Charakter in den Griff zu bringen, gelten als Schwellenwert für die Entkommen-Probe.
technique.dim_mak.desc=Indem ein Angesagtes Ziel gegen eine bestimmte Gliedmaße benutzt wird, kannst du bei einem erfolgreichen Angriff der betreffenden Gliedmaße den Status Gelähmt I (S. 118) zufügen, statt Schaden zu verursachen. Je 2 Nettoerfolge erhöhen die Stufe des Status um 1. Jede Stufe des Status bleibt für [Nettoerfolge beim Angriff] Kampfrunden bestehen.
technique.drunken_boxing.desc=Du bist dazu ausgebildet, dich auf unberechenbare Weise zu bewegen und anzugreifen, was sowohl ein Vorteil als auch ein Nachteil sein kann. Die Anzahl an Einsen, bei denen ein Patzer im waffenlosen Angriff entsteht, wird wegen deiner schlampigen Ausführung um 1 gesenkt, aber andererseits erhält dein Ziel einen Würfelpoolmalus von -2 auf Verteidigungsproben gegen diese Angriffe, weil deine Bewegungen so schwer vorauszuahnen sind.
technique.elbows_tight.desc=Du erhältst beim Einsatz der Nebenhandlung Blocken ohne Waffe 1 Edge. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.end_them_rightly.desc=Du kannst beim Einsatz einer Nahkampfwaffe den Vorteil der Technik Antäuschen für den Angriff mit einer Wurfwaffe statt der Nahkampfwaffe nutzen. Wenn die Wurfwaffe an der Nahkampfwaffe angebracht ist, kannst du sie abnehmen und werfen, wobei du für die dazu erforderliche Handlung Waffe bereit machen nur eine Nebenhandlung benötigst.
technique.entanglement.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung (S. 107), aber ohne die Edge-Kosten. Wenn du exotische Waffen wie Peitschen, Ketten, Bolas und Lassos für einen Ringen-Angriff benutzt, lege eine Probe auf Exotische Waffen + Geschicklichkeit gegen Geschicklichkeit + Reaktion ab. Gelingt die Probe, wird der Gegner nicht nur gefesselt, sondern du kannst mit einer Nebenhandlung die Waffe loslassen, sodass sie den Gegner weiter festhält und du dich anderen Dingen zuwenden kannst. Wenn die Anzahl der Nettoerfolge deines Angriffs höher ist als die Geschicklichkeit des Gegners, erhält er für [Anzahl der Nettoerfolge des Angriffs] Kampfrunden den Status Humpelnd.
technique.feint.desc=Wenn du eine Nebenhandlung ausgibst und dir eine Probe auf Nahkampf + Geschicklichkeit (3) gelingt, erhält dein Ziel einen Würfelpoolmalus von -3 auf  seine Verteidigungsprobe gegen deinen nächsten Nahkampfangriff. Muss zusammen mit einer Haupthandlung Angriff eingesetzt werden (kumulatives Antäuschen ist nicht möglich).
technique.flying_kick.desc=Du hast dich selbst zu einem metamenschlichen Projektil ausgebildet und kannst die Gegner mit deinen fliegenden Füßen des Zorns niederstrecken. Wenn du eine Nebenhandlung ausgibst und dir eine Probe auf Athletik + Geschicklichkeit (3) gelingt, kannst du die Reichweite Sehr nah um 0,5 Meter pro Erfolg (nicht Nettoerfolg) und den Schadenswert um 2 erhöhen. Dies ist kumulativ mit der Erhöhung durch die Technik Fußtritt (S. 115).<br/>Ein Patzer bei der Probe auf Athletik + Geschicklichkeit für den Absprung oder bei der Angriffsprobe mit Nahkampf + Geschicklichkeit führt allerdings dazu, dass du bis zu deiner nächsten Handlung den Status Außer Balance (S. 118) erhältst. Ein Kritischer Patzer bei einer der beiden Proben lässt dich stolpern, wodurch du in den Status Liegend gelangst und den Status Gelähmt II (S. 118) an einem deiner Beine (zufällig bestimmt) erleidest, weil du deine Gelenke auf eine Weise verdrehst, für die sie nicht gedacht waren.
technique.ground_fighter.desc=Du bist daran gewöhnt, dass Kämpfe in einem Gewirr verschlungener Gliedmaßen enden, die auf der nächsten ebenen Oberfläche herumrollen. Du erhältst keinen Würfelpoolmalus auf Angriff oder Verteidigung, wenn du den Status Liegend (SR6, S. 54) hast, und der Würfelpoolmalus auf Verteidigungsproben, wenn du durch einen Ringenangriff gehalten wirst, wird um die Hälfte (abgerundet) gesenkt.
technique.half_sword.desc=Erhöhe den Angriffswert deiner Waffe um 2, wenn du Angriffe mit Halbschwert durchführst, aber senke die Reichweite Sehr nah um 1 Meter.
technique.iaijutsu.desc=Wie die Samurai von früher (oder zumindest die aus den Trideos) kann der Charakter die Nebenhandlung Schnellziehen (SR6, S. 43) mit einer passend aufbewahrten Nahkampfwaffe durchführen, die klein genug ist, um mit einer Hand geführt zu werden \u2013 also keine Stangenwaffe, außer sie ist in Zwergengröße und du bist ein Troll. Der Charakter muss die Handlung Schnellziehen immer noch zusammen mit der Haupthandlung Angriff verwenden.
technique.iron_limbs.desc=Dein Grundschadenswert bei einem waffenlosen Angriff steigt um 1.
technique.jiao_di.desc=Das war es wohl nicht, was deine Eltern gemeint haben, als sie sagten, du sollst \u201Edeinen Kopf benutzen\u201C, aber es funktioniert. Du darfst einen Kopfstoß einsetzen, um einen waffenlosen Angriff bis zur Hälfte deiner normalen Reichweite Sehr nah auszuführen, auch wenn du deine Gliedmaßen nicht einsetzen kannst, weil du zum Beispiel ringst oder in einem Griff bist; außerdem erhältst du einen um 1 erhöhten Grundschadenswert bei diesen Angriffen (nicht kumulativ mit Eisernen Gliedmaßen oder Ti Khao). Wenn du dich gegen einen Ringenangriff verteidigst, kannst du außerdem versuchen, deinem Gegner Schaden zuzufügen, als wärst du der Angreifer (SR6, S. 114).
technique.joint_lock.desc=Wenn du ringst (SR6, S. 113), kannst du die Option Schaden zufügen verwenden, um einem Arm oder einem Bein, den oder das du im Griff hast, den Status Gelähmt I (S. 118) zuzufügen, wobei jeweils zwei Nettoerfolge die Stufe des Status um 1 erhöhen. Jede Stufe des Status bleibt für [Nettoerfolge beim Angriff] Kampfrunden bestehen.
technique.kick_attack.desc=Du bist darauf trainiert, alle Arten von Tritten effektiv  im Kampf einzusetzen: Tritte nach vorne, von der Seite und sogar den legendären Drehtritt (optional auch mit Bart). Wenn du mit einem Fußtritt angreifst, kannst du deinen waffenlosen Grundschadenswert um 1 und die Reichweite Sehr nah um 2 Meter erhöhen. Durch einen Patzer bei einem Fußtritt erhältst du den Status Außer Balance, durch einen Kritischen Patzer den Status Liegend.
technique.mean_right_hook.desc=Senke die Edge-Kosten der Edge-Handlung K.o.- Schlag (SR6, S. 49) um 1.
technique.meridian_strike.desc=Indem ein Adept, der Hapsum-Do betreibt, seine Erwachten Talente mit seiner Kampfkunst kombiniert, kann er den Manafluss im Körper des Gegners stören. Wenn der Adept einen waffenlosen Angriff gegen einen Erwachten Gegner durchführt und die Kraft Todeskralle aktiviert hat, kann er, statt Schaden zuzufügen, den Würfelpool der nächsten mit Magie verknüpften Probe des Gegners um 1 pro Nettoerfolg senken.
technique.multi_opponent_combat.desc=Wenn du die Nebenhandlung Mehrfachangriffe (SR6, S. 43) durchführst, um mehrere Ziele anzugreifen, kannst du deinen Würfelpool (vor der Teilung) für jeweils zwei Ziele, die du angreifst, um 1 erhöhen. (Bei dieser Technik zählen Angriffe auf mehrere Stellen desselben Ziels als nur ein Ziel).
technique.multi_opponent_defense.desc=Wenn du in derselben Kampfrunde von mehreren Angreifern angegriffen wirst, erhältst du für jeden Angriff ab dem zweiten +2 auf deinen Verteidigungswert. Diese Erhöhung wirkt nicht kumulativ: Wenn du dreimal angegriffen wirst, erhältst du +2 auf deinen Verteidigungswert gegen den zweiten und dritten Angriff, nicht +2 gegen den zweiten und +4 gegen den dritten.
technique.neijia.desc=Du bist vielleicht nicht Erwacht, aber du hast gelernt, dein Qi (oder Ki, Prana, Ruach, Pneuma, die \u201EGeistesenergie\u201C oder reine Bosheit) in einen Schlag zu kanalisieren, der die Grenzen zwischen dem Materiellen und dem Immateriellen überschreitet. Du kannst einen waffenlosen Angriff gegen astrale Wesenheiten durchführen, als wärst du Erwacht (s. Astralkampf, SR6, S. 162). Der Schadenswert dafür ist ([Willenskraft ÷ 2] + Nettoerfolge), und der Angriff zählt als magisch (d. h., die Kraft Immunität gegen Normale Waffen wirkt hier nicht). <br/>Diese Technik verschafft dir allerdings nicht die Fähigkeiten des Bindens von Waffenfoki oder der astralen Wahrnehmung . Das heißt auch, dass du die Astralebene nicht sehen, sondern nur erahnen kannst, sodass deine Angriffe gegen astrale Wesenheiten einen Würfelpoolmalus von -4 erleiden.
technique.oaken_stance.desc=Du erhältst 1 Edge, wenn du Versuchen widerstehst, dich im Nahkampf niederzuschlagen. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.parry.desc=Du erhältst beim Einsatz der Nebenhandlung Blocken mit einer Waffe 1 Edge. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.pin.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung, nur ohne Edge-Kosten. Mit diesem Angriff erhält der Gegner, wenn die Anzahl der Erfolge des Angriffs seinen Verteidigungswert übersteigt, den Status Bewegungsunfähig, weil er an eine Wand oder den Boden genagelt wird. Dabei ist es egal, ob der Angriff tatsächlich Schaden verursacht hat. Der Gegner muss die Handlung Gegenstand aufheben/ablegen durchführen, um den Status loszuwerden.
technique.precision_strike.desc=Bitte diese veraltete Wahl durch eine neue Technik mit Auswahl der Waffenart ersetzen.
technique.precision_strike_blades.desc=Dank eines ausgedehnten Trainings mit deiner Lieblingswaffe kannst du (Stärke ÷ 3, aufgerundet) zum Schadenswert deiner Angriffe addieren, wenn du Waffen der passenden Kategorie benutzt. Diese Technik kann mehrmals gewählt werden und betrifft dann jeweils eine andere Waffenkategorie (Klingenwaffen, Knüppel, Exotische Waffen (nur Nahkampf)).
technique.precision_strike_clubs.desc=Dank eines ausgedehnten Trainings mit deiner Lieblingswaffe kannst du (Stärke ÷ 3, aufgerundet) zum Schadenswert deiner Angriffe addieren, wenn du Waffen der passenden Kategorie benutzt. Diese Technik kann mehrmals gewählt werden und betrifft dann jeweils eine andere Waffenkategorie (Klingenwaffen, Knüppel, Exotische Waffen (nur Nahkampf)).
technique.precision_strike_exotic.desc=Dank eines ausgedehnten Trainings mit deiner Lieblingswaffe kannst du (Stärke ÷ 3, aufgerundet) zum Schadenswert deiner Angriffe addieren, wenn du Waffen der passenden Kategorie benutzt. Diese Technik kann mehrmals gewählt werden und betrifft dann jeweils eine andere Waffenkategorie (Klingenwaffen, Knüppel, Exotische Waffen (nur Nahkampf)).
technique.releasing_talons.desc=Senke die Edge-Kosten der Edge-Handlung Entwinden (SR6, S. 49) um 1.
technique.rolling_clouds.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung (S. 108), nur ohne Edge-Kosten. Bei einer Probe auf Athletik + Geschicklichkeit erhöht jeder Erfolg die Anzahl an Metern, die du ohne Schaden fallen kannst, um jeweils 1.
technique.sacrifice_throw.desc=\u201EWenn ich zu Boden gehe, nehme ich dich mit!\u201C Wenn es einem Angreifer gelingt, dich niederzuschlagen, kannst du sofort eine Nebenhandlung ausgeben (wenn du noch eine zur Verfügung hast), um zu versuchen, den Gegner ebenfalls niederzuschlagen, als würdest du ihn zu Boden werfen (s. Ringen, SR6, S. 114).
technique.striking_the_darkness.desc=Wenn du dich unter Restlichtbedingungen (s. Tabelle Umgebung und Sichtverhältnisse, SR6, S. 108) im Nahkampf befindest, wirst du zum Zwecke des Erhaltens von Edge behandelt, als hättest du eine passende Sichtverbesserung.
technique.sweep_the_leg.desc=Wenn du die Nebenhandlung Zu Fall bringen waffenlos einsetzt, erhältst du 1 Punkt Edge, der verfällt, wenn du ihn nicht bei der Angriffsprobe ausgibst, die mit dieser Nebenhandlung einhergeht.
technique.tameshiwari.desc=Bretter schlagen vielleicht nicht zurück, aber man kann nie wissen, wann es nützlich sein kann, eine feste Oberfläche mit Hand, Fuß, Kopf oder einem anderen Körperteil zu durchbrechen. Wenn du eine Barriere (auch eine magische Barriere, die das physische Vorankommen behindert) mit einem waffenlosen Angriff angreifst, gilt ihre Strukturstufe als um 4 niedriger als normal, wenn es um die Berechnung des Schadens geht. Der Spielleiter muss festlegen, ob ein Patzer oder Kritischer Patzer dazu führen kann, dass du dich an Hand, Fuß, Kopf oder dem auftreffenden Körperteil an dem lästigen Objekt verletzt.
technique.threatening_edge.desc=Diese Technik funktioniert wie die gleichnamig Edge-Handlung, nur ohne Edge-Kosten. Für die Dauer der Begegnung wird der Verteidigungswert des Charakters, wenn er eine Nahkampfwaffe benutzt, durch den Angriffswert seiner Waffe in der Reichweite Sehr nah ersetzt.
technique.ti_khao.desc=Du bist darauf trainiert, beim Ringen deine Knie zum Angriff gegen einen Gegner einzusetzen, indem du dich auf ihn kniest, um ihn zu strangulieren, oder ihn in die Weichteile zu treffen versuchst. Erhöhe deinen Schadenswert während des Ringens um 1 (s. Ringen, SR6, S. 114)
technique.tricking.desc=Beeindruckende Drehtritte, das Herumwirbeln eines Stabs oder dem Gegner die Zigarette aus dem Mund zu schießen sind im Normalfall vielleicht nicht wirklich praktisch, aber diese Dinge können Freunde beeindrucken und Feinde einschüchtern.<br/>Wenn du eine Teamwork-Probe ablegst, um einem Verbündeten beim Einschüchtern eines Ziels zu helfen \u2013 was auch die Edge-Handlung Große Rede (SR6, S. 49) einschließt \u2013, kannst du die Probe auf Waffenfertigkeit + Geschicklichkeit statt auf Einfluss + Charisma ablegen. Wenn du diese Technik zusammen mit der Edge-Handlung Große Rede einsetzt, kannst du nur die erste Probe mit Einfluss + Charisma durch Waffenfertigkeit + Geschicklichkeit ersetzen, nicht beide.
technique.two_weapon_fighting.desc=Wenn du die Nebenhandlung Mehrfachangriffe mit mehr als einer Waffe benutzt, erhältst du einen Würfelpoolbonus von +2, den du auf deine Angriffe aufteilen kannst.
technique.weapon_breaker.desc=Wenn du Angesagtes Ziel \u2013 Entwaffnen benutzt, kannst du entweder die Edge-Kosten (wenn du Edge ausgibst) oder den Würfelpoolmalus (wenn du kein Edge einsetzt) um 1 senken.

