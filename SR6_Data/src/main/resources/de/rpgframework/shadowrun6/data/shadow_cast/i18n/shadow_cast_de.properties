quality.dissonant_technomancer.choice.variant=Variante
quality.dissonant_technomancer.choice.variant.control_apophenian=Steuerung/Apophänianer
quality.dissonant_technomancer.choice.variant.control_apophenian.desc=Du findest Muster inmitten des Chaos, die die meisten als Wahnvorstellungen abtun würden. Ob nun du oder sie recht haben, macht für dich keinen Unterschied, aber in der Matrix kannst du zumindest ein Netzwerk an relationalen Verbindungen aufbauen, die auch in der echten Welt Verbindungen schaffen. Wie ein Tesserakt oder eine Faltung der Raumzeit verbindest du Punkte, von denen sich niemand vorstellen konnte, dass sie miteinander in Verbindung stehen.
quality.dissonant_technomancer.choice.variant.alt_morphinae=Alt/Morphinäer
quality.dissonant_technomancer.choice.variant.alt_morphinae.desc=Du probierst ständig neue Dinge in der Matrix aus, nur um zu sehen, was passiert. Die Auswirkungen deiner Fähigkeiten als Technomancer können unvorhersehbar sein. Aber genau so gefällt dir das, auch wenn es dich von Zeit zu Zeit in Schwierigkeiten bringt. Du bevorzugst es, das Ganze so zu deuten, dass die Dinge dadurch interessanter werden.
quality.dissonant_technomancer.choice.variant.delete_erisian=Entfernen/Erisianer
quality.dissonant_technomancer.choice.variant.delete_erisian.desc=Du genießt es, Zwietracht und Streit zu säen, und du bist herausragend darin, mit Personas herumzuspielen. Hosts, IC und Geräte sind alles nur Maschinen. Nichts ist vergleichbar mit der Befriedigung, mit echten Leuten deine Spielchen zu spielen, und du bist der Schlimmste darin. Und in diesem Kontext ist der Schlimmste natürlich der Beste.
