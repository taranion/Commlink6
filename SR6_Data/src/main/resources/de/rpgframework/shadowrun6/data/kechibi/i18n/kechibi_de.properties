item.guizhen_1_handheld.desc=Jeder, der in den Strahl eines der Geräte gerät, muss eine Vergleichende Probe auf Konstitution + Willenskraft gegen die Einstellung am Gerät ablegen. Ziele mit Blitzkompensation erhalten 1 Edge für diese Probe. Personen, die dem Status Geblendet III unterliegen, sind immun. Ziele mit Restlichtverstärkung erhalten einen Würfelpoolmalus von -2 auf die Probe. Wenn ein Ziel vom Emitter abgewandt ist, erhält es 1 zusätzliches Edge für die Widerstandsprobe, wenn es keine stark reflektierende Oberfläche gibt, an der das Licht zurückgeworfen werden kann. Betäubungsschaden durch dieses Gerät kann mit einer Genesungsprobe pro Kampfrunde (statt pro Stunde) geheilt werden, außer man wird ein zweites mal getroffen bevor der Schaden eines ersten Treffers ganz geheilt ist, dann ist die Genesungsprobe pro Minute erlaubt. Solange Schaden vorhanden ist, erleiden die Getroffenen den Status Benommen. Schaden wird bei Wahrnehmung über Sensoren (zum Beispiel Rigger) um 3 reduziert. Das Tragbare System kann einen engen Strahl emittieren, der ein Ziel trifft, oder einen Kegel mit 30 Grad Winkel. Die Kegeleinstellung verbraucht je Schuss 3 Ladungen und halbiert die Angriffswerte.

