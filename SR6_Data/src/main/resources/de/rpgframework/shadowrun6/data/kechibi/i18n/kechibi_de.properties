item.guizhen_1_mob_light.desc=Jeder, der in den Strahl eines der Geräte gerät, muss eine Vergleichende Probe auf Konstitution + Willenskraft gegen die Einstellung am Gerät ablegen. Ziele mit Blitzkompensation erhalten 1 Edge für diese Probe. Personen, die dem Status Geblendet III unterliegen, sind immun. Ziele mit Restlichtverstärkung erhalten einen Würfelpoolmalus von -2 auf die Probe. Wenn ein Ziel vom Emitter abgewandt ist, erhält es 1 zusätzliches Edge für die Widerstandsprobe, wenn es keine stark reflektierende Oberfläche gibt, an der das Licht zurückgeworfen werden kann. Betäubungsschaden durch dieses Gerät kann mit einer Genesungsprobe pro Kampfrunde (statt pro Stunde) geheilt werden, außer man wird ein zweites mal getroffen bevor der Schaden eines ersten Treffers ganz geheilt ist, dann ist die Genesungsprobe pro Minute erlaubt. Solange Schaden vorhanden ist, erleiden die Getroffenen den Status Benommen. Schaden wird bei Wahrnehmung über Sensoren (zum Beispiel Rigger) um 3 reduziert. Der Mob Strahler kann einen engen Strahl emittieren, der ein Ziel trifft, oder einen Kegel mit 30 Grad Winkel. Die Kegeleinstellung verbraucht je Schuss 3 Ladungen.

item.guizhen_shield_glasses.desc=Dieser Schild hebt die Auswirkungen eines Treffers durch ein Guizhen 1 Gerät auf. 
item.guizhen_shield_visor.desc=Dieser Schild hebt die Auswirkungen eines Treffers durch ein Guizhen 1 Gerät auf. 

item.guizhen_2_storm_shield.desc=Der Sturmschild verursacht seinen Schaden in einem Kegel, der sich vom Schild bis zur maximalen Reichweite von 50 Meter in einem Winkel von 60 Grad erstreckt. Der Schaden beträgt 10B in Reichweite Sehr Nah und 8B in Nah. Der Strahl dringt nicht durch Barrieren aus Keramik, Stein oder Glas oder wenn die Strukturstufe mindestens so hoch ist wie der aktuelle Schaden in der jeweiligen Reichweitenkategorie. Elektronik und Cyberware werden abgeschaltet, wenn der Schaden mindestens so hoch wie die Gerätestufe ist.
item.guizhen_2_pulse_hammer.desc=Der Impulshammer sendet einen engen Strahl auf ein Ziel. Der Schaden beträgt 10B in Reichweite Sehr Nah, 8B in Nah und 6B in Mittel. Der Strahl dringt nicht durch Barrieren aus Keramik, Stein oder Glas oder wenn die Strukturstufe mindestens so hoch ist wie der aktuelle Schaden in der jeweiligen Reichweitenkategorie. Elektronik und Cyberware werden abgeschaltet, wenn der Schaden mindestens so hoch wie die Gerätestufe ist.
item.guizhen_2_hall_of_tears.desc=Die Halle der Tränen wirkt auf alle Ziele in einem Raum von 10x5x5m. Der Schaden beträgt 10B in Reichweite Sehr Nah und 8B in Nah bis zur Maximalreichweite 10 Meter. Als Festinstallation hat das System unbegrenzt Munition, solange die Stromversorgung des Gebäudes funktioniert. Elektronik und Cyberware werden abgeschaltet, wenn der Schaden mindestens so hoch wie die Gerätestufe ist.


quality.chopsticks.desc=Du bist schon lange genug in der Freien Wirtschaftszone, um zu wissen, wie man mit einem Cho Hai oder sogar dem Miàntiáo dàshi (Nudelmeister) in einem der beiden Noodleboy-Läden spricht. Du kannst Geld über das Triaden-Netzwerk  transferieren  oder  in  weniger  als  vier Stunden waschen lassen. Das führt dazu, dass du bei finanziellen Transaktionen zwischen Personen (nicht in der AR oder VR) in der Freien Wirtschaftszone nur zwei Prozent Gebühr für Beträge bis zu 50.000 Nuyen bezahlen musst; die Transaktionen können außerdem fast sofort stattfinden. Die Mindestgebühr beträgt immer noch 100 Nuyen.
quality.kai_takker.desc=Es geht darum, die richtigen Leute zu kennen und den eigenen Sinn für Guanxi zu schärfen. Daher kannst du den Kai Tak Night Market betreten und verlassen, ohne eine Gebühr dafür zahlen zu müssen, und du kannst bis zu (Charisma) Freunde für eine symbolische Gebühr von jeweils 50 Nuyen mitbringen.
quality.corp_scapegoat.desc=Konzernpolitik ist gnadenlos, und wenn jemand von weiter oben eine schlechte Entscheidung fällt, muss jemand anderes die Schuld auf sich nehmen. Du hattest unter einigen konzernpolitischen Spielen zu leiden, die dich ins Abseits gedrängt haben. Auswirkung: Immer, wenn du bei sozialen Interaktionen mit Mitgliedern deines ehemaligen Konzerns anwesend bist, kann dein Team Edge weder erhalten noch ausgeben. Wenn du in einer von diesem Konzern kontrollierten Region operierst, gelten alle Sicherheitszonen als eine Stufe höher.
quality.k_puppet_trauma.desc=Du dachtest, du würdest bloß eine schöne Zeit in der Stadt verbringen, aber der Trip ins Rotlichtviertel hat schlimme Spuren hinterlassen. Das Bunraku-Püppchen hat deine Psyche zerfetzt und dann mit ein paar neuen Ticks wieder zusammengenäht. Auswirkung: Wenn du mit vermeintlichen oder bekannten Yaks, Bunraku-Puppen oder Seoulpa-Ring-Mitgliedern zu tun hast, kannst du Edge weder erhalten noch ausgeben.
