quality.allergy_uncommon_severe.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nYou experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you. You also suffer 1 box of unresisted Physical Damage for every minute you are exposed to the allergen
quality.allergy_uncommon_extreme.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\n
quality.allergy_rare_mild.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nMild: You experience a \u20132 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you.
quality.allergy_rare_moderate.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nYou experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you
quality.allergy_rare_severe.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nYou experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you. You also suffer 1 box of unresisted Physical Damage for every minute you are exposed to the allergen
quality.allergy_rare_extreme.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\n
quality.ar_vertigo.desc=Whether it\u2019s just too much information, a focal issue in your visual field, or just an inability to focus when there\u2019s so much to look at, you get dizzy and nauseated when utilizing AR.\n\n\u2022 Game Effect: You cannot gain or spend Edge while utilizing AR of any sort. You also gain the Nauseated status (p. 52) while using AR and for one hour after you exit it.
quality.astral_beacon.desc=Whenever people talk about someone having a \u201Cbright soul,\u201D they make it sound like a good thing. You know it\u2019s not. Your bright aura makes you stick out like a sore thumb on the astral. You have a hard time hiding or masking your aura, you can\u2019t hide your feelings worth a damn, and attempts to locate you magically can be managed by first-year dropouts from Hagerstown Community College\u2019s Arcane Studies program.\n\n\u2022 Game Effect: You are considered Untrained for all Stealth tests in the astral plane. You can never take the masking metamagic. Assensing tests made against you get a free Edge, and all thresholds are reduced by 1. Astral Tracking tests made against you gain 2 Edge, and all thresholds are reduced by half.
quality.bad_luck.desc=You were born under a bad sign, broke a mirror, spilled some salt, got the evil eye laid on you, or just can\u2019t catch a break. No matter the reason, things just go wrong around you. Often.\n\n\u2022 Game Effect: Glitches occur more frequently. Count dice showing both 1 and 2 for determining a glitch. This does not affect critical glitches, only regular glitches.
quality.bad_rep.desc=Word on the street does not speak favorably of you. Maybe you lost a team or got kicked from a team for breaking during interrogation. Whatever it is, your reputation precedes you, and never in the way you want it to.\n\n\u2022 Game Effect: You cannot spend Edge on Social tests. If you engage in a Teamwork test to assist a Social test, no one can spend Edge, and the opposing individual gains a point of Edge.
quality.combat_paralysis.desc=No matter how many times the street sam takes you to the range, you just can\u2019t help but jump and freeze that first time they start shooting. Sure, you recover, but you always feel a half step behind in the fight.\n\n\u2022 Game Effect: Your Initiative Score is divided in half at the start of combat. You cannot take a Move or Sprint action in the first round, and you act last in that round. Your movement is restored to normal after the first round, but your Initiative Score is unchanged.
quality.dependents.desc=Children, lovers, or something other, you have people relying on you for financial support. They live in your doss, eat your food, use your trid account, and generally cost you enough nuyen to keep you looking for that next score.\n\nGame Effect: Choose a level for the dependents. \nLevel 1 dependents are the equivalent of a family member who does not live with you but still needs support. Five percent of any score goes to this person. \nLevel 2 dependents are more stable costs, like the support of a high-maintenance significant other, a child, or a small family. This level costs the runner 10 percent of every score. \nLevel 3 dependents are rare in the shadows, because most runners don\u2019t have a regular family and a second life outside the shadows, which is what this level entails. This level costs the runner 25 percent of all their scores.\n\nFor purposes of this quality, a \u201Cscore\u201D is any income that comes their way. Job payments, fencing stolen goods or paydata, or even gambling winnings. The people important to you prosper when you do!
quality.distinctive_style.desc=You only fit in when you\u2019re in places where no one fits in. The way you dress and look are unique to you. This isn\u2019t just a pink mohawk or a signature black trenchcoat. This is a two-meter-tall SURGEd lizard with a rainbow head frill, a head full of piercings including a bullring in his snout, dressed in full punk regalia. This is an albino ork who wears white sunglasses and a white trench coat over a head-to-toe white suit. A distinctive style is more than just what you choose to put on each day\u2014it\u2019s a way of life.\n\n\u2022 Game Effect: You cannot gain or spend Edge when you\u2019re not rocking your distinctive look. Others get a +2 dice pool bonus when conducting a Memory test (p. 67) to recall your appearance or remember if they have seen you before
quality.elf_poser.desc=Your blood may be human or ork, but your ears, cheekbones, and hoity-toity attitude are all elf. A surgery here and there, maybe a Sperethiel class on the Matrix, and a lot of time watching footage of the TÌr princes has you all set to join those you feel you truly belong with, no matter how round your ears or broad your tusks were at birth.\n\n\u2022 Game Effect: Elves, orks, and trolls gain a point of Edge in Influence (Etiquette) tests made against you.
quality.glass_jaw.desc=Doesn\u2019t take much to lay you on your hoop. You just never could take a punch. \u2022 Bonus: 4 Karma per level No matter how much you practice and try to figure it out, there are some skills you just can\u2019t manage to get right.\n\n\u2022 Game Effect: You have 1 less Stun Box for each level of this Quality, down to a minimum of 2.
quality.gremlins.desc=Commlinks freeze, guns jam, car tires blow, electrical systems short. Any and every thing that could go wrong with some fidgety bit of tech in your hands has gone wrong at one point in your life.\n\n\u2022 Game Effect: Whenever you use any device, roll 2D6. If you get a 1 on either die, it means the device fails to function correctly and can be treated as a glitch. The device can be quickly reset with a Minor Action and used again. Rolling snake eyes (double 1s) means the device fails catastrophically, and the roll can be treated like a critical glitch. The device is done for good and you might be in for a bit of hurt from shock or biofeedback.
quality.honorbound.desc=You have a code. You live by the code. You die by the code. There are many codes, each with a set of tenets that must be obeyed to maintain the balance in your soul, heart, qi, brain chemistry, etc.\n\n\u2022 Game Effect: You cannot spend or earn Edge for twenty-four hours after you break a tenet of your code. If the same tenet is broken multiple times or broken again during the twenty-four hour period, each infraction adds another forty-eight hours onto the initial twenty-four. If a different tenet is broken, it\u2019s twenty-four hours for that one added to any current infractions, and the same rules apply for additional violations. See the Honorbound sidebar (p.77) for some sample codes and tenets.
quality.impaired.desc=Some folks are just not meant to be naturally talented. A bum knee, poor genetics, or an illness as a kid has you lacking the maximum achievement level of your peers.\u2022 Game Effect: For each level, the character\u2019s maximum for the chosen attribute decreases by 1, to a minimum of 2.
quality.incompetent.desc=No matter how much you practice and try to figure it out, there are some skills you just can\u2019t manage to get right.\n\n\u2022 Game Effect: When this quality is chosen, select a skill. You are unable to gain ranks in the selected skill. You cannot be Incompetent in skills you have no chance to perform\u2014 so you cannot choose this quality for Magic skills if you do not have a Magic rating, and you cannot choose it for Tasking if you do not have a Resonance rating. This skill may only be selected once.
quality.in_dept.desc=Sometimes to get cash you need to owe cash. You\u2019ve built up a bit of debt trying to get a foothold in the shadows.\n\n\u2022 Game Effect: When you spend Karma for cash, every point of Karma you spend gets you 5,000 instead of 2,000 nuyen. Each point of Karma spent also puts you 5,000 nuyen into debt with someone very dangerous and capable of collecting. You must repay interest at a rate of 200 nuyen per level of this quality, which addresses interest only, not principal. If the payment is not made, the lenders come searching for you. The quality can be bought off purely with money; if the principal is repaid the quality is eliminated. This quality can be obtained only during character creation, not during gameplay.
quality.insomnia.desc=Sleep? What\u2019s that? It could be nightmares, brain damage, funky biochemistry, or a psychological disorder, but no matter the reason, you just can\u2019t get a good night\u2019s rest.\n\n\u2022 Game Effect: Without proper rest, you can\u2019t regain Edge or spend it as you might like. Each day the runner must make a Body + Willpower (3) test to get a successful night of rest. If they fail, they cannot earn more than two Edge from any source that day. Also, they cannot spend more than 2 Edge on any given test. The purchase and use of a sleep regulator reduces the threshold on the test to 1. The runner can also purchase medication (50 nuyen/dose) that reduces the threshold to 2.
quality.loss_confidence.desc=Imposter syndrome, a single traumatic failure, or just too many rejections or small failures in life have left you doubting yourself at every turn.\n\n\u2022 Game Effect: During any encounter, the runner must make a Willpower (2) test as a Minor Action. Failure means they cannot earn or spend Edge for the entire encounter.
quality.low_pain_tolerance.desc=You\u2019ve got sensitive nerves or a generally sensitive nature. For whatever reason, you are more affected by injuries and discomfort.\n\n\u2022 Game Effect: All wound modifiers are doubled.
quality.ork_poser.desc=Your blood may be human or elf, but your ears, jaw, tusks, and rough attitude are all ork. A surgery here and there, maybe an Or\u2019zet class on the Matrix, and a lot of time watching documentaries on the Seattle Underground has you all set to join those you feel you truly belong with, no matter how round your ears or thin your frame was at birth. \n\n\u2022 Game Effect: Elves, orks, and trolls gain a point of Edge in Influence (Etiquette) tests made against you.
quality.prejudiced.desc=You have some deep-seated views and beliefs about a certain group, and no matter what anyone says, you know they\u2019re no good. Your opinion of them is so negative and distracting you just can\u2019t keep focused on other things while they\u2019re around.\n\n\u2022 Game Effect: Select a specific group or type of people. You are unable to gain or use Edge while the object of your prejudice is present (unless you\u2019re attacking them).
quality.scorched.desc=A Matrix, simsense, or BTL experience has fried your neurons to the point of perpetual frazzle, causing trouble when you\u2019re logged on, even when it\u2019s just AR.\n\n\u2022 Game Effect: You cannot spend Edge while accessing the Matrix. This includes through use of commlinks, smartlinks, and any other source of data coming in from the ether.
quality.sensitive_system.desc=It could be latent unexpressed arcane talent or just a hyperactive immune system, but the result is the same. Your body does not like to have anything grafted or merged with it that isn\u2019t part of its natural code.\n\n\u2022 Game Effect: Essence costs are doubled for all cyberware, bioware, and nanoware. Geneware suffers no ill effects. You cannot have this quality if you have a Magic or Resonance rating. (Note that nanoware and geneware will be covered in future books.)
quality.simsense_vertigo.desc=Somewhere inside your brain, you\u2019ve got some wires crossed. Whenever you log onto the Matrix in VR, your disorientation is nauseating.\n\n\u2022 Game Effect: You cannot gain or spend Edge while accessing the Matrix via VR. You also receive the Nauseated status (p. 52) for one hour after you log off the Matrix.
quality.sinner.desc=Unlike a lot of runners, who have either no SIN or a criminal SIN, you have a legitimate SIN that links back to biometric data. You have enough attachment to it, whether for your own or family purposes, that you can\u2019t just burn it.\n\n\u2022 Game Effect: You pay taxes to the issuer of your SIN, either a megacorporation or a nation. This cost comes as a 10 percent increase in the cost of the lifestyle associated with this SIN.\nDue to data within the Global SIN Registry, you are easier to track or identify, giving opponents a point of Edge every time they attempt a Trace Icon action against you.
quality.social_stress.desc=There is a social situation that simply does not work for you, like being in large groups, talking to new people, being the center of attention, being out of the spotlight, or a myriad of other situations that some folks find totally normal but you find ridiculously stressful.\n\n\u2022 Game Effect: Select a specific social stressor. When encountering your social stressor, you must make a Charisma (2) test as a Minor Action. Failure means you cannot earn or spend Edge until you succeed. You can choose not to take the test but if so, any tests made against you gain a bonus Edge.
quality.spirit_bane.desc=You may have angered them with how you treat their fellows, killed a powerful and respected member of their kind, or been born under a bad sign and marked as an enemy to entities like them. The reason doesn\u2019t matter\u2014what matters is the fact that a certain type of spirit/sprite has an inherent dislike for you.\n\n\u2022 Game Effect: When selecting this quality, choose a type of spirit or sprite. Spirits/sprites from that category gain a bonus point of Edge when you attempt a Conjuring or Tasking test against them. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.\nIn combat, spirits/sprites of the chosen type will attack you first and relentlessly, often to the point of savaging a dead body or bricking a deck if they have nothing else to do.
quality.uncouth.desc=At some point in life, the filter between your thoughts and your mouth disappeared. You consider yourself brutally honest, but others tend to see you as rude and abrasive.\n\n\u2022 Game Effect: You cannot spend Edge on any test using Charisma.
quality.uneducated.desc=Maybe book learning just wasn\u2019t your thing, or maybe you were never exposed to vast quantities of information solely for the sake of expanding your knowledge base. Either way, you have a definite lack in your basic education.\n\n\u2022 Game Effect: You cannot spend Edge on any test using Logic.
quality.unsteady_hands.desc=Nervous tics, excessive caffeine intake, or a general clumsiness might be the cause, but the results are all the same: You can\u2019t draw a straight line to save your life. You also have a real hard time typing, tying your shoes, and keeping a gunsight on the target.\n\n\u2022 Game Effect: You cannot spend Edge on any test using Agility that directly involves your hands (that is, a Stealth test to pull off sleight-of-hand would directly involve the hands, as would an Attack test with any weapon held in the hands, but an Athletics test involving running would not, even though the hands are in motion while running).
quality.weak_immune_system.desc=Perpetual sniffles are annoying to both you and your team, but a poorly timed sneeze or a sudden need for a bathroom can mean the end of a good run. You\u2019re sick almost all the time. It may just be a minor cold, or it could be a nasty case of influenza or worse, but you\u2019ve never met an infection you didn\u2019t want to take home and hang out with for a bit.\n\n\u2022 Game Effect: You cannot spend Edge to resist the effects of an infection. The threshold for fighting off any infection you are exposed to is increased by 1. While suffering the ill effects of an illness, you suffer a \u20131 dice pool modifier to all tests.

ritualfeature.anchored.desc=All anchored rituals must be placed on a physical object or symbol of mystical significance that serves as the ritual\u2019s focal point. This could be something used specifically for the ritual (a rock or a doorway to anchor a ward, for example), or a mystical inscription (written in ink, paint, blood, etch marks, etc.), or even the foundation itself. The anchor cannot be moved relative to the Gaiasphere (the planet) during the duration of the ritual\u2019s effect, or the ritual collapses and the effect ends early.
ritualfeature.material_link.desc=The ritual requires a material link to the target, something that was once a part of the target. Material links from living beings aren\u2019t usable in rituals forever\u2014the Material Links sidebar (p. 145) has all the details.
ritualfeature.minion.desc=The ritual creates a semi-autonomous entity, usually something to help the magician who makes it. Whatever minion is created is bound to the ritual leader, who can\u2019t have more minions at a time than their Charisma rating.
ritualfeature.spell.desc=This ritual is used in conjunction with a spell that the ritual leader knows. Some of its properties might change\u2014the ritual has details on how. If the leader has any modifiers to the spell from a mentor spirit, the modifiers apply to the ritual, too. These rituals are susceptible to dispelling (p. 143).
ritualfeature.spotter.desc=If the ritual\u2019s target is not in sight of the leader, the leader needs to designate someone who can see the target for them, referred to as the spotter. The individual acting as the spotter must be a member of the group casting the ritual\u2014or a spirit serving a member of that group\u2014and must be able to astrally perceive the target. The spotter must be present in the ritual\u2019s foundation when the ritual begins and then must travel physically or astrally to where they can assense the target of the spell; this is an exception to the \u201Cno leaving\u201D rule in Step 3 of ritual casting.
ritual.circle_of_healing.desc=This ritual is used to cast a Health spell on a number of targets at once. Even though it\u2019s called a circle, it creates a sphere around the anchor that has a radius in meters equal to the leader\u2019s Magic rating. This ritual takes five hours to complete. The net hits from the sealing step are used as the net hits for the spell and applied as a positive dicepool modifier to any healing tests performed in the circle. If the spell has a particular elemental aspect (e.g., Cooling Heal or Warming Heal), that is also applied to individuals in the circle. The circle lasts for a number of days equal to the net hits on the sealing step.
ritual.circle_of_protection.desc=The circle of protection is a small astral and physical barrier. Even though it\u2019s called a circle, it\u2019s actually a sphere that forms around the anchor that has a radius in meters equal to the leader\u2019s Magic rating. The circle acts as a combination of the Physical Barrier and Mana Barrier spells (p. 141) with a Structure rating equal to the (Magic rating of the ritual leader + final Sorcery test net hits). The mana barrier is dual-natured.\nThe barrier lasts for a number of hours equal to the net hits from the sealing step. Anyone or anything within the barrier is protected from outside physical objects and magical attacks. If something crosses the barrier from the inside, then the ward ends. This ritual takes four hours to perform.
ritual.curse.desc=A Curse allows an Illusion spell to be cast on a subject through a material link rather than a mystic link from observing the subject. A Curse can be used on any target, whether within visual range of the leader or not, provided there is a link to the target. If the spell applies to multiple targets, then the ritual must have a link to each of the targets.\nThe link is used as part of the offering and is destroyed during the ritual. The spell is cast normally (using teamwork, if applicable) with all the tests and Drain appropriate to the chosen Illusion spell (Step 5 of Ritual Spellcasting).\nFor the duration of the ritual, a link is present between the target and the ritual group while the spell portion is sustained. It is possible to spot the link astrally and track it back to the ritual team\u2019s physical location.\nThis ritual requires three hours to complete
ritual.prodigal_spell.desc=This ritual allows you to cast any Combat spell at a distant target that is out of line of sight of your ritual team. The Combat spell can be either direct or indirect. Direct combat spells travel to the target in astral space. Indirect combat spells travel to the target in physical space, requiring a clear (but not necessarily straight) path in the physical world between the ritual team and target in order for the spell to reach its destination\u2014the spell flies from the foundation to the target, dodging any obstacles in its path.\nThis ritual requires four hours to perform.
ritual.remote_sensing.desc=This ritual allows you to cast any Detection spell with an even greater range. The area of the spell is increased to (Magic rating of ritual leader + total hits on Sorcery test in Step 6) x 100 meters. The spell\u2019s subject must be present in the foundation during the ritual but may then take their new sense outside the foundation while the ritual participants sustain the spell. All of the participants of the ritual perceive the same thing the subject perceives through the spell. If the spell has a target (like when you use a Mind Link or a Mind Probe spell in the ritual), you\u2019ll need a spotter to have eyes on the target.\nThis ritual takes three hours to perform. Afterward, if any of the participants stops sustaining the ritual, it ends.
ritual.renascence.desc=This ritual sustains and maintains an area Manipulation spell for a time. The area of the spell is a sphere with a radius equal to the leader\u2019s Magic rating, and the effect is based on the net hits from the sealing step. The base duration of the effect is 1 hour, which is doubled for each net hit from the sealing step of the ritual.\nThis ritual takes four hours to perform.
ritual.ward.desc=The ward is a basic ritual, taught to many magicians. It creates a mana barrier (p. 161) with a rating equal to the net hits on the Sorcery test in Step 6 of the ritual. The ward may encompass a volume of up to fifty cubic meters times the sum of the participants\u2019 Magic ratings.\nThis ritual takes four hours to complete. The ward lasts for a number of weeks equal to the net hits from the sealing step of the ritual. If the leader spends 6 Karma, the ward is permanent.
ritual.watcher.desc=Watchers are like spirits, but in actuality are entities born from the ritual leader\u2019s own mind rather than the metaplanes. They are a creation of mana, woven with the personalities of the ritual participants. A watcher can speak any language its creators (which includes the leader and participants) can speak. A watcher is bound only to the leader of the ritual and follows their orders. A watcher lasts for a number of hours equal to the (net hits on the sealing test x 3). A watcher\u2019s skills start at 2. For each additional hour spent on the ritual, the skills increase by one, as does the ritual\u2019s threshold.\nA leader can dismiss a watcher bound to them as a Minor Action. Watchers cannot be banished or counterspelled. This ritual takes one hour to perform.

skill.astral.desc=This skill can only be used by full or aspected magicians, or by adepts and mystic adepts who have chosen the Astral Perception adept power. It has two primary uses\u2014one is for assensing astral auras, as described on p. 159. The other is for astral combat, as described on p. 160.\n\nSecondary Linked Attribute: Willpower, for astral combat.
skill.athletics.desc=The Athletics skill is about physical grace and prowess, which is a combination of a number of factors\u2014strength, speed, quickness, nimbleness, and so on. More than that, it is the ability to coordinate all those qualities together, to draw on your abilities to meet what the situation demands.\nAs a skill with a variety of uses, it can be employed in different ways. It is used in Sprint tests (p. 44) and Full Defense Actions (p. 43), and it is an attack skill for thrown weapons. In general, it is paired with Agility to express a certain fluidity of movement, but it also can be linked to Strength for tests when sheer muscle power is needed. These tests are often Simple tests (Full Defense being an exception). Diving and free-falling are covered with this skill.\n\nSecondary Linked Attribute: Strength (used for tests where extra resistance might be offered, like running through mud or something)
skill.biotech.desc=This skill is for characters who know metahuman biology. In the Sixth World, that also means knowing how different augmentations and gear interact with it. This skill is used in First Aid tests (p. 119) and Healing tests (p. 120), and it also can be used when analyzing and repairing cyberware, bioware, and other augmentations. Another use is installing cyberware, but not other kinds of \u2019ware.\n\nSecondary Linked Attribute: Intuition (this is rarely used\u2014it is applied when characters try to do something that is not exactly by the books)
skill.close_combat.desc=Are you near someone? Are you trying to hurt them? Then use this skill! Whether you\u2019re punching, stabbing, clubbing, or whatever, roll Close Combat + Agility vs. Reaction + Intuition (Athletics can be added for Full Defense; see p. 43)\nFull details on Combat are in the Combat chapter (p. 104).
skill.con.desc=The key aspect of this group is persuasion where you act as someone or something you\u2019re not. Maybe you\u2019re acting like the long-lost heir to a portion of Dunkelzahn\u2019s hoard, or maybe you\u2019re pretending to be a down-on-their-luck business suit looking to make a big score to launch them back to the top. Whatever the case may be, Con is the skill you use to convince other people that you are something you are not.
skill.conjuring.desc=This skill allows you to summon, bind, and banish spirits. For details, see Conjuring, p. 146.
skill.cracking.desc=In the Matrix, there are two basic kinds of actions: legal and illegal. Cracking is what you use for the illegal ones. For details on the uses of Cracking, see Matrix, p. 171.
skill.electronics.desc=This is the other side of Matrix work, the legal side. Whether you\u2019re using your commlink, kludging some software, fine-tuning your hardware, or whatever, Electronics is the skill for you. You can find more details about its use in the Matrix chapter, p. 170.\n\nSecondary Linked Attribute: Intuition, for kludge work
skill.enchanting.desc=Enchanting is used to craft\u2014and sometimes demolish\u2014foci, fetishes, and other items imbued with magic. Details about this can be found in the Magic chapter\u2019s Enchanting section, p. 149.
skill.engineering.desc=Engineering is about making things do the things you want them to do\u2014making cars move, planes fly, boats float, and machines spin and roar so they can achieve whatever purpose they were built for. As the specializations show, this can cover a wide range of areas, but the skill essentially covers four basic activities: building, repairing, juryrigging, and vehicle gunnery. Building and repairing both follow the same basic process.\nJuryrigging is a Simple test, meant to get something to work in the short term with a quick adjustment or even a swift kick.\nEngineering is also used to pick mechanical locks and maglocks. It is combined with Agility for these tests, with a threshold based on the complexity of the lock.\n\nSecondary Linked Attributes: Intuition, for juryrigging; Agility, for lockpicking
skill.exotic_weapons.desc=Some weapons are not like any other, and you need particular training to use them. This skill is for those weapons. You must select a specialization to use this skill, and you can only use this skill with weapons for which you have a specialization. Expertises cannot be acquired for this skill. You can buy ranks in this skill, and those ranks can be used with all specializations you have. This skill is exempt from the rule that you can only have one specialization per skill, and you cannot have expertise in this skill.
skill.firearms.desc=Do you want to shoot things? Use this skill. The basics are, roll Firearms + Agility vs. Reaction + Intuition. The details that stack on top of that are available in the Combat chapter (p. 104).
skill.influence.desc=This is the other way of shaping the opinions of others, along with Con. It might be said that this is the more honest side, but that would be underselling the integrity of con artists and overselling the honesty of business negotiators. The point is, whether you are trying to inspire your fellow runners, squeeze a few nuyen out of Mr. Johnson, or let someone know that intense physical pain awaits them if they cross you, Influence is the skill to use.\n\nSecondary Linked Attribute: Logic, when making a clear argument. Mainly in Negotiation, could also be in some leadership situations.
skill.outdoors.desc=While staying indoors forever, watching trids and eating WhompSnappers, seems like a good enough life, sometimes you have to go outside. Outdoors is to help deal with those times. Whether you are following the tracks of someone or something, scaring up food, or figuring out the quickest way to your destination, Outdoors is the skill to use.
skill.perception.desc=Is someone sneaking through the smog up ahead? Is there a secret compartment in that executive\u2019s desk? Where\u2019s the light switch? These are some of the questions that can be answered with a Perception test. \nPerception is also used to attempt to see those who do not wish to be seen.\nSometimes Perception is about more than just taking in the details of your surroundings or trying to spot a hidden object. It may be about seeing how different things link to each other, or discerning a pattern in events or movements.\n\nSecondary Linked Attribute: Logic, for pattern recognition.
skill.piloting.desc=When you want a vehicle to move in a tricky way, this is the skill to use (riggers live or die by this skill). This is generally a Simple Test with a threshold based on the difficulty of the maneuver they are attempting. Sometimes a Piloting roll is about trying to avoid a tail, or tail someone else, or some other multi-vehicle action.
skill.sorcery.desc=The uses of Sorcery are numerous\u2014too numerous to cover here! Instead, look at the Magic chapter for information on Spells (p. 130), Counterspelling (p. 143), and other uses.
skill.stealth.desc=Shadowrunning isn\u2019t supposed to be obvious, as you should be able to guess by the name, so Stealth is a very valuable skill. Stealth covers all the activities characters perform that they do not want others to notice\u2014sneaking into a research facility, slipping a credstick out from under a Mafia don\u2019s nose, blending into a crowd of Lone Star officers, and so on.\nIn some circumstances, but not all, the size of a character may play a role in how stealthy they can be.
skill.tasking.desc=This is the skill technomancers use to do various technomancer activities. More information about these activities can be found in the Technomancers section (p. 187).

spell.acid_stream.desc=These spells shoot acid at targets, doing immediate damage while also doing Chemical damage (p. 109) and giving hit targets the Corroded status (p. 52) with a rating equal to net hits on the Spellcasting test. Acid Stream is a single-target spell.
spell.toxic_wave.desc=These spells shoot acid at targets, doing immediate damage while also doing Chemical damage (p. 109) and giving hit targets the Corroded status (p. 52) with a rating equal to net hits on the Spellcasting test. Toxic Wave is area effect.
spell.clout.desc=A tricky little spell\u2014the magic doesn\u2019t hit the target, but it shapes the air to make the blow. The power of wind to shape rock formations is demonstrated solidly on the head of the target. Clout targets individuals.
spell.blast.desc=A tricky little spell\u2014the magic doesn\u2019t hit the target, but it shapes the air to make the blow. The power of wind to shape rock formations is demonstrated solidly on the head of the target. Blast is area effect.
spell.flamestrike.desc=A classic. When you think of hurting people with magic, the first thing that comes to mind is making fire explode in their faces. These are the spells that\u2019ll get that done. Flamestrike hits individuals.\nThe spell does Fire elemental damage (p. 110) and impose the Burning status (p. 51) with a rating equal to net hits on the Spellcasting test.
spell.fireball.desc=A classic. When you think of hurting people with magic, the first thing that comes to mind is making fire explode in their faces. These are the spells that\u2019ll get that done. Fireball is area effect.\nThe spell does Fire elemental damage (p. 110) and impose the Burning status (p. 51) with a rating equal to net hits on the Spellcasting test.
spell.ice_spear.desc=When every corp security goon you run into starts wearing flame-retardant underwear, it\u2019s time to throw a changeup at them and hit them with the other temperature extreme. These spells blast targets with freezing cold, doing Cold elemental damage (p. 110) along with the normal damage and imposing the Chilled status (p. 51) for a number of combat rounds equal to net hits on the Spellcasting test. Ice Spear targets individuals, while Ice Storm is an area spell.
spell.ice_storm.desc=When every corp security goon you run into starts wearing flame-retardant underwear, it\u2019s time to throw a changeup at them and hit them with the other temperature extreme. These spells blast targets with freezing cold, doing Cold elemental damage (p. 110) along with the normal damage and imposing the Chilled status (p. 51) for a number of combat rounds equal to net hits on the Spellcasting test. Ice Spear targets individuals, while Ice Storm is an area spell.
spell.lightning_bolt.desc=It\u2019s what deities from Zeus to Thor use to smite those who have it coming, which means it should be good enough for you, too. Lightning Bolt hits a single target with electricity, while Lightning Ball is area effect. Both spells do Electricity elemental damage (p. 109), imposing the Zapped status (p. 53) for a number of turns equal to net hits.
spell.lightning_ball.desc=It\u2019s what deities from Zeus to Thor use to smite those who have it coming, which means it should be good enough for you, too. Lightning Bolt hits a single target with electricity, while Lightning Ball is area effect. Both spells do Electricity elemental damage (p. 109), imposing the Zapped status (p. 53) for a number of turns equal to net hits.
spell.manabolt.desc=Essential spellcasting, shaping mana to crack skulls. Who can argue with this purity? Manabolt targets individuals, while Manaball is area effect.
spell.manaball.desc=Essential spellcasting, shaping mana to crack skulls. Who can argue with this purity? Manabolt targets individuals, while Manaball is area effect.
spell.powerbolt.desc=The harsher version of Clout, Powerbolt smacks targets with Physical damage; Powerball does the same as an area effect.
spell.powerball.desc=The harsher version of Clout, Powerbolt smacks targets with Physical damage; Powerball does the same as an area effect.
spell.stunbolt.desc=Sometimes you take a little off the heater to catch the other guy off-balance. These spells channel mana in a way that hurts, but only to stun. Stunbolt hits individuals, Stunball is area effect.
spell.stunball.desc=Sometimes you take a little off the heater to catch the other guy off-balance. These spells channel mana in a way that hurts, but only to stun. Stunbolt hits individuals, Stunball is area effect.

tradition.hermetic.desc=Hermeticists see themselves as part of a long, proud tradition of striving to understand the laws undergirding the world and manipulate them. They are more than happy to point out that Isaac Newton\u2019s alchemical studies took up more of his time than his work on physics, and that people like John Dee and Aleister Crowley, who were pushed to the margins of academia, had their reputations dramatically upgraded after the Awakening. Since hermeticists feel they understand magic, they think that puts them ahead of any other branch of academia, since others\u2019 understanding is rooted in this world only. This strongly contributes to their reputation for snobbery and arrogance, a reputation they tend to embrace through the concept that it\u2019s not arrogance if you can back it up.
tradition.shaman.desc=Followers of the shamanic tradition believe magic is to be experienced and performed, not put under glass. If that occasionally leads to inconsistent results or accidental injury, well, that\u2019s what happens in art, in love, and in so many other parts of life, so why should magic be any different?\nHermeticists tend to see shamans as sloppy and undisciplined, and that\u2019s exactly the way shamans like it.

