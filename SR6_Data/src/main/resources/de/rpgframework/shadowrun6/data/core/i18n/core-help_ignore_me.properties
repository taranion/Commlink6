adeptpower.adrenaline_boost.desc=You get a surge of energy so you can get the jump on others. For each level of the power, add 2 to your initiative score for (Magic) combat rounds. At the the end of those combat rounds, experience drain equal to the level of the power, which you can resist as normal.
adeptpower.astral_perception.desc=You gain the ability to astrally perceive and follow the rules involved in so doing (see p. 159). You are dual-natured while using this power and can attack astral forms.
adeptpower.attribute_boost.desc=When this power is activated, roll Magic + Attribute Boost rating. Each hit temporarily boosts the rating of the designated attribute by 1, up to the augmented maximum of +4. This only affects dice pools, so your Initiative rank, Condition Monitor, Defense Rating, and so forth is not changed. The effect lasts for (net hits) combat rounds, and when it runs out, the adept takes drain equal to the level of this power, resisted as normal.
adeptpower.combat_sense.desc=This power gives you the ability to anticipate and avoid harm. Gain a +1 dice pool bonus per level on any defensive tests. You always have a chance to make a Perception test to avoid surprise.
adeptpower.critical_strike.desc=Increase the DV of your melee attacks by 1 per level of this power. This power is compatible with other enhancements from weapons and adept powers unless otherwise prohibited.
adeptpower.danger_sense.desc=You have a sixth sense for danger, instinctively knowing when it\u2019s nearby and preparing for it. Gain an Edge before making Surprise tests.
adeptpower.direction_sense.desc=You have a good sense of where you have been, where you\u2019re going, and a few of the obstacles in between. When making an Outdoors test related to directions, you may gain an Edge point, provided you spend it immediately on that test.
adeptpower.enhanced_perception.desc=Your senses are keenly honed, giving you information in enough time for you to figure out what to do about it. Gain an Edge when Observing in Detail or making a Perception test to find something hidden or listen to something you\u2019re not supposed to hear.
adeptpower.enhanced_accuracy.desc=Weapons are more accurate and deadly in your hands than in those of normal people. Increase the Attack Rating of any weapon you wield by 2.
adeptpower.improved_ability.desc=A skill must be selected when this power is chosen. That skill receives an ongoing boost equal to the rating of the power. The maximum boost to the skill is 1.5 times the current level (rounded up) or the augmented maximum, whichever is lower. You need to have at least one rank in a skill to buy this power for it, and the power can be purchased for multiple skills.
adeptpower.improved_ability_combat.desc=A skill must be selected when this power is chosen. That skill receives an ongoing boost equal to the rating of the power. The maximum boost to the skill is 1.5 times the current level (rounded up) or the augmented maximum, whichever is lower. You need to have at least one rank in a skill to buy this power for it, and the power can be purchased for multiple skills.
adeptpower.improved_physical_attribute.desc=Select a Physical attribute (Body, Agility, Reaction, or Strength) when purchasing this skill. That attribute receives an ongoing boost equal to the level of this power. The maximum boost to the attribute is 1.5 times the current level or the augmented maximum, whichever is lower.
adeptpower.improved_reflexes.desc=This power gives you quick reflexes and anticipation, allowing you to act and react much faster than the normies. For each level of this power, add an Initiative Die and increase your Reaction by 1. The maximum level of this power is 4, and it cannot be combined with any other Initiative or Reaction boosts.
adeptpower.improved_sense.desc=When this power is purchased, select a sense (sight, hearing, touch, taste, or smell). When making a test involving that sense, you get a bonus Edge, but only if you use it (either alone or in combination with other Edge points) on that test. Edge points from this power cannot be gained more than once when the same sense (noise, sight, flavor, etc.) is involved. This power can be selected more than once, each time for a different sense.
adeptpower.killing_hands.desc=Your hands become lethal and magical, useful both in shadowrunning and cheesy pickup lines. When fighting unarmed, you can choose to deal Stun or Physical damage. Killing Hands can be combined with other powers affecting unarmed combat. Attacks made with Killing Hands are considered magical, meaning they bypass protections against normal weapons and can be made against astral beings.
adeptpower.kinesics.desc=Your command of body language and nonverbal communication is, well, magical, and it helps you be incredibly difficult to read. When you are resisting Social tests and tests to read your emotions, judge your intentions, or gauge your truthfulness, you gain an Edge point. Only one such Edge point can be gained per encounter.
adeptpower.mystic_armor.desc=Mana forms a shield around you, enhancing your protection. Gain 1 point of Armor for each level of this power, cumulative with worn Armor, which also increases your Defense Rating. Mystic Armor is also active on the astral plane.
adeptpower.pain_resistance.desc=Pain hurts, but you gain an elevated ability to ignore it. For each level of this power, the negative modifiers from damage move one box farther down the Condition Monitor\u2014for example, at level 1, you don\u2019t suffer the \u20131 penalty until 4 boxes are filled on a Condition Monitor, rather than 3. It works for both Stun and Physical Condition Monitors.
adeptpower.rapid_healing.desc=The magic that flows through you helps knit your bones and regrow your flesh, making you heal quickly. Add one hit per level on Healing tests performed to heal you.
adeptpower.spell_resistance.desc=Spells have a tendency to bounce off you rather than affect you. Gain a point of Edge when targeted by spells.
adeptpower.traceless_walk.desc=You don\u2019t disturb the dust, dirt, snow, water, or anything else under your feet as you move, so there is no evidence of your passing. You don\u2019t trigger tripwires, pressure pads, or other traps based on leg movement. Hearing tests to listen for your passage and Outdoors tests to perceive your tracks cannot gain or spend Edge.
adeptpower.vocal_control.desc=You can control the pitch and modulation of your voice to make it sound the way you want\u2014 loud, quiet, resonant, or like some person you want to imitate. Gain Edge when attempting a Con or Influence test that somehow involves your voice. Only one point of Edge may be earned per encounter with this power.
adeptpower.wall_running.desc=Running horizontally is so pedestrian (get it?). Running up a wall is how you show you\u2019re special. When using this power, you can use a Sprint action (see p. 44) to run up a vertical surface. You cannot use this power for two actions in a row; you have to spend at least one turn moving across a horizontal surface before using this power again. So if you run up a wall and don\u2019t find a good foot or handhold, you\u2019ll be falling right back down.


magicOrResonance.magician.desc=Full magicians gain access to the full range of magical abilities, spellcasting, summoning, and enchanting, as well as offering full access to the astral plane with both astral perception (p. 159) and astral projection (p. 160). During character creation, they get a number of spells or rituals equal to their Magic x 2\u2014the rating used for that calculation is the Magic in the Priority table, not as altered with any points, Karma, or any other adjustments.
magicOrResonance.mysticadept.desc=Mystic adepts are a blend of inward and outward magic. They are capable of casting spells, summoning spirits, and enchanting items, but they also channel a portion of their magic inward to fuel adept talents. They are not able to astrally project due to the anchoring effect of their adept powers, but they can astrally perceive. \nThey must split their Magic between spells and adept powers. They first purchase adept powers up to a maximum of their Magic attribute then multiply the remaining Magic by 2 to determine their starting number of spell choices. Again, this uses the Magic value in the Priority table, not as adjusted with Karma or adjustment points.
magicOrResonance.adept.desc=Adepts focus all of their magic inward, fueling their talents with their innate ability to pull mana in rather than channel it outward. Due to this physical connection to their magic, they cannot astrally project and only gain the ability to astrally perceive through training. Adepts have a pool of points equal to their Magic (as listed in the Priority table, before any adjustments) that they use to purchase adept powers. For more information on adepts, see p. 156.
magicOrResonance.aspectedmagician.desc=Aspected magicians are only able to utilize one of the three aspects of magic: spellcasting (Sorcery), summoning (Conjuring), or enchanting (Enchanting).\nThey can access to the astral plane with astral perception and projection. Sorcerers select a number of free spells or rituals equal to their Magic x 2\u2014as before, the rating used is the Magic in the Priority table, not as altered with any points, Karma, or adjustments.
magicOrResonance.technomancer.desc=Technomancers have a special connection to the Matrix, which is measured in an attribute called Resonance. They have the ability to create programs and sprites on the fly along with the ability to manipulate the energies of the Matrix to bend it to their will. When they select their Resonance Priority, they also select a number of complex forms equal to Resonance x 2 (using the Resonance figure from the Priority table, not the number as adjusted).
magicOrResonance.mundane.desc=Choosing to be mundane means no access to Magic or Resonance. Simple as that. Your special attribute points will have to be spent elsewhere

metatype.dwarf.desc=\u2022 Average height: 1.2 meters\n\u2022 Average weight: 54 kg\n\u2022 Ears: Slightly pointy\n\u2022 Known for: Short size; stocky build; perseverance\n\nSixth World dwarfs are often accepted into mainstream society without being fully valued. The taller metatypes seem to be happiest when dwarfs fit the roles they have preconceived for them\u2014 sidekicks, drivers, mechanics, that sort of thing. It doesn\u2019t help that their size helps them squeeze into vehicles that orks, humans, and elves might have difficulty with, ones that trolls couldn\u2019t even consider using. Still, they get work and little direct hate. They\u2019re treated nicely, but they can\u2019t help but feel that they\u2019re being, well, overlooked.
metatype.ork.desc=\u2022 Average height: 1.9 meters\n\u2022 Average weight: 128 kg\n\u2022 Ears: Pointy\n\u2022 Known for: Big, powerful physique; tusks; constantly being seen as outsiders\n\nOrks make people nervous, and people don\u2019t like to be nervous. Their tusks, bone structure, and pointed ears mark them as something altogether else, and their strength and size clearly show the damage they could do. As humans have done for centuries, they address the thing they fear by pushing them aside, keeping orks from building collective strength, and crushing them with the sheer force of numbers.
metatype.troll.desc=\u2022 Average height: 2.5 meters\n\u2022 Average weight: 300 kg\n\u2022 Ears: Slightly pointy, often hidden by horns \n\u2022 Known for: Being so big, you guys. Just huge. And horns.\nIt\u2019s not easy to live in a society where you look like the walking embodiment of everyone else\u2019s nightmares. Being two to three times as large as everyone else doesn\u2019t help much, either. It\u2019s not a troll\u2019s world, and most of the other residents of the world aren\u2019t inclined to change that fact. Who wants to make space for imposing monsters? Trolls are going to have to force their way into a place in the world\u2014of course, when they force their way in anywhere, they\u2019re inevitably called vandals and destroyers.
metatype.elf.desc=Average height: 1.9 meters\n\u2022 Average weight: 80 kg\n\u2022 Ears: Pointy\n\u2022 Known for: Slender, lithe build; being attractive and knowing it\n\nPerhaps the most infuriating thing about elves to the other metatypes is that you can resent them like hell, and they just won\u2019t care. They have two prosperous nations\u2014TÌr na n”g (formerly known as Ireland) and TÌr Tairngire (in the western part of North America)\u2014they have people in some of the most powerful positions in the world, and celebrities whose MeFeed hits are in the billions. They are envied, not looked down on.
metatype.human=desc=Average height: 1.75 meters\n\u2022 Average weight: 78 kg\n\u2022 Ears: Rounded\n\u2022 Known for: Average size; average build; freaking out about people who don\u2019t meet their averages\n\nAs the majority of the sentient beings of the world, humans create existing definitions of \u201Cnormal,\u201D and then some of them set out to abuse those definitions as hard as they can. These humans know that they lack the pure physical strength and social cohesion of some of the other metatypes, so they shape the world in a way that keeps the individuals they don\u2019t like from ever realizing what they can do, and what they can become.

