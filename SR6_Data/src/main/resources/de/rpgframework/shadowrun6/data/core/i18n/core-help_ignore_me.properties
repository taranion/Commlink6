quality.ambidextrous.desc=You are equally adept at using either your right or left side. Whether shooting a gun, throwing a  grenade, or kicking a ball, you can switch it up with the best of them.\n\nGame Effect: No penalty for off-hand weapon use (see p. 110).
quality.analytical_mind.desc=You are a master problem solver. You can analyze information to help deduce solutions, while separating useful bits from the distractions and noise.\n\n\u2022 Game Effect: You gain a bonus Edge when you make any Logic-based test.
quality.aptitude.desc=The best look up to you. You have the natural potential to be even better than the best in a particular skill.\n\n\u2022 Game Effect: Your skill maximum for the selected skill is 10, instead of 9, and your maximum starting rank is 7, instead of 6.
quality.astral_chameleon.desc=Your aura never seems to stabilize for very long. You have the ability to blend in with the astral environment around you and make it harder to identify and read your aura and astral signature.\n\n\u2022 Game Effect: Characters receive \u20132 dice on tests to recognize your aura or astral signature. Your astral signature fades in half the normal time (see p. 159).
quality.blandness.desc=You are the least interesting person in the world. You\u2019re average height, average weight, average build, average everything. Nothing at all about you tends to stand out, and that can be extremely useful.\n\nGame Effect: Characters take a \u20132 penalty on Memory tests (p. 67) to remember if they have seen you before, and the threshold on tests to notice if you are following or observing them is increased by 1. If the character acquires something permanent and distinctive\u2014obvious, unusual cyberware, a unique tattoo, that sort of thing\u2014they lose this quality. If they acquire something temporarily distinctive, such as an extreme hairdo, the effects are negated until those changes are reversed.
quality.built_tough.desc=You\u2019re built like a brick drekhouse. You\u2019re pretty good at taking a few extra hits before the lights go out.\n\n\u2022 Game Effect: You have a number of additional boxes on your Physical Condition Monitor equal to the rank of this quality.
quality.catlike.desc=You have an innate grace usually seen only in the genus Felis that translates into smooth movements and a propensity for always landing on your feet\u2014literally, if not figuratively.\n\nGame Effect: You gain a bonus Edge on all tests for balance, falling, and landing safely.\nNote the rules in the Preventing Edge Abuse section, p. 45.
quality.dermal_deposits.desc=You have calciferous deposits growing on or through your flesh, making you tougher and a little rough around the edges. Literally.\n\n\u2022 Game Effect: You gain 1 level of natural Armor. Your Unarmed Melee attacks have a Base Damage Value of [(STR/2) + 1]P.
quality.double_jointed.desc=Through practice or genetics, you\u2019ve managed to make most of the joints in your body bend beyond normal metahuman ranges. Your hands narrow to as small as your wrists, your shoulders rotate and bend in every direction, your body folds neatly in half both forward and backward, and you can rotate your head to look behind you without turning your shoulders, just to name a few of your neatest party tricks.\n\n\u2022 Game Effect: You gain a bonus Edge on all tests involving grappling, escaping bonds, flexibility, or fitting into tight spaces. Note the rules on Preventing Edge Abuse, p. 45.
quality.elemental_resistance.desc=Through genetics or training, you have developed a powerful resistance and tolerance for certain forms of damaging energy (or lack of energy, in the case of cold).\n\n\u2022 Game Effect: When choosing this quality, select an elemental form of damage (p. 109). When attacked with a weapon or spell (including unarmed combat by a spirit) that does this form of damage, gain a point of Edge before making your Defense test.
quality.exceptional_attribute.desc=Whether it\u2019s being a powerhouse, taking a hit from a troll, holding your synthahol, ducking a fast right, holding that inside turn, selling coal in Newcastle, or making a cat look clumsy, you\u2019re just naturally built to be better.\n\n\u2022 Game Effect: Select a Physical or Mental attribute. The character\u2019s attribute maximum (but not current rank) for the chosen attribute increases by 1 to a maximum of 10.
quality.first_impression.desc=You know how to make an entrance and make that first meeting the best meeting. Your wit, charm, and subtle flattery put everyone you meet off their guard and let you make the most of a first encounter.\n\n\u2022 Game Effect: You gain 2 Edge for Social Tests during your first meeting with anyone, and both your Heat and Reputation are ignored for this first encounter.
quality.focused_concentration.desc=You know how to compartmentalize your mind and keep hold of arcane and emergent manipulations without straining yourself.\n\n\u2022 Game Effect: You can sustain multiple spells or complex forms without penalty. For each level, you can sustain 1 additional spell or complex form without suffering the associated penalty. The spell cannot have a modified Drain Value of 7 or greater.
quality.gearhead.desc=If it\u2019s meant to move but currently isn\u2019t moving so well, you know how to get it back into tip-top shape in a jiffy.\n\n\u2022 Game Effect: You gain an Edge on Repair tests for any vehicle and can spend Edge during downtime to make Extended Repair tests.
quality.guts.desc=It\u2019s not a lack of fear, just a lack of cowardice! You can stand up to the most intimidating opponents and hold your tongue under the toughest interrogations.\n\n\u2022 Game Effect: You gain an Edge when resisting Intimidation or effects that cause the Frightened status.
quality.hardening.desc=Get clipped by IC and other personas enough times in the Matrix, and you can start to build defenses against it. Your physical form actually helps absorb some of the injuries coming at your Matrix persona.\n\n\u2022 Game Effect: You gain a bonus Edge when making Matrix Damage Resistance tests. If you do not use that point of Edge immediately on the Damage Resistance test, it goes away. When struck by any damage in the Matrix, you can convert up to two boxes to Stun Damage, rather than Matrix damage, protecting your persona at the cost of yourself.
quality.high_pain_tolerance.desc=Pain is but an illusion of the mind. Either that, or you were born with congenital analgesia. Either way, you don\u2019t suffer the ill effects of injury and pain like others. \n\n\u2022 Game Effect: When wounded, reduce your wound penalty by one (to a minimum of 0).
quality.home_ground.desc=Spend enough time somewhere, and you get to know it like the back of your hand. In the local neighborhood, you know every turn, every back alley, every shop on the block, the local rivalries and romances, and you can use all of it to your advantage. In the Matrix, you\u2019ve spent countless hours in the code, you know its gremlins, its quirks, the local avatars, and the ones that are out of place.\n\n\u2022 Game Effect: Select a neighborhood or Matrix host each time you take this quality. Outdoors and Perception tests made in your Home Ground gain an Edge for use on that test; if you do not use the Edge on that test, it goes away.
quality.human-looking.desc=Small orks, tall dwarfs, and ugly elves do exist. Whether through genetics or modifications, you do not look like your birth metatype; you appear human. The points in your ears are easily overlooked, your tusks are filed down to mere teeth, your cheekbones are rounder, your legs longer\u2014 that sort of thing. You can pass for human, which might help with humans or cause obstacles with non-humans.\n\n\u2022 Game Effect: You generally appear human at first glance and gain +2 dice on Disguise tests to hide your metatype and appear more human.
quality.indomitable.desc=Whether through deep studies, natural selection, or intense training, your mind is hard to break. You can hold out longer under interrogation, shrug off mild injuries with ease, and hold your mind against the onslaught of incoming mana.\n\n\u2022 Game Effect: Edge Boost costs are reduced by 1 on tests involving Willpower.
quality.juryrigger.desc=When you don\u2019t have the time or the parts to do it right, you can still get it done. Whether it\u2019s slapping on duct tape, twisting together wires that maybe shouldn\u2019t be connected, or just giving the thing a swift kick, you find a creative way to get a machine working, even if only briefly.\n\n\u2022 Game Effect: When performing a Juryrigging test (see p. 95), you gain a point of Edge that must be spent on that test, or it goes away.
quality.long_reach.desc=Whether it\u2019s because of long arms, long legs, or some exceptional physical grace, you are able to reach people with melee weapons easier than others.\n\n\u2022 Game Effect: When you are using a melee weapon, Close range is extended to 5 meters instead of 3.
quality.low-light_vision.desc=Thanks to an increase in the number of rod cells in your natural eyes, an implanted increase of said rod cells, or an augmentation that enhances the light level of incoming data, you are capable of operating in light levels that would leave others essentially blind.\n\n\u2022 Game Effect: You can see clearly in any light level that is not total darkness (see Environment and Visibility, p. 118).
quality.magic_resistance.desc=You could have been born under a blood moon, filled your body with foreign substances, or had bits of your soul sucked out by a spirit or vampire. For good or ill, mana just doesn\u2019t seem to want to connect with you. Whether it\u2019s a manabolt trying to melt your brain, a fireball trying to cook you alive, or a healing spell trying to mend your wounds, it\u2019s just harder to get magic to work on you.\n\n\u2022 Game Effect: You gain a bonus Edge for use on any Magic Resistance test; if you do not use it on that test, that point goes away. When a Health spell is cast on you, treat your Essence as if it were 2 points lower than it actually is.
quality.mentor_spirit.desc=You believe in something other than yourself to help guide and channel your magic, and that something believes in you. Whether it be the totem of Wolf, the Norse god Loki, or the Christian God, you utilize your beliefs to shape and focus your arcane abilities more easily.\n\n\u2022 Game Effect: You gain the benefits listed with the description of your mentor spirit (see p. 162). If you fail to keep aligned with one of those tenets, you lose your faith and connection to your mentor and all associated bonuses.
quality.photographic_memory.desc=Most people store life in clips, but you keep the recording running all the time. It\u2019s a ton of information to deal with at times, but it has made you great for trivia night and remembering the favorite color of your childhood friend.\n\n\u2022 Game Effect: You gain a bonus Edge point when making a Memory test (p. 67). If you do not use this point of Edge on the test, it goes away.
quality.quick_healer.desc=You tend to heal from injury quicker than your peers, which is incredibly valuable in a profession that is all about putting your body on the line.\n\n\u2022 Game Effect: Cut the interval for any natural healing test (p. 120) in half, meaning you can heal Stun Damage after half an hour and Physical Damage after half a day.
quality.resistance_pathogens.desc=When you claim, \u201CI\u2019ve never been sick a day in my life,\u201D there\u2019s a good chance it may be true. You have a very healthy immune system that has mastered the art of fighting off any and all comers that try to slip into your body and make you sick.\n\n\u2022 Game Effect: You gain a bonus point of Edge when you make a Pathogen Resistance test. If you do not use it on that test, it goes away.
quality.spirit_affinity.desc=You have earned respect among a particular group of spirits/sprites. Through actions and favors, you\u2019ve gained a positive reputation that makes them treat you with extra consideration.\n\n\u2022 Game Effect: When selecting this quality, choose a type of spirit or sprite. You gain a bonus point of Edge when making a Conjuring or Tasking test for your chosen class of spirits/sprites. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.
quality.thermographic_vision.desc=Thanks to enhancements or just genetics, your vision allows you to see differences in temperature on and around objects and people, though most of the time ambient regular light overrides the heat signature. Large local sources of heat can create a glare of sorts, but usually something giving off that much heat is also giving off light, so your regular vision takes over.\n\n\u2022 Game Effect: You can see the heat of objects in total darkness (assuming they are warmer or colder than the ambient temperature), allowing you to operate in such conditions.
quality.toughness.desc=Whether it\u2019s mental training, a physical regimen of self-inflicted injury, or you\u2019re just one tough bastard, you can take a bit more of a beating and shrug off the injuries better than most.\n\n\u2022 Game Effect: You gain a bonus point of Edge when making Damage Resistance tests. If you do not use it on the test, it goes away.
quality.toxin_resistance.desc=Whether through naturally superior organs or because you think getting bit by a snake on a daily basis is a fun way to pass the time, you\u2019re able to better resist the effects of toxins in the Sixth World.\n\n\u2022 Game Effect: You gain a bonus point of Edge when you make a Toxin Resistance test (p. 121). If you do not use it on that test, it goes away.
quality.will_to_live.desc=No matter how hard the hit, you have the tenacity to hold on to the bitter end. You are quite capable of taking a .50-cal round to the chest and waking up in the hospital, rather than never waking up at all.\n\n\u2022 Game Effect: For every rank of this quality you possess, you gain two additional Damage Overflow boxes (see p. 121).

quality.addiction.desc=Some habits just can\u2019t be kicked. It might be as simple as a need for a drag off that nic-stick to cool your nerves, or as life-twisting as a need for something better-than-life, but whatever it is, it\u2019s got a firm grip on you.\n\n\u2022 Game Effect: You cannot earn Edge or spend Edge in any form while suffering withdrawal. Withdrawal times (the time that passes before you need your next hit) and requirements are based on the level of addiction and can be found on the Addiction Withdrawal table. When in withdrawal, take a \u20132 dicepool penalty on all tests; increase that penalty by 1 each time you pass another Withdrawal time period.
quality.allergy_common_mild.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nMild: You experience a \u20132 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you.
quality.allergy_common_moderate.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nYou experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you
quality.allergy_common_severe.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\nSevere: You experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you. You also suffer 1 box of unresisted Physical Damage for every minute you are exposed to the allergen
quality.allergy_common_extreme.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.\n\n
