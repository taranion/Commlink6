item.taiaha.desc=In den späten 2060ern arbeitete Zoé mit einigen Zulieferern zusammen, um eine Reihe maßgeschneiderter historisch akkurater Kleidungsstücke herzustellen. Diese Kollektion war unglaublich erfolgreich, und Zoé erhielt zahlreiche Anfragen nach Accessoires. Nachdem die Kollektion ein Jahrzehnt lang gelaufen war, beschloss die Firma, sie auslaufen zu lassen, um mehr Nachfrage zu schaffen. Jetzt ist Zoé zurück und bringt den Leuten, was sie immer haben wollten: Waffen, die zu der jeweiligen Kleidung passen.\nZoé hat umsichtig eine Auswahl klassischer Waffendesigns geschaffen, die aus einer großen Vielfalt an Kulturen stammen und die man für weltweit gefragt hält. Alle Waffen sind genau auf die Maße des jeweiligen Käufers abgestimmt.
item.tonfa_zoe_heritage.desc=In den späten 2060ern arbeitete Zoé mit einigen Zulieferern zusammen, um eine Reihe maßgeschneiderter historisch akkurater Kleidungsstücke herzustellen. Diese Kollektion war unglaublich erfolgreich, und Zoé erhielt zahlreiche Anfragen nach Accessoires. Nachdem die Kollektion ein Jahrzehnt lang gelaufen war, beschloss die Firma, sie auslaufen zu lassen, um mehr Nachfrage zu schaffen. Jetzt ist Zoé zurück und bringt den Leuten, was sie immer haben wollten: Waffen, die zu der jeweiligen Kleidung passen.\nZoé hat umsichtig eine Auswahl klassischer Waffendesigns geschaffen, die aus einer großen Vielfalt an Kulturen stammen und die man für weltweit gefragt hält. Alle Waffen sind genau auf die Maße des jeweiligen Käufers abgestimmt.
item.war_fan.desc=In den späten 2060ern arbeitete Zoé mit einigen Zulieferern zusammen, um eine Reihe maßgeschneiderter historisch akkurater Kleidungsstücke herzustellen. Diese Kollektion war unglaublich erfolgreich, und Zoé erhielt zahlreiche Anfragen nach Accessoires. Nachdem die Kollektion ein Jahrzehnt lang gelaufen war, beschloss die Firma, sie auslaufen zu lassen, um mehr Nachfrage zu schaffen. Jetzt ist Zoé zurück und bringt den Leuten, was sie immer haben wollten: Waffen, die zu der jeweiligen Kleidung passen.\nZoé hat umsichtig eine Auswahl klassischer Waffendesigns geschaffen, die aus einer großen Vielfalt an Kulturen stammen und die man für weltweit gefragt hält. Alle Waffen sind genau auf die Maße des jeweiligen Käufers abgestimmt.

item.crossbow_collapsible_light.desc=Diese moderne Armbrust besteht aus Hightech-Materialien, die ein leichtes Zusammenfalten erlauben, wodurch die Größe der Waffe beträchtlich abnimmt. Das macht diese Waffen ideal für Zeiten, in denen Tarnbarkeit eine Rolle spielt \u2013 vor allem, weil die Materialien nichtmetallisch sind und keine chemischen Verbindungen enthalten, die mit Chemsniffern entdeckt werden können.\nDie leichten Modelle sind für den einhändigen Gebrauch gemacht, die Standard- und schweren Modelle müssen mit beiden Händen eingesetzt werden.
item.crossbow_collapsible.desc=Diese moderne Armbrust besteht aus Hightech-Materialien, die ein leichtes Zusammenfalten erlauben, wodurch die Größe der Waffe beträchtlich abnimmt. Das macht diese Waffen ideal für Zeiten, in denen Tarnbarkeit eine Rolle spielt \u2013 vor allem, weil die Materialien nichtmetallisch sind und keine chemischen Verbindungen enthalten, die mit Chemsniffern entdeckt werden können.\nDie leichten Modelle sind für den einhändigen Gebrauch gemacht, die Standard- und schweren Modelle müssen mit beiden Händen eingesetzt werden.
item.crossbow_collapsible_heavy.desc=Diese moderne Armbrust besteht aus Hightech-Materialien, die ein leichtes Zusammenfalten erlauben, wodurch die Größe der Waffe beträchtlich abnimmt. Das macht diese Waffen ideal für Zeiten, in denen Tarnbarkeit eine Rolle spielt \u2013 vor allem, weil die Materialien nichtmetallisch sind und keine chemischen Verbindungen enthalten, die mit Chemsniffern entdeckt werden können.\nDie leichten Modelle sind für den einhändigen Gebrauch gemacht, die Standard- und schweren Modelle müssen mit beiden Händen eingesetzt werden.

item.colt_secret_agent.desc=Die Colt Agent Special ist schon lange eine der Waffen, die die Firma als Zweitwaffen vermarktet, daher beschloss Colt, in den Holdout-Markt einzusteigen, um zu sehen, ob der Name Colt auf einem eher durchschlagsarmen Markt durchschlagskräftig wäre. Die Secret Agent macht keine großen Löcher \u2013 sie ist schließlich eine Holdout-Pistole \u2013, aber sie ist so flach, dass sie eine der am besten zu tarnenden Pistolen auf dem Markt ist. Außerdem verhindert ihre nichtmetallische Konstruktion, dass sie von Scannern erfasst wird, die andere Waffen erkennen. Und darüber hinaus verliert man nicht viel Präzision.
item.colt_agent_special.desc=Die Colt Agent Special (oft fälschlich als \u201ESpecial Agent\u201D bezeichnet) basiert auf einem Rahmen, der schon über hundert Jahre alt ist, und ist eine Waffe, die nicht so genau weiß, was sie eigentlich sein will.Sie verschießt Munition für schwere Pistolen, hat aber wegen ihres kurzen Laufs die Reichweite einer leichten Pistole. Andererseits ist sie fast so klein wie eine Holdout-Pistole. Aber egal, was diese Waffe ist, die Agent Special ist eine exzellente Wahl als Zweitwaffe, weil sie hohe Präzision und hohes Schadenspotenzial mit kleinen Abmessungen verbindet.\nIhr Nachteile sind, dass sie nur eine begrenzte Menge Munition aufnehmen kann und man an ihr keinerlei Modifikationen oder Zubehör anbringen kann. Das einzige Zubehör, das die Agent Special aufnehmen kann, ist ein spezieller Lasermarkierer (50 Nuyen zusätzlich), der von Colt hergestellt wird und direkt unter der Laufschiene angebracht werden kann.
item.hk_p50.desc=HK will ein größeres Stück vom Markt für Seitenwaffen, und diese Pistole könnte dafür genau richtig sein. Ein internes Smartgunsystem wird durch einen Lasermarkierer unterstützt, der sich an die Entfernung vom Ziel anpasst. Standard-Halterungen, die an spezielle Holster angepasst sind, machen das ganze Paket zu einem Muss für jeden Sammler, und die Funktionalität macht die Waffe nützlich für den Straßensamurai mit ausgefallenem Geschmack.
item.cavalier_marshal.desc=Cavalier Arms (laut eigener PR der wichtigste Revolverfabrikant auf dem Markt) baute auf seinem Ruf auf und hat vor kurzem den Marshal vorgestellt. Er ist CAs erster schwerer Revolver mit \u201Evariabler Munitionierung\u201C und steht in direkter Konkurrenz zur Ares Predator VI, die ein ähnliches variables Munitionssystem bietet. Durch die Kombination aus einem angetriebenem Zylinder, einem Munitionskasten mit einem Unterlauf-Auffangsystem für verbrauchte Hülsen und einem Munitionstransfersystem kann der Marshal nachgeladen werden, ohne den Zylinder zu öffnen, indem man auf das interne Smartgunsystem zugreift. Die Waffe kann allerdings insgesamt nur zwölf Schuss aufnehmen: sechs im Zylinder und sechs im Kasten an der linken Seite der Waffe. Und das Transfersystem ist zwar verlässlicher als das der Predator VI, aber das Gewicht der zusätzlichen Munition an einer Seite der Waffe führt manchmal zu Balance- und Präzisionsproblemen auf größere Entfernung.
item.cavalier_parashield_dartgun.desc=Keine Beschreibung
item.hk_p60.desc=Alle Vorzüge der P50 mit noch mehr Bumms. Ein  ähnlich gebauter Rahmen und austauschbare Griffe machen das Paar zur perfekten Kombination für Sprawls, in denen die Größe eurer Kanone beschränkt ist. Die Griffe der 50 passen auf die 60, aber die Lage des Abzugs und das Gewicht sind wegen der größeren Patronen leicht unterschiedlich.
item.nemesis_arms_praetorian_ii.desc=Auch wenn das Marketing von Nemesis die Praetorian II als \u201Espektakuläre Weiterentwicklung eines zeitlosen Klassikers\u201C bezeichnet, ist diese Pistole nicht mehr als ein funktionelle, aber unspektakuläre Waffe mit einem durchschnittlichen Messer, das daran befestigt wurde, um eine Waffe zu schaffen, die mehr als die Summe ihrer Teile ist \u2013 aber in Wahrheit ist das nur eine Spielerei. Auch wenn die Waffe mehr verspricht, als sie hält, ist sie beliebt, vor allem bei Straßenkämpfer-Typen. Als Seitenwaffe bietet die Praetorian II ein brauchbares Schadensprofil und ein Smartgunsystem, aber ihr fehlt es im Vergleich zu vielen anderen Waffen ihrer Klasse etwas an Munitionskapazität. Als Nahkampfwaffe ist die angebrachte Klinge verwendbar, ist aber am besten für Schnitte geeignet, was in sehr engem Nahkampf manchmal nachteilig sein kann, wo das Zustechen die bessere Taktik ist.
item.praetorian_ii_blade.desc=Keine Beschreibung
item.colt_arms_m24.desc=Aufbauend auf dem Erfolg des Gewehrs M23 und des Karabiners M23A2 brachte Colt die M24 heraus, die auch auf der Plattform der M22/AR basiert. Sie ist ein bisschen größer als eine gewöhnliche Automatikpistole, aber kleiner als eine MP und sieht aus wie ein verkürzter M23A2 mit entfernter Schulterstütze und gekürztem Lauf. Die M24 wird als Selbstverteidigungswaffe vermarktet und ist für den Einsatz auf extrem beengtem Raum (z. B. in einem Fahrzeug) gedacht. Das große Kaliber, der kurze Lauf und das Fehlen jeder üblichen Rückstoßkompensation machen diese Waffe im Salven- und vollautomatischen Modus allerdings schwer zu kontrollieren. Um das zu kompensieren, bietet Colt eine \u201Estabilisierende Armstütze\u201C für 100 Nuyen zusätzlich an.
item.colt_arms_arm-brace.desc=Keine extra Beschreibung
item.ultimax_71.desc=Die Ultimax 71 ist ein bisschen altmodisch, aber immer noch effektiv \u2013 eine Waffe für Leute, die glauben, dass man auch ohne Elektronik Blei fliegen lassen kann. Es liegt eine schöne Einfachheit in einer Pistole, die dazu gedacht ist, genug Kugeln zu spucken, dass eine ganze Einheit sich lieber von einem fernhält. Es gibt einen Lasermarkierer als Zielhilfe, und die größte Veränderung zwischen der alten 70 und der neuen 71 ist das kleinere Design. Sie ist immer noch eine Automatikpistole, also kann man sie nicht einfach unter das Hemd stecken und hoffen, dass sie niemand bemerkt. Aber man kann sie vielleicht einfacher unter eine Jacke oder in eine Handtasche packen als die 70
item.cavalier_parashield_emergency_responder.desc=Cavalier Arms machte bei Polizei- und Sicherheitsunternehmen in Nordamerika einigen Eindruck, als es 2074 seine Schrotflinten-Werfer-Kombination auf den Markt brachte. Als dann Parashield, der Hauptkonkurrent von Narcoject auf dem Markt der nichttödlichen Waffen, mit einem Vorschlag zur Entwicklung eines neuen Waffensystems ankam, das für tödliche und nichttödliche Einsätze zu gebrauchen war, war Cavalier nur allzu gerne zur Zusammenarbeit bereit. Nach jahrelanger Entwicklung und Erprobung entstand 2078 schließlich die Emergency Responder als Antwort auf eine Frage, die niemand gestellt hatte.\nDie Responder ist eine Kombination aus MP und Pfeilpistole, die dazu gedacht war, Polizei und/oder Notfallteams eine nichttödliche Hauptwaffe zum Umgang mit Zielen zu verschaffen, die keine sofortige Eliminierung verdienten.\nDie MP-Komponente der Responder (von Cavalier zur Verfügung gestellt) hat ein kompaktes Bullpup-Design, das verlässlich und ausreichend präzise ist. Die Pfeilpistolen-Komponente (von Parashield) ist vor der Abzugsgruppe unter dem Lauf der MP angebracht und hat ein Magazin mit zehn Pfeilen und einen kleinen Gastank für zehn  Schuss. Ein elektronisches Feuersystem und ein integriertes Smartgunsystem erlauben dem Schützen, zwischen den beiden Waffen mit einem mentalen oder Stimmkommando umzuschalten. Optional kann man auch einen manuellen Schalter nachrüsten. \nDie Responder wurde an einige Polizei- und Sicherheitsdienstleister in Nordamerika ausgegeben, hat sich  aber nie wirklich durchgesetzt. Das könnte etwas mit einigen Vorfällen zu tun haben, bei denen Angestellte dachten, sie hätten auf die Pfeilpistole geschaltet, und irrtümlich und mit fatalen Folgen die MP zum Einsatz brachten. Die meisten Behörden und Firmen gaben Cavalier und Parashield wegen defekter Ausrüstung eine Mitschuld an diesen Vorfällen. In den meisten Fällen wurde die Unschuld von Cavalier und Parashield erwiesen, aber die Emergency Responder erhielt dadurch einen schlechten Ruf, der ihr bis heute anhaftet.
item.shiawase_arms_tactical_model_71A.desc=Die Tactical Model 71A ist eine Weiterentwicklung von Shiawases populärer Model 71 und kam 2079 auf den Markt. Die ursprüngliche Model 71 hatte den wohlverdienten Ruf einer unverwüstlichen Maschinenpistole, wurde als Teil von Shiawases Produktinitiative \u201EMobile Warrior\u201C entwickelt und bietet so viele Optionen, wie man nur irgendwie in ihr unterbringen konnte. Die 71A besteht aus denselben leichten Materialien, soll extrem benutzerfreundlich (also: für weniger talentierte Schützen einsetzbar) sein und ist serienmäßig mit einer Menge Systeme ausgestattet, die das Schießen leichter machen. Diese Systeme sind zwar nützlich, aber sie beanspruchten die Energieversorgung der Waffe bei der 71 oft zu sehr, was bis zu völligem Systemversagen führen konnte. Um dem entgegenzuwirken, hat die 71A eine stärkere und laut Berichten effizientere Energieversorgung. Um dafür Platz zu schaffen, entschieden sich die Designer für ein kleineres Kaliber. Ob diese Veränderungen effektiv waren, ist noch unbekannt, weil die Waffe noch nicht lange genug im Gebrauch ist, um verlässliche Zahlen zu liefern.
item.colt_ms-27.desc=In den letzten Jahren wurde Colt dafür kritisiert, seine Sturmgewehrplattform bis zum Letzten auszuquetschen, statt innovative Designs vorzustellen. Als Antwort kam von Colt: \u201EWarum etwas reparieren, was nicht kaputt ist?\u201C Mit dem Aufstieg des Konzepts der \u201ESturmschrotflinte\u201C sprang Colt Ende letzten Jahres auf den Zug auf und brachte eine Schrotversion seines klassischen M23 auf den Mark. Die Waffe wurde als MS-27 bezeichnet, und ihr Rahmen wurde umgebaut und verstärkt, um Standardpatronen vom Kaliber 12 aufzunehmen und mit dem verstärkten Rückstoß und der zusätzlichen Beanspruchung fertigzuwerden. Das Ergebnis ist eine insgesamt solide Waffe, die sogar im vollautomatischen Modus schießen kann. Schützen, die mit dem M23/23A2 vertraut sind, können mit wenig oder sogar ohne Zusatzausbildung zur MS-27 wechseln. \nTatsächlich haben M23 und MS-27 ungefähr dieselbe Größe und enthalten viele Gleichteile, was die Reparatur im Feld und die gesamte Logistik vereinfacht. Die MS-27 hat zwar ab Werk keinerlei Zubehör, um den Preis niedrig zu halten, aber dafür verfügt sie neben den integralen Standardhalterungen noch über zwei Zubehörhalterungen an den Seiten, sodass sie leicht mit Zubehör bestückt werden kann
item.defiance_t-285.desc=Manchmal braucht man eine einfache, gewöhnliche, schnörkellose, laute Donnerbüchse; besonders, wenn die auch noch drei Läufe hat. Was innerhalb der Defiance Corporation als Witz begann, wurde schnell zu einem echten Thema für die Firma. Die Waffe war zunächst ein persönliches Projekt eines der Waffenschmiede von Defiance, das ein scherzhaftes Geschenk an den CEO der Firma sein sollte. Als ein bei Defiance platzierter Konzernspion Wind von einem \u201Egeheimen neuen Projekt\u201C bekam, versuchte dieser schnell, die Daten über die nicht existierende Waffe zu bekommen, und fand nur grobe Skizzen (auf einer Papierserviette) einer Klappschrotflinte mit drei  Läufen und Pistolengriff. Diese Bilder fanden durch unglückliche Zufälle und Fehler ihren Weg in die Matrix und verbreiteten sich rasend schnell. Defiance packte die Gelegenheit beim Schopf, erstellte aus Copyrightgründen schnell echte Konstruktionspläne und begann mit einer Kleinserie, die bald ausverkauft war, was die Firma zu einem zweiten, dritten und vierten Produktionsdurchlauf zwang. Die T-285 wird als \u2013 wenn auch mächtiges \u2013 Kuriosum betrachtet und besteht praktisch aus nicht mehr als drei abgesägten Läufen der T-280, die in Pyramidenform zusammengeschweißt wurden. Manuelle Schalter hinter dem Kipppunkt steuern die Anzahl an abgegebenen Schüssen (einer, zwei oder drei).\nEs gibt kein Smartgunsystem, kein Zubehör und auch sonst keine Schnörkel. Was man von der T-285 bekommt, ist genau das, was man erwarten sollte: Durchschlagskraft mit dem Risiko eines Handgelenkbruchs.
item.franchi_spas-25.desc=SPAS-Schrotflinten sind seit fast einem halben Jahrhundert lang eine Standardwaffe bei paramilitärischen und Sicherheitskräften, und daran wird sich wohl auch nicht so bald etwas ändern. Die neue SPAS-25 hat ein relativ einfaches, schnörkelloses Design, das auf die frühere SPAS-22 zurückgeht, aber viele der innovativen Merkmale beibehält, die die SPAS-24 beliebt gemacht haben. \nDie sehr anpassungsfähige und verlässliche SPAS-25 funktioniert normalerweise halbautomatisch, kann aber auch als Vorderschaftrepetierer betrieben werden, um Ladehemmungen schnell zu beseitigen oder im Notfall die  Munition zu wechseln. Die SPAS-25 hat außerdem ab Werk ein Smartgunsystem und eine ausklappbare Schulterstütze zur leichteren Lagerung. Zusätzlich hat sie am Lauf eine Reihe von Sägezähnen. Diese Zähne helfen dabei, den Lauf an einer Tür zu fixieren, wenn man eindringen muss, sodass er beim Schuss stabilisiert wird.
item.ranger_arms_aa16_warhammer.desc=Vor drei Jahren kaufte Ranger Arms die Rechte an der berühmten Sturmschrotflinte AA-16. Zu dieser Zeit  ging man davon aus, auf eine Goldgrube gestoßen zu sein, und das stellte sich als richtig heraus. Die AA-16, besser als \u201EWarhammer\u201C bekannt, gilt als Höhepunkt der Entwicklung der Sturmschrotflinte. Sie ist eine Waffe mit hoher Durchschlagskraft auf kurze bis mittlere Distanz und der Fähigkeit zu vollautomatischem Feuer, die dafür berühmt ist, auch die zähesten Gegner ausschalten zu können und dabei eines der sanftesten Rückstoßverhalten aller im Moment eingesetzten Waffen zu haben. Die Wartung ist ebenfalls unglaublich einfach, weil der Feuermechanismus und die Abzugsgruppe aus einer rostfreien Chromstahl-Legierung bestehen, die Schmutz und Ruß widersteht, solange die Ablagerungen keine extremen Ausmaße annehmen.\nDas einzige echte Problem der Warhammer neben dem extrem hohen Preis besteht darin, dass sie fast zu gut und zu beliebt ist. Ranger Arms verdient zwar unglaublich viel Geld mit der Produktion, aber die Produktionskapazitäten sind überlastet. Das hat die Waffe auf der Straße und dem Schwarzmarkt extrem begehrt gemacht. Wenn man keine gute Insider-Connection hat, (mit viel Glück) eine im Laden findet oder auf die Auslieferung durch Ranger Arms warten kann, kann man mit mindestens 50 oder 70 Prozent Preisaufschlag rechnen, wenn man eine kriegt.
item.onotari_arms_rhino_hunter.desc=Das ursprüngliche Rhino Hunter kam vor etwa zehnJahren auf den Markt für Sportgewehre. Es wurde speziell für \u201Egrößere Metamenschen\u201C (ihr wisst, wen ich meine) entworfen und hat ein sehr schnörkelloses Design. Im Prinzip haben sie einfach ein Gewehr rund um die stärkste Jagdmunition der Welt gebaut und dann groß genug gemacht, damit es bequem in die Hände der größeren Metamenschen passt, die meistens mit dem gewaltigen Rückstoß fertigwerden. Und ab damit auf den Markt! Aber trotz des seltsamen Marketings wurde das Rhino Hunter zu einer beliebten Waffe innerhalb der Troll- und Orkgemeinde.\nDann wurde vor zwei Jahren der Bedarf nach einem Rhino Hunter mit \u201Etraditionellerer\u201C Größe so groß, dass Onotari zwei Versionen herzustellen begann: das traditionelle Alpha und das kleinere Beta. Onotari hat nicht mehr gemacht, als Griff und Bedienelemente des Alpha neu zu dimensionieren und ihm einen neuen Namen zu verpassen. Die Waffe besteht aus stark verstärktem Material, um durch den Rückstoß keinen Schaden zu nehmen (auch wenn das fast nichts zur Kompensation beiträgt).\nDie erwähnte Munition sitzt in einem internen Magazin mit sieben Schuss. Dieser Munitionsvorrat reicht für das moderne Schlachtfeld eigentlich nicht aus, aber der Daseinszweck des Rhino Hunter liegt bei genauerer Betrachtung auch nicht im traditionellen Kampf, sondern im Auswählen und Ausschalten eines einzelnen Ziels.\nSowohl Alpha als auch Beta haben ab Werk weder Modifikationen noch Zubehör, aber man geht davon aus, dass die Kunden ihre Waffen an ihre Bedürfnisse und Vorlieben anpassen.
item.izom_artemis.desc=Das Artemis ist eines dieser Waffensysteme, die in den richtigen Händen effektiv sein können, aber in anderen Händen ein Schwachpunkt sind. Es ist fast ausschließlich für den Kampf auf beengtem Raum gedacht, hat verkürzte Läufe (auch für den Granatwerfer) und keine Schulterstütze. Das hat dem Artemis (zu Recht) den Ruf eingebracht, extrem unpräzise (und in den Händen unerfahrener Schützen gefährlich) zu sein, aber die Waffe ist wegen des Granatwerfers in gewissen Kreisen beliebt.
item.izom_artemis_launcher.desc=Keine Beschreibung
item.onotari_arms_jp-k51.desc=Die Geschichte und die Evolution der JP-K-Serie von schweren Sturmgewehren ist lang und kompliziert. Ursprünglich war das JP-K49 dafür gedacht, in den nächsten Eurokriegen eingesetzt zu werden, die aber nie kamen. Also setzten die Gewehre in europäischen Lagern jahrzehntelang Staub an, bis die Produktion mit einer neuen, verbesserten Version namens JP-K50 wieder aufgenommen wurde. Die Modelle 49 und 50 wurden im Drachenbürgerkrieg beliebt, weil sie eine gewisse Effektivität gegen (einige) Dracoformen bewiesen (wenn sie in Massen eingesetzt wurden). Sie wurden fast nur von Kräften benutzt, die Lofwyr gegenüber loyal waren. Die Überlebenden der Kämpfe durften diese mächtigen Waffen als Teil ihrer Entlohnung für geleistete Dienste behalten. Nach dem Bürgerkrieg verlangsamte sich der Absatz des JP-K sehr stark, und die Waffen, die produziert wurden, wurden fast (aber nur fast) ausschließlich vom Saeder-Krupp-Militär und verbündeten Kräften benutzt. \nOnotari kündigte 2077 ein neues Modell, das JP-K51, für den Massenmarkt an. Dieses neue Modell unterschied sich nicht sehr von seinen beiden Vorläufern, nur hatte es jetzt ab Werk ein Smartgunsystem.\nDas JP-K passt nicht eindeutig in traditionelle Waffenkategorien, aber mit seiner Reichweite und Schadenskapazität und der Fähigkeit zum Salvenfeuer wird es meistens als schweres Sturmgewehr betrachtet. \nDas JP-K51 ist höchst präzise designt und produziert, besteht aus qualitativ hochwertigem Material und ist teuer, aber auch extrem gut in dem, was es tut: Es bietet präzises Feuern auf große Entfernung für die Zug- oder sogar Trupp-Ebene. Die Beschwerden über diese Waffe beschränken sich im Moment darauf, dass sie extrem sperrig und kopflastig ist, besonders wenn Zubehör (wie ein Zweibein) angebracht ist.
item.onotari_arms_kali_ii.desc=Das Kali II basiert auf dem \u201ESturmgewehrstil\u201C, der sich schließlich zu modernen Waffen wie dem Colt  M22A2, M23, M23A2 und so weiter entwickelte, und ist die Version von Onotari Arms auf diesem Gebiet. Insgesamt ist das Kali II eine robuste und  schnörkellose Waffe, die auf dem ursprünglichen  Sturmgewehr Kali basiert. Auch wenn die Waffe auf dem Sturmgewehr basiert, hat sie funktionell mehr mit den ebenfalls klassischen AK zu tun, was die Robustheit und das Schadenspotenzial betrifft. Wie ein AK braucht auch ein Kali II nur minimale Wartung, um kampfbereit zu sein, und es kann im Feld einfach gepflegt werden.\nDas robuste Design des Kali II erlaubt auch den Einsatz als improvisierte Nahkampfwaffe im Notfall, ohne dass es besonders darunter leidet. Die Waffe ist besonders auf Überlegenheit auf kurze bis mittlere Entfernung ausgelegt und bis auf normalgroße Entfernung extrem präzise; danach nimmt die Präzision rapide ab. Außerdem hat die Waffe eine Nahkampfverstärkung und zusätzlich zu den für ein Sturmgewehr integralen Halterungen zwei Zubehörhalterung, die sich jeweils an den Seiten befinden, was sie extrem anpassungsfähig macht
item.onotari_arms_war_hound.desc=Das War Hound wurde als effektives Waffensystem für fast alle Distanzen und für verschiedene Einsatzzwecke/Umgebungen entworfen. Es handelt sich um ein Bullpup-Sturmgewehr, das auf dem erfolgreichen Room Sweeper von Onotari (nicht zu verwechseln mit der Remington Roomsweeper) basiert. Ausgehend vom Room Sweeper machten die Designer die Waffe deutlich schlanker, leichter und kompakter. Und mit derselben Lauflänge wie ein normales Sturmgewehr bleibt das War Hound trotz der geringeren Gesamtlänge auf größere Entfernungen effektiv. Außerdem hat das War Hound die Besonderheit, nur 75 bis 80 Prozent der Größe und des Gewichts anderer Waffen seiner Klasse zu haben. Damit es auf nähere Entfernung noch effektiver ist, hat ihm eine Unterlauf-Schrotflinte mit sechs Schuss verpasst, um ihm mehr Durchschlagskraft und die Möglichkeit zu schnellem Eindringen zu geben.\nDas War Hound hat außerdem zwei Halterungen an den Seiten und ein internes Smartgunsystem, das fast vollständig an der Oberseite der Waffe angebracht ist, was es im Feld leichter zu reparieren und zu warten  macht. Das War Hound ist keine optimale Waffe, aber verdammt nah dran.
item.under_shotgun_war_hound.desc=Keine extra Beschreibung
item.under_shotgun.desc=Die Installation einer Unterlaufwaffe macht die Installation von sonstigem Unterlaufzubehör und -modifikationen unmöglich. Unterlaufwaffen stehen für alles, was kleiner ist als ein Gewehr, nicht zur Verfügung. Diese Modifikation verbraucht 2 Slots. Nicht kompatibel mit unterlaufmontiertem Zubehör.\nBis auf die Schrotflinte, die mit der Fertigkeit Feuerwaffen abgefeuert wird, werden alle anderen aufgeführten Waffen mit der Fertigkeit Exotische Waffe (SR6, S. 97) geführt. Eine Waffe, die mit einer Unterlaufwaffe ausgestattet ist, hat Tarnbarkeit 0.
item.under_grenade_launcher.desc=Die Installation einer Unterlaufwaffe macht die Installation von sonstigem Unterlaufzubehör und -modifikationen unmöglich. Unterlaufwaffen stehen für alles, was kleiner ist als ein Gewehr, nicht zur Verfügung. Diese Modifikation verbraucht 2 Slots. Nicht kompatibel mit unterlaufmontiertem Zubehör.\nBis auf die Schrotflinte, die mit der Fertigkeit Feuerwaffen abgefeuert wird, werden alle anderen aufgeführten Waffen mit der Fertigkeit Exotische Waffe (SR6, S. 97) geführt. Eine Waffe, die mit einer Unterlaufwaffe ausgestattet ist, hat Tarnbarkeit 0.
item.under_micro_combat_chainsaw.desc=Die Installation einer Unterlaufwaffe macht die Installation von sonstigem Unterlaufzubehör und -modifikationen unmöglich. Unterlaufwaffen stehen für alles, was kleiner ist als ein Gewehr, nicht zur Verfügung. Diese Modifikation verbraucht 2 Slots. Nicht kompatibel mit unterlaufmontiertem Zubehör.\nBis auf die Schrotflinte, die mit der Fertigkeit Feuerwaffen abgefeuert wird, werden alle anderen aufgeführten Waffen mit der Fertigkeit Exotische Waffe (SR6, S. 97) geführt. Eine Waffe, die mit einer Unterlaufwaffe ausgestattet ist, hat Tarnbarkeit 0.
item.under_micro_bolo_launcher.desc=Die Installation einer Unterlaufwaffe macht die Installation von sonstigem Unterlaufzubehör und -modifikationen unmöglich. Unterlaufwaffen stehen für alles, was kleiner ist als ein Gewehr, nicht zur Verfügung. Diese Modifikation verbraucht 2 Slots. Nicht kompatibel mit unterlaufmontiertem Zubehör.\nBis auf die Schrotflinte, die mit der Fertigkeit Feuerwaffen abgefeuert wird, werden alle anderen aufgeführten Waffen mit der Fertigkeit Exotische Waffe (SR6, S. 97) geführt. Eine Waffe, die mit einer Unterlaufwaffe ausgestattet ist, hat Tarnbarkeit 0.
item.under_grapple_gun_launcher.desc=Die Installation einer Unterlaufwaffe macht die Installation von sonstigem Unterlaufzubehör und -modifikationen unmöglich. Unterlaufwaffen stehen für alles, was kleiner ist als ein Gewehr, nicht zur Verfügung. Diese Modifikation verbraucht 2 Slots. Nicht kompatibel mit unterlaufmontiertem Zubehör.\nBis auf die Schrotflinte, die mit der Fertigkeit Feuerwaffen abgefeuert wird, werden alle anderen aufgeführten Waffen mit der Fertigkeit Exotische Waffe (SR6, S. 97) geführt. Eine Waffe, die mit einer Unterlaufwaffe ausgestattet ist, hat Tarnbarkeit 0.
item.shiawase_arms_tactical_model_73.desc=In den frühen 2070ern rief Shiawase Arms zusammen mit seiner Tochterfirma Nemesis ein Programm namens \u201EMobile Warrior\u201C ins Leben. Das Ziel war, mit einer Reihe von Waffen, Panzerungen und Ausrüstungsgegenständen ein umfassendes, integriertes Kampfsystem für den Durchschnittssoldaten zu schaffen. Das Programm setzte sich nie durch, weil die Kosten explodierten und es Probleme mit der Panzerung und der Kommunikationsausrüstung gab. Aber die geplanten Hauptwaffen für Mobile Warrior, die MP Model 71 und das Sturmgewehr Model 73 \u201EFatal Light\u201C, waren erfolgreich genug, dass Shiawase Arms sie in die Vollproduktion übernahm. Wie die 71 ist das Tactical Model 73 extrem benutzerfreundlich, verlässlich und präzise im Feld. Aber die Designer des 73 trafen auch einige ... ungewöhnliche Entscheidungen.\nDie erste betrifft das besondere Spiralmagazin, das unter der Schulterstütze angebracht ist und manchmal nicht richtig in der Waffe sitzt, was das automatische Ladesystem versagen lässt. Und obwohl das Magazin überwältigende 100 Schuss fasst, sind diese eigentlich nur besonders kräftige MP-Patronen, die speziell auf größere Distanzen und speziell auf das Model 73 ausgelegt sind. Sie können nicht in anderen Waffen eingesetzt werden. Aber trotz dieser offensichtlichen Schwächen ist das 73 bei Sicherheitsleuten und Söldnern eine beliebte Waffe. Es gibt sogar Gerüchte, dass es der heißeste Kandidat für die neue Standardwaffe der Kaiserlich Japanischen Armee ist.
item.ultimax_83.desc=Nicht jeder Freiberufler, nicht jede Sicherheitsfirma oder Söldnertruppe kann sich die neueste und beste Bewaffnung oder Ausrüstung leisten. Hier finden Waffen wie das Ultimax 83 ihren Platz. Die Waffe hat grauenhafte ballistische Eigenschaften, nur einen einfachen Lasermarkierer als Standard-Zubehör und ist das Paradebeispiel einer Billigwaffe. Aber trotz dieser Nachteile hat das Ultimax 83 (erschreckenderweise) positive Merkmale. Erstens ist es unverwüstlich, nahkampfverstärkt und kann mit fast jeder Umgebung fertigwerden. Zweitens: Wenn es trifft, dann trifft es hart. Und drittens ist es so verdammt billig \u2013 günstiger als fast jedes andere normale Sturmgewehr, was großartig ist, wenn man eine Truppe schnell und billig ausrüsten muss. Das alleine hält das Ultimax in der Produktion und auf dem Schlachtfeld.
item.psg_enforce_ii.desc=Das ursprüngliche Enforcer, das von Heckler & Koch  (HK) hergestellt wurde, war das beliebteste Anti-Personen-Gewehr bei Polizei und Sicherheitsfirmen auf der ganzen Welt. Das Enforcer hatte etwa drei Viertel der Größe der meisten anderen Waffen seiner Klasse und konnte leicht in (oft beengten) gepanzerten Einsatzfahrzeugen transportiert werden. Das Enforcer war zwar auf sehr weite Entfernung nicht das präziseste Waffensystem, aber seine unglaubliche Präzision auf mittlere bis weite Entfernung machte es im Stadtkampf außergewöhnlich tödlich, wo die Entfernung oft keinen so großen Einfluss hatte. Viele \u201EBedrohungen\u201C wurden von Scharfschützen mit einem Enforcer  ausgeschaltet, und einige überlebten sogar. Aber das hervorstechendste Merkmal der Waffe war das patentierte doppelte Munitionszufuhrsystem, das mit  dem Smartgunsystem der Waffe verbunden war. Es erlaubte dem Schützen, verschiedene Munitionsarten zu verwenden, um in jeder Situation die richtige Antwort parat zu haben. In den meisten Fällen bedeutete  das, eines der Magazine mit tödlicher und das andere mit weniger tödlicher Munition zu bestücken. Dieser Vorzug wurde durch die kürzlich erfolgte Einführung  der Munitionswahl-Technologie noch vergrößert. Um diese voll auszunutzen, begann HK mit der Produktion des Enforcer II. Die ersten Modelle wurden an Sicherheitsfirmen in Europa, dem Nahen Osten und in bestimmten Regionen Nordamerikas ausgeliefert.\n\nIn fast jeder Hinsicht sind Enforcer und Enforcer II dieselbe Waffe. Das Enforcer II ist etwas sperriger, um Platz für das Munitionswahl- und Zuführsystem zu schaffen, das jetzt mehr als nur zwei unterschiedliche Munitionsarten aufnehmen kann. Die beiden Magazine des Enforcer sind nebeneinander in einem vergrößerten Gehäuse vor dem Abzugsbügel untergebracht. Der Schütze kann die zum Gegner passende Munitionsart über das Smartgunsystem der Waffe auswählen.\nZusätzlich zu dem ab Werk vorhandenen Smartgun- und Munitionswahlsystem bietet das Enforcer auch ein abnehmbares Zielfernrohr. Wegen verschiedener Verträge sind Enforcer und Enforcer II eigentlich für niemanden zu kaufen, der nicht bei der Polizei oder einer Sicherheitsfirma ist.
item.ranger_arms_m1400.desc=2077 sicherte sich Ranger Arms als Teil einer großen Einkaufstour die Rechte und Designs des Springfield M1A, eines über ein Jahrhundert alten Sportgewehrs (das auf einem alten Militärgewehr des 20. Jahrhunderts basierte), das als Plagiat immer noch von einigen zwielichtigen Waffenschmieden rund um den Pazifik produziert wurde. Zuerst waren die Leute in der Feuerwaffenindustrie verwundert, die sich fragten, was durch eine solche Übernahme zu gewinnen wäre.\nAnfang 2080 beantwortete Ranger Arms diese Frage mit der Vorstellung des M-1400 \u201ESpringfield\u201C. Das M-1400 basiert auf dem M1A und dem älteren M14, besteht aber aus modernen Materialien. Es handelt sich um eine einfache, verlässliche und vor allem präzise Waffe, die für einzelne Schützen oder Einheiten mit einem eher konservativen Budget die Leistung eines Präzisionsgewehrs bringen sollte. Außer dem Präzisionslauf, das den Militärstandard für verbesserte Ballistik erfüllen soll, ist der Rest des M-1400 aus zuverlässigen, aber kostengünstigen Materialien gefertigt. Das macht die Waffe auch leicht zu reparieren und zu warten.
item.shiawase_arms_tactical_model_69.desc=Das Model 69 wurde zusätzlich zu den anderen Waffen des Programms \u201EMobile Warrior\u201C als durchschlagskräftiges materialzerstörendes Gewehr entworfen, das auch in einer Scharfschützenrolle eingesetzt werden und für Züge oder Trupps Präzisionsfeuer auf große Entfernung geben sollte. Es besteht aus denselben Leichtmaterialien wie die Model 71 und das 73 und wurde speziell für das Schlachtfeld entwickelt. Die ersten Modelle hatten interne Waffenkommlinks, aber 2076 wurden diese aus den lagernden Waffen und aus der Produktion entfernt, weil härtere Einsatzbedingungen zu verheerenden Fehlern führten. Um das zu kompensieren, wurden die Kommlinks durch hochmoderne Smartgun-Zielsysteme ersetzt. Ab dann attestierten die meisten Einsatzberichte der Waffe gute Leistungen, besonders in Bezug auf die Präzision und das hohe Schadenspotenzial, was sich mit zwei Worten zusammenfassen lässt: \u201EHeilige Scheiße!\u201C\nAber ein Problem mit dem Model 69, das Schützen immer wieder bemängeln, besteht im langen Lauf, der in manchen taktischen Bedingungen wie Dschungel- oder Stadtkampf ein Hindernis sein kann.

item.crackshot_arms_roaring_thunder.desc=Wenn man Feuerwaffen designt, braucht man manchmal Jahre der Forschung und Entwicklung und einen Haufen Nuyen, um eine Waffe zu testen und abzustimmen, bevor sie in die Produktion gehen kann. Dadurch versucht man, grobe (und potenziell katastrophale) Fehler auszumerzen und die Stärken des Waffensystems zu verbessern. Die Zeit, die man dafür braucht, kann lang und teuer sein, bis das Endprodukt ertig ist. Auf der anderen Seite gibt es auch Leute, die einfach irgendwelchen Drek zusammenbasteln, um zu sehen, was passiert \u2013 oder weil sie verzweifelt sind. Beides beschreibt kurz und bündig Crackshot Arms, eine neue Waffenfirma (im weitesten Sinne) in Motor City. Während der Unannehmlichkeiten vor dem Abzug von Ares konstruierten die Besitzer/Ingenieure von Crackshot eine wahre Monstrosität unter den Feuerwaffen, die im Grunde ein Schrot-LMG mit drei rotierenden Läufen ist. Um mit den lokalen Feinseligkeiten fertigzuwerden, wurde der Prototyp des Roaring Thunder als verzweifelte Maßnahme zusammengeschustert, um bei der Verteidigung einer zivilen Hilfseinrichtung zu helfen. Obwohl seine Feuerkraft und die Fähigkeit, gottlos hohe Mengen an Schrot oder Vollkugeln zu verfeuern, beeindruckend sind, war der Prototyp für seine mangelnde Präzision berüchtigt, lieferte ein wenig verlässliches Trefferbild und versagte manchmal komplett. Aber wenn die Waffe traf, wurde das Ziel meistens pulverisiert.\nNach dem Ende der Feindseligkeiten verbreiteten sich Berichte über das Roaring Thunder, und die Einheimischen wollten alle eines haben. Nach einer (mehr oder weniger gründlichen) Überarbeitung der Waffe begann der Verkauf auf den örtlichen Schattenmärkten.\nDie Waffe selbst ist für ein LMG auf der schwereren Seite, knapp über 1,25 Meter lang und sieht aus wie eine primitive Metallkiste mit einem Dreifachlauf an der Vorderseite, einer Munitionszufuhr per Gurt in der Mitte, einer Griff-/Abzugskonstruktion oben und einer Armstütze, die dem Schützen mit dem Rückstoß hilft. Es sollte auch angemerkt sein, dass das Roaring Thunder so gut wie keine Rückstoßkompensation hat.\nDie hohe Feuerrate macht die Waffe ohne eine Art Gyrostabilisation, eine feste Stütze wie zum Beispiel ein Dreibein oder einfach rohe Stärke schwer einzusetzen. Das Roaring Thunder ist eine extrem einfache Waffe, aber es kann alle normalen Modifikationen und passenden Zubehörteile aufnehmen.
item.ingram_white_knight_mod1.desc=Wie andere MGs von Ingram ist auch das LMG White Knight seit Jahrzehnten ein beliebter Standard bei militärischen, paramilitärischen und Sicherheitstruppen. Durch dauernde Weiterentwicklungen wird sich das auch nicht so bald ändern. Das White Knight ist verlässlich und durchschlagskräftig und war auch deshalb beliebt, weil man das Gefühl hatte, es einfach so einsetzen zu können, wie es war \u2013 man musste es vor dem Kampf einfach nur laden. Zum Teil lag das an den Systemen, die bereits ab Werk verbaut waren: ein Smartgunsystem, eine leistungsfähige Rückstoßkompensation und eine ausklappbare Schulterstütze für leichtere Lagerung und leichteren Transport.\nAußerdem hat die neueste Version des White Knight ein hochmodernes Zuführsystem, das präzises Zielen erlaubt. Aber diese Vorteile haben ihren Preis. Das White Knight ist so präzise entworfen und gefertigt, dass es keine anderen internen Modifikationen aufnehmen kann, und es hat extern nur begrenzt Platz für Zubehör. Wegen seiner Leistungsdaten halten das viele aber für einen vertretbaren Preis. Aber vor drei Jahren kündigte Ingram die neue Knight-MG-Serie an.\nDas erste in dieser neuen Serie ist das White Knight Mod. 2. Es ist dem Vorgänger sehr ähnlich, bietet aber ein neues System austauschbarer Läufe (mit Griff), was das Anbringen eines kürzeren Laufs ermöglicht, wodurch es auf beengtem Raum und in Fahrzeugen besser einsetzbar ist. Der kürzere Lauf verändert zwar die Reichweite, kann aber leicht gegen den längeren ausgetauscht werden, wenn man eine höhere Kampfentfernung zu bewältigen hat. Ansonsten sind alle Komponenten des ursprünglichen White Knight (als Mod. 1 bezeichnet, um die Unterscheidbarkeit zu erhalten) auch im Mod. 2 einsetzbar und umgekehrt.
item.ingram_white_knight_mod2.desc=Wie andere MGs von Ingram ist auch das LMG White Knight seit Jahrzehnten ein beliebter Standard bei militärischen, paramilitärischen und Sicherheitstruppen. Durch dauernde Weiterentwicklungen wird sich das auch nicht so bald ändern. Das White Knight ist verlässlich und durchschlagskräftig und war auch deshalb beliebt, weil man das Gefühl hatte, es einfach so einsetzen zu können, wie es war \u2013 man musste es vor dem Kampf einfach nur laden. Zum Teil lag das an den Systemen, die bereits ab Werk verbaut waren: ein Smartgunsystem, eine leistungsfähige Rückstoßkompensation und eine ausklappbare Schulterstütze für leichtere Lagerung und leichteren Transport.\nAußerdem hat die neueste Version des White Knight ein hochmodernes Zuführsystem, das präzises Zielen erlaubt. Aber diese Vorteile haben ihren Preis. Das White Knight ist so präzise entworfen und gefertigt, dass es keine anderen internen Modifikationen aufnehmen kann, und es hat extern nur begrenzt Platz für Zubehör. Wegen seiner Leistungsdaten halten das viele aber für einen vertretbaren Preis. Aber vor drei Jahren kündigte Ingram die neue Knight-MG-Serie an.\nDas erste in dieser neuen Serie ist das White Knight Mod. 2. Es ist dem Vorgänger sehr ähnlich, bietet aber ein neues System austauschbarer Läufe (mit Griff), was das Anbringen eines kürzeren Laufs ermöglicht, wodurch es auf beengtem Raum und in Fahrzeugen besser einsetzbar ist. Der kürzere Lauf verändert zwar die Reichweite, kann aber leicht gegen den längeren ausgetauscht werden, wenn man eine höhere Kampfentfernung zu bewältigen hat. Ansonsten sind alle Komponenten des ursprünglichen White Knight (als Mod. 1 bezeichnet, um die Unterscheidbarkeit zu erhalten) auch im Mod. 2 einsetzbar und umgekehrt.
item.shiawase_arms_nemesis_ii.desc=Das ursprüngliche Nemesis ist nach der griechischen Göttin der göttlichen Gerechtigkeit und der Rache benannt und wurde als benutzerfreundliche, tragbare Infanterie-Unterstützungswaffe entwickelt. Das Konzept bestand darin, rund um ein hochklassiges Freund-/Feind-Erkennungssystem eine Waffe zu bauen, die bei schlechteren oder weniger erfahrenen Truppen Eigenbeschuss minimieren und dennoch eine gute Leistung für bessere oder erfahrenere Truppen bieten sollte. In vieler Hinsicht war das Nemesis  ein Erfolg. Bei den Einheiten, für das es entwickelt worden war, deuteten Berichte darauf hin, dass die Vorfälle von Eigenbeschuss durch seinen Einsatz tatsächlich abnahmen. Aber diese Berichte sprachen auch davon, dass das System Hackern gegenüber anfällig und die Munitionszufuhr extrem empfindlich gegenüber Verschmutzung und Blockaden war. Das neue Nemesis II hat diese Probleme im Großen und Ganzen nicht mehr, weil es aus stärkeren, leichteren Materialien besteht, die denen der \u201EMobile Warrior\u201C-Linie ähneln. Das Ergebnis ist ein Waffensystem, das 25 Prozent leichter als der Vorgänger ist. Diese leichten Materialien führen allerdings auch dazu, dass sich der Rückstoß stärker auswirkt, was das Nemesis II im Kampf weniger präzise macht, auch wenn es immer noch ein passables Waffensystem ist.
item.ares_m22A1.desc=Überlasst es Ares, ein bereits mächtiges Waffensystem in jeder Hinsicht größer zu machen, einfach weil es das kann. Im Fall des M-22A1 taten Ares\u2019 Entwickler genau das und noch ein bisschen mehr. Das Konzept des M-22 basiert auf dem alten schweren Maschinengewehr M-2 von Browning, das oft als Hauptwaffe auf leichten bis mittleren Fahrzeugen verwendet wurde, und wurde von Browning als moderne Weiterentwicklung des klassischen Waffensystems geplant. Aber durch einige juristische Winkelzüge und Hinterzimmergeschäfte konnte sich Ares Arms alle Rechte an dieser Plattform sichern. Jetzt ist das (ultra) schwere Maschinengewehr als M-22A1 bekannt und wurde ursprünglich ausschließlich für die Spezialtruppen von Firewatch hergestellt. Das \u201EMad Mamma\u201C, wie die Waffe bald bezeichnet wurde, kam bei der jüngsten Action in Detroit vielfach zum Einsatz und erwarb sich schnell einen Ruf als \u201EBug-Killer\u201C. Nach diesem kleinen Konflikt gab Ares Arms bekannt, das Mad Mamma ab dem zweiten Quartal 2081 \u201Ebevorzugten und qualifizierten Kunden\u201C zum Kauf anzubieten. Aber es gibt bereits Berichte, dass diese Waffen schon über Schmuggler und Schwarzmärkte nach Nordamerika und Nordafrika gelangt sind. \nWie das Vorgängersystem ist auch das M-22A1 nicht als tragbare Waffe gedacht, auch wenn es von Hand bedient wird. Seine Größe, das Gewicht, das schwere Kaliber und der gewaltige Rückstoß können nur gebändigt werden, wenn die Waffe (sicher) auf einem Fahrzeug oder einer schweren Kampfdrohne montiert oder mit einem Dreibein am Boden verankert ist. Es hat seinen Grund, dass die Waffe technisch gesehen als \u201Eultraschweres\u201C Maschinengewehr klassifiziert wird.
item.ingram_grey_knight.desc=Das Zweite in Ingrams Knight-MG-Serie ist das Grey Knight: ein einfaches mittleres Maschinengewehr. Im Prinzip ist es eine schwerere Version von Ingrams LMG White Knight mit größerem Kaliber und Gurtzufuhr. Es wurde als mittelschwere Waffe für die Bedienung durch Trupps oder für die Montage auf einem Fahrzeug oder einer Drohne entworfen.\nDas Grey Knight wird jedoch manchmal auch von einzelnen Personen mit robuster Statur oder ordentlichen Stärkemodifikationen eingesetzt. Es hat ab Werk dieselbe Rückstoßkompensation und dasselbe Zufuhrsystem wie das White Knight und auch ein Smartgunsystem. Aber die ausklappbare Schulterstütze wurde durch eine abnehmbare Schulterstütze ersetzt, in der sich auch ein kleines Waffenwerkzeugset befindet. Und wie das White Knight kann auch das Grey Knight keine zusätzlichen Modifikationen aufnehmen.
item.ingram_black_knight.desc=Das Black Knight ist das neueste und schwerste von Ingrams Knight-MG-Serie und sogar für ein schweres Maschinengewehr eine Bestie. Es sieht oberflächlich wie seine Schwester-MGs White und Grey Knight aus, ist aber fast anderthalbmal so groß und damit knapp 1,6 Meter lang. Mit der schweren Munition vom Kaliber .50 hat das Black Knight eine etwas langsamere Feuerrate als die meisten SMGs, aber das macht es durch eine Präzision wett, wie sie bei den meisten Waffen seiner Klasse nicht zu finden ist. Es hat ein fortschrittliches Rückstoßdämpfungssystem aus mehreren Komponenten, das den Gesamtrückstoß auf ein Minimum reduziert, was besonders auf große Entfernung optimale Zielsicherheit bietet. Das Black Knight wiegt ungefähr dreißig Kilogramm und wird oft in einer fixen Feuerstellung oder auf einem Fahrzeug oder einer Drohne montiert eingesetzt. Man sollte auch anmerken, dass die Waffe trotz ihrer Leistungsdaten extrem heikel sein kann und dauernde Wartung braucht, damit alle Systeme vollständig funktionsfähig bleiben.
item.ares_arms_vigorous.desc=Die Vigorous wurde als direktes Konkurrenzprodukt zur legendären Panther entworfen, litt aber bereits kurz nach der Markteinführung unter schlechter Mundpropaganda. In der Folge brachen die Verkaufszahlen der Vigorous ein, und die Produktion wurde stark eingeschränkt, sodass kaum noch ein Dutzend Stück pro Monat hergestellt wurden. Ares setzte die Produktion nur fort, um Verträge mit Zulieferbetrieben einzuhalten, und wollte nach deren Ablauf die Reihe einstellen. Aber auch wenn die Vigorous in der Matrix, den sozialen Medien und bei allen Waffenhändlern verteufelt wurde, bekamen die Leute, die (mit gewaltigen Rabatten) eine davon kauften, eine Waffe, die in jeder Hinsicht gute Leistungen lieferte. Schließlich veränderte sich die Mundpropaganda, und der Ruf der Vigorous erholte sich langsam.\nAber tief verankerte Ansichten ändern sich schwer, und die Vigorous leidet immer noch unter schlechten Bewertungen, obwohl sie sich mehrfach im Kampfeinsatz bewährt hat. Die Vigorous wurde als sehr einfache Sturmkanone ohne schicke Zielfindungssysteme oder Rückstoßkompensation konzipiert, wie sie bei anderen Kanonen zu dieser Zeit verbreitet waren.\nStattdessen war sie absichtlich darauf ausgelegt, von den Benutzern an ihre Bedürfnisse angepasst zu werden. Daher ist sie sehr leicht zu modifizieren und im Feld zu warten. Was die Leistung betrifft, kann die Vigorous beim Schaden durchaus mit anderen Sturmkanonen mithalten. Aber sie leidet auf größere Entfernung unter ballistischen Schwächen, was einer der häufigsten (und kleinlichsten) Kritikpunkte an dieser Waffe ist.\nDie Vigorous hat ab Werk keine besonders umfangreiche Ausstattung, wird aber mit einem Schockpolster an einer festen Schulterstütze und einem Zweibein ausgeliefert. Wenn man sich von der schlechten Presse nicht beeinflussen lässt, bekommt man mit der Vigorous eine verlässliche Sturmkanone zum Discountpreis, aber der günstige Preis könnte sich in naher Zukunft ändern.
item.krime_thumper.desc=Wolltet ihr immer schon mal Granaten auf eure Feinde hageln lassen, als gäbe es kein Morgen? Wolltet ihr die Vorteile eines Airburst-Systems ohne dessen Kosten haben? Wolltet ihr jemals gewaltige Schrapnells auf jemanden abfeuern? Hier kommt die Lösung! Krime kann\u2019sTM. Der Krime Thumper ist ein dreiläufiger Granatwerfer, der wie andere Granatwerfer jede Art von Granaten abfeuern kann. Er hat einen einzigartigen Feuermodus, bei dem alle drei Läufe gleichzeitig feuern können. Die Granaten landen so, dass ihre Sprengwirkungen einander überlappen und damit den Wirkungsbereich vergrößern. Außerdem erleiden Ziele in den überlappenden Bereichen die Wirkung mehrerer Granaten, die jeweils als separate Angriffe behandelt werden.\nUnd als wäre das nicht genug, haben die Manager bei Krime unlängst Gerüchte von Runnern gehört, die den Granatwerfer als eine Art Schrotflinte einsetzten. Sie haben den Werfer mit Krime Krähenfüßen (nicht enthalten) geladen und sie mit vernichtender Wirkung auf Ziele abgefeuert.
item.ares_charybdis.desc=Die Charybdis wurde als Gegenpart zur Ares Scylla entworfen und ist eine weitere nichttödliche Waffe. Die Waffe ist im Grunde ein großer Wasserwerfer, der für die Montage auf Aufruhrbekämpfungsfahrzeugen gedacht ist. Sie versprüht Wasser nach den Regeln für Sprühangriffe (SR6, S. 121) und fügt allem, was sie trifft, den Status Nass zu. Diese Waffe ist für den montierten Einsatz gedacht, und Benutzer müssen mindestens Stärke 6 haben, um sie zu tragen. Ansonsten muss sie von einer festen Position aus abgefeuert werden. Die Charybdis muss Wasser aus einer Quelle beziehen, die entweder ein Tank im Fahrzeug oder extern sein kann (wie ein Hydrant). Aufgrund technischer Einschränkungen (Druckaufbau usw.) kann sich die Charybdis nicht weiter als 5 Meter von der Wasserversorgung entfernen. Solange die Wasserversorgung zur Verfügung steht, hat die Charybdis unbegrenzt Munition. Pro Schuss verbraucht die Charybdis 45 Liter Wasser.
item.ares_scylla.desc=Was würde passieren, wenn man eine Teslaspule am Ende eines Laufs anbrächte? Normalerweise nicht viel. Teslaspulen können niemanden wirklich verletzen, und eine gerichtete Entladung wäre fast unmöglich. Aber die Ingenieure bei Ares haben eine Möglichkeit gefunden, die elektrischen Effekte zu verstärken und sie zu einem kleinen \u201EBlitzfluss\u201C zu bündeln, der Elektrizitätsschaden (SR6, S. 112) nach den Regeln für Sprühangriffe (SR6, S. 121) verursacht. Diese Waffe ist für den montierten Einsatz gedacht, und Benutzer müssen mindestens Stärke 6 haben, um sie zu tragen. Ansonsten muss sie von einer festen Position aus (z. B. auf einem Dreibein befestigt) abgefeuert werden.\nDie Scylla muss mit einer Stromversorgung verbunden sein. Sie muss entweder von einem Fahrzeug mit einem großen Stromspeicher oder einer externen Stromquelle (wie einem Starkstromanschluss) mit Energie versorgt werden. Das proprietäre Kabel der Waffe ist relativ kurz, deswegen kann sich die Waffe nicht weiter als 5 Meter von der Stromquelle entfernen. Wenn sie auf einem Fahrzeug montiert ist, verbraucht sie in hohem Tempo viel Strom, sodass alle anderen Systeme des Fahrzeugs unterbrochen werden (das Fahrzeug muss also stehen, damit die Waffe funktioniert). Solange sie mit Strom versorgt wird, hat die Scylla unbegrenzt Munition.
item.crackshot_arms_regulator.desc=In der modernen Feuerwaffenindustrie kann man nur überleben, wenn man a) eine ausreichend populäre Marke oder ein Produkt hat, das jeder liebt/kauft, unabhängig davon, ob es zuverlässig oder hochwertig ist (Konzernunterstützung schadet auch nicht), oder b) etwas Neues oder Innovatives zu bieten hat.\nCrackshot Arms hat einen weiteren Konkurrenten in das Wettrüsten geschickt: etwas für Möglichkeit b), wenn auch nur knapp. Die Regulator-Handschuhe sind nicht wirklich eine Feuerwaffe, sondern eher \u2013 wie die Werbung sagt \u2013 ein \u201EHalte- und Einsatzsystem für den Unterarm\u201C. Ja, das habt ihr richtig gelesen.\nDas Grundmodell des Regulator-Handschuhs verwendet eine Reihe von Magneten und Befestigungen, die so konfiguriert werden können, dass sie zu (fast) jeder Art von Feuerwaffe passen. Die so montierte Waffe kann nur über das Smartgunsystem abgefeuert werden; eine normale Benutzung der Waffe ist nicht möglich, wenn sie montiert ist. Die Handschuhe selbst bieten eine stabile Feuerplattform und helfen auch beim Kompensieren des Rückstoßes. An den meisten Handschuhen gibt es auch Platz für ein Ersatzmagazin für schnelleres Nachladen.\nDie Größe ist der bestimmende Faktor dafür, welche Waffenklasse auf dem Handschuh montiert werden kann. Bei Metamenschen durchschnittlicher Größe (Zwergen, Elfen, Menschen, Orks) kann eine Waffe bis zur Größe einer schweren Pistole oder Automatikpistole montiert werden. Bei Benutzern in Trollgröße kann man bis zur Größe eines normalen Sturmgewehrs gehen.
item.horizon_flynn_dcom_holdout.desc=Nicht jeder Job braucht eine große Machtdemonstration; manchmal benötigt man ein hohes Maß an Heimlichkeit, List und Unauffälligkeit. Manchmal will man auch einfach nicht, dass jemand weiß, dass man eine Waffe hat. In diesen Fällen hat man vielleicht nicht einmal die Möglichkeit, etwas mitzuführen, was wie eine Waffe aussieht. Hier kommt die Defense-Com-Serie von Kommlinkwaffen ins Spiel. Diese Waffen wurden mit Unterstützung des renommierten Klingenmeisters Dante Flynn entwickelt und haben sich seit ihrem Debüt vor gerade mal drei Jahren deutlich weiterentwickelt. Horizon hat die Linie vor Kurzem um eine neue leichte Pistole erweitert, die die ursprünglichen Modelle Holdout-Pistole, Taser und Messer ergänzte. Außerdem gibt es jetzt auch eine Garrotte, die aber nicht öffentlich angepriesen wird. Die ersten Modelle hatten inaktive, nicht funktionierende Kommlinks, aber es zeigte sich, dass diese Geräte immer noch zu viel Aufmerksamkeit erregten. Neuere Modelle haben jetzt funktionierende Kommlinks, aber diese bieten höchstens grundlegende Funktionen. Erwartet nicht, dass sie viel mehr können, als nach dem Einschalten eine Wache reinzulegen.\nJetzt zum Wesentlichen: Die Holdout-Pistole ist so brauchbar, wie eine Holdout-Pistole sein kann (hat aber jetzt mehr Munition), die leichte Pistole bietet ein bisschen mehr Schaden und Vielseitigkeit, wenn auch nicht mehr Munition. Der Taser/die Betäubungspistole ist auch adäquat, wenn auch ein bisschen schwach; Horizon hat es noch nicht ganz geschafft, eine bessere Batterie einzubauen. Das Messer ist solide, mit nanogeschärfter Keramikklinge und einer Arretiervorrichtung, die auch extremen Einsätzen widersteht. Die neue Garrotte kann ein bisschen knifflig einzusetzen sein, bis man sich daran gewöhnt, erledigt aber mit ein wenig Übung ihr blutiges Handwerk.
