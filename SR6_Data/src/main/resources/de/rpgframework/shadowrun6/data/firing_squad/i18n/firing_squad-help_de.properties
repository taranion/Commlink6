item.narcojet_hornet.desc=Die Narcoject One konnte nur auf extrem nahe Distanz eingesetzt werden, aber die Hornet kann Entfernungen wie die meisten leichten Pistolen überwinden. Das wird mit zwei Änderungen erreicht: Das Gasdrucksystem wurde neu konzipiert, und die weiterentwickelten Pfeile wurden besonders aerodynamisch designt, um die Leistung des neuen Antriebssystems bestmöglich zu nutzen. Das hat auch den Vorteil, dass die Durchschlagskraft um vierzig Prozent höher liegt als bei der Narcoject One, was die Waffe extrem präzise macht. Die Hornet hat die Form einer flachen Pistole und kann acht Pfeile in einem internen Magazin und einen in der Kammer aufnehmen. Die Kammer ist, wie bei den meisten halbautomatischen Feuerwaffen, zugänglich, indem man den \u201ESchlitten\u201C zurückzieht. Die miniaturisierten Gastanks sind in dem verdeckten Gehäuse direkt unter dem Lauf versteckt. Für Notfälle können auch drei weitere Pfeile im Griff verstaut werden. Die beiden Drucktanks können jeweils bis zu zehn Schuss ermöglichen, bevor sie nachgefüllt oder ersetzt werden müssen. Aber auch wenn die Hornet gegenüber der Narcoject One eine Verbesserung darstellt, besagen die ersten Beurteilungen, dass sie ein wenig empfindlich ist und durch Herunterfallen Schaden nehmen kann.
item.shiawase_blazer.desc=Der Blazer ist ein klassischer, einfach konstruierter Flammenwerfer mit einem tragbaren, leicht zu ersetzenden Tank, der bei Runnern, Entlaubungsspezialisten und Militärangehörigen in aller Welt beliebt ist. Das neueste Modell des Blazer gestattet das Auswechseln des Tanks sogar während der Benutzung.
item.sungard_jewelry.desc=Die Schmuckkollektion Sungard wird von der Aztechnology-Tochter Dassault produziert und bietet viele verschiedene Stile und Formen. Die verwendeten Materialien sind kapazitiv, was einen kleinen Stromimpuls ermöglicht, um ein Licht im Innern des Edelsteins erscheinen zu lassen. Sungard-Schmuck kann auf drei Arten verwendet werden: Mit der niedrigsten Einstellung können die Schmuckstücke direkt vor dem Träger (Sehr nahe Reichweite) gedämpfte Beleuchtung erzeugen, was eine Ladung pro Stunde verbraucht.\nDie Technologie erhöht subtil die Attraktivität der Schmuckstücke. Das verschafft dem Träger 1 Edge bei sozialen Proben, während derer das Schmuckstück gesehen werden und beeindrucken kann.\nMit der mittleren Einstellung können die Schmuckstücke direkt vor dem Träger (Sehr nahe Reichweite) volle Beleuchtung erzeugen, was eine Ladung pro halber Stunde verbraucht. Der Einsatz dieser Beleuchtungsstärke macht den Träger auch leichter zu sehen, und der Spielleiter sollte angemessene Edge-und Würfelpoolmodifikatoren zuweisen.\nMit der höchsten Einstellung bietet der Sungard-Schmuck einen extrem hellen Stroboskop-Effekt, was den Träger für eine Ladung pro Kampfrunde zu einem wandelnden Flash-Pack macht. Dieser Effekt wirkt wie ein Flash-Pack und hat den Träger als Zentrum. Der Träger ist gegen die Wirkung immun.

item.incendiary_grenade.desc=Die gewöhnliche Brandgranate wird von Herstellern auf der ganzen Welt produziert und hat nur eine einzige Wirkung: Sie setzt Dinge in Brand. Moderne Verbesserungen haben am Grundkonzept nicht viel geändert. Sie haben die Brandgranate nur wesentlich effektiver gemacht. Zuerst versprüht sie im Wirkungsbereich entzündliches Gas, dann gibt sie weißen Phosphor ab, der das Gas entzündet und dazu führt, dass alles, was entflammbar ist, Feuer fängt.
item.chemical_grenade.desc=Im Grunde ist eine Granate nur eine Hülle mit einer kleinen Explosivladung in ihrem Inneren, die das Metall in Schrapnell verwandelt, das dann den Schaden verursacht. Die Sache wird aber erst richtig interessant, wenn diese Hülle mit etwas noch Schlimmerem als Metall gefüllt wird. Das ist bei diesen heimtückischen Granaten der Fall. Die Hüllen sind mit einer höchst ätzenden Flüssigkeit gefüllt, und wenn die Granate explodiert, wird diese Flüssigkeit auf alles innerhalb des Explosionsradius verspritzt.
item.thermographic_flash-pak.desc=Diese Abwandlung des normalen Flash-Packs sendet intensive Infrarotimpulse aus, die Personen mit Infrarotsicht unter der Wirkung des Flash-Packs leiden lässt. Personen ohne Infrarotsicht bleibt die Wirkung erspart. Das Infrarot-Flash-Pack hat 10 Ladungen und verbraucht 1 Ladung pro Kampfrunde. An der Stromversorgung lädt es sich mit 1 Ladung pro 10 Sekunden auf.
item.zapper_grenade.desc=Die Elektrogranate gibt im Wirkungsbereich einen starken Stromimpuls ab. Der Kondensator, der den Impuls abgibt, ist nach einer Explosion durchgebrannt, aber beim richtigen Ziel können die elektrischen Effekte länger andauern.
item.paint_grenade.desc=In einer Welt der Hightech-Sensoren, der lichtbeugenden Tarnungstechnologie, der magischen Zauber, die Personen buchstäblich unsichtbar machen können und all solcher lästigen Effekte ist es schön, einfache, archaische Methoden gegen diese Dinge zu haben.\nOder es kann auch sein, dass man jemanden ärgern will, einfach weil man es kann. Oder weil man es witzig findet. Auftritt: Farbgranate. Eine Farbgranate ist eine Granate, die mit unter Druck stehender Farbe gefüllt ist, die bei der Zündung freigesetzt wird. Je nach Stärke der Granate kann sie einen Bereich zwischen zwei und fünf Metern mit Farbe überziehen, was jeden sichtbar macht, der die zuvor genannten Methoden des Verbergens benutzt. Farbgranaten gibt es in vielen Farben, aber meistens haben sie grässliche, extrem helle, im Dunkeln leuchtende Neonfarben, die sogar bei schlechtem Licht auffallen. Aber wenn das nicht reicht, bieten einige Farbgranaten auch fast mikroskopisch kleine reflektierende Materialien (also Glitzerpartikel), die jedes Licht zurückwerfen, das auf sie auftrifft. Und wenn auch das nicht reicht, kann man eine Farbgranate zusätzlich mit radioaktiver Markierfarbe füllen, die von einem Geigerzähler erkannt wird, wie es ihn in jedem Baumarkt gibt.\nGeworfene Farbgranaten gibt es in zwei Größen: Standard und groß. Sie funktionieren wie gewöhnliche tödliche oder nichttödliche Granaten. Es gibt auch eine Minigranaten-Version für Werfer, aber deren Sprengwirkung ist deutlich kleiner als die der Standard-Farbgranate.
item.paint_grenade_large.desc=In einer Welt der Hightech-Sensoren, der lichtbeugenden Tarnungstechnologie, der magischen Zauber, die Personen buchstäblich unsichtbar machen können und all solcher lästigen Effekte ist es schön, einfache, archaische Methoden gegen diese Dinge zu haben.\nOder es kann auch sein, dass man jemanden ärgern will, einfach weil man es kann. Oder weil man es witzig findet. Auftritt: Farbgranate. Eine Farbgranate ist eine Granate, die mit unter Druck stehender Farbe gefüllt ist, die bei der Zündung freigesetzt wird. Je nach Stärke der Granate kann sie einen Bereich zwischen zwei und fünf Metern mit Farbe überziehen, was jeden sichtbar macht, der die zuvor genannten Methoden des Verbergens benutzt. Farbgranaten gibt es in vielen Farben, aber meistens haben sie grässliche, extrem helle, im Dunkeln leuchtende Neonfarben, die sogar bei schlechtem Licht auffallen. Aber wenn das nicht reicht, bieten einige Farbgranaten auch fast mikroskopisch kleine reflektierende Materialien (also Glitzerpartikel), die jedes Licht zurückwerfen, das auf sie auftrifft. Und wenn auch das nicht reicht, kann man eine Farbgranate zusätzlich mit radioaktiver Markierfarbe füllen, die von einem Geigerzähler erkannt wird, wie es ihn in jedem Baumarkt gibt.\nGeworfene Farbgranaten gibt es in zwei Größen: Standard und groß. Sie funktionieren wie gewöhnliche tödliche oder nichttödliche Granaten. Es gibt auch eine Minigranaten-Version für Werfer, aber deren Sprengwirkung ist deutlich kleiner als die der Standard-Farbgranate.
item.paint_grenade_mini.desc=In einer Welt der Hightech-Sensoren, der lichtbeugenden Tarnungstechnologie, der magischen Zauber, die Personen buchstäblich unsichtbar machen können und all solcher lästigen Effekte ist es schön, einfache, archaische Methoden gegen diese Dinge zu haben.\nOder es kann auch sein, dass man jemanden ärgern will, einfach weil man es kann. Oder weil man es witzig findet. Auftritt: Farbgranate. Eine Farbgranate ist eine Granate, die mit unter Druck stehender Farbe gefüllt ist, die bei der Zündung freigesetzt wird. Je nach Stärke der Granate kann sie einen Bereich zwischen zwei und fünf Metern mit Farbe überziehen, was jeden sichtbar macht, der die zuvor genannten Methoden des Verbergens benutzt. Farbgranaten gibt es in vielen Farben, aber meistens haben sie grässliche, extrem helle, im Dunkeln leuchtende Neonfarben, die sogar bei schlechtem Licht auffallen. Aber wenn das nicht reicht, bieten einige Farbgranaten auch fast mikroskopisch kleine reflektierende Materialien (also Glitzerpartikel), die jedes Licht zurückwerfen, das auf sie auftrifft. Und wenn auch das nicht reicht, kann man eine Farbgranate zusätzlich mit radioaktiver Markierfarbe füllen, die von einem Geigerzähler erkannt wird, wie es ihn in jedem Baumarkt gibt.\nGeworfene Farbgranaten gibt es in zwei Größen: Standard und groß. Sie funktionieren wie gewöhnliche tödliche oder nichttödliche Granaten. Es gibt auch eine Minigranaten-Version für Werfer, aber deren Sprengwirkung ist deutlich kleiner als die der Standard-Farbgranate.
item.caltrops.desc=Eigentlich sind Krähenfüße keine Granaten oder Sprengstoffe, aber sie nutzen ähnliche Regelmechaniken und dienen ähnlichen Zwecken. Dies sind kleine pyramidenförmige Metallstücke mit Spitzen, die die  Bewegung einer Person durch einen Bereich verhindern oder erschweren sollen und seit Jahrhunderten im Einsatz sind. Sie gehören zu den einfachsten Sperrwaffen, die es gibt, und sie mussten sich funktionell in all der Zeit kaum verändern. Krähenfüße verteilen sich auf einen Bereich und verursachen ihren Schaden bei jedem, der diesen Bereich betritt. Am Ende jeder Kampfrunde muss jeder, der sich in dem Bereich befindet oder durch ihn bewegt hat, dem Schaden der Krähenfüße widerstehen.
item.cryo_grenade.desc=Die Kryogranate ist eine der neueren Erfindungen auf diesem Gebiet und gibt ein Aerosol aus flüssigem Stickstoff im Wirkungsbereich ab. Das führt zu einem Schockfrost-Effekt, der alles innerhalb der Sprengwirkung gefrieren oder zumindest unterkühlt werden lässt. Die Technologie ist noch relativ neu und musste mit einigen technischen Herausforderungen fertigwerden. Trotzdem finden die Granaten ihren Weg in die Schatten und erweisen sich oft als effektiv.
item.glitter_grenade.desc=Die Glitzergranate ist zwar kein Sprengstoff, aber ihre Funktionsweise ist fast identisch mit der von normalen Granaten. Wenn die Granate zündet, springt ein Motor in ihrem Inneren an und schleudert glitzernde Partikel und Metallfragmente in die Umgebung des Detonationspunkts. Das sorgt dafür, dass alles Unsichtbare sichtbar wird, und macht es leicht, die Betroffenen zu identifizieren und ins Visier zu nehmen.\nDie Materialien innerhalb der Glitzergranate können mit einer Ausgedehnten Probe auf Mechanik + Logik (5, 5 Minuten) verändert werden. Die neuen Materialien müssen kleine, trockene metallische Partikel ähnlich den Glitzerpartikeln sein. Das kann dazu dienen, die Granate eine Schwäche oder Allergie ausnutzen zu lassen, aber dafür muss man vorausplanen.\nDas Entfernen der Glitzerpartikel erfordert eine gründliche Dusche und manchmal einen Staubsauger. Magie kann helfen \u2013 Metall Beleben kann verwendet werden, um die Partikel davontanzen zu lassen.
item.krime_kaltrops.desc=Ein Unternehmen, das es mit der akzeptierten Produktionspraxis so wenig genau nimmt wie Krime, muss einfach enorm viel Abfall produzieren. Manager bei Krime erkannten, dass auf den Böden der Fabriken gute Metallreste einfach herumlagen, und beschlossen, diese besser zu nutzen. Und so entstanden die Krime Krähenfüße. Normale Krähenfüße bestehen aus zierlichen, schwer zu entdeckenden Metallsplittern, aber der Krime Krähenfuß verzichtet auf jede Subtilität. Er ist eine Metallkugel von etwa 5 Zentimetern Durchmesser mit zwölf Spitzen und kann einen Fuß, einen Reifen oder sogar eine Laufkette zerfetzen. Die Krähenfüße verteilen sich auf einen Bereich und verursachen ihren Schaden bei jedem, der diesen Bereich betritt. Am Ende jeder Kampfrunde muss jeder, der sich in dem Bereich befindet oder durch ihn bewegt hat, dem Schaden der Krähenfüße widerstehen.
item.nano_grenade.desc=Die modernste Technologie und die neuesten Granatenentwürfe ermöglichten Evo, etwas zu schaffen, dem sich die meisten Leute noch nicht mal auf drei Meter nähern würden. Trotz der Furcht der Öffentlichkeit vor dem Einsatz von Nanotechnologie hat Evo diese Granaten massenproduziert und vermarktet sie aktiv bei denen, die sie sich leisten können. Man kann annehmen, dass die meisten Evo-Truppen wenigstens ein paar davon mitführen.\nNanogranaten können die Wirkung von Splitter-, Spreng-, Brand- und Elektrogranaten nachahmen. Die Naniten in der flüssigen Magnetsuspension erhalten per WiFi ein Kommando vom Benutzer der Granate und erzeugen die notwendigen Materialien, um die gewünschte Wirkung nachzuahmen. Das bedeutet, dass die Granate WiFi aktiviert haben muss, um den Befehl zu erhalten, und dass es 1 Kampfrunde dauert, die Granate \u201Escharfzumachen\u201C. Danach kann die Granate keine weiteren Befehle erhalten, um die Wirkung zu verändern.
item.noise_grenade.desc=Die Lärmgranate ist in vielerlei Hinsicht dem Flash-Pack ähnlich und soll einen Feind mit nichttödlichen Mitteln kampfunfähig machen. Sie hat ähnliche Abmessungen wie ein Flash-Pack, aber statt des Stroboskop-Effekts erzeugt die Lärmgranate eine große Bandbreite an Geräuschen im tiefen Bereich des hörbaren Spektrums. Die erzeugten Geräusche können innerhalb der Sprengwirkung Desorientierung hervorrufen und in manchen Fällen zu extremer Übelkeit führen.\nAm Detonationspunkt führt das zu den Status Benommen und Übelkeit ( (SR6, SR6, S. 53, 55). Außerhalb des Detonationspunkts entsteht der Status Benommen.\nZiele mit der Bodytech Dämpfer oder Ziele, die im Moment den Status Ertaubt haben, gelten als so viele Entfernungskategorien weiter weg, als sie es tatsächlich sind, wie sie Stufen in diesem Status haben. Die Granate hat 10 Ladungen und verbraucht 1 Ladung pro Kampfrunde. An der Stromversorgung lädt sie sich mit 1 Ladung pro 10 Sekunden auf.

itemmod.gecko_grip_modification.desc=Das Geckogriff-Material kann benutzt werden, umeine Sprengladung an einer Oberfläche zu befestigen. Die Methode ähnelt den Haftminen, die durch Magnetismus an Schiffen haften. Das Geckogriff-Material wird an der Hülle einer Granate oder Mine angebracht, wodurch diese an der ersten Oberfläche haften bleibt, die sie berührt. Das kann beim Werfen einer Granate eine Herausforderung sein, wodurch der Angriffswert um 2 sinkt. Wenn die Granate abgefeuert wird, aktiviert sich das Material, sobald eine Strecke von 5 Metern zurückgelegt wurde. Sich von der Haftwirkung des Geckogriffs zu befreien, erfordert eine erfolgreiche Probe auf Konstitution + Stärke (4).
itemmod.land_mine_modification.desc=Im Grunde ist eine Landmine eine Granate mit speziellem Auslösemechanismus. Diese \u201EModifikation\u201C ist nur eine einfache Art, eine Landmine zu beschreiben, die die Merkmale einer Granate hat. Sie kann aus beliebigen Sprengstoffen und Inhaltsstoffen einer Granate bestehen. Wenn auf die Landmine Druck ausgeübt wird, macht sie das scharf, das Nachlassen des Druckes löst sie aus.
itemmod.directional_mine_modification.desc=Im Grunde ist eine gerichtete Mine eine Granate mit speziellem Auslösemechanismus. Diese \u201EModifikation\u201C ist nur eine einfache Art, eine gerichtete Mine zu beschreiben, die die Merkmale einer Granate hat. Sie kann aus beliebigen Sprengstoffen und Inhaltsstoffen einer Granate bestehen. Eine gerichtete Mine wird durch einen Auslöser aktiviert, der sicherstellt, dass sich das Ziel im Wirkungsbereich befindet \u2013 oft ein Stolperdraht. Dieser Stolperdraht kann ein Laser (sichtbar, ultraviolett, infrarot) oder ein physischer Stolperdraht sein. Die Sprengwirkung einer gerichteten Mine beschreibt einen Kegel von 45 Grad vom Detonationspunkt aus.
ammotype.handloaded_ammo.desc=Mit ein wenig Vorsicht und Hingabe kann ein guter Waffenbauer seine eigene Munition fabrizieren. Dieser zusätzliche Aufwand führt in allen Reichweitenkategorien zu einer merklichen Verbesserung durch passgenaue Hülsen und angepasste Pulverkörnungen und -gewichte. Es ist erstaunlich, wie oft Pulver verunreinigt ist und dadurch zu wenig Leistung bringt.
ammotype.match-grade_ammo.desc=Ein perfekt ausbalanciertes Geschoss und Pulver, das Gramm für Gramm gesiebt ist, machen diese Munition zum Besten, was man für das präzise Schießen auf größere Entfernung kaufen kann. Die Durchschlagskraft wird durch diesen Prozess etwas verringert, weil es bei dieser Munition viel wichtiger ist, ein Ziel zu treffen, als es zu durchschlagen.

item.iron_bear_combat_axe.desc=Wallacher sollte auf der Hut sein. Die Iron Bear ist eine leichte Titanaxt, die eine rasiermesserscharfe Schneide bietet. Sie hat keinen Stachel, aber das macht sie durch einen dicken Knauf wett, den man für weniger tödliche Niederschläge benutzen kann.
item.iron_fang_combat_knife.desc=Wie macht man aus einem Kampfmesser etwas Besonderes? Man verwendet neuartige Materialien für eine Klinge, die ihre Form je nach Erfordernis der momentanen Situation verändert! Gezackt, mit unterschiedlichen Sägezähnen, gerader Schneide, stumpfer Spitze ... das Iron Fang ist für jeden Zweck zu gebrauchen.
item.steel_claw_combat_broadsword.desc=Ich glaube, dieses Design wird das klassische Katana als Klinge der Wahl für Straßenschwertmeister ablösen. Jeder, der ein Trideo hat, sieht Schwertkämpfe mit Blocks und Paraden, aber jeder, der mit Klingenwaffen geübt ist, weiß, dass man seine Schneide nicht so gefährden will \u2013 wenn man kein Steel Claw hat. Die Klinge ist ein weiteres Meisterwerk und weiß genau, wann sie in der Offensive oder in der Defensive ist, weil dein Kampfstil einprogrammiert ist, was einen schlecht vorbereiteten Feind wirklich bluten lässt.
item.iron_hawk_composite_bow3.desc=rEVOlution meistert das Konzept, eine Mausefalle zu verbessern, indem es klassische Konzepte mit inspirierenden Erfindungen kombiniert. Der Iron Hawk ist ein klassischer Compoundbogen mit einer Besonderheit. In diesem Fall geht es um das Zusammenwirken von Pfeilen und Bogen. Die Pfeile des Iron Hawk sind schwerer als üblich, haben aber eine kleine Treibladung im Schaft, die durch den Druck des Abschusses ausgelöst wird. Die Treibladung hilft, Probleme im Verhältnis zwischen Gewicht und Impuls zu lösen, wodurch der schwerere Pfeil härter einschlägt und weiter fliegt.
item.iron_hawk_composite_bow4.desc=rEVOlution meistert das Konzept, eine Mausefalle zu verbessern, indem es klassische Konzepte mit inspirierenden Erfindungen kombiniert. Der Iron Hawk ist ein klassischer Compoundbogen mit einer Besonderheit. In diesem Fall geht es um das Zusammenwirken von Pfeilen und Bogen. Die Pfeile des Iron Hawk sind schwerer als üblich, haben aber eine kleine Treibladung im Schaft, die durch den Druck des Abschusses ausgelöst wird. Die Treibladung hilft, Probleme im Verhältnis zwischen Gewicht und Impuls zu lösen, wodurch der schwerere Pfeil härter einschlägt und weiter fliegt.
item.iron_hawk_composite_bow5.desc=rEVOlution meistert das Konzept, eine Mausefalle zu verbessern, indem es klassische Konzepte mit inspirierenden Erfindungen kombiniert. Der Iron Hawk ist ein klassischer Compoundbogen mit einer Besonderheit. In diesem Fall geht es um das Zusammenwirken von Pfeilen und Bogen. Die Pfeile des Iron Hawk sind schwerer als üblich, haben aber eine kleine Treibladung im Schaft, die durch den Druck des Abschusses ausgelöst wird. Die Treibladung hilft, Probleme im Verhältnis zwischen Gewicht und Impuls zu lösen, wodurch der schwerere Pfeil härter einschlägt und weiter fliegt.
item.iron_hawk_composite_bow6.desc=rEVOlution meistert das Konzept, eine Mausefalle zu verbessern, indem es klassische Konzepte mit inspirierenden Erfindungen kombiniert. Der Iron Hawk ist ein klassischer Compoundbogen mit einer Besonderheit. In diesem Fall geht es um das Zusammenwirken von Pfeilen und Bogen. Die Pfeile des Iron Hawk sind schwerer als üblich, haben aber eine kleine Treibladung im Schaft, die durch den Druck des Abschusses ausgelöst wird. Die Treibladung hilft, Probleme im Verhältnis zwischen Gewicht und Impuls zu lösen, wodurch der schwerere Pfeil härter einschlägt und weiter fliegt.
item.iron_hawk_arrow.desc=Die Pfeile des Iron Hawk sind schwerer als üblich, haben aber eine kleine Treibladung im Schaft, die durch den Druck des Abschusses ausgelöst wird. Die Treibladung hilft, Probleme im Verhältnis zwischen Gewicht und Impuls zu lösen, wodurch der schwerere Pfeil härter einschlägt und weiter fliegt.
item.steel_falcon_crossbow.desc=Ähnlich wie der Iro Hawk nutzt die Steel Falcon eine kleine explosive Innovation, um dem Projektil mehr Durchschlagskraft zu verleihen und sich an die Spitze des Armbrustmarkts zu katapultieren. Schwere Wurfarme, Smart-Stabilisatoren und eines der schnellsten Nachladesysteme auf dem Markt mit einem 6-schüssigen internen Magazin machen die Steel Falcon wahrhaft rEVOlutionär.
item.steel_falcon_crossbow_bolt.desc=Ähnlich wie der Iron Hawk nutzt die Steel Falcon eine kleine explosive Innovation, um dem Projektil mehr Durchschlagskraft zu verleihen und sich an die Spitze des Armbrustmarkts zu katapultieren.
item.fire_ant.desc=Kleine Pistolen haben immer einen schlechten Ruf, aber die Fire Ant wird dafür sorgen, dass ihr das nicht geschieht. Nebeneinander angebrachte Läufe, die aus einem einzelnen Magazin gespeist werden, erlauben diesem winzigen Kraftpaket einzigartige Fähigkeiten, darunter auch eine Pseudo-Salve.
item.raven.desc=Der Markt für leichte Pistolen ist mit hochwertigen Waffen ziemlich gesättigt, aber Evo wollte keine Lücke in seinem Arsenal, also wurde diese gestopft. Die Raven gibt es nur in einer Farbe: schwarz. Um diese Pistole von anderen abzuheben, griff Evo eher zu Technologiediebstahl als zu Innovation. Es sei denn, man glaubt die internen Memos, in denen es heißt, Ares habe die Technologie gestohlen und Evos Produktion sabotiert. Jedenfalls bietet die Raven dasselbe variable Munitionssystem wie die Predator VI.
item.ocelot.desc=Automatikpistolen sind viel zu oft nachträgliche Einfälle oder Modifikationen, die nicht so viel Qualität bieten, wie sie Kugeln abfeuern. Die Ocelot will das ändern \u2013 sie ist eine von Grund auf neu entwickelte hochwertige Automatikpistole. Sie erinnert an die Mini-Uzi des letzten Jahrhunderts und bietet Qualität für sich allein, statt nur Beiwerk zu einem anderen Modell zu sein.
item.iron_eagle.desc=Freut euch, ihr Orks und Trolle \u2013 es gibt eine schwere Pistole, die wirklich für euch gemacht ist. Dieses Monster hat eine Durchschlagskraft, die von anderen halbautomatischen schweren Pistolen nicht erreicht wird, lässt aber Leute mit kleinerer Statur nach zu langer Zeit hinter dem Abzug ein bisschen mitgenommen zurück.
item.cheetah.desc=Wie der namensgebende Gepard setzt die Cheetah nicht auf Kraft, sondern zeigt vorbildlich, wie tödlich Geschwindigkeit sein kann. Sie hat ein spezielles Feuersystem, das eine unvergleichliche Feuerrate bietet, und kann im Salvenmodus die Kugeln innerhalb weniger Zentimeter voneinander einschlagen lassen. Längeres Feuern ist noch nicht möglich, aber rEVOlution arbeitet daran.
item.black_wolf.desc=Ein weiterer gesättigter und gut abgedeckter Markt brachte für Evo den Bedarf nach Innovation, und es erfand etwas. Es könnte sich durch die Innovation aber selbst aus dem Rennen genommen haben, weil der Preis und die geringe Stückzahl bis jetzt nicht für viele Kunden sorgten
item.iron_bull.desc=Ich weiß nicht, ob das ein Einfall in letzter Sekunde war oder ob jemand bei Evo gemeint hat, Schrotflinten seien ein Feld für Innovation. Die Iron Bull zeigt einige ästhetische Fortschritte, aber funktionell ist sie nur wenig fortschrittlicher als andere Sturmschrotflinten. Schönheit tötet deine Feinde nicht.
item.steel_tiger.desc=Ich respektiere den Aufwand, den es braucht, um ein Gewehr auf diesem Niveau herzustellen, das keine klobige Monstrosität ist. Es hat vielleicht wenig Vielseitigkeit am Griff, aber diese Waffenklasse ist auch nicht auf Vielseitigkeit ausgelegt. Es soll einfach ein Ziel auf tausend Meter umlegen, dann noch ein Ziel, dann noch ein Ziel, und das alles, bevor jemand den ersten Schuss gehört hat. Das Tiger ist ein heimlicher Killer, und es ist gut darin. Diese Waffe ist außerdem leicht zerlegbar und in einem leichten Koffer unterzubringen, der inklusive Zielfernrohr weniger als 10 Kilo wiegt.
item.rhino.desc=Ich konnte das volle Spektrum an \u201EMaschinengewehren\u201C testen. Das Schöne an den Entwürfen von rEVOlution ist, dass an den Benutzer gedacht wurde, aber man nicht versuchte, all diese großen Kanonen unter der Annahme zu konstruieren, dass ein Ork oder Troll die schweren Waffen bedienen muss. Erstens ist die verstellbare Handhabung hervorragend dazu geeignet, beim Rhino und beim Behemoth zwischen Hüft- und Schulteranschlag zu wechseln. \nBeim Juggernaut erscheint dieses System eher wie ein Scherz, aber auf der anderen Seite ist es auch ein bisschen lächerlich, eine Waffe dieser Größe ohne Halterung abzufeuern.\nDas Rhino schießt präzise und hat genug Gewicht verloren, dass es durchaus möglich ist, es wie ein Sturmgewehr zu benutzen. Eure Arme werden müde werden, wenn ihr es über längere Zeit so einsetzt, aber das Rhino ist hervorragend darin, solche Kämpfe schnell zu beenden.\nDas Behemoth kann im Schulteranschlag benutzt werden, aber man sollte es lieber auf einen Vorsprung legen, wenn man mehr als nur einmal ins Blaue ballern will. REVOlution hat ein bisschen Gewicht eingespart und es dem Schützen angenehm gemacht, indem es schützende und ergonomische Merkmale im selben Paket vereint hat. Die Hitze des Laufs kann ein Problem sein, aber man hat dafür gesorgt, dass die Griffe und Schilde an den richtigen Stellen sind, sodass man sich nicht die Pfoten verbrennt.\nAuf einer Halterung funktionieren sie alle wie ein Traum. Der Rückstoß löst sich in Wohlgefallen auf, der Schwerpunkt liegt sehr gut am Haltepunkt, und man könnte schwören, dass die Kugeln ihr eigenes Lenksystem haben, wenn die Waffe beginnt, gemütlich einen Strom aus Blei fließen zu lassen. Aber die Ladehemmungen sind häufiger als bei anderen Waffen, und ich kann den schuldigen Mechanismus nicht finden.
item.behemoth.desc=Ich konnte das volle Spektrum an \u201EMaschinengewehren\u201C testen. Das Schöne an den Entwürfen von rEVOlution ist, dass an den Benutzer gedacht wurde, aber man nicht versuchte, all diese großen Kanonen unter der Annahme zu konstruieren, dass ein Ork oder Troll die schweren Waffen bedienen muss. Erstens ist die verstellbare Handhabung hervorragend dazu geeignet, beim Rhino und beim Behemoth zwischen Hüft- und Schulteranschlag zu wechseln. \nBeim Juggernaut erscheint dieses System eher wie ein Scherz, aber auf der anderen Seite ist es auch ein bisschen lächerlich, eine Waffe dieser Größe ohne Halterung abzufeuern.\nDas Rhino schießt präzise und hat genug Gewicht verloren, dass es durchaus möglich ist, es wie ein Sturmgewehr zu benutzen. Eure Arme werden müde werden, wenn ihr es über längere Zeit so einsetzt, aber das Rhino ist hervorragend darin, solche Kämpfe schnell zu beenden.\nDas Behemoth kann im Schulteranschlag benutzt werden, aber man sollte es lieber auf einen Vorsprung legen, wenn man mehr als nur einmal ins Blaue ballern will. REVOlution hat ein bisschen Gewicht eingespart und es dem Schützen angenehm gemacht, indem es schützende und ergonomische Merkmale im selben Paket vereint hat. Die Hitze des Laufs kann ein Problem sein, aber man hat dafür gesorgt, dass die Griffe und Schilde an den richtigen Stellen sind, sodass man sich nicht die Pfoten verbrennt.\nAuf einer Halterung funktionieren sie alle wie ein Traum. Der Rückstoß löst sich in Wohlgefallen auf, der Schwerpunkt liegt sehr gut am Haltepunkt, und man könnte schwören, dass die Kugeln ihr eigenes Lenksystem haben, wenn die Waffe beginnt, gemütlich einen Strom aus Blei fließen zu lassen. Aber die Ladehemmungen sind häufiger als bei anderen Waffen, und ich kann den schuldigen Mechanismus nicht finden.
item.juggernaut.desc=Ich konnte das volle Spektrum an \u201EMaschinengewehren\u201C testen. Das Schöne an den Entwürfen von rEVOlution ist, dass an den Benutzer gedacht wurde, aber man nicht versuchte, all diese großen Kanonen unter der Annahme zu konstruieren, dass ein Ork oder Troll die schweren Waffen bedienen muss. Erstens ist die verstellbare Handhabung hervorragend dazu geeignet, beim Rhino und beim Behemoth zwischen Hüft- und Schulteranschlag zu wechseln. \nBeim Juggernaut erscheint dieses System eher wie ein Scherz, aber auf der anderen Seite ist es auch ein bisschen lächerlich, eine Waffe dieser Größe ohne Halterung abzufeuern.\nDas Rhino schießt präzise und hat genug Gewicht verloren, dass es durchaus möglich ist, es wie ein Sturmgewehr zu benutzen. Eure Arme werden müde werden, wenn ihr es über längere Zeit so einsetzt, aber das Rhino ist hervorragend darin, solche Kämpfe schnell zu beenden.\nDas Behemoth kann im Schulteranschlag benutzt werden, aber man sollte es lieber auf einen Vorsprung legen, wenn man mehr als nur einmal ins Blaue ballern will. REVOlution hat ein bisschen Gewicht eingespart und es dem Schützen angenehm gemacht, indem es schützende und ergonomische Merkmale im selben Paket vereint hat. Die Hitze des Laufs kann ein Problem sein, aber man hat dafür gesorgt, dass die Griffe und Schilde an den richtigen Stellen sind, sodass man sich nicht die Pfoten verbrennt.\nAuf einer Halterung funktionieren sie alle wie ein Traum. Der Rückstoß löst sich in Wohlgefallen auf, der Schwerpunkt liegt sehr gut am Haltepunkt, und man könnte schwören, dass die Kugeln ihr eigenes Lenksystem haben, wenn die Waffe beginnt, gemütlich einen Strom aus Blei fließen zu lassen. Aber die Ladehemmungen sind häufiger als bei anderen Waffen, und ich kann den schuldigen Mechanismus nicht finden.
item.megalodon.desc=Ein Panther hat keine Chance gegen einen Megalodon! Man könnte diesen Slogan gleich schützen lassen und ein paar Dutzend anderer witziger Werbesprüche erfinden, weil rEVOlution sie brauchen wird. Wenn es die Produktion aufrechterhalten kann, wird diese Waffe den Markt beherrschen (der Markt ist klein, aber denkt an die möglichen Produktplatzierungen!). Sie hat einen großen Namen bekommen, und \u201EThe Meg\u201C ist zur Referenzgröße auf der Straße geworden, scheint aber insgesamt zu sehr auf Ergonomie und zu wenig auf Ökonomie ausgelegt. Wenn das Ziel nicht war, eine Trophäenwaffe zu bauen, die ein Loch in alles machen kann, wird die größte Schwäche in den Verkaufszahlen liegen (zumindest basierend auf dem Preis).
item.pulse.desc=Mit dem Polymodal Ulterior L S Emitter (PULSE) schwenkte Evo sowohl von den Tiernamen als auch vom Standardplan für das Wettrüsten weg. Diese Waffe ist eindeutig der erste Schritt in einem gewaltigen Rennen um die Vorherrschaft bei den nichttödlichen Waffen, für das rEVOlution den Startschuss geben wird. Der PULSE soll einfach alles, was ein Gehirn hat, mit einem Schlag k.o. gehen lassen. Bei der höchsten Einstellung gibt es ein Blackout für fast alles und fast jeden, aber schon die niedrigen Einstellungen führen zumindest dazu, dass der Gegner nicht mehr kämpfen will. Die Waffe ist als Betäubungsgewehr fürs Hirn gedacht und schießt einen Energieimpuls ab, dessen Wellenlänge darauf abgestimmt ist, neuronale Netze zu stören. Niedrige Einstellungen machen das Ziel nur ein bisschen benommen, sodass das Denken schwer wird. Die höheren Einstellungen führen zu Bewusstlosigkeit und, wenn man den Tests auf der Straße Glauben schenken kann, möglicherweise zu permanenten neurologischen Schäden.\nDie Miniaturisierung auf Basis des Emitters und einer Pistolenvariante, die in Arbeit ist, schreitet schnell voran, und eine Version mit Flächenwirkung, wie eine Granate, ist in nächster Zukunft durchaus denkbar.
item.ammo_battery_pulse.desc=Eine Batterie für den Pulse fasst 20 Energieeinheiten und sind nicht wiederaufladbar.
item.hell_turtle.desc=Ein lustiger Name, aber eine beeindruckende Waffe. Der Name stammt von dem alternativ nutzbaren erweiterten Treibstofftank: einem Rucksack, dessen Design an einen Schildkrötenpanzer angelehnt ist, dessen interne Kammern abgeteilt sind und versiegelt werden können, wenn der Druck in einer Kammer (zum Beispiel durch ein Leck) plötzlich absinkt. Es gibt fast kein Risiko für einen katastrophalen Ausgang durch einen normalen Treffer, aber gewisse Munition kann einen Tank entflammen und einen Riss erzeugen, der sich durch die Zellen ausbreitet. Ohne den Schildkrötenrucksack ist die Munition begrenzt, aber nicht zu wenig. Es hängt vom Angriffsstil und davon ab, ob man lieber einfach drauflos sprüht oder eine konzentrierte Flammenlanze bevorzugt. Der einstellbare Choke ist auch eine nette Sache, besonders weil damit ein breiter, aber heftiger Strahl möglich wird, der im Wirkungsbereich wahrscheinlich nicht unkontrolliert herumwandert.\nDas Smartgunsystem ist hervorragend geeignet, um den Sprühbereich zu identifizieren und einen sichereren Angriff zu ermöglichen. Dieses Ding hat ganz sicher meine Ansicht dazu verändert, ein Smartlink mit einer flammenwerferartigen Waffe zu benutzen.
item.honey_badger.desc=Immer wenn ich den Abzug zog, wanderten meine Gedanken zu den alten Reklame-Links zurück, die ich fand, als ich eine Suche nach \u201EHonigdachs\u201C begann. Immer hieß es \u201EDem Honigdachs ist es egal\u201C, und als ich mir dieses psychotische Raubtier von vor dem Erwachen genauer ansah, begriff ich den Namen. Das Ding feuert, und manchmal schlägt die Rakete im Ziel ein, manchmal weicht sie aber ein bisschen vom Kurs ab und vernichtet alles auf ihrem Weg. Es scheint, als wäre das Design der Stabilisatoren der fatale Schwachpunkt, aber nicht immer. Manchmal jagt die Rakete einfach etwas Falsches, weil: \u201EDem Honigdachs ist es egal!\u201C
item.tarantula_hawk.desc=Anderseits konnte ich auch diese Schönheit testen, und ich machte das auf die wahrscheinlich beste Art für den Namen: Ich habe in Chicago Bugs zerquetscht. Die Stadt ist nicht mehr von ihnen überrannt, und das machte es leichter, zu jagen und zu testen, statt gegen die Horden um mein Leben zu kämpfen! Das Zielfindungssystem ist hervorragend, und dabei kommt nicht einfach nur ein Hitzefinder oder einfaches Radar zum Einsatz; die Zielerfassung verwendet eine Analyse von Silhouette und Temperaturvariation, was es auch mit einer ganzen Batterie an Gegenmaßnahmen schwer macht, das System auszutricksen. Das Design ist ebenfalls angenehm, mit einem relativ einfachen Nachladesystem. Am besten betreibt man die Waffe über ein gut geschütztes Netzwerk, weil die Software große Rechenleistung braucht und der Schutz ein Muss ist, weil die Raketen mit neuen Zielsignaturen übertölpelt werden können, wenn die Firewall überwunden wird.
item.crimson_wasp.desc=Jahrelang gab es auf dem Lasermarkt nur wenige Anbieter, weil die meisten Firmen von den Forschungs- und Produktionskosten abgeschreckt wurden. Auch Anbieter, die Konstruktionen von anderen nachbauten, hatten es schwer, das Budget für eine Produktion für diesen begrenzten Markt zu bekommen. Diese Waffe bietet Innovation und Konkurrenz für den Marktführer und setzt auf den wachsenden Bedarf durch die zunehmende Zahl an Weltraumoperationen, die den Hauptgrund dafür bildet, dass Evo sich engagiert.\nEin vertrautes Design und bekannte Funktionsweisen machen diesen Laser ideal für klassisch ausgebildete Soldaten. Die Batterie lässt sich wie ein Magazin auswechseln, die Ergonomie der Waffe erinnert den Benutzer an den minimalen Rückstoß, und das Visiersystem richtet sich mit dem \u201ELauf\u201C aus, um die Präzision zu erhöhen. Wie die meisten Laserwaffen bietet auch diese eine fantastische Präzision auf hohe Entfernung, verliert aber bei großer Distanz an Konzentration des Strahls und damit an Schadenspotenzial. Aber weil moderne Panzerung nicht für das Ableiten von Hitze und Strahlung gebaut ist, ist es das meistens wert.
item.red_fox.desc=Der Wasp war beeindruckend, aber in den Fox habe ich mich verliebt. Der verlängerte Lauf verbessert die Konzentration des Strahls, was die effektive Reichweite höher als bei jedem anderen Laser auf dem Markt macht. Auf größere Distanz gibt es zwar immer noch eine Streuung an Partikeln, aber rEVOlution hat bei der Konstruktion etwas daran verbessert. Das Ding sieht außerdem hervorragend aus und fühlt sich toll an, hat das Batteriewechselsystem, durch das es sich wie ein klassisches Gewehr anfühlt, und ein scharfes Design, das zur futuristischen Funktion passt.
item.ammo_battery_laser.desc=Die Batterien für Crimson Wasp und Red Fox sind nicht wiederaufladbar. Die Batterien beider Waffen sind kompatibel.
ammotype.revo_rounds.desc=Ich bin nicht ganz sicher, warum sie es nötig fanden,  eine neue Version von etwas auf den Markt zu bringen, das aussieht wie die alte Firepower-Munition, aber das haben sie getan. Diese Hülsenmunition verwendet eine patentierte Chemikalienkombination als Treibsatz, und die Geschosse selbst sind nanokonstruiert und haben eine einzigartige Verbindungsstruktur, die zusammenhält, um Panzerung zu durchschlagen, aber in Fragmente zersplittert, wenn sie auf weiches Gewebe trifft \u2013 und das auch, wenn sie das Gewebe statt der Panzerung trifft. Auf jeder Packung gibt es einen Warnhinweis, dass man die Patronen nicht öffnen kann, ohne den Treibsatz zu entzünden, was einen Nachbau verhindern soll. Man kann das Geschoss nicht herausziehen, um seine Struktur zu analysieren, und man hat keinen Zugang zum chemischen Treibsatz. Diese Munition ist von Mysterien umgeben, was sie gleichzeitig höchst begehrt, aber auch bei den Leuten gefürchtet macht, die sich Sorgen darüber machen, welche Herstellungsprozesse und welche Nanotech nötig waren, um sie möglich zu machen.

item.ares_bug_stomper.desc=Das taktische Panzerungssystem \u201EBug Stomper\u201C von Ares wird von manchen als der Gipfel des modernen Panzerungsdesigns angesehen und wurde nur deswegen entworfen, um den Firewatch-Einsatzkräften zu ermöglichen, in den Nahkampf mit verschiedensten Arten von Bugs zu gehen und eine vernünftige Überlebenschance zu haben. Bis vor Kurzem war nur sehr wenig über dieses Panzerungssystem bekannt, da Ares aus den genauen Spezifikationen ein streng gehütetes Geheimnis machte. Die Ereignisse der jüngsten Vergangenheit haben jedoch dafür gesorgt, dass mehr Informationen über das Bug-Stomper-System ans Licht kamen. Bug-Stomper-Panzerungen bestehen aus extrem strapazierfähigen und leichten Materialien, sodass die Panzerung zwar ungefähr so groß wie eine mittlere Militärpanzerung ist, dabei aber ein Viertel weniger Gewicht auf die Waage bringt.\nSpezielle Gelenksysteme erlauben eine ungehinderte und geschmeidige Bewegung. Einige Varianten der ersten Version dieser Panzerung verfügten über die Möglichkeit, eine Mikrodrohne und eine kleine Drohne zu starten. Aber als sich das Debakel in Detroit ereignete, hatte Ares schon die Mark II entwickelt. Diese bereits zu Testzwecken bei ausgewählten Einheiten im Einsatz befindlichen Modelle sind mit speziellen \u201Ereaktiven\u201C Panzerplatten ausgestattet, die an Beinen, Torso und Armen angebracht werden können. Zwar hat Ares auch weiterhin nicht vor, die Bug Stomper auf dem freien Markt anzubieten, aber auf dem Schwarzmarkt sind bereits zahlreiche der Panzerungen (oder Einzelteile davon) aufgetaucht, die zu extrem hohen Preisen gehandelt werden \u2013 falls man sie überhaupt findet.
item.securetech_aas.desc=Obwohl Ares auf diversen anderen Gebieten schwer  zu kämpfen hat, haben die Execs des Konzerns Mittel und Wege gefunden, neues Kapital für ihre hoffnungslosen Projekte zu generieren. Der \u201EKauf\u201C der Marke \u201ESecuretech\u201C (nicht zu verwechseln mit SecureTech) erlaubte es ihnen, ihre Panzerungskollektion dank einiger dreister Kopien weiter zu stärken. Das PUS ähnelt dem PSB-System und bietet zusätzliche Polsterung und Panzerung, mit der Lücken in diversen Standardpanzerungen abgedeckt oder bestimmte Vitalpunkte noch besser geschützt werden können.\nDie Produkte sind zwar insgesamt von guter Qualität, aber das echte SecureTech lässt jede Menge Ressourcen in die Schatten fließen, um die Tore der Hölle zu öffnen und Ares hier einen Strich durch die Rechnung zu machen. Die Runner, die sich über den daraus resultierenden Geldsegen freuen, scheren sich nicht darum, für wen sie arbeiten. Verletzte Egos sind immer gut fürs Bankkonto!
item.securetech_skinshield.desc=Offensichtlich hat Ares bei SecureTech (mit großem T) mehr als nur die PSB-Daten mitgehen lassen. Es hat auch Informationen über die rutheniummodifizierte SecondSkin-Produktlinie abgegriffen und das alles zu seinem SkinShield-System verschmolzen, der nächsten Evolutionsstufe der unauffälligen Schutzkleidung. Das Ruthenium-System wurde verbessert, sodass es einen nicht nur nahezu unsichtbar machen kann, sondern es auch ermöglicht, seine Hautfarbe zu ändern, um perfekt gebräunt oder geisterhaft bleich zu wirken, Tattoos hinzuzufügen, um etwas extravaganter auszusehen, oder \u2013 wenn man einen ordentlichen Hacker hat \u2013 sogar mehr oder weniger transparent zu erscheinen.
item.ballistic_mask.desc=Wie heißt es so schön: \u201EJeder hat einen Plan, bis er ins Gesicht geschlagen wird.\u201C Narben lassen einen auf der Straße zwar wie einen harten Kerl wirken, werfen aber überall sonst nur Fragen auf und ziehen Aufmerksamkeit auf sich. Ganz zu schweigen von dem ganzen empfindlichen und wichtigen Kram, der sich hinter dem Gesicht befindet und besser auch unverletzt bleiben sollte. Nicht identifiziert werden zu können, ist ein netter Bonus, vor allem für Leute, deren Job darin besteht, unerkannt zu bleiben.\nDas grundlegende Design ist einfach, aber diese Masken gibt es in zahlreichen verschiedenen Ausführungen, darunter eine ganze Kollektion von \u201EMaskerade\u201C-Modellen, die bei jenen seltsamen gesellschaftlichen Ereignissen für Schutz sorgen, bei denen die Reichen anonym bleiben wollen.
item.basic_duty_cold.desc=Ein Kampfanzug besteht entweder aus einer Hose und einem passenden langärmeligen Shirt oder  aus einem Overall. Diese Uniform gehört schon seit mehr als 150 Jahren zur Standardausstattung militärischer und paramilitärischer Einheiten und besteht aus strapazierfähigem, atmungsaktivem und (relativ) bequemem Stoff. Sie wird aus Kevlargewebe hergestellt, ist für den Alltagsgebrauch vorgesehen und bietet einen gewissen Schutz gegen kleinkalibrige Waffen. In ihrer Funktion als praktisches Kleidungsstück verfügen die meisten Kampfanzüge über diverse Taschen an Armen und Beinen, in denen Ausrüstung untergebracht werden kann. Auch bei Zivilisten sind sie aufgrund ihrer Belastbarkeit, Vielseitigkeit und der militärischen Optik extrem beliebt.
item.basic_duty_fire.desc=Ein Kampfanzug besteht entweder aus einer Hose und einem passenden langärmeligen Shirt oder  aus einem Overall. Diese Uniform gehört schon seit mehr als 150 Jahren zur Standardausstattung militärischer und paramilitärischer Einheiten und besteht aus strapazierfähigem, atmungsaktivem und (relativ) bequemem Stoff. Sie wird aus Kevlargewebe hergestellt, ist für den Alltagsgebrauch vorgesehen und bietet einen gewissen Schutz gegen kleinkalibrige Waffen. In ihrer Funktion als praktisches Kleidungsstück verfügen die meisten Kampfanzüge über diverse Taschen an Armen und Beinen, in denen Ausrüstung untergebracht werden kann. Auch bei Zivilisten sind sie aufgrund ihrer Belastbarkeit, Vielseitigkeit und der militärischen Optik extrem beliebt.
item.basic_duty_chemical.desc=Ein Kampfanzug besteht entweder aus einer Hose und einem passenden langärmeligen Shirt oder  aus einem Overall. Diese Uniform gehört schon seit mehr als 150 Jahren zur Standardausstattung militärischer und paramilitärischer Einheiten und besteht aus strapazierfähigem, atmungsaktivem und (relativ) bequemem Stoff. Sie wird aus Kevlargewebe hergestellt, ist für den Alltagsgebrauch vorgesehen und bietet einen gewissen Schutz gegen kleinkalibrige Waffen. In ihrer Funktion als praktisches Kleidungsstück verfügen die meisten Kampfanzüge über diverse Taschen an Armen und Beinen, in denen Ausrüstung untergebracht werden kann. Auch bei Zivilisten sind sie aufgrund ihrer Belastbarkeit, Vielseitigkeit und der militärischen Optik extrem beliebt.
item.mil_spec_armor_light.desc=\u201ETopmodern\u201C, \u201EState of the Art\u201C und \u201Edas Neueste vom Neuen\u201C sind Phrasen, mit denen Militärpanzerungen beschrieben werden. Militärpanzerungen sind für den offenen Kampf gedacht und werden üblicherweise nur an Eliteeinheiten ausgegeben. Alles an einer Militärpanzerung ist darauf ausgelegt, den größtmöglichen Schutz zu liefern. Es gibt drei grundlegende Varianten dieser Panzerungen: leichte, mittlere und schwere. Die leichte Version wird üblicherweise von Einsatzkräften genutzt, für die größere Mobilität wichtig ist, die mittleren Panzerungen sind das Standardmodell und ein Kompromiss zwischen Beweglichkeit und Schutz, und eine schwere Panzerung zeigt dem Konzept von Mobilität schlicht den Mittelfinger. Die exakten Spezifikationen variieren, aber alle Militärpanzerungen greifen als primäre Schutzschicht auf irgendeine Art von Leichtmetall in verschiedenen Konfigurationen und Stärken zurück. Militärpanzerungen sind für einen speziellen Zweck  gebaut und können abgesehen von persönlicher Bodytech, magischen Verbesserungen und natürlich dem  für diese Panzerung vorgesehenen Helm nicht mit anderen Panzerungssystemen kombiniert werden.\nDer Einbau normaler Panzerungsmodifikationen ist möglich. Jede Militärpanzerung ist eigens auf ihren Besitzer angepasst und verfügt über von Kleinstmotoren betriebene Mikrogelenke, die maximale Ergonomie gewährleisten. Militärpanzerungen gibt es in den verschiedensten Stilen und Farben \u2013 je nach der Armee und/oder Einheit, bei der sie eingesetzt werden.  Oftmals werden auch individuell angepasste Helme getragen, die mit jeder Menge Sensoren und Kommunikationsausrüstung aufgerüstet werden können.\nDer Einsatz von Militärpanzerung bringt drei hauptsächliche Nachteile mit sich. Zuerst wären da die Kosten: Die meisten Militärpanzerungen liegen außerhalb der Preisklasse der meisten Shadowrunner  und sogar der meisten Söldnereinheiten. Zweitens sind diese Panzerungen extrem stark reguliert und schwer zu bekommen; wenn ihr also nicht beim Militär seid, über die passenden (und aktuellen) Sicherheitslizenzen verfügt oder als privater Militärdienstleister einen guten Stand (Schlüsselwort!) bei  der International Mercenary Association habt, dann stellt euch darauf ein, eine riesige Zielscheibe auf dem Rücken zu tragen, wann immer ihr euren wertvollen Anzug tragt. Und drittens opfern die mittleren und schweren Panzerungen zumindest einen Teil ihrer Beweglichkeit für besseren Schutz.
item.mil_spec_armor_medium.desc=\u201ETopmodern\u201C, \u201EState of the Art\u201C und \u201Edas Neueste vom Neuen\u201C sind Phrasen, mit denen Militärpanzerungen beschrieben werden. Militärpanzerungen sind für den offenen Kampf gedacht und werden üblicherweise nur an Eliteeinheiten ausgegeben. Alles an einer Militärpanzerung ist darauf ausgelegt, den größtmöglichen Schutz zu liefern. Es gibt drei grundlegende Varianten dieser Panzerungen: leichte, mittlere und schwere. Die leichte Version wird üblicherweise von Einsatzkräften genutzt, für die größere Mobilität wichtig ist, die mittleren Panzerungen sind das Standardmodell und ein Kompromiss zwischen Beweglichkeit und Schutz, und eine schwere Panzerung zeigt dem Konzept von Mobilität schlicht den Mittelfinger. Die exakten Spezifikationen variieren, aber alle Militärpanzerungen greifen als primäre Schutzschicht auf irgendeine Art von Leichtmetall in verschiedenen Konfigurationen und Stärken zurück. Militärpanzerungen sind für einen speziellen Zweck  gebaut und können abgesehen von persönlicher Bodytech, magischen Verbesserungen und natürlich dem  für diese Panzerung vorgesehenen Helm nicht mit anderen Panzerungssystemen kombiniert werden.\nDer Einbau normaler Panzerungsmodifikationen ist möglich. Jede Militärpanzerung ist eigens auf ihren Besitzer angepasst und verfügt über von Kleinstmotoren betriebene Mikrogelenke, die maximale Ergonomie gewährleisten. Militärpanzerungen gibt es in den verschiedensten Stilen und Farben \u2013 je nach der Armee und/oder Einheit, bei der sie eingesetzt werden.  Oftmals werden auch individuell angepasste Helme getragen, die mit jeder Menge Sensoren und Kommunikationsausrüstung aufgerüstet werden können.\nDer Einsatz von Militärpanzerung bringt drei hauptsächliche Nachteile mit sich. Zuerst wären da die Kosten: Die meisten Militärpanzerungen liegen außerhalb der Preisklasse der meisten Shadowrunner  und sogar der meisten Söldnereinheiten. Zweitens sind diese Panzerungen extrem stark reguliert und schwer zu bekommen; wenn ihr also nicht beim Militär seid, über die passenden (und aktuellen) Sicherheitslizenzen verfügt oder als privater Militärdienstleister einen guten Stand (Schlüsselwort!) bei  der International Mercenary Association habt, dann stellt euch darauf ein, eine riesige Zielscheibe auf dem Rücken zu tragen, wann immer ihr euren wertvollen Anzug tragt. Und drittens opfern die mittleren und schweren Panzerungen zumindest einen Teil ihrer Beweglichkeit für besseren Schutz.
