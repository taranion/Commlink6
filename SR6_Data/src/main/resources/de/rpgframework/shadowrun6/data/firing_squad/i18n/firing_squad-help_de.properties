item.av_rapid_transit_diamond_chemical.desc=Wenn man die Globetrotter-Uniformen nimmt und die Konzernlogos weglässt, hat man die Rapid-Transit-Kollektion. Sie bietet Alltagspanzerung für alle, die sich gleichzeitig sicher fühlen und modisch im Trend bleiben wollen. Die RT-Kollektion gibt es in den Editionen Basis, Elite, Platin und Diamant, damit man bei seiner Alltagskleidung ein bisschen variieren kann.
item.av_wild_hunt_cold.desc=Die Kollektion Wild Hunt wird nicht nur in einem einzelnen Muster angeboten, sondern bietet eine ganze Reihe von Stilen, die an verschiedene Umgebungen und Klimazonen angepasst sind. Neben der gut gearbeiteten Panzerung verfügt jeder Anzug auch über besondere Eigenschaften, um den Träger besser gegen widrige Umwelteinflüsse zu schützen.
item.av_wild_hunt_fire.desc=Die Kollektion Wild Hunt wird nicht nur in einem einzelnen Muster angeboten, sondern bietet eine ganze Reihe von Stilen, die an verschiedene Umgebungen und Klimazonen angepasst sind. Neben der gut gearbeiteten Panzerung verfügt jeder Anzug auch über besondere Eigenschaften, um den Träger besser gegen widrige Umwelteinflüsse zu schützen.
item.armante_suitdress.desc=Der Name Armanté ist schon seit Langem gleichbedeutend mit Reichtum. Nur die wohlhabendsten Leute (oder die, die reich wirken wollen) investieren die Unsummen an Nuyen, die ein Armanté-Kleidungsstück kostet.
item.cyclewear.desc=Angesichts des Erfolgs von Panzerungen, die eigens für eine Zielgruppe mit Geld und wenig Verstand entworfen wurden, startete Ares eine Marketing-kampagne und klatschte ausreichend viele unterschiedliche Markennamen auf extrem ähnliche Ausrüstung, um sich effektiv das Marktmonopol auf Go-Ganger-Panzerung zu sichern. RacerWear, SpeedWear, CycleSafe und MotoArmor sind nur vier der zwei Dutzend Kollektionen von Biker-Panzerungen, die Ares im Angebot hat. Jede Kollektion bietet die Möglichkeit, die entsprechende Panzerung mit eigenen Logos, Leuchtstreifen, Feedback-Modifikationen und vielen weiteren Optionen auszustatten, mit denen die Gangs ihre Panzerungen nach Herzenslust individualisieren können, während am Ende alle Nuyen im selben Topf landen. Auch Combatbiking- und Urban-Brawl-Fans und -Teams sind diese Panzerungen sehr beliebt.
item.mortimer_greatcoats.desc=Die neue Greatcoat-Kollektion ist auf Langmäntel im klassischen Stil ausgerichtet. Um nur einige wenige zu nennen: Es gibt den American Drover, den klassischen Trenchcoat, stylische Lodenmäntel, den Havelock, den Ulster, den charakteristischen Ulysses und den modischen Argentum. Das Wichtigste ist das Mortimer-Logo, das an auffällig unauffälligen Stellen eingearbeitet ist und von anderen Mortimer-Besitzern sowie Kennern entdeckt werden kann.
item.mortimer_berwick_suit.desc=Nichts bringt Reichtum besser zum Ausdruck als ein perfekt maßgeschneiderter britischer Anzug, und Mortimer verkörpert über alle Kollektionen hinweg genau das. Der klassische Berwick-Stil wird jedes Jahr neu aufgelegt, aber nur selten wird eine Naht dabei um mehr als ein paar Millimeter verändert. Das Modell Crimson Sky hat sich zu einem wahren Hit entwickelt, während die Summit-Kollektion Kombinationen aus Anzügen und Abendkleidern bietet, in denen sich jedes Paar als Teil der Millionärselite präsentieren kann, ohne sich komplett zu ruinieren.
item.mortimer_crimson_sky_suit.desc=Nichts bringt Reichtum besser zum Ausdruck als ein perfekt maßgeschneiderter britischer Anzug, und Mortimer verkörpert über alle Kollektionen hinweg genau das. Der klassische Berwick-Stil wird jedes Jahr neu aufgelegt, aber nur selten wird eine Naht dabei um mehr als ein paar Millimeter verändert. Das Modell Crimson Sky hat sich zu einem wahren Hit entwickelt, während die Summit-Kollektion Kombinationen aus Anzügen und Abendkleidern bietet, in denen sich jedes Paar als Teil der Millionärselite präsentieren kann, ohne sich komplett zu ruinieren.
item.mortimer_summit_suit.desc=Nichts bringt Reichtum besser zum Ausdruck als ein perfekt maßgeschneiderter britischer Anzug, und Mortimer verkörpert über alle Kollektionen hinweg genau das. Der klassische Berwick-Stil wird jedes Jahr neu aufgelegt, aber nur selten wird eine Naht dabei um mehr als ein paar Millimeter verändert. Das Modell Crimson Sky hat sich zu einem wahren Hit entwickelt, während die Summit-Kollektion Kombinationen aus Anzügen und Abendkleidern bietet, in denen sich jedes Paar als Teil der Millionärselite präsentieren kann, ohne sich komplett zu ruinieren.
item.nightshade_moonsilver_dress_suit.desc=Während sich die Moonsilver-Kollektion auf Kleider mit elektrolumineszenten Stoffen fokussiert, bietet die NightShade-Kollektion Stil und Klasse in einem kugelresistenten Gesamtpaket, mit dem man selbst den hässlichsten Troll fit für die Laufstege machen kann.\nDer Slogan \u201ENightShade \u2013 und die Nacht wird zum Töten schön!\u201C hat verhindert, dass diese Kollektion in die Ränge von Armanté aufsteigen konnte, aber dafür, dass es sich hier jetzt um ein Ares-Produkt handelt, wird über den militanten Hersteller dieser Kleidungsstücke ziemlich oft hinweggesehen.
item.realeather_armor.desc=Bei diesem aus echtem Leder gefertigten Statussymbol geht es weniger darum, Kugeln abzufangen, als darum, zu zeigen, dass man ein dickes Portemonnaie hat. Es ist ein bisschen Extrapanzerung eingebaut, aber nicht viel.
item.vi_ace_of_cups.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Cups ist ein bodenlanger Langmantel mit hohem Kragen und ausgestelltem oberem Rückenstück mit weiten, gerafften  Schößen.
item.vi_ace_of_swords.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Swords ist eine Jacke im Stil japanischer Piloten aus dem 2. Weltkrieg, inklusive integrierter Wakizashi-Scheide am Rücken.
item.vi_ace_of_wands.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Wands ist stilistisch bei den New-Age-Magiern angesiedelt und bietet zahlreiche kleine Taschen für Reagenzien.
item.vi_ace_of_coins.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Coins trägt mit schwarzem, schwerem Leder, Platingarnstrickereien und Echtgoldapplikationen sehr dick auf.
item.vi_ace_of_spades.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Spades ist eine Jacke im Stil der US-Kampfpiloten des 2. Weltkriegs.
item.vi_ace_of_clubs.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Clubs bedient sich ebenfalls beim Zweiter-Weltkrieg-Thema, allerdings auf der anderen Atlantikseite und bei den britischen Bomberpiloten.
item.vi_ace_of_hearts.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDas Ace of Hearts hingegen ist mehr als ein Jahrhundert weiter in der Zukunft angesiedelt und im Stil moderner Militärpiloten gehalten.
item.vi_ace_of_diamonds.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nFür das Ace of Diamonds wurden Designs aus der Trideoserie Spitfire Resurrection verwendet. Nach dem Release der nächsten Staffel 2082 ist bereits eine komplette Spin-off-Kollektion geplant.
item.vi_steampunk.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nAuch die Steampunk-Kollektion erfreut sich weiter großer Beliebtheit, und zahlreiche Spezialisten für elektronische Sicherheit bauen ihre neuen Decks mittlerweile direkt in diese Anzüge und Kleider ein. Und zwar üblicherweise zusätzlich zu dem bereits ab Werk enthaltenen individuell angepassten Kommlink.
item.vi_synergist.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDie Kollektionen Actioneer (SR6, S. 265) und Synergist verkaufen sich nach wie vor ausgezeichnet \u2013 angesiedelt im gehobenen Preissegment, aber nicht so, dass man damit in gesellschaftlichen Kreisen den Rahmen sprengen würde.
item.vi_actioneer_buisness.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDie Kollektionen Actioneer (SR6, S. 265) und Synergist verkaufen sich nach wie vor ausgezeichnet \u2013 angesiedelt im gehobenen Preissegment, aber nicht so, dass man damit in gesellschaftlichen Kreisen den Rahmen sprengen würde.
item.vi_sleeping_tiger.desc=Die Modeschöpfer bei Vashon Island herrschen immer noch über das mittlere Marktsegment der modischen Panzerungen. Einige ihrer Kreationen kratzen sogar an den Grenzen dieses Markts und machen einigen der bekanntesten High-End-Marken der Welt Konkurrenz.\nDiese Rolle (dass Preise den Rahmen sprengen) fällt der Sleeping-Tiger-Kollektion zu, die erst vor wenigen Jahren wieder auf der Bühne auftauchte und seither die Vashon-Island-Laufstege dominiert. Sie zeichnet sich durch ihre Fähigkeit aus, Farbe und Muster zu ändern. Entsprechende Vorlagen für Farben und Styles werden zu Premiumpreisen verkauft, und verschiedene Künstler machen sich einen Namen, indem sie einzigartige Muster für reiche Kunden entwerfen.

item.concealable_ammo_pouch.desc=Wenn man als Schütze einen Platz braucht, um seine zusätzlichen Magazine zu verstauen und zu sichern, ohne dies seiner Umwelt kundzutun, dann sollte man sich nicht mit billigen Alternativen zufrieden geben. Die Tasche erhöht die Tarnbarkeit von in der Tasche befindlicher Munition um 1 (ein typisches Magazin hat außerhalb der Tasche eine Tarnbarkeit von 4, in der Tasche eine Tarnbarkeit von 5). \nDie Tasche ist für die Magazine von Pistolen (einschließlich MPs) und Gewehren erhältlich.
item.concealable_ammo_pouch_selaed.desc=Wenn man als Schütze einen Platz braucht, um seine zusätzlichen Magazine zu verstauen und zu sichern, ohne dies seiner Umwelt kundzutun, dann sollte man sich nicht mit billigen Alternativen zufrieden geben. Die Tasche erhöht die Tarnbarkeit von in der Tasche befindlicher Munition um 1 (ein typisches Magazin hat außerhalb der Tasche eine Tarnbarkeit von 4, in der Tasche eine Tarnbarkeit von 5). \nDie Tasche kann mit einer chemischen Versiegelung ausgestattet werden, sodass alle Proben mit Chemsniffern, um die Munition zu entdecken (s. SR6, S. 243), einen Würfelpoolmodifikator von -1 erhalten, bis die Versiegelung der Tasche gebrochen wird, um die Munition zu entnehmen.\nDie Tasche ist für die Magazine von Pistolen (einschließlich MPs) und Gewehren erhältlich.
item.mems_ammo_pouch_small.desc=MAMS ist kein Panzerungssystem an sich, sondern umfasst ein Basis-Tragesystem und eine Reihe optionaler Zusatzhalterungen, die mit schwereren Panzerungen (ab Sicherheitspanzerungen aufwärts) kombiniert werden können. Allgemein gesprochen dient MAMS dazu, Ausrüstung an der Außenseite eines Panzerungssystems transportieren und befestigen zu können, ohne die Panzerung dafür eigens modifizieren zu müssen. Mithilfe des MAMS kann der Benutzer Waffenholster, Magazintaschen und verschiedene Ausrüstungstaschen an beliebigen Stellen anbringen, je nach seinen spezifischen Bedürfnissen und persönlichen Präferenzen. Dadurch wird ein leichterer Zugriff auf die Ausrüstung und damit auch deren vereinfachter Einsatz ermöglicht. In Kämpfen, in denen schon Millisekunden den Unterschied zwischen Leben und Tod ausmachen, ist das ein nicht zu verachtender Vorteil.\nZu den MAMS-Erweiterungen zählen: Standard- und Schnellziehholster (für Waffen bis zur Größe schwerer Pistolen), Magazintaschen, individuelle Schlaufenholster für Schrotflinten-Patronen, Medkit-Taschen, Halterungen für taktische Tragegurte und Ausrüstungstaschen.
item.mems_ammo_pouch_large.desc=MAMS ist kein Panzerungssystem an sich, sondern umfasst ein Basis-Tragesystem und eine Reihe optionaler Zusatzhalterungen, die mit schwereren Panzerungen (ab Sicherheitspanzerungen aufwärts) kombiniert werden können. Allgemein gesprochen dient MAMS dazu, Ausrüstung an der Außenseite eines Panzerungssystems transportieren und befestigen zu können, ohne die Panzerung dafür eigens modifizieren zu müssen. Mithilfe des MAMS kann der Benutzer Waffenholster, Magazintaschen und verschiedene Ausrüstungstaschen an beliebigen Stellen anbringen, je nach seinen spezifischen Bedürfnissen und persönlichen Präferenzen. Dadurch wird ein leichterer Zugriff auf die Ausrüstung und damit auch deren vereinfachter Einsatz ermöglicht. In Kämpfen, in denen schon Millisekunden den Unterschied zwischen Leben und Tod ausmachen, ist das ein nicht zu verachtender Vorteil.\nZu den MAMS-Erweiterungen zählen: Standard- und Schnellziehholster (für Waffen bis zur Größe schwerer Pistolen), Magazintaschen, individuelle Schlaufenholster für Schrotflinten-Patronen, Medkit-Taschen, Halterungen für taktische Tragegurte und Ausrüstungstaschen.
