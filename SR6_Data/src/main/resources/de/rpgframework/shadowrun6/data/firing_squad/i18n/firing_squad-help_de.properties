eguliert und schwer zu bekommen; wenn ihr also nicht beim Militär seid, über die passenden (und aktuellen) Sicherheitslizenzen verfügt oder als privater Militärdienstleister einen guten Stand (Schlüsselwort!) bei  der International Mercenary Association habt, dann stellt euch darauf ein, eine riesige Zielscheibe auf dem Rücken zu tragen, wann immer ihr euren wertvollen Anzug tragt. Und drittens opfern die mittleren und schweren Panzerungen zumindest einen Teil ihrer Beweglichkeit für besseren Schutz.
item.mil_spec_helmet.desc=siehe Militärpanzerung
item.parashield_mystic_tough.desc=Die Sechste Welt ist ein Ort voller Zerstörung und Magie. Schon seit Langem versucht die Technologie, ihrem Erbfeind \u2013 der Magie \u2013 deren Vorteil abzujagen, vor allem auf dem Gebiet der Verteidigungsmöglichkeiten für Mundane gegen magische Angriffe.\nParashield hat sein Expertenwissen in Bezug auf das Abrichten von Paracrittern und ihre Physiologie mit den Grundprinzipien ballistischer Schutzwirkung  kombiniert und war so in der Lage, Materialien herzustellen, die Kugeln und Mana-Einschläge gleichermaßen abhalten.
item.securetech_invisishield.desc=Diese Panzerung wurde als Nachfolger der allseits  beliebten formangepassten Körperpanzerung entwickelt, und mit dieser Produktlinie ist es SecureTech  gelungen, den Markt für unauffällige Panzerung zu  revolutionieren \u2013 was auch bitter nötig war, nachdem  Ares bei den PSB-Marktanteilen des Konzerns gewildert hatte. Während KonSec- und Militäreinheiten teilweise durchaus wollen, dass ihre Panzerung eine  gewisse einschüchternde Wirkung entfaltet, ist es Managern und ihren Personenschutzexperten sehr wichtig, keinerlei Anzeichen von Angst erkennen zu lassen und gleichzeitig gut gegen sämtliche Bedrohungsszenarien geschützt zu sein.
item.mems_tactical_armor_vest.desc=Als gepanzerte Version des MAMS-Systems (S. 81)
besteht die taktische Panzerweste (auch schlicht Tac-Weste genannt) aus modernen Kevlargewebeplatten, die in einen westenartigen Plattenträger gesteckt werden, der Front und Rücken bedeckt. Selbst voll mit Panzerplatten bestückt lässt sich die Tac-Weste leicht in einem Fahrzeug oder kleinen Koffer lagern, um sie dann schnell überzuziehen, sobald es nötig wird.
item.security_armor.desc=Konstruiert an der Schnittstelle zwischen zivilen und militärischen Anforderungen, sind diese Panzerungen ein guter Kompromiss für alle, die die Schutzwirkung von Tech auf Militärniveau wollen, dabei jedoch auf den ganzen zusätzlichen Schnickschnack verzichten können. Bisher sieht man diese Panzerungssysteme hauptsächlich bei privaten Sicherheitskräften, die als Personenschützer für reiche Konzernkunden arbeiten \u2013 aber bei diesen Sicherheitskräften handelt es sich nicht in jedem Fall um Konzernangestellte, und es gibt Runner, die sich gern in hochwertiger Ausrüstung bezahlen lassen.
item.murder_armor.desc=Dieses Ding war nicht mehr als eine kitschige Spielerei, bis Corinne Potter, damals noch Kandidatin für die Gouverneurswahl in Seattle, bei einem Hinterhalt von mehreren Schüssen in die Brust getroffen wurde und dann vor laufender Kamera wieder aufstand, sich den Staub abklopfte und Horizon für ihre erstklassige Schutzkleidung dankte. Sie erwähnte den Namen nicht direkt, aber jeder wusste genau, was gemeint war. Den meisten Leuten ist der Name auch egal; ihnen ist nur wichtig, dass sie eine Kugel einstecken, sich tot stellen und ihrem Sicherheitsteam den Rest überlassen können.
item.av_big_game_hunter_cold.desc=Die Kollektion Big Game Hunter ist seit mehreren Jahren Teil der Produktlinie und gewann rasch an Beliebtheit bei Shadowrunnern, die sich nicht groß darum scherten, möglichst unauffällig zu bleiben. Die Tarnmuster waren noch nie besonders auf eine urbane Umgebung angepasst, und meistens wurde die Panzerung getragen, weil es für diesen Preis einfach nichts Besseres gab. Der technologische Fortschritt hat einen Teil dieser Vorteile zunichtegemacht, aber mittlerweile hat Ares mit den Modellen \u201ETactical Black\u201C und \u201EUrban Camouflage\u201C Bestseller im Programm, die sich auf den Straßen deutlich besser machen. Man erntet damit zwar hier und da trotzdem einen schiefen Blick, aber die Käufer dieser Produktlinie sind ohnehin eher der Schlag Mensch, der zuerst schießt und danach auch keine Fragen mehr stellt.
item.av_big_game_hunter_fire.desc=Die Kollektion Big Game Hunter ist seit mehreren Jahren Teil der Produktlinie und gewann rasch an Beliebtheit bei Shadowrunnern, die sich nicht groß darum scherten, möglichst unauffällig zu bleiben. Die Tarnmuster waren noch nie besonders auf eine urbane Umgebung angepasst, und meistens wurde die Panzerung getragen, weil es für diesen Preis einfach nichts Besseres gab. Der technologische Fortschritt hat einen Teil dieser Vorteile zunichtegemacht, aber mittlerweile hat Ares mit den Modellen \u201ETactical Black\u201C und \u201EUrban Camouflage\u201C Bestseller im Programm, die sich auf den Straßen deutlich besser machen. Man erntet damit zwar hier und da trotzdem einen schiefen Blick, aber die Käufer dieser Produktlinie sind ohnehin eher der Schlag Mensch, der zuerst schießt und danach auch keine Fragen mehr stellt.
item.av_big_game_hunter_chemical.desc=Die Kollektion Big Game Hunter ist seit mehreren Jahren Teil der Produktlinie und gewann rasch an Beliebtheit bei Shadowrunnern, die sich nicht groß darum scherten, möglichst unauffällig zu bleiben. Die Tarnmuster waren noch nie besonders auf eine urbane Umgebung angepasst, und meistens wurde die Panzerung getragen, weil es für diesen Preis einfach nichts Besseres gab. Der technologische Fortschritt hat einen Teil dieser Vorteile zunichtegemacht, aber mittlerweile hat Ares mit den Modellen \u201ETactical Black\u201C und \u201EUrban Camouflage\u201C Bestseller im Programm, die sich auf den Straßen deutlich besser machen. Man erntet damit zwar hier und da trotzdem einen schiefen Blick, aber die Käufer dieser Produktlinie sind ohnehin eher der Schlag Mensch, der zuerst schießt und danach auch keine Fragen mehr stellt.
item.av_globetrotter_cold.desc=Diese Kollektion markierte bei Ares Victory den Wendepunkt, ab dem sich die Produktlinie auf modische Uniformen mit integrierter Panzerung konzentrierte. Die Kollektion wurde leicht verändert und konzentriert sich nun noch stärker auf den Uniform-Aspekt, beispielsweise im Rahmen von Ares\u2019 Großvertrag mit der Fast-Food-Kette McHugh\u2019s. Richtig gehört, diese schicken neuen Uniformen sind gepanzert, und das wissen die Angestellten in den gefährlicheren Teilen der Stadt durchaus zu schätzen.
item.av_globetrotter_fire.desc=Diese Kollektion markierte bei Ares Victory den Wendepunkt, ab dem sich die Produktlinie auf modische Uniformen mit integrierter Panzerung konzentrierte. Die Kollektion wurde leicht verändert und konzentriert sich nun noch stärker auf den Uniform-Aspekt, beispielsweise im Rahmen von Ares\u2019 Großvertrag mit der Fast-Food-Kette McHugh\u2019s. Richtig gehört, diese schicken neuen Uniformen sind gepanzert, und das wissen die Angestellten in den gefährlicheren Teilen der Stadt durchaus zu schätzen.
item.av_rapid_transit_basic_cold.desc=Wenn man die Globetrotter-Uniformen nimmt und die Konzernlogos weglässt, hat man die Rapid-Transit-Kollektion. Sie bietet Alltagspanzerung für alle, die sich gleichzeitig sicher fühlen und modisch im Trend bleiben wollen. Die RT-Kollektion gibt es in den Editionen Basis, Elite, Platin und Diamant, damit man bei seiner Alltagskleidung ein bisschen variieren kann.
