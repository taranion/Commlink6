item.trench_knife.desc=Ein Grabendolch kommt dabei heraus, wenn man einen Schlagring mit einem Kampfmesser kombiniert. Das Konzept wurde im tödlichen Grabenkampf des Ersten Weltkriegs beliebt, wo der Krieg auf nächste Entfernung ausgefochten wurde. Grabendolche sind für das Zuschlagen, Stechen oder Schneiden gedacht und können verschiedenste Designs (ohne Handschutz, mit Schutzring, mit oder ohne Nieten oder Stacheln usw.) haben, aber das grundlegende Design hat einen Finger-/Handschutz, der mit einer Klinge von üblicherweise 14 bis 18 Zentimetern Länge verbunden ist. Eine unelegante Waffe, aber schnörkellos und effektiv.
item.hand_talons.desc=Handkrallen sind sowohl als Haltesystem für Waffen als auch als Verteidigungswaffe für den Notfall gedacht. Der Begriff bezeichnet eine große Vielfalt kleiner gebogener oder gerader Klingen von 2,5 bis 8 Zentimetern Länge. Es gibt sie in verschiedenen Formen und Stilen, und sie werden an den Fingern befestigt \u2013 an einem Handschuh, Kampfhandschuh oder Ring, der zusätzlich zu einer normalen Feuerwaffe getragen wird, ohne dass die Waffenleistung darunter leidet. Es wird allerdings empfohlen, Handkrallen an der Nebenhand zu tragen, um den normalen Einsatz der Feuerwaffe nicht zu behindern und Unfälle zu vermeiden.
item.horizon_flynn_pilum.desc=Horizon baute auf dem überraschenden Erfolg des Horizon-Flynn Rapiers auf und arbeitete wieder mit Flynn Armaments zusammen, um eine weitere moderne Variante einer klassischen Filmwaffe zu schaffen. In Horizons neuestem Trideo, Barbarax and the Space Gladiators, besiegt eine attraktive Frau praktisch ungepanzert Legionen von Kriegern, die verdächtig wie Schläger von Ares Macrotechnology aussahen. Im Showdown benutzt sie einen Teleskopspeer, den sie wie einen Wurfspieß wirft und damit zwei der Schergen an eine Wand nagelt.
item.kami_standard.desc=Kamas waren ursprünglich sichelähnliche Werkzeuge, die auf den Reisfeldern Asiens eingesetzt wurden. Aber wie so viele Werkzeuge dieser Zeit wurden auch sie zu Waffen umfunktioniert und schließlich von Kampfkünstlern übernommen. Die Popularität der Kama schwand im Laufe der letzten Jahrzehnte, und die Waffe war fast nur noch in Schaukämpfen zu sehen. Seit einigen Jahren jedoch erlebt die Kama ein Comeback, nachdem ein faltbares Modell aus modernen Materialien auf den Markt kam. Die rasiermesserscharfe Klinge ist nicht nur extrem effektiv bei Stichangriffen, sondern auch bei der Verteidigung gegen gegnerische Nahkampfangriffe.
item.kami_folding.desc=Kamas waren ursprünglich sichelähnliche Werkzeuge, die auf den Reisfeldern Asiens eingesetzt wurden. Aber wie so viele Werkzeuge dieser Zeit wurden auch sie zu Waffen umfunktioniert und schließlich von Kampfkünstlern übernommen. Die Popularität der Kama schwand im Laufe der letzten Jahrzehnte, und die Waffe war fast nur noch in Schaukämpfen zu sehen. Seit einigen Jahren jedoch erlebt die Kama ein Comeback, nachdem ein faltbares Modell aus modernen Materialien auf den Markt kam. Die rasiermesserscharfe Klinge ist nicht nur extrem effektiv bei Stichangriffen, sondern auch bei der Verteidigung gegen gegnerische Nahkampfangriffe.
item.kukri.desc=In Legenden heißt es, dass ein Kukri, das gezogen wird, Blut zu schmecken bekommen muss. Seine ursprüngliche Berühmtheit erhielt das Kukri von den legendären Gurkhas aus Indien und Nepal. Es handelt sich um ein gebogenes Kampfmesser, das für seine außergewöhnliche Schärfe bei Hieben bekannt ist, aber eine schlechte Stichwaffe ist. Das Kukri ist auch gut zum Schneiden und Hacken bei der Feldarbeit verwendbar, wenn das nötig ist. Die Kombination dieser Legende mit modernster Nanoschmieden-Technologie macht das Kukri zu einem der tödlichsten Kampfmesser, die im Moment im Einsatz sind. 
item.nodachi.desc=Das nodachi (oder Kampfschwert) ist auch als odachi (großes Schwert) bekannt und wurde ursprünglich von den Samurai des feudalen Japan als Infanteriewaffe und gegen Kavallerie eingesetzt. Es war zu lang, um an der Hüfte getragen oder schnell aus einer Rückenscheide gezogen zu werden, und wurde daher oft samt Scheide in der Hand getragen. Die zunehmende Beliebtheit von Waffen wie dem Katana brachte auch dem Nodachi neue Popularität, besonders bei Straßensamurai und anderen urbanen Kämpfern. Das ursprüngliche Nodachi war berüchtigt wegen der Schwierigkeit und der hohen Kosten, die mit der Herstellung nach traditionellen japanischen Methoden verbunden waren, aber moderne Schmiedetechnik macht den Prozess viel einfacher und billiger.\nBei den meisten Waffenhändlern kann man ohne große Schwierigkeiten ein Nodachi finden. Und sie sind in den meisten Ländern legal. Das Nodachi ist nicht ganz so beliebt wie das Katana, aber dennoch  eine beeindruckende Waffe. Die lange Klinge macht es zur idealen Nahkampfwaffe für den Kampf gegen mehrere Gegner auf größere Reichweite als mit traditionellen Klingen. Einige Go-Gangs verwenden diese Waffe auch für den Angriff von ihren Fahrzeugen aus.
item.long_tooth.desc=Die Cougar Weapons Company fand Mitte der 2070er eine Lösung mit ihrem ersten Teleskopspeer, der aus einer Memory-Stahllegierung bestand. Diese Legierung konnte zusammengeschoben die Größe eines gewöhnlichen Messers und im ausgefahrenen Zustand ohne Stabiitätsverlust die Größe eines Speers annehmen.\n2079 setzte Cougar mit der Einführung des Long Tooth noch eins drauf: einen neuen, verbesserten Teleskopstab/-speer aus derselben Legierung. Im zusammengeschobenen Zustand ist der Long Tooth nur wenig länger als der Griff eines Kampfmessers. Wenn er aktiviert wird, kann er auf 0,5, 1, 1,5 oder 2 Meter Länge ausgezogen werden. \nDer Long Tooth hat außerdem eine optionale abnehmbare Klinge von zwölf Zentimetern Länge, die in eingezogenem oder ausgefahrenem Zustand verwendet werden kann, was ihn zu einem echten Speer macht.
item.long_tooth_blade.desc=Die Cougar Weapons Company fand Mitte der 2070er eine Lösung mit ihrem ersten Teleskopspeer, der aus einer Memory-Stahllegierung bestand. Diese Legierung konnte zusammengeschoben die Größe eines gewöhnlichen Messers und im ausgefahrenen Zustand ohne Stabiitätsverlust die Größe eines Speers annehmen.\n2079 setzte Cougar mit der Einführung des Long Tooth noch eins drauf: einen neuen, verbesserten Teleskopstab/-speer aus derselben Legierung. Im zusammengeschobenen Zustand ist der Long Tooth nur wenig länger als der Griff eines Kampfmessers. Wenn er aktiviert wird, kann er auf 0,5, 1, 1,5 oder 2 Meter Länge ausgezogen werden. \nDer Long Tooth hat außerdem eine optionale abnehmbare Klinge von zwölf Zentimetern Länge, die in eingezogenem oder ausgefahrenem Zustand verwendet werden kann, was ihn zu einem echten Speer macht.
item.dassault_alpenstock_blade.desc=Andere Firmen sehen in diesem zwei Meter langen Metallstock vielleicht nur einen Stock, aber Dassault hat einen alten Klassiker mit einer Reihe ausgefallener Merkmale ausgestattet, die ihn zu einem unschätzbaren Wander- und Survival-Werkzeug machen. Der Alpenstock kann als normaler Wanderstab dienen, aber da er aus leichtem, starkem Titan besteht, kann er auch Bäume, Steine und andere harte Objekte brechen, die im Weg sind (zum Beispiel Schädel und Knochen). Außerdem sind im Inneren des Stocks einige Werkzeuge verborgen: ein kurzes Messer, mit dessen Hilfe der Alpenstock als Speer verwendet werden kann (was auch beim Überqueren vereister Flächen helfen kann), ein Fischmesser, ein Feuerzeug, eine Pfeife, ein Glasbrecher und sogar ein Multitool.\nDazu gibt es noch einen Kompass, eine Taschenlampe und einen Katalysatorstab, der zur Wasseraufbereitung benutzt werden kann, wenn er ein paar Minuten lang untergetaucht wird. Der Katalysator kann wiederverwendet werden, aber man muss volle 12 Stunden zwischen den Einsätzen vergehen lassen, um ihn frisch zu halten.
item.dassault_alpenstock_spear.desc=Andere Firmen sehen in diesem zwei Meter langen Metallstock vielleicht nur einen Stock, aber Dassault hat einen alten Klassiker mit einer Reihe ausgefallener Merkmale ausgestattet, die ihn zu einem unschätzbaren Wander- und Survival-Werkzeug machen. Der Alpenstock kann als normaler Wanderstab dienen, aber da er aus leichtem, starkem Titan besteht, kann er auch Bäume, Steine und andere harte Objekte brechen, die im Weg sind (zum Beispiel Schädel und Knochen). Außerdem sind im Inneren des Stocks einige Werkzeuge verborgen: ein kurzes Messer, mit dessen Hilfe der Alpenstock als Speer verwendet werden kann (was auch beim Überqueren vereister Flächen helfen kann), ein Fischmesser, ein Feuerzeug, eine Pfeife, ein Glasbrecher und sogar ein Multitool.\nDazu gibt es noch einen Kompass, eine Taschenlampe und einen Katalysatorstab, der zur Wasseraufbereitung benutzt werden kann, wenn er ein paar Minuten lang untergetaucht wird. Der Katalysator kann wiederverwendet werden, aber man muss volle 12 Stunden zwischen den Einsätzen vergehen lassen, um ihn frisch zu halten.
item.dassault_alpenstock.desc=Andere Firmen sehen in diesem zwei Meter langen Metallstock vielleicht nur einen Stock, aber Dassault hat einen alten Klassiker mit einer Reihe ausgefallener Merkmale ausgestattet, die ihn zu einem unschätzbaren Wander- und Survival-Werkzeug machen. Der Alpenstock kann als normaler Wanderstab dienen, aber da er aus leichtem, starkem Titan besteht, kann er auch Bäume, Steine und andere harte Objekte brechen, die im Weg sind (zum Beispiel Schädel und Knochen).\nAußerdem sind im Inneren des Stocks einige Werkzeuge verborgen: ein kurzes Messer, mit dessen Hilfe der Alpenstock als Speer verwendet werden kann (was auch beim Überqueren vereister Flächen helfen kann), ein Fischmesser, ein Feuerzeug, eine Pfeife, ein Glasbrecher und sogar ein Multitool. Dazu gibt es noch einen Kompass, eine Taschenlampe und einen Katalysatorstab, der zur Wasseraufbereitung benutzt werden kann, wenn er ein paar Minuten lang untergetaucht wird. Der Katalysator kann wiederverwendet werden, aber man muss volle 12 Stunden zwischen den Einsätzen vergehen lassen, um ihn frisch zu halten.
item.tactical_hammer_short.desc=Manchmal ist ein Problem tatsächlich ein Nagel, auf den man draufhauen muss. In diesen Fällen ist der taktische Hammer genau das richtige Werkzeug.\nDen taktischen Hammer gibt es mit kurzem oder langem Griff, und er besitzt meistens einen Klauenzahn, der sich ins Ziel graben soll, um dessen Entkommen zu verhindern und die kinetische Energie sicher zu übertragen; der zusätzlich beschwerte Kopf erhöht außerdem die allgemeine Wucht. Bei einigen Modellen gibt es auch eine verstärkte Klinge oder einen stabilen Dorn, die eingesetzt werden können, wenn ein Waffenwechsel gerade nicht möglich ist.
item.tactical_hammer_long.desc=Manchmal ist ein Problem tatsächlich ein Nagel, auf den man draufhauen muss. In diesen Fällen ist der taktische Hammer genau das richtige Werkzeug.\nDen taktischen Hammer gibt es mit kurzem oder langem Griff, und er besitzt meistens einen Klauenzahn, der sich ins Ziel graben soll, um dessen Entkommen zu verhindern und die kinetische Energie sicher zu übertragen; der zusätzlich beschwerte Kopf erhöht außerdem die allgemeine Wucht. Bei einigen Modellen gibt es auch eine verstärkte Klinge oder einen stabilen Dorn, die eingesetzt werden können, wenn ein Waffenwechsel gerade nicht möglich ist.

item.ash_arms_standard_combat_chainsaw.desc=Egal, wie unpraktisch eine Waffe im Kampf sein mag, irgendjemand wird trotzdem versuchen, sie irgendwann zu benutzen, weil sie einfach cool aussieht. Und Ash Arms macht deswegen ordentlich Kohle mit seiner Kampfkettensäge. Die Kampfkettensäge unterschiedet sich vom gewöhnlichen Werkzeug durch zwei wichtige Dinge: Erstens sind einige wichtige Komponenten verstärkt worden, um stärkeren Beanspruchungen zu widerstehen. Zweitens haben Kampfkettensägen einen zusätzlichen Schutz durch Nahkampfverstärkung, die es erlaubt, einen Gegner damit zu schlagen, wenn die Säge nicht zum Einsatz kommen kann oder soll. Die Kampfkettensäge ist zwar in den meisten Kampfsituationen abseits von Prügeleien in Gassen etwas unpraktisch, aber sie hat einen gewissen Einschüchterungseffekt, der mehrere Vorzüge bietet.\nAsh bietet zwei Varianten dieser Waffe an: eine Standard- und eine Monofilament-Version, die vermeintlich höheres Schadenspotenzial bietet. Aber meistens ist sie für den Benutzer gefährlicher als für sein Ziel.
item.ash_arms_monofilament_combat_chainsaw.desc=Egal, wie unpraktisch eine Waffe im Kampf sein mag, irgendjemand wird trotzdem versuchen, sie irgendwann zu benutzen, weil sie einfach cool aussieht. Und Ash Arms macht deswegen ordentlich Kohle mit seiner Kampfkettensäge. Die Kampfkettensäge unterschiedet sich vom gewöhnlichen Werkzeug durch zwei wichtige Dinge: Erstens sind einige wichtige Komponenten verstärkt worden, um stärkeren Beanspruchungen zu widerstehen. Zweitens haben Kampfkettensägen einen zusätzlichen Schutz durch Nahkampfverstärkung, die es erlaubt, einen Gegner damit zu schlagen, wenn die Säge nicht zum Einsatz kommen kann oder soll. Die Kampfkettensäge ist zwar in den meisten Kampfsituationen abseits von Prügeleien in Gassen etwas unpraktisch, aber sie hat einen gewissen Einschüchterungseffekt, der mehrere Vorzüge bietet.\nAsh bietet zwei Varianten dieser Waffe an: eine Standard- und eine Monofilament-Version, die vermeintlich höheres Schadenspotenzial bietet. Aber meistens ist sie für den Benutzer gefährlicher als für sein Ziel.
item.bates_brown_combat_boots.desc=Natürlich kann man nach jahrelangem Training ein Brett oder eine Person mit dem Fuß durchtreten, ohne sich zu verletzen. Aber mit diesen Stiefeln hier braucht ihr das ganze Training nicht, und eure Füße sind trotzdem geschützt. Rundum verstärkt, um Türen und Gesichter einzutreten. Diese Stiefel sind ein Muss für Kampfbewusste.
item.manriki_chain.desc=Die Manriki-Kette ist auch als kusari-fundo oder manrikigusari (Kette der zehntausend Kräfte) bekannt. Sie ist eine Nahkampfwaffe aus dem feudalen Japan, wo sie als \u201Enicht blutvergießende Waffe\u201C benutzt wurde. Die genauen Abmessungen sind unterschiedlich, aber eine Manriki-Kette besteht immer aus kusari (Kette) und fundo (Gewichten an beiden Enden). Die Gesamtlänge der Manriki-Kette variiert zwischen 30 und 120 Zentimetern (wobei es auch noch längere gibt), und das fundo wiegt meistens zwischen 60 und 120 Gramm. Im Kampf kann die Manriki-Kette benutzt werden, um einen Gegner mit den fundo-Enden zu schlagen, oder um seine Gliedmaßen mit dem kusari zu fesseln. Außerdem ist diese Waffe auch beliebt zum Entwaffnen von Gegnern. Sie ist allerdings ohne ausgedehntes Training nicht leicht zu führen.
item.tonfa.desc=Einfache Designs sind einfach unschlagGecjbar. Uralte Weisheit trifft auf moderne Materialien, was zu einfachen, anachronistischen Arschtritten führt. Diese gewinkelten Stöcke, aus denen nach etwa zwei Dritteln der Gesamtlänge ein Griff herausragt, können in den Händen eines ausgebildeten Kämpfers gedreht, geschwungen, gestoßen, zum Blocken benutzt, eingehakt und für zahllose andere Techniken verwendet werden.
item.urban_tribe_tomahawk_mkII.desc=Alte Stammeswaffen treffen auf moderne Materialien mit einem Touch Pseudo-Retro-Look, was zu einem \u201Ealtmodischen\u201C Modell führt, das aussieht, als käme es direkt aus der Geschichte der Algonkin. Die Designer nahmen Gewicht vom Griff weg und machten den Kopf mit einem Osmiumkern schwerer. Die Waffe lässt sich schnell schwingen, schlägt hart zu, ist aber leicht genug für schnelle Drehungen und Manöver, wenn man sich an den Schwerpunkt gewöhnt hat.
item.xiphos_tactical_gladius.desc=Katanas sind so klischeehaft. Ganz zu schweigen von sperrig. Der anspruchsvolle Gladiator zieht es vor, den Xiphos unter dem Trenchcoat kampfbereit mitzuführen. Diese für Angriff und Verteidigung gedachte Waffe ist dick, aber leicht und messerscharf \u2013 ein gutes Werkzeug für Leute, denen es mehr ums Töten als ums Angeben geht.
item.bearded_axe.desc=In den späten 2060ern arbeitete Zoé mit einigen Zulieferern zusammen, um eine Reihe maßgeschneiderter historisch akkurater Kleidungsstücke herzustellen. Diese Kollektion war unglaublich erfolgreich, und Zoé erhielt zahlreiche Anfragen nach Accessoires. Nachdem die Kollektion ein Jahrzehnt lang gelaufen war, beschloss die Firma, sie auslaufen zu lassen, um mehr Nachfrage zu schaffen. Jetzt ist Zoé zurück und bringt den Leuten, was sie immer haben wollten: Waffen, die zu der jeweiligen Kleidung passen.\nZoé hat umsichtig eine Auswahl klassischer Waffendesigns geschaffen, die aus einer großen Vielfalt an Kulturen stammen und die man für weltweit gefragt hält. Alle Waffen sind genau auf die Maße des jeweiligen Käufers abgestimmt.
item.claymore.desc=In den späten 2060ern arbeitete Zoé mit einigen Zulieferern zusammen, um eine Reihe maßgeschneiderter historisch akkurater Kleidungsstücke herzustellen. Diese Kollektion war unglaublich erfolgreich, und Zoé erhielt zahlreiche Anfragen nach Accessoires. Nachdem die Kollektion ein Jahrzehnt lang gelaufen war, beschloss die Firma, sie auslaufen zu lassen, um mehr Nachfrage zu schaffen. Jetzt ist Zoé zurück und bringt den Leuten, was sie immer haben wollten: Waffen, die zu der jeweiligen Kleidung passen.\nZoé hat umsichtig eine Auswahl klassischer Waffendesigns geschaffen, die aus einer großen Vielfalt an Kulturen stammen und die man für weltweit gefragt hält. Alle Waffen sind genau auf die Maße des jeweiligen Käufers abgestimmt.
