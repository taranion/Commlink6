item.mems_basic_harness.desc=MAMS ist kein Panzerungssystem an sich, sondern umfasst ein Basis-Tragesystem und eine Reihe optionaler Zusatzhalterungen, die mit schwereren Panzerungen (ab Sicherheitspanzerungen aufwärts) kombiniert werden können. Allgemein gesprochen dient MAMS dazu, Ausrüstung an der Außenseite eines Panzerungssystems transportieren und befestigen zu können, ohne die Panzerung dafür eigens modifizieren zu müssen. Mithilfe des MAMS kann der Benutzer Waffenholster, Magazintaschen und verschiedene Ausrüstungstaschen an beliebigen Stellen anbringen, je nach seinen spezifischen Bedürfnissen und persönlichen Präferenzen. Dadurch wird ein leichterer Zugriff auf die Ausrüstung und damit auch deren vereinfachter Einsatz ermöglicht. In Kämpfen, in denen schon Millisekunden den Unterschied zwischen Leben und Tod ausmachen, ist das ein nicht zu verachtender Vorteil.\nZu den MAMS-Erweiterungen zählen: Standard- und Schnellziehholster (für Waffen bis zur Größe schwerer Pistolen), Magazintaschen, individuelle Schlaufenholster für Schrotflinten-Patronen, Medkit-Taschen, Halterungen für taktische Tragegurte und Ausrüstungstaschen.
item.mystic_weave.desc=Die entscheidende Komponente für Parashields Mystic-Tough-Panzerung. Mystic Weave kann in bestehende Panzerungen eingearbeitet werden, um ein wenig Schutz gegen feindliches Mojo zu liefern.\nMystic Weave erzeugt für alle auf den Träger gewirkten Mana-Zauber und -Critterkräfte (also solche mit Art: M) einen Schwellenwert in Höhe seiner Stufe. Das heißt, nur wenn die Erfolge bei der Spruchzaubereiprobe diesen Schwellenwert erreichen oder übertreffen, dringen sie überhaupt bis zum Träger durch.\nDanach widersteht der Träger wie gewohnt (gegen die volle Anzahl an Erfolgen des Zaubers). Wer eine so modifizierte Panzerung trägt, erhält im Gegenzug allerdings auch einen Würfelpoolmalus in Höhe der doppelten Stufe für alle Proben, bei denen Magie ein Teil des Würfelpools ist.
item.programmable_camouflage.desc=Programmierbare Tarnmuster sind eine einfache und kostengünstige Modifikation, die bei den meisten Kampfanzügen, Panzerkleidung und leichteren Panzerungen gebräuchlich ist. Es mag sich nicht um die effizienteste aller Tarnungsmöglichkeiten handeln, aber sie hilft dem Anwender dabei, besser mit seiner Umgebung zu verschmelzen. Ein einzelnes programmierbares Tarnungspaket ist mit dem Kommlink des Anwenders verbunden und kann bis zu drei unterschiedliche Muster/Stile speichern. Bei diesen Mustern/Stilen kann es natürlich große Variationen geben, aber die gebräuchlichsten basieren auf Umgebungen wie Wald, Dschungel, Wüste, Arktis oder Stadt. Es können auch benutzerdefinierte Muster hochgeladen werden.\nAn die entsprechende Umgebung angepasste Tarnmuster verleihen dem Träger einen Würfelpoolbonus von +1 auf Heimlichkeitsproben, wenn das passende Muster geladen ist. Ist das Tarnmuster unpassend, erhält der Träger stattdessen einen Würfelpoolmalus von -1 auf Heimlichkeitsproben. Ist die programmierbare Tarnung deaktiviert, hat sie selbst keine Auswirkungen (von sich aus auffällige Kleidung ist natürlich immer noch auffällig).
item.gel_weave.desc=GelWeave hingegen ist ein spezielles Material, das zur Herstellung von verschiedenen Arten von Panzerungen genutzt wird und die Einschlagsenergie mithilfe eines hyperreaktiven Gels auf die gesamte Panzerungsfläche verteilt.\n\nEine mit GelWeave ausgestattete Panzerung kann bei jedem Angriff Schaden bis zur Höhe der GelWeave-Stufe widerstehen. Allerdings verfestigt sich das Gel, wenn es mehr als einen schwachen Treffer (mehr als Schadenswert 1 vor Ablegen der Schadenswiderstandsprobe) pro Runde abfängt, was Geschicklichkeit, Reaktion und Bewegungsrate für 3 Kampfrunden um [Schadenswert \u2013 1] senkt. Diese Abzüge sind kumulativ und halten alle jeweils drei Runden nach dem letzten Treffer an. Das heißt, wenn GelWeave der Stufe 2 in der ersten Kampfrunde einen Schaden von 2 absorbiert (was obige Werte für 3 Kampfrunden um 1 senkt) und in der zweiten Kampfrunde noch einmal einen Schaden von 2 absorbiert, erleidet der Charakter ab dann für 3 Kampfrunden eine Senkung von 2 auf die oben genannten Werte. Wenn Reaktion oder Geschicklichkeit auf 0 sinken, erhält der Träger den Status Bewegungsunfähig.
item.reactive_armor_plates.desc=Moderne Traumaplatten sind in der Regel hochwertige reaktive Panzerplatten, die im Fall eines schweren und normalerweise tödlichen Körpertreffers Leben retten sollen. Sie werden in speziellen Stofftaschen mit eingebauten Magneten gelagert, sodass sie mit praktisch jeder Körperpanzerung kombiniert oder sogar an Alltagskleidung angebracht werden können.\n\nReaktive Panzerplatten können nur einmalig Schaden abfangen. Danach ist die Platte zerstört und muss ausgetauscht werden. Das Herausnehmen der zerstörten Platte erfordert eine Haupthandlung, das Hineinstecken einer neuen Platte eine weitere Haupthandlung.\nEine Panzerung kann mit mehreren Platten in verschiedenen Stufen ausgestattet werden, was allerdings durch die Kapazität der Panzerung begrenzt ist. Der Spieler kann entscheiden, welche Platte einen eingehenden Angriff abfängt. Gegen einen Schaden kann immer nur eine einzelne Platte verwendet werden (es ist nicht möglich, mehrere Platten zu kombinieren).\nReaktive Panzerplatten wiegen pro Stück etwa 1,5 Kilogramm. Sie sind ziemlich offensichtlich, könnten aber vielleicht unter einem langen Mantel verborgen werden.
item.ruthenium_armor.desc=Das Ruthenium-Tarnsystem (RTS) gilt weithin als Gipfel der taktischen Tarntechnologie und ist eine umfassende, hochwertige Panzerungsmodifikation, durch die eine Panzerung schwerer sichtbar wird. Frühere Versionen der Technologie hatten gewisse Probleme, sobald der Träger sich bewegte, sodass man komplett still verharren musste, wenn man das System effizient nutzen wollte. Obwohl dieser Nachteil durch die derzeitige Technologie (überwiegend) beseitigt wurde, muss der Anwender immer noch komplett mit rutheniumbeschichteter Panzerung bedeckt sein und sich extrem langsam bewegen, damit das System vernünftig funktioniert. Und da das RTS extrem effektiv ist, gilt es als Militärtechnologie und ist daher extrem streng reguliert; schon der Besitz ohne entsprechende Lizenzen gilt in den meisten Ländern als Kapitalverbrechen. Das System enthält ab Werk eine Kopfbedeckung, die keinen Panzerungsbonus verleiht. Auch ein gemeinsam mit dem System erworbener Helm (zum Grundpreis für Helme von 200 Nuyen mit den Werten aus SR6, S. 267) kann in das Gesamtsystem integriert werden.\nDas System verleiht dem Träger 1 Edge beim Ablegen von Heimlichkeitsproben und erzeugt einen Würfelpoolmalus in Höhe seiner Stufe für Wahrnehmungsproben der Gegenseite, um den Träger zu entdecken. Bewegt sich der Träger sich in einer Kampfrunde weiter als 3 Meter, sinkt dieser Würfelpoolmalus für jeden zusätzlichen Meter um 1. Während des Kampfes erhöht das System den Verteidigungswert des Trägers aufgrund der sich ständig ändernden Muster um 2.\nPanzerungen, die schon von Haus aus mit einer auf Ruthenium basierenden Beschichtung versehen sind (z.B. Chamäleonanzüge), sind nicht mit dem Ruthenium-Tarnsystem kompatibel.
item.gear_access.desc=Diese Modifikation erleichtert dem Träger einer Panzerung den Zugriff auf innerhalb oder an seiner Panzerung verstaute Ausrüstung wie beispielsweise Waffen oder Munition. Schnellzugriff bezeichnet keine spezifische Modifikation, sondern mehrere mögliche Anpassungen wie Munitionstaschen, die sich leicht öffnen lassen, größere Öffnungen für Taschen, durch die deren Inhalt leichter zu greifen ist, oder Methoden, um sicherzustellen, dass Ausrüstung trotz starker Beanspruchung immer genau am beabsichtigten Platz bleibt.\nWenn Ausrüstung verwendet wird, die an einer Panzerung mit Schnellzugriff befestigt ist, gelten die Handlungen Gegenstand aufheben/ablegen und Waffe nachladen als Nebenhandlungen.
item.shockweave.desc=Diese Modifikation kann für Leute, die unerlaubt auf Tuchfühlung gehen, in einer ziemlich unangenehmen Überraschung enden. Die Panzerung ist von speziellen, leitfähigen Fasern durchzogen, die mit einer Hochleistungsbatterie verbunden sind. Wenn das unliebsame Subjekt eine gewisse Mindestkraft auf die Panzerung ausübt (d. h. im Nahkampf vor Ablegen der Schadenswiderstandsprobe mindestens einen Schadenswert von 2 verursachen würde), wird ihm ein elektrischer Schock mit einem Schadenswert von (Stufe)B(e) versetzt. Die Batterie kann 4 Schockentladungen abgeben, bevor sie neu aufgeladen werden muss.
item.thermal_dissipation.desc=Eine Kombination aus Spezialfasern und neuartigen, atmungsaktiven Materialien erlaubt es dem Nutzer, den Auswirkungen von Hitze in heißen und/oder feuchten Klimazonen wie Wüsten- und Dschungelgebieten zu trotzen. Gegen Feuerschaden hilft es zwar nicht, aber auf längeren Feldeinsätzen ist es trotzdem sehr praktisch.\nJede Stufe Wärmeableitung negiert eine Stufe des Status Erschöpft aufgrund von Überhitzung und verleiht dem Charakter einen Würfelpoolbonus von +1 beim Widerstand gegen Hitzeschaden.
item.toughweave.desc=Toughweave ist eine neuartige Panzerungsmodifikation, die erst seit sechs Monaten im Einsatz ist (dank YNT, einer Evo-Tochter), Berichten zufolge aber das Potenzial hat, die Panzerungstechnologie zu revolutionieren. Die genauen Spezifikationen sind noch streng geheim, aber die Modifikation wird Schritt für Schritt bei Evos KonSec-Kräften implementiert, um weitere Feldtests durchzuführen. Bisher ist über diese geheimnisumwobene Modifikation wenig bekannt. In Pressemitteilungen hat YNT immerhin preisgegeben, dass \u201Edas neuartige ToughweaveTM-Panzerungsschutzsystem nicht nur maximalen Schutz gegen sämtliche bekannten Arten von Durchdringungsschaden bietet, sondern auch den Großteil des kinetischen Schadens auf effektive Art und Weise ableitet\u201C.\nBisher hat sich YNT bei der Bereitstellung von Toughweave sehr knausrig gezeigt und bleibt derzeit lieber beim Inhouse-Einsatz. Gerüchten zufolge verbreiten sich die notwendigen Komponenten mittlerweile jedoch auch auf bestimmten Schwarzmärkten in Mittelamerika, Südamerika und Ostasien.\nToughweave hat das Merkmal Schadenssenkend in Höhe seiner Stufe. Bei nachfolgenden Schadenswiderstandsproben wird jedoch einer der Würfel (insgesamt, nicht pro Stufe) gegen einen Schicksalswürfel ausgetauscht.
item.hidden_pocket.desc=Hierbei handelt es sich um eine kleine in die Panzerung eingenähte Tasche, die außergewöhnlich gut verborgen ist. Natürlich sind den Künsten eines Schneiders gewisse Grenzen gesetzt, aber trotzdem stellen diese kleinen Taschen eine großartige Möglichkeit dar, wertvolle Gegenstände wie Credsticks oder Datenchips oder sogar eine Holdout-Pistole zu verbergen.\nDie Tarnbarkeit für Gegenstände in einer versteckten Tasche erhöht sich um 2. Einen Gegenstand aus einer versteckten Tasche zu nehmen erfordert eine Haupthandlung. Der Sinn dieser Tasche ist es, Dinge sehr gut zu verbergen, deswegen gelten für sie die Regeln für Schnellzugriff nicht, selbst wenn die entsprechende Panzerung dieses Merkmal hat.
item.drag_handle.desc=Diese ebenso preiswerte wie effektive Erweiterung erleichtert es, Chummer oder andere Geschäftspartner aus gefährlichen Situationen wie beispielsweise Schießereien herauszuziehen. Typischerweise wird ein Zuggriff an der Rückseite eines Panzerungssystems angebracht, direkt unterhalb des Nackens und zwischen den Schultern. Es gibt allerdings auch Griffe, die sich an der Vorderseite unterhalb des Halsausschnitts befinden und es erleichtern, Personen aus Fahrzeugen zu ziehen.\nDer Zuggriff gewährt 1 Edge für eventuell nötige Proben auf Heben/Tragen (SR6, S. 37), mit denen eine andere Person in einer gefährlichen Situation gezogen werden soll.
item.holster.desc=keine extra Beschreibung

item.wss_ap_spikes.desc=Wenn das biometrische Profil eines Benutzers nicht mit den im Schloss gespeicherten übereinstimmt, oder wenn das System über ein Smartgunsystem oder ein Kommlink aktiviert wird, löst es die Gegenmaßnahme aus. Diese Gegenmaßnahmen gibt es in drei unterschiedlich fiesen Varianten: als federgespannte Dorne, als Elektroschock und als Sprengstoff.
item.wss_taser_shock.desc=Wenn das biometrische Profil eines Benutzers nicht mit den im Schloss gespeicherten übereinstimmt, oder wenn das System über ein Smartgunsystem oder ein Kommlink aktiviert wird, löst es die Gegenmaßnahme aus. Diese Gegenmaßnahmen gibt es in drei unterschiedlich fiesen Varianten: als federgespannte Dorne, als Elektroschock und als Sprengstoff.
item.wss_explosive.desc=Wenn das biometrische Profil eines Benutzers nicht mit den im Schloss gespeicherten übereinstimmt, oder wenn das System über ein Smartgunsystem oder ein Kommlink aktiviert wird, löst es die Gegenmaßnahme aus. Diese Gegenmaßnahmen gibt es in drei unterschiedlich fiesen Varianten: als federgespannte Dorne, als Elektroschock und als Sprengstoff.
item.wss_rfid_tracker.desc=Zum Lokalisieren und Zurückholen der Waffe sind auch RFID-Marker verfügbar.

itemmod.accessory_rail_left.desc=Der momentane Industriestandard sieht vor, dass die meisten Feuerwaffen mindestens zwei integrale Halterungen für Waffenzubehör bieten. Diese befinden sich je nach Waffenkategorie am, auf und/oder unter dem Lauf. Viele Profis brauchen aber einfach mehr.\nZubehörhalterungen werden oft an den Seiten der Feuerwaffe angebracht und ermöglichen dem Schützen, pro Zubehörhalterung ein Zubehörteil mehr zu montieren, als bei der Waffe eigentlich möglich wäre.
itemmod.accessory_rail_right.desc=Der momentane Industriestandard sieht vor, dass die meisten Feuerwaffen mindestens zwei integrale Halterungen für Waffenzubehör bieten. Diese befinden sich je nach Waffenkategorie am, auf und/oder unter dem Lauf. Viele Profis brauchen aber einfach mehr.\nZubehörhalterungen werden oft an den Seiten der Feuerwaffe angebracht und ermöglichen dem Schützen, pro Zubehörhalterung ein Zubehörteil mehr zu montieren, als bei der Waffe eigentlich möglich wäre.
itemmod.biometric_gun_lock.desc=Auf der Liste der Dinge, auf die man während eines Schusswechsels sicher verzichten kann, gehört es sicher zu den obersten Punkten, wenn einem die Waffe weggenommen und gegen einen verwendet wird. Biometrische Waffenschlösser verhindern das (meistens), indem sie die Waffe in einen \u201ESicherheitsmodus\u201C versetzen, sodass sie nicht benutzt werden kann, wenn das jemand anderes als ein autorisierter Benutzer versucht. Solche Schlösser werden im Griff einer Waffe installiert und sind darauf programmiert, biometrische Profile auszulesen, die in ihnen angelegt werden. Stimmt das biometrische Profil des Benutzers mit dem gespeicherten überein, kann die Waffe entsichert und wie gewohnt benutzt werden, ansonsten bleibt sie gesperrt. Das Profil kann auch in einem gewöhnlichen oder Waffen-Kommlink gespeichert werden, um die Waffe per Fernbedienung zu aktivieren oder deaktivieren. Zusätzliche Profile können angelegt werden, um Verbündeten im Notfall die Benutzung der Waffe zu gestatten. Außerdem kann das biometrische Schloss mit einem Waffen-Sicherheitssystem verbunden werden, um installierte Sicherheitsmaßnahmen auszulösen.
itemmod.folding_stock.desc=Eine einfache Modifikation für MPs und Gewehre, die für einen leichteren Transport und bessere Tarnbarkeit der Waffe sorgt und beim Schießen ein bisschen Stabilität gibt. Im Gebrauch wird die Schulterstütze einfach ausgeklappt und funktioniert wie eine gewöhnliche Schulterstütze. Nachträglich angebrachte Stützen sind strukturell oft etwas schwächer und auch ein bisschen unbequem. Sie kompensieren auch nicht so viel Rückstoß, wenn die Waffe im automatischen Modus oder auf große Entfernung benutzt wird.
itemmod.collapsible_stock.desc=Klassische, einfache Vielseitigkeit. Ausfahren für große Entfernungen. Einziehen für beengte Räume. Einfach, aber voller Möglichkeiten.
itemmod.barrel_extension.desc=Ein paar Zentimeter mehr an Lauflänge machen einen Riesenunterschied, wenn du heißes Blei weit in die Landschaft spucken willst. Es hilft sogar, wenn du mit einer Waffe mit kurzer Reichweite auf mittlere Entfernung arbeiten willst. Das Problem ist, dass man die Waffe schwerer wegstecken und damit abhauen kann und du zu erkennen beginnst, dass das Blei oft seinen Weg zu dir findet, bevor du selbst schießen kannst, weil dein Lauf vor dir um die Ecke kommt.
itemmod.easy_breakdown.desc=Wenn du eine Pistole, eine MP, ein Scharfschützengewehr oder etwas anderes in seine Komponenten zerlegen kannst, ist das sehr hilfreich für eine schnelle Flucht oder das Vorbeischmuggeln an der Sicherheit. Die meisten Sicherheitsleute sind darin geschult, Waffenteile zu erkennen, aber es ist besser als nichts.\nGrößere Waffen können gegen einen kleinen Aufpreis (250 Nuyen) in einem Koffer aufbewahrt werden, bei kleineren findet man oft etwas, um sie zu verbergen.
itemmod.custom_style.desc=Wir alle wissen, dass die meisten Waffen von Natur aus bedrohlich wirken, aber mit ein paar Veränderungen und den richtigen Farben und Akzenten kann ein Werkzeug des Todes zum Kunstwerk werden \u2013 und doch tödlich bleiben. Die Richtung und Absicht dieses künstlerischen Flairs kann das Gegenüber in sozialen Situationen in eine gewisse Richtung stupsen. Welche Richtung das ist, hängt vom Wunsch des Besitzers ab. Ein Goldüberzug zeigt deine angeberische Seite, mattschwarz mit roten Akzenten schüchtert ein, eine Waffe mit filigranen Intarsien zeigt anderen deine tödliche Eleganz, und ein patriotisches Jadegrün und Weiß zeigt deinen Status innerhalb von MCT.
itemmod.dikote.desc=Mit diesem Prozess überzieht man in einem Plasmaofen eine scharfe Oberfläche mit einer dünnen Diamantschicht und sorgt so bei Klingen, Pfeil- oder Bolzenspitzen für mehr Schärfe und höhere Schnitthaltigkeit.
itemmod.foregrip.desc=Das Anbringen eines Griffs am Lauf hat unglaublichen Einfluss auf viele Aspekte der modernen Kriegsführung. Die Waffe lässt sich schneller ausrichten, bleibt besser im Griff und unter Kontrolle, und der Rückstoß lässt sich leichter bändigen. Eine einfache Modifikation mit sehr vielen Unterstützungsfunktionen.
itemmod.gas-vent_improved.desc=Der Traum eines jeden Straßensamurais! Packt das in eine MP, und ihr schießt wie auf Wolken. Der Lauf steigt nicht mehr, und mit diesen Systemen könnt ihr wirklich schießen, bis das Rohr glüht!
itemmod.gecko_grip.desc=Seit Jahrzehnten bewährt sich dieses Material beim Klettern und dabei, Zeug wirklich gut an anderem Zeug zu befestigen. Wenn man eine Schicht davon auf den Griff einer Waffe packt, damit sie sicher in der Hand bleibt, ist das genial. Der Geckogriff hilft nicht nur beim Festhalten. Er kann auch so programmiert werden, dass die Waffe an einer Oberfläche oder einer Person haften bleibt.
itemmod.heavy_weight.desc=Das Schöne an einer etwas fülligeren Waffe ist, dass sie nie weit vom Ziel abweicht, wenn man den Abzug betätigt. Außerdem bekommt man wirklich dicke Arme, wenn man den ganzen Tag damit schießt. Andererseits muss man nie so lange schießen, wenn man weiß, was man tut.
itemmod.light_weight.desc=Auch wenn du nur ein paar Unzen von deiner Lieblingswaffe loswirst, kannst du einen vorübergehenden  Vorsprung bekommen, der dich Blei spucken statt Blei schlucken lässt. Vielleicht musst du dafür mit monströsem Rückstoß büßen, weil die Waffe bockt wie eine Ziege, aber in den Schatten geht es immer um Entscheidungen.
itemmod.melee_hardening.desc=Manchmal gehen einem im Kampf die Optionen aus, und man hat keine andere Wahl, als den Gegner mit seiner Feuerwaffe zu verprügeln. Und die meisten modernen Feuerwaffen sind nicht wirklich für diese Art von Beanspruchung gemacht; ihre interne Elektronik kann beschädigt werden, und manchmal zerstört man damit sogar die Waffe selbst. Oder man will vielleicht einfach eine Waffe haben, die als Knüppel dienen kann. Jedenfalls sollte man die Waffe dann mit einer Nahkampfverstärkung modifizieren. Mithilfe eines Verbesserungsprozesses namens Chemo-ForgeTM werden die Außenseiten und das Innenleben einer Waffe verstärkt, was ihre strukturelle Stärke um etwa 150 Prozent erhöht. Das Verfahren funktioniert wie versprochen, aber es gibt einen Haken: Das Material durchzieht die Waffe. Die Hersteller behaupten zwar, es gäbe keine Nebenwirkungen im Hinblick auf Wartung oder Leistung, aber es gibt einige Einsatzberichte darüber, dass sich die Waffen nach der Nahkampfverstärkung ein wenig \u201Eklebrig\u201C anfühlen.
itemmod.metahuman_adaption.desc=Das sind einfache, aber notwendige Modifikationen für Trolle, Zwerge und andere Metatypen, die in einer Welt leben, die für Menschen gebaut ist. Schwerpunkt, Grifflänge und -dicke und manchmal sogar die Gesamtlänge der Waffe werden an eure persönliche Größe angepasst.
itemmod.nanoconstruction.desc=Jetzt, wo die meisten der verdammten Monaden zu ihrem großen Weltraumabenteuer aufgebrochen sind, können wir endlich wieder zum regulären Programm zurückkehren, mit Nanoschmieden Sachen zu bauen. Die höhere Geschwindigkeit und Effizienz der Konstruktion gibt jedem Gegenstand mit nanokonstruierten Bauteilen einen winzigen Vorteil gegenüber Standardware.
itemmod.no_stock.desc=Wenn man die Schulterstütze einer Schrotflinte oder eines Sturmgewehrs absägt, kann man diese Waffe leichter tarnen und ist auf beengtem Raum effizienter. Man verliert auf größere Entfernung etwas Präzision, aber mit Jagd- oder Scharfschützengewehren macht man das auch nicht.
itemmod.personalized_grip_ranged.desc=Das Anpassen einer Waffe an die eigenen Bedürfnisse ist das eine, aber ein angepasster Griff führt diese Idee noch einen Schritt weiter. Angepasste Griffe sind für Nahkampfwaffen und Feuerwaffen zu haben und sind genau auf die Hand eines bestimmten Benutzers ausgelegt, was die Waffe für ihn effektiver macht. Der Nachteil ist, dass eine Waffe mit angepasstem Griff für alle anderen schwieriger zu benutzen ist.
itemmod.personalized_grip_melee.desc=Das Anpassen einer Waffe an die eigenen Bedürfnisse ist das eine, aber ein angepasster Griff führt diese Idee noch einen Schritt weiter. Angepasste Griffe sind für Nahkampfwaffen und Feuerwaffen zu haben und sind genau auf die Hand eines bestimmten Benutzers ausgelegt, was die Waffe für ihn effektiver macht. Der Nachteil ist, dass eine Waffe mit angepasstem Griff für alle anderen schwieriger zu benutzen ist.
itemmod.rigid_stock.desc=Eine stabile Masse am hinteren Ende einer stabilen Waffe kann den entscheidenden Unterschied für einen guten Schuss bedeuten. Die Schulterstütze fühlt sich stark und fest an, wenn sie eng herangezogen wird, und sie gleitet auch bequemer unter die Achsel als diese dünnen Plastik- oder Polycarbonat-Teile.\nAuch wenn ihr meint, dass hübsches Walnussholz das Beste ist, ist eine echte feste Schulterstütze doch etwas ganz anderes.
itemmod.safe_firing_iff_system.desc=Kampf ist chaotisch. Und durch das Aufkommen moderner Technik und magischer Effekte auf dem Schlachtfeld wurde das nur noch schlimmer. Im Zentrum dieses ganzen Chaos gibt es dann Verluste durch Eigenbeschuss. Um das zu verhindern, wurde das Freund-/Feind-Erkennungssystem entwickelt. Es ist darauf ausgelegt, mit Smartgunsystemen, Kommlinks und anderen Sensorplattformen zusammenzuarbeiten, und setzt auf eine Kombination eingebauter, mehrfacher, redundanter Erkennungs- und Identifikationsmethoden (darunter RFID-Marker, biometrische  Merkmale, Körper- und Gesichtserkennung), um Verbündete im Kampf zu erkennen. Wenn es aktiviert ist, nutzt das System diese Methoden, um ein \u201EID-Profil\u201C anzulegen, das dabei hilft, eine Waffe daran zu hindern, auf jemanden zu schießen, der als Verbündeter identifiziert wurde.
itemmod.short_barrel.desc=Wenn man den Lauf verkürzt, verliert man ein bisschen Reichweite, kommt mit dem Ding aber viel leichter um Ecken. Ganz zu schweigen davon, dass man die Waffe leichter unter den Mantel kriegt. Diese Modifikation funktioniert am besten mit Schrotflinten und Sturmgewehren, aber man kann natürlich auch den Lauf einer Sturmkanone absägen, wenn man das will.
itemmod.revolution_arms_collapsible_stock.desc=Das ist nicht die einziehbare Schulterstütze deines Großvaters! WiFi-Technik und spezielle Pneumatik erlauben unendliche Anpassungsmöglichkeiten zusammen mit Rückstoßkompensation. Von voll ausgefahren bis komplett eingezogen rEVOlutionieren die Genies bei Evo die Kriegstechnik.
itemmod.side_ammo_mount.desc=Man kann es nicht oft genug sagen: Man kann in einem längeren Kampf gar nicht genug Munition haben. Es kann aber auch sein, dass es nicht auf die Menge, sondern auf die Art der Munition ankommt. Es kommt oft vor, dass irgendein Scheißer eine besondere Panzerung hat, die einen schnellen Munitionswechsel nötig macht. Oder die Missionsparameter können sich ändern, sodass man von nichttödlicher zu tödlicher Munition wechseln muss oder umgekehrt.\nSeitliche Munitionshalterungen erlauben dem Schützen, zusätzliche Magazine oder Patronen mitzuführen, die schnell eingesetzt werden können, ohne dass man in eine Munitionstasche greifen muss. Die Halterung wird meistens an der Seite der Waffe gegenüber dem Auswurfschacht angebracht. Munitionshalterungen sind praktisch, um ein Magazin oder ein paar Patronen extra dabeizuhaben, machen die Waffe aber klobiger und schwerer zu tarnen.
itemmod.stock.desc=Es scheint vielleicht offensichtlich, aber manchmal kann eine so einfache Modifikation wie eine Schulterstütze einer Waffe Stabilität verleihen. Das ist nichts Spezielleres als ein Stück aus gewöhnlichem Verbundstoff (oder Holz, wenn man reich ist), das am hinteren Ende der Waffe angebracht wird. Man kann sogar Pistolen damit ausrüsten, aber man bekommt damit nicht viel Reichweite raus.
itemmod.trigger_removal.desc=Eine populäre Waffenmodifikation für Schützen, die (aus irgendeinem Grund) Schwierigkeiten haben, einen gewöhnlichen Abzug zu benutzen. Sie ersetzt die normalen Mechanismen durch einen ferngesteuerten Abzug. Dieser Abzug ist direkt mit einem Smartgunsystem verbunden und ermöglicht dem Benutzer, die Waffe mit mentalen oder programmierten verbalen oder Geräusch-Kommandos abzufeuern oder anders zu benutzen. Der Hauptnachteil dieser Modifikation ist, dass dem Schützen nur ein Brocken aus Metall und Plastik übrig bleibt, wenn die WiFi-Verbindung abreißt.
itemmod.underbarrel_weapon_mount_attach.desc=Im Kampf braucht man jeden Vorteil, den man kriegen kann, und manchmal heißt das, dass man noch mehr Durchschlagskraft braucht. Unterlaufwaffen wurden in den späten 1960ern bekannt, als man begann, Granatwerfer unter den Läufen von Waffen anzubringen, die wir heute als Sturmgewehre bezeichnen würden. Und es dauerte nicht lange, bis auch andere Waffen so befestigt wurden. Die Unterlaufhalterung erlaubt das Anbringen und Integrieren einiger speziell dafür entworfener Waffenarten (die jeweils separat verkauft werden). Das erlaubt einige interessante Kombinationen, aber das Anbringen einer Unterlaufwaffe, für die eine Waffe nicht ab Werk ausgelegt ist, macht die Waffe extrem sperrig und praktisch unmöglich zu verstecken.\nDie im Moment beliebten Unterlaufwaffen sind: eine kleine Schrotflinte, ein Mini-Granatwerfer, eine Kettensäge, ein Bolawerfer und eine Enterhakenkanone.
itemmod.underbarrel_weight.desc=Du kannst deine Straßenhaubitze so verändern, dass sie ihr Verlangen danach ignoriert, nach jedem Schuss nach oben zu wandern, indem du den Lauf einfach zu schwer dafür machst. Hervorragend dazu geeignet, bei Pistolen dicke Unterarme und bei anderen Waffen starke Schultern zu kriegen, aber es wird auch viel leichter, in schneller Folge Blei zu spucken, wenn der Lauf nicht immer vom Ziel wegbockt.
itemmod.weapon_security_system.desc=Es gibt am oder neben dem Schlachtfeld viele Gelegenheiten, bei denen dir jemand die Waffe wegnehmen will. Vielleicht hat er einen coolen Kampfkunsttrick abgezogen oder dich mit einem Glückstreffer entwaffnet. Oder er hat sie aus deinem Waffenschrank geklaut. Oder er nimmt sie deiner Leiche weg. Um zu verhindern, dass die Waffe gegen dich eingesetzt wird (oder als letztes \u201ELeck mich\u201C, wenn sie dich umgelegt haben), kannst du ein Waffen-Sicherheitssystem installieren. Dieses System hat drei Komponenten: ein einfaches Erkennungssystem, ein biometrisches Schloss und die Anti-Diebstahl-Maßnahme. Wenn das biometrische Profil eines Benutzers nicht mit den im Schloss gespeicherten übereinstimmt, oder wenn das System über ein Smartgunsystem oder ein Kommlink aktiviert wird, löst es die Gegenmaßnahme aus. Diese Gegenmaßnahmen gibt es in drei unterschiedlich fiesen Varianten: als federgespannte Dorne, als Elektroschock und als Sprengstoff. Zum Lokalisieren und Zurückholen der Waffe sind auch RFID-Marker verfügbar.
itemmod.weapon_commlink.desc=Aber mit der zunehmenden Bedrohung durch moderne elektronische und Cyber-Kriegsführung bekamen Waffenkommlinks einen neuen Daseinszweck. 2078 begann Renraku (bald gefolgt von anderen Kons und Firmen) mit der Produktion seiner Version eines Waffenkommlinks, das als interne Kommunikationslösung gedacht war und als zusätzliche Verteidigungslinie gegen elektronische Angriffe dienen sollte. Ein Waffenkommlink ist im Wesentlichen ein winziger Router, der das PAN des Benutzers steuert und kontrolliert. Es sammelt und verteilt alle Daten von sendenden Waffen und Ausrüstungsgegenständen und verschlüsselt sie, um sie schwerer zu hacken zu machen. Außerdem bietet es eine Firewall, die kumulativ mit der anderer verbundener Geräte, PANs oder taktischer Netzwerke wirkt. Und weil die Daten über das Kommlink verteilt werden, erleidet das Waffenkommlink Schaden, bevor die Waffe selbst Schaden nimmt, was es zu einer Art Unterbrecher für Cyber-Kriegsführung macht. Der Großteil der Elektronik wird zwar immer noch getroffen, aber die Waffe schießt wenigstens noch, wenn man den Abzug betätigt.\nDer große Nachteil eines Waffenkommlinks liegt in den Gesamtkosten und darin, wie viel interne Kapazität es verbraucht.
item.weapon_commlink.desc=Aber mit der zunehmenden Bedrohung durch moderne elektronische und Cyber-Kriegsführung bekamen Waffenkommlinks einen neuen Daseinszweck. 2078 begann Renraku (bald gefolgt von anderen Kons und Firmen) mit der Produktion seiner Version eines Waffenkommlinks, das als interne Kommunikationslösung gedacht war und als zusätzliche Verteidigungslinie gegen elektronische Angriffe dienen sollte. Ein Waffenkommlink ist im Wesentlichen ein winziger Router, der das PAN des Benutzers steuert und kontrolliert. Es sammelt und verteilt alle Daten von sendenden Waffen und Ausrüstungsgegenständen und verschlüsselt sie, um sie schwerer zu hacken zu machen. Außerdem bietet es eine Firewall, die kumulativ mit der anderer verbundener Geräte, PANs oder taktischer Netzwerke wirkt. Und weil die Daten über das Kommlink verteilt werden, erleidet das Waffenkommlink Schaden, bevor die Waffe selbst Schaden nimmt, was es zu einer Art Unterbrecher für Cyber-Kriegsführung macht. Der Großteil der Elektronik wird zwar immer noch getroffen, aber die Waffe schießt wenigstens noch, wenn man den Abzug betätigt.\nDer große Nachteil eines Waffenkommlinks liegt in den Gesamtkosten und darin, wie viel interne Kapazität es verbraucht.
itemmod.glowcoat.desc=Diese Modifikation ist eine einfache Schicht elektrolumineszenter Farbe mit einer kleinen Stromquelle, die deine Waffe zur Taschenlampe macht. Warum nicht gleich eine Taschenlampe? Wenn du mit beiden Händen eine Kampfaxt schwingst, hast du keine Hand für eine Taschenlampe frei.
itemmod.flashing_blade.desc=Die Klinge trägt die Miniaturversion eines Flash-Packs in einer Seite, womit der Benutzer einen Gegner vorübergehend blenden kann.
itemmod.spikes.desc=Stacheln können einfach Nägel sein, die in einen Baseballschläger gehämmert werden, oder individuell angefertigte und geschweißte Sonderanfertigungen \u2013 jedenfalls geben sie allen Arten von Knüppeln einen tödlichen Biss.
itemmod.spikes_retractable.desc=Das gleiche Konzept wie bei gewöhnlichen Stacheln, aber einziehbar, sodass die Waffe weniger tödlich aussieht, wenn man das will; und man kann zwischen den Schadensarten umschalten, die man verursachen will.
itemmod.zapper_coating.desc=Der Knüppel hat eine spezielle, besonders leitfähige Beschichtung, und in einem isolierten Griff befindet sich eine Ladeeinheit. Ein Treffer mit dieser Waffe zieht dem Gegner nicht nur einen über, sondern brutzelt ihn auch ordentlich durch.
itemmod.smart_materials_melee.desc=Sogar eine kleine Veränderung der Länge oder die Verstärkung einer Spitze kann im Kampf einen gewaltigen Unterschied machen. Die Veränderung der Karbonstruktur durch einen kleinen elektrischen Schubs und ein paar Voreinstellungen verschaffen einem den Vorteil, den man braucht. Und mit Konnektivität hat man noch viel mehr Optionen.
itemmod.dynamic_tension_system.desc=Die meisten Bogenschützen finden dieses System nicht besonders nützlich, aber es ist großartig für Erwachte Bogenschützen, die ihre Stärke durch Magie erhöhen können. Das System passt die Starrheit der Smart-Materialien des Bogens automatisch an, wodurch die Zugstärke erhöht wird. Das erlaubt Erwachten Bogenschützen, ihre magisch erhöhte Stärke voll einzusetzen, ohne sich selbst zu behindern, wenn das gerade nicht der Fall ist.
item.ares_gunfighter_scabbard.desc=Dieses Gewehrholster ist seit fast zwei Jahrzehnten bei den Ares Corporate Military Forces (ACMF) im Einsatz. Ursprünglich stand es nur den Firewatch-Teams zur Verfügung, danach den ACMF und ausgewählten Kunden, aber in den letzten paar Monaten kam das Gunfighter in begrenzter Stückzahl auf den freien Markt. Das Gunfighter ist als Gewehrholster für größere Feuerwaffen wie Schrotflinten oder Sturmgewehre gedacht (funktioniert aber auch für größere Klingenwaffen), wird meist auf dem Rücken getragen und soll dem Benutzer zusätzlichen Platz und leichtere Zugänglichkeit im Feld bieten. Das Gunfighter erreicht dies durch den Einsatz von Memory-Materialien, die mit \u201EWaffen-Formen\u201C programmiert sind, die eine bestimmte Waffe (zum Großteil) umschließen und sichern. Frühere Modelle konnten nur auf eine einzige Waffe programmiert werden, aber die neueren können auf bis zu drei unterschiedliche Formen programmiert werden. Das Gewehrholster verwendet einen RFID-Annäherungs-Sensor, der auf die jeweilige Waffe geklebt wird, und altmodische Druck- und Hebelsensoren, um zu erkennen, wann eine Waffe freigegeben oder gesichert werden muss.\nDieses System muss WiFi aktiviert haben, um richtig zu funktionieren. Wenn das System kompromittiert wird oder das Signal verloren geht, schaltet es auf Standby und bleibt in der Waffenform, in der es war. Für Notfälle gibt es einen manuellen Überbrückungsschalter, der eine gesicherte Waffe freigeben kann \u2013 ihr könnt die Waffe aber erst wieder verstauen, wenn die normale Funktionsfähigkeit wiederhergestellt ist.\nDer einzige echte Nachteil des Gunfighter ist, dass die Materialien mindestens zwei Sekunden brauchen, um eine Waffe freizugeben, also geht nicht davon aus, dass ihr schnellziehen könnt.
item.detachable_drum_magazine.desc=Man kann in einem Feuergefecht gar nicht zu viel Munition haben. Das abnehmbare Trommelmagazin gibt es für jede Waffe mit Stangenmagazin, außer für Holdout-Pistolen und MGs. Es bietet dem Schützen die Möglichkeit, in der Waffe selbst zusätzliche Munition mitzuführen, ohne viele zusätzliche Magazine tragen zu müssen. Größen und Formen sind sehr unterschiedlich und hängen von der Art der Waffe ab, für die die Magazine gedacht sind. Im Durchschnitt bietet ein abnehmbares Trommelmagazin die doppelte Munitionsmenge der Waffe. Diese Zusatzmenge hat aber ihren Preis. Erstens macht das Anbringen des Trommelmagazins das Verbergen der Waffe fast unmöglich. Zweitens sind auch die Trommelmagazine wegen ihrer Größe und Form schwer zu verstecken; es gibt auf dem Markt keine Munitionstaschen, die sie aufnehmen könnten. Ein Halteclip für diese Magazine ist für 25 Nuyen zu haben und kann an Gürteln, Gurten oder MAMS-Einheiten angebracht werden. Drittens sind abnehmbare Trommelmagazine bekannt dafür, dass man sie schwierig mit Munition bestücken kann; im Kampf ist das wirklich nicht zu empfehlen.
item.bayonet_standard.desc=Einige halten das Bajonett für ein archaisches Stück Militärtechnologie. Andere ziehen nie ohne eines in den Kampf. Ein Bajonett ist eine Klinge, die an einem Gewehr \u2013 meistens über oder unter dem Lauf \u2013 befestigt wird, um eingesetzt zu werden, wenn sich das Geschehen in den Nahkampf verlagert. Moderne Bajonette gibt es meistens in zwei Varianten: starr oder ausfahrbar. Ausfahrbare Bajonette sind meistens Dorne mit dreieckigem Querschnitt, die über ein Smartgunsystem gesteuert, manuell ausgefahren oder auf ein Stimmkommando programmiert werden. Starre Modelle ähneln einer traditionellen Klinge. Beide haben die Größe eines normalen Kampfmessers und sind leicht zu bekommen. Bajonette können an MPs und größeren Feuerwaffen angebracht werden.
item.bayonet_retractable.desc=Einige halten das Bajonett für ein archaisches Stück Militärtechnologie. Andere ziehen nie ohne eines in den Kampf. Ein Bajonett ist eine Klinge, die an einem Gewehr \u2013 meistens über oder unter dem Lauf \u2013 befestigt wird, um eingesetzt zu werden, wenn sich das Geschehen in den Nahkampf verlagert. Moderne Bajonette gibt es meistens in zwei Varianten: starr oder ausfahrbar. Ausfahrbare Bajonette sind meistens Dorne mit dreieckigem Querschnitt, die über ein Smartgunsystem gesteuert, manuell ausgefahren oder auf ein Stimmkommando programmiert werden. Starre Modelle ähneln einer traditionellen Klinge. Beide haben die Größe eines normalen Kampfmessers und sind leicht zu bekommen. Bajonette können an MPs und größeren Feuerwaffen angebracht werden.
item.hip_bad_bracing_system.desc=Wir kennen das aus dem Trideo: Man schießt aus der  Hüfte drauflos, aber irgendwie werden alle im Raum von diesem ungezielten Bleihagel niedergemäht. Es sei denn natürlich, es sind die Bösen, die schießen \u2013 dann wird überhaupt niemand getroffen. Wir auf der Straße kennen jedenfalls den Wert des Schießens aus der Hüfte, und wir haben auch ein gut designtes System, um es effektiver zu machen. Man verliert auf größere Entfernung zwar an Präzision, aber dafür ist das System auch nicht gedacht.
item.laser_sight_low_power.desc=Auf beengtem Raum will niemand, dass jemand auf der anderen Straßenseite durch einen herumwandernden Laserpunkt gewarnt wird. Dafür eignet sich diese Laseroption, die nur über relativ kurze Entfernung wirkt.
item.laser_sight.desc=Dieses Gerät verwendet einen Laserstrahl, um einen (mit Normalsicht, Restlichtverstärkung oder Infrarotsicht) sichtbaren Punkt auf das Ziel zu projizieren.
item.laser_sight_high_power.desc=Das ist die Art von Laser, bei der man sich fragt, ob man den Punkt in so großer Entfernung überhaupt sehen kann. Er ist auch schwer einzusetzen, weil sich Kugeln über große Entfernung nicht wie Licht bewegen. Man bekommt einen guten Näherungswert, und bei den richtigen Windverhältnisse kann jemand, der weiß, wie man den Wind kompensiert, damit auf große Entfernung zielen.
itemmod.gyro_mount_ii.desc=Basismodelle können immer verbessert werden, und die Fortschritte beim einfachen Gyrostabilisator sind das Allerneueste. Mikrogelenks-Stabilisationen, nanoreaktive Energieabsorptions-Protokolle und WiFi-gesteuerte Stabilisatoren machen das System zur schärfsten Feuerplattform mit Rückstoßkompensation auf dem Markt.
item.machine_gun_blast_shield_large.desc=Noch ein Lowtech-Zubehör, das bei Maschinengewehrschützen beliebt ist, ist der einfache und effektive MG-Schutzschild. Kurz gesagt sind diese Schilde Panzerplatten, die an der Seite eines Maschinengewehrs angebracht werden, um den Schützen zusätzlich zu schützen. Die genauen Abmessungen und Spezifikationen sind unterschiedlich, aber meistens haben die Schilde eine von zwei Größen: die kleineren Platten mit 30 × 60 Zentimetern für tragbare MGs und die größeren mit 60 × 120 Zentimetern für feste (oder mehr oder weniger feste) Positionen. MG-Schutzschilde gibt es in verschiedenen Konfigurationen und Stilen, aber alle bestehen aus schwerem antiballistischem Material mit zusätzlicher Schutzwirkung. Das bedeutet, dass sie angewinkelt sind, um Schüsse abzulenken, oder dass sie mit zusätzlicher Panzerung denselben Schutz erzielen. Zusätzlicher Schutz ist zwar immer ein Plus, aber MG-Schutzschilde sind sperrig und schwer \u2013 besonders die größeren. Auch die, die aus modernen, leichten Materialen bestehen, verlangsamen einen Maschinengewehrschützen, wenn er sich zu viel zu bewegen versucht.
item.machine_gun_blast_shield_small.desc=Noch ein Lowtech-Zubehör, das bei Maschinengewehrschützen beliebt ist, ist der einfache und effektive MG-Schutzschild. Kurz gesagt sind diese Schilde Panzerplatten, die an der Seite eines Maschinengewehrs angebracht werden, um den Schützen zusätzlich zu schützen. Die genauen Abmessungen und Spezifikationen sind unterschiedlich, aber meistens haben die Schilde eine von zwei Größen: die kleineren Platten mit 30 × 60 Zentimetern für tragbare MGs und die größeren mit 60 × 120 Zentimetern für feste (oder mehr oder weniger feste) Positionen. MG-Schutzschilde gibt es in verschiedenen Konfigurationen und Stilen, aber alle bestehen aus schwerem antiballistischem Material mit zusätzlicher Schutzwirkung. Das bedeutet, dass sie angewinkelt sind, um Schüsse abzulenken, oder dass sie mit zusätzlicher Panzerung denselben Schutz erzielen. Zusätzlicher Schutz ist zwar immer ein Plus, aber MG-Schutzschilde sind sperrig und schwer \u2013 besonders die größeren. Auch die, die aus modernen, leichten Materialen bestehen, verlangsamen einen Maschinengewehrschützen, wenn er sich zu viel zu bewegen versucht.
item.ammo_pouch.desc=Dieses einfache, günstige Zubehörteil wird oft übersehen, ist aber für den modernen Schützen essenziell. Standard-Munitionstaschen sind nicht für den Einsatz mit einem MAMS gedacht. Meistens werden sie an Gürteln oder Tragegurten angebracht und erlauben einen schnellen Zugriff auf oder die Aufbewahrung von Magazinen oder einzelnen Patronen. Munitionstaschen können auch an anderen Taschen befestigt werden, die man am Gürtel oder Tragegurt oder direkt an der Panzerung trägt (außer beim MAMS, das seine eigenen Taschen hat).
item.ammo_sling.desc=Manchmal funktionieren die einfachen Dinge am besten. Ein Munitionsgurt ist im Grunde ein günstiges Band aus Synthleder oder Nylon mit Mikrohalterungen, an denen man Munitionstaschen befestigen kann. Es geht darum, dass ein Schütze (oder ein armer Nichtkämpfer) zusätzliche Munition tragen kann, wenn es mehr zu schießen gibt als erwartet, aber die Person keine taktische Panzerung trägt. Munitionsgurte können auch an einer Waffe befestigt \u2013 besonders beliebt bei Schrotflinten \u2013 oder einfach um die Taille oder über die Schulter getragen werden. Für 15 Nuyen mehr bietet der Gurt eine zusätzliche kleine Tasche, in die man das nicht knallende Zeug oder noch mehr Magazine reinpacken kann.
item.ranger_arms_eagle_eye.desc=Die Eagle Eye wurde 2077 von Ranger Arms vorgestellt und besteht aus einer Reihe von Sensoren, die  mit dem Smartgunsystem oder Zielfernrohr einer Waffe verbunden werden. Ursprünglich war die Eagle Eye für das Schießen auf lange Distanz entworfen worden. Sie enthält einen Laser-Entfernungsmesser,  ein Mikro-Dopplerradar und einen Hochreichweiten-Ultraschallsensor, die zusammen (wie es in der Werbung heißt) \u201Edie klarste Sicht und Zieldarstellung aller Zeiten in jeder Situation\u201C bieten. Die Eagle Eye  ist auf große Entfernung beeindruckend, ist ansonsten  aber fast unbrauchbar, besonders wenn der Schütze sich bewegt oder mehrere Schüsse hintereinander abgegeben werden (also bei Salvenfeuer oder vollautomatischem Feuer).
item.quick_draw_quiver.desc=Dieser hartschalige, schützende Köcher fasst bis zu zwanzig Pfeile oder Bolzen. Automatische Zuführsysteme erlauben einem Bogenschützen, per WiFi verschiedene Arten von Munition bereit machen zu lassen und leicht zu ziehen.
item.quick_draw_scabbard.desc=Durch magnetische Platten, schnellöffnende Clips  oder Handgelenksmechanismen sind diese Scheiden hervorragend dazu geeignet, einen Feind zu überraschen, der einen scheinbar unbewaffneten Gegner vor sich sieht. Mehrere Firmen bieten zahllose Designs für alle möglichen Nahkampfwaffen auf dem Markt an, egal, wie groß sie sind. Schnell untergebracht, schnell aktionsbereit.
itemmod.concealable_sheath.desc=Eine kleine Scheide, die praktisch überall am Körper getragen werden kann, wo sie versteckt werden kann. Sie wird mit einem Smart-Kleber befestigt, der darauf programmiert werden kann, sich an einen neuen Ort zu bewegen.
itemmod.melee_quick_draw_sheath.desc=Eine leicht zugängliche und unauffällige Scheide, die dafür gedacht ist, Nahkampfwaffen am perfekten Platz für ein schnelles, effektives Zuschlagen aufzubewahren.
itemmod.melee_hidden_arm_slide.desc=Dieser Springarm wird am Unterarm unter der Kleidung befestigt und kann eine kleine Klinge (keine Katanas), Shuriken, Wurfmesser oder Wurfpfeile aufnehmen.
item.concealable_sheath_acc.desc=Eine kleine Scheide, die praktisch überall am Körper getragen werden kann, wo sie versteckt werden kann. Sie wird mit einem Smart-Kleber befestigt, der darauf programmiert werden kann, sich an einen neuen Ort zu bewegen.
item.melee_quick_draw_sheath_acc.desc=Eine leicht zugängliche und unauffällige Scheide, die dafür gedacht ist, Nahkampfwaffen am perfekten Platz für ein schnelles, effektives Zuschlagen aufzubewahren.
item.melee_hidden_arm_slide_acc.desc=Dieser Springarm wird am Unterarm unter der Kleidung befestigt und kann eine kleine Klinge (keine Katanas), Shuriken, Wurfmesser oder Wurfpfeile aufnehmen.
item.concealbale_quickdraw_holster.desc=Ein schneller Zugriff auf eine gut versteckte Waffe vereint das Beste aus beiden Welten. Diese Holster können durch Smart-Materialien und exakte Vermessung des Körpers eine Pistole jeder Größe aufnehmen und an einem Ort mit günstigem Zugriff aufbewahren. Sie werden oft am unteren Rücken, in Taillennähe oder an einer Gliedmaße angebracht und sind meistens dazu gedacht, unter der Kleidung getragen zu werden.
item.flashlight_thermographic.desc=Das ist im Grunde eine taktische Lampe für Trolle und Zwerge mit ihrer Infrarotsicht und für Leute mit der technologischen Version davon. Es ist nicht so, dass sie Hitze abgäbe \u2013 das wäre kontraproduktiv \u2013, sondern sie strahlt Infrarotlicht aus, das für die Leute, die es sehen können, gut (wenn auch ein bisschen seltsam) reflektiert wird.
item.flashlight_low-light.desc=Sogar eine kleine Lampe kann extrem blenden, wenn man mit Restlichtverstärkung ausgerüstet ist, deswegen wurde dieses Baby entworfen. Sieht aus wie eine normale taktische Lampe, aber das Licht, das davon ausgestrahlt wird, wirkt bei Restlichtverstärkung \u2013 egal ob natürlichen oder technischen Ursprungs \u2013 viel besser. Personen mit Restlichtverstärkung profitieren von deutlich besseren Sichtverhältnissen, während diejenigen mit gewöhnlichen Augen höchstens ein schwaches purpurnes Leuchten sehen.
item.regular_sling.desc=Eine Feuerwaffe bringt nichts, wenn man damit nicht zielen und schießen kann, bevor der Gegner es tut. Und wenn man andauernd die Hauptwaffe im Schulteranschlag trägt, kann das (besonders bei langen Missionen) wirklich verdammt schnell ermüdend werden. Taktische Tragegurte helfen Schützen, eine MP, eine Schrotflinte oder ein Sturmgewehr im Hüftanschlag zu tragen, ohne dass dabei die Arme übermäßig ermüden, und die Waffe bei sich zu behalten, wenn sie andere Dinge zu tun haben, zum Beispiel eine andere Waffe zu greifen oder einem Gegner ins Gesicht zu schlagen. Taktische Tragegurte werden am Schaft der Waffe befestigt und bestehen aus einem zähen Kevlar-Nylon-Gewebe, das eine passable Dehnbarkeit bietet. Sie werden über die Schulter getragen oder direkt an einem MAMS-Geschirr befestigt.\nStandard-Tragegurte bestehen aus denselben Materialien, werden aber an Haltepunkten vorne und hinten an der Waffe befestigt. Sie dienen dem einfachen Tragen der Waffe über der Schulter und gewähren keinerlei Vorteil dabei, die Waffe schnell in Anschlag zu bringen. Munitionstaschen werden oft an Standard-Tragegurten befestigt, um mehr Munition mitführen zu können.
item.tactical_sling.desc=Eine Feuerwaffe bringt nichts, wenn man damit nicht zielen und schießen kann, bevor der Gegner es tut. Und wenn man andauernd die Hauptwaffe im Schulteranschlag trägt, kann das (besonders bei langen Missionen) wirklich verdammt schnell ermüdend werden. Taktische Tragegurte helfen Schützen, eine MP, eine Schrotflinte oder ein Sturmgewehr im Hüftanschlag zu tragen, ohne dass dabei die Arme übermäßig ermüden, und die Waffe bei sich zu behalten, wenn sie andere Dinge zu tun haben, zum Beispiel eine andere Waffe zu greifen oder einem Gegner ins Gesicht zu schlagen. Taktische Tragegurte werden am Schaft der Waffe befestigt und bestehen aus einem zähen Kevlar-Nylon-Gewebe, das eine passable Dehnbarkeit bietet. Sie werden über die Schulter getragen oder direkt an einem MAMS-Geschirr befestigt.\nStandard-Tragegurte bestehen aus denselben Materialien, werden aber an Haltepunkten vorne und hinten an der Waffe befestigt. Sie dienen dem einfachen Tragen der Waffe über der Schulter und gewähren keinerlei Vorteil dabei, die Waffe schnell in Anschlag zu bringen. Munitionstaschen werden oft an Standard-Tragegurten befestigt, um mehr Munition mitführen zu können.
item.guncam.desc=Waffenkameras sind teils Zielfindungs- und teils Bildsysteme und besetzen im Arsenal eines Schützen eine besondere Nische. Ursprünglich wurden sie als Überwachungs- und Trainingsinstrument entwickelt, und die frühen Waffenkameras wurden zugunsten fortschrittlicherer Systeme wie der inzwischen zum Standard gewordenen Bildverbindung ausgemustert. Aber bei Schützen blieben sie als Trainingsinstrument beliebt und waren zum Einschießen von Waffen nützlich. In Verbindung mit einem Smartlink und Smartgunsystem oder anderen Zielerfassungssystemen nutzen Waffenkameras spezielle Software, um die Flugbahn einer Kugel oder eines Projektils (darunter auch Pfeile, Bolzen, abgefeuerte Granaten oder Raketen) in Echtzeit zu verfolgen. Wenn Daten aus Smartguns über ihr Bild gelagert werden, können Waffenkameras bei weiteren Schüssen nach einem Verfehlen helfen oder das Schussbild von automatischem Feuer zeigen, ohne dass man Leuchtspurmunition braucht. Und wenn ihr einfach nur eine gute Kamera braucht, um die Lage einzuschätzen, könnt ihr einer Waffenkamera auch eine begrenzte Anzahl an Sichtverbesserungen verpassen.
item.extended_clip.desc=Vergrößerte Stangenmagazine dienen dazu, eine Balance zwischen größerem Munitionsvorrat und der Heimlichkeit herzustellen, die durch Trommelmagazine gefährdet wird \u2013 auch wenn diese Magazine nicht viel weniger auffällig als Trommelmagazine sind.\nVergrößerte Stangenmagazine gibt es in zwei Stufen. Stufe 1 erhöht die Munitionsmenge um 5 Schuss, Stufe 2 um 10 Schuss. Aber wie alle unüblichen Magazine sind auch vergrößerte Stangenmagazine schwerer zu verbergen, besonders wenn sie in einer Waffe im Holster stecken.
item.armored_retention_holster.desc=Ein Standard bei Polizei und Sicherheitsfirmen, der die Dienstpistole sichert und dem Nutzer zwei Vorzüge bietet: Die Pistole wird vor dem Zugriff von Unberechtigten geschützt und erhält ein wenig zusätzlichen Schutz vor zufälligen (oder absichtlichen) Treffern. Diese Holster gibt es in verschiedenen Stilen; sie sind an bestimmte Waffen angepasst und stehen nur für Holdout-, leichte und schwere Pistolen zur Verfügung.\nSie können die Waffe entweder manuell oder über WiFi freigeben; bei der WiFi-Variante ist außerdem ein biometrischer Scanner nötig. Solche Holster sollen vor allem funktional sein, die Tarnbarkeit spielt eine untergeordnete Rolle. Das bedeutet, dass sie ein bisschen sperriger als gewöhnliche Holster sind und meistens offen getragen werden.
item.firearm_in_melee.desc=Manchmal gehen einem im Kampf die Optionen aus, und man hat keine andere Wahl, als den Gegner mit seiner Feuerwaffe zu verprügeln. Und die meisten modernen Feuerwaffen sind nicht wirklich für diese Art von Beanspruchung gemacht; ihre interne Elektronik kann beschädigt werden, und manchmal zerstört man damit sogar die Waffe selbst. Oder man will vielleicht einfach eine Waffe haben, die als Knüppel dienen kann. Jedenfalls sollte man die Waffe dann mit einer Nahkampfverstärkung modifizieren. Mithilfe eines Verbesserungsprozesses namens Chemo-ForgeTM werden die Außenseiten und das Innenleben einer Waffe verstärkt, was ihre strukturelle Stärke um etwa 150 Prozent erhöht. Das Verfahren funktioniert wie versprochen, aber es gibt einen Haken: Das Material durchzieht die Waffe. Die Hersteller behaupten zwar, es gäbe keine Nebenwirkungen im Hinblick auf Wartung oder Leistung, aber es gibt einige Einsatzberichte darüber, dass sich die Waffen nach der Nahkampfverstärkung ein wenig \u201Eklebrig\u201C anfühlen.

martialart.52blocks.desc=Dieser Stil ist unter vielen Namen bekannt, hat sich  aus Kampfstilen afroamerikanischer Sklaven entwickelt und wurde im 20. Jahrhundert von Insassen der amerikanischen Haftanstalten weiterentwickelt. Der Stil ist höchst defensiv und mobil, wie aus den \u201E52 Blocks\u201C abzulesen ist, die ihm den Namen gaben, und umfasst auch Schlag- und Messer-Techniken.
martialart.aikido.desc=Aikido ist weithin als pazifistische Kampfkunst bekannt und ist eine \u201Eweiche\u201C Kampfkunst, die darauf setzt, die Kraft des Gegners gegen ihn selbst zu wenden. Die Techniken sind fast ausschließlich defensiv und konzentrieren sich auf das Entwaffnen und Behindern von Angreifern, ohne diesen Schaden zuzufügen. Aikido hat auch ein starkes spirituelles Element und kombiniert traditionelle buddhistische und Shinto-Glaubensinhalte mit einer Philosophie des Friedens und der Gewaltlosigkeit.\nÄhnliche Stile: Baguazhang (China), Taijiquan (China)
martialart.arnis.desc=Arnis (auch als Arnis de mano, Escrima oder Kali bekannt) ist ein Überbegriff für mehrere philippinische Kampfkünste und setzt auf den Einsatz von Paaren von Rattan-Stöcken (baston) oder Dolchen (baraw/daga) sowie auf längere stumpfe und Klingenwaffen, waffenlose Schläge und Gelenksperren.\nÄhnliche Stile: Banshay (Myanmar), Gatka/Shastar Vidya (Indien), Krabi-Krabong (Thailand), Nguni-Stockkampf (Azanien)
martialart.bartitsu.desc=Diese Kampfkunst ist als die \u201EGentleman-Kampfkunst\u201C bekannt, die von literarischen Helden wie Sherlock Holmes und John Steed berühmt gemacht wurde; sie nutzt Gehstöcke oder Regenschirme \u2013 die man in alten Zeiten durchaus alltäglich dabeihatte \u2013 als Waffen zur Selbstverteidigung.\nÄhnliche Stile: Bataireacht (Tír na nÓg)
martialart.boxing.desc=Ah, die guten alten Faustschläge. Boxen ist die uralte Kunst, jemanden zu verprügeln, bis er zu Boden geht \u2013 hoffentlich, bevor man selbst verprügelt wird, bis man zu Boden geht. Die Stile einzelner Boxer sind sehr unterschiedlich \u2013 einige sind höchst mobil und decken den Gegner mit einem Hagel von Schlägen ein, andere halten einfach die Angriffe des Gegners aus, bis sie ihn mit einem einzigen Schlag umhauen. Das wichtigste Unterscheidungsmerkmal ist, dass sich Boxen, anders als andere Kampfkünste, nur auf die Fäuste verlässt.\nÄhnliche Stile: Dornálaiocht (Tír na nÓg)
martialart.capoeira.desc=Capoeira wurde in Amazonien (damals Brasilien) von Sklaven afrikanischer Abstammung entwickelt, die ihre Kampfkunst als Tanz tarnten, um nicht erwischt zu werden. Weil die Hände der Sklaven oft in Ketten lagen und sie sich mit den Armen nicht effektiv verteidigen oder angreifen konnten, setzt Capoeira vor allem auf weite Ausweichbewegungen und Beintechniken wie Tritte und Beinfeger.\nÄhnliche Stile: Engolo (Angola)
martialart.chakram_fighting.desc=Das Chakram ist ursprünglich eine Wurfwaffe vom indischen Subkontinent, die aber in weiten Teilen Asiens benutzt wurde. Es hat meistens die Gestalt eines geschärften Rings, der als Schmuck getragen wird, bis er im Kampf gebraucht wird. Das Chakram kann auch als geschärfter Schlagring getragen werden, wenn man bereit ist, Schnitte in der eigenen Hand zu riskieren.\nÄhnliche Stile: Shurikenjutsu (Japan)
martialart.close_quarters_combat.desc=Ein Überbegriff für praktisch ausgerichtete, \u201Etaktische\u201C Kampfkünste, die für den Einsatz bei Polizei und Militär entwickelt wurden und keine traditionellen Stile sind, die ins Heute übernommen wurden. Sie umfassen häufig verschiedene Ringen- und Schlag-Techniken, darunter auch solche mit Schlagstöcken, das Entwaffnen und Methoden des Einsatzes von Feuerwaffen als Nahkampfwaffen.\nÄhnliche Stile: Krav Maga, MCMAP, Systema
martialart.european_fencing_longsword.desc=Das Langschwert ist eine von vielen Waffen, die die Fahne der \u201Ehistorischen europäischen Kampfkünste\u201C hochhalten, und ist das archetypische Schwert, das im mittelalterlichen Europa eingesetzt wurde. Seine Renaissance in der Sechsten Welt lag an der Wiederentdeckung von Handbüchern, die von Meistern wie Fiore dei Liberi und Johann Liechtenauer geschrieben wurden. In der Folge gewann es an Beliebtheit bei Straßensamurai, die das Katana für überschätzt halten. Ursprünglich war diese Waffe für das Schlachtfeld gedacht, aber das Fechten mit dem Langschwert ist perfekt für Leute geeignet, die Horden von Gegnern mit einem Schlag niedermähen wollen.
martialart.european_fencing_rapier.desc=Hierbei handelt es sich nicht um modernes Sportfechten, sondern eher um die Kampfstile von Bonetti, Capo Ferro, Thibault, Agrippa und diesem einen klassischen Flachfilm-Duell aus den 1980ern. Der Großteil des Fechtens im 21. Jahrhundert basiert auf Techniken, die ihren Ursprung in Frankreich und Italien haben, wobei in den letzten Jahren auch der spanische Stil la verdadera destreza an Beliebtheit gewonnen hat. Europäische Duellanten führten zu ihren Rapieren oft Waffen wie Dolche in der Nebenhand, was als Tradition bis in die modernen Zeiten überlebt hat.
martialart.jeet_kune_do.desc=Der Stil des Jeet Kune Do wurde vom legendären Kampfkünstler Bruce Lee entwickelt, indem er Elemente vieler existierender Kampfkünste kombinierte und dabei alles aufnahm, \u201Ewas funktionierte\u201C. Diese Philosophie verfolgen auch die Anwender der Mixed Martial Arts, die oft sowohl Ringen- als auch Schlag-Stile studieren (eine populäre Kombination besteht aus Jiu Jitsu und Muay Thai), um im Ring effektiv zu sein.\nÄhnliche Stile: Hapkido (Korea)
martialart.jogo_do_pao.desc=Jogo do Pao wurde in Portugal entwickelt und ist im Grunde der Kampf mit dem Stab. Es hat sich aus Techniken entwickelt, die Bewohner ländlicher Gebiete nutzten, um wilde Tiere mit langen Wanderstöcken abzuwehren. Seine Popularität ging zurück, als immer mehr Leute in die Städte zogen, aber es gab genügend Anhänger, dass sich der Stil bis in die Sechste Welt retten konnte.\nÄhnliche Stile: Ball de bastons (iberische Halbinsel), Canne de combat (Frankreich)
martialart.jujutsu.desc=Jiu Jitsu ist (wie seine Sportvariante Judo) ein waffenloser Kampfstil aus Japan, der vor allem auf Griff-, Festhalte- und Wurftechniken setzt. Diese Kampfkunst wird oft von Polizisten gelernt, um Verdächtige zu entwaffnen und festzunehmen, und von Rausschmeißern, um unerwünschte Gäste nach draußen zu geleiten.\nÄhnliche Stile: Malla-yuddha (Indien), Sambo (Russland), Shuai Jiao (China)
martialart.karate.desc=Karate ist eine der ersten asiatischen Kampfkünste, mit denen die westliche Welt in Kontakt kam, stammt aus Okinawa und nutzt vor allem Schläge, wobei im Besonderen Fäuste und andere Teile der Hand zum Einsatz kommen (\u201EKarate\u201C bedeutet \u201Eleere Hand\u201C). Tritt-Techniken sind im Karate relativ weit verbreitet, Ringen und Waffeneinsatz eher seltener.\nÄhnliche Stile: Tang Soo Do (Korea)
martialart.kenjutsu.desc=Kenjutsu ist bei Straßensamurai und allen Leuten, die in Hörweite eines Liebhabers japanischer Kultur sind, ein bekannter Begriff und bezeichnet den Kampf mit dem japanischen Schwert. Es wird sehr stark mit dem Katana assoziiert, aber die meisten Kenjutsu-Stile umfassen auch Techniken zum Einsatz des Kodachi/ Wakizashi (des kurzen Schwerts) und des Tanto (des Dolchs) sowie die verwandte Kunst des Battojutsu/ Iaijutsu (die Kunst, das Schwert mit einer einzigen Bewegung zu ziehen und anzugreifen). Die Sportvariante Kendo ist in Japan sehr populär.\nÄhnliche Stile: Geom Beop (Korea)
martialart.kickboxing.desc=Wie man schon am Namen sehen kann, ist Kickboxen eine Art des Boxens, bei der auch die Füße zum Einsatz kommen \u2013 und oft auch Ellbogen, Knie und andere Körperteile wie der Kopf. Ähnlich wie die verwandte Kampfkunst, die nur Fäuste einsetzt, konzentriert sich das Kickboxen fast ausschließlich auf Schläge, und Ringenangriffe oder Waffengebrauch kommen nur selten vor (obwohl es Kickbox-Stile gibt, die auch auf Waffen setzen).\nÄhnliche Stile: Lethwei (Myanmar), Muay Boran/Muay Thai (Thailand), Muay Lao (Laos), Musti-yuddha (Indien), Pradal Serey (Kambodscha), Sanshou (China)
martialart.kung_fu.desc=Eigentlich bezeichnet der Begriff Kung Fu eine Gruppe von Kampfkunststilen, wird aber meistens für die \u201Eäußeren\u201C oder \u201Eharten\u201C Stile verwendet, die sich durch dynamische, körperlich anstrengende Techniken mit starker Betonung auf Schläge auszeichnen.\nPopuläre Beispiele für Kung-Fu-Stile sind der Stil der Fünf Tiere, der Shaolin-Stil, Wing Chun und Wushu.\nÄhnliche Stile: Silat/Pentjak-Silat (Indonesien), Silat Melayu (Malaysia), Shorinji kempo (Japan)
martialart.kung_fu_18.desc=Historisch gesehen war das Studium des bewaffneten Kampfes genauso Teil vieler Kampfkünste wie das der waffenlosen Techniken. In China waren die vier wichtigsten Waffen der Kampfkünste der Speer (qiang), der Stab (gun), der Säbel (dao) und das gerade Schwert (jian). Dazu kamen exotischere Waffen wie Hellebarde, Dreifachstab und der Seilspeer.\nÄhnliche Stile: Bojutsu (Japan), Kobudo (Okinawa), Stabkampf
martialart.kyujutsu.desc=Kyujutsu ist eine japanische Art des Bogenschießens, bei der meistens lange Bögen namens yumi zum Einsatz kommen, die manchmal größer als der Schütze selbst sein können. Diese Kampfkunst wurde ursprünglich von den Samurai betrieben und kam mit der Einführung von Feuerwaffen aus der Mode, wurde aber aus kulturellen und praktischen Gründen in der Sechsten Welt wieder populär.\nÄhnliche Stile: Türkisches Bogenschießen (Türkei)
martialart.ninjutsu.desc=Ninjas sind in der Populärkultur zwar vor allem als Assassinen bekannt, waren historisch betrachtet aber eher Einbrecher und Spione. Im Gegensatz zu den Samurai (und Runnern ganz ähnlich) waren Ninjas bereit, alle möglichen \u201Eunehrenhaften\u201C Techniken einzusetzen, um Kämpfe zu gewinnen und ihre Ziele zu erreichen. Heimlichkeit und das schnelle Ausschalten von Gegnern waren die wichtigsten Gebote des Ninjutsu (manchmal auch als taijutsu bekannt). Ninja-Kampfkünste umfassen auch viele Waffen-Techniken, vor allem den Gebrauch von Shuriken.
martialart.okichitaw.desc=Okichitaw ist eine der wenigen ursprünglich nordamerikanischen Kampfkünste, die bis in die Sechste Welt überlebt haben, und stammt von den Cree der Great Plains in Nordamerika. Der Stil ist sehr aggressiv und setzt auf das Ausschalten von Gegnern, indem man sie schnell zu Boden bringt. Die Hauptwaffe des Okichitaw ist die Gewehrschaft-Kriegskeule, obwohl auch Tomahawk und Dolch eingesetzt werden.
martialart.parkour.desc=Parkour ist bei genauerer Betrachtung eigentlich keine Kampfkunst und wurde als Form der schnellen und effektiven Bewegung durch unwegsame städtische Umgebungen entwickelt. Viele Techniken, die bei Parkour eingesetzt werden, können an Kampfkünste angepasst werden, um einen taktischen Vorteil gegenüber dem Gegner zu bekommen oder einfach nur schnell vor einem Kampf zu fliehen, den man nicht hätte beginnen sollen.
martialart.tae_kwon_do.desc=Wie sein japanisches Pendant Karate entstand Taekwondo aus einheimischen (in diesem Fall koreanischen) Kampfstilen und äußeren Einflüssen des Kung Fu aus China. Taekwondo ist berühmt für beeindruckende hohe und Drehtritte, die oft von schnellen Schlägen mit der Hand begleitet werden, und ist in Korea immer noch eine der populärsten Kampfsportarten.\nÄhnliche Stile: Savate (Frankreich)
martialart.the_cowboy_way.desc=Die Kampfkunst, die heute als Cowboykampf bezeichnet wird, wurde durch Flachfilme populär, die im amerikanischen Westen spielten. Sie setzt auf das Fesseln des Feindes mit dem Lasso aus der Entfernung und hat ihre Ursprünge wahrscheinlich bei den Hunnen und anderen Nomadenvölkern Zentralasiens. Die Zugabe von Faustschlägen, Revolvertricks und großen Hüten ist fast sicher amerikanischen Ursprungs.\nÄhnliche Stile: Latigo y daga (Philippinen), Nawajutsu (Japan), Peitschenkampf
martialart.wrestling.desc=Ringen ist zwar eine extrem weit gefasste Kategorie (ähnlich wie Kung Fu), besteht aber allgemein betrachtet darin, einen Teil des Gegners (oder seiner Kleidung) zu ergreifen, ihn dann zu einer Brezel zu verbiegen und auf den Boden zu drücken, bis er winselnd aufgibt. In manchen Fällen, wie im japanischen Sumo, kann man auch siegen, indem man den Gegner aus dem Ring drängt.
martialart.careomeleg.desc=Diese berühmte elfische Kampfkunst setzt auf schnelle, akkurate Treffer (waffenlos und mit verschiedenen Klingenwaffen) und eine höchst bewegliche Verteidigung, was oft zu der Behauptung geführt hat, es gäbe bei Carromeleg \u201Ekeine Kampfpositionen\u201C. Immer wieder wird behauptet, dieser Stil stamme eigentlich aus einem früheren Zeitalter der Welt, und traditionell gesinnte Lehrer nehmen nur Elfen als Schüler auf. Aber eine Handvoll der Meister dieser Kunst haben begonnen, ihren Stil auch Nicht-Elfen zu vermitteln, was zu vielen Unstimmigkeiten innerhalb der Carromeleg-Gemeinde geführt hat (so sind die Dinge nun mal).
martialart.gun_kata.desc=Gun Kata (auch als Gun Fu bekannt) ist in den Flachfilmen des 20. Jahrhunderts eher eine Show- als eine Kampfkunst, hat aber in einem Zeitalter der übernatürlich und technologisch verbesserten Reflexe und Zielgenauigkeit eine neue praktische Bedeutung erlangt.\nDer Stil setzt auf die Verwendung von Pistolen im Nahund Fernkampf, und viele Kampfkünstler modifizieren ihre Waffen, um deren Stabilität im Nahkampf zu erhöhen (oder die lästigen Warnungen der Smartlinks über \u201Efalsche Schusspositionen\u201C abzuschalten).\nGun Kata hat sich ein bisschen vom Showcharakter seiner Ursprünge erhalten, und die Stilisten der Kunst setzen auch Akrobatik und Kunstschüsse ein.
martialart.hapsum_do.desc=Adepten setzen viele Kampfkunststile mit furchterregender Effektivität ein, aber Hapsum-Do (oder der Weg des Vereinigten Mana) ist der erste Kampfkunststil, der speziell entworfen wurde, um sich die übernatürlichen Kräfte von Adepten zunutze zu machen.\nGroßmeister \u201EBarghest\u201C Knorr, ein Adept, der die Welt bereist, um seine Techniken zu vermitteln, gilt weithin als Erfinder des Stils. Hapsum-Do ähnelt anderen \u201Ehybriden\u201C Kampfkünsten, bei denen Ringen- und Schlag-Techniken benutzt werden (und ist daher in mancher Hinsicht auch für Nicht-Adepten nützlich), aber einige Techniken setzen auf die Erwachten Fähigkeiten des Kämpfers, um effektiv zu wirken.
martialart.lone_star_tactical.desc=Diese beiden Kampfsysteme, die von den Polizeifirmen  entwickelt wurden, deren Namen sie tragen, sind bei genauerer Betrachtung Interpretationen der Sechsten Welt von Nahkampftechniken des 20. Jahrhunderts. Die Anwender beider Stile schwören, dass ihr Ansatz völlig anders sei als der jeweils andere. Aber in Wirklichkeit haben es Knight Errant und Lone Star in ihrem Dienst mit denselben Situationen zu tun, und die Ansätze beider Kons zum Umgang mit diesen Situationen sind im Prinzip ähnlich. Der Hauptunterschied zwischen den beiden Stilen besteht darin, dass Knight Errant mehr auf das Entwaffnen einzelner Personen setzt (man kann nie wissen, ob man es mit einem SIN-Menschen zu tun hat, der eine Beschwerde mit nachfolgenden PR-Schwierigkeiten einreicht), Lone Star hingegen eher auf Aufstandsbekämpfung Wert legt.
martialart.knight_errant_tactical.desc=Diese beiden Kampfsysteme, die von den Polizeifirmen  entwickelt wurden, deren Namen sie tragen, sind bei genauerer Betrachtung Interpretationen der Sechsten Welt von Nahkampftechniken des 20. Jahrhunderts. Die Anwender beider Stile schwören, dass ihr Ansatz völlig anders sei als der jeweils andere. Aber in Wirklichkeit haben es Knight Errant und Lone Star in ihrem Dienst mit denselben Situationen zu tun, und die Ansätze beider Kons zum Umgang mit diesen Situationen sind im Prinzip ähnlich. Der Hauptunterschied zwischen den beiden Stilen besteht darin, dass Knight Errant mehr auf das Entwaffnen einzelner Personen setzt (man kann nie wissen, ob man es mit einem SIN-Menschen zu tun hat, der eine Beschwerde mit nachfolgenden PR-Schwierigkeiten einreicht), Lone Star hingegen eher auf Aufstandsbekämpfung Wert legt.
martialart.oni_ryu_taijutsu.desc=Die Oni Do Kai sind eine Gruppe von Yakuza-\u201ENinjas\u201C (Freiberuflern), die beinahe vollständig aus Orks und Trollen besteht. Schon früh erkannten die Mitglieder der Oni Do Kai, dass ihre beeindruckende Größe und Stärke in dem Land ein Nachteil sein könnte, das Judo und Jiu Jitsu hervorbrachte, und passten ihren Stil des Ninjutsu an, sodass diese Schwächen zu Stärken wurden \u2013 und so entstand Oni-ryu Taijutsu.\nNiemand weiß genau, warum die Oni Do Kai beschlossen, ihre Techniken an Außenseiter zu vermitteln, aber das hat die Orks und Trolle in Japan (und in anderen Ländern mit großen japanischen Gemeinden) nicht davon abgehalten, scharenweise Kurse zu buchen. Nachdem sich die Oni Do Kai mehr oder weniger an die Öffentlichkeit gewagt hatten, taten es ihr andere Kampfkunstgruppen gleich, die Stile für Orks und Trolle entwickelten (mit Namen wie Trog Kwan D
martialart.sangre_y_acero.desc=Nach der Erfindung brauchbarer Cybergliedmaßen in den 2030ern war es nur eine Frage der Zeit, bis jemand Cybergliedmaßen entwarf, die für den Kampf optimiert waren. Sangre y Acero (auch bekannt als Etzilitzli und Ars Cybernetica) entstand in den Gladiatorengruben von Tenochtitlán und setzt die Vorteile von Cybergliedmaßen, vor allem gegen andere Nahkampfwaffen, bestmöglich ein.
martialart.wildcat.desc=Als die Sioux Wildcats 2080 endlich das Verbot von Cyberware für ihre Einheiten aufhoben, konnte noch niemand sagen, ob ihre eigene Kampfkunst darunter leiden oder davon profitieren würde. Es ist immer noch nicht klar, aber der Stil (eine Mischung aus Okichitaw, Aikido, Karate und Muay Thai, bei der Gegner so schnell wie möglich ausgeschaltet werden sollen) ist so effektiv wie eh und je \u2013 vor allem gegen Gegner ohne Bodytech, wie die Erzrivalen von den Tír Ghosts.


technique.baton_lock.desc=In den Händen eines geübten Kämpfers können Stöcke verschiedener Länge zum Festhalten eingesetzt werden. Beim Einsatz einer stumpfen Waffe kannst du jede Technik der Kategorie Ringen, die du gelernt hast, einsetzen, als hättest du keine Waffe, und kannst dabei den Schaden der Waffe (wenn angebracht inklusive Erhöhung durch Präzise Schläge) statt des waffenlosen Grundschadens verwenden.
technique.ballestra.desc=Senke den Würfelpolmalus für Ziel ansagen um 1. technique.baton_lock.desc=n den Händen eines geübten Kämpfers können Stöcke verschiedener Länge zum Festhalten eingesetzt werden. Beim Einsatz einer stumpfen Waffe kannst du jede Technik der Kategorie Ringen, die du gelernt hast, einsetzen, als hättest du keine Waffe, und kannst dabei den Schaden der Waffe (wenn angebracht inklusive Erhöhung durch Präzise Schläge) statt des waffenlosen Grundschadens verwenden.
technique.bending_of_the_reed_melee.desc=Du erhältst 1 Edge zusätzlich, wenn du die Nebenhandlung Ausweichen gegen Nahkampfangriffe durchführst.
technique.bending_of_the_reed_ranged.desc=Du erhältst 1 Edge zusätzlich, wenn du die Nebenhandlung Ausweichen gegen Fernkampfangriffe durchführst.
technique.close_quarter_firearms_handguns.desc=Beim Einsatz einer Holdout-, Leichten, Schweren oder Automatikpistole oder eines Tasers im Nahkampf kann diese Feuerwaffe als Knüppel gelten, was Kampfkunsttechniken betrifft. Die Spielleiterin entscheidet, ob ein Schlag mit einer nicht verstärkten Waffe dieser Schaden zufügt oder sie sogar zerstört.
technique.close_quarter_firearms.desc=Beim Einsatz eines Gewehrs oder einer Maschinenpistole im Nahkampf kann diese Feuerwaffe als Knüppel gelten, was Kampfkunsttechniken betrifft. Die Spielleiterin entscheidet, ob ein Schlag mit einer nicht verstärkten Waffe dieser Schaden zufügt oder sie sogar zerstört.
technique.defiant_dance.desc=Wenn sich ein Charakter in einem Ringen-Griff (SR6, S. 113) befindet, kann er versuchen, sich loszureißen, indem er eine Probe auf Athletik + Geschicklichkeit ablegt, statt seine normale Probe auf Nahkampf + Stärke zu verwenden. Die Nettoerfolge des Gegners bei der ursprünglichen Vergleichenden Stärkeprobe, um den Charakter in den Griff zu bringen, gelten als Schwellenwert für die Entkommen-Probe.
technique.dim_mak.desc=Indem ein Angesagtes Ziel gegen eine bestimmte Gliedmaße benutzt wird, kannst du bei einem erfolgreichen Angriff der betreffenden Gliedmaße den Status Gelähmt I (S. 118) zufügen, statt Schaden zu verursachen. Je 2 Nettoerfolge erhöhen die Stufe des Status um 1. Jede Stufe des Status bleibt für [Nettoerfolge beim Angriff] Kampfrunden bestehen.
technique.drunken_boxing.desc=Du bist dazu ausgebildet, dich auf unberechenbare Weise zu bewegen und anzugreifen, was sowohl ein Vorteil als auch ein Nachteil sein kann. Die Anzahl an Einsen, bei denen ein Patzer im waffenlosen Angriff entsteht, wird wegen deiner schlampigen Ausführung um 1 gesenkt, aber andererseits erhält dein Ziel einen Würfelpoolmalus von -2 auf Verteidigungsproben gegen diese Angriffe, weil deine Bewegungen so schwer vorauszuahnen sind.
technique.elbows_tight.desc=Du erhältst beim Einsatz der Nebenhandlung Blocken ohne Waffe 1 Edge. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.end_them_rightly.desc=Du kannst beim Einsatz einer Nahkampfwaffe den Vorteil der Technik Antäuschen für den Angriff mit einer Wurfwaffe statt der Nahkampfwaffe nutzen. Wenn die Wurfwaffe an der Nahkampfwaffe angebracht ist, kannst du sie abnehmen und werfen, wobei du für die dazu erforderliche Handlung Waffe bereit machen nur eine Nebenhandlung benötigst.
technique.entanglement.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung (S. 107), aber ohne die Edge-Kosten. Wenn du exotische Waffen wie Peitschen, Ketten, Bolas und Lassos für einen Ringen-Angriff benutzt, lege eine Probe auf Exotische Waffen + Geschicklichkeit gegen Geschicklichkeit + Reaktion ab. Gelingt die Probe, wird der Gegner nicht nur gefesselt, sondern du kannst mit einer Nebenhandlung die Waffe loslassen, sodass sie den Gegner weiter festhält und du dich anderen Dingen zuwenden kannst. Wenn die Anzahl der Nettoerfolge deines Angriffs höher ist als die Geschicklichkeit des Gegners, erhält er für [Anzahl der Nettoerfolge des Angriffs] Kampfrunden den Status Humpelnd.
technique.feint.desc=Wenn du eine Nebenhandlung ausgibst und dir eine Probe auf Nahkampf + Geschicklichkeit (3) gelingt, erhält dein Ziel einen Würfelpoolmalus von -3 auf  seine Verteidigungsprobe gegen deinen nächsten Nahkampfangriff. Muss zusammen mit einer Haupthandlung Angriff eingesetzt werden (kumulatives Antäuschen ist nicht möglich).
technique.flying_kick.desc=Du hast dich selbst zu einem metamenschlichen Projektil ausgebildet und kannst die Gegner mit deinen fliegenden Füßen des Zorns niederstrecken. Wenn du eine Nebenhandlung ausgibst und dir eine Probe auf Athletik + Geschicklichkeit (3) gelingt, kannst du die Reichweite Sehr nah um 0,5 Meter pro Erfolg (nicht Nettoerfolg) und den Schadenswert um 2 erhöhen. Dies ist kumulativ mit der Erhöhung durch die Technik Fußtritt (S. 115).\nEin Patzer bei der Probe auf Athletik + Geschicklichkeit für den Absprung oder bei der Angriffsprobe mit Nahkampf + Geschicklichkeit führt allerdings dazu, dass du bis zu deiner nächsten Handlung den Status Außer Balance (S. 118) erhältst. Ein Kritischer Patzer bei einer der beiden Proben lässt dich stolpern, wodurch du in den Status Liegend gelangst und den Status Gelähmt II (S. 118) an einem deiner Beine (zufällig bestimmt) erleidest, weil du deine Gelenke auf eine Weise verdrehst, für die sie nicht gedacht waren.
technique.ground_fighter.desc=Du bist daran gewöhnt, dass Kämpfe in einem Gewirr verschlungener Gliedmaßen enden, die auf der nächsten ebenen Oberfläche herumrollen. Du erhältst keinen Würfelpoolmalus auf Angriff oder Verteidigung, wenn du den Status Liegend (SR6, S. 54) hast, und der Würfelpoolmalus auf Verteidigungsproben, wenn du durch einen Ringenangriff gehalten wirst, wird um die Hälfte (abgerundet) gesenkt.
technique.half_sword.desc=Erhöhe den Angriffswert deiner Waffe um 2, wenn du Angriffe mit Halbschwert durchführst, aber senke die Reichweite Sehr nah um 1 Meter.
technique.iaijutsu.desc=Wie die Samurai von früher (oder zumindest die aus den Trideos) kann der Charakter die Nebenhandlung Schnellziehen (SR6, S. 43) mit einer passend aufbewahrten Nahkampfwaffe durchführen, die klein genug ist, um mit einer Hand geführt zu werden \u2013 also keine Stangenwaffe, außer sie ist in Zwergengröße und du bist ein Troll. Der Charakter muss die Handlung Schnellziehen immer noch zusammen mit der Haupthandlung Angriff verwenden.
technique.iron_limbs.desc=Dein Grundschadenswert bei einem waffenlosen Angriff steigt um 1.
technique.jiao_di.desc=Das war es wohl nicht, was deine Eltern gemeint haben, als sie sagten, du sollst \u201Edeinen Kopf benutzen\u201C, aber es funktioniert. Du darfst einen Kopfstoß einsetzen, um einen waffenlosen Angriff bis zur Hälfte deiner normalen Reichweite Sehr nah auszuführen, auch wenn du deine Gliedmaßen nicht einsetzen kannst, weil du zum Beispiel ringst oder in einem Griff bist; außerdem erhältst du einen um 1 erhöhten Grundschadenswert bei diesen Angriffen (nicht kumulativ mit Eisernen Gliedmaßen oder Ti Khao). Wenn du dich gegen einen Ringenangriff verteidigst, kannst du außerdem versuchen, deinem Gegner Schaden zuzufügen, als wärst du der Angreifer (SR6, S. 114).
technique.joint_lock.desc=Wenn du ringst (SR6, S. 113), kannst du die Option Schaden zufügen verwenden, um einem Arm oder einem Bein, den oder das du im Griff hast, den Status Gelähmt I (S. 118) zuzufügen, wobei jeweils zwei Nettoerfolge die Stufe des Status um 1 erhöhen. Jede Stufe des Status bleibt für [Nettoerfolge beim Angriff] Kampfrunden bestehen.
technique.kick_attack.desc=Du bist darauf trainiert, alle Arten von Tritten effektiv  im Kampf einzusetzen: Tritte nach vorne, von der Seite und sogar den legendären Drehtritt (optional auch mit Bart). Wenn du mit einem Fußtritt angreifst, kannst du deinen waffenlosen Grundschadenswert um 1 und die Reichweite Sehr nah um 2 Meter erhöhen. Durch einen Patzer bei einem Fußtritt erhältst du den Status Außer Balance, durch einen Kritischen Patzer den Status Liegend.
technique.mean_right_hook.desc=Senke die Edge-Kosten der Edge-Handlung K.o.- Schlag ( (SR6, SR6, S. 49) um 1.
technique.meridian_strike.desc=Indem ein Adept, der Hapsum-Do betreibt, seine Erwachten Talente mit seiner Kampfkunst kombiniert, kann er den Manafluss im Körper des Gegners stören. Wenn der Adept einen waffenlosen Angriff gegen einen Erwachten Gegner durchführt und die Kraft Todeskralle aktiviert hat, kann er, statt Schaden zuzufügen, den Würfelpool der nächsten mit Magie verknüpften Probe des Gegners um 1 pro Nettoerfolg senken.
technique.multi_opponent_combat.desc=Wenn du die Nebenhandlung Mehrfachangriffe (SR6, S. 43) durchführst, um mehrere Ziele anzugreifen, kannst du deinen Würfelpool (vor der Teilung) für jeweils zwei Ziele, die du angreifst, um 1 erhöhen. (Bei dieser Technik zählen Angriffe auf mehrere Stellen desselben Ziels als nur ein Ziel).
technique.multi_opponent_defense.desc=Wenn du in derselben Kampfrunde von mehreren Angreifern angegriffen wirst, erhältst du für jeden Angriff ab dem zweiten +2 auf deinen Verteidigungswert. Diese Erhöhung wirkt nicht kumulativ: Wenn du dreimal angegriffen wirst, erhältst du +2 auf deinen Verteidigungswert gegen den zweiten und dritten Angriff, nicht +2 gegen den zweiten und +4 gegen den dritten.
technique.neijia.desc=Du bist vielleicht nicht Erwacht, aber du hast gelernt, dein Qi (oder Ki, Prana, Ruach, Pneuma, die \u201EGeistesenergie\u201C oder reine Bosheit) in einen Schlag zu kanalisieren, der die Grenzen zwischen dem Materiellen und dem Immateriellen überschreitet. Du kannst einen waffenlosen Angriff gegen astrale Wesenheiten durchführen, als wärst du Erwacht (s. Astralkampf, SR6, S. 162). Der Schadenswert dafür ist ([Willenskraft ÷ 2] + Nettoerfolge), und der Angriff zählt als magisch (d. h., die Kraft Immunität gegen Normale Waffen wirkt hier nicht). \nDiese Technik verschafft dir allerdings nicht die Fähigkeiten des Bindens von Waffenfoki oder der astralen Wahrnehmung . Das heißt auch, dass du die Astralebene nicht sehen, sondern nur erahnen kannst, sodass deine Angriffe gegen astrale Wesenheiten einen Würfelpoolmalus von -4 erleiden.
technique.oaken_stance.desc=Du erhältst 1 Edge, wenn du Versuchen widerstehst, dich im Nahkampf niederzuschlagen. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.parry.desc=Du erhältst beim Einsatz der Nebenhandlung Blocken mit einer Waffe 1 Edge. Wenn dieser Punkt Edge nicht sofort eingesetzt wird, verfällt er.
technique.pin.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung, nur ohne Edge-Kosten. Mit diesem Angriff erhält der Gegner, wenn die Anzahl der Erfolge des Angriffs seinen Verteidigungswert übersteigt, den Status Bewegungsunfähig, weil er an eine Wand oder den Boden genagelt wird. Dabei ist es egal, ob der Angriff tatsächlich Schaden verursacht hat. Der Gegner muss die Handlung Gegenstand aufheben/ablegen durchführen, um den Status loszuwerden.
technique.precision_strike.desc=Dank eines ausgedehnten Trainings mit deiner Lieblingswaffe kannst du (Stärke ÷ 3, aufgerundet) zum Schadenswert deiner Angriffe addieren, wenn du Waffen der passenden Kategorie benutzt. Diese Technik kann mehrmals gewählt werden und betrifft dann jeweils eine andere Waffenkategorie (Klingenwaffen, Knüppel, Exotische Waffen (nur Nahkampf)).
technique.releasing_talons.desc=Senke die Edge-Kosten der Edge-Handlung Entwinden (SR6, S. 49) um 1.
technique.rolling_clouds.desc=Diese Technik funktioniert wie die gleichnamige Edge-Handlung (S. 108), nur ohne Edge-Kosten. Bei einer Probe auf Athletik + Geschicklichkeit erhöht jeder Erfolg die Anzahl an Metern, die du ohne Schaden fallen kannst, um jeweils 1.
technique.sacrifice_throw.desc=\u201EWenn ich zu Boden gehe, nehme ich dich mit!\u201C Wenn es einem Angreifer gelingt, dich niederzuschlagen, kannst du sofort eine Nebenhandlung ausgeben (wenn du noch eine zur Verfügung hast), um zu versuchen, den Gegner ebenfalls niederzuschlagen, als würdest du ihn zu Boden werfen (s. Ringen, SR6, S. 114).
technique.striking_the_darkness.desc=Wenn du dich unter Restlichtbedingungen (s. Tabelle Umgebung und Sichtverhältnisse, SR6, S. 108) im Nahkampf befindest, wirst du zum Zwecke des Erhaltens von Edge behandelt, als hättest du eine passende Sichtverbesserung.
technique.sweep_the_leg.desc=Wenn du die Nebenhandlung Zu Fall bringen waffenlos einsetzt, erhältst du 1 Punkt Edge, der verfällt, wenn du ihn nicht bei der Angriffsprobe ausgibst, die mit dieser Nebenhandlung einhergeht.
technique.tameshiwari.desc=Bretter schlagen vielleicht nicht zurück, aber man kann nie wissen, wann es nützlich sein kann, eine feste Oberfläche mit Hand, Fuß, Kopf oder einem anderen Körperteil zu durchbrechen. Wenn du eine Barriere (auch eine magische Barriere, die das physische Vorankommen behindert) mit einem waffenlosen Angriff angreifst, gilt ihre Strukturstufe als um 4 niedriger als normal, wenn es um die Berechnung des Schadens geht. Der Spielleiter muss festlegen, ob ein Patzer oder Kritischer Patzer dazu führen kann, dass du dich an Hand, Fuß, Kopf oder dem auftreffenden Körperteil an dem lästigen Objekt verletzt.
technique.threatening_edge.desc=Diese Technik funktioniert wie die gleichnamig Edge-Handlung, nur ohne Edge-Kosten. Für die Dauer der Begegnung wird der Verteidigungswert des Charakters, wenn er eine Nahkampfwaffe benutzt, durch den Angriffswert seiner Waffe in der Reichweite Sehr nah ersetzt.
technique.ti_khao.desc=Du bist darauf trainiert, beim Ringen deine Knie zum Angriff gegen einen Gegner einzusetzen, indem du dich auf ihn kniest, um ihn zu strangulieren, oder ihn in die Weichteile zu treffen versuchst. Erhöhe deinen Schadenswert während des Ringens um 1 (s. Ringen, SR6, S. 114)
technique.tricking.desc=Beeindruckende Drehtritte, das Herumwirbeln eines Stabs oder dem Gegner die Zigarette aus dem Mund zu schießen sind im Normalfall vielleicht nicht wirklich praktisch, aber diese Dinge können Freunde beeindrucken und Feinde einschüchtern.\nWenn du eine Teamwork-Probe ablegst, um einem Verbündeten beim Einschüchtern eines Ziels zu helfen \u2013 was auch die Edge-Handlung Große Rede (SR6, S. 49) einschließt \u2013, kannst du die Probe auf Waffenfertigkeit + Geschicklichkeit statt auf Einfluss + Charisma ablegen. Wenn du diese Technik zusammen mit der Edge-Handlung Große Rede einsetzt, kannst du nur die erste Probe mit Einfluss + Charisma durch Waffenfertigkeit + Geschicklichkeit ersetzen, nicht beide.
technique.two_weapon_fighting.desc=Wenn du die Nebenhandlung Mehrfachangriffe mit mehr als einer Waffe benutzt, erhältst du einen Würfelpoolbonus von +2, den du auf deine Angriffe aufteilen kannst.
technique.weapon_breaker.desc=Wenn du Angesagtes Ziel \u2013 Entwaffnen benutzt, kannst du entweder die Edge-Kosten (wenn du Edge ausgibst) oder den Würfelpoolmalus (wenn du kein Edge einsetzt) um 1 senken.

quality.pacifist.desc=Wie der Name bereits vermuten lässt, schränkt dieser Nachteil die Möglichkeiten ein, die einem Charakter in Bezug auf den Einsatz von Gewalt gegen andere Charaktere zur Verfügung stehen. Handelt der Charakter wissentlich gegen seine pazifi stische Überzeugung, so darf er für 24 Stunden nach der jeweiligen Tat weder Edge ausgeben noch erhalten. Jede weitere Gewalttat, die während dieser 24 Stunden verübt wird, verlängert die Dauer des Zeitraums, in dem kein Edge genutzt oder regeneriert werden kann, um weitere 24 Stunden.\n\nStufe 1\nDu darfst nur zu Gewalt greifen (z. B. etwas tun, durch das eine Zielperson Schaden erleidet) um einen anderen Charakter vor einer eindeutigen und unmittelbaren Bedrohung zu schützen, beispielsweise einem feindlichen NSC, der diesen mit einer Waffe bedroht. Du darfst Handlungen ausführen, die dem Ziel Körperlichen Schaden zufügen, allerdings nur, wenn es wahrscheinlich ist, dass es diesen Schaden überleben wird.\n\nStufe 2\nDu darfst niemals und unter keinen Umständen als erster Gewalt anwenden, aber du darfst Ziele angreifen, die sich bereits als Gefahr für dich oder andere erwiesen haben. Du darfst Handlungen ausführen, die dem Ziel Körperlichen Schaden zufügen, allerdings nur, wenn es wahrscheinlich ist, dass es diesen Schaden überleben wird.\n\nStufe 3\nDu darfst niemals und unter keinen Umständen als erster Gewalt anwenden, aber du darfst Ziele angreifen, die sich bereits als Gefahr für dich oder andere erwiesen haben. Du  darfst nicht wissentlich Handlungen ausführen, die dem Ziel Körperlichen Schaden zufügen, allerdings kannst du weiterhin Handlungen ausführen, die dem Ziel Geistigen Schaden zufügen.\n\nStufe 4\nDu darfst wissentlich keinerlei Gewalt anwenden, egal aus welchem Grund und nicht einmal, um dich selbst oder andere zu verteidigen.

quality.always_late.desc=Ganz egal, wie viele Wecker du dir stellst oder wie oft deine Teamkameraden anrufen, damit du es nicht vergisst: Vielleicht bist du immer abgelenkt, vielleicht kannst du dich einfach nicht aus dem Bett aufraffen, aber in jedem Fall schaffst du es wirklich nie, irgendwo pünktlich aufzutauchen. Meistens denkst du dir nichts weiter dabei, aber es gibt Situationen \u2013 zum Beispiel beim Treffen mit dem Johnson \u2013, in denen dadurch dein ganzes Team nachlässig wirkt.\n\nDu kommst zu allen geplanten Terminen immer mindestens 15 Minuten zu spät. Wenn es bei einem Termin darum ging, einen potenziellen Auftraggeber zu treffen, erhält dein komplettes Team aufgrund deines unprofessionellen Verhaltens einen Würfelpoolmalus von -1 auf soziale Proben gegen den Johnson.
quality.bad_memories.desc=Wenn du diesen Nachteil wählst (oder erhältst), wählst du einen Auslöser für deine Traumatischen Erinnerungen. Wann immer du dich in der Nähe dieses Auslösers befindest, kannst du pro Kampfrunde nur noch maximal 1 Punkt Edge erhalten (anstatt der üblichen 2 Punkte).
quality.compulsion.desc=Du musst der gewählten Aktivität jeden Tag eine bestimmte Zeit widmen, die sich nach der Stufe des Nachteils richtet. Tust du das nicht, leidest du unter Entzugserscheinungen, die dir einen Würfelpoolmalus von -2 auf sämtliche Proben verleihen, der sich mit jeder weiteren verstreichende Entzugsperiode um 1 erhöht.\nAnalog zum Nachteil Abhängigkeit kannst du weder Edge erhalten noch Edge ausgeben, während du unter Entzugserscheinungen leidest. Lege zusammen mit deinem Spielleiter fest, ob dein Charakter noch in der Lage ist, parallel zu seiner Zwangshandlung andere Dinge zu tun.
quality.flashbacks.desc=Wenn du diesen Nachteil wählst, entscheidest du dich für ein bestimmtes Ereignis, um das es in den Flashbacks geht (hierbei kann es sich auch um ein Ereignis im Spiel handeln, das dazu führt, dass der Charakter diesen Nachteil erhält).\nZusätzlich musst du mindestens einen und vielleicht noch weitere Auslöser festlegen. Diese Trigger sollten multisensorisch und recht spezifisch sein, sodass sie nicht allzu alltäglich sind. Wenn der Charakter in Kontakt mit dem Auslöser kommt, muss ihm eine Selbstbeherrschungsprobe (4) gelingen \u2013 andernfalls wird ein Flashback ausgelöst.\nMit Beginn des Flashbacks legst du eine weitere Selbstbeherrschungsprobe (3) ab; gelingt sie, ist dem Charakter bewusst, dass er gerade einen Flashback durchlebt, und er kann die Zähne zusammenbeißen. Er erhält während der Dauer des Flashbacks trotzdem einen Würfelpoolmalus von -4 auf alle Proben, bei denen körperliche Attribute zum Einsatz kommen. Scheitert die zweite Selbstbeherrschungsprobe, kann der Charakter nichts anderes tun als auf den Flashback zu reagieren.
quality.maybe_you_missed_something.desc=Wann immer du dich in einer möglicherweise gefährlichen Situation befindest, musst du alles in deiner Macht Stehende tun, um nach potenziellen Bedrohungen zu suchen. Sollte ein anderes Mitglied des Teams das bereits getan haben, musst du mindestens so viel Zeit dafür aufwenden wie er/sie. Damit geht natürlich einiges an Frustration einher (wenn zum Beispiel der Decker den Straßensamurai kritisiert, weil er \u201Ealles noch mal überprüfen muss\u201C).
quality.phobia_common.desc=Du wirst dich niemals freiwillig dem Auslöser deiner Phobie annähern, und wenn du dazu gezwungen bist (sich der Auslöser also nah genug befindet, um davon auszugehen, dass er dich unmittelbar beeinflussen könnte), kannst du weder Edge ausgeben noch Edge erhalten. Zusätzlich erhältst du einen Würfelpoolmodifikator von -2 auf alle Proben außer Schadenswiderstandsproben, während du von der Phobie betroffen bist. Alle 5 Minuten musst du eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt diese, brichst du komplett zusammen, kauerst dich in Embryonalhaltung zusammen und hoffst, dass der Auslöser deiner Phobie einfach irgendwie von selbst verschwindet.
quality.phobia_uncommon.desc=Du wirst dich niemals freiwillig dem Auslöser deiner Phobie annähern, und wenn du dazu gezwungen bist (sich der Auslöser also nah genug befindet, um davon auszugehen, dass er dich unmittelbar beeinflussen könnte), kannst du weder Edge ausgeben noch Edge erhalten. Zusätzlich erhältst du einen Würfelpoolmodifikator von -2 auf alle Proben außer Schadenswiderstandsproben, während du von der Phobie betroffen bist. Alle 5 Minuten musst du eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt diese, brichst du komplett zusammen, kauerst dich in Embryonalhaltung zusammen und hoffst, dass der Auslöser deiner Phobie einfach irgendwie von selbst verschwindet.
quality.phobia_rare.desc=Du wirst dich niemals freiwillig dem Auslöser deiner Phobie annähern, und wenn du dazu gezwungen bist (sich der Auslöser also nah genug befindet, um davon auszugehen, dass er dich unmittelbar beeinflussen könnte), kannst du weder Edge ausgeben noch Edge erhalten. Zusätzlich erhältst du einen Würfelpoolmodifikator von -2 auf alle Proben außer Schadenswiderstandsproben, während du von der Phobie betroffen bist. Alle 5 Minuten musst du eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt diese, brichst du komplett zusammen, kauerst dich in Embryonalhaltung zusammen und hoffst, dass der Auslöser deiner Phobie einfach irgendwie von selbst verschwindet.
quality.phobia_very_rare.desc=Du wirst dich niemals freiwillig dem Auslöser deiner Phobie annähern, und wenn du dazu gezwungen bist (sich der Auslöser also nah genug befindet, um davon auszugehen, dass er dich unmittelbar beeinflussen könnte), kannst du weder Edge ausgeben noch Edge erhalten. Zusätzlich erhältst du einen Würfelpoolmodifikator von -2 auf alle Proben außer Schadenswiderstandsproben, während du von der Phobie betroffen bist. Alle 5 Minuten musst du eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt diese, brichst du komplett zusammen, kauerst dich in Embryonalhaltung zusammen und hoffst, dass der Auslöser deiner Phobie einfach irgendwie von selbst verschwindet.
quality.broken_code.desc=Einen persönlichen Verhaltenskodex hinter sich zu lassen bringt mehrere Probleme mit sich. Zum einen sind da die Leute, die wissen, dass es früher einen Kodex gab, der einen Teil der Persönlichkeit des Charakters ausmachte. Die Tatsache, dass der Charakter damit einen zentralen Teil seiner Identität aufgegeben hat, löst bei anderen in der Regel negative Reaktionen aus. Daher kann der Charakter kein Edge bei sozialen Proben erhalten oder ausgeben, an denen Personen beteiligt sind, die wissen, dass er früher einem Kodex gefolgt ist.\n\nDazu kommt, dass Charaktere mit dem Nachteil Gebrochener Kodex oftmals das Gefühl haben, dass in ihrem Leben etwas fehlt, etwas, das ihnen früher Sinn und Leitstrahl zugleich war. Das führt dazu, dass sie sich in sozialen Situationen teils unberechenbar verhalten \u2013 was manchmal allerdings auch ein Vorteil sein kann. Ein Charakter mit dem Nachteil Gebrochener Kodex ersetzt bei allen sozialen Proben einen Würfel aus seinem Würfelpool durch den Schicksalswürfel, solange er nicht (über eine beliebige Anwendungsmöglichkeit für Edge) Edge für diese Probe ausgibt.
quality.penitent.desc=Ein Charakter mit dem Nachteil Reumütig hat seinem Kodex abgeschworen, um danach eine Weile ohne ihn durchs Leben zu irren und anschließend zu dem Entschluss zu kommen, dass das Leben mit dem Kodex doch besser war. Also ist er zu seinem Kodex zurückgekehrt. Der Charakter erhält seinen vorherigen Nachteil Ehrenkodex zurück, allerdings mit einer wichtigen Änderung: Die Zeiträume für negative Auswirkungen bei Kodexverstößen werden verdoppelt.\nDer reumütige Charakter ist besonders entschlossen, seinem Kodex nun treu zu bleiben. Außerdem erhält der Charakter eine Wissensfertigkeit zu einem mit seinem Kodex in Verbindung stehenden Thema.
quality.rebound.desc=Manchmal führt das Leben uns auf seltsame Pfade, und am Ende gehen wir mit ganz anderen Überzeugungen durch das Leben als zu Beginn. Der Nachteil Neuer Ehrenkodex entspricht dem Nachteil Ehrenkodex, verleiht allerdings keinen neuerlichen Karmabonus. Der Charakter hat den herausfordernden Prozess durchlaufen, seine Überzeugungen zu verändern, und nun hat er etwas Neues, das ihn im Leben leitet.
quality.no_code.desc=In vielerlei Hinsicht ähnelt dieser Nachteil der Art, auf die ohnehin viele Shadowrunner durchs Leben gehen \u2013 von Moment zu Moment und ohne übergreifende Philosophie, die ihre Taten beeinflusst. Dieser Nachteil ist also damit vergleichbar, den Nachteil Ehrenkodex gar nicht zu besitzen \u2013 aber es gibt einen entscheidenden Unterschied. Nicht alles kann man einfach so hinter sich lassen, und auch in der Interaktion mit jenen, die dem ehemaligen Kodex des Charakters weiterhin folgen, können Verbitterung und Unbehagen mitschwingen. Wenn der Charakter jemandem begegnet, der seinem ehemaligen Kodex folgt, kann er in sozialen Interaktionen mit solchen Personen kein Edge erhalten (allerdings bereits vorhandenes Edge ausgeben).
quality.double_sure.desc=Charaktere mit diesem Nachteil sind besonders vorsichtig, wenn sie sich in potenziell gefährliche Situationen begeben. Sie gehen niemals um eine nicht aufgeklärte Ecke, betreten keine dunklen Räume und tun auch nichts Vergleichbares, solange sie nicht sicher sind, dass jemand oder etwas (wie eine Drohne oder ein Geist) sich zuerst dort umgesehen hat. Sie achten darauf, sämtliche Informationen, die sie von einer Connection erhalten, über eine weitere Connection zu verifizieren, und sie versuchen, all ihre Informationen immer aus mindestens zwei verschiedenen Quellen zu beziehen. Das verlangsamt ihre Fortschritte, hat aber auch seine Vorteile. Der Charakter erhält einen Würfelpoolbonus von +2 auf alle Überraschungsproben.
quality.reconditioning.desc=Der Charakter entwickelt Gewohnheiten und feste Reaktionen auf seine Ängste und kann mit diesen daher besser umgehen, wenn sie auftreten. Größtenteils kann er normal handeln, ohne ständig Vorwarnungen und Nachkontrollen zu benötigen. Bei erhöhtem Stresslevel kann die Spielleiterin jedoch eine Selbstbeherrschungsprobe (2) verlangen, um zu prüfen, ob der Charakter für die Dauer der jeweiligen Situation wieder in die Verhaltensmuster des Nachteils Doppelt hält besser zurückfällt.\nNach einem halben Jahr mit dem Nachteil Rekonditionierung kann der Charakter den Nachteil Phobie ablegen, falls er diesen erhalten hat. Der Nachteil Traumatische Erinnerungen bleibt jedoch \u2013 falls vorhanden \u2013 erhalten.
quality.violence_prone.desc=Der Charakter glaubt, dass man zurückschlagen sollte, wenn man geschlagen wird. Er ist immer bereit für einen Kampf. Der Nachteil daran ist, dass er bei sozialen Proben, mit denen er oder sein Team versuchen, eine Situation gewaltfrei zu lösen, weder Edge erhalten noch ausgeben kann. Außerdem muss er eine erfolgreiche Probe auf Selbstbeherrschung (2) ablegen, um sich nicht direkt in den Kampf zu stürzen, wenn in seiner Umgebung Gewalt ausbricht. Im Gegenzug ist es sehr schwierig, den Charakter zu überraschen, da er so gut wie immer kampfbereit ist, was ihm 1 Edge für das Ablegen von Überraschungsproben einbringt.
quality.heedless.desc=Ein Charakter mit diesem Nachteil muss in jeder Situation, in der es einen Gegner gibt, eine Probe auf Selbstbeherrschung (2) ablegen. Misslingt die Probe, greift der Charakter sofort denjenigen an, den er als die Ursache des Problems wahrnimmt. Das muss nicht heißen, dass er sofort zu tödlichen Maßnahmen greift \u2013 vielleicht schlägt er den Gegner auch nur, um seine Aufmerksamkeit zu gewinnen oder seinen Standpunkt deutlich zu machen. Aber da Gewalt die Tendenz hat, jedwede Situation eskalieren zu lassen, verursacht er dadurch trotzdem oft mehr Probleme, als er löst.\nRücksichtslose Charaktere lassen sich nur äußerst schwer überraschen, da sie immer kampfbereit sind.Ihr Schwellenwert für Überraschungsproben ist 1; zusätzlich erhalten sie 1 Edge für das Ablegen von Überraschungsproben.
quality.coping.desc=Ein Charakter, der diesen Nachteil erhält, hat eingesehen, dass er zu oft mit Gewalt reagiert, und möchte diese Tendenzen besser unter Kontrolle bekommen. Vielleicht zählt er bis zehn, atmet tief durch oder greift auf andere Techniken zurück, die ihm helfen, sich zu entspannen und sich auf andere Lösungen als Gewalt zu konzentrieren. Wenn er nicht in der Lage ist, diese Techniken einzusetzen, muss er eine Probe auf Selbstbeherrschung (2) ablegen, bei deren Misslingen er doch auf Gewalt zurückgreift. Es gelten die Regeln für den Nachteil Hang zur Gewalt. Der Charakter erhält 1 Edge, wenn er versucht, andere davon zu überzeugen, keine Gewalt einzusetzen oder eine angespannte Situation zu entschärfen (nur 1 Edge pro Versuch, auch bei längeren Diskussionen).
quality.selective_numbing.desc=Charaktere mit diesem Nachteil sind in der Lage, ihre Emotionen auszuschalten \u2013 dadurch, dass sie nichts mehr fühlen, fühlen sie auch nichts Negatives mehr. Diese Technik eignet sich gut für den Umgang mit Angst und Wut, bringt aber gewisse Schwierigkeiten mit sich, wenn soziale Interaktion gefragt ist. Da sich Emotionen nicht so binär wie ein Lichtschalter ein- und ausschalten lassen, kann das Ausschalten in einer Situation, in der das von Vorteil ist, auch dazu führen, dass sie weiterhin deaktiviert sind, wenn sie schon wieder nützlich wären. Bei diesem Nachteil hält die emotionale Betäubung nach ihrer Aktivierung 6 Stunden lang an. Nach dem Ende dieser Zeit kann die Betäubung 12 Stunden lang nicht erneut aktiviert werden.\n\nWährend sich ein Charakter in diesem Zustand befindet, erhält er einen Würfelpoolbonus von +2 auf alle Selbstbeherrschungsproben und Widerstandsproben gegen Zauber wie Verwirrung, Chaos und Gedanken Beherrschen sowie Critterkräfte wie Verwirrung und Grauen. Allerdings kann der Charakter während dieser Zeit kein Edge für soziale Proben erhalten oder ausgeben.
quality.state_of_zen.desc=Wenn ein Charakter diesen Schritt erreicht, hat er gelernt, die Wogen seiner Emotionen zu glätten. Er ist nun in der Lage, sie selektiv zu dämpfen, anstatt sie komplett abzuschalten. Er erhält einen Würfelpoolbonus von +1 bei Widerstandsproben gegen Zauber wie Verwirrung, Chaos und Gedanken Beherrschen sowie Critterkräfte wie Verwirrung und Grauen.

item.mtoc_mark1.desc=Das Mark I wurde für Sicherheitskräfte und Polizisten entworfen und ist auf Situationen ausgerichtet, in denen diese ein größeres Maß an Koordination benötigen, beispielsweise bei Geiselnahmen, für die keine spezialisierten Eingreifteams zur Verfügung stehen. Das System ist auf Kosteneffizienz optimiert und kann daher auch an das Fußvolk unter den Streifencops verteilt werden. Das Mark I bietet standardmäßig eine verbesserte Bedrohungserkennung, eine Software zur Freund-/Feind-Erkennung (FFE) sowie eingeschränkte verbesserte Zielerfassung für mit Smartgunsystemen ausgestattete Waffen.\nAnmerkungen: Senkt den Schwellenwert für Wahrnehmungsproben zum Erkennen von Hinterhalten um 1. Die FFE-Software bietet einen Würfelpoolbonus von +1 auf Wahrnehmungsproben, mit denen entdeckt werden soll, ob ein Ziel eine versteckte Waffe trägt, oder mit denen ein Ziel mithilfe von Gesichtserkennungssoftware identifiziert werden soll. Alle verbundenen Smartgun-Waffen erhalten außerdem einen Angriffswertbonus von +1. Das Mark I kann mit bis zu neun Benutzern gleichzeitig betrieben werden.
item.mtoc_mark2.desc=Das Mark II ist auf Militäreinheiten im Fronteinsatz ausgelegt und verfügt damit teilweise über dieselben Fähigkeiten wie das Mark I, ist jedoch stärker für Kampfeinsätze anstatt auf Polizei- und Sicherheitsaufgaben optimiert. Das Mark II ist außerdem dafür bekannt, besonders widerstandsfähig gegenüber externen physischen Schadensquellen und Matrixschaden zu sein. Dank seiner modularen Bauweise lässt es sich zudem im Feld leichter instand setzen.\nAnmerkungen: Senkt den Schwellenwert für Wahrnehmungsproben zum Erkennen von Hinterhalten um 2. Alle verbundenen Smartgun-Waffen erhalten einen Angriffswert-Bonus von +1. Die verbesserte Verschlüsselung gewährt allen Verteidigungsproben gegen feindliche Cracken-Proben 1 zusätzlichen Erfolg. Die modulare Bauweise senkt den Schwellenwert für Reparatur-Proben um 2. Die robuste Konstruktion senkt sämtlichen erlittenen Körperlichen Schaden des Geräts um 1. Das Mark II kann mit bis zu 15 Benutzern gleichzeitig betrieben werden.
item.mtoc_mark3.desc=Da es speziell für den Einsatz durch Spezialeinheiten entwickelt wurde, bietet das Mark III einige der fortschrittlichsten taktischen Softwareprogramme auf dem Markt und erzeugt auf diese Weise ein Netzwerk, das sich deutlich schwieriger hacken lässt, während es gleichzeitig eine der besten bekannten Zielerfassungsunterstützungen zur Verfügung stellt. Natürlich haben all diese Vorteile auch ihren Preis. Um eine Überlastung des Systems zu verhindern, musste Pantheon die Anzahl der maximal aktiven Benutzer beschränken. Obwohl das durchaus eine gewisse Einschränkung ist, sind die meisten Teams von Spezialeinheiten relativ klein, sodass der Nachteil insgesamt nicht so schwer ins Gewicht fällt.\nAnmerkungen: Senkt den Schwellenwert für Wahrnehmungsproben zum Erkennen von Hinterhalten um 2. Alle verbundenen Smartgun-Waffen erhalten einen Angriffswert-Bonus von +2. Die verbesserte Verschlüsselung gewährt allen Verteidigungsproben gegen feindliche Cracken-Proben 3 zusätzliche Erfolge. Die modulare Bauweise senkt den Schwellenwert für Reparatur-Proben um 2. Die robuste Konstruktion senkt sämtlichen erlittenen Körperlichen Schaden des Geräts um 1. Aufgrund seiner spezialisierten Ausrichtung kann das Mark III nur mit maximal 10 Benutzern gleichzeitig betrieben werden.
item.artillery_barrage.desc=Diese App liefert zusätzliche Zielerfassungsdaten für ballistische Waffen wie Granatwerfer, Raketenwerfer oder Mörser, sodass diese präziser schießen können. Sie ermöglicht es dem Schützen zudem, Feuer aus einem mit einem Smartgunsystem ausgestatteten Sturmgewehr, Maschinengewehr oder einer Sturmkanone herabregnen zu lassen, als handle es sich dabei um eine Miniatur-Artilleriewaffe.\nRegeln: Würfelpoolbonus von +1 für Angriffsproben mit Granatwerfern, Raketenwerfern und Mörsern. Kein waffenbasierter Würfelpoolmalus beim Abfeuern von Sturmgewehren, Maschinengewehren oder Sturmkanonen, solange die App aktiv ist. Der Schütze muss immer mindestens über eine Sichtlinie zum Ziel verfügen oder dessen Position kennen.
item.door_gunner.desc=Die App Bordschütze enthält fortschrittliche Steuerungs- und Zielerfassungssoftware, die es einem anderen Teammitglied ermöglicht, die Steuerung einer montierten, per Fernzugriff kontrollierbaren Fahrzeugwaffe zu übernehmen. Da das Anwendungsgebiet dieser App sehr stark fokussiert ist und der Programmcode dem modernsten Stand der Technik entspricht, fühlt es sich an, \u201Eals würde man die Waffe selbst in den Händen halten\u201C \u2013 so heißt es zumindest im Werbeslogan.\nRegeln: Diese App erlaubt es einem Anwender/Schützen, eine Fahrzeugwaffe mit seinem Kommlink oder seinen AR-Handschuhen zu steuern, ohne dabei einen Würfelpoolmalus zu erleiden. Der Schütze muss jedoch in der Lage sein, Smartlink-Zielerfassungsdaten zu empfangen.
item.co-pilot.desc=Diese App erlaubt es einem Teammitglied, die Kontrolle über ein mit dem Netzwerk verbundenes Fahrzeug oder eine Drohne zu übernehmen, sodass sich der Rigger auf andere Aufgaben konzentrieren kann. Die Verwendung dieser App zum Steuern von Fahrzeugen oder Drohnen gilt jedoch nicht als optimal.\nRegeln: Wenn ein Fahrzeug mithilfe dieser App gesteuert wird, kann der neue Fahrer/Pilot dazu sein Kommlink oder seine AR-Handschuhe verwenden, allerdings mit einem Würfelpoolmalus von -1. Beim Steuern von Drohnen kann der Pilot die Drohne nur so steuern, als würde er eine Riggerkonsole verwenden.
item.ecm_warrior_ii.desc=Der Angriff und die Blockierung von Matrixressourcen sind zentrale Standbeine der modernen Kampfführung. Die App ECM-Krieger unterstützt den Anwender dabei, feindliche Netzwerke anzugreifen und das eigene zu verteidigen, indem sie ihm zusätzliche \u201Eelektronische Munition\u201C zur Verfügung stellt, um feindliche Hacker zu attackieren und dabei eventuell vorhandenes Rauschen zu überwinden.\nRegeln: Würfelpoolbonus von +2 auf alle offensiven Cracken-Proben, während die App verwendet wird. Sämtliches Rauschen im Umkreis von [Gerätestufe × 5] Metern um das Gerät, auf dem die App läuft, wird um 2 gesenkt.
item.junk_wall.desc=Junk Wall erzeugt mehrere Schichten aus gutartigem \u201EMüllcode\u201C und fügt sie dem Netzwerk und der Firewall aller anderen verbundenen Geräte hinzu. Um auf die verbundenen Geräte zugreifen zu können, müssen gegnerische Hacker sich erst durch die zusätzlichen Schichten schneiden.\nRegeln: Die Firewallstufe einer mit dem M-TOC verbundenen Cyberbuchse oder Riggerkonsole wird um die halbe Gerätestufe des M-TOC (aufgerundet) erhöht.
item.mobile_medic.desc=Diese App ist darauf ausgelegt, in direkter Kombination mit einem Medkit eingesetzt zu werden, und versorgt den Anwender bei der Behandlung von Verwundeten mit zusätzlichen Informationen und Instruktionen. Die App updatet sich ständig mit den neuesten notfallmedizinischen Daten und kann daher auch Personen anleiten, die nicht wissen, wie man medizinische Hilfe leistet.\nRegeln: Addiere die halbe Gerätestufe des M-TOC zum Würfelpool der Erste-Hilfe-Probe des Anwenders, oder erhöhe die Stufe eines Medkits um +1.
item.team_leader.desc=Ein Team in einer Kampfsituation zu führen ist eine anspruchsvolle und oftmals chaotische Sache. Die App Team Leader versorgt Teamführer mit Datenprojektionen zur derzeitigen taktischen Lage, die auf Sensordaten, den Vitaldaten des Teams, dem Waffenstatus und anderen Umweltfaktoren basieren. Die App unterstützt auf diese Weise bei Entscheidungsprozessen und bei der Koordination des Teams.\nRegeln: Diese App stellt einen Pool an Bonuswürfeln in Höhe der Gerätestufe des M-TOC zur Verfügung, die für folgende Proben genutzt werden können: Teamwork, Navigation, Wahrnehmung und Kampfmanöverproben. Dieser Würfelpool kann aufgeteilt und je nach Bedarf zugewiesen werden, er frischt sich jedoch während eines Kampfes nicht auf.
item.target_artist.desc=Die App Kunstschütze ist für den Einsatz in Kombination mit der App Artilleriebeschuss entworfen worden und kommt dann zum Einsatz, wenn der Schütze keine Sichtlinie zum Ziel hat oder wenn er ein in Deckung/Tarnung befindliches Ziel angreifen möchte. Die App verwendet Zielerfassungsdaten einer Quelle, die über eine Sichtlinie zum Ziel verfügt (beispielsweise ein anderes Teammitglied oder eine Drohne), und markiert das Ziel oder den Zielbereich für den Schützen, sodass er trotz der widrigen Umstände einen Schuss abgeben kann. Als Sekundärfeature verfügt die App über die Möglichkeit, Ziele, Hindernisse oder Gefahren sehr schnell zu identifizieren und auf einem Karten-Overlay zu markieren.\nRegeln: Erlaubt es dem Schützen, auch ohne direkte Sichtlinie anzugreifen. Markierte Ziele können als Jederzeit-Handlung mit der Handlung Ziel ansagen beschossen werden.
item.sneak_sneak.desc=Sneak-Sneak setzt eine Kombination aus Tracking-Algorithmen und Bildauswertungssoftware ein, um den Anwender dabei zu unterstützen, unbemerkt vorzugehen: Die App weist auf potenzielle Gefahren oder Hindernisse hin, die Feinde auf die Anwesenheit des Anwenders aufmerksam machen könnten, und schlägt alternative Wege/Vorgehensweisen vor.\nRegeln: Der Anwender erhält einen Würfelpoolbonus von +2 auf alle Proben auf Heimlichkeit (Schleichen).

item.ruthenium_rifle_sheath.desc=Bitte als Einbau löschen und als Modifikation hinzufügen.
itemmod.ruthenium_coating.desc=Ruthenium in den falschen Händen führt zu Dummheiten, aber manchmal findet man etwas, wofür es perfekt geeignet ist. Diese Beschichtung ist eine dünne, photovoltaische Schicht aus Ruthenium, die jeden Quadratzentimeter einer Waffe bedeckt. Die Waffe verschmilzt mehr oder weniger mit der Umgebung oder verschwindet vor einem Hintergrund. Sogar Nahkampfwaffen können diese Modifikation verwenden, aber wiederholte Treffer oder Blut, das auf sie gerät, machen den Effekt zunichte. Diese Modifikation erhöht die Tarnbarkeit gegen optische Entdeckung um 1. Eine heruntergefallene Waffe hat eine Tarnbarkeit von mindestens 4 (oder 1 mehr als normal). Bei Nahkampfwaffen (Seite 61) hat der erste Angriff einen um 4 erhöhten Angriffswert. Nach diesem Angriff ist eine Haupthandlung nötig um die Waffe zu reinigen oder das System zu resetten, damit dieser erhöhte Wert wieder gilt.

action.i_saw_it_in_a_trid_once.desc=Ein Charakter kann eine beliebige Kampfkunsttechnik, die er noch nicht mit Karma erlernt hat, als Teil seiner nächsten Handlung benutzen. Dieser Einsatz von Edge kann in seinen Kosten nicht durch Kampfkunsttechniken reduziert werden, die der Charakter bereits mit Karma gelernt hat.
action.recover.desc=Du gibst eine Haupthandlung aus, um dich von einem einschränkenden Status zu befreien oder ihn, wenn er Stufen hat, um 1 Stufe zu senken.
