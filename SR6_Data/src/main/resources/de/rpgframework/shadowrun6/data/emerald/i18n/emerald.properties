quality.you_get_used_to_it=You get used to it
quality.you_get_used_to_it.page=46
quality.you_get_used_to_it.desc=Auburn's full of toxins, from the air to the water to the dirt you played in as a kid. Not all the kids make it, but the ones who do grow up tough.<br/>Gain +1 Body for any Toxin Resistance test.

quality.guardians_at_the_gates=Guardians at the Gates
quality.guardians_at_the_gates.page=60
quality.i_belong_here=I Belong Here
quality.i_belong_here.page=60
quality.i_belong_here.desc=People who spend their time around security learn how to treat them in a way that makes those interactions go much smoother than they would with the average wageslave. Bellevue people go even further. They know the cops are here to protect them, not bust them. The cops know it as well.<br/>You know the ins and outs of dealing with local security. You carry yourself with a presence that gives you a reduced chance of being stopped by the police. You also act the part well enough to not get in trouble when you do. You gain a point of Edge on all social interactions involving local security.
quality.so_many_rich_friends=So many rich friends
quality.so_many_rich_friends.page=60

quality.council_island_access=Council Island Access
quality.council_island_access.page=72
quality.salish_shaman=Salish Shaman
quality.salish_shaman.page=72
quality.salish_shaman.desc=Whether you were born Salish or not, you got training among the shamans or from an exiled shaman from Council Island. Thanks to your training, your use of reagents is twice as effective.<br/>You can use reagents from other traditions as normal, and when you use reagents for your tradition, it only requires half the normal amount (rounded up, always a minimum of 1).

quality.big_brothers_blindspot=Big Brother’s Blindspot
quality.big_brothers_blindspot.page=85
quality.big_brothers_blindspot.desc=In the AAA megacorporate backyard, privacy is rare. There’s monitoring everywhere, making it difficult to stay in the shadows. You’ve got a highly tuned sense for surveillance, granting you a bonus against being caught on camera and slipping in where the eyes aren’t. Of course, knowing about those blind spots also means you’re keener on where others might try to slip in.<br/><br/>\
• <b>Cost:</b> 14 Karma<br/>\
• <b>Game Effect:</b> You gain one bonus point of Edge on Stealth tests when evading technological surveillance such as cameras and other sensors. You also gain a bonus point of Edge on Perception tests when using technological surveillance. This bonus Edge is lost if not spent on that test. In addition, you gain the Surveillance Technology knowledge skill.
quality.corp_flash=Corp Flash
quality.corp_flash.page=85
quality.corp_flash.desc=Some runners come from the heady heights of the enclaves. Others have to study them from afar. Either way, you’re tuned in to the fashions, ways, means, and mannerisms of corporate style and etiquette. Whatever your method, you’ve learned how to blend in to a corp’s culture, and that’s an advantage, whether you’re pulling a con or brokering at the bargaining table.<br/><br/>\
• <<b>Cost:</b> 10 Karma<br/>\
• <b>Game Effect:</b> You gain one bonus edge on Con and Etiquette checks when attempting to blend in to corporate culture. If this bonus edge is not used on the check, it is lost. In addition, you gain the Fashion knowledge skill.
quality.paparazzi_savvy=Paparazzi Savvy
quality.paparazzi_savvy.page=85

quality.border_hopper=Border Hopper
quality.border_hopper.page=97
quality.northgate_optimist=Northgate Optimist
quality.northgate_optimist.page=97
quality.northgate_optimist.desc=Being in Everett fills you with energy and enthusiasm, and that can be infectious to those around you.<br/>Characters with this quality gain a bonus point of Edge on any social test with people working or living in Everett.
quality.union_supporter=Union Supporter
