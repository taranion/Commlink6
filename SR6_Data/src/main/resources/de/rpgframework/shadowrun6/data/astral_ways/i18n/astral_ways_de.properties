contacttype.free_spirit=Freier Geist
contacttype.free_spirit.page=27
contacttype.free_spirit.desc=Freie Geister sind auf der physischen Ebene häufiger geworden, und viele von ihnen pendeln zwischen ihrer metaplanaren Heimat und der Erde und verbringen Zeit an beiden Orten. Sie bieten Dienstleistungen im Austausch gegen Wertgegenstände und Karma an, und die Weltlicheren unter ihnen besitzen sogar Geld. Zusätzlich zur direkten Unterstützung durch den Einsatz von Kräften kann ein freier Geist als Connection eine Quelle wertvoller Informationen und ein Guide durch die Metaebenen sein oder sogar Zugang zu den Metaebenen ermöglichen, indem er seine Kraft Astrales Tor oder Metaplanares Tor einsetzt.<br/>\
 Freie Geister als Connections können nur einen Typ haben: Freier Geist. Sie übernehmen vielleicht andere Rollen, Pflichten und Aufgaben, aber auf der physischen Ebene sind sie Außenseiter. Die Einflussstufe eines freien Geistes entspricht oft seiner Kraftstufe, kann jedoch je nach Verhalten des Geistes variieren.<br/>\
 Die Loyalitätsstufe eines freien Geistes kann bei der Charaktererschaffung maximal 4 betragen

