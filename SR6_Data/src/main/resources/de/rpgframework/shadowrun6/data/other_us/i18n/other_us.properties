mentorspirit.adversary.disadvantage=Adversary followers have issues with authority figures and a constitutional inability to shut up about the indignation of subjugation. When given orders or instructions that don’t match their own desires and goals, or even when given those orders brusquely or rudely, an Adversary follower must succeed on a Composure test (3) to follow those instructions instead of doing what they want, instead. In addition, if browbeaten, bullied, or controlled (such as by successful application of the Intimidation  skill  or  by  certain  Manipulation  spells), they take a –1 dice pool modifier on all actions until they (often violently) re-assert their dominance and independence.  Finally,  whenever  an Adversary  follower takes part in Teamwork tests as a helper, they add one die to the leader’s dice pool for every two hits they roll.

