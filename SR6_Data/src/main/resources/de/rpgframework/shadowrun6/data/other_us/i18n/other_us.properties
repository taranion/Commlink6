item.hitch_trailer.desc=Hooking up a trailer or a sidecar requires a hardpoint attachment device. Smaller trailers attach with a hitch; which uses a standard hardpoint.
item.hitch_connector.desc=Hooking up a trailer or a sidecar requires a hardpoint attachment device. Sidecars need a universal connector; which uses a standard hardpoint.
item.hitch_fith_wheel.desc=Hooking up a trailer or a sidecar requires a hardpoint attachment device. Semi-trailers require a fifth wheel that must be attached to a large hardpoint.
item.hitch_construction.desc=Heavy Construction equipment, such as a boom crane, a bulldozer blade or a backhoe bucket may also be attached to a vehicle or drone that has an open huge hardpoint. For simplicity, assume all such devices have the same price and availability. 
