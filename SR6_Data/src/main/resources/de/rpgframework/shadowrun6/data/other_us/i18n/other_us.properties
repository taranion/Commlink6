quality.you_get_used_to_it.desc=Auburn's full of toxins, from the air to the water to the dirt you played in as a kid. Not all the kids make it, but the ones who do grow up tough.<br/>Gain +1 Body for any Toxin Resistance test.
quality.i_belong_here.desc=People who spend their time around security learn how to treat them in a way that makes those interactions go much smoother than they would with the average wageslave. Bellevue people go even further. They know the cops are here to protect them, not bust them. The cops know it as well.<br/>You know the ins and outs of dealing with local security. You carry yourself with a presence that gives you a reduced chance of being stopped by the police. You also act the part well enough to not get in trouble when you do. You gain a point of Edge on all social interactions involving local security.
quality.salish_shaman.desc=Whether you were born Salish or not, you got training among the shamans or from an exiled shaman from Council Island. Thanks to your training, your use of reagents is twice as effective.<br/>You can use reagents from other traditions as normal, and when you use reagents for your tradition, it only requires half the normal amount (rounded up, always a minimum of 1).
quality.big_brothers_blindspot.desc=In the AAA megacorporate backyard, privacy is rare. There's monitoring everywhere, making it difficult to stay in the shadows. You've got a highly tuned sense for surveillance, granting you a bonus against being caught on camera and slipping in where the eyes aren't. Of course, knowing about those blind spots also means you're keener on where others might try to slip in.<br/>You gain one bonus point of Edge on Stealth tests when evading technological surveillance such as cameras and other sensors. You also gain a bonus point of Edge on Perception tests when using technological surveillance. This bonus Edge is lost if not spent on that test. In addition, you gain the Surveillance Technology knowledge skill.
quality.northgate_optimist.desc=Being in Everett fills you with energy and enthusiasm, and that can be infectious to those around you.<br/>Characters with this quality gain a bonus point of Edge on any social test with people working or living in Everett.

quality.bilko_contacts.desc=At some point in your past or career, you’ve made well-placed and loyal contact with one or several Bilkos at Fort Lewis. As such, gear or information is easier for you to obtain-but it still costs (just not as much).<br/>Depending on Karma cost, availability for gear obtained through contact is at –1/–2 and the contact’s connection rating is increased by +1/+2. Must create contact at character generation; all other contact rules apply. Can purchase this quality for multiple contacts.
quality.water_born.desc=You’ve spent so much time living on the islands, living in the water is second nature to you.<br/>Your base swimming speed is increased by 1 meter for each level of this trait (maximum 2).
quality.the_briar_patch.desc=Barrens Matrix connectivity is very outdated. Even with the wireless revolution, there are many dead zones and a scattering of noiseless islands that GOD would have trouble finding. Only those who have lived here have an intimate relationship to all of Puyallup’s features and hardpoints, and those who know the ins and outs can outfox those who don’t.<br/>When hacking while physically located in Puyallup, reduce OS by 1 for every Illegal action performed. 
quality.what_doesnt_kill_you.desc=Puyallup is a hard place to live. If you’re not choking on acidic mist or ash, you’re trying to hold down toxic or moldy leftovers so you don’t starve. Then there are various diseases and bacterial infections that you just have to burn through because medicine isn’t available. But those who survive are tougher for it. <br/>Replace one die in your pool with a wild die when rolling any disease or toxin test. 
quality.good_ol_folks.desc=Either you grew up in a rural setting or you’ve spent a lot of time there, so you know how to fit in with the “country folk.” You know how to dress, how to act, what to say, and what not to say to blend right in and not draw any unwanted attention from the locals.<br/>You gain a point of Edge during any social interaction with people living in, or from, a rural setting.
quality.clean_living.desc=You grew up in the heart of the breadbasket and always ate the best food, and it made you nice and healthy, just like your parents promised.<br/>You can increase your Body attribute by 1 immediately upon selecting this quality, with no Karma cost, but you must increase all Lifestyle costs by 500 nuyen per month. Failure to keep up the cost of your food Lifestyle or extended periods in a place without quality food results in a loss of the 2 Body points (minimum 1) until your diet can be fixed or the food Lifestyle can be paid. This does not increase your maximum Body attribute.
quality.import_export.desc=When you’ve got this many borders and the docks, you’d be a fool not to have one ear on the ground to hear what’s coming down the pipes. That much product means there’s always someone who will sell low or buy high, and you’ve got the inside track to make the best of it.<br/>You gain a special Tacoma Traders (Fixer) contact with Loyalty rating of 1. This contact has a Connection rating of 3 if you buy this quality for 10 Karma or it has a Connection rating of 4 if you spend 14 Karma. In addition, you gain a bonus point of Edge on negotiation tests made to purchase or sell goods through this contact. If this bonus Edge is not spent on the test, it is lost. 
quality.mental_mapmaker.desc=You’ve lived in the ever-changing Underground so long you can make and keep a mental map in your head. The same process seems to work in the labyrinthine halls of colleges and corporate offices. During regular activities, you can keep track of where you are at and not get lost inside any confined structure or building (not out in a forest).<br/>When things are hectic (active combat, operating in initiative, etc.) and you make a Move action, you can spend a minor action alongside it to avoid getting lost when moving quickly. If actions are spent, you can follow this mental pathway back even in complete darkness or obscurity.

