item.ballistic_hood.desc=Much less conspicuous than a helmet or a mask, these hoods are made of ballistic cloth and match the style of the armor they’re attached to, including any Social Modifier. They can be added to anything that covers the torso and add a +1 to the armor’s Defense Rating. Hoods do not have any capacity rating on their own but are considered to have the modifications of the base armor. Hoods are headwear, and while they can be worn over a helmet or with a ballistic mask, they do not provide their additional protection when used with those items. A hood adds five percent to the total cost of the armor it’s attached to, including the cost of all modifications.
item.disposable_cloak.desc=Often worn over other outfits, the cloak is a ubiquitous accessory on Seattle streets. Ranging from the 5-nuyen disposable version to the 5,000-nuyen Très Chic, cloaks are available in an endless variety of styles. All cloaks have water-repellent coating as a standard feature, and many include an integrated (non-armored) hood.
item.armorweave_cloak.desc=Often worn over other outfits, the cloak is a ubiquitous accessory on Seattle streets. Ranging from the 5-nuyen disposable version to the 5,000-nuyen Très Chic, cloaks are available in an endless variety of styles. All cloaks have water-repellent coating as a standard feature, and many include an integrated (non-armored) hood. While these garments are not normally considered armor, cloaks made with Armorweave start at 200 nuyen and provide some light protection (+1 DR, not cumulative with worn armor other then headgear). These better-quality cloaks have a capacity of 4 and can accept any armor modifications.
item.tres_chick_cloak.desc=Often worn over other outfits, the cloak is a ubiquitous accessory on Seattle streets. Ranging from the 5-nuyen disposable version to the 5,000-nuyen Très Chic, cloaks are available in an endless variety of styles. All cloaks have water-repellent coating as a standard feature, and many include an integrated (non-armored) hood. While these garments are not normally considered armor, cloaks made with Armorweave start at 200 nuyen and provide some light protection (+1 DR, not cumulative with worn armor other then headgear). These better-quality cloaks have a capacity of 4 and can accept any armor modifications.
item.water_repellent_coating.desc=Special coating to handle Seattle rain.
item.mapmaster_sensor_fob.desc=In an attempt to get ahead of the competition in the Seattle Underground mapsoft market, Horizon has developed an entirely new, very accurate type of mapsoft system that operates without Matrix access. In addition to the standard mapsoft files, the MapMaster system incorporates a handheld LIDAR/ultrasound sensor fob that scans an underground location and matches it to its internally stored MapMaster topological database of the Seattle Underground. After a match of the area is confirmed, the integrated inertial compass keeps track of your location from that point on. Once the MapMaster fob reconnects to the Matrix, the database automatically updates and uploads your newly collected data, making the system even more accurate.<br/>Developed for use in the Seattle Underground, these devices are quickly becoming popular outside of Seattle. A few tweaks to the firmware will stop it from uploading your location data and can even completely sever it from Horizon’s network. It can then be uploaded with a user-generated map made with black-market MapMaster drones.<br/>The MapMaster sensor fob is available at ratings 1 through 6. Subscriptions are typically sold on a yearly basis; those who want it for a shorter period may just want to rent one for a month from a current subscriber. The device adds its rating as a dice pool bonus to Outdoors tests involving navigation when in the Underground or other area for which topographical data is available. The bonus is cut in half (rounded up) when the user is in areas that are newly excavated or not well mapped.
item.mapmaster_drone.desc=To accompany their MapMaster fob, Horizon has developed the MapMaster drone, a Horizon Flying Eye packed with LIDAR and ultrasound sensors. Only starting to trickle into the market, these little drones are being used by Horizon employees and are constantly flying through the Seattle Underground’s tunnels, adding new data to the Horizon MapMaster database.<br/>Of course, the street finds its own uses for things, and the MapMaster drones, or rather reverse-engineered knockoffs, have very quickly found their way into the hands of shadowrunners. They can be used to scout out an area, providing an accurate 3D map of a location that can be loaded into a hacked MapMaster fob tied to a commlink or an M-TOC system (p. 89, Firing Squad).<br/>The MapMaster drones are a variant of the standard Flying Eye with all the available modification space filled with the LIDAR/ultrasound sensors. Creating a custom map takes (1 x map rating) combat rounds of scanning for each 10 meter x 10 meter x 10 meter area mapped. The rating of the map determines how it can be used by a fob-rating 1 maps can only provide 1 bonus die for Outdoors tests related to navigation, regardless of the rating of the fob. Conversely, a rating 1 fob can only provide a dice pool bonus of 1, even when using a map with a higher rating.<br/>Multiple drones can be used at the same time to either stitch together a larger area map or to make a higher-rating map faster (two drones can make a rating 2 map in a single combat round, as long as they have full communication with each other for that time).<br/>Assuming you are in an area with no Matrix access, a rating 1 map using the MapMaster sensor fob’s inertial compass data is sufficient to replace the standard GPS signal used to mark team positions in the M-TOC system.

