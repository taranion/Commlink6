quality.s-k_swagger.desc=While employees and citizens of many corporations, especially extraterritorial ones, develop some form of classism, this attitude is very common within Saeder-Krupp. Classism is kind of like racism, but instead of hating people based upon their heritage, culture, skin color, ethnicity, or which type of meta you you are, classists despise people based on their social class and status. Usually, this means the rich hate the poor, but also corporate citizens hate non-corporate citizens and SINless people. Because of its predominance within S-K, the term “S-K Swagger” was coined for it, making it sound more friendly than it really is.<br/><br/>\
 <b>Bonus:<b> 5 Karma<br/>\
 <b>Game Effect:</b> While having this quality and interacting with current or former S-K corporate citizens (or other people having this quality), you gain an Edge on all Social Tests with these people. But when interacting with people either having a low or lower lifestyle, or who don’t have a SIN, you are unable to gain or use Edge while they are present (unless you’re attacking them).<br/>\
 <b>Note:</b> As is the case with the more general Prejudiced quality (p. 78, SR6), gamemasters and players should use this quality carefully. Everyone in the group should be on board with it being used, and it should never be used as a veiled excuse to state real-world prejudices or verbally attack, either directly or indirectly, other players.
quality.survival_of_the_fittest.desc=At some point in your life, you either made several runs for S-K that were successful, or you made at least one run against S-K, which had a lasting effect on the corp. In case of the latter, you either managed to execute the run with exceptional artistry, or you escaped S-K’s attempts to hunt you down. In any case, you left an impression on the people in charge. They may not like you (especially if you killed someone), but they nonetheless respect you on a professional level.<br/><br/>\
 <b>Cost:<b> 2 Karma (local), 4 Karma (regional), 6 Karma (global)<br/>\
 <b>Game Effect:<b> You gain 1 point of situational Edge on social tests with Saeder-Krupp employees when you are in the geography selected for this quality. Local geographies would be a single sprawl and outlying areas; regional geographies would be a small nation or significant portion of a larger nation (Switzerland, New England); global areas are, well, everywhere.
quality.human20.desc=Thanks to Shiawase genetic manipulations and selective breeding, they have managed to make the human genome just a little bit better. It’s up to you to meet your potential.<br/><br/>\
 <b>Cost:</b> 25 Karma<br/>\
 Game Effect: Your racial limit for Charisma and Willpower are increased by 1. You cannot be magically active or have Resonance.
quality.dog_on_a_leash.desc=You’ve come up through the Dog program. Whatever your focus was, the most important aspect was Loyalty, and that you have in spades.<br/><br/>\
 <b>Cost:</b> 8 Karma<br/>\
 <b>Game Effect:</b> Gain +2 to any Willpower test that would result in you harming, defaming, or letting harm come to, the Shiawase corporation.
quality.shinto_summoner.desc=Your focus in the ways of Shinto give you a particular affinity with spirits connected to that tradition.<br/><br/>\
 <b>Cost:</b> 2 Karma<br/>\
 <b>Game Effect:</b> Gain +1 to Summon rolls while in Shinto shrines.<br/>Corrupted spirits will always select you over any other target.
quality.fashion_influencer.desc=You have a way of doing things that makes other people want to do it the same way. When you share anything publicly—comments, videos, whatever — people pay attention and alter what they’re doing just a little bit to be more like you (though your look is not outrageous or attention-getting enough to count as the Distinctive Style quality).<br/><br/>\
 <b>Cost:</b> 5 Karma<br/>\
 <b>Game Effect:</b> When buying fashion clothing (anything that’s part of a named line, like Armanté or Zoé), you receive a fifty-percent discount, as designers and merchants want you to show off their wares.
quality.social_outcast.desc=You once had a place in high society, but situations change, and you’re on the outs.<br/><br/>\
 <b>Bonus:</b> 5 Karma<br/>\
 <b>Game Effect:</b> When you are intermingling with high society—for example, the type of people who inhabit the Grand Tour or similar social circuits — you always have to deal with the “Listener has strong personal dislike of talker” condition when determining social test Edge (p. 119. SR6).
quality.we_ship_anywhere.desc=Wuxing is no stranger to using its global shipping reach and extraterritorial privileges to move cargoes that local governments consider illegal. You have a connection in Wuxing that allows you to move a reasonable amount of cargo between major cities without fear of having it seized by local authorities.<br/><br/>\
 <b>Cost:</b> 4 Karma<br/>\
 <b>Game effect:</b> The definition of “reasonable amount” is at the gamemaster’s discretion, though generally the street value of the goods should not reach six figures. “Major cities” are cities with at least one million people. The time it takes to arrive is approximately one day per every 4,000 kilometers traveled (minimum one day).
