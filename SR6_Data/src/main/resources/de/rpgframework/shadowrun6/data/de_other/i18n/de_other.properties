item.krim_ultra_6.desc=Schaden gilt für Stahlkugeln. Mit der Ultra Kombat können auch Minigranaten verschossen werden, die Schaden je nach ihrem Typ verursachen. Die Stufe gibt wie bei Bögen die Mindeststärke an, die man braucht, um die Waffe bedienen zu können. \n \n Seit einigen Jahren erfreuen sich Fletschen wieder wachsender Beliebtheit im Pott. Mit den wachsenden Sicherheitsvorkehrungen am Fußballstadion entdeckten zunächst Ultras ihre Liebe zu den quasi unscanbaren Schleudern aus Karbon- und Kunststoffverbindungen, um Bengalos und anderes Feuerwerk in den Fanblock des Gegners zu schießen. Das führte zu einem reichlich debilen Wettrüsten unter den Hools, bei dem auch zunehmend technisierte Zwillen zum Einsatz kamen. Der Nimbus 2000 unter den Hightech-Fletschen ist die Krime Ultra Kombat, die gezielt für Leute mit extremer Kraft (seien wir ehrlich: Orks und Trolle) entwickelt wurde. Die Ultra Kombat verfügt über Protektoren für den Unterarm und ein integriertes Smartsystem, das Entfernungen und berechnete Flugbahnen von Massivgeschossen in Echtzeit anzeigt, um perfekte Zielgenauigkeit zu bieten.
