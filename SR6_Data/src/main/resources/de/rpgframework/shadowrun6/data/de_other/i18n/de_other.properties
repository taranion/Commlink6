item.mercedes_multimog-d1.desc=Das \u201EBasismodell\u201C des Multimogs (im Bild) erfreut sich als Alternative zum GMC Bulldog wachsender Beliebtheit. Speziell in Randgebieten und im Überlandverkehr sind Multimogs unverzichtbar zur Belieferung von Supermärkten und abseits gelegener Fertigungsanlagen. Die guten Panzerungseigenschaften machen den Multimog zudem für den Transport wertvoller Güter (Schmuck, Kunstgegenstände, Arzneimittel, Waffen, Computer) ideal. Alternative Konfiguration mit 2 Sitzen verfügbar.
item.mercedes_multimog-k4.desc=Feuerwehrwagen, Ackerschlepper, Geräteträger für die Forstwirtschaft, Nachschubwagen für militärische Einsätze, Ambulanz - es gibt kaum eine Anwendung, wofür es kein spezialisiertes Multimog-Modell gibt. Der K4 \u201EGreif\u201C (#arsenal) wurde als mobile und gepanzerte Kommandozentrale konzipiert. Der Greif verfügt über Riggerkontrollen, ECM/ ECCM, zwei Start-/Landplattformen für Überwachungs- und Geleitschutzdrohnen sowie einen Matrix-Satellitenlink. Alternative Konfiguration mit 2 Sitzen verfügbar.

item.bmw_blitzen_2080.desc=Die BMW Blitzen ist DER Kult-Klassiker unter den Combatbikes, und das nicht nur wegen der Popularität des Modells bei Combatbiking-ProTeams.\nDie aktuellste Inkarnation der Blitzen ist stark an das klassische Design des Ursprungsmodells angelehnt. Das gepanzerte Frontmodul wurde im Vergleich zum 2050er Modell verkleinert und ummantelt nun nicht länger das komplette Vorderrad. Zudem die reduzierte Größe des Schutzschilds der Sicherheit des Fahrers keinen Abbruch tut: Dieser kann vollständig hinter dem Windschutz in Deckung gehen und hat dank sechs im \u201ESchlitz\u201C des Schildes angeordneten Mikrokameras trotzdem vollen Blick auf die Strecke (über Monitore oder direkt per AR/VR).

item.merlin.desc=Der Merlin wurde Anfang der 2070er entwickelt als DIE Waffe für moderne Critterjäger: Die standardmäßige Smartgunverbindung erlaubt es in Verbindung mit dem extrem reaktionsfähigen und schnellen Trommelmotor, bei jedem Schuss exakt jene Kammer des Magazins anzuwählen, die der Nutzer wünscht. Silber, Gold, APDS, Gel, Schocker, Hohlspitz, Explo - wer zu Beginn des Kampfes nicht genau weiß, welche Munitionsart gegen den Feind die Beste ist, schätzt die "gedankenschnelle" Fähigkeit des Merlin, auf jede Bedrohung zu reagieren. Außerhalb von Critterjägerkreisen haben auch einige Polizei- und Sicherheitsdienste die Vorzüge des Merlin für sich entdeckt: Der schnelle Wechsel zwischen nonlethalen und extrem lethalen Munitionsarten bietet gerade Diensteanbietern in luxuriösen Wohnenklaven die perfekte Möglichkeit, höchstmögliche Wirksamkeit gegen den Schutz von Zivilpersonen situativ abzuwägen - und das dank der neuen Freund-Feind-Erkennung in der 2080er-Version "Mark Zwei" sogar automatisiert. Anmerkung: Besteht eine Smartgunverbindung, kann der Nutzer mit einer Nebenhandlung exakt festlegen, aus welcher Kammer der Trommel der nächste Schuss abgefeuert werden soll. Die Freund-Feind-Erkennung erlaubt es im Vorlauf eines Kampfes (oder durch eine Haupthandlung mitten im Kampf), das aktive PAN einer Person als Freund oder umgekehrt als Feind zu markieren, um versehentliche Schüsse auf diese Person zu blockieren oder umgekehrt nur dann zu schießen, wenn die markierte Person im Visier ist. 

item.hanseat.desc=Das HK G13 A1M ist ein speziell für maritime Einsätze entwickeltes Sturmgewehr. Das G13 A1M übernimmt viele Komponenten und technische Innovationen des HK DMR 11D [#sota:adl], das sich bei Einsatzkräften und Runnern als erfolgreicher Hybrid zwischen Sniper und Assault etabliert hat. In unserem Test trotzt der Hanseat allen Widrigkeiten von Wind, Wasser, Salz und Säure: Die einzigen Öffnungen und somit Angriffspunkte sind die speziell abgedichtete Mündung, der Zufuhrschacht für die hülsenlose Munition und eine ebenfalls abgedichtete, aber essenzielle Wartungsklappe zum Beseitigen etwaiger Blockaden. Auf der kurzen Unterlaufschiene können bei Bedarf ein Granatwerfer, ein taktisches Licht oder ein Lasermarkierer montiert werden. Serienmäßig sind ein Smartgunsystem und Schockpolster integriert. Für Unterwassereinsätze ist das G13 A1M zwar nicht geeignet, aber mittels eines speziellen Verschlusses lässt sich der Lauf wasserdicht versiegeln, so dass man das Gewehr beim Tauchgang mit sich führen und danach direkt einsetzen kann. Mokiert wird sich in Beeps allenfalls über die intensive Wartung: Dichtungen und bewegliche Teile müssen regelmäßig gefettet und sehr präzise eingesetzt werden, sonst droht Performance-Verlust. Die Qualitäten des Hanseaten haben sich auch bei Likedeelern und Penosen herumgesprochen: Die Nachfrage auf dem Schwarzmarkt ist groß, denn man will auf keinen Fall ins technische Hintertreffen geraten. Derzeit laufen mehrere Operationen, um die große Nachfrage decken zu können. Anmerkung: Da es in SR6 (bisher) keine Regeln dafür gibt, schlagen wir vor, dass bei Schusswaffen, in die Wasser eingedrungen ist, 1er und 2er als Patzer zählen. Außerdem kann der SL Nutzern maritimer Waffen wenn passend Vorteil (Edge) gewähren. 

item.m-k-revolution.desc=Nach dem Beachskipper von Proteus und dem Jetcycle von Suzuki hat nun auch Messerschmitt-Kawasaki ein Amphibike auf den Markt gebracht, das übergangslos von Motorrad- auf Jetski-Modus wechseln kann. Heftig promotet durch das letzte Ritschie-Rigger-Trid, rätselte die Szene lange, ob das Bike die vollmundigen Versprechungen halten würde. Und ja, das tut es - wenn auch für die gezeigten kurzen Bodeneffekt-Flugsprints deutliche Umbauten nötig sind. Werte als Jet-Ski: Handling 3, Beschleunigung 20, Geschwindigkeitsintervall 20, Höchstgeschwindigkeit 90
item.suzuki-watersport.desc=Suzukis Wassermoped ist seit über 40 Jahren ein alltäglicher Anblick von Hamburgs Fleeten über Hongkongs Kanäle bis zu jedem gesicherten Freizeitgewässer für glückliche Lohnsklaven in naturnaher Haltung. Die Mischung aus martialischem Jetski-Look, unaufdringlichem Elektroantrieb und ungefährlichen Leistungswerten macht es bei Nutzern wie Arbeitgebern sehr beliebt. Warum Piraten, Schmuggler und Runner diese Plastikente in die Top-Liste gevotet haben, ist uns hingegen unklar.
item.mt-barrakuda.desc=Auch heute noch ist der altgediente Barrakuda von Marine Technologies ein Verkaufsschlager, der vor allem bei Söldnereinheiten und Dritte-Welt-Militärs extrem beliebt ist. Doch auch Piraten und andere Schattenelemente wissen die Vorzüge des schmucklosen, auf maximale Leistung bei minimalem Preis gedrillten Designs zu schätzen: Der robuste Polymerrumpf des Barrakudas kommt mit Salz und Säure gleichermaßen klar, das Boot bietet drei unterschiedliche Außenboarder-Halterungen für jedes gewünschte Einsatzprofil, und unter den Verbundstoff-Abdeckungen sind Vorbohrungen für viele der gängigen Waffen-, Drohnen und Sensorhalterungen vorhanden. Die Kabine im Rumpf ist spartanisch, bietet aber für Entermannschaften gute Deckung.

item.bmw_biber.desc=Der unverwüstliche BMW Biber ist auch Jahrzehnte nach seiner Einführung ein beliebtes Transport-, Schmuggel- und Scoutfahrzeug im unwegsamen Norden der ADL. Das als Side-by-Side konzipierte Utility Terrain Vehicle (UTV) ist dank seiner offenen Leichtbauweise bestens geeignet, um auf feuchten Böden nicht sofort einzusinken. Der breite Radstand und die kufenartige Bauweise des Unterbodens helfen dabei, über Schlamm und Flachwasser hinweg zu gleiten. Selbst wenn er in ein Wasserloch rauscht, kann der Biber sich oftmals wieder emporwühlen: Batterie und Radmotoren des leistungsstarken Elektrofahrzeugs sind unempfindlich gegen Wasser - ein Riesenvorteil gegen jeden Konkurrenten mit Verbrenner. Diverse Modelloptionen mit zwei, vier oder sechs Sitzen, verschiedenen festen oder kippbaren Ladeflächen und Funktionsaufbauten wie etwa Drohnenhalterungen machen den Biber zur besten Kaufentscheidung für Jäger, Kleinbauern, Aussiedler und natürlich Schattenläufer. Alternative Konfiguration mit 2 Sitzen verfügbar.
item.bmw_wasserschwein.desc=Das BMW Wasserschwein ist die militärische Weiterentwicklung des Bibers. Breitreifen, ein verbessertes Unterbodendesign und der nochmals verstärkte E-Antrieb aus vier Radmotoren sorgen für ein Maximum an Auftrieb bei hohen Geschwindigkeiten, die das Wasserschwein in der Spitze bis zu 100 Meter weit auch über Tiefwasser gleiten lassen. Verbesserte Sensoren, zwei Halterungen für Quadrotor-Drohnen, eine schwere Waffenhalterung und etwas Panzerung bieten der bis zu fünf Personen starken Besatzung (vier Sitzplätze plus Standgeschütz) deutlich mehr Schutz als das Zivilmodell. 

item.mixcoatl_ii.desc=Die Hawker-Siddeley Mixcoatl II ist eine militärische Jagd-Rotordrohne.

item.isdn2.desc=Um sich mit der Kabelmatrix zu verbinden benötigt man einen Emulator. Einer der geläufigsten Emulatoren ist ALICE, bei dem sich der User kopfüber in einen Kaninchenbau stürzt. Die Stufe der Software entspricht der MPCP-Stufe und Gerätestufe. Auf ANG, SCH, DAT und FIR werden möglichst gleichmäßig (Stufe x4 +10) Punkte verteilt. Eine Gerätestufe von 4 würde also zu 26 Punkten führen, welche ASDF zwischen 6 und 7 ergibt. Die Hälfte der Punkte (bei Gerätestufe 4 also 13) ist gleichzeitig Angriffs- und Verteidiungswert. Die Härte ist Stufe -1. Sie kann auf den Verteidigungswert addiert werden, wenn ein Initiative-Malus von -1W6 akzeptiert wird.

item.katydid.desc=Die Katydid VI von Messerschmitt-Kawasaki ist eine mittelgroße Drohne, die man am besten als intelligenten Wingsuit mit Landefunktion und sehr geringer Signatur beschreiben kann. Die Drohne wird wie ein kurzärmeliger Exoframe mit Stummelflügeln und vier an Ellenbogen und Knien befestigten Rotoren getragen. Der Nutzer wählt per Laserzielsystem einen Landepunkt aus, springt ab und muss nichts anderes tun, als der Drohne die Steuerung zu überlassen und sich nicht gegen das Ziehen an Armen und Beinen zu wehren. Dafür ist eine Probe auf Willenskraft + Charisma (3) erforderlich. Misslingt die Probe, steigt der Schwellenwert der Flugprobe für die Drohne um 2. Die Drohne würfelt für Flug und Landung mit ihrem Würfelpool von 10 gegen einen Schwellenwert von 5. Verwende die Regeln für Granaten (SR6, S. 118), um die Abweichung vom anvisierten Landepunkt zu bestimmen; die Drohne landet auch bei Fehlschlag immer so "sanft", dass kein ernsthafter Schaden entsteht (1W6 Kästchen Betäubungsschaden, kann durch eine Athletik-Probe und eine Schadenswiderstandsprobe verringert werden). Solange die Katydid einen Passagier trägt, kann sie lediglich kontrolliert abstürzen und landen. Nach dem Ablegen ist sie dann in der Lage, zu einem spezifizierten Zielort zu fliegen.
item.hyperion.desc=Das militärische Mehrzweck-Flugzeug des Typs C-360 benötigt dank seines Schubvektorantriebs keine Start- und Landebahn mehr. Mit der Hyperion können drei schwere Panzer oder sechs Schützenpanzer sowie über 500 Soldaten direkt am Rand eines Schlachtfeldes abgesetzt werden. 

item.walter_secura_superkompakt.desc=Mit Einführung dieser Holdout-Pistole erfüllte Walther 2079 den wachsenden Bedarf von verdeckten Ermittlern, eine "Rettungswaffe" für den Notfall zu haben. Klein genug, um auch unauffällig am Fuß getragen zu werden, hat die Superkompakt außergewöhnlich viel Punch. Hinweis: Verwendet Munition für schwere Pistolen, dank Kompositwerkstoffen mit MAD-Scannern schwerer zu entdecken (SW +1).
item.altmayr_black_moon.desc=Diese schwere Pistole ist keine Polizeiwaffe per se, erfreut sich aber dank der DeMeKo-Polizeiserie "Matuscheks Revier" bei Schimanski-Bullen und ähnlich veranlagten (Privat-)Ermittlern auch außerhalb des RRP wachsender Beliebtheit.
item.walter_p118.desc=Diese Automatikpistole sorgt mit umfassender Ziel- und Feuerunterstützung dafür, dass auch ungeübte Schützen zahlreiche Treffer erzielen. Deshalb ist sie u.a. bei Berliner Polizeidiensten mit entsprechenden Geldreserven beliebt. Hinweise: Enthält Gasventilsystem, Smartgunsystem, vergrößertes Stangenmagazin I (s. Feuer Frei). 
item.hk_223c.desc=Diese MP ist dank Montageschienen an allen vier Seiten perfekt modifizierbar für jede Einsatzart und daher bei Sonderkommandos von Polizei- und Militäreinheiten sehr beliebt. 
item.onotari_ks_x.desc=Diese extrem kompakte Automatikschrotflinte wurde speziell für den Häuserkampf entwickelt und ist kaum größer als eine MP. Hinweise: Tarnbarkeit 3. Enthält einen Lasermarkierer.
item.hk_mp75.desc=Diese als MP vermarktete Schnellfeuerwaffe hat tatsächlich mehr von einem superkompakten Sturmgewehr und verschießt auch die entsprechende Munition. Sie wird gerne von Polizeidienstleistern verwendet, die sich gegenüber den Gangs ihrer Gegend "outgunned" fühlen, ohne sich gleich mit "richtigen" Sturmgewehren ausstatten zu wollen. Hinweis: Verwendet Sturmgewehr-Muni. Enthält ein Gasventilsystem
item.emc_2073_catcher.desc=Nicht mehr ganz State of the Art, ist dieses flinke "Pursuit Vehicle" dennoch auf zahlreichen Autobahnen und Bundesstraßen weiter im Einsatz. Auch als Geleitfahrzeug für Konvois ist es sehr beliebt. Hinweise: Enthält eine schwere Waffenhalterung vorne und eine Standard-Waffenhalterung hinten.
item.bmw_a550.desc=BMW fertigt für Polizei- und Sicherheitsdienste eine spezielle Variante seines 5er Modells 550eco. In Autobahnkriegerkreisen A550 oder "Greifenklaue" genannt, hat das hochgezüchtete Modell den älteren Nissan Sentra XII als Standardfahrzeug der Autobahnpolizei verdrängt.
item.bmw_x_infinity.desc=Der "deutsche Humvee" von BMW ist ein schwer gepanzertes SUV, das zum Fuhrpark vieler Polizeidienste gehört. Hinweis: Enthält eine Dachluke mit schwerer Waffenhalterung oben.
item.bmw_ggx.desc=BMWs beliebtes Spaß-Quad ist ein Leistungsmonster, das für BGS und andere, in unwegsamem Gelände operierende Dienste geradezu unverzichtbar ist. Hinweis: Enthält Multifuel-Motor.
item.ruhrmetall_murmillo.desc=Diese mittelgroße Aufstandsbekämpfungsdrohne wird regelmäßig bei Fußballspielen, Konzerten und Demos eingesetzt, um Randalierer mit Flash-Pack und Tränengas-Granatwerfer auf Abstand zu halten. Hinweise: Enthält zwei Granatwerfer mit je 6 Schuss plus einen Flash-Pack mit 200 Ladungen. Die Klappschilde der Murmillo geben bis zu vier Personen Deckung (I-IV).
item.ruhrmetall_thraex.desc=Diese mittelgroße Aufstandsbekämpfungsdrohne wird regelmäßig bei Fußballspielen, Konzerten und Demos eingesetzt, um Randalierer auf Abstand zu halten. In der neuen Modellvariante Thraex wird der Korpus samt Flashpack und Klappschilden durch eine 360° drehbare schwere Waffenhalterung ersetzt, was die Drohne zum Mini-Tank macht.
item.mk_jagdhund_ii.desc=Der Autobahnkrieger fürchtet wenig, aber ein Duo flach an den Asphalt gepresster Jagdhunde in der Rückcam gehört definitiv dazu. Die Jagdmaschine kann es motorenmäßig mit so gut wie jedem aufnehmen. Mit dem neuesten Modell überwindet Messerschmitt-Kawasaki zudem die Grenze zwischen Fahrzeug und Drohne: Der Jagdhund II kann auf Befehl blitzschnell einen Sitz, Lenkgriffe und Fußrasten ausfahren und sich so in eine Rennmaschine für die Motorradstaffel der Polizei verwandeln. Hinweise: Enthält eine schwere und zwei leichte Waffenhalterungen.
item.sony_x_eco4.desc=Mit der Versatile-X schuf Sony eine hochadaptive anthropromorphe Drohnenplattform, deren hochentwickeltes Drohnengehirn mit Autosoft für beinahe jede Aufgabe geladen werden kann. Kostengünstiges Basismodell. Kann wie alle Modelle beliebige Ausrüstung/Waffen und (Panzer-)Kleidung verwenden. Hinweis: Wenn die Drohne eine Rüstung trägt, zählt nur der höhere der beiden Werte, entweder die Fahrzeugrüstung oder die getragene Rüstung.
item.sony_x_reliable4.desc=Mit der Versatile-X schuf Sony eine hochadaptive anthropromorphe Drohnenplattform, deren hochentwickeltes Drohnengehirn mit Autosoft für beinahe jede Aufgabe geladen werden kann. Sicherheitsmodell, optimiert für Ordnungsaufgaben. Beinhaltet ein Bein-Waffenholster und einen Unterarmschild. Hinweis: Wenn die Drohne eine Rüstung trägt, zählt nur der höhere der beiden Werte, entweder die Fahrzeugrüstung oder die getragene Rüstung.
item.sony_x_reliable4_police.desc=Mit der Versatile-X schuf Sony eine hochadaptive anthropromorphe Drohnenplattform, deren hochentwickeltes Drohnengehirn mit Autosoft für beinahe jede Aufgabe geladen werden kann. Sicherheitsmodell, optimiert für Ordnungsaufgaben. Beinhaltet ein Bein-Waffenholster und einen Unterarmschild. Reliable in Polizeiausrüstung mit Helm und zusätzlicher Sensoraufrüstung, zudem ausgestattet mit runterklappbarem Visier und Videoflächen zur Aktivierung von Blaulicht-Effekten. Hinweis: Die Drohne trägt eine Rüstung und kann keine weitere Rüstung zusätzlich tragen.
item.weapon_mount_hand.desc=Hände einer anthropomorphen Drohne, welche normale Waffen führen können. Munitionsvorrat ist von der Waffe definiert.

item.crossbow_hunting.desc= Im ländlichen Raum versteht man sich auf die Herstellung von durchschlagskräftigen und leisen Waffen wie Armbrüsten. Alle Varianten teilen sich die Eigenschaften der Lautlosigkeit beim Spannen und beim Schießen und der Dämmung des Nachschlages der Sehne. Ausrüstung: Einziehbare Schulterstütze, Schwellenwert für Wahrnehmungsproben bei Handhabung +1
item.ammo_bolt_hunting.desc=Spezialbolzen für die Jagdarmbrust
item.ammo_bolt_shattering.desc=Spezialbolzen für die Jagdarmbrust. Wenn der Angriff mind. 3 Kästchen Schaden anrichtet, kann der Bolzen per Wifi-Signal zersplittern. Für jede Runde, die sich das Ziel mit Splittern in der Wunde heftig bewegt (zum Beispiel rennt oder kämpft), erleidet es automatisch 1K Schaden, dem es nicht widerstehen kann.
item.bedna.desc=Die Hälfte der Gerätschaften kann mit Technik erklärt werden, der Rest ist Zauberei, nicht selten von Roma-Thaumaturgen ersonnen und verzaubert. Regeltechnisch funktionieren die Geräte wie der Zauber "Kampfsinn" und ein Bewegungsmelder. Die Gerätestufe entspricht der Anzahl Würfel für die Proben, wobei ein Würfel immer der Schicksalswürfel ist. Die Geräte funktionieren nur in natürlicher Umgebung und außerhalb Marienbads nur mit halber Stufe, da sie auf die Werte der lokalen Flora und Fauna angepasst sind.

item.steyr_ucrp_with_shotgun.desc= Das UCRP basiert auf dem Steyr UCR und wurde eigens an die Bedürfnisse der elfischen Anatomie und das Anforderungsprofil der pomoryanischen Sicherheitskräfte angepasst. 
item.steyr_ucrp_with_taser.desc= Im Falle von Aufständen kann die Schrotflinte auch durch einen Taser ersetzt werden. 
item.steyr_ucrp_with_bayonet.desc=Anders als beim herkömmlichen UCR kann die als Unterlaufwaffe konzipierte Schrotflinte des UCRP abgenommen und durch ein ebenso elegantes wie tödliches Bajonett ersetzt werden, das die Herzogliche Garde bei ihren repräsentativen Wachdiensten stets aufgepflanzt hat.
item.steyr_ucrp_with_shotgun.item.steyr_ucr_shotgun.desc=Steyr UCRP Unterlauf-Schrotflinte
item.steyr_ucrp_with_taser.item.steyr_ucr_taser.desc=Steyr UCRP Unterlauf-Taser
item.steyr_ucrp_with_bayonet.item.steyr_ucr_bayonet.desc=Steyr UCRP Bajonett. Kann bis max. 20 m geworfen werden, aber nur, wenn nicht aufgepflanzt.

item.rabotti_0.desc=Verleiht den Vorteil Unauffälligkeit (SR6, S. 76) in Unterschichtvierteln und Einkaufsbezirken bis Mittelschicht. \n \n Dass Reinigungspersonal, Müllleute, Straßenkinder, Pizzalieferanten, Flyerverteiler und Bettler eine Art eingebauten Unsichtbarkeitszauber haben, ist hinlänglich bekannt. Im stark industrialisierten Pott kommt der Rabotti-Overall zur Liste urbaner Tarnkleidungen hinzu. Rabottis sind ungelernte Hilfsarbeiter, oft Tagelöhner, die hier wie anderswo dazu genutzt bzw. missbraucht werden, Bedarfsspitzen in den Fabriken abzudecken oder auch dauerhaft in sklavereiähnlichen Fesselverträgen zu schuften, bis sie zur Original Rheinischen Fleischwurst verarbeitet werden (ich übertreibe natürlich - aber mit jedem Jahr etwas weniger, scheint mir). Hilfsarbeiter erhalten zwar im Regelfall bei Einstellung einen Arbeitsoverall vom Arbeitgeber, wer aber schon fertig eingekleidet mit speckigem Overall, Jacke, schweren Arbeitsstiefeln und sogar Werkshelm an der Straßenecke steht, wird bevorzugt genommen. Jeder gesparte Cent zählt. Outfits dieser Art sind bei verschiedenen Kleiderkippen und in vielen Ausführungen erhältlich, auch gepanzert oder feuerresistent für den Einsatz am Schmelzofen. Kaufen, notfalls wieder verdrecken, und keiner schaut euch zweimal an, wenn ihr nicht gerade ins Umfeld der Kö-Klasse geht.
