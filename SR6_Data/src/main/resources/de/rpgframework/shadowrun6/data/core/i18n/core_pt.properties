skill.astral.skillspec.spirit_types=Tipos de Espíritos
skill.athletics=Atletismo
skill.athletics.page=97
skill.athletics.desc=A perícia Atletismo é sobre graça e proeza física, uma combinação de diversos fatores — força, velocidade, celeridade, rapidez etc. Mais do que isso, é a capacidade de coordenar todas essas qualidades de uma só vez, canalizar sua capacidade para enfrentar o que a situação exige.<br/>Sendo uma perícia muito variável, ela pode ser utilizada de diversas formas. Ela é usada em testes de Arrancar (p. 43) e Ações de Esquiva (p. 42), e é uma perícia de ataque para armas de arremesso. Em geral, ela se combina com Agilidade para expressar uma certa fluidez de movimento, mas também pode se conectar a Força para testes onde é necessário puro poder muscular. Esses testes costumam ser testes Simples (com exceção de Defesa Total). Mergulho e queda-livre se encaixam nessa perícia.
skill.athletics.skillspec.archery=Arquearia
skill.athletics.skillspec.climbing=Escalada
skill.athletics.skillspec.flying=Voo
skill.athletics.skillspec.freefall=Swobodny spadek
skill.athletics.skillspec.gymnastics=Ginástica
skill.athletics.skillspec.sprinting=Sprint
skill.athletics.skillspec.swimming=Natação
skill.athletics.skillspec.throwing=Arremesso
skill.biotech=Biotec
skill.biotech.page=98
skill.biotech.desc=Essa perícia é para personagens que conhecem a biologia meta-humana. No Sexto Mundo, isso também significa saber como diferentes ampliações e equipamentos interagem com ela. Essa perícia é usada em testes de Cura (p. 122) e de Primeiros Socorros (p. 123), e também pode ser usada para analisar e reparar cibernéticos, bioimplantes e outras ampliações. Outro uso é a instalação de cibernéticos (mas não de bioimplantes).<br/>Biotec costuma ser um teste Simples, no qual a personagem rola Biotec + Lógica e ganha conhecimento sobre um dispositivo ou consegue fazer reparos a partir de sucessos restantes. Mestres devem usar as <b>Diretrizes de Limiar</b> básicas (p. 36) para determinar limiar para esses testes
skill.biotech.skillspec.biotechnology=Biotecnologia
skill.biotech.skillspec.cybertechnology=Cibertecnologia
skill.biotech.skillspec.first_aid=Primeiros Socorro
skill.biotech.skillspec.medicine=Medicina
skill.close_combat=Combate Corpo a Corpo
skill.close_combat.page=98
skill.close_combat.desc=Tá perto de alguém? Tá tentando enfiar a porrada nesse alguém? É só usar essa perícia! Seja socando, esfaqueando, espancando, enfim, role Combate Corpo a Corpo + Agilidade contra Reação + Intuição (Atletismo pode ser somado para Esquiva; veja p. 42).<br/>O dano desarmado base é 2A. Os detalhes completos do Combate estão no capítulo Combate (p. 108).
skill.close_combat.skillspec.blades=Lâminas
skill.close_combat.skillspec.clubs=Bastões
skill.close_combat.skillspec.unarmed=Combate Desarmado
skill.con=Trapaça
skill.con.page=101
skill.con.desc=O aspecto principal desta pericia é a persuasão, com a qual você age como alguém ou algo que não é. Talvez você esteja atuando como a herdeira perdida de uma parte do tesouro de Dunkelzahn, ou quem sabe fingindo ser uma engravatada azarada querendo fazer uma jogada que vai levá-la de volta ao topo. Seja qual for o caso, Trapaça é a perícia usada para convencer outras pessoas de que você é algo que não é.<br/>Testes que envolvam Trapaça são testes Opostos, e o alvo rola Intuição + Vontade para resistir à trapaça. Geralmente é um teste simples de passar/falhar, vendo se a personagem conseguiu fazer a trapaça ou não, mas se houver um alto número de sucessos restantes, o mestre pode considerar que a trapaça foi persuasiva até demais, tornando o alvo um participante ainda mais voluntário.
