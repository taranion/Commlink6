skill.astral=Astral
skill.astral.page=97
skill.astral.desc=Essa perícia só pode ser usada por magistas plenos ou aspectados, ou por adeptos e adeptos místicos que selecionaram o poder de adepto Percepção Astral. Ela tem dois usos principais: um serve para avaliar auras astralmente, conforme descrito na p. 164. O outro é para o combate astral, conforme descrito na p. 166.
skill.astral.skillspec.astral_combat=Combate Astral
