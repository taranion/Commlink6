npc.spirit_plants=Plant Spirits
npc.spirit_plants.page=55
npc.spirit_plants.desc=The flora of the Sixth World is highly varied and vibrant. Plant life is also deeply connected to the psyche of metahumanity, which means the spirit world reflects this diversity. From thorn-covered humanoids to Venus-flytrap-headed vine creatures, the forms and shapes of plant spirits are as varied as any other in the spirit realms.
npc.spirit_guardian=Guardian Spirits
npc.spirit_guardian.page=55
npc.spirit_guardian.desc=With appearances ranging from avenging angels to Zulu warriors, guardian spirits are summoned to be the ultimate protectors. Driven by a warrior's code and strongly opposed to immoral tactics, these spirits come to their summoner's aid and defense but rarely bend a knee to a conjurer with a dark heart.
npc.spirit_guidance=Guidance Spirits
npc.spirit_guidance.page=55
npc.spirit_guidance.desc=Sometimes summoning is not about service but instead about seeking the advice of a wise sage. While the direction they deliver may come in the form of a riddle or masked in allusions, a guidance spirit rarely feels their job is complete until they have offered wise counsel.<br/>The advice of a guide is directly related to the Astral Reputation of the conjurer (p. 64). The lower the score, the more cryptic and harder to understand the guidance will be, while the opposite is true for higher Astral Reputation scores.
npc.spirit_task=Task Spirits
npc.spirit_task.page=55
npc.spirit_task.desc=Work, creation, innovation, invention, effortthese are all concepts intimately connected with the metahuman psyche for centuries. Since metahumanity first shifted to urban civilization, the various jobs of the world have been split, dissected, and narrowed. The spirit realm has mirrored those changes, creating a realm of spirits all skilled in differing ways. When you seek the aid of a task spirit, be sure you know the help you are seeking, for a spirit skilled in cobbling cannot help you make the perfect cobbler. Task spirits are willing workers, and when successfully summoned, offer an additional service to their conjurer. When bound they offer an extra task point as long as the conjurer's Astral Reputation (p. 64) is positive.

