mentorspirit.dachshund.disadvantage=Immer wenn sich Anhänger von Dackel dem Willen einer anderen Person oder einer Gruppenentscheidung beugen müssen, legen sie eine Probe auf Willenskraft + Charisma (3) ab. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie sich von diesem aufgezwungenen Willen befreien (z. B. indem sie die Gruppenentscheidung offen missachten).
mentorspirit.squirrel.disadvantage=Wann immer sich Anhänger von Eichhörnchen (nach Maßgabe der Spielleiterin) in engen Räumlichkeiten aufhalten, müssen sie eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie die beengenden Räumlichkeiten verlassen haben.
mentorspirit.magpie.disadvantage=Anhänger von Elster neigen zur Kleptomanie. Wann immer sich ihnen eine günstige Gelegenheit bietet, einen Gegenstand "mitgehen zu lassen", müssen sie entweder diesem Impuls folgen oder eine Probe auf Willenskraft + Intuition (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie jenen Gegenstand (oder ein vergleichbares Objekt) in ihren Besitz gebracht haben.
 mentorspirit.connoisseur.disadvantage=Anhänger von Genießer neigen zu Ausschweifungen. Wann immer sie bei einer genussvollen Tätigkeit (z.B. Essen, Alkohol- und Genussmittelkonsum, Schlafen, Sex) gestört werden, müssen sie eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie sich wieder ihrem Laster hingeben können.
mentorspirit.big_mama.disadvantage=Eine Anhängerin der Großen Mutter neigt dazu, diejenigen zu "bemuttern", für die sie sich verantwortlich fühlt. Wann immer sie in der Position ist, Entscheidungen im Namen ihres Teams (oder einzelner Teammitglieder) zu treffen, verzichtet sie auf Rückfragen und handelt, wie sie es für richtig hält. Die Geisel freilassen, einen anderen Job annehmen, einen Waffenstillstand mit einer dritten Partei aushandeln - wenn sie der Meinung ist, dass es im besten Interesse ihrer Schützlinge ist, wird sie ohne Selbstzweifel handeln, selbst wenn ihre Entscheidungen das genaue Gegenteil des erklärten Willens ihrer Schützlinge sind. Was wissen sie schon ... Es ist die Mutter, die es am besten weiß! Wenn die Anhängerin diesem Impuls widerstehen will, muss ihr eine Probe auf Willenskraft + Charisma (4) gelingen.
mentorspirit.jester.disadvantage=Nachteile \nSo gerne ein Anhänger von Hofnarr die Charakterschwächen anderer anprangert, ist er selbst auch nicht frei von Eitelkeit. Er erhält den Nachteil Auffälliger Stil (SR6, S. 78) ohne Karmabonus.
mentorspirit.klabautermann.disadvantage=Klabautermanns ständige Einflüsterungen zehren selbst an den Nerven seiner treuesten Anhänger. Die Schwellenwerte aller Selbstbeherrschungs-Proben, die sie ablegen, sind um 1 erhöht.
mentorspirit.panthier.disadvantage=Gewalt ist eben doch eine Lösung, zumindest für Anhänger von Panthier, und zwar die Lösung für alles. Wenn sie ein auftretendes Problem nicht mit den Mitteln der Gewalt lösen, müssen sie eine Probe auf Willenskraft + Charisma (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie einen Kampf vom Zaun brechen.
mentorspirit.rotkaeppchen_wyrd.disadvantage=Anhänger von Rotkäppchen neigen auch in gefährlichen Situationen zu Arglosigkeit. Der Schwellenwert für Überraschungs-Proben beträgt 4 (statt der üblichen 3).
mentorspirit.shepherd_dog.disadvantage=Anhänger von Schäferhund verlangen von anderen nichts, was sie nicht auch sich selbst auferlegen. Sie erhalten den Nachteil Ehrenkodex (SR6, S. 78) ohne Karmabonus.
mentorspirit.vigilant.disadvantage=Ein Anhänger von Vigilant vergisst niemals eine Person, die ihm übel mitgespielt hat. Jedes Mal, wenn er die (erneute) Begegnung mit einer solchen Person verstreichen lässt, ohne Rache an ihr zu üben, muss er eine Probe auf Willenskraft + Charisma (3) ablegen. Misslingt die Probe, erhält er so lange kein neues Edge, bis er gegen seinen einstigen Peiniger vorgeht.
