item.acid_on_demand.desc=This preparation is a small vial of actual acid that acts as a focus for a dangerous spell. Care and precautions should be taken to minimize harm and injury when using this preparation. To create an acid effect on a particular target, touch the vial, select the placement, and say “melt away.” The acid is created on that spot. There is an advantage with arcane acid, as it goes away after a short time (using the rules for the spell), leaving no chemical residue behind.<br/>Acid covers an area of one-half square meter.
