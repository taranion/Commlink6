complexform.loto=Loto
complexform.loto.page=131
complexform.loto.desc=Using this ability, a machinist can disrupt the signals going to and from a machine, separating it from its overlords. This power can be used on any device. When using it, the machinist rolls an Electronics + Resonance vs. Willpower + Firewall Opposed test. The device is completely disabled for a number of Combat Turns equal to the net hits on the test. In the case of something that has a Pilot rating, the Pilot loses functionality as well.
complexform.hyperthreading=Hyperthreading
complexform.hyperthreading.page=131
complexform.hyperthreading.desc=The Sourceror can merge multiple complex forms into a single form, providing the chance to generate multiple results in a single action. Doing so has its limits; the target and level for the Hyperthreaded Form must be the same for all merged complex forms. Resolve effects with a single Software + Resonance test, and use the results for all merged complex forms. The Fade Value is determined by taking the highest Fade Value of all merged complex forms, then adding 1 point for each complex form added after the first. The \u20132 bonus to Threading tests is applied at the end.
complexform.control_virtual_life=Control Virtual Life
complexform.control_virtual_life.page=131
complexform.control_virtual_life.desc=This complex form allows a technomancer to control the actions of the virtual life (sprites, protosapients, xenosapients, constructs, and technocritters) they encounter. They make an Electronics + Resonance vs. Firewall + Willpower Opposed test. Net hits equal the maximum number of turns the technoshaman can control the target. The target and its overlord, if there is one, is aware of what is happening to them but can do little about it.<br/>The technoshaman uses the same actions to command the target as the action they are telling them to take, which means that having them move is a Minor Action, but having them attack is a Major Action.

