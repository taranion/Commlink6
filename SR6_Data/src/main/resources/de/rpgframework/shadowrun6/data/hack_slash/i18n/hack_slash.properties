action.calibration=Calibration
action.calibration.page=28
action.calibration.desc=You lend your team your own processing power and boost their speed. You can increase the current Initiative Score of you and your team by 1 for every 2 hits. The total amount of Initiative Score increase granted to a persona cannot be greater than your Data Processing, and only one Calibration effect can be active at a time. The Initiative Score then decreases by 1 each Combat Turn until it returns to the normal initiative score. This bonus applies to anyone with an AR feed that shares the decker\u2019s PAN. The hacker can only share their feed with a number of users equal to or less than their device rating.
action.delayed_command=Delayed Command
action.delayed_command.page=28
action.delayed_command.desc=You send a payload to a device that contains a command and time delay that the target perceives as coming from its owner. The device then automatically attempts to perform the action when the time delay is passed. On success, the command will execute even if the host turns off their wireless functionality. If the device is rebooted before the command executes, the delayed command is lost.
action.denial_of_service=Denial of Service
action.denial_of_service.page=28
action.denial_of_service.desc=Wireless devices become nearly unusable when you pollute their data streams with noise. A decker or technomancer may target a wirelessly active device or persona. Make an Electronics + Logic vs. Willpower + Firewall Opposed test and apply the number of net hits x 2 as a negative dice pool modifier to all tests made with that device until the end of the next combat round.
action.device_lock=Device Lock
action.device_lock.page=29
action.device_lock.desc=Sometimes the easiest way to get away from a hack is to just turn off your wireless. The attack targets a device, and on success prevents the device from going offline for a number of rounds equal to net hits. Once the number of rounds has expired, the decker or technomancer can spend a Minor Action to extend the device lock by a round. This extension can only be done once.
action.garbage_in=Garbage In/Garbage Out
action.garbage_in.page=29
action.garbage_in.desc=This command allows the decker to \u201Ccross the wires\u201D of a single device, confusing some of the inputs and outputs of the system. A single input can be rerouted to execute a different command. For example, a commlink could have its call function altered to automatically delete the contact information of the person that its user intended to call. A camera could switch the rewind function with that of the fast forward function.<br/>The command can\u2019t override the basic safety features of the device or system, and the gamemaster has final say in what can be accomplished with the command.
action.known_exploit=Known Exploit Backdoor Entry
action.known_exploit.page=30
action.known_exploit.desc=This action is linked to the Sleaze Attribute.<br/>You attempt to run through a set of previously known exploits in order to gain illicit entry into a host, device, or other Matrix area. This action does not require a previously successful Probe, but against a fully patched host is going to be less likely to be successful. Runners performing this action are unable to gain or spend Edge. In addition, the host or device gains a point of Edge that is either spent immediately on that action or disappears.<br/>If the test is successful, you gain Admin access to the target, and it does not count as illegal Admin access (though taking illegal Matrix Actions will still increase your Overwatch Score). <br/>Failing this test does not immediately set off alarms, but the character\u2019s OS increases as normal.
action.masquerade=Masquerade
action.masquerade.page=30
action.masquerade.desc=This action allows a hacker to impersonate a persona on the Matrix. Since persona data is updated in real time, this action is difficult to execute successfully. For every net hit scored on a Cracking + Logic vs. Data Processing + Intuition, you convince Matrix systems and casual observers that you are the target for one minute. This can be used to impersonate someone online, intercept their calls, use their social media, rummage through their email history, or otherwise create mischief, but processes like changing device owners or performing major financial actions (like bank transfers) have too many double-checks for Masquerade to work.<br/>If the persona you\u2019re impersonating logs off, the disguise drops. While masquerading, you are never considered the owner with regard to any of the impersonated persona\u2019s devices.
action.metahuman_in_the_middle=Metahuman in the Middle
action.metahuman_in_the_middle.page=30
action.metahuman_in_the_middle.desc=This command inserts you in between any callsor Matrix actions that go into or out of a device. On a successful test, all communications bounce through your device for minutes equal to net hits.
action.modify_icon=Modify Icon
action.modify_icon.page=30
action.modify_icon.desc=Sometimes you want your Ares Predator VI\u2019s Matrix icon to look a little less threatening. This action allows a hacker to change a Matrix icon to look like a different icon. Each time your icon is scanned, you need to make an Electronics + Logic vs. the scanning device\u2019s Data Processing + Sleaze or device operator\u2019s Intuition + Data Processing to not be detected.
action.popup=Popup
action.popup.page=30
action.popup.desc=It\u2019s so irritating when your entire display or view is completely blocked by popup AROs or windows that prevent you from doing what you intended. The decker or technomancer attempts a Cracking + Logic versus Intuition + Data Processing Opposed test against a target device or persona. The targeted device or persona is unable to spend Edge for a number of combat rounds equal to net hits.
action.squelch=Squelch
action.squelch.page=30
action.squelch.desc=A successful Squelch test prevents the target device from calling or sending messages for a number of minutes equal to the net hits scored.
action.subvert_infra=Subvert Infrastructure
action.subvert_infra.page=30
action.subvert_infra.desc=This action allows a decker or technomancer to slightly alter the operation of multiple physical devices so they respond to the hacker\u2019s commands. If the hacker has at least Admin access on the host, a successful Electronics + Intuition vs. Intuition + Firewall or 2 x Firewall test allows them to control one group of similar simple devices (traffic lights, vending machines, home appliances, desk lamps, etc., at gamemaster discretion) slaved to that host for every net hit. This action cannot be used to make an attack. The hacker can sustain controlling these devices as a Major Action each combat round.
action.threat_analysis=Threat Analysis
action.threat_analysis.page=31
action.threat_analysis.desc=Instead of attacking, the hacker engages threat-highlighting software, giving allies an edge to their defenses. Threat Analysis allows the hacker to give a Defense test bonus to all allies with access to an AR feed. The number of bonus dice equals the number of hits on an Electronics + Logic test. This bonus lasts until the beginning of the hacker\u2019s next turn. This bonus applies to anyone with an AR feed that shares the decker\u2019s PAN. The hacker can only share their feed with a number of users equal to or less than their Data Processing.
action.virtual_aim=Virtual Aim
action.virtual_aim.page=31
action.virtual_aim.desc=A decker or technomancer gains +1 dice pool bonus with the use of this action from studying their target\u2019s defenses. The action can only be taken once per combat round, and the bonus is carried over to the next round if unused until they fail to use a Virtual Aim action on that round or if they attack. The maximum dice pool bonus from the use of this action equals the character\u2019s Willpower. The bonus can be applied to any Matrix attack action such as Data Spike, Tarpit, or Resonance Spike.
action.watchdog=Watchdog
action.watchdog.page=31
action.watchdog.desc=Target must be a persona or device. The number of net hits is how many combat rounds the program stays active. If successful, the player can see what the target is doing on their devices. The user is now aware of the Matrix Actions the target is going to use before they use them, and they may attempt to stop them. Watchdog allows the hacker to use Threat Analysis as a minor action if the attack originates from the target.
action.batch_execution=Batch Execution
action.batch_execution.page=31
action.batch_execution.desc=This allows the decker to switch out all the programs actively running on their deck. Just use the Edge action and you can quickly reduce your OS accrual or go in ready to wreck some drek.
action.intervene=Intervene
action.intervene.page=31
action.intervene.desc=This allows the hacker to give an immediate defense bonus to the owner of a device slaved to the hacker\u2019s PAN. This action can be taken only if the device making the attack is wirelessly enabled and the hacker is aware of it. Roll your Electronics + Logic, adding the number of hits to your ally\u2019s dice pool.<br/>This bonus applies only to the current Defense test.It cannot be carried over to any other turn or action.
action.paint_target=Paint Target
action.paint_target.page=31
action.paint_target.desc=Paints a target in the team\u2019s AR, allowing them to know where the target is located. Removes Blinded status coming from Cover or Smoke grenades.
action.computer_virus=Computer Virus
action.computer_virus.page=31
action.computer_virus.desc=The aliens are going to destroy the Earth, and the only way we can successfully stop them is by loading this computer virus into their system. The runner who deploys this attack against a device or host prevents the target from taking any actions for minutes equal to net hits on the test. This can be used to prevent the host from recording footage from cameras or for locking a building as none of the security locks will disengage.
action.enhance=Enhance
action.enhance.page=31
action.enhance.desc=Sometimes the trid footage is unclear or maybe the audio is coming through garbled, but a quick shot of Enhance, and suddenly everything becomes clear! This Matrix action can be taken on the same turn or the turn immediately after performing a Matrix Perception test. Hits on the Enhance Matrix action are added to the previous Matrix Perception action.
action.ic_slicer=IC Slicer
action.ic_slicer.page=31
action.ic_slicer.desc=You are a master of taking down IC guarding the data that you are after and causing damage to any IC you target. Your attack has a Damage Value equal to your Attack attribute with one additional box of damage per net hit.<br/>This action is linked to the Attack attribute.
action.keyboard_commando=Keyboard Commando
action.keyboard_commando.page=32
action.keyboard_commando.desc=You\u2019re the fastest hacker on the planet, and there isn\u2019t an IC program out there that can catch you in the act. You can slice through a network\u2019s defense so fast that you can hack your way in and out in a single turn. With a single net hit, you gain User access; with four additional net hits, you gain Admin access. With each additional net hit beyond that, you can manipulate one device or file. You immediately exit the network after executing this action.
action.password_sequencer=Password Sequencer
action.password_sequencer.page=32
action.password_sequencer.desc=The host or device has a complex password that only the toughest number crunchers can handle. On each successful test, your decking process is able to sequence the next element in the password. The number of elements in the password is equal to the host\u2019s rating.
action.skull_and_crossbones=Skull and Crossbones Attack
action.skull_and_crossbones.page=32
action.skull_and_crossbones.desc=You are a master of preventing your opposition from taking actions. On a successful test, the opposition\u2019s screen or view is completely occluded by a giant animated ASCII skull and crossbones.<br/>The target cannot take any action until they have successfully completed an Electronics + Logic test where the threshold is equal to the number of net hits from the Skull and Crossbones Attack action.
action.we_are_in=We\u2019re In!
action.we_are_in.page=32
action.we_are_in.desc=Upon successfully hacking into a host or device, a triumphant yell tells your team that you are the best fragging decker on the planet. On success, reset your Edge pool back to your Edge rating. If you are currently over your Edge rating, then you do not reset.

complexform.arc_feedback=Arc Feedback
complexform.arc_feedback.page=62
complexform.arc_feedback.desc=When you thread this form, make an Electronics + Resonance test and record your total hits. If you suffer Matrix damage from a Data Spike Matrix action, Resonance Spike, or IC while sustaining Arc Feedback, the thing that hit you takes Matrix damage equal to the hits on your Electronics test. Once Arc Feedback deals damage, the complex form collapses and ends.
complexform.attack_attribution=Attack Attribution
complexform.attack_attribution.page=62
complexform.attack_attribution.desc=Target a willing persona and make an Electronics + Resonance test. As long as you sustain this form, the target gains an Attack Matrix attribute equal to the total hits on your Electronics test. If the target already had a lesser Attack attribute, it is replaced by the Attack attribute provided by this form. The target under the effects of Attack Attribution cannot be affected by an Infusion (Attack) complex form. This persona may now use illegal Matrix actions that use the Cracking skill.
complexform.bubble_shield=Bubble Shield
complexform.bubble_shield.page=63
complexform.bubble_shield.desc=Bubble Shield creates a protective Resonance barrier around one target, which must be connected to the Matrix. Make an Electronics + Resonance test and record your total hits. For every two full hits (round down), the target gains a bonus die on all tests to resist complex forms and sprite powers. While active, this complex form appears as a barely visible forcefield that randomly flares with glowing lines of code. Only an entity with a Resonance attribute is capable of observing it any further with Matrix Perception.
complexform.btl_irl=BTL IRL
complexform.btl_irl.page=63
complexform.btl_irl.desc=This complex form enhances the target\u2019s technological senses and stimulates their headware to create a heightened state of awareness, similar to how it feels to slot a BTL chip\u2014but enhancing the target\u2019s real experiences. Besides enhancing pleasurable experiences, it tends also to amplify terrible ones. To establish this complex form, make an Electronics + Resonance test, with a threshold of 6 minus the target\u2019s Essence. The target must have some headware augmentations of some kind in order to be affected, and if they don\u2019t have any sensory augmentations (such as cybereyes, cyberears, olfactory booster, etc.), you may not gain or spend Edge on the Electronics test. The target receives a number of bonus dice on Perception tests equal to your net hits while BTL IRL is sustained, but they also receive a penalty on all Con and Influence tests due to their obvious state of distraction and the stigma attached to chipheads. The effects of this complex form are so similar to BTL chips that they satisfy a BTL addict\u2019s need for a fix. Chipheads are often willing to pay at least 100 nuyen per hour to be affected by this form, and many unscrupulous technomancers are marketing their abilities as a healthy alternative to using BTLs. They\u2019re wrong\u2014it\u2019s just as bad as BTLs. If your target ever rolls a glitch, critical glitch, or a 1 on a wild die while under the influence of BTL IRL, this complex form collapses and ends, and the target takes 1D6 boxes of Physical biofeedback damage that cannot be resisted, prevented, or reduced by any means. This damage lingers, and cannot be healed except through natural recovery.
complexform.cyber_spike=Cyber Spike
complexform.cyber_spike.page=63
complexform.cyber_spike.desc=
complexform.cyberjack_overclock=Cyberjack Overclock
complexform.cyberjack_overclock.page=63
complexform.cyberjack_overclock.desc=Target a persona that is using a cyberjack augmentation or cyberhack device. Make an Electronics + Resonance test. Each hit adds 1 to the Matrix Initiative of the targeted persona while this form is sustained. This adds to the static initiative number that you add your initiative dice to; it does not add extra initiative dice.
complexform.cyberware_stamina=Cyberware Stamina
complexform.cyberware_stamina.page=63
complexform.cyberware_stamina.desc=Target a character with augmentations. If the target\u2019s augmentations are not wireless-enabled, you must establish a direct connection via Skinlink or Aura Link. Make an Electronics + Resonance test with a threshold of 6 minus the target\u2019s Essence (round Essence down to the nearest whole number).<br/>While this complex form is sustained, the target\u2019s augmentations are immune to stress from augmentation overdrive (p. 282, SR6). The first time that your target is prevented from suffering stress from overdrive, this complex form collapses and ends (the stress is still prevented). If your target is already suffering from augmentation overdrive stress, it goes away when this complex form takes effect, ending the complex form immediately after.
complexform.data_bomb_eater=Data Bomb Eater
complexform.data_bomb_eater.page=64
complexform.data_bomb_eater.desc=When you thread a Data Bomb Eater, make an Electronics + Resonance test and record your total hits. If you set off a Data Bomb while sustaining this form, the Data Bomb\u2019s rating is reduced by your total hits. If the Data Bomb\u2019s rating is reduced to zero or less, it is harmlessly eaten by the Resonance\u2014in which case the file that was protected by the Data Bomb remains intact. After a Data Bomb Eater encounters a Data Bomb, the complex form collapses and ends.
complexform.data_disguise=Data Disguise
complexform.data_disguise.page=64
complexform.data_disguise.desc=You can use this complex form to disguise any icon to make it appear to be different. This includes the type of icon such as persona, device, IC, file, sprite, AI, or anything else that you can think of, but also allows you to present false Matrix attributes, and even make it appear to be running specific software. Target an icon, make an Electronics + Resonance test, and record your total hits. Whenever the disguised icon is targeted with a Matrix Perception test, the results of that test will report only the information from your disguise unless the total hits exceed the hits you scored on the Electronics test. In that case, they see through the disguise and get the real scoop. This complex form can also be used to make it appear that a device that is not running a persona (such as a spare commlink) is actively running a persona.
complexform.enhance_autosoft=Enhance Autosofts
complexform.enhance_autosoft.page=64
complexform.enhance_autosoft.desc=Target a device that is at least theoretically capable of running an autosoft and make an Electronics + Resonance test. For every two hits, add one bonus die whenever a test is made using an autosoft running on the device while this complex form is sustained.
complexform.enlighten_automaton=Enlighten Automaton
complexform.enlighten_automaton.page=64
complexform.enlighten_automaton.desc=Target a device with a Pilot rating that is not currently jumped into by any entity, and make an Electronics + Resonance test. You may increase either the Pilot or Sensor rating of the target by your hits, and you may split up your hits between Pilot and Sensors if you choose. Neither Pilot nor Sensor can be increased to more than double its original rating.<br/>Devices seem much more alert, active, and aware while under the effects of this complex form. They automatically pass any test required to understand complex orders or respond to chaotic situations. Sometimes they also show a little attitude and need to be convinced to carry out their orders. If a device affected by Enlighten Automaton rolls a glitch or critical glitch, a Con or Influence + Charisma test is required to convince it to follow its orders. This requires a Major Action, and the threshold for the test is the number of points the Pilot and Sensor ratings have been increased by. You can attempt this as many times as needed, but until convinced, the device will take no further actions. If you stop sustaining Enlighten Automaton, the device goes back to its normal behavior.
complexform.host_emulator=Host Emulator
complexform.host_emulator.page=64
complexform.host_emulator.desc=Target a persona or IC within a host and make an Electronics + Resonance test vs Intuition + Firewall. If you score any net hits, the persona or IC is tricked into interacting with an illusion of the host they are in. The target\u2019s next Matrix Actions will automatically fail while the form is sustained, and the target will believe that its actions are successful. This illusion can only be kept up for so long before error-checking systems or the target\u2019s own intuition causes them to break free. Every time the target loses a Matrix Action to Host Emulator, if they score more hits than the net hits scored on your Electronics test, the complex form collapses and ends. The Matrix Action still fails, but the target realizes that it failed.
complexform.ic_pick=IC Pick
complexform.ic_pick.page=64
complexform.ic_pick.desc=Target IC running on a host and make an Electronics + Resonance test vs Host Rating x 2. The IC takes Matrix damage equal to your Attack attribute plus net hits. If you crash the IC using this complex form, its duration switches to sustained. As long as you sustain the complex form, the host cannot launch another instance of the type of IC that you crashed.
complexform.machine_merge=Machine Merge
complexform.machine_merge.page=64
complexform.machine_merge.desc=Target a character with a control rig (or equivalent echo) and make an Electronics + Resonance test. For every two hits, the target gains one bonus die on Piloting, Engineering, and defense tests made while jumped into a vehicle or drone while this complex form is sustained. This bonus only applies on tests made to operate the vehicle or drone and its systems.
complexform.marionette=Marionette
complexform.marionette.page=65
complexform.marionette.desc=This complex form is the street samurai\u2019s worst nightmare, allowing a technomancer to take control of a target\u2019s body through their augmentations. In order to be vulnerable to this complex form, a target must have at least one bodyware augmentation or cyberlimb that is connected to their nervous system. Inert ware such as bone lacing, dermal plating, and smuggling compartments don\u2019t count toward this, but wired reflexes, reaction enhancers, and skillwires do. Turning off wireless mode offers some protection against this complex form; in order to use it then, the technomancer must maintain line of sight with these targets and have the Aura Link echo.<br/>Targets who are running in wireless mode are also vulnerable via the Matrix, in which case physical line of sight is not required. To use Marionette on a target, make an Electronics + Resonance test that is opposed by the target\u2019s Willpower + Firewall. If successful, note your net hits. You may use further actions to directly control the target\u2019s body. If they only have a cyberlimb, you can only take actions to control their cybernetic limb, but most bodyware augmentations allow control over the target\u2019s entire body. <br/>\
 You must spend a Major and a Minor Action for each Major or Minor Action you force the target to take. This action must be a physical action that the target is physically capable of doing\u2014their mind and emotions are not affected. Each time you force your target to take an action, reduce your total net hits by one. When all of your net hits have been used up, or if you stop sustaining it, the complex form collapses and ends.<br/>\
 If the target takes an action that requires a dice roll, use their normal dice pool, but no Edge may be gained or spent on the test. This complex form doesn\u2019t prevent them from moving of their own volition. On their own turn, the target may take their own actions. While you can use this complex form to force a target to take actions that are clearly detrimental to their well-being, such as attack themselves, jump off a nearby height, etc., it\u2019s not an instant kill. If you force a target to harm themself, they take base damage from whatever weapon they are using, with no dice roll to hit or increase damage with net hits. In the case of a fall, the target gets a chance to catch a ledge or something with an Athletics + Agility test. This complex form shouldn\u2019t be used for an automatic kill, but it can provide a decisive tactical advantage. Even among criminals, the thought of forcing someone to harm themselves with a power such as this is horrifying. Each time you use this complex form to cause a target to damage itself, add +1 to the team\u2019s Heat modifier at the end of the run.<br/></br>\
 Note that you could use this on a willing target with the goal of providing them with extra actions. No augmentations are truly designed to be used in this manner, so the target must still roll to resist. When using this form on a target with their consent, you gain a point of Edge that must be spent on the Electronics test, or it is lost. Even when used in these circumstances, actions forced by this complex form can neither gain nor benefit from Edge.
complexform.primed_charge=Primed Charge
complexform.primed_charge.page=66
complexform.primed_charge.desc=By channeling raw power from the Resonance through your living persona, you can powerfully boost a Matrix Action. When you thread Primed Charge, make an Electronics + Resonance test and record your total hits. The next time you take a Matrix Action or thread a complex form, gain a point of Edge for every two full hits you scored on your Electronics test. You may gain more than 2 Edge in this way, but after your Matrix Action or complex form is resolved (including resolving fading damage), you lose all of your remaining points of Edge\u2014even Edge that was not granted by this complex form. Edge stored in a separate pool such as an M-TOC or Chase Pool is not drained by this.<br/>You may not use Primed Charge when your Edge pool is empty.
complexform.resonance_wires=Resonance Wires
complexform.resonance_wires.page=66
complexform.resonance_wires.desc=The ultimate defense, more powerful than any firewall, is to switch off wireless mode entirely, making you completely invulnerable to hostile Matrix Actions. Well, technomancers have a few workarounds for that problem. To use this complex form, target a device or character that you can see and make an Electronics + Resonance test with a threshold of 2 plus noise (if any). If you meet the threshold, you establish a remote direct connection to the device. If your target was a character, you have a direct connection to any or all of that character\u2019s devices \u2014 even ones that have been turned off. The only thing you can do with a device that has been turned off is to turn it on, but this limitation doesn\u2019t apply to devices that just have wireless mode disabled. You can sustain this complex form for as long as you can maintain line of sight to the target. If you lose sight for longer than it takes you to blink, it ends immediately.
complexform.restore_continuity=Restore Continuity
complexform.restore_continuity.page=66
complexform.restore_continuity.desc=This complex form allows you to heal software with Matrix damage, including remote agents, artificial intelligence, Matrix fauna, and even IC. Make an Electronics + Resonance test, which restores one box of Matrix damage per hit. This has no effect on devices and sprites.
complexform.search_history=Search History
complexform.search_history.page=66
complexform.search_history.desc=When you target a device using Search History, make an Electronics + Resonance test vs. Willpower (or device rating) + Firewall. If you score any net hits, you immediately gain a list of all Matrix Actions taken by the device within the past twenty-four hours for each net hit or since it was last rebooted (whichever is most recent). No specifics are included about the results of the Matrix Actions, but the targets of the Matrix devices are recorded.<br/>Only targets that were identified and recognized by the device will be identified by Search History.
complexform.sleaze_attribution=Sleaze Attribution
complexform.sleaze_attribution.page=66
complexform.sleaze_attribution.desc=Target a willing persona and make an Electronics + Resonance test. As long as you sustain this complex form, the target gains a Sleaze Matrix attribute equal to the total hits on your Electronics test. If the target already had a lesser Sleaze attribute, it is replaced by the Sleaze attribute provided by this form. The target under the effects of Sleaze Attribution cannot be affected by an Infusion (Sleaze) complex form. This persona may now use illegal Matrix actions that utilize the Electronics skill.
complexform.smartgun_amplifier=Smartgun Amplifier
complexform.smartgun_amplifier.page=66
complexform.smartgun_amplifier.desc=This complex form amplifies and enhances weapons systems. Target either an individual smartgun-equipped weapon or an M-TOC device and make an Electronics + Resonance test. The Attack Ratings of weapons connected to the M-TOC network (or the individually targeted weapon) are increased by the number of hits rolled on this test while the form is sustained. This only affects weapons with wireless-enabled smartgun systems.
complexform.technoregeneration=Technoregeneration
complexform.technoregeneration.page=67
complexform.technoregeneration.desc=This complex form is the equivalent of a Heal spell for electronic devices. Target a device and make an Electronics (Hardware) + Resonance test. For every hit scored, restore one box of Matrix damage. This only works on devices, not IC, sprites, or other Matrix fauna.<br/>When a device has been repaired by this complex form, it tends to function erratically. When making any test using the device, replace one of the dice with a wild die until more thorough maintenance can be done (this requires one hour with an Electronics toolkit). Until this maintenance is done, the device cannot be repaired via technoregeneration again.
complexform.threat_analyzer=Threat Analyzer
complexform.threat_analyzer.page=67
complexform.threat_analyzer.desc=This complex form supercharges an M-TOC\u2019s combat defense algorithms. Target an M-TOC device and make an Electronics + Hardware test. For every hit scored, increase the DR of all characters and drones that are subscribed to the M-TOC. In order to receive this DR bonus, characters must either have DNI (a datajack or trodes will do) or have an image link and audio communication device so that they can see and hear the M-TOC\u2019s augmented reality overlay.
complexform.unravel_encryption=Unravel Encryption
complexform.unravel_encryption.page=67
complexform.unravel_encryption.desc=This complex form allows you to remove a file\u2019s encryption without increasing your Overwatch Score and, assuming you succeed, without setting off any alarms. Make an Electronics + Resonance test vs. encryption rating x 2. If you score at least as many hits as the encryption, it is silently removed. If the encryption wins by even one net hit, the host or device is alerted that someone is attempting to decrypt the file. This doesn\u2019t give away your persona, but it does tend to put a host or device on high alert.

