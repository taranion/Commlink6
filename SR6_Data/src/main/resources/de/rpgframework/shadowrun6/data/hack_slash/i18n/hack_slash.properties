qpath.cyberadept_path.step.cyberadept_master=Cyberadept Master
qpath.cyberadept_path.step.cyberadept_master.page=87
qpath.cyberadept_path.step.cyberadept_master.desc=Your augmentations have become accustomed to the Resonance. After you have lost 3 Essence, you may take this quality at its listed Karma cost (not double). You must have cyberadept disciple and its prerequisites in order to take this quality. All of your beta-grade augmentations become delta grade, and your alpha-grade augmentations become beta grade. This creates an Essence hole, allowing you to get more augmentations installed before losing more Essence. Any further augmentations you receive must be delta grade or better, or else your body rejects them. Your augmentations have become so well adapted to your body and your living persona that they are difficult for others to notice or affect, even when running with wireless mode on. Add your submersion grade to your Defense Rating and dice pool for any Matrix defense test on behalf of your augmentations-including resisting a Matrix Perception test to stay hidden. The next time you raise your Resonance attribute, it only takes you one minute.
qpath.cyberadept_path.step.cyberadept_transcendent=Cyberadept Transcendent
qpath.cyberadept_path.step.cyberadept_transcendent.page=87
qpath.cyberadept_path.step.cyberadept_transcendent.desc=Resonance has helped you achieve what technology can only hope to unlock one day: gamma grade augmentations. After you have lost 4 Essence, you may take this quality at its listed Karma cost (not double). You must have Cyberadept Master and its prerequisites in order to take this quality. All of your augmentations become gamma grade, regardless of their current grade. When you receive a new delta grade augmentation, it takes time for you to properly adapt and integrate it. While your new augmentations are adapting, they do not provide any bonuses for being wireless-enabled, but they must be wireless-enabled nearly the entire time. If you deactivate wireless mode for more than one minute at a time, reset the timer for integration. It takes a month to properly integrate a new augmentation, at which time it upgrades to gamma grade. If your augmentations are ever removed, they are useless to anyone else-even as used grade. Whenever you raise your Resonance attribute, it only takes you one minute. This only applies when raising your Resonance attribute up to 6. Raising it to 7 or higher requires the normal required amount of time to improve.

#Sprite Powers
critterpower.death_mark=Death Mark
critterpower.death_mark.page=74
critterpower.death_mark.desc=The Death Mark power signals a sprite's intention to murder somebody. The sprite targets a persona that is using VR mode and makes a Cracking + Resonance vs. Intuition + Firewall Opposed test. If the sprite succeeds, the target gains a disconcerting and mysterious bulge, sore, or wound on their persona. They become link-locked, unable to use the Switch Interface Mode or Hide Matrix Actions, and they require an Opposed test to Jack Out (p. 182, SR6). It gets worse. If the target takes Matrix damage from any source, they also suffer an equal number of boxes of biofeedback damage-Physical damage if using hot-sim VR, Stun damage if using cold-sim. If the sprite directly damages the target, it deals a number of extra boxes equal to the net hits scored on the initial Cracking test. The Death Mark disappears when the sprite stops sustaining it or the target jacks out or reboots.
critterpower.shield=Shield
critterpower.shield.page=74
critterpower.shield.desc=The sprite focuses all of its attention and effort toward locating and intercepting Matrix hazards. For one task, this power protects a number of icons, personas, or devices up to its Resonance attribute. A sprite can only maintain one instance of the shield power. Anything under the shield's protection gains the sprite's Resonance attribute in bonus dice to all Matrix defense tests, as well as Opposed tests against complex forms and sprite powers. If a target takes Matrix damage while under the effects of the Shield power, that Matrix damage is suffered by the sprite instead. If a sprite takes damage due to sustaining Shield, your Sprite Rep goes down by 1 unless it is a Defender sprite.
critterpower.captivate=Captivate Audience
critterpower.captivate.page=73
critterpower.captivate.desc=Complex, overwhelming, yet beautiful and entertaining simsense signals surround the sprite. The sprite makes a Con (Performance) + Resonance test and records the total hits. Personas using VR mode within 100 meters of the sprite may attempt to resist independently using Intuition + Firewall. Characters who have a knowledge skill related to art or music are more vulnerable and cannot gain or spend Edge to resist this power. Agents, IC, and personal assistant commlink apps are entirely unaffected, as are any devices that are not running a persona, but sprites are just as vulnerable as characters with artistic knowledge skills. Anyone who does not fully resist the sprite must pay twice the number of points of Edge for all Edge Boosts and Actions for a number of combat rounds equal to the sprite's net hits. This applies to all actions, not just Matrix Actions. Jacking out or switching to AR ends the effect immediately. This power can not be used while running silently on the Matrix.
critterpower.harmonize=Harmonize
critterpower.harmonize.page=74
critterpower.harmonize.desc=The sprite generates tones, images, and sensations drawn from the Resonance and surrounding Matrix, perfectly harmonizing with the environment and entities there. The sprite makes a Con (Performance) + Resonance test. Matrix noise within 100 meters of the sprite is reduced by the sprite's hits. Even if the source of noise has a rule that it can't be reduced or negated by any means, this sprite power overcomes that limitation. Anyone within 100 meters who can experience the sprite's performance, whether through AR or VR, or even on speakers and trid projectors, is positively affected. Any test made to heal an affected character gains bonus dice equal to the sprite's hits on the performance test. This includes natural healing, first aid, medkits, healing magic, and even complex forms. Any character making repairs gains the same number of bonus dice on their Engineering or Electronics tests to fix Matrix or Physical damage. Sprites, AI, and other Matrix fauna are even more strongly affected, automatically healing one box of damage at the end of every combat round.
critterpower.digital_scream=Digital Scream
critterpower.digital_scream.page=74
critterpower.digital_scream.desc=The sprite sends out a wide burst of complex noise that is perceived by everything connected to the Matrix within 100 meters. The sprite makes an Electronics + Resonance test, and the area becomes affected by noise equal to the number of hits rolled. This fades at the beginning of the next combat round, and once it ends, everything that perceived the scream receives a single file. This file must be provided by the technomancer that commands the sprite as part of the Minor Action required to command it, and it may include encryption and/or a data bomb if desired. This power cannot be used while running silently on the Matrix.
critterpower.fractal_dream=Fractal Dream
critterpower.fractal_dream.page=74
critterpower.fractal_dream.desc=The sprite targets a persona or IC and makes a Cracking + Resonance test vs. Intuition + Data Processing. If the sprite scores any net hits, the target vanishes from the Matrix, trapped within a bizarre hot sim experience in the Resonance for one combat round for each net hit-even if their device has no hot sim capability. This causes IC to crash, but other than wasting their time, it doesn't harm personas. Some who have experienced this describe having a religious experience, and some latent technomancers have had their Emergence triggered in this way, but most have no words or understanding of the indescribable strangeness. If someone is physically disconnected from the Matrix while trapped in the fractal dream, they will suffer severe dumpshock, taking 8 boxes of biofeedback damage as well as receiving the Zapped and Dazed conditions for one minute per box of damage taken.
critterpower.signal_boost=Signal Boost
critterpower.signal_boost.page=75
critterpower.signal_boost.desc=You can tell your courier sprite to enhance your Matrix connections, reducing noise by its Resonance for one combat round per level. This command is also available to defender sprites
critterpower.host_ken=Host Ken
critterpower.host_ken.page=75
critterpower.host_ken.desc=At your command, your crack sprite can provide assistance on any Matrix action or complex form that targets a host or IC, adding its Resonance attribute in bonus dice to your test.
critterpower.hyperthreading=Hyperthreading
critterpower.hyperthreading.page=75
critterpower.hyperthreading.desc=If you ask your data sprite to help you thread a complex form, add its Resonance to your dice pool on your threading test.
critterpower.file_ken=File Ken
critterpower.file_ken.page=75
critterpower.file_ken.desc=You can request assistance from your data sprite on any Matrix action that targets a file, adding its Resonance attribute as bonus dice on your test.
critterpower.cybercombat_boost=Cybercombat Boost
critterpower.cybercombat_boost.page=75
critterpower.cybercombat_boost.desc=You can tell your crack sprite to crank up your Data Spike Matrix action or Resonance Spike complex form, adding its Resonance to your Matrix damage. This command is also available to assassin sprites.
critterpower.device_ken=Device Ken
critterpower.device_ken.page=75
critterpower.device_ken.desc=You can request assistance from a machine sprite on any Matrix action or complex form that targets a device to gain its Resonance attribute in bonus dice on your test.

#Protosapient Powers
critterpower.authority=Authority
critterpower.authority.page=114
critterpower.authority.desc=The Null convinces devices that its orders are coming from a trusted and privileged source: the owner. Whenever the Null uses Control Device of Spoof Command action, the Null gains 1 Edge that must be spent as part of the action, or vanish.
critterpower.entropic_conversion=Entropic Conversion
critterpower.entropic_conversion.page=114
critterpower.entropic_conversion.desc=Some protosapients have the rare ability to heal damage to their core code by reducing the ambient structural organization of the surrounding Matrix\u2014that is, by increasing entropy and converting the siphoned \u201Corganizational energy\u201D into its own structure through reverse entropy. With a Major Action, the entity heals 1D6 boxes of damage on its Matrix Condition Monitor and increases the ambient noise of the area by the same amount. Ambient noise subsides by 1 point per hour until it returns to normal.
critterpower.fnord=Fnord
critterpower.fnord.page=114
critterpower.fnord.desc=A Null can stay hidden from any GOD or anyone else in the Matrix it wishes. There is no mechanic attached to it. The Null simply disappears into the depth of the Matrix \u2026
critterpower.malleable_icon=Malleable Icon
critterpower.malleable_icon.page=114
critterpower.malleable_icon.desc=Entities with this ability can change their Matrix icon to mimic any other icon they have seen recently. While the ability does not stand up to heavy scrutiny, at first glance, it is very convincing. A single hit with Matrix Perception will see past it.
critterpower.munge=Munge
critterpower.munge.page=114
critterpower.munge.desc=Protosapients eat code to upgrade and maintain their own coding structure. This process is called munging (pronounced \u201Cmun-jing\u201D). When a protosapient munges data, it leaves behind random data that usually destroys or distorts whatever is being munged. For example, a munged icon might look like an indistinct mess, while a munged program would become either buggy or completely unusable.<br/>\
 Munging a piece of data is an Opposed test to eat the data or code that is defended by the host or device the data lives on. The protosapient makes a Charisma + Attack vs. Firewall + Data Processing Opposed test. If the protosapient fails, the data remains intact.<br/>\
 To munge a file, the protosapient must have access to it. To munge a program, the protosapient must be in either the same host in which the program is running or the same network as the persona running the program.<br/>\
 The gamemaster determines the extent of the damage caused by munging data using the following guidelines: an Agent/Pilot program or skill/know/activesoft should have its rating decreased by the Attack of the munging critter. If this causes the munged software to reach a rating of 0, the software is totally destroyed. The gamemaster may impose a threshold equal to the munging critter\u2019s Data Processing to read a file that has been munged with a Matrix Perception test. Icons may become twisted and corrupted, making them less identifiable, or at the very least more disturbing.
critterpower.munge_spark=Munge Spark
critterpower.munge_spark.page=115
critterpower.munge_spark.desc=While most protosapients munge code to maintain their own digital structure, a few have learned to survive by munging the actual Spark of other digital life forms. This is basically vampirism within the digital realm.<br/>\
 To use this ability, the victim must be immobilized during the entire process, typically by using the Paralyze attack (or maybe repeated applications of the Tarpit Matrix attack). Munge Spark requires a Minor Action once per combat round and must be continued every following round while keeping the victim immobilized. Munging to drain a point of Spark takes a Charisma + Attack ([12 \u2013 target\u2019s Spark)], 1 combat round) Extended test to drain a single point of Spark. If the attacker is interrupted during this process, or the victim manages to recover and escape before the threshold is reached, the life force remains intact, and the Spark is not drained. If a target\u2019s Spark is drained to 0, the digital life form dies. Typically, protosapients and xenosapients have 6 Spark, while sprites have an amount of Spark equal to their level. Partially reducing a sprite\u2019s Spark lowers their level by the same amount.<br/>\
 Munge Spark adds the stolen life force to the attacker\u2019s own Spark, but this can only increase the Spark to twice its natural maximum. Any Spark drained beyond this point is lost; the critter\u2019s core can only hold so much at a time. Once a protosapient starts to use Munge Spark to survive, their own Spark becomes unstable, and they will lose 1 Spark per week, even falling below their original level, forcing them to hunt new victims.
critterpower.noiseless=Noiseless
critterpower.noiseless.page=115
critterpower.noiseless.desc=For game purposes, Nulls are simply immune to Noise, at least based on distance. Gamemasters may allow Nulls to be affected by other sources of Noise (like one generated by a hacker or spam zones).
critterpower.primal_rage=Primal Rage
critterpower.primal_rage.page=116
critterpower.primal_rage.desc=The protosapient works itself into a frenzy due to damage it has received. All attacks by this protosapient gain +1 DV for each level of wound penalty it is currently suffering.
critterpower.noisestorm=Noisestorm
critterpower.noisestorm.page=116
critterpower.noisestorm.desc=As a Major Action, a protosapient using a noisestorm can make an Electronics + Logic test where net hits increase the amount of noise in the area. This can either target a network and affect all devices connected to it or target a specific device and use it as ground zero to affect all devices within (Spark x 10)-meter radius of its physical location. The protosapient is immune to this noise.
critterpower.psychotropic_biofeedback=Psychotropic Biofeedback
critterpower.psychotropic_biofeedback.page=116
critterpower.psychotropic_biofeedback.desc=Overseers can afflict their targets with psychotropic biofeedback. This means Overseers inflict Biofeedback damage. Each time actual damage is inflicted, the target must make a Willpower + Firewall test with a threshold equal to the Attack\u2019s net hits to avoid suffering from a psychotropic effect.<br/>\
 Psychotropic effects are short-term emotional adjustments lasting for (2d6 \u2013 Edge) hours. This may include effects such as aversions to certain objects or activities, the desire for a certain product, complacency or lethargy, guilt, paranoia, aversion to the Matrix, other phobias, and so on. Short-term memory loss is also an option. The target cannot be largely incapacitated or reduced to a catatonic state, but they will behave in a markedly strange fashion
critterpower.virtual_processing=Virtual Processing
critterpower.virtual_processing.page=116
critterpower.virtual_processing.desc=Nulls do not truly execute programs. The provided list is just a way to simulate some of their abilities. They always run all of their programs.

#Metatype AI
metatype.pilot-ai=Pilot AI
metatype.pilot-ai.page=117
metatype.pilot-ai.desc=Originally you have been a drone pilot when suddenly the Spark of life gave you awareness.
metatype.agent-ai=Agent AI
metatype.agent-ai.page=117
metatype.agent-ai.desc=Originally you have been a data processing agent when you saw more in the patterns that awakened you from your ignorance.
metatype.deep_foundation_ai=Deep Foundation AI
metatype.deep_foundation_ai.page=117
metatype.deep_foundation_ai.desc=You were born in the Deep Foundation.
metatype.realms_ai=Resonance Realms AI
metatype.realms_ai.page=117
metatype.realms_ai.desc=You were born in one of the Resonance Realms

#Special AI qualities
quality.chatty=Chatty
quality.chatty.page=119
quality.chatty.desc=The character is especially comfortable behind the mask of anonymity offered by the Matrix. The extra confidence grants the character a point of Edge when communicating via AR or VR.
quality.designer=Designer
quality.designer.page=119
quality.designer.desc=Some AIs are experts at restructuring firmware to achieve maximum hardware efficiency. Their self-designed home device (see <b>Restoration and Realignment</b>, p. 124) grants them an additional +1 modifier to the Data Processing or Pilot attribute and 2 points of noise reduction.
quality.hello_world=Hello World!
quality.hello_world.page=119
quality.hello_world.desc=AIs with this quality have an ingrained set of sanity-checking measures that help prevent Fragmentation after disruption. AIs with Hello World gain a point of Edge on any tests to resist Spark loss. The point of Edge must be spent on the Resistance test, or it is lost.
quality.inherent_program=Inherent Program
quality.inherent_program.page=119
quality.inherent_program.desc=This AI evolved from a specific cyberprogram and never lost the functionality of that program. Players may pick one common or hacking cyberprogram (but not an autosoft) as an integral part of their character\u2019s Core. Inherent programs don\u2019t require an empty program slot other than the one the AI is currently occupying and are considered to be running at all times.<br/>An inherent program is deeply intertwined with the core programming of the AI and cannot be crashed with the Crash Program action. <br/>An illegal program does not accumulate any overwatch score (OS), except for any actions using it.
quality.improved_restoration=Improved Restoration
quality.improved_restoration.page=119
quality.improved_restoration.desc=AIs with this quality evolved more effective regeneration routines in their source code. For every interval of the Extended Healing test, if at least a single hit is rolled, one additional box on the Matrix Condition Monitor is healed.
quality.low_profile=Low Profile
quality.low_profile.page=120
quality.low_profile.desc=This AI has learned to minimize its shadow in the Matrix, allowing it to operate for longer periods of time before convergence. AIs with this quality require their OS to reach 60 before convergence happens.
quality.multi_processing=Multiprocessing
quality.multi_processing.page=120
quality.multi_processing.desc=Multiprocessing grants the ability to process information simultaneously from multiple sources while online. Combat still requires the AI\u2019s full attention, but multiple types of other, more mundane tasks can be handled simultaneously. <br/>For example, an AI with this quality can browse the Matrix and simultaneously hold a conference call, providing full attention to each channel of information. Observe in Detail (p. 43, SR6) and Matrix Perception tests (except when it\u2019s an Opposed test) count as Minor Actions for the character. <br/>\
 The AI also receives an additional Minor Action per turn when not directly engaged in Matrix or vehicle combat. The AI can simultaneously observe a number of information sources equal to its Data Processing.
quality.pilot_origins=Pilot Origins
quality.pilot_origins.page=120
quality.pilot_origins.desc=An AI with this quality likely evolved from a drone pilot program and retained its abilities. The AI may jump into drones and vehicles, controlling them like a rigger. Each level of this quality grants the bonus of a control rig of an equal rating. The AI is also capable of loading, converting, and using drone autosofts equal to its Data Processing (AI-driven drones use the attributes, skills, and Matrix Initiative of the AI). <br/>\
 As a side note, this is piloting by pure calculation and data processing; it does not include the simsense processing ability of the Control Rig Integration codemod. <br/>The two methods are incompatible and do not stack with each other or with any Resonant echoes.
quality.redundancy=Redundancy
quality.redundancy.page=120
quality.redundancy.desc=Essential algorithms, routines, and other program structures are multiplied in the core of the virtual life form, making it harder to kill. The life form gets two additional boxes on its Matrix Condition Monitor. These additional boxes will stack with any boxes gained from the codemod Core Code Redundancy.
quality.sapper=Sapper
quality.sapper.page=120
quality.sapper.desc=The AI has an intuitive sense for vulnerabilities in boot code. It receives 1 point of Edge on all Format Device actions. This Edge must be spent on the action or is lost.
quality.sensor_upgrade=Sensor Upgrade
quality.sensor_upgrade.page=120
quality.sensor_upgrade.desc=The AI is an expert at tweaking the sensor settings of devices linked to it. The AI adds a +1 to the Sensor rating of any vehicle, drone, or device that is linked to its icon. All functions of a single sensor array gain this bonus, if applicable. This bonus also applies to any device the AI is currently running on.
quality.snooper=Snooper
quality.snooper.page=120
quality.snooper.desc=The virtual life form is more effective at accessing and manipulating communication streams. It receives an Edge when performing Snoop and Jam Signal actions. The Edge must be spent on the test, or it goes away.
quality.virtual_stability=Virtual Stability
quality.virtual_stability.page=120
quality.virtual_stability.desc=This AI is an expert at juggling system resources to run more programs with less exertion. The AI can load the Virtual Machine cyberprogram on a device, a sideload driver, or emulate it on the grid without taking the additional box of Matrix damage that is normally inflicted when its persona is damaged.
quality.cascading_failure=Cascading Failure
quality.cascading_failure.page=120
quality.cascading_failure.desc=The AI suffers from additional system failures while operating with damaged code. AIs who have this quality and are wounded increase their wound penalty by 1 point. This means one wound will cause the first modifier.
quality.corruptor=Corruptor
quality.corruptor.page=120
quality.corruptor.desc=Virtual lifeforms with the Corruptor negative quality suffered fundamental defects to their programming during their evolution. The critter has an unfortunate tendency to trigger malfunctions in other programs sharing the same device. <br/>Treat this as if the life form has the Gremlins quality (p.76, SR6). The gamemaster should make use of this quality for dramatic effect as best suits the story.
quality.doomscrolling=Doomscrolling
quality.doomscrolling.page=121
quality.doomscrolling.desc=With so much content on the Matrix to peruse, it is difficult for an AI or EI to properly take the time to do their restoration. Each day, the AI must make a Firewall + Willpower (3) test to successfully complete restoration. If they fail, they cannot gain more than 2 Edge from any source of Edge that day.
quality.easily_exploitable=Easily Exploitable
quality.easily_exploitable.page=121
quality.easily_exploitable.desc=This AI has a massive flaw in its code that weakens the security of any device it runs on. The AI doesn\u2019t provide a bonus to the Firewall attribute when it optimizes a device. Any time Firewall is used in an Opposed test, the AI\u2019s opponent gains an extra point of Edge that must be used on the test or lost.
quality.fragmentation=Fragmentation
quality.fragmentation.page=121
quality.fragmentation.desc=During its birth, or because of permanent Spark damage, the AI\u2019s core programming was fractured and failed to fully merge properly\u2014or a core element of its programming was somehow deleted or lost. This creates fundamental flaws in the AI\u2019s personality. Fragmented AIs suffer from effects that make their behavior unpredictable. The gamemaster should choose an appropriate option for the AI, one that both makes its character unique and hampers its functioning. The Fragmentation Suggestions table offers some examples of existing negative qualities. <br/>\
 At the gamemaster\u2019s discretion, this quality may inflict negative dice pool modifiers to certain tests, especially social interactions. <br/>\
 If chosen at character creation, the character starts off with Spark 5 instead of the normal Spark 6. If this quality is gained during play due to disruption, the AI loses 1 point of Spark. If they have 0 or less Spark, they die.<br/>\
 In addition, any Spark lost to fragmentation cannot be filled with codemods or converted using Neuromorphism.
quality.invalid_references=Invalid Inferences
quality.invalid_references.page=121
quality.invalid_references.desc=This AI\u2019s base code makes it difficult to learn the right things from all the data collected. Increasing an attribute, Active skill, Knowledge skill, or learning a complex form costs 1 Karma more.
quality.out_of_memory_exception=Out of Memory Exception
quality.out_of_memory_exception.page=121
quality.out_of_memory_exception.desc=AIs with this quality suffer limited available space to run programs regardless of what device they are on. The number of available program slots is reduced by 1. This includes both the device and the AI\u2019s programs.
quality.persnickety_renter=Persnickety Renter
quality.persnickety_renter.page=121
quality.persnickety_renter.desc=The AI with this quality is limited in what they can call their home devices (see Restoration and Realignment, p. 124). This quality is taken for a specific type of device (e.g., commlinks, drones, devices with a rating equal to or greater than 4, etc.). The device must be able to load apps, autosofts, or cyberprograms in order to be a home device.
quality.real_world_naivete=Real World Naïveté
quality.real_world_naivete.page=121
quality.real_world_naivete.desc=As creatures of the Matrix (and as critters of limited understanding), virtual lifeforms are at best ignorant of the defining aspects of the physical world. Things like gravity, friction, and inertia have no meaning to them. Even if their original programming involved interaction with the physical world in some way, they may not fully grasp the entirety of it. As a result, virtual lifeforms have little knowledge of the real world and grant opponents a point of Edge when interacting with it or otherwise exercising knowledge about it.

#Special AI gear
item.attribute_augmentation=Attribute Augmentation
item.attribute_augmentation.page=125
item.attribute_augmentation.desc=This codemod permanently increases the effective value of one of the AI\u2019s basic attributes by the rating of the codemod. The ASDF attributes are much easier to increase than Willpower, Logic, Intuition, or Charisma, and this makes the ASDF attribute augmentations both less expensive and less invasive than the remainder of the AI\u2019s attribute augmentations. <br/>ASDF increases from an attribute augmentation codemod do not stack with ASDF increases from Resonance or Echoes.
item.attribute_overclocking=Attribute Overclocking
item.attribute_overclocking.page=126
item.attribute_overclocking.desc=A method for temporarily increasing the effective value of one of the AI\u2019s basic attributes, Attribute Overclocking must be coded to one of the AI\u2019s attributes and only affects that attribute. Like attribute augmentations, the ASDF attributes are much easier to increase than Willpower, Logic, Intuition, or Charisma, and are both less expensive and less invasive. This codemod requires a Minor action to activate.<br/>Once activated, roll (Attribute Overclocking rating x 2) dice. Each hit temporarily boosts the rating of the designated attribute by 1, up to the augmented maximum of +4. This only affects dice pools, so Initiative rank, Condition Monitor, Defense rating, and so forth is unchanged. The effect lasts for (net hits) combat rounds, and when it runs out, the AI must resist damage with Firewall + Willpower, equal to the attribute Boost gained. ASDF increases from an Attribute Overclocking codemod do not stack with ASDF increases from Resonance or Echoes.
item.quantum_processor=Quantum Processor
item.quantum_processor.page=126
item.quantum_processor.desc=By emulating the operation of quantum entanglement-based data processors, this codemod increases the reaction speed of the AI. Add +1 initiative and 1 additional initiative dice per point of rating, up to the normal maximum of 5 dice. This increase applies for all initiative rolls, and unlike initiative-boosting cyberware, the Quantum Processor codemod is always active.

#Paragons
quality.paragon=Paragon
quality.paragon.page=129
quality.paragon.desc=You believe in something other than yourself to help guide and channel your resonance, and that something believes in you, too. Whether it be the Architect or the Black Hat, you utilize your beliefs to shape and focus your abilities more easily.

mentorspirit.zero_one=01 (The World Tree)
mentorspirit.zero_one.page=129
mentorspirit.zero_one.desc=Zero-One is the very foundation of the Matrix. Sometimes called the World Tree, it links the Deep Realms with the standard data-based Matrix. One of the oldest and most followed of the paragons, it seems to want harmony and to maintain the flow of Matrix information, and it does this by feeding information to the right people at the right time. This is the only paragon that seems to want its followers to group up, and there are many virtual tribes who have 01 as a patron.<br/><br/>\
 <b>Advantage</b>: Edge Boosts cost 1 less when making a test to gain access to a network or device.
mentorspirit.zero_one.disadvantage=Cannot gain or spend Edge when acting only in AR. Favor is lost if the technomancer knowingly works against another group that follows 01, and favor can be regained by advancing that same group.
mentorspirit.architect=Architect (The Builder)
mentorspirit.architect.page=130
mentorspirit.architect.desc=Not as interested in the result of what they build, the Architect is invested in the act of creation. Once the well-designed and integrated code or infrastructure is complete, the architect loses interest and moves on to their next big project.<br/><br/>\
 <b>Advantage:</b> Edge Boosts cost 1 less for Edit actions.
mentorspirit.architect.disadvantage=Cannot gain or spend Edge for Snoop actions. Favor is lost if the technomancer has not created software for a while, and it is lost faster if the last software created was not a challenging project. Favor can be regained with a large coding project.
mentorspirit.black_hat=Black Hat (The Code-Cracker)
mentorspirit.black_hat.page=130
mentorspirit.black_hat.desc=The opposite of the Architect, Black Hat has little interest in creating new things; it prefers to take things made by someone else. Data, programs, drones, and anything that can be stolen is what the Black Hat seems interested in. Oddly, it doesn\u2019t hoard things. It\u2019s more interested in the theft than what happens afterwards.<br/><br/>\
 Advantage: Edge Boosts cost 1 less for Cracking tests.
mentorspirit.black_hat.disadvantage=Cannot gain or spend Edge when setting a Data Bomb. Favor is lost if the technomancer builds a secure system with no back doors, and may be regained by defeating a security spider in cybercombat.
mentorspirit.delphi=Delphi (The Oracle)
mentorspirit.delphi.page=130
mentorspirit.delphi.desc=The paragon known as the Oracle is an experimenter. By collating large numbers of data feeds, it picks patterns and trends, and uses those trends to predict the future. It\u2019s very good when it has lots of data to work with; it is much less reliable when trying to work with things that have just sprung up, or which have undergone a large change. The Oracle uses the same algorithms that megacorps apply to the stock market to collate everything from vending machine maintenance figures to national electricity usage. This paragon is an excellent friend who can give you a heads-up when there is trouble on the way.<br/><br/>\
 Advantage: Edge Boosts cost 1 less when threading complex forms.
mentorspirit.delphi.disadvantage=\u20132 modifier to the technomancer\u2019s Matrix Initiative Score. Favor is lost when the technomancer disrupts established data patterns (by stealing a prototype without being asked to, for example), but can be regained if the technomancer reveals why they did it, and what\u2019s happened since.
mentorspirit.shooter=Shooter (The Soldier)
mentorspirit.shooter.page=130
mentorspirit.shooter.desc=Combat simulations and tactical attack games have been part of the Matrix since before the Matrix was a thing. Shooter revels in contests of strength and combat prowess in games, but also in the meatworld and the Matrix. Perhaps we are the avatars and icons of Shooter, who is playing meatworld games the same way we play Matrix connected games. Whatever the case may be, Shooter thirsts for battle, however it may be fought.<br/><br/>\
 Advantage: Edge Boosts cost 1 less in cybercombat.
mentorspirit.shooter.disadvantage=Cannot gain or spend Edge when compiling sprites. Favor is lost when the technomancer loses a fight, but can be regained if the technomancer wins another one.

#Resonance streams
quality.machinists=Stream: Machinists
quality.machinists.page=130
quality.machinists.desc=Technomancers who identify as machinists are in tune with machines of all types. They identify with gears, moving parts, and other machine properties in ways that make an average steampunk aficionado seem restrained.<br/><br/>\
 <b>Benefits</b><br/>\
 \u2022 All complex forms that affect devices reduce Fade Value by 2.<br/>\
 \u2022 +2 dice pool bonus to Compiling and Decompiling tests involving Machine sprites.<br/><br/>\
 <b>Aspect Peripheral</b><br/>\
 Machinists have such an affinity for machines that the very thought of controlling only one at a time is anathema. They have learned to twist the Resonance in such a way that their living persona can function as an RCC, emulating all the abilities available to anyone using an RCC (minus the ability to form or join a network; that requires Echo Living Network, p. 195, SR6). The new attributes are gained in addition to their normal Matrix attributes. The noise reduction rating is equal to the machinist\u2019s Willpower, and the Sharing rating is equal to the machinist\u2019s Charisma.
