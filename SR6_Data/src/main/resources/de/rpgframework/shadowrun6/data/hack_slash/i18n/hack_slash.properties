#Actions
action.calibration=Calibration
action.calibration.page=28
action.calibration.desc=You lend your team your own processing power and boost their speed. You can increase the current Initiative Score of you and your team by 1 for every 2 hits. The total amount of Initiative Score increase granted to a persona cannot be greater than your Data Processing, and only one Calibration effect can be active at a time. The Initiative Score then decreases by 1 each Combat Turn until it returns to the normal initiative score. This bonus applies to anyone with an AR feed that shares the decker\u2019s PAN. The hacker can only share their feed with a number of users equal to or less than their device rating.
action.delayed_command=Delayed Command
action.delayed_command.page=28
action.delayed_command.desc=You send a payload to a device that contains a command and time delay that the target perceives as coming from its owner. The device then automatically attempts to perform the action when the time delay is passed. On success, the command will execute even if the host turns off their wireless functionality. If the device is rebooted before the command executes, the delayed command is lost.
action.denial_of_service=Denial of Service
action.denial_of_service.page=28
action.denial_of_service.desc=Wireless devices become nearly unusable when you pollute their data streams with noise. A decker or technomancer may target a wirelessly active device or persona. Make an Electronics + Logic vs. Willpower + Firewall Opposed test and apply the number of net hits x 2 as a negative dice pool modifier to all tests made with that device until the end of the next combat round.
action.device_lock=Device Lock
action.device_lock.page=29
action.device_lock.desc=Sometimes the easiest way to get away from a hack is to just turn off your wireless. The attack targets a device, and on success prevents the device from going offline for a number of rounds equal to net hits. Once the number of rounds has expired, the decker or technomancer can spend a Minor Action to extend the device lock by a round. This extension can only be done once.
action.garbage_in=Garbage In/Garbage Out
action.garbage_in.page=29
action.garbage_in.desc=This command allows the decker to \u201Ccross the wires\u201D of a single device, confusing some of the inputs and outputs of the system. A single input can be rerouted to execute a different command. For example, a commlink could have its call function altered to automatically delete the contact information of the person that its user intended to call. A camera could switch the rewind function with that of the fast forward function.<br/>The command can\u2019t override the basic safety features of the device or system, and the gamemaster has final say in what can be accomplished with the command.
action.known_exploit=Known Exploit Backdoor Entry
action.known_exploit.page=30
action.known_exploit.desc=This action is linked to the Sleaze Attribute.<br/>You attempt to run through a set of previously known exploits in order to gain illicit entry into a host, device, or other Matrix area. This action does not require a previously successful Probe, but against a fully patched host is going to be less likely to be successful. Runners performing this action are unable to gain or spend Edge. In addition, the host or device gains a point of Edge that is either spent immediately on that action or disappears.<br/>If the test is successful, you gain Admin access to the target, and it does not count as illegal Admin access (though taking illegal Matrix Actions will still increase your Overwatch Score). <br/>Failing this test does not immediately set off alarms, but the character\u2019s OS increases as normal.
action.masquerade=Masquerade
action.masquerade.page=30
action.masquerade.desc=This action allows a hacker to impersonate a persona on the Matrix. Since persona data is updated in real time, this action is difficult to execute successfully. For every net hit scored on a Cracking + Logic vs. Data Processing + Intuition, you convince Matrix systems and casual observers that you are the target for one minute. This can be used to impersonate someone online, intercept their calls, use their social media, rummage through their email history, or otherwise create mischief, but processes like changing device owners or performing major financial actions (like bank transfers) have too many double-checks for Masquerade to work.<br/>If the persona you\u2019re impersonating logs off, the disguise drops. While masquerading, you are never considered the owner with regard to any of the impersonated persona\u2019s devices.
action.metahuman_in_the_middle=Metahuman in the Middle
action.metahuman_in_the_middle.page=30
action.metahuman_in_the_middle.desc=This command inserts you in between any callsor Matrix actions that go into or out of a device. On a successful test, all communications bounce through your device for minutes equal to net hits.
action.modify_icon=Modify Icon
action.modify_icon.page=30
action.modify_icon.desc=Sometimes you want your Ares Predator VI\u2019s Matrix icon to look a little less threatening. This action allows a hacker to change a Matrix icon to look like a different icon. Each time your icon is scanned, you need to make an Electronics + Logic vs. the scanning device\u2019s Data Processing + Sleaze or device operator\u2019s Intuition + Data Processing to not be detected.
action.popup=Popup
action.popup.page=30
action.popup.desc=It\u2019s so irritating when your entire display or view is completely blocked by popup AROs or windows that prevent you from doing what you intended. The decker or technomancer attempts a Cracking + Logic versus Intuition + Data Processing Opposed test against a target device or persona. The targeted device or persona is unable to spend Edge for a number of combat rounds equal to net hits.
action.squelch=Squelch
action.squelch.page=30
action.squelch.desc=A successful Squelch test prevents the target device from calling or sending messages for a number of minutes equal to the net hits scored.
action.subvert_infra=Subvert Infrastructure
action.subvert_infra.page=30
action.subvert_infra.desc=This action allows a decker or technomancer to slightly alter the operation of multiple physical devices so they respond to the hacker\u2019s commands. If the hacker has at least Admin access on the host, a successful Electronics + Intuition vs. Intuition + Firewall or 2 x Firewall test allows them to control one group of similar simple devices (traffic lights, vending machines, home appliances, desk lamps, etc., at gamemaster discretion) slaved to that host for every net hit. This action cannot be used to make an attack. The hacker can sustain controlling these devices as a Major Action each combat round.
action.threat_analysis=Threat Analysis
action.threat_analysis.page=31
action.threat_analysis.desc=Instead of attacking, the hacker engages threat-highlighting software, giving allies an edge to their defenses. Threat Analysis allows the hacker to give a Defense test bonus to all allies with access to an AR feed. The number of bonus dice equals the number of hits on an Electronics + Logic test. This bonus lasts until the beginning of the hacker\u2019s next turn. This bonus applies to anyone with an AR feed that shares the decker\u2019s PAN. The hacker can only share their feed with a number of users equal to or less than their Data Processing.
action.virtual_aim=Virtual Aim
action.virtual_aim.page=31
action.virtual_aim.desc=A decker or technomancer gains +1 dice pool bonus with the use of this action from studying their target\u2019s defenses. The action can only be taken once per combat round, and the bonus is carried over to the next round if unused until they fail to use a Virtual Aim action on that round or if they attack. The maximum dice pool bonus from the use of this action equals the character\u2019s Willpower. The bonus can be applied to any Matrix attack action such as Data Spike, Tarpit, or Resonance Spike.
action.watchdog=Watchdog
action.watchdog.page=31
action.watchdog.desc=Target must be a persona or device. The number of net hits is how many combat rounds the program stays active. If successful, the player can see what the target is doing on their devices. The user is now aware of the Matrix Actions the target is going to use before they use them, and they may attempt to stop them. Watchdog allows the hacker to use Threat Analysis as a minor action if the attack originates from the target.
action.batch_execution=Batch Execution
action.batch_execution.page=31
action.batch_execution.desc=This allows the decker to switch out all the programs actively running on their deck. Just use the Edge action and you can quickly reduce your OS accrual or go in ready to wreck some drek.
action.intervene=Intervene
action.intervene.page=31
action.intervene.desc=This allows the hacker to give an immediate defense bonus to the owner of a device slaved to the hacker\u2019s PAN. This action can be taken only if the device making the attack is wirelessly enabled and the hacker is aware of it. Roll your Electronics + Logic, adding the number of hits to your ally\u2019s dice pool.<br/>This bonus applies only to the current Defense test.It cannot be carried over to any other turn or action.
action.paint_target=Paint Target
action.paint_target.page=31
action.paint_target.desc=Paints a target in the team\u2019s AR, allowing them to know where the target is located. Removes Blinded status coming from Cover or Smoke grenades.
action.computer_virus=Computer Virus
action.computer_virus.page=31
action.computer_virus.desc=The aliens are going to destroy the Earth, and the only way we can successfully stop them is by loading this computer virus into their system. The runner who deploys this attack against a device or host prevents the target from taking any actions for minutes equal to net hits on the test. This can be used to prevent the host from recording footage from cameras or for locking a building as none of the security locks will disengage.
action.enhance=Enhance
action.enhance.page=31
action.enhance.desc=Sometimes the trid footage is unclear or maybe the audio is coming through garbled, but a quick shot of Enhance, and suddenly everything becomes clear! This Matrix action can be taken on the same turn or the turn immediately after performing a Matrix Perception test. Hits on the Enhance Matrix action are added to the previous Matrix Perception action.
action.ic_slicer=IC Slicer
action.ic_slicer.page=31
action.ic_slicer.desc=You are a master of taking down IC guarding the data that you are after and causing damage to any IC you target. Your attack has a Damage Value equal to your Attack attribute with one additional box of damage per net hit.<br/>This action is linked to the Attack attribute.
action.keyboard_commando=Keyboard Commando
action.keyboard_commando.page=32
action.keyboard_commando.desc=You\u2019re the fastest hacker on the planet, and there isn\u2019t an IC program out there that can catch you in the act. You can slice through a network\u2019s defense so fast that you can hack your way in and out in a single turn. With a single net hit, you gain User access; with four additional net hits, you gain Admin access. With each additional net hit beyond that, you can manipulate one device or file. You immediately exit the network after executing this action.
action.password_sequencer=Password Sequencer
action.password_sequencer.page=32
action.password_sequencer.desc=The host or device has a complex password that only the toughest number crunchers can handle. On each successful test, your decking process is able to sequence the next element in the password. The number of elements in the password is equal to the host\u2019s rating.
action.skull_and_crossbones=Skull and Crossbones Attack
action.skull_and_crossbones.page=32
action.skull_and_crossbones.desc=You are a master of preventing your opposition from taking actions. On a successful test, the opposition\u2019s screen or view is completely occluded by a giant animated ASCII skull and crossbones.<br/>The target cannot take any action until they have successfully completed an Electronics + Logic test where the threshold is equal to the number of net hits from the Skull and Crossbones Attack action.
action.we_are_in=We\u2019re In!
action.we_are_in.page=32
action.we_are_in.desc=Upon successfully hacking into a host or device, a triumphant yell tells your team that you are the best fragging decker on the planet. On success, reset your Edge pool back to your Edge rating. If you are currently over your Edge rating, then you do not reset.

action.emulate_cyberprogram=Emulate Cyberprogram
action.emulate_cyberprogram.page=124
action.emulate_cyberprogram.desc=As a Minor Action, an AI can load or unload a single cyberprogram run by surrounding processing power located in the Matrix and devices. Running illegal cyberprograms will begin to accrue OS. For additional information, see Emulation, p. 123.
action.realignment=Realignment
action.realignment.page=125
action.realignment.desc=As a Major Action, an AI can reset their core programming or optimize a device. For additional information, see Restoration and Realignment, p. 124.

#Gear
item.cyberhack=Cyberhack
item.cyberhack.page=33
item.cyberhack.desc=Cyberhacks are designed to take the place of an implanted cyberjack. They interface with an implanted datajack and cyberdeck to provide the additional processing power required for a decker's Data Processing and Firewall attributes. A cyberhack requires a wired connection to an implanted datajack in order to function. In this way, a cyberhack functions mostly like the implanted version. However, a cyberhack does not provide any Matrix initiative bonus, and the Matrix Edge actions that require an implanted cyberjack or Resonance attribute are not available. Any qualities that improve the effectiveness of a cyberjack do not apply to cyberhacks unless they explicitly state otherwise. When using a cyberhack, you may not switch your Data Processing and Firewall attributes. They can be enhanced, but not changed with other attributes.\nFurthermore, cyberhacks are bulky pieces of hardware. So far, no one has managed to make one smaller than an RCC, which makes them difficult to conceal. This has led to some creativity in disguising them as a legal electronic device, like a keytar. Due to the less intrusive hardware, a hacker using a cyberhack always takes Biofeedback damage as Stun damage-even when using hot sim VR.

tem.cyberdeck_core=Cyberdeck Core
item.cyberdeck_core.page=35
item.cyberdeck_core.desc=The core represents a tangled cluster of interconnected processor and data storage chips that do all the hard work and tie all of a cyberdeck's components together. This component provides the cyberdeck's Device Rating. The rating of an individual Attack or Sleaze module cannot be higher than the deck's Device Rating x 2. \nA cyberdeck has a number of available core slots equal to its Device Rating x 3. Each custom component takes up one or more core slots, but so do any connected devices. Note how many core slots are taken up by all of your cyberdeck's components, because this reduces how many wireless (and wired) devices you can connect to your deck's PAN. 
item.attack_module=Attack Module
item.attack_module.page=35
item.attack_module.desc=The attack module is a suite of processors and chips loaded with all the latest-as well as tried and-true-hardware tools for cracking codes, overwhelming firewalls, and generating obscene amounts of false data. This component provides an Attack attribute equal to its rating.
item.sleaze_module=Sleaze Module
item.sleaze_module.page=36
item.sleaze_module.desc=The sleaze module is a kit of chips prepped with password libraries, firewall exploits, and stealth tools. This component provides a Sleaze attribute equal to its rating.
item.breadbox_case=Breadbox Case
item.breadbox_case.page=36
item.breadbox_case.desc=A breadbox case is a slang term for a cyberdeck or cyberhack built with cheaper or out-of-date components, wired and hacked together to make them functional using a quantity-over-quality approach. A breadbox case cyberdeck or cyberhack is not portable. It takes up at least as much space as an old desktop computer, but most are sprawling affairs of devices that take up a whole room. It takes an hour to set up or break down a breadbox unit, and it's utterly useless when not properly set up. The advantage of a breadbox case is that the nuyen cost for any of the cyberhack and cyberdeck hardware is reduced by fifty percent.
item.briefcase=Briefcase
item.briefcase.page=36
item.briefcase.desc=A large briefcase-sized case can sometimes blend in, but it also stands out and is not easily concealed. The most common reason to go with this type of case is that it can comfortably house both a cyberhack and a cyberdeck.
item.briefcase.variant.deck_only=Cyberdeck
item.briefcase.variant.deck_only.desc=If the briefcase houses only a cyberdeck, its available capacity is 12.
item.briefcase.variant.deck_plus_hack=Cyberdeck and Cyberhack
item.briefcase.variant.deck_plus_hack.desc=This type of case can house a cyberhack, with room for a cyberdeck and 6 capacity.
item.commlink_case=Commlink Case
item.commlink_case.page=36
item.commlink_case.desc=The standard case is commonly repurposed from a discarded commlink, though they're easy enough to print off and put together if none is on hand. This case option has become the standard for most custom cyberdecks. It's cheap, easy to acquire, has a reasonable capacity, and is the simplest way to disguise them.
item.gonzo_case=Gonzo Case
item.gonzo_case.page=36
item.gonzo_case.desc=Gonzo cases are bizarre custom jobs, usually an unwise hacked-together combination of devices such as a "amethrower or combat axe. You can effectively build a cyberhack or cyberdeck case into, or rather more onto, pretty much anything you like at the expense of capacity and concealability. A cyberdeck case can be worked into nearly any device roughly the size of a heavy pistol or larger. A cyberhack is big and only works with bulky objects such as two-handed weapons.
item.gonzo_case.variant.deck=Cyberdeck
item.gonzo_case.variant.deck.desc=Any available capacity is almost always allocated for the gonzo hardening case mod.
item.gonzo_case.variant.hack=Cyberdeck and Cyberhack
item.gonzo_case.variant.hack.desc=Any available capacity is almost always allocated for the gonzo hardening case mod.
item.keytar_case=Keytar Case
item.keytar_case.page=37
item.keytar_case.desc=Keytars are equal parts dorky and badass, which makes them the perfect fit for deckers with attitude. These cases are designed to house both a cyberhack and a cyberdeck, but more importantly include a musical keyboard, synthesizer, and high-definition speaker system. These things have been around since before the Awakening and were a popular inspiration for some of the first portable cyberdecks. Plus ça change, eh, chummer?
item.keytar_case.variant.deck=Cyberdeck
item.keytar_case.variant.deck.desc=A keytar case just for a cyberdeck has an available capacity of 10.
item.keytar_case.variant.deck_plus_hack=Cyberdeck and Cyberhack
item.keytar_case.variant.deck_plus_hack.desc=This type of case was meant for a cyberhack/cyberdeck combo.
item.keytar_case.variant.deck_plus_hack_no_synth=Cyberdeck and Cyberhack without synthesizer
item.keytar_case.variant.deck_plus_hack_no_synth.desc=Available capacity increases if you remove the synthesizer components, but seriously, why would you do that?
item.rcc_case=RCC Case
item.rcc_case.page=37
item.rcc_case.desc=Using a case from an RCC has some of the advantages of a commlink case, but they tend to be bulkier. You can sling one under your jacket or carry it in a satchel, but they don't exactly fit in your pocket like a commlink can. That said, the extra bulk provides a lot of capacity for accessories and case mods. However, people will think you have drones available.
item.rcc_case.variant.deck=Cyberdeck
item.rcc_case.variant.deck.desc=RCC Case with only the Cyberdeck. If security becomes suspicious, you may have to pass a Con + Charisma test opposed by Judge Intentions to pass it off as harmless.
item.rcc_case.variant.deck_plus_rcc=Cyberdeck and RCC
item.rcc_case.variant.deck_plus_rcc.desc=If you would like the case to include a functional RCC (because drones are fun, too!), the capacity is reduced.
item.rcc_case.variant.deck_plus_hack=Cyberhack
item.rcc_case.variant.deck_plus_hack.desc=This type of case can barely fit a cyberhack. If you use an RCC case to house a cyberhack instead, it will have no room for a functional RCC or cyberdeck and no capacity for case mods.
item.wearable_case=Wearable Case
item.wearable_case.page=37
item.wearable_case.desc=Instead of having your cyberdeck components all together within a compact case, you can break them up into a number of smaller modules that are designed to connect via data cables. This has led to the innovation of designing clothing and armor with cables, connection ports, and shielded pockets for components. A cyberdeck can be designed to slot into a special armor modification with the drawback of zero additional capacity. The benefit is that unless you are thoroughly searched, your illegal cyberdeck gains complete concealment. Even on sensor scans, this does not stand out as unusual or suspicious technology, usually mistaken for commonly worn biomonitor systems. This case requires specially modified clothing or armor. In the case of clothing, add the nuyen cost to any outfit. 
item.wearable_case.variant.armor=Armor mod
item.wearable_case.variant.armor.desc=If you'd like to have it built into your armor, it takes up 1 capacity (armor capacity).

item.additional_jacks=Additional Jacks
item.additional_jacks.page=37
item.additional_jacks.desc=Each additional universal dataport takes up 1 capacity.
item.built_in_accessory=Built-In Accessory
item.built_in_accessory.page=37
item.built_in_accessory.desc=If you want a built-in accessory such as a trid projector, printer, sensor, or other gadget, the capacity required is its rating or 2, whichever is higher. If the item has a listed capacity requirement, such as for cyberlimb or armor mods, that applies instead. Note that many of these devices can still be connected and used by your device wirelessly or via direct connection, but built-in devices have the advantage of not counting against the device limit or core slots of a cyberdeck.
item.dart_launcher=Dart Launcher
item.dart_launcher.page=37
item.dart_launcher.desc=A concealed dart-launcher can be installed in a case for only one capacity per shot. This launcher can be loaded with a normal injection dart to deliver a drug or toxin, a taser dart that deals 4S(e) damage, or even a data tap (see arrow tap below). Using the dart launcher requires the Exotic Weapons skill and is covered under the same specialization as other dart launchers. Attack Rating: 8/8/-/-/-.
item.gonzo_hardening=Gonzo Hardening
item.gonzo_hardening.page=37
item.gonzo_hardening.desc=This modification is usually only used for gonzo cases incorporating weapons and cyberhacks together. It has the same effect as the hardening modification, with the addition that you can freely make melee attacks and blocks using your case with no danger of damage to internal electronics. This takes up 2 capacity.
item.hardening_case=Hardening
item.hardening_case.page=37
item.hardening_case.desc=Your hardware is well-protected from physical harm. Unless your hardware is specifically targeted by an attack or used as a melee weapon, you never have to worry about it taking Physical damage, even from explosions or extreme falls. This modification takes up 1 capacity.
item.shock_shield=Shock Shield
item.shock_shield.page=38
item.shock_shield.desc=With a Minor Action, or under pre-programmed conditions, your case will discharge a powerful electric shock affecting anything touching it. When this occurs, your system will shut down abruptly, causing dumpshock if you are jacked in (and worse if you are touching the device). Internal shielding combined with the auto shutdown prevents damage to internal electronics, and the outer shielding of your data cable prevents transmission of the shock back to your headware or other connected devices. Anyone or anything touching the outer case will take 6S electrical damage. More powerful systems with larger capacitors are capable of dealing a stronger shock. The basic system takes up 4 capacity. For each additional 1 capacity allocated to this system, increase the damage by +2S(e), to a maximum of 14S(e). After each use, the system must be recharged, which requires one hour via wireless Matrix recharge or one minute via power cable.
item.internal_program_slot=Internal Program Slot
item.internal_program_slot.page=38
item.internal_program_slot.desc=A program slot is a data storage device and processor chip that augments a cyberdeck with the ability to run a cyberprogram. A custom cyberdeck starts with a number of program slots equal to its device rating, but you can add more at the expense of core slots. Each additional internal program slot takes up one CPU port.
item.dedicated_program_slot=Dedicated Program Slot
item.dedicated_program_slot.desc=A dedicated program slot is designed to store and run a specific cyberprogram, which cant be altered without changing out the components. A dedicated program slot runs more efficiently and takes up less space, but you can't use it to run any cyberprograms other than the one it's designed for. These are most often used for Baby Monitor or Agent software.
item.response_increase=Response Increase
item.response_increase.page=38
item.response_increase.desc=A response increase module includes additional processor chips, along with the cooling systems required to prevent your deck from combusting. They get hot, but they boost your speed on the Matrix, and sometimes that's all you need. \nEach rating increases your initiative dice in VR mode. There are some limitations and drawbacks. These only function when used with a cyberhack and are incompatible with the cyberjack augmentation. Also, these things run hot. Your deck takes one box of Matrix damage for every 1 rolled on any of your initiative dice while it is active. You can turn it on or off with a Minor Action, which will cause it to activate or deactivate at the start of the next combat round.
item.reality_filter=Reality Filter
item.reality_filter.page=38
item.reality_filter.desc=A reality filter is designed to translate all Matrix iconography to fit a programmed aesthetic. In addition to allowing you to make the Matrix look like the fantasy world of your choosing, you're able to set up key iconography that allows you to more quickly process and respond to what you're seeing. If you have an active reality filter and are using a cyberhack, you may use the Matrix Edge actions that normally require an implanted cyberjack. Other possible effects of this tech are unlocked through positive and negative qualities.
item.turbo_charger=Turbo Charger
item.turbo_charger.page=38
item.turbo_charger.desc=Custom deckmeisters have the freedom to experiment without the restrictions of manufacturer specifications or safety regulations, and a number of designs have popped up that allow for significant short-term increases to a cyberdeck's capabilities at the expense of potentially melting the whole thing. Deckers crazy enough to strap these mods onto their deck are either very careful to use them sparingly or willing to set themselves on fire. You may activate or deactivate the turbo-charger with a Minor Action. Activating and deactivating the turbo-charger takes effect immediately. While active, add a number of wild dice to your dice pool equal to the turbo-charger's rating on any Matrix Actions. Your cyberdeck takes one box of Matrix damage every time any of the wild dice roll a 1, 5, or 6.
item.external_program_carrier=External Program Carrier
item.external_program_carrier.page=38
item.external_program_carrier.desc=An external program carrier provides the capability to run one cyberprogram but is not powerful enough to run an agent (see agent box below). External program carriers can wirelessly connect to any cyberdeck, but most hackers prefer to connect them directly via data cable.
item.cyberjack_booster=Cyberjack Boosters
item.cyberjack_booster.page=38
item.cyberjack_booster.desc=If you aren't squeamish about getting a cyberjack installed in your head, why not take it even further? Hackers have designed devices that are capable of enhancing a cyberjack's capabilities. They augment the power of a cyberjack augmentation in a specific way, but are bulky objects too large to be implanted. Each cyberjack booster must be plugged into a datajack directly via cable. They're roughly the size of your average commlink, so most of them are built into commlink cases to disguise their true purpose. That said, most people don't walk around jacked into the one commlink they own, let alone several at the same time. When jacked in and powered on, a cyberjack booster provides a bonus based on its type. Cyberjack boosters only work with the cyberjack augmentation. They are incompatible with cyberhacks.
item.cyberjack_booster.variant.data_processing=Cyberjack Booster Data Processing
item.cyberjack_booster.variant.data_processing.desc=A Data Processing cyberjack booster improves that Matrix attribute by its rating. If you rotate out any of your Matrix attributes, the bonus from the cyberjack booster still modifies the Data Processing attribute.
item.cyberjack_booster.variant.firewall=Cyberjack Booster Firewall
item.cyberjack_booster.variant.firewall.desc=A Firewall cyberjack booster improves that Matrix attribute by its rating. If you rotate out any of your Matrix attributes, the bonus from the cyberjack booster still modifies the Firewall attribute.
item.cyberjack_booster.variant.matrix_initiative=Cyberjack Booster Matrix Initiative
item.cyberjack_booster.variant.matrix_initiative.desc=A Matrix Initiative booster adds its rating in additional initiative dice when in VR, up to a maximum of five initiative dice. The Matrix Initiative booster has a problem with heat build-up and shuts itself off after five minutes of use. It takes one hour for the device to cool off after use, during which time it is uncomfortably warm to the touch.

item.data_tap_projectile=Arrow Tap
item.data_tap_projectile.page=40
item.data_tap_projectile.desc=If you can't get close to a device to install a data tap, why not strap one onto an arrow or crossbow bolt? Well, it's not that simple. Quite a lot of innovation has gone into making these things work. These marvelous projectiles repurpose a micro-drone into a data tap delivery system and fits it all within an oversized arrowhead. Using these requires considerable accuracy. It takes a Major Action to bring the arrow tap online and designate the device you wish to have it connect to. Then you must score at least 3 net hits on an attack test to hit your target. If successful, the arrowhead pierces the case or sticks into the wall next to it (doing effectively zero damage), then dissolves due to a chemical reaction similar to that used in stealth grapple line technology. The microdrone activates, connects the data tap (no further rolls required), and bricks itself. As long as no one saw or heard you shoot the target, the tap is not any more obvious than a standard one. No Stealth test is allowed to make it harder to spot, though. Arrow taps are one-use items. If you fire one and miss, the projectile will dissolve, and the microdrone will self-destruct.
item.data_tap_projectile.variant.arrow=Arrowhead tap
item.data_tap_projectile.variant.arrow.desc=If used as a weapon, reduce base damage to 1P.
item.data_tap_projectile.variant.bolt=Crossbow tap
item.data_tap_projectile.variant.bolt.desc=If used as a weapon, reduce base damage to 1P.
item.data_tap_projectile.variant.dart=Dart tap
item.data_tap_projectile.variant.dart.desc=If used as a weapon, reduce base damage to 1P.
item.data_tap_projectile.variant.shuriken=Shuriken tap
item.data_tap_projectile.variant.shuriken.desc=If used as a weapon, reduce base damage to 1P.
item.data_tap_projectile.variant.knife=Throwing knife tap
item.data_tap_projectile.variant.knife.desc=If used as a weapon, reduce base damage to 1P.
item.data_tap_projectile.choice.duration=Battery life
item.data_tap_projectile.choice.duration.standard=Standard
item.data_tap_projectile.choice.duration.standard.desc=Once activated, an arrow tap will only function for five minutes.
item.data_tap_projectile.choice.duration.long_life=Longer battery life
item.data_tap_projectile.choice.duration.long_life.desc=A more expensive version with longer battery life is available, which lasts for thirty minutes.
item.grapple_tapper=Grapple Tapper
item.grapple_tapper.page=40
item.grapple_tapper.desc=Someone looked at the concept of a grapple gun and had the inspiration to use it to establish direct wired connections. These grapple guns are a complete redesign of the original and are much smaller. Roughly the size of a large revolver with a data cable spool in place of a cylinder with bullets, the end is capped with a small metallic pod. In order to use one, first take a Minor Action to activate the pod. To connect to the target, make an Athletics (Bows) + Agility (3) test. If you target a vehicle or drone, the pilot may make a defense test against your attack, and you require 3 net hits to make a connection. When fired, the pod extends its grapple claws and latches onto the target, then secretes a conductive gel that is used to establish a crude connection for the data tap. If it attack is successful, the connection is automatically established through the grapple gun's cable. This establishes a direct wired connection. Removing the grapple takes a Major Action and does not require a test. If the cable is cut, the connection is severed. The cable can be retracted after use, but the data tap is a one-use item that is not recoverable. It's worth noting that while the data tap has no wireless connection of its own, the grapple gun's wireless function can be enabled for wireless access to any device it connects to.
item.grapple_tapper_cable=Grapple Tapper Cable
item.grapple_tapper_cable.page=44
item.grapple_tapper_cable.desc=50m cable spool
item.grapple_tapper_pod=Grapple Tapper Pod
item.grapple_tapper_pod.page=44
item.grapple_tapper_pod.desc=The data tap pod is a one-use item that is not recoverable.
item.laser_jack=Laser Jack
item.laser_jack.page=41
item.laser_jack.desc=For those requiring a secure, unhackable wireless connection, there's the laser jack. This tiny laser emitter/receiver module is used to establish a direct connection between devices and requires line-of-sight. Both devices must have a laser jack in order to connect. Normal noise levels do not apply. Any break in line-of-sight will completely sever the connection, but fog, rain, and other atmospheric particulates can degrade it. Light rain or smog generates 1 noise per 50 meters of distance; heavy rain or light fog increases this to 1 noise every 20 meters, and a thick fog adds 1 noise per 10 meters of distance. No noise reduction of any kind has any effect on reducing noise from this source. On a clear day, atmospheric interference limits the effective range to approximately 2 kilometers. These devices establish communication through a direct laser beam, so unless someone directly intercepts the laser with their own emitter, it impossible to detect or access the devices wirelessly. The laser is faintly visible to IR sensors (including characters with thermographic vision). Spotting it requires an observe in detail action, with a threshold of 3. \nThe main drawback to this unhackable tech is that it's not capable of providing the bandwidth required for VR. Only wireless device functions and AR mode can be used if you are solely relying on laser jacks. For this reason, these rarely see regular use except when stealth or discretion is required.
item.link_gloves=Link Gloves
item.link_gloves.page=41
item.link_gloves.desc=These gloves have been obviously modified with the required chips and cables to generate a special electromagnetic field that can create a direct connection to any devices they touch. The gloves are impossible to disguise as normal clothing, though some clever designers have been known to make them seem fashionable rather than functional. The connection established through link gloves is of limited bandwidth, incapable of VR mode. Link gloves are not compatible with a living persona.
item.stealth_tap=Stealth Tap
item.stealth_tap.page=41
item.stealth_tap.desc=Standard data taps are not designed for concealment. They are bulky and include a wide variety of connection cables and dapters. A stealth data tap discards everything non-essential, resulting in a device roughly the size of a small-caliber bullet with several contact points. Due to a lack of included cables and dataports, you'll need an electronics toolkit to install one. The process for attaching a stealth data tap is the same as for a standard one. The threshold to detect a stealth tap with a Perception test is 2 if no special attempts are made to conceal it. Any Edge boosts or actions taken as part of a Stealth (Palming) + Agility test to conceal a stealth tap cost half as many Edge points (round down).
item.taser_tap=Taser Tap
item.taser_tap.page=41
item.taser_tap.desc=The Defiance Super Shock taser fires wired taser darts, and a successful hit allows you to detect your target's medical status. Well, some nefarious (some would say brilliant) hackers managed to adapt this tech to help deal with those pesky street samurai who turn off all of their wireless functions to avoid getting their augmentations hacked. Taser taps are taser darts designed specifically for the Defiance Super Shock taser, and they deliver a payload of short-lived conductive nanites that establish a direct connection to all of the target's augmentations and linked devices. Even if they're offline or using an internal router. Even if they've switched off their augmentations. Of course, you have to tase someone to do this, so it isn't exactly a clandestine assault. Most hackers aren't crazy enough to use these. Once the connection is established, the target can take a Major Action to remove them (no test required). If left undisturbed, the connection will still be lost after one minute. You can choose whether or not to have the taser deliver its shock or only establish a connection. This is useful if you want to use it to connect to a camera or maglock without frying the thing. Whether or not you apply the shock, a taser tap is not reusable.
item.matrix_relay=Matrix Relay
item.matrix_relay.page=41
item.matrix_relay.desc=A Matrix relay is a device that helps you extend the range of your wireless network, allowing you to operate at greater ranges or within a blackout zone. They come in a variety of shapes and sizes, from small handheld personal devices no larger than a credstick to massive systems that require a semi trailer to move. Hackers have discovered that these also work really well as signal boosters, allowing them to cut through noise caused by jamming and distance.\nHere's how it works: a Matrix relay that is connected to your PAN essentially allows you to be in two (or more) places at once, as far as the Matrix is concerned. Setting one up requires a Major Action. No skill test is required unless you would like to conceal it with a Stealth (Palming) + Agility test. If you move away from your Matrix relay, determine if there is any noise directly between you and your wireless relay due to distance, jamming, or any other effect. If that noise ever exceeds the Matrix relay's rating, you are out of range. You benefit from a stronger signal if you're not at the edge of the relay's range. If the relay's rating exceeds the noise affecting your connection to it, reduce all further noise penalties by that amount.\nIf you're within 100 meters of your Matrix relay, its full rating is available to boost your signal. Reduce your noise level by the relay's rating while it is active.\nA Matrix relay can be restricted by its owner for personal use. If access is allowed, a number of users equal to its rating x 3 may connect to one.
item.rfid_god_bomb=God Bomb
item.rfid_god_bomb.page=42
item.rfid_god_bomb.desc=A batch of software tags loaded with the most obnoxious but ultimately harmless viruses and other illegal software. Once activated, the tags start breaking the law with incredible speed and abandon. When activated, begin tracking an Overwatch Score for the GOD bomb. At the start of every combat round after activation, increase the GOD bomb's Overwatch Score by its rating x 1D6. When it reaches 40, a small explosive designed to utterly destroy all of the tags is detonated, leaving GOD with the impression that a persona has just been converged upon and dumped from the Matrix. This will undoubtedly cause an escalating security response, initially calling in demiGOD (decker/technomancer cops) in the Matrix, but a physical security response team will also show up. Obviously it's a bad idea to set one of these off where you're going to be, but they work great for distractions and practical jokes that go too far.
item.rfid_screamer_bomb=Screamer Tag Bomb
item.rfid_screamer_bomb.page=42
item.rfid_screamer_bomb.desc=Screamer tags are the opposite of stealth tags. They don't run silent, they go loud, usually with obnoxious AR audio and images. These are actually just nefariously modified standard RFID tags with some malicious code that makes them immune to common spam filters. Individually, these serve no purpose beyond harassment, marketing, vandalism, or a very simple distraction. However, some hackers had the big idea to use them in clusters. Despite the lack of a physical explosion, these devices have been dubbed "Screamer Bombs." Dozens of them at once, all tied to activate from one trigger, can create a stunning effect in the Matrix. A screamer tag bomb's rating is based on how many tags are tied together. Each point of rating represents about a dozen tags. When they are activated, they have an effect similar to a jammer, increasing the noise level by half the rating (round down) out to a radius of 100 meters. This is also illegal and alerts Matrix security forces that begin shutting the tags down one at a time (represented by the 1D6 minute burnout time). It also makes Matrix Perception tests much more difficult. Within range of an active screamer tag bomb, no Edge may be gained or used on any Matrix Perception tests. Furthermore, the dice pool of any Matrix Perception tests is reduced by the rating of the screamer tag bomb. Unlike jammers, these area-effect devices are not capable of screening their effects from individual users. They affect everyone. Anyone foolish enough to fire off a screamer tag bomb that is still connected to their own PAN gains 2D6 overwatch every combat round.
item.rfid_software_tags=Software Tags
item.rfid_software_tags.page=43
item.rfid_software_tags.desc=A software tag is slightly larger than your average datachip and contains the memory storage and processing power required to host and run a single piece of software. For more complex tasks, multiple software tags can be connected together to run several programs simultaneously. They are not powerful enough to run agent programs but can handle commlink apps, cyberprograms, and autosofts.
item.rfid_spy_tags=Spy Tags
item.rfid_spy_tags.page=43
item.rfid_spy_tags.desc=Instead of merely running silent, spy tags are programmed to stay of"ine to avoid any chance of Matrix detection, and only occasionally turn on to send a burst of data before deactivating for a time. These can be programmed to activate on a specific schedule, but the default is a randomized pattern to avoid accidental detection. Unless someone is actively searching for signals during the three seconds or so that the tag comes online, it is highly unlikely to be detected except by visual scans. This is standard operating procedure for a regular stealth tag (p. 269, SR6), which is only capable of reporting its position as location coordinates and a time stamp. Spy tags are stealth tags modified to pair with one or more sensor tags in order to gather more detailed information. In this case, the sensor tags operate in of"ine mode (no wireless), and only send their data to the stealth tag. Connecting a sensor tag to a stealth tag makes the tag a little bulkier, but they're still pretty small.
item.rfid_whisper_bomb=Whisper Tag Bomb
item.rfid_whisper_bomb.page=43
item.rfid_whisper_bomb.desc=Less noisy than a screamer tag bomb, this device comes from the same concept but uses many stealth tags to make it harder to pick out individual silent-running icons. These stealth tags are modified with illegal software to appear to have a larger device footprint on the Matrix, so that they might be mistaken for a larger device until identified. When you are running silent and activate a whisper tag bomb, the whisper tag bomb begins to generate an Overwatch Score of its own at a rate of 1D6 per minute. If this score ever reaches 40, it is converged upon and destroyed, and a security team will be sent to its location. When you are using a whisper tag bomb, if anyone successfully spots you using a Matrix perception test, roll 2D6. Unless you roll doubles, they spotted a stealth tag instead. Permanently reduce the whisper tag bomb's rating by 1 every time this happens. Unless converged upon, you can deactivate and reuse a whisper tag bomb, but any rating reductions are permanent. Assume that they burn out or are bricked by Matrix security forces.
item.comhack_agent_box=Avent Box Hack
item.comhack_agent_box.page=43
item.comhack_agent_box.desc=Agent software runs best on a cyberdeck, but a hacked commlink can be designed for use as a separate device made to host and run an agent program independently of its host cyberdeck. Hacking a commlink into an agent box requires an Electronics (Hardware) + Logic Extended test with a threshold equal to double the commlink's device rating and an interval of one hour. Once transformed, the commlink becomes an agent box with a rating equal to the original commlink's device rating. An agent box acts as an external program carrier for an agent with a rating no higher than the rating of the agent box. Detailed rules for agents, including specific uses for agent boxes, are in the Digital Toolbox chapter (p. 55).
item.comhack_decoy_pod=Decoy Pod Hack
item.comhack_decoy_pod.page=43
item.comhack_decoy_pod.desc=A decoy pod is a large handheld device built from a repurposed commlink, a jammer, and a confusingly wired frame that ties together a ridiculous number of stealth tags. When connected to a cyberdeck and activated, it confuses security protocols and draws attention away from your persona. When you accrue overwatch, it goes to the decoy pod instead of your persona. Once a decoy pod has gained a number of points of overwatch equal to its rating x 2, it overheats and explodes, dealing 4P fire damage at ground zero. For obvious reasons, most deckers use these in wireless mode. You can only use one decoy pod at a time. Activating a decoy pod requires a Major Action due to the careful calibration required. It can be deactivated immediately with a Minor Action. If a decoy pod is deactivated before it is destroyed, it reboots with no Overwatch Score. An exploded decoy pod is not recoverable.
item.comhack_persona_booster=Persona Booster Hack
item.comhack_persona_booster.page=44
item.comhack_persona_booster.desc=A persona booster is a commlink that has been overclocked, its operating system wiped and replaced with illegal software, and its entire purpose altered in order to add to the processing power of a persona. They're designed to interface with cyberdecks but can also be used with an RCC or commlinks. Unfortunately for technomancers, these things don't work for them. Hacking a commlink to transform it into a persona booster requires an Electronics toolkit and an extended Electronics (Hardware) + Logic test with a threshold equal to double the commlink's device rating and an interval of one hour. Once complete, the device irreversibly ceases to be a commlink and is now a persona booster, with a rating equal to half the original commlink's device rating (round up). When a persona booster is connected directly via a data cable (either to your device or to a datajack), it can be engaged to enhance any Matrix Action. Engaging the persona booster requires a Minor Action, after which you add a number of wild dice to the dice pool for your next Matrix Action. If you have multiple persona boosters, you may use as many of them as you like to boost your Matrix Action, but you must spend a Minor Action to activate each one of them. Persona boosters may be used in wireless mode, but they only provide half as many wild dice (round up) as when they're plugged in. What's the catch, you ask? First of all, these devices can be very unpredictable. The wild dice giveth and the wild dice taketh away, though they are more likely to help than hinder. Second, these devices run hot and loud, and burn out quickly. After each use, permanently reduce a persona booster's rating by 1. Furthermore, your Overwatch Score is increased by the total amount rolled on all wild dice gained from persona boosters. GOD hates these things.
item.comhack_armorlink_upgrade=Armorlink Upgrade
item.comhack_armorlink_upgrade.page=43
item.comhack_armorlink_upgrade.desc=A commlink with an armorlink upgrade is more effective at protecting itself and the devices within its PAN against Matrix attacks. Add bonus dice equal to the armorlink upgrade rating to any test made to resist Matrix damage, which benefits the commlink as well as any devices connected to its PAN. The maximum rating for an armorlink upgrade is equal to the commlink's device rating.
item.comhack_stealthlink_upgrade=Stealthlink Upgrade
item.comhack_stealthlink_upgrade.page=44
item.comhack_stealthlink_upgrade.desc=A commlink gains a Sleaze attribute equal to its stealthlink upgrade rating. This Sleaze attribute is limited to Matrix stealth, and only applies when resisting a Matrix Perception action. This makes the commlink much more effective at running silent but does not allow for other Matrix Actions that would require a cyberdeck or living persona. The maximum rating for a stealthlink upgrade is equal to the commlink's unmodified Data Process-ing attribute.
item.comhack_securelink_upgrade=Securelink Upgrade
item.comhack_securelink_upgrade.page=44
item.comhack_securelink_upgrade.desc=A commlink's Firewall is increased by the rating of its securelink upgrade, but only when resisting Hack actions. The maximum rating for a securelink upgrade is equal to the commlink's unmodified Firewall attribute.
item.cyberkit=Cyberkit
item.cyberkit.page=61
item.cyberkit.desc=There is, however, a market for pre-made agent boxes. Ownership of an agent box can be transferred, and so a number of unusual devices have shown up on the market. These are commonly referred to as cyberkits, and are a popular alternative to hiring a decker to come with your team on a run.
item.cyberkit_recharge=Cyberkit Recharge
item.cyberkit_recharge.page=61
item.cyberkit_recharge.desc=Note that when a cyberkit is rebooted, its software is deleted. The hardware (an agent box) is the most expensive part, so unless it gets wrecked or lost, it can be reloaded for the listed recharge cost. 

item.living_console=Living Command Console
item.living_console.page=67
item.living_console.desc=You must have both Machine Mind and Living Network in order to take this echo. Your Living Network can also function as an RCC with an effective device rating 
equal to your Resonance attribute. You can only run and share autosofts that are running on your living persona.
item.machinist_console=Machinist Command Console
item.machinist_console.page=131
item.machinist_console.desc=Machinists have such an affinity for machines that the very thought of controlling only one at a time is anathema. They have learned to twist the Resonance in such a way that their living persona can function as an RCC, emulating all the abilities available to anyone using an RCC (minus the ability to form or join a network; that requires Echo Living Network, p. 195, SR6). The new attributes are gained in addition to their normal Matrix attributes. The noise reduction rating is equal to the machinist's Willpower, and the Sharing rating is equal to the machinist's Charisma.

#Software
item.code_buddy=Code Buddy
item.code_buddy.page=56
item.code_buddy.desc=A Code Buddy is an app designed to help you create software faster by constantly checking for errors and providing suggestions for solutions, and even writing some of the more tedious code for you based on heuristic algorithms. This app can save you a lot of time, but not always-we've all laughed at autocorrect fails. When making a programming test with the assistance of a Code Buddy app, add one die to your dice pool, but make it a wild die.
item.eparkour=eParkour
item.eparkour.page=56
item.eparkour.desc=Analyzes local objects and projects possible parkour moves based on the user's skill profile. Provided you have a DNI or image link, it provides a point of Edge on any Athletics test, which must be spent on the test or is lost. This does not provide Edge on attack or defense tests, even ones that benefit from Athletics via the Dodge action.
item.file_vault=File Vault
item.file_vault.page=56
item.file_vault.desc=Any files stored away in a file vault app are protected by encryption with a rating equal to your commlink's Firewall attribute. If decryption attempt is detected, the app's default response is to alert the commlink's owner and delete the files. The default response can be altered-one of the more clever applications is to cause the files to be edited or replaced, so that the hacker downloads false information unknowingly.
item.simshare=SimShare
item.simshare.page=56
item.simshare.desc=This app allows you to share your simsense feed with other users. Most commonly used to experience media together or share a private simsense environment, it also allows users to subscribe to the commlink's simsense feed as a passenger in the Matrix. A subscribed user experiences all the same simsense as the commlink's owner, including any dumpshock or biofeedback damage. Subscribers can choose their own interface mode to limit this danger. Using AR completely prevents any damage, and cold sim VR means you only take Stun damage from biofeedback. Only biofeedback damage is shared, not Matrix damage. The only Matrix Actions a SimShare subscriber can use are send message, switch interface mode, and jack out, but you can assist other Matrix Actions with a Teamwork test if you have the matching skill. While much safer to use than the hacker program Hitchhiker, SimShare is not able to carry passengers into Foundations or the Resonance realms. A hitchhiker shows up as an icon attached to the host persona, and cannot be targeted separately via Matrix Actions, complex forms, or sprite powers.
item.mefeed=MeFeed
item.mefeed.page=56
item.mefeed.desc=Social media is ubiquitous in the Sixth World, and it can be a useful way to gather information quickly. Even people without MeFeed accounts are referenced and tracked, so if you know where to look, you can invade anyone's privacy. Having the MeFeed app running provides a point of Edge on any Matrix search about a person, company, pop culture topic, or current event. This Edge must be spent on the Matrix search, or it is lost. A glitch on this test introduces a piece of misinformation, while a critical glich corrupts the entire search. These are commonly accessorized with a small "ying drone for capturing life on the go and taking selfies. Many shadowrunners take advantage of this to excuse the presence of a surreptitious reconnaissance device.
item.mannequin=Mannequin
item.mannequin.page=56
item.mannequin.desc=Hackers sometimes need to make it look like one of their devices is running an active persona, perhaps while they are busy using a different device or just trying to blend in somewhere. The Mannequin app requires a personal assistant app to be running in order to function. With both Mannequin and a personal assistant running, your commlink appears to any Matrix observer to be generating an active persona. Detecting that this is a false persona requires a Matrix Perception test against a threshold equal to the commlink's device rating.
item.personal_assistant=Personal Assistant
item.personal_assistant.page=56
item.personal_assistant.desc=The personal assistant is one of the most common and popular commlink apps. It functions as a software servant, with the primary functions of keeping track of your schedule, monitoring your network, and automating control of connected devices. They are often programmed with artificial personalities and distinctive icons but are nowhere near being true sentient AI. These are essentially just highly sophisticated commlink automation tools. Unless equipped with additional software (see P-ICE below), it is limited to the following Matrix actions: Change Icon, Control Device (owned devices only), Edit File (owned files only), Enter/Exit Host, Format Device (self-only), Full Matrix Defense, Jack Out, Matrix Perception, Matrix Search, Reboot Device (self-only), and Send Message. Issuing your PA a simple command requires a Minor Action. More complex automations requires a bit more time and focus. Especially elaborate and complex automations may require a programming test with an interval of one minute, per the gamemaster's discretion. Any sequence, contingency, and combination of the available Matrix Actions is possible. Your PA will only take actions as directed. It has no initiative of its own and is capable of taking a single Matrix Action each combat round on your turn. For all actions, a PA's dice pool is its rating x 2. However, a PA must buy hits instead of rolling (one hit for every full four dice, rounded down), and no Edge may be gained or spent on its behalf. On its default setting, a PA improves your overall Matrix defense by constantly taking the Full Defense Matrix action on your behalf. This adds its rating to your dice pool to resist any hostile Matrix actions. Note: A rating 1 PA scores zero hits, rating 2–3 scores 1 hit, rating 4–5 scores 2 hits, and rating 6 scores 3 hits.
item.p-ice_nope=P-ICE Nope!
item.p-ice_nope.page=57
item.p-ice_nope.desc=A commlink can only run one P-ICE at a time, and it must run along with a personal assistant app. This type of P-ICE causes the PA to spend its action every combat round searching for signs of hostile Matrix activity against the commlink and its connected devices. If signs of hostile activity are detected, the PA carries out a batch of actions immediately. The default response is to alert its owner and the authorities of the attack or intrusion, then turn wireless off for all connected devices, then reboot the commlink. It can instead be set to alert only certain numbers, or to adjust the settings of some devices but not others. This must be predetermined, but the advantage is that the owner doesn't have to spend actions turning each device's wireless mode off to protect them against hacking-it all just happens quickly in response to a detected intrusion. You can also trigger the app using a Minor Action, even if no illegal activity is detected.
item.p-ice_spines=P-ICE Spines
item.p-ice_spines.page=57
item.p-ice_spines.desc=A commlink can only run one P-ICE at a time, and it must run along with a personal assistant app. The Spines program arms your PA with some extra defense against hackers. Your PA continues to use its action on Full Defense every combat round. Any time a hacker takes a Matrix action that is opposed by your commlink's Firewall attribute, they take Matrix damage. If the Matrix Action against you succeeds, they take one Matrix damage. If it fails, they take one damage for every net hit against them (minimum one damage). This Matrix damage can only be prevented by the Spineshield cyberprogram.
item.p-ice_watchdog=P-ICE Watchdog
item.p-ice_watchdog.page=57
item.p-ice_watchdog.desc=A commlink can only run one P-ICE at a time, and it must run along with a personal assistant app. The watchdog P-ICE causes the PA to spend its action every combat round to search for any icons that are running silent. If hidden icons are discovered, it alerts its owner and any other numbers it has been pre-programmed to contact. No further test or action is required to identify the icons, but the only information provided is the type of icon or device. If the icon is disguised or otherwise altered, the watchdog app reports the falsified information as if it were true.
item.autosoft_host=Autosoft Host
item.autosoft_host.page=57
item.autosoft_host.desc=This program allows you to load autosofts so that they can be utilized by an agent program. You only need to run one instance of autosoft host, and this unlocks the ability to run any number of autosofts - limited only by your program slots. In addition to autosofts, you can also run skillsofts in the same way. Each autosoft or skillsoft takes up a program slot of its own.
item.emulator=Emulator
item.emulator.page=57
item.emulator.desc=Most deckers carry around a commlink for everyday Matrix use, but you can run them more efficiently on a cyberdeck using an emulator program. Emulator can run a number of commlink apps equal to the cyberdeck's device rating within its own program slot. You can still run commlink apps on a cyberdeck, but without this they each take up one program slot. This is most commonly used to run a personal assistant along with mannequin and some P-ICE.
item.blaster_charger=Blaster-Charger
item.blaster_charger.page=57
item.blaster_charger.desc=This program allows you to build up extra code/power/force for a Data Spike Matrix Action. When running Blaster-Charger, you may spend one or more Minor Actions to "charge up" your Data Spike action. For each Minor Action spent charging up, reduce the cost of one boost or Edge action on behalf of your data spike by one, to a minimum cost of 1 point of Edge. After each use, the program crashes. You can reload it with a Minor Action.
item.bomb_kit=Bomb Kit
item.bomb_kit.page=58
item.bomb_kit.desc=When you set a Data Bomb while running this program, replace one of your dice with a wild die. You may create a Data Bomb that gets copied along with a file instead of going off when illegally accessed. Unless the Data Bomb is located and disarmed, it will go off the first time the copy is accessed. However, you may choose to set a specific number of file access attempts that must occur before the Data Bomb goes off. And yes, if the copy is copied, the copy of the copy has a copy of the Data Bomb, too, et cetera and onward.
item.directional_shield=Directional Shield
item.directional_shield.page=58
item.directional_shield.desc=This program allows you to enhance and focus your Firewall against an anticipated threat on the Matrix. When you have taken the Full Defense action, you may spend a Minor Anytime Action to add the rating of your Data Processing attribute to your dice pool to defend against a Matrix Action. You must be aware of the icon that is taking action against you in order to use this. You may use directional shield multiple times per combat round, but only once per Matrix defense roll. Each use requires an additional minor action.
item.defense_pods=Defense Pods
item.defense_pods.page=58
item.defense_pods.desc=You can run multiple copies of defense pods. Whenever you suffer Matrix damage, you may spend a minor anytime action to activate a defense pod. You may activate more than one defense pod if you wish, but each one requires a separate Minor Action. For each defense pod activated, reduce Matrix damage by 1. After each use, the program crashes. It can be reloaded with a Minor Action.
item.double_agent=Double Agent
item.double_agent.page=58
item.double_agent.desc=If you crash an IC while you have this program running, the host will launch a new copy of the IC in the next combat round. When this happens, the IC will spawn under your control. Until the next time you accrue overwatch, the IC will follow your orders to the best of its ability and will not take actions against you. When you get so much as one more point of overwatch, the double agent program crashes and the IC resumes its natural behavior. If the IC takes an action that generates overwatch, it is immediately deleted by the host after the action is complete (and relaunched on the next combat round - not under your control this time).
item.drone_master=Drone Master
item.drone_master.page=58
item.drone_master.desc=If you also have an RCC that is connected directly via data cable to your cyberdeck (or agent box), your agent program can jump into a drone that is subscribed to the RCC. Your agent effectively replaces the drone's Pilot with its own rating and overrides any autosofts with the ones it has access to. Autosofts running on the drone are not available while it is controlled by your agent. This doesn't upload your agent to a drone, though. It still requires a cyberdeck or agent box to run. The drone's Pilot ultimately resists being dominated (even if you own it). This doesn't cause any trouble when running under your PAN, but if you use an agent box on a remote mission for this purpose, it takes 1D6 boxes of Matrix damage every minute. This is less of a security protocol and more of an unintended effect caused by clashing technologies.
item.hitchhiker=Hitchhiker
item.hitchhiker.page=139
item.hitchhiker.desc=This program allows a number of passengers equal to 2 x the cyberdeck's device rating to travel along on a Matrix run, including to the Foundations and Resonance Realms (see p. 156 for more details). These passengers share the sim output of the deck and are vulnerable to dumpshock and attacks. They do not have any control over the deck or any efiect on actions that the decker takes.
item.quartermaster=Quartermaster
item.quartermaster.page=59
item.quartermaster.desc=This program outfits an agent with a variety of useful software tools. Collectively, these tools give the agent its own Edge attribute equal to its rating, although its pool of Edge points begins empty and it cannot gain Edge on its own. The agent's owner may spend a Minor Anytime Action to transfer their own Edge points to the agent's pool of Edge. This is the only way the agent may gain points of Edge. An agent on a remote mission may be provided with points of Edge at the time that it is released, but no further points of Edge may be provided. The player who controls the agent may decide when and how the agent uses its available Edge, but the Edge may only be spent to directly assist the agent and cannot be given to or spent on behalf of other characters.
item.rocket_launcher=Rocket Launcher
item.rocket_launcher.page=59
item.rocket_launcher.desc=These cybercombat super-chargers give deckers an advantage against demiGODs, IC, and hostile sprites, but they're just as good for messing with personas. If you spend a Minor Action to activate the rocket launcher before making a Data Spike Matrix Action, increase your base Matrix damage by 2. After the Data Spike action, the Rocket Launcher program crashes. You can reload another copy with a Minor Action. You may run multiple copies of Rocket Launcher at the same time, but you must spend a separate Minor Action to activate each one. If multiple Rocket Launchers are used on the same attack, Matrix damage is increased by 1 for each Rocket Launcher after the first.
item.secret_agent=Secret Agent
item.secret_agent.page=59
item.secret_agent.desc=This program is designed to be uploaded with an agent operating in a host, in which case the agent accrues additional overwatch at the rate of 1D6 per hour (instead of 1D6 per minute).
item.smoke_bomb=Smoke Bomb
item.smoke_bomb.page=59
item.smoke_bomb.desc=If you spend a Minor Action to activate a Smoke Bomb program just before taking a Hide Matrix Action, add a wild die to your dice pool. Then the Smoke Bomb program crashes, but you can always load it back up with a Minor Action. You may have multiple copies of Smoke Bomb active, but you must spend a separate Minor Action to activate each one. If you use more than one on a Hide test, add a wild die for each Smoke Bomb you activate.
item.special_agent=Special Agent
item.special_agent.page=59
item.special_agent.desc=Designate a specific specialization of the Cracking or Electronics skill when writing or purchasing this program. While running, this program effectively provides your agent with the designated specialization, increasing its dice pool by 2 for related tasks. You may run multiple special agent programs, but copies of the same specialization do not stack.
item.spin_doctor=Spin Doctor
item.spin_doctor.page=59
item.spin_doctor.desc=You may run multiple instances of Spin Doctor on a cyberdeck. Its effects are cumulative, but each instance requires a program slot. In order for this software to work, you must also be running Baby Monitor. When your Overwatch Score starts to get dangerously high, this software begins a desperate sequence of dirty tricks to mimic malfunctions, implicate other icons, and underprioritize offensive actions. This allows a hacker to stall, effectively increasing their maximum Overwatch Score (usually 40) by +2 per instance of Spin Doctor that you have running.
item.spineshield=Spineshield
item.spineshield.page=59
item.spineshield.desc=This cyberprogram was developed as a counter-countermeasure to hacking. It prevents one point of damage from the Spines commlink app, then crashes. You may run multiple copies of Spineshield, requiring a program slot for each one. If you suffer multiple boxes of Matrix damage, every copy will activate at once (regardless of how much or how little damage is incoming), reducing the damage by 1 for each running copy. After each use, this program crashes. You can, of course, reload the program with a Minor Action.
item.tapeworm=Tapeworm
item.tapeworm.page=59
item.tapeworm.desc=If you have a copy of Tapeworm loaded, you may upload it to a device to which you have admin access. This requires a successful Edit File action. The Tapeworm will record a log of all Matrix Actions performed using the device, as well as any data that is accessed, downloaded, or sent from the device for up to one hour per net hit on the test to upload the tapeworm. You may choose a shorter time if you wish. During this time, the Tapeworm will hide and record data on the target device. It can only be noticed if someone attempts a Matrix Perception test on the device and scores a number of hits equal to your net hits on the test to upload the Tapeworm. If spotted, it can be deleted, but not traced. If it is not discovered and deleted, after its time expires the Tapeworm will upload all of its data to a pre-determined host on the Matrix and then delete itself. Usually these are data havens or public file-sharing hosts. Assuming you can access the target destination, you can download the files left for you by the tapeworm with no difficulty. To anyone else, the files are protected with rating 2 encryption.
item.agent_program=Agent
item.agent_program.page=59
item.agent_program.desc=Agent software generates a second persona of limited artificial intelligence that can carry out Matrix Actions at the commands of its owner. While many are programmed to emulate personalities, these programs are not truly sentient. There are many stories that suggest an agent program can become a self-aware AI, but there doesn't seem to be a predictable means for how this occurs-if there is any truth to the stories at all. An agent program requires a program slot on a cyberdeck, or an external device called an agent box, in order to run. A cyberdeck or agent box can run one agent Agent software generates a second persona of limited artificial intelligence that can carry out Matrix Actions at the commands of its owner. While many are programmed to emulate personalities, these programs are not truly sentient. There are many stories that suggest an agent program can become a self-aware AI, but there doesn't seem to be a predictable means for how this occurs-if there is any truth to the stories at all. An agent program requires a program slot on a cyberdeck, or an external device called an agent box, in order to run. A cyberdeck or agent box can run one agent with a rating no greater than its device rating. Even with an agent box connected, a cyberdeck can only run one agent at a time.

#Complex forms
complexform.arc_feedback=Arc Feedback
complexform.arc_feedback.page=62
complexform.arc_feedback.desc=When you thread this form, make an Electronics + Resonance test and record your total hits. If you suffer Matrix damage from a Data Spike Matrix action, Resonance Spike, or IC while sustaining Arc Feedback, the thing that hit you takes Matrix damage equal to the hits on your Electronics test. Once Arc Feedback deals damage, the complex form collapses and ends.
complexform.attack_attribution=Attack Attribution
complexform.attack_attribution.page=62
complexform.attack_attribution.desc=Target a willing persona and make an Electronics + Resonance test. As long as you sustain this form, the target gains an Attack Matrix attribute equal to the total hits on your Electronics test. If the target already had a lesser Attack attribute, it is replaced by the Attack attribute provided by this form. The target under the effects of Attack Attribution cannot be affected by an Infusion (Attack) complex form. This persona may now use illegal Matrix actions that use the Cracking skill.
complexform.bubble_shield=Bubble Shield
complexform.bubble_shield.page=63
complexform.bubble_shield.desc=Bubble Shield creates a protective Resonance barrier around one target, which must be connected to the Matrix. Make an Electronics + Resonance test and record your total hits. For every two full hits (round down), the target gains a bonus die on all tests to resist complex forms and sprite powers. While active, this complex form appears as a barely visible forcefield that randomly flares with glowing lines of code. Only an entity with a Resonance attribute is capable of observing it any further with Matrix Perception.
complexform.btl_irl=BTL IRL
complexform.btl_irl.page=63
complexform.btl_irl.desc=This complex form enhances the target\u2019s technological senses and stimulates their headware to create a heightened state of awareness, similar to how it feels to slot a BTL chip\u2014but enhancing the target\u2019s real experiences. Besides enhancing pleasurable experiences, it tends also to amplify terrible ones. To establish this complex form, make an Electronics + Resonance test, with a threshold of 6 minus the target\u2019s Essence. The target must have some headware augmentations of some kind in order to be affected, and if they don\u2019t have any sensory augmentations (such as cybereyes, cyberears, olfactory booster, etc.), you may not gain or spend Edge on the Electronics test. The target receives a number of bonus dice on Perception tests equal to your net hits while BTL IRL is sustained, but they also receive a penalty on all Con and Influence tests due to their obvious state of distraction and the stigma attached to chipheads. The effects of this complex form are so similar to BTL chips that they satisfy a BTL addict\u2019s need for a fix. Chipheads are often willing to pay at least 100 nuyen per hour to be affected by this form, and many unscrupulous technomancers are marketing their abilities as a healthy alternative to using BTLs. They\u2019re wrong\u2014it\u2019s just as bad as BTLs. If your target ever rolls a glitch, critical glitch, or a 1 on a wild die while under the influence of BTL IRL, this complex form collapses and ends, and the target takes 1D6 boxes of Physical biofeedback damage that cannot be resisted, prevented, or reduced by any means. This damage lingers, and cannot be healed except through natural recovery.
complexform.cyber_spike=Cyber Spike
complexform.cyber_spike.page=63
complexform.cyber_spike.desc=
complexform.cyberjack_overclock=Cyberjack Overclock
complexform.cyberjack_overclock.page=63
complexform.cyberjack_overclock.desc=Target a persona that is using a cyberjack augmentation or cyberhack device. Make an Electronics + Resonance test. Each hit adds 1 to the Matrix Initiative of the targeted persona while this form is sustained. This adds to the static initiative number that you add your initiative dice to; it does not add extra initiative dice.
complexform.cyberware_stamina=Cyberware Stamina
complexform.cyberware_stamina.page=63
complexform.cyberware_stamina.desc=Target a character with augmentations. If the target\u2019s augmentations are not wireless-enabled, you must establish a direct connection via Skinlink or Aura Link. Make an Electronics + Resonance test with a threshold of 6 minus the target\u2019s Essence (round Essence down to the nearest whole number).<br/>While this complex form is sustained, the target\u2019s augmentations are immune to stress from augmentation overdrive (p. 282, SR6). The first time that your target is prevented from suffering stress from overdrive, this complex form collapses and ends (the stress is still prevented). If your target is already suffering from augmentation overdrive stress, it goes away when this complex form takes effect, ending the complex form immediately after.
complexform.data_bomb_eater=Data Bomb Eater
complexform.data_bomb_eater.page=64
complexform.data_bomb_eater.desc=When you thread a Data Bomb Eater, make an Electronics + Resonance test and record your total hits. If you set off a Data Bomb while sustaining this form, the Data Bomb\u2019s rating is reduced by your total hits. If the Data Bomb\u2019s rating is reduced to zero or less, it is harmlessly eaten by the Resonance\u2014in which case the file that was protected by the Data Bomb remains intact. After a Data Bomb Eater encounters a Data Bomb, the complex form collapses and ends.
complexform.data_disguise=Data Disguise
complexform.data_disguise.page=64
complexform.data_disguise.desc=You can use this complex form to disguise any icon to make it appear to be different. This includes the type of icon such as persona, device, IC, file, sprite, AI, or anything else that you can think of, but also allows you to present false Matrix attributes, and even make it appear to be running specific software. Target an icon, make an Electronics + Resonance test, and record your total hits. Whenever the disguised icon is targeted with a Matrix Perception test, the results of that test will report only the information from your disguise unless the total hits exceed the hits you scored on the Electronics test. In that case, they see through the disguise and get the real scoop. This complex form can also be used to make it appear that a device that is not running a persona (such as a spare commlink) is actively running a persona.
complexform.enhance_autosoft=Enhance Autosofts
complexform.enhance_autosoft.page=64
complexform.enhance_autosoft.desc=Target a device that is at least theoretically capable of running an autosoft and make an Electronics + Resonance test. For every two hits, add one bonus die whenever a test is made using an autosoft running on the device while this complex form is sustained.
complexform.enlighten_automaton=Enlighten Automaton
complexform.enlighten_automaton.page=64
complexform.enlighten_automaton.desc=Target a device with a Pilot rating that is not currently jumped into by any entity, and make an Electronics + Resonance test. You may increase either the Pilot or Sensor rating of the target by your hits, and you may split up your hits between Pilot and Sensors if you choose. Neither Pilot nor Sensor can be increased to more than double its original rating.<br/>Devices seem much more alert, active, and aware while under the effects of this complex form. They automatically pass any test required to understand complex orders or respond to chaotic situations. Sometimes they also show a little attitude and need to be convinced to carry out their orders. If a device affected by Enlighten Automaton rolls a glitch or critical glitch, a Con or Influence + Charisma test is required to convince it to follow its orders. This requires a Major Action, and the threshold for the test is the number of points the Pilot and Sensor ratings have been increased by. You can attempt this as many times as needed, but until convinced, the device will take no further actions. If you stop sustaining Enlighten Automaton, the device goes back to its normal behavior.
complexform.host_emulator=Host Emulator
complexform.host_emulator.page=64
complexform.host_emulator.desc=Target a persona or IC within a host and make an Electronics + Resonance test vs Intuition + Firewall. If you score any net hits, the persona or IC is tricked into interacting with an illusion of the host they are in. The target\u2019s next Matrix Actions will automatically fail while the form is sustained, and the target will believe that its actions are successful. This illusion can only be kept up for so long before error-checking systems or the target\u2019s own intuition causes them to break free. Every time the target loses a Matrix Action to Host Emulator, if they score more hits than the net hits scored on your Electronics test, the complex form collapses and ends. The Matrix Action still fails, but the target realizes that it failed.
complexform.ic_pick=IC Pick
complexform.ic_pick.page=64
complexform.ic_pick.desc=Target IC running on a host and make an Electronics + Resonance test vs Host Rating x 2. The IC takes Matrix damage equal to your Attack attribute plus net hits. If you crash the IC using this complex form, its duration switches to sustained. As long as you sustain the complex form, the host cannot launch another instance of the type of IC that you crashed.
complexform.machine_merge=Machine Merge
complexform.machine_merge.page=64
complexform.machine_merge.desc=Target a character with a control rig (or equivalent echo) and make an Electronics + Resonance test. For every two hits, the target gains one bonus die on Piloting, Engineering, and defense tests made while jumped into a vehicle or drone while this complex form is sustained. This bonus only applies on tests made to operate the vehicle or drone and its systems.
complexform.marionette=Marionette
complexform.marionette.page=65
complexform.marionette.desc=This complex form is the street samurai\u2019s worst nightmare, allowing a technomancer to take control of a target\u2019s body through their augmentations. In order to be vulnerable to this complex form, a target must have at least one bodyware augmentation or cyberlimb that is connected to their nervous system. Inert ware such as bone lacing, dermal plating, and smuggling compartments don\u2019t count toward this, but wired reflexes, reaction enhancers, and skillwires do. Turning off wireless mode offers some protection against this complex form; in order to use it then, the technomancer must maintain line of sight with these targets and have the Aura Link echo.<br/>Targets who are running in wireless mode are also vulnerable via the Matrix, in which case physical line of sight is not required. To use Marionette on a target, make an Electronics + Resonance test that is opposed by the target\u2019s Willpower + Firewall. If successful, note your net hits. You may use further actions to directly control the target\u2019s body. If they only have a cyberlimb, you can only take actions to control their cybernetic limb, but most bodyware augmentations allow control over the target\u2019s entire body. <br/>\
 You must spend a Major and a Minor Action for each Major or Minor Action you force the target to take. This action must be a physical action that the target is physically capable of doing\u2014their mind and emotions are not affected. Each time you force your target to take an action, reduce your total net hits by one. When all of your net hits have been used up, or if you stop sustaining it, the complex form collapses and ends.<br/>\
 If the target takes an action that requires a dice roll, use their normal dice pool, but no Edge may be gained or spent on the test. This complex form doesn\u2019t prevent them from moving of their own volition. On their own turn, the target may take their own actions. While you can use this complex form to force a target to take actions that are clearly detrimental to their well-being, such as attack themselves, jump off a nearby height, etc., it\u2019s not an instant kill. If you force a target to harm themself, they take base damage from whatever weapon they are using, with no dice roll to hit or increase damage with net hits. In the case of a fall, the target gets a chance to catch a ledge or something with an Athletics + Agility test. This complex form shouldn\u2019t be used for an automatic kill, but it can provide a decisive tactical advantage. Even among criminals, the thought of forcing someone to harm themselves with a power such as this is horrifying. Each time you use this complex form to cause a target to damage itself, add +1 to the team\u2019s Heat modifier at the end of the run.<br/></br>\
 Note that you could use this on a willing target with the goal of providing them with extra actions. No augmentations are truly designed to be used in this manner, so the target must still roll to resist. When using this form on a target with their consent, you gain a point of Edge that must be spent on the Electronics test, or it is lost. Even when used in these circumstances, actions forced by this complex form can neither gain nor benefit from Edge.
complexform.primed_charge=Primed Charge
complexform.primed_charge.page=66
complexform.primed_charge.desc=By channeling raw power from the Resonance through your living persona, you can powerfully boost a Matrix Action. When you thread Primed Charge, make an Electronics + Resonance test and record your total hits. The next time you take a Matrix Action or thread a complex form, gain a point of Edge for every two full hits you scored on your Electronics test. You may gain more than 2 Edge in this way, but after your Matrix Action or complex form is resolved (including resolving fading damage), you lose all of your remaining points of Edge\u2014even Edge that was not granted by this complex form. Edge stored in a separate pool such as an M-TOC or Chase Pool is not drained by this.<br/>You may not use Primed Charge when your Edge pool is empty.
complexform.resonance_wires=Resonance Wires
complexform.resonance_wires.page=66
complexform.resonance_wires.desc=The ultimate defense, more powerful than any firewall, is to switch off wireless mode entirely, making you completely invulnerable to hostile Matrix Actions. Well, technomancers have a few workarounds for that problem. To use this complex form, target a device or character that you can see and make an Electronics + Resonance test with a threshold of 2 plus noise (if any). If you meet the threshold, you establish a remote direct connection to the device. If your target was a character, you have a direct connection to any or all of that character\u2019s devices \u2014 even ones that have been turned off. The only thing you can do with a device that has been turned off is to turn it on, but this limitation doesn\u2019t apply to devices that just have wireless mode disabled. You can sustain this complex form for as long as you can maintain line of sight to the target. If you lose sight for longer than it takes you to blink, it ends immediately.
complexform.restore_continuity=Restore Continuity
complexform.restore_continuity.page=66
complexform.restore_continuity.desc=This complex form allows you to heal software with Matrix damage, including remote agents, artificial intelligence, Matrix fauna, and even IC. Make an Electronics + Resonance test, which restores one box of Matrix damage per hit. This has no effect on devices and sprites.
complexform.search_history=Search History
complexform.search_history.page=66
complexform.search_history.desc=When you target a device using Search History, make an Electronics + Resonance test vs. Willpower (or device rating) + Firewall. If you score any net hits, you immediately gain a list of all Matrix Actions taken by the device within the past twenty-four hours for each net hit or since it was last rebooted (whichever is most recent). No specifics are included about the results of the Matrix Actions, but the targets of the Matrix devices are recorded.<br/>Only targets that were identified and recognized by the device will be identified by Search History.
complexform.sleaze_attribution=Sleaze Attribution
complexform.sleaze_attribution.page=66
complexform.sleaze_attribution.desc=Target a willing persona and make an Electronics + Resonance test. As long as you sustain this complex form, the target gains a Sleaze Matrix attribute equal to the total hits on your Electronics test. If the target already had a lesser Sleaze attribute, it is replaced by the Sleaze attribute provided by this form. The target under the effects of Sleaze Attribution cannot be affected by an Infusion (Sleaze) complex form. This persona may now use illegal Matrix actions that utilize the Electronics skill.
complexform.smartgun_amplifier=Smartgun Amplifier
complexform.smartgun_amplifier.page=66
complexform.smartgun_amplifier.desc=This complex form amplifies and enhances weapons systems. Target either an individual smartgun-equipped weapon or an M-TOC device and make an Electronics + Resonance test. The Attack Ratings of weapons connected to the M-TOC network (or the individually targeted weapon) are increased by the number of hits rolled on this test while the form is sustained. This only affects weapons with wireless-enabled smartgun systems.
complexform.technoregeneration=Technoregeneration
complexform.technoregeneration.page=67
complexform.technoregeneration.desc=This complex form is the equivalent of a Heal spell for electronic devices. Target a device and make an Electronics (Hardware) + Resonance test. For every hit scored, restore one box of Matrix damage. This only works on devices, not IC, sprites, or other Matrix fauna.<br/>When a device has been repaired by this complex form, it tends to function erratically. When making any test using the device, replace one of the dice with a wild die until more thorough maintenance can be done (this requires one hour with an Electronics toolkit). Until this maintenance is done, the device cannot be repaired via technoregeneration again.
complexform.threat_analyzer=Threat Analyzer
complexform.threat_analyzer.page=67
complexform.threat_analyzer.desc=This complex form supercharges an M-TOC\u2019s combat defense algorithms. Target an M-TOC device and make an Electronics + Hardware test. For every hit scored, increase the DR of all characters and drones that are subscribed to the M-TOC. In order to receive this DR bonus, characters must either have DNI (a datajack or trodes will do) or have an image link and audio communication device so that they can see and hear the M-TOC\u2019s augmented reality overlay.
complexform.unravel_encryption=Unravel Encryption
complexform.unravel_encryption.page=67
complexform.unravel_encryption.desc=This complex form allows you to remove a file\u2019s encryption without increasing your Overwatch Score and, assuming you succeed, without setting off any alarms. Make an Electronics + Resonance test vs. encryption rating x 2. If you score at least as many hits as the encryption, it is silently removed. If the encryption wins by even one net hit, the host or device is alerted that someone is attempting to decrypt the file. This doesn\u2019t give away your persona, but it does tend to put a host or device on high alert.

#Echos
metaecho.aura_link=Aura Link
metaecho.aura_link.page=67
metaecho.aura_link.desc=You must have Skinlink in order to take this echo. You can wirelessly connect to devices as if using a direct connection, but only within a limited range. The range of your Aura Link is a radius from your physical body equal to your submersion grade in meters.
metaecho.cyberadept=Cyberadept
metaecho.cyberadept.page=67
metaecho.cyberadept.desc=You have begun to learn that your augmentations can be affected by your connection to the Resonance. Taking this echo unlocks the cyberadept quality path (p. 86).
metaecho.data_structure_encoding=Data Structure Encoding
metaecho.data_structure_encoding.page=67
metaecho.data_structure_encoding.desc=You must have Skinlink in order to take this echo. You have learned to encode layered folds of Matrix and Resonance information into physical objects in order to create physical data structures. This is useful for hiding a file in a form that only someone with this echo will be able to access, but you have also learned to create data structures that harmonize with and reinforce aspects of the Resonance. In short, this allows you to create and integrate items that benefit technomancers in much the same way magicians make use of foci.
metaecho.dissonant_scream=Dissonant Scream
metaecho.dissonant_scream.page=67
metaecho.dissonant_scream.desc=Dabbling in the Dissonance, are we? Taking this echo doesn\u2019t make you a Dissonant technomancer, but that distinction might not be clear to anyone who witnesses you using it. You are able to channel and scatter Resonance energy to create a raucous, disruptive wave that interferes with Matrix activity. <br/>To activate this echo, use a Major Action and make a Resonance + Submersion Grade test. For every hit, increase Matrix noise within 100 meters of your physical body by one. You are also affected by this noise. No forms of noise reduction have any effect on noise generated by this echo. At the end of every combat round in which this echo is active, suffer fading with a Fade Value equal to the number of consecutive combat rounds it has been active. Your Overwatch Score increases by the number of hits scored on your Resonance + Submersion Grade test at the end of every combat round this echo is active. Deactivating this echo requires a Minor Action, but it deactivates automatically if you fall unconscious. After activating this echo, it may not be activated again until you have recovered from all fading damage. If you are observed using this echo by anyone outside your own team, add +1 to the Heat modifier at the end of the run.
metaecho.hybrid_sprites=Hybrid Sprites
metaecho.hybrid_sprites.page=67
metaecho.hybrid_sprites.desc=When you compile a sprite, you can allocate net hits toward using this echo (instead of using those net hits to add more services). For each net hit you allocate in this way, you may provide the sprite with a skill or power that is normally only available to a different type of sprite that you know how to compile.
metaecho.living_command_console=Living Command Console
metaecho.living_command_console.page=67
metaecho.living_command_console.desc=You must have both Machine Mind and Living Network in order to take this echo. Your Living Network can also function as an RCC with an effective device rating equal to your Resonance attribute. You can only run and share autosofts that are running on your living persona.
metaecho.living_host=Living Host
metaecho.living_host.page=68
metaecho.living_host.desc=You must have Transcendent Network in order to take this echo. By spending some time in deep concentration, gathering and forming what might only be described as Resonance power, you can transform your living persona into an equivalent of a host. This requires an extended Tasking + Resonance test with a threshold equal to your Resonance attribute and an interval of one hour. Once complete, you become a living host within the Matrix. Only a technomancer, sprite, Resonance or Dissonance entity that scores one or more net hits on a Matrix Perception test will realize that you are not a true Matrix host.<br/>\
 While this echo is active, you have a host rating equal to your Resonance attribute, and your Matrix attributes are the same as your living persona. The number of devices that can be connected to you increases to your host rating x 10, and you gain all the benefits of your Transcendent Network echo. You are able to generate an effectively unlimited number of virtual spaces, though they all must be connected to each other in some way. Personas can access you just as they would a host, with your permission or by hacking in. You can store an effectively unlimited amount of data, but files uploaded to your living host are only accessible while you have this echo active.<br/>\
 You can change the appearance and architecture of your Living Host at will, even to mimic the appearance of any host you have visited. While this echo is active, you cannot be targeted by Matrix actions, complex forms, or sprite powers, except as a host. This means you are invulnerable to a wide variety of actions that can normally target a persona, such as Data Spike or Resonance Spike. You must maintain a state of deep concentration and remain in one physical place while sustaining this echo. If you suffer more boxes of Stun or Physical damage than your Willpower attribute from a single attack, or if you are physically moved from your location by more than one meter, your concentration is disrupted and your Living Host violently collapses. You take 6 boxes of Physical biofeedback damage and suffer dumpshock. All devices are disconnected, and anyone visiting the host in VR suffers dumpshock. If you wish to shut down your Living Host without suffering dumpshock, you must make an extended Tasking + Resonance test with a threshold equal to your host rating and an interval of a Major Action to do so. A critical glitch on this test causes dumpshock. You are not capable of running IC, but cheer up \u2014 you\u2019ve got sprites! <br/>\
 Because you are not a true host, you do not actually have a Foundation of your own. No one quite knows what would happen if someone found a door to the Foundation through a living host. Some believe that it might lead to a Resonance realm, but if anyone has tried to find out, they either failed or aren\u2019t talking about it.
metaecho.machine_mastermind=Machine Mastermind
metaecho.machine_mastermind.page=68
metaecho.machine_mastermind.desc=You must have the Machine Mind echo before you can take this echo. You gain the benefits of a rating 2 control rig. This echo is only selected once.
metaecho.mega_sprite=Mega-Sprite
metaecho.mega_sprite.page=68
metaecho.mega_sprite.desc=You gain the ability to upgrade a registered sprite. This requires a special re-registration attempt. If successful, net hits do not provide additional services. Instead, you may use each net hit to either increase one of the sprite\u2019s Matrix attributes or provide the sprite with an additional sprite power that is normally only available to a different type of sprite. You can also upgrade an ally sprite or free sprite, with temporary results.<br/>When used on a free sprite or ally sprite, you require knowledge of their source code, and the effects last a number of hours equal to your Resonance attribute. When used on your own registered sprites, it lasts until the next time you attempt to re-register it.
metaecho.matrix_amplifier=Matrix Amplifier
metaecho.matrix_amplifier.page=68
metaecho.matrix_amplifier.desc=If you spend a Major Action to activate this echo, you become a living conduit of Resonance that amplifies local Matrix connections. Your living persona and every device within 100 meters of your physical body gains a number of points of noise reduction equal to your submersion grade. This is incredibly taxing for you, though. At the end of every combat round, you suffer fading with a Fade Value equal to the number of consecutive combat rounds this echo has been active. Turning it back off again requires a Minor Action, but this happens automatically if you fall unconscious. This echo also alerts GOD.<br/>While this echo is active, your Overwatch Score increases by your submersion grade at the end of every combat round. After activating this echo, it may not be activated again until you have recovered from all fading damage.
metaecho.new_sprite_type=New Sprite Type
metaecho.new_sprite_type.page=68
metaecho.new_sprite_type.desc=You gain the ability to compile and register Assassin, Defender, Modular, Music and Primal sprites (see New Sprite Types, p. 72). 
metaecho.resonance_power=Resonance Power
metaecho.resonance_power.page=68
metaecho.resonance_power.desc=ou have learned something from the deep Resonance that allows you to use a single sprite power. You must specify a sprite power when you take this echo, and it can\u2019t be changed. You may take this echo multiple times, and you must choose a different sprite power each time. Use your Resonance attribute in place of sprite level, where applicable. Immediately after using a sprite power, you must resist fading with a fade value equal to the number of hits you scored on the test to use the power. If no test is required to use the power, the Fade Value is 3.
metaecho.software_emulator=Software Emulator
metaecho.software_emulator.page=68
metaecho.software_emulator.desc=You must have Living Network in order to take this echo. You are capable of running commlink apps, cyberprograms, and autosofts on your living persona. You have (Resonance/2) program slots. The maximum rating for any program you are capable of running is 6, and you are incapable of running an agent on your Living Network. Before you can emulate a program, you need to acquire a copy of it to absorb. Absorbing a program consumes it, causing its complete deletion. This takes an extended Electronics (Software) test with a threshold of 4 or the program\u2019s rating, whichever is higher (or applicable), and an interval of one hour. If the test fails, you can try again. A glitch adds 2 to the threshold, and a critical glitch causes both failure and deletion of the program. If you succeed, you may spend 1 Karma to absorb the code into yourself. After that, you can run it whenever you like. It can be crashed, but you can always reload it with a Minor Action. These programs can never be permanently deleted from your mind. There is no limit to how many programs you can \u201Clearn\u201D in this way.
metaecho.sprite_conduit=Sprite Conduit
metaecho.sprite_conduit.page=69
metaecho.sprite_conduit.desc=You are able to form deep bonds with sprites, and through these bonds you help register them into a more permanent form. You may permanently register sprites with great expenditures of time and Karma. When you do so, you may create either a free sprite or an ally sprite. The rules for this are in the following chapter, <b>Points of Sprite</b> (p. 72). Add your submersion grade in bonus dice to your dice pool on all fading resistance tests from compiling and registering sprites.
metaecho.sprite_link=Sprite Link
metaecho.sprite_link.page=69
metaecho.sprite_link.desc=Your mind is more closely linked to your sprites, which allows them to more clearly understand your commands. When you spend a task and a Minor Action to command a sprite to assist you in a Teamwork test using one of its skills, you gain a bonus Minor Action. With a Minor Anytime Action and the use of one task, you may transfer fading damage that you would suffer to one of your sprites. You may attempt to resist fading first, then transfer as many boxes of unresisted damage as you choose. Your Sprite Rep goes down by 1 every time you do this.
metaecho.sprite_symbiosis=Sprite Symbiosis
metaecho.sprite_symbiosis.page=69
metaecho.sprite_symbiosis.desc=You must have the Sprite Conduit echo in order to take this echo. You may merge your ally sprite into your persona in order to boost your own power. See <b>Points of Sprite</b>, p. 79, for the full rules on this.
metaecho.syntax_error=Syntax Error
metaecho.syntax_error.page=69
metaecho.syntax_error.desc=You\u2019ve learned the secrets of countering and unraveling complex forms and sprite powers. When you are aware of a Matrix action that targets any icon that you are also aware of, you may spend a Minor Anytime Action to provide the target with bonus dice on their defense test. The number of bonus dice is equal to your submersion grade. If you are aware of a complex form or sprite power that is being sustained, you may attempt to reduce or cancel it. Make an Electronics + Resonance test with bonus dice equal to your submersion grade vs. Logic + Resonance. Reduce the net hits from the complex form or sprite power by one per net hit if you succeed. If this reduces the net hits to zero or less, the sustained form or power ends immediately. This requires you to take a Major Action, and you suffer fading damage equal to the number of hits scored against you (total hits, not net hits) on the opposed test after each attempt.
metaecho.transcendent_network=Transcendent Network
metaecho.transcendent_network.page=69
metaecho.transcendent_network.desc=You must have the Living Network echo in order to take this echo. When your living persona functions as the master device in a network, you act as an advanced conduit for data traveling through you, able to parse and process data at a supermetahuman rate. This allows anyone connected to your network to benefit from information sharing similar to the effect of an M-TOC device. In order to benefit from this echo, each person must connect their commlink (or other persona-generating device) to your living network. All connected individuals have access to a special pool of Edge that is equal to your submersion grade. This Edge pool is empty when established, but any connected character can transfer their Edge to it on a one-for-one basis at any time.<br/>\
 When a point of Edge is earned by a connected character, it may be transferred to the transcendent network without counting against the maximum Edge that can be earned each round. Edge from the transcendent network may be used on any Edge boost or action that benefits any character that is connected. If you also have an M-TOC system, you can make full use of it along with the benefits of the transcendent network. They do not clash with one another. Another benefit of this echo is that connected characters who use the Send Message action (a Minor Action) among themselves gain a bonus Minor Action immediately afterward. This often gives users the impression that they have a telepathic link.

#Data structures
datastructure.admonisher=Admonisher
datastructure.admonisher.page=70
datastructure.admonisher.desc=Gain bonus dice on a test to decompile a sprite and on the resulting fading test. Gain a point of Edge whenever you score at least one net hit on an attempt to decompile a sprite.
datastructure.bandersnatch=Bandersnatch
datastructure.bandersnatch.page=70
datastructure.bandersnatch.desc=Gain bonus dice on a Spoof Command Action or Puppeteer complex form. If you use a Bandersnatch on a Puppeteer complex form, you also gain bonus dice on the fading resistance test.
datastructure.code_shell=Code Shell
datastructure.code_shell.page=70
datastructure.code_shell.desc=May be activated with a Minor Anytime Action. Gain bonus dice on any roll to soak Matrix damage. If you use Code Shell against a Data or Resonance Spike, gain a point of Edge if you soak all of the damage.
datastructure.data_blade=Data Blade
datastructure.data_blade.page=70
datastructure.data_blade.desc=Gain bonus dice on a Data Spike Matrix Action or Resonance Spike complex form. Gain a point of Edge whenever you crash a persona or IC while using a Data Blade.
datastructure.drone_whisperer=Drone Whisperer
datastructure.drone_whisperer.page=70
datastructure.drone_whisperer.desc=Gain bonus dice on any Matrix Action or complex form that targets a drone. Whenever you use Drone Whisperer to brick (fill up its Matrix condition monitor with damage) or hack a drone (Brute Force, Probe, or Backdoor Entry) and score at least one net hit, gain a point of Edge.
datastructure.eavesdropper=Eavesdropper
datastructure.eavesdropper.page=70
datastructure.eavesdropper.desc=Gain bonus dice on a Snoop action or Static Veil complex form. When using a Snoop action that benefits from eavesdropper, you automatically count as having admin access level, and you do not generate any overwatch score from the Snoop action.
datastructure.echo_chamber=Echo Chamber
datastructure.echo_chamber.page=70
datastructure.echo_chamber.desc=Gain bonus dice on any test to use an echo.
datastructure.extra_life=Extra Life
datastructure.extra_life.page=70
datastructure.extra_life.desc=Gain bonus dice on a roll to soak biofeedback damage. If you resist all of the biofeedback damage while using Extra Life, gain a point of Edge.
datastructure.grounding_rod=Grounding Rod
datastructure.grounding_rod.page=70
datastructure.grounding_rod.desc=May be activated with a Minor Anytime Action. Gain bonus dice to resist fading. If you fully resist all fading damage while using a grounding rod, gain a point of Edge.
datastructure.logic_virus=Logic Virus
datastructure.logic_virus.page=70
datastructure.logic_virus.desc=Gain bonus dice on any Matrix Action or complex form that targets IC. Gain a point of Edge if you score at least one net hit on a Matrix Action or complex form that targets IC, but only when you activate the Logic Virus for that action.
datastructure.link_light=Link Light
datastructure.link_light.page=70
datastructure.link_light.desc=Gain bonus dice on a Trace Icon action, and you automatically count as having admin access for that action. If you successfully trace a persona icon using a Link Light, gain a point of Edge.
datastructure.master_key=Master Key
datastructure.master_key.page=70
datastructure.master_key.desc=Gain bonus dice on a hacking action: Brute Force, Probe, or Backdoor Entry. Gain a point of Edge if you score at least one hit on the action that benefits from your activation of a Master Key.
datastructure.meat_cleaver=Meat Cleaver
datastructure.meat_cleaver.page=70
datastructure.meat_cleaver.desc=Gain bonus dice on a Data Spike Matrix Action or Resonance Spike complex form that targets a persona that is using VR mode. Your target suffers biofeedback damage\u2014Physical damage if in hot sim, Stun damage if using cold sim\u2014 with a DV equal to your Attack attribute. Damage from a Meat Cleaver is not affected by net hits. If you deal any Physical or Stun damage using a Meat Cleaver, gain a point of Edge.
datastructure.oracle=Oracle
datastructure.oracle.page=71
datastructure.oracle.desc=Gain bonus dice on a Matrix Perception or Matrix Search test. When you activate Oracle, all of your extended Matrix Search tests have an interval of a Major Action.
datastructure.phase_shifter=Phase Shifter
datastructure.phase_shifter.page=71
datastructure.phase_shifter.desc=May be activated with a Minor Anytime Action. Gain bonus dice to resist any action taken by IC. If you score more hits than IC on an Opposed test when using a Phase Shifter, gain a point of Edge.
datastructure.resonance_focus=Resonance Focus
datastructure.resonance_focus.page=71
datastructure.resonance_focus.desc=Gain bonus dice on any test that uses your Resonance attribute.
datastructure.resonance_shield=Resonance Shield
datastructure.resonance_shield.page=71
datastructure.resonance_shield.desc=May be activated with a Minor Anytime Action. Gain bonus dice on defense tests against a Data Spike Matrix Action or Resonance Spike complex form. Doesn\u2019t help against IC or other sources of Matrix damage. If you completely resist all damage from a Data Spike or Resonance Spike after activating a resonance shield, gain a point of Edge.
datastructure.sprite_caller=Sprite Caller
datastructure.sprite_caller.page=71
datastructure.sprite_caller.desc=Gain bonus dice on a test to compile or register a sprite with the matching type. If you score at least one hit when using a Sprite Caller to compile or register a sprite, gain a point of Edge.

#Sprites
npc.assassin=Assassin Sprite
npc.assassin.page=72
npc.assassin.desc=Some of the most vindictive technomancers have learned to compile sprites that match their disposition. These sprites are stealthy and violent, capable of dealing biofeedback damage to personas instead of merely crashing them.
npc.defender=Defender Sprite
npc.defender.page=72
npc.defender.desc=Defender sprites are the perfect fit for the role of Matrix overwatch. They make highly effective bodyguards, capable of shielding others from Matrix threats.
npc.modular=Modular Sprite
npc.modular.page=73
npc.modular.desc=Modular sprites are extremely versatile, capable of adapting to any required task.
npc.music=Music Sprite
npc.music.page=73
npc.music.desc=Some technomancers consider the Resonance to be a thing of harmony, and they use concepts of music and art to relate to its mysteries. Music sprites are artistic and creatively expressive, reflecting the experiences and perspectives of the environment and entities they encounter.
npc.primal=Primal Sprite
npc.primal.page=73
npc.primal.desc=Primal sprites are chaotic and mysterious entities compiled by technomancers who have trained their minds to imprint almost none of their own selves onto their compiled sprites in an effort to avoid \u201Ccorrupting\u201D the wild Matrix with metahuman expectations. Such sprites tend to take bizarre forms that are difficult to look at for long, and they communicate using unusual non-verbal (or non-text) means. Classic modem screams seem to be a popular choice for them. With their reliance on unclear communication techniques, primal sprites can be difficult to command. They\u2019ve been known to seem to completely ignore instructions and go about things in their own strange ways\u2014 whether they\u2019re actually trying to follow orders and failing or just being obstinate is impossible to discern. There are reasons other than ideological ones for compiling them, though. Primal sprites tend to be quite powerful and capable, so drek gets done\u2014when they actually do follow orders.

#Duplicates of core sprites to add new sprite actions
npc.courier=Courier Sprite
npc.courier.page=193
npc.courier.desc=Courier sprites are great at delivering messages securely and are pretty good trackers.
npc.crack=Crack Sprite
npc.crack.page=193
npc.crack.desc=If you need a sprite for a quiet run that stays under the radar, the Crack sprite has what you need.
npc.data=Data Sprite
npc.data.page=193
npc.data.desc=Data sprites are masters of finding and manipulating data. They make great librarians, search bots, and trivia contest ringers.
npc.fault=Fault Sprite
npc.fault.page=193
npc.fault.desc=The Fault sprite is the one you want to have your back in a fight. Cold as IC and twice as tenacious, they'll shred your enemies in the blink of an icon.
npc.machine=Machine Sprite
npc.machine.page=193
npc.machine.desc=Of all the sprites, the Machine sprite is the most likely to interact with the physical world, although that would happen through a device. They're experts at all sorts of electronics.

#Qualities
quality.at_home_in_the_matrix=At Home in the Matrix
quality.at_home_in_the_matrix.page=80
quality.at_home_in_the_matrix.desc=You feel truly at home in the Matrix, as if you were born to be there.<br/><br/>\
 \u2022 <b>Cost:</b> 15 Karma<br/>\
 \u2022 <b>Game Effect:</b> Whenever you are using hot sim VR mode, you may gain one more Edge per combat round than normal. Usually characters are limited to gaining only two points of Edge per round.
quality.brilliant_heuristics=Brilliant Heuristics
quality.brilliant_heuristics.page=80
quality.brilliant_heuristics.desc=You have a special knack for efficiently focusing your processing power.<br/><br/>
 \u2022 <b>Cost:</b> 10 Karma<br/>\
 \u2022 <b>Game Effect:</b> If you spend a Minor Action to prepare and calibrate your available processing power immediately before taking a Matrix Action, add half your Data Processing attribute (round up) as bonus dice on the test. If you do not immediately take a Matrix Action after doing this, the bonus is lost.<br/>This quality may only be used by a persona running on a cyberdeck.
