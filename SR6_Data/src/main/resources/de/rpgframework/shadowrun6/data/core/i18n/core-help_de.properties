item.datajack.desc=Eine Datenbuchse verleiht dem Benutzer ein direktes Neuralinterface (siehe S. 175). Außerdem ist sie mit einer einziehbaren Spule Mikrokabel (etwa einen Meter lang) ausgestattet, mit dem man sich über einen Universal-Datenport direkt mit jedem elektronischen Gerät verbinden kann. Datenbuchsen sind mit ihrem eigenen Speicher ausgestattet, um Dateien herunterzuladen oder zu speichern. Zwei Datenbuchsenbesitzer können sich mit einem Glasfaserkabel verbinden, um eine private mentale Unterhaltung zu führen, die nicht abgehört werden kann.
item.datalock.desc=Diese spezielle Datenbuchse ist bei Kurieren, Spionen, Diplomaten und Verbindungsleuten beliebt. Das Datenschloss verwandelt den Charakter praktisch in einen wandelnden Datensafe. Es hat eine Gerätestufe in Höhe seiner Stufe und schützt die Daten vor allen Unbefugten (was auch den Träger des Datenschlosses selbst einschließen kann). Datenschlösser sind nicht WiFi-fähig; auf sie kann nur über den Universal-Datenport zugegriffen werden. Tatsächlich hat auch der Träger des Implantats keinen mentalen Zugriff auf die Daten - er ist nur der Überbringer.
item.olfactory_booster.desc=Diese Cybernase verstärkt, identifiziert und zeichnet Gerüche auf und kann sie später wiedergeben. Die extrem verstärkten Geruchsfähigkeiten dieses Schnüfflers eröffnen einem eine ganz neue Welt sensorischer Daten - man kann Dinge wahrnehmen, die sonst nur ein Bluthund riechen würde. Man kann die Emotionen von Leuten in ihrem Schweiß riechen (und, sofern vorhanden, die Herstellermarkierung ihrer maßgeschneiderten Pheromone), Spuren von Munitionstreibladungen, Sprengstoffen oder biologischen und chemischen Kampfmitteln - die Liste ließe sich praktisch endlos fortführen. Eine Abschaltfunktion erlaubt es, intensive Gerüche komplett zu ignorieren - im täglichen Leben vielleicht die nützlichste Eigenschaft des Implantats. Der Geruchsbooster kann sogar in der VR verwendet werden, um eine noch eindringlichere Erfahrung zu schaffen. Der Benutzer erhält 1 Bonus-Edge für alle auf Geruch basierenden Wahrnehmungsproben, das jedoch verfällt, wenn er es bei der Probe nicht verwendet.
item.skilljack.desc=Diese Headware interpretiert Wissens- und Linguasofts für das Gehirn, sodass man sie nutzen kann, als wären es die eigenen Fähigkeiten. Sie kann auch Aktionssofts laufen lassen, die aber nur als Wissensfertigkeiten funktionieren, solange man keine Talentleitungen (S. 289) hat. Die Summe aller gleichzeitig laufenden Fertigkeiten auf der Talentbuchse kann das Doppelte ihrer Stufe nicht überschreiten, und die maximale Stufe einer darauf laufenden Fertigkeit ist gleich der Stufe der Talentbuchse. Das Starten von Fertigkeiten aus dem Speicher und das Anhalten von Fertigkeiten erfordern keine Handlung. Für Fertigkeiten, die man durch eine Talentbuchse hat, kann man kein Edge einsetzen.
item.taste_booster.desc=Der Geschmacksbooster erfüllt dieselbe Funktion wie der Geruchsbooster, außer dass er die Geschmacksknospen verstärkt. Er lässt einen außerdem Geschmacksdaten in der AR und VR mit einer „Geschmacksspur“ erleben - aber ohne Gewähr, Chummer! Der Benutzer erhält 1 Bonus-Edge für alle auf Geschmack basierenden Wahrnehmungsproben, das aber verfällt, wenn es nicht für die Probe eingesetzt wird.
item.tooth_compartment.desc=Diese hohlen Zähne sind die älteste Cyberware auf dem Markt, und es gibt sie als Lager- und als zerbrechliches Modell. Das Lagermodell wird verwendet, um wirklich winzige Konterbande mit einem Seitenmaß von nicht mehr als 5 Millimetern zu schmuggeln. Die Gegenstände können über ein WiFi-Signal oder eine versteckte Arretierung entfernt werden. Das zerbrechliche Modell löst eine damit verbundene Wirkung (wie etwa die Aktivierung eines Peilsignals oder das Freisetzen eines tödlichen Giftes in den Mund - immer schön im Kopf behalten, was was ist!) durch ein WiFi-Signal aus oder dadurch, dass man hart auf den Zahn beißt.
item.ultrasound_sensor.desc=Diese implantierte Version des Ultraschallsensors (S. 278) ersetzt im aktiven Zustand die normale Sicht. Mit einer Nebenhandlung kann zwischen aktivem Sonar, passivem Sonar und deaktiviertem Zustand hin- und hergeschaltet werden.
item.voice_modulator.desc=Dieses Implantat verleiht eine perfekte Stimmbeherrschung und eine enorme stimmliche Flexibilität und Verzerrungsfähigkeit. Man kann ohne Anstrengung mit erhöhter Lautstärke (bis zu 100 Dezibel) sprechen oder die Stimme verändern, um perfekte Vogelrufe, lieblichen Gesang oder unheimliche stimmliche Eindrücke hervorzubringen. Der Modulator kann außerdem eine aufgezeichnete Stimme wiedergeben (und mehr oder weniger perfekt imitieren). Der Benutzer erhält 1 Bonus-Edge für alle auf Schall basierenden Überredenproben, das aber verfällt, wenn es nicht für die Probe eingesetzt wird.
item.cybereye1.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.cybereye2.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.cybereye3.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.cybereye4.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.cybereye5.desc=Das Cyberaugen-Basissystem bietet normale Sehstärke für beide Augen, eine Bildverbindung und eine eingebaute Kamera sowie je nach Stufe eine unterschiedlich hohe Kapazität für Sichtverstärkungen.
item.ocular_drone.desc=Dieses Zubehör wird pro Kauf nur in einen Augapfel eingebaut. Dabei wird eine kleine Drohne (regeltechnisch wie eine Horizon Flying Eye, S. 302) in der Augenhöhle platziert. Die Drohne funktioniert wie ein normales Cyberauge (mit allen relevanten Verstärkungen), bis man sie herausnimmt - dann kann man sie steuern, als wäre sie eine Drohne. Während sie auf diese Weise benutzt wird (und man dann nur ein Auge hat), erleidet man die Auswirkungen des Status Geblendet I bei allem, was man tut. Wenn man beide Augen durch Drohnen ersetzt, erleidet man den Status Geblendet III, solange beide Drohnen außerhalb des Körpers operieren. Eine Augendrohne ist ganz klar als künstliches Auge zu erkennen.
item.retinal_duplication.desc=In diese höchst illegale Modifikation kann die Aufnahme der Retina einer anderen Person geladen werden, um ein fast perfektes Duplikat zu erzeugen. Hierfür ist eine Vergleichende Probe zwischen der Stufe des Retinaduplikats und der Stufe des Retinascanners (s. Sensoren und Scanner, S. 276) erforderlich. Retinamuster auszutauschen dauert 1 Minute.
item.balance_augmenter.desc=Der Balanceverstärker verstärkt den natürlichen Gleichgewichtssinn des Innenohrs. Der Charakter erhält einen Würfelpoolbonus von +1 für alle Proben, bei denen es um das Gleichgewicht geht, wie etwa Klettern, das Gehen über einen schmalen Steg, das Landen nach einem Sprung usw.
item.damper.desc=Dieses Implantat schützt den Nutzer sowohl vor plötzlichen Lautstärkeanstiegen als auch vor schädigenden Geräuschpegeln. Wenn der Charakter den Status Ertaubt erleidet, senkt der Dämpfer diesen um 1 Stufe.
item.soundlink.desc=Die Audioverbindung, das Audioäquivalent zur Bildverbindung, kann Audiodaten (Aufnahmen, Soundtracks, Musik usw.) aus Quellen innerhalb des PANs des Benutzers (oder aus einer Datenbuchse) direkt in seine Cyberohren abspielen. Eine Audioverbindung ist eine häufige Komponente von AR-Umgebungen und fügt eine Audiokomponente hinzu.
item.bone_lacing_plastic.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing_aluminium.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing_titanium.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.dermal_plating.desc=Hartkunststoff- und Keramikfaserplatten werden in die Haut implantiert. Die Platten sind deutlich sichtbar und noch deutlicher fühlbar, aber sie können im Hinblick auf Farbe und Oberflächenstruktur kosmetisch angepasst werden. Dermalpanzerung gewährt einen Bonus auf den Verteidigungswert in Höhe ihrer Stufe. Dermalpanzerung ist nicht mit anderer Bodytech für die Haut kompatibel, die einen Verteidigungswertbonus gewährt, wie etwa Orthoskin. Durch den Einbau von Dermalpanzerung verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit auch ihren Vorteil Dermalablagerungen.
item.fingertip_compartment.desc=Dieser Behälter ist im ausgehöhlten letzten Glied eines Fingers versteckt. Er hat eine Arretierung, bei der entweder nur der Fingernagel angehoben werden kann, um auf den Behälter zuzugreifen, oder die ganze Fingerspitze entfernt werden kann. Ein Fingerkuppenbehälter kann mikrogroße Gegenstände aufnehmen wie etwa eine Mikrodrohne, einen RFID- oder einen Datenchip. Einen Gegenstand darin zu verstauen oder herauszunehmen, erfordert eine Haupthandlung. Gegenstände, die im Fingerkuppenbehälter verwahrt werden, sind vollständig verborgen, und der Behälter selbst hat eine Tarnbarkeit von 8. Ein beliebter Trick ist es, im Fingerkuppenbehälter eine Monofilamentpeitsche (S. 249) aufzubewahren, wobei die Fingerspitze als beschwerte Schnurspitze dient. Das Ausfahren einer Monofilamentpeitsche aus einem Fingerkuppenbehälter erfordert eine Nebenhandlung, das Einfahren und Aufwickeln eine Haupthandlung.
item.grapple_gun_augment.desc=Dies ist eine implantierte Version der Enterhakenkanone (S. 280). Ihr interner Stauraum enthält 60 Meter Microwire.
item.internal_air_tank.desc=Der interne Lufttank ersetzt einen Teil eines Lungenflügels durch eine interne Druckluftreserve, mit der man den Atem für [Stufe] Stunden anhalten kann. Dies erlaubt ausgedehnte Unterwasseroperationen und gewährt einen kompletten Schutz vor Toxinangriffen mit Inhalationsvektor, solange man den Atem anhält. Das Aktivieren oder Deaktivieren des Tanks erfordert eine Nebenhandlung. Das Auffüllen des Lufttanks durch ein Ventil (das sich unter dem Brustkorb befindet) dauert fünf Minuten, aber man kann ihn auch durch sechs Stunden normales Atmen wiederauffüllen.
item.muscle_replacement.desc=Laborgezüchtete synthetische Muskeln ersetzen oder verstärken die eigenen, und Calciumbehandlungen und Skelettverstärkungen tragen zur Gesamtstärke bei. Kunstmuskeln erhöhen sowohl die Stärke als auch die Geschicklichkeit um ihre Stufe. Sie sind nicht kompatibel mit anderer Bodytech für die Muskeln wie etwa der Bioware Muskelverstärkung oder Muskelstraffung.
item.reaction_enhancers.desc=Diese Bodyware beschleunigt die Reaktion, indem bestimmte, isolierte Wirbel in der Wirbelsäule durch supraleitendes Material ersetzt werden. Die Reaktionsverbesserung erhöht das Reaktionsattribut um ihre Stufe (der Initiativewert ändert sich entsprechend). Reaktionsverbesserung ist nicht kompatibel mit anderer Bodytech, die die Reaktion verbessert, wie zum Beispiel einem Reflexbooster.
item.skillwires.desc=Talentleitungen sind ein System von neuromuskulären Steuereinheiten, die das natürliche Nervensystem des Körpers überbrücken. Sie können mithilfe des „Muskelgedächtnisses“, das durch eine Talentbuchse (S. 285) eingespielt wird, Muskelbewegungen unterstützen oder vollständig überbrücken. Dieses System erlaubt die Verwendung von Aktionssofts mit einer Stufe, die maximal so hoch sein darf wie die Stufe der Talentleitungen. Die Aktionssoft muss dafür auf einer ebenfalls implantierten Talentbuchse laufen.
item.smuggling_compartment.desc=Für Gegenstände, die nicht in eine Fingerspitze passen, aber trotzdem nicht gefunden werden sollen, kann man Schmuggelbehälter an Stellen im Körper implantieren, die leicht ausgehöhlt oder ersetzt werden können. Dazu gehören die Rippen und der Platz zwischen ihnen, Hüftknochen, Schulterblätter usw. Diese Behälter können kleine und Miniaturgegenstände aufnehmen (normalerweise nichts, was größer ist als eine leichte Pistole; der Spielleiter wird schon Bescheid sagen, wenn etwas zu groß ist). Der Behälter hat eine Tarnbarkeit von 8. Einen Gegenstand hineinzulegen oder herauszunehmen, erfordert eine Haupthandlung.
item.wired_reflexes1.desc=Diese hochinvasive, schmerzhafte und lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um den Benutzer in eine neue Welt zu katapultieren, in der sich alles um ihn herum in Zeitlupe zu bewegen scheint. Das System umfasst sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger zu aktivieren oder zu deaktivieren, erfordert eine Haupthandlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (mit einer entsprechenden Erhöhung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Reflexbooster können nicht mit irgendeiner anderen Form von Reaktionsoder Initiativeverbesserung kombiniert werden.
item.wired_reflexes2.desc=Diese hochinvasive, schmerzhafte und lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um den Benutzer in eine neue Welt zu katapultieren, in der sich alles um ihn herum in Zeitlupe zu bewegen scheint. Das System umfasst sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger zu aktivieren oder zu deaktivieren, erfordert eine Haupthandlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (mit einer entsprechenden Erhöhung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Reflexbooster können nicht mit irgendeiner anderen Form von Reaktionsoder Initiativeverbesserung kombiniert werden.
item.wired_reflexes3.desc=Diese hochinvasive, schmerzhafte und lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um den Benutzer in eine neue Welt zu katapultieren, in der sich alles um ihn herum in Zeitlupe zu bewegen scheint. Das System umfasst sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger zu aktivieren oder zu deaktivieren, erfordert eine Haupthandlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (mit einer entsprechenden Erhöhung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Reflexbooster können nicht mit irgendeiner anderen Form von Reaktionsoder Initiativeverbesserung kombiniert werden.
item.wired_reflexes4.desc=Diese hochinvasive, schmerzhafte und lebensverändernde Operation implantiert eine Vielzahl von Neuralboostern und Adrenalinstimulatoren an strategischen Stellen im ganzen Körper, um den Benutzer in eine neue Welt zu katapultieren, in der sich alles um ihn herum in Zeitlupe zu bewegen scheint. Das System umfasst sowohl manuelle als auch WiFi-Trigger, um die Reflexbooster ein- und auszuschalten. Den Trigger zu aktivieren oder zu deaktivieren, erfordert eine Haupthandlung. Wenn der Reflexbooster aktiv ist, gewährt er pro Stufe +1 Reaktion (mit einer entsprechenden Erhöhung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Reflexbooster können nicht mit irgendeiner anderen Form von Reaktionsoder Initiativeverbesserung kombiniert werden.
item.cyberskull_synthetic.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cyberskull_obvious.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cybertorso_synthetic.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Offensichtliche Cybertorsos entfernen die Genitalien und deren Funktion (bis auf die Ausscheidung). Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrenn te Fächer geschützt. Synthetisches Cybertorsodesign gibt sich alle Mühe, so natürlich wie nur möglich auszusehen. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen „durchschnittlichen“ Körpertypus vorziehen, um weniger aufzufallen.
item.cybertorso_obvious.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Offensichtliche Cybertorsos entfernen die Genitalien und deren Funktion (bis auf die Ausscheidung). Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrenn te Fächer geschützt. Synthetisches Cybertorsodesign gibt sich alle Mühe, so natürlich wie nur möglich auszusehen. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen „durchschnittlichen“ Körpertypus vorziehen, um weniger aufzufallen.
item.cyberarm_synthetic.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberarm_obvious.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberforearm_synthetic.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberforearm_obvious.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberhand_synthetic.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberhand_obvious.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberleg_synthetic.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberleg_obvious.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberlowerleg_synthetic.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberlowerleg_obvious.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberfoot_synthetic.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.cyberfoot_obvious.desc=Bei einem Standardcyberbein wird alles von der Hüfte abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterschenkels oder nur des Fußes. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
item.attribute_increase_agility.desc=Cybergliedmaßen können dazu verwendet werden, die Geschicklichkeit, Panzerung oder Stärke des Besitzers zu erhöhen. Auch hier gilt die maximale Erhöhung von 4 der natürlichen Attribute, also sollte man lieber gleich darauf verzichten, eine Attributserhöhung zu kaufen, die eins der natürlichen Attribute um mehr als 4 erhöht, denn das wäre Geldverschwendung.\n Eine Erhöhung der Panzerung erhöht dauerhaft den Verteidigungswert des Charakters - die Cybergliedmaße ist Teil der allgemeinen Schutzmechanismen des Charakters, die sich im Verteidigungswert widerspiegeln. Erhöhungen von Geschicklichkeit oder Stärke kommen nur zum Tragen, wenn die Gliedmaße auch tatsächlich eingesetzt wird. Beispiel: Wenn ein Cyberarm die Stärke eines Charakters erhöht, so erhöht das den Schaden, den er bei einem waffenlosen Angriff mit diesem Arm verursacht, aber nicht, wenn er tritt. Wenn eine Aktivität dem gesunden Menschenverstand zufolge im Allgemeinen den ganzen Körper beansprucht (z. B. Rennen, Klettern, Schwimmen), dann kommt die Attributserhöhung der Cybergliedmaße nicht zur Anwendung.\n Übrigens haben Stärke- und Geschicklichkeitserhöhungen keine Wirkungen, wenn sie in einem Cyberschädel enthalten sind.
item.attribute_increase_strength.desc=Cybergliedmaßen können dazu verwendet werden, die Geschicklichkeit, Panzerung oder Stärke des Besitzers zu erhöhen. Auch hier gilt die maximale Erhöhung von 4 der natürlichen Attribute, also sollte man lieber gleich darauf verzichten, eine Attributserhöhung zu kaufen, die eins der natürlichen Attribute um mehr als 4 erhöht, denn das wäre Geldverschwendung.\n Eine Erhöhung der Panzerung erhöht dauerhaft den Verteidigungswert des Charakters - die Cybergliedmaße ist Teil der allgemeinen Schutzmechanismen des Charakters, die sich im Verteidigungswert widerspiegeln. Erhöhungen von Geschicklichkeit oder Stärke kommen nur zum Tragen, wenn die Gliedmaße auch tatsächlich eingesetzt wird. Beispiel: Wenn ein Cyberarm die Stärke eines Charakters erhöht, so erhöht das den Schaden, den er bei einem waffenlosen Angriff mit diesem Arm verursacht, aber nicht, wenn er tritt. Wenn eine Aktivität dem gesunden Menschenverstand zufolge im Allgemeinen den ganzen Körper beansprucht (z. B. Rennen, Klettern, Schwimmen), dann kommt die Attributserhöhung der Cybergliedmaße nicht zur Anwendung.\n Übrigens haben Stärke- und Geschicklichkeitserhöhungen keine Wirkungen, wenn sie in einem Cyberschädel enthalten sind.
item.attribute_increase_armor.desc=Cybergliedmaßen können dazu verwendet werden, die Geschicklichkeit, Panzerung oder Stärke des Besitzers zu erhöhen. Auch hier gilt die maximale Erhöhung von 4 der natürlichen Attribute, also sollte man lieber gleich darauf verzichten, eine Attributserhöhung zu kaufen, die eins der natürlichen Attribute um mehr als 4 erhöht, denn das wäre Geldverschwendung.\n Eine Erhöhung der Panzerung erhöht dauerhaft den Verteidigungswert des Charakters - die Cybergliedmaße ist Teil der allgemeinen Schutzmechanismen des Charakters, die sich im Verteidigungswert widerspiegeln. Erhöhungen von Geschicklichkeit oder Stärke kommen nur zum Tragen, wenn die Gliedmaße auch tatsächlich eingesetzt wird. Beispiel: Wenn ein Cyberarm die Stärke eines Charakters erhöht, so erhöht das den Schaden, den er bei einem waffenlosen Angriff mit diesem Arm verursacht, aber nicht, wenn er tritt. Wenn eine Aktivität dem gesunden Menschenverstand zufolge im Allgemeinen den ganzen Körper beansprucht (z. B. Rennen, Klettern, Schwimmen), dann kommt die Attributserhöhung der Cybergliedmaße nicht zur Anwendung.\n Übrigens haben Stärke- und Geschicklichkeitserhöhungen keine Wirkungen, wenn sie in einem Cyberschädel enthalten sind.
item.cyber_slide.desc=Funktioniert genauso wie das Waffenzubehör Springarm(S. 260).
item.cyber_holster.desc=Ein Cyberholster dient dem Verwahren einer Waffe - um sie leicht ziehen zu können, nicht um sie zu verstecken. Die Größe des Holsters hängt von der Größe der Gliedmaße ab.
item.hydraulic_jacks.desc=Damit die Sprunghydraulik sinnvoll eingesetzt werden kann, braucht man eine in jedem Bein, und beide müssen die gleiche Stufe haben. Der Benutzer kann Sprungproben (S. 95) ablegen, wobei die Stufe der Sprunghydraulik als Würfelpoolbonus hinzuaddiert wird. Jeder Erfolg verlängert einen vertikalen Sprung um 0,1 Meter und einen horizontalen Sprung um 0,2 Meter. Die maximale Sprungweite bzw. -höhe erhöht sich um 20 %.
item.cyber_holdout.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_light_pistol.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_machine_pistol.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_heavy_pistol.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_smg.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_shotgun.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyber_launcher.desc=Es gibt Implantate für verschiedene Klassen von Feuerwaffen; das Implantat sorgt dabei nur für den notwendigen Platz, die Waffe muss separat gekauft werden. Bei allen Arten von Pistolen erhöht sich ihre Tarnbarkeit um 2, wenn sie implantiert werden. Bei größeren Waffen ändert sich die Tarnbarkeit nicht, da sie auch in implantiertem Zustand recht auffällig sind. Gewehre und Scharfschützengewehre können nicht implantiert werden. Alle implantierten Feuerwaffen können mit der Nebenhandlung Schnellziehen bereit gemacht werden.\n Die einzigen Modifikationen, mit denen implantierte Waffen ausgestattet werden können, sind Lasermarkierer und Schalldämpfer.
item.cyberjaw_augment.desc=Ein Cyberkiefer sorgt für Extrabisskraft, wenn man seinem Gegner gerne sehr nahe kommt.
item.hardening_augment.desc=Durch diesen Prozess wird die Haut/Gliedmaße gehärtet, damit man effektiver zuschlagen kann. Bei einem waffenlosen Angriff hat der Benutzer einen Schadenswert von 3K (4K, wenn das Stärkeattribut 7 oder höher ist) und einen Angriffswert (Sehr nah) von 6.
item.shock_limb_augment.desc=An strategischen Punkten werden Elektroden eingebaut, die einer Zielperson taserartige Stromstöße versetzen können. Normalerweise wird dazu die Hand benutzt, aber in letzter Zeit erfreut sich der Schocktritt bei einigen Straßenkämpfern zunehmender Beliebtheit, und es gibt Geschichten von Kämpfern, die ihren Gegnern elektrisierende Kopfstöße verpassen.
item.handblade_augment.desc=Die Handklinge, die es als starre und als einziehbare Version gibt, ist eine einfache Klinge, die an der dem Daumen gegenüberliegenden Handkante implantiert wird. Die einziehbare Version hat im eingezogenen Zustand eine Tarnbarkeit von 8.
item.handblade_retractable_augment.desc=Die Handklinge, die es als starre und als einziehbare Version gibt, ist eine einfache Klinge, die an der dem Daumen gegenüberliegenden Handkante implantiert wird. Die einziehbare Version hat im eingezogenen Zustand eine Tarnbarkeit von 8.
item.handrazors_augment.desc=Nagelmesser sitzen unter den Fingernägeln oder ersetzen sie ganz und können wie Krallen eingesetzt werden. Wie bei der Handklinge hat das einziehbare Modell eine Tarnbarkeit von 8.
item.handrazors_retractable_augment.desc=Nagelmesser sitzen unter den Fingernägeln oder ersetzen sie ganz und können wie Krallen eingesetzt werden. Wie bei der Handklinge hat das einziehbare Modell eine Tarnbarkeit von 8.
item.spurs_augment.desc=Sporne werden im Handgelenk oder in den Handknöcheln implantiert und verleihen einem Faustschlag oder einer Ohrfeige eine schneidende Schärfe. Die einziehbare Version hat eine Tarnbarkeit von 8.
item.spurs_retractable_augment.desc=Sporne werden im Handgelenk oder in den Handknöcheln implantiert und verleihen einem Faustschlag oder einer Ohrfeige eine schneidende Schärfe. Die einziehbare Version hat eine Tarnbarkeit von 8.
item.cyberears1.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.cyberears2.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.cyberears3.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.cyberears4.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.cyberears5.desc=Üblicherweise ersetzen Cyberohren nur das Innenohr, aber auf Wunsch kann auch der gesamte Ohrkomplex samt Ohrmuschel ersetzt werden. Cyberohren ermöglichen das Hören innerhalb normaler Reichweiten (ähnlich wie ein omnidirektionales Mikrofon) und enthalten eine Audioverbindung sowie eine je nach Stufe unterschiedliche Kapazität für Modifikationen und Verstärkungen. Alle Cyberohren gewähren 1 Bonus-Edge gegen Zielpersonen, deren Hören durch irgendetwas gestört wird, aber das Edge verfällt, wenn es nicht sofort benutzt wird.
item.adrenaline_pump.desc=Diese verbesserte Drüse wird im Unterleib implantiert und mit beiden Nebennieren verbunden. Im Ruhezustand ist die Pumpe lediglich ein Adrenalinreservoir. Wenn sie aktiviert wird, kontrahiert ein kleiner Muskelsack und sendet einen Stoß konzentrierten Adrenalins in den Blutkreislauf. Körperlicher und emotionaler Stress können die Pumpe unbewusst aktivieren, wenn eine Selbstbeherrschungsprobe (S. 37) misslingt; ansonsten kann man sie mit einer Nebenhandlung aktivieren. Während die Pumpe aktiv ist, ignoriert der Charakter Verletzungsmodifikatoren, wird nicht bewusstlos, selbst wenn sein Betäubungszustandsmonitor ausgefüllt ist, kann sich nicht ausruhen, und die Stufe der Adrenalinpumpe wird zu seiner Stärke, Geschicklichkeit, Reaktion und Willenskraft hinzuaddiert. Die Pumpe arbeitet für [Stufe × 1W6] Kampfrunden und kann auch nicht vorzeitig abgeschaltet werden. Wenn die Zeit um ist, bricht der Charakter zusammen und erleidet Betäubungsschaden in Höhe der Anzahl der Kampfrunden, in denen die Pumpe aktiv war (gegen diesen Schaden wird mit der natürlichen Konstitution Widerstand geleistet). Wenn die Wirkung aufhört, kehren die Attributs- werte des Charakters auf ihr normales Niveau zurück, und er kann Verletzungsmodifikatoren und/oder Bewusstlosigkeit durch Betäubungsschaden nicht länger ignorieren. Nach dem Gebrauch benötigt die Pumpe 1 Stunde, um ihren Vorrat wieder aufzufüllen. Während dieser Zeit kann sie nicht aktiviert werden.
item.bone_density_augmentation_1.desc=Diese Bioware verändert die Molekularstruktur der Knochen so, dass ihre Dichte und ihr Bruchwiderstand erhöht werden. Die Bänder werden gestärkt, und die erhöhte Knochendichte erhöht auch das Körpergewicht um 15 Prozent. Knochenverstärkung verleiht zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden. Der Schaden im waffenlosen Kampf wird Körperlich, und der Schadenswert sowie der Angriffswert für waffenlosen Kampf ändern sich. Knochenverstärkung ist nicht kompatibel mit anderer Bodytech für Knochen wie etwa Kompositknochen.
item.bone_density_augmentation_2.desc=Diese Bioware verändert die Molekularstruktur der Knochen so, dass ihre Dichte und ihr Bruchwiderstand erhöht werden. Die Bänder werden gestärkt, und die erhöhte Knochendichte erhöht auch das Körpergewicht um 15 Prozent. Knochenverstärkung verleiht zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden. Der Schaden im waffenlosen Kampf wird Körperlich, und der Schadenswert sowie der Angriffswert für waffenlosen Kampf ändern sich. Knochenverstärkung ist nicht kompatibel mit anderer Bodytech für Knochen wie etwa Kompositknochen.
item.bone_density_augmentation_3.desc=Diese Bioware verändert die Molekularstruktur der Knochen so, dass ihre Dichte und ihr Bruchwiderstand erhöht werden. Die Bänder werden gestärkt, und die erhöhte Knochendichte erhöht auch das Körpergewicht um 15 Prozent. Knochenverstärkung verleiht zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden. Der Schaden im waffenlosen Kampf wird Körperlich, und der Schadenswert sowie der Angriffswert für waffenlosen Kampf ändern sich. Knochenverstärkung ist nicht kompatibel mit anderer Bodytech für Knochen wie etwa Kompositknochen.
item.bone_density_augmentation_4.desc=Diese Bioware verändert die Molekularstruktur der Knochen so, dass ihre Dichte und ihr Bruchwiderstand erhöht werden. Die Bänder werden gestärkt, und die erhöhte Knochendichte erhöht auch das Körpergewicht um 15 Prozent. Knochenverstärkung verleiht zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden. Der Schaden im waffenlosen Kampf wird Körperlich, und der Schadenswert sowie der Angriffswert für waffenlosen Kampf ändern sich. Knochenverstärkung ist nicht kompatibel mit anderer Bodytech für Knochen wie etwa Kompositknochen.
item.cats_eyes.desc=Diese transgenen gezüchteten Implantate sind buchstäblich Katzenaugen mit einem modifizierten DNA-Profil und okzipitalen Verbindungsstrukturen. Die Struktur der Katzenaugen verstärkt das Licht und verbessert die Nachtsicht, sodass sie Restlichtverstärkung bieten. Katzenaugen sind geschlitzt und reflektierend, genau wie die einer Katze. Diese Bioware ist ganz offensichtlich nicht kompatibel mit Cyberaugen, aber einzelne Sichtverstärkungen können hinzugefügt werden.
item.enhanced_articulation.desc=Eine Reihe von Prozeduren - Beschichtung und erneute Nachschmierung der Gelenkoberflächen sowie Verstärkung von Sehnen und Bändern - führt zu einem flüssigeren Zusammenspiel von Muskeln und Gelenken. Hochleistungsgelenke gewähren +1 Geschicklichkeit und 1 Bonus-Edge für Versuche, sich durch enge Räume zu bewegen.
item.muscle_augmentation.desc=Diese biologische Webbehandlung verstärkt existierendes Muskelgewebe, statt es ganz durch gezüchtete Muskeln zu ersetzen. Speziell gezüchtete Muskelstränge werden in existierende Muskelfasern gewebt, erhöhen die Muskelmasse und rohe Stärke und sorgen auch für ein massigeres Aussehen. Muskelverstärkung addiert ihre Stufe zur Stärke des Charakters. Diese Bioware ist nicht kompatibel mit anderer Bodytech, die die Stärke erhöht, wie etwa der Cyberware Kunstmuskeln.
item.muscle_toner.desc=Diese Behandlung verstärkt die Elastizität der Muskelfasern in existierenden Muskeln, was zu einem verbesserten Muskeltonus und erhöhter Flexibilität führt und eine geschmeidige, athletische Figur macht. Muskelstraffung addiert ihre Stufe zur Geschicklichkeit des Charakters. Diese Bioware ist nicht kompatibel mit anderer Bodytech, die die Geschicklichkeit erhöht, wie etwa der Cyberware Kunstmuskeln oder der Bioware Hochleistungsgelenke.
item.orthoskin.desc=Orthoskin besteht aus einem Netz von Biofasern in der Haut, das das Äquivalent persönlicher Panzerung liefert und gleichzeitig praktisch nicht von natürlicher Haut zu unterscheiden ist. Orthoskin erhöht den Verteidigungswert des Charakters um ihre Stufe. Orthoskin kann nicht mit anderer Bodytech für die Haut kombiniert werden, wie etwa Dermalpanzerung. Durch den Einbau von Orthoskin verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit auch ihren Vorteil Dermalablagerungen.
item.platelet_factories.desc=Eine Thrombozytenfabrik steigert die Fähigkeit des Körpers, mit Körperlichem Schaden fertigzuwerden, indem sie die Produktion von Blutplättchen und ihre Konzentration im Blut erhöht, was dabei hilft, Blutungen schneller zu stoppen. Jedes Mal, wenn der Charakter 2 oder mehr Kästchen Schaden auf seinem Körperlichen Zustandsmonitor erleiden würde, wird der Schaden um 1 Kästchen gesenkt.
item.skin_pocket.desc=Diese Hautfalte kann irgendwo am Körper platziert werden. Ein nervenloses „Futteral“ aus Fleisch, das durch die Falte verborgen wird, eignet sich perfekt zum Verstecken eines kleinen Gegenstandes - sie ist die Biowareversion des Schmuggelbehälters (S. 285). Die Hauttasche hat eine Tarnbarkeit von 10. Einen Gegenstand aus der Hauttasche zu nehmen oder in sie hineinzustecken, erfordert eine Haupthandlung.
item.suprathyroid_gland.desc=Die Hyperschilddrüse wird auf der normalen Schilddrüse platziert und ersetzt ihre metabolischen Funktionen. Der verbesserte Metabolismus produziert mehr Energie und lädt den Charakter praktisch auf. Um seinen optimierten Metabolismus mit Energie zu versorgen, muss der Charakter allerdings doppelt so viel essen wie normal. Der Charakter erhält +1 auf Konstitution, Geschicklichkeit, Reaktion und Stärke und muss 25 Prozent mehr für seinen Lebensstil ausgeben.
item.symbiotes.desc=Maßgeschneiderte Mikroorganismen im Blutkreislauf beschleunigen die Heilung des Charakters dramatisch. Symbionten addieren ihre Stufe als Würfelpoolbonus zu Heil- und Genesungsproben (für Körperlichen und Betäubungsschaden) hinzu. Allerdings haben sie auch ungewöhnliche Nahrungsanforderungen, die erfüllt werden müssen, um sie am Leben zu erhalten. Der Charakter muss pro Monat [Stufe × 200] Nuyen für spezielle Symbiontennahrung ausgeben, es sei denn, er hat einen Oberschicht- oder besseren Lebensstil (da ist die Symbiontennahrung schon inklusive). Erhalten die Symbionten keine Spezialnahrung, sterben sie nach einem Monat.
item.synthacardium.desc=Ein künstlich verbesserter Herzmuskel führt dazu, dass kardiovaskuläre Funktionen effizienter ausgeführt werden, wodurch das Herz das Blut besser mit Sauerstoff versorgen kann. Das Synthacardium addiert seine Stufe als Würfelpoolbonus zu Athletikproben, um zu laufen, zu schwimmen oder zu klettern.
item.tailored_pheremones.desc=Diese Pheromone sind speziell maßgeschneidert, um andere zu beeinflussen, und können willentlich ausgestoßen werden. Sie erhöhen das Charisma-Attribut für Überredenund Einflussproben um ihre Stufe, aber nur, wenn sich die Person, gegen die der Charakter die Pheromone einsetzt, in bequemer Unterhaltungsentfernung befindet - wenn sie ihn nicht riechen kann, funktionieren die Pheromone nicht. Maßgeschneiderte Pheromone haben keine Auswirkungen auf magische Fähigkeiten und Proben.
item.toxin_etractor.desc=Ein speziell kultivierter Zellklumpen in der Leber verbessert ihre Filterfähigkeiten. Der Toxinextraktor senkt den Schwellenwert einer Toxinwiderstandsprobe (s. Toxine und Drogen, S. 125) um seine Stufe.
item.tracheal_filter.desc=Dieses zusätzliche Organ wird am oberen Ende der Luftröhre implantiert. Es kann Unreinheiten aus der Luft absorbieren und sie davon abhalten, die Lunge zu erreichen. Der Luftröhrenfilter addiert seine Stufe als Würfelpoolbonus zu Toxinwiderstandsproben gegen Toxine mit Inhalationsvektor (s. Toxine und Drogen, S. 124) hinzu.
item.cerebral_booster.desc=Die Hirnwindungen werden mit zusätzlichem Nervengewebe verstärkt, was die Hirnfunktionen insgesamt verbessert. Der Zerebralbooster erhöht das Logikattribut des Charakters um seine Stufe.
item.damage_compensator.desc=Schadenskompensatoren sind im Wesentlichen Blockadevorrichtungen in den Nervenbahnen, die Schmerzen vom Körper ans Gehirn melden. Der Charakter ignoriert eine Anzahl von Schadenskästchen (wahlweise Körperlich, Betäubung oder eine Kombination der beiden) in Höhe der Stufe des Kompensators, bevor Verletzungsmodifikatoren ermittelt werden.
item.mnemonic_enhancer.desc=Diese hochkonzentrierte Ballung von grauer Substanz wird mit den Gedächtniszentren des Gehirns verbunden und verbessert sowohl das Kurz- als auch das Langzeitgedächtnis. Die Stufe des Mnemoverstärkers addiert sich als Würfelpoolbonus zu Proben auf Sprachfertigkeiten, zu Proben, die mit Wissensfertigkeiten zusammenhängen, und zu gedächtnisbezogenen Proben.
item.pain_editor.desc=Dieser Klumpen spezialisierten Nervengewebes soll sensorische Stimuli filtern. Wenn der Schmerzeditor aktiv ist, ignoriert der Charakter alle Verletzungsmodifikatoren und bleibt sogar dann noch bei Bewusstsein, wenn sein Betäubungszustandsmonitor vollständig ausgefüllt ist. Der Charakter fühlt keine Schmerzen - er ist in seliger, gefährlicher, unbekümmerter Unwissenheit über das Ausmaß des Schadens, den er erlitten hat, sofern er sich nicht entweder selbst untersucht (eine Handlung Genau beobachten) oder durch einen Vitalmonitor (S. 283) informiert wird. Im aktiven Zustand erhöht der Schmerzeditor die Willenskraft des Charakters um 1 und senkt seine Intuition um 1; zusätzlich wird bei allen Wahrnehmungsproben, die auf dem Tastsinn basieren, der Schwellenwert um 1 erhöht.
item.reflex_recorder.desc=Zusätzliches Nervengewebe wird mit bestimmten Körperregionen verbunden, um das Muskelgedächtnis zu verbessern. Der Reflexrekorder erhöht die Stufe einer Fertigkeit, die mit einem Körperlichen Attribut verknüpft ist, um 1. Es können mehrere Reflexrekorder für verschiedene Fertigkeiten implantiert werden, aber nicht zwei Reflexrekorder für dieselbe Fertigkeit.
item.sleep_regulator.desc=Der Schlafregulator ist eine Modifikation am Hypothalamus, die längere Perioden der Wachheit erlaubt - ein unglaublich nützlicher Vorteil für jeden mit irgendeinem Beruf, nicht nur für Shadowrunner. Man braucht weniger Schlaf pro Tag, und der Schlaf, den man bekommt, ist tief und erholsam (außerdem ist man schwerer aufzuwecken). Der Schlafregulator lässt den Charakter mit drei Stunden Schlaf pro Nacht auskommen und doppelt so lange wie normal wach bleiben, bevor er den Status Erschöpft (S. 54) erleidet. Die Ruhezeiten für Heilzwecke werden davon nicht beeinflusst.
item.synaptic_booster.desc=Die Nervenzellen, aus denen das Rückenmark besteht, werden mit dieser Bioware erweitert und repliziert, was eine höhere neurale Bandbreite erlaubt. Das Ergebnis ist eine viel schnellere Reaktionszeit. Der Synapsenbeschleuniger gewährt pro Stufe +1 Reaktion (mit einer entsprechenden Änderung des Initiativewerts) und 1 zusätzlichen Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Er kann nicht mit irgendeiner anderen Form von Reaktions- oder Initiativeverbesserung kombiniert werden. Anders als andere Modifikationen dieser Art kann der Synapsenbeschleuniger nicht ausgeschaltet werden, d. h. der Charakter fühlt sich dauerhaft von einer Zeitlupenwelt umgeben.
item.magical_lodge_materials.desc=Diese Materialien dienen zur Errichtung eines Magischen Refugiums für Schamanen oder Hermetiker. Sie werden als Komplettpaket in einer Tasche verkauft. Einige der Materialien sind mehrfach verwendbar. Die Wiederverwendung einiger Teile davon dauert eine Anzahl von Stunden in Höhe der Kraftstufe des Refugiums (um die Komponenten auseinanderzusortieren).
item.reagents_per_dram.desc=Diese Materialien werden verwendet, um einige der Hindernisse zu überwinden, die die Anwendung von Magie in der Sechsten Welt mit sich bringt. Sie werden in Einheiten von Dram verkauft und verlieren nach Gebrauch ihre Wirkung.
item.rigger_interface.desc=Jedes Fahrzeug bei Shadowrun ist mit GridGuide und einem autonomen Fahrsystem ausgestattet, sogar Motorräder. Das Riggerinterface erlaubt einem Rigger, in ein Fahrzeug hineinzuspringen und das Gefühl zu haben, als wäre er das Fahrzeug und kein Metamensch. Hände und Füße werden zu Rädern, Flügeln oder Rotoren; Sicht, Gehör, Berührung und Geschmack werden zu Sensoren; ein hochdrehender Motor ist ein rasendes Herz. Alle Drohnen sind standardmäßig mit einem Riggerinterface ausgerüstet, bei Fahrzeugen muss es zusätzlich eingebaut werden (falls nicht anders angegeben). Ohne ein Riggerinterface kann ein Rigger zwar ein Fahrzeug von seinem Kommandositz aus lenken, aber er fühlt sich nicht, als wäre er das Fahrzeug.
item.weapon_mount_standard.desc=Fahrzeuge können mit einer Anzahl von Waffenhalterungen in Höhe ihres nicht verstärkten Rumpfes ÷ 3 (abgerundet) ausgestattet werden. Standard-Waffenhalterungen können eine maximal sturmgewehrgroße Waffe und 250 Schuss Munition aufnehmen. Schwere Waffenhalterungen beanspruchen den Platz von zwei Standard-Waffenhalterungen und können jede Art von Waffe und bis zu 500 Schuss Gurtmunition oder bis zu [Rumpf] (Lenk-)Raketen aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen.Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.weapon_mount_standard_manual.desc=Fahrzeuge können mit einer Anzahl von Waffenhalterungen in Höhe ihres nicht verstärkten Rumpfes ÷ 3 (abgerundet) ausgestattet werden. Standard-Waffenhalterungen können eine maximal sturmgewehrgroße Waffe und 250 Schuss Munition aufnehmen. Schwere Waffenhalterungen beanspruchen den Platz von zwei Standard-Waffenhalterungen und können jede Art von Waffe und bis zu 500 Schuss Gurtmunition oder bis zu [Rumpf] (Lenk-)Raketen aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen.Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.weapon_mount_heavy.desc=Fahrzeuge können mit einer Anzahl von Waffenhalterungen in Höhe ihres nicht verstärkten Rumpfes ÷ 3 (abgerundet) ausgestattet werden. Standard-Waffenhalterungen können eine maximal sturmgewehrgroße Waffe und 250 Schuss Munition aufnehmen. Schwere Waffenhalterungen beanspruchen den Platz von zwei Standard-Waffenhalterungen und können jede Art von Waffe und bis zu 500 Schuss Gurtmunition oder bis zu [Rumpf] (Lenk-)Raketen aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen.Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.weapon_mount_heavy_manual.desc=Fahrzeuge können mit einer Anzahl von Waffenhalterungen in Höhe ihres nicht verstärkten Rumpfes ÷ 3 (abgerundet) ausgestattet werden. Standard-Waffenhalterungen können eine maximal sturmgewehrgroße Waffe und 250 Schuss Munition aufnehmen. Schwere Waffenhalterungen beanspruchen den Platz von zwei Standard-Waffenhalterungen und können jede Art von Waffe und bis zu 500 Schuss Gurtmunition oder bis zu [Rumpf] (Lenk-)Raketen aufnehmen. Alle Waffenhalterungen sind ferngesteuert und können einen (vertikalen und horizontalen) Feuerbereich von 90 Grad bestreichen.Eine manuelle Bedienung kann gegen einen Aufpreis hinzugefügt werden, allerdings nur bei Fahrzeugen, nicht bei Drohnen.
item.dodge_scoot.desc=Dies ist genau das, was man von etwas, das „Scoot“ heißt, erwarten würde. Der Elektroroller ist kompakt, sparsam im Verbrauch und sehr günstig, aber nicht gerade das standesgemäße Gefährt für einen Shadowrunner; es sei denn, man versucht, im Verkehr unterzutauchen, oder legt es absichtlich darauf an, von einer Go-Gang überfallen zu werden.
item.harley-davidson_scorpion.desc=Groß, böse und robust. Der typische schwere, chromblitzende Feuerstuhl, mit etwas Panzerung und einer Menge Statement. Meistens sieht man die Scorpion auf der Straße bei Go-Gangern, aber dank des immer noch legendären Rufs von Harley-Davidson ist sie auch bei Normalbürgern beliebt.
item.yamaha_growler.desc=Dieses Geländemotorrad ist bei Abenteuerlustigen, Outdoorfreaks und Kleinmengenschmugglern sehr beliebt, aber die beste Werbung für die Growler war ihr jüngster Auftritt als fahrbarer Untersatz von Sherman Kane in Blood Hunters.
item.suzuki_mirage.desc=Geschwindigkeit ist das Motto der Mirage. Dieses Rennmotorrad mit einer Höchstgeschwindigkeit, die auszureizen sich kaum jemand traut, ist bei Go-Gangs und anderen Speedfreaks beliebt.
item.chrysler-nissan_jackrabbit.desc=Diesen preiswerten elektrischen Kleinwagen sieht man überall. Er wird seit Jahrzehnten mit nur geringen Designänderungen gebaut und ist dank seiner Häufigkeit und Anonymität als Ausspäh- und Beschattungsfahrzeug bei Runnern sehr beliebt. Man sollte sich nur nicht auf eine Verfolgungsjagd einlassen.
item.honda_spirit.desc=Dieses dreirädrige Elektrofahrzeug ist besonders bei Pendlern beliebt. Es hat zwei Sitze, in die kaum ein ausgewachsener Mensch hineinpasst, von den robusteren Metatypen ganz zu schweigen. Der Preis des Spirit ist sein Hauptpluspunkt, und auch wenn er nicht ganz so häufig ist wie der Jackrabbit, sieht man ihn doch praktisch überall.
item.eurocar_westwind_x80.desc=Geschwindigkeit und Überfluss in einem heißen Paket. Der Name Westwind steht seit den 50ern für Luxuskarossen des oberen Preissegments. Seit andere Hersteller von Luxusautos sich Ingenieure und Konstruktionsunterlagen von Eurocar unter den Nagel gerissen haben, ist die Konkurrenz größer geworden, daher brachte der Konzern das Modell X80 auf den Markt, das die Grenzen der Leistungsfähigkeit und dessen, was auf der Straße noch legal ist, bis aufs Äußerste auslotet.
item.hyundai_shin-hyung.desc=Wenn man Optionen möchte, dann ist dies die richtige Limousine. Dieser Wagen hat einen leistungsstarken Motor, und die Tunerszene hat sich auf das Modell gestürzt wie ein Barghest auf einen Piasmaknochen. Mit der entsprechenden Investition erhält man so viel Glamour und Leistung, wie man sich wünscht. Das macht den Shin-Hyung besonders in der asiatischen Unterwelt beliebt, aber auch bei den verzogenen Blagen reicher Konzerneltern, die gerne einmal Straßengangster spielen wollen.
item.ford_americar.desc=Diese aggressiv zurück auf den Markt drängende viertürige Limousine wurde neu designt und ist genauso langweilig wie zuvor. Das Aggressive ist die heftige Preissenkung als Versuch, dem Mercury Comet die Marktführung im Segment wieder zu entreißen, zumal es beim Comet zuletzt diese teuren Rückrufaktionen gab. Von außen macht der Americar nicht viel her, aber er bringt einen von A nach B, ohne dass einem jemand einen zweiten Blick widmet (es sei denn, man packt zwei Trolle hinein und setzt bei jeder Bodenwelle auf).
item.saeder-krupp-bentley_concordat.desc=Der S-K-Bentley Concordat ist die Sorte Wagen, wie ihn Simstars und Orxploitation-Rapper fahren, nachdem sie ihn auffällig haben lackieren lassen. Ansonsten wird er in den klassischen Farben geliefert, wobei in letzter Zeit besonders ein mattes Schwarz bei den Konzernexecs beliebt ist. Diese Limousine ist der Traumwagen der Konzernjugend, ob sie nun scharf auf Daddys CEO-Posten ist oder davon träumt, der nächste Krime zu sein.
item.mitsubishi_nightsky.desc=Diese gepanzerte Limousine wird von Konzernmanagern, Medienstars und Mr Johnsons verwendet, um zu demonstrieren, wie der wohlhabende Teil der Bevölkerung lebt. Schnittig, stylish und leistungsstark, ist der Nightsky ein gefährliches Ziel und ein dekadentes Transportmittel.
item.toyota_gopher.desc=Pickup zu einem der Marktführer in seinem Segment war ein langer Weg der Design-, Leistungs- und Ausstattungsupgrades. Mittlerweile wird er beworben als der Pickup, den man unbedingt haben muss, und er bietet einen Allradantrieb, eine große Ladefläche und ein geräumiges viertüriges Fahrerhaus mit zahlreichen Annehmlichkeiten für die Insassen.
item.gmc_bulldog.desc=Der Bulldog ist überall. Dank seiner eingebauten Panzerung ist er weltweit einer der meistverkauften Lieferwagen und wird gerne von Runnern gewählt, die den Schutz und die Anonymität dieses allgegenwärtigen Transportfahrzeugs schätzen. Der Bulldog bietet reichlich Platz für Ausrüstung, Drohnen, Pakete oder ein paar Trolle. Und mit der richtigen Lackierung fällt er nirgends auf. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.range_rover_model_2080.desc=Auch wenn ihn sein Preis für die meisten zu einem Statussymbol macht, kann doch niemand leugnen, dass der Gegenwert des Model 2080 in Gestalt von Annehmlichkeiten und Optionen seinem Preis voll und ganz entspricht. In den meisten Fällen rollt er zwar durch keine gefährlicheren Gegenden als Gated Communities, aber er ist absolut geeignet für einen Run im Dreck und in der Wildnis. Aufgrund seiner Größe, der Ausstattung und der Anonymität in reichen Wohngegenden wurden der Wagen und seine Vorgängermodelle häufig von Sicherheitsfirmen verwendet, was bedeutet, dass es mittlerweile einige auf dem Secondhandmarkt gibt - wenn es einem nichts ausmacht, ein bisschen Blut aufzuwischen und einige Einschusslöcher zu stopfen. Aber das gehört ja für einen Runner zum täglichen Brot.
item.ares_roadmaster.desc=Dieser Transport-Lkw ist gebaut wie ein Panzer. Der Roadmaster wird auf der ganzen Welt auf Überlandstrecken eingesetzt, wo es oft nur so von Go-Gangs und nomadischen Jägern wimmelt. Er ist schwer gepanzert, und auf seinem Dach können zwei ferngesteuerte Türme eingebaut werden. Roadmaster, die man in der Stadt sieht, sind meistens mit den Logos von Sicherheitsfirmen versehen, die sie dazu verwenden, wertvolle Fracht zu transportieren - Personen wie Güter. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.samuvani_criscraft_otter.desc=Dieses fünf Meter lange Boot ist hübsch, aber auch so langweilig, wie der Tag lang ist. Es wird ab Werk für verschiedene Verwendungszwecke ausgestattet, etwa für Ausflüge, zum Angeln, als leichtes Transportboot oder für Wartungsarbeiten, aber die offene Konstruktion lässt nur Platz für eine kleine Kabine, um sich bei schlechtem Wetter zurückzuziehen. Das Beste, was man über dieses Boot sagen kann, ist, dass man es auf jedem Gewässer dieser Welt zuhauf findet.
item.aztechnology_sunrunner_nightrunner.desc=Nachdem sich der Nightrunner einen etwas zu zwielichtigen Ruf erworben hatte, wurde das Modell gründlich überholt und bekam einige günstige Regierungsverträge in Gegenden, in denen man Aztechnology freundlich gegenübersteht, wie etwa Aztlan. Das Boot wurde in Sunrunner umgetauft, aber es hat das gleiche auffällige versiegelbare Verdeck und den großzügigen Laderaum (in dem man zahlreiche Kojen unterbringen kann, wenn man das Boot für Ausflugsreisen verwenden möchte).
item.gmc_riverrine.desc=Große Knarren und gute Sensoren halten die Wasserwege der Welt sicher. Dieser Pott ist ein Kanonenboot, da gibt es nichts zu leugnen, aber etliche Leute schätzen vor allem den gepanzerten Rumpf und halten die Waffen lieber versteckt, um nicht wie die Wasserschutzpolizei auszusehen.
item.proteus_lamprey.desc=Die Meere sind längst kein so großes Rätsel mehr. Seit es überall auf der Welt immer mehr Aquakologien und Arkoblocks gibt, sind auch Wasserfahrzeuge, mit denen man sie erreichen kann, ein immer häufigerer Anblick geworden. Der Lamprey ist ein Unterwasserschlitten, der für Inspektions- und Transportzwecke eingesetzt wird. Er bietet Platz für vier Passagiere, die ihre eigene Taucherausrüstung verwenden oder Systeme benutzen können, die in den Schlitten eingebaut werden können; Letzteres verdoppelt den Preis und sorgt für 16 Metamenschenstunden Luft. Das militärische Modell des Lamprey (mit dem Namen Sea Snake) wird von Spezialeinheiten wie den UCAS Navy Seals oder dem britischen SAS für Unterwassereinsätze verwendet. Jeder Passagierplatz kann durch ein Drohnengestell mit einer kleinen Drohne ersetzt werden, oder man ersetzt zwei Plätze durch eine mittelgroße Drohne. Mit Personen an Bord ist die Tauchtiefe auf 100 Meter begrenzt, aber mit Drohnen bestückte Modelle können an einer Führleine oder ferngesteuert auf bis zu 200 Meter tauchen. WiFi-Signale reichen nicht bis in solche Tiefen.
item.ynt_delfin.desc=Dieses Drei-Personen-U-Boot eignet sich dank seiner großen Variationsbreite an austauschbaren Aufsätzen ideal für Unterwasserarbeiten. Aufgrund der umfangreichen Militärverträge im Zuständigkeitsbereich von YNT sind einige dieser Aufsätze offensiver Natur. Ob der Delfin für Tiefsee-Rettungsmissionen, Arkoblock-Patrouillen oder für Erkundungs- und Versorgungsfahrten an der neuesten Aquakologie-Baustelle eingesetzt wird - er hat für jede Aufgabe das richtige Werkzeug.
item.artemis_industries_nightwing.desc=Der Nightwing ist ein Tarngleiter, der sich als Spielzeug für Amateurflieger ausgibt. Mit seinem gekapselten Elektromotor ist er praktisch lautlos, und seine Hitzesignatur entspricht der eines großen Habichts. Auf dem Land findet man den Gleiter auf dem Rücken adrenalinsüchtiger Extremsportler, in städtischer Umgebung eher auf dem Rücken von Spezialeinheiten, die unentdeckt zum Einsatzort gleiten, während er überall auf der Welt von Schmugglern benutzt wird, um leichte, aber wertvolle Fracht über die eine oder andere Grenze zu bringen.
item.cessna_c750.desc=Ein zweimotoriges ziviles Flugzeug zum Transport von Passagieren oder leichter Fracht (legal oder nicht). Im Notfall kann es auch als Überwachungsflugzeug eingesetzt werden. Da es einigermaßen erschwinglich und leicht zu warten ist, sieht man es auf Flugplätzen überall auf der Welt.
item.mct-sikorsky-bell_seahawk.desc=Zunächst bei der Übernahme von Sikorsky-Bell durch MCT gerettet, sollte das Seahawk-Programm nach MCTs Problemen im Algonkin-Manitu-Rat schon im Papierkorb verschwinden. Der Flugzeughersteller grub das Projekt wieder aus, ließ es unter seinem Namen laufen und bietet jetzt einen privaten Hochgeschwindigkeits-Amphibienjet an, der sechs Passagiere oder eine beträchtliche Menge an Fracht mit hoher Geschwindigkeit transportieren kann - hervorragend, um entlegene Orte zu versorgen oder sich mitten im Nirgendwo zu verstecken, bis Gras über was auch immer gewachsen ist. Dieses Flugzeug ist amphibisch und serienmäßig mit Auftriebs- und Schwimmzubehör ausgestattet, sodass es sowohl von Land als auch von Wasser abheben kann.
item.ares_dragon.desc=Indem Ares dieses Modell Jahr für Jahr an Konzerne, Nationen und Privatpersonen verkaufte, hat es den Dragon zum bekanntesten Transporthubschrauber der Welt gemacht. Die doppelten Rotoren verleihen ihm die nötige Hebekraft für schwere Lasten, Firewatch-Einsatzteams oder genug Sprengstoff, um selbst seine Namensvettern zu beeindrucken. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.mct-sikorsky-bell_wolfhound.desc=Nachdem eine fehlerhafte Charge Rotorkupplungen ein Dutzend Nissan Hounds permanent zu Boden gebracht hatte, trat MCT auf den Plan, riss sich den Vertrag mit der Kaiserlichen Japanischen Marine unter den Nagel und wirft seither seinen neuesten Hubschrauber auf jeden Markt, auf den es Zugriff hat - und da MCT der Top-Mega ist, sind das eine Menge Märkte. Gebaut für den Kampf, aber schnittig genug, um jeden Exec in Verzückung geraten zu lassen, genießt der Wolfhound mittlerweile eine Beliebtheit, die der des Black Hawk um die Jahrhundertwende gleichkommt.
item.northrup_wasp.desc=Dieser Einsitzer ist der Standardhubschrauber für Polizei und Sicherheitskräfte. Eine schwere Waffenhalterung, etwas leichte Panzerung und eine ganze Menge Geschwindigkeit und Manövrierfähigkeit machen diesen Flieger zu einem Fluch für alle Runner, vor allem wenn er in Teams anfliegt.
item.ares_venture.desc=Der Venture ist eine billige und kleine Vektorschubmaschine, aber seine Nachteile werden durch seine Beliebtheit und die schier unbegrenzten Ausstattungsoptionen ausgeglichen. Eingesetzt wird er von militärischen und Sicherheitskräften sowie von den Schmugglern, die von diesen gejagt werden. Der Venture ist immer für eine Überraschung gut - man sieht sein schlichtes Äußeres und ahnt nicht, was sich darunter an Extras befindet. Dank einer hervorragenden Marketingstrategie ist der Venture in der Dritten Welt Marktführer seiner Klasse. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.gmc_banshee.desc=Eine Ikone des T-Bird-Designs und der feuchte Traum jedes Schmugglers. Hauptsächlich von hochrangigen Militäreinheiten und Konzernsicherheitskräften eingesetzt, zischt der Banshee mit Überschall über den Boden, um Nachschub und Truppen zu transportieren und Aufklärungsflüge und Überraschungsangriffe zu unternehmen, neben einer Vielzahl weiterer krasser Manöver. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.federated_boeing_commuter.desc=Das Design dieses Modellpaares erinnert an das alte C-130-Hercules/AC-130-Spectre-Konzept, nur umgekehrt. Man nehme etwas, das für einen bestimmten Zweck konstruiert wurde, und reiße sich ein Bein aus, um es für einen anderen Zweck umzufunktionieren. Der Commuter ist ein zweimotoriges Kippflügel-Passagierflugzeug, das Manager und Konzern-Sararimänner befördert. Der Osprey X ist der neueste Entwurf eines kampferprobten Rotorflüglers, der für Transport, Luftnahunterstützung und Aufklärung eingesetzt wird. Fed-Boeing hat einen Osprey genommen und ihn für den Transport von Offizieren umgebaut, und fertig war der Commuter. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.federated_boeing_osprey_x.desc=Das Design dieses Modellpaares erinnert an das alte C-130-Hercules/AC-130-Spectre-Konzept, nur umgekehrt. Man nehme etwas, das für einen bestimmten Zweck konstruiert wurde, und reiße sich ein Bein aus, um es für einen anderen Zweck umzufunktionieren. Der Commuter ist ein zweimotoriges Kippflügel-Passagierflugzeug, das Manager und Konzern-Sararimänner befördert. Der Osprey X ist der neueste Entwurf eines kampferprobten Rotorflüglers, der für Transport, Luftnahunterstützung und Aufklärung eingesetzt wird. Fed-Boeing hat einen Osprey genommen und ihn für den Transport von Offizieren umgebaut, und fertig war der Commuter. Alternative Konfiguration zum Lastentransport mit nur 2 Sitzen.
item.gmc_micromachine.desc=Ein sehr hochentwickeltes Kinderspielzeug mit austauschbarem Rumpf und übergroßen Rädern, mit denen sich die Drohne selbst aufrichten kann. Winzig, harmlos und das perfekte Spielzeug, um damit auf kleinen Rennstrecken zu fahren.
item.shiawase_kanmushi.desc=Diese vierbeinige Krabbeldrohne sieht auf den ersten Blick wie ein normales Insekt aus. Dank ihrer mit Geckospitzen ausgestatteten Extremitäten und ihres geringen Gewichts eignet sie sich hervorragend, um in gesicherte Bereiche einzudringen. Sie hat eine verringerte Reichweite, um Transmissionen zu minimieren, aber das macht sie durch ihr überdurchschnittlich gutes Pilotsystem wieder wett. Sie ist sehr empfindlich; ein Finger oder ein kurzer Puls aus einem RFID-Löscher reichen, um sie außer Gefecht zu setzen
item.mct-sikorsky-bell_microskimmer_xxs.desc=Diese Drohne, die etwa die Größe und Form eines Flaschendeckels hat, fliegt mit schwachen Hoverjets. Ihre etwas größeren Schwestern, die frisbeegroße Miniskimmer und die mülltonnendeckelgroße Skimmer, sind in einem interessanten Stapeldesign gebaut, das es ermöglicht, alle drei in einer einzigen Drohnenhalterung unterzubringen, in der die größte der drei Platz hat.
item.mct_gnat.desc=Die Gnat ist winzig und langsam, aber ohne ein Mikroskop oder Sichtvergrößerung nicht von einem Insekt zu unterscheiden. Sie wird oft in MCTs Nullzonen eingesetzt, wo sich ein Schwarm von ihnen mit DMSO/Narcoject-Mini-Slap- Patches an den Füßen massenhaft auf eine Zielperson stürzt. Sie werden in Packungen zu 10 Stück verkauft.
item.gm-nissan_flip_flop.desc=Diese Drohne ist etwa so groß wie ein ferngesteuertes Spielzeugauto und hat einen Kettenantrieb. Die Ketten ragen überall über den Rumpf hinaus, und in der Mitte des Chassis befindet sich ein gyroskopisches Zentrum, das immer aufrecht bleibt, während die Drohne beliebig rollen und sich überschlagen kann. Sie ist ideal für unwegsames Gelände und kann auf gerader, flacher Strecke eine erstaunliche Geschwindigkeit erreichen.
item.shiawase_inu.desc=Ein kleiner vierbeiniger Freund mit einer fellartigen Außenhülle, mit dem die Drohne fast wie ein echter Hund aussieht und sich auch fast so anfühlt. Es sind noch bessere Außenhüllen erhältlich (500 ¥), mit denen die Drohne tatsächlich wie ein richtiger Hund erscheint, aber ihre Bewegungen bleiben immer ein bisschen roboterartig.
item.shiawase_inu_better_suit.desc=Ein kleiner vierbeiniger Freund mit einer fellartigen Außenhülle, mit dem die Drohne fast wie ein echter Hund aussieht und sich auch fast so anfühlt. Es sind noch bessere Außenhüllen erhältlich (500 ¥), mit denen die Drohne tatsächlich wie ein richtiger Hund erscheint, aber ihre Bewegungen bleiben immer ein bisschen roboterartig.
item.horizon_flying_eye.desc=Diese kugelförmige Flugdrohne ist etwa so groß wie ein Augapfel und verwendet omnidirektionale Schubdüsen, um sich in der Luft zu halten, kann aber auch über den Boden rollen. Sie wird normalerweise für Überwachungszwecke verwendet, und eine Version mit einem eingebauten Flash- Pack oder einer Rauchgranate kostet 500 ¥ zusätzlich. Das Flash-Pack kann wie üblich nachgeladen werden; die Rauchgranate zerstört die Drohne. Die Rauchgranate kann auch gegen eine andere Granate ausgetauscht werden, was die Drohne (natürlich) ebenfalls zerstört.
item.horizon_flying_eye_extra.desc=Diese kugelförmige Flugdrohne ist etwa so groß wie ein Augapfel und verwendet omnidirektionale Schubdüsen, um sich in der Luft zu halten, kann aber auch über den Boden rollen. Sie wird normalerweise für Überwachungszwecke verwendet, und eine Version mit einem eingebauten Flash- Pack oder einer Rauchgranate kostet 500 ¥ zusätzlich. Das Flash-Pack kann wie üblich nachgeladen werden; die Rauchgranate zerstört die Drohne. Die Rauchgranate kann auch gegen eine andere Granate ausgetauscht werden, was die Drohne (natürlich) ebenfalls zerstört.
item.mct_hornet.desc=Dank ihrer etwas robusteren Konstruktion kann die Hornet, eine Verwandte der altehrwürdigen Fly-Spy, größere Höhen erreichen und als fliegendes Auge für Runner dienen, die ihre Absichten nicht verraten wollen, sich aber alle Optionen offenhalten wollen. Normalerweise sieht sie äußerlich wie eine Tarantula-Wespe aus, und sie trägteinen Injektor im Unterleib, der eine einzelne Dosis von irgendetwas Unerfreulichem verabreichen kann (muss separat gekauft werden).
item.chrysler-nissan_pursuit_v.desc=Die Designprinzipien dieser mit Rädern versehenen Drohne waren: niedrig, flach und schwer. All das erlaubt ihr, mit Formel-1-Geschwindigkeiten zu fahren, was bedeutet, dass nichts sie überholen kann. Man kann sie ausmanövrieren, klar, oder abballern, jepp, aber was die reine Geschwindigkeit angeht, kann nichts, was Räder hat, mit der Pursuit V mithalten.
item.aztechnology_crawler.desc=Wenn man keine Angst vor Spinnen oder Insekten hatte, bevor man eine Crawler gesehen hat, dann hat man sie hinterher. Speziell konstruiert, um Treppen hinauf, über den Boden und durch das Unterholz zu krabbeln, besticht diese einen halben Meter breite Geländedrohne mit ihrem herzhaften (und furchterregenden) Design.
item.cyberspace_designs_quadrotor.desc=Dieser kleine Quadrokopter für die Luftüberwachung und -beobachtung ist dank seiner Leichtbauweise und seines patentierten Rotordesigns eine der am höchsten fliegenden Drohnen auf dem Markt. Um das Gewicht gering zu halten, ist die einzige Waffe, mit der die Drohne ausgerüstet werden kann, eine luftbetriebene Armbrust (Projektilwaffe, Schaden 3K, Angriffswerte 2/10/4/2/-).
item.lockheed_optic_x2.desc=Mit eingeklappten Flügeln ist diese Drohne etwa so groß wie ein Cyberdeck, entfaltet sich aber zur Größe eines großen Habichts. Gestartet wird sie durch einen einfachen Wurf in die Luft, allerdings kann sie nicht auf der Stelle schweben. Entwickelt für heimliche Überwachung, ist sie schwer zu entdecken und zu verfolgen, was sie zu einem bevorzugten Hilfsmittel für Shadowrunner und Sicherheitsfirmen macht. Design und Lackierung erhöhen den Mindestwurf für Wahrnehmungsproben, um die Optic-X2 zu entdecken, um 1.
item.gm-nissan_dobermann.desc=Diese auf Ketten fahrende Perimeter-Überwachungsdrohne kann mit ihren leistungsfähigen Sensoren bei Tag und bei Nacht eingesetzt werden. Ihr einziges Problem sind Treppen. Die Drohne ist mit einer normalen Waffenhalterung ausgestattet.
item.nissan_samurai.desc=Zwei Beine sind nicht besser als vier, wenn es ums Drohnendesign geht. Die Nissan Shogun übernahm als Erste die Marktnische der berühmten Ares Duelist und konnte mit einem deutlich verbesserten Design aufwarten, wurde jedoch weiterhin von ihrem metamenschenähnlichen Rahmen eingeschränkt. Die Samurai und die Oni mischen das Metamenschliche mit … nun, etwas anderem. Die Nissan Samurai gehört in die Kategorie der mittleren Drohnen, während die Oni eine große Drohne ist. Beide werden serienmäßig mit einziehbaren Klingen an den Armen und Fersen ausgeliefert, und jeder Arm hat eine normale Waffenhalterung. An jedem der Arme der Samurai kann eine Maschinenpistole oder eine kleinere Feuerwaffe mit 50 Schuss Munition montiert werden; die Oni kann ein Gewehr und 100 Schuss Munition an jedem Arm aufnehmen. Der große Vorteil des Designs ist die Geschwindigkeit, was jedoch etwas zulasten der Kampffähigkeiten geht. Beide Drohnenmodelle können sich auch vierbeinig (auf Armen und Beinen) fortbewegen, haben währenddessen aber keinen Zugriff auf Waffen.
item.nissan_oni.desc=Zwei Beine sind nicht besser als vier, wenn es ums Drohnendesign geht. Die Nissan Shogun übernahm als Erste die Marktnische der berühmten Ares Duelist und konnte mit einem deutlich verbesserten Design aufwarten, wurde jedoch weiterhin von ihrem metamenschenähnlichen Rahmen eingeschränkt. Die Samurai und die Oni mischen das Metamenschliche mit … nun, etwas anderem. Die Nissan Samurai gehört in die Kategorie der mittleren Drohnen, während die Oni eine große Drohne ist. Beide werden serienmäßig mit einziehbaren Klingen an den Armen und Fersen ausgeliefert, und jeder Arm hat eine normale Waffenhalterung. An jedem der Arme der Samurai kann eine Maschinenpistole oder eine kleinere Feuerwaffe mit 50 Schuss Munition montiert werden; die Oni kann ein Gewehr und 100 Schuss Munition an jedem Arm aufnehmen. Der große Vorteil des Designs ist die Geschwindigkeit, was jedoch etwas zulasten der Kampffähigkeiten geht. Beide Drohnenmodelle können sich auch vierbeinig (auf Armen und Beinen) fortbewegen, haben währenddessen aber keinen Zugriff auf Waffen.
item.mct-nissan_roto_drone.desc=MCT-Nissan hat dieses Modell schon vor so langer Zeit genau richtig konstruiert, dass man nie viel daran ändern musste. Sie besteht aus einem Rotor und einem Rumpf, der speziell auf Modifikation und schnellen Umbau konstruiert wurde. Eine Kameradrohne kann in weniger als einer Minute in eine Kampfdrohne umgebaut werden. Um zu ermitteln, wie viele Waffenhalterungen oder Zubehör die Drohne aufnehmen kann, gilt ihr Rumpfattribut als um 3 höher, als es tatsächlich ist.
item.federated-boeing_blackhawk.desc=Sie ist nicht hübsch, aber sie erledigt ihren Job, und dieser Job besteht darin, andere Luftbedrohungen in ihrem Operationsbereich aus dem Weg zu räumen. Die Blackhawk ist eine Angriffsdrohne und besonders bei Desert- Wars-Teams beliebt. Ihr kleines Profil beschränkt ihre Geschwindigkeit, macht sie aber auch zu einem weniger leichten Ziel. Gern lässt man sie in „Rudeln“ fliegen, wobei die einzelnen Drohnen ihr Schussfeld miteinander koordinieren, um keinen Fluchtweg zu lassen (bei Schergenangriffen wird ihre Anzahl als um 50 Prozent größer betrachtet).
item.steel_lynx_combat_drone.desc=Dies ist das, was die Leute meinen, wenn sie von einer „Killermaschine“ reden. Die Steel Lynx ist bis an die Zähne bewaffnet und gepanzert und hat vier ausfahrbare und mit Rädern versehene Beine, die es ihr erlauben, schnell in die Höhe zu fahren und hinter einer Deckung hervorzufeuern. Die Drohne erhält eine zusätzliche Nebenhandlung, wenn sie die Nebenhandlung In Deckung gehen ausführt.
item.ares_packmule.desc=Die Packmule ist eine vierbeinige Transportdrohne speziell für raues Gelände, in dem es kaum Straßen gibt und der Luftraum zu gefährlich ist. Spezialeinheiten tauschen gern den Platz für ein paar Packkisten gegen einen Gyrostabilisator mit einem schweren Maschinengewehr, das vom Unterstützungsspezialisten des Teams wie ein Geschützturm eingesetzt wird.a
item.cyberspace_designs_dalmatian.desc=Diese VTOL-Aufklärungsdrohne, die man auf die Größe eines Rasenmähers zusammenklappen kann, lässt sich leicht hinter die gegnerischen Linien transportieren. Ausgefaltet erreicht sie die Größe eines Hängegleiters, und man sieht sie häufig über städtischen und ländlichen Regionen, die Verträge mit Lone Star oder Knight Errant haben, da diese Konzerne sie gern für Patrouillen und Aufklärung einsetzen.
item.ares_black_sky.desc=Nachdem die Black Sky lange Zeit ein streng geheimes Projekt gewesen war, wurde mit der serienmäßigen Produktion begonnen, nachdem sich Feldtests während der Quarantäne von Boston als grandioser Erfolg erwiesen hatten. Diese Drohne ist die neueste Entwicklung von Ares auf dem Gebiet der getarnten Luft-Boden-Unterstützung. Mit ihrer Fähigkeit, Nachschub oder tödliche Fracht abzuwerfen, und dabei einer nur geringen Entdeckungsgefahr wird die Black Sky sicherlich bald auch ihren Weg in Runner- und Schmugglerkreise finden.
item.cyberspace_designs_quadrotor_crossbow.desc=Eine luftbetriebene Armbrust (Projektilwaffe, Schaden 3K, Angriffswerte 2/10/4/2/-) für C.D.Quadrotor
item.browse.desc=Wenn du eine Handlung Matrixsuche durchführst, erhältst du 1 Edge; dieser Punkt muss sofort für diese Handlung ausgegeben werden, sonst verfällt er.
item.baby_monitor.desc=Gibt dir deinen gegenwärtigen Overwatch-Wert an, ohne dass dafür eine Handlung nötig ist.
item.configurator.desc=Du kannst eine alternative Attributanordnung für dein PAN abspeichern und zu dieser wechseln, statt nur zwei Attribute auszutauschen.
item.edit.desc=Wenn du eine Handlung Datei editieren durchführst, erhältst du 1 Edge; dieser Punkt muss sofort für diese Handlung ausgegeben werden, sonst verfällt er.
item.encryption.desc=+2 Würfel für die Handlung Datei verschlüsseln.
item.signal_scrubber.desc=Senkt den Rauschenwert um 2.
item.toolbox.desc=+1 auf Datenverarbeitung.
item.virtual_machine.desc=2 zusätzliche Programmslots; bei Angriffen erleidest du 1 zusätzliches Kästchen Matrixschaden, gegen das kein Widerstand geleistet werden kann.
item.armor.desc=+2 zum Verteidigungswert.
item.biofeedback.desc=Verursacht bei einem Matrixangriff Betäubungsschaden (gegen ein Ziel in der VR mit kaltem Sim) bzw. Körperlichen Schaden (gegen ein Ziel in der VR mit heißem Sim) statt Matrixschaden.
item.biofeedback_filter.desc=Du kannst Biofeedback-Schaden mit Gerätestufe oder Konstitution statt mit Willenskraft widerstehen.
item.blackout.desc=Ähnlich wie das Programm Biofeedback, kann aber nur Betäubungsschaden verursachen.
item.decryption.desc=+2 Würfel für die Handlung Datei cracken.
item.defuse.desc=Du kannst Schaden durch eine Datenbombe mit Gerätestufe oder Konstitution statt mit Firewall widerstehen.
item.disarm.desc=Du kannst dem Schaden aus einer Datenbombe mit Gerätestufe oder Konstitution widerstehen
item.exploit.desc=Der Verteidigungswert der Gegenseite sinkt bei deinen Hacking-Versuchen um 2.
item.fork.desc=Du kannst zwei Ziele mit einer einzelnen Matrixhandlung treffen, ohne den Würfelpool aufzuteilen. Jedes Ziel verteidigt sich mit einem eigenen Würfelpool; die Auswirkungen werden separat bestimmt.
item.lockdown.desc=Wenn du einem Ziel Matrixschaden zufügst, belegst du es zusätzlich mit einer Linksperre.
item.overclock.desc=+2 Würfel für eine Matrixhandlung. Einer der Würfel muss der Schicksalswürfel sein.
item.stealth.desc=Wenn du die Handlung Verstecken durchführst, erhältst du 1 Edge; dieser Punkt muss sofort für diese Handlung ausgegeben werden, sonst verfällt er.
item.trace.desc=Wenn du die Handlung Icon aufspüren durchführst, erhältst du 1 Edge; dieser Punkt muss sofort für diese Handlung ausgegeben werden, sonst verfällt er.
item.clearsight.desc=Die Wahrnehmungs-Fertigkeit der Drohne.\nAttribut: Sensor.
item.electronic_warfare.desc=Diese Autosoft wird als Cracken- Fertigkeit eingesetzt, um Signale zu stören oder ECM zu überwinden.\nAttribut: Sensor.
item.evasion.desc=Kommt zum Einsatz, wenn die Drohne versucht, nicht getroffen zu werden. Wenn eine Drohne beschossen wird, kann sie mit Ausweichen + Pilot versuchen, einem Treffer auszuweichen.\nAttribut: Pilot.
item.maneuvering.desc=Die Steuern-Fertigkeit der jeweiligen Drohne (nicht zu verwechseln mit ihrer Pilotstufe).\nAttribut: Pilot.
item.targeting.desc=Wird als Waffenfertigkeit für eine spezielle montierte Waffe eingesetzt. (Drohnen sind nicht so clever wie Metamenschen und arbeiten nicht mit weiter gefassten Fertigkeitsgruppen, sondern benötigen spezifische Anweisungen).\nAttribut: Sensor.
item.stealth_auto=Dient als spezielle Heimlichkeit-Fertigkeit für den jeweiligen Drohnentyp.\nAttribut: Pilot
item.agents.desc=Agenten
item.datasoft.desc=Datensofts sind vergleichbar mit den Abteilungen von Mini- Bibliotheken. Jede Datensoft enthält eine Datenbank zu einem bestimmten Thema (will heißen: einer bestimmten Wissensfertigkeit). Eine Datensoft versorgt den Benutzer mit einer etwas eingeschränkten Version einer Wissensfertigkeit - Beispiel: Da „Gangs in Seattle“ eine Wissensfertigkeit ist, kann eine Datensoft Informationen über die Ancients oder die Halloweeners enthalten, aber sie kann sich auch auf Gangs in Puyallup konzentrieren. Eine Datensoft wird genauso eingesetzt wie eine Wissensfertigkeit (S. 100).
item.mapsoft.desc=Kartensofts sind heruntergeladene Daten, die detaillierte Informationen über ein bestimmtes Gebiet von etwa 5.000 Quadratkilometern enthalten. Diese Daten umfassen so ziemlich alles: Straßen, Geschäfte und Wohnblöcke, topografische, statistische, GPS- und Umweltdaten. Ein interaktives Interface erlaubt es, schnell die besten Routen zu bestimmen, den nächsten Ort der Wahl zu lokalisieren oder eigene maßgeschneiderte Karten zu erstellen. Mit einer WiFi-Verbindung aktualisiert sich die Karte automatisch mit den neuesten Daten von GridGuide. Das heißt natürlich auch, dass die Kartensoft von anderen genutzt werden kann, um die eigene Position aufzuspüren. Kartensofts gewähren einen Würfelpoolbonus von +1 auf Proben, um den richtigen Weg zu finden.
item.shopsoft.desc=Shopping-Apps wie Clothes Horse, Caveat Emptor oder Guns Near Me bieten Preisvergleiche und Käuferbewertungen für alle Arten von Standardwaren. Eine passende Shopsoft - es gibt eine für jede Art von Produkt wie Elektronik, Feuerwaffen, Nahkampfwaffen, Panzerung usw. - gewährt einen Würfelpoolbonus von +1 auf Einflussproben, um solche Gegenstände zu kaufen oder zu verkaufen.
item.knowsoft.desc=Wissenssofts replizieren Wissensfertigkeiten und überschreiben aktiv das Wissen des Anwenders durch ihre eigenen Daten. Auf Wissenssofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl der Wissenssofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse. Wissenssofts haben - wie Wissensfertigkeiten - keine Stufe.
item.autosoft.desc=Autosofts sind Programme, die durch das Pilotprogramm einer Drohne genutzt werden. Sie fungieren als Fertigkeiten, die die Leistung der Drohne verbessern. Jede Autosoft wird in Kombination mit einem Attribut eingesetzt, das in der untenstehenden Liste beschrieben ist. Vergiss jedoch nicht, dass Rigger ihre eigenen Attribute und Fertigkeiten nutzen, wenn sie in eine Drohne hineingesprungen sind. Eine Drohne hat eine gewisse begrenzte Anzahl an Plätzen für Autosofts und andere Matrixprogramme, die ihrer halben Pilotstufe (aufgerundet) entspricht. Wenn die Drohne als Slave mit einer Riggerkonsole verbunden ist, verwendet sie die Programme, die auf der Riggerkonsole laufen. Auf diese Weise kann eine Drohne mehr Autosofts einsetzen, als ihr normalerweise möglich wäre.
item.linguasoft.desc=Linguasofts replizieren Sprachfertigkeiten und ermöglichen es dem Anwender, eine fremde Sprache zu sprechen. Auf Linguasofts muss mit einer Talentbuchse zugegriffen werden, und die Anzahl der Linguasofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse. Linguasoftstufen entsprechen folgenden Sprachfertigkeiten: Stufe 1 - Grundkenntnisse; 2 - Sprachspezialist; 3 - Sprachexperte; 4 - Sprachexperte. Diese Stufen funktionieren wie Sprachfertigkeiten (siehe S. 100): Mit Stufe 1 kann man einzelne Fetzen der Sprache verstehen und die Sprachfertigkeit wie eine normale Wissensfertigkeit verwenden. Die höheren Stufen gewähren auf alle Proben, die mit dem Verstehen der Sprache zusammenhängen, einen Würfelpoolbonus in Höhe ihrer Stufe. Linguasofts können keine höhere Stufe haben als 4.
item.tutorsoft1.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.tutorsoft2.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.tutorsoft3.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.tutorsoft4.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.tutorsoft5.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.tutorsoft6.desc=Diese virtuellen Privatlehrer helfen beim Lernen einer bestimmten Fertigkeit (siehe S. 96). Die Lehrsoft legt Unterrichtenproben mit einem Würfelpool in Höhe ihrer Stufe × 2 ab. Lehrsofts können keine Fertigkeiten lehren, die auf Magie oder Resonanz basieren, und sie können Stufen von 1 bis 6 haben.
item.activesoft.desc=Aktionssofts ersetzen körperliche Aktionsfertigkeiten, also im Wesentlichen jede Aktionsfertigkeit, die nicht auf Magie oder Resonanz basiert. Um die Aktionssoft in nutzbares Muskelgedächtnis zu übersetzen, sind eine Talentbuchse und Talentleitungen (S. 285/289) erforderlich. Die Anzahl an Aktionssofts, die man gleichzeitig nutzen kann, entspricht der Stufe der Talentbuchse.\nAktionssofts gibt es in Stufen von 1 bis 6.
metatype.human.desc=Als die Mehrheit der intelligenten Bewohner des Planeten stellen die Menschen die Definition des Begriffes „normal“ dar - und natürlich haben einige von ihnen nichts Besseres zu tun, als diese Definition nach bestem Wissen und Gewissen zu missbrauchen. Diese Menschen wissen, dass ihnen die körperliche Kraft und der soziale Zusammenhalt einiger der anderen Metatypen fehlt, deshalb formen sie sich die Welt auf eine Weise, die jene Individuen, die sie nicht mögen, davon abhält zu erkennen, wozu sie in der Lage sind und was sie aus sich machen könnten.
metatype.elf.desc=Das vielleicht Nervigste an Elfen ist, dass man sich über sie ärgern und aufregen kann, so viel man will, und es ihnen schnurzegal ist. Sie haben zwei florierende Nationen - Tír na nÓg (vormals Irland) und Tír Tairngire (im Westen Nordamerikas) -, sie haben Leute in einigen der einflussreichsten Positionen der Welt, und sie haben Prominente, deren MeFeed-Klicks in die Milliarden gehen. Sie werden beneidet, nicht verachtet.
metatype.dwarf.desc=Die Zwerge der Sechsten Welt werden im Großen und Ganzen von der etablierten Gesellschaft akzeptiert, ohne jedoch in vollem Umfang wertgeschätzt zu werden. Die größeren Metatypen scheinen sich am wohlsten zu fühlen, wenn Zwerge sich in die Rollen fügen, die man am ehesten mit ihnen assoziiert - Handlanger, Fahrer, Mechaniker und solche Sachen. Und das wird auch dadurch nicht gerade besser, dass sie sich aufgrund ihrer geringen Größe oft in Fahrzeuge quetschen können, in die Orks, Menschen und Elfen nur mit größter Mühe hineinpassen und Trolle schon mal gar nicht. Trotzdem finden sie relativ leicht Arbeit und stoßen nur auf wenig direkten Hass. Sie werden einigermaßen gut behandelt, können aber nicht das Gefühl abschütteln, dass man sie nicht ganz für voll nimmt.
metatype.ork.desc=Orks machen die Leute nervös, und die Leute sind nicht gerne nervös. Ihre Hauer, ihre Knochenstruktur und ihre spitzen Ohren markieren sie als etwas durch und durch anderes, und ihre Stärke und Größe lassen deutlich den Schaden erahnen, den sie anrichten können. Wie sie es schon seit Jahrhunderten getan haben, reagieren die Menschen auf das, was sie fürchten, indem sie es ausstoßen, indem sie dafür sorgen, dass die Orks ihre Kräfte nicht bündeln können, und sie durch ihre zahlenmäßige Überlegenheit unterdrücken.
metatype.troll.desc=Es ist nicht leicht, in einer Gesellschaft zu leben, wenn man wie das wandelnde Abbild eines Albtraums aussieht. Und zwei- bis dreimal so groß zu sein wie alle anderen hilft auch nicht gerade. Es ist nun einmal keine Trollwelt, und die meisten anderen Bewohner dieser Welt sind auch nicht geneigt, das zu ändern. Wer möchte schon Platz machen für furchterregende Monster? Trolle werden sich ihren Weg zu einem Platz in der Welt erzwingen müssen - und wenn sie sich den Weg irgendwo hinein erzwingen, bezeichnet man sie unweigerlich als Vandalen und Zerstörer
adeptpower.adrenaline_boost.desc=Du erfährst einen Energieschub, sodass du anderen zuvorkommen kannst. Pro Stufe dieser Kraft kannst du nach der Aktivierung dein Initiativeergebnis für [Magie] Kampfrunden um 2 erhöhen. Nach diesen Kampfrunden musst du einem Entzug in Höhe der Stufe der Kraft widerstehen.
adeptpower.astral_perception.desc=Du erhältst die Fähigkeit zur astralen Wahrnehmung nach den normalen Regeln (siehe S. 161). Wenn du diese Kraft einsetzt, wirst du zum Dualwesen und kannst astrale Gestalten angreifen.
adeptpower.attribute_boost.desc=Mana fließt in deinen Körper und verstärkt deine natürlichen Fähigkeiten, sodass du ein höheres Niveau erreichst. Beim Erwerb dieser Kraft musst du ein bestimmtes Körperliches Attribut (Konstitution, Geschicklichkeit, Reaktion oder Stärke) auswählen. Wenn du diese Kraft mehrmals erwirbst, kann sie entweder dasselbe Attribut mit höherer Stufe (bis zu Stufe 6) oder ein neues Attribut betreffen. Sie kann nicht für Geistige oder Spezialattribute gewählt werden.\nWenn du diese Kraft aktivierst, lege eine Probe auf die Stufe der Kraft + Magie ab. Jeder Erfolg erhöht die Stufe des betroffenen Attributs um 1 (bis zum Maximum von +4). Diese Erhöhung wirkt sich nur auf Würfelpools aus; daher werden Initiativewert, Zustandsmonitor, Verteidigungswert und so weiter nicht beeinflusst. Die Wirkung hält [Erfolge] Kampfrunden lang an, und wenn sie abläuft, musst du einem Entzug in Höhe der Stufe der Kraft widerstehen.
adeptpower.combat_sense.desc=Diese Kraft verleiht dir die Fähigkeit, Schwierigkeiten vorherzusehen und zu vermeiden. Du erhältst einen Würfelpoolbonus von +1 pro Stufe der Kraft bei allen Verteidigungsproben. Du hast immer die Chance, mit einer Wahrnehmungsprobe eine Überraschung zu vermeiden.
adeptpower.critical_strike.desc=Der Schadenswert deiner Nahkampfangriffe steigt um 1 pro Stufe dieser Kraft. Diese Kraft ist kompatibel mit anderen Verbesserungen durch Waffen oder Adeptenkräfte, sofern nicht anders angegeben.
adeptpower.danger_sense.desc=Du hast einen sechsten Sinn für Gefahren und weißt instinktiv, wann sie drohen und wann du dich auf sie vorbereiten musst. Du erhältst 1 Edge vor Überraschungsproben; dieser Punkt muss sofort für die Probe ausgegeben werden, sonst verfällt er.
adeptpower.direction_sense.desc=Du hast einen guten Sinn dafür, wo du warst, wohin du unterwegs bist, und auch für ein paar Hindernisse auf dem Weg. Wenn du eine Natur-Probe ablegst, die mit Orientierung zu tun hat, erhältst du 1 Edge; dieser Punkt muss sofort für die Probe ausgegeben werden, sonst verfällt er.
adeptpower.enhanced_perception.desc=Deine Sinne sind höchst scharf, sodass du Informationen schnell genug erhältst, um etwas damit anfangen zu können. Du erhältst 1 Edge, wenn du die Handlung Genau beobachten durchführst oder eine Wahrnehmungsprobe ablegst, um etwas Verstecktes zu finden oder etwas zu hören, was du nicht hören solltest. Dieser Punkt muss sofort für die Probe ausgegeben werden, sonst verfällt er.
adeptpower.enhanced_accuracy.desc=Waffen sind in deinen Händen tödlicher und präziser als in denen normaler Leute. Erhöhe den Angriffswert bei jeder Waffe, die du benutzt, um 2.
adeptpower.improved_ability.desc=Bei der Auswahl dieser Kraft muss eine Fertigkeit festgelegt werden. Diese Fertigkeit erhält eine dauerhafte Erhöhung um die Stufe der Kraft. Die Fertigkeit kann maximal auf das 1,5-Fache (aufgerundet) der gegenwärtigen Stufe oder um +4 erhöht werden (je nachdem, was niedriger ist). Du musst in einer Fertigkeit mindestens Stufe 1 besitzen, um die Kraft für sie auszuwählen. Diese Kraft kann für mehrere Fertigkeiten erworben werden.
adeptpower.improved_ability_combat.desc=Bei der Auswahl dieser Kraft muss eine Fertigkeit festgelegt werden. Diese Fertigkeit erhält eine dauerhafte Erhöhung um die Stufe der Kraft. Die Fertigkeit kann maximal auf das 1,5-Fache (aufgerundet) der gegenwärtigen Stufe oder um +4 erhöht werden (je nachdem, was niedriger ist). Du musst in einer Fertigkeit mindestens Stufe 1 besitzen, um die Kraft für sie auszuwählen. Diese Kraft kann für mehrere Fertigkeiten erworben werden.
adeptpower.improved_physical_attribute.desc=Dieses Attribut erhält eine permanente Steigerung in Höhe der Stufe dieser Kraft. Das Attribut kann maximal auf das 1,5-Fache (aufgerundet) der gegenwärtigen Stufe oder um +4 erhöht werden (je nachdem, was niedriger ist).
adeptpower.improved_reflexes.desc=Diese Kraft verleiht dir schnelle Reflexe und eine Art Vorausahnung, was dich viel schneller agieren und reagieren lässt als die Normalsterblichen. Für jede Stufe dieser Kraft erhältst du 1 zusätzlichen Initiativewürfel und eine Erhöhung der Reaktion um 1. Die maximale Stufe dieser Kraft beträgt 4, und sie kann mit keinen anderen Steigerungen von Initiative oder Reaktion kombiniert werden.
adeptpower.improved_sense.desc=Wähle einen Sinn (Gesichtssinn, Gehör, Tastsinn, Geruchs- oder Geschmackssinn) aus, wenn du diese Kraft erwirbst. Bei jeder Probe, die diesen Sinn betrifft, erhältst du 1 Edge; dieser Punkt muss für diese Probe ausgegeben werden, sonst verfällt er. Durch diese Kraft kann nur 1 Edge pro Begegnung und beteiligtem Sinn erhalten werden. Diese Kraft kann mehr als einmal, jeweils für einen anderen Sinn, gewählt werden.
adeptpower.killing_hands.desc=Deine Hände werden tödlich und magisch, was sich sowohl für einen Run als auch für dumme Anmachen gut eignet. Im waffenlosen Kampf kannst du entscheiden, ob du Körperlichen oder Betäubungsschaden verursachen willst. Todeskralle kann mit anderen Kräften kombiniert werden, die sich auf waffenlosen Kampf auswirken. Angriffe mit Todeskralle gelten als magisch, was bedeutet, dass die Kraft Immunität gegen Normale Waffen nicht gegen die Todeskralle wirkt und auch astrale Wesenheiten angegriffen werden können.
adeptpower.kinesics.desc=Kommunikation ist … einfach magisch, und das hilft dir auch, selbst sehr schwer zu deuten zu sein. Wenn du dich gegen soziale Proben und Proben wehrst, mit denen deine Emotionen gelesen, deine Vorhaben durchschaut oder deine Wahrhaftigkeit eingeschätzt werden sollen, erhältst du 1 Edge. Pro Begegnung kannst du nur einmal durch diese Kraft Edge erhalten.
adeptpower.mystic_armor.desc=Mana bildet einen Schild um dich, um dich zu schützen. Pro Stufe in dieser Kraft erhöht sich dein Verteidigungswert um 1. Dies wirkt kumulativ zu getragener Panzerung. Mystische Panzerung wirkt auch auf der Astralebene.
adeptpower.pain_resistance.desc=Schmerz tut weh, aber du kannst ihn besser ignorieren. Für jede Stufe dieser Kraft treten Verletzungsmodifikatoren auf dem Zustandsmonitor erst ein Kästchen später auf. Bei Stufe 1 würdest du also den Würfelpoolmalus von -1 erst bei vier vollen Schadenskästchen erhalten statt bei drei. Die Kraft wirkt sich sowohl auf den Körperlichen also auch auf den Betäubungszustandsmonitor aus.
adeptpower.rapid_healing.desc=Die Magie, die durch dich fließt, hilft dir dabei, deine Knochen und dein Fleisch schneller wieder zusammenwachsen zu lassen, wodurch du schneller heilst. Pro Stufe dieser Kraft erhältst du einen zusätzlichen Erfolg bei Heilungs- Proben, die abgelegt werden, um dich zu heilen, sowie bei deinen Genesungsproben.
adeptpower.spell_resistance.desc=Zauber haben die Tendenz, eher von dir abzuprallen, als auf dich zu wirken. Du erhältst 1 Edge, wenn du das Ziel von Zaubern bist, gegen die du dich verteidigen musst.
adeptpower.traceless_walk.desc=Deine Füße wirbeln Staub, Schmutz, Schnee, Wasser oder alles andere nicht auf, wenn sie sich darüber oder hindurch bewegen, daher hinterlässt du keine Spuren deiner Bewegung. Du löst keine Stolperdrähte, Druckplatten oder anderen Fallen aus, die auf der Bewegung der Beine basieren. Bei Wahrnehmungsproben, die dich beim Vorbeigehen mit dem Gehör wahrnehmen sollen, oder bei Natur-Proben, die deine Spuren erkennen sollen, kann die Gegenseite Edge weder erhalten noch ausgeben.
adeptpower.vocal_control.desc=Du kannst Tonhöhe, Lautstärke und Modulation deiner Stimme beeinflussen, sodass sie klingt, wie du es haben willst: laut, leise, volltönend oder wie eine Person, die du imitieren willst. Du erhältst 1 Edge, wenn du eine Probe auf Überreden oder Einfluss ablegst, bei der deine Stimme eine Rolle spielt. Durch diese Kraft kannst du nur 1 Edge pro Begegnung erhalten.
adeptpower.wall_running.desc=Das horizontale Laufen ist doch echt für Fußgänger. Eine Wand hochzulaufen zeigt, dass du etwas Besonderes bist. Wenn du diese Kraft einsetzt, kannst du die Handlung Sprinten (siehe S. 45) nutzen, um eine vertikale Oberfläche hochzulaufen. Du kannst diese Kraft nicht zweimal hintereinander einsetzen. Du musst mindestens eine horizontale Bewegung durchführen, bevor du die Kraft erneut einsetzen kannst. Wenn du also eine Wand hochläufst und dann keinen guten Griff oder Stand findest, fällst du wieder herunter.
complexform.cleaner.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg senkt deinen Overwatch-Wert um 1.
complexform.diffusion.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall des Ziels ab. Jeder Nettoerfolg senkt das betroffene Matrixattribut um 1, bis zum Minimum von 1. Diese Komplexe Form kann mehrmals erworben werden und gilt jeweils für ein anderes Matrixattribut.
complexform.editor.desc=Du kannst die Handlung Datei editieren durchführen, ohne die passende Zugangsstufe für die betroffene Datei zu haben. Du musst die Datei allerdings entdecken können.
complexform.emulate.desc=Diese Komplexe Form kann mehrfach erworben werden; sie gilt dann jeweils als ein anderes Programm (siehe S. 184). Sie kann auch für Autosofts erworben werden, deren Stufe dann gleich dem gegenwärtigen Wert des Technomancers in Datenverarbeitung ist (maximal aber Stufe 6). Die Verwendung dieser Komplexen Form erfordert nur eine Nebenhandlung.
complexform.infusion.desc=Lege eine Probe auf Elektronik + Resonanz (4) ab. Jeder Nettoerfolg erhöht das betroffene Attribut um 1, bis maximal zum Doppelten des Ausgangswerts (maximal aber um +4). Diese Komplexe Form kann mehrmals erworben werden und gilt jeweils für ein anderes Matrixattribut.
complexform.mirrored_persona.desc=Du erschaffst eine Pseudo-Persona, die in der Matrix so aussieht und sich genauso verhält wie du. Lege eine Probe auf Elektronik + Resonanz ab; die Werte der Matrixattribute der zusätzlichen Persona, die du erschaffst, entsprechen der Anzahl der Erfolge bei dieser Probe. Die Anzahl der Erfolge dient außerdem als Schwellenwert für Matrixwahrnehmungsproben von anderen, um dich von deiner Spiegelpersona unterscheiden zu können. Wenn dem Gegner die Probe misslingt, wählt er als Ziel seiner Matrixhandlungen die Spiegelpersona.
complexform.pulse_storm.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Logik + Datenverarbeitung des Ziels ab. Jeder Nettoerfolg erhöht den Rauschenwert für das Ziel um 1.
complexform.puppeteer.desc=Du kannst die Handlung Gerät steuern benutzen, ohne die passende Zugangsstufe für das betroffene Gerät zu haben. Du musst das Gerät allerdings entdecken können.
complexform.resonance_channel.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg senkt den Rauschenwert für dich um 1.
complexform.resonance_spike.desc=Lege eine Probe auf Cracken + Resonanz gegen Willenskraft + Firewall des Ziels ab; jeder Nettoerfolg verursacht beim Ziel 1 Kästchen Matrixschaden, dem nicht widerstanden werden kann.
complexform.resonance_veil.desc=Du erschaffst eine Illusion von Matrixaktivität, die optisch, akustisch und allgemein sensorisch wie ein echter Matrixvorgang erscheint. Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Intuition + Datenverarbeitung des Ziels ab. Selbst wenn das Ziel gute Gründe hat, das, was es sieht, nicht für real zu halten, muss ihm eine Probe auf Matrixwahrnehmung mit einem Schwellenwert gleich der Anzahl deiner Nettoerfolge gelingen, um die Illusion zu durchschauen.
complexform.static_bomb.desc=Lege eine einzelne Vergleichende Probe auf Elektronik + Resonanz gegen Intuition + Datenverarbeitung gegen alle Ziele ab, die dich entdecken können. Ein Ziel, das keine Nettoerfolge erzielt, nimmt dich nicht mehr wahr und muss eine Matrixwahrnehmungsprobe ablegen, um dich wieder zu lokalisieren, bevor es irgendwelche Handlungen gegen dich unternehmen kann.
complexform.static_veil.desc=Lege eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall oder Firewall × 2 des Hosts ab. Solange diese Komplexe Form aufrechterhalten wird, erhöht sich der Overwatch-Wert des Ziels nicht durch illegalen Zugang zu einem Host. Der OW steigt aber weiterhin durch illegale Handlungen.
complexform.stitches.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg repariert 1 Kästchen Matrixschaden. Diese Komplexe Form wirkt nur gegen Objekte, die sich ausschließlich in der Matrix aufhalten, nicht gegen Hardware.
complexform.tattletale.desc=Lege eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg erhöht den Overwatch-Wert des Ziels um 1.
lifestyle.street.desc=Du hast keinen Ort, an dem du dein müdes Haupt betten kannst. Du pennst bei irgendjemandem auf dem Sofa oder draußen unter den Sternen, und du schläfst, wenn sich die Gelegenheit bietet, und isst, was du findest. Du kannst nirgends deine Sachen unterbringen - wenn du es nicht bei dir trägst, wird es sehr wahrscheinlich gestohlen worden sein, sobald du dorthin zurückkehrst, wo du es zurückgelassen hast. Es ist ein hartes Leben, aber es ist billig! Wenn du keinen Lebensstil für den laufenden Monat bezahlt hast, lebst du auf der Straße.
lifestyle.squatter.desc=Die Sechste Welt hat eine Menge mitgemacht - Krankheiten, Katastrophen, Kriege und wirtschaftliche Aufschwünge und Zusammenbrüche. Viele der Leute, die diese Welt verlassen haben, haben ihren Lebensraum zurückgelassen, leer stehende Gebäude, die zur Benutzung freistehen, wenn man es schafft, hineinzugelangen - und sich mit unzulänglichen Bedingungen zufriedengibt (Gebäude stehen nicht ohne Grund leer). Sicherheit ist minimal bis nichtexistent - du kannst versuchen, eine verschließbare Tür zu finden, aber oft sind die Wände so wackelig und bröckelig, dass ein potenzieller Einbrecher die Tür einfach umgehen kann. Von Sanitärinstallationen und Heizung kannst du nur träumen. Aber wenn du Glück hast, ist deine Bude halbwegs trocken, und vielleicht kannst du deinen Nachbarn ein paar Nuyen zustecken, damit sie ein Auge auf deine Sachen haben (schließlich müssen die Unterprivilegierten der Welt ja zusammenhalten). Squatteressen ist nur eine Spur besser als beim Leben auf der Straße, da man es sich (meistens) nicht aus der Mülltonne sucht, aber es besteht zum größten Teil aus Soy-Fertiggerichten und anderem geschmacklosem Mist - dem modernen Äquivalent zum Waisenhaus-Haferschleim.
lifestyle.low.desc=So langsam wird es was. Im Unterschichtlebensstil wohnt man zumindest in einem Bau, der tatsächlich als Wohnung vorgesehen war. Gut, es mag ursprünglich ein Transportcontainer gewesen sein, aber irgendwann wurde er zu einer Wohnung umgebaut und es gibt Strom, fließendes Wasser (obwohl das an manchen Tagen und zu bestimmten Stunden abgeschaltet sein mag) und gerade genug Heizung, um nicht zu erfrieren. Die Türen lassen sich abschließen, und es gibt eine offizielle Adresse, und meistens kann man die Fastfoodlieferanten dazu bringen, einem ein paar McHugh’s-Soyburger zu liefern. Die man sich manchmal tatsächlich leisten kann! Viele Shadowrunner haben diesen Lebensstil, ebenso wie die meisten der billigen Arbeiter, die von den Reichen dieser Welt im Allgemeinen ignoriert werden.
lifestyle.middle.desc=Allmählich kommt das gute Leben in Reichweite. Strom und fließendes Wasser rund um die Uhr, Polizisten, die mehr tun als nur verächtlich zu grienen, wenn man ein Verbrechen meldet, Mahlzeiten mit Geschmackszusätzen, die tatsächlich nach etwas schmecken, und nur ein geringes Risiko, in der Nähe der eigenen Wohnung überfallen zu werden. Ist das spektakulär? Nein, aber es ist sicher, und das ist in der Sechsten Welt immerhin selten genug, dass viele Leute zu so einigen Zugeständnissen bereit sind, um es zu bekommen.
lifestyle.high.desc=Beim Flug in einem Flugzeug in der Economy-Klasse kommt man in den Genuss, Trideosendungen zu sehen, die alle fünf bis zehn Minuten von Werbespots unterbrochen werden, bei denen man sich fragt, wer zum Teufel denn diesen ganzen Mist kauft. Aromatherapie-Fußmassierer? Schalterlose Weinflaschenöffner? Gartenfeuerstellen aus gespaltenen Felssteinen? Leute mit einem Oberschichtlebensstil sind die Zielgruppe dieser Werbung. Sie haben Geld zum Ausgeben und Platz, um die Sachen, die sie kaufen, auch hinzustellen. Und sie haben diesen tief sitzenden Drang, nicht zuzulassen, dass die Häuser ihrer Nachbarn beeindruckender sind als ihr eigenes. Sie essen gut, schlafen erholsam und haben Probleme, Leute zu verstehen, die sich über den Zustand der Welt beschweren, denn aus ihrer Sicht ist alles prima. Unter diesen Leuten zu leben, ist ein sicheres Anzeichen dafür, dass man es geschafft hat, aber man sollte sich nicht zu sehr auf seinen Lorbeeren ausruhen - die Toleranz dieser Leute für Eindringlinge ist gering, und sie haben Mittel und Wege, jene auszustoßen, von denen sie das Gefühl haben, dass sie nicht dazugehören. Die zusätzliche Sicherheit, für die man zahlt, könnte sich durchaus als notwendig erweisen.
lifestyle.luxury.desc=Die Spitze. Die Crème de la Crème. Leute mit diesem Lebensstil geben in einem Monat mehr aus als Squatter und Leute auf der Straße in mehreren Jahren oder gar ihrem ganzen Leben. Sie tun all die Dinge, von denen alle mit einem niedrigeren Lebensstil nur träumen können. Sie essen regelmäßig richtiges Essen. Sie schippern mit Jachten in die Karibik und tauchen in dem leuchtend blauen Wasser. Sie logieren in Hotels, in denen ihnen ganze Armeen von Bediensteten die Wünsche von den Augen ablesen. Trideoproduzenten stehen Schlange in der Hoffnung, Touren durch ihre Anwesen filmen zu können. Ihre alltägliche Realität ist surreal, aber jegliche Existenzangst, die womöglich aufkommen mag, lässt sich mit den exotischsten Alkoholika, den weichsten Kissen und den schönsten Aussichten, die man für Geld kaufen kann, einlullen. Und das fundamentale Prinzip der Sechsten Welt ist ja, dass man für Geld alles kaufen kann.
spirit.spirit_of_air.desc=Keine Beschreibung verfügbar
spirit.spirit_of_beasts.desc=Keine Beschreibung verfügbar
spirit.spirit_of_earth.desc=Keine Beschreibung verfügbar
spirit.spirit_of_fire.desc=Keine Beschreibung verfügbar
spirit.spirit_of_kin.desc=Keine Beschreibung verfügbar
spirit.spirit_of_water.desc=Keine Beschreibung verfügbar
sprite.courier.desc=Kurier-Sprites sind großartig für das sichere Übermitteln von Nachrichten und für Überwachungsaufgaben geeignet.
sprite.crack.desc=Wenn du ein leises Sprite suchst, das sich unauffällig bewegen kann, ist dieses hier genau das Richtige.
sprite.data.desc=Datensprites sind Meister des Findens und Manipulierens von Daten. Sie sind großartige Bibliothekare, Suchbots und Quizchampions.
sprite.fault.desc=Das Stör-Sprite hat man gern im Kampf an der Seite. Es ist kalt wie IC, doppelt so stur und zerfetzt deine Feinde im Aufblitzen eines Icons.
sprite.machine.desc=Das Maschinen-Sprite interagiert von allen Sprites am wahrscheinlichsten mit der physischen Welt, wenn auch nur durch Geräte. Maschinen-Sprites sind Experten aller Art von Elektronik.
tradition.hermetic.desc=Die Interpretationen der Hermetik haben sich im Laufe der Jahrhunderte leicht verändert, aber die hermetischen Glaubenssätze der Sechsten Welt fußen auf einer einzigen gemeinsamen Grundlage: Magie ist zwar noch nicht vollständig verstanden, sie kann aber verstanden werden. Hermetiker wählen einen wissenschaftlichen Zugang zur Magie. Sie führen einen Versuch und ein Laborexperiment nach dem anderen durch, um die logischen Grundlagen besser begreifen zu können. Es sollte nicht überraschen, dass die Fakultäten der prominentesten thaumaturgischen Universitäten der Welt vor allem Hermetiker als Lehrende beschäftigen. Hermetiker sehen sich als Angehörige einer langen, stolzen Tradition des Strebens nach dem Begreifen der grundlegenden Gesetze der Welt und der Möglichkeiten ihrer Manipulation. Sie weisen nur zu gerne darauf hin, dass die alchemistischen Studien von Isaac Newton viel mehr von seiner Lebenszeit beansprucht haben als seine Studien der Physik, und dass Leute wie John Dee und Aleister Crowley, die an die Ränder der akademischen Welt gedrängt wurden, nach dem Erwachen eine verspätete Rehabilitierung erfuhren. Weil Hermetiker meinen, dass sie die Magie verstehen, glauben sie, dass sie dadurch allen anderen Akademikern überlegen sind, weil deren Verständnis nur in der physischen Welt begründet ist. Das trägt viel zu ihrem Ruf als arrogante Snobs bei - ein Ruf, den sie gerne akzeptieren, denn schließlich ist es keine Arroganz, wenn man wirklich so gut ist.
tradition.shaman.desc=Schamanen empfinden den Wunsch der Hermetiker danach, alles in eine kalte, berechnende Ordnung zu pressen, abwechselnd als amüsant und als äußerst ärgerlich. Sie übernehmen in leicht abgewandelter Form eine alte Weisheit, indem sie sagen, dass das Schreiben über Magie so ist, als würde man über Architektur tanzen. Magie soll gefühlt und erlebt, nicht in spartanischen Labors und langweiligen Schulungsräumen studiert werden. Sie weisen darauf hin, dass allein die Existenz verschiedener Traditionen zeigt, dass Magie höchst individuell ist, und sie sagen, dass die kalten Gleichungen der Hermetiker niemals die Verschiedenheit und Macht unterschiedlicher magischer Ausdrucksformen beschreiben könnten. Die Anhänger der schamanischen Tradition glauben, dass man Magie wirken und erleben muss, statt sie unter Glas zu stellen. Das führt manchmal zu inkonsistenten Ergebnissen oder Unfällen mit Verletzungen, aber das kann in der Kunst, der Liebe und so vielen anderen Lebensbereichen genauso passieren. Warum sollte Magie da anders sein? Hermetiker sehen Schamanen als schlampig und undiszipliniert, und genau so mögen die Schamanen das.
mentorspirit.bear.desc=Dieser Schutzgeist steht für Schutz und Stärke. Er ist ein Heiler, kann niemanden im Stich lassen, ohne einen guten Grund dafür zu haben, und verteidigt die Wesen, die unter seinem Schutz stehen. Bär hat auch eine wilde Seite: Er ist ein passionierter Verteidiger und achtet im Kampf nicht auf die eigene Sicherheit, wenn er oder ein Schutzbefohlener verwundet wird.\n\nVorteile\nALLGEMEIN: Edge-Boosts beim Schadenswiderstand kosten 1 Edge weniger als normal (nicht beim Entzugswiderstand)\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Heilung kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Beschleunigte Heilung gratis\n\nNachteile\nDu kannst im Kampf zum Berserker werden, wenn du Körperlichen Schaden erleidest oder jemand, den du beschützt, schwer verletzt wird. Lege (mit Verletzungsmodifikatoren) eine Probe auf Willenskraft + Charisma ab. Du verfällst für 3 Runden minus 1 Runde pro Erfolg in einen Berserkerrausch. Drei oder mehr Erfolge können diesen komplett verhindern. Wenn du bereits im Berserkerrausch bist, erhöht sich die Dauer entsprechend. In diesem Zustand stürzt du dich, ohne auf deine eigene Sicherheit zu achten, auf die Angreifer. Wenn du diese vor Ablauf des Berserkerrauschs kampfunfähig machst, endet dieser vorzeitig.
mentorspirit.cat.desc=Katze wird in Kulturen auf der ganzen Welt hoch geachtet. Man betrachtet Katze oft als Hüterin mystischer Geheimnisse - auch jener über das Leben nach dem Tod. Sie kennt viele Geheimnisse, teilt sie aber nur selten und weiht niemals jemanden ein, den sie (nach ihren eigenen Maßstäben) nicht für würdig hält. Sie ist verstohlen, hinterlistig und arrogant. Katze spielt mit ihren Opfern - bedroht sie, verfolgt und verwirrt sie -, bevor sie dann erbarmungslos zuschlägt.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Athletik- oder Heimlichkeits- Proben (nach Wahl der Spielerin) kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal\nADEPT: Kraft Spurloser Schritt gratis\n\nNachteile\nKatzenzauberer spielen mit ihren Opfern. Wenn dir zu Kampfbeginn eine Probe auf Willenskraft + Charisma (3) misslingt, kannst du keine Angriffe durchführen, die dein Ziel handlungsunfähig machen würden. Wenn du Körperlichen Schaden erleidest, hört dieses Herumspielen allerdings sofort auf.
mentorspirit.coyote.desc=Kojote ist ein Meister der Streiche: der Geist, der nie dort ist, wo man ihn sucht, und einem immer einen Schritt voraus ist. Die besten Streiche sind die, von denen niemand weiß, dass er sie gespielt hat. Sie sind perfekte Betrügereien, bei denen das Opfer das Gefühl hat, einfach Pech zu haben, und nicht weiß, wie übel man ihm mitgespielt hat. Die Streiche von Kojote sind nicht immer bösartig, aber auch nicht immer unschuldig. Sie sind das, was er haben will, und seine Trickkiste ist unerschöpflich.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Überreden-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal \ADEPT: Kraft Stimmkontrolle gratis \n\nNachteile\n Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um das Unglück anderer nicht zu deinem Vorteil nutzen zu wollen oder um dir einen schlauen Trick oder Scherz zu verkneifen, selbst wenn dieser deinen Freunden zum Nachteil gereichen würde.
mentorspirit.dog.desc=Hund ist ein loyaler Freund. Er kämpft heldenhaft für den Schutz der Seinen und seines Heims. Hund schützt andere vor schädlichen Zaubern und gefährlichen Geistern. Er ist loyal, großzügig und hilft Personen, die freundlich zu ihm sind. Außerdem ist er zielstrebig, oft bis zur Sturheit hin.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal\nADEPT: 2 Geschärfte Sinne gratis\n\nNachteile\nHund ist unverbrüchlich loyal. Du kannst niemanden im Stich lassen, deine Freunde verraten oder zulassen, dass jemand sich für dich opfert, wenn dir keine Probe auf Willenskraft + Charisma (3) gelingt.
mentorspirit.dragonslayer.desc=Dieser heldenhafteste aller Schutzgeister ist zugleich der lebenslustigste. Er kämpft natürlich, um die Seinen vor allen Gefahren zu schützen, schätzt aber Partys und Vergnügen noch viel mehr. Er ist ein großer Bruder, der sich freundlich für alles interessiert, was seine Familie macht. Manchmal ist er ein wenig naiv, aber er ist ein verlässlicher Freund und ein tödlicher Gegner. Die Drachen, die er tötet, haben sich mit der Zeit verändert: Im Moment sind seine bestialischen Feinde das Verbrechen, die Umweltverschmutzung, Korruption - und natürlich echte Drachen. Drachentöter kämpft und spielt mit harten Bandagen. Wenn er einmal einen Eid geleistet hat, wird er ihn niemals brechen. Drachentöter verhält sich ehrenvoll und höflich und verlangt das auch von seiner Umgebung.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal\nADEPT: Kraft Gefahrensinn gratis\n\nNachteile\nWenn du (absichtlich oder unabsichtlich) ein Versprechen brichst, erhältst du einen Würfelpoolmalus von -1 auf alle Handlungen, bis du es wiedergutgemacht hast.
mentorspirit.eagle.desc=Adler ist ein hoch fliegender Vogel und wird in vielen Kulturen als edelster aller Himmelsbewohner betrachtet. Er ist ein stolzer Einzelgänger, der alles, was in der Welt geschieht, von oben betrachtet. Adler ist ein edler Verteidiger der Reinheit der Natur. Er ist gegenüber anderen Meinungen intolerant und misstraut der Technologie und ihren Erzeugnissen zutiefst. Wer die Natur schädigt, ist Adlers Feind, und Adler wird großen Gefahren die Stirn bieten, um die Verschmutzer und andere Übeltäter zu besiegen.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Wahrnehmungsproben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts beim Herbeirufen von Luftgeistern kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Kampfsinn gratis\n\nNachteile\n Du erhältst eine Allergie (Schadstoffe, Leicht) (S. 78) ohne Karmabonus.
mentorspirit.firebringer.desc=Feuerbringer hat das Geheimnis des Feuers aus dem Himmel gestohlen und der Metamenschheit zum Geschenk gemacht. Er ist eine gütige und achtsame Gestalt, aber seine guten Absichten bringen ihn oft in Schwierigkeiten, und seine Pläne entwickeln sich oft anders, als er sich das dachte. Er ist ein Schöpfer und Gestalter, der aus dem Urschlamm Neues schafft und ihm den feurigen Atem des Lebens einhaucht. Feuerbringer widmet sich der Verbesserung des Lebens für andere, auch auf eigene Kosten. Die meisten seiner Anhänger verschreiben sich mit ganzem Herzen einem großen Ziel.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Mechanik- oder Verzaubern-Proben (nach Wahl des Spielers) kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Verbesserte Fertigkeit (Fertigkeit); nicht für Kampffertigkeiten\n\nNachteile\nWenn jemand dich eindringlich um Hilfe bittet, kannst du diese nur verweigern, wenn dir eine Probe auf Willenskraft + Charisma (3) gelingt.
mentorspirit.mountain.desc=Berg ist im Herzen der Erde verwurzelt und wächst zugleich in den Himmel. Er hat unendliche Kraft und Ausdauer, ist aber wenig flexibel. Berg ist stur und unnachgiebig und lässt sich, wenn er sich einmal eine Meinung gebildet hat, nur schwer vom Gegenteil überzeugen.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Antimagieproben und Verankerten Ritualen kosten 1 Edge weniger als normal\nADEPT: 2 Stufen Mystischer Panzer gratis\n\nNachteile\nWenn Berg einen Plan gefasst hat, bleibt er dabei. Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um ein geplantes Vorgehen aufzugeben und einem neuen Plan zu folgen. Wenn die Probe misslingt, musst du dem ursprünglichen Plan folgen - wenn nötig auch alleine. Außerdem muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, wenn du ganz ohne Plan vorgehen willst.
mentorspirit.rat.desc=Ratte lebt überall, wo Metamenschen leben und ihren Abfall abladen, weil sie sich davon ernährt. Ratte ist ein Aasfresser, ein verstohlener Dieb, der sich nimmt, was er zum Überleben braucht. Sie hasst es, offen aufzutreten, und hält sich lieber im Schatten. Ratte vermeidet Kämpfe, wann immer es geht. Wenn sie kämpfen muss, will sie schnell töten und schnell wieder verschwinden.\n\nVORTEILE\nALLGEMEIN: Edge-Boosts bei Heimlichkeits-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Verzaubern-Proben zum Sammeln von Reagenzien kosten 1 Edge weniger als normal, und du kannst Reagenzien jeder Tradition ohne Einschränkung einsetzen \nADEPT: 1 Stufe Schmerzresistenz gratis \n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um im Kampf nicht sofort zu fliehen oder in Deckung zu gehen. Wenn du nicht fliehen kannst, musst du kämpfen.
mentorspirit.sea.desc=Meer ist die Wiege allen Lebens. Meer ist undurchschaubar und unberechenbar - ruhig und angenehm im einen Moment, furchterregend und zerstörerisch im nächsten. Obwohl Meer unendlich reich ist, wacht es eifersüchtig über alles, was es in die Finger bekommt. Meer kann ein mächtiger Verbündeter sein, der aber ständig mit großer Vorsicht umworben werden will. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Athletik-Proben zum Schwimmen kosten 1 Edge weniger als normal; die Bewegungsrate beim Schwimmen steigt um 1 Meter pro Kampfrunde \nZAUBERER: Edge-Boosts beim Herbeirufen von Wassergeistern kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit (Athletik) gratis\n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um etwas herzugeben, das dir gehört, oder um auf irgendeine Weise wohltätig zu sein.
mentorspirit.seducer.desc=Der Verführer ist die Verkörperung des Verlangens. Er hat etliche Laster, die er häufig befriedigen muss. Er stachelt zu Eifersucht und Gier an und strebt danach, auch in anderen das Verlangen zu wecken. Direkte Konfrontationen vermeidet er, liebt es aber, wenn andere für oder um ihn kämpfen. Er lebt dafür, Schwächen auszunutzen, und zögert nicht, andere zu opfern, die ihm im Weg stehen. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Überreden-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit (Überreden) oder (Einfluss) (nach Wahl des Spielers) \n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um einem Laster oder einer Neigung (Drogen, BTL, Sex usw.) nicht bei erster Gelegenheit nachzugeben.
mentorspirit.shark.desc=Hai ist ein gnadenloser, kalter Jäger. Alle, die am Meer leben, kennen seine Macht. Wenn Hai zuschlägt, tut er das ohne Gnade und wird vom Blut seiner Beute in Raserei versetzt. Haizauberer sind ruhelose Wanderer, die immer in Bewegung bleiben. Sie sind wilde, tödliche Kämpfer. Ein Haizauberer findet, dass nur ein toter Feind ein guter Feind ist. Wenn Hai herausgefordert wird, hält er sich nicht mit Drohungen auf, sondern schlägt zu, um zu töten.\n\nVorteile\nALLGEMEIN: Edge-Boosts für Nahkampf-Proben ohne Waffen und mit Klingenwaffen kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal\nADEPT: Kraft Todeskralle gratis\n\nNachteile\nWenn du im Kampf Körperlichen Schaden erleidest, kannst du in einen Berserkerrausch verfallen. Lege (mit Verletzungsmodifikatoren) eine Probe auf Willenskraft + Charisma ab. Du verfällst für 3 Runden minus 1 Runde pro Erfolg in einen Berserkerrausch. Drei oder mehr Erfolge können diesen komplett verhindern. Wenn du bereits im Berserkerrausch bist, erhöht sich die Dauer entsprechend. In diesem Zustand stürzt du dich, ohne auf deine eigene Sicherheit zu achten, auf die Angreifer. Wenn deine Ziele kampfunfähig sind, bevor die Zeit abgelaufen ist, attackierst du ihre leblosen Körper
mentorspirit.snake.desc=Schlange ist weise und kennt viele Geheimnisse. Sie gibt klugen Rat, verlangt dafür aber immer einen Preis. Schlange kämpft nur, um sich und andere zu schützen. Sie ist besessen vom Entdecken von Geheimnissen und nimmt dafür auch große Risiken in Kauf. Schlange tauscht ihr Wissen mit anderen gegen alles, was sie dafür bekommen kann. \n\nVorteile\nALLGEMEIN: Zwei magiebezogene Wissensfertigkeiten gratis\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal \nADEPT: Kraft Körpersprache gratis\n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um Hinweise auf Geheimnisse oder Wissen, die nur wenigen Leuten bekannt sind, nicht zu
mentorspirit.thunderbird.desc=Donnervogel ist die majestätische Verkörperung des Sturms. Seine Schwingen sind dunkle Wolken, sein Schnabel und seine Krallen sind Blitze, und sein Schrei ist Donnergrollen. Donnervogel ist eine Urgewalt - oft wild, aber nötig für das Überleben des Landes und das Aufrechterhalten des Lebenskreislaufs. Man muss diese Gewalt respektieren und sich ihr vorsichtig nähern, um nicht ihren Zorn zu wecken.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal\nZAUBERER: Edge-Boosts beim Herbeirufen von Luftgeistern kosten 1 Edge weniger als normal\nADEPT: 1 Stufe Kritischer Schlag gratis \n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um auf eine Beleidigung nicht scharf zu reagieren.
mentorspirit.wise_warrior.desc=Der Weise Krieger beherrscht die Kriegskunst, weil für ihn die Schlacht eine Übung für Geist und Körper ist. Er studiert die Taktik seiner Feinde und besiegt sie durch eine Mischung aus überlegener Strategie und Kampfkraft. Der Weise Krieger handelt nicht aus Barbarei oder Kriegslust, sondern aus Weisheit und Wissen. Weise Krieger müssen einem Krieger-Ehrenkodex folgen und sich entsprechend benehmen, um die Gunst des Schutzgeistes zu behalten. \n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Verbesserte Fertigkeit für eine Kampffertigkeit\n\nNachteile\nWenn du dich (absichtlich oder unabsichtlich) ehrlos oder unhöflich verhältst, erhältst du einen Würfelpoolmalus von -1 auf alle Handlungen, bis du dein Verhalten gesühnt hast.
mentorspirit.wolf.desc=Wolf wird auf der ganzen Welt als Jäger und Krieger geachtet. Er widmet sich hingebungsvoll seinem Rudel. Wolf gewinnt jeden Kampf seines Lebens - außer den, in dem er stirbt. Wolfszauberer sind ihrer Familie und ihren Freunden gegenüber bis in den Tod loyal. Sie zeigen im Kampf niemals Feigheit und halten immer ihr Wort. \n\nVorteile \nALLGEMEIN: Edge-Boosts bei Antimagie-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal \nADEPT: 2 Stufen Attributsschub (Geschicklichkeit) gratis \n\nNachteile\nDir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um dich aus einem Kampf zurückzuziehen.
sensorfunction.atmosphere_sensor.desc=Wettervorhersagen sind (dank der Umweltverschmutzung und des Erwachens und je nachdem, welche Drachen gerade wo mit den Flügeln schlagen) notorisch unzuverlässig, aber Atmosphärensensoren bewahren einen mit einer sekundengenauen Analyse der Geschehnisse in der Luft um einen herum davor, von schlechtem Wetter überrascht zu werden.
sensorfunction.cyberware_scanner.desc=Dieser Millimeterwellenscanner ist hauptsächlich für die Entdeckung von Cyberware gedacht, kann aber auch andere Konterbande finden. Er lokalisiert das betreffende System oder Gerät, kann aber nicht identifizieren, um was es sich dabei handelt. Die maximale Reichweite beträgt 15 Meter.
sensorfunction.geiger_counter.desc=Dieser Sensor misst die Menge der Radioaktivität, die ihn umgibt. Je schneller er klickt, desto näher ist man dem Strahlentod.
sensorfunction.laser_range_finder.desc=Dieser Sensor sendet einen Laserstrahl aus, der von der Oberfläche eines Ziels reflektiert und von einem Detektor erfasst wird, um die genaue Entfernung zum Ziel zu berechnen.
sensorfunction.mad_scanner.desc=Der MAD-Scanner (Magnetanomaliedetektion) wird für die Entdeckung von Waffen und anderen Metallkonzentrationen verwendet. Er hat eine maximale Reichweite von 5 Metern.
sensorfunction.motion_sensor.desc=Dieser Sensor verwendet eine Mischung aus Ultraschall und niederenergetischem Infrarot, um Bewegungen und drastische Veränderungen in der Umgebungstemperatur zu entdecken. Die maximale Reichweite beträgt 25 Meter.
sensorfunction.olfactory_sensor.desc=Der Geruchsscanner fängt die Moleküle der Luft ein und scannt sie. Er funktioniert genauso wie Geruchsbooster-Cyberware (S. 285).
sensorfunction.ultrasound.desc=Der Ultraschallsensor besteht aus einem Emitter, der kontinuierlich Ultraschallimpulse ausstrahlt, und einem Empfänger, der die Echos der Impulse aufnimmt, um daraus eine topografische Ultraschallkarte zu erstellen. Ultraschall eignet sich hervorragend, um Oberflächenstrukturen zu erfassen, Entfernungen zwischen Objekten zu berechnen und Dinge wahrzunehmen, die für das nackte Auge unsichtbar sind (nimm das, Unsichtbarkeitszauber!). Der Sensor kann weder Farben noch Helligkeitsstufen unterscheiden, funktioniert dafür aber auch bei absoluter Dunkelheit. Er kann auch keine Materialien wie Glas durchdringen, die für optische Sensoren transparent sind. Man kann ihn in den passiven Modus schalten, sodass er keine Ultraschallimpulse emittiert, sondern nur Ultraschall aus anderen Quellen aufnimmt, wie etwa von Bewegungsmeldern oder anderen Ultraschallsensoren im aktiven Modus (oder von Fledermäusen).
licensetype.hunting.desc=Eine Lizenz für die Jagd.
licensetype.firearms.desc=Eine Lizenz, die das Führen und Verwenden von Feuerwaffen gestattet.
licensetype.cyberware.desc=Eine Lizenz, die den Besitz und die Verwendung von Cyberware gestattet.
licensetype.cyberdeck.desc=Eine Lizenz für den Besitz und die Verwendung eines Cyberdecks.
licensetype.rcc.desc=Eine Lizenz für Rigger-Remote-Konsolen.
licensetype.concealed_carry.desc=Lizenz f. d. verdeckte Tragen von Feuerwaffen
licensetype.spellcasting.desc=Lizenz für die Ausübung von Spruchzauberei.
licensetype.driver.desc=Die Lizenz zum Führen von Fahrzeugen.
focus.alchemical_focus.desc=Ein Alchemiefokus gewährt seine Kraftstufe als Würfelpoolbonus für Verzauberungsproben bei der Herstellung alchemistischer Erzeugnisse.
focus.disenchanting_focus.desc=Wenn ein Entzauberungsfokus mit einem zu entzaubernden Gegenstand in Kontakt gebracht wird, darf der Besitzer die Kraftstufe des Fokus als Würfelpoolbonus für die Entzauberungsprobe nutzen.
focus.centering_focus.desc=Ein Zentrierungsfokus addiert seine Kraftstufe zum Initiatengrad beim Einsatz der Metamagie Zentrierung für Entzugswiderstandsproben.
focus.flexible_signature_focus.desc=Ein Signaturschleier addiert seine Kraftstufe zum Initiatengrad beim Erhöhen des Schwellenwerts durch Flexible Signatur für die Askennenproben eines Beobachters.
focus.masking_focus.desc=Beim Widerstand gegen Askennenproben (Astral + Intuition) durch Maskierung wird die Kraftstufe des Fokus als Würfelpoolbonus verwendet. Die Anzahl an gebundenen Foki, die du maskieren kannst, steigt dadurch nicht.
focus.spell_shaping_focus.desc=Du darfst die Kraftstufe des Fokus zu deinem Magieattribut addieren, wenn bestimmt wird, wie stark du deine Zauber formen kannst.
focus.power_focus.desc=Kraftfoki sind sehr maächtige Foki. Ein Kraftfokus addiert seine Kraftstufe als Würfelpoolbonus zu allen Proben, an deren Würfelpool dein Magieattribut beteiligt ist. Kraftfoki ko?nnen beliebig aussehen, aber Ringe und Amulette sind aus irgendeinem Grund besonders beliebt.
focus.qi_focus.desc=Qi-Foki (ausgesprochen: „Tschie“) können nur von Adepten verwendet werden. Sie kanalisieren Mana in deine Adeptenkräfte. Ein Qi-Fokus kann ein Gegenstand sein wie andere Foki, kann aber auch als Körperschmuck (z. B. als Tätowierung, Piercing oder Schmucknarbe) ausgeführt sein. Jeder Qi-Fokus ist für eine Adeptenkraft mit einer bestimmten Stufe ausgelegt. Wenn der Fokus aktiviert wird, erhältst du die Kraft mit der entsprechenden Stufe, die darin gebannt ist. Wenn du diese Kraft bereits besitzt, wird die Kraft um die Stufe des Fokus erhöht. Wenn es um eine Kraft ohne Stufen geht, wird dabei natürlich nichts erhöht. Die Kraftstufe des Fokus muss viermal so hoch sein wie die Kosten an Kraftpunkten, die die Kraft kostet. Die Kraft Verbesserte Fertigkeit (Nahkampf) 1 würde also einen Fokus der Kraftstufe 4 benötigen (die Kraft kostet 1 Kraftpunkt pro Stufe). Ein Fokus mit Todeskralle wäre ein Fokus der Kraftstufe 2, denn diese Kraft kostet 0,5 Kraftpunkte.
focus.counterspelling_focus.desc=Ein Antimagiefokus addiert bei allen Proben zum Zwecke des Bannens von Zaubern seine Kraftstufe als Würfelpoolbonus, sofern der zu bannende Zauber der Kategorie des Fokus entspricht. Außerdem gilt die Kraftstufe des Fokus als Würfelpoolbonus, wenn du Zauberabwehr (S. 145) einsetzt
focus.spellcasting_focus.desc=Ein Zauberspruchfokus addiert seine Kraftstufe als Würfelpoolbonus bei Proben für Spruchzauberei, wenn der Zauber zur richtigen Kategorie gehört.
focus.ritualspellcasting_focus.desc=Ein Ritualfokus addiert seine Kraftstufe als Würfelpoolbonus bei Proben für Ritualzauberei (sowohl als Ritualleiter als auch als Teilnehmer). Wenn das Ritual keinen Zauberanteil hat, kann der Fokus trotzdem genutzt werden, aber nicht, wenn das Ritual einen Zauber einer anderen Kategorie enthält.
focus.sustaining_focus.desc=Wenn du einen Zauber durch einen Zauberspeicher wirkst, kann der Fokus ihn für dich aufrechterhalten, wodurch du den Würfelpoolmalus dafür umgehen kannst. Ein Zauber, der aufrechterhalten werden soll, darf keinen höheren modifizierten Entzugswert (nach Anpassungen) als die Kraftstufe des Fokus haben, und die Kategorien von Fokus und Zauber müssen übereinstimmen. Wenn der Zauber, den der Fokus aufrechterhält, (zum Beispiel durch Antimagie) endet, bleibt der Fokus weiter aktiv und an seinen Besitzer gebunden, erhält aber keinen Zauber mehr aufrecht. Ein Zauberspeicher kann keine Ritualzauber aufrechterhalten. 
focus.summoning_focus.desc=Ein Herbeirufungsfokus addiert bei Proben für das Herbeirufen seine Kraftstufe als Würfelpoolbonus, wenn die Art des Geistes zum Fokus passt.
focus.banishing_focus.desc=Ein Verbannungsfokus addiert bei Proben zum Verbannen eines Geistes seine Kraftstufe als Würfelpoolbonus, wenn die Art des Geistes zum Fokus passt.
focus.weapon_focus.desc=Ein Waffenfokus hat, wenig überraschend, die Form einer Nahkampfwaffe (er kann keine Fernkampfwaffe sein). Er unterstützt mit seiner Macht die Nahkampfangriffe, die du damit durchführst. Beim Einsatz als Waffe im Nahkampf addiert er seine Kraftstufe als Würfelpoolbonus bei Angriffsproben. Du kämpfst immer noch mit deinen körperlichen Attributen und Fertigkeiten, der Waffenfokus macht dich nur effektiver dabei.\n Ein Waffenfokus ist auch gegen astrale Gestalten effektiv - sowohl mit astraler Wahrnehmung als auch mit astraler Projektion. Seine Kraftstufe wird als Würfelpoolbonus zu Proben im Astralkampf addiert, wenn du ihn benutzt. In aktiviertem Zustand kannst du ihn auch auf die Astralebene mitnehmen. Der Schaden ist beim Astralkampf genauso hoch wie beim Kampf auf der physischen Ebene, nur dass du wählen kannst, ob du Körperlichen oder Betäubungsschaden verursachen willst (s. Astralkampf, S. 162).
item.yamaha_pulsar_2_club.desc=Nahkampfkontakte am unteren Griffende der Yamaha Pulsar II, die einen Nahkampfangriff wie mit einem Knüppel erlauben.
item.ammo_machine_gun.desc=Muntion für Maschinengewehre
item.ammo_dmso.desc=DMSO-Munition
item.ammo_injection_bolt.desc=Der Injektionspfeil oder -bolzen verursacht seinen Basisschaden und injiziert gleichzeitig eine Dosis des enthaltenen Medikaments oder Giftes. Ein erfolgreicher Treffer muss mindestens ein Kästchen Schaden (nach der Schadenswiderstandsprobe) verursachen. Injektionspfeile und -bolzen haben üblicherweise eine Stufe von 8. Höherstufige Modelle sind für schwerere Bögen erhältlich, aber Pfeile oder Bolzen mit geringerer Stufe sind nicht stabil genug, um die schwere Nutzlast zuverlässig ins Ziel zu bringen.
item.ammo_bolt.desc=Bolzen
item.stealth_auto.desc=Dient als spezielle Heimlichkeit-Fertigkeit für den jeweiligen Drohnentyp. Attribut: Pilot
item.tear_gas.desc=CS-Gas ist ein Reizstoff, der Augen, Haut und Schleimhäute beeinträchtigt und zu Brennen und Flüssigkeitsabsonderung führt. Es stimuliert auch eine psychologische Panikreaktion: erhöhter Puls, Kurzatmigkeit und so weiter. Ein gründliches Waschen mit Wasser und Seife kann CS von der Haut eines Opfers entfernen und damit die Übelkeit vorzeitig beenden. CS-Gas wird bei Kontakt mit der Luft nach zwei Minuten wirkungslos.
item.gamma_scopolamine.desc=Dieser besonders üble Kampfstoff wird aus der Tollkirsche gewonnen und ist ein neuromuskulärer Hemmstoff, der das Opfer lähmt. Das Toxin wirkt sofort und verursacht Schwindel, geweitete Pupillen, Sprachverlust, Delirium und Lähmung. Die volle Wirkung hält für ungefähr eine Stunde an. Wenn die Primärwirkung endet, wirken die Reste im Blutkreislauf des Opfers eine weitere Stunde lang als „Wahrheitsserum“. Die Willenskraft des Opfers ist bis zum Ende der Wirkungsdauer des Toxins um 3 (bis zu einem Minimum von 1) gesenkt.
item.narcoject.desc=Dieser weit verbreitete Tranquilizer wird meistens in Pfeilgewehren benutzt. Das Toxin hat keine anderen Wirkungen.
item.nausea_gas.desc=Dieses Gas wird zur Aufstandskontrolle eingesetzt und verursacht Übelkeit und einen Brechreiz bis zur Kampfunfähigkeit. Brechreiz-Gas wird bei Kontakt mit der Luft nach zwei Minuten wirkungslos.
item.neuro_stun_viii.desc=Neuro-Stun ist farb- und geruchlos. Es ist der Goldstandard der K.o.-Gase für Notsituationen und ist in unterschiedlichen Stärken erhältlich. Neuro-Stun VIII wird bei Kontakt mit der Luft nach zehn Minuten wirkungslos, Neuro-Stun IX und X nach einer Minute.
item.neuro_stun_ix.desc=Neuro-Stun ist farb- und geruchlos. Es ist der Goldstandard der K.o.-Gase für Notsituationen und ist in unterschiedlichen Stärken erhältlich. Neuro-Stun VIII wird bei Kontakt mit der Luft nach zehn Minuten wirkungslos, Neuro-Stun IX und X nach einer Minute.
item.neuro_stun_x.desc=Neuro-Stun ist farb- und geruchlos. Es ist der Goldstandard der K.o.-Gase für Notsituationen und ist in unterschiedlichen Stärken erhältlich. Neuro-Stun VIII wird bei Kontakt mit der Luft nach zehn Minuten wirkungslos, Neuro-Stun IX und X nach einer Minute.
item.pepper-punch.desc=Pepper Punch ist ein Reizstoff, der CS, Capsaicin (das aus Chili gewonnen wird) und andere Chemikalien kombiniert. Er wird meistens als flüssiges Spray zur Selbstverteidigung und Abschreckung eingesetzt. Die Substanz wird oft mit RFID-Chips oder Spezialfarben versetzt, um später ihre Opfer identifizieren zu können. Jemand, der von Pepper Punch getroffen wird, verspürt ein intensives Brennen auf Hautstellen, die damit in Kontakt kommen. In Augen, Nase oder Mund ist diese Wirkung noch stärker. Opfer, denen die Substanz in die Augen gesprüht wird, haben Probleme mit dem Sehen, und das Atmen wird erschwert.
item.seven_7.desc=Ein weiteres farb- und geruchloses Gas, das speziell darauf ausgelegt ist, chemische Schutzmaßnahmen zu umgehen. Neben dem Körperlichen Schaden verursacht Seven-7 Krämpfe, Übelkeit und Doppelbilder bei seinen Opfern. Seven-7 oxidiert und wird nach Kontakt mit der Luft nach zehn Minuten wirkungslos.
item.alcohol.desc=Alkohol in seinen verschiedenen Formen von Wein oder Bier bis hin zu Schnaps und Bränden oder verschiedenen wohlschmeckenden Mixgetränken wird in aller Welt konsumiert. Heutzutage handelt es sich meistens um Synthahol, der synthetisch hergestellt wird, weil Fermentierung und Destillation Zeit und damit Nuyen kosten.
item.bliss.desc=Bliss ist ein beruhigendes Opiat, das aus Schlafmohn gewonnen und synthetisiert wird. Es hat seinen Namen von der euphorisierenden Wirkung, die Konsumenten verspüren. Wenn du als Spieler einen Bliss-Konsumenten darstellen willst, konzentriere dich auf die Entrücktheit, weil die Droge dazu dient, die chaotische, unbefriedigende Welt auszusperren.
item.cram.desc=Cram ist ein höchst populäres Stimulans. Wenn die Wirkung endet, bricht der Konsument zusammen und erleidet 6B Schaden (ohne Widerstandsprobe). Cram-Konsumenten sind übermäßig wachsam - fast bis hin zur Paranoia. Sie reagieren schnell, oft ohne nachzudenken, und neigen zu irrationalen Ausbrüchen. Andere häufige Nebenwirkungen sind Nervosität und Zappeligkeit.
item.deepweed.desc=Deepweed ist ein Narkotikum, das von karibischen Houngans aus einer Erwachten Art von Tang hergestellt wird. Es ist für Erwachte extrem verlockend und wird manchmal eingesetzt, um Ziele für Besessenheit vorzubereiten. Deepweed zwingt jeden magisch aktiven Konsumenten zur astralen Wahrnehmung, selbst wenn dieser ein Adept ist, der diese Fähigkeit nicht gelernt hat. Wenn die Wirkung endet, erhalten Deepweed-Konsumenten einen Malus von -1 auf alle Würfelpools, der so lange anhält, wie die Wirkung angehalten hatte. Erzwungene astrale Wahrnehmung birgt Gefahren, wie das Erwecken unerwünschter Aufmerksamkeit. Im Rollenspiel könnte die Wirkung von Deepweed am ehesten dargestellt werden, indem dein Charakter „nicht ganz hier ist“, weil er das auch nicht ist.
item.jazz.desc=Jazz ist ein Stimulans, das entworfen wurde, um gewöhnlichen Polizisten bessere Chancen gegen modifizierte Straßensamurai zu geben. Meistens wird es durch einen Einweg-Inhalator (oder „Popper“) verabreicht. Wenn die Wirkung von Jazz endet, bricht der Konsument zusammen, wird von bedrückenden und traurigen Emotionen überwältigt und erhält den Status Benommen (S. 53), der ebenso lange anhält, wie die Wirkung der Droge gedauerthat. Jazz macht Konsumenten so unruhig und hyperaktiv wie Zweijährige voller Koffein. Im Rollenspiel eines Jazz-Konsumenten kannst du den Charakter hektisch und mit zu viel Energie darstellen - zu viel Energie, um sie zu verbrauchen, zu viel, um sich zu konzentrieren.
item.kamikaze.desc=Kamikaze ist ein maßgeschneidertes Kampf-Stimulans. Wenn die Wirkung von Kamikaze endet, bricht der Konsument zusammen und erhält für die doppelte Zeitspanne der Wirkungsdauer Reaktion -1, Willenskraft -1 und den Status Erschöpft II. Außerdem erleidet er 6B Schaden (ohne Widerstandsprobe).\nWiederholter Konsum von Kamikaze hat schädliche Auswirkungen auf den Metabolismus eines Konsumenten. Große Dosen können Erregtheit, Zittern, plötzliche Euphorie und geweitete Pupillen verursachen. ExzessiveDosen (die bis an die Grenzen einer Überdosis gehen) verursachen Angst, Halluzinationen und unkontrollierte Muskelzuckungen. Noch höhere Dosen führen zum Tod. Kamikaze-Konsumenten sind fast völlig durchgeknallt, voll eines Gefühls der Unantastbarkeit und Unbesiegbarkeit, und kümmern sich fast gar nicht um die eigene Sicherheit. Es kann unterhaltsam sein, sie zu beobachten, solange man ihnen nicht gegenübersteht.
item.long_haul.desc=Long Haul ist eine Kombination aus synthetischen Hormonen und anderen hirnregulierenden Chemikalien, stimuliert das Gehirn und hält den Konsumenten wach, indem das Schlafbedürfnis umgangen wird. Ein Charakter unter dem Einfluss von Long Haul kann vier Tage lang wach bleiben, ohne unter Malus durch Erschöpfung oder Schwäche zu leiden. Nach dieser Zeitspanne wird er allerdings sofort ohnmächtig und schläft 8W6 Stunden lang tief und fest. Wenn der Charakter in dieser Zeit wach gehalten wird, leidet er unter dem Status Erschöpft I (S. 54), weil er Halluzinationen und Konzentrationsstörungen erlebt. Wenn eine zweite Dosis genommen wird, nachdem die erste zu wirken aufgehört hat, kann der Charakter weitere [1W6 ÷ 2] Tage wach bleiben, erhält dabei aber den Status Erschöpft I. Eine dritte Dosis sorgt für einen einzigen Tag des Wachseins und dabei für den Status Erschöpft II. Eine vierte Dosis ergibt noch einen Tag und den Status Erschöpft III. Danach haben zusätzliche Dosen keine weitere Wirkung, und der Konsument erleidet 12B Schaden (ohne Widerstandsprobe), wird wie oben beschrieben ohnmächtig und schläft. Long Haul kann einen Charakter nicht über diesen Punkt hinaus wach halten, egal, wie viele Dosen er bekommt. Wenn er durch ein Stim-Patch erzwungen wach bleibt, bleibt der Status Erschöpft III bestehen, bis die 8W6 Stunden Ruhe (oder eher Koma) durchgemacht wurden.
item.nitro.desc=Diese gefährliche Kombination starker Drogen wird von Troll-Gangern bevorzugt und ist ein hoch wirksames Stimulans, das einen Konsumenten leicht töten kann. Nachdem die Wirkung der Droge endet, erleidet der Charakter 9B Schaden (ohne Widerstandsprobe) und so lange, wie die Droge gewirkt hatte, einen Würfelpoolmalus von -2 auf alle Proben (auch Schadenswiderstandsproben). Nitro-Konsumenten fühlen sich voller Energie, haben eine verminderte Aufmerksamkeitsspanne und reden ununterbrochen (auch mit sich selbst).
item.nova_coke.desc=Das Stimulans Novacoke wird aus Kokapflanzen gewonnen und ist eine höchst suchterzeugende Freizeitdroge. Nach dem Ende der Wirkung werden Charisma und Willenskraft für eine Zeitdauer, die der ursprünglichen Wirkungsdauer entspricht, auf 0 gesenkt.
item.psyche.desc=Diese Designerdroge wird vor allem von Zauberern und Technomancern geschätzt. Neben der oben beschriebenen Wirkung wird bei Erwachten und Digital Erwachten der Würfelpoolmalus für das Aufrechterhalten von Zaubern bzw. Komplexen Formen auf -1 (statt der üblichen -2) gesenkt. Psyche-Konsumenten sind zugleich extrem aufmerksam und entrückt, verlieren sich leicht in Details und widmen sich zwanghaft bestimmten Tatsachen oder Problemen.
item.zen.desc=Zen ist ein psychedelisches Halluzinogen und sehr beliebt bei Leuten, die der Realität entfliehen oder einen tranceartigen Zustand erleben wollen. Während eines Runs ist es nicht besonders nützlich, es sei denn, man verpasst seinen Gegnern eine Dosis davon. 

itemmod.smartgun_system_internal.desc=Dieses System ist die waffenseitige Ergänzung zum Smartlink eines Charakters. Das System enthält eine kleine Kamera und einen Entfernungsmesser. Es überwacht den Munitionsstand und ermöglicht es, mittels eines DNI zwischen den Feuermodi einer Waffe umzuschalten, ein Magazin auszuwerfen und die Waffe abzufeuern, ohne den Abzug zu drücken. Dank der Kamera ist das Feuern aus Deckung möglich, ohne dass für Angriffe aus der Deckung (Status Deckung) eine Nebenhandlung ausgegeben werden muss. Benutzt der Charakter ein Smartlink, erhöht das Smartgunsystem die Angriffswerte der Waffe für alle verfügbaren Reichweiten um 2. Auf die Smartguneigenschaften greift man entweder mit einem Datenkabel zu, das mit einem Sichtgerät (einer Brille oder \u2013 wenn man Cyberaugen hat \u2013 einer Datenbuchse) verbunden ist, oder über eine WiFi-Verbindung, die mit einem direkten Neuralinterface zusammenarbeitet. Die kleine Kamera hat eine Kapazität von 1 und kann mit Sichtverstärkungen (S. 448) ausgerüstet werden. Das externe Smartgun System findet sich bei "Einbauten".