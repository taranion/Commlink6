item.erika_mcd6.desc=Als die Konzerne die Matrix neu einrichteten und alles daransetzten, illegale Nutzungsmöglichkeiten ihres schönen neuen Systems zu verhindern, erlebte das Cyberdeck seine Wiederauferstehung als Werkzeug der Wahl, um sich an den Innereien der Matrix zu schaffen zu machen.\nIn den Händen eines talentierten Deckers ist ein Cyberdeck eine mächtige Waffe. Die neuesten Modelle sehen ein bisschen aus wie mittelalterliche Armschützer, nur weniger klobig. Sie werden am Handgelenk getragen und können Tastaturen (oder was auch immer für ein Interface der User bevorzugt) auf den Arm des Users, irgendeine Oberfläche in der Nähe oder einfach nur in die Luft projizieren.\nEinige Modelle haben Monitore, die meisten nicht. Oft sehen sie aus wie ein unscheinbarer Geräteblock mit mehreren Anschlüssen, obwohl sich viele Decker drahtlos mit ihrem Deck verbinden. Weitere Informationen dazu findest du unter Geräte auf Seite 174.\nAlle Cyberdecks enthalten Sim-Module für heißes Sim.
