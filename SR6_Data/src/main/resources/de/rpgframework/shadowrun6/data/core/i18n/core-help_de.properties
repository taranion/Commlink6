skill.astral.desc=Diese Fertigkeit kann nur von Voll- und Aspektzauberern sowie von Adepten und Magieradepten, die die Adeptenkraft Astrale Wahrnehmung beherrschen, eingesetzt werden. Sie verfügt über zwei hauptsächliche Einsatzgebiete - zum einen das Askennen astraler Auren (siehe S. 161), zum anderen den Astralkampf (siehe S. 162).
skill.athletics.desc=Die Fertigkeit Athletik umfasst alles, was mit körperlicher Leistungsfähigkeit und Anmut zu tun hat. Als vielseitig verwendbare Fertigkeit kann Athletik auf unterschiedliche Art und Weise eingesetzt werden. Sie kommt bei Sprinten-Proben (S. 45) und beim Ausweichen (S. 42) zum Einsatz und ist im Fall von Projektil- und Wurfwaffen auch eine Angriffsfertigkeit. Meist werden Athletikproben mit dem Attribut Geschicklichkeit abgelegt, um flüssige Bewegungsabläufe abzubilden. Bei Proben, bei denen eher schiere Muskelkraft gefragt ist, kann als verknüpftes Attribut auch Stärke verwendet werden. Athletikproben sind meist Einfache Proben. Athletik wird auch zum Springen verwendet. Pro Erfolg bei einer Probe auf Athletik + Geschicklichkeit springt man aus dem Stand 1 Meter, mit Anlauf 2 Meter weit, maximal aber [Geschicklichkeit × 1,5] Meter weit. Mit derselben Probe springt man pro Erfolg 0,5 Meter hoch, maximal aber [Körpergröße × 1,5] Meter hoch. Auch Tauchen und freier Fall werden durch diese Fertigkeit abgedeckt.
skill.biotech.desc=Diese Fertigkeit ist das Einsatzgebiet aller Charaktere, die in der metamenschlichen Biologie versiert sind. In der Sechsten Welt gehen damit auch Kenntnisse über die Wechselwirkungen zwischen dieser Biologie und verschiedenen Bodytech-Implantaten und Ausrüstungsgegenständen einher. Die Fertigkeit Biotech kommt bei Erste Hilfe und sonstigen Heilungsproben (S. 122) zum Einsatz, kann aber auch bei der Untersuchung und Reparatur von Cyberware, Bioware und anderer Bodytech verwendet werden. Außerdem kann diese Fertigkeit genutzt werden, um Cyberware - aber keine anderen Arten von Bodytech - zu implantieren.\nAbseits der Ersten Hilfe oder Heilung ist Biotech in der Regel eine Einfache Probe, bei der der Charakter auf Biotech + Logik würfelt und auf Basis der erzielten Nettoerfolge Erkenntnisse gewinnt oder eine Reparatur durchführt. 
skill.close_combat.desc=Stehst du direkt neben jemandem? Versuchst du, ihm wehzutun? Dann nutze diese Fertigkeit! Egal, ob du schlägst, stichst, knüppelst oder eine andere Variante wählst, du legst eine Vergleichende Probe auf Nahkampf + Geschicklichkeit gegen Reaktion + Intuition ab.\nGenauere Informationen zum Kampf findest du im Kapitel Kampf auf Seite 107.
skill.con.desc=Der Schlüssel zu dieser Fertigkeit ist Überzeugungskraft, denn beim Überreden geht es darum, sich als jemand oder etwas auszugeben, der oder das man nicht ist. Vielleicht willst du jemanden glauben machen, dass du der lange verschollene Erbe eines Teils von Dunkelzahns Hort bist; vielleicht tust du auch so, als wärst du ein vom Pech verfolgter Anzugträger, der es mit einem großen Coup wieder zurück an die Spitze schaffen will. Aber ganz egal, wie genau das Szenario aussieht: Überreden ist die Fertigkeit, die zum Einsatz kommt, wenn du andere davon überzeugen willst, dir deine Rolle abzunehmen.
skill.conjuring.desc=Diese Fertigkeit erlaubt das Herbeirufen und Verbannen von Geistern. Für weitere Informationen siehe Beschwören, S. 148.
skill.cracking.desc=In der Matrix hat man grundsätzlich die Wahl zwischen zwei Arten von Aktivitäten: legalen und illegalen. Cracken kommt immer dann zum Einsatz, wenn es um die illegalen Aktivitäten geht. Genaue Informationen zum Einsatz von Cracken findest du im Kapitel Matrix auf Seite 176.
skill.electronics.desc=Diese Fertigkeit kommt bei der legalen Seite der Matrixaktivitäten zum Einsatz. Egal, ob du ein Kommlink oder einen Computer benutzt, mit einem schnellen, nicht unbedingt eleganten Fix ein Programm wieder zum Laufen bringst, deine Hardware frisierst oder andere ähnliche Tätigkeiten ausführst - Elektronik ist die passende Fertigkeit. Weitere Informationen zum Einsatz von Elektronik findest du im Kapitel Matrix auf Seite 176. 
skill.enchanting.desc=Verzaubern wird genutzt, um alchemistische Erzeugnisse, Foki, Fetische und andere magische Gegenstände herzustellen - und bisweilen auch, um sie zu zerstören. Weitere Informationen dazu findest du im Abschnitt Verzaubern im Kapitel Magie auf Seite 151.
skill.engineering.desc=Bei Mechanik geht es darum, Gegenstände dazu zu bringen, dass sie tun, was du willst - Autos sollen fahren, Flugzeuge fliegen, Boote schwimmen, Maschinen sollen anspringen und rattern und das tun, wofür sie gebaut wurden, und Waffen sollen gefälligst ihren Zweck erfüllen. Wie sich aus den Spezialisierungen erkennen lässt, werden mit dieser Fertigkeit teils sehr breite Themengebiete abgedeckt, aber im Grunde beschäftigt sich Mechanik mit vier grundlegenden Tätigkeiten: Bauen, Reparieren, Improvisieren und dem Einsatz fahrzeugmontierter Geschütze (s. hierzu den Abschnitt Fahrzeugkampf, S. 200). 
skill.exotic_weapons.desc=Einige Waffen sind komplett anders als alle anderen, und es ist spezielles Training nötig, um sie einsetzen zu können. Die Fertigkeit Exotische Waffen bildet den Umgang mit derartigen Waffen ab. Damit diese Fertigkeit eingesetzt werden kann, muss eine Spezialisierung gewählt werden. Du kannst diese Fertigkeit nur dann einsetzen, wenn du auch über die passende Spezialisierung für die jeweilige Waffenart verfügst. Für diese Fertigkeit kann keine Expertise erworben werden. Du kannst diese Fertigkeit jedoch wie gewohnt steigern, und der entsprechende Wert gilt dann für alle deine Spezialisierungen. Diese Fertigkeit ist eine Ausnahme von der Regel, dass pro Fertigkeit immer nur eine Spezialisierung erlaubt ist.
skill.firearms.desc=Du willst auf irgendetwas schießen? Dann ist eine Probe auf diese Fertigkeit fällig. Grundsätzlich legst du eine Probe auf Feuerwaffen + Geschicklichkeit gegen Reaktion + Intuition des Gegners ab. Alle weiteren Details findest du im Kapitel Kampf auf Seite 107.
skill.influence.desc=Diese Fertigkeit ist neben Überreden die zweite Möglichkeit, die Meinung anderer Leute zu beeinflussen. Man könnte sagen, dass Einfluss die „ehrlicheren“ Varianten dieses Vorhabens in sich vereint, aber das würde vielen aufrechten Betrügern unrecht tun und die Integrität von Verhandlungsführern aus der Wirtschaftswelt weit über ihren Scheffel stellen. Letztlich gilt: Wann immer du versuchst, deinen Runnerkollegen Mut zu machen, Mr Johnson noch ein paar Nuyen mehr abzuluchsen oder jemandem unmissverständlich klarzumachen, dass er dir besser nicht in die Quere kommen sollte, wenn er nicht ganz neue Dimensionen von Schmerz kennenlernen möchte, dann ist Einfluss die richtige Fertigkeit. 
skill.outdoors.desc=Es gibt schlechtere Dinge, als die eigenen vier Wände nie zu verlassen, vor dem Trideo zu sitzen und WhompSnappers in sich hineinzustopfen, aber manchmal lassen sich Ausflüge in die Außenwelt nicht vermeiden. Für diese Gelegenheiten gibt es die Fertigkeit Natur. Sie kommt zum Einsatz, wenn du einer Spur folgst, Nahrung auftreiben willst oder den kürzesten Weg zu deinem Ziel finden möchtest. Normalweise werden Naturproben als Einfache Probe auf Natur + Intuition abgelegt. Der Schwellenwert wird mithilfe der Richtlinien für Schwellenwerte (S. 37) festgelegt. Alternativ kann der Schwellenwert für Spurenlesenproben auch anhand der Anstrengungen bestimmt werden, die beim Verbergen der Spuren unternommen wurden.
skill.perception.desc=Schleicht da vorne jemand durch den Smog? Ist im Schreibtisch dieses Execs ein Geheimfach verborgen? Wo ist der Lichtschalter? Dies sind Beispiele für Fragen, die sich mit einer Wahrnehmungsprobe beantworten lassen. Wenn der Zweck der Probe eine genaue Untersuchung der Umgebung ist, wird eine Einfache Probe auf Wahrnehmung + Intuition abgelegt. Den Schwellenwert legt der Spielleiter in Abhängigkeit davon fest, wie schwer das Gesuchte zu entdecken ist (Beispielwerte findest du in der Tabelle Schwellenwerte für Wahrnehmungsproben). Wahrnehmung kommt außerdem immer dann zum Einsatz, wenn man jemanden entdecken möchte, der nicht gesehen werden will. 
skill.piloting.desc=Steuern kommt immer dann zum Einsatz, wenn ein Charakter ein anspruchsvolles Manöver mit einem Fahrzeug durchführen möchte (und ist deshalb eine essenzielle Fähigkeit für alle Rigger). Generell sind Steuernproben Einfache Proben auf Steuern + Reaktion. Der Schwellenwert ist im Regelfall gleich dem Handlingwert des gesteuerten Fahrzeugs, kann aber in Abhängigkeit von der Komplexität des jeweiligen Manövers auch höher sein (Spielleiterentscheid). Manchmal werden Steuernproben auch eingesetzt, um Verfolger abzuschütteln, jemanden zu verfolgen oder andere Aktionen abzuhandeln, die mehr als ein Fahrzeug betreffen. 
skill.sorcery.desc=Die Anwendungsmöglichkeiten der Fertigkeit Hexerei sind vielfältig - zu vielfältig, um sie hier abdecken zu können. Im Kapitel Magie findest du genauere Informationen zu Zaubern (S. 133), Antimagie (S. 145) und anderen Einsatzgebieten.
skill.stealth.desc=Wie der Name schon sagt, sollten Shadowrunner möglichst auf Unauffälligkeit bedacht sein. Das macht Heimlichkeit zu einer sehr wertvollen Fertigkeit. Sie deckt alle Aktivitäten ab, die Charaktere unbemerkt von anderen durchführen möchten: Wenn du in eine Forschungsanlage einbrechen oder einem Mafia-Don einen Credstick unter der Nase wegstehlen möchtest, dann kommt Heimlichkeit zum Einsatz. In der Regel wird zu Beginn eines solchen Unterfangens eine Probe auf Heimlichkeit + Geschicklichkeit abgelegt. Die dabei erzielten Erfolge bestimmen den Schwellenwert für andere, die bemerken wollen, was der Charakter im Schilde führt. Manchmal versucht ein Charakter auch spontan, sich möglichst heimlich zu verhalten. In diesem Fall wird eine Vergleichende Probe auf Heimlichkeit + Geschicklichkeit gegen Wahrnehmung + Intuition abgelegt.
skill.tasking.desc=Diese Fertigkeit wird von Technomancern für ihre Technomanceraktivitäten verwendet. Weitere Informationen dazu findest du im Abschnitt Technomancer auf Seite 188.
skill.knowledge.desc=Da auf Wissensfertigkeiten keine direkten Fertigkeitsproben abgelegt werden, verfügen sie nicht über Fertigkeitswerte. Stattdessen kommen sie zum Einsatz, wenn ein Charakter die Chance hat, im Zuge anderer Proben zusätzliche Informationen zu erhalten. Verfügt ein Charakter beispielsweise über die Wissensfertigkeit Sicherheitssysteme und legt dann eine Wahrnehmungsprobe ab, um den Außenbereich einer Konzernanlage genauer unter die Lupe zu nehmen, dann kann er mit dieser Probe vielleicht erkennen, wo sich Kameras befinden und wann Streifen vorbeikommen. Wenn ein Charakter die Wissensfertigkeit Seattler Gangs besitzt, wird ihm eine erfolgreiche Wahrnehmungsprobe vielleicht verraten, dass die Personen, die sich ihm gerade nähern, Mitglieder der Gang der Halloweeners sind. Die Wissensfertigkeit Straßen von Seattle könnte sich bei Naturproben im Raum Seattle als hilfreich erweisen. Die Spieler können zudem Proben auf Erinnerungsvermögen (S. 37) ablegen, um sich an bestimmte Fakten aus Themengebieten zu erinnern, die durch ihre Wissensfertigkeiten abgedeckt sind.\nGrundsätzlich dürfen Wissensfertigkeiten nicht ungeübt eingesetzt werden.
skill.language.desc=Die Sechste Welt ist die Heimat einer Vielzahl von Sprachen. Alle Sprachen, die wir aus unserer Welt kennen, existieren auch weiterhin, aber dazu kommen noch einige neue, beispielsweise Sperethiel, die Sprache der Elfen, Or’zet, die Sprache der Orks, und Stadtsprech, die Sprache der Straßen. Zu wissen, welche Sprache man wählen muss, kann entscheidend sein, wenn man jemandem eine geheime Information entlocken oder eine gute Beziehung zu einer wichtigen Connection aufbauen möchte.\nSprachfertigkeiten sind Wissensfertigkeiten mit Spezialisierungsstufen.
spell.acid_stream.desc=Dieser Zauber schießt Säure auf ein Ziel ab und verursacht Chemischen Schaden (S. 112). Das Ziel erhält den Status Verätzt (S. 55) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.toxic_wave.desc=Dieser Zauber ist die Flächenversion von Säurestrahl. Dieser Zauber schießt Säure auf ein Ziel ab und verursacht Chemischen Schaden (S. 112). Das Ziel erhält den Status Verätzt (S. 55) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.clout.desc=Ein kniffliger kleiner Zauber: Die Magie trifft nicht das Ziel, sondern verursacht plötzlichen Luftdruck in dessen Richtung. Die Macht des Windes, Bäume auszureißen, wird eindrucksvoll am Kopf des Ziels vorgeführt. 
spell.blast.desc=Dieser Zauber ist die Flächenversion von Stoß (S. 139). Ein kniffliger kleiner Zauber: Die Magie trifft nicht das Ziel, sondern verursacht plötzlichen Luftdruck in dessen Richtung. Die Macht des Windes, Bäume auszureißen, wird eindrucksvoll am Kopf des Ziels vorgeführt. 
spell.flamestrike.desc=Ein Klassiker. Wenn man daran denkt, Leuten mit Magie wehzutun, fällt einem als Erstes ein, ihnen Feuer ins Gesicht zu schleudern. Dies ist der Zauber, der das möglich macht. Flammenstoß verursacht Feuerschaden (S. 112). Das Ziel erhält den Status Brennend (S. 53) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.fireball.desc=Dieser Zauber ist die Flächenversion von Flammenstoß. Ein Klassiker. Wenn man daran denkt, Leuten mit Magie wehzutun, fällt einem als Erstes ein, ihnen Feuer ins Gesicht zu schleudern. Dies ist der Zauber, der das möglich macht. Feuerball verursacht Feuerschaden (S. 112). Das Ziel erhält den Status Brennend (S. 53) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.ice_spear.desc=Wenn so langsam alle Konzernsicherheitsschergen, denen man begegnet, brandhemmende Unterwäsche tragen, wird es Zeit für andere Mittel - und dafür, sie mit dem anderen Temperaturextrem anzugreifen. Dieser Zauber trifft seine Ziele mit Eiseskälte und verursacht Kälteschaden (S. 113).
spell.ice_storm.desc=Dieser Zauber ist die Flächenversion von Eisspeer. Wenn so langsam alle Konzernsicherheitsschergen, denen man begegnet, brandhemmende Unterwäsche tragen, wird es Zeit für andere Mittel - und dafür, sie mit dem anderen Temperaturextrem anzugreifen. Dieser Zauber trifft seine Ziele mit Eiseskälte und verursacht Kälteschaden (S. 113).
spell.lightning_bolt.desc=So haben Gottheiten von Zeus bis Thor die Unbotmäßigen zerschmettert, also sollte das auch für dich gut genug sein. Blitzstrahl trifft ein einzelnes Ziel mit Elektrizität. Der Zauber verursacht Elektrizitätsschaden (S. 112).
spell.lightning_ball.desc=Dieser Zauber ist die Flächenversion von Blitzstrahl (S. 138). So haben Gottheiten von Zeus bis Thor die Unbotmäßigen zerschmettert, also sollte das auch für dich gut genug sein. Blitzstrahl trifft ein einzelnes Ziel mit Elektrizität. Der Zauber verursacht Elektrizitätsschaden (S. 112).
spell.manabolt.desc=Eine grundlegende Technik der Spruchzauberei: Man benutzt Mana, um Schädel einzuschlagen. Wer könnte etwas gegen diese reine Eleganz sagen?
spell.manaball.desc=Dieser Zauber ist die Flächenversion von Manablitz. Eine grundlegende Technik der Spruchzauberei: Man benutzt Mana, um Schädel einzuschlagen. Wer könnte etwas gegen diese reine Eleganz sagen?
spell.powerbolt.desc=Energieblitz ist die härtere Version von Betäubungsblitz und trifft ein einzelnes Ziel mit Körperlichem Schaden.
spell.powerball.desc=Dieser Zauber ist die Flächenversion von Energieblitz. Energieblitz ist die härtere Version von Betäubungsblitz und trifft ein einzelnes Ziel mit Körperlichem Schaden.
spell.stunbolt.desc=Manchmal will man ein wenig Tempo rausnehmen und den Gegner überraschen. Dieser Zauber kanalisiert Mana, um jemandem wehzutun, aber nur zur Betäubung.
spell.stunball.desc=Dieser Zauber ist die Flächenversion von Betäubungsblitz. Manchmal will man ein wenig Tempo rausnehmen und den Gegner überraschen. Dieser Zauber kanalisiert Mana, um jemandem wehzutun, aber nur zur Betäubung.
spell.analyze_device.desc=Natürlich weißt du, wie ein Kommlink aussieht, aber das heißt nicht, dass du die Funktion der seltsamen schwarzen Box mit der einzelnen Buchse identifizieren kannst. Und die Geister mögen dir beistehen, wenn es um eine Maschine aus den 50ern oder Ähnliches geht. Gerät Analysieren verschafft dir, basierend auf den Nettoerfolgen (gegen den Objektwiderstand), Informationen über das unbekannte Gerät. Wenn ein Charakter ein Gerät zum ersten Mal benutzt, während dieser Zauber aufrechterhalten wird, erhält er Edge in Höhe der Anzahl der Nettoerfolge bei der Hexereiprobe (wobei natürlich die übliche Grenze von höchstens 2 Edge pro Kampfrunde gilt).
spell.analyze_magic.desc=Manchmal will man wissen, was ein bestimmter magischer Vorgang bewirkt, ohne die Astralebene zu nutzen. Dieser Zauber bietet dieselben Informationen wie das Askennen (siehe S. 161), nur dass man dazu nicht astral wahrzunehmen braucht. Bei der Vergleichenden Probe für diesen Zauber kommt als Würfelpool der Gegenseite die doppelte Anzahl der Erfolge (nicht Nettoerfolge) bei der ursprünglichen Probe (Beschwören, Verzaubern oder Hexerei) zum Einsatz, die den zu analysierenden magischen Effekt erschaffen hat.
spell.analyze_truth.desc=Der Beobachter erhält ein Gespür dafür, ob ein Ziel die Wahrheit sagt - oder wenigstens glaubt, die Wahrheit zu sagen. Mit mindestens 1 Nettoerfolg wird diese Einsicht möglich. Der Beobachter muss die fragliche Aussage selbst hören. Geschriebenes, Aufzeichnungen oder Übertragungen können dazu nicht benutzt werden - was natürlich daran liegt, dass es sich um einen Manazauber handelt.
spell.clairaudience.desc=Der Beobachter erhält die Fähigkeit, weit entfernte Geräusche zu hören. Er kann den betroffenen Punkt, an den er sein Gehör schickt, innerhalb der Reichweite des Zaubers auswählen und mit einer Nebenhandlung bewegen. An diesem Punkt hat sein Gehör dasselbe Hörvermögen wie normal. Solange der Zauber aufrechterhalten wird, kann der Beobachter nur Geräusche im Bereich des Zielpunktes hören (keine in seiner unmittelbaren Umgebung), und eventuelle Gehörverbesserungen haben keine Wirkung.
spell.clairvoyance.desc=Dieser Zauber ist dem Hellhören sehr ähnlich, betrifft aber die optische Wahrnehmung. Der Beobachter erhält die Fähigkeit, weit entfernte optische Eindrücke zu sehen. Er kann den betroffenen Punkt, an den er seinen Gesichtssinn schickt, innerhalb der Reichweite des Zaubers auswählen und mit einer Nebenhandlung bewegen. An diesem Punkt hat sein Gesichtssinn dasselbe Sehvermögen wie normal. Solange der Zauber aufrechterhalten wird, kann der Beobachter nur Dinge im Bereich des Zielpunktes sehen (keine in seiner unmittelbaren Umgebung), und eventuelle Sichtverbesserungen haben keine Wirkung.
spell.combat_sense.desc=Der Beobachter erhält ein besseres Gefühl für mögliche Gefahren und die Fähigkeit, schneller darauf zu reagieren. Erfolge bei der Hexereiprobe werden zu seinem Verteidigungswert und dem Würfelpool für Überraschungsproben (siehe S. 110) addiert, solange der Zauber aufrechterhalten wird.
spell.detect_enemies.desc=Dieser Zauber lässt den Beobachter wissen, ob jemand innerhalb der Sinnesreichweite ihm gegenüber feindliche Absichten hegt. Das funktioniert nur in Bezug auf Lebewesen - nicht bei Gegenständen. Der Zauber deckt auch nur Feindseligkeit auf, die sich spezifisch gegen den Beobachter richtet, nicht einen generellen Hass auf die gesamte Metamenschheit (wäre das so, müsste jeder in einem Slum hell aufleuchten). Großartig für das Entdecken von Hinterhalten.
spell.detect_life.desc=Verstecken sich Leute in diesem Geröllhaufen? Oder im Wald? Dieser Zauber zeigt sie dir. Trotz des allgemein klingenden Namens entdeckt er nicht jedes Lebewesen, sondern zielt auf Wesen mit Bewusstsein ab.
spell.detect_magic.desc=Niemand will eine ganze Deponie durchsuchen, um den magischen Ring in all dem Müll zu finden, aber manchmal ist es nötig. Deswegen hat ein unternehmungslustiger Magier diesen Zauber entwickelt, der den Beobachter auf alle Formen aktiver Magie innerhalb der Sinnesreichweite aufmerksam macht. Das umfasst Foki, Reagenzien, aktive Zauber, Hüter, alchemistische Erzeugnisse, Geister, Ritualwirkungen und Magische Refugien, aber keine Erwachten Personen, Critter, astralen Signaturen, alchemistischen Erzeugnisse, die bereits ausgelöst wurden oder ihre Wirksamkeit verloren haben, oder die Wirkung permanenter Zauber, wenn diese bereits permanent geworden sind.
spell.mindlink.desc=Kommlinks und Textnachrichten? Wie altmodisch. Wirf deine Gedanken einfach in jemandes Geist, und du erhältst das Optimum an schneller Kommunikation! Solange mindestens ein Erfolg bei der Hexereiprobe erzielt wurde, besteht eine Verbindung, über die du mentale Kommunikation in jeder Weise betreiben kannst, die für dich und das Ziel verständlich ist. Die Probe muss nicht als Vergleichende Probe abgelegt werden, weil das Ziel der Telepathie freiwillig mitmachen muss. Zaubernder und Ziel müssen innerhalb der Reichweite bleiben, damit die Verbindung funktioniert. Wenn sie sich zu weit auseinanderbewegen und danach wieder in Reichweite kommen, können sie die Kommunikation wieder aufnehmen, sofern der Zauber aufrechterhalten wurde.
spell.mind_probe.desc=Der Beobachter kann in den Geist eines Ziels eindringen und versuchen, möglichst viele von dessen Gedanken zu erkennen - und dabei auch herauszufinden, was davon wahr und was reine Selbsttäuschung ist. Lege eine Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Die Nettoerfolge legen fest, ob der Beobachter überhaupt in Reichweite des Ziels ist und wie viele Informationen er aus dem Kopf des Ziels holen kann. Die Tabelle Ergebnisse der Geistessonde (S. 144) gibt die Art von Informationen an, die durch den Zauber gewonnen wird.
spell.antidote.desc=Dieser Zauber lässt Mana durch den Körper des Ziels jagen, um Toxine zu finden und zu neutralisieren. Lege eine Ausgedehnte Probe auf Hexerei + Magie (Kraft des Toxins, 1 Kampfrunde) ab. Jeder Erfolg senkt die Kraft des Toxins um 1. Sobald die Kraft auf 0 oder darunter gesunken ist, werden alle noch aktiven Wirkungen des Toxins beseitigt.
spell.cleansing_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein neutralisierendes Element, das den Status Verätzt beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.cooling_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein kühlendes Element, das den Status Brennend beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.decrease_attribute.desc=Die Berührung des Zauberers schwächt das Ziel, verlangsamt es oder macht es benommen, was dazu führt, dass eines seiner Attribute vorübergehend sinkt. Der Zaubernde entscheidet vor dem Wirken des Zaubers, welches Attribut gesenkt werden soll, und legt dann eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + betroffenes Attribut des Ziels ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um das Attribut um jeweils 1 Punkt pro Nettoerfolg zu senken. Für jeden Nettoerfolg ab dem zweiten, der für die Senkung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Der Zauber senkt weder Edge noch Essenz, Magie oder Resonanz.
spell.heal.desc=In einem Runnerleben kommt es immer wieder zu Schrammen, Blessuren und Schusswunden, und Magie ist wahrscheinlich die schnellste und effektivste Heilungsmöglichkeit dafür. Lege zum Wirken dieses Zaubers eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Für jeden Nettoerfolg kannst du 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden heilen. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber (inklusive Kühlendes Heilen, Neutralisierendes Heilen und Wärmendes Heilen) behandelt werden
spell.increase_attribute.desc=Die Berührung des Zauberers stärkt, beschleunigt oder erleuchtet das Ziel, was dazu führt, dass eines seiner Attribute vorübergehend steigt. Der Zaubernde entscheidet vor dem Wirken des Zaubers, welches Attribut gesteigert werden soll, und legt dann eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um das Attribut (unter Berücksichtigung des maximalen Bonus von +4) um jeweils 1 Punkt pro Nettoerfolg zu steigern. Für jeden Nettoerfolg ab dem zweiten, der für die Steigerung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Der Zauber steigert weder Edge noch Essenz, Magie oder Resonanz.
spell.increase_reflexes.desc=Die Reaktionszeit des Ziels nimmt ab und seine Schnelligkeit zu, wodurch es Situationen besser vorausahnen und darauf reagieren kann. Der Zaubernde legt eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Er kann entscheiden, wie viele Nettoerfolge er wirklich benutzen will, um pro Nettoerfolg sowohl den Initiativewert um 1 Punkt als auch die Anzahl der Initiativewürfel um 1 Würfel zu steigern. Für jeden Nettoerfolg ab dem zweiten, der für die Steigerung benutzt wird, steigt der Entzug des Zaubers kumulativ um 1. Ein Charakter kann insgesamt niemals mehr als 5W6 Initiativewürfel haben.
spell.resist_pain.desc=Dieser Zauber gewährt zwar keine Heilung, erlaubt dem Ziel aber, die Auswirkungen von Schaden zu ignorieren und weiterzumachen, als gäbe es keinen Grund für Schmerzen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Für jeden Nettoerfolg kann das Ziel seinen Verletzungsmodifikator um 1 senken.
spell.stabilize.desc=Dieser Zauber wird benutzt, wenn jemand Überzähligen Schaden erlitten hat. Lege eine Probe auf Hexerei + Magie mit einem Schwellenwert in Höhe der Anzahl der Kästchen an Überzähligem Schaden des Ziels ab. Gelingt die Probe, werden sa?mtliche Ka?stchen des U?berza?hligen Schadens entfernt.
spell.warming_heal.desc=Dieser Zauber hat die gleiche Heilwirkung wie der Zauber Heilen. Lege eine Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Jeder Nettoerfolg heilt 1 Kästchen Überzähligen, Körperlichen oder Betäubungsschaden.\nAußerdem besitzt diese Variante des Zaubers ein wärmendes Element, das den Status Unterkühlt beim Ziel beendet. Ein Satz Verletzungen kann nur einmal mit einem Heilen-Zauber behandelt werden.
spell.agony.desc=Dieser Zauber verursacht Schmerzen, aber keinen Schaden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Jeder Nettoerfolg erzeugt ein zusätzliches illusorisches Kästchen Schaden - und zwar jeweils auf beiden Zustandsmonitoren -, das sich nur auf die Bestimmung von Verletzungsmodifikatoren auswirkt. Wenn einer oder beide Zustandsmonitore dadurch voll werden, bleibt das Ziel zwar bei Bewusstsein, leidet aber unter so starken Schmerzen, dass es keine Handlungen mehr durchführen kann. Wenn der Zauber fallen gelassen wird, endet die Wirkung des Schmerzes sofort.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug).
spell.confusion.desc=Verwirrung trifft das Ziel mit einem Wirbel von Bildern und Emotionen, die es desorientieren und verwirren. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel erhält den Status Verwirrt mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe. Das Ziel erhält einen Würfelpoolmalus in Höhe dieser Zahl bei allen Proben außer Schadenswiderstandsproben.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber eine Flächenwirkung erhalten hat, kann auch die Anpassung Fläche Verschieben benutzt werden.
spell.chaos.desc=Chaos trifft das Ziel mit einem Wirbel von Bildern und Emotionen, die es desorientieren und verwirren. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel erhält den Status Verwirrt mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe. Das Ziel erhält einen Würfelpoolmalus in Höhe dieser Zahl bei allen Proben außer Schadenswiderstandsproben.\nDer einfache Zauber wirkt nur gegen ein einzelnes Ziel, aber die Anpassung Fläche Vergrößern kann verwendet werden, um ihm eine Flächenwirkung zu verleihen (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber eine Flächenwirkung erhalten hat, kann auch die Anpassung Fläche Verschieben benutzt werden. Im Gegensatz zu Verwirrung wird dieser Zauber auch gegen Kameras, Mikrofone und andere Arten von Technologie.
spell.hush.desc=Magische Stille senkt sich auf das Ziel und macht es ihm unmöglich, ein Geräusch zu verursachen, selbst wenn es das versucht. Das kann für Leute sehr praktisch sein, die sich an jemandem vorbeischleichen wollen - oder es kann eine gute Möglichkeit sein, um die Kommunikation von anderen zu stören, die auf Sprechen angewiesen sind. Schweigen verleiht dem Ziel den Status Geräuschlos (siehe S. 54) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu hören.
spell.silence.desc=Magische Stille senkt sich auf das Ziel und macht es ihm unmöglich, ein Geräusch zu verursachen, selbst wenn es das versucht. Das kann für Leute sehr praktisch sein, die sich an jemandem vorbeischleichen wollen - oder es kann eine gute Möglichkeit sein, um die Kommunikation von anderen zu stören, die auf Sprechen angewiesen sind. Stille verleiht dem Ziel den Status Geräuschlos (Verbessert, siehe S. 54) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu hören und im Gegensatz zu Schweigen können auch Mikrofone und andere Technologie das Ziel nicht hören.
spell.invisibility.desc=Das Ziel verschwindet aus dem Blick und wird durchsichtig, sodass es sich ungesehen bewegen kann. Unsichtbarkeit verleiht dem Ziel den Status Unsichtbar (siehe S. 55) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu sehen.
spell.improved_invisibility.desc=Das Ziel verschwindet aus dem Blick und wird durchsichtig, sodass es sich ungesehen bewegen kann. Unsichtbarkeit verleiht dem Ziel den Status Unsichtbar (verbessert, siehe S. 55) mit einer Stufe gleich der Anzahl der Erfolge bei der Hexereiprobe. Diese Zahl dient als Schwellenwert für alle Versuche, das Ziel zu sehen. Auch Kameras und andere Technologie können das Ziel nicht sehen.
spell.mask.desc=Manchmal will man nicht gesehen werden. Und manchmal will man als jemand gesehen werden, der man nicht ist. Maske dient dem zweiten Zweck. Der Zauber verändert wichtige Merkmale der Person: ihr Erscheinungsbild, ihren Klang, ihren Geruch und so weiter. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen. Maske wirkt nur gegen Lebewesen mit Bewusstsein.
spell.physical_mask.desc=Manchmal will man nicht gesehen werden. Und manchmal will man als jemand gesehen werden, der man nicht ist. Physische Maske dient dem zweiten Zweck. Der Zauber verändert wichtige Merkmale der Person: ihr Erscheinungsbild, ihren Klang, ihren Geruch und so weiter. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen. Im Gegensatz zmm Zauber Maske wirkt diese Version auch gegen Kameras, Mikrofone und andereTechnologie.
spell.phantasm.desc=Mit diesem Zauber projizierst du ein bestimmtes Bild (begleitet von dazugehörigen Geräuschen und Gerüchten) in einen bestimmten Wirkungsbereich. Vielleicht ist es das Bild eines angreifenden Drachen, eines friedlichen Gartens oder einer bestimmten Person. Jedenfalls muss es etwas darstellen, was du bereits gesehen hast, und das Trugbild muss in deiner Sichtlinie bleiben. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen.\nTrugbild wirkt gegen jedes Lebewesen, das das Bild sieht.
spell.trid_phantasm.desc=Mit diesem Zauber projizierst du ein bestimmtes Bild (begleitet von dazugehörigen Geräuschen und Gerüchten) in einen bestimmten Wirkungsbereich. Vielleicht ist es das Bild eines angreifenden Drachen, eines friedlichen Gartens oder einer bestimmten Person. Jedenfalls muss es etwas darstellen, was du bereits gesehen hast, und das Trugbild muss in deiner Sichtlinie bleiben. Lege eine Probe auf Hexerei + Magie ab und notiere die Anzahl der Erfolge. Diese Zahl bildet den Schwellenwert, wenn andere versuchen, mit einer Probe auf Willenskraft + Intuition die Illusion zu durchschauen.\nTrideo-Trugbild wirkt gegen jedes Lebewesen, das das Bild sieht und auch gegen Kameras, Mikrofone und andere Technologie.
spell.sensor_sneak.desc=Verbesserte Unsichtbarkeit, Physische Maske und ähnliche Zauber sind hervorragend dazu geeignet, sowohl neugierige Augen als auch Technologie zu täuschen, aber was ist mit einer Situation, in der keine Lebewesen präsent sind, sondern nur Kameras, Sensoren und Ähnliches? Sensortäuschung ist genau der richtige Zauber dafür. Durch ihn erhält das Ziel eine Version des Status Unsichtbar (Verbessert) mit einer Stufe gleich der Anzahl der Erfolge der Hexereiprobe, aber der Zauber hat keine Wirkung auf Lebewesen, sondern nur auf technologiebasierte Sensoren.
spell.animate_metal.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_plastic.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_stone.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.animate_wood.desc=Ein Stück Material der betroffenen Art wird zum Leben erweckt und bewegt sich auf Befehl des Zaubernden. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des zu belebenden Materials/Objekts ab. Verwende die Tabelle Beispiele für Volumina, um zu bestimmen, wie viel Material belebt wird. Das Material kann sich entsprechend seiner Form bewegen, sollte aber im Allgemeinen nicht schneller als 5 Meter pro Kampfrunde sein, wenn es sich nicht um ein Fahrzeug mit Rädern oder etwas anderes mit einer innewohnenden Geschwindigkeit handelt. Das Objekt kann sich im Allgemeinen nicht koordiniert bewegen, daher kann man Angriffen von belebten Objekten leicht ausweichen, weil sie langsam sind. Das Objekt könnte aber einem bewegungslosen oder unaufmerksamen Ziel einen Schlag versetzen, der bei Metall 4K, bei Stein 3K, bei Holz 2B und bei Kunststoff 1B Schaden verursacht.\nDas Kommandieren der belebten Substanz erfordert eine Nebenhandlung. Wenn jemand versucht, das Objekt am Ausführen der Befehle zu hindern, wird eine Vergleichende Probe mit den Nettoerfolgen der Hexereiprobe + [4 (für Metall), 3 (für Stein), 2 (für Holz), 1 (für Kunststoff)] gegen Konstitution + Stärke des Gegners abgelegt, um zu bestimmen, ob das Objekt wirklich daran gehindert werden kann.\nEs kann knifflig sein, den richtigen Zauber zu wählen, weil viele Objekte nicht vollständig aus nur einem Material bestehen - Tische zum Beispiel können Holz- oder Kunststoffplatten und Metallbeine haben. Wähle das vorherrschende Material innerhalb des Objekts aus und belebe es mit dem dazugehörigen Zauber. Die Magie, die auf den Großteil des Materials wirkt, schafft es, den Rest einfach mit auf die Reise zu nehmen.
spell.armor.desc=Deine Magie füllt den Körper des Ziels, härtet ihn und lässt ihn Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels.
spell.control_actions.desc=Der Zaubernde wird zum Marionettenspieler, übernimmt die Herrschaft über eine andere Person und lässt sie nach seiner Pfeife tanzen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab. Das Ziel weiß, was geschieht, kann aber wenig dagegen tun. Der Zaubernde verwendet für seine Befehle dieselben Handlungen, die er dem Ziel befiehlt, also ist es für ihn eine Nebenhandlung, dem Ziel eine Bewegung zu befehlen, und ein Angriffsbefehl ist eine Haupthandlung. Das heißt auch, dass der Zaubernde keine eigenen Handlungen durchführen kann, während er das Ziel steuert.\nDieser Zauber kann durch die Anpassung Fläche Vergrößern zu einem Zauber mit Flächenwirkung gemacht werden (beginnend mit 2 Metern Radius für +1 Entzug). Wenn der Zauber gewirkt ist, bleibt seine Wirkung bei Personen bestehen, die dem Zauber nicht widerstehen konnten, selbst wenn sie sich nach außerhalb des ursprünglichen Bereichs bewegen.
spell.control_thoughts.desc=Dieser Zauber ist Handlungen Beherrschen ähnlich, aber noch hinterhältiger, weil er den Zaubernden in den Kopf des Ziels eindringen lässt und ihn entscheiden lässt, was es zu denken hat. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Logik des Ziels ab.\nAnders als bei Handlungen Beherrschen ist es nicht sicher, dass das Ziel sich dieser Einflussnahme bewusst ist. Je näher die befohlenen Gedanken der normalen Gedankenwelt des Ziels sind, desto weniger wahrscheinlich ist es, dass es das Eindringen erkennt. Wenn der Spielleiter es beschließt, kann das Ziel eine Probe auf Logik + Intuition ablegen, wenn der Zauber endet, um zu erkennen, dass es unter der Wirkung des Zaubers stand. Der Schwellenwert ist davon abhängig, wie fremd die eingegebenen Gedanken seiner normalen Denkweise waren.\nDer Zaubernde spielt zwar eine mächtige Rolle dabei, die Gedanken des Ziels zu formen, aber gewisse Instinkte sind sehr schwer zu überwinden. Gedanken wie „Ich sollte von diesem Gebäude springen“ oder „Ich sollte meinen besten Freund/Partner/ein Familienmitglied angreifen“ wird meistens widerstanden. Bei solchen Gedanken kann der Spielleiter dem Ziel eine Probe auf Willenskraft + Logik zugestehen, um ihnen zu widerstehen. Das Ziel kann Edge für diese Probe erhalten, wenn der Gedanke seinen grundlegenden Instinkten zuwiderläuft oder einfach zu weit von seinem üblichen Denken entfernt ist.
spell.darkness.desc=Umgebung nach deinen Vorstellungen. Für jeden Erfolg kannst du die Beleuchtung der Umgebung um eine Abstufung (s. Tabelle Umgebung und Lichtverhältnisse, S. 108) senken, was dabei helfen kann, durch Umgebung und Lichtverhältnisse Edge zu erhalten. Es handelt sich um einen Zauber mit Flächenwirkung, der mit Fläche Vergrößern und Fläche Verschieben angepasst werden kann.
spell.light.desc=Dieser Zauber verändert die Lichtverhältnisse deiner Umgebung nach deinen Vorstellungen. Für jeden Erfolg kannst du die Beleuchtung der Umgebung um eine Abstufung (s. Tabelle Umgebung und Lichtverhältnisse, S. 108) erhöhen, was dabei helfen kann, durch Umgebung und Lichtverhältnisse Edge zu erhalten. Es handelt sich um einen Zauber mit Flächenwirkung, der mit Fläche Vergrößern und Fläche Verschieben angepasst werden kann.
spell.elemental_armor.desc=Deine Magie füllt den Körper des Ziels, härtet ihn und lässt ihn Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels.\nWenn du den Zauber wirkst, wählst du außerdem einen Elementareffekt aus, gegen den der Zauber schützen soll. Abhängig von dieser Auswahl kann das Ziel bestimmte Status nicht erhalten, die in der Tabelle Elementarpanzerung angegeben sind. Das Ziel kann zwar Schaden durch eine Waffe oder einen Zauber erleiden, durch die oder den Schaden der betreffenden Art verursacht wird - zum Beispiel kann es mit kühlender Panzerung Schaden durch einen Feuerball erhalten, wenn es ihm nicht vollständig widersteht -, erhält aber nicht den Status (in diesem Fall Brennend), der dadurch verursacht würde.
spell.fling.desc=Wenn du jemals „Hätte ich magische Kräfte, würde ich ganz sicher Dinge in den Himmel katapultieren, nur ohne Katapult“ dachtest, ist dieser Zauber genau für dich gemacht. Lege eine Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Du kannst pro Nettoerfolg ein halbes Kilo Material in die Luft schleudern, und die Nettoerfolge bilden auch den Schwellenwert für potenzielle Opfer, die mit Reaktion + Intuition diesen Geschossen ausweichen wollen. Ein geschleudertes Objekt hat die folgenden Angriffswerte: Sehr nah: Magie; Nah: Magie + 2; Mittel: Magie + 1; Weit: Magie - 2; Sehr weit: -. Das Objekt verursacht Betäubungsschaden in Höhe seines (aufgerundeten) Gewichts in Kilogramm.
spell.focus_burst.desc=Fokus-Foki können für Zauberer eine mächtige Unterstützung sein, aber wer wollte noch nie ab und zu ein bisschen mehr Macht aus ihnen herausquetschen? Mit Fokus-Boost kannst du ein wenig mehr aus deinem Fokus herausholen oder den Fokus eines anderen unterstützen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen Kraftstufe × 2 des Fokus ab. Wenn du Nettoerfolge erzielst, steigt die Kraftstufe des Fokus um 1. Ein Kritischer Patzer bei der Hexereiprobe senkt die Kraftstufe des Fokus permanent um 2.
spell.levitate.desc=Vielleicht nicht ganz dasselbe wie Fliegen, aber immerhin überwindet man die Schwerkraft - und es macht Spaß! Lege eine Probe auf Hexerei + Magie ab. Jeder Erfolg ermöglicht dir das Levitieren von 50 Kilogramm Material oder Personen. Wenn es sich um Personen handelt und diese nicht besonders viel Lust auf das Levitieren haben, können sie eine Probe auf Konstitution + Stärke ablegen, wobei jeder Erfolg die Anzahl deiner Erfolge um 1 senkt.\nDas Ziel muss in Sicht bleiben, wenn es in der Luft bleiben soll; sobald es außer Sicht gerät, beginnt der Absturz. Das hat - neben einer gewissen Vorsicht, weil der Zauber unterbrochen werden könnte - dazu geführt, dass sich die maximale Höhe, die Personen mit diesem Zauber erreichen, von selbst begrenzt.\nDas Ziel muss nicht auf der Stelle schweben. Es kann vom Zaubernden mit einer Bewegungsrate von [Magie des Zaubernden] Metern pro Runde bewegt werden. Diese Bewegung ist eine Nebenhandlung.
spell.mana_barrier.desc=Du möchtest einen geisterfreien Raum? Du möchtest, dass „Keine Foki!“ in deiner Bar wirklich gilt? Dann empfiehlt sich eine Manabarriere. Diese unsichtbare (nur auf der Astralebene sichtbare) Wand schränkt die körperliche Bewegung von Lebewesen oder mundanen Gegenständen nicht ein, hält aber Geister, aktivierte Foki, Dualwesen, alchemistische Erzeugnisse, Reagenzien und Zauber auf der Ebene auf, auf der sie gewirkt wurde (physisch oder astral). Wenn die Barriere im Astralraum gewirkt wird, hält sie dort auch astrale Gestalten auf und behindert die Sicht. Lege eine Probe auf Hexerei + Magie ab. Die Strukturstufe der Wand, die dadurch entsteht, ist gleich Magie + Erfolge bei der Hexereiprobe.\nDer einfache Zauber erschafft eine Barriere von zwei mal zwei Metern. Der Zauber kann mit Fläche Vergrößern angepasst werden, was jeweils zwei Meter Breite und Höhe hinzuaddiert (aber nicht mehr Dicke). Die Barriere kann vom Zaubernden nach Belieben geformt werden. Näheres zu Manabarrieren findest du auf Seite 163.
spell.mystic_armor.desc=Deine Magie füllt die Astralgestalt des Ziels, härtet diese und lässt sie Schaden besser wegstecken. Lege eine Probe auf Hexerei + Magie ab und addiere die Erfolge zum Verteidigungswert des Ziels im Astralkampf und gegen Mana-Kampfzauber
spell.overclock.desc=Magie und Technologie kommen nicht immer gut miteinander aus, aber manchmal können sie ihre Kräfte vereinen. Mit diesem Zauber kann man für kurze Zeit die Macht eines elektronischen Geräts verstärken, sodass es schneller und besser läuft. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Jeder Nettoerfolg erhöht ein Attribut des Geräts (Gerätestufe, Angriff, Datenverarbeitung, Firewall oder Schleicher) um 1. Der Zaubernde kann einige der Nettoerfolge auch nicht einsetzen, wenn er das Gerät nicht überfordern will.\nDieser Zauber beansprucht ein Gerät stark. Nachdem der Zauber fallen gelassen wurde, erleidet das Gerät Matrixschaden in Höhe der Anzahl der benutzten Nettoerfolge, dem mit Firewall widerstanden wird.
spell.physical_barrier.desc=Manchmal willst du Magie von dir fernhalten, und manchmal willst du absolut alles auf der physischen Ebene von dir fernhalten, was du kannst. Lege eine Probe auf Hexerei + Magie ab. Dadurch entsteht auf der physischen Ebene eine Wand dort, wo du sie willst, mit einer Strukturstufe gleich Magie + Erfolge bei der Hexereiprobe. Der Zauber erschafft eine Barriere von zwei mal zwei Metern mit einer Dicke von zwei Zentimetern. Der Zauber kann mit Fläche Vergrößern angepasst werden, was jeweils zwei Meter Breite und Höhe hinzuaddiert (aber nicht mehr Dicke). Die Barriere kann vom Zaubernden nach Belieben geformt werden.
spell.shape_metal.desc=Dieser Zauber gibt dir die Möglichkeit, Metall formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Metall, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Metall bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_plastic.desc=Dieser Zauber gibt dir die Möglichkeit, Kunststoff formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Kunststoff, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Kunststoff bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_stone.desc=Dieser Zauber gibt dir die Möglichkeit, Stein formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Stein, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Stein bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.shape_wood.desc=Dieser Zauber gibt dir die Möglichkeit, Holz formbar - buchstäblich zu Wachs in deinen (mentalen) Händen - zu machen. Du kannst es formen, solange der Zauber aufrechterhalten wird. Nach dem Fallenlassen behält es die Form bei, die du ihm gegeben hast. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand ab. Die Menge an Holz, das du formen kannst, wird von den Nettoerfolgen bestimmt. Du kannst 1 Kubikmeter Material pro Nettoerfolg formen (s. Tabelle Beispiele für Volumina, S. 139). Um diesen Zauber auf ein Objekt wirken zu können, muss es nicht zur Gänze aus Holz bestehen; es genügt, wenn es überwiegend daraus besteht.
spell.strengthen_wall.desc=Ob du eine Wand verstärken willst, durch die Gegner durchbrechen wollen, oder den Lärm der Leute dämpfen willst, die nebenan Krach machen - es kann jedenfalls nützlich sein, eine bestehende Wand ein bisschen stärker zu machen. Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand der Wand ab, die du verstärken willst. Pro Nettoerfolg steigt die Strukturstufe um 1. Mit der Grundversion des Zaubers kannst du vier Quadratmeter Wand verstärken. Mit der Anpassung Fläche Vergrößern kannst du diesen Bereich um vier Quadratmeter pro Punkt höherem Entzug vergrößern. Die Anpassung Fläche Verschieben kann für diesen Zauber verwendet werden.
spell.thunder.desc=Eine große, laute Ablenkung kann nützlich sein, und dieser Zauber bietet genau das. Der Zaubernde verändert Schallwellen zu einem Lärm seiner Wahl: Er kann wie der Name des Zaubers klingen, das Rauschen des Verkehrs zur Stoßzeit nachahmen, aber auch wie das ferne Durcheinander von Schreien oder andere verstörende Geräusche klingen. Die Grundversion des Zaubers betrifft einen kugelförmigen Bereich mit zwei Metern Radius; dieser kann durch die Anpassung Fläche Vergrößern vergrößert werden. Pro Erfolg bei der Probe auf Hexerei + Magie hält der Lärm für 1 Kampfrunde weiter an, nachdem der Zauber fallen gelassen wurde. Die Erfolge dienen auch als Würfelpoolmalus für Personen, die versuchen, andere Geräusche im Wirkungsbereich zu hören.
spell.vehicle_armor.desc=Viele Runner lernen zu spät, dass Autotüren keine undurchdringlichen Schilde gegen Kugeln sind. Aber mit diesem Zauber können sie es sein! Lege eine Vergleichende Probe auf Hexerei + Magie gegen den Objektwiderstand des Fahrzeugs ab. Der Panzerungswert des Fahrzeugs steigt um 1 pro Nettoerfolg.
ritualfeature.anchored.desc=Ein verankertes Ritual muss an einem physischen Objekt oder einem Symbol mit mystischer Bedeutung verankert werden, das als sein Ankerpunkt dient. Es könnte sich um etwas handeln, das speziell für das Ritual benutzt wird (wie einen Felsen oder Durchgang, an dem ein Hüter verankert wird), um mystische Zeichen (gemeißelt, gemalt, mit Blut oder Tinte geschrieben) oder sogar um den Ritualplatz selbst. Dieser Ankerpunkt darf relativ zur Gaiasphäre (dem Planeten) nicht bewegt werden, sonst bricht die Wirkung des Rituals sofort ab.
ritualfeature.material_link.desc=Das Ritual benötigt eine Materielle Verbindung zum Ziel - etwas, das einmal Teil des Ziels war. Materielle Verbindungen von Lebewesen sind nicht ewig nutzbar. Im Kasten Materielle Verbindungen (S. 147) findest du Genaueres dazu.
ritualfeature.minion.desc=Das Ritual erschafft ein halbautonomes Wesen, meist zur Unterstützung des Zauberers, der es geschaffen hat. Der erschaffene Diener ist an den Ritualleiter gebunden, der höchstens so viele Diener gleichzeitig haben kann, wie sein Charismaattribut beträgt.
ritualfeature.spell.desc=Dieses Ritual wird zusammen mit einem Zauber benutzt, den der Ritualleiter kennt. Einige Merkmale des Zaubers können sich dabei verändern, was jeweils in der Beschreibung des Rituals angegeben ist. Wenn der Ritualleiter für diesen Zauber Modifikatoren durch einen Schutzgeist erhält, gelten diese ebenfalls bei dem Ritual. Solche Rituale können durch Antimagie gebannt werden (siehe S. 145). 
ritualfeature.spotter.desc=Wenn das Ziel nicht im Blickfeld des Ritualleiters ist, muss er jemanden auswählen, der das Ziel an seiner Stelle sehen kann und als Späher dient. Der Späher muss ein Mitglied der Gruppe sein, die das Ritual durchführt - oder ein Geist, der einem Teilnehmer dient -, und muss das Ziel astral wahrnehmen können. Der Späher muss zu Beginn des Rituals am Ritualplatz sein und danach körperlich oder astral zu einem Ort reisen, von dem aus er das Ziel astral wahrnehmen kann. Dies ist eine Ausnahme von der Regel in Schritt 3, dass Teilnehmer den Ritualplatz nicht verlassen dürfen. Das Ziel muss nicht astral aktiv sein (was für den Späher oft sicherer ist). Der Späher muss es nur astral wahrnehmen können, um die nötige mystische Verbindung aufzubauen. Wenn ein Flächenzauber Teil des Rituals ist, muss der Späher den Zielpunkt astral wahrnehmen können. Während der Dauer des Rituals entsteht dadurch eine Verbindung zwischen der Aura des Spähers und der Ritualgruppe. Wenn der Späher vom Ziel bemerkt wird, ist es möglich, diese mystische Verbindung bis zum physischen Aufenthaltsort der Ritualgruppe zurückzuverfolgen. Der Späher wirkt bei einer Teamworkprobe der anderen Teilnehmer nicht mit, erleidet aber denselben Entzug wie alle anderen.
ritual.circle_of_healing.desc=Dieses Ritual wird verwendet, um einen Heilzauber auf mehrere Ziele gleichzeitig zu wirken. Obwohl es als Kreis bezeichnet wird, erzeugt das Ritual eigentlich eine Kugel rund um den Ankerpunkt mit einem Radius in Metern gleich dem Magieattribut des Ritualleiters. Das Ritual braucht zur Vollendung 5 Stunden. Die Nettoerfolge der Probe beim Besiegeln werden als Nettoerfolge des Zaubers benutzt und dienen außerdem als Würfelpoolbonus für alle Heilungs- und Genesungsproben, die im Kreis durchgeführt werden. Wenn der Zauber einen bestimmten elementaren Aspekt hat (z. B. Kühlendes oder Wärmendes Heilen), gilt dessen Wirkung ebenfalls für Personen innerhalb des Kreises. Der Kreis bleibt für eine Anzahl von Tagen gleich den Nettoerfolgen beim Besiegeln bestehen.
ritual.circle_of_protection.desc=Der Schutzkreis bildet eine kleine astrale und physische Barriere. Obwohl das Ritual als Kreis bezeichnet wird, erzeugt es eigentlich eine Kugel rund um den Ankerpunkt mit einem Radius in Metern gleich dem Magieattribut des Ritualleiters. Diese Kugel bietet eine Kombination aus den Wirkungen der Zauber Physische Barriere und Manabarriere (S. 142/143) mit einer Strukturstufe gleich dem Magieattribut des Ritualleiters + Nettoerfolge beim Besiegeln. Die Manabarriere ist dual.\nDer Schutzkreis bleibt für eine Anzahl von Stunden gleich den Nettoerfolgen beim Besiegeln bestehen. Alles, was sich innerhalb der Barriere befindet, ist vor physischen und magischen Angriffen von außen geschützt. Wenn etwas die Barriere von innen her durchdringt, endet die Wirkung.\nDas Ritual braucht zur Vollendung 4 Stunden.
ritual.curse.desc=Ein Fluch erlaubt, ein Opfer mit einem Illusionszauber durch eine Materielle Verbindung statt durch eine Mystische Verbindung über einen Späher zu treffen. Der Fluch kann gegen jedes Ziel, innerhalb oder außerhalb der Sichtweite des Ritualleiters, gewirkt werden, solange die Materielle Verbindung vorhanden und brauchbar ist. Wenn der Zauber mehrere Opfer treffen soll, muss zu jedem einzelnen Opfer eine Materielle Verbindung bestehen.\nDie Materielle Verbindung wird bei Schritt 4 (Reagenzien ausgeben) verwendet und durch das Ritual vernichtet. Die Nettoerfolge der Probe beim Besiegeln werden als Nettoerfolge des Zaubers benutzt.\nWährend der Dauer des Rituals besteht eine Verbindung zwischen dem Ziel und der Ritualgruppe, solange der Zauber aufrechterhalten wird. Es ist möglich, diese Verbindung astral wahrzunehmen und bis zum physischen Aufenthaltsort der Ritualgruppe zurückzuverfolgen.\nDas Ritual braucht zur Vollendung 3 Stunden.
ritual.prodigal_spell.desc=Dieses Ritual gestattet dir, Kampfzauber auf entfernte Ziele zu wirken, die sich nicht im Blickfeld deiner Ritualgruppe befinden. Damit können direkte und indirekte Kampfzauber gewirkt werden. Direkte Kampfzauber reisen durch den Astralraum zum Ziel. Indirekte Kampfzauber reisen durch die physische Welt, wozu sie einen freien (aber nicht unbedingt geraden) Weg zwischen dem Ritualplatz und dem Ziel brauchen, um es zu erreichen. Der Zauber fliegt vom Ritualplatz aus zum Ziel und weicht dabei selbsttätig Hindernissen aus.\nDas Ritual braucht zur Vollendung 4 Stunden.
ritual.remote_sensing.desc=Dieses Ritual erlaubt dir, Wahrnehmungszauber mit noch größerer Reichweite zu wirken. Der Wirkungsbereich des Zaubers steigt auf [Magieattribut des Ritualleiters + Erfolge bei der Hexereiprobe in Schritt 6] × 100 Meter. Derjenige, auf den der Zauber gewirkt wird, muss sich während des Rituals am Ritualplatz aufhalten, kann danach aber seinen neuen Sinn außerhalb davon einsetzen, während die Ritualteilnehmer den Zauber aufrechterhalten. Alle Teilnehmer nehmen das wahr, was das Ziel mithilfe des Zaubers wahrnimmt. Wenn der Zauber ein Ziel hat (wie Telepathie oder Geistessonde), muss ein Späher dieses Ziel beobachten.\nDas Ritual braucht zur Vollendung 3 Stunden. Wenn danach auch nur ein einziger der Teilnehmer den Zauber fallen lässt, endet die Wirkung.
ritual.renascence.desc=Dieses Ritual erhält einen Manipulationszauber mit Flächenwirkung aufrecht. Der Wirkungsbereich des Zaubers entspricht einer Kugel mit einem Radius gleich dem Magieattribut des Ritualleiters in Metern. Die Wirkung hängt von den Nettoerfolgen beim Besiegeln ab. Die Wirkung hält einen Grundzeitraum von 1 Stunde an, der für jeden Nettoerfolg beim Besiegeln verdoppelt wird (also 2, 4, 8 usw.).\nDas Ritual braucht zur Vollendung 4 Stunden.
ritual.ward.desc=Dies ist ein einfaches Ritual, das viele Zauberer lernen. Es erschafft eine Manabarriere (S. 163) mit einer Kraftstufe gleich dem Magieattribut des Ritualleiters plus der Anzahl der Nettoerfolge beim Besiegeln in Schritt 6. Der Hüter kann ein Volumen von bis zu [50 × Summe der Magieattribute der Ritualteilnehmer] Kubikmetern umgrenzen.\nDas Ritual braucht zur Vollendung 4 Stunden. Der Hüter bleibt für eine Anzahl von Wochen gleich den Nettoerfolgen beim Besiegeln bestehen. Wenn der Ritualleiter 6 Karma ausgibt, wird der Hüter permanent.
ritual.watcher.desc=Watcher sind Geistern ähnlich, sind aber tatsächlich Wesen, die aus dem Geist des Ritualleiters geboren werden und nicht von den Metaebenen kommen. Sie sind Geschöpfe aus Mana, das durch die Persönlichkeiten der Ritualteilnehmer zusammengewoben wird. Ein Watcher kann alle Sprachen sprechen, die seine Erschaffer (Ritualleiter und Teilnehmer) sprechen können. Ein Watcher ist nur an den Ritualleiter gebunden und gehorcht nur ihm. Ein Watcher bleibt für [Nettoerfolge beim Besiegeln × 3] Stunden bestehen. Die Attribute und Fertigkeiten eines Watchers beginnen mit dem Wert 2. Pro zusätzlicher Stunde, die für das Ritual aufgewendet wird, steigen die Attribute und Fertigkeiten um 1, ebenso wie der Schwellenwert des Rituals. Ein Ritualleiter kann einen an ihn gebundenen Watcher als Nebenhandlung entlassen. Watcher können nicht wie Geister verbannt oder durch Antimagie gebannt werden.\nDas Ritual braucht zur Vollendung 1 Stunde.
item.dermal_deposits.desc=Du erhältst eine natürliche Panzerung mit Verteidigungswert 1, die kumulativ mit anderer Panzerung ist. Deine Angriffe im Waffenlosen Nahkampf haben einen Schadenswert von ((STR ÷ 2) + 1)K.
item.deprecated_item.desc=Veraltete Referenz (Lösch mich)
item.unarmed.desc=Waffenloser Kampf
item.unarmed_dermal_deposits.desc=Du erhältst eine natürliche Panzerung mit Verteidigungswert 1, die kumulativ mit anderer Panzerung ist. Deine Angriffe im Waffenlosen Nahkampf haben einen Schadenswert von ((STR ÷ 2) + 1)K.
item.mystic_armor.desc=Mana bildet einen Schild um dich, um dich zu schützen. Pro Stufe in dieser Kraft erhöht sich dein Verteidigungswert um 1. Dies wirkt kumulativ zu getragener Panzerung. Mystische Panzerung wirkt auch auf der Astralebene.
item.cyberjaw.desc=Ein Cyberkiefer sorgt für Extrabisskraft, wenn man seinem Gegner gerne sehr nahe kommt.
item.hardening.desc=Durch diesen Prozess wird die Haut/Gliedmaße gehärtet, damit man effektiver zuschlagen kann. Bei einem waffenlosen Angriff hat der Benutzer einen Schadenswert von 3K (4K, wenn das Stärkeattribut 7 oder höher ist) und einen Angriffswert (Sehr nah) von 6.
item.shock_limb.desc=An strategischen Punkten werden Elektroden eingebaut, die einer Zielperson taserartige Stromstöße versetzen können. Normalerweise wird dazu die Hand benutzt, aber in letzter Zeit erfreut sich der Schocktritt bei einigen Straßenkämpfern zunehmender Beliebtheit, und es gibt Geschichten von Kämpfern, die ihren Gegnern elektrisierende Kopfstöße verpassen.
item.handblade.desc=Die Handklinge, die es als starre und als einziehbare Version gibt, ist eine einfache Klinge, die an der dem Daumen gegenüberliegenden Handkante implantiert wird. Die einziehbare Version hat im eingezogenen Zustand eine Tarnbarkeit von 8.
item.handrazors.desc=Nagelmesser sitzen unter den Fingernägeln oder ersetzen sie ganz und können wie Krallen eingesetzt werden. Wie bei der Handklinge hat das einziehbare Modell eine Tarnbarkeit von 8.
item.spurs.desc=Sporne werden im Handgelenk oder in den Handknöcheln implantiert und verleihen einem Faustschlag oder einer Ohrfeige eine schneidende Schärfe. Die einziehbare Version hat eine Tarnbarkeit von 8.
item.bone_lacing_plastic_armor.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing_aluminium_armor.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung).
item.bone_lacing_titanium_armor.desc=In die Knochen werden Gitter aus verstärkenden Kunststoffen oder Metallen eingearbeitet, was ihr Widerstandsvermögen und ihre Bruchfestigkeit erhöht. Kompositknochen gibt es in drei Varianten: Kunststoff, Aluminium und Titan. Nur eine der drei Varianten kann gleichzeitig implantiert sein. Kompositknochen verleihen zusätzliche Konstitution für den Widerstand gegen Körperlichen Schaden, erhöhen den Verteidigungswert und ändern den Schadenswert und Angriffswert für Waffenlosen Kampf - wie in der Tabelle Kompositknochen angegeben. Kompositknochen sind nicht mit anderer Bodytech kompatibel, die die Knochen verändert (wie etwa die Bioware Knochenverstärkung)., Titan
item.dermal_plating_armor.desc=Hartkunststoff- und Keramikfaserplatten werden in die Haut implantiert. Die Platten sind deutlich sichtbar und noch deutlicher fühlbar, aber sie können im Hinblick auf Farbe und Oberflächenstruktur kosmetisch angepasst werden. Dermalpanzerung gewährt einen Bonus auf den Verteidigungswert in Höhe ihrer Stufe. Dermalpanzerung ist nicht mit anderer Bodytech für die Haut kompatibel, die einen Verteidigungswertbonus gewährt, wie etwa Orthoskin. Durch den Einbau von Dermalpanzerung verlieren Trolle ihre natürlichen Knochenablagerungen in der Haut und damit auch ihren Vorteil Dermalablagerungen.
item.ares_alpha_grenade_launcher.desc=Berühmt gemacht durch die Ares-Firewatch-Teams, wurde das Ares Alpha rasch ein Erfolg bei Spezialeinheiten der UCAS und CAS sowie bei unzähligen Desert-Wars-Teams. Der integrierte Unterlauf-Granatwerfer, das Smartgunsystem und ein innovatives benutzerfreundliches Design machen diese Waffe zu etwas Besonderem.
item.full_body_armor_helmet.desc=Der Helm der Panzerung hat eine Kapazität von 6 und kann mit Sicht- und Audioverstärkungen ausgestattet werden.
item.ballistic_shield_weapon.desc=schwarze Schild wird von SWAT-Teams und im Stadtkampf verwendet. Er hat ein durchsichtiges Plasstahl-Fenster und einen eingebauten Leiterrahmen an der Innenseite, sodass er zum Überklettern kleinerer Hindernisse benutzt werden kann.
item.riot_shield_weapon.desc=Dieser aus durchsichtigem Plasstahl bestehende Cousin des ballistischen Schilds bietet zusätzlich eine elektrische Angriffsoption. Der Angriff erfolgt mit der Fertigkeit Nahkampf und den Angriffscharakteristika eines Betäubungsschlagstocks. Der Schild enthält 10 elektrische Ladungen; ans Stromnetz angeschlossen, lädt er sich mit einer Geschwindigkeit von 1 Ladung pro 10 Sekunden wieder auf.
item.ocular_drone_vehicle.desc=Dieses Zubehör wird pro Kauf nur in einen Augapfel eingebaut. Dabei wird eine kleine Drohne (regeltechnisch wie eine Horizon Flying Eye, S. 302) in der Augenhöhle platziert. Die Drohne funktioniert wie ein normales Cyberauge (mit allen relevanten Verstärkungen), bis man sie herausnimmt - dann kann man sie steuern, als wäre sie eine Drohne. Während sie auf diese Weise benutzt wird (und man dann nur ein Auge hat), erleidet man die Auswirkungen des Status Geblendet I bei allem, was man tut. Wenn man beide Augen durch Drohnen ersetzt, erleidet man den Status Geblendet III, solange beide Drohnen außerhalb des Körpers operieren. Eine Augendrohne ist ganz klar als künstliches Auge zu erkennen.
magicOrResonance.magician.desc=Vollzauberer erhalten Zugriff auf alle magischen Fertigkeiten (Hexerei, Beschwören und Verzaubern) und vollen Zugang zur Astralebene mit astraler Wahrnehmung (S. 161) und astraler Projektion (S. 162). Während der Charaktererschaffung erhalten Vollzauberer eine Gesamtanzahl von kostenlosen Zaubern, Ritualen und/oder alchemistischen Zaubern gleich ihrer Magie × 2. Der Magiewert, der für diese Berechnung benutzt wird, ist der laut Prioritätentabelle - also vor jeder Erhöhung durch Anpassungspunkte, Karma oder andere Möglichkeiten.
magicOrResonance.mysticadept.desc=Magieradepten nutzen eine Mischung aus nach innen und nach außen gerichteter Magie. Sie können Zauber wirken, Geister beschwören und Gegenstände verzaubern, aber auch einen Teil ihrer Magie nach innen kanalisieren, um Adeptenkräfte zu nutzen. Sie können wegen der verankernden Wirkung ihrer Adeptenkräfte nicht astral projizieren, können aber mit der entsprechenden Ausbildung astral wahrnehmen.Sie müssen ihre Magie zwischen Zaubern und Adeptenkräften aufteilen. Zuerst erwerben sie Adeptenkräfte mit Kraftpunkten bis maximal zur Höhe ihres Magieattributs, dann multiplizieren sie die nicht für Kraftpunkte genutzte Magie mit 2, um die Anzahl an Zaubern zu Spielbeginn festzulegen.\nAuch hier kommt die Magie laut Prioritätentabelle vor jeder Anpassung zum Einsatz.
magicOrResonance.adept.desc=Adepten konzentrieren ihre Magie nach innen und unterstützen ihre Fähigkeiten mit der natürlichen Gabe, Mana in sich hinein statt nach außen zu kanalisieren. Wegen dieser physischen Verbundenheit mit der Magie können Adepten nicht astral projizieren und erhalten die Fähigkeit zur astralen Wahrnehmung nur durch Ausbildung. Adepten haben eine Anzahl von Kraftpunkten gleich ihrem Magieattribut (laut Prioritätentabelle vor Anpassungen), mit denen sie Adeptenkräfte erwerben können. Das heißt, dass sie durch eine Erhöhung ihres Magieattributs mit Anpassungspunkten keine zusätzlichen Kraftpunkte erhalten.\nNäheres zu Adepten findest du auf Seite 158.
magicOrResonance.aspectedmagician.desc=Aspektzauberer können nur einen der drei Aspekte der Magie betreiben: Hexerei, Beschwören oder Verzaubern. Sie können die Astralebene mit astraler Wahrnehmung und Projektion erreichen. Hexer erhalten eine Gesamtanzahl an kostenlosen Zaubern und/oder Ritualen gleich ihrer Magie × 2, Verzauberer erhalten eine Anzahl an kostenlosen alchemistischen Zaubern gleich ihrer Magie × 2.\nAuch hier ist der Magiewert, der für diese Berechnung benutzt wird, der laut Prioritätentabelle vor jeder Erhöhung durch Anpassungspunkte, Karma oder andere Möglichkeiten.
magicOrResonance.technomancer.desc=Technomancer haben eine besondere Verbindung mit der Matrix, die mit einem Attribut namens Resonanz gemessen wird. Sie haben die Fähigkeit, in kürzester Zeit Programme und Sprites zu erschaffen, und können die Energien der Matrix manipulieren und ihrem Willen unterwerfen. Wenn du die Prioritäten so auswählst, dass der Charakter ein Resonanzattribut erhält, erhält dieser auch eine Anzahl von Komplexen Formen gleich seiner Resonanz × 2 (auch hier gilt der Wert laut Tabelle vor jeder Erhöhung).
magicOrResonance.mundane.desc=

quality.magician.desc=Vollzauberer erhalten Zugriff auf alle magischen Fertigkeiten (Hexerei, Beschwören und Verzaubern) und vollen Zugang zur Astralebene mit astraler Wahrnehmung (S. 161) und astraler Projektion (S. 162). Während der Charaktererschaffung erhalten Vollzauberer eine Gesamtanzahl von kostenlosen Zaubern, Ritualen und/oder alchemistischen Zaubern gleich ihrer Magie × 2. Der Magiewert, der für diese Berechnung benutzt wird, ist der laut Prioritätentabelle - also vor jeder Erhöhung durch Anpassungspunkte, Karma oder andere Möglichkeiten.
quality.adept.desc=Adepten konzentrieren ihre Magie nach innen und unterstützen ihre Fähigkeiten mit der natürlichen Gabe, Mana in sich hinein statt nach außen zu kanalisieren. Wegen dieser physischen Verbundenheit mit der Magie können Adepten nicht astral projizieren und erhalten die Fähigkeit zur astralen Wahrnehmung nur durch Ausbildung. Adepten haben eine Anzahl von Kraftpunkten gleich ihrem Magieattribut (laut Prioritätentabelle vor Anpassungen), mit denen sie Adeptenkräfte erwerben können. Das heißt, dass sie durch eine Erhöhung ihres Magieattributs mit Anpassungspunkten keine zusätzlichen Kraftpunkte erhalten.\nNäheres zu Adepten findest du auf Seite 158.
quality.mysticadept.desc=Magieradepten nutzen eine Mischung aus nach innen und nach außen gerichteter Magie. Sie können Zauber wirken, Geister beschwören und Gegenstände verzaubern, aber auch einen Teil ihrer Magie nach innen kanalisieren, um Adeptenkräfte zu nutzen. Sie können wegen der verankernden Wirkung ihrer Adeptenkräfte nicht astral projizieren, können aber mit der entsprechenden Ausbildung astral wahrnehmen.Sie müssen ihre Magie zwischen Zaubern und Adeptenkräften aufteilen. Zuerst erwerben sie Adeptenkräfte mit Kraftpunkten bis maximal zur Höhe ihres Magieattributs, dann multiplizieren sie die nicht für Kraftpunkte genutzte Magie mit 2, um die Anzahl an Zaubern zu Spielbeginn festzulegen.\nAuch hier kommt die Magie laut Prioritätentabelle vor jeder Anpassung zum Einsatz.
quality.aspectedmagician.desc=Aspektzauberer können nur einen der drei Aspekte der Magie betreiben: Hexerei, Beschwören oder Verzaubern. Sie können die Astralebene mit astraler Wahrnehmung und Projektion erreichen. Hexer erhalten eine Gesamtanzahl an kostenlosen Zaubern und/oder Ritualen gleich ihrer Magie × 2, Verzauberer erhalten eine Anzahl an kostenlosen alchemistischen Zaubern gleich ihrer Magie × 2.\nAuch hier ist der Magiewert, der für diese Berechnung benutzt wird, der laut Prioritätentabelle vor jeder Erhöhung durch Anpassungspunkte, Karma oder andere Möglichkeiten.
quality.technomancer.desc=Technomancer haben eine besondere Verbindung mit der Matrix, die mit einem Attribut namens Resonanz gemessen wird. Sie haben die Fähigkeit, in kürzester Zeit Programme und Sprites zu erschaffen, und können die Energien der Matrix manipulieren und ihrem Willen unterwerfen. Wenn du die Prioritäten so auswählst, dass der Charakter ein Resonanzattribut erhält, erhält dieser auch eine Anzahl von Komplexen Formen gleich seiner Resonanz × 2 (auch hier gilt der Wert laut Tabelle vor jeder Erhöhung).
quality.ambidextrous.desc=Im Gegensatz zu anderen Charakteren kannst du beim Einsatz einer Waffe mit der Nebenhand (S. 113) Edge erhalten und ausgeben.
quality.analytical_mind.desc=Du erhältst 1 Bonus-Edge, wenn du Proben mit Logik ablegst (gilt nicht für Entzugs- und Schwundwiderstandsproben).
quality.aptitude.desc=Das Maximum für die gewählte Fertigkeit beträgt 10 statt 9. Bei der Charaktererschaffung beträgt das Maximum 7 statt 6.
quality.astral_chameleon.desc=Andere Charakter erhalten einen Würfelpoolmalus von -2 für das Erkennen deiner Aura oder astralen Signatur. Deine astrale Signatur verblasst in der Hälfte der normalen Zeit (siehe S. 161).
quality.blandness.desc=Andere Charaktere erhalten einen Würfelpoolmalus von -2 bei Proben auf Erinnerungsvermögen (S. 37), um zu bestimmen, ob sie dich bereits gesehen haben. Der Schwellenwert für Proben, mit denen bemerkt werden soll, dass du jemanden verfolgst oder observierst, steigt um 1. Wenn du etwas Permanentes, Auffälliges erwirbst - offensichtliche, ausgefallene Cyberware, ein einzigartiges Tattoo oder Ähnliches -, verlierst du diesen Vorteil. Wenn du vorübergehend ein auffälliges Merkmal erwirbst - wie eine extreme Frisur -, wird die Wirkung des Vorteils aufgehoben, bis die Veränderung rückgängig gemacht wird.
quality.built_tough.desc=Du erhältst eine Anzahl zusätzlicher Kästchen gleich der Stufe dieses Vorteils auf dem Körperlichen Zustandsmonitor.
quality.catlike.desc=Du erhältst bei Proben für das Halten des Gleichgewichts, Fallen und sicheres Landen 1 Bonus-Edge. Achte auf die Regeln im Abschnitt Edge-Missbrauch verhindern, S. 46).
quality.dermal_deposits.desc=Du erhältst eine natürliche Panzerung mit Verteidigungswert 1, die kumulativ mit anderer Panzerung ist. Deine Angriffe im Waffenlosen Nahkampf haben einen Schadenswert von ((STR ÷ 2) + 1)K.
quality.double_jointed.desc=Du erhältst 1 Bonus-Edge bei allen Proben, die mit Ringen, dem Abstreifen von Fesseln, Flexibilität oder dem Hineinschlüpfen in beengte Räume zu tun haben. Achte auf die Regeln im Abschnitt Edge-Missbrauch verhindern, S. 46).
quality.elemental_resistance.desc=Bei Auswahl dieses Vorteils wählst du eine elementare Schadensart (S. 112) aus. Wenn du durch eine Waffe oder einen Zauber (auch durch den waffenlosen Angriff eines Geistes) mit dieser Schadensart angegriffen wirst, erhältst du 1 Edge, bevor du deine Verteidigungsprobe ablegst.
quality.exceptional_attribute.desc=Wähle ein Körperliches oder Geistiges Attribut. Das Maximum des Charakters für dieses Attribut (aber nicht der gegenwärtige Wert) steigt um 1. Dieser Vorteil kann nur einmal gewählt werden.
quality.first_impression.desc=Du erhältst bei ersten Zusammentreffen mit jemandem 2 Edge für soziale Proben, und sowohl deine Fahndungsstufe als auch deine Reputation werden für dieses Treffen ignoriert.
quality.focused_concentration.desc=Du kannst mehrere Zauber oder Komplexe Formen ohne Würfelpoolmalus aufrechterhalten. Pro Stufe dieses Vorteils kannst du einen Zauber oder eine Komplexe Form aufrechterhalten, ohne den Malus dafür in Kauf zu nehmen. Der modifizierte Entzugs- bzw. Schwundwert des Zaubers bzw. der Komplexen Form darf nicht höher als 6 sein.
quality.gearhead.desc=Du erhältst für Reparaturproben bei allen Fahrzeugen 1 Edge und kannst zwischen Runs Edge ausgeben, um Ausgedehnte Reparaturproben abzulegen.
quality.guts.desc=Du erhältst 1 Edge, wenn du Einschüchtern oder der Wirkung des Status Verängstigt widerstehen musst.
quality.hardening.desc=Du erhältst 1 Edge für Widerstandsproben gegen Matrixschaden. Wenn du diesen Punkt Edge nicht sofort für die Schadenwiderstandsprobe ausgibst, verfällt er. Wenn du in der Matrix Schaden erleidest, kannst du bis zu zwei Kästchen Matrixschaden in Betäubungsschaden umwandeln und damit deine Persona auf Kosten deiner Gesundheit schützen.
quality.high_pain_tolerance.desc=Wenn du verletzt bist, sinkt der Verletzungsmodifikator um 1 (bis auf ein Minimum von 0).
quality.home_ground.desc=Wähle jedes Mal, wenn du diesen Vorteil auswählst, eine Nachbarschaft oder einen Host aus. Du erhältst 1 Edge für Proben auf Natur und Wahrnehmung in diesem Vertrauten Terrain; wenn du diesen Punkt Edge nicht für diese Probe ausgibst, verfällt er.
quality.human-looking.desc=Du erscheinst auf den ersten Blick menschlich und erhältst einen Würfelpoolbonus von +2 auf Verkleiden- Proben, mit denen du menschlicher aussehen willst. Nur für Elfen, Orks und Zwerge erhältlich.
quality.indomitable.desc=Die Kosten für einen Edge-Boost bei Proben, bei denen Willenskraft beteiligt ist, sinken um 1.
quality.juryrigger.desc=Wenn du eine Improvisieren-Probe ablegst (siehe S. 97), erhältst du 1 Edge; dieser Punkt muss für diese Probe ausgegeben werden, sonst verfällt er.
quality.long_reach.desc=Wenn du eine Nahkampfwaffe benutzt, beträgt die Reichweite Sehr nah 5 Meter statt 3.
quality.low-light_vision.desc=Du kannst bei schlechten Lichtverhältnissen deutlich sehen, außer in totaler Dunkelheit (s. Umgebung und Sichtverhältnisse, S. 108).
quality.magic_resistance.desc=Du erhältst 1 Bonus-Edge auf Magiewiderstandsproben; wenn du diesen Punkt nicht bei der entsprechenden Probe ausgibst, verfällt er. Wenn ein Heilzauber auf dich gewirkt wird, wird deine Essenz behandelt, als wäre sie 2 Punkte niedriger, als sie es in Wirklichkeit ist.
quality.mentor_spirit.desc=Du erhältst die Vorteile, die bei der Beschreibung deines Schutzgeistes angegeben sind (siehe S. 164). Wenn du dich nicht an die Gebote deines Schutzgeistes hältst, verlierst du den Glauben an ihn und die Verbindung zu ihm, und damit auch alle Vorteile.
quality.photographic_memory.desc=Du erhältst 1 Bonus-Edge, wenn du eine Probe auf Erinnerungsvermögen ablegst (S. 37). Wenn du diesen Punkt nicht sofort für diese Probe ausgibst, verfällt er.
quality.quick_healer.desc=Das Intervall bei Proben für natürliche Genesung (S. 123) wird halbiert, was bedeutet, dass du von Betäubungsschaden nach einer halben Stunde und von Körperlichem Schaden nach einem halben Tag genesen kannst.
quality.resistance_pathogens.desc=Du erhältst 1 Bonus-Edge, wenn du eine Pathogenwiderstandsprobe ablegst. Wenn du diesen Punkt nicht sofort für diese Probe ausgibst, verfällt er.
quality.spirit_affinity.desc=Bei Auswahl dieses Vorteils wählst du eine Art von Geistern bzw. Sprites aus. Wenn du eine Probe auf Beschwören bzw. Tasken für einen Geist bzw. Sprite aus der gewählten Gruppe von Geistern/Sprites ablegst, erhältst du 1 Bonus-Edge. Wenn du diesen Punkt nicht sofort für diese Probe einsetzt, verfällt er. Dieser Vorteil kann mehrmals gewählt werden, wobei du jedes Mal eine andere Art von Geistern/ Sprites auswählst.
quality.sprite_affinity.desc=Bei Auswahl dieses Vorteils wählst du eine Art von Geistern bzw. Sprites aus. Wenn du eine Probe auf Beschwören bzw. Tasken für einen Geist bzw. Sprite aus der gewählten Gruppe von Geistern/Sprites ablegst, erhältst du 1 Bonus-Edge. Wenn du diesen Punkt nicht sofort für diese Probe einsetzt, verfällt er. Dieser Vorteil kann mehrmals gewählt werden, wobei du jedes Mal eine andere Art von Geistern/ Sprites auswählst.
quality.thermographic_vision.desc=Du kannst die Wärme von Objekten in völliger Dunkelheit sehen (wenn sie wärmer oder kälter als die Umgebung sind), wodurch du in diesen Verhältnissen sehen kannst.
quality.toughness.desc=Du erhältst 1 Bonus-Edge für Schadenswiderstandsproben. Wenn du diesen Punkt nicht sofort für diese Probe ausgibst, verfällt er.
quality.toxin_resistance.desc=Du erhältst 1 Bonus-Edge, wenn du eine Toxinwiderstandsprobe ablegst (S. 125). Wenn du diesen Punkt nicht sofort für diese Probe ausgibst, verfällt er.
quality.will_to_live.desc=Für jede Stufe dieses Vorteils erhältst du 2 Kästchen für Überzähligen Schaden (siehe S. 124).
quality.addiction.desc=Du kannst in keiner Form Edge erhalten oder ausgeben, wenn du unter Entzugserscheinungen leidest. Der Entzugseintritt (die Zeit, die vergeht, bevor du den nächsten Schuss brauchst) hängt von der Stufe der Abhängigkeit ab und kann in der Tabelle Entzugserscheinungen (S. 77) abgelesen werden. Wenn du Entzugserscheinungen hast, erhältst du einen Würfelpoolmalus von -2 auf alle Proben. Dieser Malus steigt jedes Mal um 1, wenn ein Entzugseintritt vergeht, ohne dass du deine Abhängigkeit befriedigen konntest.
quality.allergy_common_mild.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -2 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S.78)
quality.allergy_common_moderate.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S. 78)
quality.allergy_common_severe.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. Außerdem erleidest du jede Minute 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_common_extreme.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -6 auf alle Proben und erleidest alle 30 Sekunden 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_seasonal_mild.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -2 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S.78)
quality.allergy_seasonal_moderate.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S. 78)
quality.allergy_seasonal_severe.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. Außerdem erleidest du jede Minute 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_seasonal_extreme.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -6 auf alle Proben und erleidest alle 30 Sekunden 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_uncommon_mild.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -2 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S.78)
quality.allergy_uncommon_moderate.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S. 78)
quality.allergy_uncommon_severe.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. Außerdem erleidest du jede Minute 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_uncommon_extreme.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -6 auf alle Proben und erleidest alle 30 Sekunden 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_rare_mild.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -2 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S.78)
quality.allergy_rare_moderate.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. (s. auch S. 78)
quality.allergy_rare_severe.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -4 auf alle Proben, bei denen ein Körperliches Attribut beteiligt ist, wenn du unter dem Einfluss des Allergens stehst. Außerdem erleidest du jede Minute 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.allergy_rare_extreme.desc=Wenn du dem Allergen ausgesetzt bist, kannst du in keiner Form Edge erhalten oder ausgeben. Außerdem leidest du unter Sekundäreffekten, wie angegeben. Du erhältst einen Würfelpoolmalus von -6 auf alle Proben und erleidest alle 30 Sekunden 1 Kästchen Körperlichen Schaden ohne Widerstandsprobe, solange du dem Allergen ausgesetzt bist. (s. auch S. 78)
quality.ar_vertigo.desc=Du kannst in keiner Form Edge erhalten oder ausgeben, wenn du die AR in irgendeiner Weise benutzt. Außerdem erhältst du den Status Übelkeit (S. 55), wenn du die AR benutzt, und eine Stunde lang danach.
quality.astral_beacon.desc=Bei allen Proben mit Heimlichkeit auf der Astralebene giltst du als Ungeübt. Du kannst niemals die Metamagie Maskierung erlernen. Askennen-Proben gegen dich werden mit 1 Edge zusätzlich durchgeführt, und alle Schwellenwerte dabei werden um 1 (bis auf ein Minimum von 1) reduziert. Proben auf astrales Spurenlesen gegen dich werden mit 2 Edge zusätzlich durchgeführt, und alle Schwellenwerte dabei werden halbiert.
quality.bad_luck.desc=Patzer treten häufiger auf. Beim Berechnen eines Patzers musst du 1en und 2en zählen. Das betrifft keine kritischen Patzer, nur normale Patzer.
quality.bad_rep.desc=Du kannst bei sozialen Proben kein Edge ausgeben. Wenn du an einer Teamworkprobe für eine soziale Probe beteiligt bist, kann niemand Edge ausgeben, und die Gegenseite erhält 1 Edge.
quality.combat_paralysis.desc=Dein Initiativeergebnis wird zu Kampfbeginn halbiert. Du kannst die Handlungen Bewegen und Sprinten in der ersten Runde nicht durchführen, und du handelst in dieser Runde als Letzter. Deine Bewegungsfähigkeit wird nach der ersten Runde wiederhergestellt, aber das Initiativeergebnis bleibt unverändert halbiert.
quality.dependents.desc=Wähle eine Stufe der Verpflichtungen. Verpflichtungen der Stufe 1 sind das Äquivalent eines Familienmitglieds, das zwar nicht bei dir lebt, aber dennoch deine Unterstützung braucht. 5 % aller Einnahmen gehen an diese Person. Verpflichtungen der Stufe 2 verursachen höhere Fixkosten, wie die Unterstützung einer zuwendungsbedürftigen geliebten Person, eines Kindes oder einer kleinen Familie. Diese Stufe kostet den Runner 10 % aller Einkünfte. Verpflichtungen der Stufe 3 sind in den Schatten selten, weil die meisten Runner keine normale Familie und kein zweites Leben außerhalb der Schatten haben, für die diese Stufe steht. Diese Stufe kostet den Runner 25 % aller Einkünfte.\nIm Zusammenhang mit diesem Nachteil bedeuten „Einkünfte“ alles verdiente Geld des Runners. Bezahlungen für Jobs, Erlöse aus dem Verkauf gestohlener Waren oder Daten oder sogar Glücksspielgewinne. Die Leute, die dir wichtig sind, werden reich, wenn du es wirst!
quality.distinctive_style.desc=Du kannst kein Edge erhalten oder ausgeben, wenn du nicht dein charakteristisches auffälliges Auftreten zeigst. Andere Personen erhalten einen Würfelpoolbonus von +2, wenn sie sich mit einer Probe auf Erinnerungsvermögen (S. 37) an dein Aussehen oder daran erinnern wollen, ob sie dich bereits gesehen haben.
quality.elf_poser.desc=Elfen, Orks und Trolle erhalten 1 Edge bei Proben auf Einfluss (Gebräuche), die sie gegen dich ablegen. Nur für Menschen und Orks erhältlich.
quality.glass_jaw.desc=Du hast pro Stufe dieses Nachteils 1 Kästchen für Betäubungsschaden weniger, bis zu einem Minimum von 2 Kästchen.
quality.gremlins.desc=Immer, wenn du ein Gerät benutzt, musst du mit 2W6 würfeln. Wenn einer der beiden Würfel eine 1 zeigt, funktioniert das Gerät nicht richtig, so als ob du einen Patzer gewürfelt hast. Du kannst das Gerät mit einer Nebenhandlung schnell resetten und wieder benutzen. Wenn du zwei Einsen würfelst, versagt das Gerät katastrophal, so als ob du einen Kritischen Patzer gewürfelt hast. Das Gerät ist kaputt, und du könntest einiges an Schmerzen durch Schock oder Biofeedback bekommen.
quality.honorbound.desc=Du kannst, wenn du gegen ein Gebot deines Kodex verstoßen hast, 24 Stunden lang kein Edge erhalten oder ausgeben. Wenn gegen dasselbe Gebot mehrmals verstoßen wurde oder du innerhalb dieser 24 Stunden noch einmal dagegen verstößt, addiert jeder dieser Verstöße zusätzliche 48 Stunden zu den ursprünglichen 24. Wenn gegen ein anderes Gebot verstoßen wird, entstehen dadurch neue 24 Stunden ohne Edge, und es gelten dieselben Regeln für weitere Verstöße. Beispiele zu Kodizes und Geboten siehe Kasten Ehrenkodex (S. 79). 
quality.impaired.desc=Pro Stufe sinkt das Maximum des Charakters im gewählten Attribut um 1, maximal aber auf 2.
quality.incompetent.desc=Wähle für diesen Nachteil eine Fertigkeit. Du kannst in der gewählten Fertigkeit keine Stufen erreichen. Du darfst Inkompetenz nicht für eine Fertigkeit wählen, die du niemals einsetzen könntest. Daher kannst du keine magische Fertigkeit wählen, wenn du kein Magieattribut hast, und nicht Tasken wählen, wenn du keine Resonanz besitzt. Dieser Nachteil kann nur einmal gewählt werden.
quality.in_debt.desc=Wenn du bei der Charaktererschaffung Karma für Geld ausgibst, erhältst du für jeden Punkt Karma, den du in diesen Nachteil investierst, 5.000 Nuyen statt 2.000 Nuyen. Jeder Punkt, den du ausgibst, führt außerdem zu 5.000 Nuyen Schulden bei jemandem, der sehr gefährlich und fähig ist, sie einzutreiben. Pro Punkt Karma, den du in diesen Nachteil investierst, musst du monatlich 500 Nuyen an deinen Gläubiger zahlen, womit du nur die Zinsen bedienst, nicht aber den Kredit tilgst. Wenn du nicht bezahlst, suchen die Gläubiger dich auf. Dieser Nachteil kann nur durch Geld entfernt werden. Wenn die Schulden abbezahlt sind, ist der Nachteil entfernt. Dieser Nachteil kann nur bei der Charaktererschaffung gewählt werden, nicht während des Spielverlaufs.
quality.insomnia.desc=Ohne guten Schlaf kannst du Edge nicht so zurückerhalten oder ausgeben, wie du es gerne hättest. Du musst an jedem Tag eine erfolgreiche Probe auf Konstitution + Willenskraft (3) ablegen, um eine erholsame Nacht lang zu schlafen. Misslingt die Probe, kannst du am folgenden Tag nicht mehr als insgesamt 2 Edge erhalten, egal aus welcher Quelle. Außerdem kannst du an diesem Tag bei keiner Probe mehr als 2 Edge ausgeben. Die Verwendung eines Schlafregulators (S. 295) senkt den Schwellenwert der Probe auf 1. Medikamente (für 50 Nuyen pro Dosis) senken den Schwellenwert auf 2.
quality.loss_confidence.desc=Wa?hrend einer Begegnung musst du als Nebenhandlung eine Probe auf Willenskraft (2) ablegen. Misslingt die Probe, kannst du wa?hrend der gesamten Begegnung kein Edge erhalten oder ausgeben.
quality.low_pain_tolerance.desc=Alle Verletzungsmodifikatoren werden verdoppelt.
quality.ork_poser.desc=Elfen, Orks und Trolle erhalten 1 Edge bei Proben auf Einfluss (Gebräuche), die sie gegen dich ablegen. Nur für Elfen und Menschen erhältlich.
quality.prejudiced.desc=Wähle eine bestimmte Gruppe oder Art von Personen aus. Du kannst kein Edge erhalten oder ausgeben, wenn die Objekte deiner Vorurteile in deiner Nähe sind (außer, wenn du gegen sie kämpfst).
quality.scorched.desc=Du kannst kein Edge ausgeben, wenn du die Matrix benutzt. Das betrifft auch den Einsatz von Kommlinks, Smartlinks und allen anderen Quellen für Daten, die über den Äther kommen.
quality.sensitive_system.desc=Die Essenzkosten für Cyberware, Bioware und Nanoware werden verdoppelt. Gentech ist davon nicht betroffen. Du darfst diesen Vorteil nicht wählen, wenn du das Attribut Magie oder Resonanz besitzt. (Nanoware und Gentech werden in zukünftigen Büchern behandelt.)
quality.simsense_vertigo.desc=Du kannst kein Edge erhalten oder ausgeben, wenn du die Matrix über VR benutzt. Außerdem erhältst du den Status Übelkeit (S. 55) eine Stunde lang, nachdem du aus der Matrix ausloggst.
quality.sinner.desc=Du bezahlst Steuern an die Körperschaft, von der du die SIN hast - Megakonzern oder Nation. Das äußert sich in einer Erhöhung der Lebensstilkosten, die mit dieser SIN verknüpft sind, um 10 %.\nWegen der Daten in der Globalen SIN-Registratur bist du leichter zu verfolgen oder zu identifizieren, was Gegnern 1 Edge verschafft, wenn sie die Handlung Icon aufspüren gegen dich versuchen.
quality.social_stress.desc=Wähle einen bestimmten gesellschaftlichen Stressreiz aus. Wenn du diesem Reiz ausgesetzt bist, musst du als Nebenhandlung eine Probe auf Charisma (2) ablegen. Misslingt die Probe, kannst du Edge weder erhalten noch ausgeben, bis du Erfolg hast oder die stressende Situation vorüber ist. Du kannst diese Probe verweigern, aber dann erhält jeder, der eine Probe gegen dich ablegt, 1 Bonus-Edge.
quality.spirit_bane.desc=Bei Auswahl dieses Nachteils wählst du eine Art von Geistern oder Sprites aus. Geister/Sprites dieser Kategorie erhalten einen Bonus-Edgepunkt, wenn du eine Probe auf Beschwören bzw. Tasken gegen sie ablegst. Dieser Nachteil kann mehrmals gewählt werden, wobei du jedes Mal eine andere Art von Geistern/Sprites auswählst.\nIm Kampf greifen Geister/Sprites dieser Art dich zuerst an und lassen nicht von dir ab, was so weit gehen kann, dass sie deine Leiche verstümmeln oder dein Deck zerstören, wenn sie nichts anderes zu tun haben.
quality.sprite_bane.desc=Feindliche Bei Auswahl dieses Nachteils wählst du eine Art von Geistern oder Sprites aus. Geister/Sprites dieser Kategorie erhalten einen Bonus-Edgepunkt, wenn du eine Probe auf Beschwören bzw. Tasken gegen sie ablegst. Dieser Nachteil kann mehrmals gewählt werden, wobei du jedes Mal eine andere Art von Geistern/Sprites auswählst.\nIm Kampf greifen Geister/Sprites dieser Art dich zuerst an und lassen nicht von dir ab, was so weit gehen kann, dass sie deine Leiche verstümmeln oder dein Deck zerstören, wenn sie nichts anderes zu tun haben.
quality.uncouth.desc=Du kannst kein Edge bei Proben ausgeben, die Charisma verwenden.
quality.uneducated.desc=Du kannst kein Edge bei Proben ausgeben, die Logik verwenden (gilt nicht für Entzugs- und Schwundwiderstandsproben).
quality.unsteady_hands.desc=Du kannst kein Edge bei Proben ausgeben, die Geschicklichkeit verwenden, wenn deine Hände beteiligt sind (dazu gehören Proben auf Heimlichkeit, wenn du Taschenspielertricks abziehen willst, Angriffsproben mit Waffen, die du in der Hand hältst, nicht aber Athletikproben zum Laufen, auch wenn die Hände dabei in Bewegung sind).
quality.weak_immune_system.desc=Du kannst kein Edge ausgeben, um der Wirkung einer Infektion zu widerstehen. Der Schwellenwert für den Widerstand gegen eine Infektion, der du ausgesetzt bist, steigt um 1. Wenn du unter der Wirkung einer Infektion leidest, erhältst du einen Würfelpoolmalus von -1 auf alle Proben.
ammotype.regular.desc=Die klassische Kugel bzw. das moderne Vollmantelgeschoss.
ammotype.apds.desc=„Armor-Piercing Discarding Sabot“ macht einem einen Knoten in die Zunge, deshalb benutzt jeder nur die Abkürzung APDS. Diese Patronen haben eine Treibhülse, die eine höhere Mündungsgeschwindigkeit ermöglicht, mit der ein panzerbrechendes Geschoss abgefeuert wird, das in der Lage ist, Körperpanzerung zu durchdringen. APDS-Munition wird selten hülsenlos hergestellt, da die Treibhülsen ohnehin ausgeworfen werden.
ammotype.explosive.desc=Diese Kugeln enthalten eine Hohlladung, die beim Aufprall explodiert. Explosivmunition zündet bei einem Kritischen Patzer fehl. Wenn das passiert, muss der Schütze Widerstand gegen den normalen Schadenswert der Waffe leisten (und vergiss dabei nicht den Schadensmodifikator für die Explosivmunition). Der eigentliche Angriff verfehlt sein Ziel, und die Waffe wird zerstört.
ammotype.flechette.desc=Die Ladung von Flechettemunition besteht aus winzigen, dicht gepackten Metallsplittern oder Metallkügelchen (je nach Waffe). Sie streuen auf ihrer Flugbahn leicht, was es wahrscheinlicher macht, eine ungeschützte Stelle zu treffen, aber sie sind im Vergleich zu anderer Munition klein und übertragen weniger kinetische Energie auf das Ziel.
ammotype.gel.desc=Diese Gelgeschosse sehen beim Aufprall wie plattgedrückte Heidelbeeren aus. Sie werden häufig bei der Aufruhrbekämpfung oder als nichttödliche Option verwendet und eignen sich hervorragend, um eine Zielperson aus den Latschen zu hauen - wobei man nicht erwarten sollte, dass das auch bei Trollen funktioniert. Gelmunition verursacht Betäubungsschaden. Jemandem, der von Gelmunition getroffen wird, muss eine sofortige Probe auf Geschicklichkeit (2) oder Konstitution (4) (der Getroffene hat die Wahl) gelingen, ansonsten gerät er in den Status Liegend (S. 54). Salvenfeuer und vollautomatisches Feuer erhöhen den Schwellenwert dieser Probe um 1.
ammotype.stick_n_shock.desc=Schockermunition macht aus jeder normalen Waffe einen Taser. Die Kugeln verursachen Betäubungsschaden und versetzen das Ziel für 2 Kampfrunden in den Status Gebrutzelt, aber sie sind längst nicht so durchschlagskräftig wie normale Kugeln.
ammotype.apds_caseless.desc=„Armor-Piercing Discarding Sabot“ macht einem einen Knoten in die Zunge, deshalb benutzt jeder nur die Abkürzung APDS. Diese Patronen haben eine Treibhülse, die eine höhere Mündungsgeschwindigkeit ermöglicht, mit der ein panzerbrechendes Geschoss abgefeuert wird, das in der Lage ist, Körperpanzerung zu durchdringen. APDS-Munition wird selten hülsenlos hergestellt, da die Treibhülsen ohnehin ausgeworfen werden.
ammotype.explosive_caseless.desc=Diese Kugeln enthalten eine Hohlladung, die beim Aufprall explodiert. Explosivmunition zündet bei einem Kritischen Patzer fehl. Wenn das passiert, muss der Schütze Widerstand gegen den normalen Schadenswert der Waffe leisten (und vergiss dabei nicht den Schadensmodifikator für die Explosivmunition). Der eigentliche Angriff verfehlt sein Ziel, und die Waffe wird zerstört.
ammotype.flechette_caseless.desc=Die Ladung von Flechettemunition besteht aus winzigen, dicht gepackten Metallsplittern oder Metallkügelchen (je nach Waffe). Sie streuen auf ihrer Flugbahn leicht, was es wahrscheinlicher macht, eine ungeschützte Stelle zu treffen, aber sie sind im Vergleich zu anderer Munition klein und übertragen weniger kinetische Energie auf das Ziel.
ammotype.gel_caseless.desc=Diese Gelgeschosse sehen beim Aufprall wie plattgedrückte Heidelbeeren aus. Sie werden häufig bei der Aufruhrbekämpfung oder als nichttödliche Option verwendet und eignen sich hervorragend, um eine Zielperson aus den Latschen zu hauen - wobei man nicht erwarten sollte, dass das auch bei Trollen funktioniert. Gelmunition verursacht Betäubungsschaden. Jemandem, der von Gelmunition getroffen wird, muss eine sofortige Probe auf Geschicklichkeit (2) oder Konstitution (4) (der Getroffene hat die Wahl) gelingen, ansonsten gerät er in den Status Liegend (S. 54). Salvenfeuer und vollautomatisches Feuer erhöhen den Schwellenwert dieser Probe um 1.
ammotype.stick_n_shock_caseless.desc=Schockermunition macht aus jeder normalen Waffe einen Taser. Die Kugeln verursachen Betäubungsschaden und versetzen das Ziel für 2 Kampfrunden in den Status Gebrutzelt, aber sie sind längst nicht so durchschlagskräftig wie normale Kugeln.
ammotype.regular_caseless.desc=Die klassische Kugel bzw. das moderne Vollmantelgeschoss.

item.combat_axe.desc=Ob du nun Neal, der Feuerwehrmann, oder Neil, der Orkbarbar, bist \u2013 eine Axt kann ein Werkzeug oder eine tödliche Waffe sein. Die Kampfaxt hat eine einfache oder doppelte Klinge und eine gehärtete, mit einer Sprungfeder versehene Stoßspitze am Stielende, um Glasscheiben einzuschlagen oder dem Gegner eine unangenehme Überraschung zu bereiten. In den übermuskulösen Händen eines Straßenkämpfers der 2080er kann diese Waffe tödlicher sein als eine Feuerwaffe.
item.combat_knife.desc=Ein einfaches, elegantes und effizientes Tötungswerkzeug mit einer Meißelspitze, die mit Leichtigkeit Panzerung durchdringen kann. Außerdem ist es karbonbeschichtet und geschwärzt, sodass keine Lichtreflexionen den anschleichenden Kämpfer verraten. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden.
item.forearm_snap_blades.desc=Du magst keine Implantate, hättest aber trotzdem gerne drei rasiermesserscharfe Klingen, die aus deinem Unterarm hervorschnappen? Dann ist dies die richtige Waffe für dich. Die Klingen lassen sich durch einen Unterarm-Muskelbefehl oder ein WiFi-Signal aus- und einfahren. Beides erfordert jeweils eine Nebenhandlung.
item.knife.desc=Ein Oberbegriff für eine Vielzahl unterschiedlicher tödlicher Klingenwaffen. Wie es genau aussieht, bleibt jedem selbst überlassen, aber die Werte sind alle gleich. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden.
item.katana.desc=Das legendäre zweihändige Schwert der Samurai gehört zur Standardausrüstung jedes Trideo-Shadowrunners. Draußen auf der Straße belehrt die tödliche Klinge all jene eines Besseren, die glauben, dieses Klischee diene nur der Angeberei.
item.survival_knife.desc=Dieses spezielle Design mit einer geraden Klinge auf der einen und einer gezahnten auf der anderen Seite hat den eigentlichen \u201EÜberlebens\u201C-Teil seines Namens im Griff versteckt. Dort findet man ein GPS, ein Miniatur-Multitool und ein Mikro-Feuerzeug. Die Klinge ist mit einer fotovoltaischen Schicht überzogen, die die Klinge schwärzt und vor unerwünschten Reflexionen schützt; in aufgeladenem Zustand kann diese Schicht aktiviert werden und liefert für zwei Stunden Licht. Die Kampfwerte sind die gleichen wie beim Kampfmesser. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden. WiFi-Vorteil: Wenn man das Messer in der Hand hält, projiziert es ein ARO mit den Umgebungskarten und der eigenen GPS-Position sowie die grundlegenden Vitalmonitor-Daten des Benutzers.
item.polearm.desc=Man nehme einen langen Stock und füge an einem Ende ein Dutzend Varianten an scharfen Klingen hinzu \u2013 fertig ist die Stangenwaffe. Da diese Waffen ursprünglich dem Zweck dienten, eine gewisse Distanz zwischen Angreifer und Verteidiger zu wahren oder berittene Kämpfer anzugreifen, findet man sie nicht allzu oft auf der Straße. Es ist praktisch unmöglich, sie zu verbergen, selbst für einen Troll, aber sie eignen sich sehr gut dazu, Probleme auf Distanz zu halten.
item.sword.desc=Eine schwere einhändige Klingenwaffe, die es in einer Vielzahl von Stilen gibt. Tausende von Jahren war dies die dominierende Kriegswaffe, bis die Feuerwaffe auf der Bildfläche erschien.
item.club.desc=Die aufgelisteten Werte können für eine große Auswahl an Gegenständen verwendet werden, etwa einen Axtstiel, einen Baseballschläger, einen Radschlüssel, einen Schraubenschlüssel oder einfach ein Kantholz mit ein paar Nägeln darin. Der angegebene Preis gilt für einen professionell hergestellten, altehrwürdigen Polizeischlagstock, aber es dürfte nicht schwierig sein, im Notfall irgendwo einen improvisierten Knüppel für lau zu finden.
item.extendable_baton.desc=Dieser ausfahrbare Knüppel kann mit einer Handgelenkbewegung oder einem WiFi-Signal ausgefahren werden. In eingezogenem Zustand ist er leichter zu verbergen (Tarnbarkeit 4 im eingefahrenen, 2 im ausgefahrenen Zustand).\nDas Ausfahren oder Zusammenschieben des Teleskopschlagstocks erfordert eine Nebenhandlung.
item.sab.desc=Ein kleiner, federnder Knüppel, ein Stück mit Leder überzogenes Eisen oder Blei, oder ein Säckchen voller Sand zu dem Zweck, jemandem damit eins überzuziehen. Der Totschläger lässt sich leicht verbergen, oft hat er in einer Handfläche Platz (Tarnbarkeit 4).
item.staff.desc=Ein langer, schwerer und sehr schlagkräftiger Stab. Es gibt ihn als Kompositstab, in Hartholz, Hartstahl und anderen Materialien.
item.stun_baton.desc=Diese elektrische Aufruhrbekämpfungswaffe gilt als Symbol der Konzern- und Regierungsunterdrücker, kann aber auch in den Schatten nutzbringend eingesetzt werden. Der Betäubungsschlagstock enthält zehn Ladungen. Wenn er am Stromnetz hängt, lädt sich der Schlagstock mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden wieder auf.
item.telescopic_staff.desc=Ein großer Stock, der als kleiner Stock anfängt. Dieser Metall- und Kompositstab kann zur Größe eines Betäubungsschlagstocks oder eines Schwertes zusammengeschoben werden. Ausgefahren und arretiert wird er, indem man ihn herumwirbelt oder in beide Richtungen ausschlägt und dann den Griff dreht, um ihn einzurasten. Alternativ kann er auch durch ein WiFi-Signal aktiviert werden. Einen Teleskopstab auszufahren oder einzuschieben erfordert eine Nebenhandlung.
item.bike_chain.desc=Go-Gangs verwenden gern die ausrangierten Ersatzteile ihrer Schrott-Bikes, um andere damit zu vermöbeln. Diese schweren Metallketten sind brutale Waffen, vor allem wenn sie vom fahrenden Motorrad aus geschwungen werden. Du erhältst eine zusätzliche Nebenhandlung, wenn du mit dieser Waffe die Nebenhandlung Zu Fall bringen ausführst.
item.bullwhip.desc=Die klassische Lederpeitsche, wie sie seit Jahrhunderten benutzt wird, um Nutzvieh und anderes \u201Elebendes Inventar\u201C unter Kontrolle zu halten. Gegen nackte Haut äußerst brutal, aber für jemanden mit Panzerung hauptsächlich eine Stolperfalle. Du erhältst eine zusätzliche Nebenhandlung, wenn du mit dieser Waffe die Nebenhandlung Zu Fall bringen ausführst.
item.knucks.desc=Ob eine Rolle Münzen in der Faust (aber wer hat die schon herumliegen?), ein Messing-Schlagring oder Handschuhe vom Typ Ares Hardliner \u2013 diese Waffen stufen eine Faust von \u201Evielleicht tödlich\u201C zu \u201Ewahrscheinlich tödlich\u201C hoch, indem sie die Hand durch Metall oder Komposit verstärken.
item.shock_gloves.desc=Isolierte Handschuhe mit einem integrierten System, das in aktiviertem Zustand bei Kontakt einen elektrischen Schock austeilt. Die Handschuhe verursachen beim Ziel zusätzlich zum Schaden für 2 Kampfrunden den Status Gebrutzelt (S.54) und enthalten zehn Ladungen, bevor sie an das Stromnetz angeschlossen und neu aufgeladen werden müssen (mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden). Die Entladung wird durch einen Muskelbefehl oder ein WiFi-Signal ausgelöst, was eine Nebenhandlung erfordert.
item.monofilament_whip.desc=Seit den 2050ern eine der gefürchtetsten Waffen auf den Straßen der Sechsten Welt. In den Händen eines geübten Benutzers kann diese furchtbare Waffe mit jedem Millimeter ihrer zwei Meter langen Monofilamentschnur durch Panzerung, Haut und Knochen schneiden, als bestünden sie aus Butter. In den falschen Händen, aber auch schon mit einer falschen Bewegung einer geübten Hand, kann diese Waffe den Benutzer selbst auf die Suche nach einer Arm- oder Beinprothese schicken. Die Schnur wird in einem speziellen Fach im Griff verwahrt und hat ein kleines Gewicht am Ende, das sich aus der Verankerung löst, wenn die Waffe aktiviert wird. Patzer werden abgehandelt wie üblich, aber bei einem Kritischen Patzer muss der Benutzer immer gegen den Basisschaden der Waffe Widerstand leisten.
item.bow3.desc=Alles vom traditionellen Langbogen aus Glasfaser oder Holz bis zum modernen Kompositbogen. Diese archaischen Waffen findet man in den 2080ern nicht sehr oft auf den Straßen. Sie haben den Vorteil, vor Hackern sicher zu sein, solange man die abgefahreneren Erweiterungen weglässt. Einen Pfeil einzulegen erfordert eine Haupthandlung Waffe bereit machen (S. 46). Bögen haben eine Stufe, die die Mindeststärke angibt, die man braucht, um die Waffe bedienen zu können.\nAußerdem hängt der Schaden der Waffe von der Stufe ab (die Maximalstufe beträgt 14). Auch Pfeile haben eine Stufe, und diese muss mindestens so hoch wie die Stufe des Bogens sein.
item.bow4.desc=Alles vom traditionellen Langbogen aus Glasfaser oder Holz bis zum modernen Kompositbogen. Diese archaischen Waffen findet man in den 2080ern nicht sehr oft auf den Straßen. Sie haben den Vorteil, vor Hackern sicher zu sein, solange man die abgefahreneren Erweiterungen weglässt. Einen Pfeil einzulegen erfordert eine Haupthandlung Waffe bereit machen (S. 46). Bögen haben eine Stufe, die die Mindeststärke angibt, die man braucht, um die Waffe bedienen zu können.\nAußerdem hängt der Schaden der Waffe von der Stufe ab (die Maximalstufe beträgt 14). Auch Pfeile haben eine Stufe, und diese muss mindestens so hoch wie die Stufe des Bogens sein.
item.bow5.desc=Alles vom traditionellen Langbogen aus Glasfaser oder Holz bis zum modernen Kompositbogen. Diese archaischen Waffen findet man in den 2080ern nicht sehr oft auf den Straßen. Sie haben den Vorteil, vor Hackern sicher zu sein, solange man die abgefahreneren Erweiterungen weglässt. Einen Pfeil einzulegen erfordert eine Haupthandlung Waffe bereit machen (S. 46). Bögen haben eine Stufe, die die Mindeststärke angibt, die man braucht, um die Waffe bedienen zu können.\nAußerdem hängt der Schaden der Waffe von der Stufe ab (die Maximalstufe beträgt 14). Auch Pfeile haben eine Stufe, und diese muss mindestens so hoch wie die Stufe des Bogens sein.
item.bow6.desc=Alles vom traditionellen Langbogen aus Glasfaser oder Holz bis zum modernen Kompositbogen. Diese archaischen Waffen findet man in den 2080ern nicht sehr oft auf den Straßen. Sie haben den Vorteil, vor Hackern sicher zu sein, solange man die abgefahreneren Erweiterungen weglässt. Einen Pfeil einzulegen erfordert eine Haupthandlung Waffe bereit machen (S. 46). Bögen haben eine Stufe, die die Mindeststärke angibt, die man braucht, um die Waffe bedienen zu können.\nAußerdem hängt der Schaden der Waffe von der Stufe ab (die Maximalstufe beträgt 14). Auch Pfeile haben eine Stufe, und diese muss mindestens so hoch wie die Stufe des Bogens sein.
