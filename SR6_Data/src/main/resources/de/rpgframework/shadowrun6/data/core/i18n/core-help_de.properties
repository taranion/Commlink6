item.credstick_ebony.desc=Credstick Das Bargeld des späten 21. Jahrhunderts. Ein beglaubigter Credstick ist nicht auf eine bestimmte Person registriert. Die darauf kodierten Geldbeträge gehören dem Besitzer und erfordern keine spezielle ID oder Authentifizierung, was natürlich auch bedeutet, dass sie gestohlen werden können. Aber wer wagt es schon, einen Runner auszurauben? Man muss einen Credstick in einen Universal-Datenport stecken, um Geld von ihm oder auf ihn zu transferieren. Das macht diese Zahlungsmittel so unglaublich beliebt bei Shadowrunnern und den Mr Johnsons, die sie anheuern. Die Farbe eines Credsticks gibt an, wie viel Geld auf ihm gespeichert werden kann - das ist der Maximalbetrag, den der Stick enthalten kann, nicht der Betrag, der darauf ist. Die einzige externe Identifizierungsmöglichkeit eines Credsticks ist ein schmales farbiges Band auf dem Gehäuse, das auf der Straße häufig abgekratzt wird, um bei Transaktionen zu verbergen, um welche Sorte Stick es sich handelt.
item.kit.desc=Eine Kiste ist tragbar und enthält das grundlegende Werkzeug für Standardreparaturen. Ohne zumindest eine Kiste ist eine Fertigkeit unter Umständen gar nicht anwendbar.
item.shop.desc=Einen Laden kann man hinten in einem Lieferwagen transportieren. Er enthält kompliziertere Werkzeuge für Bau und Reparatur. Ein Laden gewährt einen Würfelpoolbonus von +1 für entsprechende Proben vor Ort und enthält die wichtigsten Standardersatzteile.
item.facility.desc=Eine Werkstatt muss in einem Gebäude untergebracht werden und ist wegen der schweren und unhandlichen Maschinen, die sie enthält, nicht transportabel, aber dafür kann sie auch für sehr komplizierte Bauten und Modifikationen verwendet werden. Eine Werkstatt bietet den gleichen Bonus und die gleichen Ersatzteile wie ein Laden, dazu 1 Bonus-Edge für Bauen/Reparieren-Proben, und bei Ausgedehnten Proben innerhalb der Werkstatt kann Edge eingesetzt werden.
item.binoculars.desc=Ferngläser werden üblicherweise in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Sie sind in optischen (die lediglich mit einer Bildverbindung ausgestattet werden können) und elektronischen Versionen erhältlich (die eine Vielzahl von Sichtverstärkungen aufnehmen können). Spruchzauberer können ein optisches Fernglas verwenden, um Zauber gegen ferne Ziele zu wirken.
item.binoculars_optical.desc=Ferngläser werden üblicherweise in der Hand gehalten und sind mit eingebauter Sichtvergrößerung ausgestattet. Sie sind in optischen (die lediglich mit einer Bildverbindung ausgestattet werden können) und elektronischen Versionen erhältlich (die eine Vielzahl von Sichtverstärkungen aufnehmen können). Spruchzauberer können ein optisches Fernglas verwenden, um Zauber gegen ferne Ziele zu wirken.
item.camera.desc=Kameras sind recht weit verbreitet. Sie können Fotos, Videos oder Trideos aufnehmen und mit Sicht- und Audioverstärkungen ausgestattet werden. Es gibt auch Mikrokameras mit Kapazität 1.
item.microcamera.desc=Kameras sind recht weit verbreitet. Sie können Fotos, Videos oder Trideos aufnehmen und mit Sicht- und Audioverstärkungen ausgestattet werden. Es gibt auch Mikrokameras mit Kapazität 1.
item.contacts.desc=Kontaktlinsen werden direkt auf dem Auge getragen und sind praktisch nicht zu entdecken, doch dafür bieten sie auch nur wenig Raum für Sichtverstärkungen. Kontaktlinsen sind immer kabellos.
item.endoscope.desc=Dieses Glasfaserkabel ist mindestens einen Meter lang, wobei die ersten 20 Zentimeter auf jeder Seite aus myomerem Seil (S. 281) und einer optischen Linse bestehen. Es erlaubt dem Benutzer, um die Ecke, unter Türspalten hindurch oder in enge Spalte zu schauen. Endoskope sind in mehreren Längen erhältlich, allerdings können längere Segmente unhandlich sein.
item.glasses.desc=Brillen sind Linsen in einem Leichtbaurahmen, der auf der Nase getragen wird. Sie sind in zahlreichen Stilen erhältlich, und eine Brille mit Sichtverstärkungen ist auf den ersten Blick nur schwer von einer normalen Brille oder Sonnenbrille zu unterscheiden.
item.goggles.desc=Ein Sichtgerät ist relativ groß und wuchtig und wird am Kopf befestigt, wodurch es nicht so leicht zu entfernen ist. Dank ihrer Größe können Sichtgeräte eine Vielzahl an Sichtverstärkungen aufnehmen.
item.imaging_scope_single.desc=Dies sind Sichtvergrößerer und Anzeigegeräte, die für gewöhnlich auf Waffen montiert werden (s. Waffenzubehör, S. 261).
item.mage-sight-goggles.desc=Dieses schwere Sichtgerät ist mit einem myomerem Seil (S. 281) verbunden, das um ein Glasfaserkabel gewunden ist, welches in einer optischen Linse endet. Das Seil ist in Längen von 10, 20 oder 30 Metern erhältlich und erlaubt einem Spruchzauberer, Sichtkontakt aufrechtzuerhalten, während er selbst nicht zu sehen ist.
item.monocle.desc=Ein Monokel wird an einem Stirnband oder Helm mit einem herunterklappbaren Arm oder (für den altmodischen Look) an einer Kette getragen. Die Kettenversion ist mit einem leichten Adhäsivstoff versehen, sodass man nicht die ganze Zeit das Auge zusammenkneifen muss.
item.flare_compensation.desc=Dieses Zubehör schützt sowohl vor blendenden Lichtblitzen als auch vor einfachem grellem Licht. Blitzkompensation gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung gegen grelles Licht hat, und hilft gegen Lichtblitze, wie sie etwa von einem Flash-Pack (S. 263) hervorgerufen werden.
item.image_link.desc=Die Bildverbindung zeigt visuelle Informationen (Text, Bilder, Filme, die aktuelle Uhrzeit usw.) im Blickfeld des Benutzers an. Üblicherweise geschieht dies mithilfe von AROs, aber man kann im Prinzip alles darauf anzeigen, was man will. Ein Team kann die Bildverbindung nutzen, um taktische und Lageinformationen in Echtzeit zu teilen. Man braucht eine Bildverbindung, um die AR wirklich zu sehen und an der modernen Welt teilzuhaben. Cyberware Version siehe Seite 286.
item.low_light_vision.desc=Dieses Zubehör erlaubt es einem, sogar dann noch normal zu sehen, wenn die Sterne die einzige Lichtquelle am Himmel sind. Restlichtverstärkung gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung hat, die schwaches Licht ausgleicht.
item.smartlink.desc=Dies ist die benutzerseitige Komponente des Smartgunsystems (S. 260). Ein Smartlink zeigt die Entfernung zu verschiedenen Zielen sowie den Munitionsstand (und die Art der Munition) an, und sie projiziert einen Zielpunkt an die Stelle, auf die die Waffe gerichtet ist, sofern der Punkt innerhalb des Sichtfelds des Benutzers liegt.
item.thermographic_vision.desc=Diese Sichtverstärkung ermöglicht das Sehen im infraroten Spektrum, wodurch man Hitzemuster erkennen kann. Das ist eine sehr praktische Methode, um Lebewesen in völliger Dunkelheit zu entdecken, um zu prüfen, ob ein Motor oder eine Maschine vor Kurzem gelaufen ist, und für ähnliche Zwecke. Infrarotsicht gewährt 1 Bonus-Edge, wenn die Gegenseite keine Sichtverstärkung hat, um schwaches Licht oder sogar völlige Dunkelheit auszugleichen.
item.ultrasound_link.desc=Dieses Zubehör liefert eine visuelle Darstellung der Daten eines Ultraschallsensors. Siehe Ultraschall, Seite 278.
item.vision_enhancement.desc=Dieses Zubehör schärft die Sicht eines Charakters auf alle Entfernungen und bietet ihm eine Sehschärfe, die eher der eines durchschnittlichen Falken als der eines durchschnittlichen Metamenschen ähnelt. Das System gewährt einen Würfelpoolbonus von +1 auf alle visuellen Wahrnehmungsproben.
item.vision_magnification.desc=Diese Zoomfunktion vergrößert die Sicht digital um das bis zu 50-Fache, wodurch man weit entfernte Ziele besser sehen kann. Die Angriffswerte für die Entfernungen Mittel, Weit und Sehr weit erhöhen sich um 2, sofern der verwendete Angriff überhaupt einen Angriffswert in der betreffenden Entfernung hat.
item.directional_microphone.desc=Mit diesem Mikrofon kann man Unterhaltungen in bis zu 100 Metern Entfernung belauschen. Das Mikrofon muss auf das gewünschte Abhörziel gerichtet sein, und feste Objekte oder laute Geräusche innerhalb der Abhörlinie stören den Effekt. 276 
item.earbuds.desc=Diese ergonomischen Ohrstöpsel sind schwer zu entdecken und noch schwerer von den normalen Ohrstöpseln zu unterscheiden, die Bestandteil jedes Musikplayers und Kommlinks sind.
item.headphones.desc=Ein komplettes Headset mit verstellbaren Kopfriemen. Dank ihrer Größe haben sie eine größere Kapazität für Audioverstärkungen als Ohrstöpsel.
item.laser_microphone.desc=Dieser Sensor wirft einen Laserstrahl gegen eine dünne, feste Oberfläche (z. B. eine Fensterscheibe), liest die Vibrationen auf der Oberfläche und übersetzt sie in die Geräusche, die auf der anderen Seite der Oberfläche ertönen. Die maximale Reichweite beträgt 100 Meter.
item.omnidirectional_microphone.desc=Ein normales omnidirektionales Audioaufnahmegerät, für gewöhnlich eingebaut in oder (drahtlos oder per Kabel) verbunden mit einem Kommlink oder einem anderen Aufnahmegerät. Die maximale Reichweite beträgt 100 Meter. Mikroversionen sind mit einer Kapazität von 1 erhältlich, haben aber nur eine Reichweite von 5 Metern.
item.audio_enhancement.desc=Eine Audioverbesserung erlaubt es dem Anwender, ein breiteres Spektrum an Audiofrequenzen zu hören, einschließlich Infra- und Ultraschall, die außerhalb des normalen metamenschlichen Hörspektrums liegen. Der Anwender erkennt außerdem feinste Nuancen und kann ablenkende Hintergrundgeräusche ausblenden. Dieses System gewährt einen Würfelpoolbonus von +1 für alle Wahrnehmungsproben zum Hören.
item.select_sound_filter.desc=Dieses Zubehör filtert Hintergrundgeräusche aus und erlaubt dem Anwender, sich auf bestimmte Geräusche oder Geräuschmuster zu konzentrieren. Darüber hinaus bietet es Sprach-, Wort- und Geräuschmustererkennung. Das System kann eine Anzahl an ausgewählten Geräuschgruppen bis zu seiner Stufe laden (etwa die Schritte einer patrouillierenden Wache, ein bestimmtes Wort oder die Rotorgeräusche eines näher kommenden Hubschraubers). Man kann immer nur einer Geräuschgruppe aktiv zuhören, aber die anderen kann man für späteres Playback aufzeichnen oder sie so einstellen, dass sie einen Alarm auslösen, wenn sie aktiviert werden. Das System kann eine Stufe von 1 bis 3 haben.
item.spatial_recognizer.desc=Dieses Audiozubehör lokalisiert die Quelle eines Geräusches. Der Benutzer erhält 1 Bonus-Edge für seine Wahrnehmungsprobe, um die Quelle eines bestimmten Geräusches auszumachen, aber wenn er das Edge nicht sofort ausgibt, verfällt es.
item.handheld_housing.desc=Sensoren können in Geräten installiert werden, die eine Kapazität haben. Die meisten Fahrzeuge und Drohnen sind serienmäßig mit einem Sensorarray ausgestattet (dessen Stufe in ihren Spielwerten angegeben ist). Auch wandmontierte Sensorgehäuse und solche für den Handbetrieb sind erhältlich.\n Nicht jede Art von Sensorpaket ist in der Lage, jeden Sensor aufzunehmen. Welche Sensorstufe in welcher Art von Gehäuse bzw. Gerät eingebaut werden kann, hängt zum einen von den Kapazitätskosten (s. Tabelle Sensoren, S. 277), zum anderen vom Gerätetyp (s. Tabelle Sensorpakete, S. 277) ab. Zum Beispiel könnte ein tragbares Gehäuse entweder ein Sensorarray der Stufe 3 oder bis zu drei Einzelsensoren aufnehmen, die aber ebenfalls maximal Stufe 3 haben dürfen. Ein stationäres Gehäuse wiederum könnte zum Beispiel entweder ein Sensorarray der Stufe 4 und zwei Einzelsensoren mit maximal Stufe 4 oder bis zu sechs Einzelsensoren mit maximal Stufe 4 aufnehmen. Sensorarrays und Einzelsensoren mit höheren Stufen können gemäß der Tabelle Sensorpakete nur in größeren Ausrüstungsgegenständen verbaut werden.
item.wall-mounted_housing.desc=Sensoren können in Geräten installiert werden, die eine Kapazität haben. Die meisten Fahrzeuge und Drohnen sind serienmäßig mit einem Sensorarray ausgestattet (dessen Stufe in ihren Spielwerten angegeben ist). Auch wandmontierte Sensorgehäuse und solche für den Handbetrieb sind erhältlich.\n Nicht jede Art von Sensorpaket ist in der Lage, jeden Sensor aufzunehmen. Welche Sensorstufe in welcher Art von Gehäuse bzw. Gerät eingebaut werden kann, hängt zum einen von den Kapazitätskosten (s. Tabelle Sensoren, S. 277), zum anderen vom Gerätetyp (s. Tabelle Sensorpakete, S. 277) ab. Zum Beispiel könnte ein tragbares Gehäuse entweder ein Sensorarray der Stufe 3 oder bis zu drei Einzelsensoren aufnehmen, die aber ebenfalls maximal Stufe 3 haben dürfen. Ein stationäres Gehäuse wiederum könnte zum Beispiel entweder ein Sensorarray der Stufe 4 und zwei Einzelsensoren mit maximal Stufe 4 oder bis zu sechs Einzelsensoren mit maximal Stufe 4 aufnehmen. Sensorarrays und Einzelsensoren mit höheren Stufen können gemäß der Tabelle Sensorpakete nur in größeren Ausrüstungsgegenständen verbaut werden.
item.sensor_array.desc=Dieses Sensorpaket kann so viele der unter Sensorfunktionen (S. 278) aufgelisteten Funktionen enthalten, wie seiner Stufe entspricht. Diese Funktionen müssen beim Kauf des Sensorarrays festgelegt werden, ihr Preis ist aber bereits in dem des Sensorarrays enthalten. Wenn man ein Sensorarray für Wahrnehmungsproben verwendet, kann man die Sensorstufe anstelle der Fertigkeit Wahrnehmung einsetzen. Sensorarrays haben eine Stufe von 2 bis 8.
item.single_sensor.desc=Ein Einzelsensor kann nur eine der unter Sensorfunktionen (S. 278) aufgelisteten Funktionen enthalten. Diese Funktion muss beim Kauf des Sensors festgelegt werden, ihr Preis ist aber bereits im Preis des Sensors enthalten. Einzelsensoren haben eine Stufe von 1 bis 8.
item.lock.desc=Metallschlüssel, Schlüssellöcher und eine Menge Verwirrung für den Hacker mit dem Sequencer in der Hand - Zylinder- und Kombinationsschlösser sind altmodisch und werden dort verwendet, wo die technische Entwicklung nicht Schritt halten konnte oder der Boss ein Pfennigfuchser ist. Sie sind ein Relikt aus der Vergangenheit und werden häufig nur deshalb noch verwendet, weil sie billig sind. Um ein solches Schloss zu knacken, ist eine erfolgreiche Probe auf Mechanik + Geschicklichkeit (Stufe) erforderlich. Schlösser gibt es in Stufen von 1 bis 6.
item.metal_restraints.desc=Normale Metallhandschellen (Struktur 10) verfügen über ein mechanisches oder WiFi-kontrolliertes Schloss (s. Barrieren, S. 115). Moderne Plasstahlhandschellen (Struktur 12) schweißen sich beim Schließen automatisch zusammen und müssen aufgeschnitten werden, um die Zielperson zu befreien. Einweg-Plastikstreifen (Struktur 6) sind leicht und können in Bündeln mitgeführt werden. Cyberwareblocker bestehen aus Metall (Struktur 10) und werden an den Handgelenken oder Fußknöcheln eines Gefangenen befestigt, damit er sich nicht schneller als mit einem Schlurfen (Bewegen 2 Meter, Sprinten 3 Meter) bewegt und keine Cyberimplantatwaffen ausfährt.
item.plasteel_restraints.desc=Normale Metallhandschellen (Struktur 10) verfügen über ein mechanisches oder WiFi-kontrolliertes Schloss (s. Barrieren, S. 115). Moderne Plasstahlhandschellen (Struktur 12) schweißen sich beim Schließen automatisch zusammen und müssen aufgeschnitten werden, um die Zielperson zu befreien. Einweg-Plastikstreifen (Struktur 6) sind leicht und können in Bündeln mitgeführt werden. Cyberwareblocker bestehen aus Metall (Struktur 10) und werden an den Handgelenken oder Fußknöcheln eines Gefangenen befestigt, damit er sich nicht schneller als mit einem Schlurfen (Bewegen 2 Meter, Sprinten 3 Meter) bewegt und keine Cyberimplantatwaffen ausfährt.
item.plastic_straps.desc=Einweg-Plastikstreifen (Handschellen, Struktur 6) sind leicht und können in Bündeln mitgeführt werden.
item.maglock.desc=Magschlösser sind elektronische Schlösser mit einer Reihe von Zugangskontrolloptionen wie biometrischen Scannern, Magnetkarten oder RFID-Karten. Weitere Informationen über Magschlösser und ihre Optionen findest du unter Magschlösser auf Seite 240. Magschlösser haben Stufen von 1 bis 9.
item.containment_manacles.desc=Cyberwareblocker bestehen aus Metall (Struktur 10) und werden an den Handgelenken oder Fußknöcheln eines Gefangenen befestigt, damit er sich nicht schneller als mit einem Schlurfen (Bewegen 2 Meter, Sprinten 3 Meter) bewegt und keine Cyberimplantatwaffen ausfährt.
item.keypad.desc=Tastatur-Erweiterung für ein Magschloss
item.card_reader.desc=Kartenleser-Erweiterung für ein Magschloss
item.autopicker.desc=Diese Sperrpistole ist eine schnelle und effektive Methode, um mechanische Schlösser zu umgehen. Der automatische Dietrich gewährt einen Würfelpoolbonus von +1 für die Probe zum Knacken eines Schlosses.
item.cellular_glove_molder.desc=Dieses Gerät nimmt einen Finger- oder Handabdruck und formt einen „Handschuh“, den man tragen kann, um den Abdruck zu imitieren und damit einige biometrische Schlösser zu überlisten (s. Magschlösser, S. 240).
item.chisel.desc=Diese lange, kräftige Metallstange verdoppelt die effektive Stärke eines Charakters, wenn er versucht, eine Tür, ein Schloss oder einen Behälter aufzubrechen.
item.keycard_copier.desc=Der Magnetkarten-Kopierer ermöglicht es dem Benutzer, innerhalb von Sekunden eine Magnetkarte zu kopieren. Anschließend kann eine neue Magnetkarte mit einer Ausgedehnten Probe auf Elektronik + Logik (2, 10 Minuten) angefertigt werden. Die Magnetkarte funktioniert genauso gut wie das Original, allerdings reagieren manche Sicherheitssysteme auf ungewöhnliche Doppelverwendungen von Magnetkarten - etwa, wenn sich „Dr. Wissenschaftler“ Zugang zu einem Labor verschafft, in das er bereits zuvor gegangen ist, ohne es wieder zu verlassen.
item.lockpick_set.desc=Diese klassischen mechanischen Einbruchswerkzeuge haben sich den letzten Jahrhunderten nur marginal verändert. Sie sind notwendig für das Knacken von mechanischen Schlössern, sofern man keinen automatischen Dietrich einsetzt.
item.maglock_passkey.desc=Diese Magschloss-„Rohkarte“ kann in den Kartenleser jedes Magschlosses eingeschoben werden und lässt ihn glauben, dass eine legitime Zugangskarte benutzt wird (s. Magschlösser, S. 240).
item.miniwelder.desc=Dieses tragbare Gerät erzeugt einen kleinen Lichtbogen, um Metalle zu schmelzen, entweder um durch Metall zu schneiden oder es zusammenzuschweißen. Seine Energiequelle reicht für 30 Minuten Betrieb. Der Lichtbogen erzeugt zwar eine große Hitze, ist aber viel zu klein, um eine gute Waffe abzugeben (das wäre, als würde man versuchen, jemanden mit einem Feuerzeug zu stechen). Das Mini-Schweißgerät hat einen Schadenswert von 6, wenn man es verwendet, um durch Barrieren zu schneiden.
item.miniwelder_fuel.desc=Treibstoffkanister für Mini-Schweissgerät
item.monofilament_chainsaw.desc=Die obere Seite jedes Kettensegments dieser tragbaren Motorsäge ist mit Monofilamentdraht bedeckt. Dadurch ist die Säge ideal zum Durchsägen von Bäumen, Türen und anderen unbeweglichen Objekten. Eine Monofilamentkettensäge ist zu unhandlich, um eine gute Waffe abzugeben, und es gibt auch keine passende Fertigkeit dafür. Beim Einsatz gegen Barrieren hat die Monofilamentkettensäge einen Schadenswert von 8.
item.sequencer.desc=aEin elektronisches Gerät, das benötigt wird, um Magschlösser mit Tastatur zu knacken (s. Magschlösser, S. 240).
item.glue_solvent.desc=Diese Spraydose enthält genug Lösungsmittel, um etwa 1 Quadratmeter schnelltrocknenden Aerosol-Superkleber zu entfernen.
item.glue_sprayer.desc=Dieser schnelltrocknende Aerosol-Superkleber erlaubt es, zwei Oberflächen schnell aneinanderzukleben, und enthält genug Kleber für ungefähr 1 Quadratmeter (genug, um eine Außentür oder ein Panoramafenster zuzukleben). Der Kleber braucht 1 Kampfrunde, um auszuhärten. Er hat eine Konstitution und Stärke von jeweils 5 für den Fall, dass man ihn aufbrechen will (was mittels einer Vergleichenden Probe auf Konstitution + Stärke erfolgt).
item.thermit_burning_bar.desc=Thermit ist ein entzündliches Material, das mit einer extrem hohen Temperatur brennt. Appliziert wird es mithilfe eines Brennstabs - einer Stange aus Thermit und Sauerstoff mit einem Griff und in einer Halterung -, der verwendet werden kann, um Löcher in Eisen, Stahl und sogar Plasstahl zu brennen. Der Thermit-Brennstab verursacht Feuerschaden mit einem Schadenswert von 10K. Er muss sehr vorsichtig gehandhabt werden und kann deshalb nicht als Waffe verwendet werden - es sei denn, die Zielperson ist bewusstlos oder gefesselt oder Ähnliches, aber so grausam ist ja wohl niemand.
item.chemsuit.desc=Dieser undurchlässige Ganzkörperanzug wird über Kleidung oder Panzerung getragen und gewährt chemische Isolierung (S. 266) in Höhe seiner Stufe - nicht zu verwechseln mit einem kompletten Hazmat-Anzug, da der Chemoanzug nicht vakuumversiegelt ist.
item.climbing_gear.desc=Dies ist ein Rucksack mit 100 Metern Seil (Tragkraft 400 kg), einem Klettergeschirr, Handschuhen, Karabinern, Steigeisen, Kletterhaken und weiteren Dingen, die für das Klettern mit Ausrüstung benötigt werden (s. Klettern, S. 95).
item.diving_gear.desc=In der Taucherausrüstung sind ein Neoprenanzug, eine Gesichtsmaske mit Schnorchel, ein Atemregler, ein Lufttank für 2 Stunden Luft (Ersatztanks kosten 50 ¥) und eine aufblasbare Weste für das Treiben an der Wasseroberfläche enthalten. Der Atemregler und der Lufttank schützen wie eine Gasmaske gegen Toxine mit Inhalationsvektor. Der Neoprenanzug gewährt Kälteresistenz (S. 267) der Stufe 2.
item.flashlight.desc=Im Jahr 2080 haben die meisten Taschenlampen eine sehr lange Lebensdauer und sind superhell. Es gibt sie auch in Versionen für Restlichtverstärkung und Infrarot, die eine noch bessere Sicht bei Restlichtverstärkung bzw. Infrarotsicht erlauben. Eine Taschenlampe kann auf oder unter dem Lauf einer Waffe montiert werden (s. Waffenzubehör, S. 259).
item.gas_mask.desc=Dieses Atemgerät mit Sauerstoffversorgung bedeckt das Gesicht vollständig und macht immun gegen Toxinangriffe mit Inhalationsvektor (s. Toxine und Drogen, S. 124). Die Gasmaske hat eine Luftversorgung für eine Stunde (Ersatz kostet 40 ¥) und kann an größere Lufttanks angeschlossen werden. Sie kann nicht mit einer normalen Atemschutzmaske kombiniert werden.
item.gecko_tape_gloves.desc=Die äußere Schicht dieser Handschuhe besteht aus einem speziellen Trockenklebstoff, in dem Millionen von mikroskopisch feinen Haaren enthalten sind, die an anderen Oberflächen haften. Einzeln sind diese Haftkräfte vernachlässigbar, aber zusammen sind sie stark genug, um sogar einen Troll kopfüber an einer Decke haften zu lassen. Geckotape-Handschuhe werden im Set mit Kniepolstern und Überziehsohlen geliefert. Wenn man das Set trägt, gelten die Regeln für Klettern mit Ausrüstung (S. 95). Geckotape-Handschuhe sind nutzlos, wenn sie nass sind.
item.hazmat_suit.desc=Der Hazmat-Anzug bedeckt den ganzen Körper und enthält einen internen Lufttank mit einer Luftversorgung für 4 Stunden. Er bietet eine chemische Versiegelung (S. 266) und schützt vor Toxinangriffen mit Kontakt- und Inhalationsvektor (s. Toxine und Drogen, S. 124). Hazmat-Anzüge sind serienmäßig mit Platz für einen Sensor ausgestattet, der in den meisten Fällen ein Geigerzähler (S. 278) ist. Der Sensor muss separat gekauft werden.
item.light_stick.desc=Wenn man den Leuchtstab knickt und schüttelt, erhält man für 3 Stunden eine sanfte chemische Beleuchtung, die einen Radius von 10 Metern erhellt.
item.magnesium_torch.desc=Die angezündete Fackel liefert für 5 Minuten helles Fackellicht, das 20 Meter weit reicht. Wenn man jemanden mit dem brennenden Ende schlägt, verursacht das 3K Feuerschaden.
item.microflare_launcher.desc=Die Signalraketenkanone kann farbige Leuchtraketen bis zu 200 Meter hoch in die Luft schießen und dadurch ein paar Minuten lang ein Gebiet von der Größe eines Straßenblocks beleuchten, was alle eventuellen Vorteile durch schlechte Beleuchtung eliminiert. Wenn man damit auf jemanden schießt, handelt es sich um eine ungeübte Fertigkeitsprobe (siehe S. 95); die Mini-Signalrakete verursacht 3K Feuerschaden.
item.microflares.desc=Die Mini-Signalrakete verursacht 3K Feuerschaden.
item.rappelling_gloves.desc=Diese Handschuhe bestehen aus einem speziellen Gewebe, das einen besseren Griff am Seil erlaubt und 1 Bonus-Edge für alle Proben gewährt, um sich am Seil festzuhalten. Die Handschuhe sind notwendig, um Microwire oder Camouflageseil (S. 281) zu verwenden, ohne sich brutal die Hände daran aufzuschlitzen, während man herunterrutscht.
item.respirator.desc=Eine Atemschutzmaske ist eine Filtermaske, die über Mund und Nase getragen wird und vor Toxinen mit Inhalationsvektor schützt (s. Toxine und Drogen, S. 124). Sie addiert ihre Stufe als Würfelpoolbonus bei Widerstandsproben gegen Chemikalien mit Inhalationsvektor.
item.survival_kit.desc=Eine Überlebensausrüstung in einer widerstandsfähigen Tasche. Enthält ein Messer, ein Feuerzeug, Streichhölzer, einen Kompass, eine Drahtsäge, eine leichte Rettungsdecke, Nahrungsriegel für 7 Tage, eine Wasserreinigungseinheit, eine Angelschnur mit Haken und diverse andere nützliche Dinge.
item.grapple_gun.desc=Diese Kanone kann einen Enterhaken und ein daran befestigtes Seil bis 100 Meter weit (je nach Art des Seils) abschießen. Der Schwellenwert für die Feuerwaffenprobe, um das gewünschte Ziel zu treffen, beträgt [Entfernung in Metern ÷ 20 (aufgerundet)]. Die Enterhakenkanone ist mit einer kleinen Winde ausgestattet, mit der der Haken zurückgezogen oder kleine Gewichte bis zu 10 Kilogramm hochgezogen werden können. Microwire kann bis zu 100 Meter weit geschossen werden und ein Gewicht bis zu 100 kg tragen; normales und Camouflageseil erreicht nur 60 Meter, kann dafür aber ein Gewicht bis zu 400 kg tragen; myomeres Seil kann bis zu 30 Meter weit geschossen werden und 100 kg tragen. Die Enterhakenkanone kann ungeübt als Waffe verwendet werden (Angriffswert 1, Schaden 1B).
item.microwire.desc=Dieses Seil besteht aus einer extrem dünnen (fast schon monofilamentdünnen) und widerstandsfähigen Polymerfaser; eine große Länge davon kann auf sehr kleinem Raum verstaut werden, und es ist sehr schwer zu sehen (Schwellenwert 6 bei einer Wahrnehmungsprobe). Der Nachteil ist, dass man es nur mit speziellen, schützenden Abseilhandschuhen (S. 280) greifen kann, ohne sich die Hand aufzuschlitzen, was 5K Schaden verursachen würde.
item.myomeric_rope.desc=Dieses Seil besteht aus einer speziellen Myomerfaser und kann (bis zu einer Maximallänge von 30 Metern) ferngesteuert werden. Beispielsweise kann man es dazu bringen, sich wie eine Schlange um ein Hindernis zu winden oder sich an einen Vorsprung zu binden. Das Seil bewegt sich mit einer Geschwindigkeit von 2 Metern pro Kampfrunde.
item.standard_rope.desc=Ein stinknormales Standardseil
item.stealth_rope.desc=Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische Reaktion dazu, dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren hinterlässt. Der Katalysatorstab ist wiederverwendbar.
item.catalyst_stick.desc=Wenn man Camouflageseil mit dem Katalysatorstab berührt, führt eine chemische Reaktion dazu, dass es innerhalb von Sekunden zu Staub zerfällt und fast keine Spuren hinterlässt. Der Katalysatorstab ist wiederverwendbar.
item.biomonitor.desc=Dieses kleine Gerät überwacht ständig Herzfrequenz, Blutdruck und Körpertemperatur. Außerdem kann es Blut-, Schweiß- und Hautproben analysieren. Der Vitalmonitor wird von medizinischen Dienstleistern und von Patienten verwendet, die ihren Gesundheitszustand überwachen müssen, und kann als Armband getragen oder in Kleidung oder Kommlinks integriert werden.
item.docwagon_basic_year.desc=Geh niemals ohne ihn aus dem Haus! DocWagon bietet erstklassige medizinische Notfalldienste rund um die Uhr, und sie kommen zu dir! Es gibt vier Vertragsarten: Standard, Gold, Platin und Superplatin.\nEin DocWagon-Vertrag erfordert die Abgabe einer Gewebeprobe (verwahrt in einem sicheren Tresorraum, der streng von Wachleuten, Sicherheitsdeckern und Magiern bewacht wird) und beinhaltet einen Vitalmonitor, der als Armband getragen oder als RFID-Chip implantiert wird und aktiviert werden kann, um einen Notruf abzusetzen. Dieser Vitalmonitor dient den bewaffneten Rettungswagen und Hubschraubern von DocWagon auch als Peilsignal. Falls das Armband reißt, wird DocWagon ebenfalls alarmiert.
item.docwagon_gold_year.desc=Der Goldvertrag enthält eine kostenlose Reanimation pro Jahr, einen 50-prozentigen Nachlass auf die HTR-Gebühr und einen zehnprozentigen Nachlass auf die stationäre Behandlung.
item.docwagon_platinum_year.desc=Der Platinvertrag enthält vier kostenlose Reanimationen pro Jahr und einen 50-prozentigen Rabatt auf die stationäre Behandlung; HTR-Dienste sind kostenlos, aber Kompensationszahlungen für getötete Mitarbeiter müssen immer noch gezahlt werden
item.docwagon_superplatinum_year.desc=Kunden, die den Superplatinvertrag abgeschlossen haben, erhalten fünf kostenlose Reanimationen pro Jahr und müssen weder für HTR-Dienste noch für getötete DocWagon-Mitarbeiter zahlen.
item.disposable_syringe.desc=Spritzen bestehen aus Kunststoff mit einer Metallnadel und sind für den einmaligen Gebrauch gedacht. Sie können verwendet werden, um Toxine mit Injektionsvektor zu verabreichen. Ein unkooperatives Opfer muss eventuell zuerst immobilisiert oder zumindest festgehalten werden.
item.first_aid_kit.desc=Alles, was man für die Notfall-Wundversorgung braucht, in einer handlichen Tasche. Dieses Set enthält Wundschnellverbände, Kompressen, eine Rettungsdecke, Sicherheitsnadeln, Pinzette und Schere, Einmalhandschuhe, Klebepflaster, eine Pflasterspule und Desinfektionsspray. Das Erste-Hilfe-Set ist notwendig, um nach einem Kampf Erste Hilfe (S. 122) leisten zu können. Danach ist es aufgebraucht und muss durch ein neues Erste-Hilfe-Set ersetzt werden.
item.medkit.desc=Das Medkit enthält Medikamente, Verbände, Werkzeuge und ein (redseliges) Arzt-Expertensystem, das den Nutzer bezüglich der Behandlung der gängigsten medizinischen Notfälle (etwa Knochenbrüche, Schussverletzungen, chemische Wunden oder Vergiftung sowie der Behandlung von Schock und Blutverlust und natürlich Wiederbelebungen) beraten kann. Das Medkit gilt als Werkzeug-Kiste für Biotechproben. Die Regeln für seine Anwendung finden sich auf Seite 122.
item.medkit_supplies.desc=Ein Medkit-Nachfüllpack muss nach jeder Verwendung des Medkits gekauft werden; es ist auch möglich, Nachfüllpacks auf Vorrat zu kaufen. Bis zu fünf Nachfüllpacks können in der Medkitbox verwahrt werden. Weitere Packs müssen woanders aufbewahrt werden.
item.antidote_patch.desc=Das Antidot-Patch neutralisiert oder hebt den Status Vergiftet für eine große Auswahl an Toxinen auf. Ist ein Toxin oder eine Droge besonders selten, kann der Spielleiter verlangen, dass ein spezielles Antidot-Patch nur für dieses Toxin oder diese Droge verwendet wird (s. Toxine und Drogen, S. 124).
item.chem_patch.desc=Dies ist ein leeres Slap-Patch. Man kann es mit einer Dosis einer Chemikalie oder eines Toxins (S. 124) füllen und später bei einem Patienten (oder sich selbst) anwenden.
item.stim_patch.desc=Dieses Patch entfernt eine Anzahl Kästchen Betäubungsschaden in Höhe seiner Stufe und hebt den Status Benommen auf. Die Wirkung hält für [Stufe × 10] Minuten an - nach dieser Zeit erleidet der Patient (Stufe + 1)B Schaden, dem nicht widerstanden werden kann (und der auch auf den Körperlichen Zustandsmonitor überlaufen kann). Während ein Stim-Patch wirkt, kann der Charakter sich nicht ausruhen.
item.tranq_patch.desc=Dieses Patch verursacht Betäubungsschaden in Höhe seiner Stufe, gegen den mit Konstitution Widerstand geleistet wird.
item.trauma_patch.desc=Wird dieses Patch bei einem Patienten mit Überzähligem Schaden angewendet, wird er augenblicklich stabilisiert und heilt 1W6 + 1 Kästchen Überzähligen Schaden (und nur Überzähligen Schaden). Diese Patches sind immer Wi- Fi-fähig und verbinden sich automatisch mit der Matrix, sobald sie appliziert werden.
item.control_rig.desc=Dieses Implantat macht sich die Datenkoordinierungs- und Synchronisierungsfähigkeit des Mittelhirns zunutze, um geriggte Fahrzeuge und Drohnen (und andere Geräte mit einem Riggerinterface, wie etwa Geschütztürme) zu steuern. Die Riggerkontrolle hat ein eingebautes Sim-Modul, daher kann sie auch als DNI für andere Geräte genutzt werden. Außerdem ist sie mit einem Universal-Datenport und einem einziehbaren Kabel von etwa einem Meter Länge ausgestattet (als hätte man eine kostenlose Datenbuchse).\n Wenn man in ein Fahrzeug oder eine Drohne hineingesprungen ist, gewährt die Riggerkontrolle einen Würfelpoolbonus in Höhe ihrer Stufe auf alle Proben, bei denen es um das Steuern eines Fahrzeugs geht, sowie 1 Punkt Bonus-Edge.
item.cortex_kink_bomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas … heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cortex_microbomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas … heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cortex_area_bomb.desc=Diese illegale Methode der Nötigung gibt es in drei Geschmacksrichtungen: als Spleen-, Mikro- und Flächenbombe. Spleenbomben sollen nur einen Teil des Kopfes des Opfers beschädigen und damit entweder spezielle Headware nutzlos machen oder das Hirn schädigen, um Blindheit, Stottern, Gehörverlust oder andere Behinderungen hervorzurufen (5K Schaden, Widerstandsprobe auf Konstitution; das Opfer erhält den entsprechenden Status). Aber wenn irgendwo etwas im Kopf explodiert, laufen die Dinge natürlich nicht immer ganz nach Plan, und das Ergebnis kann etwas … heftig sein. Die Mikrobombe ist gerade groß genug, um ihren unglückseligen Träger zu töten (18K Schaden; Widerstandsprobe mit Konstitution). Flächenbomben töten das Opfer (Schaden für Opfer wie Mikrobombe) und beeinflussen einen Sprengbereich wie eine Splittergranate (S. 263), wogegen separat Widerstand geleistet werden muss. Die Bomben können fern- oder zeitgesteuert gezündet oder sogar so eingestellt werden, dass sie durch Geräuscherkennung losgehen. Wenn sie in Cybergliedmaßen eingebaut werden, sollen sie spezielle Komponenten (Spleenbombe) oder die ganze Gliedmaße (Mikrobombe) zerstören oder den Träger verletzen und einen Bereich in die Luft sprengen (Flächenbombe).
item.cyberjack1.desc=Während die Matrixprotokolle immer steifer und strenger wurden, blieb auch die Hackercommunity nicht untätig. Das jüngste Hilfsmittel, dass sich schnell von „ganz praktisch“ zu „unverzichtbar“ weiterentwickelt hat, ist die Cyberbuchse, die eine jener Gelegenheiten repräsentiert, bei denen die Shadowrunner das Wissen der Konzerne gegen diese verwendet haben. Basierend auf Konzernforschungen an Technomancern macht sich die Cyberbuchse die gewaltige Rechenkapazität des Gehirns zunutze, um Matrixprotokolle und Verschlüsselungsalgorithmen auszuhebeln. Mittlerweile gilt ein Decker ohne Cyberbuchse als in etwa so effektiv wie ein Decker ohne Cyberdeck. Die Cyberbuchse ist der wichtigste Schutz des Deckers gegen Hacking und bietet die Datenverarbeitungs- und Firewallstufen, die Cyberdecks heutzutage nicht mehr besitzen, und natürlich funktioniert sie auch als Standarddatenbuchse. Cyberbuchsen ermöglichen außerdem spezielle Matrix- Edge-Handlungen ( siehe S. 176). D/F 4/3, Matrixinitiative +1
