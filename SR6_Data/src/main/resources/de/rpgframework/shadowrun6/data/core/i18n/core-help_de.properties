item.bow14.desc=Alles vom traditionellen Langbogen aus Glasfaser oder Holz bis zum modernen Kompositbogen. Diese archaischen Waffen findet man in den 2080ern nicht sehr oft auf den Straßen. Sie haben den Vorteil, vor Hackern sicher zu sein, solange man die abgefahreneren Erweiterungen weglässt. Einen Pfeil einzulegen erfordert eine Haupthandlung Waffe bereit machen (S. 46). Bögen haben eine Stufe, die die Mindeststärke angibt, die man braucht, um die Waffe bedienen zu können.\nAußerdem hängt der Schaden der Waffe von der Stufe ab (die Maximalstufe beträgt 14). Auch Pfeile haben eine Stufe, und diese muss mindestens so hoch wie die Stufe des Bogens sein.
item.crossbow_light.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen und internen Magazinen versehen, die bis zu vier Pfeile aufnehmen können. Es gibt sie in leichter, mittlerer und schwerer Ausführung. Leichte Modelle lassen sich mit einer Hand bedienen, während man für mittlere und schwere Modelle beide Hände braucht.
item.crossbow_standard.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen und internen Magazinen versehen, die bis zu vier Pfeile aufnehmen können. Es gibt sie in leichter, mittlerer und schwerer Ausführung. Leichte Modelle lassen sich mit einer Hand bedienen, während man für mittlere und schwere Modelle beide Hände braucht.
item.crossbow_heavy.desc=Moderne Armbrüste sind mit automatischen Nachladevorrichtungen und internen Magazinen versehen, die bis zu vier Pfeile aufnehmen können. Es gibt sie in leichter, mittlerer und schwerer Ausführung. Leichte Modelle lassen sich mit einer Hand bedienen, während man für mittlere und schwere Modelle beide Hände braucht.
item.throwing_knives.desc=Die angegebenen Werte gelten für eine breite Auswahl an kleinen, muskelbetriebenen Wurfwaffen wie Wurfsterne, Wurfdorne und Ähnliches. Mit einer Haupthandlung Waffe bereit machen können gleichzeitig bis zu [Geschicklichkeit ÷ 2] Stück dieser Waffen für den Wurf bereit gemacht werden.
item.throwing_stars.desc=Die angegebenen Werte gelten für eine breite Auswahl an kleinen, muskelbetriebenen Wurfwaffen wie Wurfsterne, Wurfdorne und Ähnliches. Mit einer Haupthandlung Waffe bereit machen können gleichzeitig bis zu [Geschicklichkeit ÷ 2] Stück dieser Waffen für den Wurf bereit gemacht werden.
item.airburst_link.desc=Dieses Smartgunzubehör für Granat- und Raketenwerfer verwendet einen Entfernungsmesser, um das Explosivprojektil möglichst nahe am Ziel detonieren zu lassen. Eine Airburst-Verbindung senkt die Abweichung einer verschossenen Granate oder Rakete. Für die Berechnung der Abweichung zählt jeder Erfolg doppelt (s. Spreng­angriffe und Abweichung, S. 118), wenn der WiFi-Zünder verwendet wird.\nDie Airburst-Verbindung verhindert zudem, dass der Angegriffene mittels der Handlung Volle Deckung den Schaden senkt, da der Status Liegend keinen Schutz gegen den Angriff bietet.
item.bipod.desc=Dieser zweibeinige Ständer befindet sich unter der Waffe, wodurch sie nah am Boden abgefeuert werden kann, während sich der Schütze in einer liegenden oder sitzenden Haltung befindet. Ein Zweibein kann an der Unterlaufhalterung einer Waffe befestigt werden und erhöht den Angriffswert um +2, wenn es vollständig ausgeklappt ist.\nEin Zweibein an der Waffe anzubringen erfordert eine Haupthandlung. Um es aus- oder einzuklappen, ist eine Nebenhandlung erforderlich.
item.concealable_holster.desc=Dieses kleine Holster wird mit einem Smartklebstoff an einer Stelle am Körper angeheftet, wo es nicht ohne Weiteres zu sehen ist. Es erhöht die Tarnbarkeit der darin verwahrten Waffe um 1. Nur Pistolen (inklusive Automatikpistolen) und Taser passen in ein Tarnholster.
item.fn_p93_flashlight.desc=Eine Lampe mit drei Einstellungen (für Restlichtverstärkung, Infrarotsicht, sichtbares Licht)
item.gas-vent_system.desc=Gasventil-Rückstoßkompensationssysteme sind laufmontiert und lassen die Gase des Laufs einer Waffe in einem bestimmten Vektor entweichen, um dem Hochschlag des Laufs entgegenzuwirken. Ein einmal eingebautes Gasventil kann nicht wieder entfernt werden. Gasventilsysteme neutralisieren den Angriffswertmalus für halbautomatisches Feuer und senken ihn für Salvenfeuer auf 2.
item.gyro_mount.desc=An diesem schweren Oberkörpergeschirr ist ein beweglicher, motorisierter und gyrostabilisierter Arm befestigt, der ein Gewehr oder Maschinengewehr aufnehmen kann. Das System neutralisiert den Angriffswertmalus für halbautomatisches Feuer und Salvenfeuer und senkt den Angriffswertmodifikator für vollautomatisches Feuer (S. 112) auf -3. Außerdem ändern sich die Stärkevoraussetzungen für mittlere und schwere Maschinengewehre auf 2 oder mehr bzw. 4 oder mehr. Das Befestigen oder Entfernen einer Waffe erfordert eine Nebenhandlung. Das Anlegen des Geschirrs dauert etwa eine Minute, während das Ablegen dank des Schnellöffners innerhalb einer Haupthandlung erfolgen kann.
item.hidden_arm_slide.desc=Diese Gleitschiene wird am Unterarm befestigt und kann eine Holdout-Pistole, eine leichte Pistole oder einen Taser aufnehmen. Ausgelöst durch eine bestimmte Bewegung mit einer Nebenhandlung gleitet die Waffe in die Hand des Benutzers. Wird der Springarm zum ersten Mal in einem Kampf eingesetzt, gewährt er 1 Bonus-Edge. Außerdem erhöht er die Tarnbarkeit der Waffe um 1.
item.imaging_scope.desc=Das klassische aufmontierte Zielfernrohr enthält eine Mikro­kamera und eine Sichtvergrößerung, dazu eine Kapazität von 3 für zusätzliche Sichtverstärkungen (siehe S.275). Das Befestigen oder Entfernen erfordert eine Nebenhandlung. Die Nebenhandlung Zielen muss ausgeführt werden, um die Vorteile eines Zielfernrohrs nutzen zu können, allerdings gilt der Würfelpoolbonus dieser Handlung noch nicht beim ersten Ausführen der Handlung. Wenn der Schütze ein Zielfernrohr benutzt, kann seine Zielperson kein Edge dadurch erhalten, dass sie einen höheren Verteidigungswert hat.
item.laser_sight.desc=Dieses Gerät verwendet einen Laserstrahl, um einen (mit Normalsicht, Restlichtverstärkung oder Infrarotsicht) sichtbaren Punkt auf das Ziel zu projizieren. Das erhöht die Angriffswerte der Waffe für alle verfügbaren Reichweiten um 1, was jedoch nicht mit Modifikatoren aus Smartgunsystemen kumulativ ist. Der Lasermarkierer kann auf dem Lauf oder unter dem Lauf montiert werden. Ihn ein- oder auszuschalten erfordert eine Nebenhandlung.\nBei Waffen, zu deren Grundausstattung ein Lasermarkierer gehört, ist dieser Bonus bereits in den Angriffswert eingerechnet.
item.periscope.desc=Dieses justierbare Sichtgerät wird aufmontiert und erlaubt es, mit einer Waffe um die Ecke zu zielen, wodurch der Würfelpoolmalus für Angriffe aus voller Deckung (Status Deckung IV) auf -1 sinkt. Ein Periskop hat eine Kapazität von 3 und kann mit allen ab Seite 275 beschriebenen Sichtverstärkungen ausgerüstet werden.
item.quick_draw_holster.desc=Dieses leicht zugängliche Holster kann Pistolen und Taser aufnehmen. Die Verwendung des Schnellziehholsters gewährt eine zusätzliche Nebenhandlung, wenn die Handlung Schnellziehen ausgeführt wird.
item.shock_pad.desc=Ein schockabsorbierendes Polster, das sich auf dem festen Schaft eines Gewehrs, einer Schrotflinte oder einer schweren Waffe befindet. Es senkt den Angriffswertmalus bei halbautomatischem, Salven- und vollautomatischem Feuer um 1.
item.silencer.desc=Ein laufmontiertes Zubehörteil, das das Geräusch und den Mündungsblitz einer Waffe dämpft; nicht kompatibel mit Revolvern und Schrotflinten. Der Schalldämpfer erhöht bei einer Wahrnehmungsprobe, mit der die Benutzung der Waffe bemerkt oder der Standort des Schützen bestimmt werden soll, den Schwellenwert um 2. Das Anbringen und Entfernen erfordert jeweils eine Haupthandlung.
item.ares_lf_silencer.desc=Der für diese Modelle optional erhältliche Schalldämpfer erhöht den Schwellenwert für akustische Wahrnehmungsproben um 3, wenn er aufgesteckt wird,
item.smart_firing_platform.desc=Dieses robotische Dreibein ist mit einem mechanischen Drehzapfen ausgestattet, der einen Feuerwinkel von 180 Grad mit einer Neigung von 60 Grad erlaubt. Man kann an der Plattform eine mit Smartgunsystem ausgestattete Waffe befestigen, die dann von dem Pilotprogramm (Stufe 3) der Plattform abgefeuert wird. Die Plattform ist mit einer Zielerfassungs-Autosoft (Stufe 3) ausgerüstet und kann mit zusätzlichen Autosofts \u2013 für gewöhnlich einer Clearsight-Autosoft \u2013 upgegradet werden. Man muss die Parameter festlegen, auf wen genau die Plattform schießen soll und auf wen nicht; diese Parameter werden dann vom Pilotprogramm der Plattform befolgt. Die Plattform neutralisiert die Angriffswertmodifikatoren für halbautomatisches und Salvenfeuer und senkt den Angriffswertmodifikator für vollautomatisches Feuer (S. 112) auf -3. Sie hat einen Initiativewert von Pilot × 4, 3W6 Initiativewürfel, 4 Nebenhandlungen und 1 Haupthandlung.
item.smartgun_system.desc=Veralteter Eintrag. Bitte löschen und durch das externe Zubehör "Smartgunsystem (extern)" oder die interne Modifikation "Smartgunsystem (intern)" ersetzen.
item.smartgun_system_external.desc=Dieses System ist die waffenseitige Ergänzung zum Smartlink eines Charakters. Das System enthält eine kleine Kamera und einen Entfernungsmesser. Es überwacht den Munitionsstand und ermöglicht es, mittels eines DNI zwischen den Feuermodi einer Waffe umzuschalten, ein Magazin auszuwerfen und die Waffe abzufeuern, ohne den Abzug zu drücken. Dank der Kamera ist das Feuern aus Deckung möglich, ohne dass für Angriffe aus der Deckung (Status Deckung) eine Nebenhandlung ausgegeben werden muss. Benutzt der Charakter ein Smartlink, erhöht das Smartgunsystem die Angriffswerte der Waffe für alle verfügbaren Reichweiten um 2. Auf die Smartguneigenschaften greift man entweder mit einem Datenkabel zu, das mit einem Sichtgerät (einer Brille oder \u2013 wenn man Cyberaugen hat \u2013 einer Datenbuchse) verbunden ist, oder über eine WiFi-Verbindung, die mit einem direkten Neuralinterface zusammenarbeitet. Ein externes Smartgunsystem kann mit einer Ausgedehnten Probe auf Waffenbau +Logik [Geistig] (4, 1 Stunde) auf- oder unterlaufmontiert werden. Die kleine Kamera hat eine Kapazität von 1 und kann mit Sichtverstärkungen (S. 448) ausgerüstet werden. Das interne Smartgun System findet sich bei "Modifikationen".
item.spare_clip.desc=Ein ungeladenes Standard-Ersatzmagazin für eine bestimmte Waffe. Ersatzmagazine sind nur für Waffen mit Stangenmagazinen (s) und Trommelmagazinen (t) erhältlich, aber nicht für Waffen mit internen Magazinen (i).
item.spare_clip_predator.desc=Ein ungeladenes Ersatzmagazin für das variable Munitionssystem der Ares Predator VI.
item.speed_loader.desc=Der Schnelllader enthält einen Ring von Kugeln, die auf diese Weise schnell in die aufklappbare Trommel (tr) eines Revolvers geladen werden können. Jeder Schnelllader ist speziell auf ein bestimmtes Waffenmodell angepasst. Damit lässt sich ein Revolver innerhalb einer Nebenhandlung voll aufladen.
item.folding_stock.desc=Einziehbare Schulterstütze
item.tripod.desc=Das Dreibein bietet eine stabile Basis, um eine Waffe dicht am Boden abzufeuern, während der Schütze kniet oder sitzt. Ein Dreibein kann an der Unterlaufhalterung befestigt werden, neutralisiert die Angriffswertmodifikatoren für halbautomatisches und Salvenfeuer und senkt den Angriffswertmodifikator für vollautomatisches Feuer (S. 112) auf -3, wenn es korrekt ausgeklappt wurde. Ein Dreibein anzubringen, erfordert eine Haupthandlung, um es aus- oder einzuklappen, ist eine Nebenhandlung erforderlich.
item.defiance_super_shock.desc=Dieser schwere Taser kann bis zu 4 Pfeile mit 20 Meter langen Drähten abfeuern. Die Drahtverbindung zur Batterie ermöglicht einen stärkeren Schock, begrenzt aber die Reichweite. Die Waffe kann auch im Nahkampf im Direktkontakt eingesetzt werden und richtet dabei den gleichen Schaden an. Wenn das Opfer nach einem erfolgreichen Treffer nicht die Drähte abreißt, kann der Angreifer eine Haupthandlung aufwenden, um erneut den Basisschaden der Waffe zuzufügen, indem er einen weiteren Satz Kondensatoren aktiviert.
item.yamaha_pulsar_1.desc=Diese Waffe verwendet drahtlose Kondensatoren, was dem Pulsar eine höhere Reichweite verleiht als Tasern, die über Drahtverbindungen arbeiten. Der Nachteil ist, dass der Schock etwas schwächer ausfällt als bei den verdrahteten Modellen, aber dafür kann er schneller und mehrfach feuern. Der Pulsar I hat keine Nahkampfkontakte, doch der Pulsar II besitzt am unteren Griffende zwei solcher Kontakte (ein Nahkampfangriff wie mit einem Knüppel).
item.yamaha_pulsar_2.desc=Diese Waffe verwendet drahtlose Kondensatoren, was dem Pulsar eine höhere Reichweite verleiht als Tasern, die über Drahtverbindungen arbeiten. Der Nachteil ist, dass der Schock etwas schwächer ausfällt als bei den verdrahteten Modellen, aber dafür kann er schneller und mehrfach feuern. Der Pulsar I hat keine Nahkampfkontakte, doch der Pulsar II besitzt am unteren Griffende zwei solcher Kontakte (ein Nahkampfangriff wie mit einem Knüppel).
item.fichetti_tiffani_needler.desc=„Hübsch“ und „tödlich“ müssen einander nicht ausschließen. Die Waffenbaukunst von Fichetti, kombiniert mit dem exklusiven Stil von Tiffani, macht die Needler zur beliebtesten Designer-Handfeuerwaffe der Welt. Das Basismodell ist mattgrau, aber seine farbverändernde Beschichtung kann per WiFi in eine praktisch unendliche Auswahl an Farben und Mustern verwandelt werden. Dadurch kann die Waffe passend zu den Schuhen, der Handtasche oder dem Tarnmuster der Armeehose designt werden. Die Needler kann nur hülsenlose Flechettemunition verschießen, was bereits in den Schadenswert eingerechnet ist.
item.streetline_special.desc=Die speziell für billige 3D-Nanodrucker entwickelte Streetline Special besteht aus Kompositwerkstoffen, wodurch sie mit MAD-Scannern schwerer zu entdecken ist (der Schwellenwert für die Probe erhöht sich um 1).
item.walther_palm_pistol.desc=Walther hat mit der Palm Pistol den klassischen doppelläufigen Derringer mit übereinander angeordneten Läufen in die zweite Hälfte des 21. Jahrhunderts hinübergerettet. Im Salvenmodus können beide Läufe gleichzeitig abgefeuert werden, aber die begrenzte Munitionskapazität hält nur sechs Schuss bereit – also sollte man sich jede Salve gut überlegen.
item.ares_light_fire_70.desc=Die Light-Fire-Serie von Ares wurde speziell für Sondereinsatzkräfte entwickelt. Die Light Fire 70 ist eine Standardwaffe der Straße, während die 75 nicht durch die üblichen Händler und legalen Quellen erhältlich ist. Aber welcher Runner kauft schon bei denen? Mit einem laufmontierten Schalldämpfer sind die beiden Modelle fast schon trideotauglich leise.\nDie 75 ist ab Werk mit einem Smartgunsystem und zugehöriger Software ausgestattet, und beide Modelle verfügen über einen Lasermarkierer. Der für diese Modelle optional erhältliche Schalldämpfer erhöht den Schwellenwert für akustische Wahrnehmungsproben um 3, wenn er aufgesteckt wird, und kostet 750 ¥.
item.ares_light_fire_75.desc=Die Light-Fire-Serie von Ares wurde speziell für Sondereinsatzkräfte entwickelt. Die Light Fire 70 ist eine Standardwaffe der Straße, während die 75 nicht durch die üblichen Händler und legalen Quellen erhältlich ist. Aber welcher Runner kauft schon bei denen? Mit einem laufmontierten Schalldämpfer sind die beiden Modelle fast schon trideotauglich leise.\nDie 75 ist ab Werk mit einem Smartgunsystem und zugehöriger Software ausgestattet, und beide Modelle verfügen über einen Lasermarkierer. Der für diese Modelle optional erhältliche Schalldämpfer erhöht den Schwellenwert für akustische Wahrnehmungsproben um 3, wenn er aufgesteckt wird, und kostet 750 ¥.
item.beretta_101T.desc=Die Waffen der T-Serie von Beretta sind die bevorzugten Seitenwaffen vieler Sicherheitstruppen der Welt. Sie werden als leichte Pistolen klassifiziert, obwohl das Modell 201 zu Automatikfeuer fähig ist, was die Waffe besonders in Ländern beliebt macht, in denen der Einsatz von schweren Pistolen und Maschinenpistolen gesetzlich beschränkt ist. Da der Rahmen der gleiche ist, lässt sie sich leicht als eine 101 tarnen. Die 201 wird außerdem mit einer abnehmbaren Schulterstütze geliefert, wobei diese häufig schon verloren gegangen ist, wenn die Waffe schließlich auf die Straße gelangt.
item.beretta_201T.desc=Die Waffen der T-Serie von Beretta sind die bevorzugten Seitenwaffen vieler Sicherheitstruppen der Welt. Sie werden als leichte Pistolen klassifiziert, obwohl das Modell 201 zu Automatikfeuer fähig ist, was die Waffe besonders in Ländern beliebt macht, in denen der Einsatz von schweren Pistolen und Maschinenpistolen gesetzlich beschränkt ist. Da der Rahmen der gleiche ist, lässt sie sich leicht als eine 101 tarnen. Die 201 wird außerdem mit einer abnehmbaren Schulterstütze geliefert, wobei diese häufig schon verloren gegangen ist, wenn die Waffe schließlich auf die Straße gelangt.
item.colt_america_l36.desc=Die L36 ist ein weiterer Beitrag zum Weltklasseruf der Colt-Waffen. Sie ist preiswert, leicht zu verbergen und allgegenwärtig. Da sie häufig als vorübergehende Einsatzwaffe für Anfänger im Konzernsicherheitsdienst verwendet wird, ist sie mit einem einfachen elektronischen Besitzerwechsel- Feature ausgestattet, das immer wieder von Bullen und Ganoven gleichermaßen missbraucht wird. Die perfekte Wegwerfwaffe.
item.fichetti_security_600.desc=Diese als leichte Seitenwaffe für Sicherheitskräfte entwickelte Pistole erlaubt dem Benutzer dank ihres 30-Schuss-Magazins, wild um sich zu ballern, ohne sich Sorgen um seine Munition zu machen. Dadurch ist sie auch eine hervorragende Waffe für Decker. Die Security 600 ist mit einer abnehmbaren Schulterstütze und einem Lasermarkierer ausgestattet.
item.rudger_redhawk.desc=Dieser robuste Revolver ist der kleine Bruder des legendären Super Warhawk. Der Redhawk wurde im Hinblick auf Präzision und Ballerfreude konstruiert und weist einen revolutionären Single/Double-Action-Auswahlschalter auf. Die klassische Double Action gestattet einen Schuss mit jedem Druck des Abzugs (halbautomatischer Modus), während die Single-Action-Einstellung dem Benutzer in klassischer Wildwestmanier das „Fanning“ des Hahns ermöglicht (Salvenmodus).
item.ares_crusader_ii.desc=Eine große Munitionskapazität und ein ergonomisches Styling machen die Ares Crusader II zu einem Aushängeschild ihrer Kategorie. Der Markenname Ares ist ein Synonym für Funktionalität, und die Crusader II verfügt über ein integriertes Gasventilsystem zur Rückstoßkompensation und wird standardmäßig mit einem Smartgunsystem und zugehöriger Software geliefert.
item.ceska_black_scorpion.desc=Klein und tödlich, aber nicht gerade eine Schönheit. Hauptsächlich auf Salvenfeuer ausgelegt und mit einer ausklappbaren Schulterstütze ausgestattet.
item.steyr_tmp.desc=Ein Leichtbau-Polymerrahmen und die Fähigkeit zu vollautomatischen Feuer sind nicht unbedingt die ideale Designkombination, aber der Zweck der TMP besteht ja auch lediglich darin, genug Blei zu spucken, dass alle in Deckung gehen. Zur Standardausstattung gehört ein aufmontierter Lasermarkierer, der dem Benutzer die Illusion geben soll, er könne mit dieser Waffe tatsächlich zielen.
item.ares_predator_vi.desc=Die Predator V ruhte sich noch auf den Lorbeeren ihres Namens aus, aber die Predator VI ist eine echte Innovation im klassischen Design. Sie basiert auf dem Rahmen der ursprünglichen Predator und hat die übliche Smartgunfunktion, aber zusätzlich einen Salvenmodus und ein neues variables Munitionssystem, das diese Waffe wieder zur Königin der Straßen und Kriegsgebiete machen wird - was sich allerdings auch im Preis widerspiegelt. Das variable Munitionssystem ermöglicht es, ein einzelnes speziell konstruiertes Magazin (30 ¥ pro Ersatzmagazin) mit unterschiedlichen Munitionsarten zu bestücken. Die Smartgun wählt dann zwischen den Munitionsarten und befördert sie in erforderlicher und verfügbarer Stückzahl in die Kammer. Ist von einer bestimmten Sorte nicht mehr genug Munition vorhanden, zeigt der Munitionszähler „leer“ an und die Waffe hört auf zu feuern.
item.ares_viper_slivergun.desc=Die einzigartige Slivergun wird zur Kategorie der schweren Pistolen gezählt, aber sie ist eigentlich eine Waffenkategorie für sich. Sie feuert Metallsplitter ab, die als Flechettemunition gelten und auch als solche verkauft werden, aber nicht mit der Munition anderer Flechettewaffen austauschbar sind. Die Slivergun kann im Salvenmodus feuern, und ihre hohe Munitionskapazität macht sie zu einer gefürchteten Waffe auf den Straßen.
item.browning_ultra_power.desc=Die einstige Hauptkonkurrentin der Predator um den Titel als beste schwere Pistole der Welt musste ihre Titelambitionen aufgeben, nachdem sie mit den technologischen Weiterentwicklungen der Pred VI nicht mehr mithalten konnte. Dafür ist die Browning Ultra Power preisgünstiger und wird mit einem integrierten aufmontierten Lasermarkierer geliefert.
item.colt_government_2076.desc=Aufgrund undurchsichtiger Korruptionsgeschichten brauchten etliche Regierungsstellen neue Waffenverträge, deshalb erscheint ein neues Standardmodell nach nur zehn Jahren nicht so abwegig. In den Jahren der Technomancer- und Hacker-Panik seit den 60ern blieben viele der elektronisch gezündeten Government 2066 in den Waffenschränken, aus Angst, gehackt zu werden. Die Government 2076 kehrt zurück zur Machart der klassischen Manhunter (und tatsächlich trägt die Variante mit dem integrierten Smartgunsystem wieder diesen Namen) und wird mit integriertem Lasermarkierer geliefert.
item.colt_manhunter.desc=Aufgrund undurchsichtiger Korruptionsgeschichten brauchten etliche Regierungsstellen neue Waffenverträge, deshalb erscheint ein neues Standardmodell nach nur zehn Jahren nicht so abwegig. In den Jahren der Technomancer- und Hacker-Panik seit den 60ern blieben viele der elektronisch gezündeten Government 2066 in den Waffenschränken, aus Angst, gehackt zu werden. Die Government 2076 kehrt zurück zur Machart der klassischen Manhunter (und tatsächlich trägt die Variante mit dem integrierten Smartgunsystem wieder diesen Namen) und wird mit integriertem Lasermarkierer geliefert.
item.ruger_super_warhawk.desc=Laut und chromblitzend - so kennt man den Super Warhawk in den Straßen. Dieser Revolver funkelt und blinkt und schlägt Löcher so groß wie eine Trollfaust. Mit besserer Munition und besserem Zubehör werden diese Löcher dann auch noch richtig präzise.
item.colt_cobra_tz100.desc=Colt liebt die Vielfalt, und die Cobra-TZ-Serie bietet tatsächlich verschiedene Optionen. Die TZ-100 ist das Basismodell mit integrierter ausklappbarer Schulterstütze, bei der TZ-110 kommt ein aufmontierter Lasermarkierer hinzu, und die TZ-120 hat die Schulterstütze, den Lasermarkierer und ein laufmontiertes Gasventilsystem, was ihr bei Sicherheitskräften überall auf der Welt große Beliebtheit verschafft hat, aber dank dieses ganzen Schnickschnacks macht sie auch in Action-Trideos eine hervorragende Figur.
item.colt_cobra_tz110.desc=Colt liebt die Vielfalt, und die Cobra-TZ-Serie bietet tatsächlich verschiedene Optionen. Die TZ-100 ist das Basismodell mit integrierter ausklappbarer Schulterstütze, bei der TZ-110 kommt ein aufmontierter Lasermarkierer hinzu, und die TZ-120 hat die Schulterstütze, den Lasermarkierer und ein laufmontiertes Gasventilsystem, was ihr bei Sicherheitskräften überall auf der Welt große Beliebtheit verschafft hat, aber dank dieses ganzen Schnickschnacks macht sie auch in Action-Trideos eine hervorragende Figur.
item.colt_cobra_tz120.desc=Colt liebt die Vielfalt, und die Cobra-TZ-Serie bietet tatsächlich verschiedene Optionen. Die TZ-100 ist das Basismodell mit integrierter ausklappbarer Schulterstütze, bei der TZ-110 kommt ein aufmontierter Lasermarkierer hinzu, und die TZ-120 hat die Schulterstütze, den Lasermarkierer und ein laufmontiertes Gasventilsystem, was ihr bei Sicherheitskräften überall auf der Welt große Beliebtheit verschafft hat, aber dank dieses ganzen Schnickschnacks macht sie auch in Action-Trideos eine hervorragende Figur.
item.fn_p93_praetor.desc=Ihr unübersehbares Bullpup-Design führt zu einer automatischen Angstreaktion bei jedem, der diese Waffe in der Hand von Konzernsicherheitskräften erblickt. Die Praetor ist mit einer festen Schulterstütze, einem Lasermarkierer und einer Lampe mit drei Einstellungen (für Restlichtverstärkung, Infrarotsicht, sichtbares Licht) ausgestattet.
item.hk_227.desc=Heckler & Koch weiß, wie man eine Maschinenpistole baut, denn die 227 basiert seit über einem Jahrhundert auf dem gleichen Rahmen (der altehrwürdigen MP5). Diese gern von Konzern- und Militärsicherheitstrupps verwendete Waffe bietet eine einziehbare Schulterstütze, ein integriertes Smartgunsystem und einen eingebauten laufmontierten Schalldämpfer.
item.ingram_smartgun_xi.desc=Straßensamurai erwerben sich häufig einen legendären Ruf, der nicht immer verdient ist, aber die Smartgun wird ihrem Ruf als erstklassiger Schießprügel nun schon seit Jahrzehnten gerecht. Bekannt ist sie seit den 2050ern als Waffe der Wahl vieler legendärer Straßensamurai, und sie ist mit einem Gasventilsystem, einem Smartgunsystem und einem eingebauten Schalldämpfer ausgestattet.
item.sck_model_100.desc=Dank der Eliteeinheit der Roten Samurai konnte Shin Chou Kyogo seine Modell 100 zur Konzernentsprechung der Ingram Smartgun machen. Bei den Japanokons sind fast alle Sicherheitstrupps mit der SCK 100 ausgerüstet. Sie verfügt über ein internes Smartgunsystem und eine ausklappbare Schulterstütze.
item.uzi_iv.desc=Ein neues Design für eine neue Welt. Das neueste Uzi-Modell hat sich als erfolgreicher Markteinstieg für Spinrad Global erwiesen. Ausgestattet ist die Uzi V mit einer ausklappbaren Schulterstütze und einem eingebauten aufmontierten Lasermarkierer.
item.defiance_t250.desc=Diese solide halbautomatische Schrotflinte gibt es in einer Version mit normalem Lauf und einer mit kurzem Lauf. Sie ist gasbetrieben, verfügt allerdings auch über einen sekundären Vorderschaftrepetierer für Situationen, in denen es wichtiger ist, eine Ladehemmung zu verhindern, als schnell einen zweiten Schuss abzugeben (Ladehemmungen durch Patzer können mit einer Nebenhandlung behoben werden). Die kurzläufige Version hat eine Tarnbarkeit von 3.
item.defiance_t250_shortbarrel.desc=Diese solide halbautomatische Schrotflinte gibt es in einer Version mit normalem Lauf und einer mit kurzem Lauf. Sie ist gasbetrieben, verfügt allerdings auch über einen sekundären Vorderschaftrepetierer für Situationen, in denen es wichtiger ist, eine Ladehemmung zu verhindern, als schnell einen zweiten Schuss abzugeben (Ladehemmungen durch Patzer können mit einer Nebenhandlung behoben werden). Die kurzläufige Version hat eine Tarnbarkeit von 3.
item.mossberg_cmdt.desc=Diese Sturmschrotflinte liefert für ihr Geld eine ordentliche Durchschlagskraft. Sie kann entweder mit 10-Schuss-Stangenmagazinen bestückt werden oder mit einem 24-Schuss-Trommelmagazin für die großen Jungs. Die CMDT kann im Salvenmodus feuern und ist mit einem aufmontierten Lasermarkierer ausgestattet.
item.pjss_model_55.desc=Auch reiche Leute besitzen Schrotflinten. Geringe Produktionszahlen, die zumeist von reichen europäischen Jägern und Tontaubenschützen gekauft werden, machen diese Waffe zu einem tödlichen Statussymbol. Die Modell 55 verfügt über eine feste Schulterstütze mit einem integrierten Schockpolster. Beide Läufe können gleichzeitig als kurze Salve abgefeuert werden (s. Nicht genug Munition, S. 112).
item.remington_roomsweeper.desc=Ihr doppelter Lauf und der Pistolengriff lassen sofort erahnen, dass es Ärger gibt, wenn sie aus der Tasche gezogen wird. Wer kein Fan von Flechettemunition ist, lädt Munition für schwere Pistolen in die Roomsweeper und erhält eine ziemlich ungenaue Handkanone.
item.remington_900.desc=Dieses Hochleistungsrepetiergewehr für die Jagd hat einen klassischen hölzernen Schaft. Das Basismodell wird mit einem aufmontierten Zielfernrohr geliefert, kann aber kein Unterlaufzubehör aufnehmen.
item.ruger_101.desc=Futuristische Technologie im Jagdgewehrformat - dieses gasbetriebene Gewehr wird von vielen professionellen und Hobbyjägern sehr geschätzt. Es ist mit einem eingebauten Zielfernrohr und einer festen Schulterstütze mit Schockpolster ausgestattet.
item.ak_97.desc=ADas AK-97 wird wohl nie an Beliebtheit einbüßen, vor allem da es immer noch wie seine Vorgängermodelle aus der Mitte des 20. Jahrhunderts aussieht. Konstruiert im Hinblick auf Zuverlässigkeit und Haltbarkeit, ist es sicherlich nicht das hübscheste Mädchen beim Tanz, aber es kann durchaus einigen anderen die Show stehlen.
item.ares_alpha.desc=Berühmt gemacht durch die Ares-Firewatch-Teams, wurde das Ares Alpha rasch ein Erfolg bei Spezialeinheiten der UCAS und CAS sowie bei unzähligen Desert-Wars-Teams. Der integrierte Unterlauf-Granatwerfer, das Smartgunsystem und ein innovatives benutzerfreundliches Design machen diese Waffe zu etwas Besonderem.
item.colt_m23.desc=Billig, massenproduziert und unendlich anpassungsfähig - das M23 findet seinen Weg in die Hände von so ziemlich jedem, von Straßengangs über Piraten bis hin zu hochgezüchteten Regierungsspezialeinheiten. Das M23 kann zwei zusätzliche Unterlauf-Zubehörteile aufnehmen (insgesamt also drei).
item.fn_har.desc=Vor dem Namen Fabrique Nationale muss man sich in Acht nehmen, wenn man irgendwo auf der Welt Konzernsicherheitstrupps oder HTR-Teams gegenübersteht. Denn FN hat diese Waffe entwickelt, die mit einem Lasermarkierer und einem Gasventilsystem geliefert wird.
item.yamaha_raiden.desc=Während Ares das Alpha produzierte, entwickelten die Japanokons - durch Yamaha - das Raiden. Ein elektronischer Feuermechanismus und eine außergewöhnliche Zielgenauigkeit sind die wichtigsten Merkmale dieses Modells. Japanische Sicherheitskräfte und die Kaiserliche Japanische Marine schwören auf das Raiden. Es ist mit einem eingebauten Schalldämpfer, einem Smartgunsystem und einem Unterlauf-Granatwerfer sowie einer Unterlauf-Schrotflinte ausgestattet.
item.yamaha_raiden_shotgun.desc=Unterlauf-Schrotflinte des Yamaha Raiden Sturmgewehrs.
item.yamaha_raiden_launcher.desc=Unterlauf-Granatwerfer des Yamaha Raiden Sturmgewehrs.
item.ares_desert_strike.desc=„Das Desert Strike für die Desert Wars“ lautet der Slogan. Das für den Kampf unter extremen Bedingungen konstruierte Desert Strike ist mit einer festen Schulterstütze mit Schockpolster und einem abnehmbaren Zielfernrohr ausgestattet.
item.cavalier_arms_crocket_ebr.desc=Cavalier hat sich mit der Markteinführung eines Scharfschützengewehrs, das im Salvenmodus feuern kann, auf ein gefährliches Spiel eingelassen. Das Crockett EBR schießt auch auf große Entfernungen zielgenau, aber die Salven erlauben keine große Treffgenauigkeit über mehrere Salven hinweg. Das Crockett ist standardmäßig mit einer festen Schulterstütze mit Schockpolster und einem abnehmbaren Zielfernrohr ausgestattet.
item.ranger_arms_sm6.desc=Ranger Arms weiß genau, was schon immer der Kernpunkt der SM-Serie war: möglichst geräuscharm Zielpersonen auszuschalten. Dieses Scharfschützengewehr verfügt über einen Schalldämpfer, ein Zielfernrohr, ein Smartgunsystem und eine feste Schulterstütze mit Schockpolster. Das SM- 6 bleibt der Tradition der Serie treu, ein Gewehr für den schnellen Einsatz und ein ebenso schnelles Verschwinden zu sein. Zerlegt passt es in eine handelsübliche Aktentasche; das Zusammensetzen oder Auseinandernehmen erfordert eine Ausgedehnte Probe auf Feuerwaffen + Logik (6, Haupthandlung). Beim SM-6 konnte endlich das Problem der Schadensanfälligkeit beseitigt werden, und in zusammengesetztem Zustand funktioniert die Waffe problemlos in allen denkbaren Situationen.
item.barret_model_122.desc=Manchmal muss man auf einen Feind schießen; und manchmal muss man durch die Seite eines Schützenpanzers auf einen Feind schießen. Das Barret Modell 122 ist in der Lage, Metall zu durchdringen und das zu treffen, was eigentlich dadurch geschützt werden soll. Es zerfetzt Maschinen und Fahrzeuge mit einem hässlichen reißenden Geräusch, das Musik in den Ohren des Schützen ist. Es ist mit einem Schalldämpfer, einem Smartgunsystem und einem ausklappbaren Zweibein ausgestattet.
item.ingram_valiant.desc=Das Valiant ist ein leichtes Maschinengewehr und wird von Söldnereinheiten der ganzen Welt verwendet. Zur Grundausstattung gehören eine feste Schulterstütze mit Schockpolster, ein Lasermarkierer und ein laufmontiertes Gasventilsystem.
item.stoner_ares_m202.desc=Dieses mittlere Maschinengewehr hat eine gewaltige Durchschlagskraft und ist oft in den Händen von Trollen anzutreffen, für die Subtilität ein Fremdwort ist. Es ist eine brutal einfache Waffe, aber wer etwas mehr Komplexität wünscht, kann sie mit allerlei Zubehör aufrüsten.
item.rpk_hmg.desc=Dieses schwere Maschinengewehr wird häufig von Streitkräften in Osteuropa und Asien verwendet. Für gewöhnlich wird es als fahrzeugmontierte Waffe eingesetzt, ist aber standardmäßig auch mit einem abnehmbaren Dreibein ausgestattet, da das RPK am besten aus liegender, sitzender oder kniender Position abgefeuert wird, wenn es nicht auf einem Fahrzeug montiert ist.
item.panther_xxl.desc=Klobig, hässlich, tödlich und zerstörerisch bis zum Abwinken - die Panther-XXL-Sturmkanone ist der Stoff für Albträume. Damit auch jeder Schuss sitzt, wird sie mit eingebautem Smartgunsystem geliefert.
item.ares_s3_super_squirt.desc=Der Name ist eigentlich irreführend; man könnte glauben, die Super Squirt wäre nur eine Wasserpistole oder so etwas, aber tatsächlich handelt es sich im Grunde um einen aufgemotzten Paintball-Markierer, der nichttödliche Gelpacks mit Dimethylsulfoxid (DMSO) verschießt. Das DMSO zwingt die Haut, eine weitere zusätzlich enthaltene Chemikalie aufzunehmen. Der Angriff selbst verursacht keinen Schaden, aber wenn die Zielperson erfolgreich getroffen wird, überträgt das DMSO die gewünschte Substanz direkt in den Blutkreislauf des Opfers, wie ein Gift mit dem Vektor Kontakt (s. Toxine und Drogen, S. 124). Die Super Squirt kann mit lauf- und unterlaufmontiertem Zubehör versehen werden.
item.parashield_dart_pistol.desc=Seit Jahrzehnten ist Parashield der industrielle Standard für Pfeilwaffen, die mit ein bisschen Plastik, Stahl und einem chemischen Cocktail selbst einen Troll umhauen können. Das Pistolenmodell kann nur mit aufmontiertem Zubehör versehen werden, während die Gewehrversion bereits mit einem aufmontierten Zielfernrohr ausgestattet ist und aufund unterlaufmontiertes Zubehör aufnehmen kann. Beide Waffen verschießen nur Injektionspfeile (S. 262)
item.parashield_dart_rifle.desc=Seit Jahrzehnten ist Parashield der industrielle Standard für Pfeilwaffen, die mit ein bisschen Plastik, Stahl und einem chemischen Cocktail selbst einen Troll umhauen können. Das Pistolenmodell kann nur mit aufmontiertem Zubehör versehen werden, während die Gewehrversion bereits mit einem aufmontierten Zielfernrohr ausgestattet ist und aufund unterlaufmontiertes Zubehör aufnehmen kann. Beide Waffen verschießen nur Injektionspfeile (S. 262)
item.ares_antioch-2.desc=Der Antioch II ist nicht viel mehr als ein Rohr mit einem Abzug dran, ausgestattet mit einem Smartgunsystem. Eine sekundäre Zündereinstellung ermöglicht die WiFi-Aktivierung der abgefeuerten Granaten.
item.armtech_mgl6.desc=Ein halbautomatischer Granatwerfer in einem Pistolenbzw. Gewehr-Bullpup-Design, der sehr schnell für sehr viel Ärger innerhalb seiner Reichweite sorgen kann.
item.armtech_mgl12.desc=Ein halbautomatischer Granatwerfer in einem Pistolenbzw. Gewehr-Bullpup-Design, der sehr schnell für sehr viel Ärger innerhalb seiner Reichweite sorgen kann.
item.aztechnology_striker.desc=Der Striker ist tödlich und wegwerfbar - und damit die perfekte Analogie zu einem Runner. Das Abschussrohr kann wiederverwendet werden, was angesichts der jüngsten Preisanstiege nicht unerfreulich ist.
item.onotari_interceptor.desc=Saeder-Krupp hat diesen Mehrzweckraketenwerfer für militärische Zwecke entwickelt. Der Werfer hat zwei separate Läufe und kann damit zwei Raketen gleichzeitig laden, die auch nicht vom gleichen Typ sein müssen. Die Läufe können nicht gleichzeitig abgefeuert werden, aber man hat schon von Fällen gehört, in denen diese Sicherheitsvorrichtung überbrückt wurde, sehr zum Leidwesen des Ziels - und des Schützen, wie sich herausstellte. Der Werfer hat ein internes Smartgunsystem, mit dem das Sicherheitssystem überbrückt werden kann; werden beide Läufe abgefeuert, wird der Angriffswürfelpool aufgeteilt, und die Angriffe beider Raketen werden separat ausgewürfelt. Der Schütze muss gegen einen Feuerschaden von 6K Widerstand leisten, wenn er beide Läufe gleichzeitig abfeuert.
item.ammo_holdout_light_machine.desc=Holdout-/L. Pistole/Automatikp.
item.ammo_heavy_smg.desc=Munition für Schwere Pistolen/M-Pistolen
item.ammo_rifles.desc=Munition für Gewehre
item.ammo_taser.desc=Munition für Taser
item.ammo_darts.desc=Injektionspfeile für entsprechende Waffen
item.ammo_cannon.desc=Munition für Sturmkanonen
item.ammo_arrow.desc=Pfeil
item.ammo_injection_arrow.desc=Injektionspfeil
item.stun_grenade.desc=Diese auch als Schockgranaten bezeichneten Granaten explodieren mit einem blendend grellen Lichtblitz und einer lauten Druckwelle, die jeden innerhalb ihrer Reichweite betäubt und ins Straucheln bringt. Zusätzlich zum Schaden erleidet jeder innerhalb der Sprengwirkung einer Betäubungsgranate die Status Benommen, Ertaubt I und Geblendet I.
item.fragmentation_grenade.desc=Die klassische Splittergranate verteilt tödliche Schrapnellsplitter über einen weiten Bereich.
item.high_explosive_grenade.desc=Diese Granaten verursachen eine heftige Explosion, vor allem in geringer Entfernung.
item.gas_grenade.desc=Mit diesen Granaten können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_grenade.desc=Ähnlich wie eine Gasgranate gibt eine Rauchgranate eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchgranaten schränken normale Sicht (inklusive Restlichtverstärkung) ein, IR-Rauchgranaten auch Infrarotsicht. Die Wolke hat einen Anfangsradius von 5 Metern und hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.flash_pak.desc=Ein Flash-Pack ist ein kleines elektronisches Gerät, etwa 10 mal 10 mal 2 Zentimeter groß, das an allen Seiten Mikro-Blitzlichter aufweist, die in einer zufälligen, stroboskopartigen Sequenz aufblitzen, um Gegner zu verwirren. Jeder innerhalb der Reichweite eines Flash-Packs, der normale Sicht verwendet, gelangt in den unter der jeweiligen Reichweite in der Tabelle Granaten angegebenen Status Geblendet (S. 54) und erleidet die entsprechenden Modifikatoren bei allen Proben, die Sehen erfordern. Die Verwendung von Restlichtverstärkung verstärkt den Status um eine Stufe, Blitzkompensation schwächt ihn um eine Stufe ab. Das Flash-Pack hat 10 Ladungen und verbraucht eine Ladung pro Kampfrunde. Am Stromnetz lädt es sich mit einer Geschwindigkeit von 1 Ladung pro 10 Sekunden wieder auf.
item.anti-vehicle_rocket.desc=AF-(Lenk-)Raketen enthalten eine Hohlladung, die sich ihren Weg durch ein Fahrzeug oder eine Barriere brennt oder schlägt. Der Aufprall erzeugt zwar eine Sprengwirkung, die aber im Vergleich zu einer Sprengrakete begrenzt ist.
item.fragmentation_rocket.desc=Dieser Sprengkopf wird hauptsächlich gegen Personen eingesetzt. Bei der Detonation werden mit hoher Geschwindigkeit Splitter freigesetzt, die sich in ungeschützte Ziele bohren. Diese (Lenk-)Raketen sind hochwirksam gegen ungepanzerte Personen, aber nicht besonders effektiv gegen Barrieren, Gebäude und Fahrzeuge.
item.high_explosive_rocket.desc=Spreng-(Lenk-)Raketen richten schweren Schaden in einem kleinen Bereich an. Ihr Sprengmuster ähnelt dem einer Sprenggranate, reicht aber etwas weiter.
item.gas_rocket.desc=Mit diesen Raketen können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_rocket.desc=Ähnlich wie eine Gasrakete gibt eine Rauchrakete eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchraketen schränken normale Sicht (inklusive Restlichtverstärkung) ein, IR-Rauchraketen auch Infrarotsicht. Die Wolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.anti-vehicle_missile.desc=AF-(Lenk-)Raketen enthalten eine Hohlladung, die sich ihren Weg durch ein Fahrzeug oder eine Barriere brennt oder schlägt. Der Aufprall erzeugt zwar eine Sprengwirkung, die aber im Vergleich zu einer Sprengrakete begrenzt ist.
item.fragmentation_missile.desc=Dieser Sprengkopf wird hauptsächlich gegen Personen eingesetzt. Bei der Detonation werden mit hoher Geschwindigkeit Splitter freigesetzt, die sich in ungeschützte Ziele bohren. Diese (Lenk-)Raketen sind hochwirksam gegen ungepanzerte Personen, aber nicht besonders effektiv gegen Barrieren, Gebäude und Fahrzeuge.
item.high_explosive_missile.desc=Spreng-(Lenk-)Raketen richten schweren Schaden in einem kleinen Bereich an. Ihr Sprengmuster ähnelt dem einer Sprenggranate, reicht aber etwas weiter.
item.gas_missile.desc=Mit diesen Raketen können Chemikalien oder Toxine verteilt werden (s. Toxine und Drogen, S. 124). Die Gaswolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.smoke_missile.desc=Ähnlich wie eine Gasrakete gibt eine Rauchrakete eine Wolke ab, die jedoch aus Rauch besteht statt aus giftigem Gas. Die Wolke schränkt die Sicht ein und verursacht den Status Geblendet I bei jedem, der etwas durch die Wolke hindurch tun will (etwa feuern), und Geblendet II bei jedem, der sich innerhalb der Wolke befindet. Rauchraketen schränken normale Sicht (inklusive Restlichtverstärkung) ein, IR-Rauchraketen auch Infrarotsicht. Die Wolke hält sich für etwa 10 Kampfrunden. Näheres dazu findest du in den Regeln zu Gasangriffen auf Seite 120.
item.conventional_explosives.desc=Für die Bauindustrie gibt es eine Reihe von explosiven Verbindungen in fester oder flüssiger Form für alle zerstörerischen Bedürfnisse. Alle Sprengstoffe werden in einem Sprengstoffpaket gekauft, das eine feste Stufe hat, die ein Maß für ihre Sprengkraft und die Menge ist, ohne beides genauer zu definieren.
item.plastic_explosives.desc=Diese hochstabilen, formbaren und haftfähigen Sprengstoffe sind als Militärausrüstung klassifiziert. Für bestimmte Aufgaben, wie etwa das Durchbrechen von Mauern, sind sie ideal. Sie sind in der Regel gefärbt, um die für ihre Detonation nötige Spannung anzuzeigen, von schwarz (für bloße Magnetfeldinduktion) bis hin zu kalkweiß (für Industriesprengstoffe mit einer Detonationsspannung von 440 Volt). Wir schreiben bewusst „in der Regel“, denn manche Bombenbastler färben ihre Sprengstoffe gern anders ein, um potenzielle Bombenentschärfer in die Irre zu führen.
item.foam_explosives.desc=Dies ist Plastiksprengstoff mit der Konsistenz von Rasierschaum in einer Sprühdose. Er ist perfekt, um ihn in Spalten zu sprühen, und wird genauso ausgelöst wie normaler Plastiksprengstoff.
item.detonator_cap.desc=Dieser Zünder wird in den Sprengstoff eingesetzt und durch einen Timer oder ein Funksignal gezündet. Den Timer einzustellen erfordert eine Haupthandlung.
item.feedback_feature.desc=Diese haptische Kleidung ermöglicht es, die taktile Komponente einer AR-Erfahrung zu erleben.
item.electrochromic_feature.desc=Elektrochrome Fäden können bei unterschiedlicher Spannung die Farbe wechseln, womit man die Farbe seiner Kleidung verändern oder Texte, Bilder oder Muster anzeigen kann. Das ist allein schon aus modischen Gesichtspunkten praktisch, aber noch besser eignet es sich dazu, in einer Menschenmenge zu verschwinden, wenn man einen schnellen Kostümwechsel braucht. Man kann selbst Panzerkleidung in elektrochromer Ausführung bekommen. Das Verändern der Einstellungen von elektrochromer Kleidung erfordert eine Nebenhandlung, aber der Farbwechsel ist erst nach zwei Kampfrunden komplett.
item.clothing_street.desc=Die Kleidung des Jahres 2080 ist mit einigen äußerst nützlichen Optionen ausgestattet: Kommlinks, Musikplayer und andere elektronische Geräte können direkt in den Stoff eingewebt sein und werden durch eingeflochtene Batterien oder spezielle energiesammelnde Stoffe aufgeladen. Am anderen Ende des Spektrums gibt es billige, auf Soja basierende „Onewear“, die man für zehn Nuyen pro Set überall aus dem Automaten ziehen kann, egal in welchem Sprawl man sich gerade befindet. Je mehr Geld man ausgibt, desto schicker sieht man aus - so einfach ist das.
item.clothing_squatter.desc=Die Kleidung des Jahres 2080 ist mit einigen äußerst nützlichen Optionen ausgestattet: Kommlinks, Musikplayer und andere elektronische Geräte können direkt in den Stoff eingewebt sein und werden durch eingeflochtene Batterien oder spezielle energiesammelnde Stoffe aufgeladen. Am anderen Ende des Spektrums gibt es billige, auf Soja basierende „Onewear“, die man für zehn Nuyen pro Set überall aus dem Automaten ziehen kann, egal in welchem Sprawl man sich gerade befindet. Je mehr Geld man ausgibt, desto schicker sieht man aus - so einfach ist das.
