item.clothing_luxury.desc=Die Kleidung des Jahres 2080 ist mit einigen äußerst nützlichen Optionen ausgestattet: Kommlinks, Musikplayer und andere elektronische Geräte können direkt in den Stoff eingewebt sein und werden durch eingeflochtene Batterien oder spezielle energiesammelnde Stoffe aufgeladen. Am anderen Ende des Spektrums gibt es billige, auf Soja basierende „Onewear“, die man für zehn Nuyen pro Set überall aus dem Automaten ziehen kann, egal in welchem Sprawl man sich gerade befindet. Je mehr Geld man ausgibt, desto schicker sieht man aus - so einfach ist das.
item.synthleather_jacket.desc=Kunstleder ist die Norm auf der Straße, und diese Art der Oberbekleidung (von hüftlang bis zum Mantel) kommt nie aus der Mode. Sie bietet sogar ein Mindestmaß an Schutz.
item.actioneer_business.desc=Dieser modische gepanzerte Anzug ist besonders bei Mr Johnsons, Unterhändlern und Schiebern beliebt, die nach ein bisschen Schutz, gepaart mit Stil, suchen. Er enthält ein Tarnholster (siehe S. 261) im Jackett.
item.armor_clothing.desc=Durch ihr leichtes ballistisches Gewebe sind diese Kleidungsstücke fast unmöglich als Panzerung zu erkennen. Sie bieten zwar nicht so viel Schutz wie echte Panzerung, aber dafür sind sie in so ziemlich jedem Stil erhältlich, den man sich wünscht.
item.armor_jacket.desc=Sie ist in einer Vielzahl von Stilen erhältlich und bietet guten Schutz, ohne zu sehr aufzufallen. Aber denk nicht mal dran, sie bei einer Dinnerparty oder in einem Regierungsgebäude zu tragen.
item.armor_vest.desc=Diese moderne, flexible Weste wurde dafür entwickelt, unter normaler Kleidung getragen zu werden, ohne dass sie dabei aufträgt.
item.chameleon_suit.desc=Dieser Ganzkörperanzug hat eine Rutheniumpolymerbeschichtung, die mit einem Sensorsystem verbunden ist. Die Sensoren scannen die Umgebung und replizieren die Bilder in der richtigen Perspektive auf die Beschichtung. Ein Charakter erhält ein Bonus- Edge für Heimlichkeitsproben, wenn er einen aktiven Chamäleonanzug trägt.
item.full_body_armor.desc=Diese Panzerung wird von Militär- und Sicherheitseinheiten auf der ganzen Welt bei besonders gefährlichen Einsätzen getragen. Sie ist speziell so designt, dass sie einschüchternd wirkt, enthält aber auch eine Vielzahl an taktischen Holstern, Taschen und Gurten, die ihr eine tödliche Effizienz verleihen. Und sie fällt auf - nur damit ihr es wisst. Die Panzerung kann mit Umweltanpassung (an heiße oder kalte Umgebungen) ausgestattet oder chemisch versiegelt werden, um den Träger vollständig vor toxischen Umgebungen und Angriffen zu schützen.
item.full_body_armor_with_helmet.desc=Diese Panzerung wird von Militär- und Sicherheitseinheiten auf der ganzen Welt bei besonders gefährlichen Einsätzen getragen. Sie ist speziell so designt, dass sie einschüchternd wirkt, enthält aber auch eine Vielzahl an taktischen Holstern, Taschen und Gurten, die ihr eine tödliche Effizienz verleihen. Und sie fällt auf - nur damit ihr es wisst. Die Panzerung kann mit Umweltanpassung (an heiße oder kalte Umgebungen) ausgestattet oder chemisch versiegelt werden, um den Träger vollständig vor toxischen Umgebungen und Angriffen zu schützen. Der Helm der Panzerung hat eine Kapazität von 6 und kann mit Sicht- und Audioverstärkungen ausgestattet werden.
item.lined_coat.desc=Dieser Mantel im Wildweststil ist seit 50 Jahren auf den rauen Straßen der Sprawls dieser Welt beliebt. Neben seinen Schutzeigenschaften gewährt der gepanzerte Mantel 1 Bonus-Edge gegen Proben, um unter ihm versteckte Gegenstände zu entdecken.
item.urban_explorer_jumpsuit.desc=Dieses speziell für Kuriere, Athleten und Freerunner entwickelte Kleidungsstück ist die gepanzerte Version der „Automatenkleidung“, aber erhältlich in einer Vielzahl schriller Stile. Und weil er so hip ist, enthält der Overall einen eingebauten Musikplayer und einen Vitalmonitor.
item.helmet.desc=Helme gibt es in vielen verschiedenen Formen und Größen, und sie schützen die Rübe vor Schaden. Helme haben eine Kapazität von 4 (bzw. 6 für den Helm der Ganzkörperpanzerung), um mit Zubehör wie Trodennetzen und Sichtverstärkungen ausgerüstet zu werden. Ihr Verteidigungswert wird zum Verteidigungswert getragener Rüstung addiert.
item.ballistic_shield.desc=Dieser beeindruckende schwarze Schild wird von SWAT-Teams und im Stadtkampf verwendet. Er hat ein durchsichtiges Plasstahl-Fenster und einen eingebauten Leiterrahmen an der Innenseite, sodass er zum Überklettern kleinerer Hindernisse benutzt werden kann.
item.riot_shield.desc=Dieser aus durchsichtigem Plasstahl bestehende Cousin des ballistischen Schilds bietet zusätzlich eine elektrische Angriffsoption. Der Angriff erfolgt mit der Fertigkeit Nahkampf und den Angriffscharakteristika eines Betäubungsschlagstocks. Der Schild enthält 10 elektrische Ladungen; ans Stromnetz angeschlossen, lädt er sich mit einer Geschwindigkeit von 1 Ladung pro 10 Sekunden wieder auf.
item.chemical_protection.desc=Diese Modifikation schützt den Träger vor chemischen Angriffen mit einem Kontaktvektor (s. Toxine und Drogen, S. 124). Die Spezialbeschichtung neutralisiert den Status Verätzt für eine Anzahl von Angriffen, die ihrer Stufe entspricht. Danach ist die Beschichtung so abgenutzt, dass sie keine chemische Isolierung mehr bietet.
item.chemical_seal.desc=Die chemische Versiegelung ist nur für Ganzkörperpanzerungen erhältlich. Sie besteht aus einer luftdichten Umweltsteuerung, die mit einer Haupthandlung aktiviert werden kann. Die Versiegelung schützt den Träger vor jedem Status, der von Chemikalien mit Kontakt- oder Inhalationsvektor Die chemische Versiegelung ist nur für Ganzkörperpanzerungen erhältlich. Sie besteht aus einer luftdichten Umweltsteuerung, die mit einer Haupthandlung aktiviert werden kann. Die Versiegelung schützt den Träger vor jedem Status, der von Chemikalien mit Kontakt- oder Inhalationsvektor
item.cold_resistance.desc=Thermalfasern und hitzehaltende Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Unterkühlt so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so abgenutzt, dass sie keine Kälteresistenz mehr bietet.
item.fire_resistance.desc=Feuerdämmende, nicht brennbare Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Brennend so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so angegriffen, dass sie keine Feuerresistenz mehr bietet.
item.electricity_resistance.desc=Elektrische Isolierung und nichtleitende Materialien schützen den Träger. Diese Modifikation neutralisiert den Status Gebrutzelt so viele Male, wie ihrer Stufe entspricht; danach ist die spezielle Beschichtung so angegriffen, dass sie keine Resistenz gegen Elektrizität mehr bietet.
item.meta_link.desc=Kommlinks sind universelle Kommunikationsgeräte, die von praktisch jedermann immer und überall verwendet werden. Es gibt sie in einer Vielzahl von Formen und Stilen, teilweise integriert in Bodytech oder sogar in Kleidungsstücke.\nSelbst die einfachsten Kommlinks verfügen über AR-Fähigkeit, Telefon, Videofon, Textkommunikation, Musikplayer, Mikro-Trideoprojektoren, Touchscreen-Displays, hochauflösende Kameras für Videos und Bilder, Bild/Text- und RFID-Scanner, eingebaute GPS-Systeme, Chip-Player, Credstickleser, einen biometrischen Scanner, einziehbare Ohrhörer, Sprachsteuerung und Text-to-Speech- sowie Speech-to-Text-Technologie. Und sie können noch mit jeder Menge weiterem Zubehör ausgestattet werden.\nKommlinks können eine Maximalzahl an Slaves haben, die ihrer Stufe in Datenverarbeitung entspricht.
item.sony_emporer.desc=Kommlinks sind universelle Kommunikationsgeräte, die von praktisch jedermann immer und überall verwendet werden. Es gibt sie in einer Vielzahl von Formen und Stilen, teilweise integriert in Bodytech oder sogar in Kleidungsstücke.\nSelbst die einfachsten Kommlinks verfügen über AR-Fähigkeit, Telefon, Videofon, Textkommunikation, Musikplayer, Mikro-Trideoprojektoren, Touchscreen-Displays, hochauflösende Kameras für Videos und Bilder, Bild/Text- und RFID-Scanner, eingebaute GPS-Systeme, Chip-Player, Credstickleser, einen biometrischen Scanner, einziehbare Ohrhörer, Sprachsteuerung und Text-to-Speech- sowie Speech-to-Text-Technologie. Und sie können noch mit jeder Menge weiterem Zubehör ausgestattet werden.\nKommlinks können eine Maximalzahl an Slaves haben, die ihrer Stufe in Datenverarbeitung entspricht.
