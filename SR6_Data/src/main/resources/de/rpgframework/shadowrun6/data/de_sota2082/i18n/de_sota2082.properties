item.walther_esg1.wifi=Bei einem erfolgreichen Treffer steckt das Projektil dank Widerhaken in der Haut bzw. Kleidung des Getroffenen fest. Bei bestehender Wifi-Verbindung kann der Schütze den Elektroschock verzögern. Der Schock und damit die Schadenswirkung kann jederzeit durch eine Nebenhandlung ausgelöst werden. Außerdem dient das Projektil als Peilsender.
