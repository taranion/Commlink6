mentorspirit.chaos=Chaos
mentorspirit.chaos.page=112
mentorspirit.chaos.disadvantage=You are an inveterate gossip trying to stir up trouble, especially between friends, and thus cannot keep damaging secrets to yourself. Also, anytime you encounter a public situation deemed too quiet or stable (gamemaster’s discretion), make a Willpower + Intuition (3) test. Failure means that you are compelled to stir the pot in any way you desire, be it attacking, telling lies, or throwing a drink on someone nearby.
mentorspirit.chaos.alias.trickster=Trickster
mentorspirit.chaos.alias.troublemaker=Troublemaker

mentorspirit.moon=Moon
mentorspirit.moon.page=113
mentorspirit.moon.disadvantage=Followers of Moon must make a Charisma + Willpower (3) test in order to engage in direct confrontation; failure means they cannot make any action considered as such. Negotiation is not considered confrontation (Moon loves discussion), but arguments fall into that category.
mentorspirit.moon.alias.raven=Raven
mentorspirit.moon.alias.cobra=Cobra

mentorspirit.peacemaker=Peacemaker
mentorspirit.peacemaker.page=113
mentorspirit.peacemaker.disadvantage=You even see enemies as potential friends and go out of your way to keep from hurting anyone unless the situation truly warrants it. At the very beginning of combat, you must pass a Charisma + Intuition (3) test; failure means you are unable to take actions that cause Physical damage for the duration of combat. At the beginning of a new Combat Turn, you may choose to retake the test if you failed the first time and you or a member of your team suffered damage in the previous Combat Turn.
mentorspirit.peacemaker.alias.dove=Dove
mentorspirit.peacemaker.alias.mediator=Mediator
mentorspirit.peacemaker.alias.pacifist=Pacifist

