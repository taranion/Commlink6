mentorspirit.erlkoenig=Erlkönig
mentorspirit.erlkoenig.page=181
mentorspirit.erlkoenig.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um bei einer Ablehnung nicht mit Einschüchterungsversuchen zu reagieren.
mentorspirit.loreley=Loreley
mentorspirit.loreley.page=182
mentorspirit.loreley.disadvantage=Wenn du deine Stimme in einer Verhandlung aus irgendeinem Grund nicht einsetzen kannst, erhältst du einen Würfelpoolmalus von -1 auf alle sozialen Proben, bis du deine Stimme wieder nutzen kannst.
mentorspirit.schwindler=Schwindler
mentorspirit.schwindler.page=182
mentorspirit.schwindler.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um der Versuchung zu widerstehen, einen Streich zu spielen oder einen Trick anzuwenden, selbst wenn dir oder deinen Vertrauten dadurch ein Schaden entstehen könnte.
mentorspirit.wasserfrau=Wasserfrau
mentorspirit.wasserfrau.page=182
mentorspirit.wasserfrau.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um an einem Plan festzuhalten, der mehr Schwierigkeiten mit sich bringt, als zu erwarten war.
mentorspirit.winselmutter=Winselmutter
mentorspirit.winselmutter.page=182
mentorspirit.winselmutter.disadvantage=Dir muss eine Probe auf Willenskraft + Charisma (3) gelingen, um in einem Kampf anzugreifen, bevor einer der gegnerischen Charaktere angegriffen hat.

