item.cnh_g12.desc=Case New Holland beschreibt die Beziehung zwischen seinen überschweren K12-Agrardrohnen und den Flugdrohnen vom Typ "Harvesting Supporter (HS) Typ G12" als "symbiotisch". Im Automatikbetrieb dienen die im Straßenjargon "Geos" bzw. "Geodezist" genannten Drohnen als Vermesser der Schnittbahn, wobei Fragen der Wirtschaftlichkeit (beste Routen), der Sicherheit der K12 (Steine, feuchte Senken, Barrikaden von Öko-Wirrköpfen, große Critter) und der gesetzlichen Grenzen im Einsatzgebiet (geschützte Critter, Öko-Wirrköpfe in der Schnittbahn) im Vordergrund stehen. Neben diesen allgemeinen Vermessungsaufgaben sind alle Geodezisten mit einem Einsatzmodul ausgestattet. Standardmäßig ist dies ein Brandbekämpfungsmodul, da Funkenschläge und Überhitzungen von Erntemaschinen sowie Feldbrände die größte Gefahr für die Erträge darstellen. Alternativ können G12-Drohnen auch mit Werfern für Saatgut, Pflanzenschutzmittel und (tödliche und nichttödliche) Abwehrgeschosse ausgerüstet werden. Anmerkung: Als Waffe eingesetzt entspricht Lösch-/ Saatgut der Rauchgranate, Pflanzenschutzmittel entspricht Brechreiz-Gas oder Neuro-Stun VIII (nach Maßgabe des Spielleiters).

