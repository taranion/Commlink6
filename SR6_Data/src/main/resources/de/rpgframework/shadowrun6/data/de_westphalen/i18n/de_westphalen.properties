item.cnh_k12.desc=Vom Weltmarktführer für Landwirtschaftsmaschinen Case New Holland (CNH) kommt die Agrardrohne mit dem sperrigen Namen "Combine Harvester Typ K12", in der Matrix dank ihrer pompösen Einführungskampagne mit jeder Menge Sowjetromantik in Osteuropa auch als "Kombinat" bekannt. Die 780 PS starke 20-Tonnen-Drohne wird mit einem breiten Spektrum an Werkzeugaufsätzen und den passenden Autosoft-Erweiterungen des Pilotprogramms angeboten: Pflügen, säen, stutzen, wässern, lichten, dreschen oder auch Holz ernten sind kein Problem für den größten Jungen der CNH-Familie. Die Einsatzbandbreite wird durch das integrierte Drohnen-Rack nochmals erweitert: Die übergroße Agrardrohne dient dann als Trägersystem für kleinere Drohnen, die je nach Aufgabenprofil individuell zusammengestellt werden können. Jede der drei getrennt verschließbaren Drohnenbuchten kann von einer einzelnen mittelgroßen Drohne wie der MCT-Nissan Roto-Drohne bis zu einem Schwarm aus bis zu 100 MCT Hornets alles aufnehmen, um den Fruchtstand und etwaige Schädlinge (inkl. Runner) aus nächster Nähe zu analysieren. Oder bei entsprechender Bestückung zu erledigen. Anmerkung: Wird das Erntemodul als Waffe verwendet, wird einer der Würfel der Angriffsprobe durch einen Schicksalswürfel ersetzt (im normalen autonomen Betrieb stoppt der Harvester, sobald ein menschengroßes Lebewesen erfasst wird). Die Angriffsprobe erfolgt mit einer Probe auf Steuern + Reaktion bzw. Intuition (s. SR6, S. 200). Schaden 12K, Angriffswerte  14/-/-/-/-  (Modul  zur Holzernte: 20/-/-/-/-).

item.cnh_k12.item.weapon_k12.desc=Wird das Erntemodul als Waffe verwendet, wird einer der Würfel der Angriffsprobe durch einen Schicksalswürfel ersetzt (im normalen autonomen Betrieb stoppt der Harvester, sobald ein menschengroßes Lebewesen erfasst wird). Die Angriffsprobe erfolgt mit einer Probe auf Steuern + Reaktion bzw. Intuition (s. SR6, S. 200). Schaden 12K, Angriffswerte  14/-/-/-/-  (Modul  zur Holzernte: 20/-/-/-/-).

