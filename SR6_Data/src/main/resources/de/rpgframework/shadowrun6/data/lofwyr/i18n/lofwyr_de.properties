draketype.western.desc=Westlicher Drake
draketype.feathered.desc=Gefiederter Drake
draketype.seadrake.desc=Seedrake

technique.rake.desc=Erhöhe den Schadenswert aller Angriffe mit Cyberimplantat- oder natürlichen Klingenwaffen um 1 (zusätzlich zu natürlichen Krallen-, Biss- und Schwanzangriffen und Cyberimplantatwaffen wie Spornen und Cyberkiefern gilt dieser Bonus für getragene Nahkampfwaffen wie Unterarmschnappklingen und Handkrallen, nicht aber für geführte Nahkampfwaffen wie Schwerter, Messer, Äxte usw.).
martialart.drachenklaue.desc=Die "Saeder-Krupp-zertifizierte waffenlose Sicherungstechnik für den Schutzdienst" ist einerseits eine Kampfkunst, die extra von der und für die Saeder-Krupp-Sicherheit entwickelt wurde. Sobald sie durch sie populär gemacht worden war, wurde sie als "Drachenklaue" neu verpackt und – genau nach Plan – in ein Produkt verwandelt, das für die Massen attraktiv ist. \nDurch S-K-zertifizierte Schulen oder ein Matrix-Zertifizierungsprogramm schreiten Praktizierende dieser Kampfkunst durch eine Reihe von metallischen "Gürteln" voran (S-K-Offiziere dürfen ihre Uniformen dabei durch subtile Abzeichen modifizieren), die von Kupfer über Bronze, Eisen, Kobalt und Silber bis hin zu Gold (die Farbe von Lofwyrs Schuppen) reichen. In dieser Form ist Drachenklaue … vollkommen adäquat und im Allgemeinen gleichwertig mit dem brutalen Mixed-Martial-Arts-Training von Lone Star, Knight Errant und vielen anderen militärischen und paramilitärischen Organisationen weltweit, wenn auch mit einem größeren Schwerpunkt auf implantierte Waffen und weniger auf Feuerwaffen. In dieser Form hat sie sich bei Messerklauen und -schnallen in ganz Europa sowie in den Reihen der S-K-Sicherheitsagenten verbreitet. \nAndererseits können Drachenklaue-Techniken leicht so modifiziert werden, dass sie zu allen Arten von Paracritter- und Dracoformkörpern passen; einige Quellen tief innerhalb von S-K sagen, dass die Techniken zuerst von Lofwyrs übernatürlichen Agenten entwickelt wurden und erst später für Metamenschen (besonders für jene mit Cyberimplantatwaffen) angepasst und homogenisiert wurden. \nSo oder so: Für jene, die (buchstäblich) mit Zähnen und Klauen kämpfen, sind Drachenklaue-Techniken brutal effizient und können den entscheidenden Unterschied gegen einen untrainierten Feind ausmachen. \nKategorien: Ringen, Schlag, Waffen \nCharakteristische Technik: Zerfleischen.