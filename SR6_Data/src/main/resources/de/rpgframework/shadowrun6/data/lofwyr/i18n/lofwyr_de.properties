critterpower.vestigial_wings.desc=Du erhältst Flugfähigkeit mit deiner normalen metamenschlichen Bewegungsrate (die durch Proben auf Athletik (Fliegen) + Geschicklichkeit erhöht werden kann). Addiere deine Stufe in Dracogenese zu deinem Würfelpool für alle Fliegen-Proben.
metaecho.adaptive_coloration.desc=(nur Seedrake) Siehe SR6, S. 227 (nur selbst, nur unter Wasser).
metaecho.animal_control.desc=Siehe SR6, S. 226.
metaecho.astral_projection_drake.desc=Siehe SR6, S. 162. Wenn du keine magische Tradition hast, verwende Willenskraft + Edge, um deinen Angriffswert im Astralkampf zu bestimmen.
metaecho.bursts_of_power.desc=Ersetze bei allen Proben, um Drake-Kräfte zu aktivieren oder einzusetzen, einen Würfel durch den Schicksalswürfel (SR6, S. 51).
metaecho.compulsion.desc=Siehe SR6, S. 228.
metaecho.corrosive_spit.desc=Siehe SR6, S. 222.
metaecho.dracoform_talent.desc=Erhöhe deinen Edge-Wert um 1 für Zwecke des Berechnens von Drake-Kräften (dies addiert sich zu den +1 pro Stufe in Dracogenese).
metaecho.draconic_power.desc=Erhöhe dein Edge-Maximum um 1 (darf das Maximum gemäß Metatyp übersteigen, s. Tabelle Attribute nach Metatyp, SR6, S. 66) oder, wenn du Magie oder Resonanz mindestens auf 1 hast, erhöhe das Maximum für Magie oder Resonanz um 1 (ähnlich einer Initiation oder Wandlung).
metaecho.dragonspeech.desc=Wie Gedankensprache, siehe SR6, S. 223.
metaecho.elemental_mastery.desc=Du darfst Elementare Angriffe nicht nur mit Feuer, sondern auch mit Chemisch, Elektrizität oder Kälte ausführen (wähle eins davon beim Kauf der Kraft). Diese Kraft kann mehrfach erworben werden. Sie modifiziert auch alle Kräfte, die auf Elementarer Angriff basieren (Energieaura usw.).
metaecho.elemental_resistance.desc=Siehe SR6, S. 76 (passend zum Element deines Elementaren Angriffs).
metaecho.energy_aura.desc=Siehe SR6, S. 223 (passend zum Element deines Elementaren Angriffs).
metaecho.enhanced_sense_wideband.desc=Siehe SR6, S. 224. 
metaecho.enhanced_sense_lowlight.desc=Siehe SR6, S. 224.
metaecho.enhanced_sense_smell.desc=Siehe SR6, S. 224.
metaecho.enhanced_sense_thermo.desc=Siehe SR6, S. 224.
metaecho.improved_armor.desc=Siehe SR6, S. 226. Du erhältst die Kraft Panzer in Höhe deines Edge-Attributs.
metaecho.improved_flight.desc=Ersetze Stummelflügel durch eine Flug-Bewegungsrate von 20/30/+4.
metaecho.improved_natural_weapon.desc=Du erhältst +1 Schaden mit deinen Natürlichen Waffen. Diese Kraft kann zweimal erworben werden und verursacht dann insgesamt +2 Schaden.
metaecho.fear.desc=Siehe SR6, S. 224.
metaecho.hardened_armor.desc=Siehe SR6, S. 227. Verändere die Hälfte des Panzers deiner Drachengestalt (abgerundet) zu Verstärktem Panzer (kann zweimal erworben werden, wodurch dann der gesamte Panzer der Drachengestalt zu Verstärktem Panzer verändert wird).
metaecho.hardened_mystic_armor.desc=Siehe SR6, S. 227. Verändere die Hälfte des Mystischen Panzers deiner Drachengestalt (abgerundet) zu Verstärktem Mystischem Panzer (kann zweimal erworben werden, wodurch dann der gesamte Mystische Panzer der Drachengestalt zu Verstärktem Mystischem Panzer verändert wird).
metaecho.heavy_scales.desc=(nur Westlicher Drake): Erhalte +2 Verstärkten Panzer (s. SR6, S. 227).
metaecho.influence.desc=Siehe SR6, S. 223.
metaecho.magical_defenses.desc=(nur Östlicher Drake) Erhalte +2 Verstärkten Mystischen Panzer (s. SR6, S. 227).
metaecho.magnificent_specimen.desc=Du erhältst 2 weitere Drachengestalt-Anpassungspunkte (kann so oft erworben werden, wie deine Stufe in Dracogenese beträgt).
metaecho.mystic_armor.desc=Siehe SR6, S. 225. Du erhältst die Kraft Mystischer Panzer in Höhe deines Edge-Attributs.
metaecho.nimble_claws.desc=Entferne den Nachteil Händezittern von deiner Drachengestalt.
metaecho.noxious_breath.desc=Siehe SR6, S. 224.
metaecho.penetrating_natural_weapon.desc=Durchdringende Natürliche Waffe
metaecho.quicksilver_dracoform.desc=Du erhältst +1 Initiativewürfel (mit der entsprechenden zusätzlichen Nebenhandlung). Diese Kraft kann bis zu viermal erworben werden und funktioniert nicht zusammen mit anderen ähnlichen Wirkungen, egal ob mundan oder magisch.
metaecho.regeneration.desc=Siehe SR6, S. 226.
metaecho.resistance_to.desc=Du erhältst die Vorteile Pathogenresistenz und Toxinresistenz (s. SR6, S. 75 bzw. 76).
metaecho.spirit_affinity.desc=Siehe SR6, S. 74 (passend zum Element deines Elementaren Angriffs).
metaecho.swift_transformation.desc=Die Verwandlung von der metamenschlichen in die drachische Gestalt kostet nur noch 3 Nebenhandlungen statt 1 Haupthandlung. Diese Kraft kann bis zu dreimal erworben werden und senkt jedes Mal die Anzahl an erforderlichen Nebenhandlungen für die Verwandlung um 1.
metaecho.tail_stinger.desc=(nur Gefiederter Drake) Wie Gift (s. SR6, S. 224).
metaecho.toughness.desc=Siehe SR6, S. 77.
metaecho.transcendence_of_form.desc=Einige Drakes haben gelernt, Aspekte ihrer drachischen Macht auch in ihrer metamenschlichen Gestalt zu nutzen. Um eine drachische Kraft zu aktivieren, gib eine Nebenhandlung aus und erleide 4K Entzug, dem du mit Konstitution + Willenskraft widerstehen kannst. Die Kraft kann eine grundlegende Kraft, eine Dracogenese-Kraft oder eines der bevorzugten Attribute deiner Drachengestalt (s. Tabelle Drachengestalt-Boni, S. 11) sein. Kräfte mit einer andauernden Wirkung (wie z.B. Panzer oder Natürliche Waffe) halten für [Edge] Kampfrunden (können aber mit einer weiteren Nebenhandlung und dem entsprechenden Entzug erneuert werden). Du kannst die volle, verbesserte Version jeder Kraft erhalten, die durch Dracogenese-Upgrades verbessert wurde (Verbesserte Natürliche Waffe, Verstärkter Panzer usw.). Diese Kräfte werden während ihrer Wirkungsdauer von einer deutlich sichtbaren körperlichen Verwandlung (Schuppen, Klauen oder ein peitschender Schwanz) oder – falls nicht – einer sichtbaren magischen Illusion ähnlicher einer schamanischen Maske begleitet.

