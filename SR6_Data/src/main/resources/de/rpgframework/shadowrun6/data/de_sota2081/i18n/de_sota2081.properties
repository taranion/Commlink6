item.pjss_mammutbuechse_clip.desc=Ersatzmagazin für die PJSS Mammutbüchse
item.pjss_mammutbuechse_laser_sight.desc=Lasermarkierer für die PJSS Mammutbüchse
item.pjss_mammutbuechse_imaging_scope.desc=Zielfernrohr für die PJSS Mammutbüchse
item.steyr_ucr.desc=Das Steyr UCR Sturmgewehr ist die Standardwaffe der österreichischen Landespolizei und Bundesgendarmerie. Auch das Einsatzkommando Cobra, das Gegenstück der deutschen GSG 9, führt das UCR ins Feld. Es löste das bisherige Steyr AUG-CSL als Waffensystem ab: Die bislang beworbene Vielseitigkeit des AUG-CSL erwies sich in der Praxis als zu kompliziert, da der Umbau der Waffe im aktiven Einsatz zu viel Zeit in Anspruch nahm und nicht immer alle Komponenten mitgeführt werden konnten. Im Häuserkampf bemängelten die Spezialeinheiten der Bundesgendarmerie die unzureichende Durchschlagskraft der Karabiner-Variante, sodass dringend eine Alternative benötigt wurde. Auch die Scharfschützen wünschten sich eine eigene Waffe, sodass das Vertrauen in das AUG-CSL rapide abnahm. Unter Mitwirkung von Spezialisten der österreichischen Generaldirektion für die öffentliche Sicherheit entwickelte Steyr deshalb mit dem UCR ein Sturmgewehr im Bullpup-Design mit einer Schrotflinte als Unterlaufwaffe. Das UCR hat seine Stärke in der Nah- und Mitteldistanz, die Schrotflinte eignet sich sowohl zum schnellen Öffnen von Türen als auch zum Ausschalten größerer Gegner in der Nahdistanz.\nStandardausstattung: Lasermarkierer, Schockpolster
item.steyr_ucr_with_shotgun.desc=Das Steyr UCR Sturmgewehr ist die Standardwaffe der österreichischen Landespolizei und Bundesgendarmerie. Auch das Einsatzkommando Cobra, das Gegenstück der deutschen GSG 9, führt das UCR ins Feld. Es löste das bisherige Steyr AUG-CSL als Waffensystem ab: Die bislang beworbene Vielseitigkeit des AUG-CSL erwies sich in der Praxis als zu kompliziert, da der Umbau der Waffe im aktiven Einsatz zu viel Zeit in Anspruch nahm und nicht immer alle Komponenten mitgeführt werden konnten. Im Häuserkampf bemängelten die Spezialeinheiten der Bundesgendarmerie die unzureichende Durchschlagskraft der Karabiner-Variante, sodass dringend eine Alternative benötigt wurde. Auch die Scharfschützen wünschten sich eine eigene Waffe, sodass das Vertrauen in das AUG-CSL rapide abnahm. Unter Mitwirkung von Spezialisten der österreichischen Generaldirektion für die öffentliche Sicherheit entwickelte Steyr deshalb mit dem UCR ein Sturmgewehr im Bullpup-Design mit einer Schrotflinte als Unterlaufwaffe. Das UCR hat seine Stärke in der Nah- und Mitteldistanz, die Schrotflinte eignet sich sowohl zum schnellen Öffnen von Türen als auch zum Ausschalten größerer Gegner in der Nahdistanz.\nStandardausstattung: Lasermarkierer, Schockpolster
item.steyr_ucr_with_shotgun.item.steyr_ucr_shotgun.desc=Schrotflinte des Steyr UCR
item.walther_securion.desc=Kernstück des Securions ist seine neue Hybridmunition, die sowohl das Sturmgewehr als auch ein (noch kommendes) leichtes Maschinengewehr verwenden. Sie soll sich durch höhere Reichweite und bessere Wirkung im Ziel auszeichnen und dabei deutlich kompakter und leichter als bisherige Munitionsarten ausfallen. Laut Walther weist das Securion die Reichweite und Feuerkraft eines Mittelkaliber-MGs bei Ergonomie und Präzision eines Sturmgewehrs auf.\nDas komplett beidseitig bedienbare Securion weist einen verstärkten, freischwingenden M-Lok-Handschutz auf, durch den der Rückstoß vermindert und die Schockwelle vom Schützen weggedrückt wird. Auf Zielvorrichtungen wurde verzichtet, sodass man sich bei der Auslieferung das finale Produkt selbst zusammenstellen kann.\nStandardausstattung: Ausklappbare Schulterstütze, Schalldämpfer, 2 Zubehörhalterungen
item.ruhrmetall_sfn_11m_laser.desc=Ebenfalls Teil der Ausschreibung des Norddeutschen Bundes von 2079 war ein leichtes Maschinengewehr. Ruhrmetall entwickelte dafür ein Unterstützungs-MG, das die neue SFP-9M mit seinen Fähigkeiten genau ergänzt: lange Reichweite, Feuerkraft, einsetzbar von Booten und Hubschraubern sowie als tragbare Infanteriewaffe. Wie sein kleiner Bruder ist das MG wasserdicht und beständig gegen die Brühe, die in der Nordsee als Wasser bezeichnet wird. Als Munitionszuführung dienen Stangenmagazine oder geschlossene Trommelmagazine, wahlweise natürlich auch die üblichen Gurte.\n Kritiker bemängeln die geringe Durchschlagskraft, die kaum über der eines Sturmgewehrs liegt. Bedenkt man jedoch die Umgebung, in der harte Ziele für gewöhnlich wirklich hart sind, ist der Fokus auf Reichweite und Wendigkeit verständlich.\nDie Waffe wurde bereits mehrfach auf Fahrzeugen der HAZMAT gesichtet, insbesondere den neuen Booten der Katzenhai-Klasse.\nStandardausstattung: Einklappbare Schulterstütze, Gasventilsystem, Hochleistungsscheinwerfer,IR-Sichtsystem, Lasermarkierer oder Smartgunsystem, Schockpolster, Zweibein
item.ruhrmetall_sfm_11m_smart.desc=Ebenfalls Teil der Ausschreibung des Norddeutschen Bundes von 2079 war ein leichtes Maschinengewehr. Ruhrmetall entwickelte dafür ein Unterstützungs-MG, das die neue SFP-9M mit seinen Fähigkeiten genau ergänzt: lange Reichweite, Feuerkraft, einsetzbar von Booten und Hubschraubern sowie als tragbare Infanteriewaffe. Wie sein kleiner Bruder ist das MG wasserdicht und beständig gegen die Brühe, die in der Nordsee als Wasser bezeichnet wird. Als Munitionszuführung dienen Stangenmagazine oder geschlossene Trommelmagazine, wahlweise natürlich auch die üblichen Gurte.\n Kritiker bemängeln die geringe Durchschlagskraft, die kaum über der eines Sturmgewehrs liegt. Bedenkt man jedoch die Umgebung, in der harte Ziele für gewöhnlich wirklich hart sind, ist der Fokus auf Reichweite und Wendigkeit verständlich.\nDie Waffe wurde bereits mehrfach auf Fahrzeugen der HAZMAT gesichtet, insbesondere den neuen Booten der Katzenhai-Klasse.\nStandardausstattung: Einklappbare Schulterstütze, Gasventilsystem, Hochleistungsscheinwerfer,IR-Sichtsystem, Lasermarkierer oder Smartgunsystem, Schockpolster, Zweibein
item.ruhrmetall_smk_252.desc=Das SMK 252 richtet sich an körpermodifizierte Soldaten oder \u201Erobuste Metatypen\u201C (namentlich Orks und Trolle), die das enorme Gewicht der Waffe \u2013 immerhin 60 Kilogramm \u2013 stemmen und den Rückstoß kontrollieren können. Als ursprüngliches Panzergeschütz spielt die SMK 252 ihre Stärken vor allem auf mittlerer bis mittelgroßer Distanz aus, auf die sie marktüblichen Sturmkanonen in der Treffergenauigkeit überlegen ist. Die Waffe ist mit dem Vordergriff für das Feuern in Bewegung oder dem Zweibein beim stationären Schießen darauf ausgelegt, so viel Rückstoß wie nur möglich zu kompensieren. Als Kriegsgerät ist sie aber nicht für ungeübte Schützen gedacht, weshalb bislang auch nur wenige Exemplare den Weg in die Schatten gefunden haben.\nStandardausstattung: Schockpolster, Zielfernrohr,  Vordergriff, Zweibein
item.ruhrmetall_sfn_11m_laser.item.heavy_flashlight.desc=Hochleistungsscheinwerfer
item.messerschmitt-kawasaki_mantikor.desc=Diese große und leistungsstarke Reise-Enduro ist genau das Richtige für weite Strecken. Egal, ob durch die Wildnis oder von einer Stadt zur nächsten: Man reist bequem und schnell mit genug Power, um selbst bei hohen Geschwindigkeiten ein sicheres Überholmanöver einzuleiten oder größere Steigungen zu überwinden.\nSerienmäßig besitzt sie einen Haupt- sowie Seitenständer, ein Kofferset aus Topcase und zwei Seitenkoffern sowie Heizgriffe (inklusive Griffschutz) und Motorschutzbügel. Ein Anschluss für eine Satellitenverbindung (nicht im Preis inbegriffen) ermöglicht auch in abgelegenen Gebieten vollen Zugriff auf Kartenmaterial oder Kontakt zu den Liebsten daheim. Die lange Sitzbank aus modernen Memory-Materialien mit Massagefunktion bietet bequem Platz für zwei Personen.\nDer moderne Motor ist in der Lage, durch Kennfeldeinstellungen an das herrschende Gelände und die Bedürfnisse des Fahrers angepasst zu werden. Egal ob ihr in schwierigem Gelände genügend Drehmoment benötigt oder auf langen Strecken mit niedrigem Verbrauch bis zur nächsten Tankstelle kommen wollt: Die Mantikor macht es möglich.\nDie hoch variablen Gabeln sind in verschiedenen Längen verfügbar, um selbst besonders großen Fahrern das bestmögliche Fahrerlebnis zu bieten. So sind Sitzhöhen von 70 bis 125 Zentimetern möglich. Durch den leistungsstarken Motor können selbst schwerere Fahrer problemlos beschleunigen.
item.mercedes_clk_170t.desc=Der Mercedes Cl!ck ist ein so großer Erfolg, dass er seit Jahren nicht groß überarbeitet wurde und somit als Klassiker gelten kann. Die Farb- und Musterauswahl im Dynamic Color Change (DCC) ist auf zehn erweitert worden, und das Spiele- und Medienangebot wurde dank neuer Vertragspartner um einige Branchengrößen erweitert, sodass nun auch Streamingdienste und sogar einige Podcasts im Programmpaket enthalten sind. Die zur Bedienung enthaltenen AR-Handschuhe wurden mit dem DCC gekoppelt.\nDank unaufdringlicher Innenraum-Kameras ist es auch jederzeit möglich, mit seinem Gegenüber Auge in Auge zu interagieren oder sein Social-Media-Erlebnis während der Fahrt zu teilen.\nDer Innenraum ist durch das patentierte Click-System von Mercedes vollständig variabel und innerhalb von Minuten für bis zu zwei trollgroße Passagiere umrüstbar. Auch der Stoff des Innenraums kann mit elektrochromer Funktion ausgestattet werden, um unendliche Möglichkeiten hinichtlich Farben und Mustern zu erhalten. Das vollständig versenkbare Open-Sky-Dach bietet nicht nur Fahrspaß mit Kopffreiheit, sondern auch einen guten Überblick. Alle Fensterscheiben können als AR-Bildschirme verwendet werden.\nDas preisgekrönte Fahrwerk und der spritzige Motor liefern eine solide Grundlage für jeden Automobilisten, vom Tuner bis zum Gelegenheitsfahrer.\nVariabilität ist das Motto! Unzählige Angebote von lizenzierten Tuning-Werkstätten bieten eine breite Auswahl an optischen Anpassungen, Fahrwerksanpassungen und Leistungssteigerungen. Vieles lässt sich dank des leistungsstarken Motorkonzepts mit einfachem Chip-Tuning erledigen, allerdings ist auch ein Hardware-Upgrade möglich, zum Beispiel vom Vertragspartner AMG.
item.mercedes_clk_170tt.desc=Der Mercedes Cl!ck ist ein so großer Erfolg, dass er seit Jahren nicht groß überarbeitet wurde und somit als Klassiker gelten kann. Die Farb- und Musterauswahl im Dynamic Color Change (DCC) ist auf zehn erweitert worden, und das Spiele- und Medienangebot wurde dank neuer Vertragspartner um einige Branchengrößen erweitert, sodass nun auch Streamingdienste und sogar einige Podcasts im Programmpaket enthalten sind. Die zur Bedienung enthaltenen AR-Handschuhe wurden mit dem DCC gekoppelt.\nDank unaufdringlicher Innenraum-Kameras ist es auch jederzeit möglich, mit seinem Gegenüber Auge in Auge zu interagieren oder sein Social-Media-Erlebnis während der Fahrt zu teilen.\nDer Innenraum ist durch das patentierte Click-System von Mercedes vollständig variabel und innerhalb von Minuten für bis zu zwei trollgroße Passagiere umrüstbar. Auch der Stoff des Innenraums kann mit elektrochromer Funktion ausgestattet werden, um unendliche Möglichkeiten hinichtlich Farben und Mustern zu erhalten. Das vollständig versenkbare Open-Sky-Dach bietet nicht nur Fahrspaß mit Kopffreiheit, sondern auch einen guten Überblick. Alle Fensterscheiben können als AR-Bildschirme verwendet werden.\nDas preisgekrönte Fahrwerk und der spritzige Motor liefern eine solide Grundlage für jeden Automobilisten, vom Tuner bis zum Gelegenheitsfahrer.\nVariabilität ist das Motto! Unzählige Angebote von lizenzierten Tuning-Werkstätten bieten eine breite Auswahl an optischen Anpassungen, Fahrwerksanpassungen und Leistungssteigerungen. Vieles lässt sich dank des leistungsstarken Motorkonzepts mit einfachem Chip-Tuning erledigen, allerdings ist auch ein Hardware-Upgrade möglich, zum Beispiel vom Vertragspartner AMG.
item.mercedes_wsr290.desc=Mit dem Wesir betreibt Mercedes Designpflege in seinem Mittelklassesegment. Vom dezenten Facelift der Front- und Heckpartie abgesehen unterscheidet sich das 2080er-Modell der W-Serie kaum von seinem Vorgänger. Unter der Motorhaube schnurrt dieselbe zuverlässige Maschine, wie man sie aus der 290er-Reihe kennt und nach anfänglichen Startschwierigkeiten auch schätzen gelernt hat. Wahlweise als Fünftürer oder in der etwas schnittigeren Fließheckvariante mit drei Türen, eignet sich der unauffällige Bolide nicht gerade als Statussymbol für Kids mit Imponiergehabe.\nAuch auf der Geraden wird der Wesir vom kleinen Stiefbruder, dem Click, gnadenlos abgehängt. Und doch, einmal in Fahrt gekommen, hält sich das Fahrwerk des W-SR auch bei höheren Geschwindigkeiten spursicher auf dem Asphalt.\nUnderstatement ohne viel Aufsehen mit einem Hauch Eleganz \u2013 was Mercedes als Einstieg in sein Limousinensortiment unterhalb des 250 Classic positioniert, bleibt für viele Käufer nach wie vor ein schlichtes und alltagstaugliches Arbeitstier. Pendler, Kurier- und Fahrdienste trennen sich selbst nach einer Laufleistung jenseits der 300.000 Kilometer selten von ihren Gebrauchten. In gepflegtem Zustand ist der Wertverlust nur minimal. Wirklich preisgünstig ist allerdings nur die Basisausstattung. Jedes Extra lässt sich Mercedes mit teuren Lizenzeinbauten vergolden.\nDen nötigen Credstick vorausgesetzt, bietet der Wesir aber ausreichend Raum zur kreativen Entfaltung und dem Einbau höchst individueller Modifikationen.
item.chrysler-nissan_packer_m.desc=Der Packer ist die Basisplattform von Chrysler-Nissans Lieferwagensparte. Ein kurzer Radstand, ein schmales Profil und ein umfangreiches Sensorpaket bis hin zum fahrerlosen Führerhaus machen den Minivan zum idealen Nutzfahrzeug im Stadtverkehr, nicht nur für klein- und mittelständische Betriebe. Auch namhafte Konzerne greifen für ihre Serviceflotte auf diesen kostengünstigen Allrounder zurück. Ausgestattet mit Schiebetüren auf einer oder beiden Seiten sowie wahlweise Heckklappe, Rolltor oder Doppeltüren, bietet der Packer Flexibilität und Platzangebot in einer kompakten und wendigen Karosserie.\nNeben der autonomen Variante wird auch noch eine Fahrerkabine mit Fahrersitz und Schiebetür \u2013 alternativ auch auf der Beifahrerseite \u2013 und separatem Beifahrersitz oder durchgehender Bank angeboten.\nDie Konfiguration des Innenraums reicht von bis zu drei doppelsitzigen Bänken über eine durchgehende Ladezone mit oder ohne Trennwand bis hin zum Hangar für Wartungsdrohnen oder die vollautomatische Pizzabackstube. In der Basisversion bietet die Ladefläche Platz für eine ganze ISO-Palette oder in der Langfassung ML für drei DIN-Halbpaletten. Das Chassis gibt es außerdem als Heckpritschenvariante oder mit Montageaufhängungen für beliebige Kofferaufbauten. \nDer Packer MP verfügt über einen ausgebauten Fahrgastraum mit Panoramafenstern und wird gerne als Shuttle-, Kleingruppen- oder Sightseeing-Bus eingesetzt.
item.messerschmitt_kawasaki_katzenhai.desc=In der neuen Katzenhai-Klasse hat M-K Boote für den Einsatz im Küstenbereich und Wattenmeer zusammengefasst. Einsatzzweck der Boote ist primär der Kampf gegen Piraterie und Schmuggel. Jedes Boot fasst einen Zug aus zwölf Soldaten sowie zwei mittelgroße Drohnen. Ausgestattet mit einem faltbaren Verdeck, kann das gesamte Boot geschlossen werden. Dies bietet den Soldaten besten Schutz vor Wetter und Wasser und senkt die Signatur des Bootes beträchtlich. Durch den flachen und glatten Glasfaserrumpf kann das Fahrzeug schon bei Wassertiefen ab 50 Zentimeter operieren. Die seitlichen Jetantriebe heben das Boot bei vollem Schub aus dem Wasser und lassen es mit Geschwindigkeiten gleiten, die jedes Schmugglerschiff einholen.\nDas Platzangebot ist beengt, eintägige Einsätze sind jedoch möglich. Im Regelfall werden die Boote als Tochterboote größerer Einheiten eingesetzt, können aber auch unabhängig operieren. Sowohl die HAZMAT als auch die Wasserschutzpolizei Rhein haben bereits die Anschaffung einer größeren Zahl von Booten angekündigt.\nNeben modernen Sensoren verfügt das Boot in der Grundversion über eine schwere Waffenhalterung für Maschinengewehre. In Variationen kann das Boot auch als reiner Drohnenträger oder als Jagdboot mit schwerer Bewaffnung bestellt werden, dann jedoch ohne das Mannschaftsmodul. Alternative Konfiguration mit 2 Sitzen verfügbar.

item.monochrom_mulatschak.desc=Ursprünglich vom autonomen Wiener Bastlerkollektiv Monochrom als mobile Partydrohne für spontane Hangouts in den Donauauen konzipiert, erfreut sich die Mulatschak bei Gangern und Runnern inzwischen unter dem Namen Ruckus großer Beliebtheit als Krawall-oder Ablenkungsdrohne, nachdem das Design als Open Source veröffentlicht wurde. Als Chassis dienen dabei einfache vierrädrige Bodendrohnen, die mit High-End-Soundsystemen, Nebelwerfern und Ähnlichem ausgestattet werden können. Das Design setzt auf Modularität, sodass man die Drohne auch problemlos mit anderem elektronischen Schnickschnack nachrüsten kann. Neben fetter Party-Mucke kann die Drohne auch hyperrealistische Sounds abspielen, die man aus Online-Bibliotheken in die Drohne herunterladen oder streamen kann (hier findet sich alles: von automatischen Waffen über Fahrzeuggeräusche bis hin zum Vortäuschen einer Gruppe von Angreifern) und die selbst moderne Sensoren täuschen können. 
item.monochrom_mulatschak.item.mulataschak_soundsystem.desc=Neben fetter Party-Mucke kann die Drohne auch hyperrealistische Sounds abspielen, die man aus Online-Bibliotheken in die Drohne herunterladen oder streamen kann (hier findet sich alles: von automatischen Waffen über Fahrzeuggeräusche bis hin zum Vortäuschen einer Gruppe von Angreifern) und die selbst moderne Sensoren täuschen können.
item.ruhrmetall_skarabaeus.desc=Es ist erst zwei Jahre her, dass Ruhrmetall die Skarabäus auf den Markt gebracht hat, und doch ist das kompakte Einrad aus dem Repertoire der deutschen Sicherheits- und Polizeikräfte nicht mehr wegzudenken. Kaum größer als ein Koffer und dennoch extrem schnell und wendig, ist das Einsatzfeld der Skarabäus sehr weit gefasst. Sie wird in Gebäuden ebenso verwendet wie zur Absicherung von größeren Grundstücken oder auf offener Straße. Die Drohne ist mit Kameras und weiteren Sensoren ausgestattet und hat sich bei Überwachungsaufgaben ebenso bewährt wie bei der Fahndung. Auch in Kampfsituationen hat sie sich als flexibel einsetzbar erwiesen. Sie deckt ein breites Spektrum ab, das vom Begleitschutz über Verfolgungsfahrten bis hin zum autonomen Patrouillendienst reicht. Auch das Konzept, Skarabäen über weite Gebiete verteilt in Garagen bereitzuhalten und bei Bedarf als koordinierten Schwarm einzusetzen, hat sich in Ballungszentren innerhalb weniger Monate durchgesetzt. Hier können die kleinen Drohnen gerade im Berufsverkehr ihre Talente voll ausspielen und ihre Einsatzorte schnell erreichen - selbst dann, wenn ihre Ziele mobil sind. Ihre Flexibilität, der günstige Preis und der Umstand, dass die Wartung vergleichsweise unproblematisch erfolgen kann, haben dazu geführt, dass sich die Skarabäus auch außerhalb von Sicherheitskonzernen rasch verbreitet hat. Unter anderem wird sie inzwischen auch als Überland-Kurierdrohne in bevölkerungsärmeren Gebieten der ADL eingesetzt. Der hohe Absatz hat es Ruhrmetall erlaubt, den Preis der Drohne substanziell zu senken - was wiederum zu verstärkter Nachfrage führte.
item.messerschmitt_kawasaki_hugin.desc=Die Hugin von Messerschmitt-Kawasaki hat die Form und Größe einer Krähe. Die kleine Flugdrohne ist nach einem der Raben Odins benannt und mittlerweile auch in den Lackierungen Nebelkrähe und Möwe erhältlich. Ursprünglich als Alternative für die Renraku Dove entwickelt, hat die Hugin mittlerweile einen breiten Absatzmarkt erobert. Die hervorragende Optik der Drohne, die sich bei Bedarf mit akustischen Sensoren aufrüsten lässt, ist nicht nur bei Naturfilmern beliebt, die die unauffällige Möglichkeit, mit der Drohne einen Vogelschwarm zu begleiten, sehr schätzen. Die lebensnah aussehende Hugin liegt stabil in der Luft, was sicheren Flug und präzise Lenkung ermöglicht - Hobbyrigger genießen das Entspannungspotenzial der eleganten, kleinen und äußerst günstigen Drohne, mit der sich nach einem stressigen Arbeitstag die Welt von oben betrachten lässt. Der BGS hingegen nutzt sie zur Grenzüberwachung, Sternschutz und Bundeswehr als Aufklärer und Reporter als Flycam. Ihre Ladefähigkeit ist begrenzt, aber ideal als Kurierflieger für kleine, leichte Artikel - von versiegelten Umschlägen mit verschlüsselten Datenchips, die ohne Spuren ihren Empfänger erreichen sollen, bis hin zu handgeschriebenen Liebesbriefen (wofür ein Kurierdienst im RRP ein weiß lackiertes Modell vorhält).
item.messerschmitt_kawasaki_hugin_echt.desc=Das lebensnah aussehende Modell der Hugin von Messerschmitt-Kawasaki.
item.hoch_tief_geomatik.desc=Eigentlich eine Vermessungsdrohne, kommt die Geomatik nicht nur beim Bau und bei archäologischen Ausgrabungen zum Einsatz, sondern wird auch gerne von Spezialeinheiten und Runnern für Aufklärungszwecke verwendet, um räumliche Daten für die Modellierung und Analyse von Zielgebieten aufzunehmen. Die Geomatik verfügt über eine ausgereifte Sensor-Phalanx, die alle von ihr gesammelten Daten online in ein dreidimensionales Modell einbaut, das durch zusätzliche Daten für taktische Zwecke verfeinert werden kann. Der VTOL-Antrieb der kleinen Drohne ermöglicht es ihr, für Vermessungen in der Luft zu schweben und ihre Position akkurat zu ändern, um jeden Winkel zu kartografieren. Aufgrund ihrer Flugeigenschaften ist es sogar möglich, sie heimlich durch Räume zu steuern und selbst bevölkerte Areale auszuspionieren. Ähnliche Modelle: Horizon Cartographer Standardausstattung: Das Sensorarray der Geomatik enthält einen Ultraschallsensor, einen Laserentfernungsmesser, eine Kamera mit Infrarotsicht und einen MAD-Scanner (s. Sensoren, SR6, S. 277ff.).
item.shiawase_kurina_162.desc=Die Kurina ist ein Allrounder, wenn es darum geht, Dreck und Müll von den Straßen der Metroplexe zu entsorgen, und ist in Berlin und im Ruhrplex geradezu allgegenwärtig. Meist fahren die Kurinas in der Nacht ihre vorbestimmten Routen ab und putzen den Dreck (oder das Blut) des Tages von der Straße, wozu sie über eine Straßenreinigungseinheit verfügen, die zwischen den Achsen abgesenkt werden kann und mittels Kehrrotoren und Lösungsmitteln aus Shiawases eigenen Chemiebetrieben selbst die gröbsten Rückstände von der Straße bekommt. Die Drohnen können von dem betreibenden Abfallentsorger per Matrix auch am Tag in Krisenzonen entsandt werden oder sind rund um die Uhr im Einsatz, wenn die Stadt besonders sauber sein soll (wie in Frankfurt). Für größeren Müll verfügt die Kurina zusätzlich über einen flexiblen Greifarm, der diesen in den dafür integrierten Sammelbehälter befördert, weswegen die Kurina auch oft für Sperrmüllentsorgungen verwendet wird. Neben einer soliden Panzerung für Einsätze in sozialen Krisengebieten ist die Kurina in der Lage, leichte Treppen und unebenes Gelände zu bewältigen.
item.shiawase_kurina_162.item.kurina_cleaning.desc=Straßenreinigungseinheit, die zwischen den Achsen abgesenkt werden kann und mittels Kehrrotoren und Lösungsmitteln aus Shiawases eigenen Chemiebetrieben selbst die gröbsten Rückstände von der Straße bekommt.
item.messerschmitt_kawasaki_heuschrecke_2.desc=Die Messerschmitt-Kawasaki Heuschrecke 2 wird vor allem als Sicherheitsdrohne für weitläufige Anlagen mittlerer Sicherheitsstufen verwendet, bei denen metamenschliche Sicherheitskräfte nur mit einiger Verzögerung eingesetzt werden können, wenn irgendwo ein Zwischenfall gemeldet wird. Häufig werden gut gesicherte Drohnenhangars für eine oder zwei Heuschrecken über die zu schützenden Bereiche verteilt, sodass im Falle eines Alarms eine einzelne oder auch eine kleine Gruppe der Wachdrohnen nach dem Rechten sehen können, unmittelbar nachdem ein Sicherheitsbruch registriert wurde. In der Praxis werden bei Bedarf häufig weitere der kompakten VTOL-Drohnen, die ungefähr die Größe eines Motorrads haben, aus entfernteren Sektoren der jeweiligen Anlagen für die Perimetersicherung hinzugezogen. Ganz so, wie es ihr Name andeutet, werden Heuschrecken von Sicherheitsriggern gern in Gruppen eingesetzt, um Eindringlinge aufzuhalten, sie in Richtung stärkerer Sicherheitskräfte in geschützten Stellungen zu treiben oder bei der Flucht aus gesicherten Bereichen in die gewünschte Richtung zu dirigieren - nicht selten direkt auf wartende Polizeikräfte zu. Gerade dann, wenn Heuschrecken mit einer schweren Waffenhalterung ausgestattet und entsprechend bestückt wurden - was tatsächlich die übliche Ausstattungsvariante ist, in der die S-K-Tochter die Wachdrohnen an Sicherheitsfirmen verkauft -, können Heuschreckenschwärme zu einer echten Bedrohung für beinahe jeden Eindringling werden und Gefahrensituationen oftmals entschärfen, lange bevor teure, metamenschliche Sicherheitskräfte am Ort des Geschehens eintreffen.
item.mitsuhama_fed_ii.desc=Das Fliegende Auge, wie man die Floating Eye Drone der Serie 11 im Volksmund nennt, ist ein weitverbreiteter Anblick am Himmel. Gerade über Verkehrsknotenpunkten und Autobahnen haben diese großen Überwachungsdrohnen die Lage am Boden immer fest im Blick. Dabei sind sie nicht immer sofort auszumachen: Je nach Sichtverhältnissen können sie aus mehreren Hundert Metern Höhe Verkehrshindernisse, Unfälle, streunende Critter oder Fluchtfahrzeuge ins Visier nehmen. Die bei vielen am Rumpf aufgebrachte Chamäleon-Lackierung erschwert das Erspähen der Drohne von unten zusätzlich. Als besonderes Feature bietet Mitsuhama Automatronics Biofeedbacksysteme an, um Riggern beim Steuern der FED-11 ein noch lebensnäheres Erlebnis zu ermöglichen.

mentorspirit.autobahn.desc=Autobahn ist ein noch vergleichsweise junger Schutzgeist. Wie viele Halbstarke ist er eher ungestüm und kann reichlich rabiat und auch egoistisch sein, doch wer sich auf ein Wettrennen mit ihm einlässt und mithalten kann, dem schenkt er einen wilden Ritt, der beinahe überall hinführen kann \u2013 denn kaum jemand kommt so weit und so schnell herum wie Autobahn.\n\nVorteile:\nAllgemein: Edge-Boosts bei Steuern-Proben kosten 1 Edge weniger als normal\nZauberer: Die Zeit, die du sicher astral projizieren kannst, wird verdoppelt. Außerdem kosten Edge-Boosts während der astralen Projektion 1 Edge weniger als normal.\nAdept: 1 Stufe Verbesserte Reflexe gratis
mentorspirit.autobahn.disadvantage=Anhänger von Autobahn zieht es immer wieder hinaus. Sie verweilen ungern länger an einem Ort. Wenn sie gezwungen sind, sich länger als einen Tag an einem Ort, etwa in einer Wohnung, aufzuhalten, erleiden sie einen Würfelpoolmalus von -1 auf alle Proben außer Schadenswiderstandsproben, bis sie für eine ebenso lange Zeit wieder unterwegs waren.
mentorspirit.autobahn.alias.rennfahrer=Rennfahrer
mentorspirit.autobahn.alias.wanderfalke=Wanderfalke
mentorspirit.badger.desc=Dachs ist der Hüter des Waldes. Er beobachtet alles aus der Entfernung und verteidigt sein Revier mit seinem Leben. Selten handelt Dachs von sich aus, sondern reagiert immer dann, wenn es unumgänglich ist. Seine abwartende Haltung wird oft als Passivität fehlgedeutet. All jene, die Dachs bestehlen oder in die Enge treiben, bemerken rasch ihren Fehler. Anhänger von Dachs kümmern sich meist um bestimmte Gebiete oder hüten wertvolle Gegenstände wie Antiquitäten oder Artefakte.\n\nVorteile\nAllgemein: Edge-Boosts bei Wahrnehmungs-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal Adept: Kraft Gefahrensinn gratis
mentorspirit.badger.disadvantage=Wenn Feinde in das Gebiet eindringen, das du bewachst (wie ein Gebäude), oder einen unter deinem Schutz stehenden Gegenstand stehlen, muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, damit du nicht sofort mit allen Mitteln gegen die Eindringlinge bzw. Diebe vorgehst.
mentorspirit.badger.alias.gardist=Gardist
mentorspirit.badger.alias.schaefer=Schäger
mentorspirit.elektromarder.desc=Elektromarder ist ein aufgeweckter und geselliger Zeitgenosse, der sich sehr für die elektronischen Systeme der modernen Welt interessiert. Manchmal übertreibt er es bei seinen Spielereien und bringt sich unabsichtlich in Gefahr. Von seiner Gruppe jedoch hält er Bedrohungen mit aller Kraft fern, ihr gegenüber ist er fürsorglich und äußerst loyal.\n\nVorteile\nAllgemein: Edge-Boosts bei Cracken- oder Elektronik-Proben (nach Wahl des Spielers) kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal\nAdept: 1 Stufe Verbesserte Fertigkeit Cracken oder Elektronik (nach Wahl des Spielers) gratis
mentorspirit.elektromarder.disadvantage=Häufig verliert sich Elektromarder in der Vielzahl der Signale. Seinen Anhängern muss eine Probe auf Willenskraft + Charisma gelingen, damit sie in Stresssituationen nicht 3 Kampfrunden lang abgelenkt sind. Jeder Erfolg bei dieser Probe senkt die Dauer der Ablenkung um 1 Runde. Misslingt die Probe, erregt der Anhänger unabsichtlich Aufsehen.
mentorspirit.elektromarder.alias.blitz=Blitz
mentorspirit.elektromarder.alias.technocritter=Technocritter
mentorspirit.fuchs.desc=Fuchs hat wenig mit dem hinterlistigen und großmäuligen Tier aus den Fabeln gemeinsam. Auch sein volkstümlicher Beiname, Meister Reinecke, wird ihm nicht gerecht, ist dieser doch eine Variante von Kojote oder Täuschung. In der Realität ist Fuchs ganz anders: Er ist ein gleichermaßen vor- wie umsichtiger Jäger, der ohne Einschränkung für die Seinen einsteht. Fuchs ist ein Taktiker und Planer, der nachdenkt, lange bevor er handelt. Heimlichkeit bevorzugt er gegenüber roher Gewalt. Wenn Fuchs jedoch kämpft, dann ohne Gnade. Nicht zuletzt aus diesem Grund gelten seine Anhänger oft als gnadenlos \u2013 doch dabei wird übersehen, dass Fuchs für sich auch keine Gnade einfordert.\n\nVorteile\nAllgemein: Edge-Boosts bei Heimlichkeit-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal\nAdept: 2 Geschärfte Sinne gratis
mentorspirit.fuchs.disadvantage=Dir muss eine Probe auf Willenskraft + Intuition (3) gelingen, damit du einen besiegten Gegner verschonen kannst.
mentorspirit.gezeiten.desc=Unablässig hebt sich die Tide, nur um im Anschluss wieder zu fallen, stets im Takt des himmlischen Tanzes von Erde, Mond und Sonne. Wie die kosmischen Konstellationen ist auch Gezeiten uralt und unwiderstehlich. Immer wieder rollt das Wasser heran und zieht sich wieder zurück, nichts und niemand kann sich ihm auf Dauer widersetzen. In diesem Wissen verfügen Gezeiten und diejenigen, die diesem Schutzgeist folgen, über eine schier unerschöpfliche Geduld \u2013 doch sollte man das nicht als Aufforderung verstehen, sie zu reizen oder Spiele mit ihnen zu spielen: Denn Gezeiten kann auch launisch und unberechenbar sein und unvermittelt und ohne Rücksicht auf die Folgen gewaltige Kräfte entfesseln.\n\nVorteile\nAllgemein: Edge-Boosts bei Ausgedehnten Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts beim Herbeirufen von Wasserund Erdgeistern kosten 1 Edge weniger als normal (die Geisterart, für die der Vorteil gilt, wechselt im Rhythmus der Gezeiten etwa alle sechs Stunden).\nAdept: 1 Stufe Verbessertes Körperliches Attribut Konstitution oder Stärke (nach Wahl des Spielers) gratis
mentorspirit.gezeiten.disadvantage=Gezeiten ist beständig in seinem gewohnten Rhythmus, und so sind auch seine Anhänger: Sie haben ihre festen Gewohnheiten. Werden diese unterbrochen, sei es durch äußere Umstände wie Krankheiten oder ihre eigenen Entscheidungen, etwa wenn sie zu ihrer üblichen Schlafenszeit auf den Beinen sind, erhalten sie einen Würfelpoolmalus von -1 auf alle Proben (außer Schadenswiderstandsproben), bis sie wieder in ihrem üblichen Rhythmus sind.
mentorspirit.gezeiten.alias.gletscher=Gletscher
mentorspirit.gezeiten.alias.wandel=Wandel
mentorspirit.heinzelmaennchen.desc=Heinzelmännchen ist ein hilfsbereiter Hausgeist, der immer nachts, wenn alle schlafen und er von niemandem beobachtet wird, die Arbeit der Metamenschen erledigt. Sobald Heinzelmännchen dabei jedoch gesehen wird, verschwindet es. Seine Anhänger wirken gerne in den späten Abendstunden, wenn sie von niemandem gestört werden. Bei den allgegenwärtigen Computern wirken ihre Kräfte nicht, da diese Heinzelmännchen nach wie vor fremd sind. Aus diesem Grund gelten seine Anhänger bei Deckern als eigenbrötlerisch, da sie lieber altmodische Mechanik bevorzugen.\n\nVorteile\n\nAllgemein: Edge-Boosts bei Mechanik-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal\nAdept: 1 Stufe Verbesserte Fertigkeit (Mechanik) gratis
mentorspirit.heinzelmaennchen.disadvantage=Wenn du in der Öffentlichkeit oder unter genauer Beobachtung Magie wirken willst, muss dir eine Probe auf Willenskraft + Charisma (3) gelingen \u2013 ansonsten versagt deine Magie für den Augenblick.
mentorspirit.heinzelmaennchen.alias.hausgeist=Hausgeist
mentorspirit.heinzelmaennchen.alias.helfende_hand=Helfende Hand
mentorspirit.moewe.desc=Möwe ist eine Überlebenskünstlerin, die an allen Küsten und Meeren der Welt zu Hause ist. Einst nur ein Vogel des Meeres, ist Möwe der Metamenschheit gefolgt und lebt nun auch im Inland, meist in der Nähe großer Gewässer. Die Anhänger von Möwe können sich, wie ihr Schutzgeist, schnell auf neue Lebensräume und -situationen einstellen. Dabei ist Möwe ziemlich lautstark und sehr gesellig \u2013 und das nicht immer zur Freude anderer. Anhänger von Möwe sind selten Einzelgänger, sondern bevorzugen das Agieren in Teams.\n\nVorteile\nAllgemein: Edge-Boosts bei Natur-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal\nAdept: 1 Stufe Verbesserte Fertigkeit für eine Nicht-Kampffertigkeit nach Wahl des Spielers
mentorspirit.moewe.disadvantage=Immer wenn du ein Apartment, eine Wohnung oder ein Hotelzimmer betrittst, wo du dich länger als eine Woche aufhältst, muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, damit du nicht sofort alles in Beschlag nimmst.
mentorspirit.moewe.alias.ueberlebenskuenstler=Überlebenskünstler
mentorspirit.moewe.alias.vagabund=Vagabund
mentorspirit.murmeltier.desc=Niemand kennt den Wert der Familie so gut wie Murmeltier. Aus diesem Grund ist Verrat für Murmeltier ein Fremdwort, denn die eigene Sippe verrät man nicht. Murmeltier ist keine Kämpfernatur und weiß nur zu gut, dass es in der Sechsten Welt nur mithilfe seiner Familie und Gefährten überleben kann. Anhänger von Murmeltier sind meisterhafte Netzwerker und kennen sich in ihrem Refugium \u2013 ein Häuserblock, ein Hochhaus oder ein Stadtviertel \u2013 bestens aus. Im Zweifelsfall wird sich Murmeltier immer für die Flucht entscheiden, doch dann weiß es sofort, wohin es flüchten kann und wie es auf dem schnellsten Weg dorthin kommt.\n\nVorteile\nAllgemein: Edge-Boosts bei Einfluss-Proben kosten  1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal\nAdept: Kraft Verbesserte Wahrnehmung gratis
mentorspirit.murmeltier.disadvantage=Wenn du (absichtlich oder unabsichtlich) in einen Kampf gerätst, muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, damit du nicht sofort fliehst.
mentorspirit.murmeltier.alias.praeriehund=Präriehund
mentorspirit.myst_waechter.desc=Der Mystische Wächter ist der unermüdliche Verteidiger eines abstrakten Ideals. Er ist stets bereit, sein Leben für das seines Schutzbefohlenen zu opfern. Allerdings überlegt sich der Mystische Wächter sehr gut, wem er seinen Schutz anbietet ... und für wie lange. Er nimmt sein Versprechen ernst und tritt von einem einmal angenommenen Schutzauftrag niemals zurück. Das Idol \u2013 wie der identische Schutzgeist Falke \u2013 ist vor allem bei professionellen Leibwächtern, aber auch bei trollischen Animisten vorzufinden.\n\nVorteile\nAllgemein: Edge-Boosts bei Wahrnehmungs-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf oder Wahrnehmung (nach Wahl des Spielers) kosten 1 Edge weniger als normal\nAdept: 1 Stufe Kampfsinn gratis
mentorspirit.myst_waechter.disadvantage=Wenn du einen angenommenen Schutzauftrag vorzeitig beendest oder deine Schutzperson getötet wird, erhältst du einen Würfelpoolmalus von -1 auf alle Handlungen, bis du dein Verhalten gesühnt hast.
mentorspirit.myst_waechter.alias.falke=Falke
mentorspirit.myst_waechter.alias.leibwaechter=Leibwächter
mentorspirit.myst_waechter.alias.schutzengel=Schutzengel
mentorspirit.robbe.desc=Robbe ist ein Geschöpf des Ozeans und taucht hinab in die Tiefe. Als Entdeckerin erforscht sie auch die Geheimnisse des metamenschlichen Geistes. Ihr Entdeckungen bringt sie mit zur Oberfläche. Allerdings spricht Robbe die Metamenschen gerne direkt auf ihre Entdeckungen an, sodass ihre Anhänger zwar als einfühlsam, aber wenig zurückhaltend gelten.\nWie ihr Schutzgeist mögen all jene, die Robbe folgen, die Metamenschen und genießen ihre Nähe. Allerdings suchen sie den Kontakt nicht immer von sich aus, sondern warten gerne ab, bis man auf sie zukommt.\n\nVorteile\nAllgemein: Edge-Boosts bei Astral-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal\nAdept: Kraft Astrale Wahrnehmung gratis
mentorspirit.robbe.disadvantage=Immer wenn du intime Einblicke in die Gefühlswelt eines anderen erhält, muss dir eine Probe auf Willenskraft + Charisma (3) gelingen, damit du das Thema nicht sofort offen ansprichst. Patzer bei sozialen Proben sind automatisch kritisch.
mentorspirit.robbe.alias.nymphe=Nymphe
mentorspirit.robbe.alias.spiegelwelten=Spiegelwelten
mentorspirit.rotkaeppchen.desc=Rotkäppchen ist eine neugierige und abenteuerlustige junge Frau, die furchtlos in die Welt hinauszieht und wenig auf Vorurteile oder Verbote gibt. Ihre ungestüme Offenherzigkeit mag sie hier und da in Schwierigkeiten bringen, sie hilft ihr aber auch, immer wieder Freunde zu finden und Verbündete zu gewinnen, die ihr selbst in den gefährlichsten Situationen beistehen.\n\nVorteile\nAllgemein: Edge-Boosts bei Einfluss- oder Überreden-Proben (nach Wahl des Spielers) kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts beim Herbeirufen von Geistern des Menschen kosten 1 Edge weniger als normal\nAdept: Kraft Stimmkontrolle gratis
mentorspirit.rotkaeppchen.disadvantage=Das neugierige Rotkäppchen und seine Anhänger übersehen hin und wieder vor lauter Konzentration auf die Details die größeren Zusammenhänge. Daher erhalten sie auf unbekanntem Terrain einen Würfelpoolmalus von -1 auf Wahrnehmungsproben.
mentorspirit.rotkaeppchen.alias.unschuld=Unschuld
mentorspirit.rotkaeppchen.alias.ziege=Ziege
mentorspirit.steinbock.desc=In schwindelerregenden Höhen findet Steinbock trittsicher seinen Weg. Er kennt kein Zögern, blitzschnell entscheidet er, welchem Grund er vertraut und welchen er meidet. Einmal getroffen, sind seine Entschlüsse unumkehrbar, denn Zaudern und Wanken sind die Vorboten des tiefen Falls. Diese Entschiedenheit erwartet er auch von seinen Anhängern.\n\nVorteile\nAllgemein: Edge-Boosts bei Athletik-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts beim Herbeirufen von Erdgeistern kosten 1 Edge weniger als normal\nAdept: Kraft Wandlaufen gratis
mentorspirit.steinbock.disadvantage=Steinbock duldet kein Zaudern, und auch seine Anhänger können Unentschlossenheit nur schwer ertragen. Ihnen muss eine Probe auf Willenskraft + Charisma (3) gelingen, damit sie ausufernde Diskussionen nicht unterbrechen, indem sie schlicht so handeln, wie sie es für richtig halten.
mentorspirit.steinbock.alias.entschlossenheit=Entschlossenheit
mentorspirit.steinbock.alias.widder=Widder
mentorspirit.storch.desc=Meister Adebar ist ein weiser Lehrer, der denen Glück verheißt, die seinen Lehren folgen. Mit seinem schwarzweißen Gefieder verbindet er schon auf den ersten Blick Gegensätzliches, und das zeigt sich auch in seinen Handlungen. Weltoffen lässt er sich immer wieder auf Neues ein, auf Wagnisse und Veränderungen, trotzdem kehrt Storch immer wieder an seinen Heimatort zurück und ist den Seinen gegenüber fürsorglich und unverbrüchlich treu.\n\nVorteile\nAllgemein: Edge-Boosts bei Biotech-Proben kosten 1 Edge weniger als normal\nZauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Heilung kosten 1 Edge weniger als normal\nAdept: 1 Stufe Beschleunigte Heilung gratis
mentorspirit.storch.disadvantage=Ein Anhänger von Storch kümmert sich zuallererst um seine Gefährten. Sollten diese in Schwierigkeiten sein, muss ihm eine Probe auf Willenskraft + Charisma (3) gelingen, damit er ihnen nicht unverzüglich unter Missachtung jeglicher Gefahren für die eigene Person hilft.
mentorspirit.storch.alias.fuersorge=Fürsorge
mentorspirit.storch.alias.treue=Treue
