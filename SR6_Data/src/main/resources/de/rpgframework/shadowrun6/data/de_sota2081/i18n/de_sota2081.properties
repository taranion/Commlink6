item.altmayr_mtr_3.desc=Nach der Übernahme des italienischen Kleinstfabrikanten Mateba führt die Waffenschmiede Altmayr die bei Kennern beliebte Revolverreihe nach fast zwei Jahrzehnten Pause fort. Mit der MTR 3 wird die bewährte Kombination aus robustem Revolver und halbautomatischem Lademechanismus nun erstmals auch in die Klasse der handlichen Kleinkaliberwaffen übertragen. Herausgekommen ist eine leichte Handfeuerwaffe, die sich in Sachen Zuverlässigkeit und Zielgenauigkeit nicht hinter ihren großen Geschwistern zu verstecken braucht.\nDer tief sitzende Lauf, der aus der unteren Trommelkammer befeuert wird, verteilt den Rückstoß gleichmäßig auf Arm und Handgelenk und verhindert so das Hochschlagen der Waffe. Das entlastet nicht nur den Schützen, sondern lässt ihn auch nach dem Schuss das Ziel weiter im Visier behalten. Damit ist die MTR 3 für viele Sicherheitsbedienstete im Objekt-und Personenschutz eine ausgewogene Alternative zur klassischen Pistole.\nStandardausstattung: Lasermarkierer
item.altmayr_spx_2.desc=Schön ist anders \u2013 die Altmayr SPX2 punktet durch absolute Qualitätsarbeit und Zuverlässigkeit aus dem Land der Tüftler, aber das Design ist alles andere als preiswürdig. Die aktuelle Modellreihe ist seit 2075 mit kontinuierlichen Verbesserungen am Markt und nicht nur in den Schatten weit verbreitet. Nostalgiker schätzen die Griffigkeit im Pumpmechanismus, was aber ebenso gut \u2013 oder besser \u2013 durch interne Servos übernommen wird und damit das manuelle Nachladen spart.\nBekannt ist die SPX2 durch verschiedene Stadtkriegsspiele und einige Trid-Serien, wie zuletzt die UCAS-Serie Nullzone und die ADL-Soap Cops im Sprawl. Sie ist als relativ preisgünstige Selbstverteidigungswaffe auch unter Normalbürgern erstaunlich weitverbreitet, nachdem sie in weiten Teilen der ADL eine Zeit lang ganz legal erworben werden durfte. Dass sie mit kaum einer Munitionsart Probleme hat (die Altserienmodelle waren angeblich sogar für das Abfeuern von Minigranaten aufrüstbar), macht die robuste und langlebige SPX2 noch immer zu einem treuen Begleiter in engen Situationen.
item.glock_drachentoeter_ii.desc=Mehr als zwei Jahrzehnte nach ihrer Einführung präsentiert Glock mit der Drachentöter II nun den Nachfolger der ersten Generation. Das Design erhielt eine grundlegende Überarbeitung, und das Kaliber wurde entsprechend der modernsten Waffenentwicklung angepasst, ohne an Durchschlagskraft einzubüßen. Der Schlitten ist teilweise mattpoliert, was der Waffe zusammen mit dem in Drachenschuppenoptik geriffelten und formangepassten Griff eine edle Optik verleiht. Die gesamte Waffe ist mit einer Dünnfilm-Beschichtung überzogen, um sowohl die Korrosionsbeständigkeit als auch die chemische Resistenz und thermische Stabilität gegen Umwelteinflüsse zu erhöhen. Damit funktioniert die Drachentöter II auch unter widrigsten Bedingungen reibungslos. Der Abzug der Waffe wird bei Auslieferung eigens auf den neuen Besitzer angepasst, für weiteres Zubehör ist eine Zubehörhalterung unter dem Lauf vorhanden. Die integrierte Zieloptik verhilft dem Schützen zu mehr Treffern, ohne sich durch einen roten Ziellaser zu verraten. Wie in der ersten Generation bietet Glock ein optional erhältliches Ernstfall-Magazin mit 30 Schuss an.\nStandardausstattung: Zieloptik, Zubehörhalterung (unter dem Lauf)
item.walther_secura_ii.desc=Was in Nordamerika die Predator VI, ist hierzulande (beziehungsweise in Europa) die Walther Secura II. Hergestellt von der zu Ruhrmetall gehörenden Carl Walther AG, ist diese schwere Pistole die meistverwendete Dienstwaffe bei Polizeibehörden wie der Rhein-Ruhr-Polizei und privaten Sicherheitsdiensten wie dem Sternschutz oder der HanSec. Das aktuelle Modell Secura II verfügt serienmäßig über ein Smartgunsystem sowie eine taktische Lampe und ist in der Lage, Salven abzufeuern. Von der Predator VI unterscheidet sie sich vor allem durch das größere Magazin. Während Ares mit der Coolness seiner Waffe wirbt, steht die Secura vornehmlich für eines: deutsche Zuverlässigkeit. Mit einer über dreißigjährigen Dienstgeschichte hat die Waffe den Ruf, selbst unter widrigen Bedingungen funktionstüchtig zu bleiben. Allein aus diesem Grund ist es Ares beziehungsweise Knight Errant in den letzten Jahrzehnten nicht gelungen, erfolgreich in den europäischen Markt zu drängen.\nStandardausstattung: Smartgunsystem, Taktische Lampe
item.ruhrmetall_sfp_9m_laser.desc=2079 schrieb der Norddeutsche Bund eine neue Bewaffnung für die Einheiten des Küstenschutzes aus. Ruhrmetall gewann diese Ausschreibung mit einer Maschinenpistole, die den Ansprüchen gerecht wurde. Die Waffe hat genug Auftrieb, um einen Soldaten im Wasser nicht nach unten zu ziehen. Die Auflagefläche des Kolbens ist auf die Standard-Rettungsweste abgestimmt, um beste Stabilität beim Schuss zu gewährleisten. Das System ist wasserdicht und gegen Nordseewasser beständig. Durch ein Drucksystem kann die Waffe sogar unter Wasser nachgeladen und abgefeuert werden.\nInternen Prüfberichten aus ersten Manövertests zufolge soll die Einsatzbereitschaft der Waffe 18 Prozent über dem bisherigen Modell von H&K liegen, die Handhabbarkeit der Waffe von Booten aus und in engen Kampfsituationen soll sogar noch besser sein.\nAls erste Einheit wurde eine Kompanie der HAZMAT mit den neuen Waffen ausgerüstet.\nStandardausstattung: Ausziehbare Schulterstütze, Gasventilsystem, Lasermarkierer oder Smartgunsystem, Taktische Lampe
item.ruhrmetall_sfp_9m_smart.desc=2079 schrieb der Norddeutsche Bund eine neue Bewaffnung für die Einheiten des Küstenschutzes aus. Ruhrmetall gewann diese Ausschreibung mit einer Maschinenpistole, die den Ansprüchen gerecht wurde. Die Waffe hat genug Auftrieb, um einen Soldaten im Wasser nicht nach unten zu ziehen. Die Auflagefläche des Kolbens ist auf die Standard-Rettungsweste abgestimmt, um beste Stabilität beim Schuss zu gewährleisten. Das System ist wasserdicht und gegen Nordseewasser beständig. Durch ein Drucksystem kann die Waffe sogar unter Wasser nachgeladen und abgefeuert werden.\nInternen Prüfberichten aus ersten Manövertests zufolge soll die Einsatzbereitschaft der Waffe 18 Prozent über dem bisherigen Modell von H&K liegen, die Handhabbarkeit der Waffe von Booten aus und in engen Kampfsituationen soll sogar noch besser sein.\nAls erste Einheit wurde eine Kompanie der HAZMAT mit den neuen Waffen ausgerüstet.\nStandardausstattung: Ausziehbare Schulterstütze, Gasventilsystem, Lasermarkierer oder Smartgunsystem, Taktische Lampe
item.donnerbuechse.desc=Donnerbüchsen, Schrotterflinten, Boomsticks \u2013 diese zusammengeklebten, genieteten, genagelten, verschraubten  Holzlatten, Rohre und Blechdosen haben viele Namen. In der SOX gibt es in jeder Zentpel-Siedlung mindestens einen, der diese Krachmacher aus Abfall und Schrott zusammenschustern kann. Mehr als Lärm machen die Teile meist auch nicht. Der reicht in der Regel aber aus, um zumindest kurzzeitig Critter, Ghule und plündernde Gangs auf Abstand zu halten. Zur Not stopft man noch eine Handvoll Glassplitter, Schrauben oder Kieselsteine in den Lauf und hofft, dass der geklaute Militärsprengstoff nicht überdosiert wurde und einem diese Einwegkanone nicht mitsamt der Hand um die Ohren fliegt. Mit etwas Glück bleibt die Hand dran und man hat als Treibladung nur eine feuchte Schießpulvermischung erwischt, die nicht zündet. Mit etwas mehr Karma knallt die Büchse dann doch, wie sie soll, und lässt sich zwei-, vielleicht dreimal neu befüllen, bevor sie sich endgültig in ihre Bestandteile zerlegt. Etwas \u201Ehochwertigere\u201C Modelle werden statt der üblichen Gummibänder oder Fahrradschläuche als Auslöser mit Eisenfedern oder gar batteriebetriebenen Elektrozündern gefertigt. Dafür legt man für sie dann auch etwas mehr hin: selten Geld, sondern meist Tauschwaren wie Wasser, Medikamente, Nahrung oder Treibstoff.
item.pjss_mammutbuechse.desc=Die PJSS Mammutbüchse basiert auf der erfolgreichen Elefantenbüchse, wurde allerdings in Zusammenarbeit mit dem Schmuckhersteller PANDORA aus Dänemark um hochwertige Materialien und die Handwerkskunst bei der Individualisierung der Kundenwünsche erweitert. Sie bildet damit ein Paket, das problemlos mit den Produkten aus dem Hause Ferlach/Anielski-Joop konkurrieren kann.\nDie Mammutbüchse bietet einen klassischen Büchsenlauf für hohe Reichweite und von der Fachpresse gelobte Präzision, während PANDORA sein Knowhow im Bereich der Edelmetall- und -steinbearbeitung sowie der Ätz- und Gravurarbeiten beisteuert. \nBesonders zu erwähnen: das ins Gesamtkonzept eingepasste Zubehör, das an die Kundenwünsche angepasst wird. Der umständlich zu ladende Klappmechanismus sowie der Doppellauf wurden zugunsten eines in die Waffe eingepassten Stangenmagazins und eines einzigen Präzisionslaufs überarbeitet.\nStandardausstattung: \u2013
item.pjss_modell_75.desc=Der Nachfolger des Modells 55 wird in zwei Varianten verkauft: einmal als zweiläufige Schrotflinte und einmal als Modell 75 III mit einem zusätzlichen Büchsenlauf (der angeblich das Herzstück der Mammutbüchse bildet). Auf diese Weise kann eine Salve mit hoher Durchschlagskraft und engem Schussbild ins Ziel gebracht werden, selbst über weite Entfernungen. Hochwertige natürliche Materialien kombiniert mit modernster Technik führen zu einer ausgewogenen und langlebigen Waffe von bester Qualität. Die Waffe schließt mit ihrer Reichweite die Lücke zwischen Schrotflinten und Sportgewehren, was sie zu einem perfekten Allrounder bei der Jagd macht.\nDie Waffe verfügt über zwei Abzüge, sodass die beiden Einsteckläufe auch verschiedene Kaliber laden können. Ein eingebautes Zielsystem auf IR-Basis erhöht die Treffsicherheit durch AR-Zielhilfen.
item.pjss_modell_75_iii.desc=(siehe Basismodell)\n Im Modell 75 III wird der Büchsenlauf daruntergehängt, um die Reichweite deutlich zu erhöhen.
