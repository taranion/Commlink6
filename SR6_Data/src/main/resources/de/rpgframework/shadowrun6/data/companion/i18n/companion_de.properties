quality.frog_tongue.page=131
quality.functional_tail=Funktionaler Schwanz
quality.functional_tail.page=131
quality.functional_tail.choice.variant=Art
quality.functional_tail.choice.variant.balance=Balanceschwanz
quality.functional_tail.choice.variant.balance.desc=Diese Form des Schwanzes ist üblicherweise 1 bis 2 Meter lang. Ein Balanceschwanz unterliegt nicht der bewussten Kontrolle des Charakters. Stattdessen bewegt er sich instinktiv und zuckt dabei, wedelt oder wickelt sich unwillkürlich um Haltemöglichkeiten, um die Balance des Charakters zu verbessern. Charaktere mit einem Balanceschwanz erhalten 1 Edge für alle Athletik-Proben, die mit dem Halten des Gleichgewichts, dem Klettern, Turnen oder Springen zu tun haben.
quality.functional_tail.choice.variant.paddle=Ruderschwanz
quality.functional_tail.choice.variant.paddle.desc=Dieser breite, geschuppte, biberartige Schwanz kann zum Paddeln und Steuern verwendet werden, wenn der Charakter schwimmt, und gewährt dann einen Würfelpoolbonus von +2 auf alle Proben auf Athletik (Schwimmen).
quality.functional_tail.choice.variant.prehensile=Greifschwanz
quality.functional_tail.choice.variant.prehensile.desc=Diese Form des Schwanzes funktioniert wie ein Ba-
lanceschwanz, aber der Charakter kann den Schwanz bewusst kontrollieren, als wäre er eine zusätzliche Glied­ maße. Der Schwanz kann Gegenstände aufnehmen, hat aber Probleme mit feinmotorischen Manipulationen. Einfache Aufgaben, die normalerweise keine Proben erfordern – wie etwa das Drücken eines Knopfes oder das Ziehen eines Auslösers –, erfordern eine gelungene Probe auf Konstitution + Geschicklichkeit (3). Der Schwanz hat eine effektive Stärke gleich der halben abgerundeten Stärke des Charakters, kann aber das gesamte Körpergewicht des Charakters halten, wenn dieser sich an ihm herabhängen lässt.
quality.functional_tail.choice.variant.thagomizer=Stachelschwanz
quality.functional_tail.choice.variant.thagomizer.desc=Dieser ausgesprochen muskulöse Schwanz endet in einer Quaste aus Stacheln. Er kann im Nahkampf mit der Fertigkeit Exotische Waffen (Stachelschwanz) eingesetzt werden und hat die folgenden Werte: Schaden 3K, Angriffswerte 8/–/–/–/–.
quality.functional_tail.choice.variant.whip=Peitschenschwanz
quality.functional_tail.choice.variant.whip.desc=Ein Schwanz dieser Art ist normalerweise drei Meter lang. Der Charakter kann ihn bewusst kontrollieren und ihn mit der Fertigkeit Exotische Waffen (Peitschenschwanz) wie eine Bullenpeitsche (SR6, S. 249) einsetzen. Außerdem hat der Schwanz dieselben motorischen Fähigkeiten wie ein Greifschwanz.
quality.functional_wings=Funktionale Flügel
quality.functional_wings.page=131
quality.functional_wings.choice.variant=Art
quality.functional_wings.choice.variant.type1=Funktionale Flügel (Typ 1)
quality.functional_wings.choice.variant.type1.desc=Diese Flügel verwandeln die Arme des Charakters zu Flügeln, wobei das Handgelenk zum mittleren Gelenk des Flügels wird und der Daumen eine geschärfte Kralle (Schaden 1K, Angriffswerte 4/–/–/–/–) aufweist. Dieses mittlere Gelenk ist nicht so gut einsetzbar wie eine normale Hand, weshalb sich die Edge-Kosten jeder körperlichen Handlung, die den Einsatz von Händen benötigt, um 1 erhöhen. Die Flügel sind normalerweise gefiedert, aber einige Expressionen haben fledermausartige oder sogar reptilienartige Flügel. Außerdem hat das Individuum eine veränderte Knochenstruktur und erleidet einen Würfelpoolmalus von -2 auf alle Widerstandsproben gegen Körperlichen Schaden.
quality.functional_wings.choice.variant.type2=Funktionale Flügel (Typ 2)
quality.functional_wings.choice.variant.type2.desc=Statt die Arme in ein Paar Flügel zu verwandeln, ver-
leiht Typ 2 dem Charakter ein zusätzliches Paar Gliedmaßen, das als Flügel ausgebildet ist, die aus den unteren Schultern und dem oberen Rücken wachsen. Diese Flügel haben ebenfalls einen „Daumen“ im mittleren Gelenk, der zu einer Kralle gebogen ist, mit der der Charakter im Nahkampf angreifen kann (Schaden 3K, Angriffswerte 6/–/–/–/–). Im Gegensatz zur Expression des Typs 1 verändert diese Version nicht die Knochenstruktur des Charakters, wodurch er keinen Würfelpoolmalus auf Widerstandsproben gegen Körperlichen Schaden erleidet.
