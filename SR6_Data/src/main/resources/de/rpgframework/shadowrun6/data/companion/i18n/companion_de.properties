qpath.critter_bond=Critterbindung
qpath.critter_bond.page=149
qpath.critter_bond.desc=Dieser Pfad behandelt den Aufbau einer Beziehung zu einem Critter und schaut sich an, wie diese Beziehung einen Shadowrunner und sein Gefühlsleben beeinflusst.<br/>\
 Der Pfad beginnt, wenn du eine enge Bindung zu einem einzelnen Critter aufbaust. Vielleicht ist es ein streunender Hund, den du zu füttern angefangen hast und der dann einfach nicht mehr wegging. Vielleicht ist es dein treues Pferd. Oder es ist eine Teufelsratte, die im selben Abschnitt der Kanalisation abhing, und schließlich habt ihr euch gegenseitig irgendwie akzeptiert und euch daran gewöhnt, in der Nähe des jeweils anderen zu sein. Was auch immer der Fall ist, es gibt diesen Critter, den du als deinen Critter betrachtest. Und du hast die Verantwortung für diesen Critter übernommen.
