quality.camouflage.choice.variant.basic.desc=Nachdem der Charakter 5 Minuten einem Hintergrund mit harten Kontrasten und verschiedenen Farbaletten ausgesetzt war, kann sich seine Haut innerhalb von 1 Minute an die Musterung des Hintergrundes anpassen. Die Farbgebung kann für bis zu 4 Stunden beibehalten werden. Wenn sich der Charakter (mit mehr als 1 Meter pro Kampfrunde) bewegt, kehrt die normale Hautpigmentierung für die Dauer der Bewegung zurück. Solange die Tarnung aktiv ist, gewährt sie einen Würfelpoolbonus von +1 auf alle Heimlichkeits-Proben, solange mehr als 40 Prozent der Haut des Charakters unbedeckt sind. Sind mindestens 80 Prozent der Haut unbedeckt, erhöht sich dieser Bonus auf +2.
quality.camouflage.choice.variant.dynamic=Dynamisch
