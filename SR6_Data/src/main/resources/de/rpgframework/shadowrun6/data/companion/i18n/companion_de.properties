metatype.duende   = Duende
metatype.duende.page=91
metatype.duende.desc=<b> \u2022 \u2300 Größe:</b> 1,1 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 55 kg<br/>\
 Bei der Analyse von Daten aus mehreren zuvor nicht verfügbaren Quellen wurde eine neue Metavariante der Sechsten Welt bestätigt. Sie ist Teil der Pumilionis-Subspezies und hat den Namen „Duende“ erhalten. Die größte Bevölkerungsgruppe dieser Metavariante entstammt den Philippinen, aber weitere Gemeinschaften wurden in den afrikanischen Nationen Mali-Foso und Niger sowie auf dem südamerikanischen Kontinent in Peru bestätigt. Sie sind für ihre fast ebenholzschwarze glatte Haut, ihr nahezu weißes oder blondes Haar und ihre durchdringend violetten Augen bekannt und sind der Pumilionis-Subtyp, der unter weitreichenden genetischen Veränderungen leiden musste. Die Duende besitzen rekombinante RNA, die der MMVV-Variante ähnelt, wie sie die Goblins aufweisen, eine Variante MMVV-infizierter Zwerge.<br/>\
 Duende leiden allesamt unter Urticaria solaris, der sogenannten Sonnenkrankheit, und zwar in einer extrem gefährlichen Ausprägung, was sie daran hindert, bei Tageslicht nach draußen zu gehen, sofern der Himmel nicht gerade sehr stark bewölkt ist. Sie besitzen dieselbe Widerstandskraft gegen Gifte wie die Pumilionis-Stammlinie und verfügen nicht nur über deren Infrarotsicht, sondern auch über Restlichtverstärkung. Sie sind darüber hinaus außergewöhnlich flink, nicht nur in Bezug auf Bewegungen, sondern auch bezüglich ihrer Reaktionszeit. Dieses Detail hat vielen ihrer Gegner einen ordentlichen Anteil an gebrochenen Knochen und zerschmetterten Kiefern eingebracht. Duende haben außerdem einen triebhaften Hunger auf fleischliche Proteine: Rind, Geflügel, Fisch usw.<br/>\
 Was unter ihren Eigenschaften allerdings wirklich herausragt, ist die Tatsache, dass sie eine gewisse natürliche Immunität gegen alle bekannten Formen des menschlich-metamenschlichen vampirischen Virus haben, einschließlich des Krieger-Stamms, der Ghule erschafft.
metatype.gnome    = Gnome
metatype.gnome.page=91
metatype.gnome.desc=<b> \u2022 \u2300 Größe:</b> 0,8 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 37 kg<br/>\
 Gnome sind kleiner als Zwerge und haben viel weniger Körperbehaarung, teilen aber die Fähigkeit zur Infrarotsicht mit ihrer Stammlinie. Ihre vielleicht fesselndste Eigenschaft ist ihre angeborene Widerstandskraft gegen jede Art von Magie.<br/>\
 Gnome leben weit verstreut über die gesamte Welt, wobei eine große Anzahl davon auf Mitteleuropa und Kleinasien entfällt. Das Fehlen großer Populationszentren bedeutet auch, dass Gnome oft keine eigene Kultur ausbilden, sondern stattdessen die Gebräuche des Gebietes annehmen, in dem sie geboren wurden
metatype.hanuman=Hanuman
metatype.hanuman.page=93
metatype.hanuman.desc=<b> \u2022 \u2300 Größe:</b> 1.2 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 49 kg<br/>\
 Bei ihrer ersten Begegnung mit der zivilisierten Welt wurden die Hanuman fälschlicherweise als Erwachte Affen (Macaca mulatta; Rhesusaffe) klassifiziert, die hauptsächlich auf dem indischen Subkontinent vorkommen. Spätere Studien bestätigten sie aber als Metavariante der Pumilionis-Stammlinie. Hanuman besitzen die Infrarotsicht und die verringerte Größe der Zwerge, verfügen aber über weitere Eigenschaften, die stark vom zwergischen Metatyp abweichen. Sie sind nach Hanuman, einem Gott der Hindu, benannt und weisen mehrere affenartige Eigenschaften auf, wie zum Beispiel verlängerte Gliedmaßen, einen üppigen Haarwuchs am Unterkörper, das Fehlen von Gesichtsbehaarung, vergrößerte Ohrmuscheln und einen Greifschwanz. Das alles kombiniert sich zu einer agilen Spezies, deren Vertreter oft meisterliche Kletterer und Akrobaten sind.<br/>\
 Die Populationen der Hanuman auf der Welt haben angefangen, sich über ihre kleinen Kollektive hinaus zu verbreiten. Viele Hanuman haben die Welt der Megakonzerne betreten, was nicht nur an Evo liegt, sondern auch an Regency MegaMedia und Horizon. 
metatype.koborokuru=Korobokuru
metatype.koborokuru.page=93
metatype.koborokuru.desc=<b> \u2022 \u2300 Größe:</b> 1.1 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 42 kg<br/>\
 Die Variante der Korobokuru hat die Infrarotsicht, die verringerte Körpergröße, die scharf gezeichneten, markanten Gesichtszüge und die Giftresistenz der zwergischen Stammlinie. Sie weisen eine größere Vielfalt bezüglich der Augen, der Körperbehaarung und der gesamten Muskulatur auf. Ihre Augen sind häufig mandelförmig, und ihre Körperbehaarung und Gesichtsbehaarung ist im Vergleich zu den anderen Pumilionis-Typen weniger üppig, was sich oft in weniger oder kürzeren Bärten und kürzerem und dünnerem Haar äußert. Die Muskeldichte – wie auch ihre Körpermasse insgesamt – ist geringer als beim gewöhnlichen Zwerg. Sie weisen einen schlankeren, muskulöseren Körpertonus und einen beschleunigten Metabolismus auf.<br/>\
 Die Metavariante der Korobokuru ist in Japan am häufigsten, insbesondere unter dem Volk der Ainu auf Hokkaido. Sie hatten ihre Schwierigkeiten, in Japan akzeptiert zu werden, sodass viele in tolerantere Länder wie die NAN, den Freistaat Kalifornien, Indien, Jakutien, Ecuador, Amazonien und den Vatikanstaat ausgewandert sind. Bei Letzterem liegt das daran, dass der Vatikan Korobokuru-Kindern kurz nach dem Erwachen eine sichere Zuflucht zur Verfügung stellte.
metatype.menehune=Menehune
metatype.menehune.page=94
metatype.menehune.desc=<b> \u2022 \u2300 Größe:</b> 1.1 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 42 kg<br/>\
 Diese Metavariante besitzt ebenfalls Infrarotsicht und erreicht vergleichbare Körpergrößen wie die zwergische Stammlinie, hat dabei aber ein eher spitzes Gesicht. Ihre Körperbehaarung ist dichter als bei gewöhnlichen Zwergen, und sie haben bemerkenswert dichte, volle Augenbrauen. Ihre Nasenflügel sind im Allgemeinen breit und flach und besitzen einen Muskellappen in den Nasenlöchern, der sich schließen lässt und so verhindert, dass Wasser eindringt. Sie haben lange Füße mit Schwimmhäuten und zusätzlichen Hautschichten, sodass ihre Füße Schwimmflossen ähneln. Ihre Gesamtmuskeldichte ist geringer als bei der Pumilionis-Stammlinie, und sie haben eine zusätzliche dünne Schicht aus kälteisolierendem Fett am gesamten Körper. Kombiniert man all das mit den Nickhäuten über ihren Augen, hat sich diese Spezies extrem gut an das Leben im Wasser angepasst.<br/>\
 Ursprünglich wurde angenommen, dass Menehune in den Gewässern rund um das Königreich Hawai’i beheimatet sind, aber sie stammen tatsächlich von den transozeanischen Küsten. Heutzutage kann man sie überall auf der Welt antreffen. Viele Menehune-Gemeinden teilen ihre Territorien mit anderen intelligenten Meeresbewohnern wie den Merrow, den Meistersingern oder Seedrachen. Mehreren Gerüchten zufolge dienen sie als Spione und Baumeister an Orten, die von der Seedrachin unterstützt werden.
metatype.dalakitnon=Dalakitnon
metatype.dalakitnon.page=78
metatype.dalakitnon.desc=<b> \u2022 \u2300 Größe:</b> 1.7 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 80 kg<br/>\
 Dalakitnon stammen ursprünglich von den philippinischen Inseln und ähneln Charakteren der lokalen Legenden. Sie sind hellhäutig, fast schon Albinos, haben hellblondes oder weißes Haar, und ihnen fehlt das Philtrum – die vertikale Rinne zwischen Nase und Oberlippe. Sie weisen außerdem eine sehr ungewöhnliche Allergie gegen Gewürze, hauptsächlich gegen Knoblauch, Senf, Salbei und Zimt, auf.<br/>\
 Dalakitnon besitzen eine einzigartige Eigenschaft, die bisher bei keiner anderen metamenschlichen oder metavariaten Spezies beobachtet werden konnte. Das ist die geschlechtliche Transmorphose, was bedeutet, sie können ihre äußeren Geschlechtsorgane zu bestimmten Zeiten ändern.
metatype.dryad=Dryade
metatype.dryad.page=78
metatype.dryad.desc=<b> \u2022 \u2300 Größe:</b> 1.75 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 63 kg<br/>\
  Diese Metavariante des nobilis hat bemerkenswert viele Ähnlichkeiten mit ihrer genetischen Stammlinie, ist allerdings etwas kleiner, schlanker und hat blonde Haare. Über Jahre hinweg war es sehr schwierig, sie zu identifizieren, zu studieren und zu verstehen. Dies lag an ihren übernatürlichen Kräften, die sie häufig benutzten, um sich ebenjener Beobachtung zu entziehen oder die Beobachter zu stören. Diese Hindernisse konnten überwunden werden, als finanzielle Zuwendungen des Apex-Konsortiums es Teams ermöglichten, mit einer Dryadenpopulation auf den Inseln von Papua-Neuguinea dauerhafteren Kontakt aufzunehmen.<br/>\
 Dryaden besitzen oft starke übernatürliche Fähigkeiten. Aufgrund ihrer stark symbiotischen Lebensweise haben sie oft eine enge Bindung zu natürlichen Umgebungen, die sie entschlossen verteidigen. Ein paar Dryaden haben angefangen, sich immer weiter in die Welt vorzuwagen, doch irgendwann zieht es sie alle wieder in ihre Heimatgebiete zurück.
metatype.nocturna=Nocturnen
metatype.nocturna.page=78
metatype.nocturna.desc=<b> \u2022 \u2300 Größe:</b> 1.9 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 80 kg<br/>\
 Die Nächtlichen. Schwarzherzen. Dunkelelfen. Diese Nobilis-Metavariante hat in vielen Gesellschaften stark gelitten, besonders in denen mit stark ausgeprägtem Aberglauben. Nocturnen haben fast dieselben phänotypischen Ausprägungen wie die Nobilis-Stammlinie, allerdings mit stärkerer Körperbehaarung, einem empfindlicheren Gehör und einer starken Überempfindlichkeit gegen helles Licht. Letzteres führt dazu, dass die meisten Nächtlichen – nun – nachtaktiv sind. Ihre Körperbehaarung besteht aus einer Deckschicht aus kurzem, dunklem Fell, das üblicherweise auch das Gesicht bedeckt. Nur auf den Handflächen, den Fußsohlen, den Augenlidern und den Genitalien wächst dieses Fell nicht. Es ist häufig schwarz, manchmal auch violett oder dunkelrot. Noch seltenere Farben sind ein tiefdunkles Orange, Dunkelgrün und die Farbe von angelaufener Bronze.<br/>\
 Der Biorhythmus der Nocturnen ist direkt mit dem Tag- und Nachtzyklus gekoppelt, und sie bevorzugen nächtliche Aktivitäten. Die Gründe dafür werden noch untersucht, aber selbst Gentherapien haben keinen Erfolg, wenn es darum geht, den Biorhythmus der Nocturnen für einen längeren Zeitraum zu ändern. Wenn Nocturnen durch Notwendigkeit oder freiwillig tagsüber wach sind, zeigen sie ähnliche Auswirkungen, wie es bei anderen Individuen bei Schlafentzug der Fall wäre, also erhöhte Müdigkeit und Stress.
metatype.wakyambi=Wakyambi
metatype.wakyambi.page=79
metatype.wakyambi.desc=<b> \u2022 \u2300 Größe:</b> 2.3 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 145 kg<br/>\
 Früher einmal waren die Wakyambi die vielleicht isolierteste aller Metavarianten. Sie besitzen die gleiche Restlichtverstärkung und Langlebigkeit wie Elfen, haben aber eine bemerkenswerte Körpergröße. Wakyambi können wie Trolle bis zu drei Meter groß werden. Die meisten haben eine dunkle Haut und krauses Haar, wie es in Afrika häufig ist, aber mittlerweile gibt es auch zwei bestätigte Personen mit Albinismus.<br/>\
 Bei Wakyambi treten magische Fähigkeiten häufiger auf als bei den meisten anderen Metatypen. Die meisten von ihnen leben immer noch in eng verbundenen Stammesgemeinschaften in Azanien, und viele ihrer Jugendlichen wagen sich während ihrer normalerweise etwa fünf Jahre dauernden „Traumreise“ in die Welt hinaus. Die Vereinbarung von Evo MetaErgonomics mit der Zulu-Nation hat die Wakyambi-Stämme dazu ermutigt, sich langsam mit einigen Elementen der Welt zu arrangieren, doch das gelang nur in Kombination mit einem tieferen Verständnis, das mit Zeit und Geduld erarbeitet werden musste. Die Wakyambi übernahmen Errungenschaften der Umwelttechnik wie Solar- und Windgeneratoren und neuere Wasserrückgewinnungstechnologien und entwickelten sie weiter. Sie verwenden keine brennbaren Kraftstoffe und hinterlassen keine giftigen Abfälle.
metatype.xapiri_thepe=Xapiri Thëpë
metatype.xapiri_thepe.page=79
metatype.xapiri_thepe.desc=<b> \u2022 \u2300 Größe:</b> 1.7 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 57 kg<br/>\
 Von allen Nobilis-Metavarianten isolieren sich die Xapiri Thëpë immer noch am stärksten. Auch sie besitzen die Restlichtverstärkung, die Langlebigkeit und das helle Haar der Nobilis-Stammlinie, aber ihre Haut ist ihr auffälligstes Merkmal. Sie produziert Chlorophyll in Bereichen mit Zellen, die Chloroplasten enthalten, wodurch die Xapiri Thëpë in der Lage sind, mittels Fotosynthese aus Sonnenlicht Energie zu erzeugen. Die Haut beginnt an den Ohren, am Schädel und am Rücken damit, diese Bereiche auszubilden, die sich weiter ausbreiten, wenn das Individuum älter wird. Wenn es das Erwachsenenalter erreicht (was ungefähr im Alter von 45 Jahren der Fall ist), haben sich diese Bereiche schließlich auf den gesamten Körper ausgebreitet.<br/>\
 Xapiri Thëpë geben sich große Mühe, ihre Abgeschiedenheit zu erhalten, vor allem seit entdeckt wurde, dass ihre Haut in bestimmten Wellenlängen von ultraviolettem Licht leicht zu entdecken ist, weil das Licht eine fotoreaktive Reaktion auf ihrer Haut erzeugt. Da sie somit leichter zu entdecken sind, entschieden sie, dass sie zusätzliche Anstrengungen unternehmen sollten, um außer Sicht zu bleiben.
metatype.nartaki=Nartaki
metatype.nartaki.page=82
metatype.nartaki.desc=<b> \u2022 \u2300 Größe:</b> 1.75 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 86 kg<br/>\
 Die früheste bekannte Metavariante des H. sapiens sapiens, die zum jetzigen Zeitpunkt wissenschaftlich dokumentiert ist, wurde zuerst in der Indischen Union bestätigt, und zwar während der Jahre kurz vor und während des Vorbeiflugs des Halleyschen Kometen 2061 und wieder 2077 beim Vorbeiflug des McNaught-Kometen. Während der Holi-Feierlichkeiten 2076 gab es einen zusätzlichen Anstieg des Mananiveaus am Ganges, der dazu führte, dass fünfhundert Individuen – alle weiblichen Geschlechts – plötzlich als Nartaki exprimierten.<br/>\
 Nartaki können leicht anhand ihrer zusätzlichen Arme identifiziert werden – sie haben ein oder mehrere zusätzliche Armpaare. Das und die variierenden Haut farben und -töne lassen Nartaki aus fast jeder Menge herausstechen. Durch ihre zusätzlichen Gliedmaßen gehören Nartaki zu den wenigen natürlich vorkommenden Säugetieren mit sechs oder gar acht Gliedmaßen.<br/>\
 Nartaki besitzen außerdem überdurchschnittliche Stärke. Das lässt sich auf eine Vielzahl von Einzelfaktoren in ihrem Körper zurückführen, darunter angepasste Muskelstrukturen, ein spezieller Aufbau des Skeletts und sogar unterstützende hämatologische Eigenschaften.
metatype.valkyrie=Walküre
metatype.valkyrie.page=83
metatype.valkyrie.desc=<b> \u2022 \u2300 Größe:</b> 1.76 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 115 kg<br/>\
 Also an alle: Ja, wir haben „Engel“ unter uns. Das sind Individuen mit voll funktionsfähigen Flügeln, die sie zusammen mit ihren angeborenen magischen Kräften in die Lage versetzen, tatsächlich zu fliegen. In Indien und der SAW sind sie nicht als Walküren bekannt, sondern als Garuda ke Santaan (Kinder von Garuda) oder auch einfach als Garudan.<br/>\
 Im Durchschnitt haben Walküren von den Zehen bis zum Schädel eine normale menschliche Körpergröße, wobei sich ihre Flügel um einen weiteren halben Meter bis Meter darüber erheben. Weibliche Walküren weisen an ihren Flügeln helle Farben und Schattierungen auf, die von weiß bis weizenfarben reichen, manchmal aber auch orangefarben oder rot sind. Bei männlichen Walküren tendieren die Flügel farblich zu grau, einschließlich dunkelviolett, blau und schwarz. Nichtbinäre Individuen können sich einer dieser Farbgebungen anpassen oder aber eine Mischung kreieren oder einfach ihr eigenes Ding machen. Bei manchen wurde sogar schon Dunkelgrün als Flügelfarbe gesehen. Beobachtungen von Individuen in der Skandinavischen und der Indischen Union zeigen, dass die Fortpflanzung von Walküren im Wesentlichen die Gleiche wie beim Homo sapiens sapiens ist. Anders als die Raptoren leiden Walküren nicht unter einer Veränderung ihrer Knochenstruktur oder Knochendichte. Sie haben einen Daumenfortsatz in Form einer Klaue am obersten Punkt ihrer Flügel, der in der Lage ist, erheblichen Schaden zu verursachen
metatype.hobgoblin=Hobgoblin
metatype.hobgoblin.page=84
metatype.hobgoblin.desc=<b> \u2022 \u2300 Größe:</b> 1.8 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 98 kg<br/>\
 Hobgoblins haben dieselbe Restlichtverstärkung wie die Stammlinie Homo sapiens robustus, ansonsten aber nicht viel mit ihr gemeinsam. Sie weisen grünliche Hauttöne auf, die von einem matten Ocker bis hin zu kräftigem Waldgrün reichen. Sie besitzen einen schlankeren Körperbau, sind nicht so muskulös wie die Stammlinie, und auch ihre Kieferstruktur ist anders: Es fehlen die vergrößerten unteren Eckzähne. Stattdessen haben sie einen schmaleren Kiefer mit spitzen Zähnen. Ihre Augen sind vollständig schwarz, sodass man Sklera, Pupille und Hornhaut nicht voneinander unterscheiden kann. Ein letzter Unterschied ist die in aller Regel weniger ausgeprägte Körperbehaarung.<br/>\
 Hobgoblins gehören zu den von Natur aus wilderen und entschlosseneren aller Metavarianten. Als entdeckt wurde, dass ihre Temperamentausbrüche und Stimmungsschwankungen mit häufigen Veränderungen ihres Hormonspiegels einhergehen, wurden Behandlungsmöglichkeiten gesucht, um Mitgliedern dieser Metavariante zu helfen. Und auch wenn viele Repräsentanten ihrer Gemeinschaften und Clans diese Medikamente verwenden, wenn sie mit Außenstehenden zu tun haben, gilt es unter ihnen als eine Frage des Stolzes und der Ehre, einfach so zu sein, wie man ist, mit all ihrer emotionalen und ausdrucksstarken Art. Mithilfe dieser Medikamente konnten sie allerdings Verhandlungen vorantreiben, um endlich eigene Ländereien in der Mongolei und der nördlichen Mandschurei ihr Eigen nennen zu können.
metatype.ogre=Oger
metatype.ogre.page=85
metatype.ogre.desc=<b> \u2022 \u2300 Größe:</b> 1.7 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 101 kg<br/>\
 Oger besitzen größtenteils dieselben körperlichen Charakteristika wie die Stammlinie Homo sapiens robustus, einschließlich der Restlichtverstärkung, der muskulösen Statur, der vergrößerten unteren Eckzähne und der spitz zulaufenden Ohrmuscheln. Die Angehörigen dieser Metavariante, die in größerer Zahl erstmals in Europa und Zentralasien dokumentiert wurde, sind etwas kleiner als der durchschnittliche Ork, haben eine glattere Haut, einen hervortretenden Kiefer und einen breiteren Mund. Sie haben einen leistungsfähigeren Verdauungstrakt, der es ihnen ermöglicht, auch Dinge zu essen, die eigentlich keine Nahrung sind, wie etwa Blechdosen und andere Abfälle (auch wenn diese sehr wenig echten Nährwert bieten). In den 2040ern wurden Oger des Kannibalismus bezichtigt, aber das wurde widerlegt.<br/>\
 In den Jahrzehnten, die auf die Abklärung der Natur ihres Verdauungstraktes folgten, machten Oger einige Fortschritte bei der Verringerung ihrer sozialen Ausgrenzung, aber viele treffen immer noch auf Hindernisse n Gebieten, in denen die Denkweisen noch von den älteren Geschichten geprägt sind. Die Tatsache, dass sie vom Aussehen her nicht weit von der menschlichen Erscheinung entfernt sind, hilft ihnen, auch wenn ihr muskulöser Körperbau oft dazu führt, dass sie Beschäftigung in Branchen finden, in denen körperliche Arbeit gefragt ist. <br/>\
 Oger machen einen wachsenden Prozentsatz der europäischen Orkpopulationen aus und haben sich damit arrangiert, dass man ihnen oft mit viel Voreingenommenheit entgegentritt. Viele von ihnen haben in der Trollrepublik Schwarzwald eine Heimat und ein neues Leben gefunden, wo sie die Rollen von Sprechern und Dolmetschern ausfüllen. Dies wiederum hat auch eine gewisse Anzahl von ihnen als Repräsentanten nach Seattle verschlagen.
metatype.oni=Oni
metatype.oni.page=86
metatype.oni.desc=<b> \u2022 \u2300 Größe:</b> 1.9 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 128 kg<br/>\
 Wie die Korobokuru traten auch die Oni zuerst im Japanischen Kaiserreich auf. Als eine Variante der Robustus-Stammlinie wurden sie zum Ziel von Hass, Angst und sogar Völkermord. In den ersten Jahren der Goblinisierung war es in der Tat schockierend, mitzuerleben, wie sich ein Individuum plötzlich und heftig in einen Oni verwandelte. Oni teilen die verbesserte Sehkraft und stärker entwickelten Muskeln ihrer Robustus-Stammlinie, aber das war es dann auch schon mit den Ähnlichkeiten. Der Hautton eines Oni ist einer von drei leuchtenden Farbtönen: leuchtend rot, blau oder orangefarben. In Kombination mit einer sehr kantigen Augenstruktur verleiht ihnen das ein wildes und oft unvergessliches Gesicht. Ihre Ohren stehen seitlich am Schädel ab, was ihnen nach Meinung einiger Beobachter einen elfischen Einschlag verleiht. Dieser ohnehin eindrückliche Schädel wird dann noch einprägsamer durch die Hörner, die aus den Schläfen emporwachsen.<br/>\
 Bis zum heutigen Tag entwickelt sich die Expression des Oni nur bei Leuten japanischer Herkunft oder Abstammung; nirgendwo auf dem Planeten wurden weitere Varianten dokumentiert. Oni kommen auf den japanischen Inseln in großer Zahl vor, was natürlich auch bedeutet, dass sie die vorherrschende Ork-Unterart auf der Insel Yomi sind. Das Wort Oni hat japanische Wurzeln und bezieht sich auf die Dämonen der japanischen Folklore. Frühere Forschungen und Dokumentationen haben bestätigt, dass die auf die Insel Yomi verbannten Oni trotz ihrer Absonderung und Unterwerfung durch die japanische Regierung und die japanischen Megakons in der Lage waren, eine eigene kulturelle Identität zu entwickeln. Das begann mit einer Struktur ähnlich dem feudalen Japan, wobei die meisten Oni dem Kodex des Bushido folgten, sich als Samurai zusammenschlossen und den verschiedenen Herrschern die Treue schworen, die sich auf der Insel etabliert hatten. In den darauffolgenden Jahren versuchten viele Oni, ihre Art zu befreien und aufzuklären, indem sie ihre Form des Bushido an andere Oni weitergaben, die in Japan und auf der ganzen Welt leben.
metatype.satyr=Satyr
metatype.satyr.page=87
metatype.satyr.desc=<b> \u2022 \u2300 Größe:</b> 1.6 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 69 kg<br/>\
 Satyrn sind die vielleicht auffälligste und gesellschaftlicheinprägsamste Unterart des Robustus. Sie haben die Restlichtverstärkung ihrer Stammlinie und etwas zusätzliche Muskelmasse, unterscheiden sich von ihr aber hinsichtlich ihrer Gesichtsform, des Aufbaus ihrer Beine und ihrer Gesamtkörpermasse. Außerdem haben sie kurze Hörner, die oft nach hinten gebogen sind und sich über die Schläfen erstrecken, obwohl es auch Varianten gibt, die widder- oder stierartige Stoßhörner ausbilden. Satyrn haben verlängerte Kiefer mit schmalen Nasenzügen und Wangenknochen. Ihnen fehlen die vergrößerten unteren Eckzähne der anderen Robustus-Ausprägungen.<br/>\
 Satyrn passen sich normalerweise an die Kulturen an, in denen sie leben. Es gibt stabile Populationen dieser Metavariante in ganz Europa, wobei größere Zahlen in der Ägäis, im Ostseeraum, der Trollrepublik Schwarzwald und in Nordfrankreich vorkommen. In den nördlichen Ausläufern der Rocky Mountains innerhalb der Sioux-Nation und des Salish-Shidhe-Rats wurden ebenfalls neue Expressionen der Satyrn kontaktiert.<br/>\ 
 Die Gewalt gegen Satyrn, die in der zweiten Hälfte der 70er-Jahre einsetzte, nimmt immer noch zu, und fast alle hochkarätigen Satyrn des öffentlichen Lebens haben inzwischen Leibwächter. Satyr-Gemeinschaften haben damit begonnen, Sicherheitsanbieter zu engagieren, wenn sie es sich leisten können, und manchmal übernehmen einige Hooder diesen Job für wenig Geld.
metatype.cyclops=Zyklop
metatype.cyclops.page=90
metatype.cyclops.desc=<b> \u2022 \u2300 Größe:</b> 2.7 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 421 kg<br/>\
 Die Zyklopen sind eine Metavariante, die zuerst in der Ägäis beobachtet wurde. Sie sind sogar noch massiger gebaut als Trolle und haben wenig Kopf- und Körperbehaarung. Am bekanntesten sind sie für ihr großes einzelnes Auge, das direkt über der Nasenwurzel liegt. Ihre mediterrane Herkunft hat ihnen eine gut gebräunte Haut verliehen, ganz ohne die Dermalablagerungen der trollischen Stammlinie. Üblicherweise haben sie ein einzelnes Horn, wenn sie überhaupt Hörner haben. Ein paar wenige Exemplare haben mehrere Hörner, die ungleichmäßig auf dem Schädel verteilt sind. Da diese Hörner jedoch sehr unbequem sind, entfernen einige Zyklopen sie.<br/>\
 Einige Mediziner hatten die Theorie, dass ein zusätzliches implantiertes Cyberauge Zyklopen in die Lage versetzen könnte, stereoskop wahrzunehmen, aber das hat nicht funktioniert. Selbst wenn sie dann den nötigen Aufbau der Augen haben, fehlen ihnen die neuralen Voraussetzungen, Signale von zwei Augen zu verarbeiten. Statt ihnen eine Verbesserung des Sehvermögens zu geben, verursacht ein zweites Auge lediglich Kopfschmerzen. Dank seiner Größe verleiht ihnen ihr Einzelauge aber eine hinreichende Tiefenwahrnehmung.
metatype.fomorian=Fomori
metatype.fomorian.page=88
metatype.fomorian.desc=<b> \u2022 \u2300 Größe:</b> 2.35 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 224 kg<br/>\
 Fomori weisen dieselben Sichtfähigkeiten wie der primäre Ingentis-Metatyp auf, ebenso die starke Muskulatur, die ausgeprägten Hörner und die vergrößerten unteren Eckzähne. Im Vergleich zur Stammlinie haben sie allerdings eine kleinere Statur und weniger Dermalablagerungen. Ihre Hörner sind schmaler als die der meisten Trolle, was dabei hilft, die Vorurteile zu zerstreuen, mit denen sich andere Trolle häufig konfrontiert sehen. Eine ungewöhnliche Eigenschaft der Fomori ist, dass sie beim Erreichen des Erwachsenenalters alle eine ähnliche Größe erreichen, normalerweise innerhalb eines Toleranzbereichs von zehn Zentimetern.
metatype.giant=Riese
metatype.giant.page=89
metatype.giant.desc=<b> \u2022 \u2300 Größe:</b> 3.0 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 467 kg<br/>\
 Auch wenn die meisten Leute denken, Trolle seien groß, gibt es eine Metavariante, die die anderen buchstäblich um einen Kopf überragt. Riesen haben eine durchschnittliche Körpergröße von drei Metern, wobei auch ein paar Individuen dokumentiert sind, die zwischen dreieinhalb und vier Metern groß sind. Ihnen fehlen die Hörner und die Dermalablagerungen der Trolle, aber sie teilen mit ihnen den stämmigen Körperbau und die ausgeprägte Muskulatur. Riesen haben eine üppige Gesichtsbehaarung (zumindest die Männer) und eine rindenartige, ledrige Haut, was ihr raues, wettergegerbtes Aussehen noch betont. Wegen ihrer Größe ist ihre Muskulatur über einen größeren Bereich verteilt, was ihnen eine schlankere Erscheinung verleiht als bei anderen Angehörigen der Ingentis-Subspezies.<br/>\
 Riesen sind darüber hinaus eine der wenigen Metavarianten, die eine ungewöhnliche Tendenz zur genetischen Umkehrung haben – etwa eine von vier weiblichen Nachkommen von Riesen ist menschlich (<i>Homo sapiens sapiens</i>). Diese seltsame genetische Umkehrung passiert am häufigsten in der Pubertät, wurde aber auch schon bei einem weiblichen Individuum beobachtet, das Ende dreißig war. Die Gründe dafür werden noch untersucht, aber bisherige Forschungsergebnisse deuten nicht darauf hin, dass externe Reize wie die Geografie, verminderte astrale Hintergrundstrahlung (also Manablasen oder -hohlräume) oder eine Umkehr in der Familie der Eltern Einfluss hätten.
metatype.minotaur=Minotaur
metatype.minotaur.page=86
metatype.minotaur.desc=<b> \u2022 \u2300 Größe:</b> 2.4 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 285 kg<br/>\
 Minotauren tragen keine Stier-DNA in sich, aber sie haben Hörner, weit auseinanderstehende Augen und breite, flache Nasen, die rinderartig aussehen. So sind sie auch zu ihrem Namen gekommen. Ihr Körperbau ist kürzer und stämmiger als bei anderen Trollen, was sie nicht weniger stierähnlich macht.<br/>\
 Minotauren tauchten zuerst auf den griechischen Inseln und in Teilen der Ägäis auf, wobei sich die zweite Generation bis nach Konstantinopel, Zypern und Barcelona ausbreitete. Auch wenn ihr gebräuchlicher Name die Leute denken lässt, dass sie großartig darin sind, Höhlensysteme zu erkunden, haben sie tatsächlich stark in der Schifffahrt und anderen maritimen Berufen Fuß gefasst, und viele von ihnen sind – zusammen mit ihren Verwandten, den Riesen – Konzernbürger von Mærsk geworden. Spinrad International, Saeder-Krupp und (natürlich) Evo bieten Minotauren ebenfalls Konzernbürgerschaften und Beschäftigungsmöglichkeiten an. 
metatype.centaur=Zentaur
metatype.centaur.page=87
metatype.centaur.desc=<b> \u2022 \u2300 Größe:</b> 2.1 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 435 kg<br/>\
 Ursprünglich wurden die Zentauren fast ausschließlich im griechischen Hochland gefunden und erst später auch in den großen Ebenen Nordamerikas und den Pampas Südamerikas entdeckt. Diese Wesen kommen in einer eindrucksvollen Vielfalt vor. Sie haben typischerweise einen Pferdekörper (obwohl auch Varianten anderer Vierbeiner bekannt sind) und Rumpf, Kopf und Arme eines Metamenschen. Normalerweise ist der Oberkörper menschlich, obwohl auch Ork- und Elfenvarianten bekannt sind.
metatype.merrow=Merrow
metatype.merrow.page=95
metatype.merrow.desc=<b> \u2022 \u2300 Größe:</b> 2.85 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 375 kg<br/>\
 Merrow sind eine Spezies der Meere. Sie haben einen orkähnlichen Oberkörper, häufig mit Zierflossen und Kämmen an ihren Ohrmuscheln und entlang ihres Rückens, die manchmal bis an ihre untere Körperhälfte heranreichen. Der Unterkörper ähnelt dem Leib eines geschuppten Wals.<br/>\
 Ihre Augen sind um fast die Hälfte größer als die eines Metamenschen. Die größere Fläche der Iris in Kombination mit einer erhöhten Dichte von Stäbchen und Zapfen verleiht ihnen ein breites Sichtspektrum, das bis ins Ultraviolett reicht. Ihr Schädel hat eine ausgeprägte Kieferpartie, die 38 Zähne enthält – sechs mehr als metamenschliche Schädel –, und sie haben verlängerte Nasengänge, die ihnen in Verbindung mit den Kiemenklappen an der oberen Brust manchmal eine gewisse Ähnlichkeit mit Seepferdchen verleihen.<br/>\
 Sie sind zu Sprache und anderen komplexen Lautäußerungen fähig – was sie fast so lange geheim gehalten haben wie die Nagas, damit sie Gelegenheit hatten, uns Oberflächenbewohner und unsere vielen Eigenarten besser verstehen zu können, ohne sich mit der Notwendigkeit einer Antwort herumschlagen zu müssen.
metatype.naga=Naga
metatype.naga.page=96
metatype.naga.desc=<b> \u2022 \u2300 Größe:</b> 6.9 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 245 kg<br/>\
 Der Körper der Nagas sieht aus wie der Körper einer großen Schlange mit physischen Variationen, die den weltlicheren Formen von Schlangen, Giftnattern, Vipern, Würgeschlangen und sogar Kobras ähneln. Nagas besitzen häufig aktive magische Fähigkeiten, die den meisten Metamenschen ebenbürtig oder sogar überlegen sind. Ihre Infiltrationsoperation in alle Aspekte der Konzerne unserer Welt ist so weit fortgeschritten, dass in den ohnehin offenen Armen von Evo nun eine Naga als aktuelle CEO sitzt. Nagas werden bis zu zehn Meter lang, mit einem Umfang von knapp einem Meter, obwohl bekannt ist, dass die „Lords der Nagas“ in Amazonien, die anscheinend auf Anakondas basieren, dreizehn bis vierzehn Meter lang werden können, mit anderthalb Metern Umfang oder sogar mehr.<br/>
 Im Kampf verlassen sich Nagas ganz auf ihre natürlichen Stärken – für einige von ihnen ist das Schnelligkeit, für andere Stärke. Viele Nagas verfügen über dasselbe Gift, das in den zugrunde liegenden weltlichen Arten vorgefunden wird, aber bei den Nagas ist das Gift dank ihrer inhärenten Magie weitaus stärker. Ihre weltweite Gesamtbevölkerung wird heute auf mehr als eine Viertelmillion Exemplare geschätzt. Die größten Bevölkerungszentren befinden sich in Kambodscha, Amazonien und der Indischen Union. Sie sind in den Großen Zehn, mehreren AA-Kons und Nationen wie dem Bangla Commonwealth, Laos, Malaysia, der Mandschurei, dem Salish-Shidhe-Rat, Sichuan, Singapur, Sri Lanka und Vietnam zum Erwerb einer SIN berechtigt.
metatype.pixie=Pixie
metatype.pixie.page=96
metatype.pixie.desc=<b> \u2022 \u2300 Größe:</b> 0.6 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 19 kg<br/>\
 Von Pixies glaubt man im Allgemeinen, dass sie von den Feen abstammen, was eine korrekte Klassifizierung schwierig gemacht hat. Ihre seltsame Angewohnheit, bei ihrem Tod zu verschwinden, stellt die Gelehrten ebenfalls vor ein Rätsel. Jüngst haben ausgewählte Anthropologen und Parabiologen die Erlaubnis erhalten, zum Seelie-Hof zu reisen, um mehr über die atemberaubende Vielfalt metaplanarer Lebewesen zu lernen. Und obwohl weder Biopsien noch Nekropsien erlaubt oder durchgeführt wurden, konnte mit unterschiedlichen Werkzeugen und der Unterstützung durch den Seelie-Hof in zwei Jahren Arbeit in Kooperation mit zwei Renraku-Tochterfirmen, Genecraft Biodesigns und dem Australischen Institut für Magische Forschung, eine vollständige, nutzbare Taxonomie erstellt werden.<br/>\
 Wie sich herausgestellt hat, stammt der größte Teil der Pixie-Population ursprünglich aus einem Gebiet, das als die Wilden Feenlande bekannt ist. Diese Populationen kommen mittels versteckter Portale und übernatürlicher Brücken in unsere Welt, die gut gehütete Geheimnisse sind. Die Korrigan, eine Koalition von paranormalen Wesen, Geistern und Feenwesen, feiern immer noch die Gründung der unabhängigen Nation des Waldes von Brocéliande in Frankreich und haben begonnen, andere Teile der Welt auf der Suche nach weiteren geeigneten Plätzen zum Siedeln zu erkunden. Die Pixies sind eine der Hauptkräfte in dieser Gruppierung, stellen deren Führung und geben Richtungsimpulse (soweit dieser lose Zusammenschluss überhaupt zulässt, geführt zu werden). 
metatype.sasquatch=Sasquatch
metatype.sasquatch.page=97
metatype.sasquatch.desc=<b> \u2022 \u2300 Größe:</b> 2.4 Meter<br/>\
 <b>\u2022 \u2300 Gewicht:</b> 244 kg<br/>\
 Normalerweise werden Sasquatche volle drei Meter groß, mit einem Körper, der dicht mit Haar bedeckt ist, dessen Farbe meist Töne ihrer Herkunftsgebiete annimmt und eine Bandbreite von Dunkelbraun und Schwarz über Hellbraun und Blond bis hin zu tiefem Rostrot und dem Elfenbeinweiß des Himalaja abdeckt. <br/>\
 Sasquatche kommunizieren aufgrund von Beschränkungen ihres Stimmapparats mit Gebärdensprache, auch wenn sie die Fähigkeit haben, hohe Töne zu erzeugen, mit denen sie oft die Vogelwelt ihrer Heimatregionen imitieren.<br/>\
 Sasquatche werden von den meisten Megakonzernen als vernunftbegabte Lebewesen anerkannt, wobei Aztechnology, Ares, Evo, Horizon, Saeder-Krupp und Wuxing ihnen auch den Erwerb der Konzernbürgerschaft ermöglichen. Nationen wie die NAN, die Tírs, Aztlan, Amazonien, Jakutien und die Konföderierte Allianz Australien und Neuseeland bieten ihnen eine vollwertige Staatsbürgerschaft an. Die CAS prüft derzeit Petitionen und Verfahren zur Anerkennung, was den Gemeinschaften der Sasquatche in den Bundesstaaten Georgia, Tennessee sowie North und South Carolina Grund zur Hoffnung gibt. Normalerweise beschränken sie sich bei der Wahl ihrer Lebensräume auf natürliche oder ökologisch gesunde Orte.<br/>\
 Obwohl die meisten Sasquatche formell als ungebildet gelten müssen, können sie lernen und sich anpassen. Ihre Kommunikationsmöglichkeiten können mit speziellen Geräten in Form von Handschuhen verbessert werden, die Gebärdensprache in Text oder hörbare Wörter umwandeln.
critterpower.vanishing=Verschwinden
critterpower.vanishing.page=98
critterpower.vanishing.desc=Diese Fähigkeit wird häufig mit Wesen von den Meta­ebenen der Feen in Verbindung gebracht. Lebewesen mit dieser Kraft können im wahrsten Sinne des Wortes aus der physischen Welt verschwinden, ohne eine Spur zu hinterlassen. Wenn das Lebewesen verschwindet, verschwindet auch die persönliche Ausrüstung, die es am Körper trägt oder in den Händen hält (die Spiel­ leitung entscheidet, was alles mit dem Lebewesen verschwindet). In den meisten Fällen wird das Ver­schwinden durch den Tod des Feenwesens ausgelöst. In manchen Fällen kann das Verschwinden auch willentlich herbeigeführt werden, aber der Wiedereintritt in die physische Welt kann nur an Orten erfolgen, die eine starke Feennatur haben (auch hier liegt die Entschei­dung bei der Spielleitung).

