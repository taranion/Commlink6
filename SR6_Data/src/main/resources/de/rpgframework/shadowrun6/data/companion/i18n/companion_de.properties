quality.gills.choice.type.air.desc=Charaktere, die normalerweise unter Wasser atmen, können mit diesen Kiemen normale Luft atmen. Sie benötigen eine stärker mit Sauerstoff gesättigte Luft, weswegen sie unter dem Status Erschöpft I (SR6, S. 54) leiden, wenn sie Luft atmen. In größeren Höhen oder bei dünnerer Luft (nach Maßgabe der Spielleitung) erhalten sie den Status Erschöpft II.
