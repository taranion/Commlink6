quality.returned_soldier.desc=The only clear information about the soldiers returning to Earth, including those from III Corps, is they spent some time in the metaplane of Dis, and it generally altered them in some way. How they got to Dis and why they were there remain unclear.<br/>There is significant disparity in these soldiers. Some of them have been gone for a long time, others for mere months. Some have intense memories of their time away, others have barely any memories of all. Some come back barely altered, while others are drastically changed.
quality.astral_vision.desc=The soldier is not Awakened but can astrally perceive. They can’t tell anything about the power of an individual or object from their aura, but they can tell if a person or item is Awakened or not. This requires a Perception + Intuition (2) test.
quality.distant_vision.desc=The soldier gains the Innate Spell critter power (p. 225, SR6) and uses it to cast Clairvoyance (p. 134, SR6). If they were not Awakened before they disappeared, they receive the Magic attribute at 3 and the Sorcery skill at 2.
quality.gecko_grip.desc=The soldier has grown small hairs over their hands and feet similar to the outer layer of gecko tape gloves. That means they can use assisted climbing (p. 93, SR6) whenever scaling a vertical surface—but only when they have no shoes on. A Called Shot (Disarm) action made against them needs three net hits to make them drop their weapon. They also have trouble putting down a weapon when they want to.
quality.gills.desc=The soldier has grown gills in their neck, meaning they can breathe underwater.
quality.foresight.desc=The character gets glimpses of future events, though often in quick flashes that lack context or only provide hints of things to come. The gamemaster can determine how these glimpses happen, when they are fulfilled, and whether they can be changed, but they should be accurate enough to make people pay attention when they happen.
quality.frog_tongue.desc=The soldier gains a long, sticky tongue that they can shoot out of their mouth with precision. The tongue can pull an item weighing up to half a kilo (a full kilo of the individual’s Body is 6 or more). Someone must manually remove the object from the tongue, as the tongue cannot drop it on its own. Treat the effort to grab an object with the tongue as an unarmed attack with no damage.
quality.prehensile_tail.desc=The soldier has grown a prehensile tail. They can pick up objects with it and hang from it. It has a Strength equal to half of their unaugmented Strength (rounded up). They also can reduce the cost of Edge boosts and actions by 1 (to a minimum of 1) on tests using Athletics.
quality.spectral_hand.desc=The soldier is capable of making their hand and part of their forearm insubstantial so that it can pass through solid objects. They cannot dematrialize an object and carry it with through a solid object, but they can partially rematerialize the hand, so that they may stick it through a door and open it the the knob or handle on the other side. A dual-natured weapon can sever the hand while it is dematerialized.
quality.stone_skin.desc=At will, with a Minor Action, the soldier can harden their skin, boosting their Defense Rating by 2. This stacks with other Defense Rating enhancements, including armor. They can make their skin return to normal with another Minor Action.
quality.telekinesis.desc=The soldier can move physical objects with the power of their mind, and they do not need to be Awakened to do so. They make a Willpower + Intuition test; for each net hit, they can move a kilogram of material. They cannot fling it; it moves relative slowly, at a rate of a half meter per combat round.

quality.doppelgaenger.desc=The soldier is no longer one of a kind — there are at least two of them running around. Both of them insist they are the real person, and they become tremendously confused when presented with evidence of their duplicate. All of these individuals have identical DNA, but they manifest different variants on their essential character traits (for example, both may have a certain innate caution, but one has learned to be watchful while in motion, while the other insists on taking things slowly to help them watch out for danger).
quality.memory_hole.desc=The soldier has a specific part of their past that they cannot recall, even though other memories are intact. They may remember their childhood home but not a best friend they had while living there, or they may remember all of their siblings or unit members except one, and so on. A Mind Probe spell with 7 or more hits can access the memories that have somehow been locked off to the individual.
quality.missing_features.desc=The character might have parts of them that did not survive the transition to their current state of existence. It could be an earlobe, an entire ear, and eye, a finger, or a chunk out of their arm or leg bone.<br/>The change is cosmetic and does not affect their attributes or skills, and they can replace the absence with the help of modern medicine if they so choose.