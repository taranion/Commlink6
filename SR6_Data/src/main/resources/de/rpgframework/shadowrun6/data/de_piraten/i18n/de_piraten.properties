item.lkb_t3.desc=Zur Zeit der Eurokriege erfreuten sich diese Luftkissen-Landungsboote großer Beliebtheit. Trotzdem wurden nur wenige von ihnen produziert. Heute hat jedes dieser Boote seine optimale Dienstzeit von dreißig Jahren bereits hinter sich und hätte bereits sein Ende in der Wiederverwertung finden sollen. Tatsächlich aber neigte man in den turbulenten 2060ern dazu, zu lagern und zu vergessen. Es ist kaum verwunderlich, dass mehr als nur eines dieser Boote "verloren" ging. Mit etwas Zuwendung kann das LKB-T3 auch heute noch zuverlässig betrieben werden, wenn man denn an eines herankommt. Das etwa 27 Meter lange Transportboot kann Lasten von bis zu 70 Tonnen Fracht oder 180 vollausgerüstete Mann auf etwa 170 m2 offener Transportfläche tragen und ist damit auch für den Transport von Einsatzfahrzeugen geeignet. Regulär bietet es Raum für die fünfköpfige Crew und fünf Passagiere. Die zusätzliche Panzerung für den Turbinen- und Luftkissenbereich sowie die verschiedenen Redundanzsysteme sorgen selbst im Gefecht für einen zuverlässigen Betrieb. Für eine Crew, die in Küstennähe operiert und es auf Waren abgesehen hat, ist das LKB-T3 ein Traum. \n Alternative Konfiguration mit 10 Sitzen verfügbar.

item.selkie.desc=Das Kalmaar Selkie ist sowohl Schnellboot als auch U-Boot und wurde eigentlich mehr als Luxusspielzeug denn als ernst zu nehmendes Einsatzfahrzeug konzipiert. Es erfüllt keine seiner zwei Aufgaben so gut wie spezialisierte Fahrzeuge, findet aber gerade in den freier denkenden Bereichen der Seefahrt seine unbeabsichtigte Nische. Das Selkie kann fließend von einem Modus in den anderen wechseln und findet so verschiedentlich Anwendung für Schleichfahrten, etwa bei Infiltration, Schmuggel und Flucht. Die Trockenzelle des Hybriden kann leicht umkonfiguriert oder sogar ausgetauscht werden, um das Boot den Bedürfnissen der Mission anzupassen. Die Standardkabine bietet neben dem Piloten Raum für drei Passagiere oder bis zu 2,5 Tonnen Fracht - sofern man sie denn in die Kabine bekommt. \n Im U-Boot Modus: Beschleunigung 5, Geschwindigkeitsintervall 6, Höchstgeschwindigkeit 25. Alternative Konfiguration mit 1 Sitz verfügbar.

item.dreizack.desc=Der Dreizack kann entweder bemannt als Unterwasserschlitten oder autonom als Drohne betrieben werden. Der Rumpf hat zwei Modulschnittstellen für verschiedene Aufsätze wie erweiterte Sensorpakete, Werkzeugarme oder Standard-Waffenhalterungen. Für schwere Waffenhalterungen ist der Dreizack allerdings nicht geeignet. Die Module lassen sich mit wenigen Handgriffen binnen kürzester Zeit austauschen.

item.lz74.desc=Dieses Kleinstluftschiff dient in seiner ursprünglichen Funktion als mobile Messstation im Dauerbetrieb. Lassen wir Beschönigungen beiseite, reden wir hierbei natürlich von nichts anderem als einer Überwachungsdrohne. Die üppige Sensorik, Wetterbeständigkeit, vielseitige autonome Stromversorgung wie Solar, WiFi und nicht zuletzt seine Unauffälligkeit qualifizieren diesen Klassiker als ausgelagertes Krähennest. Je nach Konfiguration der Sensorik kann die LZ-74 poten zielle Beute oder Gefahren sowohl aus großer Höhe als auch auf große Entfernung ausmachen. Für den Fall, dass doch mal etwas schiefläuft, ist die LZ-74 mit einem kokonartigen Airbag ausgestattet, der sie nicht nur den unwahrscheinlichen Absturz überstehen lässt, sondern auch an der Wasseroberfläche hält.
item.lz74_cocoon.desc=Kokonartigen Airbag, der die Drohne nicht nur den unwahrscheinlichen Absturz überstehen lässt, sondern auch an der Wasseroberfläche hält.

item.scx_hunt.desc=Bei all den zivilen Modellen, die für Sicherheits- und Militärdienste angepasst werden, ist der Bedarf hoch, und der SCX Hunter ist Yamahas Antwort darauf. Dabei hat man letztlich nicht viel mehr getan, als die beliebtesten Modifizierungen aufzunehmen und in Kleinserie herzustellen. Das Ergebnis ist ein robuster, gefährlich schneller, bewaffneter und vor allem teurer Jetski. Allerdings sind spezielle Kontrakte für lizenzierte Militäreinheiten und Sicherheitsfirmen verfügbar, die das Ganze im Dutzend billiger machen. Standardausstattung:  Riggerinterface,  2  Standard-Waffenhalterungen.

item.umea.desc=Piraterie ist kein Kavaliersdelikt, und die Umeå ist die Art der Skandinavischen Union, einen wissen zu lassen, dass man sich gerade sehr unbeliebt gemacht hat. Diese etwa 70 Meter lange Korvette ist mit moderner Tarntechnik ausgestattet, die durch die speziell abgestimmte Bauform des Rumpfes unterstützt wird. Der Rumpf selbst besteht aus einem isolierenden Kompositmaterial, das leicht, enorm widerstandsfähig und nicht magnetisch ist. Die niedrigen Radar-, Magnet-, und Hitzesignaturen machen die Umeå nur schwer aufspürbar. Die spezielle Tarnbeschichtung und die einfahrbaren Geschütze dienen zur weiteren Reduktion der Signatur des Schiffes. Wenn man die Umeå bemerkt, ist es oft schon zu spät. Zur Grundausstattung der Umeå gehören eine aktive Störtechnik, modernste Zielerfassung, ein schweres Marinegeschütz, acht Lenkraketen, vier Torpedorohre, Minen, ein Wasserbomben-Werfer gegen U-Boote und ein Sortiment verschiedener Täuschkörper. Es bleibt als Trost, dass bisher nur wenige Schiffe dieser Klasse im Einsatz sind und rohe Gewalt nicht in jeder Situation als die beste Lösung betrachtet wird.
