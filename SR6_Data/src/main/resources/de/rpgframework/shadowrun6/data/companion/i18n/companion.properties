item.pack_crockett=Rifle-Cavalier Arms Crockett EBR
item.pack_crockett.page=58
item.pack_crockett.desc=The Ares Desert Strike and Crockett EBR are some of the most effective metahuman-portable firearms you can buy. The reason the Crockett has both a laser sight and a smartgun system is because you'll usually want the advantage of the smartlink, but when stealth is critical, it's useful to turn off your wireless devices to avoid detection. It never hurts to have a backup.

