item.pack_taser_defiance=Taser-Defiance Super Shock
item.pack_taser_defiance.page=56
item.pack_taser_defiance.desc=Most runners don't look twice at tasers, but having a concealed weapon that most guards won't look twice at comes in handy.

item.pack_taser_pulsar=Taser-Yamaha Pulsar II
item.pack_taser_pulsar.page=56
item.pack_taser_pulsar.desc=Most runners don't look twice at tasers, but having a concealed weapon that most guards won't look twice at comes in handy.

item.pack_holdout_needler=Holdout-Fichetti Tiffani Needler
item.pack_holdout_needler.page=56
item.pack_holdout_needler.desc=These are some of the most concealable weapons you can buy, but they don't have a lot of firepower. Think of them as a backup weapon or a tool for when concealability is paramount.

item.pack_holdout_streetline=Holdout-Streetline Special
item.pack_holdout_streetline.page=56
item.pack_holdout_streetline.desc=These are some of the most concealable weapons you can buy, but they don't have a lot of firepower. Think of them as a backup weapon or a tool for when concealability is paramount.

item.pack_holdout_palm=Holdout-Walther Palm Pistol
item.pack_holdout_palm.page=56
item.pack_holdout_palm.desc=These are some of the most concealable weapons you can buy, but they don't have a lot of firepower. Think of them as a backup weapon or a tool for when concealability is paramount.

item.pack_light_fire75=Light Pistol-Ares Light Fire 75
item.pack_light_fire75.page=57
item.pack_light_fire75.desc=Light pistols can be almost as dangerous as their heavier cousins, but you can't fit a heavy pistol in a hidden arm slide! They sacrifice a small amount of firepower in exchange for being concealable and are much more viable in a firefight than a hold-out pistol. And while having a weapon at the ready is an obvious advantage of the hidden arm slide, don't overlook that you gain an Edge just for using them to arm yourself. The Ares Light Fire is a silenced weapon, the Beretta gives you a full-auto firing mode, and the Ruger Redhawk is a powerful revolver for its size.

item.pack_light_beretta=Light Pistol-Beretta 201T
item.pack_light_beretta.page=57
item.pack_light_beretta.desc=Light pistols can be almost as dangerous as their heavier cousins, but you can't fit a heavy pistol in a hidden arm slide! They sacrifice a small amount of firepower in exchange for being concealable and are much more viable in a firefight than a hold-out pistol. And while having a weapon at the ready is an obvious advantage of the hidden arm slide, don't overlook that you gain an Edge just for using them to arm yourself. The Ares Light Fire is a silenced weapon, the Beretta gives you a full-auto firing mode, and the Ruger Redhawk is a powerful revolver for its size.

