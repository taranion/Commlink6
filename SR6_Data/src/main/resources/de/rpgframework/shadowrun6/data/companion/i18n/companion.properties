quality.pelage_camouflage=Camouflage
quality.pelage_camouflage.page=118
quality.pelage_camouflage.desc=Covered by dark or patterned fur, the character receives a +1 dice pool modifier for Sneaking tests in any condition with decreased light levels and in environments appropriate to the pattern (stripes in tall grass, spots in a forest or jungle, etc.). Camouflage is incompatible with other natural or artificial hair or skin modifications.
quality.insulating_coat=Insulating Coat
quality.insulating_coat.page=118
quality.insulating_coat.desc=This is a thick insulating pelt of fur covering the entire body. Pelts insulate the character from cold and immersion in water, providing a point of situational Edge for Survival Tests in frigid environments (such as Arctic and sub-Arctic regions) and +4 DR vs. Cold-based attacks. Characters must spend 1 extra point of Edge on Edge Boosts and Edge Actions on Survival tests when in extreme heat environments. Clothing and armor can be worn normally over this hair. <br/>Insulating Coat is incompatible with other natural or artificial hair or skin modifications.
quality.quills=Quills
quality.quills.page=118
quality.quills.desc=These thick, keratin-rich plates resemble porcupine quills, interspersed with bristles among other fur and hair, displacing about one follicle in 100. They are generally shorter than 30 centimeters. They increase the individual\u2019s Defense Rating by +2 in any form of Close Combat. Additionally, when grappling or subduing someone with quills, the attacker must resist damage of DV of 2P, modified by their hits on their attack test. They can also be used offensively with the following stats: Exotic Weapons (Quills) + Agility, DV 3P, AR 6/\u2013/\u2013/\u2013/\u2013, they can be quite effective. <br/>The user\u2019s arms, legs, or back must be exposed to gain these benefits. Quills are incompatible with other natural or artificial hair or skin modifications.
quality.corrosive_spit=Corrosive Spit
quality.corrosive_spit.page=118
quality.corrosive_spit.desc=Like the Corrosive Spit ability (p. 222, SR6) of critters, the individual can make a ranged combat attack, with Exotic Weapon (Spittle), DV 2P per level of attack (maximum 4), AR 4/6/4/\u2013/\u2013. The damage is Chemical, and any damage also inflicts the Corrosive status with a value equal to the quality\u2019s level (p. 52, SR6).
quality.defensive_secretion=Defensive Secretion
quality.defensive_secretion.page=118
quality.defensive_secretion.desc=The character\u2019s skin exudes a defensive liquid when they are agitated or endangered, like the defensive secretions of frogs. These secretions are acidic, causing a burning sensation or other adverse skin reactions upon touch (gamemaster decision). If someone with unprotected skin touches the bare skin of the agitated character under the right conditions, that person suffers a \u20131 dice pool modifier for all tests made within the next 24 hours or until treated with a medkit with a successful Biotech (Medicine) (2) test. This quality does not work against spirits. <br/>Multiple touches raise the dice pool modifier, but only to a maximum of \u20134.
quality.greasy_skin=Greasy Skin
quality.greasy_skin.page=119
quality.greasy_skin.desc=The character\u2019s skin contains sweat glands that produce a greasy lubricant in stressful or fatiguing situations, covering the body with an oily film that gives it a moist sheen. While not impairing the character\u2019s normal actions, the lubricant makes the character harder to grapple, increasing their Defense Rating by 4 against grapple attacks if more than half the character\u2019s body is exposed. Greasy Skin is incompatible with extensive body hair or skin modifications or qualities, except Defensive Secretion (see above).
quality.natural_venom=Natural Venom
quality.natural_venom.page=119
quality.natural_venom.desc=The character possesses a venom like that found in many species. The Effect always includes Dazed and Poisoned statuses, the latter at a level equal to the power. Whether it\u2019s Stun or Physical damage is determined by the selected effect. The Karma cost of this quality equals the sum of the Vector, Speed, Power and Effect costs.<br/>\u2022 Injected requires Fangs (see below).<br/>\u2022 Contact requires touch attack (Close Combat [Unarmed]) or may be combined with Quills, Frog Tongue, Razor Claws, or Thorns.<br/>\u2022 Spat requires Exotic Weapon (Spittle), AR 5/\u2013/\u2013/\u2013/\u2013.
