item.pack_heavy_predator1=Heavy Pistol-Ares Predator VI
item.pack_heavy_predator1.page=57
item.pack_heavy_predator1.desc=These PACKs include several variations of accessories and modifications for some of the most popular pistols on the market. Some take full advantage of modern technological upgrades, while others are modified as throwbacks so that it becomes impossible to hack them, with the drawback of no smartlink.

