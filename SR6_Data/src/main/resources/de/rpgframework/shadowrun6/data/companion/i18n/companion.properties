quality.augmentation_acclimation=Augmentation Acclimation
quality.augmentation_acclimation.page=132
quality.augmentation_acclimation.desc=Your body has adapted particularly well to your augmentations, allowing you to consider further upgrades with reduced Essence cost.<br/><br/>\
 \u2022 <b>Cost:</b> 2 Karma per level (max 10 levels). You may only take this quality if your Essence is 3 or less.<br/>\
 \u2022 <b>Game Effect:</b> For each level of this quality, you free up 0.1 Essence for the purpose of additional augmentations. This creates, in essence, an \u201CEssence hole.\u201D It does not increase your actual Essence, but the Essence cost of any new augmentations comes from the Essence hole instead of further reducing your actual Essence.
