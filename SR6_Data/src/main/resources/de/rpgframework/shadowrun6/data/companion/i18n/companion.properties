# Complete Character Packs
# packs-complete.xml
item.starterpack=Shadowrunner Starter Pack
item.starterpack.page=49
item.starterpack.desc=No matter what your skillset might be, these are the essential items that if you don't buy, you will wish you had. No weapons, armor, vehicles, or sensory gear are included. What this does set you up with is a fairly solid fake ID, a month of Low lifestyle, a decent commlink and a burner, and a variety of equipment that will certainly come in handy sooner rather than later. Ideally, every shadowrunner has the items in this PACK.

item.dirt_poor=Dirt Poor
item.dirt_poor.page=50
item.dirt_poor.desc=If you put resources at minimum and don't want to spend any of your starting Karma on extra nuyen, you only start with 8,000 nuyen using the priority system. Generally speaking, this is the least amount of money that a Shadowrun character can start with. You can't afford any expensive specialized gear, or even a worthwhile fake SIN (which should probably be one of the first things you purchase when you come into some money). So this PACK includes what you'll need and can actually afford. <br/>Note that this is the only complete character PACK that does not also include the shadowrunner starter PACK. Because you're too broke.

item.full_magician=Full Magician
item.full_magician.page=50
item.full_magician.desc=Most magicians have little need of expensive technology or augmentations in order to do their work. Some equipment is helpful, however, and a magical lodge with a healthy supply of reagents is essential. This PACK includes all the gear that you need to start with. If you find yourself with extra nuyen, consider purchasing a focus as your next expenditure.

item.close_combat=Close Combat Adept
item.close_combat.page=50
item.close_combat.desc=Adepts are most known for their prowess as martial artists, and you aren't an exception to this. Adept powers are incredibly effective for close combat specialists, and that's what you do best. You don't need to rely on expensive gear and augmentations but having a weapon focus certainly helps to make you an even more effective warrior.

item.face=Face
item.face.page=50
item.face.desc=You've always been good with words, and over the years you have learned to use your social talents much like a magician uses spells or a hacker bypasses firewalls. Most of what you do is based on your own attributes and skills, but the right clothes and a few odds and ends help you get the job done.

item.gunslinger=Gunslinger Adept
item.gunslinger.page=51
item.gunslinger.desc=Not all adepts focus on close combat. If you're building an adept that uses guns, this PACK includes all the gear you need with none of those Magic-reducing augmentations. That said, if you're building any gun-focused character and either don't want augmentations or would rather choose them yourself, this PACK is also a great starting point. Most of this PACK consists of a wide variety of guns, each with its special purpose. The Warhawk is the open-carry, don't-frag-with-me lethal sidearm, while the Predator packs gel rounds for a non-lethal option. The Redhawk and Ares Light Fire in hidden arm slides provide the same roles with a bit less firepower, but with the benefit of concealability and a quick way to get some Edge in a fight. The Mossberg is an all-purpose assault weapon, and the Crockett EBR is the perfect tool for suppressed sniping. <br/>This PACK assumes you won't be getting a smartlink installed in your eyes, but if you do, you should take the smartlink out of the contacts and spend that 2,000 nuyen elsewhere. More ammo is always nice.

item.cybered_covered=Cybered Covered Operative
item.cybered_covered.page=52
item.cybered_covered.desc=You've got the skills, augmentations, and special equipment to infiltrate any facility, and the combat abilities to fight your way out when things go wrong. Your cyberlimb appears to be completely natural but is equipped with two powerful weapons: one lethal, one non-lethal.

item.decker=Decker
item.decker.page=52
item.decker.desc=This character PACK is for deckers who don't max out their resources, or perhaps the ones who max out their resources but want more toys outside of the hacker skillset. This PACK hooks you up with the expensive augmentations you'll need, as well as a wizard cyberdeck, a sports car, and some other drek that'll help you along the way.

item.cyborg=Full Conversion Cyborg
item.cyborg.page=52
item.cyborg.desc=There are street samurai and skinjobs, and then there's you. With the exception of a few organic bits, like your internal organs and brain, almost your entire body has been replaced. Don't bother investing much into your natural Agility and Strength, because your cyberlimbs have that covered. Body and Reaction, however, are still very important for you. You'll always attract stares, and likely never live anything resembling a normal life. You look more like an armored anthrodrone than a metahuman. But that's okay with you, because the capabilities you have gained are impressive.

item.samurai=Street Samurai
item.samurai.page=53
item.samurai.desc=If you're looking to build a deadly, dependable, heavily augmented combatant of a shadowrunner, look no further. This PACK comes with a high price tag in both nuyen and Essence, but with this high price comes everything you need for a solid street samurai.

item.vat_job=Vat Job Bioware-Augmented Combat Specialist
item.vat_job.page=53
item.vat_job.desc=This PACK is for someone who wants to be a heavily augmented combat machine without being obvious about it. All of the augmentations are under-the-skin bioware that aren't visible on a close inspection and won't show up on a cyberware scan. The adrenaline pump provides +2 to your Agility, Strength, Reaction, and Willpower for 2d6 combat rounds when activated, but it costs you Stun damage when it runs out. Everything you need is included, from augmentations to weapons, and everything in between.

item.weapons_specialist=Weapons Specialist
item.weapons_specialist.page=54
item.weapons_specialist.desc=The weapons specialist is perhaps more accurately described as a weapons generalist. That's because you specialize in being able to wield every kind of weapon. You never know what tool you're going to need, so why not have access to all of them? This PACK includes the augmentations you'll need to make the most of your arsenal, but the real meat here is a huge collection and variety of weapons. Take some time to read them over, because they each serve a specific purpose. Every one of them is the perfect tool for a certain problem. The key is knowing which tool fits the situation best. Oh, by the way, you also have bombs.

item.max_decker=Max Hardware Decker
item.max_decker.page=54
item.max_decker.desc=If you're going all-in as a decker, with maximum possible resources, this PACK spends every last nuyen for you, getting you everything you need to get started with maxed-out hardware. Your cyberdeck is installed as headware, along with your cyberjack and a few other augmentations to give you the edge you need both in the Matrix and in meatspace.

item.transport_rigger=Transport Rigger
item.transport_rigger.page=55
item.transport_rigger.desc=Sometimes riggers are about the simple task of moving things from one place to another. This isn't as simple as it sounds, since some of those things are shadowrunners, and when shadowrunners move, others often try to stop them. So this contains the augmentations and gear a rigger needs to be good at their job, as well as some armor and a sidearm to keep trouble at bay. It has two fully outfitted vehicles and some drones to act primarily in an escort role.

item.drone_rigger=Drone Rigger
item.drone_rigger.page=55
item.drone_rigger.desc=This rigger PACK has one vehicle to get the character around and a squad of heavily armed drones to cause chaos wherever they go. Since drones with guns often tend to get banged up, the PACK also includes kits and shops to keep them in working order, along with all the basic rigger needs.

item.augmented_for_firearms=Augemented for Firearms Pack
item.augmented_for_firearms.page=56
item.augmented_for_firearms.desc=Unlike the complete character PACKs, this PACK is a useful starting point for mundane characters or even gunslinger adepts who are willing to sacrifice a little Essence. The cybereyes are smartlink-ready, with built-in magnification that is useful for spotting and hitting targets at longer ranges. The reflex recorder provides you with an extra die on all Firearms tests. Every gun-toting shadowrunner needs a sidearm and some concealable backup weapons. The Ares Predator is kitted out for stealth, but you can slot explosive rounds when things go loud. The other pistols are solid backup weapons that you might be able to sneak past security. But if you're going for a heavier combat character, it would be a good idea to pick up some individual gun PACKs to go with this. Your augmentations will work just as well for big guns as they do for your sidearms. Also, don't forget to buy some armor.

