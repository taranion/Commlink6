item.pack_smg_cobra=Submachine Gun-Colt Cobra TZ-120
item.pack_smg_cobra.page=57
item.pack_smg_cobra.desc=The Praetor and Ingram Smartgun are ideal if you need a smartlink-ready SMG, but the Colt Cobra and UZI IV here have been modified so that they cannot interface with the Matrix (and therefore cannot be hacked). If you need a suppressed option with a laser sight instead of a smartgun system, go with the HK-227. Note that both the HK-227 and Ingram Smartgun come standard with suppressors, and the Ingram also packs in a gas vent system for recoil compensation.

item.pack_smg_praetor=Submachine Gun-FN P93 Praetor
item.pack_smg_praetor.page=57
item.pack_smg_praetor.desc=The Praetor and Ingram Smartgun are ideal if you need a smartlink-ready SMG, but the Colt Cobra and UZI IV here have been modified so that they cannot interface with the Matrix (and therefore cannot be hacked). If you need a suppressed option with a laser sight instead of a smartgun system, go with the HK-227. Note that both the HK-227 and Ingram Smartgun come standard with suppressors, and the Ingram also packs in a gas vent system for recoil compensation.

