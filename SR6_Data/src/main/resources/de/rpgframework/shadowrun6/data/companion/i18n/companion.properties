quality.arcane_arrester=Arcane Arrester
quality.arcane_arrester.page=119
quality.arcane_arrester.desc=You gain a bonus Edge for use on any Magic Resistance test; if you do not use it on that test, that point goes away. When a Health spell is cast on you, treat your Essence as if it were 2 points lower than it actually is.
quality.climate_adaption=Climate Adaptation
quality.climate_adaption.page=120
quality.climate_adaption.desc=The individual is adapted to better survive in extreme climates (hot or cold; choose one). Each level of this quality grants +1 Edge to all Outdoor (Survival) tests and reduces the Fatigue due to exposure by one level. Advantage in one climate is a disadvantage in the other, raising Edge costs and increasing Fatigue status by the same level. These adaptations are not compatible with implanted dermal plating or skin modifications. If they obtain those augmentations after getting the quality, all effects of the quality are lost, and no Karma is returned to the player.
quality.gills=Gills
quality.gills.choice.type=Type
quality.gills.choice.type.air=Air
quality.gills.choice.type.air.desc=Individuals with air-breathing gills who otherwise would breathe water use these. They need dense air, so they always suffer a Fatigued I status when breathing air and Fatigued II status at higher elevations and thinner air (gamemaster decision as to where the divide is).
quality.gills.choice.type.freshwater=Freshwater
quality.gills.choice.type.freshwater.desc=Individuals with these gills can free-dive in fresh water to a depth equal to (Body x 20) meters.
quality.gills.choice.type.saltwater=Saltwater
quality.gills.choice.type.saltwater.desc=Individuals with these gills can free-dive in salt water to a depth of (Body x 20) meters.
quality.gills.desc=Different types of gills allow the individual to breathe in a different environment than the one they are native to. Typically this means air-breathers can inhale underwater, but sometimes it\u2019s the reverse. This quality can be taken for saltwater or freshwater use. Gills can be located on the neck, in the upper pectoral region, or beneath the arms (upper arms, in the case of a nartaki).
quality.gills.page=120
quality.glamour=Glamour
quality.glamour.page=120
quality.glamour.desc=A character possessing this quality is seen by all sapient beings as moving with an unearthly grace. Their countenance always seems radiant, and their voice has a soul-wrenching, deeply emotional property. Those they speak to feel moved and inspired. This is reflected with a bonus of +1 Edge for all social actions taken that are not aggressive. Those with this quality are particularly memorable, equating to an additional +1 Edge for anyone attempting to make a Memory test to recall the individual or the actions they\u2019ve taken.
quality.metagenetic_attribute_improvement=Metagenic <Attribute> Improvement
quality.metagenetic_attribute_improvement.page=120
quality.metagenetic_attribute_improvement.desc=An individual with the Metagenic Attribute Improvement possesses a genetic expression that enhances the genes associated with the development of a certain mental or physical attribute. In game terms, the maximum value for one of the character\u2019s attributes (as listed in the Metatype Attribute Table, p. 64, SR6) is raised by 1. This quality may only be taken once per attribute, and it is cumulative with the Exceptional Attribute quality (p. 71, SR6).
quality.metahuman_traits=Metahuman Traits
quality.metahuman_traits.page=120
quality.metahuman_traits.desc=Whether through genetics or modifications, you do not look like your birth metatype; you appear human. The points in your ears are easily overlooked, your tusks are filed down to mere teeth, your cheekbones are rounder, your legs longer\u2014 that sort of thing. You can pass for human, which might help with humans or cause obstacles with non-humans.<br/><br/><b>Game Effect:</b> You generally appear human at first glance and gain +2 dice on Disguise tests to hide your metatype and appear more human.
quality.nasty_vibe=Nasty Vibe
quality.nasty_vibe.page=120
quality.nasty_vibe.desc=Individuals with this quality radiate the ultimate bad or even predatory vibe. This sensation is often described as discomforting, menacing, or even oppressive. Grants a bonus point of Edge on all Intimidation tests.
quality.photometabolism=Photometabolism
quality.photometabolism.page=120
quality.photometabolism.desc=The individual\u2019s epidermis and follicular development have adapted to include chloroplast organelles that supplement the energy needs of the individual through photosynthesis. This gives the character a \u20131 LP modifier toward their Necessities costs (p. 179). The character also receives +1 Edge to all Con and Influence tests when in daylight, fully or partially. They suffer a \u20132 dice pool modifier to those same tests when in deep shadow or darkness. This is incompatible with Nocturnal quality.
quality.tough_gut=Tough Gut
quality.tough_gut.page=120
quality.tough_gut.desc=Originally listed as \u201COgre Stomach,\u201D this quality is an adaptation the entire digestive tract has undergone enabling the individual to process a variety of substances that are considered non-standard. Only organic matter can be processed in this manner, and those with it have a \u20131 LP modifier applied to their Necessities costs (p. 179). Furthermore, they are more resistant to ingested poisons and toxins, gaining +1 Edge on tests to resist.
quality.bark=Bark
quality.bark.page=121
quality.bark.desc=The character\u2019s skin takes on the appearance of rough tree bark. This quality provides a +2 Defense Rating bonus, cumulative with armor, but increases the cost of all armor and clothing by ten percent.
quality.blubber=Blubber
quality.blubber.page=121
quality.blubber.desc=Thick layers of insulating fat and vascularized tissues act as thermal insulation. Grants a +1 Edge bonus when resisting any cold-based attacks or damage. Negates the Chilled status (p. 51, SR6) from all non-magical causes.
quality.camouflage=Camouflage
quality.camouflage.page=121
quality.camouflage.choice.variant.basic=Basic
quality.camouflage.choice.variant.basic.desc=These qualities provide skin pigmentation that adapts to background colors like a chameleon. Incompatible with any other dermal modifications.<br/><br/>After five minutes of exposure to a background with sharp contrasts and diverse color patterns, the character\u2019s skin can take one minute to adjust to match this pattern. It can retain this coloration for up to four hours. When they move (more than one meter per turn), they revert to their normal skin pigmentation for as long as they are in motion. While in effect, the camouflage provides a +1 dice pool bonus for all Stealth tests if more than forty percent of their body is exposed. At eighty percent exposure or greater, the bonus is +2.
quality.camouflage.choice.variant.dynamic=Dynamic
quality.camouflage.choice.variant.dynamic.desc=Like Basic Camouflage, Dynamic Camouflage alters the skin tone and color according to the background environment and continues to do so. The character receives the same Stealth bonuses as Basic Camouflage, but they keep it if the individual is not moving faster than one-half their walking rate, rounded down.
quality.dragon=Dragon
quality.dragon.page=121
quality.dragon.desc=Extensive scaling develops on the individual, which acts to quickly dissipate heat and flame. Grants a +1 Edge bonus when resisting any firebased attacks. Negates the Burning status (p. 51, SR6) from all non-magical sources.
quality.granite=Granite
quality.granite.page=121
quality.granite.desc=Extensive calcite and keratin formations make the individual\u2019s skin appear greyish and hard as stone. It grants +4 Defense Rating and the Hardened Armor ability (p. 224, SR6) at rating 2. Not cumulative with other worn armors. Incurs a \u20131 dice pool modifier to fine manipulation of small items.
quality.rhino=Rhino
quality.rhino.page=121
quality.rhino.desc=Thicker and more durable than Bark dermal alteration, the character\u2019s leather-like skin grants a +3 Defense Rating bonus cumulative with any worn armor.
quality.thorns=Thorns
quality.thorns.page=121
quality.thorns.desc=The individual\u2019s skin is covered in sharp protrusions about a centimeter long, resembling extremely hardened plant thorns like those of roses, citrus trees, and bougainvillea. The thorns emerge from a sub-dermal layer and regrow in a few days when cracked or broken. In Close Combat, they increase AR by +1 and allow attacks to do Physical damange instead of Stun. <br/>The downside of these keratinous growths is they place the individual in a state of constant discomfort, which inflicts a \u20131 dice pool modifier to all other physical activities. All clothing worn by the individual must be custom-made, with a cost increase of twenty percent.
quality.broadened_auditory_spectrum=Broadened Auditory Spectrum
quality.broadened_auditory_spectrum.page=121
quality.broadened_auditory_spectrum.desc=This quality enables the character to hear into the ultrasonic or infrasonic ranges (choose at time of selection; quality may be taken twice). This does not give the ability to choose or control any part of the frequency spectrum in question. As this kind of hearing is always active, noises inaudible to others may sometimes distract or deafen the character. This quality also results in minor visible changes to the size and structure of the outer ear. <br/>This quality is incompatible with any implanted cyberears or hearing augmentations except the Hearing Dampener as a standalone implant.
quality.broadened_auditory_spectrum.choice.range=Range
quality.broadened_auditory_spectrum.choice.range.ultrasonic=Ultrasonic
quality.broadened_auditory_spectrum.choice.range.ultrasonic.desc=
quality.broadened_auditory_spectrum.choice.range.infrasonic=Infrasonic
quality.broadened_auditory_spectrum.choice.range.infrasonic.desc=
quality.biosonar=Biosonar
quality.biosonar.page=122
quality.biosonar.desc=Like a bat or dolphin, the individual possesses all the natural organs for a biological echolocation system. Using ultrasound produced within the larynx, thorax, or even the nasal passages, they can form a mental image of the surrounding space produced by the echoes. With a Minor Action, the character can perceive up to 50 meters in the air, 200 meters in freshwater, and 300 meters in saltwater. If the quality is sustained, they can track a variety of activities in their presence with the use of a Minor Action each combat round. When in use, the power negates the Blindness (p. 51, SR6) status at all levels with regards to navigation and combat.<br/>At all times the individual may be Deafened (p. 52, SR6) when exposed to high-frequency sounds, and they cannot use Edge to resist any effects of those sounds. It is possible to track the user of this quality with appropriate equipment, assuming they are actively emitting ultrasound.
quality.electrosense=Electrosense
quality.electrosense.page=122
quality.electrosense.desc=All critters can to a limited extent sense electrical fields, such as when they are near certain electronic devices, engines, or security systems. This metagenic sense functions at a distance equal to (Body + Intuition) in meters. To use the sense, roll Perception + Intuition and check the hits against the Electrosense Table (6WC p.122). This is a passive quality, with no broadcasting noise originating from the individual.<br/><br/>Individuals with an understanding of electrical technologies, Matrix operations, or similar backgrounds can develop a Knowledge skill called \u201CTechnosense,\u201D which allows them to perceive the additional information as detailed on the Electrosense table. Technosense information is displayed after the \u201C/\u201D on the table.
quality.low-light_vision_metagenetic=Low-Light Vision
quality.low-light_vision_metagenetic.page=122
quality.low-light_vision_metagenetic.desc=Thanks to an increase in the number of rod cells in your natural eyes, an implanted increase of said rod cells, or an augmentation that enhances the light level of incoming data, you are capable of operating in light levels that would leave others essentially blind.<br/><br/><b>Game Effect</b>: You can see clearly in any light level that is not total darkness (see Environment and Visibility, SR6 p. 118).
quality.magnetosense=Magnetosense
quality.magnetosense.page=122
quality.magnetosense.desc=Like Electrosense, Magnetosense allows an individual to sense changes in nearby magnetic fields. These individuals can feel these magnetic fields, allowing them to detect their presence, direction, and intensity. Finding these requires a Perception + Intuition (3), with a range equal to Body + Intuition in meters. Individuals with this quality also have a strong ability to navigate, giving them a +1 Edge bonus on all Outdoor (Navigation) tests.
quality.manasense=Manasense
quality.manasense.page=122
quality.manasense.desc=The individual possesses the ability to sense any type of active or passive aetheric (magic) energy, including spell usage, in their vicinity. The individual uses an Astral + Intuition test, using the Detection Spells Results table on p. 134, SR6. The range of this sense is (Magic + Intuition) meters, and it can be increased with a simple Willpower test, adding one meter for every hit.
quality.balance_receptor=Balance Receptor
quality.balance_receptor.page=122
quality.balance_receptor.desc=The quality is an enhancement to various internal organs that regulate an individual\u2019s balance, augmenting this to a more refined and reactive state. This gives the individual a +1 Edge bonus on all Athletics tests except Archery.
quality.thermographic_vision_metagenetic=Thermographic Vision
quality.thermographic_vision_metagenetic.page=8
quality.thermographic_vision_metagenetic.desc=Thanks to enhancements or just genetics, your vision allows you to see differences in temperature on and around objects and people, though most of the time ambient regular light overrides the heat signature. Large local sources of heat can create a glare of sorts, but usually something giving off that much heat is also giving off light, so your regular vision takes over.<br/><br/><b>Game Effect</b>: You can see the heat of objects in total darkness (assuming they are warmer or colder than the ambient temperature), allowing you to operate in such conditions.
quality.thermal_sense=Thermal Sense
quality.thermal_sense.page=122
quality.thermal_sense.desc=Individuals with this sensory adaptation can perceive infrared radiation (heat). The range of this sense is (Intuition) meters and is non-visual in nature. Environmental factors can influence this sense, as can barriers or other obstacles. Hits on a Perception + Intuition (2) test reveal information on distance, movement, heat output, and location of infrared rays. It is not fooled by mana-based illusion spells. This quality also reduces the Blinded status by \u20131
quality.underwater_vision=Underwater Vision
quality.underwater_vision.page=122
quality.underwater_vision.desc=A specially adapted membraneb protects the eyes and allows them to function with normal vision while underwater.
quality.vomeronasal_gland=Vomeronasal Gland
quality.vomeronasal_gland.page=123
quality.vomeronasal_gland.desc=Individuals develop additional olfactory organelles that augment their sense of smell to levels to rival that of a bloodhound. They also receive expansions to the amygdala and hypothalamus, empowering them to understand the smells they can now detect. These in turn improve not only their sense of smell, but also their ability to discern and react to individuals by scent, including many of the baser emotional responses (attraction, fear, etc.). In game turns, this gives the individual a +1 Edge bonus when making smell-based Perception tests and Social tests when they can smell their target. Strong odors and intense background odors incur the Nauseated status (p. 52, SR6) if the individual fails a Body + Willpower (2) test.
quality.degree_sight_360=360 Degree Sight
quality.degree_sight_360.page=123
quality.degree_sight_360.desc=This quality provides the individual with a 360-degree field of vision due to repositioning or compositing of eyes (player\u2019s decision). It could be anything from compound eyes like those found in insects or ocular independence such as that possessed by some lizards. Characters with this quality gain a +1 Edge bonus on all visual Perception and Surprise tests.
quality.degree_sight_360.choice.neurological=Neurological Adaption
quality.degree_sight_360.choice.neurological.unadapted=Unadapted
quality.degree_sight_360.choice.neurological.unadapted.desc=The base 5 Karma quality does not include an adapted neurological structure to go with the eyes, which is necessary for the otherwise binocular mind to comprehend effectively. Characters face a \u20131 dice pool modifier to tests while moving faster than their walking speed and suffer a \u20131 dice pool penalty to all ranged Attack Ratings beyond Close range. They are incapable of receiving augmentations.
quality.degree_sight_360.choice.neurological.adapted=Adapted
quality.degree_sight_360.choice.neurological.adapted.desc=Individuals with the 10-karma version do not suffer the detractions of the quality and may have augmentations with a cost modifier increase of four hundred percent and an Essence cost increase of one hundred percent.
quality.beak=Beak
quality.beak.page=123
quality.beak.desc=Instead of a mouth and nose, the middle and lower parts of the character\u2019s face are replaced by a beak and nostrils. The beak can vary in size, shape, and function, much like their natural counterparts. The beak is not the only avian quality the character gains. As beaks cannot be used for chewing, characters with beaks swallow each bite whole, and the food is then processed by a gizzard constructed of thick, muscular walls that grind up food. Characters with the Beak quality (including Raptor Beak) also have the Tough Gut benefits (see above).
quality.beak.choice.variant=Variant
quality.beak.choice.variant.standard=Beak, Standard
quality.beak.choice.variant.standard.desc=
quality.beak.choice.variant.raptor=Beak, Raptor
quality.beak.choice.variant.raptor.desc=Where a standard beak is not designed for combat, this beak is. It can be used with the Close Combat [Unarmed] skill, DV 2P, AR 6/\u2013/\u2013/\u2013/\u2013.
