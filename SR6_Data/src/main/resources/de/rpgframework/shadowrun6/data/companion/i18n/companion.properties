item.pack_jacket.page=59
item.pack_jacket.desc=No shadowrunner leaves home without their armor, and only gutter punks and wagesl 	aves wear armor that hasn't been upgraded with additional protection against being frozen, zapped, or burned. These PACKs include the protective upgrades you're going to want.

