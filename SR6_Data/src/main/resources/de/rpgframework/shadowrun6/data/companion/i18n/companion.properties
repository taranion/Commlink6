item.pack_mp_crusader=Machine Pistol-Ares Crusader II
item.pack_mp_crusader.page=57
item.pack_mp_crusader.desc=The Ares Crusader is an incredible deal, with integrated smartgun and gas-vent systems for a very low price. All come with concealable holsters.

item.pack_mp_scorpion1=Machine Pistol-Ceska Black Scorpion Smart
item.pack_mp_scorpion1.page=57
item.pack_mp_scorpion1.desc=Two variants of the Ceska Black Scorpion are presented here; the difference between these two PACKs based on the same machine pistol is the smartgun system versus a laser sight. Most runners tend to prefer smartlinks, but a laser sight is a lot harder for enemy hackers to mess with and requires no extra gear to utilize. All come with concealable holsters.

item.pack_mp_scorpion2=Machine Pistol-Ceska Black Scorpion
