#Actions
action.calibration=Kalibrierung
action.calibration.page=30
action.calibration.desc=Du stellst deinen Teammitgliedern deine Rechenleistung zur Verfügung und erhöhst ihre Geschwindigkeit. Du kannst das aktuelle Matrix-Initiativeergebnis von dir und deinen Teammitgliedern für je 2 Erfolge um 1 erhöhen. Der Gesamtbetrag der Erhöhung des Matrix-Initiativeergebnisses, der einer Persona gewährt wird, kann nicht höher sein als dein Attribut Datenverarbeitung, und es kann jeweils nur eine Kalibrierungswirkung aktiv sein. Das Matrix-Initiativeergebnis sinkt danach in jeder Kampfrunde um 1, bis es wieder seinen ursprünglichen Wert erreicht hat. Dieser Bonus gilt für jeden mit einem AR-Feed, der dein PAN teilt. Du kannst deinen Feed für eine maximale Anzahl von Nutzern gleich deiner Gerätestufe freigeben.
action.delayed_command=Verzögerter Befehl
action.delayed_command.page=32
action.delayed_command.desc=Du sendest Nutzdaten an ein Gerät, die einen Befehl und eine Zeitverzögerung enthalten, die das Ziel als von seinem Besitzer stammend wahrnimmt. Das Gerät versucht dann automatisch, die Handlung auszuführen, sobald die Zeitverzögerung abgelaufen ist. Gelingt die Probe, wird der Befehl selbst dann ausgeführt, wenn das Gerät seine WiFi-Funktionalität ausschaltet. Wenn das Gerät neu gestartet wird, bevor der Befehl ausgeführt wird, geht der verzögerte Befehl verloren.
action.denial_of_service=Dienstverweigerung
action.denial_of_service.page=29
action.denial_of_service.desc=Drahtlose Geräte werden fast unbrauchbar, wenn man ihre Datenströme mit Rauschen verschmutzt. Ein Decker oder Technomancer kann ein drahtlos aktives Gerät oder eine Persona anvisieren. Leg eine Vergleichende Probe auf Cracken + Logik gegen Willenskraft + Firewall ab und wende die Anzahl der Nettoerfolge x 2 als Würfelpoolmalus auf alle Proben an, die mit diesem Gerät bis zum Ende der nächsten Runde abgelegt werden.
action.device_lock=Gerätesperre
action.device_lock.page=30
action.device_lock.desc=Manchmal ist der einfachste Weg, einem Hack zu entgehen, das Ausschalten des WiFis. Der Angriff zielt auf ein Gerät und verhindert bei Erfolg, dass das Gerät für [Nettoerfolge] Runden offline geht. Sobald diese Zeit abgelaufen ist, kannst du eine Nebenhandlung ausgeben, um die Gerätesperre um 1 Runde zu verlängern. Diese Verlängerung kann nur einmal vorgenommen werden.
action.garbage_in=Garbage In/Garbage Out
action.garbage_in.page=30
action.garbage_in.desc=Mit diesem Befehl kannst du einige der In- und Outputs eines einzelnen Geräts durcheinanderbringen. Ein einzelner Input kann umgeleitet werden, um einen anderen Befehl auszuführen. So könnte beispielsweise die Anruffunktion eines Kommlinks so verändert werden, dass die Kontaktdaten der Person, die der Benutzer anrufen wollte, automatisch gelöscht werden, oder eine Kamera könnte die Rückspul- mit der Vorspulfunkti-on vertauschen. Der Befehl kann die grundlegenden Sicherheitsfunktionen des Geräts oder Systems nicht außer Kraft setzen, und die Spielleitung hat das letzte Wort darüber, was mit dem Befehl erreicht werden kann.
action.known_exploit=Hintertür mit bekanntem Exploit benutzen
action.known_exploit.page=30
action.known_exploit.desc=<i>Diese Handlung ist mit dem Attribut Schleicher verbunden.</i><br/>Du versuchst, eine Reihe bereits bekannter Exploits zu verwenden, um dir unerlaubt Zugang zu einem Host, Gerät oder anderen Bereich der Matrix zu verschaffen. Diese Handlung erfordert keine vorhergehende erfolgreiche Handlung <i>Sondieren</i>, aber bei einem vollständig gepatchten Host ist die Wahrscheinlichkeit eines Erfolgs geringer. Runner, die diese Handlung ausführen, können dafür kein Edge erhalten oder ausgeben. Außerdem erhalten der Host oder das Gerät 1 Edge, das sofort gegen diese Handlung ausgegeben werden muss und ansonsten verfällt. Gelingt die Probe, erhältst du Admin-Zugriff auf das Ziel, der nicht als illegaler Admin-Zugriff zählt (obwohl illegale Matrixhandlungen immer noch deinen Overwatch-Wert erhöhen). Misslingt die Probe, löst das nicht sofort einen Alarm aus, aber dein OW erhöht sich wie üblich.
action.masquerade=Maskerade
action.masquerade.page=31
action.masquerade.desc=Mit dieser Handlung kannst du dich als eine andere Persona in der Matrix ausgeben. Da Persona-Daten in Echtzeit aktualisiert werden, ist es schwierig, diese Handlung erfolgreich auszuführen. Für jeden Nettoerfolg, den du bei einer Vergleichenden Probe auf Cracken + Logik gegen Datenverarbeitung + Intuition erzielst, überzeugst du Matrixsysteme und zufällige Beobachter 1 Minute lang davon, dass du die Persona bist, die du zu sein vorgibst. Damit kann man sich online als jemand anderes ausgeben, seine Anrufe abfangen, seine sozialen Medien nutzen, seinen E-Mail-Verlauf durchstöbern oder anderweitig Unfug treiben, aber bei Vorgängen wie dem Wechsel des Gerätebesitzers oder der Durchführung größerer finanzieller Transaktionen (z. B. Bank-überweisungen) gibt es so viele Doppelkontrollen, dass Maskerade nicht funktioniert. Wenn sich die Persona, für die du dich ausgibst, abmeldet, fällt die Maskerade in sich zusammen. Du kannst dich also nur für eine Persona ausgeben, die zur gleichen Zeit wie du online ist. Während der Maskerade giltst du nie als Besitzer eines der Geräte der verkörperten Persona.
action.metahuman_in_the_middle=Mittelsmetamensch
action.metahuman_in_the_middle.page=32
action.metahuman_in_the_middle.desc=Mit diesem Befehl trittst du zwischen alle Anrufe oder Matrixhandlungen, die in ein Gerät hinein- oder aus ihm hinausgehen. Gelingt die Probe, wird die gesamte Kommunikation des Geräts für [Nettoerfolge] Minuten durch dein Gerät geleitet.
action.modify_icon=Icon modifizieren
action.modify_icon.page=30
action.modify_icon.desc=Manchmal möchtest du, dass das Matrix-Icon deiner Ares Predator VI etwas weniger bedrohlich aussieht. Mit dieser Handlung kannst du ein Matrix-Icon so verändern, dass es wie ein anderes Symbol aussieht. Jedes Mal, wenn dein Icon gescannt wird, muss dir eine Vergleichende Probe auf Cracken + Logik gegen Datenverarbeitung + Schleicher des scannenden Geräts oder Intuition + Datenverarbeitung des Gerätebetreibers gelingen, um nicht entdeckt zu werden.
action.popup=Pop-up
action.popup.page=32
action.popup.desc=Es ist ärgerlich, wenn der gesamte Bildschirm oder die gesamte Ansicht durch Pop-up-AROs oder Fenster blockiert wird, die einen daran hindern, das zu tun, was man tun will. Leg eine Vergleichende Probe auf Cracken + Logik gegen Intuition + Datenverarbeitung eines Zielgeräts oder einer Persona ab. Gelingt die Probe, kann das Ziel für [Nettoerfolge] Runden kein Edge ausgeben.
action.squelch=Ersticken
action.squelch.page=30
action.squelch.desc=Eine gelungene Ersticken-Probe verhindert für [Nettoerfolge] Minuten, dass das Zielgerät Anrufe tätigen oder Nachrichten senden kann.
action.subvert_infra=Infrastruktur unterwandern
action.subvert_infra.page=30
action.subvert_infra.desc=Mit dieser Handlung kannst du die Funktionsweise mehrerer physischer Geräte ein wenig verändern, sodass sie auf deine Befehle reagieren. Wenn du mindestens Admin-Zugang zum Host hast, kannst du pro Nettoerfolg bei einer Vergleichenden Probe auf Cracken + Intuition gegen Intuition + Firewall oder Schleicher + Firewall eine Gruppe ähnlicher einfacher Geräte (Ampeln, Verkaufsautomaten, Haushaltsgeräte, Schreibtischlampen usw., nach Maßgabe der Spielleitung) kontrollieren, die Slaves dieses Hosts sind. Diese Handlung kann nicht für einen Angriff genutzt werden. Du kannst die Kontrolle über diese Geräte mit einer Haupthandlung pro Kampfrunde aufrechterhalten.
action.threat_analysis=Bedrohungsanalyse
action.threat_analysis.page=29
action.threat_analysis.desc=Anstatt anzugreifen, setzt du eine Software zur Markierung von Bedrohungen ein und verschaffst deinen Verbündeten so einen Vorteil für ihre Verteidigung. Mit der Bedrohungsanalyse kannst du allen Verbündeten, die Zugang zu deinem AR-Feed haben, einen Würfelpoolbonus auf all ihre Verteidigungsproben in der physischen Welt und der Matrix geben. Die Anzahl der Bonuswürfel ist gleich der Anzahl der Erfolge bei einer Probe auf Elektronik + Logik. Dieser Bonus hält bis zum Beginn deines nächsten Zuges an. Er gilt für jeden mit einem AR-Feed, der dein PAN teilt. Du kannst deinen Feed mit einer maximalen Anzahl von Nutzern gleich deinem Attribut Datenverarbeitung teilen.
action.virtual_aim=Virtuelles Zielen
action.virtual_aim.page=32
action.virtual_aim.desc=Mit dieser Handlung erhältst du einen Würfelpoolbonus von +1, wenn du die Verteidigung deines Ziels studierst. Du kannst diese Handlung nur einmal pro Kampfrunde ausführen, und der Bonus wird in die nächste Runde übertragen, wenn er nicht genutzt wird, bis du in dieser Runde keine Handlung <i>Virtuelles Zielen</i> einsetzt oder angreifst. Der maximale Würfelpoolbonus aus der Anwendung dieser Handlung ist gleich deiner Willenskraft. Du kannst den Bonus für eine beliebige Matrix-Angriffshandlung – wie zum Beispiel <i>Datenspike</i>, <i>Teergrube</i> oder <i>Resonanzspike</i> – verwenden.
action.watchdog=Stalking
action.watchdog.page=32
action.watchdog.desc=Das Ziel muss eine Persona oder ein Gerät sein. Die Anzahl der Nettoerfolge gibt an, wie viele Kampfrunden das Programm aktiv bleibt. Gelingt die Probe, kannst du sehen, was die Zielperson auf ihren Geräten tut. Du weißt damit, welche Matrixhandlungen die Zielperson ausführen wird, bevor sie sie ausführt, und kannst versuchen, sie zu verhindern. Stalking erlaubt es dir, die Handlung Bedrohungsanalyse als Nebenhandlung einzusetzen, wenn der Angriff vom Ziel ausgeht.
action.batch_execution=Batch Ausführung
action.batch_execution.page=32
action.batch_execution.desc=Mit dieser Handlung kannst du alle Programme ausschalten, die auf deinem Deck laufen. Verwende einfach diese Edge-Handlung, um deinen OW-Zuwachs schnell zu senken oder um dich darauf vorzubereiten, etwas Drek zu zerstören.
action.intervene=Intervention
action.intervene.page=32
action.intervene.desc=Mit dieser Handlung kannst du dem Besitzer eines Geräts, das ein Slave deines PANs ist, einen sofortigen Verteidigungsbonus geben. Diese Handlung kann nur ausgeführt werden, wenn das Gerät, das den Angriff durchführt, aktives WiFi hat und du dir des Geräts bewusst bist. Leg eine Probe auf Elektronik + Logik ab und addiere die Anzahl der Erfolge zum Würfelpool deines Verbündeten. Dieser Bonus gilt nur für die aktuelle Verteidigungsprobe. Er kann nicht auf eine andere Runde oder Handlung übertragen werden.
action.paint_target=Ziel markieren
action.paint_target.page=32
action.paint_target.desc=Mit dieser Handlung markierst du ein Ziel, das du physisch sehen kannst oder dessen Persona dir den Standort des Ziels verrät, in der AR des Teams, damit das Team weiß, wo sich das Ziel befindet. Die Handlung entfernt den Status Geblendet, sofern er durch Deckung oder Rauchgranaten verursacht wurde.
action.computer_virus=Computervirus
action.computer_virus.page=32
action.computer_virus.desc=Die Außerirdischen wollen die Erde zerstören, und die einzige Möglichkeit, sie zu stoppen, besteht darin, diesen Computervirus in ihr System zu laden. Der Runner, der diesen Angriff gegen ein Gerät oder einen Host durchführt, verhindert, dass das Ziel für [Nettoerfolge] Minuten irgendwelche Matrixhandlungen ausführt. Damit kann verhindert werden, dass der Host Aufnahmen von Kameras aufzeichnet oder ein Gebäude verschließt, da sich keines der Sicherheitsschlösser öffnen lässt. Eine Sicherheitsspinne im Host kann versuchen, den Computervirus mit einer Handlung <i>Programm abstürzen lassen</i> zu eliminieren.
action.enhance=Verbessern
action.enhance.page=33
action.enhance.desc=Manchmal ist das Trideomaterial undeutlich, oder vielleicht ist der Ton verstümmelt, aber ein schneller Schuss Verbessern, und plötzlich wird alles klar. Diese Matrixhandlung kann in derselben Runde oder der Runde unmittelbar nach einer Matrixwahrnehmungs-Probe ausgeführt werden. Erfolge bei der Handlung Verbessern werden der vorherigen Handlung <i>Matrixwahrnehmung</i> hinzugefügt.
action.ic_slicer=IC-Schnetzler
action.ic_slicer.page=31
action.ic_slicer.desc=<i>Diese Handlung ist mit dem Attribut Angriff verbunden.</i><br/>Du bist ein Meister darin, IC auszuschalten, das die von dir gesuchten Daten bewacht, und jedem IC, das du ins Visier nimmst, Schaden zuzufügen. Dein Angriff hat einen Schadenswert gleich deinem Attribut Angriff plus 1 Schadenskästchen pro Nettoerfolg.
action.keyboard_commando=Tastaturkommando
action.keyboard_commando.page=33
action.keyboard_commando.desc=Du bist der schnellste Hacker auf dem Planeten, und es gibt kein IC-Programm, das dich auf frischer Tat ertappen kann. Du kannst dich so schnell durch die Verteidigung eines Netzwerks schneiden, dass du dich in einer einzigen Runde rein- und raushacken kannst. Mit einem einzigen Nettoerfolg erhältst du einen User-Zugang; mit 4 weiteren Nettoerfolgen erhältst du Admin-Zugang. Mit jedem weiteren Nettoerfolg darüber hinaus kannst du ein Gerät oder eine Datei manipulieren. Du verlässt das Netzwerk sofort nach dem Ausführen dieser Handlung.
action.password_sequencer=Password-Sequenzierer
action.password_sequencer.page=33
action.password_sequencer.desc=Der Host oder das Gerät hat ein komplexes Passwort, das nur die härtesten Zahlenjongleure bewältigen können. Für jede gelungene Probe – unabhängig von der Zahl der Nettoerfolge – kann dein Decking-Verfahren das nächste Element des Passworts aneinanderreihen. Die Anzahl der Elemente des Passworts ist gleich der Hoststufe.
action.skull_and_crossbones=Totenkopf-Angriff
action.skull_and_crossbones.page=33
action.skull_and_crossbones.desc=Du bist ein Meister darin, deine Gegner am Handeln zu hindern. Gelingt die Probe, wird der Bildschirm oder die Sicht des Gegners vollständig von einem riesigen animierten ASCII-Totenkopf verdeckt. Das Ziel kann erst dann wieder eine Handlung ausführen, wenn ihm eine Probe auf Elektronik + Logik mit einem Schwellenwert gleich der Anzahl der Nettoerfolge aus der Handlung <i>Totenkopf-Angriff</i> gelungen ist.
action.we_are_in=Wir sind drin!
action.we_are_in.page=33
action.we_are_in.desc=Wenn du dich erfolgreich in einen Host oder ein Gerät gehackt hast, verrät ein triumphaler Schrei deinem Team, dass du der verfraggt noch mal beste Decker auf dem Planeten bist. Gelingt die Probe, setzt du deinen Edge-Pool wieder auf deinen Edge-Wert zurück. Wenn dein Edge-Pool über deinem Edge-Wert liegt, wird er nicht zurückgesetzt.

action.emulate_cyberprogram=Matrixprogramm emulieren
action.emulate_cyberprogram.page=125
action.emulate_cyberprogram.desc=Mit einer Nebenhandlung kann eine KI ein einzelnes Matrixprogramm laden oder entladen, das von der umgebenden Rechenleistung in der Matrix und Geräten ausgeführt wird. Wenn du illegale Matrixprogramme ausführst, wird sich OW ansammeln. Weitere Informationen findest du unter Emulation.
action.realignment=Neucodierung
action.realignment.page=126
action.realignment.desc=Mit einer Haupthandlung kann eine KI ihre Kernprogrammierung zurücksetzen oder ein Gerät optimieren. Weitere Informationen findest du unter Wiederherstellung und Neucodierung auf Seite 125.

#Gear
item.cyberhack=Cyberhack
item.cyberhack.page=34
item.cyberhack.desc=Cyberhacks sind so konzipiert, dass sie an die Stelle einer implantierten Cyberbuchse treten. Sie werden mit einer implantierten Datenbuchse und einem Cyberdeck verbunden, um die für das Datenverarbeitungs- und das Firewall-Attribut eines Deckers erforderliche zusätzliche Rechenleistung zur Verfügung zu stellen. Ein Cyberhack erfordert eine kabelgebundene Verbindung zu einer implantierten Datenbuchse und funktioniert dann größtenteils wie die implantierte Version. Ein Cyberhack bietet dem Benutzer jedoch keinen Matrix-Initiativebonus, und die Matrix-Edge-Handlungen, die eine implantierte Cyberbuchse oder das Attribut Resonanz erfordern, sind mit einem Cyberhack nicht verfügbar. Alle Vorteile, die die Effektivität einer Cyberbuchse verbessern, funktionieren bei Cyberhacks nicht, sofern nicht ausdrücklich anders angegeben. Wenn du ein Cyberhack verwendest, kannst du deine Attribute Datenverarbeitung und Firewall zwar verbessern, aber nicht gegen andere Attribute oder gegeneinander austauschen.\nAußerdem handelt es sich bei Cyberhacks um sperrige Hardware. Bislang ist es noch niemandem gelungen, ein Gerät zu bauen, das kleiner ist als eine Riggerkonsole, was es schwierig macht, sie zu verbergen. Dies hat zu einer gewissen Kreativität bei der Tarnung als legales elektronisches Gerät geführt, zum Beispiel als Keytar.\n Aufgrund der weniger invasiven Hardware erleidet ein Hacker, der ein Cyberhack einsetzt, Biofeedback-Schaden immer als Betäubungsschaden – selbst wenn er in der VR mit heißem Sim unterwegs ist.

item.cyberdeck_core=Prozessor
item.cyberdeck_core.page=36
item.cyberdeck_core.desc=Der Prozessor besteht aus einem Gewirr von miteinander verbundenen Rechen- und Speicherchips, die die ganze harte Arbeit erledigen und alle Komponenten eines Cyberdecks miteinander verbinden. Diese Komponente liefert die Gerätestufe des Cyberdecks. Die Stufe eines einzelnen Angriffs- oder Schleicher-Moduls kann nicht höher sein als die Gerätestufe des Decks x 2.\nEin Cyberdeck hat eine Anzahl von verfügbaren Prozessorslots gleich seiner Gerätestufe x 3. Jede maßgefertigte Komponente beansprucht einen oder mehrere Prozessorslots, genauso wie alle angeschlossenen Geräte. Achte darauf, wie viele Prozessorslots von allen Komponenten deines Cyberdecks belegt werden, denn dadurch verringert sich die Anzahl der kabelgebundenen Geräte, die du mit dem PAN deines Decks verbinden kannst. Wie viele drahtlose Geräte du anschließen kannst, ergibt sich wie gewohnt aus dem Attribut Datenverarbeitung deiner Persona.
item.attack_module=Angriffsmodul
item.attack_module.page=36
item.attack_module.desc=Beim Angriffsmodul handelt es sich um eine Reihe von Prozessoren und Chips, die sowohl mit den neuesten als auch mit bewährten Hardware-Tools zum Cracken von Codes, Überwältigen von Firewalls und Generieren obszöner Mengen falscher Daten ausgestattet sind. Diese Komponente stellt ein Angriffsattribut gleich ihrer Stufe zur Verfügung.
item.sleaze_module=Schleichermodul
item.sleaze_module.page=36
item.sleaze_module.desc=Das Schleichermodul ist ein Chipsatz, der mit Passwortbibliotheken, Firewall-Exploits und Stealth-Tools ausgestattet ist. Diese Komponente stellt ein Schleicherattribut gleich ihrer Stufe zur Verfügung.
item.breadbox_case=Brotkastengehäuse
item.breadbox_case.page=37
item.breadbox_case.desc=Brotkastengehäuse ist ein Slang-Begriff für ein Cyberdeck oder Cyberhack, das aus billigeren oder veralteten Komponenten besteht, die verdrahtet und zusammengehackt wurden, um sie nach dem Prinzip Masse statt Klasse funktionsfähig zu machen. Ein Cyberdeck oder Cyberhack in einem Brotkastengehäuse lässt sich nicht tragen. Es nimmt mindestens so viel Platz ein wie ein alter Desktop-Computer, aber meistens handelt es sich um noch weiter ausufernde Geräte, die einen ganzen Raum einnehmen. Der Auf- und Abbau eines Brotkastens dauert 1 Stunde, und das Gerät ist völlig nutzlos, solange es nicht vollständig aufgebaut ist. Der Vorteil eines Brotkastengehäuses ist, dass die Kosten für Cyberhack- und Cyberdeck-Hardware um die Hälfte reduziert werden.
item.briefcase=Aktentaschengehäuse
item.briefcase.page=37
item.briefcase.desc=Ein aktentaschengroßes Gehäuse kann sich manchmal gut einfügen, aber es nimmt auch Platz weg und lässt sich nicht so leicht verbergen. Der häufigste Grund, sich für diese Art von Gehäuse zu entscheiden, ist, dass es sowohl ein Cyberhack als auch ein Cyberdeck bequem aufnehmen kann.
item.briefcase.variant.deck_only=Cyberdeck
item.briefcase.variant.deck_only.desc=Wenn das Aktentaschengehäuse nur ein Cyberdeck enthält, beträgt seine verfügbare Kapazität 12.
item.briefcase.variant.deck_plus_hack=Cyberdeck und Cyberhack
item.briefcase.variant.deck_plus_hack.desc=Dieser Gehäusetyp kann ein Cyberhack aufnehmen, mit Platz für ein Cyberdeck und mit einer verfügbaren Kapazität von 6.
item.commlink_case=Kommlinkgehäuse
item.commlink_case.page=37
item.commlink_case.desc=Für das Standardgehäuse wird häufig ein ausrangiertes Kommlink umfunktioniert, obwohl sich solche Gehäuse auch sehr einfach drucken und zusammensetzen lassen, wenn man kein altes Kommlink zur Hand hat. Diese Gehäuseoption ist zum Standard für die meisten maßgefertigten Cyberdecks geworden. Sie ist billig, leicht zu beschaffen, hat eine hinreichende Kapazität und ist die einfachste Art, ein Cyberdeck zu tarnen. 
item.gonzo_case=Gonzo-Gehäuse
item.gonzo_case.page=37
item.gonzo_case.desc=Gonzo-Gehäuse sind bizarre Sonderanfertigungen, in der Regel eine aus nicht immer nachvollziehbaren Gründen zusammengebastelte Kombination aus Geräten wie etwa einem Flammenwerfer oder einer Kampfaxt. Du kannst ein Cyberhack- oder Cyberdeck-Gehäuse in oder besser gesagt auf so ziemlich alles bauen, was du willst, allerdings auf Kosten von Kapazität und Tarnbarkeit. Ein Cyberdeck-Gehäuse kann in fast jedes Gerät von mindestens der Größe einer schweren Pistole eingebaut werden. Ein Cyberhack ist groß und funktioniert nur mit sperrigen Gegenständen wie zum Beispiel Zweihandwaffen.
item.gonzo_case.variant.deck=Cyberdeck
item.gonzo_case.variant.deck.desc=Die verfügbare Kapazität wird fast immer für die Modifikation Gonzo-Härtung verwendet.
item.gonzo_case.variant.hack=Cyberdeck und Cyberhack
item.gonzo_case.variant.hack.desc=Die verfügbare Kapazität wird fast immer für die Modifikation Gonzo-Härtung verwendet.
item.keytar_case=Keytar-Gehäuse
item.keytar_case.page=37
item.keytar_case.desc=Keytars sind zu gleichen Teilen skurril und krass, was sie zur perfekten Wahl für Decker macht, die Eindruck schinden wollen. Diese Gehäuse sind so konzipiert, dass sie sowohl ein Cyberhack als auch ein Cyberdeck aufnehmen können, aber vor allem enthalten sie auch ein Keyboard, einen Synthesizer und ein hochklassiges Lautsprechersystem. Diese Dinger gab es schon vor dem Erwachen, und sie waren eine beliebte Inspiration für einige der ersten tragbaren Cyberdecks. Plus ça change, was, Chummer?
item.keytar_case.variant.deck=Cyberdeck
item.keytar_case.variant.deck.desc=Ein Keytar-Gehäuse nur für ein Cyberdeck hat eine verfügbare Kapazität von 10.
item.keytar_case.variant.deck_plus_hack=Cyberdeck und Cyberhack
item.keytar_case.variant.deck_plus_hack.desc=Diese Art von Gehäuse ist für eine Cyberhack-/Cyberdeck-Kombination gedacht. Die verfügbare Kapazität beträgt 4.
item.keytar_case.variant.deck_plus_hack_no_synth=Cyberdeck und Cyberhack ohne Synthesizer
item.keytar_case.variant.deck_plus_hack_no_synth.desc=Die verfügbare Kapazität erhöht sich auf 8, wenn man die Synthesizer-Komponenten entfernt. Aber im Ernst, warum sollte man das tun?
item.rcc_case=Riggerkonsolen-Gehäuse
item.rcc_case.page=38
item.rcc_case.desc=Ein Riggerkonsolen-Gehäuse hat einige der Vorteile eines Kommlink-Gehäuses, ist aber in der Regel sperriger. Man kann es unter die Jacke stecken oder in einer Umhängetasche tragen, aber anders als ein Kommlink passt es nicht in deine Jacken- oder Hosentasche. Allerdings bietet das zusätzliche Volumen eine Menge Kapazität für Zubehör und Gehäusemodifikationen. Die Leute werden jedoch denken, dass du Drohnen dabeihast.
item.rcc_case.variant.deck=Cyberdeck
item.rcc_case.variant.deck.desc=Wenn das Sicherheitspersonal Verdacht schöpft, muss dir möglicherweise eine Vergleichende Probe auf Überreden + Charisma gegen Menschenkenntnis (Willenskraft + Intuition) gelingen, damit die Wachen das Gehäuse als harmlos abtun. 
item.rcc_case.variant.deck_plus_rcc=Cyberdeck und Riggerkonsole
item.rcc_case.variant.deck_plus_rcc.desc=Wenn du es jedoch mit einer funktionsfähigen Riggerkonsole ausstatten möchtest (denn auch Drohnen machen Spaß!), senkt das die Kapazität auf 2.
item.rcc_case.variant.deck_plus_hack=Cyberhack
item.rcc_case.variant.deck_plus_hack.desc=Diese Art von Gehäuse ist gerade eben groß genug für ein Cyberhack. Wenn du ein Riggerkonsolen-Gehäuse verwendest, um ein Cyberhack unterzubringen, bietet es weder Platz für eine funktionierende Riggerkonsole noch Kapazität für Gehäusemodifikationen.
item.wearable_case=Wearable-Gehäuse
item.wearable_case.page=38
item.wearable_case.desc=Anstatt deine Cyberdeck-Komponenten alle zusammen in einem kompakten Gehäuse unterzubringen, kannst du sie auch in eine Reihe kleinerer Module aufteilen, die über Datenkabel miteinander verbunden werden können. Das hat zu der Innovation geführt, Kleidung und Panzerung mit Kabeln, Verbindungsanschlüssen und abgeschirmten Taschen für Komponenten zu entwerfen. Ein Cyberdeck kann so konstruiert werden, dass es in eine spezielle Panzerungsmodifikation passt, allerdings mit dem Nachteil, dass es keine zusätzliche Kapazität hat. Der Vorteil ist, dass dein illegales Cyberdeck vollständige Tarnbarkeit erhält, solange du nicht gründlich durchsucht wirst. 
item.wearable_case.variant.armor=Panzerungsmodifikation
item.wearable_case.variant.armor.desc=Wenn du diese Art von Gehäuse in deine Panzerung einbauen lassen willst, verbraucht das 1 Punkt Panzerungskapazität.

item.additional_jacks=Zusätzliche Buchse
item.additional_jacks.page=38
item.additional_jacks.desc=Jeder zusätzliche Universal-Datenport verbraucht 1 Punkt Kapazität.
item.built_in_accessory=Eingebautes Zubehör
item.built_in_accessory.page=38
item.built_in_accessory.desc=Wenn du eingebautes Zubehör wie einen Trideoprojektor, einen Drucker, einen Sensor oder ein anderes Gerät haben willst, entspricht die erforderliche Kapazität der Stufe des Zubehörs oder 2, je nachdem, welcher Wert höher ist. Wenn der Gegenstand Kapazität verbraucht, wie zum Beispiel bei Cybergliedmaßen- oder Panzerungsmodifikationen, dann gilt stattdessen der entsprechende Kapazitätswert. Beachte, dass viele dieser Geräte immer noch drahtlos oder über eine Direktverbindung mit deinem Gerät verbunden und von diesem verwendet werden können, aber eingebaute Geräte haben den Vorteil, dass sie nicht gegen die Gerätebegrenzung oder die Prozessorslots eines Cyberdecks zählen.
item.dart_launcher=Pfeilwerfer
item.dart_launcher.page=38
item.dart_launcher.desc=Ein getarnter Pfeilwerfer kann in einem Gehäuse für 1 Punkt Kapazität pro Schuss installiert werden. Dieser Werfer kann mit einem normalen Injektionspfeil geladen werden, um eine Droge oder ein Toxin zu verabreichen, mit einem Taserpfeil, der 4B(e) Schaden verursacht (SR6, S. 262), oder sogar mit einer Datenwanze (s. Pfeilwanze, S. 41). Die Benutzung des Pfeilwerfers erfordert die Fertigkeit Exotische Waffen und fällt unter die gleiche Spezialisierung wie andere Pfeilwaffen. Die Angriffswerte betragen 8/8/–/–/–.
item.gonzo_hardening=Gonzo-Härtung
item.gonzo_hardening.page=38
item.gonzo_hardening.desc=Diese Modifikation wird in der Regel nur bei Gonzo-Gehäusen verwendet, in denen Waffen und Cyberhacks zusammen eingesetzt werden. Sie hat die gleiche Wirkung wie die Härtungsmodifikation, mit dem zusätzlichen Effekt, dass du mit deinem Gehäuse problemlos Nahkampfangriffe und Blocks durchführen kannst, ohne dass die Gefahr besteht, dass die interne Elektronik beschädigt wird. Diese Modifikation verbraucht 2 Punkte Kapazität.
item.hardening_case=Härtung
item.hardening_case.page=38
item.hardening_case.desc=Deine Hardware ist gut vor physischen Schäden geschützt. Solange sie nicht gezielt angegriffen oder als Nahkampfwaffe eingesetzt wird, musst du dir keine Sorgen machen, dass sie Körperlichen Schaden erleidet, auch nicht durch Explosionen oder extreme Stürze. Diese Modifikation verbraucht 1 Punkt Kapazität.
item.shock_shield=Schockschild
item.shock_shield.page=38
item.shock_shield.desc=Mit einer Nebenhandlung oder unter programmierten Bedingungen gibt dein Gehäuse einen starken Stromschlag ab, der alles trifft, was das Gehäuse berührt. Wenn das passiert, schaltet sich dein System abrupt ab und verursacht Auswurfschock, wenn du eingestöpselt bist (und Schlimmeres, wenn du das Gerät gerade berührst). Die interne Abschirmung in Verbindung mit der automatischen Abschaltung verhindert Schäden an der internen Elektronik, und die äußere Abschirmung deines Datenkabels verhindert die Übertragung des Schocks auf deine Headware oder andere angeschlossene Geräte. Alles, was das äußere Gehäuse berührt, erleidet 6B(e) Schaden. Leistungsfähigere Systeme mit größeren Kondensatoren sind in der Lage, einen stärkeren Schock zu verursachen. Das Basissystem verbraucht 4 Punkte Kapazität. Für jeden weiteren Punkt Kapazität, der diesem System zugewiesen wird, erhöht sich der Schaden um 2B(e), bis zu einem Maximum von insgesamt 14B(e). Nach jedem Gebrauch muss das System aufgeladen werden, was 1 Stunde über die kabellose Matrixaufladung oder 1 Minute über ein Stromkabel dauert.
item.internal_program_slot=Interner Programmslot
item.internal_program_slot.page=39
item.internal_program_slot.desc=Ein Programmslot besteht aus einem Datenspeicher und einem Prozessorchip und erweitert ein Cyberdeck um die Fähigkeit, ein Matrixprogramm auszuführen. Ein maßgefertigtes Cyberdeck beginnt mit einer Anzahl von Programmslots gleich seiner Gerätestufe, aber du kannst auf Kosten von Prozessorslots weitere Programmslots hinzufügen. Jeder zusätzliche interne Programmslot belegt einen Prozessorslot.
item.dedicated_program_slot=Dedizierter Programmslot
item.dedicated_program_slot.page=39
item.dedicated_program_slot.desc=Ein dedizierter Programmslot ist dafür vorgesehen, ein bestimmtes Matrixprogramm zu speichern und auszuführen, das nicht geändert werden kann, ohne die Komponenten auszutauschen. Ein dedizierter Programmslot läuft effizienter und nimmt weniger Platz ein, aber du kannst ihn nicht für andere Matrixprogramme als das, für das er gedacht ist, verwenden. Diese Programmslots werden am häufigsten für das Programm Babymonitor oder für Agentensoftware verwendet.
item.response_increase=Reaktionsverstärkung
item.response_increase.page=39
item.response_increase.desc=Ein Reaktionsverstärkungs-Modul umfasst zusätzliche Prozessorchips sowie die Kühlsysteme, die verhindern, dass sich dein Deck spontan entzündet. Diese Chips werden heiß, aber sie erhöhen deine Geschwindigkeit in der Matrix, und darauf kommt es manchmal an.\nReaktionsverstärkung gewährt dir im VR-Modus zusätzliche Initiativewürfel in Höhe ihrer Stufe. Es gibt dabei allerdings einige Einschränkungen und Nachteile. Reaktionsverstärkung funktioniert nur in Verbindung mit einem Cyberhack und ist nicht mit einer Cyberbuchse kompatibel. Außerdem laufen diese Dinger heiß. Dein Deck erleidet für jede gewürfelte 1 auf einem deiner Initiativewürfel 1 Kästchen Matrixschaden, solange die Reaktionsverstärkung aktiv ist. Du kannst sie mit einer Nebenhandlung ein- bzw. ausschalten, wodurch sie zu Beginn der nächsten Kampfrunde aktiviert bzw. deaktiviert wird.
item.reality_filter=Realitätsfilter
item.reality_filter.page=39
item.reality_filter.desc=Ein Realitätsfilter ist dazu gedacht, die gesamte Matrix-Ikonografie in eine programmierte Ästhetik zu übersetzen. Du kannst die Matrix nicht nur wie eine Fantasiewelt deiner Wahl aussehen lassen, sondern auch eine Schlüssel-Ikonografie einrichten, die es dir ermöglicht, das Gesehene schneller zu verarbeiten und darauf zu reagieren. Wenn du einen aktiven Realitätsfilter hast und ein Cyberhack benutzt, kannst du die Matrix-Edge-Handlungen verwenden, die normalerweise eine implantierte Cyberbuchse erfordern. Weitere mögliche Auswirkungen dieser Technologie werden durch Vor- und Nachteile freigeschaltet.
item.turbo_charger=Turbolader
item.turbo_charger.page=39
item.turbo_charger.desc=Freischaffende Deckmeister können munter experimentieren, ohne sich um Beschränkungen wie Herstellerspezifikationen oder Sicherheitsvorschriften kümmern zu müssen, und mittlerweile gibt es einige Designs, die eine erhebliche kurzfristige Steigerung der Fähigkeiten eines Cyberdecks ermöglichen – auf die Gefahr hin, dass das gesamte Gerät schmilzt. Decker, die verrückt genug sind, diese Modifikationen in ihr Deck einzubauen, achten entweder sehr genau darauf, sie sparsam zu verwenden, oder sind bereit, sich selbst in Brand zu setzen. Du kannst den Turbolader mit einer Nebenhandlung aktivieren bzw. deaktivieren. Die Aktivierung bzw. Deaktivierung wird sofort wirksam. Solange der Turbolader aktiv ist, fügst du deinem Würfelpool bei allen Matrixhandlungen eine Anzahl von Schicksalswürfeln gleich der Stufe des Turboladers hinzu. Dein Cyberdeck erleidet jedes Mal, wenn einer der Schicksalswürfel eine 1, 5 oder 6 würfelt, 1 Kästchen Matrixschaden.
item.external_program_carrier=Externer Programmträger
item.external_program_carrier.page=41
item.external_program_carrier.desc=
item.cyberjack_booster=Cyberbuchsenbooster
item.cyberjack_booster.page=39
item.cyberjack_booster.desc=Wenn du kein Problem damit hast, dir eine Cyberbuchse in den Kopf einbauen zu lassen, warum nicht noch einen Schritt weitergehen? Hacker haben Geräte entwickelt, die die Fähigkeiten einer Cyberbuchse verbessern können, aber zu groß sind, um implantiert zu werden. Cyberbuchsenbooster müssen per Kabel an eine Cyberbuchse angeschlossen werden. Sie sind ungefähr so groß wie ein durchschnittliches Kommlink, weshalb die meisten von ihnen in Kommlinkgehäuse eingebaut werden, um ihren wahren Zweck zu verschleiern. Allerdings laufen die meisten Leute nicht durch die Gegend, während sie in das einzige Kommlink eingestöpselt sind, das sie besitzen, und erst recht nicht, wenn sie über mehrere verfügen. Wenn ein Cyberbuchsenbooster eingestöpselt und eingeschaltet ist, gewährt er einen Bonus, der von seinem Typ abhängt. Cyberbuchsenbooster funktionieren nur zusammen mit einer Cyberbuchse. Sie sind nicht mit Cyberhacks kompatibel.
item.cyberjack_booster.variant.data_processing=Cyberbuchsenbooster Datenverarbeitung
item.cyberjack_booster.variant.data_processing.desc=Ein Datenverarbeitungs-Cyberbuchsenbooster erhöht das entsprechende Matrixattribut um seine Stufe. Wenn du deine Matrixattribute austauschst, modifiziert der Bonus des Cyberbuchsenboosters immer noch das Attribut Datenverarbeitung.
item.cyberjack_booster.variant.firewall=Cyberbuchsenbooster Firewall
item.cyberjack_booster.variant.firewall.desc=Ein Firewall-Cyberbuchsenbooster erhöht das entsprechende Matrixattribut um seine Stufe. Wenn du deine Matrixattribute austauschst, modifiziert der Bonus des Cyberbuchsenboosters immer noch das Attribut Firewall.
item.cyberjack_booster.variant.matrix_initiative=Cyberbuchsenbooster
item.cyberjack_booster.variant.matrix_initiative.desc=Ein Matrix-Initiativebooster fügt seine Stufe in zusätzlichen Initiativewürfeln hinzu, wenn du dich in der VR befindest, bis zu einem Maximum von insgesamt 5 Initiativewürfeln. Der Matrix-Initiativebooster hat allerdings ein Problem mit der Wärmeentwicklung und schaltet sich nach 5 Minuten Betrieb ab. Es dauert 1 Stunde, bis das Gerät nach Gebrauch abgekühlt ist, und in dieser Zeit fühlt es sich unangenehm warm an.

item.data_tap_projectile=Pfeilwanze
item.data_tap_projectile.page=41
item.data_tap_projectile.desc=Wenn du nicht in die Nähe eines Geräts gelangen kannst, um eine Datenwanze zu installieren, warum befestigst du die Wanze dann nicht einfach an einem Pfeil oder Armbrustbolzen? Nun, so einfach ist das nicht. Damit das funktionieren kann, waren viele Innovationen nötig. Pfeilwanzen sind erstaunliche Projektile, die eine Mikrodrohne in ein Datenwanzenliefersystem verwandeln, das in eine übergroße Pfeilspitze passt. Ihre Verwendung erfordert ein hohes Maß an Präzision. Es ist eine Haupthandlung erforderlich, um die Pfeilwanze online zu bringen und das Gerät zu markieren, mit dem sie verbunden werden soll. Dann musst du mindestens 3 Nettoerfolge bei einer Angriffsprobe erzielen, um dein Ziel mit dem Pfeil zu treffen. Bei Erfolg durchdringt die Pfeilspitze das Gehäuse oder bleibt in der Wand daneben stecken (und richtet praktisch keinen Schaden an); anschließend löst sie sich durch eine chemische Reaktion auf, die derjenigen beim Camouflageseil für Enterhakenkanonen ähnelt. Die Mikrodrohne aktiviert sich, verbindet die Datenwanze (wofür keine weiteren Proben erforderlich sind) und legt sich lahm. Solange niemand gesehen oder gehört hat, wie du auf das Ziel geschossen hast, ist die Wanze nicht auffälliger als eine normale Datenwanze. Es ist jedoch keine Heimlichkeitsprobe erlaubt, um die Entdeckung zu erschweren.\nPfeilwanzen sind Einwegartikel. Wenn du eine abfeuerst und nicht triffst, löst sich das Projektil auf, und die Mikrodrohne zerstört sich selbst. Eine Pfeilwanze hat eine sehr begrenzte interne Batterie und ist aufgrund der Anforderungen an ihre Unauffälligkeit nicht darauf ausgelegt, drahtlos aufgeladen zu werden. 
item.data_tap_projectile.variant.arrow=Pfeilwanze Bogen
item.data_tap_projectile.variant.arrow.desc=Bei Verwendung als Waffe wird der Grundschaden auf 1K gesenkt.
item.data_tap_projectile.variant.bolt=Pfeilwanze Armbrust
item.data_tap_projectile.variant.bolt.desc=Bei Verwendung als Waffe wird der Grundschaden auf 1K gesenkt.
item.data_tap_projectile.variant.dart=Pfeilwanze Pfeilpistole
item.data_tap_projectile.variant.dart.desc=Bei Verwendung als Waffe wird der Grundschaden auf 1K gesenkt.
item.data_tap_projectile.variant.shuriken=Pfeilwanze Shuriken
item.data_tap_projectile.variant.shuriken.desc=Bei Verwendung als Waffe wird der Grundschaden auf 1K gesenkt.
item.data_tap_projectile.variant.knife=Pfeilwanze Wurfmesser
item.data_tap_projectile.variant.knife.desc=Bei Verwendung als Waffe wird der Grundschaden auf 1K gesenkt.
item.data_tap_projectile.choice.duration=Akkulaufzeit
item.data_tap_projectile.choice.duration.standard=Standard
item.data_tap_projectile.choice.duration.standard.desc=Einmal aktiviert, funktioniert eine Pfeilwanze nur noch 5 Minuten lang.
item.data_tap_projectile.choice.duration.long_life=Verlängerte Akkulaufzeit
item.data_tap_projectile.choice.duration.long_life.desc=Es gibt auch eine teurere Version mit längerer Akkulaufzeit, die 30 Minuten lang funktioniert.
item.grapple_tapper=Greifwanze
item.grapple_tapper.page=41
item.grapple_tapper.desc=Irgendjemand kam auf die Idee, das Konzept einer Enterhakenkanone zum Herstellen einer direkten Kabelverbindung zu verwenden. Diese Enterhakenkanone ist komplett anders gefertigt als das Original und viel kleiner. Sie hat ungefähr die Größe eines großen Revolvers mit einer Datenkabelspule anstelle einer Trommel mit Kugeln; das Ende ist mit einer kleinen Metallkapsel versehen.\nUm sie zu benutzen, musst du zuerst eine Nebenhandlung ausführen, um die Kapsel zu aktivieren. Um eine Verbindung zum Ziel herzustellen, musst du eine Probe auf Athletik (Projektilwaffen) + Geschicklichkeit (3) ablegen. Wenn du auf ein Fahrzeug oder eine Drohne zielst, kann der Pilot eine Verteidigungsprobe gegen deinen Angriff ablegen; in diesem Fall brauchst du 3 Nettoerfolge, um eine Verbindung herzustellen. Beim Abfeuern fährt die Kapsel ihre Greifklauen aus und befestigt sich am Ziel. Dann sondert sie ein leitfähiges Gel ab, das eine primitive Verbindung für die Datenwanze herstellt. Gelingt der Angriff, wird über das Kabel der Enterhakenkanone automatisch eine drahtgebundene Direktverbindung hergestellt. Das Lösen der Kapsel erfordert eine Haupthandlung, aber keine Probe. Wird das Kabel durchtrennt, wird die Verbindung unterbrochen. Das Kabel kann nach Gebrauch wieder eingezogen werden, aber die Datenwanze ist ein Einwegartikel, der nicht zurückgewonnen werden kann.\nEs ist erwähnenswert, dass die Datenwanze selbst zwar keine drahtlose Verbindung hat, aber die WiFi-Funktion der Enterhakenkanone für den drahtlosen Zugang zu jedem Gerät aktiviert werden kann, mit dem sie verbunden wird.
item.grapple_tapper_cable=Greifwanze Kabel
item.grapple_tapper_cable.page=45
item.grapple_tapper_cable.desc=50-m-Kabelspule
item.grapple_tapper_pod=Greifwanzenkapsel
item.grapple_tapper_pod.page=45
item.grapple_tapper_pod.desc=Die Datenwanzenkapsel ist ein Einwegartikel, der nicht zurückgewonnen werden kann.
item.laser_jack=Laserverbindung
item.laser_jack.page=42
item.laser_jack.desc=Für diejenigen, die eine sichere, nicht hackbare drahtlose Verbindung benötigen, gibt es die Laserverbindung. Dieses winzige Laser-Sende-/Empfangsmodul wird verwendet, um eine Direktverbindung zwischen Geräten herzustellen, und erfordert Sichtverbindung. Beide Geräte müssen über eine Laserverbindung verfügen, um sich miteinander zu verbinden. Normales Rauschen wird auf diese Verbindung nicht angewendet. Bei einer Unterbrechung der Sichtverbindung wird die Verbindung vollständig unterbrochen, und Nebel, Regen und andere atmosphärische Partikel können sie beeinträchtigen. Leichter Regen oder Smog erzeugt 1 Punkt Rauschen pro 50 Meter Entfernung; bei starkem Regen oder leichtem Nebel erhöht sich dieser Wert auf 1 Punkt Rauschen pro 20 Meter Entfernung, bei dichtem Nebel auf 1 Punkt Rauschen pro 10 Meter Entfernung. Keine Art von Rauschunterdrückung kann Rauschen aus dieser Quelle senken. An einem klaren Tag wird die effektive Reichweite der Laserverbindung durch atmosphärische Störungen auf etwa 2 Kilometer begrenzt. Wie der Name schon sagt, stellen Laserverbindungen die Kommunikation über einen Laserstrahl her, sodass es unmöglich ist, die Geräte drahtlos zu erkennen oder auf sie zuzugreifen, es sei denn, jemand fängt den Laser direkt mit einem eigenen Sender ab. Der Laser ist für IR-Sensoren (einschließlich Personen mit Infrarotsicht) nur schwer wahrnehmbar. Die Entdeckung erfordert eine Handlung Genau beobachten mit einer Probe auf Wahrnehmung + Intuition (3).\nDer größte Nachteil dieser unhackbaren Technologie ist, dass sie nicht in der Lage ist, die für VR erforderliche Bandbreite bereitzustellen. Wenn du dich ausschließlich auf Laserverbindungen verlässt, kannst du nur die WiFi-Gerätefunktionen und den AR-Modus verwenden. Aus diesem Grund kommen Laserverbindungen nur selten zum Einsatz, und zwar, wenn es um Heimlichkeit oder Diskretion geht.
item.link_gloves=Link-Handschuhe
item.link_gloves.page=42
item.link_gloves.desc=Diese Handschuhe wurden in klar erkennbarer Weise mit den erforderlichen Chips und Kabeln ausgestattet, um ein spezielles elektromagnetisches Feld zu erzeugen, das eine Direktverbindung zu jedem Gerät herstellen kann, das die Handschuhe berühren. Es ist unmöglich, die Handschuhe als normale Kleidung zu tarnen, obwohl einige clevere Designer dafür bekannt sind, sie eher modisch als funktional erscheinen zu lassen. Die über Link-Handschuhe hergestellte Verbindung hat eine begrenzte Bandbreite und ist nicht für den VR-Modus geeignet. Link-Handschuhe sind nicht mit einer lebenden Persona kompatibel.
item.stealth_tap=Tarnwanze
item.stealth_tap.page=42
item.stealth_tap.desc=Standard-Datenwanzen sind nicht dazu gedacht, dass man sie versteckt. Sie sind unförmig und umfassen eine Vielzahl von Anschlusskabeln und Adaptern. Bei einer Tarnwanze wird alles Unwichtige weggelassen, sodass ein Gerät von etwa der Größe einer kleinkalibrigen Kugel mit mehreren Kontaktpunkten entsteht. Da dieser Wanze die üblichen Kabel und Datenports fehlen, benötigst du für die Installation eine Elektronik-Werkzeugkiste. Das Verfahren zum Anbringen einer Tarnwanze ist das gleiche wie bei einer normalen Datenwanze. Der Schwellenwert für die Entdeckung einer Tarnwanze durch eine Wahrnehmungsprobe beträgt 2, wenn keine besonderen Versuche unternommen werden, sie zu verbergen. Alle Edge-Boosts und -Handlungen, die als Teil einer Probe auf Heimlichkeit (Fingerfertigkeit) + Geschicklichkeit durchgeführt werden, um eine Tarnwanze zu verbergen, kosten nur halb so viel Edge (abgerundet) wie normal.
item.taser_tap=Taserwanze
item.taser_tap.page=42
item.taser_tap.desc=Der Defiance Super Shock feuert verdrahtete Taserpfeile ab, und ein Treffer ermöglicht es, den medizinischen Status des Ziels zu ermitteln. Und einigen ruchlosen (manche würden sagen: genialen) Hackern ist es gelungen, diese Technik so anzupassen, dass sie gegen diese lästigen Straßensamurai hilft, die all ihre WiFi-Funktionen ausschalten, um zu verhindern, dass ihre Bodytech gehackt wird. Taserwanzen sind Taserpfeile, die speziell für den Defiance Super Shock entwickelt wurden und eine Ladung kurzlebiger leitfähiger Naniten abgeben, die eine Direktverbindung zu jeglicher Bodytech und allen verbundenen Geräten der Zielperson herstellen, selbst wenn sie offline sind oder einen internen Router verwenden. Selbst wenn sie ihre Bodytech abgeschaltet haben. Natürlich muss man dazu jemanden tasern, es ist also offensichtlich ein Überfall. Die meisten Hacker sind nicht verrückt genug, um Tarnwanzen zu verwenden. Sobald die Verbindung hergestellt ist, kann das Ziel eine Haupthandlung durchführen, um die Tarnwanze zu entfernen (wofür keine Probe erforderlich ist). Wenn die Tarnwanze in Ruhe gelassen wird, wird die Verbindung trotzdem nach 1 Minute unterbrochen. Du kannst wählen, ob der Taser einen Stromstoß abgeben oder nur eine Verbindung herstellen soll. Das ist nützlich, wenn du die Wanze mit einer Kamera oder einem Magschloss verbinden willst, ohne das entsprechende Gerät zu brutzeln. Unabhängig davon, ob du den Stromstoß abgibst oder nicht, ist eine Taserwanze nicht wiederverwendbar.
item.matrix_relay=Matrix-Relais
item.matrix_relay.page=42
item.matrix_relay.desc=Ein Matrix-Relais ist ein Gerät, das dir hilft, die Reichweite deines WiFi-Netzwerks zu vergrößern, sodass du auf größere Entfernungen oder innerhalb einer Blackout-Zone arbeiten kannst. Matrix-Relais gibt es in verschiedenen Formen und Größen, von kleinen Handgeräten, die nicht größer als ein Credstick sind, bis hin zu massiven Systemen, für deren Transport ein Sattelschlepper benötigt wird. Hacker haben herausgefunden, dass Matrix-Relais auch sehr gute Signalverstärker sind, die durch Störungen und Entfernung verursachtes Rauschen durchbrechen können.\nUnd so funktioniert es: Ein Matrix-Relais, das mit deinem PAN verbunden ist, ermöglicht es dir im Grunde, an zwei (oder mehr) Orten gleichzeitig zu sein, soweit es die Matrix betrifft. Das Einrichten eines solchen Systems erfordert eine Haupthandlung. Es ist keine Fertigkeitsprobe erforderlich, es sei denn, du möchtest das Relais mit einer Probe auf Heimlichkeit (Fingerfertigkeit) + Geschicklichkeit verbergen. Wenn du dich von deinem Matrix-Relais entfernst, bestimme, ob es zwischen dir und deinem drahtlosen Relais aufgrund von Entfernung, Störungen oder anderen Effekten Rauschen gibt. Wenn dieses Rauschen die Stufe des Matrix-Relais übersteigt, bist du außer Reichweite. Du profitierst von einem stärkeren Signal, wenn du dich nicht am Rande der Reichweite des Relais befindest. Übersteigt die Stufe des Relais das Rauschen, das auf deine Verbindung mit dem Relais einwirkt, senke alle weiteren Rauschen-Malus um die Differenz zwischen Relaisstufe und Rauschenwert.\nWenn du dich in einem Umkreis von 100 Metern um dein Matrix-Relais befindest, steht dessen volle Stufe zur Verstärkung deines Signals zur Verfügung. Senke den Rauschenwert um die Stufe des Relais, während es aktiv ist.\nEin Matrix-Relais kann von seinem Besitzer für den persönlichen Gebrauch eingeschränkt werden. Wenn der Zugang erlaubt ist, können bis zu [Stufe des Relais x 3] Nutzer eine Verbindung zum Relais herstellen.
item.rfid_god_bomb=GOD-Bombe
item.rfid_god_bomb.page=43
item.rfid_god_bomb.desc=Eine Reihe von Chips, die mit den fiesesten, aber letztlich harmlosen Viren und anderer illegaler Software beladen sind. Sobald die Chips aktiviert sind, verstoßen sie unglaublich schnell und vollkommen rücksichtlos gegen das Gesetz. Wenn die GOD-Bombe aktiviert wird, beginne damit, den Overwatch-Wert für sie nachzuhalten. Erhöhe zu Beginn jeder Kampfrunde nach der Aktivierung den Overwatch-Wert der GOD-Bombe um ihre Stufe x 1W6. Sobald der OW 40 erreicht, wird ein kleiner Sprengsatz gezündet, der alle Chips vollständig zerstört und GOD den Eindruck vermittelt, dass eine Persona soeben der Fokussierung anheimfiel und aus der Matrix ausgeworfen wurde. Dies wird zweifellos eine eskalierende Reaktion der Sicherheitsbehörden nach sich ziehen, die zunächst DemiGODs (Decker-/Technomancer-Cops) in der Matrix hinzuziehen, aber ein physisches Sicherheitsteam wird ebenfalls auftauchen. Natürlich ist es keine gute Idee, so etwas dort zu zünden, wo man sich aufhält, aber GOD-Bomben eignen sich hervorragend für Ablenkungen und ausgefeilte Streiche auf Kosten guter Freunde. Oder zukünftig ehemaliger Freunde.
item.rfid_screamer_bomb=Screamer-Bombe
item.rfid_screamer_bomb.page=44
item.rfid_screamer_bomb.desc=Screamer-Chips sind das Gegenteil von Spionage-Chips. Sie laufen nicht auf Schleichfahrt, sondern laut, meist mit unerträglichem AR-Ton und -Bild. Diese Chips sind eigentlich nur modifizierte Standard-RFID-Chips mit bösartigem Code, der sie immun gegen gängige Spam-Filter macht. Ein einzelner Screamer dient lediglich zur Belästigung, zum Marketing, zum Vandalismus oder als einfache Ablenkung. Einige Hacker hatten jedoch die großartige Idee, sie in Clustern zu verwenden. Trotz des Fehlens einer physischen Explosion werden diese Geräte als Screamer-Bomben bezeichnet. Dutzende von ihnen auf einmal, die alle zusammen durch einen einzelnen Auslöser aktiviert werden, können in der Matrix einen überwältigenden Effekt erzeugen. Die Stufe einer Screamer-Bombe ergibt sich aus der Zahl der Chips, die man miteinander verbindet. Jeder Stufenpunkt entspricht etwa einem Dutzend Chips. Wenn sie aktiviert werden, haben sie eine ähnliche Wirkung wie ein Störsender und erhöhen den Rauschenwert in einem Radius von 100 Metern um die (abgerundete) Hälfte ihrer Stufe. Das ist illegal und alarmiert die Matrix-Sicherheitskräfte, die damit beginnen, die Chips nacheinander auszuschalten (dargestellt durch die Ausbrennzeit von 1W6 Minuten). Außerdem erschwert es Matrixwahrnehmungs-Proben erheblich. Innerhalb der Reichweite einer aktiven Screamer-Bombe kann niemand bei Matrixwahrnehmungs-Proben Edge erhalten oder ausgeben. Außerdem wird der Würfelpool aller Matrixwahrnehmungs-Proben um die Stufe der Screamer-Bombe gesenkt. Im Gegensatz zu Störsendern sind diese Flächenwirkungsgeräte nicht in der Lage, einzelne User von ihrer Wirkung auszunehmen. Sie wirken gegen jeden. Jeder, der so töricht ist, eine Screamer-Bombe abzufeuern, die noch mit seinem eigenen PAN verbunden ist, erhält in jeder Kampfrunde 2W6 Punkte Overwatch-Wert.
item.rfid_software_tags=Software-Chips
item.rfid_software_tags.page=44
item.rfid_software_tags.desc=Ein Software-Chip ist etwas größer als ein durchschnittlicher Datenchip und enthält den Speicher und die Rechenleistung, die für das Hosten und die Ausführung einer einzelnen Software erforderlich sind. Für komplexere Aufgaben können mehrere Software-Chips miteinander verbunden werden, um mehrere Programme gleichzeitig auszuführen. Ein Software-Chip oder Chip-Cluster kann jedoch immer nur mit einem Gerät (Drohne, Cyberdeck, Kommlink) gleichzeitig verbunden werden. Software-Chips sind nicht leistungsfähig genug, um Agentenprogramme auszuführen, aber Kommlink-Apps, Matrixprogramme und Autosofts (mit maximal Stufe 4) sind möglich.
item.rfid_spy_tags=Schnüffel-Chips
item.rfid_spy_tags.page=43
item.rfid_spy_tags.desc=Anstatt nur auf Schleichfahrt zu laufen, sind Schnüffel-Chips so programmiert, dass sie offline bleiben, um einer Entdeckung in der Matrix zu entgehen, und sich nur gelegentlich einschalten, um einen Datenstoß zu senden, bevor sie sich erneut für eine gewisse Zeit deaktivieren. Diese Chips können so programmiert werden, dass sie nach einem bestimmten Zeitplan aktiviert werden, aber die Standardeinstellung sind zufällige Abstände, um eine versehentliche Entdeckung zu vermeiden. Wenn nicht gerade jemand in den etwa drei Sekunden, in denen der Chip online geht, aktiv nach Signalen sucht, ist es sehr unwahrscheinlich, dass der Chip – außer durch visuelle Scans – entdeckt wird. Dies ist die Standardvorgehensweise für einen regulären Spionage-Chip (SR6, S. 270), der seine Position nur in Form von Ortskoordinaten und einem Zeitstempel melden kann. Schnüffel-Chips sind Spionage-Chips, die so modifiziert sind, dass sie mit einem oder mehreren Sensor-Chips gekoppelt werden können, um detailliertere Informationen zu sammeln. In diesem Fall arbeiten die Sensor-Chips im Offline-Modus (kein WiFi) und senden ihre Daten nur an den Spionage-Chip. Wenn man einen Sensor-Chip mit einem Spionage-Chip verbindet, wird der Chip etwas größer, ist aber immer noch ziemlich klein.
item.rfid_whisper_bomb=Flüster-Bombe
item.rfid_whisper_bomb.page=43
item.rfid_whisper_bomb.desc=Dieses Gerät ist nicht so laut wie eine Screamer-Bombe und basiert auf demselben Konzept, verwendet aber viele Spionage-Chips, was es schwerer macht, einzelne auf Schleichfahrt laufende Icons zu erkennen. Diese Spionage-Chips werden mit illegaler Software modifiziert, sodass sie in der Matrix den Anschein eines größeren Geräts erwecken und bis zu ihrer Identifizierung mit einem größeren Gerät verwechselt werden können. Wenn du auf Schleichfahrt läufst und eine Flüster-Bombe aktivierst, beginnt sie, mit einer Geschwindigkeit von 1W6 Punkten pro Minute einen eigenen Overwatch-Wert zu erzeugen. Wenn dieser Wert 40 erreicht, gerät der Chip in die Fokussierung und wird zerstört, und ein Sicherheitsteam wird zu seinem Standort geschickt. Wenn du eine Flüster-Bombe benutzt und jemand dich erfolgreich mit einer Matrixwahrnehmungs-Probe entdeckt, würfle 2W6. Wenn du keinen Pasch würfelst, wird stattdessen ein Spionage-Chip entdeckt. Senke die Stufe der Flüster-Bombe jedes Mal permanent um 1, wenn das geschieht. Solange eine Flüster-Bombe nicht in die Fokussierung gerät, kannst du sie deaktivieren und wiederverwenden, aber alle Stufensenkungen sind permanent. Geh davon aus, dass diese Spionage-Chips ausbrennen oder von den Matrix-Sicherheitskräften lahmgelegt werden.
item.comhack_agent_box=Agentenbox-Hack
item.comhack_agent_box.page=44
item.comhack_agent_box.desc=Agentensoftware läuft am besten auf einem Cyberdeck, aber ein gehacktes Kommlink kann als separates Gerät designt werden, das ein Agentenprogramm unabhängig von dessen Cyberdeck hosten und ausführen kann. Ein Kommlink zu einer Agentenbox umzufunktionieren, erfordert eine Ausgedehnte Probe auf Elektronik (Hardware) + Logik mit einem Schwellenwert gleich der doppelten Gerätestufe des Kommlinks und einem Intervall von 1 Stunde. Nach der Umwandlung wird das Kommlink zu einer Agentenbox mit einer Stufe gleich der Gerätestufe des ursprünglichen Kommlinks. Eine Agentenbox dient als externer Programmträger für einen Agenten, dessen Stufe nicht höher sein darf als die Stufe der Agentenbox. Detaillierte Regeln zu Agenten, einschließlich spezifischer Verwendungen für Agentenboxen, findest du im Kapitel Digitaler Werk-zeugkasten (S. 61).
item.comhack_decoy_pod=Lockvogelkapsel-Hack
item.comhack_decoy_pod.page=44
item.comhack_decoy_pod.desc=Eine Lockvogelkapsel ist ein großes, tragbares Gerät, das aus einem umfunktionierten Kommlink, einem Störsender und einem verwirrend verkabelten Rahmen besteht, der eine lächerlich große Anzahl von Spionage-Chips miteinander verbindet. Wenn die Kapsel mit einem Cyberdeck verbunden und aktiviert wird, verwirrt sie die Sicherheitsprotokolle und lenkt die Aufmerksamkeit von deiner Persona ab. Wenn du Overwatch-Wert ansammelst, geht er an die Lockvogelkapsel statt an deine Persona. Sobald eine Lockvogelkapsel eine Anzahl von Overwatch-Punkten gleich ihrer Stufe x 2 angesammelt hat, überhitzt sie und explodiert, wobei sie am Detonationspunkt 4K Feuerschaden verursacht. Aus offensichtlichen Gründen verwenden die meisten Decker diese Geräte im drahtlosen Modus. Du kannst immer nur eine Lockvogelkapsel gleichzeitig verwenden. Das Aktivieren einer Lockvogelkapsel erfordert aufgrund der erforderlichen sorgfältigen Kalibrierung eine Haupthandlung. Die Kapsel kann sofort mit einer Nebenhandlung deaktiviert werden. Wenn eine Lockvogelkapsel deaktiviert wird, bevor sie zerstört wird, startet sie ohne Overwatch-Wert neu. Eine explodierte Lockvogelkapsel ist nicht wiederherstellbar.
item.comhack_persona_booster=Personabooster-Hack
item.comhack_persona_booster.page=45
item.comhack_persona_booster.desc=Ein Personabooster ist ein Kommlink, das übertaktet wurde, dessen Betriebssystem gelöscht und durch illegale Software ersetzt wurde und dessen gesamter Zweck geändert wurde, um die Rechenleistung einer Persona zu erhöhen. Ein Personabooster ist für den Anschluss an Cyberdecks konzipiert, kann aber auch mit einer Riggerkonsole oder einem Kommlink verwendet werden. Leider funktionieren diese Dinger nicht bei Technomancern. Will man ein Kommlink hacken, um es in einen Personabooster umzufunktionieren, erfordert das eine Elektronik-Werkzeugkiste und eine Ausgedehnte Probe auf Elektronik (Hardware) + Logik mit einem Schwellenwert gleich der doppelten Gerätestufe des Kommlinks und einem Intervall von 1 Stunde. Nach der Fertigstellung ist das Gerät unwiderruflich kein Kommlink mehr, sondern ein Personabooster mit einer Stufe gleich der halben (aufgerundeten) Gerätestufe des ursprünglichen Kommlinks. Wenn ein Personabooster direkt über ein Datenkabel angeschlossen ist (entweder an dein Gerät oder an eine Datenbuchse), kann er eingesetzt werden, um Matrixhandlungen zu verbessern. Die Verwendung des Personaboosters erfordert eine Nebenhandlung, nach der du eine Anzahl von Schicksalswürfeln gleich der Stufe des Personaboosters zum Würfelpool deiner nächsten Matrixhandlung hinzufügst. Wenn du mehrere Personabooster hast, kannst du so viele davon benutzen, wie du willst, um deine Matrixhandlung zu verbessern, aber du musst jeweils eine Nebenhandlung für die Aktivierung jedes Personaboosters ausgeben. Personabooster können im WiFi-Modus verwendet werden, gewähren dann aber nur halb so viele Schicksalswürfel (aufgerundet) wie im direkt verbundenen Zustand. Und wo ist der Haken? Zunächst einmal können diese Geräte unberechenbar sein. Die Schicksalswürfel geben und nehmen, obwohl sie eher helfen als behindern. Zweitens laufen diese Geräte heiß und laut und brennen schnell aus. Verringere die Stufe eines Personaboosters nach jeder Verwendung permanent um 1. Außerdem erhöht sich dein Overwatch-Wert um die Gesamtsumme der Augenzahl aller gewürfelten Schicksalswürfel, die du durch Personabooster erhalten hast. GOD hasst diese Dinger.
item.comhack_armorlink_upgrade=Panzerungs-Upgrade
item.comhack_armorlink_upgrade.page=45
item.comhack_armorlink_upgrade.desc=Ein Kommlink mit einem Panzerungs-Upgrade kann sich selbst und die Geräte in seinem PAN besser gegen Matrixangriffe schützen. Das Kommlink sowie alle mit seinem PAN verbundenen Geräte erhalten auf Widerstandsproben gegen Matrixschaden einen Würfelpoolbonus in Höhe der Stufe des Upgrades. Die maximale Stufe für ein Panzerungs-Upgrade ist gleich der Gerätestufe des Kommlinks.
item.comhack_stealthlink_upgrade=Tarnkappen-Upgrade
item.comhack_stealthlink_upgrade.page=45
item.comhack_stealthlink_upgrade.desc=Ein Kommlink erhält ein Schleicher-Attribut mit einer Stufe gleich der Stufe seines Tarnkappen-Upgrades. Dieses Schleicher-Attribut ist auf Matrixheimlichkeit beschränkt und kommt nur zum Einsatz, wenn es einer Handlung Matrixwahrnehmung widersteht. Das macht das Kommlink viel effektiver darin, auf Schleichfahrt zu laufen, aber es erlaubt keine anderen Matrixhandlungen, die ein Cyberdeck oder eine lebende Persona erfordern würden. Die maximale Stufe eines Tarnkappen-Upgrades ist gleich dem unmodifizierten Datenverarbeitungs-Attribut des Kommlinks.
item.comhack_securelink_upgrade=Sicherheits-Upgrade
item.comhack_securelink_upgrade.page=45
item.comhack_securelink_upgrade.desc=Die Firewall eines Kommlinks wird um die Stufe seines Sicherheits-Upgrades erhöht, aber nur, wenn es sich gegen Hacking-Handlungen wehrt. Die maximale Stufe eines Sicherheits-Upgrades ist gleich der unmodifizierten halben Gerätestufe (aufgerundet) des Kommlinks.
item.cyberkit=Cyberkit
item.cyberkit.page=62
item.cyberkit.desc=Es gibt einen Markt für vorgefertigte Agentenboxen. Das Eigentum an einer Agentenbox kann übertragen werden, und so sind eine Reihe von ungewöhnlichen Geräten auf dem Markt aufgetaucht. Diese werden gemeinhin als Cyberkits bezeichnet und sind eine beliebte Alternative zum Anheuern eines Deckers, der ein Team auf einem Run begleitet. Man könnte meinen, dass Decker nur ungern etwas herstellen würden, das sie ersetzt, aber es gibt viele, die es vorziehen, Cyberkits herzustellen und zu verkaufen, statt sich persönlich in Gefahr zu begeben. Die Stufe eines Cyberkits ist auch die Stufe der darauf geladenen Agentensoftware. 
item.cyberkit_recharge=Cyberkit (Wiederaufladung)
item.cyberkit_recharge.page=62
item.cyberkit_recharge.desc=Beachte, dass beim Neustart eines Cyberkits dessen Software gelöscht wird. Die Hardware (eine Agentenbox) ist der teuerste Teil. Wenn sie nicht kaputt oder verloren geht, kann die Software für die angegebenen Aufladekosten neu geladen werden. 

item.living_console=Lebende Riggerkonsole
item.living_console.page=68
item.living_console.desc=Du musst die Echos Maschinenbeherrschung und Lebendes Netzwerk haben, um dieses Echo erwerben zu können. Dein Lebendes Netzwerk kann jetzt als Riggerkonsole mit einer effektiven Gerätestufe gleich deinem Resonanzattribut funktionieren. Du kannst nur Autosofts ausführen und teilen, die auf deiner lebenden Persona ausgeführt werden.
item.machinist_console=Maschinist Riggerkonsole
item.machinist_console.page=132
item.machinist_console.desc=Maschinisten haben eine so starke Affinität zu Maschinen, dass ihnen schon der Gedanke daran, nur eine einzige Maschine zu kontrollieren, ein Gräuel ist. Sie haben gelernt, die Resonanz so zu verdrehen, dass ihre lebende Persona als Riggerkonsole funktionieren kann und alle Fähigkeiten emuliert, die jemandem zur Verfügung stehen, der eine Riggerkonsole benutzt (außer der Fähigkeit, Teil eines PANs zu sein; dafür ist das Echo Lebendes Netzwerk, SR6, S. 195, erforderlich). Die neuen Attribute werden zusätzlich zu den normalen Matrixattributen erworben. Die Stufe in Rauschunterdrückung ist gleich der Willenskraft des Maschinisten, und die Anzahl der Autosofts, die mit Drohnen geteilt werden kann, ist gleich dem Charisma des Maschinisten.

#Software
item.code_buddy=Code Buddy
item.code_buddy.page=57
item.code_buddy.desc=Ein Code Buddy ist eine App, die dir helfen soll, Software schneller zu programmieren, indem sie permanent nach Fehlern sucht, Lösungsvorschläge macht und auf Grundlage heuristischer Algorithmen sogar einen Teil des mühsameren Codes für dich schreibt. Diese App kann dir viel Zeit ersparen, aber nicht immer – wir alle haben schon über Autokorrekturfehler gelacht. Wenn du mithilfe dieser App eine Programmierprobe ablegst, füge deinem Würfelpool einem Schicksalswürfel hinzu.
item.code_buddy.short=Schicksalswürfel für Programmierprobe
item.eparkour=eParkour
item.eparkour.page=57
item.eparkour.desc=Diese App analysiert Objekte in deiner Umgebung und projiziert mögliche Parkour-Bewegungen auf der Grundlage deines Fähigkeitsprofils. Sofern du über ein DNI oder eine Bildverbindung verfügst, erhältst du bei jeder Athletik-Probe 1 Edge, das für diese Probe ausgegeben werden muss und ansonsten verfällt. Die App gewährt kein Edge für Angriffs- oder Verteidigungsproben, auch nicht für solche, die von Athletik profitieren (z.B. durch die Handlung Ausweichen).
item.eparkour.short=Edge bei Athletik-Probe außer Kampf
item.file_vault=File Vault
item.file_vault.page=57
item.file_vault.desc=Alle Dateien, die in dieser App gespeichert sind, werden durch eine Verschlüsselung mit einer Stufe geschützt, die der halben Gerätestufe (aufgerundet) deines Kommlinks entspricht. Wenn ein Entschlüsselungsversuch erkannt wird, reagiert die App standardmäßig mit einer Warnung an den Eigentümer des Kommlinks und löscht die Dateien. Die Standardreaktion kann geändert werden – eine der raffinierteren Anwendungen besteht darin, die Dateien zu bearbeiten oder zu ersetzen, sodass der Hacker unwissentlich falsche Informationen herunterlädt.
item.file_vault.short=Verschlüsselung für Dateien
item.simshare=SimShare
item.simshare.page=57
item.simshare.desc=Mit dieser App kannst du deinen Simsinn-Feed mit anderen Usern teilen. Am häufigsten wird diese App verwendet, um gemeinsam Medien zu konsumieren oder eine private Simsinn-Umgebung zu teilen, aber SimShare ermöglicht es Usern auch, den Simsinn-Feed des Kommlinks als Passagier in der Matrix zu abonnieren. Ein User mit Abo erlebt das gleiche Simsinn wie der Besitzer des Kommlinks, einschließlich etwaiger Auswurfschocks oder Biofeedback-Schäden. Die Abonnenten können ihren eigenen Interfacemodus wählen, um diese Gefahr zu begrenzen. Bei der Verwendung von AR wird jeglicher Schaden verhindert, bei VR mit kaltem Sim erleidest du nur Betäubungsschaden durch Biofeedback. Nur Biofeedback-Schaden wird geteilt, nicht aber Matrixschaden. Die einzigen Matrixhandlungen, die ein SimShare-Abonnent verwenden kann, sind Nachricht übermitteln, Interfacemodus wechseln und Ausstöpseln, aber du kannst andere Matrixhandlungen mit einer Teamworkprobe unterstützen, wenn du die entsprechende Fertigkeit besitzt. SimShare ist zwar viel sicherer als das Hackingprogramm Tramper (S. 139), kann aber keine Passagiere in die Fundamente oder in die Resonanzräume mitnehmen. Ein SimShare-User erscheint als ein Icon, das an die Gastgeber-Persona angehängt ist, und kann nicht separat das Ziel von Matrixhandlungen, Komplexen Formen oder Spritekräften sein.
item.simshare.short=Sichere Lösung für Tramper
item.mefeed=MeFeed
item.mefeed.page=57
item.mefeed.desc=Soziale Medien sind in der Sechsten Welt allgegenwärtig und können ein nützliches Mittel sein, um schnell Informationen zu sammeln. Selbst Personen ohne MeFeed-Account werden referenziert und getrackt. Wenn man weiß, wo man suchen muss, kann man in die Privatsphäre jeder Person eindringen. Wenn du die MeFeed-App laufen hast, erhältst du bei einer Matrixsuche zu einer Person, einem Unternehmen, einem popkulturellen Thema oder einem aktuellen Ereignis 1 Edge (auf die Matrixsuche in Summe, nicht auf jeden Würfelwurf der Ausgedehnten Probe). Dieses Edge muss für die Matrixsuche ausgegeben werden und verfällt ansonsten. Ein Patzer bei dieser Probe führt zu einer Fehlinformation, und ein kritischer Patzer macht die gesamte Suche zunichte. Die App wird in der Regel zusammen mit einer kleinen Flugdrohne verwendet, um das Leben unterwegs einzufangen und Selfies zu machen. Viele Shadowrunner machen sich das zunutze, um für das Vorhandensein eines heimlichen Aufklärungsgeräts einen scheinbar harmlosen Grund anführen zu können.
item.mefeed.short=Edge für Matrixsuche
item.mannequin=Mannequin
item.mannequin.page=57
item.mannequin.desc=Hacker müssen manchmal den Anschein erwecken, dass auf einem ihrer Geräte eine aktive Persona läuft, während sie gerade mit einem anderen Gerät beschäftigt sind oder einfach nur versuchen, sich irgendwo einzuschleichen. Die Mannequin-App setzt voraus, dass eine Personal-Assistant-App ausgeführt wird, um zu funktionieren. Wenn sowohl Mannequin als auch Personal Assistant laufen, scheint dein Kommlink für jeden Beobachter in der Matrix eine aktive Persona zu erzeugen. Um zu erkennen, dass es sich um eine falsche Persona handelt, ist eine Matrixwahrnehmungs-Probe gegen einen Schwellenwert gleich der Gerätestufe des Kommlinks erforderlich.
item.mannequin.short=Falsche Persona
item.personal_assistant=Personal Assistant
item.personal_assistant.page=57
item.personal_assistant.desc=Der Personal Assistant ist eine der gängigsten und beliebtesten Kommlink-Apps. Es fungiert als Software-Diener, dessen Hauptfunktionen darin bestehen, deinen Kalender im Auge zu behalten, dein Netzwerk zu überwachen und die Steuerung von angeschlossenen Geräten zu automatisieren. Personal Assistants werden oft mit künstlichen Persönlichkeiten und charakteristischen Icons programmiert, sind aber weit davon entfernt, echte KIs zu sein. Es handelt sich im Wesentlichen um hochentwickelte Kommlink-Automatisierungswerkzeuge. Sofern ein Personal Assistant nicht mit zusätzlicher Software ausgestattet ist (s. P-ICE), ist er auf die folgenden legalen Matrixhandlungen beschränkt: Ausstöpseln, Datei editieren (nur eigene Dateien), Gerät formatieren (nur eigene Geräte), Gerät neu starten (nur eigene Geräte), Gerät steuern (nur eigene Geräte), Host betreten/verlassen, Icon verändern, Matrixsuche, Matrixwahrnehmung, Nachricht übermitteln und Volle Matrixabwehr. Deinem Personal Assistant einen einfachen Befehl zu erteilen, erfordert eine Nebenhandlung. Komplexere Automatisierungen erfordern ein wenig mehr Zeit und Konzentration. Besonders aufwendige und komplexe Automatisierungen können nach Ermessen der Spielleitung eine Programmierprobe mit einem Intervall von 1 Minute erfordern. Jede beliebige Abfolge, Situationsabhängigkeit und Kombination der verfügbaren Matrixhandlungen ist möglich. Dein Personal Assistant wird nur Maßnahmen ergreifen, die du anweist. Er hat keine eigene Initiative und kann in jeder Kampfrunde, wenn du am Zug bist, eine einzige Matrixhandlung ausführen. Für alle Handlungen ist sein Würfelpool gleich seiner Stufe x 2. Ein PA muss jedoch Erfolge kaufen, anstatt zu würfeln (ein Erfolg für jeweils volle vier Würfel), und in seinem Namen darf Edge weder erhalten noch ausgegeben werden. Das heißt, ein PA der Stufe 1 erzielt keine Erfolge, ein PA der Stufe 2 bis 3 erzielt 1 Erfolg, ein PA der Stufe 4 bis 5 erzielt 2 Erfolge, und ein PA der Stufe 6 erzielt 3 Erfolge. In der Standardeinstellung verbessert ein PA deine gesamte Matrixverteidigung, indem er ständig die Handlung Volle Matrixabwehr für dich durchführt. Dies fügt seine Stufe zu deinem Würfelpool hinzu, um feindlichen Matrixhandlungen zu widerstehen. Die maximale Stufe eines PAs, die auf einem Kommlink laufen kann, ist gleich der doppelten Gerätestufe des Kommlinks.
item.personal_assistant.short=Automation für legale Matrixhandlungen
item.p-ice_nope=P-ICE Nope!
item.p-ice_nope.page=58
item.p-ice_nope.desc=Ein Kommlink kann immer nur ein P-ICE laufen haben, und ein P-ICE kann nur zusammen mit einem Personal Assistant laufen. Diese Art von P-ICE veranlasst den PA, seine Matrixhandlung in jeder Kampfrunde zu verwenden, um mit Matrixwahrnehmung nach Anzeichen für feindliche Matrixaktivitäten gegen das Kommlink und die damit verbundenen Geräte Ausschau zu halten. Wenn Anzeichen für feindliche Aktivitäten entdeckt werden, führt der PA sofort eine Reihe von Handlungen durch. Die Standardreaktion besteht darin, den Besitzer und die Behörden über den Angriff oder das Eindringen zu informieren, dann die drahtlose Verbindung für alle angeschlossenen Geräte zu deaktivieren und das Kommlink neu zu starten. Stattdessen kann der PA aber auch so eingestellt werden, dass nur bestimmte Nummern alarmiert werden oder dass die Einstellungen einiger Geräte angepasst werden, andere aber nicht. Dies muss im Voraus festgelegt werden, hat aber den Vorteil, dass der Besitzer nicht erst Handlungen ausgeben muss, um jedes einzelne Gerät auszuschalten, weil er es gegen Hackerangriffe schützen will – dies geschieht einfach sofort als Reaktion auf ein erkanntes Eindringen. Du kannst die App auch mit einer Nebenhandlung aktivieren, selbst wenn keine illegale Aktivität festgestellt wird.
item.p-ice_nope.short=Erkennung von Eindringlingen
item.p-ice_spines=P-ICE Spines
item.p-ice_spines.page=58
item.p-ice_spines.desc=Ein Kommlink kann immer nur ein P-ICE laufen haben, und ein P-ICE kann nur zusammen mit einem Personal Assistant laufen. Das Spines-Programm rüstet deinen PA mit einem zusätzlichen Schutz gegen Hacker aus. Dein PA führt in jeder Kampfrunde weiter seine Handlung Volle Matrixabwehr aus. Jedes Mal, wenn ein Hacker eine illegale Matrixhandlung ausführt, der mit dem Firewall-Attribut deines Kommlinks widerstanden wird, erleidet er Matrixschaden. Wenn die Matrixhandlung gegen dich erfolgreich ist, erleidet der gegnerische Hacker 1 Kästchen Matrixschaden. Gelingt die Matrixhandlung nicht, erleidet er so viele Kästchen Matrixschaden, wie du Nettoerfolge gegen ihn erzielt hast (mindestens aber 1 Kästchen). Dieser Matrixschaden kann nur durch das Matrixprogramm Spineshield verhindert werden, ansonsten wird er automatisch (ohne Widerstandsprobe) erlitten.
item.p-ice_spines.short=Schaden für Eindringlinge
item.p-ice_watchdog=P-ICE Watchdog
item.p-ice_watchdog.page=58
item.p-ice_watchdog.desc=Ein Kommlink kann immer nur ein P-ICE laufen haben, und ein P-ICE kann nur zusammen mit einem Personal Assistant laufen. Das Watchdog-P-ICE veranlasst den PA, seine Matrixhandlung in jeder Kampfrunde auszuführen, um mit Matrixwahrnehmung nach Icons Ausschau zu halten, die auf Schleichfahrt laufen. Wenn versteckte Icons entdeckt werden, benachrichtigt der PA seinen Besitzer und alle anderen Nummern, die er laut seiner Programmierung kontaktieren soll. Zur Identifizierung der Icons sind keine weiteren Proben oder Maßnahmen erforderlich; die einzige Information, die der PA angibt, ist der Typ des Icons oder Geräts. Ist das Icon maskiert oder anderweitig verändert, meldet die Watchdog-App die gefälschten Informationen, als ob sie wahr wären.
item.p-ice_watchdog.short=Entdecken von Icons auf Schleichfahrt
item.autosoft_host=Autosoft Host
item.autosoft_host.page=58
item.autosoft_host.desc=Mit diesem Programm kannst du Autosofts laden, sodass sie von einem Agentenprogramm verwendet werden können. Du kannst mit diesem Progamm eine beliebige Anzahl von Autosofts laufen lassen – begrenzt nur durch deine freien Programmslots. Zusätzlich zu Autosofts kannst du auch Talentsofts auf die gleiche Weise laufen lassen. Jede Autosoft oder Talentsoft belegt einen eigenen Programmslot.
item.autosoft_host.short=Erlaubt Agenten Zugriff auf Autosofts
item.emulator=Emulator
item.emulator.page=59
item.emulator.desc=Die meisten Decker tragen ein Kommlink für den täglichen Matrixgebrauch mit sich herum, aber du kannst es auf einem Cyberdeck mit einem Emulatorprogramm effizienter betreiben. Das durch den Emulator emulierte Kommlink hat eine Gerätestufe gleich der des Cyberdecks, auf dem der Emulator läuft. Der Emulator kann in seinem eigenen Programmslot eine Anzahl von Kommlink-Apps gleich der Gerätestufe des Cyberdecks ausführen. Da der Emulator eine Art Sandbox generiert, profitiert nur das emulierte Kommlink von diesen Apps, nicht aber das Cyberdeck. Du kannst immer noch Kommlink-Apps auf dem Cyberdeck selbst ausführen, aber ohne dieses Programm belegen sie jeweils einen Programmslot. Dies wird am häufigsten verwendet, um einen Personal Assistant zusammen mit Mannequin und P-ICE zu betreiben. Emulator kann nicht durch die Komplexe Form [Programm] Emulieren emuliert werden.
item.emulator.short=Mehrere Kommlink-Apps in einem Slot
item.blaster_charger=Blaster-Charger
item.blaster_charger.page=59
item.blaster_charger.desc=Mit diesem Programm kannst du deine Matrixhandlung Datenspike verstärken. Wenn du Blaster-Charger einsetzt, kannst du eine oder mehrere Nebenhandlungen ausgeben, um deine Handlung Datenspike "aufzuladen". Für jede Nebenhandlung, die du für das Aufladen ausgibst, senkst du die Kosten eines Edge-Boosts oder einer Edge-Handlung für deinen Datenspike um 1, bis zu einem Minimum von 1 Edge. Du musst Datenspike direkt nach dem Aufladen nutzen, ansonsten gehen die Senkungen der Edge-Kosten verloren. Nachdem du den aufgeladenen Datenspike verwendet hast, stürzt das Programm ab. Du kannst es mit einer Nebenhandlung erneut laden.
item.blaster_charger.short=Veringert Edge Kosten für Dateenspike
item.bomb_kit=Bombenset
item.bomb_kit.page=59
item.bomb_kit.desc=Wenn du die Matrixhandlung Datenbombe legen ausführst, während dieses Programm läuft, ersetze einen der Probenwürfel durch einen Schicksalswürfel. Du kannst eine Datenbombe legen, die zusammen mit einer Datei kopiert wird, anstatt bei einem illegalen Zugriff zu explodieren. Wenn die Datenbombe nicht entdeckt und entschärft wird, wird sie beim ersten Zugriff auf die Kopie ausgelöst. Du kannst jedoch eine bestimmte Anzahl von Dateizugriffsversuchen festlegen, die erfolgen müssen, bevor die Datenbombe ausgelöst wird. Und ja, wenn die Kopie kopiert wird, hat die Kopie der Kopie auch eine Kopie der Datenbombe und so weiter und so fort.
item.bomb_kit.short=Schicksalswürfel für Matrixhandlung Datenbombe legen
item.directional_shield=Gerichteter Schild
item.directional_shield.page=60
item.directional_shield.desc=Mit diesem Programm kannst du deine Firewall gegen eine erwartete Bedrohung in der Matrix verstärken und ausrichten. Wenn du die Matrixhandlung Volle Matrixabwehr ausgeführt hast, kannst du eine Jederzeit-Nebenhandlung ausgeben, um die Stufe deines Attributs Datenverarbeitung zu deinem Würfelpool hinzuzufügen, um dich gegen eine Matrixhandlung zu verteidigen. Du musst dir des Icons bewusst sein, das gegen dich vorgeht, um diese Möglichkeit nutzen zu können. Du kannst dieses Programm mehrmals pro Kampfrunde einsetzen, aber nur einmal pro Matrix-Verteidigungsprobe. Jede Verwendung erfordert eine separate Nebenhandlung.
item.directional_shield.short=Addiere Datenverarbeitung zu Voller Matrixabwehr
item.defense_pods=Verteidigungskapsel
item.defense_pods.page=60
item.defense_pods.desc=Immer wenn du Matrixschaden erleidest, kannst du eine Jederzeit-Nebenhandlung ausgeben, um eine Verteidigungskapsel zu aktivieren und den Matrixschaden um 1 Kästchen zu senken. Nach jeder Benutzung stürzt das Programm ab. Du kannst es mit einer Nebenhandlung erneut laden.
item.defense_pods.short=Reduziere einkommenden Matrixschaden
item.double_agent=Doppelagent
item.double_agent.page=60
item.double_agent.desc=Wenn du ein IC zum Absturz bringst, während du dieses Programm laufen lässt, wird der Host in der nächsten Kampfrunde eine neue Kopie des IC starten. Wenn das geschieht, wird das IC unter deiner Kontrolle neu starten. Bis zum nächsten Mal, wenn du Overwatch-Wert ansammelst, wird das IC deine Befehle so gut es kann befolgen und keine Maßnahmen gegen dich ergreifen. Sobald du auch nur einen weiteren Punkt Overwatch-Wert ansammelst, stürzt das Doppelagentenprogramm ab, und das IC nimmt sein natürliches Verhalten wieder auf. Wenn das IC eine Handlung ausführt, die OW erzeugt, wird es sofort nach Abschluss der Handlung durch den Host gelöscht (und in der nächsten Kampfrunde wieder gestartet – diesmal nicht unter deiner Kontrolle).
item.double_agent.short=Kontrolliere neugestartetes IC
item.drone_master=Drohnenmeister
item.drone_master.page=60
item.drone_master.desc=Wenn du auch eine Riggerkonsole hast, die über ein Datenkabel direkt mit deinem Cyberdeck (oder einer Agentenbox) verbunden ist, kann dein Agentenprogramm (S. 61) in eine Drohne springen, die an der Riggerkonsole angemeldet ist. Dein Agent ersetzt die Pilotstufe der Drohne durch seine eigene Stufe und überschreibt alle Autosofts mit denen, auf die er Zugriff hat. Während die Drohne von deinem Agenten gesteuert wird, sind Autosofts, die auf ihr laufen, nicht verfügbar. Damit wird dein Agent allerdings nicht in eine Drohne oder Riggerkonsole hochgeladen. Er braucht immer noch ein Cyberdeck oder eine Agentenbox, um zu funktionieren. Der Pilot der Drohne wehrt sich dagegen, beherrscht zu werden (selbst wenn du der Besitzer der Drohne bist). Das verursacht keine Probleme, wenn die Drohne in deinem PAN läuft, aber wenn du eine Agentenbox zu diesem Zweck für eine Fernmission (S. 61) einsetzt, erleidet sie 1W6 Kästchen Matrixschaden pro Minute. Dabei handelt es sich weniger um ein Sicherheitsprotokoll als vielmehr um einen unbeabsichtigten Effekt, der durch nicht miteinander harmonisierende Technologien verursacht wird.
item.drone_master.short=Erlaube Agenten in Drohnen einzuspringen
item.hitchhiker=Tramper
item.hitchhiker.page=139
item.hitchhiker.short=Nimm Tramper mit in Fundamente und Resonanzräume
item.quartermaster=Quartiermeister
item.quartermaster.page=60
item.quartermaster.desc=Dieses Programm stattet einen Agenten mit einer Reihe von nützlichen Software-Tools aus. Insgesamt verleihen diese Werkzeuge dem Agenten ein eigenes Edge-Attribut in Höhe seiner Stufe, obwohl sein Edge-Pool zu Beginn leer ist und er Edge nicht eigenständig erhalten kann. Der Besitzer des Agenten kann eine Jederzeit-Nebenhandlung ausgeben, um sein eigenes Edge im Verhältnis eins zu eins in den Edge-Pool des Agenten zu übertragen. Dies ist die einzige Möglichkeit für den Agenten, Edge zu erhalten. Einem Agenten auf einer Fernmission kann, wenn er losgeschickt wird, Edge zur Verfügung gestellt werden, danach aber nicht mehr. Der Charakter, der den Agenten kontrolliert, kann entscheiden, wann und wie der Agent sein verfügbares Edge einsetzt, aber das Edge kann nur ausgegeben werden, um dem Agenten direkt zu helfen, und kann nicht an andere Charaktere übertragen oder für sie ausgegeben werden.
item.quartermaster.short=Edge für Agenten
item.rocket_launcher=Raketenwerfer
item.rocket_launcher.page=60
item.rocket_launcher.desc=Diese Matrixkampf-Verstärker verschaffen Deckern einen Vorteil gegen Demi-GODs, IC und feindliche Sprites, aber sie sind genauso gut geeignet, um sich mit Personas anzulegen. Wenn du eine Nebenhandlung ausgibst, um den Raketenwerfer zu aktivieren, bevor du eine Matrixhandlung Datenspike ausführst, erhöhe deinen Grund-Matrixschaden um 2. Du musst Datenspike direkt nach dem Aktivieren von Raketenwerfer nutzen, ansonsten geht die Schadenserhöhung verloren. Direkt nach der Handlung Datenspike stürzt das Programm ab. Du kannst es mit einer Nebenhandlung erneut laden.
item.rocket_launcher.short=Erhöht Matrixschaden von Datenspike ausführst
item.secret_agent=Geheimagent
item.secret_agent.page=60
item.secret_agent.desc=Dieses Programm ist so konzipiert, dass es mit einem Agenten hochgeladen werden kann, der in einem Host operiert. In diesem Fall sammelt der Agent zusätzlichen Overwatch-Wert mit einer Geschwindigkeit von 1W6 pro Stunde (statt 1W6 pro Minute) an.
item.secret_agent.short=Weniger Overwatch für Agenten in Hosts
item.smoke_bomb=Rauchbombe
item.smoke_bomb.page=60
item.smoke_bomb.desc=Wenn du eine Nebenhandlung ausgibst, um ein Rauchbombenprogramm zu aktivieren, bevor du eine Matrixhandlung Verstecken ausführst, füge deinem Würfelpool einen Schicksalswürfel hinzu. Danach stürzt das Programm ab, aber du kannst es jederzeit mit einer Nebenhandlung erneut laden.
item.smoke_bomb.short=Schicksalswürfel bei Matrixhandlung Verstecken
item.special_agent=Spezialagent
item.special_agent.page=60
item.special_agent.desc=Leg eine bestimmte Spezialisierung der Fertigkeit Cracken oder Elektronik fest, wenn du dieses Programm schreibst oder kaufst. Während das Programm läuft, verleiht es deinem Agenten die gewünschte Spezialisierung, was seinen Würfelpool für entsprechende Aufgaben um 2 erhöht. Spezialagentenprogramme mit unterschiedlichen Spezialisierungen gelten nicht als Kopien desselben Programms, deshalb kannst du mehrere Spezialagentenprogramme gleichzeitig ausführen, solange sie für unterschiedliche Spezialisierungen ausgelegt sind.
item.special_agent.short=Spezialisierung für Agenten
item.spin_doctor=Spindoktor
item.spin_doctor.page=60
item.spin_doctor.desc=Damit diese Software funktioniert, musst du auch Babymonitor laufen lassen. Wenn dein Overwatch-Wert gefährlich hoch wird, beginnt diese Software, eine hektische Abfolge schmutziger Tricks auszuführen, um Fehlfunktionen zu imitieren, andere Icons hineinzuziehen und offensiven Handlungen eine niedrigere Priorität zuzuweisen. Dies ermöglicht es dir, deinen maximalen Overwatch-Wert (normalerweise 40) um 2 zu erhöhen. Wenn Spindoktor diese Erhöhung deines maximalen Overwatch-Werts abgeschlossen hat, stürzt das Programm ab, die Erhöhung deines maximalen Overwatch-Werts bleibt aber bestehen, bis du dich ausstöpselst. Du kannst das Programm mit einer Nebenhandlung erneut laden und deinen maximalen Overwatch-Wert weiter erhöhen.
item.spin_doctor.short=Erhöht maximalen Overwatch-Wert
item.spineshield=Spineshield
item.spineshield.page=60
item.spineshield.desc=Dieses Matrixprogramm wurde als Gegen-Gegenmaßnahme beim Hacken entwickelt. Es verhindert 1 Kästchen Schaden durch die Kommlink-App Spines (und nur durch sie) und stürzt dann ab. Du kannst das Programm mit einer Nebenhandlung neu laden.
item.spineshield.short=Schützt vor Schaden durch P-ICE Spines
item.tapeworm=Bandwurm
item.tapeworm.page=59
item.tapeworm.desc=Wenn du eine Kopie von Bandwurm geladen hast, kannst du sie auf ein Gerät (nicht auf einen Host) hochladen, zu dem du einen Admin-Zugang hast. Dies erfordert eine erfolgreiche Handlung Datei editieren. Der Bandwurm zeichnet ein Protokoll aller Matrixhandlungen auf, die mit dem Gerät durchgeführt werden, sowie alle Daten, auf die zugegriffen wird, die heruntergeladen oder von dem Gerät gesendet werden, und zwar für bis zu eine Stunde pro Nettoerfolg bei der Handlung Datei editieren zum Hochladen des Bandwurms. Du kannst auch eine kürzere Zeitspanne wählen, wenn du willst. Während dieser Zeit versteckt sich der Bandwurm und zeichnet Daten auf dem Zielgerät auf. Er kann nur bemerkt werden, wenn jemand eine Matrixwahrnehmungs-Probe gegen das Gerät ablegt und mindestens so viele Erfolge erzielt, wie du Nettoerfolge bei der Probe zum Hochladen des Bandwurms hattest. Wenn der Bandwurm entdeckt wird, kann er gelöscht, aber nicht zurückverfolgt werden. Wenn er nicht entdeckt und gelöscht wird, lädt er nach Ablauf seiner Zeit alle seine Daten auf einen vorher festgelegten Host in der Matrix hoch und löscht sich dann selbst. In der Regel handelt es sich dabei um Datahavens oder öffentliche Filesharing-Hosts. Vorausgesetzt, du kannst auf das Ziel zugreifen, kannst du die Dateien, die der Bandwurm für dich hinterlassen hat, problemlos herunterladen. Für alle anderen sind die Dateien mit einer Verschlüsselung der Stufe 2 geschützt.
item.tapeworm.short=Zeichnet Matrixhandlungen auf
item.agent_program=Agent
item.agent_program.page=61
item.agent_program.desc=Agentensoftware erzeugt eine zweite Persona mit begrenzter künstlicher Intelligenz, die auf Befehl ihres Besitzers Matrixhandlungen ausführen kann. Viele Agenten sind zwar so programmiert, dass sie Persönlichkeiten nachahmen, aber diese Programme sind nicht wirklich empfindungsfähig. Es gibt viele Geschichten, die darauf hindeuten, dass ein Agentenprogramm zu einer sich ihrer selbst bewussten KI werden kann, aber es scheint kein vorhersehbares Mittel zu geben, um das auszulösen – wenn an den Geschichten überhaupt etwas Wahres dran ist. Um ausgeführt werden zu können, benötigt ein Agentenprogramm einen Programmslot auf einem Cyberdeck oder einem externen Gerät, das als Agentenbox bezeichnet wird. Ein Cyberdeck bzw. eine Agentenbox kann einen Agenten laufen lassen, dessen Stufe nicht höher ist als die Gerätestufe des Decks bzw. der Box. Selbst wenn eine Agentenbox angeschlossen ist, kann ein Cyberdeck immer nur einen Agenten gleichzeitig laufen lassen.
item.agent_program.short=Begrenzter künstlicher Intelligenz, die Matrixhandlungen ausführen kann

#Complex forms
complexform.arc_feedback=Schadensspiegelung
complexform.arc_feedback.page=62
complexform.arc_feedback.desc=Wenn du diese Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du Matrixschaden durch eine Matrixhandlung Datenspike, eine Komplexe Form Resonanzspike oder IC erleidest, während du Schadensspiegelung aufrechterhältst, erleidet das, was dich getroffen hat, Matrixschaden in Höhe der Erfolge bei deiner Elektronik-Probe. Sobald Schadensspiegelung Schaden verursacht hat, bricht die Komplexe Form zusammen und endet.
complexform.attack_attribution=Angriffszuteilung
complexform.attack_attribution.page=63
complexform.attack_attribution.desc=Nimm eine freiwillige Persona (zur Definition von Personas s. SR6, S. 174) ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange du diese Form aufrechterhältst, erhält das Ziel ein Angriffs-Matrixattribut mit einer Stufe gleich der Anzahl der Erfolge bei deiner Elektronik-Probe. Wenn das Ziel bereits ein niedrigeres Angriffsattribut hatte, wird es durch das Angriffsattribut dieser Form ersetzt. Ein Ziel, das unter der Wirkung von Angriffszuteilung steht, kann nicht zum Ziel einer Komplexen Form <i>Angriffs-Steigerung</i> werden. Diese Persona kann jetzt illegale Matrixhandlungen durchführen, die nicht mit dem Attribut Schleicher verbunden sind.
complexform.bubble_shield=Blasenschild
complexform.bubble_shield.page=64
complexform.bubble_shield.desc=Blasenschild erzeugt eine schützende Resonanzbarriere um ein Ziel. Leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Für jeweils 2 Erfolge erhält das Ziel einen Würfelpoolbonus von +1 auf alle Proben zur Abwehr Komplexer Formen und Spritekräfte. Wenn sie aktiv ist, erscheint diese Komplexe Form als kaum sichtbares Kraftfeld, in dem in zufälligen Abständen leuchtende Codezeilen aufflackern. Nur ein Wesen mit dem Attribut Resonanz ist in der Lage, den Blasenschild mithilfe von Matrixwahrnehmung genauer zu beobachten.
complexform.btl_irl=BTL IRL
complexform.btl_irl.page=64
complexform.btl_irl.desc=<i>BTL IRL</i> (Better than Life in Real Life) verbessert die technologischen Sinne des Ziels und stimuliert seine Headware, um einen erhöhten Bewusstseinszustand zu schaffen, ähnlich wie bei der Verwendung eines BTL-Chips – nur dass die realen Erfahrungen des Ziels verbessert werden. Diese Komplexe Form verstärkt nicht nur die angenehmen Erfahrungen, sondern auch die schrecklichen. Um diese Komplexe Form zu weben, leg eine Probe auf Elektronik + Resonanz (6 – abgerundete Essenz des Ziels) ab. Das Ziel muss über irgendeine Art von Headware verfügen, damit die Komplexe Form bei ihm wirken kann, und wenn es keine Sinnesverbesserungen (wie z. B. Cyberaugen, Cyberohren, Geruchsbooster usw.) hat, kannst du bei der Elektronik-Probe weder Edge erhalten noch ausgeben. Das Ziel erhält auf Wahrnehmungsproben einen Würfelpoolbonus in Höhe deiner Nettoerfolge, während <i>BTL IRL</i> aufrechterhalten wird, aber es erhält aufgrund seines offensichtlichen Zustands der Ablenkung und des Stigmas, das Chipheads anhaftet, auch einen Würfelpoolmalus in gleicher Höhe auf alle Überreden- und Einfluss-Proben. Die Wirkung dieser Komplexen Form ist den BTL-Chips so ähnlich, dass sie das Bedürfnis eines BTL-Süchtigen nach einem Schuss befriedigt. Chipheads sind oft bereit, 100 Nuyen pro Stunde und mehr zu zahlen, um von dieser Form beeinflusst zu werden, und viele skrupellose Technomancer vermarkten ihre Fähigkeiten als gesunde Alternative zur Verwendung von BTLs. Sie liegen falsch – <i>BTL IRL</i> ist genauso schlimm wie BTLs. Wenn dein Ziel unter dem Einfluss von <i>BTL IRL</i> jemals einen Patzer, einen Kritischen Patzer oder eine 1 auf einem Schicksalswürfel erzielt, bricht diese Komplexe Form zusammen und endet, und das Ziel erleidet 1W6 Kästchen Körperlichen Biofeedback-Schaden, dem nicht widerstanden werden kann, der nicht verhindert werden kann und der auch nicht gesenkt werden kann. Dieser Schaden kann nur durch natürliche Genesung (SR6, S. 123) geheilt werden. Diese Komplexe Form kann eine Abhängigkeit verursachen (s. <i>Schattenkompendium</i>, S. 167).
complexform.cyber_spike=Cyberspike
complexform.cyber_spike.page=64
complexform.cyber_spike.desc=Diese Komplexe Form ist der schlimmste Albtraum für Cyberware-Enthusiasten. Sie führt zwar nicht wirklich dazu, dass der Körper der Zielperson die installierte Bodytech abstößt, aber sie erweckt den Eindruck, dass dies der Fall ist – und das kann genauso fatal sein. Nimm einen Charakter ins Visier, der über mindestens ein Cyberware-Implantat verfügt, das seinen WiFi-Modus aktiviert hat – oder stell eine Direktverbindung zu einem Ziel her, das über Cyberware verfügt, die nicht im WiFi-Modus läuft. Wenn du versuchst, diese Komplexe Form bei einem Ziel einzusetzen, das keine anfällige Cyberware hat, hast du deine Handlung verschwendet. Je mehr Bodytech ein Ziel hat, desto verwundbarer ist es. Leg eine Probe auf Elektronik + Resonanz gegen Konstitution + Essenz (abgerundet) des Ziels ab. Hat das Ziel seine Cyberware in ein PAN eingebunden, erhält es für seine Probe einen Würfelpoolbonus in Höhe der Firewall des PANs. Für jeden Nettoerfolg erleidet das Ziel 1 Kästchen Körperlichen Schaden (dem es mit Konstitution widerstehen kann), und seine gesamte Cyberware schaltet sich für 1 Kampfrunde ab. Diese Komplexe Form ist mit dem Echo Auralink (S. 68) kompatibel.
complexform.cyberjack_overclock=Cyberbuchsen-Übertaktung
complexform.cyberjack_overclock.page=64
complexform.cyberjack_overclock.desc=Nimm eine Persona ins Visier, die eine Cyberbuchse oder ein Cyberhack verwendet. Leg eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg erhöht die Matrix-Initiative der anvisierten Persona um 1, solange diese Form aufrechterhalten wird. Dies wird zum Initiativeergebnis addiert; es werden keine zusätzlichen Initiativewürfel hinzugefügt.
complexform.cyberware_stamina=Cyberware Ausdauer
complexform.cyberware_stamina.page=65
complexform.cyberware_stamina.desc=Diese Komplexe Form ist der schlimmste Albtraum für Cyberware-Enthusiasten. Sie führt zwar nicht wirklich dazu, dass der Körper der Zielperson die installierte Bodytech abstößt, aber sie erweckt den Eindruck, dass dies der Fall ist – und das kann genauso fatal sein. Nimm einen Charakter ins Visier, der über mindestens ein Cyberware-Implantat verfügt, das seinen WiFi-Modus aktiviert hat – oder stell eine Direktverbindung zu einem Ziel her, das über Cyberware verfügt, die nicht im WiFi-Modus läuft. Wenn du versuchst, diese Komplexe Form bei einem Ziel einzusetzen, das keine anfällige Cyberware hat, hast du deine Handlung verschwendet. Je mehr Bodytech ein Ziel hat, desto verwundbarer ist es. Leg eine Probe auf Elektronik + Resonanz gegen Konstitution + Essenz (abgerundet) des Ziels ab. Hat das Ziel seine Cyberware in ein PAN eingebunden, erhält es für seine Probe einen Würfelpoolbonus in Höhe der Firewall des PANs. Für jeden Nettoerfolg erleidet das Ziel 1 Kästchen Körperlichen Schaden (dem es mit Konstitution widerstehen kann), und seine gesamte Cyberware schaltet sich für 1 Kampfrunde ab. Diese Komplexe Form ist mit dem Echo Auralink (S. 68) kompatibel.
complexform.data_bomb_eater=Datenbomben-Fresser
complexform.data_bomb_eater.page=65
complexform.data_bomb_eater.desc=Wenn du diese Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du eine Datenbombe zündest, während du diese Form aufrechterhältst, wird die Stufe der Datenbombe um die Anzahl deiner Erfolge gesenkt. Wenn die Stufe der Datenbombe dadurch auf null oder weniger gesenkt wird, wird sie von der Resonanz verschluckt – in diesem Fall bleibt die Datei, die durch die Datenbombe geschützt wurde, unversehrt. Wenn ein Datenbombenfresser auf eine Datenbombe trifft, bricht die Komplexe Form zusammen und endet.
complexform.data_disguise=Datenmaskierung
complexform.data_disguise.page=65
complexform.data_disguise.desc=Du kannst diese Komplexe Form verwenden, um ein beliebiges Icon zu maskieren und es als etwas anderes erscheinen zu lassen. Du kannst die Art des Icons verändern, zum Beispiel Persona, Gerät, IC, Datei, Sprite, KI oder alles andere, was dir einfällt. Du kannst auch falsche Matrixattribute darstellen oder sogar den Anschein erwecken, dass eine bestimmte Software läuft. Nimm ein Icon ins Visier, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Immer, wenn das maskierte Icon zum Ziel einer Matrixwahrnehmungs-Probe wird, wird das Ergebnis dieser Probe nur die Informationen aus deiner Maskierung an-zeigen – es sei denn, die Anzahl der Erfolge der Matrixwahrnehmungs-Probe übersteigt die Anzahl der Erfolge, die du bei der Elektronik-Probe erzielt hast. In diesem Fall durchschaut der Wahrnehmende die Maskierung und sieht die wahren Eigenschaften des Icons. Diese Komplexe Form kann auch verwendet werden, um den Anschein zu erwecken, dass ein Gerät, auf dem keine Persona läuft (z. B. ein Ersatz-Kommlink), aktiv eine Persona laufen lässt.
complexform.enhance_autosoft=Autosoft-Verbesserung
complexform.enhance_autosoft.page=64
complexform.enhance_autosoft.desc=Nimm ein Gerät ins Visier, das zumindest theoretisch in der Lage ist, eine Autosoft auszuführen, und leg eine Probe auf Elektronik + Resonanz ab. Addiere für jeweils 2 Erfolge einen Bonuswürfel, wenn eine Probe mit einer auf dem Gerät laufenden Autosoft abgelegt wird, während diese Komplexe Form aufrechterhalten wird.
complexform.enlighten_automaton=Automat Erleuchten
complexform.enlighten_automaton.page=63
complexform.enlighten_automaton.desc=Nimm ein Gerät mit einer Pilotstufe ins Visier, in das derzeit niemand hineingesprungen ist, und leg eine Probe auf Elektronik + Resonanz ab. Du kannst entweder die Pilot- oder die Sensorstufe des Ziels um deine Erfolge erhöhen, und du kannst deine Erfolge zwischen Pilot und Sensor aufteilen, wenn du willst. Sowohl Pilot als auch Sensor können höchstens auf das Doppelte ihrer ursprünglichen Stufe erhöht werden. Geräte scheinen unter der Wirkung dieser Komplexen Form viel wacher, aktiver und aufmerksamer zu sein. Ihnen gelingt automatisch jede Probe, um komplexe Aufträge zu verstehen oder auf chaotische Situationen zu reagieren. Manchmal sind sie auch etwas eigenwillig und müssen überzeugt werden, ihre Befehle auszuführen. Wenn ein Gerät, das unter der Wirkung dieser Komplexen Form steht, einen Patzer oder Kritischen Patzer erzielt, musst du eine Probe auf Überreden + Charisma oder Einfluss + Charisma ablegen, um es zu überzeugen, seinen Befehlen zu folgen. Dafür musst du eine Haupthandlung ausgeben, und der Schwellenwert dieser Probe ist gleich der Anzahl der Punkte, um die Pilot- und Sensorstufe erhöht wurden. Du kannst dies so oft wie nötig versuchen, aber solange das Gerät nicht überzeugt wird, wird es keine weiteren Handlungen ausführen. Wenn du aufhörst, <i>Automat Erleuchten</i> aufrechtzuerhalten, kehrt das Gerät zu seinem normalen Verhalten zurück.
complexform.host_emulator=Host-Emulator
complexform.host_emulator.page=65
complexform.host_emulator.desc=Nimm eine Persona oder ein IC, die sich in einem Host befinden, ins Visier und leg eine Probe auf Elektronik + Resonanz gegen Intuition + Firewall (oder Hoststufe x 2) ab. Wenn du Nettoerfolge erzielst, werden die Persona oder das IC dazu gebracht, mit einer Illusion des Hosts zu interagieren, in dem sie oder es sich befinden. Die nächsten Matrixhandlungen des Ziels misslingen automatisch, solange die Form aufrechterhalten wird, aber das Ziel wird glauben, dass sie gelungen sind. Diese Illusion kann nur so lange aufrechterhalten werden, bis Fehlerprüfsysteme oder die eigene Intuition des Ziels es dazu bringen, sich zu befreien. Wenn das Ziel eine Matrixhandlung wegen Host-Emulator verliert und mehr Erfolge erzielt, als du Nettoerfolge bei deiner Elektronik-Probe erzielt hast, bricht die Komplexe Form zusammen und endet. Die Matrixhandlung schlägt immer noch fehl, aber das Ziel merkt, dass sie fehlgeschlagen ist.
complexform.ic_pick=IC Hacke
complexform.ic_pick.page=65
complexform.ic_pick.desc=Nimm ein IC ins Visier, das auf einem Host läuft, und leg eine Probe auf Elektronik + Resonanz gegen Hoststufe x 2 ab. Gelingt die Probe, erleidet das IC Matrixschaden in Höhe deines Angriffsattributs plus der Nettoerfolge aus dieser Probe. Wenn du das IC mit dieser Komplexen Form zum Absturz bringst, wechselt ihre Dauer zu Aufrechterhalten. Solange du die Komplexe Form aufrechterhältst, kann der Host keine weitere Instanz des IC-Typs starten, den du zum Absturz gebracht hast.
complexform.machine_merge=Maschinenverschmelzung
complexform.machine_merge.page=67
complexform.machine_merge.desc=Nimm einen Charakter mit einer Riggerkontrolle (oder einem äquivalenten Echo) ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange diese Komplexe Form aufrechterhalten wird, erhält das Ziel für jeweils 2 Erfolge einen Würfelpoolbonus von +1 auf Steuern-, Mechanik- und Verteidigungsproben, während es in ein Fahrzeug oder eine Drohne hineingesprungen ist. Dieser Bonus gilt nur für Proben, die zum Betrieb des Fahrzeugs oder der Drohne und ihrer Systeme ab-gelegt werden.
complexform.marionette=Marionette
complexform.marionette.page=66
complexform.marionette.desc=Diese Komplexe Form ist der schlimmste Albtraum eines Straßensamurai, denn sie ermöglicht es einem Technomancer, durch die Cyberware eines Ziels die Kontrolle über dessen Körper zu übernehmen. Um für diese Komplexe Form anfällig zu sein, muss ein Ziel mindestens ein Bodyware-Implantat oder eine Cybergliedmaße besitzen, das oder die (nach Maßgabe der Spielleitung) mit seinem Nervensystem verbunden ist. Inerte Cyberware wie Kompositknochen, Dermalpanzerung und Schmuggelfächer zählen nicht dazu, Reflexbooster, Reaktionsverbesserung und Talentleitungen hingegen schon. Das Ausschalten des WiFi-Modus bietet einen gewissen Schutz gegen diese Komplexe Form; um sie in diesem Fall zu verwenden, muss der Technomancer die Ziele in seinem Blickfeld halten und das Echo Auralink haben. Ziele, die ihre Bodytech im WiFi-Modus betreiben, sind auch über die Matrix angreifbar, wofür keine physische Sichtverbindung erforderlich ist. Um diese Komplexe Form gegen ein Ziel einzusetzen, leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall des Ziels ab. Gelingt die Probe, notiere dir deine Nettoerfolge. Du kannst weitere Handlungen verwenden, um den Körper des Ziels direkt zu kontrollieren. Wenn es nur eine Cybergliedmaße hat, kannst du nur Handlungen ausführen, um seine Cybergliedmaße zu kontrollieren, aber die meisten Bodyware-Implantate erlauben die Kontrolle über den gesamten Körper des Ziels. Für jede Haupt- bzw. Nebenhandlung, zu der du das Ziel zwingst, musst du eine entsprechende eigene Haupt- bzw. Nebenhandlung ausgeben. Diese Handlung muss eine körperliche Handlung sein, zu der das Ziel körperlich in der Lage ist – sein Verstand und seine Emotionen sind davon nicht betroffen. Jedes Mal, wenn du dein Ziel zu einer Handlung zwingst, senkst du die Anzahl deiner Nettoerfolge um 1. Wenn du alle deine Nettoerfolge aufgebraucht hast oder wenn du die Komplexe Form nicht mehr aufrechterhältst, bricht sie zusammen und endet. <br/>Wenn das Ziel eine Handlung ausführt, die eine Probe erfordert, verwendet es seinen normalen Würfelpool, darf für die Probe aber kein Edge erhalten oder ausgeben. Diese Komplexe Form hindert das Ziel nicht daran, sich aus eigenem Antrieb zu bewegen. Bei seinem eigenen Zug kann das Ziel seine eigenen Handlungen ausführen. Du kannst ein Ziel mit dieser Komplexen Form zwar zu Handlungen zwingen, die seinem Wohlergehen eindeutig abträglich sind, wie zum Beispiel sich selbst anzugreifen, von einer nahe gelegenen Anhöhe zu springen usw., aber es ist keine Soforttötung. Wenn du ein Ziel dazu zwingst, sich selbst zu verletzen, erleidet es den Grundschaden der Waffe, die es benutzt, ohne Probe, um zu treffen oder den Schaden durch Nettoerfolge zu erhöhen. Im Falle eines Sturzes hat das Ziel die Chance, sich mit einer Probe auf Athletik + Geschicklichkeit an einem Vorsprung oder Ähnlichem festzuhalten. Diese Komplexe Form sollte es nicht erlauben, jemanden automatisch umzubringen, sie kann aber einen entscheidenden taktischen Vorteil bieten. Selbst für Kriminelle ist der Gedanke, jemanden zu zwingen, sich mit einer solchen Macht selbst zu verletzen, entsetzlich. Jedes Mal, wenn du diese Komplexe Form verwendest, um ein Ziel dazu zu bringen, sich selbst zu verletzen, addierst du am Ende des Runs +1 zum Fahndungsstufen-Modifikator deines Teams.<br/>Beachte, dass du diese Komplexe Form auch gegen bzw. für ein freiwilliges Ziel einsetzen kannst, um ihm zusätzliche Handlungen zu ermöglichen. Allerdings ist keine Bodytech darauf ausgelegt, dass man sie auf diese Weise einsetzt, also muss das Ziel immer noch würfeln, um zu widerstehen. Wenn du diese Komplexe Form bei einem Ziel mit dessen Einverständnis anwendest, erhältst du 1 Edge, das für die Elektronik-Probe ausgegeben werden muss und ansonsten verloren geht. Selbst wenn du diese Komplexe Form unter solchen Umständen verwendest, kann das Ziel bei Handlungen, die durch Marionette erzwungen werden, Edge weder erhalten noch ausgeben.
complexform.primed_charge=Resonanzladung
complexform.primed_charge.page=67
complexform.primed_charge.desc=Indem du die rohe Kraft der Resonanz durch deine lebende Persona kanalisierst, kannst du eine Matrixhandlung gewaltig verstärken. Wenn du diese Komplexe Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du das nächste Mal eine Matrixhandlung durchführst oder eine Komplexe Form webst, erhältst du für jeweils 2 Erfolge, die du bei deiner Elektronik-Probe erzielt hast, 1 Edge. Du kannst auf diese Weise mehr als 2 Edge erhalten, aber nachdem deine Matrixhandlung oder deine Komplexe Form abgewickelt wurde (einschließlich der Abwicklung des Schwundschadens), verlierst du all dein verbleibendes Edge – auch Edge, das du nicht durch diese Komplexe Form erhalten hast. Edge, das in einem separaten Pool gespeichert wird, wie etwa in einem M-TOC oder einem Verfolgungspool, ist davon nicht betroffen. Du darfst Resonanzladung nicht verwenden, wenn dein Edge-Pool leer ist.
complexform.resonance_wires=Resonanzkabel
complexform.resonance_wires.page=67
complexform.resonance_wires.desc=Der ultimative Schutz, der wirksamer ist als jede Firewall, besteht darin, den WiFi-Modus vollständig zu deaktivieren, sodass man für feindliche Matrixhandlungen unverwundbar ist. Aber Technomancer haben einige Lösungen für dieses Problem parat. Um diese Komplexe Form zu verwenden, nimm ein Gerät oder einen Charakter ins Visier, das oder den du sehen kannst, und leg eine Probe auf Elektronik + Resonanz mit einem Schwellenwert von 2 plus Rauschen (falls vorhanden) ab. Gelingt die Probe, stellst du eine direkte Fernverbindung zum Gerät her. Wenn dein Ziel ein Charakter war, hast du eine Direktverbindung zu allen Geräten dieses Charakters – auch zu denen, die ausgeschaltet sind. Das Einzige, was du mit einem ausgeschalteten Gerät tun kannst, ist, es wieder einzuschalten (aber nur, wenn es grundsätzlich über eine WiFi-Funktionalität verfügt; Geräte, die überhaupt keine WiFi-Funktionalität haben, kannst du nicht beeinflussen). Du kannst diese Komplexe Form so lange aufrechterhalten, wie du das Ziel in deinem Blickfeld hast. Wenn du das Ziel länger aus deinem Blickfeld verlierst, als du zum Blinzeln brauchst, endet die Komplexe Form sofort.
complexform.restore_continuity=Kontinuität Wiederherstellen
complexform.restore_continuity.page=66
complexform.restore_continuity.desc=Diese Komplexe Form ermöglicht es dir, Matrixschaden bei Software zu heilen, einschließlich Fernagenten, künstlicher Intelligenzen, Matrixfauna und sogar IC. Leg eine Probe auf Elektronik + Resonanz ab. Pro Erfolg heilst du 1 Kästchen Matrixschaden an der Software. Diese Komplexe Form hat keine Auswirkungen auf Geräte und Sprites.
complexform.search_history=Chronik
complexform.search_history.page=64
complexform.search_history.desc=Wenn du ein Gerät mit dieser Komplexen Form ins Visier nimmst, leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft (oder Gerätestufe) + Firewall ab. Wenn du Nettoerfolge erzielst, erhältst du sofort eine Liste aller Matrixhandlungen, die das Gerät in den letzten 24 Stunden oder seit dem letzten Neustart (je nachdem, was zuletzt eintrat) durchgeführt hat. Zu den Ergebnissen der Matrixhandlungen werden keine Angaben gemacht, aber die Ziele des Matrixgeräts werden aufgezeichnet. Nur Ziele, die vom Gerät identifiziert und erkannt wurden, werden mit dieser Komplexen Form angezeigt.
complexform.sleaze_attribution=Schleicherzuteilung
complexform.sleaze_attribution.page=67
complexform.sleaze_attribution.desc=Nimm eine freiwillige Persona ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange du diese Form aufrechterhältst, erhält das Ziel ein Schleicher-Matrixattribut mit einer Stufe gleich der Anzahl der Erfolge bei deiner Elektronik-Probe. Wenn das Ziel bereits ein niedrigeres Schleicherattribut hatte, wird es durch das Schleicherattribut dieser Form ersetzt. Ein Ziel, das unter der Wirkung von Schleicherzuteilung steht, kann nicht zum Ziel einer Komplexen Form Schleicher-Steigerung werden. Diese Persona kann jetzt illegale Matrixhandlungen durchführen, die nicht mit dem Attribut Angriff verbunden sind.
complexform.smartgun_amplifier=Smartgun-Verstärker
complexform.smartgun_amplifier.page=67
complexform.smartgun_amplifier.desc=Diese Komplexe Form verstärkt und verbessert Waffensysteme. Nimm entweder eine einzelne mit einem Smartgunsystem ausgestattete Waffe oder ein M-TOC ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Die Angriffswerte von Waffen, die mit dem M-TOC-Netzwerk (oder der Waffe) verbunden sind, werden um die Anzahl der Erfolge bei der Elektronik-Probe erhöht, solange die Form aufrechterhalten wird. Diese Komplexe Form wirkt nur bei Waffen, deren Smartgunsysteme im WiFi-Modus betrieben werden.
complexform.technoregeneration=Technoregeneration
complexform.technoregeneration.page=68
complexform.technoregeneration.desc=Diese Komplexe Form ist das Äquivalent eines Heilen-Zaubers für elektronische Geräte. Nimm ein Gerät ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Pro Erfolg wird 1 Kästchen Matrixschaden wiederhergestellt. Dies funktioniert nur bei Geräten, nicht bei IC, Sprites oder anderer Matrixfauna. Wenn ein Gerät durch diese Komplexe Form repariert wurde, neigt es dazu, launenhaft zu funktionieren. Wenn du eine Probe mit dem Gerät ablegst, ersetze einen der Probenwürfel durch einen Schicksalswürfel, bis eine gründlichere Wartung möglich ist (dies erfordert 1 Stunde Arbeit mit einer Elektronik-Werkzeugkiste). Solange diese Wartung nicht erfolgt ist, kann das Gerät nicht erneut mit Technoregeneration repariert werden.
complexform.threat_analyzer=Bedrohungsanalyse
complexform.threat_analyzer.page=64
complexform.threat_analyzer.desc=Diese Komplexe Form verstärkt die Algorithmen der Kampfabwehr eines M-TOCs. Nimm ein M-TOC ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Pro Erfolg erhöht sich der Verteidigungswert aller Charaktere und Drohnen, die Teil des M-TOC sind, um 1. Um diesen Bonus auf den Verteidigungswert zu erhalten, müssen Charaktere entweder ein DNI (eine Datenbuchse oder Troden genügen) oder eine Bildverbindung und ein Audiokommunikationsgerät besitzen, damit sie das AR-Overlay des M-TOC sehen und hören können.
complexform.unravel_encryption=Verschlüsselung Auftrennen
complexform.unravel_encryption.page=68
complexform.unravel_encryption.desc=Mit dieser Komplexen Form kannst du die Verschlüsselung einer Datei entfernen, ohne deinen Overwatch-Wert zu erhöhen und, sofern du Erfolg hast, ohne einen Alarm auszulösen. Leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Verschlüsselungsstufe x 2 ab. Wenn du mindestens so viele Erfolge erzielst wie die Verschlüsselung, wird sie geräuschlos entfernt. Wenn die Verschlüsselung mindestens einen Nettoerfolg erzielt, werden der Host oder das Gerät alarmiert, dass jemand versucht, die Datei zu entschlüsseln. Dies verrät zwar nicht deine Persona, aber es versetzt einen Host oder ein Gerät in höchste Alarmbereitschaft.

#Echos
metaecho.aura_link=Auralink
metaecho.aura_link.page=67
metaecho.aura_link.desc=Du musst das Echo Skinlink haben, um dieses Echo erwerben zu können. Du kannst dich drahtlos mit Geräten verbinden, als ob du eine Direktverbindung nutzen würdest, allerdings nur innerhalb einer begrenzten Reichweite. Die Reichweite deines Auralinks entspricht einem Radius um deinen physischen Körper in Höhe von [Wandlungsgrad] Metern, und es kann unter der Wirkung von Rauschen leiden. Du musst das Ziel in der physischen Welt, in der AR oder in der VR sehen können, damit dieses Echo funktioniert.
metaecho.cyberadept=Cyberadept
metaecho.cyberadept.page=68
metaecho.cyberadept.desc=Du hast gelernt, dass deine Bodytech durch deine Verbindung mit der Resonanz beeinflusst werden kann. Wenn du dieses Echo erwirbst, schaltet dies den emotionalen Pfad des Cyberadepten (S. 87) frei.
metaecho.data_structure_encoding=Datenstrukturkodierung
metaecho.data_structure_encoding.page=68
metaecho.data_structure_encoding.desc=Du musst das Echo Skinlink haben, um dieses Echo erwerben zu können. Du hast gelernt, geschichtete Faltungen von Matrix- und Resonanzinformationen in physische Objekte zu kodieren, um physische Datenstrukturen (S. 70) zu schaffen. Das ist nützlich, um eine Datei in einer Form zu verstecken, auf die nur jemand mit diesem Echo zugreifen kann, aber du hast auch gelernt, Datenstrukturen zu erstellen, die mit Aspekten der Resonanz harmonieren und diese verstärken. Kurz gesagt kannst du mit diesem Echo Gegenstände erschaffen und integrieren, die Technomancern auf ähnliche Weise zugutekommen, wie Zauberern Foki helfen.
metaecho.dissonant_scream=Dissonanzschrei
metaecho.dissonant_scream.page=68
metaecho.dissonant_scream.desc=Wir pfuschen also an der Dissonanz herum, wie? Wenn du dieses Echo erwirbst, macht dich das noch nicht zu einem dissonanten Technomancer, aber diese Unterscheidung ist vielleicht nicht jedem klar, der Zeuge wird, wie du es benutzt. Du bist in der Lage, Resonanzenergie zu kanalisieren und zu streuen, um eine lärmende, störende Welle zu erzeugen, die Matrixaktivitäten beeinträchtigt. Um dieses Echo zu aktivieren, musst du eine Haupthandlung ausgeben und eine Probe auf Resonanz + Wandlungsgrad ablegen. Pro Erfolg erhöht sich das Matrixrauschen im Umkreis von 100 Metern um deinen physischen Körper um 1. Auch du stehst unter der Wirkung dieses Rauschens. Keine Form der Rauschunterdrückung hat einen Einfluss auf das von diesem Echo erzeugte Rauschen. Am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, erleidest du Schwund mit einem Schwundwert in Höhe der aufeinanderfolgenden Kampfrunden, in denen das Echo aktiv war. Dein Overwatch-Wert erhöht sich am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, um die Anzahl der Erfolge, die du bei deiner Probe auf Resonanz + Wandlungsgrad erzielt hast. Die Deaktivierung dieses Echos erfordert eine Nebenhandlung, aber es deaktiviert sich automatisch, wenn du bewusstlos wirst. Nachdem du dieses Echo aktiviert hast, darfst du es erst wieder aktivieren, wenn du dich von jeglichem Schwundschaden erholt hast. Wenn du bei der Verwendung dieses Echos von jemandem außerhalb deines eigenen Teams beobachtet wirst, addiere am Ende des Runs +1 zum Fahndungsstufen-Modifikator.
metaecho.hybrid_sprites=Hybridsprites
metaecho.hybrid_sprites.page=68
metaecho.hybrid_sprites.desc=Wenn du ein Sprite kompilierst, kannst du der Verwendung dieses Echos Nettoerfolge zuweisen (statt diese Nettoerfolge zu verwenden, um weitere Aufgaben für das Sprite hinzuzufügen). Für jeden Nettoerfolg, den du auf diese Weise zuweist, kannst du dem Sprite eine Fertigkeit oder Kraft verleihen, die normalerweise nur einer anderen Art von Sprite zur Verfügung steht, die du kompilieren kannst.
metaecho.living_command_console=Lebende Riggerkonsole
metaecho.living_command_console.page=68
metaecho.living_command_console.desc=Du musst die Echos Maschinenbeherrschung und Lebendes Netzwerk haben, um dieses Echo erwerben zu können. Dein Lebendes Netzwerk kann jetzt als Riggerkonsole mit einer effektiven Gerätestufe gleich deinem Resonanzattribut funktionieren. Du kannst nur Autosofts ausführen und teilen, die auf deiner lebenden Persona ausgeführt werden.
metaecho.living_host=Lebender Host
metaecho.living_host.page=68
metaecho.living_host.desc=Du musst das Echo Transzendentes Netzwerk haben, um dieses Echo erwerben zu können. Wenn du einige Zeit in tiefer Konzentration verbringst und das sammelst und formst, was sich nur als Resonanzkraft bezeichnen lässt, kannst du deine lebende Persona in das Äquivalent eines Hosts verwandeln. Das erfordert eine Ausgedehnte Probe auf Tasken + Resonanz mit einem Schwellenwert gleich deinem Resonanzattribut und einem Intervall von 1 Stunde. Sobald die Probe abgeschlossen ist, wirst du zu einem lebenden Host innerhalb der Matrix. Nur ein Technomancer, Sprite, Resonanz- oder Dissonanzwesen, der oder das bei einer Matrixwahrnehmungs-Probe mindestens einen Nettoerfolg erzielt, erkennt, dass du kein echter Matrix-Host bist. Während dieses Echo aktiv ist, hast du eine Hoststufe gleich deinem Resonanzattribut, und deine Matrixattribute sind die gleichen wie die deiner lebenden Persona. Die Anzahl der Geräte, die mit dir verbunden werden können, erhöht sich auf deine Hoststufe x 10, und du erhältst alle Vorteile deines Echos Transzendentes Netzwerk. Du kannst eine praktisch unbegrenzte Anzahl virtueller Räume erschaffen, die jedoch alle auf irgendeine Weise miteinander verbunden sein müssen. Personas können auf dich genauso zugreifen wie auf einen Host, entweder mit deiner Erlaubnis oder indem sie dich hacken. Du kannst eine praktisch unbegrenzte Menge an Daten speichern, aber auf Dateien, die du auf deinen lebenden Host hochlädst, kannst du nur zugreifen, solange du dieses Echo aktiviert hast. <br/>Du kannst das Aussehen und die Architektur deines lebenden Hosts nach Belieben verändern und sogar das Aussehen eines anderen Hosts imitieren, den du besucht hast. Während dieses Echo aktiv ist, kannst du nicht von Matrixhandlungen, Komplexen Formen oder Sprite-Kräften angegriffen werden, außer als Host. Das bedeutet, dass du gegen eine Vielzahl von Handlungen unverwundbar bist, die normalerweise auf eine Persona abzielen, wie zum Beispiel <i>Datenspike</i> oder <i>Resonanzspike</i>. Du musst einen Zustand tiefer Konzentration aufrechterhalten und am selben physischen Ort bleiben, während du dieses Echo aufrechterhältst. Wenn du durch einen einzigen Angriff mehr Kästchen Betäubungs- oder Körperlichen Schaden erleidest, als deine Willenskraft beträgt, oder wenn du physisch um mehr als einen Meter von deinem Standort wegbewegt wirst, wird deine Konzentration gestört und dein lebender Host fällt in sich zusammen. Dadurch erleidest du 6 Kästchen Körperlichen Biofeedback-Schaden und einen Auswurfschock. Alle Geräte werden getrennt, und jeder, der sich in der VR im Host aufhält, erleidet ebenfalls einen Auswurfschock. Wenn du deinen lebenden Host abschalten willst, ohne Auswurfschock zu erleiden, muss dir eine Ausgedehnte Probe auf Tasken + Resonanz mit einem Schwellenwert gleich deiner Hoststufe und einem Intervall von 1 Haupthandlung gelingen. Ein Kritischer Patzer bei dieser Probe verursacht Auswurfschock. Du bist nicht in der Lage, IC auszuführen, aber Kopf hoch – du hast Sprites. Da du kein echter Host bist, verfügst du nicht über ein eigenes Fundament. Niemand weiß genau, was passieren würde, wenn jemand durch einen lebenden Host eine Tür zum Fundament finden würde. Einige glauben, dass sie zu einem Resonanzraum führen könnte, aber falls schon mal jemand versucht hat, das herauszufinden, ist er entweder gescheitert oder spricht nicht darüber.
metaecho.machine_mastermind=Meister der Maschinen
metaecho.machine_mastermind.page=69
metaecho.machine_mastermind.desc=Du musst das Echo Maschinenbeherrschung haben, um dieses Echo erwerben zu können. Du erhältst die Vorteile einer Riggerkontrolle der Stufe 2. Dieses Echo kann nur einmal gewählt werden.
metaecho.matrix_amplifier=Matrixverstärker
metaecho.matrix_amplifier.page=69
metaecho.matrix_amplifier.desc=Wenn du eine Haupthandlung ausgibst, um dieses Echo zu aktivieren, wirst du zu einem lebenden Resonanzkanal, der die örtlichen Matrixverbindungen verstärkt. Deine lebende Persona und jedes Gerät im Umkreis von 100 Metern um deinen physischen Körper erhält eine Anzahl von Punkten zur Rauschunterdrückung gleich deinem Wandlungsgrad. Das ist allerdings unglaublich anstrengend für dich. Am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, erleidest du Schwund mit einem Schwundwert in Höhe der aufeinanderfolgenden Kampfrunden, in denen das Echo aktiv war. Um das Echo wieder auszuschalten, ist eine Nebenhandlung erforderlich, die jedoch automatisch erfolgt, wenn du bewusstlos wirst. Dieses Echo alarmiert auch GOD. Dein Overwatch-Wert erhöht sich am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, um deinen Wandlungsgrad. Nachdem du dieses Echo aktiviert hast, darfst du es erst wieder aktivieren, wenn du dich von jeglichem Schwundschaden erholt hast.
metaecho.mega-sprite=Mega-Sprite
metaecho.mega-sprite.page=69
metaecho.mega-sprite.desc=Du erhältst die Möglichkeit, ein registriertes Sprite zu verbessern. Dies erfordert einen speziellen Neuregistrierungsversuch. Gelingt der Versuch, gewähren Nettoerfolge keine zusätzlichen Aufgaben. Stattdessen kannst du mit jedem Nettoerfolg entweder eines der Matrixattribute des Sprites um 1 erhöhen oder das Sprite mit einer zusätzlichen Spritekraft ausstatten, die normalerweise nur für eine andere Art von Sprite verfügbar ist. Du kannst auch vorübergehend ein Verbündeten- oder freies Sprite verbessern. Wenn du dieses Echo bei einem freien Sprite oder einem Verbündetensprite einsetzt, musst du seinen Quellcode kennen, und die Wirkung hält für eine Anzahl von Stunden gleich deinem Resonanzattribut an. Wenn du das Echo bei deinen eigenen registrierten Sprites anwendest, bleibt es so lange aktiv, bis du zum nächsten Mal versuchst, das Sprite neu zu registrieren. Nur eine Anwendung dieses Echos kann auf ein Sprite gleichzeitig wirken. Meister der Maschinen: Du musst das Echo Maschinenbeherrschung haben, um dieses Echo erwerben zu können. Du erhältst die Vorteile einer Riggerkontrolle der Stufe 2. Dieses Echo kann nur einmal gewählt werden.
metaecho.new_sprite_type=Neue Sprite-Art
metaecho.new_sprite_type.page=69
metaecho.new_sprite_type.desc=Du erhältst die Fähigkeit, Assassinen-, Modular-, Musik-, Ur- und Verteidiger-Sprites zu kompilieren und zu registrieren (s. Neue Sprite-Arten, S. 73).
metaecho.resonance_power=Resonanzkraft
metaecho.resonance_power.page=69
metaecho.resonance_power.desc=Du hast etwas aus der Tiefenresonanz gelernt, das dir erlaubt, eine einzelne Spritekraft einzusetzen. Du musst eine Spritekraft festlegen, wenn du dieses Echo erwirbst, und sie kann danach nicht geändert werden. Du kannst dieses Echo mehrmals erwerben, wobei du jedes Mal eine andere Spritekraft wählen musst. Verwende dein Resonanzattribut anstelle der Spritestufe, falls zutreffend. Unmittelbar nach dem Einsatz einer Spritekraft musst du Schwund mit einem Schwundwert gleich der Anzahl der Erfolge widerstehen, die du bei der Probe zum Einsatz der Kraft erzielt hast. Wenn keine Probe erforderlich ist, um die Kraft zu nutzen, beträgt der Schwundwert 3.
metaecho.software_emulator=Software-Emulator
metaecho.software_emulator.page=69
metaecho.software_emulator.desc=Du musst das Echo Lebendes Netzwerk besitzen, um dieses Echo erwerben zu können. Du bist in der Lage, Kommlink-Apps, Matrixprogramme und Autosofts auf deiner lebenden Persona auszuführen. Du hast [Resonanz/2] Programmslots. Die maximale Stufe jedes Programms, das du ausführen kannst, ist 6, und du kannst auf deinem lebenden Netzwerk keinen Agenten laufen lassen. Bevor du ein Programm emulieren kannst, musst du eine Kopie des Programms erwerben, um es zu absorbieren. Das Absorbieren eines Programms verbraucht es und führt zu seiner vollständigen Löschung. Dies erfordert eine Ausgedehnte Probe auf Elektronik (Software) + Logik mit einem Schwellenwert von 4 oder gleich der Stufe des Programms, je nachdem, welcher Wert höher ist, und einem Intervall von 1 Stunde. Misslingt die Probe, kannst du es erneut versuchen. Ein Patzer erhöht den Schwellenwert um 2. Ein Kritischer Patzer führt sowohl zum Misslingen als auch zur Löschung des Programms. Gelingt die Probe, kannst du 1 Karma ausgeben, um den Code in dich aufzunehmen. Danach kannst du ihn jederzeit ausführen. Er kann abstürzen, aber du kannst ihn jederzeit mit einer Nebenhandlung neu laden. Diese Programme können nie dauerhaft aus deinem Gedächtnis gelöscht werden. Die Anzahl der Programme, die du auf diese Weise "lernen" kannst, ist unbegrenzt.
metaecho.sprite_conduit=Spriteleitung
metaecho.sprite_conduit.page=69
metaecho.sprite_conduit.desc=Du bist in der Lage, tiefe Bindungen mit Sprites einzugehen, und durch diese Bindungen hilfst du ihnen, sich in einer dauerhafteren Form zu registrieren. Du kannst Sprites mit großem Karma- und Zeitaufwand dauerhaft registrieren. Wenn du das tust, kannst du entweder ein freies Sprite oder ein Verbündetensprite erschaffen. Die Regeln dafür finden sich im Kapitel Sprites (S. 78). Du erhältst auf alle Schwundwiderstandsproben durch das Kompilieren und Registrieren von Sprites einen Würfelpoolbonus in Höhe deines Wandlungsgrads.
metaecho.sprite_link=Spriteverbindung
metaecho.sprite_link.page=70
metaecho.sprite_link.desc=Dein Geist ist enger mit deinen Sprites verbunden, sodass sie deine Befehle besser verstehen können. Wenn du eine Aufgabe und eine Nebenhandlung ausgibst, um einem Sprite zu befehlen, dir bei einer Teamwork-Probe mit einer seiner Fertigkeiten zu helfen, erhältst du eine zusätzliche Nebenhandlung. Mit einer Jederzeit-Nebenhandlung und dem Einsatz einer Aufgabe kannst du Schwundschaden, den du erleiden würdest, auf eines deiner Sprites übertragen. Du kannst zuerst versuchen, dem Schwund zu widerstehen, und dann so viele Kästchen nicht widerstandenen Schaden auf das Sprite übertragen, wie du willst. Deine Sprite-Reputation sinkt jedes Mal um 1, wenn du das tust.
metaecho.sprite_symbiosis=Spritesymbiose
metaecho.sprite_symbiosis.page=70
metaecho.sprite_symbiosis.desc=Du musst das Echo Spriteleitung haben, um dieses Echo erwerben zu können. Du kannst dein Verbündetensprite mit deiner Persona verschmelzen,um deine eigene Macht zu stärken. Die vollständigenRegeln dazu findest du im Kapitel Sprites (S. 80).
metaecho.syntax_error=Syntaxfehler
metaecho.syntax_error.page=70
metaecho.syntax_error.desc=Du hast die Geheimnisse der Bekämpfung und Auftrennung Komplexer Formen und Spritekräfte erlernt. Wenn du eine Matrixhandlung wahrnimmst, die auf ein Icon abzielt, das du ebenfalls wahrnimmst, kannst du eine Jederzeit-Nebenhandlung ausgeben, um dem Ziel Bonuswürfel in Höhe deines Wandlungsgrads für seine Verteidigungsprobe zu geben. Wenn du dir einer Komplexen Form oder Spritekraft bewusst bist, die aufrechterhalten wird, kannst du versuchen, sie zu schwächen oder abzubrechen. Leg eine Vergleichende Probe auf Elektronik + Resonanz + Wandlungsgrad gegen Logik + Resonanz (bei Sprites gegen Datenverarbeitung + Stufe) ab. Gelingt dir die Probe, senke die Nettoerfolge der Komplexen Form oder der Spritekraft um 1 pro Nettoerfolg. Wenn dadurch die Nettoerfolge der Komplexen Form oder Spritekraft auf null oder weniger gesenkt werden, endet die aufrechterhaltene Form oder Kraft sofort. Dafür musst du eine Haupthandlung ausgeben, und du erleidest nach jedem Versuch Schwundschaden in Höhe der Erfolge, die gegen dich bei der Vergleichenden Probe erzielt wurden (Gesamterfolge, nicht Nettoerfolge).
metaecho.transcendent_network=Transzendentes Netzwerk
metaecho.transcendent_network.page=70
metaecho.transcendent_network.desc=Du musst das Echo Lebendes Netzwerk haben, um dieses Echo erwerben zu können. Wenn deine lebende Persona als Master-Gerät in einem Netzwerk fungiert, fungierst du als fortschrittliche Leitung für Daten, die durch dich laufen, und bist in der Lage, Daten mit übermenschlicher Geschwindigkeit zu analysieren und zu verarbeiten. Auf diese Weise kann jeder, der an dein Netzwerk angeschlossen ist, vom Informationsaustausch profitieren, ähnlich wie bei einem M-TOC. Um von diesem Echo profitieren zu können, muss eine Person ihr Kommlink (oder ein anderes personaerzeugendes Gerät) mit deinem lebenden Netzwerk verbinden. Alle angeschlossenen Personen haben Zugang zu einem speziellen Edge-Pool in Höhe deines Wandlungsgrads. Dieser Edge-Pool ist leer, wenn er eingerichtet wird, aber jeder angeschlossene Charakter kann sein Edge jederzeit eins zu eins in ihn übertragen. Wenn ein angeschlossener Charakter einen Edge-Punkt erhält, ohne dass der Edge-Punkt auf die maximale Anzahl an Edge-Punkten angerechnet wird, die man in jeder Runde erhalten kann. Edge aus dem transzendenten Netzwerk kann für jeden Edge-Boost und jede Edge-Handlung verwendet werden, die einem Charakter zugutekommt, der mit dem Netzwerk verbunden ist. Wenn du auch über ein M-TOC-System verfügst, kannst du dieses zusammen mit den Vorteilen des transzendenten Netzwerks voll nutzen. Sie kollidieren nicht miteinander. Ein weiterer Vorteil dieses Echos ist, dass verbundene Charaktere, die die Handlung Nachricht übermitteln (eine Nebenhandlung) untereinander verwenden, unmittelbar danach eine zusätzliche Nebenhandlung erhalten. Dadurch entsteht bei den Nutzern oft der Eindruck, dass sie eine telepathische Verbindung haben.

#Data structures
datastructure.admonisher=Mahner
datastructure.admonisher.page=70
datastructure.admonisher.desc=Du erhältst Bonuswürfel für eine Probe zum Dekompilieren eines Sprites und für die darauffolgende Schwundwiderstandsprobe. Du erhältst 1 Edge, wenn du beim Versuch, ein Sprite zu dekompilieren, mindestens einen Nettoerfolg erzielst.
datastructure.bandersnatch=Bandersnatch
datastructure.bandersnatch.page=71
datastructure.bandersnatch.desc=Du erhältst Bonuswürfel für eine Handlung Befehl vortäuschen oder eine Komplexe Form Puppenspieler. Wenn du einen Bandersnatch auf eine Komplexe Form Puppenspieler anwendest, erhältst du außerdem Bonuswürfel für die Schwundwiderstandsprobe.
datastructure.code_shell=Codepanzer
datastructure.code_shell.page=72
datastructure.code_shell.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Probe, um Matrixschaden widerstehen. Wenn du Codepanzer gegen einen Daten- oder Resonanzspike einsetzt, erhältst du 1 Edge, wenn du dem gesamten Schaden widerstehst.
datastructure.data_blade=Datnklinge
datastructure.data_blade.page=72
datastructure.data_blade.desc=Du erhältst Bonuswürfel für eine Handlung Datenspike oder eine Komplexe Form Resonanzspike. Du erhältst 1 Edge, wenn du eine Persona oder ein IC abstürzen lässt, während du Datenklinge benutzt.
datastructure.drone_whisperer=Drohnenflüsterer
datastructure.drone_whisperer.page=72
datastructure.drone_whisperer.desc=Du erhältst Bonuswürfel für eine Matrixhandlung oder Komplexe Form, die eine Drohne zum Ziel hat. Immer, wenn du Drohnenflüsterer einsetzt, um eine Drohne lahmzulegen (d. h. ihren Matrix-Zustandsmonitor mit Schaden aufzufüllen) oder zu hacken (mit Brute Force, Sondieren oder Hintertür benutzen), und mindestens einen Nettoerfolg erzielst, erhältst du 1 Edge.
datastructure.eavesdropper=Lauscher
datastructure.eavesdropper.page=72
datastructure.eavesdropper.desc=Du erhältst Bonuswürfel für eine Handlung Übertragung abfangen oder eine Komplexe Form Signalschleier. Wenn du eine Handlung Übertragung abfangen ausführst, die von Lauscher profitiert, zählst du automatisch als jemand mit Admin-Zugang und erzeugst durch die Handlung Übertragung abfangen keinen Overwatch-Wert.
datastructure.echo_chamber=Echokammer
datastructure.echo_chamber.page=72
datastructure.echo_chamber.desc=Du erhältst Bonuswürfel für eine Probe zur Verwendung eines Echos.
Erdungsstab: Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Schwundwiderstandsprobe. Wenn du bei der Verwendung von Erdungsstab dem Schwundschaden vollständig widerstehst, erhältst du 1 Edge.
datastructure.extra_life=Extraleben
datastructure.extra_life.page=72
datastructure.extra_life.desc=Du erhältst Bonuswürfel für eine Probe, um Biofeedback-Schaden zu widerstehen. Wenn du dem gesamten Biofeedback-Schaden widerstehst, während du Extraleben einsetzt, erhältst du 1 Edge.
datastructure.grounding_rod=Erdungsstab
datastructure.grounding_rod.page=72
datastructure.grounding_rod.desc=
datastructure.logic_virus=Logikvirus
datastructure.logic_virus.page=72
datastructure.logic_virus.desc=Du erhältst Bonuswürfel für eine Matrixhandlung oder Komplexe Form, die ein IC zum Ziel hat. Erhalte 1 Edge, wenn du mindestens einen Nettoerfolg bei einer Matrixhandlung oder einer Komplexen Form erzielst, die du gegen IC einsetzt, aber nur, wenn du Logikvirus für diese Handlung aktivierst.
datastructure.link_light=Linklicht
datastructure.link_light.page=72
datastructure.link_light.desc=Du erhältst Bonuswürfel für eine Handlung Icon aufspüren und zählst für diese Handlung automatisch als jemand mit Admin-Zugang. Wenn du ein Persona-Icon mit Linklicht erfolgreich aufspürst, erhältst du 1 Edge.
datastructure.master_key=Generalschlüssel
datastructure.master_key.page=72
datastructure.master_key.desc=Du erhältst Bonuswürfel für eine Hacking-Handlung: Brute Force, Sondieren oder Hintertür benutzen. Du erhältst 1 Edge, wenn du mindestens einen Erfolg bei der Handlung erzielst, die von der Aktivierung eines Generalschlüssels profitiert.
datastructure.meat_cleaver=Fleischerbeil
datastructure.meat_cleaver.page=72
datastructure.meat_cleaver.desc=Du erhältst Bonuswürfel für eine Matrixhandlung Datenspike oder eine Komplexe Form Resonanzspike, die eine Persona im VR-Modus zum Ziel hat. Dein Ziel erleidet Biofeedback-Schaden – Körperlichen Schaden bei heißem Sim, Betäubungsschaden bei kaltem Sim – mit einem Schadenswert gleich deinem Angriffsattribut. Schaden von einem Fleischerbeil wird nicht durch Nettoerfolge erhöht. Wenn du mit einem Fleischerbeil Körperlichen Schaden oder Betäubungsschaden verursachst, erhältst du 1 Edge.
datastructure.oracle=Orakel
datastructure.oracle.page=72
datastructure.oracle.desc=Du erhältst Bonuswürfel für eine Matrixwahrnehmungs- oder Matrixsuche-Probe. Wenn du Orakel aktivierst, haben alle deine Ausgedehnten Proben auf Matrixsuche ein Intervall von 1 Minute.
datastructure.phase_shifter=Phasenschieber
datastructure.phase_shifter.page=72
datastructure.phase_shifter.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel, um einer IC-Handlung zu widerstehen. Wenn du mit einem Phasenschieber bei einer Vergleichenden Probe mehr Erfolge als das IC erzielst, erhältst du 1 Edge.
datastructure.resonance_focus=Resonanzfokus
datastructure.resonance_focus.page=72
datastructure.resonance_focus.desc=Du erhältst Bonuswürfel bei einer Probe, die dein Resonanzattribut verwendet. Die Karmakosten für die Integrierung eines Resonanzfokus sind doppelt so hoch wie normal.
datastructure.resonance_shield=Resonanzschild
datastructure.resonance_shield.page=72
datastructure.resonance_shield.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Verteidigungsprobe gegen die Handlung Datenspike oder die Komplexe Form Resonanzspike. Hilft nicht gegen IC oder andere Quellen von Matrixschaden. Wenn du nach der Aktivierung eines Resonanzschildes dem Schaden eines Datenspikes oder Resonanzspikes vollständig widerstehst, erhältst du 1 Edge.
datastructure.sprite_caller=Spriterufer
datastructure.sprite_caller.page=72
datastructure.sprite_caller.desc=Du erhältst Bonuswürfel bei einer Probe, um ein Sprite der festgelegten Art zu kompilieren oder zu registrieren. Wenn du mindestens einen Erfolg erzielst, während du Spriterufer verwendest, um ein Sprite zu kompilieren oder zu registrieren, erhältst du 1 Edge.

#Data structures
npc.assassin=Assassinen-Sprite
npc.assassin.page=73
npc.assassin.desc=Einige der rachsüchtigsten Technomancer haben gelernt, Sprites zu kompilieren, die zu ihrer Gesinnung passen. Diese Sprites sind verstohlen und gewalttätig und können Personas Biofeedback-Schaden zufügen, anstatt sie einfach nur abstürzen zu lassen.
npc.defender=Verteidiger-Sprite
npc.defender.page=74
npc.defender.desc=Verteidiger-Sprites eignen sich perfekt für die Rolle des Matrix-Überwachers. Sie sind hocheffektive Leibwächter, die andere vor Matrixbedrohungen schützen können.
npc.modular=Modular-Sprite
npc.modular.page=73
npc.modular.desc=Modular-Sprites sind äußerst vielseitig und können sich an jede gewünschte Aufgabe anpassen.
npc.music=Musik-Sprite
npc.music.page=74
npc.music.desc=Einige Technomancer betrachten die Resonanz als etwas, das der Harmonie dient, und verwenden Konzepte der Musik und der Kunst, um ihre Geheimnisse zu verstehen. Musik-Sprites sind künstlerisch und expressiv. Sie spiegeln die Erfahrungen und Perspektiven der Umgebung und der Wesen wider, denen sie begegnen.
npc.primal=Ur-Sprite
npc.primal.page=74
npc.primal.desc=Ur-Sprites sind chaotische und geheimnisvolle Wesen. Sie werden von Technomancern kompiliert, die ihren Geist darauf trainiert haben, ihren kompilierten Sprites fast nichts von sich selbst aufzuprägen, weil sie die wilde Matrix nicht durch metamenschliche Erwartungen "korrumpieren" wollen. Solche Sprites neigen dazu, bizarre Formen anzunehmen, die man nur schwer für längere Zeit ansehen kann, und sie kommunizieren mit ungewöhnlichen nonverbalen oder nicht textlichen Mitteln. Klassische Modemschreie scheinen bei ihnen sehr beliebt zu sein. Da sie auf diese undeutlichen Kommunikationstechniken angewiesen sind, kann es schwer sein, ihnen Befehle zu erteilen. Sie sind dafür bekannt, dass sie Anweisungen völlig zu ignorieren scheinen und die Dinge auf ihre eigene seltsame Art und Weise angehen – ob sie tatsächlich versuchen, Befehle zu befolgen, und dabei scheitern, oder ob sie einfach nur stur sind, lässt sich nicht feststellen. Es gibt jedoch auch andere als ideologische Gründe für das Kompilieren dieser Sprites. Ur-Sprites sind in der Regel ziemlich mächtig und fähig, sodass sie Drek erledigen – wenn sie tatsächlich einmal Befehle befolgen.

#Duplicates of core sprites to add new sprite actions
npc.courier=Kurier-Sprite
npc.courier.page=193
npc.courier.desc=Kurier-Sprites sind großartig für das sichere Übermitteln von Nachrichten und für Überwachungsaufgaben geeignet.
npc.crack=Infiltrator-Sprite
npc.crack.page=193
npc.crack.desc=Wenn du ein leises Sprite suchst, das sich unauffällig bewegen kann, ist dieses hier genau das Richtige.
npc.data=Daten-Sprite
npc.data.page=193
npc.data.desc=Datensprites sind Meister des Findens und Manipulierens von Daten. Sie sind großartige Bibliothekare, Suchbots und Quizchampions.
npc.fault=Stör-Sprite
npc.fault.page=193
npc.fault.desc=Das Stör-Sprite hat man gern im Kampf an der Seite. Es ist kalt wie IC, doppelt so stur und zerfetzt deine Feinde im Aufblitzen eines Icons.
npc.machine=Machinen-Sprite
npc.machine.page=193
npc.machine.desc=Das Maschinen-Sprite interagiert von allen Sprites am wahrscheinlichsten mit der physischen Welt, wenn auch nur durch Geräte. Maschinen-Sprites sind Experten aller Art von Elektronik.

#Qualities
quality.at_home_in_the_matrix=In der Matrix zu Hause
quality.at_home_in_the_matrix.page=84
quality.at_home_in_the_matrix.desc=Du fühlst dich in der Matrix wirklich zu Hause, als wärst du dort geboren. <br/>Wenn du in der VR heißes Sim verwendest, kannst du pro Kampfrunde 1 Edge mehr als normal erhalten. Normalerweise können Charaktere maximal 2 Edge pro Runde erhalten.
quality.brilliant_heuristics=Brilliante Heuristik
quality.brilliant_heuristics.page=81
quality.brilliant_heuristics.desc=Du hast eine besondere Gabe dafür, deine Rechenleistung effizient zu bündeln. <br/>Auswirkung: Wenn du eine Nebenhandlung ausgibst, um deine verfügbare Rechenleistung vorzubereiten und zu kalibrieren, bevor du eine Matrixhandlung durch-führst, füge die (aufgerundete) Hälfte deines Attributs Datenverarbeitung als Bonuswürfel zur Probe der Ma-trixhandlung hinzu. Wenn du danach nicht sofort eine Matrixhandlung ausführst, geht der Bonus verloren. Dieser Vorteil kann nur von einer Persona verwendet werden, die auf einem Cyberdeck läuft.
quality.data_anomaly=Datenanomalie
quality.data_anomaly.page=82
quality.data_anomaly.desc=Wenn du in der Matrix nicht auffallen willst, kennst du ein paar zusätzliche Tricks, die dir helfen, verborgen zu bleiben. <br/>Auswirkung: Wenn du auf Schleichfahrt läufst, erhältst du 1 Edge, wenn eine Matrixwahrnehmungs-Probe abgelegt wird, um dich oder ein Icon in deinem Netzwerk zu entdecken.
quality.datahaven_membership=Datahaven-Mitgliedschaft
quality.datahaven_membership.page=82
quality.datahaven_membership.desc=Du hast Zugang zu ein paar Datahavens und bist dort regelmäßig präsent. Dein Benutzername ist dort bekannt. Von vielen wird er respektiert, von einigen verabscheut. Das ist immer dann nützlich, wenn du nach Informationen suchst, die sonst nur schwer zu finden sind. <br/>Auswirkung: Für jede Stufe dieses Vorteils hast du Zugang zu einem anderen Untergrund-Datahaven in der Matrix, in dem Infobroker, Schieber und Shadowrunner illegale Daten und Geschäftsgeheimnisse speichern und weitergeben. Wenn du eine Matrixsuche durchführen musst, um Informationen über ein Thema zu finden, das vor der Öffentlichkeit verborgen wird, erhältst du 1 Edge. Detailliertere und gründlichere Informationen sind nach Maßgabe der Spielleitung verfügbar, aber du bist nicht der Einzige, der Datahavens nutzt. Wenn du diesen Vorteil bei einem Run einsetzt, addiere +1 zum Fahndungsstufen-Modifikator deines Teams.
quality.deck_builder=Deckbastler
quality.deck_builder.page=82
quality.deck_builder.desc=Dein maßgefertigtes Cyberdeck ist nie fertig: Für weitere Upgrades ist immer Platz. <br/>Auswirkung: Wenn du Karma ausgibst, um deine Hardware zu bauen oder upzugraden, ist jeder Punkt Karma 5.000 Nuyen statt 4.000 Nuyen wert. Jede Hardware, die du selbst baust (indem du Karma statt Nuyen für jede Komponente ausgibst), ist modularer als üblich. Du kannst die Matrixhandlung Matrixattribute austauschen verwenden, um deine Matrixattribute auszutauschen, wenn du ein maßgefertigtes Cyberdeck oder einen maßgefertigten Cyberhack benutzt, das oder den du selbst gebaut hast.
quality.fade_to_black=Ausblenden
quality.fade_to_black.page=81
quality.fade_to_black.desc=Wenn du in der Matrix auf Probleme stößt, gibt es dir einen Kick, sie abzuschütteln. <br/>Auswirkung: Wenn du die Matrixhandlung Verstecken erfolgreich durchführst, erhältst du 1 Edge.
quality.fractal_blast=Fraktale Druckwelle
quality.fractal_blast.page=83
quality.fractal_blast.desc=Manche Hacker verlassen sich ganz auf ihr Angriffsattribut, aber du weißt, wie du deine Datenspikes mit reiner Mathematik verstärken kannst. <br/>Auswirkung: Wenn du eine Nebenhandlung ausgibst, um deine Rechenleistung darauf zu fokussieren, eine Handlung Datenspike zu verstärken, erhöhe den Grundschadenswert deines Datenspikes um die (abgerundete) Hälfte deines Attributs Datenverarbeitung. Wenn du der Nebenhandlung nicht sofort eine Handlung Datenspike folgen lässt, geht dieser Bonus verloren. Dieser Vorteil kann nur von einer Persona verwendet werden, die auf einem Cyberdeck läuft.
quality.golden_screwdriver=Goldener Schraubendreher
quality.golden_screwdriver.page=83
quality.golden_screwdriver.desc=Ob mit einem Schraubendreher oder einem Lötkolben, du bist ein wahrer Hardware-Zauberer. <br/>Auswirkung: Wenn du eine Probe ablegst, um Matrixschaden zu reparieren, beträgt das Intervall der Ausgedehnten Probe nur 10 Minuten statt 1 Stunde.
quality.hacker_combo=Hacker-Kombo
quality.hacker_combo.page=83
quality.hacker_combo.desc=Du hast eine Abfolge von Handlungen in der Matrix so oft geübt, dass sie sich wie eine einzige Handlung anfühlt. <br/>Auswirkung: Wähle zwei bestimmte Matrixhandlungen. Du kannst diese Handlungen zusammen ausführen, indem du eine Neben- und eine Haupthandlung ausgibst. Jedes Mal, wenn du diese Kombination verwendest, kannst du wählen, welche der beiden Matrixhandlungen zuerst ausgeführt wird. Du kannst diesen Vorteil mehrmals wählen, um mehrere Kombos zu lernen.
quality.hold_the_door=Durchhalten
quality.hold_the_door.page=82
quality.hold_the_door.desc=Du hast gelernt, illegale Matrix-Zugänge mit anderen Personas zu teilen. <br/>Auswirkung: Wann immer du einen illegalen User- oder Admin-Zugang erhältst, kannst du diesen Zugang mit einer Anzahl zusätzlicher Personas gleich der Anzahl der bei der entsprechenden Probe erzielten Nettoerfolge teilen. Du kannst den Zugang nur Personas gewähren, die ihn bereitwillig annehmen, was eine Jederzeit-Nebenhandlung des Empfängers erfordert. Wenn du einer Persona, die kein Schleicher-Attribut hat, einen illegalen Admin-Zugang gibst, erhöht sich ihr Overwatch-Wert am Ende jeder Kampfrunde um 2W6.
quality.icu=Ich sehe Dich
quality.icu.page=84
quality.icu.desc=Es gibt dir einen Kick, versteckte Icons in der Matrix zu entdecken. <br/>Auswirkung: Wenn du ein Icon entdeckst, das auf Schleichfahrt läuft, erhältst du 1 Edge. Das gilt nur, wenn es für die Geschichte relevant ist – wenn du bloß durch die Stadt fährst und zufällige Icons entdeckst, bringt dir dieser Vorteil kein zusätzliches Edge.
quality.impenetrable_logic=Unerschütterliche Logik
quality.impenetrable_logic.page=84
quality.impenetrable_logic.desc=Dein schneller und anpassungsfähiger Sinn für Logik hilft dir, Angriffsmuster und potenzielle Bedrohungen zu erkennen. <br/>Auswirkung: Wenn du die Handlung Volle Abwehr (nicht Volle Matrixabwehr) einsetzt, verwende dein Attribut Logik anstelle von Willenskraft.
quality.jack_jockey=Buchsenjockey
quality.jack_jockey.page=81
quality.jack_jockey.desc=Du weißt, wie man einen Vorteil aus einer Direktverbindung zieht. <br/>Auswirkung: Wenn du eine Direktverbindung zum Ziel deiner Matrixhandlung oder Komplexen Form hast, erhältst du einige entscheidende Vorteile: Erstens darf das Ziel bei der Verteidigungsprobe gegen dich kein Edge erhalten oder ausgeben. Zweitens genießt das Ziel nicht den Schutz einer Firewall, die von einer externen Quelle (z. B. einem PAN) bereitgestellt wird – für seine Verteidigungsprobe gilt nur seine eigene Firewall. Drittens: Wenn das Ziel ausgeschaltet wird, kannst du es mit einer Handlung Gerät steuern wieder einschalten.
quality.loner=Einzelgänger
quality.loner.page=83
quality.loner.desc=Du arbeitest besser allein, zumindest in der Matrix. Es ist schön, wenn man Leute im Team hat, die die anderen Aspekte eines Runs abdecken, aber du magst es einfach nicht, wenn dir jemand über die Schulter schaut. <br/>Auswirkung: Immer, wenn du den AR- oder VR-Modus verwendest und kein Agentenprogramm laufen hast, keine Sprites kompiliert oder registriert hast (einschließlich Verbündeten-Sprites und Sprites auf Standby) und keine SimShare-Tramper dabei hast, bist du von einem Gefühl der Freiheit, der Konzentration, des Stolzes und der Kontrolle erfüllt. In diesem Fall fügst du allen Proben auf Matrixhandlungen und Komplexe Formen einen Schicksalswürfel hinzu und ignorierst, wenn dieser Schicksalswürfel eine 1 würfelt – er fügt dann zwar keine Erfolge hinzu und zählt auch immer noch gegen Patzer, macht aber nicht wie üblich alle gewürfelten 5en unbrauchbar (s. SR6, S. 51). Andere Schicksalswürfel, die aus anderen Quellen stammen, funktionieren weiterhin wie gewohnt.
quality.matrix_attribute_adv=Matrixattribute-Steigerung
quality.matrix_attribute_adv.page=84
quality.matrix_attribute_adv.desc=Du bist in einigen Aspekten der Matrix extrem gut geworden oder hast unkonventionelle Wege gefunden, um deine Persona zu verbessern. <br/> Wähle ein Matrixattribut: Angriff, Schleicher, Datenverarbeitung oder Firewall. Dieses Matrixattribut wird permanent durch die Stufe in diesem Vorteil erhöht. Diese Erhöhung gilt für Matrixattribute, nachdem sie ausgetauscht wurden – sie wird nicht mit dem Attribut verschoben, wenn ein Decker es austauscht. Du kannst diesen Vorteil mehrmals kaufen, um verschiedene Matrixattribute zu steigern. Dieser Vorteil steht jedem Charakter zur Verfügung, einschließlich Deckern, Technomancern oder sogar Straßensamurai, die einfach nur eine stärkere Firewall wollen. Die gesteigerte Stufe des Matrixattributs zählt, wenn sie durch Komplexe Formen, Matrixprogramme und andere Mittel zur Erhöhung von Matrixattributen weiter verbessert werden soll, als seine ungesteigerte Stufe.
quality.natural_hacker=Geborener Hacker
quality.natural_hacker.page=83
quality.natural_hacker.desc=Du nutzt deine angeborene Verbindung zur Resonanz, um Dinge in der Matrix zu erledigen. Das ist alles, was du brauchst. <br/>Auswirkung: Immer, wenn du eine Matrixhandlung durchführst oder eine Verteidigungsprobe gegen eine Matrixhandlung, eine Komplexe Form oder eine Spritekraft ablegst, kannst du dein Resonanz-Attribut anstelle eines anderen Nicht-Matrixattributs verwenden, das bei dieser Probe verwendet wird. Du kannst mit diesem Vorteil nicht Angriff, Schleicher, Datenverarbeitung oder Firewall durch Resonanz ersetzen.
quality.online_fame=Online-Promi
quality.online_fame.page=84
quality.online_fame.desc=Deine Persona ist in der Matrix weithin bekannt. Seltsamerweise wirkt sich das häufiger zu deinen Gunsten aus, als dass es dir in die Quere kommt. <br/>Auswirkung: Immer wenn du in der Matrix eine Einfluss- oder Überreden–Probe ablegst, erhältst du dafür einen Würfelpoolbonus gleich deiner Stufe in diesem Vorteil. Wenn du diesen Vorteil während eines Runs einsetzt, addiere am Ende des Runs +1 zu deinem Fahndungsstufen-Modifikator. Dieser Fahndungsstufen-Modifikator wirkt sich nur auf deine persönliche Fahndungsstufe aus.
quality.profiler=Profiler
quality.profiler.page=84
quality.profiler.desc=Du bist gut darin, Informationen über Personen zu sammeln und zusammenzutragen. <br/>Auswirkung: Du kannst zu jeder Person ein Profil erstellen. Dies erfordert eine Matrixsuche-Probe mit einem Schwellenwert von 6 und einem Intervall von 1 Stunde, gefolgt von einer Programmierprobe mit einem Schwellenwert von 6 und einem Intervall von 1 Minute. Dieses Intervall kann nicht verringert werden – auch nicht durch die Verwendung einer Orakel-Datenstruktur (siehe S. 72). Einmal erstellt, ist das Profil dauerhaft – wir können davon ausgehen, dass du hier und da ein paar Minuten damit verbringst, deine gespeicherten Profile auf dem neuesten Stand zu halten. Das Profil enthält alle grundlegenden Informationen, die die Spielleitung als Ergebnis erfolgreicher Beinarbeit zur Verfügung stellen könnte, ist aber auch für die Interaktion mit der Person nützlich. Wenn du ein Profil von jemandem hast, erhältst du 1 Edge für alle Überreden-, Einfluss- und Menschenkenntnis-Proben gegen diese Person. Dieses Edge muss für die Probe verwendet oder im Profil gespeichert werden. Jedes Profil kann bis zu 6 Edge speichern. Dieses Edge kann nur von dir verwendet werden, und du kannst es nur für Edge-Boosts und -Handlungen gegen das Ziel verwenden. Edge aus dem Profil kann für jede Art von Probe gegen das Ziel des Profils verwendet werden – nicht nur für Überreden-, Einfluss- und Menschenkenntnis-Proben. In einem Profil gespeichertes Edge verschwindet vollständig zu Beginn der nächsten Spielsitzung, wenn Edge aufgefrischt wird.
quality.quick_config=Schnellkonfiguration
quality.quick_config.page=84
quality.quick_config.desc=Du bist sehr gut darin, dein Cyberdeck im Handumdrehen neu zu kalibrieren. <br/>Auswirkung: Mit der Handlung Matrixattribute austauschen kannst du mit einer einzigen Nebenhandlung eine beliebige Anzahl von Matrixattributen und Programmen austauschen. Wenn du dich in einem Matrixkampf oder einer Kampfsituation befindest, erhältst du einmal pro Runde 1 Edge, wenn du in dieser Runde die Handlung Matrixattribute austauschen durchführst.
quality.reverberant=Nachhall
quality.reverberant.page=84
quality.reverberant.desc=Manche Leute scheinen ein Gespür für die Resonanz zu haben, auch wenn sie sie selbst nicht nutzen können. <br/>Auswirkung: Mit einer erfolgreichen Handlung Matrixwahrnehmung bist du in der Lage, Dinge in der Resonanz zu erkennen und zu analysieren, die normalerweise nur von Wesen mit dem Attribut Resonanz wahrgenommen werden können.
quality.satisfaction=Codeknacker
quality.satisfaction.page=81
quality.satisfaction.desc=Neugier war vielleicht der Katze Tod, aber du weißt, was sie zurückgebracht hat, nicht wahr? <br/>Auswirkung: Wenn du erfolgreich eine Verschlüsselung knackst oder eine Datenbombe auf einer Datei entschärfst, erhältst du 1 Edge. Dies gilt nicht, wenn die Verschlüsselung oder die Datenbombe nur platziert wurde, damit du mit diesem Vorteil Edge bekommst – du bekommst das Edge nur, wenn es (nach Maßgabe der Spielleitung) auf deinen Erfolg ankam.
quality.surgical_strike=Gezielter Angriff
quality.surgical_strike.page=83
quality.surgical_strike.desc=Du hast ein Talent dafür, dich auf subtile Weise in Hosts zu hacken. <br/>Auswirkung: Die Erhöhung des Overwatch-Werts durch einen illegalen User- oder Admin-Zugang auf einen Host erfolgt für dich nur einmal pro Minute statt einmal pro Kampfrunde.
quality.voider_of_warranties=Gewährleistungsausschluss
quality.voider_of_warranties.page=83
quality.voider_of_warranties.desc=Wenn du dir etwas Zeit für ein handelsübliches Gerät nimmst, kannst du einige unorthodoxe Verbesserungen anbringen. <br/>Auswirkung: Wenn du eine passende Werkzeugkiste hast, kannst du jedes in Großserie hergestellte Gerät mit einer Ausgedehnten Probe auf Elektronik (Hardware) + Logik oder Mechanik + Logik (nach Maßgabe der Spielleitung) mit einem Schwellenwert in Höhe der Gerätestufe (oder 4, je nachdem, welcher Wert höher ist) und einem Intervall von 1 Stunde verbessern. Das Gerät erhält eine Anzahl von "Upgradepunkten" gleich deinem Logik-Attribut. Jedes Mal, wenn du eine Handlung mit einem upgegradeten Gerät durchführst, darfst du eine zusätzliche Nebenhandlung ausgeben, um die Up­ grades zu aktivieren und für jeden Upgradepunkt einen Schicksalswürfel hinzuzufügen. Upgradepunkte verfallen, nachdem sie ausgegeben wurden. Wenn einer dieser Schicksalswürfel eine 1 würfelt, funktioniert das Gerät nicht mehr, nachdem die Handlung durchgeführt wurde. Wenn alle Upgradepunkte verbraucht sind, funktioniert das Gerät nicht mehr auf dieselbe Weise. In beiden Fällen ist eine weitere Ausgedehnte Elektronik- oder Mechanik-Probe wie oben beschrieben erforderlich – aber mit einem Intervall von 1 Minute –, um das Gerät wieder zum Laufen zu bringen. Dadurch wird seine Funktionalität wiederhergestellt, zusammen mit einer Anzahl von Upgradepunkten gleich deinem Logik-Attribut. Dieser Vorteil kann nicht bei Geräten verwendet werden, die eine Persona erzeugen, wie zum Beispiel ein Kommlink, ein Cyberdeck oder eine Riggerkonsole. Bodytech, Drohnen und Fahrzeuge können ebenfalls nicht upgegradet werden. Nach Maßgabe der Spielleitung kann jedes andere Gerät (einschließlich Waffen) verändert werden. Der Vollständigkeit halber: Wenn du diesen Vorteil bei einem Gerät verwendest, erlischt die Herstellergarantie. Anmerkung: Du solltest ein paar Zeilen passendes Fachchinesisch vorbereiten, um zu beschreiben, wie dein bizarres Fachwissen dir hilft, das Gerät zu verbessern, das du mit diesem Vorteil upgradest. Du musst das nicht tun, aber es bringt allen viel mehr Spaß, wenn du es tust.
quality.achilles_heel=Achillesferse
quality.achilles_heel.page=85
quality.achilles_heel.desc=Ob du es weißt oder nicht, es gibt eine bestimmte Art von Schaden, für die du in der Matrix besonders anfällig bist. <br/>Auswirkung: Wähle einen der folgenden Punkte aus: Handlung Datenspike, Komplexe Form Resonanz­ spike, Resonanzwesen oder IC. Immer, wenn duMatrixschaden durch die gewählte Quelle erleidest, darfst du den Schaden nicht mit einer Widerstandsprobe senken. Wenn du ein Technomancer bist, teilendeine registrierten (und verbündeten) Sprites deineVerwundbarkeit. Du kannst diesen Nachteil nur einmal wählen.
quality.binary_mentality=Binäre Mentalität
quality.binary_mentality.page=85
quality.binary_mentality.desc=Manche Leute sind in manchen Dingen gut und in anderen nicht, und das ist nun mal so – zumindest glaubstdu das. Deine Denkweise schränkt deine Fähigkeiten ein. <br/>Auswirkung: Wähle entweder Elektronik oder Cracken. Du glaubst, dass du diese Fertigkeit – ganz egal, wiesehr du dich auch anstrengen magst – nie ganz beherrschen wirst. Wenn du die gewählte Fertigkeit fürMatrixhandlungen oder Komplexe Formen verwendest, darfst du keine Edge-Boosts oder -Handlungeneinsetzen, die mehr als 2 Edge kosten.
quality.buddy_system=Nicht ohne meinen Chummer
quality.buddy_system.page=85
quality.buddy_system.desc=Ohne jemanden, der dir den Rücken freihält, fühlst du dich nicht sicher genug, um dich richtig zu konzentrieren. <br/>Auswirkung: Immer, wenn du allein bist, kannst du pro Kampfrunde maximal 1 Edge erhalten. Wenn du dich im Astralraum befindest, gelten nur astral aktive Verbündete als Begleitung im Sinne dieses Nachteils. Ein herbeigerufener Geist reicht aber aus, um die Edge-­ Einschränkung zu vermeiden. Wenn du dich in der VR befindest, fühlst du dich nur mit Verbündeten in der Matrix nicht so allein, aber ein Agentenprogramm oder ein Sprite in der Nähe oder sogar ein SimShare-­ Tramper reichen aus, um die Edge-Einschränkung zu vermeiden.
quality.bull_in_a_ceramics_store=Elefant im Porzellanladen
quality.bull_in_a_ceramics_store.page=85
quality.bull_in_ceramics.desc=Du bist das Hacker-Äquivalent eines Kampfmonsters, das sich an Zerstörung in der Matrix erfreut. <br/>Auswirkung: Du darfst für Matrixhandlungen und Komplexe Formen, die nicht das Potenzial haben, Matrixschaden zu verursachen, kein Edge erhalten oder ausgeben. Die Handlung Brute Force ist die einzige Ausnahme von dieser Einschränkung.
quality.compulsive_archivist=Zwanghafter Archivar
quality.compulsive_archivist.page=86
quality.compulsive_archivist.desc=Du bist das Datenäquivalent eines Messies. Da du nur sehr ungern Dateien löschst, behältst du Belastendes viel länger auf deinen Geräten, als es empfehlenswert ist, und anstatt Dateien zu löschen, sicherst du sie auf Offline-Datenchips und versteckst sie an geheimen Orten. Du greifst fast nie auf diese Dateien zurück, aber allein der Gedanke, sie zu löschen oder zu zerstören, erscheint dir unvorstellbar falsch. Diese Dateien werden unweigerlich von jemandem gefunden werden, sei es ein zufälliger Hacker, der dein Kommlink nach Paydata durchforstet, oder eine neugierige Person, die eines deiner Verstecke findet – es ist nur eine Frage des Wann, nicht des Ob. <br/>Auswirkung: Immer, wenn die Spielleitung nach einem Run auf die Fahndungsstufe würfelt, wird dein persönlicher Fahndungsstufen-Modifikator um +1 je volle 50 Karma erhöht, die du verdient hast. Unverbrauchtes Karma aus der Charaktererschaffung zählt dabei nicht. Dieser Fahndungsstufen-Modifikator wirkt sich nur auf deine persönliche Fahndungsstufe aus.
quality.curiosity_killed_the_cat=Neugier ist der Katze Tod
quality.curiosity_killed_the_cat.page=85
quality.curiosity_killed_the_cat.desc=Wenn eine Datei geschützt ist, bist du wie besessen davon, Zugang zu ihr zu erhalten. <br/>Auswirkung: Wenn du eine Datei entdeckst, die verschlüsselt oder durch eine Datenbombe geschützt ist, darfst du für keine Probe Edge erhalten oder ausgeben, außer für Proben, die du ablegst, um die Verschlüsselung zu knacken, die Datenbombe zu entschärfen und die Datei zu öffnen. Wenn du die Datei in Ruhe lässt, kannst du nach Ablauf jeder Stunde eine Selbstbeherrschungs-Probe mit einem Schwellenwert von 2 + deiner Stufe in diesem Nachteil ablegen. Gelingt die Probe, darfst du es dabei bewenden lassen. In diesem Fall darfst du wieder ganz normal Edge erhalten und ausgeben. Nach jeder misslungenen Probe erhältst du einen Bonuswürfel für zukünftige Selbstbeherrschungs-Proben, um deine Neugier zu überwinden. Die Anzahl der Bonuswürfel, die du auf diese Weise erhalten kannst, ist unbegrenzt, außer durch Zeit und viel Würfelunglück. Aber du kannst natürlich auch einfach herausfinden, was sich hinter dem Dateischutz verbirgt.
quality.data_liberator=Datenbefreier
quality.data_liberator.page=85
quality.data_liberator.desc=Du hast die starke persönliche Überzeugung, dass Datenöffentlich gemacht werden sollten – oder zumindest dieDaten, die mächtige Leute geheim halten wollen. <br/>Auswirkung: Du darfst bei keiner Probe, die mit demVerkauf wertvoller Daten zu tun hat, Edge erhaltenoder ausgeben, und du darfst auch nicht an einerTeamworkprobe teilnehmen, die demselben Zweckdient. Wenn du wertvolle Daten mit dem Einverständnis von jemandem freigibst, der an dem Run teilgenommen hat, bei dem du sie erlangt hast (was in derRegel bedeutet, dass du diese Person mit Nuyen oder Gefälligkeiten entschädigst), erhalten du und jeder indeinem Team, der keine Entschädigung verlangt hat, 1 Karma. Diese Karmaprämie gilt nur einmal pro Runund auch nur, wenn der Wert der Daten mindestens 5.000 Nuyen beträgt.
quality.defective_attribute=Schadhaftes Attribut
quality.defective_attribute.page=86
quality.defective_attribute.desc=Irgendetwas an dir macht eines deiner Matrixattribute weniger effektiv. <br/>Auswirkung: Wähle ein Matrixattribut: Datenverarbeitung oder Firewall. Ganz gleich, welches Gerät du verwendest, und selbst, wenn du eine lebende Persona hast: Dieses Matrixattribut kann niemals durch Matrixprogramme, Komplexe Formen, Echos oder Spritekräfte verstärkt werden. Du kannst diesen Nachteil nur einmal wählen.
quality.like_a_boss=Wie ein Boss
quality.like_a_boss.page=86
quality.like_a_boss.desc=Du hältst dich für einen professionellen Hacker mit Finesse und verschmähst die groben Brute-Force-Methoden. <br/>Auswirkung: Du darfst bei einer Probe, die Matrixschaden verursachen könnte, weder Edge erhalten noch ausgeben.
quality.mode_lock=Modussperre
quality.mode_lock.page=85
quality.mode_lock.desc=Ob AR-Modus, VR mit kaltem Sim oder VR mit heißem Sim – du hast eine klare Vorliebe. Wer VR mit kaltem Sim bevorzugt, hat wahrscheinlich schon einmal dieAuswirkungen von Biofeedback-Schaden bei einer ihnen nahestehenden Person miterlebt oder bekam vielleicht selbst ein- oder zweimal das Gehirn gebraten. Wenn du AR bevorzugst, bist du höchstwahrscheinlich einmobiler Hacker, der seine physische Umgebung nurungern aus den Augen verliert. VR mit heißem Sim ist die bevorzugte Lösung für Hacker, die sich in der Matrixaustoben wollen. Was auch immer deine Gründe sind, du empfindest die Verwendung eines anderen Modusals des von dir bevorzugten als unhandlich und störend. <br/>Auswirkung: Wähle einen bevorzugten Modus: AR, VRmit kaltem Sim oder VR mit heißem Sim. Sofern du nicht deinen bevorzugten Modus verwendest, kannst du bei Matrixhandlungen kein Edge erhalten, unddie Kosten von Edge-Boosts und -Handlungen zur Unterstützung deiner Matrixhandlungen werden verdoppelt.
quality.program_dependency=Programmabhängigkeit
quality.program_dependency.page=86
quality.program_dependency.desc=Du bist von einem speziellen Matrixprogramm abergläubisch abhängig geworden, meistens von Babymonitor. <br/>Auswirkung: Wähle ein Matrixprogramm. Immer, wenn dein Cyberdeck dieses Matrixprogramm nicht ausführt, bist du auf dessen Abwesenheit fixiert. In jeder Kampfrunde, in der du eine andere Matrixhandlung als das Laden des Matrixprogramms durchführen möchtest, musst du zuerst eine Nebenhandlung durchführen, um dich zu konzentrieren.
quality.resonance_burn=Resonanzverbrennung
quality.resonance_burn.page=86
quality.resonance_burn.desc=Schwund tut immer richtig weh – und zwar so sehr, dass du ihn möglichst vermeidest. <br/>Auswirkung: Wenn du Schwundschaden erleidest, handelt es sich immer um Körperlichen Schaden.
quality.simsense_dependency=SIMsinn-Abhängigkeit
quality.simsense_dependency.page=86
quality.simsense_dependency.desc=Du hast einen BTL-Chip zu viel eingesteckt. Okay, mehr als einen zu viel. Oder vielleicht wurde dein Gehirn von IC gebraten. Jetzt fühlst du dich fehl am Platz, wenn du das Leben mit deinen eigenen Sinnen erlebst. Wenn du nicht in irgendeiner Weise Simsinn verwendest, hast du ein Problem. <br/>Auswirkung: Wenn du VR mit heißem Sim verwendest, fühlst du dich wohl. VR mit kaltem Sim ist nicht ganz so gut – du kannst zwar noch Edge ausgeben, aber keines mehr erhalten. Dadurch wird nicht verhindert, dass sich dein Edge zu Beginn einer Spielsitzung auffüllt. Der AR-Modus hilft ein wenig, wenn du dich in der Fleischwelt bewegen musst, aber er fühlt sich nicht gut an. Im AR-Modus kannst du für Matrixhandlungen weder Edge erhalten noch ausgeben. Alle Edge-Boosts und -Handlungen bei Nicht-Matrixhandlungen kosten 1 Edge mehr als normal. Wenn du nicht einmal den AR-Modus ausführen kannst, geht es dir schlecht. Du fängst an zu zittern, und alles erscheint unwirklich. Bis du wieder in den AR- oder VR-Modus wechseln kannst, erhältst du den Status Benommen. Erwachte Charaktere können diesen Nachteil nicht wählen.
quality.sloppy_coder=Schlampiger Programmierer
quality.sloppy_coder.page=86
quality.sloppy_coder.desc=Du schreibst Code schnell, und du nimmst immer den kürzesten Weg. Du verschwendest deine Zeit nicht damit, Bugs zu fixen. <br/>Auswirkung: Wann immer du aus irgendeinem Grund eine Programmierprobe ablegst, verkürze das Intervall auf die Hälfte der normalen Zeit. Jedes Mal, wenn das Programm verwendet wird, kommt es zu einem Patzer, unabhängig davon, wie viele 1en gewürfelt werden. Ein kritischer Patzer führt dazu, dass das Gerät, auf dem die Software läuft, neu gestartet wird, es sei denn, sie wird auf einem Host ausgeführt, der sie stattdessen löscht.
quality.wanted_by_god=Von GOD gesucht
quality.wanted_by_god.page=86
quality.wanted_by_god.desc=Deine Persona steht auf GODs Fahndungsliste weit oben. Du bist vielleicht nicht die Nummer eins, aber du arbeitest dich nach oben. <br/>Auswirkung: Dein maximaler Overwatch-Wert, bevor die Fokussierung eintritt, ist pro Stufe in diesem Nachteil um 5 niedriger als normal. Das bedeutet, dass GOD auf dich fokussiert, wenn dein Overwatch-Wert 35 auf Stufe 1, 30 auf Stufe 2, 25 auf Stufe 3 und 20 auf Stufe 4 erreicht. Wenn die Fokussierung eintritt, ist die erste Reaktion ein HTR-Team, das dich als extrem gefährlich behandelt. Wenn du während eines Runs illegale Matrixhandlungen durchführst, erhöhe deinen Fahndungsstufen-Modifikator am Ende des Runs um deine Stufe in diesem Nachteil. Dieser Fahndungsstufen-Modifikator gilt nur für dich, es ist also möglich, dass deine Fahndungsstufe steigt, die deiner Mitrunner aber nicht.

