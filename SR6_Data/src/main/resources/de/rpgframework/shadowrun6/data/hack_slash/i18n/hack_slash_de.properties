metatype.realms_ai.desc=
quality.chatty=Mitteilsam
quality.chatty.page=120
quality.chatty.desc=Der Charakter fühlt sich hinter der Maske der Anonymität, die die Matrix bietet, besonders wohl. Das zusätzliche Selbstvertrauen verleiht ihm 1 Edge, wenn er über AR oder VR kommuniziert.
quality.designer=Designer
quality.designer.page=120
quality.designer.desc=Einige KIs sind Experten in der Umstrukturierung von Firmware, um eine maximale Effizienz der Hardware zu erreichen. Ihr selbst entworfenes Heimatgerät (s. Wiederherstellung und Neucodierung, S. 125) gewährt ihnen einen zusätzlichen Bonus von +1 auf das Attribut Datenverarbeitung oder Pilot und 2 Punkte Rauschunterdrückung.
quality.hello_world=Hallo Welt!
quality.hello_world.page=120
quality.hello_world.desc=KIs mit diesem Vorteil verfügen über eine Reihe von Maßnahmen zur Plausibilitätsprüfung, die ihnen helfen, eine Fragmentierung nach einer Verdrängung zu verhindern. KIs mit diesem Vorteil erhalten 1 Edge bei allen Proben, um einem Funkenverlust zu widerstehen. Das Edge muss für die Widerstandsprobe ausgegeben werden, sonst geht es verloren.
quality.inherent_program=Geerbtes Programm
quality.inherent_program.page=120
quality.inherent_program.desc=Diese KI hat sich aus einem bestimmten Matrixprogramm entwickelt und die Funktionalität dieses Programms nie verloren. Wähle ein Standard- oder ein Hackingprogramm (aber keine Autosoft) als integralen Bestandteil des Kerns deines Charakters aus. Geerbte Programme benötigen keinen anderen leeren Programmslot als denjenigen, den die KI gerade belegt, und gelten als jederzeit laufend. Ein geerbtes Programm ist tief mit der Kernprogrammierung der KI verwoben und kann nicht mit der Handlung Programm abstürzen lassen zum Absturz gebracht werden. Ein illegales Programm sammelt keinen Overwatch-Wert (OW) an, außer für Handlungen, die es benutzen.
quality.improved_restoration=Verbesserte Wiederherstellung
quality.improved_restoration.page=121
quality.improved_restoration.desc=KIs mit diesem Vorteil haben in ihrem Quellcode effektivere Regenerationsroutinen entwickelt. In jedem Intervall der Genesungsprobe wird 1 zusätzliches Kästchen auf dem Matrix-Zustandsmonitor geheilt, wenn mindestens ein Erfolg erzielt wird.
quality.low_profile=Unauffällig
quality.low_profile.page=121
quality.low_profile.desc=Die KI hat gelernt, ihren Schatten in der Matrix zu minimieren, sodass sie über längere Zeiträume hinweg operieren kann, bevor eine Fokussierung erfolgt. Bei KIs mit diesem Vorteil muss der Overwatch-Wert auf 60 steigen, bevor eine Fokussierung stattfindet.
quality.multi_processing=Simultanverarbeitung
quality.multi_processing.page=121
quality.multi_processing.desc=Simultanverarbeitung ermöglicht die gleichzeitige Verarbeitung von Informationen aus mehreren Quellen, während der Charakter online ist. Der Kampf erfordert nach wie vor die volle Aufmerksamkeit der KI, aber verschiedene andere, eher alltägliche Aufgaben können gleichzeitig erledigt werden. So kann eine KI mit diesem Vorteil beispielsweise die Matrix durchsuchen und gleichzeitig eine Telefonkonferenz führen, wobei sie jedem Informationskanal ihre volle Aufmerksamkeit widmet. Genau beobachten (SR6, S. 45) und Matrixwahrnehmungs-Proben (außer wenn es sich um eine Vergleichende Probe handelt) zählen für den Charakter als Nebenhandlungen. Die KI erhält außerdem eine zusätzliche Nebenhandlung pro Runde, wenn sie nicht direkt an einem Matrix- oder Fahrzeugkampf beteiligt ist. Die KI kann gleichzeitig eine Anzahl von Informationsquellen gleich ihrem Attribut Datenverarbeitung beobachten.
quality.pilot_origins=Pilotenerbe
quality.pilot_origins.page=120
quality.pilot_origins.desc=Eine KI mit diesem Vorteil ist wahrscheinlich aus einem Drohnenpilotprogramm hervorgegangen und hat ihre Fähigkeiten behalten. Die KI kann in Drohnen und Fahrzeuge springen und sie wie ein Rigger steuern. Jede Stufe dieses Vorteils gewährt den Bonus einer Riggerkontrolle gleicher Stufe. Die KI ist außerdem in der Lage, eine Anzahl von Drohnen-Autosofts gleich ihrer Datenverarbeitung zu laden, zu konvertieren und zu nutzen (KI-gesteuerte Drohnen nutzen die Attribute, Fertigkeiten und Matrix-Initiative der KI). Nebenbei bemerkt handelt es sich hierbei um eine reine Berechnungs- und Datenverarbeitungsfunktion; sie umfasst nicht die Simsinn-Verarbeitungsfähigkeit des Codemods Riggerkontrollen-Integration. Die beiden Methoden sind inkompatibel und lassen sich weder miteinander noch mit Resonanzechos kombinieren.
quality.redundancy=Redundanz
quality.redundancy.page=121
quality.redundancy.desc=Wesentliche Algorithmen, Routinen und andere Programmstrukturen werden im Kern der virtuellen Lebensform vervielfältigt, was es schwieriger macht, sie zu töten. Die Lebensform erhält 2 zusätzliche Kästchen auf ihrem Matrix-Zustandsmonitor. Diese zusätzlichen Kästchen werden zu allen Kästchen addiert, die der Codemod Kerncode-Redundanz zur Verfügung stellt.
quality.sapper=Pionier
quality.sapper.page=120
quality.sapper.desc=Die KI hat ein intuitives Gespür für Schwachstellen im Bootcode von Geräten. Sie erhält 1 Edge für alle Handlungen Gerät formatieren. Dieses Edge muss für die jeweilige Handlung ausgegeben werden und geht ansonsten verloren.
quality.sensor_upgrade=Sensor-Upgrade
quality.sensor_upgrade.page=121
quality.sensor_upgrade.desc=Die KI ist ein Experte darin, die Sensoreinstellungen der mit ihr verbundenen Geräte zu optimieren. Sie erhöht den Sensorwert jedes Fahrzeugs, jeder Drohne und jedes Geräts, das mit ihrem Icon verbunden ist, um 1. Falls anwendbar, erhalten alle Funktionen eines Sensorarrays diesen Bonus. Der Bonus gilt auch für alle Geräte, auf denen die KI gerade läuft.
quality.snooper=Schnüffler
quality.snooper.page=121
quality.snooper.desc=Die virtuelle Lebensform ist effektiver darin, auf Kommunikationsströme zuzugreifen und diese zu manipulieren. Sie erhält 1 Edge, wenn sie die Handlung Übertragung abfangen oder Signal stören durchführt. Das Edge muss für die entsprechende Probe verwendet werden, sonst verfällt es.
quality.virtual_stability=Virtuelle Stabilität
quality.virtual_stability.page=121
quality.virtual_stability.desc=Die KI ist ein Experte im Jonglieren mit Systemressourcen, um mehr Programme mit weniger Aufwand auszuführen. Die KI kann das Matrixprogramm Virtuelle Maschine auf ein Gerät oder einen Sideload-Prozessor laden oder es auf dem Gitter emulieren, ohne das zusätzliche Kästchen Matrixschaden zu erleiden, das normalerweise entsteht, wenn ihre Persona beschädigt wird.
quality.cascading_failure=Kaskadenausfall
quality.cascading_failure.page=122
quality.cascading_failure.desc=
quality.corruptor=Korrumpierer
quality.corruptor.page=122
quality.corruptor.desc=
quality.doomscrolling=Doomscrolling
quality.doomscrolling.page=121
quality.doomscrolling.desc=Bei der Fülle an Inhalten, die in der Matrix zu finden sind, ist es für eine KI oder EI schwierig, sich die Zeit zu nehmen, die sie für ihre Wiederherstellung benötigt. Jeden Tag muss die KI eine Probe auf Firewall + Willenskraft (3) ablegen, um die Wiederherstellung erfolgreich abzuschließen. Misslingt die Probe, kann sie an diesem Tag nicht mehr als 2 Edge aus irgendeiner Edge-Quelle erhalten.
quality.easily_exploitable=Leicht auszunutzen
quality.easily_exploitable.page=122
quality.easily_exploitable.desc=
quality.fragmentation=Fragmentierung
quality.fragmentation.page=121
quality.fragmentation.desc=Während der Geburt oder aufgrund eines dauerhaften Funken-Schadens zersplitterte die Kernprogrammierung der KI und konnte sich nicht richtig wieder zusammenfügen – oder ein Kernelement ihrer Programmierung wurde irgendwie gelöscht oder ging verloren. Das führt zu grundlegenden Fehlern in der Persönlichkeit der KI. Fragmentierte KIs leiden unter Effekten, die ihr Verhalten unberechenbar machen. Die Spielleitung sollte eine geeignete Option für die KI wählen, die sowohl ihren Charakter einzigartig macht als auch ihre Funktionsweise beeinträchtigt. Die Tabelle Vorschläge für die Fragmentierung enthält einige Beispiele für passende Nachteile. Nach Ermessen der Spielleitung kann dieser Nachteil bei bestimmten Proben, insbesondere bei sozialen Interaktionen, negative Würfelpoolmodifikatoren bewirken. Wenn dieser Nachteil bei der Charaktererschaffung gewählt wird, beginnt der Charakter mit Funke 5 statt wie üblich mit Funke 6. Wird dieser Nachteil während des Spiels durch eine Verdrängung erworben, verliert die KI 1 Punkt Funke. Wenn ihr Funke dadurch auf 0 gesenkt wird, stirbt sie. Außerdem kann Funke, der durch Fragmentierung verloren geht, nicht mit Codemods aufgefüllt oder mit Neuromorphismus konvertiert werden.</br></br>Vorschläge für die Fragmentierung:</br>Abhängigkeit, SR6, S. 77</br>Bermuda-Gremlins, Vollgas, S. 172</br>Chronisch Unpünktlich, Feuer frei, S. 143</br>Kampflähmung, SR6, S. 80</br>Phobie, Feuer frei, S. 144</br>Sozialstress, SR6, S. 81</br>Traumatische Erinnerungen, Feuer frei, S. 144</br>Ungehobelt, SR6, S. 81</br>Verunsichert, SR6, S. 82</br>Vorurteile, SR6, S. 82</br>Zielfixierung, Vollgas, S. 173</br>Zorn der Straßen, Vollgas, S. 173
quality.invalid_references=Ungültige Schlussfogerungen
quality.invalid_references.page=121
quality.invalid_references.desc=Der Basiscode der KI macht es schwer, aus den gesammelten Daten die richtigen Schlüsse zu ziehen. Das Steigern eines Attributs, einer Aktionsfertigkeit, einer Wissensfertigkeit oder das Erlernen einer Komplexen Form kosten 1 Karma mehr als normal.
quality.out_of_memory_exception=Platzprobleme
quality.out_of_memory_exception.page=122
quality.out_of_memory_exception.desc=KIs mit diesem Nachteil leiden – unabhängig davon, auf welchem Gerät sie sich befinden – unter einer Begrenzung des verfügbaren Speicherplatzes für die Ausführung von Programmen. Die Anzahl der verfügbaren Programmslots wird um 1 gesenkt. Dies gilt sowohl für das Gerät als auch für die Programme der KI.
quality.persnickety_renter=Pingeliger Mieter
quality.persnickety_renter.page=122
quality.persnickety_renter.desc=Die KI ist in dem, was sie ihre Heimatgeräte (s. Wie-derherstellung und Neucodierung, S. 125) nennen kann, eingeschränkt. Dieser Nachteil wird für einen bestimmten Gerätetyp gewählt (z. B. Kommlinks, Drohnen, Geräte mit einer Gerätestufe von 4 oder höher usw.). Das Gerät muss in der Lage sein, Apps, Autosofts oder Matrixprogramme zu laden, damit es ein Heimatgerät sein kann.
quality.real_world_naivete=Realitätsblindheit
quality.real_world_naivete.page=122
quality.real_world_naivete.desc=Als Kreaturen der Matrix (und als Kreaturen mit begrenztem Verständnis) haben virtuelle Lebensformen von bestimmenden Aspekten der physischen Welt bestenfalls keine Ahnung. Dinge wie Schwerkraft, Reibung und Trägheit sind für sie bedeutungslos. Selbst wenn ihre ursprüngliche Programmierung in irgendeiner Weise eine Interaktion mit der physischen Welt vorsah, kann es sein, dass sie diese nicht in ihrer Gesamtheit erfassen. Infolgedessen haben virtuelle Lebensformen wenig Kenntnis von der realen Welt und gewähren Gegnern 1 Edge, wenn sie mit der realen Welt interagieren oder anderweitig Wissen über sie ausüben.

item.attribute_augmentation=Attributsverbesserung
item.attribute_augmentation.page=126
item.attribute_augmentation.desc=Dieser Codemod erhöht dauerhaft den effektiven Wert eines der Basisattribute der KI um seine Stufe. Die ASDF-Attribute sind viel leichter zu steigern als Willenskraft, Logik, Intuition oder Charisma, was sie sowohl günstiger als auch weniger invasiv als die übrigen KI-Attributsverbesserungen macht. ASDF-Erhöhungen durch einen Attributsverbesserung-Codemod addieren sich nicht zu ASDF-Erhöhungen durch Resonanz oder Echos.
item.attribute_overclocking=Attributsübertaktung
item.attribute_overclocking.page=126
item.attribute_overclocking.desc=Würfle nach der Aktivierung mit [Stufe in Attributsübertaktung x 2] W6. Jeder Erfolg erhöht den Wert des entsprechenden Attributs vorübergehend um 1, bis maximal um 4. Dies wirkt sich nur auf Würfelpools aus; Initiativewert, Zustandsmonitor, Verteidigungswert und so weiter bleiben unverändert. Die Wirkung hält für [Nettoerfolge] Kampfrunden an, und wenn sie abläuft, muss die KI einem Schaden in Höhe des erhaltenen Attributsschubs mit Firewall + Willenskraft widerstehen. ASDF-Erhöhungen durch einen Attributsübertaktung-Codemod addieren sich nicht zu ASDF-Erhöhungen durch Resonanz oder Echos.
item.quantum_processor=Quantenprozessor
item.quantum_processor.page=126
item.quantum_processor.desc=Durch die Emulation der Funktionsweise von auf Quantenverschränkung basierenden Datenprozessoren erhöht dieser Codemod die Reaktionsgeschwindigkeit der KI. Füge pro Stufe in diesem Codemod +1 Initiative und 1 Initiativewürfel hinzu, bis zum normalen Maximum von 5 Würfeln. Diese Erhöhung gilt für alle Initiativeproben. Im Gegensatz zu initiativesteigernder Cyberware ist der Quantenprozessor-Codemod immer aktiv.

quality.paragon=Paragon
quality.paragon.page=130
quality.paragon.desc=Du glaubst an etwas anderes als dich selbst, das dir hilft, deine Resonanz zu lenken und zu kanalisieren, und dieses Etwas glaubt auch an dich. Ob es sich um den Architekten oder den Black Hat handelt, du nutzt deine Überzeugungen, um deine Fähigkeiten einfacher zu formen und zu konzentrieren.</br> Auswirkung: Du erhältst die Vorteile, die in der Beschreibung deines Paragons aufgeführt sind. Wenn du dich nicht an die Lehren deines Paragons hältst, verlierst du seine Gunst und alle damit verbundenen Boni.

mentorspirit.zero_one=01 (Der Weltenbaum)
mentorspirit.zero_one.page=130
mentorspirit.zero_one.desc=Null-Eins ist das eigentliche Fundament der Matrix. Er wird manchmal auch als der Weltenbaum bezeichnet und verbindet die Tiefen Räume mit der datenbasierten Standardmatrix. Als einer der ältesten Paragone und einer mit den meisten Anhängern scheint er Harmonie und den Informationsfluss der Matrix erhalten zu wollen, indem er die richtigen Personen zur richtigen Zeit mit Informationen versorgt. Dies ist der einzige Paragon, der zu wollen scheint, dass sich seine Anhänger zusammenschließen, und es gibt viele virtuelle Stämme, die 01 als Schutzpatron haben.</br>Vorteil: Edge-Boosts für Proben, die abgelegt werden, um Zugang zu einem Netzwerk oder Gerät zu erhalten, kosten 1 Edge weniger als normal.
mentorspirit.zero_one.disadvantage=Du kannst Edge weder erhalten noch ausgeben, wenn du nur in der AR unterwegs bist. Die Gunst geht verloren, wenn du wissentlich gegen eine andere Gruppe arbeitest, die 01 folgt, kann aber wiedergewonnen werden, indem du dieselbe Gruppe förderst.
mentorspirit.architect=Der Architekt (Der Baumeister)
mentorspirit.architect.page=130
mentorspirit.architect.desc=Der Architekt interessiert sich nicht so sehr für das Ergebnis seiner Arbeit wie für den Akt der Schöpfung selbst. Sobald der gut durchdachte und integrierte Code oder die Infrastruktur fertig sind, verliert der Architekt das Interesse daran und geht zu seinem nächsten großen Projekt über.</br>Vorteil: Edge-Boosts für Editieren-Handlungen kosten 1 Edge weniger als normal.
mentorspirit.architect.disadvantage=Du kannst kein Edge für Übertragung-abfangen-Handlungen erhalten oder ausgeben. Die Gunst geht verloren, wenn du eine Zeit lang keine Software erschaffen hast, und sie geht noch schneller verloren, wenn die zuletzt erschaffene Software kein anspruchsvolles Projekt war. Die Gunst kann mit einem großen Programmierprojekt zurückgewonnen werden.
mentorspirit.black_hat=Black Hat (Der Code-Cracker)
mentorspirit.black_hat.page=130
mentorspirit.black_hat.desc=Im Gegensatz zum Architekten hat der Black Hat wenig Interesse daran, neue Dinge zu erschaffen; er zieht es vor, Dinge zu übernehmen, die von anderen gemacht wurden. Daten, Programme, Drohnen und alles, was gestohlen werden kann, scheinen den Black Hat zu interessieren. Merkwürdigerweise hortet er keine Dinge. Er interessiert sich mehr für den Diebstahl an sich als für das, was danach passiert.</br>Vorteil: Edge-Boosts für Cracken-Proben kosten 1 Edge weniger als normal.
mentorspirit.black_hat.disadvantage=Du kannst beim Legen einer Datenbombe kein Edge erhalten oder ausgeben. Die Gunst geht verloren, wenn du ein sicheres System ohne Hintertüren baust, kann aber durch das Besiegen einer Sicherheitsspinne im Matrixkampf wiedergewonnen werden.
mentorspirit.delphi=Delphi (Das Orakel)
mentorspirit.delphi.page=130
mentorspirit.delphi.desc=Der als Orakel bekannte Paragon ist von Natur aus experimentierfreudig. Durch das Zusammentragen einer großen Anzahl von Datenfeeds erkennt er Muster und Trends und nutzt sie zur Vorhersage der Zukunft.
Er ist sehr gut, wenn er viele Daten hat, mit denen er arbeiten kann, aber unzuverlässig, wenn er versucht, mit Dingen zu arbeiten, die gerade erst entstanden sind oder die eine große Veränderung erfahren haben. Das Orakel verwendet dieselben Algorithmen, die Megakonzerne auf den Aktienmarkt anwenden, um alles zu erfassen, von der Wartung von Verkaufsautomaten bis hin zum nationalen Stromverbrauch. Dieser Paragon ist ein hervorragender Freund, der einen warnen kann, wenn sich Schwierigkeiten anbahnen.</br>Vorteil: Edge-Boosts beim Weben von Komplexen Formen kosten 1 Edge weniger als normal.
mentorspirit.delphi.disadvantage=Du erhältst einen Würfelpoolmodifikator von -2 auf deinen Matrix-Initiativewert. Die Gunst geht verloren, wenn du etablierte Datenmuster unterbrichst (indem du z. B. unaufgefordert einen Prototyp stiehlst), kann aber wiedergewonnen werden, wenn du offenlegst, warum du es getan hast und was seitdem geschehen ist.
mentorspirit.shooter=Todesschütze (Der Soldat)
mentorspirit.shooter.page=131
mentorspirit.shooter.desc=Kampfsimulationen und taktische Angriffsspiele waren schon Teil der Matrix, bevor es die Matrix überhaupt gab. Der Todesschütze schwelgt in Kraft- und Kampfwettbewerben in Spielen, aber auch in der Fleischwelt und in der Matrix. Vielleicht sind wir die Avatare und Icons des Todesschützen, der die Spiele der Fleischwelt auf die gleiche Weise spielt wie wir die Spiele der Matrix. Wie dem auch sei, der Todesschütze dürstet nach dem Kampf, wie auch immer er ausgetragen werden mag.</br>Vorteil: Edge-Boosts im Matrixkampf kosten 1 Edge weniger als normal.
mentorspirit.shooter.disadvantage=Du kannst beim Kompilieren von Sprites weder Edge erhalten noch ausgeben. Die Gunst geht verloren, wenn du einen Kampf verlierst, kann aber wiedergewonnen werden, wenn du einen weiteren Kampf gewinnst.

quality.machinists=Strömung: Maschinisten
quality.machinists.page=132
quality.machinists.desc=Technomancer, die sich Maschinisten nennen, befinden sich im Einklang mit Maschinen aller Art. Sie identifizieren sich mit Zahnrädern, beweglichen Teilen und anderen Maschineneigenschaften auf eine Art und Weise, die einen durchschnittlichen Steampunk-Liebhaber kühl erscheinen lässt. Vorteile Der Schwundwert aller Komplexen Formen, die sich auf Geräte auswirken, wird um 2 gesenkt. Du erhältst einen Würfelpoolbonus von +2 auf Kompilieren- und Dekompilieren-Proben bei Maschinen-Sprites. </br>Maschinisten haben eine so starke Affinität zu Maschinen, dass ihnen schon der Gedanke daran, nur eine einzige Maschine zu kontrollieren, ein Gräuel ist. Sie haben gelernt, die Resonanz so zu verdrehen, dass ihre lebende Persona als Riggerkonsole funktionieren kann und alle Fähigkeiten emuliert, die jemandem zur Verfügung stehen, der eine Riggerkonsole benutzt (außer der Fähigkeit, Teil eines PANs zu sein; dafür ist das Echo Lebendes Netzwerk, SR6, S. 195, erforderlich). Die neuen Attribute werden zusätzlich zu den normalen Matrixattributen erworben. Die Stufe in Rauschunterdrückung ist gleich der Willenskraft des Maschinisten, und die Anzahl der Autosofts, die mit Drohnen geteilt werden kann, ist gleich dem Charisma des Maschinisten.
quality.sourceror=Strömung: Sourcerer
quality.sourceror.page=131
quality.sourceror.desc=Manche Technomancer können nicht ertragen, dass andere die Arbeit für sie erledigen. Sie mögen es, sich am Prozess der Erstellung und Bearbeitung von Quellcode zu beteiligen. Sourcerer weben die Resonanz, um Komplexe Formen zu erschaffen, die selbst andere Technomancer verblüffen. Vorteile Der Schwundwert aller Komplexen Formen wird um 2 gesenkt. </br>Sourcerer verbringen so viel Zeit und Energie damit, sich mit ihren Komplexen Formen vertraut zu machen, dass sie sie vergleichsweise leicht weben können. Sie können bis zu [Wandlungsgrad/2, abgerundet] Komplexe Formen gleichzeitig aufrechterhalten, ohne dafür einen Würfelpoolmalus zu erleiden. Alle Komplexen Formen, die darüber hinaus aufrechterhalten werden, verursachen wie gewohnt die entsprechenden Würfelpoolmalus.
quality.technoshaman=Strömung: Technoschamane
quality.technoshaman.page=131
quality.technoshaman.desc=Technoschamanen verbinden das Spirituelle mit ihren Fähigkeiten. Sie sind Experten für Sprites, phänomenal im Umgang mit Resonanzkreaturen, und viele zeigen sogar eine Vorliebe für den Umgang mit Technocrittern. Vorteile Der Schwundwert aller Kompilieren- und Dekompilieren-Handlungen wird um 2 gesenkt. </br>Technoschamanen lernen, das Maximum aus ihren Sprites herauszuholen. So erhalten sie die Fähigkeit, Hybridsprites (S. 68) zu kompilieren, und erhalten 1 zusätzliche Aufgabe, solange sie bei der Kompilieren-Probe mindestens 1 Aufgabe erzielen.

complexform.loto=Wartungssicherung
complexform.loto.page=132
complexform.loto.desc=Mit dieser Komplexen Form kann ein Maschinist die Signale, die zu und von einer Maschine gehen, unterbrechen und die Maschine so von ihren Oberherren trennen. Diese Komplexe Form kann auf jedem Gerät genutzt werden. Leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall ab. Das Gerät wird für eine Anzahl von Kampfrunden gleich den Nettoerfolgen bei dieser Probe vollständig deaktiviert. Bei einem Gerät mit einer Pilotstufe verliert auch der Pilot seine Funktionalität. Ob dies eine Crashprobe zur Folge hat, liegt im Ermessen der Spielleitung. Wenn ein Rigger per Kabel-Direktverbindung hineingesprungen ist, kann diese Komplexe Form nicht verwendet werden, um das Fahrzeug zu deaktivieren.
complexform.hyperthreading=Parallelweben
complexform.hyperthreading.page=132
complexform.hyperthreading.desc=Der Sourcerer kann mehrere Komplexe Formen in einer einzigen Form zusammenfassen, was ihm die Möglichkeit bietet, mit einer einzigen Handlung mehrere Ergebnisse zu erzielen. Das hat allerdings seine Grenzen: Das Ziel der parallel gewebten Form muss für alle zusammengefassten Komplexen Formen identisch sein. Wickle die Wirkung mit einer einzelnen Probe auf Elektronik + Resonanz ab, und verwende das Ergebnis für alle zusammengefassten Komplexen Formen. Der Schwundwert wird bestimmt, indem der höchste Schwundwert aller zusammengefassten Komplexen Formen genommen und pro zusätzlicher Komplexer Form um 1 erhöht wird. Die Senkung des Schwundwerts um 2 wird am Ende angewendet, nicht für jede einzelne der zusammengefassten Komplexen Formen.
complexform.control_virtual_life=Virtuelles Leben kontrollieren
complexform.control_virtual_life.page=132
complexform.control_virtual_life.desc=Mit dieser Komplexen Form kann ein Technomancer die Handlungen virtueller Lebensformen (Sprites, Protosapiente, Xenosapiente, Konstrukte und Technocritter) kontrollieren, denen er begegnet. Dazu legt er eine Vergleichende Probe auf Elektronik + Resonanz gegen Firewall + Willenskraft ab. Die Nettoerfolge entsprechen der maximalen Anzahl von Runden, die der Technoschamane das Ziel kontrollieren kann. Das Ziel (und sein Meister, falls es einen gibt) ist sich bewusst, was mit ihm geschieht, kann aber wenig dagegen tun. Der Technoschamane verwendet dieselben Handlungen, um das Ziel zu befehligen, wie die Handlung, die er ihm befiehlt, was bedeutet, dass er zum Beispiel eine Nebenhandlung braucht, um das Ziel sich bewegen zu lassen, aber eine Haupthandlung, um es angreifen zu lassen.

