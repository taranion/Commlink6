qpath.cyberadept_path=Cyberadept
qpath.cyberadept_path.page=87
qpath.cyberadept_path.desc=Die meisten Technomancer vermeiden Bodytech aufgrund der Auswirkungen des Essenzverlustes auf ihre Verbindung zur Resonanz, aber Cyberadepten gehen anders vor. Sie gehen eine tiefe Verbindung mit ihrer Bodytech ein. Manche sagen sogar, sie erfüllen sie mit Resonanzenergie und machen sie lebendiger, als es ihre biologischen Komponenten je sein könnten. Einige der Ersten, die versuchten, diesen Weg zu beschreiten, gingen zu weit und verloren den Kontakt zur Resonanz, aber andere hatten schließlich Erfolg. Der anfängliche Preis, ein Cyberadept zu werden, ist hoch. Es gibt echte Gründe, warum Technomancer Essenzverlust vermeiden, und solange du nicht wirklich auf die Resonanz und den Pfad des Cyberadepten eingestimmt bist, werden deine Kräfte leiden. Manche würden sagen, dass es das wert ist. Wie wirst du es beurteilen, wenn du einmal zurückblickst und die Kosten gegen das aufrechnest, was du gewonnen hast?<br>Dieser emotionale Pfad kann nicht mit den Vorteilen Bodytech-Gewöhnung oder Cyborg (Schattenkompendium, S. 144) kombiniert werden.
qpath.cyberadept_path.step.cyberadept_novice=Cyberadepten-Novize
qpath.cyberadept_path.step.cyberadept_novice.page=87
qpath.cyberadept_path.step.cyberadept_novice.desc=Du hast begonnen, deine Bodytech als Teil deiner Identität zu akzeptieren, nicht nur als etwas, das deinem Körper hinzugefügt wurde. Um ein Cyberadept zu werden, musst du dir zunächst etwas Bodytech implantieren lassen und dich dann einer Wandlung (SR6, S. 195) unterziehen, um den Pfad wirklich zu beginnen. Bei deiner ersten Wandlung musst du das Echo Cyberadept (S. 68) erwerben. Sobald du das getan hast, kannst du diesen ersten Vorteil auf dem emotionalen Pfad des Cyberadepten zu den angegebenen Karmakosten erwerben (und nicht zum doppelten Preis wie bei der normalen Charakterentwicklung).<br>Immer, wenn du deine Bodytech übersteuerst (SR6, S. 284), darfst du den dazugehörigen Schicksalswürfel einmal neu würfeln. Das Ergebnis des erneuten Würfelwurfs ist endgültig, also solltest du vielleicht nur dann neu würfeln, wenn du eine 1 gewürfelt hast. Aber das liegt an dir. Wir haben dich gewarnt.<br>Wenn ein Teil deiner Bodytech die Implantatkategorie Standard oder Gebraucht hat, erhöht sich ihre Kategorie effektiv um 1. Aus Bodytech der Kategorie Gebraucht wird Standard-, aus Bodytech der Kategorie Standard wird Alphaware. Du erhältst ein Essenzloch in der Höhe der Essenzkostensenkung, die durch die Kategorieänderungen deiner Bodytech verursacht wird. Dieses Essenzloch wird für zukünftige Implantate verwendet, bevor weiterer Essenzverlust eintritt. Da Technomancer in erster Linie biologischer Natur sind, können auch Bioware-Implantate von diesem Vorteil betroffen sein. Das hat allerdings seinen Preis: Jegliche neue Bodytech muss mindestens Alphaware sein, sonst stößt dein Körper sie ab. Das nächste Mal, wenn du dein Resonanz-Attribut steigerst, dauert das nur 1 Minute – du musst aber immer noch das erforderliche Karma bezahlen.
qpath.cyberadept_path.step.cyberadept_disciple=Cyberadepten-Jünger
qpath.cyberadept_path.step.cyberadept_disciple.page=87
qpath.cyberadept_path.step.cyberadept_disciple.desc=In dem Maße, in dem du deine Verbindung zu deiner Bodytech verbesserst, wächst auch dein Wunsch, sich mehr davon zu implantieren zu lassen. Sich selbst weiter zu verbessern, ist ein notwendiger Schritt auf dem Weg zum Cyberadepten, aber du riskierst, deine Verbindung zur Resonanz zu zerstören, wenn du dir zu viel Bodytech einbauen lässt.<br> Wenn du 2 oder mehr Essenzpunkte verloren hast, kannst du diesen Vorteil zu den angegebenen Karmakosten (nicht den doppelten) erwerben. Du musst dafür den Vorteil Cyberadepten-Novize und das Echo Cyberadept haben. Alle Alphaware-Implantate werden zu Betaware-Implantaten, und deine Standard-Implantate werden zu Alphaware-Implantaten. Dadurch entsteht ein Essenzloch, das es dir ermöglicht, dir weitere Bodytech implantieren zu lassen, bevor du weitere Essenz verlierst. Jegliche neue Bodytech, die du ab jetzt erhältst, muss mindestens Betaware sein, sonst stößt dein Körper sie ab. Du kannst Resonanz durch deine Bodytech kanalisieren und sie so auf ähnliche Weise verstärken, als würdest du sie übersteuern. Indem du eine Nebenhandlung ausgibst und dich konzentrierst, erhöhst du die effektive Stufe eines deiner Implantate um dein Resonanz-Attribut. Dies aufrechtzuerhalten, erfordert Konzentration und zählt, als ob du eine Komplexe Form aufrechterhältst – obwohl es keine Komplexe Form gibt, die von irgendjemandem außer dir selbst wahrgenommen oder anvisiert werden kann.<br>Am Ende jeder Kampfrunde musst du einem Schwundwert gleich deinem halben (aufgerundeten) Resonanz-Attribut widerstehen. Dieser Vorteil kann die Stufe eines Implantats nicht auf mehr als das Doppelte der Stufe verbessern, die du implantiert hast, auf keine höhere Stufe als die maximale Stufe, in der es erhältlich ist, und erlaubt es dir auch nicht, Attribute um mehr als +4 zu verbessern. Du kannst diesen Vorteil nur bei deiner eigenen Bodytech verwenden, und auch nur bei einem Implantat gleichzeitig. Anders als beim Übersteuern von Bodytech gibt es mit diesem Vorteil weder einen Schicksalswürfel noch die Chance auf Cyberware-Stress. Der Vorteil kann auch für Bioware verwendet werden. Das nächste Mal, wenn du dein Resonanz-Attribut steigerst, dauert das nur 1 Minute – du musst aber immer noch das erforderliche Karma bezahlen.
qpath.cyberadept_path.step.cyberadept_master=Meister-Cyberadept
qpath.cyberadept_path.step.cyberadept_master.page=88
qpath.cyberadept_path.step.cyberadept_master.desc=Deine Bodytech hat sich an die Resonanz gewöhnt. Wenn du 3 Essenzpunkte verloren hast, kannst du diesen Vorteil zu den angegebenen Karmakosten (nicht den doppelten) erwerben. Du musst den Vorteil Cyberadepten-Jünger und dessen Voraussetzungen haben, um diesen Vorteil erwerben zu können. All deine Betaware-Implantate werden zu Deltaware-Implantaten, und deine Alphaware-Implantate werden zu Betaware-Implantaten. Dadurch entsteht ein Essenzloch, das es dir ermöglicht, dir weitere Bodytech implantieren zu lassen, bevor du weitere Essenz verlierst. Jegliche neue Bodytech, die du ab jetzt erhältst, muss mindestens Deltaware sein, sonst stößt dein Körper sie ab. Deine Bodytech hat sich so gut an deinen Körper und deine lebende Persona angepasst, dass sie von anderen in der Matrix nur schwer bemerkt oder beeinflusst werden kann, selbst wenn sie im WiFi-Modus läuft. Addiere deinen Wandlungsgrad zu deinem Verteidigungswert und deinem Würfelpool für alle Matrix-Verteidigungsproben für deine Bodytech – einschließlich des Widerstands gegen eine Matrixwahrnehmungs-Probe, um verborgen zu bleiben. Das nächste Mal, wenn du dein Resonanz-Attribut steigerst, dauert das nur 1 Minute – du musst aber immer noch das erforderliche Karma bezahlen.
qpath.cyberadept_path.step.cyberadept_transcendent=Transzendenter Cyberadept
qpath.cyberadept_path.step.cyberadept_transcendent.page=88
qpath.cyberadept_path.step.cyberadept_transcendent.desc=Die Resonanz hat dir zu etwas verholfen, von dem die Technologie nur hoffen kann, dass sie es eines Tages erreicht: Gammaware-Bodytech.<br> Wenn du 4 Essenzpunkte verloren hast, kannst du diesen Vorteil zu den angegebenen Karmakosten (nicht den doppelten) erwerben. Du musst den Vorteil Meister-Cyberadept und dessen Voraussetzungen haben, um diesen Vorteil erwerben zu können. All deine Bodytech wird zu Gammaware (Essenzmultiplikator 0,4), unabhängig von ihrer aktuellen Kategorie. Dadurch entsteht ein Essenzloch, das es dir ermöglicht, dir weitere Bodytech implantieren zu lassen, bevor du weitere Essenz verlierst. Wenn du ein neues Deltaware–Implantat erhältst, brauchst du Zeit, um es richtig anzupassen und zu integrieren. Während sich deine neuen Implantate anpassen, gewähren sie keine WiFi-Boni, aber ihr WiFi muss fast die gesamte Zeit über aktiviert sein. Wenn du den WiFi-Modus für mehr als 1 Minute am Stück deaktivierst, setzt du damit den Timer für die Integration zurück. Es dauert einen Monat, um ein neues Implantat vernünftig zu integrieren. Wenn das erfolgt ist, wird es zu Gammaware. Wenn deine Bodytech jemals entfernt wird, ist sie für jeden anderen nutzlos – selbst als Gebrauchtware. Jedes Mal, wenn du dein Resonanz-Attribut erhöhst, brauchst du nur 1 Minute dafür – du musst aber immer noch das erforderliche Karma bezahlen. Dies gilt nur, wenn du dein Resonanzattribut auf bis zu 6 erhöhst. Um den Wert auf 7 oder mehr zu erhöhen, gilt die normale erforderliche Zeitspanne.

#Sprite Powers
critterpower.death_mark=Todesmal
critterpower.death_mark.page=76
critterpower.death_mark.desc=Diese Kraft signalisiert die Absicht eines Sprites, jemanden zu ermorden. Das Sprite zielt auf eine Persona, die den VR-Modus verwendet, und legt eine Vergleichende Probe auf Cracken + Resonanz gegen Intuition + Firewall ab. Gelingt die Probe, erhält das Ziel eine beunruhigende und mysteriöse Beule, Wunde oder Verletzung an seiner Persona. Es unterliegt nicht nur einer Linksperre (SR6, S. 177), sondern es kommt noch schlimmer: Wenn das Ziel aus irgendeiner Quelle Matrixschaden erleidet, erleidet es die gleiche Anzahl Kästchen an Biofeedback-Schaden – Körperlichen Schaden bei Verwendung von VR mit heißem Sim, Betäubungsschaden bei Verwendung von VR mit kaltem Sim. Wenn das Sprite das Ziel direkt schädigt, fügt es eine Anzahl zusätzlicher Schadenskästchen gleich der Anzahl der Nettoerfolge hinzu, die es bei der anfänglichen Cracken-Probe erzielt hat. Das Todesmal verschwindet, wenn das Sprite es nicht mehr aufrechterhält oder das Ziel sich ausstöpselt oder neu startet.
critterpower.shield=Schild
critterpower.shield.page=76
critterpower.shield.desc=Das Sprite konzentriert seine gesamte Aufmerksamkeit und Anstrengung auf das Aufspüren und Abfangen von Matrixgefahren. Für eine Aufgabe schützt diese Kraft eine Anzahl von bis zu [Resonanz des Sprites] Icons, Personas oder Geräten. Ein Sprite kann nur eine Instanz dieser Kraft gleichzeitig aufrechterhalten. Alles, was unter dem Schutz des Schildes steht, erhält die Resonanz des Sprites als Würfelpoolbonus auf alle Matrix-Verteidigungsproben sowie auf Vergleichende Proben gegen Komplexe Formen und Spritekräfte. Wenn ein Ziel Matrixschaden erleidet, während es unter der Wirkung dieser Kraft steht, erleidet stattdessen das Sprite diesen Matrixschaden. Wenn ein Sprite durch das Aufrechterhalten eines Schildes Schaden erleidet, sinkt deine Sprite-Reputation um 1, es sei denn, es ist ein Verteidiger-Sprite.
critterpower.captivate=Publikum Fesseln
critterpower.captivate.page=75
critterpower.captivate.desc=Komplexe, überwältigende und doch wunderschöne und unterhaltsame Simsinn-Signale umgeben das Sprite. Es legt eine Probe auf Überreden (Vorführen) + Resonanz ab und notiert sich die Anzahl der Erfolge. Personas, die in einem Umkreis von 100 Metern um das Sprite den VR-Modus verwenden, können versuchen, dieser Kraft mit einer Probe auf Intuition + Firewall zu widerstehen. Charaktere, die eine Wissensfertigkeit in Bezug auf Kunst oder Musik haben, sind verwundbarer und können kein Edge erhalten oder ausgeben, um dieser Kraft zu widerstehen. Agenten, IC und PA-Kommlink-Apps werden von dieser Kraft nicht beeinflusst, ebenso wenig wie Geräte, auf denen keine Persona läuft. Andere Sprites hingegen sind ebenso anfällig für diese Kraft wie Charaktere mit künstlerischen Wissensfertigkeiten. Jeder, der dem Sprite nicht vollständig widersteht, muss für eine Anzahl von Kampfrunden gleich den Nettoerfolgen des Sprites für alle Edge-Boosts und -Handlungen doppelt so viel Edge wie normal ausgeben. Dies gilt für alle Handlungen, nicht nur für Matrixhandlungen. Wenn man sich ausstöpselt oder in die AR wechselt, endet die Wirkung der Kraft sofort. Ein Sprite, das auf Schleichfahrt läuft, kann diese Kraft nicht einsetzen.
critterpower.harmonize=Harmonisieren
critterpower.harmonize.page=75
critterpower.harmonize.desc=Das Sprite erzeugt Töne, Bilder und Empfindungen, die es aus der Resonanz und der umgebenden Matrix zieht und die perfekt mit der Umgebung und den dortigen Wesenheiten harmonieren. Das Sprite legt eine Probe auf Überreden (Vorführen) + Resonanz ab. Das Matrixrauschen im Umkreis von 100 Metern um das Sprite wird um die Erfolge des Sprites bei dieser Probe gesenkt. Selbst wenn die Rauschenquelle eine Regel hat, die besagt, dass sie nicht gesenkt oder negiert werden kann, überwindet diese Spritekraft diese Einschränkung. Jeder im Umkreis von 100 Metern, der die Vorführung des Sprites erleben kann, sei es in der AR, VR oder sogar über Lautsprecher und Trideoprojektoren, wird positiv beeinflusst. Jede Probe, die abgelegt wird, um einen betroffenen Charakter zu heilen, erhält einen Würfelpoolbonus gleich der Erfolge des Sprites bei der anfänglichen Überreden-Probe. Zu diesen Proben gehören natürliche Genesung, Erste Hilfe, Medkits, Heilmagie und sogar Komplexe Formen. Jeder Charakter, der Reparaturen durchführt, erhält den gleichen Würfelpoolbonus auf seine Mechanik- bzw. Elektronik-Proben, um Matrix- bzw. Körperlichen Schaden zu reparieren. Sprites, KIs und andere Matrixfauna stehen sogar noch stärker unter der Wirkung dieser Kraft und heilen am Ende jeder Kampfrunde automatisch 1 Kästchen Schaden.
critterpower.digital_scream=Digitaler Schrei
critterpower.digital_scream.page=74
critterpower.digital_scream.desc=Das Sprite sendet einen weitreichenden Stoß komplexen Rauschens aus, der von allen an die Matrix angeschlossenen Geräten im Umkreis von 100 Metern wahrgenommen wird. Das Sprite legt eine Probe auf Elektronik + Resonanz ab, und der Bereich wird von einem Rauschenwert gleich der Anzahl der Erfolge bei dieser Probe erfüllt. Dieses Rauschen verklingt zu Beginn der nächsten Runde, und sobald es endet, erhält alles, was den Schrei wahrgenommen hat, eine einzelne Datei. Diese Datei muss von dem Technomancer, der das Sprite befehligt, als Teil der für den Befehl erforderlichen Nebenhandlung bereitgestellt werden und kann auf Wunsch eine Verschlüsselung oder auch eine Datenbombe enthalten. Ein Sprite, das auf Schleichfahrt läuft, kann diese Kraft nicht einsetzen.
critterpower.fractal_dream=Fraktaler Traum
critterpower.fractal_dream.page=74
critterpower.fractal_dream.desc=Das Sprite zielt auf eine Persona oder ein IC und legt eine Vergleichende Probe auf Cracken + Resonanz gegen Intuition + Datenverarbeitung des Ziels ab. Wenn das Sprite Nettoerfolge erzielt, verschwindet das Ziel aus der Matrix und ist für [Nettoerfolge] Kampfrunden in einer bizarren Erfahrung in der Resonanz gefangen. Diese Erfahrung läuft in der VR mit heißem Sim – selbst wenn das Gerät des Ziels gar nicht zu heißem Sim in der Lage ist. Das führt dazu, dass IC abstürzt, aber abgesehen davon, dass es ihre Zeit verschwendet, schadet es den Personas nicht. Einige, die dies erlebt haben, berichten von einer religiösen Erfahrung, und bei einigen latenten Technomancern wurde die Emergenz auf diese Weise ausgelöst, aber die meisten haben keine Worte oder kein Verständnis für das unbeschreiblich Seltsame, das sie erlebt haben. Wenn jemand physisch von der Matrix getrennt wird, während er in dem fraktalen Traum gefangen ist, erleidet er einen schweren Auswurfschock, wodurch er 8 Kästchen Biofeedback-Schaden erleidet (dem wie gewohnt widerstanden werden kann) und außerdem die Status Gebrutzelt und Benommen erhält, die für jedes Kästchen erlittenen Schadens 1 Minute lang anhalten.
critterpower.signal_boost=Signalverstärkung
critterpower.signal_boost.page=76
critterpower.signal_boost.desc=Du kannst deinem Kurier-Sprite befehlen, dass es deine Matrixverbindungen verbessern soll, indem es das Rauschen in der Matrix für [Stufe] Kampfrunden um seine Resonanz senkt. Dieser Befehl ist auch für Verteidiger-Sprites verfügbar.
critterpower.host_ken=Hostwissen
critterpower.host_ken.page=76
critterpower.host_ken.desc=Auf dein Kommando hin kann dein Infiltrator-Sprite bei jeder Matrixhandlung oder Komplexen Form, die einen Host oder ein IC zum Ziel hat, Unterstützung leisten und dir für deine Probe einen Würfelpoolbonus in Höhe seiner Resonanz gewähren.
critterpower.hyperthreading=Parallelweben
critterpower.hyperthreading.page=76
critterpower.hyperthreading.desc=Wenn du dein Daten-Sprite bittest, dir beim Weben einer Komplexen Form zu helfen, erhältst du für deine Probe einen Würfelpoolbonus in Höhe seiner Resonanz. Dieser Befehl ist auch für Musik-Sprites verfügbar.
critterpower.file_ken=Dateiwissen
critterpower.file_ken.page=76
critterpower.file_ken.desc=Du kannst bei jeder Matrixhandlung, die eine Datei zum Ziel hat, die Unterstützung deines Daten-Sprites anfordern und seine Resonanz als Würfelpoolbonus zu deiner Probe hinzufügen.
critterpower.cybercombat_boost=Matrixkampfverstärkung
critterpower.cybercombat_boost.page=76
critterpower.cybercombat_boost.desc=Du kannst deinem Stör-Sprite befehlen, dass es deine Matrixhandlung Datenspike oder deine Komplexe Form Resonanzspike verstärken soll, indem es seine halbe Resonanz (aufgerundet) zu deinem Matrixschaden hinzufügt.
critterpower.device_ken=Gerätewissen
critterpower.device_ken.page=76
critterpower.device_ken.desc=Du kannst bei jeder Matrixhandlung oder Komplexen Form, die ein Gerät zum Ziel hat, die Unterstützung deines Maschinen-Sprites anfordern und seine Resonanz als Würfelpoolbonus zu deiner Probe hinzufügen.

#Protosapient Powers
critterpower.authority=Autorität
critterpower.authority.page=115
critterpower.authority.desc=Der Null überzeugt Geräte davon, dass seine Befehle von einer vertrauenswürdigen und privilegierten Quelle stammen: dem Besitzer. Immer, wenn ein Null die Handlung Gerät steuern oder Befehl vortäuschen durchführt, erhält er 1 Edge, das als Teil der Handlung ausgegeben werden muss und ansonsten verfällt.
critterpower.entropic_conversion=Entropische Umwandlung
critterpower.entropic_conversion.page=116
critterpower.entropic_conversion.desc=Einige Protosapiente haben die seltene Fähigkeit, Schaden an ihrem Kerncode zu heilen, indem sie die umgebende strukturelle Organisation der Matrix reduzieren – das heißt, indem sie die Entropie erhöhen und die abgesaugte "Organisationsenergie" durch umgekehrte Entropie in ihre eigene Struktur umwandeln. Mit einer Haupthandlung heilt das Wesen 1W6 Kästchen Matrixschaden und erhöht das Umgebungsrauschen des Gebiets um denselben Betrag. Das Umgebungsrauschen nimmt pro Stunde um 1 Punkt ab, bis es wieder auf seinem normalen Niveau angekommen ist.
critterpower.fnord=Fnord
critterpower.fnord.page=116
critterpower.fnord.desc=Ein Null kann sich vor GOD und jedem anderen in der Matrix verstecken, wenn er es wünscht. Damit ist kein regeltechnischer Mechanismus verbunden. Der Null verschwindet einfach in der Tiefe der Matrix.
critterpower.malleable_icon=Formbares Icon
critterpower.malleable_icon.page=116
critterpower.malleable_icon.desc=Wesen mit dieser Fähigkeit können ihr Matrix-Icon so verändern, dass es jedes andere Icon nachahmt, das sie kürzlich gesehen haben. Auch wenn diese Fähigkeit einer genauen Prüfung nicht standhält, ist sie auf den ersten Blick sehr überzeugend. Ein einzelner Erfolg bei einer Matrixwahrnehmungs-Probe reicht aus, um sie zu durchschauen.
critterpower.munge=Datenfrass
critterpower.munge.page=114
critterpower.munge.desc=Protosapiente fressen Code, um ihre eigene Codestruktur zu erhalten und upzugraden. Dieser Vorgang wird als Datenfraß bezeichnet. Wenn ein Protosapient Daten frisst, hinterlässt er zufällige Daten, die in der Regel das darstellen, was gefressen wurde, aber zerstört oder verdreht. Ein gefressenes Icon könnte zum Beispiel wie ein undeutliches Durcheinander aussehen, während ein gefressenes Programm entweder fehlerhaft funktioniert oder völlig unbrauchbar wird. Das Fressen von Daten ist eine Vergleichende Probe gegen den Host oder das Gerät, auf dem die Daten leben. Der Protosapient legt eine Probe auf Charisma + Angriff gegen Firewall + Datenverarbeitung des Hosts oder Geräts ab. Misslingt die Probe, bleiben die Daten intakt. Um eine Datei zu fressen, muss der Protosapient Zugang zu ihr haben. Um ein Programm zu fressen, muss sich der Protosapient entweder auf demselben Host befinden, auf dem das Programm läuft, oder im selben Netzwerk wie die Persona, die das Programm ausführt. Die Spielleitung bestimmt das Ausmaß des Schadens, der durch den Datenfraß verursacht wird, anhand der folgenden Richtlinien: Die Stufe eines Agenten, eines Pilot-Programms, einer Aktions- oder Linguasoft sollte um das Attribut Angriff des Critters gesenkt werden. Wenn das dazu führt, dass die Software eine Stufe von 0 oder weniger erreicht, wird sie vollständig zerstört. Die Spielleitung kann einen Schwellenwert gleich dem Attribut Datenverarbeitung des datenfressenden Critters festlegen, um eine gefressene Datei mit einer Matrixwahrnehmungs-Probe zu lesen. Icons können verzerrt und korrumpiert werden, sodass sie nicht mehr identifizierbar sind oder zumindest verstörend aussehen.
critterpower.munge_spark=Funkenfrass
critterpower.munge_spark.page=116
critterpower.munge_spark.desc=Die meisten Protosapienten fressen Code, um ihre digitale Struktur zu erhalten, aber ein paar dieser Wesen haben gelernt, zu überleben, indem sie den Funken anderer digitaler Lebensformen fressen – der Vampirismus der digitalen Welt. Um diese Fähigkeit einsetzen zu können, muss das Opfer während des gesamten Vorgangs bewegungsunfähig gemacht werden, in der Regel durch wiederholte Anwendungen der Matrixhandlung Teergrube. Funkenfraß erfordert eine Nebenhandlung pro Kampfrunde und muss in jeder folgenden Runde fortgesetzt werden, während das Opfer bewegungsunfähig gehalten werden muss. Das Fressen, um 1 Punkt Funken zu entziehen, erfordert eine Ausgedehnte Probe auf Charisma + Angriff ([12 – Funke des Ziels], 1 Kampfrunde). Wird der Angreifer während dieses Prozesses unterbrochen oder gelingt es dem Opfer, sich zu erholen und zu fliehen, bevor der Schwellenwert erreicht wird, bleibt seine Lebenskraft intakt und der Funke wird nicht entzogen. Wenn der Funke des Ziels auf 0 gesenkt wird, stirbt die digitale Lebensform. Protound Xenosapiente haben in der Regel Funke 6, während freie und Verbündetensprites Funke in Höhe ihrer Stufe haben. Die teilweise Senkung des Funkens eines Sprites senkt dessen Stufe um den gleichen Betrag. Funkenfraß fügt die gestohlene Lebenskraft dem Funken des Angreifers hinzu, kann ihn dadurch aber maximal auf das Doppelte seines natürlichen Maximums erhöhen. Jeder Funke, der über diesen Punkt hinaus entzogen wird, ist verloren; der Kern des Critters kann nur eine bestimmte Menge auf einmal aufnehmen. Sobald ein Protosapient anfängt, Funkenfraß zum Überleben zu benutzen, wird sein eigener Funke instabil, und er verliert 1 Funke pro Woche. Dadurch kann sein Funke sogar unter sein ursprüngliches Niveau fallen, was ihn zwingt, neue Opfer zu jagen.
critterpower.noiseless=Rauschlos
critterpower.noiseless.page=117
critterpower.noiseless.desc=Regeltechnisch sind die Null immun gegen Rauschen – zumindest gegen Rauschen, das durch Entfernung verursacht wird. Die Spielleitung kann entscheiden, dass die Null von anderen Rauschenquellen beeinflusst werden (z. B. solchen, die von einem Hacker oder einer Spamzone verursacht werden).
critterpower.primal_rage=Urzorn
critterpower.primal_rage.page=117
critterpower.primal_rage.desc=Der Protosapient steigert sich aufgrund des Schadens, den er erlitten hat, in einen Rausch. Alle Angriffe dieses Protosapienten erhalten für jeden Würfelpoolmalus von -1, den er durch Schaden erleidet, einen Bonus von +1 auf den Schadenswert.
critterpower.noisestorm=Interferenzsturm
critterpower.noisestorm.page=117
critterpower.noisestorm.desc=Als Haupthandlung kann ein Protosapient, der einen Interferenzsturm verwendet, eine Probe auf Elektronik + Logik ablegen, deren Nettoerfolge das Rauschen in der Umgebung um ihre Anzahl erhöhen. Dies kann entweder auf ein Netzwerk abzielen und sich auf alle damit verbundenen Geräte auswirken, oder auf ein bestimmtes Gerät, um alle Geräte im Umkreis von [Funke x 10] Metern um seinen physischen Standort zu beeinflussen. Der Protosapient ist gegen dieses Rauschen immun.
critterpower.psychotropic_biofeedback=Psychotropes Biofeedback
critterpower.psychotropic_biofeedback.page=117
critterpower.psychotropic_biofeedback.desc=Aufseher können ihre Ziele mit psychotropem Biofeedback schädigen. Das bedeutet, dass die Aufseher Biofeedback-Schaden verursachen. Jedes Mal, wenn tatsächlich Schaden zugefügt wird, muss das Ziel eine Probe auf Willenskraft + Firewall gegen einen Schwellenwert gleich der Anzahl der Nettoerfolge des Angriffs ablegen, um nicht unter einer psychotropen Wirkung zu leiden. Psychotrope Wirkungen sind kurzfristige emotionale Anpassungen, die [2W6 – Edge] Stunden lang andauern. Dazu können Wirkungen wie eine Abneigung gegen bestimmte Gegenstände oder Aktivitäten, das Verlangen nach einem bestimmten Produkt, Selbstzufriedenheit oder Lethargie, Schuldgefühle, Paranoia, eine Abneigung gegen die Matrix, Phobien usw. gehören. Auch der Verlust des Kurzzeitgedächtnisses ist eine Möglichkeit. Das Ziel kann nicht weitgehend außer Gefecht gesetzt oder in einen katatonischen Zustand versetzt werden, aber es wird sich ausgesprochen seltsam verhalten.
critterpower.virtual_processing=Virtuelle Verarbeitung
critterpower.virtual_processing.page=117
critterpower.virtual_processing.desc=Null führen in Wahrheit keine Programme aus. Die jeweils angegebene Liste ist nur eine Möglichkeit, einige ihrer Fähigkeiten zu simulieren. Sie führen immer alle ihre Programme aus.

