complexform.arc_feedback=Schadensspiegelung
complexform.arc_feedback.page=62
complexform.arc_feedback.desc=Wenn du diese Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du Matrixschaden durch eine Matrixhandlung Datenspike, eine Komplexe Form Resonanzspike oder IC erleidest, während du Schadensspiegelung aufrechterhältst, erleidet das, was dich getroffen hat, Matrixschaden in Höhe der Erfolge bei deiner Elektronik-Probe. Sobald Schadensspiegelung Schaden verursacht hat, bricht die Komplexe Form zusammen und endet.
complexform.attack_attribution=Angriffszuteilung
complexform.attack_attribution.page=63
complexform.attack_attribution.desc=Nimm eine freiwillige Persona (zur Definition von Personas s. SR6, S. 174) ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange du diese Form aufrechterhältst, erhält das Ziel ein Angriffs-Matrixattribut mit einer Stufe gleich der Anzahl der Erfolge bei deiner Elektronik-Probe. Wenn das Ziel bereits ein niedrigeres Angriffsattribut hatte, wird es durch das Angriffsattribut dieser Form ersetzt. Ein Ziel, das unter der Wirkung von Angriffszuteilung steht, kann nicht zum Ziel einer Komplexen Form <i>Angriffs-Steigerung</i> werden. Diese Persona kann jetzt illegale Matrixhandlungen durchführen, die nicht mit dem Attribut Schleicher verbunden sind.
complexform.bubble_shield=Blasenschild
complexform.bubble_shield.page=64
complexform.bubble_shield.desc=Blasenschild erzeugt eine schützende Resonanzbarriere um ein Ziel. Leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Für jeweils 2 Erfolge erhält das Ziel einen Würfelpoolbonus von +1 auf alle Proben zur Abwehr Komplexer Formen und Spritekräfte. Wenn sie aktiv ist, erscheint diese Komplexe Form als kaum sichtbares Kraftfeld, in dem in zufälligen Abständen leuchtende Codezeilen aufflackern. Nur ein Wesen mit dem Attribut Resonanz ist in der Lage, den Blasenschild mithilfe von Matrixwahrnehmung genauer zu beobachten.
complexform.btl_irl=BTL IRL
complexform.btl_irl.page=64
complexform.btl_irl.desc=<i>BTL IRL</i> (Better than Life in Real Life) verbessert die technologischen Sinne des Ziels und stimuliert seine Headware, um einen erhöhten Bewusstseinszustand zu schaffen, ähnlich wie bei der Verwendung eines BTL-Chips – nur dass die realen Erfahrungen des Ziels verbessert werden. Diese Komplexe Form verstärkt nicht nur die angenehmen Erfahrungen, sondern auch die schrecklichen. Um diese Komplexe Form zu weben, leg eine Probe auf Elektronik + Resonanz (6 – abgerundete Essenz des Ziels) ab. Das Ziel muss über irgendeine Art von Headware verfügen, damit die Komplexe Form bei ihm wirken kann, und wenn es keine Sinnesverbesserungen (wie z. B. Cyberaugen, Cyberohren, Geruchsbooster usw.) hat, kannst du bei der Elektronik-Probe weder Edge erhalten noch ausgeben. Das Ziel erhält auf Wahrnehmungsproben einen Würfelpoolbonus in Höhe deiner Nettoerfolge, während <i>BTL IRL</i> aufrechterhalten wird, aber es erhält aufgrund seines offensichtlichen Zustands der Ablenkung und des Stigmas, das Chipheads anhaftet, auch einen Würfelpoolmalus in gleicher Höhe auf alle Überreden- und Einfluss-Proben. Die Wirkung dieser Komplexen Form ist den BTL-Chips so ähnlich, dass sie das Bedürfnis eines BTL-Süchtigen nach einem Schuss befriedigt. Chipheads sind oft bereit, 100 Nuyen pro Stunde und mehr zu zahlen, um von dieser Form beeinflusst zu werden, und viele skrupellose Technomancer vermarkten ihre Fähigkeiten als gesunde Alternative zur Verwendung von BTLs. Sie liegen falsch – <i>BTL IRL</i> ist genauso schlimm wie BTLs. Wenn dein Ziel unter dem Einfluss von <i>BTL IRL</i> jemals einen Patzer, einen Kritischen Patzer oder eine 1 auf einem Schicksalswürfel erzielt, bricht diese Komplexe Form zusammen und endet, und das Ziel erleidet 1W6 Kästchen Körperlichen Biofeedback-Schaden, dem nicht widerstanden werden kann, der nicht verhindert werden kann und der auch nicht gesenkt werden kann. Dieser Schaden kann nur durch natürliche Genesung (SR6, S. 123) geheilt werden. Diese Komplexe Form kann eine Abhängigkeit verursachen (s. <i>Schattenkompendium</i>, S. 167).
complexform.cyber_spike=Cyberspike
complexform.cyber_spike.page=64
complexform.cyber_spike.desc=Diese Komplexe Form ist der schlimmste Albtraum für Cyberware-Enthusiasten. Sie führt zwar nicht wirklich dazu, dass der Körper der Zielperson die installierte Bodytech abstößt, aber sie erweckt den Eindruck, dass dies der Fall ist – und das kann genauso fatal sein. Nimm einen Charakter ins Visier, der über mindestens ein Cyberware-Implantat verfügt, das seinen WiFi-Modus aktiviert hat – oder stell eine Direktverbindung zu einem Ziel her, das über Cyberware verfügt, die nicht im WiFi-Modus läuft. Wenn du versuchst, diese Komplexe Form bei einem Ziel einzusetzen, das keine anfällige Cyberware hat, hast du deine Handlung verschwendet. Je mehr Bodytech ein Ziel hat, desto verwundbarer ist es. Leg eine Probe auf Elektronik + Resonanz gegen Konstitution + Essenz (abgerundet) des Ziels ab. Hat das Ziel seine Cyberware in ein PAN eingebunden, erhält es für seine Probe einen Würfelpoolbonus in Höhe der Firewall des PANs. Für jeden Nettoerfolg erleidet das Ziel 1 Kästchen Körperlichen Schaden (dem es mit Konstitution widerstehen kann), und seine gesamte Cyberware schaltet sich für 1 Kampfrunde ab. Diese Komplexe Form ist mit dem Echo Auralink (S. 68) kompatibel.
complexform.cyberjack_overclock=Cyberbuchsen-Übertaktung
complexform.cyberjack_overclock.page=64
complexform.cyberjack_overclock.desc=Nimm eine Persona ins Visier, die eine Cyberbuchse oder ein Cyberhack verwendet. Leg eine Probe auf Elektronik + Resonanz ab. Jeder Erfolg erhöht die Matrix-Initiative der anvisierten Persona um 1, solange diese Form aufrechterhalten wird. Dies wird zum Initiativeergebnis addiert; es werden keine zusätzlichen Initiativewürfel hinzugefügt.
complexform.cyberware_stamina=Cyberware Ausdauer
complexform.cyberware_stamina.page=65
complexform.cyberware_stamina.desc=Diese Komplexe Form ist der schlimmste Albtraum für Cyberware-Enthusiasten. Sie führt zwar nicht wirklich dazu, dass der Körper der Zielperson die installierte Bodytech abstößt, aber sie erweckt den Eindruck, dass dies der Fall ist – und das kann genauso fatal sein. Nimm einen Charakter ins Visier, der über mindestens ein Cyberware-Implantat verfügt, das seinen WiFi-Modus aktiviert hat – oder stell eine Direktverbindung zu einem Ziel her, das über Cyberware verfügt, die nicht im WiFi-Modus läuft. Wenn du versuchst, diese Komplexe Form bei einem Ziel einzusetzen, das keine anfällige Cyberware hat, hast du deine Handlung verschwendet. Je mehr Bodytech ein Ziel hat, desto verwundbarer ist es. Leg eine Probe auf Elektronik + Resonanz gegen Konstitution + Essenz (abgerundet) des Ziels ab. Hat das Ziel seine Cyberware in ein PAN eingebunden, erhält es für seine Probe einen Würfelpoolbonus in Höhe der Firewall des PANs. Für jeden Nettoerfolg erleidet das Ziel 1 Kästchen Körperlichen Schaden (dem es mit Konstitution widerstehen kann), und seine gesamte Cyberware schaltet sich für 1 Kampfrunde ab. Diese Komplexe Form ist mit dem Echo Auralink (S. 68) kompatibel.
complexform.data_bomb_eater=Datenbomben-Fresser
complexform.data_bomb_eater.page=65
complexform.data_bomb_eater.desc=Wenn du diese Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du eine Datenbombe zündest, während du diese Form aufrechterhältst, wird die Stufe der Datenbombe um die Anzahl deiner Erfolge gesenkt. Wenn die Stufe der Datenbombe dadurch auf null oder weniger gesenkt wird, wird sie von der Resonanz verschluckt – in diesem Fall bleibt die Datei, die durch die Datenbombe geschützt wurde, unversehrt. Wenn ein Datenbombenfresser auf eine Datenbombe trifft, bricht die Komplexe Form zusammen und endet.
complexform.data_disguise=Datenmaskierung
complexform.data_disguise.page=65
complexform.data_disguise.desc=Du kannst diese Komplexe Form verwenden, um ein beliebiges Icon zu maskieren und es als etwas anderes erscheinen zu lassen. Du kannst die Art des Icons verändern, zum Beispiel Persona, Gerät, IC, Datei, Sprite, KI oder alles andere, was dir einfällt. Du kannst auch falsche Matrixattribute darstellen oder sogar den Anschein erwecken, dass eine bestimmte Software läuft. Nimm ein Icon ins Visier, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Immer, wenn das maskierte Icon zum Ziel einer Matrixwahrnehmungs-Probe wird, wird das Ergebnis dieser Probe nur die Informationen aus deiner Maskierung an-zeigen – es sei denn, die Anzahl der Erfolge der Matrixwahrnehmungs-Probe übersteigt die Anzahl der Erfolge, die du bei der Elektronik-Probe erzielt hast. In diesem Fall durchschaut der Wahrnehmende die Maskierung und sieht die wahren Eigenschaften des Icons. Diese Komplexe Form kann auch verwendet werden, um den Anschein zu erwecken, dass ein Gerät, auf dem keine Persona läuft (z. B. ein Ersatz-Kommlink), aktiv eine Persona laufen lässt.
complexform.enhance_autosoft=Autosoft-Verbesserung
complexform.enhance_autosoft.page=64
complexform.enhance_autosoft.desc=Nimm ein Gerät ins Visier, das zumindest theoretisch in der Lage ist, eine Autosoft auszuführen, und leg eine Probe auf Elektronik + Resonanz ab. Addiere für jeweils 2 Erfolge einen Bonuswürfel, wenn eine Probe mit einer auf dem Gerät laufenden Autosoft abgelegt wird, während diese Komplexe Form aufrechterhalten wird.
complexform.enlighten_automaton=Automat Erleuchten
complexform.enlighten_automaton.page=63
complexform.enlighten_automaton.desc=Nimm ein Gerät mit einer Pilotstufe ins Visier, in das derzeit niemand hineingesprungen ist, und leg eine Probe auf Elektronik + Resonanz ab. Du kannst entweder die Pilot- oder die Sensorstufe des Ziels um deine Erfolge erhöhen, und du kannst deine Erfolge zwischen Pilot und Sensor aufteilen, wenn du willst. Sowohl Pilot als auch Sensor können höchstens auf das Doppelte ihrer ursprünglichen Stufe erhöht werden. Geräte scheinen unter der Wirkung dieser Komplexen Form viel wacher, aktiver und aufmerksamer zu sein. Ihnen gelingt automatisch jede Probe, um komplexe Aufträge zu verstehen oder auf chaotische Situationen zu reagieren. Manchmal sind sie auch etwas eigenwillig und müssen überzeugt werden, ihre Befehle auszuführen. Wenn ein Gerät, das unter der Wirkung dieser Komplexen Form steht, einen Patzer oder Kritischen Patzer erzielt, musst du eine Probe auf Überreden + Charisma oder Einfluss + Charisma ablegen, um es zu überzeugen, seinen Befehlen zu folgen. Dafür musst du eine Haupthandlung ausgeben, und der Schwellenwert dieser Probe ist gleich der Anzahl der Punkte, um die Pilot- und Sensorstufe erhöht wurden. Du kannst dies so oft wie nötig versuchen, aber solange das Gerät nicht überzeugt wird, wird es keine weiteren Handlungen ausführen. Wenn du aufhörst, <i>Automat Erleuchten</i> aufrechtzuerhalten, kehrt das Gerät zu seinem normalen Verhalten zurück.
complexform.host_emulator.page=65
complexform.host_emulator.desc=Nimm eine Persona oder ein IC, die sich in einem Host befinden, ins Visier und leg eine Probe auf Elektronik + Resonanz gegen Intuition + Firewall (oder Hoststufe x 2) ab. Wenn du Nettoerfolge erzielst, werden die Persona oder das IC dazu gebracht, mit einer Illusion des Hosts zu interagieren, in dem sie oder es sich befinden. Die nächsten Matrixhandlungen des Ziels misslingen automatisch, solange die Form aufrechterhalten wird, aber das Ziel wird glauben, dass sie gelungen sind. Diese Illusion kann nur so lange aufrechterhalten werden, bis Fehlerprüfsysteme oder die eigene Intuition des Ziels es dazu bringen, sich zu befreien. Wenn das Ziel eine Matrixhandlung wegen Host-Emulator verliert und mehr Erfolge erzielt, als du Nettoerfolge bei deiner Elektronik-Probe erzielt hast, bricht die Komplexe Form zusammen und endet. Die Matrixhandlung schlägt immer noch fehl, aber das Ziel merkt, dass sie fehlgeschlagen ist.
complexform.ic_pick=IC Hacke
complexform.ic_pick.page=65
complexform.ic_pick.desc=Nimm ein IC ins Visier, das auf einem Host läuft, und leg eine Probe auf Elektronik + Resonanz gegen Hoststufe x 2 ab. Gelingt die Probe, erleidet das IC Matrixschaden in Höhe deines Angriffsattributs plus der Nettoerfolge aus dieser Probe. Wenn du das IC mit dieser Komplexen Form zum Absturz bringst, wechselt ihre Dauer zu Aufrechterhalten. Solange du die Komplexe Form aufrechterhältst, kann der Host keine weitere Instanz des IC-Typs starten, den du zum Absturz gebracht hast.
complexform.machine_merge=Maschinenverschmelzung
complexform.machine_merge.page=67
complexform.machine_merge.desc=Nimm einen Charakter mit einer Riggerkontrolle (oder einem äquivalenten Echo) ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange diese Komplexe Form aufrechterhalten wird, erhält das Ziel für jeweils 2 Erfolge einen Würfelpoolbonus von +1 auf Steuern-, Mechanik- und Verteidigungsproben, während es in ein Fahrzeug oder eine Drohne hineingesprungen ist. Dieser Bonus gilt nur für Proben, die zum Betrieb des Fahrzeugs oder der Drohne und ihrer Systeme ab-gelegt werden.
complexform.marionette=Marionette
complexform.marionette.page=66
complexform.marionette.desc=Diese Komplexe Form ist der schlimmste Albtraum eines Straßensamurai, denn sie ermöglicht es einem Technomancer, durch die Cyberware eines Ziels die Kontrolle über dessen Körper zu übernehmen. Um für diese Komplexe Form anfällig zu sein, muss ein Ziel mindestens ein Bodyware-Implantat oder eine Cybergliedmaße besitzen, das oder die (nach Maßgabe der Spielleitung) mit seinem Nervensystem verbunden ist. Inerte Cyberware wie Kompositknochen, Dermalpanzerung und Schmuggelfächer zählen nicht dazu, Reflexbooster, Reaktionsverbesserung und Talentleitungen hingegen schon. Das Ausschalten des WiFi-Modus bietet einen gewissen Schutz gegen diese Komplexe Form; um sie in diesem Fall zu verwenden, muss der Technomancer die Ziele in seinem Blickfeld halten und das Echo Auralink haben. Ziele, die ihre Bodytech im WiFi-Modus betreiben, sind auch über die Matrix angreifbar, wofür keine physische Sichtverbindung erforderlich ist. Um diese Komplexe Form gegen ein Ziel einzusetzen, leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft + Firewall des Ziels ab. Gelingt die Probe, notiere dir deine Nettoerfolge. Du kannst weitere Handlungen verwenden, um den Körper des Ziels direkt zu kontrollieren. Wenn es nur eine Cybergliedmaße hat, kannst du nur Handlungen ausführen, um seine Cybergliedmaße zu kontrollieren, aber die meisten Bodyware-Implantate erlauben die Kontrolle über den gesamten Körper des Ziels. Für jede Haupt- bzw. Nebenhandlung, zu der du das Ziel zwingst, musst du eine entsprechende eigene Haupt- bzw. Nebenhandlung ausgeben. Diese Handlung muss eine körperliche Handlung sein, zu der das Ziel körperlich in der Lage ist – sein Verstand und seine Emotionen sind davon nicht betroffen. Jedes Mal, wenn du dein Ziel zu einer Handlung zwingst, senkst du die Anzahl deiner Nettoerfolge um 1. Wenn du alle deine Nettoerfolge aufgebraucht hast oder wenn du die Komplexe Form nicht mehr aufrechterhältst, bricht sie zusammen und endet. </br>Wenn das Ziel eine Handlung ausführt, die eine Probe erfordert, verwendet es seinen normalen Würfelpool, darf für die Probe aber kein Edge erhalten oder ausgeben. Diese Komplexe Form hindert das Ziel nicht daran, sich aus eigenem Antrieb zu bewegen. Bei seinem eigenen Zug kann das Ziel seine eigenen Handlungen ausführen. Du kannst ein Ziel mit dieser Komplexen Form zwar zu Handlungen zwingen, die seinem Wohlergehen eindeutig abträglich sind, wie zum Beispiel sich selbst anzugreifen, von einer nahe gelegenen Anhöhe zu springen usw., aber es ist keine Soforttötung. Wenn du ein Ziel dazu zwingst, sich selbst zu verletzen, erleidet es den Grundschaden der Waffe, die es benutzt, ohne Probe, um zu treffen oder den Schaden durch Nettoerfolge zu erhöhen. Im Falle eines Sturzes hat das Ziel die Chance, sich mit einer Probe auf Athletik + Geschicklichkeit an einem Vorsprung oder Ähnlichem festzuhalten. Diese Komplexe Form sollte es nicht erlauben, jemanden automatisch umzubringen, sie kann aber einen entscheidenden taktischen Vorteil bieten. Selbst für Kriminelle ist der Gedanke, jemanden zu zwingen, sich mit einer solchen Macht selbst zu verletzen, entsetzlich. Jedes Mal, wenn du diese Komplexe Form verwendest, um ein Ziel dazu zu bringen, sich selbst zu verletzen, addierst du am Ende des Runs +1 zum Fahndungsstufen-Modifikator deines Teams.</br>Beachte, dass du diese Komplexe Form auch gegen bzw. für ein freiwilliges Ziel einsetzen kannst, um ihm zusätzliche Handlungen zu ermöglichen. Allerdings ist keine Bodytech darauf ausgelegt, dass man sie auf diese Weise einsetzt, also muss das Ziel immer noch würfeln, um zu widerstehen. Wenn du diese Komplexe Form bei einem Ziel mit dessen Einverständnis anwendest, erhältst du 1 Edge, das für die Elektronik-Probe ausgegeben werden muss und ansonsten verloren geht. Selbst wenn du diese Komplexe Form unter solchen Umständen verwendest, kann das Ziel bei Handlungen, die durch Marionette erzwungen werden, Edge weder erhalten noch ausgeben.
complexform.primed_charge=Resonanzladung
complexform.primed_charge.page=67
complexform.primed_charge.desc=Indem du die rohe Kraft der Resonanz durch deine lebende Persona kanalisierst, kannst du eine Matrixhandlung gewaltig verstärken. Wenn du diese Komplexe Form webst, leg eine Probe auf Elektronik + Resonanz ab und notiere dir die Anzahl der Erfolge. Wenn du das nächste Mal eine Matrixhandlung durchführst oder eine Komplexe Form webst, erhältst du für jeweils 2 Erfolge, die du bei deiner Elektronik-Probe erzielt hast, 1 Edge. Du kannst auf diese Weise mehr als 2 Edge erhalten, aber nachdem deine Matrixhandlung oder deine Komplexe Form abgewickelt wurde (einschließlich der Abwicklung des Schwundschadens), verlierst du all dein verbleibendes Edge – auch Edge, das du nicht durch diese Komplexe Form erhalten hast. Edge, das in einem separaten Pool gespeichert wird, wie etwa in einem M-TOC oder einem Verfolgungspool, ist davon nicht betroffen. Du darfst Resonanzladung nicht verwenden, wenn dein Edge-Pool leer ist.
complexform.resonance_wires=Resonanzkabel
complexform.resonance_wires.page=67
complexform.resonance_wires.desc=Der ultimative Schutz, der wirksamer ist als jede Firewall, besteht darin, den WiFi-Modus vollständig zu deaktivieren, sodass man für feindliche Matrixhandlungen unverwundbar ist. Aber Technomancer haben einige Lösungen für dieses Problem parat. Um diese Komplexe Form zu verwenden, nimm ein Gerät oder einen Charakter ins Visier, das oder den du sehen kannst, und leg eine Probe auf Elektronik + Resonanz mit einem Schwellenwert von 2 plus Rauschen (falls vorhanden) ab. Gelingt die Probe, stellst du eine direkte Fernverbindung zum Gerät her. Wenn dein Ziel ein Charakter war, hast du eine Direktverbindung zu allen Geräten dieses Charakters – auch zu denen, die ausgeschaltet sind. Das Einzige, was du mit einem ausgeschalteten Gerät tun kannst, ist, es wieder einzuschalten (aber nur, wenn es grundsätzlich über eine WiFi-Funktionalität verfügt; Geräte, die überhaupt keine WiFi-Funktionalität haben, kannst du nicht beeinflussen). Du kannst diese Komplexe Form so lange aufrechterhalten, wie du das Ziel in deinem Blickfeld hast. Wenn du das Ziel länger aus deinem Blickfeld verlierst, als du zum Blinzeln brauchst, endet die Komplexe Form sofort.
complexform.restore_continuity=Kontinuität Wiederherstellen
complexform.restore_continuity.page=66
complexform.restore_continuity.desc=Diese Komplexe Form ermöglicht es dir, Matrixschaden bei Software zu heilen, einschließlich Fernagenten, künstlicher Intelligenzen, Matrixfauna und sogar IC. Leg eine Probe auf Elektronik + Resonanz ab. Pro Erfolg heilst du 1 Kästchen Matrixschaden an der Software. Diese Komplexe Form hat keine Auswirkungen auf Geräte und Sprites.
complexform.search_history=Chronik
complexform.search_history.page=64
complexform.search_history.desc=Wenn du ein Gerät mit dieser Komplexen Form ins Visier nimmst, leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Willenskraft (oder Gerätestufe) + Firewall ab. Wenn du Nettoerfolge erzielst, erhältst du sofort eine Liste aller Matrixhandlungen, die das Gerät in den letzten 24 Stunden oder seit dem letzten Neustart (je nachdem, was zuletzt eintrat) durchgeführt hat. Zu den Ergebnissen der Matrixhandlungen werden keine Angaben gemacht, aber die Ziele des Matrixgeräts werden aufgezeichnet. Nur Ziele, die vom Gerät identifiziert und erkannt wurden, werden mit dieser Komplexen Form angezeigt.
complexform.sleaze_attribution=Schleicherzuteilung
complexform.sleaze_attribution.page=67
complexform.sleaze_attribution.desc=Nimm eine freiwillige Persona ins Visier und leg eine Probe auf Elektronik + Resonanz ab. Solange du diese Form aufrechterhältst, erhält das Ziel ein Schleicher-Matrixattribut mit einer Stufe gleich der Anzahl der Erfolge bei deiner Elektronik-Probe. Wenn das Ziel bereits ein niedrigeres Schleicherattribut hatte, wird es durch das Schleicherattribut dieser Form ersetzt. Ein Ziel, das unter der Wirkung von Schleicherzuteilung steht, kann nicht zum Ziel einer Komplexen Form Schleicher-Steigerung werden. Diese Persona kann jetzt illegale Matrixhandlungen durchführen, die nicht mit dem Attribut Angriff verbunden sind.
complexform.smartgun_amplifier=Smartgun-Verstärker
complexform.smartgun_amplifier.page=67
complexform.smartgun_amplifier.desc=Diese Komplexe Form verstärkt und verbessert Waffensysteme. Nimm entweder eine einzelne mit einem Smartgunsystem ausgestattete Waffe oder ein M-TOC ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Die Angriffswerte von Waffen, die mit dem M-TOC-Netzwerk (oder der Waffe) verbunden sind, werden um die Anzahl der Erfolge bei der Elektronik-Probe erhöht, solange die Form aufrechterhalten wird. Diese Komplexe Form wirkt nur bei Waffen, deren Smartgunsysteme im WiFi-Modus betrieben werden.
complexform.technoregeneration=Technoregeneration
complexform.technoregeneration.page=68
complexform.technoregeneration.desc=Diese Komplexe Form ist das Äquivalent eines Heilen-Zaubers für elektronische Geräte. Nimm ein Gerät ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Pro Erfolg wird 1 Kästchen Matrixschaden wiederhergestellt. Dies funktioniert nur bei Geräten, nicht bei IC, Sprites oder anderer Matrixfauna. Wenn ein Gerät durch diese Komplexe Form repariert wurde, neigt es dazu, launenhaft zu funktionieren. Wenn du eine Probe mit dem Gerät ablegst, ersetze einen der Probenwürfel durch einen Schicksalswürfel, bis eine gründlichere Wartung möglich ist (dies erfordert 1 Stunde Arbeit mit einer Elektronik-Werkzeugkiste). Solange diese Wartung nicht erfolgt ist, kann das Gerät nicht erneut mit Technoregeneration repariert werden.
complexform.threat_analyzer=Bedrohungsanalyse
complexform.threat_analyze.pager=64
complexform.threat_analyzer.desc=Diese Komplexe Form verstärkt die Algorithmen der Kampfabwehr eines M-TOCs. Nimm ein M-TOC ins Visier und leg eine Probe auf Elektronik (Hardware) + Resonanz ab. Pro Erfolg erhöht sich der Verteidigungswert aller Charaktere und Drohnen, die Teil des M-TOC sind, um 1. Um diesen Bonus auf den Verteidigungswert zu erhalten, müssen Charaktere entweder ein DNI (eine Datenbuchse oder Troden genügen) oder eine Bildverbindung und ein Audiokommunikationsgerät besitzen, damit sie das AR-Overlay des M-TOC sehen und hören können.
complexform.unravel_encryption=Verschlüsselung Auftrennen
complexform.unravel_encryption.page=68
complexform.unravel_encryption.desc=Mit dieser Komplexen Form kannst du die Verschlüsselung einer Datei entfernen, ohne deinen Overwatch-Wert zu erhöhen und, sofern du Erfolg hast, ohne einen Alarm auszulösen. Leg eine Vergleichende Probe auf Elektronik + Resonanz gegen Verschlüsselungsstufe x 2 ab. Wenn du mindestens so viele Erfolge erzielst wie die Verschlüsselung, wird sie geräuschlos entfernt. Wenn die Verschlüsselung mindestens einen Nettoerfolg erzielt, werden der Host oder das Gerät alarmiert, dass jemand versucht, die Datei zu entschlüsseln. Dies verrät zwar nicht deine Persona, aber es versetzt einen Host oder ein Gerät in höchste Alarmbereitschaft.

metaecho.aura_link=Auralink
metaecho.aura_link.page=67
metaecho.aura_link.desc=Du musst das Echo Skinlink haben, um dieses Echo erwerben zu können. Du kannst dich drahtlos mit Geräten verbinden, als ob du eine Direktverbindung nutzen würdest, allerdings nur innerhalb einer begrenzten Reichweite. Die Reichweite deines Auralinks entspricht einem Radius um deinen physischen Körper in Höhe von [Wandlungsgrad] Metern, und es kann unter der Wirkung von Rauschen leiden. Du musst das Ziel in der physischen Welt, in der AR oder in der VR sehen können, damit dieses Echo funktioniert.
metaecho.cyberadept=Cyberadept
metaecho.cyberadept.page=68
metaecho.cyberadept.desc=Du hast gelernt, dass deine Bodytech durch deine Verbindung mit der Resonanz beeinflusst werden kann. Wenn du dieses Echo erwirbst, schaltet dies den emotionalen Pfad des Cyberadepten (S. 87) frei.
metaecho.data_structure_encoding=Datenstrukturkodierung
metaecho.data_structure_encoding.page=68
metaecho.data_structure_encoding.desc=Du musst das Echo Skinlink haben, um dieses Echo erwerben zu können. Du hast gelernt, geschichtete Faltungen von Matrix- und Resonanzinformationen in physische Objekte zu kodieren, um physische Datenstrukturen (S. 70) zu schaffen. Das ist nützlich, um eine Datei in einer Form zu verstecken, auf die nur jemand mit diesem Echo zugreifen kann, aber du hast auch gelernt, Datenstrukturen zu erstellen, die mit Aspekten der Resonanz harmonieren und diese verstärken. Kurz gesagt kannst du mit diesem Echo Gegenstände erschaffen und integrieren, die Technomancern auf ähnliche Weise zugutekommen, wie Zauberern Foki helfen.
metaecho.dissonant_scream=Dissonanzschrei
metaecho.dissonant_scream.page=68
metaecho.dissonant_scream.desc=Wir pfuschen also an der Dissonanz herum, wie? Wenn du dieses Echo erwirbst, macht dich das noch nicht zu einem dissonanten Technomancer, aber diese Unterscheidung ist vielleicht nicht jedem klar, der Zeuge wird, wie du es benutzt. Du bist in der Lage, Resonanzenergie zu kanalisieren und zu streuen, um eine lärmende, störende Welle zu erzeugen, die Matrixaktivitäten beeinträchtigt. Um dieses Echo zu aktivieren, musst du eine Haupthandlung ausgeben und eine Probe auf Resonanz + Wandlungsgrad ablegen. Pro Erfolg erhöht sich das Matrixrauschen im Umkreis von 100 Metern um deinen physischen Körper um 1. Auch du stehst unter der Wirkung dieses Rauschens. Keine Form der Rauschunterdrückung hat einen Einfluss auf das von diesem Echo erzeugte Rauschen. Am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, erleidest du Schwund mit einem Schwundwert in Höhe der aufeinanderfolgenden Kampfrunden, in denen das Echo aktiv war. Dein Overwatch-Wert erhöht sich am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, um die Anzahl der Erfolge, die du bei deiner Probe auf Resonanz + Wandlungsgrad erzielt hast. Die Deaktivierung dieses Echos erfordert eine Nebenhandlung, aber es deaktiviert sich automatisch, wenn du bewusstlos wirst. Nachdem du dieses Echo aktiviert hast, darfst du es erst wieder aktivieren, wenn du dich von jeglichem Schwundschaden erholt hast. Wenn du bei der Verwendung dieses Echos von jemandem außerhalb deines eigenen Teams beobachtet wirst, addiere am Ende des Runs +1 zum Fahndungsstufen-Modifikator.
metaecho.hybrid_sprites=Hybridsprites
metaecho.hybrid_sprites.page=68
metaecho.hybrid_sprites.desc=Wenn du ein Sprite kompilierst, kannst du der Verwendung dieses Echos Nettoerfolge zuweisen (statt diese Nettoerfolge zu verwenden, um weitere Aufgaben für das Sprite hinzuzufügen). Für jeden Nettoerfolg, den du auf diese Weise zuweist, kannst du dem Sprite eine Fertigkeit oder Kraft verleihen, die normalerweise nur einer anderen Art von Sprite zur Verfügung steht, die du kompilieren kannst.
metaecho.living_command_console=Lebende Riggerkonsole
metaecho.living_command_console.page=68
metaecho.living_command_console.desc=Du musst die Echos Maschinenbeherrschung und Lebendes Netzwerk haben, um dieses Echo erwerben zu können. Dein Lebendes Netzwerk kann jetzt als Riggerkonsole mit einer effektiven Gerätestufe gleich deinem Resonanzattribut funktionieren. Du kannst nur Autosofts ausführen und teilen, die auf deiner lebenden Persona ausgeführt werden.
metaecho.living_host=Lebender Host
metaecho.living_host.page=68
metaecho.living_host.desc=Du musst das Echo Transzendentes Netzwerk haben, um dieses Echo erwerben zu können. Wenn du einige Zeit in tiefer Konzentration verbringst und das sammelst und formst, was sich nur als Resonanzkraft bezeichnen lässt, kannst du deine lebende Persona in das Äquivalent eines Hosts verwandeln. Das erfordert eine Ausgedehnte Probe auf Tasken + Resonanz mit einem Schwellenwert gleich deinem Resonanzattribut und einem Intervall von 1 Stunde. Sobald die Probe abgeschlossen ist, wirst du zu einem lebenden Host innerhalb der Matrix. Nur ein Technomancer, Sprite, Resonanz- oder Dissonanzwesen, der oder das bei einer Matrixwahrnehmungs-Probe mindestens einen Nettoerfolg erzielt, erkennt, dass du kein echter Matrix-Host bist. Während dieses Echo aktiv ist, hast du eine Hoststufe gleich deinem Resonanzattribut, und deine Matrixattribute sind die gleichen wie die deiner lebenden Persona. Die Anzahl der Geräte, die mit dir verbunden werden können, erhöht sich auf deine Hoststufe x 10, und du erhältst alle Vorteile deines Echos Transzendentes Netzwerk. Du kannst eine praktisch unbegrenzte Anzahl virtueller Räume erschaffen, die jedoch alle auf irgendeine Weise miteinander verbunden sein müssen. Personas können auf dich genauso zugreifen wie auf einen Host, entweder mit deiner Erlaubnis oder indem sie dich hacken. Du kannst eine praktisch unbegrenzte Menge an Daten speichern, aber auf Dateien, die du auf deinen lebenden Host hochlädst, kannst du nur zugreifen, solange du dieses Echo aktiviert hast. </br>Du kannst das Aussehen und die Architektur deines lebenden Hosts nach Belieben verändern und sogar das Aussehen eines anderen Hosts imitieren, den du besucht hast. Während dieses Echo aktiv ist, kannst du nicht von Matrixhandlungen, Komplexen Formen oder Sprite-Kräften angegriffen werden, außer als Host. Das bedeutet, dass du gegen eine Vielzahl von Handlungen unverwundbar bist, die normalerweise auf eine Persona abzielen, wie zum Beispiel <i>Datenspike</i> oder <i>Resonanzspike</i>. Du musst einen Zustand tiefer Konzentration aufrechterhalten und am selben physischen Ort bleiben, während du dieses Echo aufrechterhältst. Wenn du durch einen einzigen Angriff mehr Kästchen Betäubungs- oder Körperlichen Schaden erleidest, als deine Willenskraft beträgt, oder wenn du physisch um mehr als einen Meter von deinem Standort wegbewegt wirst, wird deine Konzentration gestört und dein lebender Host fällt in sich zusammen. Dadurch erleidest du 6 Kästchen Körperlichen Biofeedback-Schaden und einen Auswurfschock. Alle Geräte werden getrennt, und jeder, der sich in der VR im Host aufhält, erleidet ebenfalls einen Auswurfschock. Wenn du deinen lebenden Host abschalten willst, ohne Auswurfschock zu erleiden, muss dir eine Ausgedehnte Probe auf Tasken + Resonanz mit einem Schwellenwert gleich deiner Hoststufe und einem Intervall von 1 Haupthandlung gelingen. Ein Kritischer Patzer bei dieser Probe verursacht Auswurfschock. Du bist nicht in der Lage, IC auszuführen, aber Kopf hoch – du hast Sprites. Da du kein echter Host bist, verfügst du nicht über ein eigenes Fundament. Niemand weiß genau, was passieren würde, wenn jemand durch einen lebenden Host eine Tür zum Fundament finden würde. Einige glauben, dass sie zu einem Resonanzraum führen könnte, aber falls schon mal jemand versucht hat, das herauszufinden, ist er entweder gescheitert oder spricht nicht darüber.
metaecho.machine_mastermind=Meister der Maschinen
metaecho.machine_mastermind.page=69
metaecho.machine_mastermind.desc=Du musst das Echo Maschinenbeherrschung haben, um dieses Echo erwerben zu können. Du erhältst die Vorteile einer Riggerkontrolle der Stufe 2. Dieses Echo kann nur einmal gewählt werden.
metaecho.matrix_amplifier=Matrixverstärker
metaecho.matrix_amplifier.page=69
metaecho.matrix_amplifier.desc=Wenn du eine Haupthandlung ausgibst, um dieses Echo zu aktivieren, wirst du zu einem lebenden Resonanzkanal, der die örtlichen Matrixverbindungen verstärkt. Deine lebende Persona und jedes Gerät im Umkreis von 100 Metern um deinen physischen Körper erhält eine Anzahl von Punkten zur Rauschunterdrückung gleich deinem Wandlungsgrad. Das ist allerdings unglaublich anstrengend für dich. Am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, erleidest du Schwund mit einem Schwundwert in Höhe der aufeinanderfolgenden Kampfrunden, in denen das Echo aktiv war. Um das Echo wieder auszuschalten, ist eine Nebenhandlung erforderlich, die jedoch automatisch erfolgt, wenn du bewusstlos wirst. Dieses Echo alarmiert auch GOD. Dein Overwatch-Wert erhöht sich am Ende jeder Kampfrunde, in der dieses Echo aktiv ist, um deinen Wandlungsgrad. Nachdem du dieses Echo aktiviert hast, darfst du es erst wieder aktivieren, wenn du dich von jeglichem Schwundschaden erholt hast.
metaecho.mega-sprite=Mega-Sprite
metaecho.mega-sprite.page=69
metaecho.mega-sprite.desc=Du erhältst die Möglichkeit, ein registriertes Sprite zu verbessern. Dies erfordert einen speziellen Neuregistrierungsversuch. Gelingt der Versuch, gewähren Nettoerfolge keine zusätzlichen Aufgaben. Stattdessen kannst du mit jedem Nettoerfolg entweder eines der Matrixattribute des Sprites um 1 erhöhen oder das Sprite mit einer zusätzlichen Spritekraft ausstatten, die normalerweise nur für eine andere Art von Sprite verfügbar ist. Du kannst auch vorübergehend ein Verbündeten- oder freies Sprite verbessern. Wenn du dieses Echo bei einem freien Sprite oder einem Verbündetensprite einsetzt, musst du seinen Quellcode kennen, und die Wirkung hält für eine Anzahl von Stunden gleich deinem Resonanzattribut an. Wenn du das Echo bei deinen eigenen registrierten Sprites anwendest, bleibt es so lange aktiv, bis du zum nächsten Mal versuchst, das Sprite neu zu registrieren. Nur eine Anwendung dieses Echos kann auf ein Sprite gleichzeitig wirken. Meister der Maschinen: Du musst das Echo Maschinenbeherrschung haben, um dieses Echo erwerben zu können. Du erhältst die Vorteile einer Riggerkontrolle der Stufe 2. Dieses Echo kann nur einmal gewählt werden.
metaecho.new_sprite_type=Neue Sprite-Art
metaecho.new_sprite_type.page=69
metaecho.new_sprite_type.desc=Du erhältst die Fähigkeit, Assassinen-, Modular-, Musik-, Ur- und Verteidiger-Sprites zu kompilieren und zu registrieren (s. Neue Sprite-Arten, S. 73).
metaecho.resonance_power=Resonanzkraft
metaecho.resonance_power.page=69
metaecho.resonance_power.desc=Du hast etwas aus der Tiefenresonanz gelernt, das dir erlaubt, eine einzelne Spritekraft einzusetzen. Du musst eine Spritekraft festlegen, wenn du dieses Echo erwirbst, und sie kann danach nicht geändert werden. Du kannst dieses Echo mehrmals erwerben, wobei du jedes Mal eine andere Spritekraft wählen musst. Verwende dein Resonanzattribut anstelle der Spritestufe, falls zutreffend. Unmittelbar nach dem Einsatz einer Spritekraft musst du Schwund mit einem Schwundwert gleich der Anzahl der Erfolge widerstehen, die du bei der Probe zum Einsatz der Kraft erzielt hast. Wenn keine Probe erforderlich ist, um die Kraft zu nutzen, beträgt der Schwundwert 3.
metaecho.software_emulator=Software-Emulator
metaecho.software_emulator.page=69
metaecho.software_emulator.desc=Du musst das Echo Lebendes Netzwerk besitzen, um dieses Echo erwerben zu können. Du bist in der Lage, Kommlink-Apps, Matrixprogramme und Autosofts auf deiner lebenden Persona auszuführen. Du hast [Resonanz/2] Programmslots. Die maximale Stufe jedes Programms, das du ausführen kannst, ist 6, und du kannst auf deinem lebenden Netzwerk keinen Agenten laufen lassen. Bevor du ein Programm emulieren kannst, musst du eine Kopie des Programms erwerben, um es zu absorbieren. Das Absorbieren eines Programms verbraucht es und führt zu seiner vollständigen Löschung. Dies erfordert eine Ausgedehnte Probe auf Elektronik (Software) + Logik mit einem Schwellenwert von 4 oder gleich der Stufe des Programms, je nachdem, welcher Wert höher ist, und einem Intervall von 1 Stunde. Misslingt die Probe, kannst du es erneut versuchen. Ein Patzer erhöht den Schwellenwert um 2. Ein Kritischer Patzer führt sowohl zum Misslingen als auch zur Löschung des Programms. Gelingt die Probe, kannst du 1 Karma ausgeben, um den Code in dich aufzunehmen. Danach kannst du ihn jederzeit ausführen. Er kann abstürzen, aber du kannst ihn jederzeit mit einer Nebenhandlung neu laden. Diese Programme können nie dauerhaft aus deinem Gedächtnis gelöscht werden. Die Anzahl der Programme, die du auf diese Weise „lernen“ kannst, ist unbegrenzt.
metaecho.sprite_conduit=Spriteleitung
metaecho.sprite_conduit.page=69
metaecho.sprite_conduit.desc=Du bist in der Lage, tiefe Bindungen mit Sprites einzugehen, und durch diese Bindungen hilfst du ihnen, sich in einer dauerhafteren Form zu registrieren. Du kannst Sprites mit großem Karma- und Zeitaufwand dauerhaft registrieren. Wenn du das tust, kannst du entweder ein freies Sprite oder ein Verbündetensprite erschaffen. Die Regeln dafür finden sich im Kapitel Sprites (S. 78). Du erhältst auf alle Schwundwiderstandsproben durch das Kompilieren und Registrieren von Sprites einen Würfelpoolbonus in Höhe deines Wandlungsgrads.
metaecho.sprite_link=Spriteverbindung
metaecho.sprite_link.page=70
metaecho.sprite_link.desc=Dein Geist ist enger mit deinen Sprites verbunden, sodass sie deine Befehle besser verstehen können. Wenn du eine Aufgabe und eine Nebenhandlung ausgibst, um einem Sprite zu befehlen, dir bei einer Teamwork-Probe mit einer seiner Fertigkeiten zu helfen, erhältst du eine zusätzliche Nebenhandlung. Mit einer Jederzeit-Nebenhandlung und dem Einsatz einer Aufgabe kannst du Schwundschaden, den du erleiden würdest, auf eines deiner Sprites übertragen. Du kannst zuerst versuchen, dem Schwund zu widerstehen, und dann so viele Kästchen nicht widerstandenen Schaden auf das Sprite übertragen, wie du willst. Deine Sprite-Reputation sinkt jedes Mal um 1, wenn du das tust.
metaecho.sprite_symbiosis=Spritesymbiose
metaecho.sprite_symbiosis.page=70
metaecho.sprite_symbiosis.desc=Du musst das Echo Spriteleitung haben, um dieses Echo erwerben zu können. Du kannst dein Verbündetensprite mit deiner Persona verschmelzen,um deine eigene Macht zu stärken. Die vollständigenRegeln dazu findest du im Kapitel Sprites (S. 80).
metaecho.syntax_error=Syntaxfehler
metaecho.syntax_error.page=70
metaecho.syntax_error.desc=Du hast die Geheimnisse der Bekämpfung und Auftrennung Komplexer Formen und Spritekräfte erlernt. Wenn du eine Matrixhandlung wahrnimmst, die auf ein Icon abzielt, das du ebenfalls wahrnimmst, kannst du eine Jederzeit-Nebenhandlung ausgeben, um dem Ziel Bonuswürfel in Höhe deines Wandlungsgrads für seine Verteidigungsprobe zu geben. Wenn du dir einer Komplexen Form oder Spritekraft bewusst bist, die aufrechterhalten wird, kannst du versuchen, sie zu schwächen oder abzubrechen. Leg eine Vergleichende Probe auf Elektronik + Resonanz + Wandlungsgrad gegen Logik + Resonanz (bei Sprites gegen Datenverarbeitung + Stufe) ab. Gelingt dir die Probe, senke die Nettoerfolge der Komplexen Form oder der Spritekraft um 1 pro Nettoerfolg. Wenn dadurch die Nettoerfolge der Komplexen Form oder Spritekraft auf null oder weniger gesenkt werden, endet die aufrechterhaltene Form oder Kraft sofort. Dafür musst du eine Haupthandlung ausgeben, und du erleidest nach jedem Versuch Schwundschaden in Höhe der Erfolge, die gegen dich bei der Vergleichenden Probe erzielt wurden (Gesamterfolge, nicht Nettoerfolge).
metaecho.transcendent_network=Transzendentes Netzwerk
metaecho.transcendent_network.page=70
metaecho.transcendent_network.desc=Du musst das Echo Lebendes Netzwerk haben, um dieses Echo erwerben zu können. Wenn deine lebende Persona als Master-Gerät in einem Netzwerk fungiert, fungierst du als fortschrittliche Leitung für Daten, die durch dich laufen, und bist in der Lage, Daten mit übermenschlicher Geschwindigkeit zu analysieren und zu verarbeiten. Auf diese Weise kann jeder, der an dein Netzwerk angeschlossen ist, vom Informationsaustausch profitieren, ähnlich wie bei einem M-TOC. Um von diesem Echo profitieren zu können, muss eine Person ihr Kommlink (oder ein anderes personaerzeugendes Gerät) mit deinem lebenden Netzwerk verbinden. Alle angeschlossenen Personen haben Zugang zu einem speziellen Edge-Pool in Höhe deines Wandlungsgrads. Dieser Edge-Pool ist leer, wenn er eingerichtet wird, aber jeder angeschlossene Charakter kann sein Edge jederzeit eins zu eins in ihn übertragen. Wenn ein angeschlossener Charakter einen Edge-Punkt erhält, ohne dass der Edge-Punkt auf die maximale Anzahl an Edge-Punkten angerechnet wird, die man in jeder Runde erhalten kann. Edge aus dem transzendenten Netzwerk kann für jeden Edge-Boost und jede Edge-Handlung verwendet werden, die einem Charakter zugutekommt, der mit dem Netzwerk verbunden ist. Wenn du auch über ein M-TOC-System verfügst, kannst du dieses zusammen mit den Vorteilen des transzendenten Netzwerks voll nutzen. Sie kollidieren nicht miteinander. Ein weiterer Vorteil dieses Echos ist, dass verbundene Charaktere, die die Handlung Nachricht übermitteln (eine Nebenhandlung) untereinander verwenden, unmittelbar danach eine zusätzliche Nebenhandlung erhalten. Dadurch entsteht bei den Nutzern oft der Eindruck, dass sie eine telepathische Verbindung haben.

datastructure.admonisher=Mahner
datastructure.admonisher.page=70
datastructure.admonisher.desc=Du erhältst Bonuswürfel für eine Probe zum Dekompilieren eines Sprites und für die darauffolgende Schwundwiderstandsprobe. Du erhältst 1 Edge, wenn du beim Versuch, ein Sprite zu dekompilieren, mindestens einen Nettoerfolg erzielst.
datastructure.bandersnatch=Bandersnatch
datastructure.bandersnatch.page=71
datastructure.bandersnatch.desc=Du erhältst Bonuswürfel für eine Handlung Befehl vortäuschen oder eine Komplexe Form Puppenspieler. Wenn du einen Bandersnatch auf eine Komplexe Form Puppenspieler anwendest, erhältst du außerdem Bonuswürfel für die Schwundwiderstandsprobe.
datastructure.code_shell=Codepanzer
datastructure.code_shell.page=72
datastructure.code_shell.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Probe, um Matrixschaden widerstehen. Wenn du Codepanzer gegen einen Daten- oder Resonanzspike einsetzt, erhältst du 1 Edge, wenn du dem gesamten Schaden widerstehst.
datastructure.data_blade=Datnklinge
datastructure.data_blade.page=72
datastructure.data_blade.desc=Du erhältst Bonuswürfel für eine Handlung Datenspike oder eine Komplexe Form Resonanzspike. Du erhältst 1 Edge, wenn du eine Persona oder ein IC abstürzen lässt, während du Datenklinge benutzt.
datastructure.drone_whisperer=Drohnenflüsterer
datastructure.drone_whisperer.page=72
datastructure.drone_whisperer.desc=Du erhältst Bonuswürfel für eine Matrixhandlung oder Komplexe Form, die eine Drohne zum Ziel hat. Immer, wenn du Drohnenflüsterer einsetzt, um eine Drohne lahmzulegen (d. h. ihren Matrix-Zustandsmonitor mit Schaden aufzufüllen) oder zu hacken (mit Brute Force, Sondieren oder Hintertür benutzen), und mindestens einen Nettoerfolg erzielst, erhältst du 1 Edge.
datastructure.eavesdropper=Lauscher
datastructure.eavesdropper.page=72
datastructure.eavesdropper.desc=Du erhältst Bonuswürfel für eine Handlung Übertragung abfangen oder eine Komplexe Form Signalschleier. Wenn du eine Handlung Übertragung abfangen ausführst, die von Lauscher profitiert, zählst du automatisch als jemand mit Admin-Zugang und erzeugst durch die Handlung Übertragung abfangen keinen Overwatch-Wert.
datastructure.echo_chamber=Echokammer
datastructure.echo_chamber.page=72
datastructure.echo_chamber.desc=Du erhältst Bonuswürfel für eine Probe zur Verwendung eines Echos.
Erdungsstab: Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Schwundwiderstandsprobe. Wenn du bei der Verwendung von Erdungsstab dem Schwundschaden vollständig widerstehst, erhältst du 1 Edge.
datastructure.extra_life=Extraleben
datastructure.extra_life.page=72
datastructure.extra_life.desc=Du erhältst Bonuswürfel für eine Probe, um Biofeedback-Schaden zu widerstehen. Wenn du dem gesamten Biofeedback-Schaden widerstehst, während du Extraleben einsetzt, erhältst du 1 Edge.
datastructure.grounding_rod=Erdungsstab
datastructure.grounding_rod.page=72
datastructure.grounding_rod.desc=
datastructure.logic_virus=Logikvirus
datastructure.logic_virus.page=72
datastructure.logic_virus.desc=Du erhältst Bonuswürfel für eine Matrixhandlung oder Komplexe Form, die ein IC zum Ziel hat. Erhalte 1 Edge, wenn du mindestens einen Nettoerfolg bei einer Matrixhandlung oder einer Komplexen Form erzielst, die du gegen IC einsetzt, aber nur, wenn du Logikvirus für diese Handlung aktivierst.
datastructure.link_light=Linklicht
datastructure.link_light.page=72
datastructure.link_light.desc=Du erhältst Bonuswürfel für eine Handlung Icon aufspüren und zählst für diese Handlung automatisch als jemand mit Admin-Zugang. Wenn du ein Persona-Icon mit Linklicht erfolgreich aufspürst, erhältst du 1 Edge.
datastructure.master_key=Generalschlüssel
datastructure.master_key.page=72
datastructure.master_key.desc=Du erhältst Bonuswürfel für eine Hacking-Handlung: Brute Force, Sondieren oder Hintertür benutzen. Du erhältst 1 Edge, wenn du mindestens einen Erfolg bei der Handlung erzielst, die von der Aktivierung eines Generalschlüssels profitiert.
datastructure.meat_cleaver=Fleischerbeil
datastructure.meat_cleaver.page=72
datastructure.meat_cleaver.desc=Du erhältst Bonuswürfel für eine Matrixhandlung Datenspike oder eine Komplexe Form Resonanzspike, die eine Persona im VR-Modus zum Ziel hat. Dein Ziel erleidet Biofeedback-Schaden – Körperlichen Schaden bei heißem Sim, Betäubungsschaden bei kaltem Sim – mit einem Schadenswert gleich deinem Angriffsattribut. Schaden von einem Fleischerbeil wird nicht durch Nettoerfolge erhöht. Wenn du mit einem Fleischerbeil Körperlichen Schaden oder Betäubungsschaden verursachst, erhältst du 1 Edge.
datastructure.oracle=Orakel
datastructure.oracle.page=72
datastructure.oracle.desc=Du erhältst Bonuswürfel für eine Matrixwahrnehmungs- oder Matrixsuche-Probe. Wenn du Orakel aktivierst, haben alle deine Ausgedehnten Proben auf Matrixsuche ein Intervall von 1 Minute.
datastructure.phase_shifer=Phasenschieber
datastructure.phase_shifer.page=72
datastructure.phase_shifer.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel, um einer IC-Handlung zu widerstehen. Wenn du mit einem Phasenschieber bei einer Vergleichenden Probe mehr Erfolge als das IC erzielst, erhältst du 1 Edge.
datastructure.resonance_focus=Resonanzfokus
datastructure.resonance_focus.page=72
datastructure.resonance_focus.desc=Du erhältst Bonuswürfel bei einer Probe, die dein Resonanzattribut verwendet. Die Karmakosten für die Integrierung eines Resonanzfokus sind doppelt so hoch wie normal.
datastructure.resonance_shield=Resonanzschild
datastructure.resonance_shield.page=72
datastructure.resonance_shield.desc=Kann mit einer Jederzeit-Nebenhandlung aktiviert werden. Du erhältst Bonuswürfel für eine Verteidigungsprobe gegen die Handlung Datenspike oder die Komplexe Form Resonanzspike. Hilft nicht gegen IC oder andere Quellen von Matrixschaden. Wenn du nach der Aktivierung eines Resonanzschildes dem Schaden eines Datenspikes oder Resonanzspikes vollständig widerstehst, erhältst du 1 Edge.
datastructure.sprite_caller=Spriterufer
datastructure.sprite_caller.page=72
datastructure.sprite_caller.desc=Du erhältst Bonuswürfel bei einer Probe, um ein Sprite der festgelegten Art zu kompilieren oder zu registrieren. Wenn du mindestens einen Erfolg erzielst, während du Spriterufer verwendest, um ein Sprite zu kompilieren oder zu registrieren, erhältst du 1 Edge.

sprite.assassin=Assassinen-Sprite
sprite.assassin.page=73
sprite.assassin.desc=Einige der rachsüchtigsten Technomancer haben gelernt, Sprites zu kompilieren, die zu ihrer Gesinnung passen. Diese Sprites sind verstohlen und gewalttätig und können Personas Biofeedback-Schaden zufügen, anstatt sie einfach nur abstürzen zu lassen.
sprite.defender=Verteidiger-Sprite
sprite.defender.page=74
sprite.defender.desc=Verteidiger-Sprites eignen sich perfekt für die Rolle des Matrix-Überwachers. Sie sind hocheffektive Leibwächter, die andere vor Matrixbedrohungen schützen können.
sprite.modular=Modular-Sprite
sprite.modular.page=73
sprite.modular.desc=Modular-Sprites sind äußerst vielseitig und können sich an jede gewünschte Aufgabe anpassen.
sprite.music=Musik-Sprite
sprite.music.page=74
sprite.music.desc=Einige Technomancer betrachten die Resonanz als etwas, das der Harmonie dient, und verwenden Konzepte der Musik und der Kunst, um ihre Geheimnisse zu verstehen. Musik-Sprites sind künstlerisch und expressiv. Sie spiegeln die Erfahrungen und Perspektiven der Umgebung und der Wesen wider, denen sie begegnen.
sprite.primal=Ur-Sprite
sprite.primal.page=74
sprite.primal.desc=Ur-Sprites sind chaotische und geheimnisvolle Wesen. Sie werden von Technomancern kompiliert, die ihren Geist darauf trainiert haben, ihren kompilierten Sprites fast nichts von sich selbst aufzuprägen, weil sie die wilde Matrix nicht durch metamenschliche Erwartungen „korrumpieren“ wollen. Solche Sprites neigen dazu, bizarre Formen anzunehmen, die man nur schwer für längere Zeit ansehen kann, und sie kommunizieren mit ungewöhnlichen nonverbalen oder nicht textlichen Mitteln. Klassische Modemschreie scheinen bei ihnen sehr beliebt zu sein. Da sie auf diese undeutlichen Kommunikationstechniken angewiesen sind, kann es schwer sein, ihnen Befehle zu erteilen. Sie sind dafür bekannt, dass sie Anweisungen völlig zu ignorieren scheinen und die Dinge auf ihre eigene seltsame Art und Weise angehen – ob sie tatsächlich versuchen, Befehle zu befolgen, und dabei scheitern, oder ob sie einfach nur stur sind, lässt sich nicht feststellen. Es gibt jedoch auch andere als ideologische Gründe für das Kompilieren dieser Sprites. Ur-Sprites sind in der Regel ziemlich mächtig und fähig, sodass sie Drek erledigen – wenn sie tatsächlich einmal Befehle befolgen.

quality.at_home_in_the_matrix=In der Matrix zu Hause
quality.at_home_in_the_matrix.page=84
quality.at_home_in_the_matrix.desc=Du fühlst dich in der Matrix wirklich zu Hause, als wärst du dort geboren. </br>Wenn du in der VR heißes Sim verwendest, kannst du pro Kampfrunde 1 Edge mehr als normal erhalten. Normalerweise können Charaktere maximal 2 Edge pro Runde erhalten.
quality.brilliant_heuristics=Brilliante Heuristik
quality.brilliant_heuristics.page=81
quality.brilliant_heuristics.desc=Du hast eine besondere Gabe dafür, deine Rechenleistung effizient zu bündeln. </br>Auswirkung: Wenn du eine Nebenhandlung ausgibst, um deine verfügbare Rechenleistung vorzubereiten und zu kalibrieren, bevor du eine Matrixhandlung durch-führst, füge die (aufgerundete) Hälfte deines Attributs Datenverarbeitung als Bonuswürfel zur Probe der Ma-trixhandlung hinzu. Wenn du danach nicht sofort eine Matrixhandlung ausführst, geht der Bonus verloren. Dieser Vorteil kann nur von einer Persona verwendet werden, die auf einem Cyberdeck läuft.
quality.data_anomaly=Datenanomalie
quality.data_anomaly.page=82
quality.data_anomaly.desc=Wenn du in der Matrix nicht auffallen willst, kennst du ein paar zusätzliche Tricks, die dir helfen, verborgen zu bleiben. </br>Auswirkung: Wenn du auf Schleichfahrt läufst, erhältst du 1 Edge, wenn eine Matrixwahrnehmungs-Probe abgelegt wird, um dich oder ein Icon in deinem Netzwerk zu entdecken.
quality.datahaven_membership=Datahaven-Mitgliedschaft
quality.datahaven_membership.page=82
quality.datahaven_membership.desc=Du hast Zugang zu ein paar Datahavens und bist dort regelmäßig präsent. Dein Benutzername ist dort bekannt. Von vielen wird er respektiert, von einigen verabscheut. Das ist immer dann nützlich, wenn du nach Informationen suchst, die sonst nur schwer zu finden sind. </br>Auswirkung: Für jede Stufe dieses Vorteils hast du Zugang zu einem anderen Untergrund-Datahaven in der Matrix, in dem Infobroker, Schieber und Shadowrunner illegale Daten und Geschäftsgeheimnisse speichern und weitergeben. Wenn du eine Matrixsuche durchführen musst, um Informationen über ein Thema zu finden, das vor der Öffentlichkeit verborgen wird, erhältst du 1 Edge. Detailliertere und gründlichere Informationen sind nach Maßgabe der Spielleitung verfügbar, aber du bist nicht der Einzige, der Datahavens nutzt. Wenn du diesen Vorteil bei einem Run einsetzt, addiere +1 zum Fahndungsstufen-Modifikator deines Teams.
quality.deck_builder=Deckbastler
quality.deck_builder.page=82
quality.deck_builder.desc=Dein maßgefertigtes Cyberdeck ist nie fertig: Für weitere Upgrades ist immer Platz. </br>Auswirkung: Wenn du Karma ausgibst, um deine Hardware zu bauen oder upzugraden, ist jeder Punkt Karma 5.000 Nuyen statt 4.000 Nuyen wert. Jede Hardware, die du selbst baust (indem du Karma statt Nuyen für jede Komponente ausgibst), ist modularer als üblich. Du kannst die Matrixhandlung Matrixattribute austauschen verwenden, um deine Matrixattribute auszutauschen, wenn du ein maßgefertigtes Cyberdeck oder einen maßgefertigten Cyberhack benutzt, das oder den du selbst gebaut hast.
quality.fade_to_black=Ausblenden
quality.fade_to_black.page=81
quality.fade_to_black.desc=Wenn du in der Matrix auf Probleme stößt, gibt es dir einen Kick, sie abzuschütteln. </br>Auswirkung: Wenn du die Matrixhandlung Verstecken erfolgreich durchführst, erhältst du 1 Edge.
quality.fractal_blast=Fraktale Druckwelle
quality.fractal_blast.page=83
quality.fractal_blast.desc=Manche Hacker verlassen sich ganz auf ihr Angriffsattribut, aber du weißt, wie du deine Datenspikes mit reiner Mathematik verstärken kannst. </br>Auswirkung: Wenn du eine Nebenhandlung ausgibst, um deine Rechenleistung darauf zu fokussieren, eine Handlung Datenspike zu verstärken, erhöhe den Grundschadenswert deines Datenspikes um die (abgerundete) Hälfte deines Attributs Datenverarbeitung. Wenn du der Nebenhandlung nicht sofort eine Handlung Datenspike folgen lässt, geht dieser Bonus verloren. Dieser Vorteil kann nur von einer Persona verwendet werden, die auf einem Cyberdeck läuft.
quality.golden_screwdriver=Goldener Schraubendreher
quality.golden_screwdriver.page=83
quality.golden_screwdriver.desc=Ob mit einem Schraubendreher oder einem Lötkolben, du bist ein wahrer Hardware-Zauberer. </br>Auswirkung: Wenn du eine Probe ablegst, um Matrixschaden zu reparieren, beträgt das Intervall der Ausgedehnten Probe nur 10 Minuten statt 1 Stunde.
quality.hacker_combo=Hacker-Kombo
quality.hacker_combo.page=83
quality.hacker_combo.desc=Du hast eine Abfolge von Handlungen in der Matrix so oft geübt, dass sie sich wie eine einzige Handlung anfühlt. </br>Auswirkung: Wähle zwei bestimmte Matrixhandlungen. Du kannst diese Handlungen zusammen ausführen, indem du eine Neben- und eine Haupthandlung ausgibst. Jedes Mal, wenn du diese Kombination verwendest, kannst du wählen, welche der beiden Matrixhandlungen zuerst ausgeführt wird. Du kannst diesen Vorteil mehrmals wählen, um mehrere Kombos zu lernen.
quality.hold_the_door=Durchhalten
quality.hold_the_door.page=82
quality.hold_the_door.desc=Du hast gelernt, illegale Matrix-Zugänge mit anderen Personas zu teilen. </br>Auswirkung: Wann immer du einen illegalen User- oder Admin-Zugang erhältst, kannst du diesen Zugang mit einer Anzahl zusätzlicher Personas gleich der Anzahl der bei der entsprechenden Probe erzielten Nettoerfolge teilen. Du kannst den Zugang nur Personas gewähren, die ihn bereitwillig annehmen, was eine Jederzeit-Nebenhandlung des Empfängers erfordert. Wenn du einer Persona, die kein Schleicher-Attribut hat, einen illegalen Admin-Zugang gibst, erhöht sich ihr Overwatch-Wert am Ende jeder Kampfrunde um 2W6.
quality.icu=Ich sehe Dich
quality.icu.page=84
quality.icu.desc=Es gibt dir einen Kick, versteckte Icons in der Matrix zu entdecken. </br>Auswirkung: Wenn du ein Icon entdeckst, das auf Schleichfahrt läuft, erhältst du 1 Edge. Das gilt nur, wenn es für die Geschichte relevant ist – wenn du bloß durch die Stadt fährst und zufällige Icons entdeckst, bringt dir dieser Vorteil kein zusätzliches Edge.
quality.impenetrable_logic=Unerschütterliche Logik
quality.impenetrable_logic.page=84
quality.impenetrable_logic.desc=Dein schneller und anpassungsfähiger Sinn für Logik hilft dir, Angriffsmuster und potenzielle Bedrohungen zu erkennen. </br>Auswirkung: Wenn du die Handlung Volle Abwehr (nicht Volle Matrixabwehr) einsetzt, verwende dein Attribut Logik anstelle von Willenskraft.
quality.jack_jockey=Buchsenjockey
quality.jack_jockey.page=81
quality.jack_jockey.desc=Du weißt, wie man einen Vorteil aus einer Direktverbindung zieht. </br>Auswirkung: Wenn du eine Direktverbindung zum Ziel deiner Matrixhandlung oder Komplexen Form hast, erhältst du einige entscheidende Vorteile: Erstens darf das Ziel bei der Verteidigungsprobe gegen dich kein Edge erhalten oder ausgeben. Zweitens genießt das Ziel nicht den Schutz einer Firewall, die von einer externen Quelle (z. B. einem PAN) bereitgestellt wird – für seine Verteidigungsprobe gilt nur seine eigene Firewall. Drittens: Wenn das Ziel ausgeschaltet wird, kannst du es mit einer Handlung Gerät steuern wieder einschalten.
quality.loner=Einzelgänger
quality.loner.page=83
quality.loner.desc=Du arbeitest besser allein, zumindest in der Matrix. Es ist schön, wenn man Leute im Team hat, die die anderen Aspekte eines Runs abdecken, aber du magst es einfach nicht, wenn dir jemand über die Schulter schaut. </br>Auswirkung: Immer, wenn du den AR- oder VR-Modus verwendest und kein Agentenprogramm laufen hast, keine Sprites kompiliert oder registriert hast (einschließlich Verbündeten-Sprites und Sprites auf Standby) und keine SimShare-Tramper dabei hast, bist du von einem Gefühl der Freiheit, der Konzentration, des Stolzes und der Kontrolle erfüllt. In diesem Fall fügst du allen Proben auf Matrixhandlungen und Komplexe Formen einen Schicksalswürfel hinzu und ignorierst, wenn dieser Schicksalswürfel eine 1 würfelt – er fügt dann zwar keine Erfolge hinzu und zählt auch immer noch gegen Patzer, macht aber nicht wie üblich alle gewürfelten 5en unbrauchbar (s. SR6, S. 51). Andere Schicksalswürfel, die aus anderen Quellen stammen, funktionieren weiterhin wie gewohnt.
quality.matrix_attribute_adv=Matrixattribute-Steigerung
quality.matrix_attribute_adv.page=84
quality.matrix_attribute_adv.desc=Du bist in einigen Aspekten der Matrix extrem gut geworden oder hast unkonventionelle Wege gefunden, um deine Persona zu verbessern. </br> Wähle ein Matrixattribut: Angriff, Schleicher, Datenverarbeitung oder Firewall. Dieses Matrixattribut wird permanent durch die Stufe in diesem Vorteil erhöht. Diese Erhöhung gilt für Matrixattribute, nachdem sie ausgetauscht wurden – sie wird nicht mit dem Attribut verschoben, wenn ein Decker es austauscht. Du kannst diesen Vorteil mehrmals kaufen, um verschiedene Matrixattribute zu steigern. Dieser Vorteil steht jedem Charakter zur Verfügung, einschließlich Deckern, Technomancern oder sogar Straßensamurai, die einfach nur eine stärkere Firewall wollen. Die gesteigerte Stufe des Matrixattributs zählt, wenn sie durch Komplexe Formen, Matrixprogramme und andere Mittel zur Erhöhung von Matrixattributen weiter verbessert werden soll, als seine ungesteigerte Stufe.
quality.natural_hacker=Geborener Hacker
quality.natural_hacker.page=83
quality.natural_hacker.desc=Du nutzt deine angeborene Verbindung zur Resonanz, um Dinge in der Matrix zu erledigen. Das ist alles, was du brauchst. </br>Auswirkung: Immer, wenn du eine Matrixhandlung durchführst oder eine Verteidigungsprobe gegen eine Matrixhandlung, eine Komplexe Form oder eine Spritekraft ablegst, kannst du dein Resonanz-Attribut anstelle eines anderen Nicht-Matrixattributs verwenden, das bei dieser Probe verwendet wird. Du kannst mit diesem Vorteil nicht Angriff, Schleicher, Datenverarbeitung oder Firewall durch Resonanz ersetzen.
quality.online_fame=Online-Promi
quality.online_fame.page=84
quality.online_fame.desc=Deine Persona ist in der Matrix weithin bekannt. Seltsamerweise wirkt sich das häufiger zu deinen Gunsten aus, als dass es dir in die Quere kommt. </br>Auswirkung: Immer wenn du in der Matrix eine Einfluss- oder Überreden–Probe ablegst, erhältst du dafür einen Würfelpoolbonus gleich deiner Stufe in diesem Vorteil. Wenn du diesen Vorteil während eines Runs einsetzt, addiere am Ende des Runs +1 zu deinem Fahndungsstufen-Modifikator. Dieser Fahndungsstufen-Modifikator wirkt sich nur auf deine persönliche Fahndungsstufe aus.
quality.profiler=Profiler
quality.profiler.page=84
quality.profiler.desc=Du bist gut darin, Informationen über Personen zu sammeln und zusammenzutragen. </br>Auswirkung: Du kannst zu jeder Person ein Profil erstellen. Dies erfordert eine Matrixsuche-Probe mit einem Schwellenwert von 6 und einem Intervall von 1 Stunde, gefolgt von einer Programmierprobe mit einem Schwellenwert von 6 und einem Intervall von 1 Minute. Dieses Intervall kann nicht verringert werden – auch nicht durch die Verwendung einer Orakel-Datenstruktur (siehe S. 72). Einmal erstellt, ist das Profil dauerhaft – wir können davon ausgehen, dass du hier und da ein paar Minuten damit verbringst, deine gespeicherten Profile auf dem neuesten Stand zu halten. Das Profil enthält alle grundlegenden Informationen, die die Spielleitung als Ergebnis erfolgreicher Beinarbeit zur Verfügung stellen könnte, ist aber auch für die Interaktion mit der Person nützlich. Wenn du ein Profil von jemandem hast, erhältst du 1 Edge für alle Überreden-, Einfluss- und Menschenkenntnis-Proben gegen diese Person. Dieses Edge muss für die Probe verwendet oder im Profil gespeichert werden. Jedes Profil kann bis zu 6 Edge speichern. Dieses Edge kann nur von dir verwendet werden, und du kannst es nur für Edge-Boosts und -Handlungen gegen das Ziel verwenden. Edge aus dem Profil kann für jede Art von Probe gegen das Ziel des Profils verwendet werden – nicht nur für Überreden-, Einfluss- und Menschenkenntnis-Proben. In einem Profil gespeichertes Edge verschwindet vollständig zu Beginn der nächsten Spielsitzung, wenn Edge aufgefrischt wird.
quality.quick_config=Schnellkonfiguration
quality.quick_config.page=84
quality.quick_config.desc=Du bist sehr gut darin, dein Cyberdeck im Handumdrehen neu zu kalibrieren. </br>Auswirkung: Mit der Handlung Matrixattribute austauschen kannst du mit einer einzigen Nebenhandlung eine beliebige Anzahl von Matrixattributen und Programmen austauschen. Wenn du dich in einem Matrixkampf oder einer Kampfsituation befindest, erhältst du einmal pro Runde 1 Edge, wenn du in dieser Runde die Handlung Matrixattribute austauschen durchführst.
quality.reverberant=Nachhall
quality.reverberant.page=84
quality.reverberant.desc=Manche Leute scheinen ein Gespür für die Resonanz zu haben, auch wenn sie sie selbst nicht nutzen können. </br>Auswirkung: Mit einer erfolgreichen Handlung Matrixwahrnehmung bist du in der Lage, Dinge in der Resonanz zu erkennen und zu analysieren, die normalerweise nur von Wesen mit dem Attribut Resonanz wahrgenommen werden können.
quality.satisfaction=Codeknacker
quality.satisfaction.page=81
quality.satisfaction.desc=Neugier war vielleicht der Katze Tod, aber du weißt, was sie zurückgebracht hat, nicht wahr? </br>Auswirkung: Wenn du erfolgreich eine Verschlüsselung knackst oder eine Datenbombe auf einer Datei entschärfst, erhältst du 1 Edge. Dies gilt nicht, wenn die Verschlüsselung oder die Datenbombe nur platziert wurde, damit du mit diesem Vorteil Edge bekommst – du bekommst das Edge nur, wenn es (nach Maßgabe der Spielleitung) auf deinen Erfolg ankam.
quality.surgical_strike=Gezielter Angriff
quality.surgical_strike.page=83
quality.surgical_strike.desc=Du hast ein Talent dafür, dich auf subtile Weise in Hosts zu hacken. </br>Auswirkung: Die Erhöhung des Overwatch-Werts durch einen illegalen User- oder Admin-Zugang auf einen Host erfolgt für dich nur einmal pro Minute statt einmal pro Kampfrunde.
quality.voider_of_warranties=Gewährleistungsausschluss
quality.voider_of_warranties.page=83
quality.voider_of_warranties.desc=Wenn du dir etwas Zeit für ein handelsübliches Gerät nimmst, kannst du einige unorthodoxe Verbesserungen anbringen. </br>Auswirkung: Wenn du eine passende Werkzeugkiste hast, kannst du jedes in Großserie hergestellte Gerät mit einer Ausgedehnten Probe auf Elektronik (Hardware) + Logik oder Mechanik + Logik (nach Maßgabe der Spielleitung) mit einem Schwellenwert in Höhe der Gerätestufe (oder 4, je nachdem, welcher Wert höher ist) und einem Intervall von 1 Stunde verbessern. Das Gerät erhält eine Anzahl von „Upgradepunkten“ gleich deinem Logik-Attribut. Jedes Mal, wenn du eine Handlung mit einem upgegradeten Gerät durchführst, darfst du eine zusätzliche Nebenhandlung ausgeben, um die Up­ grades zu aktivieren und für jeden Upgradepunkt einen Schicksalswürfel hinzuzufügen. Upgradepunkte verfallen, nachdem sie ausgegeben wurden. Wenn einer dieser Schicksalswürfel eine 1 würfelt, funktioniert das Gerät nicht mehr, nachdem die Handlung durchgeführt wurde. Wenn alle Upgradepunkte verbraucht sind, funktioniert das Gerät nicht mehr auf dieselbe Weise. In beiden Fällen ist eine weitere Ausgedehnte Elektronik- oder Mechanik-Probe wie oben beschrieben erforderlich – aber mit einem Intervall von 1 Minute –, um das Gerät wieder zum Laufen zu bringen. Dadurch wird seine Funktionalität wiederhergestellt, zusammen mit einer Anzahl von Upgradepunkten gleich deinem Logik-Attribut. Dieser Vorteil kann nicht bei Geräten verwendet werden, die eine Persona erzeugen, wie zum Beispiel ein Kommlink, ein Cyberdeck oder eine Riggerkonsole. Bodytech, Drohnen und Fahrzeuge können ebenfalls nicht upgegradet werden. Nach Maßgabe der Spielleitung kann jedes andere Gerät (einschließlich Waffen) verändert werden. Der Vollständigkeit halber: Wenn du diesen Vorteil bei einem Gerät verwendest, erlischt die Herstellergarantie. Anmerkung: Du solltest ein paar Zeilen passendes Fachchinesisch vorbereiten, um zu beschreiben, wie dein bizarres Fachwissen dir hilft, das Gerät zu verbessern, das du mit diesem Vorteil upgradest. Du musst das nicht tun, aber es bringt allen viel mehr Spaß, wenn du es tust.
quality.achilles_heel=Achillesferse
quality.achilles_heel.page=85
quality.achilles_heel.desc=Ob du es weißt oder nicht, es gibt eine bestimmte Art von Schaden, für die du in der Matrix besonders anfällig bist. </br>Auswirkung: Wähle einen der folgenden Punkte aus: Handlung Datenspike, Komplexe Form Resonanz­ spike, Resonanzwesen oder IC. Immer, wenn duMatrixschaden durch die gewählte Quelle erleidest, darfst du den Schaden nicht mit einer Widerstandsprobe senken. Wenn du ein Technomancer bist, teilendeine registrierten (und verbündeten) Sprites deineVerwundbarkeit. Du kannst diesen Nachteil nur einmal wählen.
quality.binary_mentality=Binäre Mentalität
quality.binary_mentality.page=85
quality.binary_mentality.desc=Manche Leute sind in manchen Dingen gut und in anderen nicht, und das ist nun mal so – zumindest glaubstdu das. Deine Denkweise schränkt deine Fähigkeiten ein. </br>Auswirkung: Wähle entweder Elektronik oder Cracken. Du glaubst, dass du diese Fertigkeit – ganz egal, wiesehr du dich auch anstrengen magst – nie ganz beherrschen wirst. Wenn du die gewählte Fertigkeit fürMatrixhandlungen oder Komplexe Formen verwendest, darfst du keine Edge-Boosts oder -Handlungeneinsetzen, die mehr als 2 Edge kosten.
quality.buddy_system=Nicht ohne meinen Chummer
quality.buddy_system.page=85
quality.buddy_system.desc=Ohne jemanden, der dir den Rücken freihält, fühlst du dich nicht sicher genug, um dich richtig zu konzentrieren. </br>Auswirkung: Immer, wenn du allein bist, kannst du pro Kampfrunde maximal 1 Edge erhalten. Wenn du dich im Astralraum befindest, gelten nur astral aktive Verbündete als Begleitung im Sinne dieses Nachteils. Ein herbeigerufener Geist reicht aber aus, um die Edge-­ Einschränkung zu vermeiden. Wenn du dich in der VR befindest, fühlst du dich nur mit Verbündeten in der Matrix nicht so allein, aber ein Agentenprogramm oder ein Sprite in der Nähe oder sogar ein SimShare-­ Tramper reichen aus, um die Edge-Einschränkung zu vermeiden.
quality.bull_in_a_ceramics_store=Elefant im Porzellanladen
quality.bull_in_a_ceramics_store.page=85
quality.bull_in_ceramics.desc=Du bist das Hacker-Äquivalent eines Kampfmonsters, das sich an Zerstörung in der Matrix erfreut. </br>Auswirkung: Du darfst für Matrixhandlungen und Komplexe Formen, die nicht das Potenzial haben, Matrixschaden zu verursachen, kein Edge erhalten oder ausgeben. Die Handlung Brute Force ist die einzige Ausnahme von dieser Einschränkung.
quality.compulsive_archivist=Zwanghafter Archivar
quality.compulsive_archivist.page=86
quality.compulsive_archivist.desc=Du bist das Datenäquivalent eines Messies. Da du nur sehr ungern Dateien löschst, behältst du Belastendes viel länger auf deinen Geräten, als es empfehlenswert ist, und anstatt Dateien zu löschen, sicherst du sie auf Offline-Datenchips und versteckst sie an geheimen Orten. Du greifst fast nie auf diese Dateien zurück, aber allein der Gedanke, sie zu löschen oder zu zerstören, erscheint dir unvorstellbar falsch. Diese Dateien werden unweigerlich von jemandem gefunden werden, sei es ein zufälliger Hacker, der dein Kommlink nach Paydata durchforstet, oder eine neugierige Person, die eines deiner Verstecke findet – es ist nur eine Frage des Wann, nicht des Ob. </br>Auswirkung: Immer, wenn die Spielleitung nach einem Run auf die Fahndungsstufe würfelt, wird dein persönlicher Fahndungsstufen-Modifikator um +1 je volle 50 Karma erhöht, die du verdient hast. Unverbrauchtes Karma aus der Charaktererschaffung zählt dabei nicht. Dieser Fahndungsstufen-Modifikator wirkt sich nur auf deine persönliche Fahndungsstufe aus.
quality.curiosity_killed_the_cat=Neugier ist der Katze Tod
quality.curiosity_killed_the_cat.page=85
quality.curiosity_killed_the_cat.desc=Wenn eine Datei geschützt ist, bist du wie besessen davon, Zugang zu ihr zu erhalten. </br>Auswirkung: Wenn du eine Datei entdeckst, die verschlüsselt oder durch eine Datenbombe geschützt ist, darfst du für keine Probe Edge erhalten oder ausgeben, außer für Proben, die du ablegst, um die Verschlüsselung zu knacken, die Datenbombe zu entschärfen und die Datei zu öffnen. Wenn du die Datei in Ruhe lässt, kannst du nach Ablauf jeder Stunde eine Selbstbeherrschungs-Probe mit einem Schwellenwert von 2 + deiner Stufe in diesem Nachteil ablegen. Gelingt die Probe, darfst du es dabei bewenden lassen. In diesem Fall darfst du wieder ganz normal Edge erhalten und ausgeben. Nach jeder misslungenen Probe erhältst du einen Bonuswürfel für zukünftige Selbstbeherrschungs-Proben, um deine Neugier zu überwinden. Die Anzahl der Bonuswürfel, die du auf diese Weise erhalten kannst, ist unbegrenzt, außer durch Zeit und viel Würfelunglück. Aber du kannst natürlich auch einfach herausfinden, was sich hinter dem Dateischutz verbirgt.
quality.data_liberator=Datenbefreier
quality.data_liberator.page=85
quality.data_liberator.desc=Du hast die starke persönliche Überzeugung, dass Datenöffentlich gemacht werden sollten – oder zumindest dieDaten, die mächtige Leute geheim halten wollen. </br>Auswirkung: Du darfst bei keiner Probe, die mit demVerkauf wertvoller Daten zu tun hat, Edge erhaltenoder ausgeben, und du darfst auch nicht an einerTeamworkprobe teilnehmen, die demselben Zweckdient. Wenn du wertvolle Daten mit dem Einverständnis von jemandem freigibst, der an dem Run teilgenommen hat, bei dem du sie erlangt hast (was in derRegel bedeutet, dass du diese Person mit Nuyen oder Gefälligkeiten entschädigst), erhalten du und jeder indeinem Team, der keine Entschädigung verlangt hat, 1 Karma. Diese Karmaprämie gilt nur einmal pro Runund auch nur, wenn der Wert der Daten mindestens 5.000 Nuyen beträgt.
quality.defective_attribute=Schadhaftes Attribut
quality.defective_attribute.page=86
quality.defective_attribute.desc=Irgendetwas an dir macht eines deiner Matrixattribute weniger effektiv. </br>Auswirkung: Wähle ein Matrixattribut: Datenverarbeitung oder Firewall. Ganz gleich, welches Gerät du verwendest, und selbst, wenn du eine lebende Persona hast: Dieses Matrixattribut kann niemals durch Matrixprogramme, Komplexe Formen, Echos oder Spritekräfte verstärkt werden. Du kannst diesen Nachteil nur einmal wählen.
quality.like_a_boss=Wie ein Boss
quality.like_a_boss.page=86
quality.like_a_boss.desc=Du hältst dich für einen professionellen Hacker mit Finesse und verschmähst die groben Brute-Force-Methoden. </br>Auswirkung: Du darfst bei einer Probe, die Matrixschaden verursachen könnte, weder Edge erhalten noch ausgeben.
quality.mode_lock=Modussperre
quality.mode_lock.page=85
quality.mode_lock.desc=Ob AR-Modus, VR mit kaltem Sim oder VR mit heißem Sim – du hast eine klare Vorliebe. Wer VR mit kaltem Sim bevorzugt, hat wahrscheinlich schon einmal dieAuswirkungen von Biofeedback-Schaden bei einer ihnen nahestehenden Person miterlebt oder bekam vielleicht selbst ein- oder zweimal das Gehirn gebraten. Wenn du AR bevorzugst, bist du höchstwahrscheinlich einmobiler Hacker, der seine physische Umgebung nurungern aus den Augen verliert. VR mit heißem Sim ist die bevorzugte Lösung für Hacker, die sich in der Matrixaustoben wollen. Was auch immer deine Gründe sind, du empfindest die Verwendung eines anderen Modusals des von dir bevorzugten als unhandlich und störend. </br>Auswirkung: Wähle einen bevorzugten Modus: AR, VRmit kaltem Sim oder VR mit heißem Sim. Sofern du nicht deinen bevorzugten Modus verwendest, kannst du bei Matrixhandlungen kein Edge erhalten, unddie Kosten von Edge-Boosts und -Handlungen zur Unterstützung deiner Matrixhandlungen werden verdoppelt.
quality.program_dependency=Programmabhängigkeit
quality.program_dependency.page=86
quality.program_dependency.desc=Du bist von einem speziellen Matrixprogramm abergläubisch abhängig geworden, meistens von Babymonitor. </br>Auswirkung: Wähle ein Matrixprogramm. Immer, wenn dein Cyberdeck dieses Matrixprogramm nicht ausführt, bist du auf dessen Abwesenheit fixiert. In jeder Kampfrunde, in der du eine andere Matrixhandlung als das Laden des Matrixprogramms durchführen möchtest, musst du zuerst eine Nebenhandlung durchführen, um dich zu konzentrieren.
quality.resonance_burn=Resonanzverbrennung
quality.resonance_burn.page=86
quality.resonance_burn.desc=Schwund tut immer richtig weh – und zwar so sehr, dass du ihn möglichst vermeidest. </br>Auswirkung: Wenn du Schwundschaden erleidest, handelt es sich immer um Körperlichen Schaden.
quality.simsense_dependency=SIMsinn-Abhängigkeit
quality.simsense_dependency.page=86
quality.simsense_dependency.desc=Du hast einen BTL-Chip zu viel eingesteckt. Okay, mehr als einen zu viel. Oder vielleicht wurde dein Gehirn von IC gebraten. Jetzt fühlst du dich fehl am Platz, wenn du das Leben mit deinen eigenen Sinnen erlebst. Wenn du nicht in irgendeiner Weise Simsinn verwendest, hast du ein Problem. </br>Auswirkung: Wenn du VR mit heißem Sim verwendest, fühlst du dich wohl. VR mit kaltem Sim ist nicht ganz so gut – du kannst zwar noch Edge ausgeben, aber keines mehr erhalten. Dadurch wird nicht verhindert, dass sich dein Edge zu Beginn einer Spielsitzung auffüllt. Der AR-Modus hilft ein wenig, wenn du dich in der Fleischwelt bewegen musst, aber er fühlt sich nicht gut an. Im AR-Modus kannst du für Matrixhandlungen weder Edge erhalten noch ausgeben. Alle Edge-Boosts und -Handlungen bei Nicht-Matrixhandlungen kosten 1 Edge mehr als normal. Wenn du nicht einmal den AR-Modus ausführen kannst, geht es dir schlecht. Du fängst an zu zittern, und alles erscheint unwirklich. Bis du wieder in den AR- oder VR-Modus wechseln kannst, erhältst du den Status Benommen. Erwachte Charaktere können diesen Nachteil nicht wählen.
quality.sloppy_coder=Schlampiger Programmierer
quality.sloppy_coder.page=86
quality.sloppy_coder.desc=Du schreibst Code schnell, und du nimmst immer den kürzesten Weg. Du verschwendest deine Zeit nicht damit, Bugs zu fixen. </br>Auswirkung: Wann immer du aus irgendeinem Grund eine Programmierprobe ablegst, verkürze das Intervall auf die Hälfte der normalen Zeit. Jedes Mal, wenn das Programm verwendet wird, kommt es zu einem Patzer, unabhängig davon, wie viele 1en gewürfelt werden. Ein kritischer Patzer führt dazu, dass das Gerät, auf dem die Software läuft, neu gestartet wird, es sei denn, sie wird auf einem Host ausgeführt, der sie stattdessen löscht.
quality.wanted_by_god=Von GOD gesucht
quality.wanted_by_god.page=86
quality.wanted_by_god.desc=Deine Persona steht auf GODs Fahndungsliste weit oben. Du bist vielleicht nicht die Nummer eins, aber du arbeitest dich nach oben. </br>Auswirkung: Dein maximaler Overwatch-Wert, bevor die Fokussierung eintritt, ist pro Stufe in diesem Nachteil um 5 niedriger als normal. Das bedeutet, dass GOD auf dich fokussiert, wenn dein Overwatch-Wert 35 auf Stufe 1, 30 auf Stufe 2, 25 auf Stufe 3 und 20 auf Stufe 4 erreicht. Wenn die Fokussierung eintritt, ist die erste Reaktion ein HTR-Team, das dich als extrem gefährlich behandelt. Wenn du während eines Runs illegale Matrixhandlungen durchführst, erhöhe deinen Fahndungsstufen-Modifikator am Ende des Runs um deine Stufe in diesem Nachteil. Dieser Fahndungsstufen-Modifikator gilt nur für dich, es ist also möglich, dass deine Fahndungsstufe steigt, die deiner Mitrunner aber nicht.

critterpower.authority=Autorität
critterpower.authority.page=115
critterpower.authority.desc=Der Null überzeugt Geräte davon, dass seine Befehle von einer vertrauenswürdigen und privilegierten Quelle stammen: dem Besitzer. Immer, wenn ein Null die Handlung Gerät steuern oder Befehl vortäuschen durchführt, erhält er 1 Edge, das als Teil der Handlung ausgegeben werden muss und ansonsten verfällt.
critterpower.entropic_conversion=Entropische Umwandlung
critterpower.entropic_conversion.page=116
critterpower.entropic_conversion.desc=Einige Protosapiente haben die seltene Fähigkeit, Schaden an ihrem Kerncode zu heilen, indem sie die umgebende strukturelle Organisation der Matrix reduzieren – das heißt, indem sie die Entropie erhöhen und die abgesaugte „Organisationsenergie“ durch umgekehrte Entropie in ihre eigene Struktur umwandeln. Mit einer Haupthandlung heilt das Wesen 1W6 Kästchen Matrixschaden und erhöht das Umgebungsrauschen des Gebiets um denselben Betrag. Das Umgebungsrauschen nimmt pro Stunde um 1 Punkt ab, bis es wieder auf seinem normalen Niveau angekommen ist.
critterpower.fnord=Fnord
critterpower.fnord.page=116
critterpower.fnord.desc=Ein Null kann sich vor GOD und jedem anderen in der Matrix verstecken, wenn er es wünscht. Damit ist kein regeltechnischer Mechanismus verbunden. Der Null verschwindet einfach in der Tiefe der Matrix.
critterpower.malleable_icon=Formbares Icon
critterpower.malleable_icon.page=116
critterpower.malleable_icon.desc=Wesen mit dieser Fähigkeit können ihr Matrix-Icon so verändern, dass es jedes andere Icon nachahmt, das sie kürzlich gesehen haben. Auch wenn diese Fähigkeit einer genauen Prüfung nicht standhält, ist sie auf den ersten Blick sehr überzeugend. Ein einzelner Erfolg bei einer Matrixwahrnehmungs-Probe reicht aus, um sie zu durchschauen.
critterpower.munge=Datenfrass
critterpower.munge.page=114
critterpower.munge.desc=Protosapiente fressen Code, um ihre eigene Codestruktur zu erhalten und upzugraden. Dieser Vorgang wird als Datenfraß bezeichnet. Wenn ein Protosapient Daten frisst, hinterlässt er zufällige Daten, die in der Regel das darstellen, was gefressen wurde, aber zerstört oder verdreht. Ein gefressenes Icon könnte zum Beispiel wie ein undeutliches Durcheinander aussehen, während ein gefressenes Programm entweder fehlerhaft funktioniert oder völlig unbrauchbar wird. Das Fressen von Daten ist eine Vergleichende Probe gegen den Host oder das Gerät, auf dem die Daten leben. Der Protosapient legt eine Probe auf Charisma + Angriff gegen Firewall + Datenverarbeitung des Hosts oder Geräts ab. Misslingt die Probe, bleiben die Daten intakt. Um eine Datei zu fressen, muss der Protosapient Zugang zu ihr haben. Um ein Programm zu fressen, muss sich der Protosapient entweder auf demselben Host befinden, auf dem das Programm läuft, oder im selben Netzwerk wie die Persona, die das Programm ausführt. Die Spielleitung bestimmt das Ausmaß des Schadens, der durch den Datenfraß verursacht wird, anhand der folgenden Richtlinien: Die Stufe eines Agenten, eines Pilot-Programms, einer Aktions- oder Linguasoft sollte um das Attribut Angriff des Critters gesenkt werden. Wenn das dazu führt, dass die Software eine Stufe von 0 oder weniger erreicht, wird sie vollständig zerstört. Die Spielleitung kann einen Schwellenwert gleich dem Attribut Datenverarbeitung des datenfressenden Critters festlegen, um eine gefressene Datei mit einer Matrixwahrnehmungs-Probe zu lesen. Icons können verzerrt und korrumpiert werden, sodass sie nicht mehr identifizierbar sind oder zumindest verstörend aussehen.
critterpower.munge_spark=Funkenfrass
critterpower.munge_spark.page=116
critterpower.munge_spark.desc=Die meisten Protosapienten fressen Code, um ihre digitale Struktur zu erhalten, aber ein paar dieser Wesen haben gelernt, zu überleben, indem sie den Funken anderer digitaler Lebensformen fressen – der Vampirismus der digitalen Welt. Um diese Fähigkeit einsetzen zu können, muss das Opfer während des gesamten Vorgangs bewegungsunfähig gemacht werden, in der Regel durch wiederholte Anwendungen der Matrixhandlung Teergrube. Funkenfraß erfordert eine Nebenhandlung pro Kampfrunde und muss in jeder folgenden Runde fortgesetzt werden, während das Opfer bewegungsunfähig gehalten werden muss. Das Fressen, um 1 Punkt Funken zu entziehen, erfordert eine Ausgedehnte Probe auf Charisma + Angriff ([12 – Funke des Ziels], 1 Kampfrunde). Wird der Angreifer während dieses Prozesses unterbrochen oder gelingt es dem Opfer, sich zu erholen und zu fliehen, bevor der Schwellenwert erreicht wird, bleibt seine Lebenskraft intakt und der Funke wird nicht entzogen. Wenn der Funke des Ziels auf 0 gesenkt wird, stirbt die digitale Lebensform. Protound Xenosapiente haben in der Regel Funke 6, während freie und Verbündetensprites Funke in Höhe ihrer Stufe haben. Die teilweise Senkung des Funkens eines Sprites senkt dessen Stufe um den gleichen Betrag. Funkenfraß fügt die gestohlene Lebenskraft dem Funken des Angreifers hinzu, kann ihn dadurch aber maximal auf das Doppelte seines natürlichen Maximums erhöhen. Jeder Funke, der über diesen Punkt hinaus entzogen wird, ist verloren; der Kern des Critters kann nur eine bestimmte Menge auf einmal aufnehmen. Sobald ein Protosapient anfängt, Funkenfraß zum Überleben zu benutzen, wird sein eigener Funke instabil, und er verliert 1 Funke pro Woche. Dadurch kann sein Funke sogar unter sein ursprüngliches Niveau fallen, was ihn zwingt, neue Opfer zu jagen.
critterpower.noiseless=Rauschlos
critterpower.noiseless.page=117
critterpower.noiseless.desc=Regeltechnisch sind die Null immun gegen Rauschen – zumindest gegen Rauschen, das durch Entfernung verursacht wird. Die Spielleitung kann entscheiden, dass die Null von anderen Rauschenquellen beeinflusst werden (z. B. solchen, die von einem Hacker oder einer Spamzone verursacht werden).
critterpower.primal_rage=Urzorn
critterpower.primal_rage.page=117
critterpower.primal_rage.desc=Der Protosapient steigert sich aufgrund des Schadens, den er erlitten hat, in einen Rausch. Alle Angriffe dieses Protosapienten erhalten für jeden Würfelpoolmalus von -1, den er durch Schaden erleidet, einen Bonus von +1 auf den Schadenswert.
critterpower.noisestorm=Interferenzsturm
critterpower.noisestorm.page=117
critterpower.noisestorm.desc=Als Haupthandlung kann ein Protosapient, der einen Interferenzsturm verwendet, eine Probe auf Elektronik + Logik ablegen, deren Nettoerfolge das Rauschen in der Umgebung um ihre Anzahl erhöhen. Dies kann entweder auf ein Netzwerk abzielen und sich auf alle damit verbundenen Geräte auswirken, oder auf ein bestimmtes Gerät, um alle Geräte im Umkreis von [Funke x 10] Metern um seinen physischen Standort zu beeinflussen. Der Protosapient ist gegen dieses Rauschen immun.
critterpower.psychotropic_biofeedback=Psychotropes Biofeedback
critterpower.psychotropic_biofeedback.page=117
critterpower.psychotropic_biofeedback.desc=Aufseher können ihre Ziele mit psychotropem Biofeedback schädigen. Das bedeutet, dass die Aufseher Biofeedback-Schaden verursachen. Jedes Mal, wenn tatsächlich Schaden zugefügt wird, muss das Ziel eine Probe auf Willenskraft + Firewall gegen einen Schwellenwert gleich der Anzahl der Nettoerfolge des Angriffs ablegen, um nicht unter einer psychotropen Wirkung zu leiden. Psychotrope Wirkungen sind kurzfristige emotionale Anpassungen, die [2W6 – Edge] Stunden lang andauern. Dazu können Wirkungen wie eine Abneigung gegen bestimmte Gegenstände oder Aktivitäten, das Verlangen nach einem bestimmten Produkt, Selbstzufriedenheit oder Lethargie, Schuldgefühle, Paranoia, eine Abneigung gegen die Matrix, Phobien usw. gehören. Auch der Verlust des Kurzzeitgedächtnisses ist eine Möglichkeit. Das Ziel kann nicht weitgehend außer Gefecht gesetzt oder in einen katatonischen Zustand versetzt werden, aber es wird sich ausgesprochen seltsam verhalten.
critterpower.virtual_processing=Virtuelle Verarbeitung
critterpower.virtual_processing.page=117
critterpower.virtual_processing.desc=Null führen in Wahrheit keine Programme aus. Die jeweils angegebene Liste ist nur eine Möglichkeit, einige ihrer Fähigkeiten zu simulieren. Sie führen immer alle ihre Programme aus.

