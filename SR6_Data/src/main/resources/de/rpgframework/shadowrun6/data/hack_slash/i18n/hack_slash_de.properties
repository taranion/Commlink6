# Cyberadept Qualities from Emotional Path are missing! (Novice, Disciple, Master, Transcendant)
# Neue Kommlink/Matrix-Programme fehlen
# KI-Actions fehlen (S.125ff)
dataset.name=Auswurfschock
dataset.name.short=AS

action.calibration=Kalibrierung
action.calibration.page=30
action.calibration.desc=Du stellst deinen Teammitgliedern deine Rechenleistung zur Verfügung und erhöhst ihre Geschwindigkeit. Du kannst das aktuelle Matrix-Initiativeergebnis von dir und deinen Teammitgliedern für je 2 Erfolge um 1 erhöhen. Der Gesamtbetrag der Erhöhung des Matrix-Initiativeergebnisses, der einer Persona gewährt wird, kann nicht höher sein als dein Attribut Datenverarbeitung, und es kann jeweils nur eine Kalibrierungswirkung aktiv sein. Das Matrix-Initiativeergebnis sinkt danach in jeder Kampfrunde um 1, bis es wieder seinen ursprünglichen Wert erreicht hat. Dieser Bonus gilt für jeden mit einem AR-Feed, der dein PAN teilt. Du kannst deinen Feed für eine maximale Anzahl von Nutzern gleich deiner Gerätestufe freigeben.
action.delayed_command=Verzögerter Befehl
action.delayed_command.page=32
action.delayed_command.desc=Du sendest Nutzdaten an ein Gerät, die einen Befehl und eine Zeitverzögerung enthalten, die das Ziel als von seinem Besitzer stammend wahrnimmt. Das Gerät versucht dann automatisch, die Handlung auszuführen, sobald die Zeitverzögerung abgelaufen ist. Gelingt die Probe, wird der Befehl selbst dann ausgeführt, wenn das Gerät seine WiFi-Funktionalität ausschaltet. Wenn das Gerät neu gestartet wird, bevor der Befehl ausgeführt wird, geht der verzögerte Befehl verloren.
action.denial_of_service=Dienstverweigerung
action.denial_of_service.page=29
action.denial_of_service.desc=Drahtlose Geräte werden fast unbrauchbar, wenn man ihre Datenströme mit Rauschen verschmutzt. Ein Decker oder Technomancer kann ein drahtlos aktives Gerät oder eine Persona anvisieren. Leg eine Vergleichende Probe auf Cracken + Logik gegen Willenskraft + Firewall ab und wende die Anzahl der Nettoerfolge x 2 als Würfelpoolmalus auf alle Proben an, die mit diesem Gerät bis zum Ende der nächsten Runde abgelegt werden.
action.device_lock=Gerätesperre
action.device_lock.page=30
action.device_lock.desc=Manchmal ist der einfachste Weg, einem Hack zu entgehen, das Ausschalten des WiFis. Der Angriff zielt auf ein Gerät und verhindert bei Erfolg, dass das Gerät für [Nettoerfolge] Runden offline geht. Sobald diese Zeit abgelaufen ist, kannst du eine Nebenhandlung ausgeben, um die Gerätesperre um 1 Runde zu verlängern. Diese Verlängerung kann nur einmal vorgenommen werden.
action.garbage_in=Garbage In/Garbage Out
action.garbage_in.page=30
action.garbage_in.desc=Mit diesem Befehl kannst du einige der In- und Outputs eines einzelnen Geräts durcheinanderbringen. Ein einzelner Input kann umgeleitet werden, um einen anderen Befehl auszuführen. So könnte beispielsweise die Anruffunktion eines Kommlinks so verändert werden, dass die Kontaktdaten der Person, die der Benutzer anrufen wollte, automatisch gelöscht werden, oder eine Kamera könnte die Rückspul- mit der Vorspulfunkti-on vertauschen. Der Befehl kann die grundlegenden Sicherheitsfunktionen des Geräts oder Systems nicht außer Kraft setzen, und die Spielleitung hat das letzte Wort darüber, was mit dem Befehl erreicht werden kann.
action.known_exploit=Hintertür mit bekanntem Exploit benutzen
action.known_exploit.page=30
action.known_exploit.desc=<i>Diese Handlung ist mit dem Attribut Schleicher verbunden.</i></br>Du versuchst, eine Reihe bereits bekannter Exploits zu verwenden, um dir unerlaubt Zugang zu einem Host, Gerät oder anderen Bereich der Matrix zu verschaffen. Diese Handlung erfordert keine vorhergehende erfolgreiche Handlung <i>Sondieren</i>, aber bei einem vollständig gepatchten Host ist die Wahrscheinlichkeit eines Erfolgs geringer. Runner, die diese Handlung ausführen, können dafür kein Edge erhalten oder ausgeben. Außerdem erhalten der Host oder das Gerät 1 Edge, das sofort gegen diese Handlung ausgegeben werden muss und ansonsten verfällt. Gelingt die Probe, erhältst du Admin-Zugriff auf das Ziel, der nicht als illegaler Admin-Zugriff zählt (obwohl illegale Matrixhandlungen immer noch deinen Overwatch-Wert erhöhen). Misslingt die Probe, löst das nicht sofort einen Alarm aus, aber dein OW erhöht sich wie üblich.
action.masquerade=Maskerade
action.masquerade.page=31
action.masquerade.desc=Mit dieser Handlung kannst du dich als eine andere Persona in der Matrix ausgeben. Da Persona-Daten in Echtzeit aktualisiert werden, ist es schwierig, diese Handlung erfolgreich auszuführen. Für jeden Nettoerfolg, den du bei einer Vergleichenden Probe auf Cracken + Logik gegen Datenverarbeitung + Intuition erzielst, überzeugst du Matrixsysteme und zufällige Beobachter 1 Minute lang davon, dass du die Persona bist, die du zu sein vorgibst. Damit kann man sich online als jemand anderes ausgeben, seine Anrufe abfangen, seine sozialen Medien nutzen, seinen E-Mail-Verlauf durchstöbern oder anderweitig Unfug treiben, aber bei Vorgängen wie dem Wechsel des Gerätebesitzers oder der Durchführung größerer finanzieller Transaktionen (z. B. Bank-überweisungen) gibt es so viele Doppelkontrollen, dass Maskerade nicht funktioniert. Wenn sich die Persona, für die du dich ausgibst, abmeldet, fällt die Maskerade in sich zusammen. Du kannst dich also nur für eine Persona ausgeben, die zur gleichen Zeit wie du online ist. Während der Maskerade giltst du nie als Besitzer eines der Geräte der verkörperten Persona.
action.metahuman_in_the_middle=Mittelsmetamensch
action.metahuman_in_the_middle.page=32
action.metahuman_in_the_middle.desc=Mit diesem Befehl trittst du zwischen alle Anrufe oder Matrixhandlungen, die in ein Gerät hinein- oder aus ihm hinausgehen. Gelingt die Probe, wird die gesamte Kommunikation des Geräts für [Nettoerfolge] Minuten durch dein Gerät geleitet.
action.modify_icon=Icon modifizieren
action.modify_icon.page=30
action.modify_icon.desc=Manchmal möchtest du, dass das Matrix-Icon deiner Ares Predator VI etwas weniger bedrohlich aussieht. Mit dieser Handlung kannst du ein Matrix-Icon so verändern, dass es wie ein anderes Symbol aussieht. Jedes Mal, wenn dein Icon gescannt wird, muss dir eine Vergleichende Probe auf Cracken + Logik gegen Datenverarbeitung + Schleicher des scannenden Geräts oder Intuition + Datenverarbeitung des Gerätebetreibers gelingen, um nicht entdeckt zu werden.
action.popup=Pop-up
action.popup.page=32
action.popup.desc=Es ist ärgerlich, wenn der gesamte Bildschirm oder die gesamte Ansicht durch Pop-up-AROs oder Fenster blockiert wird, die einen daran hindern, das zu tun, was man tun will. Leg eine Vergleichende Probe auf Cracken + Logik gegen Intuition + Datenverarbeitung eines Zielgeräts oder einer Persona ab. Gelingt die Probe, kann das Ziel für [Nettoerfolge] Runden kein Edge ausgeben.
action.squelch=Ersticken
action.squelch.page=30
action.squelch.desc=Eine gelungene Ersticken-Probe verhindert für [Nettoerfolge] Minuten, dass das Zielgerät Anrufe tätigen oder Nachrichten senden kann.
action.subvert_infra=Infrastruktur unterwandern
action.subvert_infra.page=30
action.subvert_infra.desc=Mit dieser Handlung kannst du die Funktionsweise mehrerer physischer Geräte ein wenig verändern, sodass sie auf deine Befehle reagieren. Wenn du mindestens Admin-Zugang zum Host hast, kannst du pro Nettoerfolg bei einer Vergleichenden Probe auf Cracken + Intuition gegen Intuition + Firewall oder Schleicher + Firewall eine Gruppe ähnlicher einfacher Geräte (Ampeln, Verkaufsautomaten, Haushaltsgeräte, Schreibtischlampen usw., nach Maßgabe der Spielleitung) kontrollieren, die Slaves dieses Hosts sind. Diese Handlung kann nicht für einen Angriff genutzt werden. Du kannst die Kontrolle über diese Geräte mit einer Haupthandlung pro Kampfrunde aufrechterhalten.
action.threat_analysis=Bedrohungsanalyse
action.threat_analysis.page=29
action.threat_analysis.desc=Anstatt anzugreifen, setzt du eine Software zur Markierung von Bedrohungen ein und verschaffst deinen Verbündeten so einen Vorteil für ihre Verteidigung. Mit der Bedrohungsanalyse kannst du allen Verbündeten, die Zugang zu deinem AR-Feed haben, einen Würfelpoolbonus auf all ihre Verteidigungsproben in der physischen Welt und der Matrix geben. Die Anzahl der Bonuswürfel ist gleich der Anzahl der Erfolge bei einer Probe auf Elektronik + Logik. Dieser Bonus hält bis zum Beginn deines nächsten Zuges an. Er gilt für jeden mit einem AR-Feed, der dein PAN teilt. Du kannst deinen Feed mit einer maximalen Anzahl von Nutzern gleich deinem Attribut Datenverarbeitung teilen.
action.virtual_aim=Virtuelles Zielen
action.virtual_aim.page=32
action.virtual_aim.desc=Mit dieser Handlung erhältst du einen Würfelpoolbonus von +1, wenn du die Verteidigung deines Ziels studierst. Du kannst diese Handlung nur einmal pro Kampfrunde ausführen, und der Bonus wird in die nächste Runde übertragen, wenn er nicht genutzt wird, bis du in dieser Runde keine Handlung <i>Virtuelles Zielen</i> einsetzt oder angreifst. Der maximale Würfelpoolbonus aus der Anwendung dieser Handlung ist gleich deiner Willenskraft. Du kannst den Bonus für eine beliebige Matrix-Angriffshandlung – wie zum Beispiel <i>Datenspike</i>, <i>Teergrube</i> oder <i>Resonanzspike</i> – verwenden.
action.watchdog=Stalking
action.watchdog.page=32
action.watchdog.desc=Das Ziel muss eine Persona oder ein Gerät sein. Die Anzahl der Nettoerfolge gibt an, wie viele Kampfrunden das Programm aktiv bleibt. Gelingt die Probe, kannst du sehen, was die Zielperson auf ihren Geräten tut. Du weißt damit, welche Matrixhandlungen die Zielperson ausführen wird, bevor sie sie ausführt, und kannst versuchen, sie zu verhindern. Stalking erlaubt es dir, die Handlung Bedrohungsanalyse als Nebenhandlung einzusetzen, wenn der Angriff vom Ziel ausgeht.
action.batch_execution=Batch Ausführung
action.batch_execution.page=32
action.batch_execution.desc=Mit dieser Handlung kannst du alle Programme ausschalten, die auf deinem Deck laufen. Verwende einfach diese Edge-Handlung, um deinen OW-Zuwachs schnell zu senken oder um dich darauf vorzubereiten, etwas Drek zu zerstören.
action.intervene=Intervention
action.intervene.page=32
action.intervene.desc=Mit dieser Handlung kannst du dem Besitzer eines Geräts, das ein Slave deines PANs ist, einen sofortigen Verteidigungsbonus geben. Diese Handlung kann nur ausgeführt werden, wenn das Gerät, das den Angriff durchführt, aktives WiFi hat und du dir des Geräts bewusst bist. Leg eine Probe auf Elektronik + Logik ab und addiere die Anzahl der Erfolge zum Würfelpool deines Verbündeten. Dieser Bonus gilt nur für die aktuelle Verteidigungsprobe. Er kann nicht auf eine andere Runde oder Handlung übertragen werden.
action.paint_target=Ziel markieren
action.paint_target.page=32
action.paint_target.desc=Mit dieser Handlung markierst du ein Ziel, das du physisch sehen kannst oder dessen Persona dir den Standort des Ziels verrät, in der AR des Teams, damit das Team weiß, wo sich das Ziel befindet. Die Handlung entfernt den Status Geblendet, sofern er durch Deckung oder Rauchgranaten verursacht wurde.
action.computer_virus=Computervirus
action.computer_virus.page=32
action.computer_virus.desc=Die Außerirdischen wollen die Erde zerstören, und die einzige Möglichkeit, sie zu stoppen, besteht darin, diesen Computervirus in ihr System zu laden. Der Runner, der diesen Angriff gegen ein Gerät oder einen Host durchführt, verhindert, dass das Ziel für [Nettoerfolge] Minuten irgendwelche Matrixhandlungen ausführt. Damit kann verhindert werden, dass der Host Aufnahmen von Kameras aufzeichnet oder ein Gebäude verschließt, da sich keines der Sicherheitsschlösser öffnen lässt. Eine Sicherheitsspinne im Host kann versuchen, den Computervirus mit einer Handlung <i>Programm abstürzen lassen</i> zu eliminieren.
action.enhance=Verbessern
action.enhance.page=33
action.enhance.desc=Manchmal ist das Trideomaterial undeutlich, oder vielleicht ist der Ton verstümmelt, aber ein schneller Schuss Verbessern, und plötzlich wird alles klar. Diese Matrixhandlung kann in derselben Runde oder der Runde unmittelbar nach einer Matrixwahrnehmungs-Probe ausgeführt werden. Erfolge bei der Handlung Verbessern werden der vorherigen Handlung <i>Matrixwahrnehmung</i> hinzugefügt.
action.ic_slicer=IC-Schnetzler
action.ic_slicer.page=31
action.ic_slicer.desc=<i>Diese Handlung ist mit dem Attribut Angriff verbunden.</i></br>Du bist ein Meister darin, IC auszuschalten, das die von dir gesuchten Daten bewacht, und jedem IC, das du ins Visier nimmst, Schaden zuzufügen. Dein Angriff hat einen Schadenswert gleich deinem Attribut Angriff plus 1 Schadenskästchen pro Nettoerfolg.
action.keyboard_commando=Tastaturkommando
action.keyboard_commando.page=33
action.keyboard_commando.desc=Du bist der schnellste Hacker auf dem Planeten, und es gibt kein IC-Programm, das dich auf frischer Tat ertappen kann. Du kannst dich so schnell durch die Verteidigung eines Netzwerks schneiden, dass du dich in einer einzigen Runde rein- und raushacken kannst. Mit einem einzigen Nettoerfolg erhältst du einen User-Zugang; mit 4 weiteren Nettoerfolgen erhältst du Admin-Zugang. Mit jedem weiteren Nettoerfolg darüber hinaus kannst du ein Gerät oder eine Datei manipulieren. Du verlässt das Netzwerk sofort nach dem Ausführen dieser Handlung.
action.password_sequencer=Password-Sequenzierer
action.password_sequencer.page=33
action.password_sequencer.desc=Der Host oder das Gerät hat ein komplexes Passwort, das nur die härtesten Zahlenjongleure bewältigen können. Für jede gelungene Probe – unabhängig von der Zahl der Nettoerfolge – kann dein Decking-Verfahren das nächste Element des Passworts aneinanderreihen. Die Anzahl der Elemente des Passworts ist gleich der Hoststufe.
action.skull_and_crossbones=Totenkopf-Angriff
action.skull_and_crossbones.page=33
action.skull_and_crossbones.desc=Du bist ein Meister darin, deine Gegner am Handeln zu hindern. Gelingt die Probe, wird der Bildschirm oder die Sicht des Gegners vollständig von einem riesigen animierten ASCII-Totenkopf verdeckt. Das Ziel kann erst dann wieder eine Handlung ausführen, wenn ihm eine Probe auf Elektronik + Logik mit einem Schwellenwert gleich der Anzahl der Nettoerfolge aus der Handlung <i>Totenkopf-Angriff</i> gelungen ist.
action.we_are_in=Wir sind drin!
action.we_are_in.page=33
action.we_are_in.desc=Wenn du dich erfolgreich in einen Host oder ein Gerät gehackt hast, verrät ein triumphaler Schrei deinem Team, dass du der verfraggt noch mal beste Decker auf dem Planeten bist. Gelingt die Probe, setzt du deinen Edge-Pool wieder auf deinen Edge-Wert zurück. Wenn dein Edge-Pool über deinem Edge-Wert liegt, wird er nicht zurückgesetzt.


