npc.spirit_plants=Pflanzengeister
npc.spirit_plants.page=63
npc.spirit_plants.desc=Die Flora der Sechsten Welt ist ausgesprochen vielfältig und voller Leben. Die Pflanzenwelt verfügt zudem über eine tiefe Verbindung zur metamenschlichen Psyche, sodass sich diese Diversität auch in der Geisterwelt widerspiegelt. Von dornenbedeckten Humanoiden bis hin zu Rankenwesen, deren Kopf an eine Venusfliegenfalle erinnert, sind die Gestalten der Pflanzengeister ebenso vielfältig wie bei allen anderen Spielarten der Geisterwelt.
npc.spirit_guardian=Beschützergeister
npc.spirit_guardian.page=63
npc.spirit_guardian.desc=Das Aussehen von Beschützergeistern deckt die gesamte Bandbreite ab - von Racheengeln bis hin zu Zulu-Kriegern. Sie werden als ultimative Verteidiger beschworen. Da sie vom Ehrenkodex eines Kriegers getrieben werden und unmoralische Taktiken streng ablehnen, kommen diese Geister ihrem Beschwörer zur Hilfe und schützen ihn, sind jedoch so gut wie niemals bereit, sich den Befehlen eines Beschwörers mit finsterem Herzen zu beugen. Beschützergeister stellen sich allen Beschwörern mit negativer Astraler Reputation (S. 66) aktiv entgegen, und das mit maximalem Widerstand.
npc.spirit_guidance=Ratgebergeister
npc.spirit_guidance.page=64
npc.spirit_guidance.desc=Manchmal hat eine Beschwörung nicht das Ziel, Dienste von einem Geist zu erhalten, sondern es geht vielmehr darum, einen Weisen um Rat zu bitten. Auch wenn sie ihre Ratschläge in Rätsel verpacken oder in Andeutungen verbergen mögen - Ratgebergeister haben meist erst dann das Gefühl, ihren Auftrag erfüllt zu haben, wenn sie einen weisen Rat gegeben haben. Die Ratschläge dieser Geister sind direkt von der Astralen Reputation (S. 65) des Beschwörers abhängig. Je niedriger dieser Wert ist, desto kryptischer und unverständlicher ist der Ratschlag. Bei einer hohen Astralen Reputation ist das Gegenteil der Fall.
npc.spirit_task=Helfergeister
npc.spirit_task.page=63
npc.spirit_task.desc=Arbeit, Schöpfung, Innovation, Erfindungen, Fleiß - all das sind Konzepte, die seit Jahrhunderten eng mit der metamenschlichen Psyche verknüpft sind. Seit sich die Metamenschheit erstmals zu urbanen Zivilisationen zusammenschloss, wurden die verschiedenen Berufe der Welt aufgeteilt, seziert und immer enger gefasst. Die Geister passten sich diesen Veränderungen an, und so entstand eine Geisterwelt, in der jeder Geist über andere Fähigkeiten verfügt. Wenn man die Dienste eines Helfergeists in Anspruch nehmen möchte, sollte man genau wissen, welche Art von Hilfe man benötigt - ein Geist, der sich auf Schlosserei versteht, kann einem nicht dabei helfen, ein Schloss zu bauen. Helfergeister sind bereitwillige Arbeiter und bieten ihrem Beschwörer nach einer erfolgreichen Beschwörung oftmals einen zusätzlichen Dienst an. Wenn sie gebunden werden, bieten sie einen zusätzlichen Dienstpunkt (S. 60) an, solange die Astrale Reputation des Beschwörers (S. 65) positiv ist.

