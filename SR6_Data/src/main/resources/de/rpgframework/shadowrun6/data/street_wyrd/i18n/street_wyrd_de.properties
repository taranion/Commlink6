quality.artisans_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Konstitution + Logik statt mit Konstitution + Willenskraft widerstehen und dürfen bei Proben auf Biotech, Cracken, Elektronik, Mechanik oder Steuern einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht).
quality.artists_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Konstitution + Charisma statt mit Konstitution + Willenskraft widerstehen und dürfen bei Proben auf Athletik, Einfluss oder Überreden einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht).
quality.athletes_ways.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit einem beliebigen körperlichen Attribut + Willenskraft statt zwingend mit Konstitution + Willenskraft widerstehen (dieses Attribut wird bei Auswahl des Wegs permanent festgelegt) und dürfen bei Proben auf Athletik einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (es kann für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht).
quality.beasts_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Konstitution + Intuition statt mit Konstitution + Willenskraft widerstehen. Sie dürfen bei Proben auf Natur oder Wahrnehmung einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht). Alternativ dürfen sie sowohl den Adepten- als auch den Zauberer-Vorteil ihres Schutzgeistes erhalten (es müssen die normalen Karmakosten für den Vorteil Schutzgeist gezahlt werden). Ob der Adept den Schicksalswürfel oder die Schutzgeistvorteile nimmt, wird festgelegt, wenn der Weg gewählt wird.
quality.burnouts_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit einem durch mundane Bodytech modifizierten körperlichen Attribut + Willenskraft statt mit Konstitution + Willenskraft widerstehen (das körperliche Attribut für den Entzug wird bei Auswahl des Wegs permanent festgelegt). Zusätzlich dürfen sie die Fähigkeit Angeborenes Talent (s. o.) pro vollem Essenzpunkt unter 6 ein weiteres Mal pro Begegnung einsetzen.
quality.invisible_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Geschicklichkeit + Willenskraft statt mit Konstitution + Willenskraft widerstehen und dürfen bei Proben auf Heimlichkeit oder Wahrnehmung einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht).
quality.magicians_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Konstitution + ihrem Traditionsattribut statt mit Konstitution + Willenskraft widerstehen. Sie dürfen bei Proben auf Astral, Beschwören, Hexerei oder Verzaubern einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht). Alternativ dürfen sie sowohl den Adepten- als auch den Zauberervorteil ihres Schutzgeistes erhalten (es müssen die normalen Karmakosten für den Vorteil Schutzgeist gezahlt werden). Ob der Adept den Schicksalswürfel oder die Schutzgeistvorteile nimmt, wird festgelegt, wenn der Weg gewählt wird.
quality.speakers_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit Konstitution +Charisma statt mit Konstitution +Willenskraft widerstehen und dürfen bei Proben auf Einfluss oder Überreden einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (die Fertigkeit wird bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht). Außerdem erhalten sie bei ersten Zusammentreffen mit jemandem 1 Edge für soziale Proben, das bei dieser Begegnung ausgegeben werden muss und ansonsten verfällt.
quality.warriors_way.desc=Adepten auf diesem Weg dürfen dem Entzug durch Adeptenkräfte mit einem beliebigen körperlichen Attribut + Willenskraft statt zwingend mit Konstitution + Willenskraft widerstehen und dürfen bei Angriffsproben im Nahkampf oder im Fernkampf einen Würfel ihres Würfelpools durch einen Schicksalswürfel ersetzen (das Entzugsattribut und die Art der Angriffsprobe (Nahkampf oder Fernkampf) werden bei Auswahl des Wegs permanent festgelegt, es kann aber für jede Probe individuell entschieden werden, ob der Schicksalswürfel genutzt wird oder nicht).

quality.close_minded_summoner.desc=Aus irgendeinem Grund - vielleicht aufgrund deiner magischen Tradition, der eng gefassten Meinungen deines Lehrmeisters usw. - kommst du mit einer oder mehreren Geisterarten nicht zurecht. Mit jeder Stufe dieses Nachteils verzichtest du auf die Fähigkeit, eine der zehn Standard-Geisterarten  (Beschützergeister,  Erdgeister, Feuergeister, Geister des Menschen, Geister des Tieres, Helfergeister, Luftgeister, Pflanzengeister, Ratgebergeister, Wassergeister) herbeizurufen, zu binden oder zu verbannen. Dieser Vorteil kann bis zu fünfmal gewählt werden. Jedes Mal muss eine andere Geisterart ausgewählt werden. Dieser Nachteil kann nur von Charakteren gewählt werden, die die Fertigkeit Beschwören erlernen dürfen.
quality.addiction_blood.desc=Der Einsatz von Lebensmagie birgt kein Risiko einer Befleckung der Aura des Magiers, kann aber in seltenen Fällen zur Abhängigkeit führen. Nach einer Szene oder einer Begegnung, in der ein Initiat Lebensmagie verwendet hat, legt er eine Probe auf Willenskraft + Logik mit einem Würfelpoolbonus von +4 (wegen der Verwendung von Lebensmagie) ab. Der Schwellenwert entspricht der Gesamtzahl an Blutmagiepunkten, die er in der Szene erhalten hat, dividiert durch 4 (aufgerundet). Misslingt die Probe, erhält er den Nachteil Abhängigkeit (Blutmagie, Stufe 1), ohne dafür Bonuskarma zu bekommen. Immer, wenn ihm eine weitere solche Probe misslingt, steigt die Stufe seiner Abhängigkeit um 1, aber das mehr oder weniger Gute daran ist, dass der Charakter nur als Flagellant erscheint.

spell.death_touch.desc=Todeshand ist eine Variante von Manablitz (SR6, S. 139), welche Berührung der Zielperson vorraussetzt.
spell.disrupt.desc=Jeder Nettoerfolg bei einer Vergleichenden Probe auf Hexerei + Magie gegen Kraftstufe × 2 des Fokus verursacht 1 Kästchen temporären Schaden am Fokus, dem nicht widerstanden werden kann. Wenn ein Fokus auf diese Weise beschädigt ist, wird er inaktiv und kann nicht benutzt werden. Am Ende jeder Kampfrunde wird automatisch ein Kästchen dieses Schadens geheilt. Der Fokus hat einen Zustandsmonitor von [Kraftstufe × 2] Kästchen. Wenn dieser gefüllt ist, kann der Fokus keinen weiteren Schaden erleiden, er wird aber nicht entzaubert oder auf andere Weise zerstört.
spell.ectomagic_pulse.desc=Jeder Nettoerfolg bei einer Vergleichenden Probe auf Hexerei + Magie gegen Kraftstufe × 2 des Fokus verursacht 1 Kästchen temporären Schaden am Fokus, dem nicht widerstanden werden kann. Wenn ein Fokus auf diese Weise beschädigt ist, wird er inaktiv und kann nicht benutzt werden. Am Ende jeder Kampfrunde wird automatisch ein Kästchen dieses Schadens geheilt. Der Fokus hat einen Zustandsmonitor von [Kraftstufe × 2] Kästchen. Wenn dieser gefüllt ist, kann der Fokus keinen weiteren Schaden erleiden, er wird aber nicht entzaubert oder auf andere Weise zerstört.
spell.knockout.desc=Schockhand ist eine Variante von Betäubungsblitz (SR6, S. 138), welche Berührung der Zielperson vorraussetzt.
spell.hellblast.desc=Höllenexplosion wirkt wie Feuerball (SR6, S. 139) verursacht aber zusätzlich Chemischen Schaden (SR6, S. 112). Das Ziel erhält den Status Verätzt (SR6, S. 55) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe.
spell.napalm.desc=Napalm verursacht den Status Brennend (SR6, S. 53) mit einer Stufe gleich der Anzahl der Nettoerfolge bei der Hexereiprobe. Dieser Zauber ist gegen Feuerresistenz doppelt so zerstörerisch wie normales Feuer und andere Feuerzauber. Jedes Mal, wenn eine Panzerung mit Feuerresistenz von diesem Zauber getroffen wird, sinkt die Anzahl an Malen, die die Panzerung den Status Brennend neutralisiert (SR6, S. 267), um 2, es sei denn, die Panzerung verfügt auch über Chemische Versiegelung (SR6, S. 266) - in diesem Fall sinkt die Anzahl an Malen wie gewohnt nur um 1. Fläche Vergrößern kann bei Napalm eingesetzt werden, um den Bereich von einem einzelnen Ziel auf zwei Meter Radius zu vergrößern (oder noch mehr, wenn man wirklich den Geruch von Napalm am Morgen liebt).
spell.thunderstruck.desc=Der Schaden dieses Zaubers entspricht dem des Zaubers Stoss (SR6, S. 139) mit den im Folgenden beschriebenen Zusatzeffekten. Wenn die Anzahl der Nettoerfolge der Hexereiprobe höher ist als die Konstitution des Ziels, erhält dieses für 1 Kampfrunde den Status Benommen. Der Lärm des Zaubers hat das Ziel als Zentrum. Das Ziel und andere Lebewesen innerhalb eines Radius von 2 Metern müssen dem Zauber widerstehen, oder sie erhalten für [Magie des Zaubernden] Minuten den Status Ertaubt I. Die Stufe des Status steigt pro 2 Nettoerfolgen der Hexereiprobe um 1, bis hin zu Ertaubt III. Die Zauberanpssung Fläche Vergrößern kann den Lärm des Zaubers in einem größeren Bereich wirken lassen, der Betäubungsschaden betrifft aber weiter nur ein einzelnes Ziel.
spell.corrode.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Verätzen, Zersetzen und Auflösen sind indirekte Kampfzauber, was bedeutet, dass ein Zielobjekt, das von jemandem getragen wird, dem Zauber ausweichen kann (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Reaktion + Willenskraft des Trägers. Ferngesteuerte Fahrzeuge und Drohnen bilden ihren Würfelpool bei der Vergleichenden Probe mit Ausweichen + Pilot. Dem Schaden wird danach mit Objektwiderstand widerstanden (SR6, S. 132).
spell.melt.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Verätzen, Zersetzen und Auflösen sind indirekte Kampfzauber, was bedeutet, dass ein Zielobjekt, das von jemandem getragen wird, dem Zauber ausweichen kann (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Reaktion + Willenskraft des Trägers. Ferngesteuerte Fahrzeuge und Drohnen bilden ihren Würfelpool bei der Vergleichenden Probe mit Ausweichen + Pilot. Dem Schaden wird danach mit Objektwiderstand widerstanden (SR6, S. 132).
spell.sludge.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Verätzen, Zersetzen und Auflösen sind indirekte Kampfzauber, was bedeutet, dass ein Zielobjekt, das von jemandem getragen wird, dem Zauber ausweichen kann (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Reaktion + Willenskraft des Trägers. Ferngesteuerte Fahrzeuge und Drohnen bilden ihren Würfelpool bei der Vergleichenden Probe mit Ausweichen + Pilot. Dem Schaden wird danach mit Objektwiderstand widerstanden (SR6, S. 132).
spell.ram.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Rammen, Zertrümmern und Vernichten sind direkte Kampfzauber (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Objektwiderstand. Dem Schaden wird nicht widerstanden. Drohnen oder Fahrzeuge verwenden ihr Rumpf-Attribut für die Vergleichende Probe, wenn es höher ist als der Objektwiderstand.
spell.wreck.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Rammen, Zertrümmern und Vernichten sind direkte Kampfzauber (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Objektwiderstand. Dem Schaden wird nicht widerstanden. Drohnen oder Fahrzeuge verwenden ihr Rumpf-Attribut für die Vergleichende Probe, wenn es höher ist als der Objektwiderstand.
spell.demolish.desc=In der Zauberformel dieser Zauber muss ein Objekt angegeben sein (Feuerwaffe, Kommlink, Panzerung usw.). Das gewählte Objekt kann einer eng oder breit definierten Kategorie angehören. Beispiele dafür sind in der Tabelle S. 38 angegeben. Die Zauber können mehrmals, jeweils für ein anderes Objekt, gelernt werden. Der Zaubernde erhält 1 Edge, wenn das Zielobjekt des Zaubers in der Formel eng statt breit definiert ist (z. B. Schwere Pistole statt Feuerwaffe). Direkte und indirekte Kampfzauber mit Flächenwirkung betreffen alle Objekte, die die Kriterien erfüllen und sich im Wirkungsbereich befinden. Rammen, Zertrümmern und Vernichten sind direkte Kampfzauber (SR6, S. 137). Das Wirken dieser Zauber verlangt eine Vergleichende Probe auf Hexerei + Magie gegen Objektwiderstand. Dem Schaden wird nicht widerstanden. Drohnen oder Fahrzeuge verwenden ihr Rumpf-Attribut für die Vergleichende Probe, wenn es höher ist als der Objektwiderstand.
spell.hose.desc=Gelingt der Zauber, erhält jedes Ziel den Status Nass (SR6, S. 54) und wird um 1 Meter vom Zaubernden weggestoßen. Alle Nettoerfolge (die noch übrig sind, nachdem das Ziel ihnen mit Konstitution widerstanden hat) werden zu der Anzahl an Metern, die das Ziel über den ersten hinaus weggestoßen wird. Wenn diese Anzahl der Nettoerfolge die Konstitution des Ziels übersteigt, erhält es den Status Liegend (SR6, S. 54).
spell.tsunami.desc=Gelingt der Zauber, erhält jedes Ziel den Status Nass (SR6, S. 54) und wird um 1 Meter vom Zentrum der Flächenwirkung weggestoßen. Alle Nettoerfolge (die noch übrig sind, nachdem das Ziel ihnen mit Konstitution widerstanden hat) werden zu der Anzahl an Metern, die das Ziel über den ersten hinaus weggestoßen wird. Wenn diese Anzahl der Nettoerfolge die Konstitution des Ziels übersteigt, erhält es den Status Liegend (SR6, S. 54).
spell.punch.desc=Schlag ist eine Variante von Stoss (SR6, S. 139), welche Berührung der Zielperson vorraussetzt.
spell.slay.desc=Beim Wirken dieses Zaubers wird ein Schicksalswürfel (SR6, 51) zur Probe hinzugefügt. Erschlagen hat dieselbe Wirkung wie Energieblitz (SR6, S. 139). Dieser Zauber wirkt gegen eine bestimmte Art von Kreatur mit Bewusstsein (Naga, Sasquatch, Zentaur usw.), von Geist (Insektengeist, Erdgeist, Feuergeist usw.) oder Metatyp (Elf, Mensch, Ork, Troll oder Zwerg). Dieser Zauber kann mehrmals, jeweils für eine andere Art von Ziel, gelernt werden. Wenn das Ziel nicht zur richtigen Art gehört, wirkt der Zauber nicht.
spell.bane.desc=Beim Wirken dieses Zaubers wird ein Schicksalswürfel (SR6, 51) zur Probe hinzugefügt. Verderben hat dieselbe Wirkung wie Manablitz (SR6, S. 139). Dieser Zauber wirkt gegen eine bestimmte Art von Kreatur mit Bewusstsein (Naga, Sasquatch, Zentaur usw.), von Geist (Insektengeist, Erdgeist, Feuergeist usw.) oder Metatyp (Elf, Mensch, Ork, Troll oder Zwerg). Dieser Zauber kann mehrmals, jeweils für eine andere Art von Ziel, gelernt werden. Wenn das Ziel nicht zur richtigen Art gehört, wirkt der Zauber nicht.

spell.anaphylaxis.desc=Anaphylaxie wird mit einer Vergleichenden Probe auf Hexerei + Magie gegen Konstitution + Willenskraft des Ziels gewirkt. Pro zwei Nettoerfolgen bei der Hexereiprobe steigt die Schwere der allergischen Reaktion um 1 Stufe (s. SR6, S. 78). Wenn das Ziel vor dem Zauber keine Allergie hatte, erzeugen die ersten zwei Nettoerfolge bei Anaphylaxie eine Leichte Allergie (gegen ein Allergen nach Wahl des Zaubernden, das beim Wirken des Zaubers ausgewählt wird), solange der Zauber aufrechterhalten wird.
spell.ephedrine.desc=Ephedrin wird mit einer Erfolgsprobe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Pro zwei Nettoerfolgen bei der Hexereiprobe sinkt die Schwere der allergischen Reaktion um 1 Stufe (s. SR6, S. 78). Wenn der Zauber nicht mehr aufrechterhalten wird, erreicht die allergische Reaktion die ursprüngliche Stufe - oder sie verschwindet, wenn keine Allergene vorhanden sind. Ephedrin wirkt gegen alle Allergien, unter denen das Ziel zum Zeitpunkt des Wirkens des Zaubers leidet.
spell.diagnose.desc=Diagnose wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Nach dem Wirken des Zaubers werden die Nettoerfolge mit der Tabelle Diagnose-Ergebnisse verglichen. Dabei gelten die Ergebnisse aus allen Zeilen bis einschließlich der Zeile der Anzahl der Nettoerfolge. Wenn der Zaubernde zum Beispiel 3 Nettoerfolge erzielt hat, erhält er die Ergebnisse für 1, 2 und 3 Nettoerfolge. Wenn der Zauber Diagnose auf eine Person gewirkt wurde, kann sie erst nach Ablauf von 24 Stunden wieder Ziel dieses Zaubers werden. Wenn der Zaubernde innerhalb von 24 Stunden, nachdem er den Zauber Diagnose auf ein Ziel gewirkt hat, bei diesem eine Probe auf Biotech (egal ob für Erste Hilfe oder die Heilung mit einem Medkit) ablegt, erhält er dabei 1 Edge. Außerdem kann der Zaubernde innerhalb dieser 24 Stunden beim Zauber Behandeln und bei Heilen-Zaubern auf dieses Ziel einen Schicksalswürfel zu seinem Würfelpool addieren, wenn er das möchte.
spell.fast.desc=Dieser Zauber wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Das erfolgreiche Wirken des Zaubers beseitigt für 24 Stunden Hunger- und Durstgefühle. Jeder Nettoerfolg senkt den Status Erschöpft durch Hunger und Durst um eine Stufe (s. Kasten). Fasten kann nicht den Bedarf an Nahrung und Wasser eliminieren.
spell.healty_glow.desc=Dieser Zauber wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Gelingt die Probe, sieht das Ziel für bis zu [Nettoerfolge] Stunden reinlicher und gesünder aus, aber eine Exposition gegenüber rauen Elementen kann diese Zeit verringern. Der Zauber gewährt dem Ziel wegen dessen Erscheinungsbild 1 Edge für Sozialproben, solange er wirkt. Außerdem gewährt der Zauber für Proben auf Biotech oder Heilung, die an dem Ziel durchgeführt werden, 1 Edge, das nur für diese Proben ausgegeben werden kann. Auch diese Wirkung hält für bis zu [Nettoerfolge] Stunden an. Dieser Zauber kann bei einem Ziel nur einmal pro 24 Stunden eingesetzt werden.
spell.nutrition.desc=Ernährung versorgt das Ziel auf zellulärer Ebene mit Nahrung, wodurch es von reinem Mana leben kann. Dieser Zauber wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Jeder Nettoerfolg verhindert für 12 Stunden (bis maximal 3 Tage) Verhungern und Verdursten, beseitigt aber keine Hunger- und Durstgefühle (s. Zauber Fasten, S. 29). Der Einsatz dieses Zaubers über eine Dauer von zwei Wochen hinaus kann zum sogenannten Feenessen-Syndrom und der Unfähigkeit führen, feste Nahrung und Flüssigkeiten ohne schwere Verdauungsprobleme zu sich zu nehmen. Das Feenessen-Syndrom muss von einem Mediziner behandelt werden; die Behandlung dauert meistens zwei Wochen.
spell.oxygenate.desc=Sauerstoffmaske setzt ein freiwilliges Ziel voraus. Dieser Zauber wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Jeder Nettoerfolg gewährt dem Ziel einen Würfelpoolbonus von +1 zum Widerstand gegen Schaden durch Ersticken, Strangulieren oder andere Arten des Sauerstoffentzugs. Außerdem erhält das Ziel 1 Edge für Proben zum Schwimmen oder Tauchen. Dieser Punkt muss sofort ausgegeben werden, sonst verfällt er. Jeder Nettoerfolg eliminiert außerdem den Status Benommen und senkt den Status Erschöpft um eine Stufe, wenn diese durch Sauerstoffmangel ausgelöst werden. Solange der Zauber aufrechterhalten wird, ist das Ziel immun gegen Angriffe mit dem Vektor Inhalation und gegen Ertrinken (wenn das Ziel daran denkt, den Atem anzuhalten).
spell.icy_veins.desc=Dieser Zauber wird auf ein freiwilliges Ziel mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Gelingt die Probe erhält das Ziel den Status Unterkühlt (SR6, S. 55), wodurch ein eventueller Status Brennend aufgehoben wird. Das Ziel wird von Wärmesensoren nicht erfasst. Dies negiert alle Vorteile durch Lichtverhältnisse als Angreifer oder Verteidiger, die gegenüber dem Ziel durch Infrarotsicht entstehen.
spell.preserve.desc=Dieser Zauber wirkt nicht auf Lebewesen, nur gegen organische Materie. Er verhindert, dass sich organische Materie auf natürliche Weise zersetzt oder verschimmelt. Jeder Erfolg bei der Hexereiprobe lässt das Material für 6 Stunden in einer Art Stasis verharren, wobei Temperatur, Feuchtigkeit und so weiter des Materials exakt so bleiben wie zum Zeitpunkt des Wirkens des Zaubers. Der Zauber kann 1 Kubikmeter Material beeinflussen. Die Anpassung Fläche Vergrößern kann das Volumen um jeweils einen halben Kubikmeter vergrößern (bis zur aufgerundeten Hälfte des Magieattributs des Zaubernden in Kubikmetern). Bei Leichen wird der Entzug nicht nach Volumen gerechnet. Stattdessen steigt der Grundentzug um die abgerundete Hälfte ihrer (ehemaligen) Konstitution.
spell.rot.desc=Verfaulen verwandelt organisches Material (pflanzlich, tierisch, bakteriell usw.), egal ob es lebt oder nicht, in eine schleimige Masse, die sich höchstens noch als Dünger eignet. Hartes organisches Material wie Knochen zerbröselt zu Knochenmehl (das auch gut für Pflanzen ist). Wir der Zauber offensiv eingesetzt, kann er ein Ziel verkrüppeln. Pro 2 Nettoerfolgen (dem Zauber wird mit Willenskraft + Intuition widerstanden) kann jeweils eine Stufe der Status Gelähmt (bis zu Stufe III, s. Feuer Frei, S. 118) oder Erschöpft (bis zu Stufe III, s. SR6, S. 54) verursacht werden, weil Fleisch und Knochen die Verbindung verlieren oder sogar aufhören, zu existieren. Die Status von Verfaulen können nicht durch den Zauber Behandeln geheilt werden. Wenn der Zauber nicht offensiv eingesetzt wird, kann er einen halben Kubikmeter Material beeinflussen. Das Material widersteht mit seinem Objektwiderstand (bei Leichen mit ihrer ursprünglichen Konstitution × 2). Gelingt der Zauber, wird die Wirkung anhand der Tabelle Effektivität von Verfaulen bestimmt. Die Anpassung Fläche Vergrößern kann das Volumen um jeweils einen halben Kubikmeter vergrößern (bis zur aufgerundeten Hälfte des Magieattributs des Zaubernden in Kubikmetern). Bei Leichen wird der Entzug nicht nach Volumen gerechnet. Stattdessen steigt der Grundentzug um die abgerundete Hälfte ihrer (ehemaligen) Konstitution.
spell.sterilize.desc=Dieser Zauber macht jegliches organische Material im Wirkungsbereich als materielle Verbindung und für forensische Untersuchungen unbrauchbar. Damit dieser Zauber nicht schädlich für komplexe Lebensformen wird, ist er so entworfen, dass er ausschließlich auf Oberflächen wirkt - er kann also keine infizierten Lungen reinigen, Pathogene in Flaschen neutralisieren oder Ähnliches. Wenn in einem Bereich, in dem maximal 2 Stunden zuvor der Zauber Sterilisieren gewirkt wurde, ein Heilen-Zauber gewirkt oder eine medizinische Behandlung vorgenommen wird, erhält der jeweilige Charakter für diese Probe 1 Edge.
spell.treat.desc=Dieser Zauber wird mit einer Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gewirkt. Er negiert oder lindert schädliche oder behindernde Statuseffekte. Die Status Brennend, Ertaubt, Geblendet oder Verätzt sinken um eine Stufe pro Nettoerfolg; die Status Benommen und Unterkühlt werden einfach beendet. Wenn das Ziel unter mehreren Status gleichzeitig leidet, können die Nettoerfolge zwischen ihnen aufgeteilt werden, allerdings steigt dabei der Entzug um +1 pro zusätzlichem Status, der gesenkt oder beendet wird.

spell.comfort_zone.desc=Dieser Zauber hebt die Status Nass und Status Unterkühlt auf einem Ziel auf und verhindert, dass es wieder unter ihnen leidet, solange der Zauber aufrechterhalten wird. Darüber hinaus bietet der Zauber eine Art persönliche Klimaregelung: Für jeden Nettoerfolg bei der Probe auf Hexerei + Magie (5 - [Essenz, abgerundet]) gilt die Umgebungstemperatur als um 5 °C näher an dem Temperaturbereich, der für das Ziel angenehm ist.
spell.disentangle.desc=Berühre jemanden mit dem Status Humpelnd oder Bewegungsunfähig und lege eine Probe auf Hexerei + Magie gegen einen Schwellenwert gleich der Magie des verursachenden Wesens, der Kraft eines Toxins oder des Grundschadens der verursachenden Waffe ab. Wenn mehr als ein solcher Wert zutrifft, bildet der höchste den Schwellenwert. Bei Zielen mit dem Status Bewegungsunfähig oder Humpelnd dienen die Nettoerfolge innerhalb von 5 Kampfrunden als Bonus für Widerstandsproben gegen einen neuen Einsatz der Ursache des Status oder das, was den Status verursachen könnte.
spell.astral_window.desc=Astrales Fenster erschafft eine Kugel mit einem halben Meter Durchmesser. Jeder, der die Kugel sieht (gilt nicht für Kameras und andere Sensoren), kann seine Fertigkeit Wahrnehmung als astrale Wahrnehmung nutzen, um das zu sehen, was innerhalb der Kugel "auf der anderen Seite" ist. Der Zauber vermittelt dem Betrachter kein Wissen darüber, was er zu sehen bekommt (dazu ist die Wissensfertigkeit Arkana nötig). Jede  Anpassung  Fläche  Vergrößern  kann  den Durchmesser der Kugel um einen halben Meter vergrößern, bis maximal auf [Magie des Zaubernden] Meter. Mit der Nebenhandlung Fläche Verschieben kann die Kugel innerhalb des Blickfelds des Zaubernden verschoben werden. Jeder Zauber (ob Manazauber oder physischer Zauber) und jede astrale Wesenheit, die sich in oder durch ein Astrales Fenster bewegen, werden von der physischen Ebene aus sichtbar. Dieser Zauber ermöglicht weder das Hinüberwechseln in die Astralebene noch das Wirken von Zaubern auf der physischen Ebene, die dann gegen Wesen wirken, die sich nur auf der Astralebene aufhalten.
spell.borrow_sense.desc=Sinn Borgen erlaubt dem Beobachter, einen Sinn (Gehör, Geruchs-, Geschmacks-, Gesichts- oder Tastsinn) eines Ziels auszuwählen und mit einer Nebenhandlung zwischen der eigenen Wahrnehmung und diesem Sinn umzuschalten. Verbesserte Sinne (wie z. B. Breitbandgehör, Infrarotsicht oder Restlichtverstärkung) des Ziels können auf diese Weise ebenfalls genutzt werden. Dabei ist es egal, ob das Ziel über diese Sinne auf natürliche Weise verfügt oder ob es sich um Sinne handelt, auf die es durch Technologie zugreift. Dazu gehören allerdings keine Sinne, die durch Zauber zur Verfügung gestellt werden. Astrale, VR- und AR-Wahrnehmung können mit diesen Zaubern nicht genutzt werden. Sinn Borgen wird mit Konstitution + Willenskraft widerstanden, aber das Ziel bekommt nichts vom Wirken des Zaubers mit.
spell.passenger.desc=Huckepack erlaubt dem Beobachter, mit allen Sinnen des Ziels wahrzunehmen, was zu einer Art magischen Simsinn-Erfahrung (ohne die Emotionen) führt. Verbesserte Sinne (wie z. B. Breitbandgehör, Infrarotsicht oder Restlichtverstärkung) des Ziels können auf diese Weise ebenfalls genutzt werden. Dabei ist es egal, ob das Ziel über diese Sinne auf natürliche Weise verfügt oder ob es sich um Sinne handelt, auf die es durch Technologie zugreift. Dazu gehören allerdings keine Sinne, die durch Zauber zur Verfügung gestellt werden. Astrale, VR- und AR-Wahrnehmung können mit diesen Zaubern nicht genutzt werden. Huckepack wird mit Konstitution + Willenskraft widerstanden, aber das Ziel bekommt nichts vom Wirken des Zaubers mit.
spell.animal_sense.desc=Tiersinn Borgen erlaubt dem Beobachter, einen Sinn (Gehör, Geruchs-, Geschmacks-, Gesichts- oder Tastsinn) eines Ziels auszuwählen und mit einer Nebenhandlung zwischen der eigenen Wahrnehmung und diesem Sinn umzuschalten. Verbesserte Sinne (wie z. B. Breitbandgehör, Infrarotsicht oder Restlichtverstärkung) des Ziels können auf diese Weise ebenfalls genutzt werden. Dabei ist es egal, ob das Ziel über diese Sinne auf natürliche Weise verfügt oder ob es sich um Sinne handelt, auf die es durch Technologie zugreift. Dazu gehören allerdings keine Sinne, die durch Zauber zur Verfügung gestellt werden. Astrale, VR- und AR-Wahrnehmung können mit diesen Zaubern nicht genutzt werden. Tiersinn Borgen wird mit Konstitution + Willenskraft widerstanden, aber das Ziel bekommt nichts vom Wirken des Zaubers mit.
spell.eyes_of_the_pack.desc= Augen des Rudels erlaubt dem Beobachter, einen Sinn (Gehör, Geruchs-, Geschmacks-, Gesichts- oder Tastsinn) eines Ziels auszuwählen und mit einer Nebenhandlung zwischen der eigenen Wahrnehmung und diesem Sinn umzuschalten. Verbesserte Sinne (wie z. B. Breitbandgehör, Infrarotsicht oder Restlichtverstärkung) des Ziels können auf diese Weise ebenfalls genutzt werden. Dabei ist es egal, ob das Ziel über diese Sinne auf natürliche Weise verfügt oder ob es sich um Sinne handelt, auf die es durch Technologie zugreift. Dazu gehören allerdings keine Sinne, die durch Zauber zur Verfügung gestellt werden. Astrale, VR- und AR-Wahrnehmung können mit diesen Zaubern nicht genutzt werden. Augen des Rudels funktioniert bei (para)normalen Crittern wie auch bei Wesen mit Bewusstsein, aber es muss sich um freiwillige Ziele handeln. Der Entzug steigt pro verbundenem Ziel nach dem ersten um 1. Maximal sind so viele Ziele möglich, wie das Magieattribut des Zaubernden beträgt. Solange der Zauber aufrechterhalten wird, kann jedes Ziel mit einer Nebenhandlung zur Wahrnehmung eines beliebigen anderen Ziels umschalten.
spell.scrutinize.desc=Diese Zauber erlauben dem Beobachter, ein Objekt oder einen Bereich hypergenau wahrzunehmen. Die Handlung Genau beobachten wird zur Nebenhandlung, solange der Zauber aufrechterhalten wird und die Aufmerksamkeit dem Objekt (Inspizieren) oder dem Wahrnehmungsbereich (Katalog) gilt. Diese Zauber ermöglichen es, mit der Handlung Genau beobachten zusätzliche Details zu erfahren. Jeder Nettoerfolg gegen den Objektwiderstand ergibt eine Art von Detail, die erfahren werden kann. Es folgt eine Liste von Beispieldetails, aus denen der Zaubernde wählen kann.
spell.catalog.desc=Diese Zauber erlauben dem Beobachter, ein Objekt oder einen Bereich hypergenau wahrzunehmen. Die Handlung Genau beobachten wird zur Nebenhandlung, solange der Zauber aufrechterhalten wird und die Aufmerksamkeit dem Objekt (Inspizieren) oder dem Wahrnehmungsbereich (Katalog) gilt. Diese Zauber ermöglichen es, mit der Handlung Genau beobachten zusätzliche Details zu erfahren. Jeder Nettoerfolg gegen den Objektwiderstand ergibt eine Art von Detail, die erfahren werden kann. Es folgt eine Liste von Beispieldetails, aus denen der Zaubernde wählen kann. Solange der Zauber Katalog aufrechterhalten wird, kann der Beobachter eine Nebenhandlung verwenden, um jeden Punkt innerhalb des Bereichs aus jeder Perspektive zu sehen. Der Beobachter erhält 1 Edge für Überraschungsproben innerhalb des Wahrnehmungsbereichs oder für Angriffe gegen unsichtbare Ziele, weil Katalog auch Details vermittelt, die über das Sehen hinausgehen.
spell.mana_window.desc=Manabarrieren (SR6, S. 163) sind auf der Astralebene (oder für astrale Wahrnehmung) undurchsichtig, daher blockieren sie nicht nur astrale Wahrnehmung, sondern verhindern auch, dass Zauber und astrale Gestalten sie überwinden. Manafenster hat nur Einfluss auf Zauber und astrale Wahrnehmung. Der Zauber beseitigt die Barriere nicht und erlaubt astralen Gestalten auch keinen Durchgang. Dazu wäre schon eine Manatür nötig. Dem Zauber wird mit der Strukturstufe der Barriere widerstanden. Wenn Manafenster Nettoerfolge erreicht, erscheint das Fenster auf der Barriere. Es hat einen Durchmesser von 1 Meter. Jeder zusätzliche Nettoerfolg vergrößert den Durchmesser um jeweils 1 Meter, bis maximal zum Magieattribut des Zaubernden in Metern.
spell.translate.desc=Dieser Zauber schafft eine unterschwellige telepathische Verbindung zwischen dem Beobachter und einem bestimmten Ziel innerhalb der Sinnesreichweite (s. SR6, S. 143), die es dem Beobachter und dem Ziel ermöglicht, zu verstehen, was der jeweils andere sagt, ohne dass beide die Sprache des anderen beherrschen müssen. Dazu müssen beide Gesprächsteilnehmer einander sehen und hören können. Ein unfreiwilliges Ziel kann mit Konstitution + Willenskraft widerstehen. Bei Sozialen Proben, die mit diesem Zauber ermöglicht werden, kann kein Edge erhalten oder ausgegeben werden. Dolmetschen kann zur Kommunikation mit jeder Spezies mit Bewusstsein eingesetzt werden, die Sprache benutzt (z. B. auch bei Sasquatchen oder Merrow), aber nicht für eine Unterhaltung mit Tieren ohne Bewusstsein. Die Erfolge der Hexereiprobe bestimmen die Qualität der Übersetzung. Bei relativ wenigen Erfolgen können sich Unsicherheiten bezüglich dessen einschleichen, was der Zaubernde hört oder was andere ihn sagen hören (s. Tabelle Übersetzungsqualität).

spell.babble.desc=Dieser Zauber wird auf ein freiwilliges Ziel gewirkt, das der Zaubernde berührt. An der verborgenen Unterhaltung können mehrere Personen beteiligt werden; jeder zusätzliche Teilnehmer über das erste Ziel hinaus erhöht den Entzug um 1. Wahrnehmungsproben, die nicht mehr Erfolge als der Zauber erreichen, lassen den Zuhörer nur triviale Gespräche hören, die nichts mit dem Eigentlichen zu tun haben. Geplapper wirkt nur gegen Lebewesen.
spell.thieves_cant.desc=Dieser Zauber wird auf ein freiwilliges Ziel gewirkt, das der Zaubernde berührt. An der verborgenen Unterhaltung können mehrere Personen beteiligt werden; jeder zusätzliche Teilnehmer über das erste Ziel hinaus erhöht den Entzug um 1. Wahrnehmungsproben, die nicht mehr Erfolge als der Zauber erreichen, lassen den Zuhörer nur triviale Gespräche hören, die nichts mit dem Eigentlichen zu tun haben. Kauderwelsch beeinflusst auch Kameras und andere Technologie.
spell.chaff.desc=Wird der Zauber erfolgreich gewirkt, erzeugt er pro Nettoerfolg bei der Hexereiprobe 1 Punkt Rauschen im betroffenen Bereich. Alle WiFi-Signale, die durch den Wirkungsbereich gehen, werden beeinflusst. Geräte widerstehen dem Zauber mit Datenverarbeitung + Firewall, Technomancer mit Willenskraft + Logik. Der Zauber kann bis zu [Nettoerfolge] Kampfrunden aufrechterhalten werden. Grundsätzlich widersteht jedes Ziel im Wirkungsbereich dem Zauber separat. Aus Gründen des Spielflusses kann für die Widerstandsprobe aber auch einfach der höchste Würfelpool unter den beeinflussten Geräten verwendet werden.
spell.double_image.desc=Double kann nur einmal pro Person gewirkt werden. Keine Drillinge! Man kann den Zauber mehrmals wirken, aber jeweils nur auf eine andere Person. Dem Zauber wird mit Willenskraft + Intuition widerstanden. Der Zaubernde kann die Bewegung des Doubles mit einer Nebenhandlung (J) anpassen, damit die Illusion nicht gebrochen wird oder strategisch besser funktioniert. Solange das Ziel und sein Double sich synchron bewegen, erhält das Ziel 1 Edge, wenn Ziel und Double denselben Gegner angreifen. Wenn jemand, während sich das Double in eine andere Richtung bewegt, versucht, das Ziel zu verfolgen, und ihm dabei eine Wahrnehmungsprobe misslingt (Schwellenwert = Anzahl der Nettoerfolge der Hexereiprobe), verfolgt diese Person die Illusion. Alle [Magie des Zaubernden × 10] Meter kann der Verfolger eine neue Wahrnehmungsprobe ablegen, um Diskrepanzen an der Illusion zu erkennen. Der Zaubernde kontrolliert die Bewegungen der Illusion.
spell.dreams.desc=Das Ziel muss schlafen oder bewusstlos sein, damit der Zauber wirken kann, widersteht ihm aber unbewusst mit Willenskraft + Logik. Traum lässt den Zaubernden eine Traumsequenz (inklusive Bildern, Geräuschen, Emotionen usw.) gestalten und an ein schlafendes Ziel übertragen. Die Nettoerfolge repräsentieren die Komplexität und den Detailreichtum. Künstliche Träume können ein Ziel nicht wirklich verletzen. Das Ziel erinnert sich lebhaft an den Traum, aber nicht unbedingt daran, dass er eingepflanzt war. Der Zauber kann mit 5 oder mehr Nettoerfolgen auch aggressiver eingesetzt werden: Der Zaubernde kann mit einem schrecklichen Albtraum die Ruheperiode eines Tages für das Ziel stören, was die natürliche Genesung (SR6, S. 123) unmöglich macht. Das bedeutet, dass an diesem Tag keine Probe zur Heilung von Körperlichem Schaden abgelegt werden kann.
spell.foreboding.desc=Böse Ahnung beeinflusst Metamenschen und Wesen mit Bewusstsein. Diese Zauber übertragen auf mystische Weise Gefühle der drohenden Gefahr, Angst und des Unwohlseins auf alle Lebewesen, die in ihren Wirkungsbereich treten. Die Opfer fühlen sich nervös und frösteln leicht. Ihre Nackenhaare sträuben sich, und sie bekommen einen Anflug von Panik. Alle Ziele, die dem Zauber nicht mit Logik + Intuition widerstehen, erhalten den Status Verängstigt (SR6, S. 55), solange sie sich im Wirkungsbereich des Zaubers befinden. Wenn die Anzahl der Nettoerfolge höher ist als die Willenskraft beeinflusster Individuen, erhalten diese zusätzlich den Status Panisch (SR6, S. 55). Wenn sie den Wirkungsbereich verlassen haben, enden die Status Verängstigt und/oder Panisch nach [Magie des Zaubernden] Minuten. Wenn Böse Ahnung oder Angst innerhalb eines magischen  Refugiums  gewirkt  werden  und  der Zaubernde 6 Karma ausgibt, wird der Zauber aufrechterhalten, bis das Refugium aufgehoben wird, der Zaubernde den Zauber beendet oder jemand ihn mit Antimagie bannt. Das bewirkt, dass jeder außer dem Zauberer, der das Refugium betreten will, unter den Einfluss des Zauber gerät, wenn er ihm nicht widersteht.
spell.disquiet.desc=Angst beeinflusst nur Tiere. Diese Zauber übertragen auf mystische Weise Gefühle der drohenden Gefahr, Angst und des Unwohlseins auf alle Lebewesen, die in ihren Wirkungsbereich treten. Die Opfer fühlen sich nervös und frösteln leicht. Ihre Nackenhaare sträuben sich, und sie bekommen einen Anflug von Panik. Alle Ziele, die dem Zauber nicht mit Logik + Intuition widerstehen, erhalten den Status Verängstigt (SR6, S. 55), solange sie sich im Wirkungsbereich des Zaubers befinden. Wenn die Anzahl der Nettoerfolge höher ist als die Willenskraft beeinflusster Individuen, erhalten diese zusätzlich den Status Panisch (SR6, S. 55). Wenn sie den Wirkungsbereich verlassen haben, enden die Status Verängstigt und/oder Panisch nach [Magie des Zaubernden] Minuten. Wenn Böse Ahnung oder Angst innerhalb eines magischen  Refugiums  gewirkt  werden  und  der Zaubernde 6 Karma ausgibt, wird der Zauber aufrechterhalten, bis das Refugium aufgehoben wird, der Zaubernde den Zauber beendet oder jemand ihn mit Antimagie bannt. Das bewirkt, dass jeder außer dem Zauberer, der das Refugium betreten will, unter den Einfluss des Zauber gerät, wenn er ihm nicht widersteht.
spell.false_impression.desc=Falscher Eindruck kann keine falschen Auren erschaffen, er kann nur eine existierende Aura verändern oder verstecken. Proben auf Askennen, astrale Wahrnehmung oder den Zauber Astrales Fenster, die nicht mehr Erfolge als der Zauberer bei der Hexereiprobe erzielen, führen dazu, dass man sieht, was der Zauberer vorführen will. Wenn die Astral- oder Hexereiproben mehr Erfolge als die Proben für die Zauber Falscher Eindruck oder Manalandschaft erzielen, erkennt die Gegenseite, dass hier ein Zauber etwas maskiert, aber die gewonnene Information hängt von der Differenz zwischen der Anzahl der Erfolge ab.
spell.manascape.desc=Manalandschaft kann keine falschen Auren erschaffen, er kann nur existierende Auren verändern oder verstecken. Proben auf Askennen, astrale Wahrnehmung oder den Zauber Astrales Fenster, die nicht mehr Erfolge als der Zauberer bei der Hexereiprobe erzielen, führen dazu, dass man sieht, was der Zauberer vorführen will. Wenn die Astral- oder Hexereiproben mehr Erfolge als die Proben für die Zauber Falscher Eindruck oder Manalandschaft erzielen, erkennt die Gegenseite, dass hier ein Zauber etwas maskiert, aber die gewonnene Information hängt von der Differenz zwischen der Anzahl der Erfolge ab.
spell.hot_potato.desc=Der Zauberer legt eine Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Intuition des Ziels ab. Wenn das Ziel der Illusion nicht widerstehen kann, muss es sofort die Nebenhandlung Gegenstand fallen lassen (SR6, S. 43) ausführen, um alles fallen zu lassen, was es hält, weil der Schmerz von dort auszugehen scheint. Wenn es keine Nebenhandlung mehr übrig hat, lässt es die Gegenstände trotzdem fallen.
spell.vehicle_mask.desc=Der Zauber wird als Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Intuition gewirkt. Fahrzeugmaske kann ein gewöhnliches Auto oder eine Drohne verbergen. Die Anpassung Fläche Vergrößern kann einmal benutzt werden, um ein SUV, einen Pick-up oder Van zu verbergen; zweimal genügt für einen kleinen Lkw, Kleinbus oder Lieferwagen, dreimal für einen Sattelzug oder Bus. Die Illusion kann größer als das Fahrzeug sein, aber nicht kleiner.
spell.phantomscape.desc=Der Zauber wird als Vergleichende Probe auf Hexerei + Magie gegen Willenskraft + Intuition gewirkt. Phantomlandschaft hat einen etwas größeren Wirkungsbereich als andere Zauber, der außerdem würfel- und nicht kugelförmig ist. Der Bereich beginnt mit 20 Kubikmetern (ungefähr der Größe eines kleinen Raums) und steigt pro Anpassung Fläche Vergrößern um 20 Kubikmeter. Der Zauber wirkt nur auf unbelebte Objekte im Hintergrund - nicht auf etwas, das berührt oder benutzt werden soll.

spell.vine.desc=Erfolge beim Wirken dieses Zaubers beschleunigen das Wachstum. Jeder Erfolg verursacht eine Woche Wachstum oder heilt ein Kästchen Schaden der Pflanze (wenn sie einen Zustandsmonitor hat). Die Pflanzen werden nach dem Wirken des Zaubers nicht belebt, sie greifen also zum Beispiel nicht von selbst zu.
spell.rosebush.desc=Erfolge beim Wirken dieses Zaubers beschleunigen das Wachstum. Jeder Erfolg verursacht eine Woche Wachstum oder heilt ein Kästchen Schaden der Pflanze (wenn sie einen Zustandsmonitor hat). Die Pflanzen werden nach dem Wirken des Zaubers nicht belebt, sie greifen also zum Beispiel nicht von selbst zu. Bei offensivem Einsatz des Zaubers Dornenhecke erhalten Ziele, die sich durch den Wirkungsbereich bewegen, den Status Außer Balance (Feuer Frei, S. 118), weil eine gewaltige wuchernde Vegetation (Unkraut, Ranken, Äste usw.) jede Bewegung behindert. Wenn die Hexereiprobe mehr Erfolge erzielt, als die Stärke eines Opfers beträgt, erhält dieses auch den Status Humpelnd (SR6, S. 54), solange es sich durch den Bereich bewegt. Die Stärke einer Pflanze entspricht der Hälfte des Magieattributs des Zaubernden; sie kann als Schwellenwert für Proben auf Athletik (Entfesseln) genutzt werden. Alternativ kann eine Pflanze auch zerstört werden, ihr Zustandsmonitor beträgt 8 + ([Konstitution × 2], aufgerundet).
spell.fashion.desc=Probe auf Hexerei + Magie gegen Objektwiderstand (6 bei den meisten Kleidungsarten) anhand der Tabelle Mode-Ergebnisse. Panzerung mit einem Verteidigungswert über 3 leistet diesem Zauber mehr Widerstand als üblich. Sie erhält für die Vergleichende Probe automatische Erfolge in Höhe ihres Verteidigungswerts - 3. Gewicht und Volumen des Kleidungsmaterials können nicht verändert werden. Ein Overall kann nicht zum Bikini werden oder umgekehrt.
spell.catfall.desc=Jeder Erfolg ermöglicht eine zusätzliche sichere Fallhöhe von 3 Metern, kumulativ mit den üblichen 3 Metern (SR6, S. 117). Das Ziel erhält 1 Edge, das für Athletik- oder Schadenswiderstandsproben bei dem Fall verwendet werden kann. Erfolge bei einer Probe auf Athletik + Geschicklichkeit können verwendet werden, um weitere [Erfolge] Meter ohne Schaden zu fallen.
spell.gecko_crawl.desc=Das Ziel erhält 1 Edge für Kletterproben, wenn es an Oberflächen entlangklettert. Solange der Zauber aufrechterhalten wird, sinkt der Basis-Schwellenwert für Kletternproben (SR6, S. 95) auf null. Das Ziel kann sich mit normaler Klettergeschwindigkeit an einer Decke entlangbewegen (wenn diese sein Gewicht tragen kann). Wenn die Strukturstufe der Decke (SR6, S. 117) kleiner ist als die Konstitution des Ziels, biegt sich die Decke unter dessen Gewicht oder bricht, und der Geckogang kann das Ziel nicht mehr daran festhalten.
spell.glue.desc=Das Ziel muss mit dem Objekt, an das es geklebt werden soll, in Kontakt sein, wenn der Zauber gewirkt wird. Dem Zauber wird mit Objektwiderstand (SR6, S. 132) oder Reaktion + Intuition widerstanden. Der Entzug entspricht der abgerundeten Hälfte der Strukturstufe (SR6, S. 117) des Objekts (mindestens aber 2). Wenn es keine Strukturstufe gibt, wird diese durch den Objektwiderstand ersetzt. Wenn zwei Objekte zusammengeklebt werden, entspricht der Entzug der höheren Strukturstufe oder dem höheren Objektwiderstand der beiden. Personen, die an etwas geklebt werden, erhalten den Status Bewegungsunfähig (SR6, S. 53), bis sie befreit werden, sofern sie das Objekt, an das sie geklebt sind, nicht bewegen können (wie z. B. eine Mauer). Wenn der Zauber erfolgreich gewirkt wird, können die beiden Oberflächen nur mit einer Vergleichenden Probe auf (Nettoerfolge der Hexereiprobe) + (Magie des Zaubernden) gegen Stärke + Konstitution des Trennenden getrennt werden. Wenn die Nettoerfolge der Hexereiprobe die Strukturstufe (bzw. den Objektwiderstand, wenn ein Objekt keine Strukturstufe hat) oder die Konstitution des Objekts/der Person übersteigen, verursacht die Trennung Schaden. Die Objekte/Personen müssen, wenn sie erfolgreich auseinandergerissen werden, einem Schaden von (Nettoerfolge der Hexereiprobe)K widerstehen. Wenn ein Objekt keine Strukturstufe hat, verwende für den Schadenswiderstand den Objektwiderstand.
spell.ice_sheet.desc=Der Zauber erschafft eine flache Eisdecke, die [Magieattribut des Zaubernden × Erfolge der Hexereiprobe] bedeckt. Die Anzahl der Erfolge hat auch mit der Dicke des Eises zu tun. Bei 5 und mehr Erfolgen wird das Eis dick genug, dass Treppen zu extrem rutschigen Rampen werden. Eisdecke kann auch benutzt werden, um Wände beim Klettern glatt oder rutschig zu machen (SR6, S. 95) oder Fenster zufrieren zu lassen, um eine Sichtverbindung zu verhindern. Jeder, der das Eis betritt, erhält den Status Außer Balance (Feuer Frei, S. 118). Dieser Status bleibt so lange bestehen, bis der Charakter das Eis verlassen hat. Wer über die Eisdecke fährt, muss eine Handlingprobe gegen den Gelände-Handlingwert seines Fahrzeugs ablegen, sonst gerät das Fahrzeug außer Kontrolle. Wenn der Zauber nicht mehr aufrechterhalten wird, verfliegt das Eis sofort in den Äther.
spell.looking_glass.desc=Dem Zauber wird mit Objektwiderstand (SR6, S. 132) widerstanden. Der Entzug entspricht der abgerundeten Hälfte der Strukturstufe (SR6, S. 117) des Objekts (mindestens aber 2). Ein Objekt, das von diesem Zauber verändert wird, erlaubt eine Sichtverbindung zu Objekten und Personen auf der anderen Seite. Transparenz sorgt nicht für Beleuchtung - nur für Durchsichtigkeit. Der durchsichtige Bereich hat eine Fläche von [Magie des Zaubernden × 2] Quadratmetern.
spell.magic_fingers.desc=Der Zauber kann feinmotorische Fähigkeiten nicht vollständig abbilden. Versuch nicht, dich mit Zauberfinger als Uhrmacher, Chirurg oder Bombenentschärfer zu betätigen. Innerhalb einer Kugel von einem Meter Durchmesser besitzt der Zaubernde ein Paar unsichtbarer Hände, mit denen er verschiedene Handlungen durchführen kann. Mit der Nebenhandlung Fläche Verschieben kann die Kugel innerhalb des Blickfelds des Zaubernden verschoben werden. Halten die Zauberfinger dabei einen Gegenstand fest, kann dieser mitgenommen werden, wenn die Verschiebung stattfindet. Wenn die Hände versuchen, etwas zu tun, kommt dabei die passende Fertigkeit des Zaubernden zum Einsatz. Das Attribut bei dieser Probe ist gleich der Erfolge des Zaubernden bei der Hexereiprobe. Mithilfe dieser "Attribute" wird auch bestimmt, wie viel die Zauberfinger tragen können (s. SR6, S. 37). Bei Handlungen mit Zauberfinger kann Edge weder erhalten noch ausgegeben werden.
spell.disregard.desc=Wenn ein Zauberer Ignoranz wirkt, wählt er ein Ziel aus, das nicht unter der Wirkung des Zaubers steht und von all denen ignoriert wird, gegen die der Zauber wirkt. Der Zauberer kann zusätzliche Ziele auswählen; jedes dieser zusätzlichen Ziele erhöht den Entzug um 1. Der Zauberer legt eine Probe auf Hexerei + Magie ab. Alle Opfer im Wirkungsbereich (oder die den Bereich betreten, während der Zauber aufrechterhalten wird) widerstehen mit Willenskraft + Intuition. Wer dem Zauber nicht widerstehen kann, ignoriert die meisten Vorgänge um sich herum, alles scheint egal zu sein. Nettoerfolge des Zaubernden werden zum Schwellenwert für Proben auf Erinnerungsvermögen (SR6, S. 37), um sich an bestimmte Details zu erinnern.
spell.makeover.desc=Typveränderung setzt ein freiwilliges Ziel voraus. Nach der Hexereiprobe können die Ergebnisse anhand der Tabelle Ergebnisse für Typveränderung bestimmt werden. Der Zauber kann einen Überzug für gewisse Oberflächen wie Haar und Nägel erschaffen, der [Magie des Zaubernden] Stunden bei einem lebenden Ziel bestehen bleibt. Dieser Zauber kann bei einem Ziel nur einmal alle 24 Stunden eingesetzt werden. Während seiner Wirkungsdauer platzt nichts ab, verblasst nichts und wäscht sich nichts ab. Nach dieser Zeit nutzt sich der Überzug in der Routine des Alltags ganz normal ab. Typveränderung kann keine medizinischen Zustände behandeln, kann sie aber überdecken, wenn der Zaubernde 2 oder mehr Erfolge erzielt. Solange der Zauber wirkt, kann das Ziel durch die Veränderung seines Erscheinungsbildes 1 Edge für Sozialproben erhalten.
spell.mob_mood.desc=Opfer im Wirkungsbereich widerstehen dem Zauber mit Willenskraft + Logik. Grundsätzlich widersteht jedes Ziel einzeln, der Spielleiter kann aber, um den Spielfluss aufrechtzuerhalten, auch nur eine Probe mit dem höchsten Würfelpool unter den Zielen ablegen, deren Ergebnis dann für alle Ziele im Wirkungsbereich gilt. Wenn Mob-Laune erfolgreich gewirkt wird, werden die gegenwärtigen Gefühle der Opfer durch einen neuen emotionalen Zustand (glücklich, wütend, traurig usw.) ersetzt. Je mehr Nettoerfolge erzielt werden, desto intensiver ist der neue emotionale Zustand. Das kann für die Opfer verwirrend sein (was pro 2 Nettoerfolgen einen Würfelpoolmalus von -1 bei Proben auf Aktionsfertigkeiten verursacht). Die Spielleiterin kann bei Bedarf den genauen Malus anpassen, wenn die Handlungen zum Beispiel zu den neuen Emotionen passen. Wenn bei Mob-Laune bei einigen Zielen 5 oder mehr Nettoerfolge erzielt werden, kann der Zaubernde eine Vergleichende Probe auf Überreden + Charisma gegen die höchste Willenskraft + Intuition unter diesen Zielen ablegen. Gelingt die Probe, hat er eine Schergen-Gruppe (SR6, S. 117) geschaffen, die einen Aufstand, einen Protest, eine Prügelei usw. anzetteln kann.
spell.mob_mind.desc=Opfer im Wirkungsbereich widerstehen dem Zauber mit Willenskraft + Logik. Grundsätzlich widersteht jedes Ziel einzeln, der Spielleiter kann aber, um den Spielfluss aufrechtzuerhalten, auch nur eine Probe mit dem höchsten Würfelpool unter den Zielen ablegen, deren Ergebnis dann für alle Ziele im Wirkungsbereich gilt. Wenn Mob-Bewusstsein erfolgreich gewirkt wird, werden die Einstellungen der Opfer gegenüber einem Ziel, das der Zaubernde auswählt (auch sich selbst), pro 2 Nettoerfolgen um eine Stufe in die gewünschte Richtung verschoben. Es gibt dabei vier grundlegende Stufen der Einstellung: Feindlich, Abgeneigt, Neutral und Freundlich. Der Zaubernde kann die Einstellung der Opfer gegenüber einem Ziel anpassen - oder gegenüber mehreren, wenn er ausreichend Nettoerfolge erzielt. Diese neue Einstellung kann Edge bei Sozialproben (SR6, S. 50) beeinflussen, solange der Zauber aufrechterhalten wird. Der Zaubernde kann die Handlungen der Opfer mit der neuen Einstellung nicht steuern. Wenn bei Mob-Bewusstsein bei einigen Zielen 5 oder mehr Nettoerfolge erzielt werden, kann der Zaubernde eine Vergleichende Probe auf Überreden + Charisma gegen die höchste Willenskraft + Intuition unter diesen Zielen ablegen. Gelingt die Probe, hat er eine Schergen-Gruppe (SR6, S. 117) geschaffen, die einen Aufstand, einen Protest, eine Prügelei usw. anzetteln kann.
spell.lokis_musical.desc=Unfreiwillige Teilnehmer können dem Zauber mit Willenskraft + Magie widerstehen. Wenn der Zauber erfolgreich gewirkt wird, erhalten die Ziele eine unterbewusste psychische Verbindung miteinander und mit dem Zaubernden. Durch diese Verbindung können die Ziele Musik hören, und sie erhalten eine mystische Koordination ihrer körperlichen Handlungen im Takt der Musik. Unfreiwillige Ziele, die dem Zauber nicht widerstehen konnten, können den Wirkungsbereich nicht aus freien Stücken verlassen. Der Zaubernde oder ein freiwilliges Ziel muss in jeder Kampfrunde eine Haupthandlung verwenden, um eine Probe auf Überreden (Vorführen) + Charisma gegen Willenskraft + Intuition der anderen Ziele abzulegen, sonst endet der Zauber. Wenn die Anzahl der Nettoerfolge aus der Überredenprobe die Willenskraft der Ziele übersteigt, kann der Zaubernde bzw. das freiwillige Ziel eine Nebenhandlung verwenden, um diese Ziele dazu zu bringen, eine Teamworkprobe abzulegen. Ihre nächste Haupthandlung muss die Handlung Unterstützen (SR6, S. 46) sein. Die Handlung Unterstützen wird für ein freiwilliges Ziel zur Nebenhandlung, wenn es seine Haupthandlung für eine Probe auf Überreden (Vorführen) benutzt. Pro Person und Teamworkprobe ist jeweils nur eine Handlung Unterstützen möglich. Das alles gilt nur, solange der Zauber wirkt.
spell.stone_fist.desc=Dieser Zauber macht die Fäuste des Ziels so hart, dass dessen Schläge sich anfühlen, als würden sie mit Steinblöcken ausgeführt. Der Schaden des Ziels im Waffenlosen Kampf steigt auf 3B; wenn dessen Stärke 5 oder mehr beträgt, steigt er auf 4B. Nettoerfolge bei der Hexereiprobe steigern den Angriffswert des Angriffs mit den Fäusten um jeweils 1.

spell.boil_blood.desc=Der Blutmagier ruft aus dem Ziel einen Blutschwall hervor und regt diesen an, bevor er ihn auf das Ziel zurückwirft, was das Ziel schwächt und Feuerschaden verursacht. Der Zauber ruft den Status Brennend mit einer Stufe in Höhe der Anzahl der Nettoerfolge bei der Hexereiprobe hervor und zusätzlich den Status Blutend für [Nettoerfolge] Kampfrunden. Die Anpassung Hochdrehen kann verwendet werden.
spell.chilled_claret.desc=Der Blutmagier lässt dem Ziel das Blut in den Adern gefrieren, was es für eine mögliche Gefangennahme langsamer macht und Betäubungsschaden verursacht. Der Zauber verursacht für [Nettoerfolge] Kampfrunden den Status Humpelnd (SR6, S. 54). Wenn die Anzahl der Nettoerfolge bei der Hexereiprobe höher ist als die Konstitution oder Willenskraft (der höhere Wert) des Ziels, erhält dieses für 1 Kampfrunde den Status Benommen (SR6, S. 53). Die Anpassung Hochdrehen kann verwendet werden.
spell.clot.desc=Der Blutmagier nutzt die Kraft des Blutes, um die Gerinnungsfähigkeit zu stärken, wodurch Verletzungen gelindert werden. Er legt eine Probe mit auf Hexerei + Magie (5 - [Essenz, abgerundet]) ab. Die Nettoerfolge geben die maximale Wirkungsdauer des Zaubers in Kampfrunden an. Wenn das Ziel 2 oder mehr Kästchen Körperlichen Schaden erleidet, wird der Schaden um 1 gesenkt. Der Zauber eliminiert den Status Blutend (und verschafft Immunität dagegen, solange er wirkt). Der Zauber wirkt nicht kumulativ mit der Bioware Thrombozytenfabrik und eliminiert die Wirkung des Zaubers Gerinnungshemmer. Der Einsatz dieses Zaubers kann als Lebensmagie betrachtet werden.
spell.anticoagulant.desc=Der Blutmagier verhext das Blut des Ziels, um Schaden zu erhöhen. Er legt eine Vergleichende Probe auf Hexerei + Magie gegen Konstitution + Willenskraft des Ziels ab. Die Nettoerfolge geben die maximale Wirkungsdauer des Zaubers in Kampfrunden an. Das Ziel erhält den Status Blutend, solange der Zauber aufrechterhalten wird. Wenn das Ziel Körperlichen Schaden erleidet, wird der Schaden um 1 Kästchen erhöht. Dieser Zauber eliminiert den Zauber Gerinnung.
spell.blood_puppet.desc=Der Zauberer befehligt das Blut des Ziels, sodass es seinen Befehlen gehorcht. Er kann dadurch für bis zu [Nettoerfolge] Kampfrunden verschiedene Status beim Ziel verursachen; er kann auch Status austauschen, während die Wirkung anhält, aber die Wirkungsdauer wird dadurch nicht verändert. Die Status, die verursacht werden können, sind: Blutend, Brennend 1 (kann nicht durch physische Mittel bekämpft oder eliminiert werden; magische Mittel können aber benutzt werden), Erschöpft I, Panisch und Unterkühlt.
spell.viscera_web.desc=Ein grauenhafter Zauber, der zu Geweberissen im ganzen Körper des Ziels führt, weil seine Adern herausschießen und an Oberflächen in der Umgebung haften; nicht lebendes Material wie Kleidung, Ausrüstung und Cyberware ist nicht betroffen. Dieser Zauber behindert das Ziel mit außerordentlichem Schaden und Schmerz, abgesehen davon, dass seine lebenden Adern an Boden, Wänden und Decken festkleben. Der Zaubernde legt eine Probe auf Hexerei + Magie gegen Geschicklichkeit + Willenskraft des Ziels ab. Gelingt die Probe, erhält das Ziel den Status Bewegungsunfähig (SR6, S. 53). Wenn die Anzahl der Nettoerfolge höher ist als die Konstitution des Ziels, erhält es stattdessen den Status Erstarrt. Das Ziel des Zaubers kann, wenn es an der Reihe ist und nicht unter dem Status Erstarrt leidet, eine Haupthandlung verwenden und eine Probe auf Konstitution + Stärke (1) ablegen, um sich loszureißen. Dann erhält es allerdings den Status Blutend, der [Nettoerfolge bei der Hexereiprobe] Kampfrunden anhält. Außerdem erleidet es einen Schaden von (Nettoerfolge bei der Hexereiprobe)K, dem es normal widerstehen kann. Alternativ dazu kann ein Verbündeter das Ziel losschneiden und damit die Status Erstarrt oder Bewegungsunfähig negieren - aber auch dann werden der Status Blutend und der Schaden verursacht, als hätte sich das Ziel losgerissen. Sollte ein Verbündeter besondere Sorgfalt bei der Befreiung des Ziels walten lassen (was eine erfolgreiche Probe auf Biotech + Logik (4) erfordert), erleidet das Ziel keinen Schaden und erhält nicht den Status Blutend. Das dauert 1 Minute und erfordert den Einsatz von medizinischen Vorräten (wie etwa eines Medkits).

