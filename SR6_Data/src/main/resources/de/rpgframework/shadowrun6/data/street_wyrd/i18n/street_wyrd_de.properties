critterpower.astral_gateway.desc=Der Geist ist in der Lage, einen astralen Spalt zu öffnen. Alle physischen Objekte in der Nähe werden dadurch zwangsweise dual, und mundane Personen erlangen die Fähigkeit zur astralen Projektion. Der astrale Spalt kann mit einer beliebigen Metaebene verbunden sein, die der Geist selbst besuchen kann (ein Feuerelementar könnte also einen Spalt auf die Ebene des Feuers öffnen, aber vermutlich keinen, der in den Stock führt).
critterpower.astral_project.desc=Der Geist kann ebenso wie ein Zauberer astral projizieren (SR6, S. 162). Diese Kraft ist nur für Geister wählbar, die auch über die Kraft Bewohnung verfügen. Ein Geist, der nach [Kraftstufe × 2] Stunden nicht in seinen Körper zurückgekehrt ist, wird verdrängt.
critterpower.aura_masking.desc=Manchmal möchte man die Astralebene in ein gewaltiges Feuerwerk tauchen; aber bei anderen Gelegenheiten möchte man sich lieber als jemand anders tarnen oder sogar komplett ungesehen bleiben. Mit Auramaskierung kann der Geist seine Aura sowie die Auren sämtlicher Zauber, alchemistischer Erzeugnisse, Foki und anderer Gegenstände mit einer Aura, die er bei sich führt, tarnen. Die Gesamtzahl der Zauber/Gegenstände, die verschleiert werden können, entspricht dem Magieattribut des Geists. Die Kraftstufe (oder im Falle von Zaubern der Entzugswert) jedes Gegenstands oder Zaubers, den der Geist verbergen möchte, muss kleiner als die Kraftstufe des Geistes sein. Wenn jemand den Geist askennt, wird die Askennen-Probe als Vergleichende Probe gegen [Kraftstufe × 2] des Geistes abgelegt. Wenn der Askennende Nettoerfolge erzielt, sieht er sowohl die Maskierung als auch die echte Aura (inklusive der maskierten Zauber/Gegenstände des Geistes). Je nach Anzahl der Nettoerfolge erkennt er gemäß der Tabelle Askennen (SR6, S. 161) weitere Details zu den Auren der Zauber/Erzeugnisse.
critterpower.divining.desc=Diese Kraft funktioniert wie die Metamagie Weissagung (S. 136), allerdings verwendet der Geist für die Probe Magie + Intuition.
critterpower.endowment.desc=Diese Kraft erlaubt es dem Geist, einem Ziel Zugriff auf eine seiner Kräfte zu gewähren. Der Geist behält dabei weiterhin die Möglichkeit, die Kraft selbst einzusetzen. Jeder Charakter kann auf diese Weise gleichzeitig nur eine einzige Kraft erhalten.
critterpower.energy_drain.desc=Geister gedeihen durch Karma. Die meisten Geister erhalten Karma im Rahmen von Abmachungen und Diensten als freiwillige Gabe, aber es gibt auch Geister, die keine Lust haben, sich den Launen und Wünschen einfacher Metamenschen zu unterwerfen, und daher beschließen, sich einfach zu nehmen, was sie brauchen. \nDiese Kraft wird gleichzeitig mit einem erfolgreichen waffenlosen Nahkampfangriff eingesetzt. Der Angriff verursacht keinen Schaden. Der Geist kann eine Nebenhandlung aufwenden, um eine zweite Probe abzulegen und eine Mischung aus Schaden und Karmaentzug anzurichten. Lege eine Vergleichende Probe auf Willenskraft + Charisma + Magie zwischen dem Geist und der Zielperson ab. Die unterlegene Partei erleidet dabei einen Betäubungsschaden in Höhe der erzielten Nettoerfolge. Das bedeutet, dass derartige Angriffe gegen magisch aktive Charaktere riskanter sind, weswegen sich Geister mit dieser Kraft in der Regel auf Mundane fokussieren. \nHat der Geist mehr Nettoerfolge erzielt, stiehlt er zusätzlich zu dem verursachten Schaden Karma in Höhe seiner Nettoerfolge. Wenn der Charakter über noch nicht ausgegebenes Karma verfügt, wird zuerst dieses geraubt. Ist das nicht der Fall, muss er eine Entscheidung treffen. Der Charakter muss ausgegebenes Karma "rückgängig" machen und eine Aktionsfertigkeit oder ein Attribut senken. Nutze die Tabelle Entwicklungskosten (SR6, S. 72), um zu bestimmen, wie viel Karma durch die Senkung wieder frei wird. Der Geist erhält seinen Anteil, übrige Karmapunkte wandern zurück in den Pool nicht verteilter Karmapunkte des Charakters. \nAnmerkung: Es handelt sich hier um eine extrem mächtige und vielseitige Kraft. Geister können Zielpersonen Lebenskraft, Fertigkeiten und Erinnerungen (die Essenz eines Fertigkeitstrainings) entziehen. Aber dabei entsteht auch ein Pool an unverteiltem Karma und ein gebrochenes Wesen, das ewige Qualen durchleidet und das der Geist anschließend nach Belieben neu formen und zu seinem Diener machen kann.
critterpower.hidden_life.desc=Oftmals erscheint es Geistern, die sich mit ihrer Agenda Feinde gemacht haben, notwendig, sich an unsere Welt zu binden. Mit dieser Kraft wird die Lebenskraft des Geistes permanent in eine Kreatur, einen Ort oder einen Gegenstand übertragen. Solange dieser Anker existiert, gibt es keine Möglichkeit, den Geist permanent zu verbannen oder zu zerstören. Wird der Geist erfolgreich verbannt, kann er beim nächsten Voll- oder Neumond (das spätere Ereignis zählt) zurückkehren. Ein auf diese Weise verbannter Geist kann noch immer von Personen herbeigerufen werden, die über seine Geisterformel verfügen.\nDer Anker der Lebenskraft des Geistes erhält die Kraft Immunität gegen Normale Waffen in Höhe der Essenz des Geistes und Immunität gegen Alter (SR6, S. 224). Wird das Objekt zerstört, das das Verborgene Leben beinhaltet, kehrt die Lebenskraft zu dem Geist zurück, der daraufhin wieder den normalen Regeln unterliegt.
critterpower.inhabitation.desc=Es gibt zahlreiche Geschichten über die unerwünschte Anwesenheit von Geistern, und diese Kraft ist der Grund dafür. Die meisten Geister statten der physischen Ebene mithilfe der Kräfte Materialisierung oder Besessenheit nur kurze Stippvisiten ab, aber Geister mit der Kraft Bewohnung übernehmen die Kontrolle über eine physische Gestalt und halten sich auf deutlich dauerhaftere Art und Weise in ihr auf. Ein bewohnender Geist verschmilzt dauerhaft mit einem vorbereiteten Gefäß und kann durch Verbannung nicht von diesem getrennt werden. Allerdings kann der Geist das Gefäß auch nicht freiwillig verlassen. Er wird erst dann von ihm getrennt, wenn das Gefäß durch Überzähligen Schaden (SR6, S. 124) zerstört wird. Sobald das Gefäß zerstört wurde, kehrt der Geist sofort auf die Astralebene zurück. Von dort aus beginnt er in der Regel die Suche nach einem neuen Gefäß oder kehrt – wenn möglich – auf seine Heimatebene zurück. \nDurch die Bewohnung eines lebenden Gefäßes erhält der Geist die komplette Kontrolle über dessen Körper und in gewissem Umfang Zugriff auf seine Erinnerungen. Während der Verschmelzung wird der ursprüngliche Verstand des Gefäßes (sofern vorhanden) verschlungen, woraufhin dieses Individuum in jeder Hinsicht effektiv ausgelöscht ist (wie immer kann die Spielleiterin jedoch beschließen, dies anders zu handhaben, wenn es in die Geschichte passt). \nUm ein Gefäß zu bewohnen, muss für einen Geist eine der folgenden beiden Bedingungen erfüllt sein: Ein Beschwörer kann das beabsichtigte Gefäß im Vorfeld vorbereiten. Dies muss innerhalb einer Manabarriere geschehen, deren Kraftstufe mindestens der Kraftstufe des Geistes entspricht. Der Zauberer muss dafür [Kraftstufe × 20] Dram Reagenzien aufwenden und eine Ausgedehnte Probe auf Astral + Magie (Kraftstufe × 3, 1 Stunde) ablegen. Alternativ kann der Geist das Gefäß für [Kraftstufe] Wochen "heimsuchen" und sich so mit der langsam in den Wahnsinn abdriftenden Aura des Opfers verbinden. Sobald das Gefäß vorbereitet wurde, kann der Geist die Kraft Bewohnung anwenden. Um den Prozess der Bewohnung abzuschließen, muss der Geist die ganze Zeit über in Kontakt mit dem Ziel bleiben. \nDer Geist legt eine Vergleichende Probe auf Kraftstufe × 2 gegen Willenskraft + Intuition des Gefäßes ab. Der Beschwörer des Geistes (sofern vorhanden) kann das Ergebnis dieser Probe beeinflussen, indem er sich entscheidet, seinen Fertigkeitswert in Beschwören auf einen der beiden Würfelpools zu addieren. Wenn der Geist versucht, ein lebloses Gefäß zu bewohnen, legt er eine Vergleichende Probe auf Kraftstufe × 2 gegen den Objektwiderstand (SR6, S. 132) des Gefäßes ab. \nUm zu ermitteln, wie lange der Prozess der Bewohnung dauert, vergleiche die Erfolge des Geistes mit der Tabelle Bewohnung: Dauer. Um zu bestimmen, was für eine Gestalt aus der Verschmelzung entsteht, vergleiche die Nettoerfolge des Geistes mit der Tabelle Bewohnung: Verschmelzungen. Wenn das Gefäß die Probe für sich entscheidet, kann es in einem letzten Aufbäumen seiner Essenz die aus der Bewohnung resultierende Gestalt bestimmen, bevor es verschlungen wird (es kann sich der Bewohnung nicht mehr aus sich heraus widersetzen; das hätte es während der Vorbereitungsphase tun müssen). Erzielt das Gefäß einen kritischen Patzer, wird das Ergebnis durch den Geist bestimmt. Falls der Geist einen kritischen Patzer erzielt, scheitert die Verschmelzung, und das Gefäß ist immun gegen zukünftige Bewohnungsversuche des Geistes.
critterpower.magical_guard.desc=Diese Kraft ermöglicht den Einsatz von Antimagie in Form von Zauberabwehr und erlaubt die Verteidigung gegen Zauber (SR6, S. 145). Wenn der Geist nicht über die Fertigkeit Hexerei verfügt, legt er die Zauberabwehrprobe mit Kraftstufe + Magie ab.
critterpower.mutable_form.desc=Normalerweise setzen Geister die Kraft Materialisierung ein, um jedes Mal in derselben Gestalt zu erscheinen. Die Kraft Veränderliche Gestalt erlaubt es dem Geist, diese Gestalt bei jeder Materialisierung zu verändern, sodass er ein anderes körperliches Aussehen annehmen kann, wann immer er will. Die Aura des Geistes wird dadurch nicht verändert, sodass er auf der Astralebene unverändert bleibt. Falls der Geist ebenfalls über die Kraft Realistische Gestalt (S. 81) verfügt, erhält er für Proben auf Überreden (Verkleiden) (SR6, S. 98), um sich als jemand anderes auszugeben, 1 Edge (das sofort für diese Probe ausgegeben werden muss oder ansonsten verfällt) und einen Würfelpoolbonus in Höhe von Kraftstufe ÷ 2 (aufgerundet). Diese Kraft kann nur von Geistern mit der Kraft Materialisierung gewählt werden. Die gewählte Gestalt bleibt bestehen, bis der Geist beschließt, den Einsatz der Kraft Materialisierung zu beenden.
critterpower.personal_domain.desc=Freie Geister haben oft den Wunsch, auf unserer Ebene ein echtes Zuhause zu finden. Indem er einem Teil des Astralraums von bis zu [Kraftstufe × 10.000] Quadratmetern Fläche seinen Stempel aufdrückt, erschafft der Geist einen Manafluss, der auf seine Tradition ausgerichtet ist. Der Manafluss baut sich mit Anwesenheit des Geistes langsam auf. Pro Stufe (schwach, mittel, stark) ist dafür 1 Monat erforderlich.
critterpower.possession.desc=Materialisierung ist keine Kraft, die universell von allen Geistern beherrscht wird. Einige müssen Besitz von Gefäßen ergreifen, um mit der physischen Ebene interagieren zu können. Jede Besessenheitsprobe erfordert eine Haupthandlung. Der Geist legt eine Vergleichende Probe auf Kraftstufe × 2 gegen Intuition + Willenskraft (bei lebenden Gefäßen) oder auf Kraftstufe × 2 gegen Objektwiderstand (bei leblosen Gefäßen) ab. Wenn das Gefäß mithilfe einer Ausgedehnten Probe auf Astral + Logik (Kraftstufe × 3, 1 Stunde) vorbereitet wurde, erhält der Geist 1 Edge, das ausschließlich für die Besessenheitsprobe eingesetzt werden darf. Misslingt die Probe, wird der Geist sofort gezwungen, auf die Astralebene zurückzukehren. Bei einem Erfolg gelingt es dem Geist, das Gefäß in Besitz zu nehmen, woraufhin der Geist und das Gefäß für die gesamte Wirkungsdauer der Kraft als ein einzelnes Dualwesen behandelt werden. Während der Besessenheit erhöht der Geist die Körperlichen Attribute des Gefäßes um Kraftstufe ÷ 2 (abgerundet), wofür die normale Maximalgrenze von +4 (SR6, S. 39) gilt. Zudem kann der Geist seine eigenen Fertigkeiten und Kräfte einsetzen und hat Zugriff auf die oberflächlichen Erinnerungen und Gedanken des Wirts. Wenn der Geist ein unbelebtes Gefäß in Besitz nimmt, erhöht er die jeweiligen passenden Attribute (z.B. Strukturstufe, Rumpf, Panzerung, Gerätestufe o.Ä.) um Kraftstufe ÷ 2 (abgerundet). Das letzte Wort hat hier die Spielleiterin. \nEin Geist, der die Kraft Besessenheit einsetzt, kann mit einer normalen Verbannenprobe (SR6, S. 149) aus dem Gefäß vertrieben und zurück auf die Astralebene geschickt werden. Wenn die Besessenheitsprobe misslingt oder der Geist verbannt wird, darf er bis zum nächsten Sonnenaufgang oder Sonnenuntergang nicht erneut versuchen, dieses Gefäß in Besitz zu nehmen. Wird der Geist nicht verbannt, verschwindet er bei Ablauf seiner Dienstzeit aus dem Gefäß. Für freie Geister ist die Dauer dieser Kraft Aufrechterhalten.
critterpower.quake.desc=Der Geist kann Erdbeben mit einem Radius von [Kraftstufe] Kilometern entstehen lassen, deren Erschütterungen mit Unterbrechungen für [Kraftstufe] Minuten andauern. Die Auswirkungen sind abhängig davon, wie gut die betroffene Region auf derartige Ereignisse vorbereitet ist. Regionen, die gegenüber Erdbeben besonders verwundbar sind, werden meist nicht regelmäßig von ihnen heimgesucht, während die Leute in Gebieten mit hohem Erdbebenrisiko ihre Wohngebäude in der Regel mit derartigen Katastrophen im Hinterkopf erbauen. Um die Auswirkungen zu bestimmen, legt der Geist eine Probe auf Willenskraft + Magie ab. Die Anzahl der Erfolge entspricht der Stärke des Erdbebens gemäß der Tabelle Erdbeben.
critterpower.realistic_form.desc=Diese Kraft erlaubt es dem Geist, mithilfe der Kraft Materialisierung einem normalen physischen Lebewesen oder einem Gegenstand täuschend ähnlich zu sehen oder komplett unauffällig zu erscheinen, wenn er mit einem Gefäß verbunden ist. In Gestalt eines lebenden Wesens atmet der Geist und hat einen Herzschlag, ein technischer Gegenstand hingegen würde ganz normal funktionieren. Auf der Astralebene ist der Geist zwar in keiner Form getarnt, aber bei einer rein physischen Beobachtung erscheint er als normaler, unauffälliger Teil der physischen Welt. \nBedenke, dass Geister mit der Kraft Materialisierung lediglich über eine einzige materialisierte Gestalt verfügen. Materialisierende Geister mit der Kraft Realistische Gestalt können wählen, ob sie die Gestalt dieser Kraft oder ihre normale Gestalt verwenden wollen. Ein Wasserelementar könnte beispielsweise als stetig in Bewegung befindliche Wasserwelle erscheinen, aber auch in der Lage sein, die Gestalt eines Orks mit kristallblauen Augen anzunehmen.
critterpower.spirit_regen.desc=Für diese Kraft gelten die Regeln der Critterkraft Regeneration (SR6, S. 226). Die Kraft ist nur in der materialisierten, besessenen oder bewohnten Gestalt des Geistes wirksam. Wenn der Geist Besitz von einem vormals lebendigen Gefäß ergriffen hat oder es bewohnt, regeneriert sich das Gefäß langsam und kehrt zum Leben zurück. Beispielsweise könnten einem hölzernen Homunculus neue Blätter wachsen oder eine Leiche wieder wie ein lebender Mensch erscheinen.
critterpower.shadow_cloak.desc=Mit dieser Kraft kann sich ein Geist in Dunkelheit hüllen. In allen Lichtverhältnissen mit Ausnahme von hellem Tageslicht erhält ein Geist mit dieser Kraft 1 Edge in Situationen, die sich um Kampf, Heimlichkeit oder soziale Interaktionen drehen. In Situationen mit schlechter Beleuchtung erhält der Geist den Status Unsichtbar (Kraftstufe ÷ 2).
critterpower.silence.desc=Ein Geist mit dieser Kraft kann sich mit einer Sphäre der Stille umgeben, deren Radius seinem Magieattribut in Metern entspricht. Alle Geräusche, die aus diesem Bereich herausdringen, werden gedämpft, und auch hineindringende Geräusche sind für den Geist und alle anderen Anwesenden schwerer zu hören. Diese Kraft erzeugt den Status Geräuschlos (Kraftstufe ÷ 2).
critterpower.skill.desc=Wähle entweder Biotech, Elektronik, Mechanik, Natur oder Steuern sowie zusätzlich eine Spezialisierung für die gewählte Fertigkeit und eine passende Wissensfertigkeit)
critterpower.storm.desc=Diese Kraft lässt in einem Gebiet einen gewaltigen und zerstörerischen elementaren Sturm entstehen. Eiskalter Regen, zuckende Blitze, Wind in Hurrikanstärke und golfballgroße Hagelkörner peitschen über das Land. Das betroffene Gebiet hat einen Radius von [Magieattribut des Geistes × 50] Metern. Das Erzeugen des Sturms erfordert eine Haupthandlung. Solange die Kraft aufrechterhalten wird, kann der Geist Nebenhandlungen aufwenden, um einen der folgenden Angriffe auszulösen: Blitzschlag, Eisregen, Hagelsturm oder Windstoß (s.u.). \nWenn sich ein Ziel 3 Kampfrunden lang innerhalb des Sturms aufhält, ohne auf irgendeine Weise den Status Deckung III oder IV zu erhalten, erhält es den Status Nass. \nBlitzschlag: Ein Blitz zuckt auf das Ziel herab. Der Geist führt einen Fernkampfangriff mit einem Angriffswert von [Kraftstufe × 2] durch und legt eine Probe auf Geschicklichkeit + Magie gegen Reaktion + Intuition des Ziels ab. Der Schadenswert des Angriffs beträgt (Kraftstufe ÷ 2)K und kann durch Nettoerfolge weiter gesteigert werden. Das Ziel kann dem Schaden mit Konstitution widerstehen. Der Schaden gilt als Elektrizitätsschaden. Wenn das Ziel Schaden erleidet, erhält es also für 2 Kampfrunden den Status Gebrutzelt. \nEisregen: Konzentrierter, eiskalter Regen peitscht auf das Ziel ein. Der Geist führt einen Fernkampfangriff mit einem Angriffswert von [Kraftstufe × 2] durch und legt eine Probe auf Konstitution + Magie gegen Reaktion + Intuition des Ziels ab. Der Schadenswert des Angriffs beträgt ([Kraftstufe ÷ 2] + 1)B und steigt wie üblich mit den Nettoerfolgen. Das Ziel kann dem Schaden mit Konstitution widerstehen. Der Schaden gilt als Kälteschaden. Wenn das Ziel Schaden erleidet, erhält es also für 3 Kampfrunden den Status Unterkühlt. \nHagelsturm: Ein Schwall aus golfballgroßen Eisstücken prasselt auf das Ziel ein. Der Geist führt einen Fernkampfangriff mit einem Angriffswert von [Kraftstufe × 2] durch und legt eine Probe auf Stärke + Magie gegen Reaktion + Intuition des Ziels ab. Der Schadenswert des Angriffs beträgt ([Kraftstufe ÷ 2] + 1)B und steigt wie üblich mit den Nettoerfolgen. Das Ziel kann dem Schaden mit Konstitution widerstehen. Wenn es Schaden erleidet, erhält es für 2 Kampfrunden den Status Benommen. \nWindstoß: Ein konzentrierter Windstoß donnert gegen das Ziel. Der Geist legt eine Vergleichende Probe auf Stärke + Magie gegen Geschicklichkeit + Stärke des Ziels ab. Gelingt die Probe, wird das Ziel [Kraftstufe + Nettoerfolge] Meter weit in eine vom Geist gewählte Richtung geschleudert und erhält am Ende den Status Liegend. Wenn der Weg durch einen Gegenstand blockiert ist, muss das Ziel mit Konstitution eine Schadenwiderstandsprobe gegen (bereits zurückgelegte Meter)B Schaden ablegen. Wenn es Schaden erleidet, erhält es für 2 Kampfrunden den Status Verwirrt 2. Prallt das Ziel gegen eine andere Person, legt diese eine Probe auf Athletik + Geschicklichkeit ab, deren Schwellenwert den bereits zurückgelegten Metern entspricht. Misslingt diese Probe, erhält sie den Status Liegend.
critterpower.temp_displace.desc=Diese Kraft verlangsamt innerhalb einer Sphäre mit [Kraftstufe] Metern Durchmesser scheinbar die Zeit. Alle Personen innerhalb dieses Bereichs können sich dort bewegen und miteinander kommunizieren, jedoch keine Gegenstände außerhalb des Wirkungsbereichs beeinflussen. Alle Personen und Gegenstände, die den Bereich verlassen (und sei es nur mit dem kleinen Finger), nehmen wieder die Geschwindigkeit der Außenwelt an, können jedoch kein Momentum durch die Grenze der Sphäre übertragen. Es können also keine Gegenstände nach draußen geworfen oder Schüsse abgegeben werden. Genau genommen setzen Geister diese Kraft niemals auf offensive Art ein. \nAlle Personen, die sich außerhalb der Sphäre befinden, bemerken den Effekt nicht.
critterpower.vessel_trade.desc=Hast du dich je gefragt, wo die alten Geschichten über körperstehlende Dämonen herkommen? \nDiese Kraft ist die Antwort. Ein Geist mit der Kraft Besessenheit kann die Kraft Gefäßtausch einsetzen, um die Lebenskraft aus einem lebendigen Gefäß zu extrahieren. Der Geist kann dabei wählen, ob er die Lebenskraft des Opfers zwingt, in den Astralraum zu wandern (wodurch – selbst wenn das Opfer mundan war – ein astral projizierendes Wesen entsteht), oder ob er die Lebenskraft des Opfers auf sein bisheriges Gefäß übertragen will. Bei Geistern, die häufig das Gefäß wechseln, ist das Opfer gezwungen, astral zu projizieren, falls die Lebenskraft des vorherigen Gefäßes bereits durch die Besessenheit unterdrückt wird. \nEs gelten die Standardregeln für die Kraft Besessenheit (S. 78). Opfer, die in ein lebendes oder lebloses Gefäß transferiert werden, können dieses nicht wie ein Geist mit der Kraft Besessenheit kontrollieren. Ein lebendes Gefäß fällt in einen komatösen Zustand, sein Geist ist jedoch noch wach und kann mit bestimmten Zaubern zum Aufbau einer mentalen Verbindung kontaktiert werden. Ein lebloses Gefäß nimmt wieder seine ursprüngliche Gestalt an, während das Opfer im Inneren gefangen ist. Für Zauber zum Verbinden/Lesen von Gedanken gelten die gleichen Regeln wie zuvor, allerdings muss der Gegenstand erst mit mindestens 3 Erfolgen askennt werden, um zu erkennen, dass etwas nicht stimmt. \nDie einzigen Möglichkeiten zur Flucht sind ein freier Geist, der ebenfalls über diese Kraft verfügt und das Opfer zurücktauscht, oder der Einsatz der Fähigkeit der natürlichen astralen Projektion durch das Opfer. Alternativ wird das Opfer auch befreit, wenn das Gefäß in Kontakt mit einem astralen Spalt oder einem Wesen mit der Kraft Astrales Tor (S. 77) kommt. Ein Opfer, das in einem leblosen Gefäß oder im Astralraum gefangen ist, kann spüren, wie seine Lebenskraft langsam versiegt, und stirbt nach [(Magie oder Essenz; der höhere der beiden Werte) × 2] Stunden.
critterpower.wealth.desc=Hast du dich je gefragt, woher Butterblume das Geld hatte, sich bei Evo einzukaufen? Ein Geist mit dieser Kraft ist in der Lage, wertvolle Metalle, Juwelen und andere seltene und sehr wertvolle Gegenstände zu erschaffen. Die Geister sprechen niemals darüber, woher diese Gegenstände kommen. \nEinmal pro Mondzyklus kann ein Geist mit dieser Kraft eine Probe auf Magie + Edge ablegen. Jeder Erfolg generiert mineralische alchemistische Reagenzien im Wert von 10.000 Nuyen, üblicherweise in Form von Edelmetallen, Edelsteinen oder sogar Orichalkum. Für den Geist besteht der Nachteil daran darin, dass diese Schöpfungen auf ewig seine astrale Signatur tragen werden. So, wie die normalen Märkte beschaffen sind, könnte es sich für Charaktere als schwierig erweisen, magische Edelsteine an seriöse Quellen zu verkaufen. Schwarzmarkthändler hingegen bieten einen geringeren Preis, nehmen dafür aber das Risiko auf sich. Lege eine Vergleichende Probe auf Einfluss (Verhandeln) + Charisma ab – der Preis startet bei 50 Prozent des Marktwerts und steigt bzw. sinkt pro Nettoerfolg um 10 Prozent. Das Maximum beträgt 100 Prozent, das Minimum 0 Prozent (in diesem Fall handelt der entsprechende Händler nicht mit dieser Art von Waren). \nEin Geist mit dieser Kraft kann zudem jeden Tag eine vergleichbare Menge an temporärem Reichtum erzeugen, der eng mit seiner Geisterart in Verbindung steht. Wenn die Sonne jedoch das nächste Mal auf- oder untergeht, verschwinden diese wertvollen Gegenstände oder verwandeln sich in Dreck und andere wertlose Substanzen. Daher zögern kluge Geschäftsleute oftmals, Wertgegenstände mit einer astralen Signatur zu kaufen.

