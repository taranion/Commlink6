adeptpower.aid_sorcery.desc=Du bist in der Lage, deine innere Magie so zu kanalisieren, dass ein in der Nähe befindlicher Zauberwirkender (aber nicht du selbst) bei seinem Zauber unterstützt wird. Du musst den Zauberer berühren und eine Haupthandlung aufwenden, um einen Manakreislauf zwischen euch beiden zu öffnen. Um den Kreislauf aufrechtzuerhalten, müsst ihr euch die ganze Zeit über berühren und in jeder folgenden Runde eine Nebenhandlung aufwenden. Wenn ein Zauberer einen Zauber wirkt, während ein solcher Kreislauf aktiv ist, erhält er einen Würfelpoolbonus in Höhe deiner Stufe in dieser Kraft für alle Hexerei-Proben. Jedes Mal, wenn ein Zauberer diese Bonuswürfel einsetzt, musst du anschließend einem Entzugsschaden in Höhe der Stufe deiner Kraft Hilfshexerei widerstehen.
adeptpower.air_dance.desc=Mit dieser Kraft kannst du als besonders schneller Adept gegenüber langsameren Gegnern einen Vorteil aus deiner überlegenen Reaktionsgeschwindigkeit schlagen. Du gleitest dabei im Kampf elegant durch die Luft, während deine Füße etwa einen Zentimeter über dem Boden schweben. Zu Beginn jeder Kampfrunde wird deine Initiative mit dem höchsten Initiativewert der Gegenseite verglichen. Für jeweils [10 - Initiatengrad] Initiativepunkte (bis zu einem Minimum von 1), die du deinem schnellsten Gegner voraus hast, erhältst du eine zusätzliche Nebenhandlung. Mit dieser Kraft ist es möglich, mehr als 5 Nebenhandlungen in einer Kampfrunde zu erhalten.
adeptpower.analytics.desc=Diese Kraft versetzt dich in die Lage, Muster und Rätsel mit übernatürlicher Leichtigkeit zu erkennen und zu lösen. Du erhältst 1 Edge, wann immer du eine Probe ablegst, bei der Logik ein Teil des Würfelpools ist (außer bei Entzugswiderstandsproben). Das Edge muss bei dieser Probe eingesetzt werden, sonst verfällt es.
adeptpower.animal_empathy.desc=Du gehörst zu denjenigen Adepten, die ein beeindruckendes Talent dafür haben, eine Verbindung zu Crittern aufzubauen, die nicht die Kraft Bewusstsein haben. Mit Stufe 1 dieser Kraft senkst du die Kosten für Edge-Boosts bei Proben gegen mundane Critter, bei denen Charisma ein Teil des Würfelpools ist, um 1. Tierempathie 2 gewährt denselben Bonus auch für Erwachte Critter - darunter auch Dracoformen, Infizierte und so weiter. Viel Erfolg dabei!
adeptpower.attribute_boost_mental.desc=Feingeistigere Adepten nutzen ihren internen Manafluss, um nicht nur ihre körperlichen Fähigkeiten, sondern auch ihre Intelligenz, ihre Wahrnehmung, ihr Charisma und ihre Willenskraft zu verbessern. Beim Kauf dieser Kraft legst du ein Geistiges Attribut (Willenskraft, Logik, Intuition oder Charisma) fest. Die Kraft kann mehrfach erworben werden, wobei du entweder die Stufe eines bestehenden Attributsschubs steigerst oder die Kraft für ein neues Attribut wählst. Diese Kraft kann nicht für Körperliche Attribute oder Spezialattribute gewählt werden. Wenn die Kraft aktiviert wird, lege eine Probe auf Magie + (Stufe des Attributsschubs für das entsprechende Attribut) ab. Jeder Erfolg erhöht die Stufe des Attributs temporär um 1, bis zum Maximum von +4. Dies wirkt sich nur auf Würfelpools und nicht auf den Initiativewert, Zustandsmonitor usw. aus. Der Effekt hält [Erfolge] Kampfrunden lang an. Wenn die Kraft abklingt, musst du einem Entzug in Höhe der Stufe der Kraft für das entsprechende Attribut widerstehen.
adeptpower.berserk.desc=Manche Adepten tragen eine Quelle wütenden Manas in sich und haben gelernt, diese wilde Energie anzuzapfen, um sich in einen Kampfrausch zu versetzen, der ihre körperlichen Fähigkeiten um ein Vielfaches verstärkt. Wenn du diese Kraft aktivierst, erhältst du pro Stufe dieser Kraft +1 auf alle Körperlichen Attribute. Dieser Bonus ist kumulativ mit anderen Verbesserungen, es gilt jedoch weiterhin das Maximum von +4. Außerdem ignorierst du Schaden in Höhe der Stufe dieser Kraft (als ob du zusätzlich über Schmerzresistenz der gleichen Stufe verfügen würdest - dies ist kumulativ mit einer bestehenden Schmerzresistenz und anderen Boni), erleidest jedoch pro Stufe dieser Kraft einen Malus von -1 auf alle Geistigen Attribute (bis zu einem Minimum von 1) und bist ein Sklave deiner instinktgesteuerten Aggression. Diese Modifikatoren gelten für die meisten Würfelpools (Initiative, Angriffsproben, Schadenswiderstandsproben usw.) und den Nahkampf-Angriffswert, allerdings nicht für Zustandsmonitore. Im Berserker-Modus musst du jede Runde Nahkampfangriffe gegen ein Ziel in Reichweite durchführen oder Haupthandlungen aufwenden, um dich näher an ein Ziel heranzubewegen, falls Ersteres nicht möglich ist. Dies schließt auch Verbündete und Passanten mit ein, sobald dir die Gegner ausgehen. Der Berserkerrausch hält für [Stufe in dieser Kraft × 2] Kampfrunden an. Wenn du diesen aggressiven Zustand vorzeitig beenden möchtest (zum Beispiel, um dich zurückzuziehen oder weil alle Feinde besiegt sind), musst du eine Probe mit deinen Entzugswiderstandsattributen ablegen und mindestens so viele Erfolge erzielen, wie deine Stufe in dieser Kraft beträgt. Wenn die Kraft abklingt, egal ob auf natürlichem Weg oder durch eine willentliche Deaktivierung, musst du einem Entzug gleich dem Doppelten deiner Stufe in dieser Kraft widerstehen. Dafür werden deine normalen (nicht durch den Berserkerrausch modifizierten) Attributswerte verwendet.
adeptpower.blind_fighting.desc=Du verlässt dich auf eine Kombination aus mehreren anderen Sinnen, um reflexartig deinen ausgefallenen Sehsinn auszugleichen, sei es aufgrund einer permanenten Verletzung, temporärer Einschränkungen oder schlicht einer Augenbinde. Du gewährst einem Gegner im Nahkampf niemals Bonus-Edge für Sichtmodifikatoren (für Dunkelheit, Flash-Packs, Tränengas oder andere Sichteinschränkungen), was dich allerdings nicht immun gegen Hinterhalte oder Überraschungsangriffe macht.
adeptpower.cloak.desc=Einige Auren lassen sich leichter anvisieren als andere. Für jede Stufe, die du in dieser Kraft besitzt, kannst du anderen einen Würfelpoolmodifikator von -1 für Proben zum Lesen deiner Aura auferlegen.
adeptpower.commanding_voice.desc=Deine Worte tragen eine übernatürliche Autorität und Kraft mit sich. Für jede Stufe dieser Kraft erhältst du einen Würfelpoolbonus von +1 auf Vergleichende Einflussproben zur Einschüchterung, die du selbst initiiert hast. Deine energischen Befehle sind dabei von unaufhaltsamer Absicht erfüllt. Wenn dir eine derartige Probe gelingt, muss die Zielperson deine Befehle befolgen, zumindest temporär. Gefährliche Befehle oder Befehle, die in gefährlichen Situationen (beispielsweise im Kampf) erteilt werden, werden für maximal [Stufe dieser Kraft] Kampfrunden befolgt. Befehle dürfen niemals dazu führen, dass sich die Zielperson selbst direkt Schaden zufügt ("Spring vom Dach", "Lauf auf die befahrene Straße" und "Erschieß dich selbst" sind beispielsweise keine gültigen Befehle), aber sie dürfen zu einem Moment der Verwundbarkeit führen, der anschließend ausgenutzt werden kann ("Setz dich hin" oder "Keine Bewegung"). Das Ziel darf beispielsweise auch dazu gebracht werden, temporär die Seite zu wechseln ("Erschieß diesen Wachmann!"). Im Zweifel sollte ein erfolgreicher Befehl die Zielperson zumindest eine komplette Runde lang erstarren lassen, selbst wenn der erteilte Befehl nicht ausführbar oder offensichtlich suizidal ist. Eindeutig übernatürliche Befehle führen nach Maßgabe der Spielleiterin dazu, dass sich die Zielperson der externen Kontrolle bewusst wird, während weniger radikale Anweisungen zu länger anhaltendem Gehorsam führen können - und wenn sie sorgfältig formuliert werden, schöpfen die Zielperson oder andere Personen vielleicht nicht einmal Verdacht, dass übernatürliche Manipulation im Spiel ist (auch wenn ihnen vermutlich trotzdem auffallen wird, dass jemand Befehle bellt und diese Befehle befolgt werden - die magische Kontrolle selbst ist dabei nicht offensichtlich). Mit einem "Komm schon, Mann, lass uns rein" kommst du vielleicht ohne Schwierigkeiten in einen Club, während der laute Ruf "Kämpf gegen ihn, muahaha", mit dem der Türsteher zu deiner Unterhaltung gegen seinen Kollegen aufgehetzt wird, mit viel höherer Wahrscheinlichkeit Aufmerksamkeit auf sich zieht und recht offensichtlich ist.
adeptpower.cool_resolve.desc=Du schirmst deine Psyche mit Mana und Bestimmtheit ab und bist dadurch auf beeindruckende Weise durch nichts aus der Fassung zu bringen. Für jede Stufe dieser Kraft erhältst du einen Würfelpoolbonus von +1 auf alle Vergleichenden Sozialen Proben, um den Einflussfertigkeiten anderer Personen zu widerstehen, sowie einen Würfelpoolbonus von +1 auf alle Widerstandsproben gegen die Critterkraft Grauen (aber nicht gegen andere Critterkräfte). Du darfst diese Würfel hinzunehmen, musst es aber nicht, sodass du weiterhin von Führen- oder Unterrichtenproben usw. profitieren kannst.
adeptpower.cosmetic_control.desc=Du bist in der Lage, deinen Körper zu verändern und dein physisches Erscheinungsbild anzupassen, indem du dein Haar wachsen oder ausgehen lässt, traditionelle Geschlechtsmerkmale veränderst, deine Hautfarbe anpasst, Flecken oder Narben hinzufügst oder entfernst, deine Gesichtszüge neu formst, deine Größe und dein Gewicht änderst oder andere kosmetische körperliche Eigenschaften vergrößerst oder verkleinerst (Oberweite und Hüftbreite, Fingernägel wachsen lassen oder kürzen usw.). Diese Veränderungen sind rein kosmetisch, aber keine Illusion. Kleidung und andere Ausrüstung sind nicht betroffen. Mit dieser Kraft kann weder Schaden geheilt noch Bodytech entfernt oder eingebaut o. Ä. werden.<br/>\
 Kosmetische Kontrolle der Stufe 1 erlaubt es dir, deinen Körper innerhalb der normalerweise für deinen Metatyp geltenden Grenzen zu verändern (Ohren bleiben spitz bzw. rund, Trolle behalten ihre Hörner, Orks ihre Hauer, die Körpergröße bleibt innerhalb der Bandbreite des Metatyps, Haar-, Augen- und Hautfarbe sind auf die normalen Ausprägungen des Metatyps beschränkt).<br/>\
 Mit Kosmetischer Kontrolle der Stufe 2 kannst du die normalen Einschränkungen deiner Metaspezies überwinden, sowohl in Hinblick auf das allgemeine Aussehen (Ohrenform, Hinzufügen oder Entfernen von Hörner und Hauern usw.) als auch auf die Größe, sodass du zum Beispiel als Zwerg die Körpergröße eines Menschen/Elfen/Orks erreichen kannst (oder dich kleiner machen kannst, beispielsweise so groß wie ein Pixie -kleine humanoide Wesen, die einen knappen halben Meter groß sind), als Troll deine Größe auf die eines Menschen/Elfen/Orks reduzieren kannst (oder sogar noch größer als ein normaler Troll werden kannst) oder als Mensch/Elf/Ork auf jedes der beiden Extreme wachsen bzw. schrumpfen kannst. Diese Modifikationen sorgen nach wie vor nicht für irgendeine Art von Attributsveränderung, aber sie erlauben dir, in jeder Hinsicht als Vertreter eines anderen Metatyps durchzugehen. <br/>\
 Mit dieser Stufe der Kraft hast du zudem Zugriff auf eine breitere Palette an anderen kosmetischen Veränderungen wie beispielsweise Haare, Haut- und Augenfarbe inklusive einer größeren Vielfalt an Mustern (Haar mit blauen Strähnen, grüne Haut, Tätowierungen, geschlitzte Augen wie bei einer Katze oder beliebige andere kosmetische Modifikationen).<br/>\
 Jede Stufe dieser Kraft senkt zusätzlich zu den angegebenen visuellen Modifikationen in passenden Situationen auch die Kosten für Edge-Boosts bei Überredenproben für Schauspielern, Verkleiden oder Verkörpern um 1. (Nach Spielleiterentscheid kann dieser Bonus auch für Einflussproben gelten, insbesondere für Einschüchtern, da diese Fertigkeit mit der Körpergröße in Verbindung steht, oder für metatypspezifische Gebräucheproben.) Die Spielleiterin und die Spieler können für weitere Regelhinweise bei geänderten Umständen und geändertem Aussehen die Tabelle Edge bei Sozialen Proben (SR6, S. 50) zurate ziehen.
adeptpower.countermagic.desc=Zaubersprüche gleiten einfach von dir ab. Du erhältst pro Stufe dieser Kraft einen Würfelpoolbonus von +1 auf alle Widerstandsproben gegen Zauber. Dafür musst du eine Nebenhandlung ausgeben, woraufhin die Magieabwehr für [Magie] Kampfrunden anhält.
adeptpower.counterstrike.desc=Du kannst im Nahkampf fließend von der Defensive in die Offensive wechseln und deinen Gegner unvorbereitet erwischen, nachdem du dich erfolgreich gegen seinen Angriff verteidigt hast. Diese Kraft darfst du nur einsetzen, unmittelbar nachdem du erfolgreich mit einer Nebenhandlung einen Nahkampfangriff geblockt hast (SR6, S. 43). Du gibst eine weitere Nebenhandlung aus, um die Kraft Gegenangriff zu aktivieren, und erhältst auf deine nächste Angriffsprobe im Nahkampf einen Würfelpoolbonus in Höhe der Stufe dieser Kraft + aller Nettoerfolge, die du beim Blocken erzielt hast - allerdings nur bei Angriffen gegen den Gegner, dessen Angriff du unmittelbar zuvor geblockt hast.
adeptpower.dash.desc=Flinke Füße wäre noch harmlos ausgedrückt! Wenn du eine Sprintenprobe (SR6, S. 45) ablegst und eine Nebenhandlung aufwendest, um dich zu fokussieren, erhöht sich deine Bewegungsrate pro Stufe dieser Kraft um +1 Meter.
adeptpower.distance_grasp.desc=Du kannst die physische Welt mithilfe eines psychokinetischen Effekts manipulieren, der grob deine Hände imitiert. Die Reichweite dieser Kraft beträgt [Stufe × Magie] Meter. Du verfügst dabei über eine effektive Stärke in Höhe der Stufe dieser Kraft. Du kannst auf diese Weise Fertigkeiten aus der Distanz einsetzen, kleine Gegenstände aufheben, Schalter umlegen, eine Tastatur benutzen, Schlösser knacken usw., aber du kannst mit dieser Kraft keine Angriffe durchführen (siehe dazu die Kraft Fernschlag). Die übernatürliche Intention hinter dieser Kraft dient der Manipulation, nicht der Offensive.
adeptpower.distance_strike.desc=Du bist in der Lage, deine körperliche Stärke über kurze Distanzen zu projizieren, begleitet von der klaren, von Mana durchdrungenen Absicht, deinem Ziel Schaden zuzufügen. Auf diese Weise kannst du einen Schlag gegen ein Ziel durchführen, ohne es tatsächlich zu berühren. Die Reichweite des Fernschlags entspricht deinem Magieattribut in Metern, der Schadens- und Angriffswert sind dieselben wie bei deinen waffenlosen Angriffen (inklusive Modifikatoren durch übernatürliche Fähigkeiten oder Bodytech wie beispielsweise Todeskralle, Elementarer Schlag oder Kompositknochen - rein externe Modifikatoren wie Schlagringe oder Schockhandschuhe haben jedoch keine Auswirkungen). Du greifst mit der Fertigkeit Nahkampf an, als würdest du einen normalen waffenlosen Angriff durchführen, aber das Ziel darf sich entweder gegen einen Nahkampfangriff oder gegen einen Fernkampfangriff verteidigen (und dabei je nach Präferenz ausweichen oder blocken). Es gelten die normalen Modifikatoren für Deckung. Der Schlag kann keine festen Objekte oder Manabarrieren durchdringen.
adeptpower.elemental_missile.desc=Diese Kraft erlaubt es dir, einen Fernkampfangriff mit einer elementaren Schadensart (s. Schadensarten, SR6, S. 112) aufzuladen. Die Kraft zu aktivieren und deinen Angriff sichtbar mit elementarer Energie aufzuladen, erfordert eine Nebenhandlung. Danach bleibt sie für [Magie] Kampfrunden oder bis zu ihrer freiwilligen vorzeitigen Deaktivierung aktiv. Beim Kauf dieser Kraft musst du ein Element und eine Art von Fernkampfangriff aus der folgenden Liste wählen: Nicht explosive Wurfwaffen (darunter auch Angriffe mit Geschossmeisterschaft), Projektilwaffen, eine Spezialisierung der Fertigkeit Exotische Waffen oder eine Spezialisierung der Fertigkeit Feuerwaffen. Du musst nicht über die gewählte Spezialisierung oder Expertise verfügen, aber beim Einsatz dieser Kraft zählt jeweils die enger gefasste Waffenkategorie. Elementares Geschoss kann auch für die Mechanik-Spezialisierung Geschütze gewählt werden, aber der Elementareffekt kann in diesem Fall nur genutzt werden, wenn du die Metamagie Einstimmung (Gegenstand) eingesetzt hast, um dich mit der Drohne oder dem Fahrzeug zu verbinden, auf das die Waffe montiert ist. Diese Kraft kann mehrfach erworben werden, wodurch entweder andere (nicht mehrere gleichzeitig) elementare Effekte einer Kategorie von Fernkampfangriff gewählt oder bereits erworbene Elementareffekte auf eine breitere Palette von Waffen angewendet werden können. Pro Angriff darf nur ein Elementareffekt gleichzeitig aktiv sein.
adeptpower.elemental_strike.desc=Wenn du diese Kraft beherrschst, kannst du rohe elementare Energie in deine waffenlosen Angriffe leiten und ihnen damit eine elementare Schadensart (s. Schadensarten, SR6, S. 112) verleihen. Die Kraft zu aktivieren und deine Hand, deinen Fuß oder ein anderes für den Angriff verwendetes Körperteil sichtbar mit Energie zu umhüllen erfordert eine Nebenhandlung. Danach bleibt die Kraft für [Magie] Kampfrunden oder bis zu ihrer freiwilligen vorzeitigen Deaktivierung aktiv. Diese Kraft kann mehrfach erworben werden, wobei jedes Mal eine neue elementare Schadensoption hinzugefügt wird. Pro Angriff kann jedoch nur ein Elementareffekt aktiv sein.
adeptpower.elemental_weapon.desc=Diese Kraft erlaubt es dir, elementare Energie in deine Nahkampfangriffe mit Nahkampfwaffen (nicht mit bloßen Händen) zu leiten. Du kannst deinen bewaffneten Nahkampfangriffen (egal mit welcher Fertigkeit du sie ausführst) einen elementaren Schadenstyp (s. Schadensarten, SR6, S. 112) hinzufügen. Die Kraft zu aktivieren und deine Waffe in deutlich sichtbare elementare Energie zu hüllen erfordert eine Nebenhandlung. Danach bleibt die Kraft für [Magie] Kampfrunden oder bis zu ihrer freiwilligen vorzeitigen Deaktivierung aktiv. Diese Kraft kann mehrfach erworben werden, wobei jedes Mal eine neue elementare Schadensoption hinzugefügt wird. Pro Angriff kann jedoch nur ein Elementareffekt aktiv sein.
adeptpower.empathic_healing.desc=In kritischen Momenten bist du in der Lage, deine Lebenskraft mit der einer verletzten Person zu verbinden und die Verletzungen der Zielperson über diese mächtige - und schmerzhafte - Verbindung auf dich selbst zu übertragen. Du leitest die Empathische Heilung ein, indem du physischen Kontakt mit dem Ziel herstellst und eine Probe auf Willenskraft + Magie (5 - [Essenz der Zielperson, abgerundet]) ablegst. Pro Erfolg kannst du 1 Kästchen Körperlichen Schaden oder Überzähligen Schaden des Ziels entfernen. Gleichzeitig erleidest du für das erste auf diesem Wege übertragene Schadenskästchen 1 Kästchen Betäubungsschaden, alle weiteren in darauffolgenden Handlungen transferierten Schadenskästchen erhältst du als Körperlichen Schaden. Der Schaden wird mit einer Geschwindigkeit von 1 Kästchen pro Haupthandlung übertragen. Du kannst diesem Schaden nicht widerstehen. Während dieser Zeit muss der Körperkontakt zwischen dir und dem Ziel aufrechterhalten werden. Jede Verletzung kann nur ein einziges Mal Ziel von Empathischer Heilung werden (allerdings zählt der Einsatz dieser Kraft nicht gegen das Limit von einem Heilzauber pro Verletzung). Beispiel: Der Unterhändler deines Teams hat Essenz 6 und hat durch einen Gewehrtreffer 8 Kästchen Körperlichen Schaden erlitten. Du berührst ihn, gibst eine Haupthandlung aus, legst eine Probe auf Willenskraft + Magie ab, erzielst 4 Erfolge, addierst +1 Erfolg für die hohe Essenz der Zielperson und hast somit insgesamt 5 Erfolge erreicht. Direkt im Zuge dieser Probe sinkt der Körperliche Schaden des Unterhändlers auf 7 Kästchen Körperlichen Schaden, während du 1 Kästchen Betäubungsschaden erleidest. Während der nächsten Haupthandlung, die für diese Prozedur aufgewendet wird, sinkt der Schaden des Unterhändlers auf 6 Schadenskästchen, und du erhältst 1 Kästchen Körperlichen Schaden. Wird der Körperkontakt aufrechterhalten und die Kraft über die komplette Zeitdauer hinweg eingesetzt, hat der Unterhändler am Ende noch immer 3 Kästchen Körperlichen Schaden, während du nun 4 Kästchen Körperlichen Schaden und 1 Kästchen Betäubungsschaden hast.
adeptpower.empathic_sense.desc=Diese Kraft ermöglicht dir den Zugang zu einer abgeschwächten Variante des Askennens, die es dir erlaubt, die wahren Gefühle und die Gesundheit von Zielen in deinem Sichtfeld zu erkennen. Dazu wendest du eine Haupthandlung auf, legst eine Probe auf Wahrnehmung + Intuition ab und erhältst anschließend Informationen entsprechend der Tabelle Askennen (SR6, S. 161). Dabei kannst du jedoch nur Informationen über den Gefühlszustand und die körperliche Gesundheit des Ziels (Krankheiten, Verletzungen, Gifte, ob das Ziel Erwacht, mundan, Technomancer oder Monade ist) erhalten, nicht die weiteren Informationen aus der Tabelle. Wenn du eine Vergleichende Soziale Probe gegen das Ziel ablegst und dabei Informationen nutzen kannst, die du mithilfe der Kraft Empathisches Gespür gewonnen hast, erhältst du für diese Probe 1 Edge (das nur für diese Probe genutzt werden darf und ansonsten verfällt). Falls du die Kraft Empathisches Gespür besitzt und später die Fähigkeit zur vollwertigen Astralen Wahrnehmung erlangst, können die für diese Kraft ausgegebenen Kraftpunkte neu verteilt werden.
adeptpower.enthralling_performance.desc=Wenn du diese Kraft beherrschst, kannst du eine künstlerische Darbietung mit magischer Energie anreichern, um das Publikum zu fesseln und es sogar in einen entspannten hypnotischen Zustand zu versetzen. Du wendest eine Nebenhandlung auf, um deine Kraft zu sammeln (zusätzlich zu den Aktionen, die du verwenden musst, um dein Instrument zu spielen, zu tanzen, zu singen o. Ä.), und kannst anschließend eine Probe auf die passende Fertigkeit/Spezialisierung + Magie ablegen. Deine Erfolge dienen als Schwellenwert für sämtliche Wahrnehmungsproben, die das Publikum während deiner Vorstellung ablegt. Gebannte Personen im Publikum können für bis zu [(Charisma + Magie) × Erfolge] Minuten abgelenkt werden, aber Zuschauer, die angegriffen, offen bedroht oder anderweitig durch einen Schock aus der Trance gerissen werden (ausreichend laute Geräusche, die sich aktivierende Sprinkleranlage, ein aktiviertes Flash-Pack, nicht schallgedämpfte Schüsse usw.), kommen bereits früher wieder zu sich. Im Normalfall wird diese Kraft mit der Überreden-Spezialisierung Vorführen genutzt, die Spielleiterin kann jedoch auch andere Fertigkeiten zulassen - beispielsweise Einfluss (Führung) für eine motivierende Rede, Athletik (Akrobatik) für eine beeindruckende Vorführung oder sogar Nahkampf (Waffenloser Kampf) für eine Kata-Sequenz, Heimlichkeit (Fingerfertigkeit) für ablenkende Zaubertricks oder andere für den Charakter passende Kombinationen, die jedoch beim Kauf der Kraft festgelegt werden müssen. Die Kraft kann mehrfach für jeweils unterschiedliche Kombinationen von Fertigkeit und Spezialisierung erworben werden.
adeptpower.freefall.desc=Einige Adepten sind übernatürlich leichtfüßig. Jede Stufe dieser Kraft erhöht die Distanz, die du fallen kannst, bevor der Fallschaden berechnet wird (s. SR6, S. 117), um 3 Meter.
adeptpower.great_leap.desc=Diese Kraft erlaubt es dir, mit deinen Sprüngen beeindruckende Distanzen zu überwinden. Pro Stufe dieser Kraft erhöht sich deine Geschicklichkeit für Springenproben (SR6, S. 95) um 1. Das beeinflusst sowohl die Springenprobe an sich als auch die Berechnung der maximalen Sprungweite/-höhe.
adeptpower.improved_mental_attribute.desc=Lege beim Erwerb dieser Kraft ein Geistiges Attribut (Willenskraft, Logik, Intuition oder Charisma) fest. Dieses Attribut erhält eine permanente Steigerung in Höhe der Stufe dieser Kraft. Das Attribut kann maximal auf das 1,5-Fache (aufgerundet) seiner gegenwärtigen Stufe oder um +4 erhöht werden (je nachdem, was niedriger ist).
adeptpower.iron_will.desc=Du bist in der Lage, übernatürliche Beeinflussung leichter abzuschütteln als die meisten anderen Leute. Pro Stufe dieser Kraft erhältst du einen Würfelpoolbonus von +1 auf alle Proben, mit denen du magischer Gedankenkontrolle oder magischer Gefühlsmanipulation widerstehst (einschließlich Manipulationszaubern sowie Critter- und Adeptenkräften).
adeptpower.kinesics_mastery.desc=Du bist ein Meister der Körpersprache, nonverbalen Kommunikation und sowohl darin, Anspannung bei anderen wahrzunehmen, als auch deine eigene Anspannung zu verbergen. Diese Kraft verleiht dir zwei Vorteile: Zum einen können du und ein anderer Adept mit Perfekter Körpersprache in deinem Sichtfeld komplizierte und detaillierte Informationen austauschen, ohne dass Außenstehende es bemerken - im Grunde führt ihr heimlich ein komplettes Gespräch. Zum anderen verleiht dir die Kraft Körpersprache pro Stufe in Perfekter Körpersprache ein zusätzliches Mal pro Begegnung Edge (SR6, S. 159).
adeptpower.linguistics.desc=Du bist in der Lage, deine übernatürliche Wahrnehmung, Merkfähigkeit, Nachahmung und empathische Kraft zu fokussieren, um Sprachen bereits nach kürzestem Kontakt mit ihnen zu erlernen, ohne dafür Karma ausgeben zu müssen. Du musst einer neuen Sprache mindestens eine Stunde lang ausgesetzt sein und erhältst die neue Sprachfertigkeit dann auf der Basisstufe (s. Sprachfertigkeiten, SR6, S. 100). Diese Kraft verleiht dir zudem einen Würfelpoolbonus von +1 auf Wahrnehmungsproben zum Verstehen von Sprachen, die du (entweder mithilfe dieser Kraft oder auf traditionellem Wege) bereits beherrschst.
adeptpower.living_focus.desc=Diese Kraft erlaubt es dir, das Mana in deinem Körper zu fokussieren und es wie eine Batterie zu nutzen, um einen auf dich gewirkten Zauber aufrechtzuerhalten (vergleichbar mit einem Zauberspeicher). Wenn du diese Kraft einsetzt, um einen Zauber aufrechtzuerhalten, muss der Zauberwirkende dies nicht mehr selbst übernehmen. Eine Probe muss dafür nicht abgelegt werden, aber du erhältst anstelle des Zauberers den normalen Würfelpoolmalus von -2 für das Aufrechterhalten des Zaubers. Wenn du einschläfst oder bewusstlos wirst, kann der Zauber nicht länger aufrechterhalten werden, sodass der Zauberer ihn entweder (inklusive des Würfelpoolmalus) selbst aufrechterhalten oder fallen lassen muss. Höhere Stufen dieser Kraft ermöglichen es dir, zusätzliche Zauber aufrechtzuerhalten (ein Zauber pro Stufe dieser Kraft), oder können genutzt werden, um den Malus für das Aufrechterhalten eines Zaubers auszugleichen (jede Stufe dieser Kraft nach der ersten, die in einen Zauber investiert wird, senkt den Malus um 1). Beispiel: Lebender Fokus 3 erlaubt es dir, einen Zauber ohne Malus, drei Zauber mit einem kumulierten Malus von -6 oder zwei Zauber mit einem kumulierten Malus von -3 aufrechtzuerhalten.
adeptpower.maneuver.desc=Mit dieser Kraft kannst du deinen gewählten Gegner im Kampf dank deiner guten Balance und Beinarbeit und deinem guten Auge für seine Körpersprache und kleine verräterische Anzeichen nahezu austanzen. Um diese Kraft einzusetzen, wendest du eine Haupthandlung auf und legst eine Vergleichende Probe auf deine Nahkampffertigkeit + Intuition gegen die Intuition deines gewählten Gegners ab. Nettoerfolge bei dieser Probe können entweder bei deinem nächsten Nahkampfangriff gegen diesen Gegner oder bei deiner nächsten Verteidigungsprobe gegen einen Angriff dieses Gegners als Bonuswürfel eingesetzt werden (diese Bonuswürfel sind kumulativ mit anderen Modifikatoren wie beispielsweise durch die Aktion Blocken). Dieser "Pool" an Manövrieren-Würfeln verfällt, wenn er nicht bis zum Ende der nächsten Kampfrunde eingesetzt wird.
adeptpower.missile_mastery.desc=Mit dieser Kraft werden Alltagsgegenstände in deinen Händen zu tödlichen Waffen, weil du sie entweder mit roher Gewalt oder meisterhafter Präzision (oder beidem) einsetzt. Bei für diesen Zweck hergestellten, nicht explosiven Wurfwaffen werden Schadenswert und Angriffswerte der Waffe um 1 erhöht (Granaten verursachen keinen zusätzlichen Explosionsschaden, nur weil man sie besonders kraftvoll wirft, aber sie können als improvisierte Waffen eingesetzt werden - siehe unten). Mit einer improvisierten Wurfwaffe - einer Münze, einer Gewehrkugel, einer Spielkarte, einem leeren Magazin, einem Essstäbchen, einem Flashpack, was immer dir in den Sinn kommt! - kannst du auf bis zu 100 Meter Entfernung mit einem Schadenswert von 1K oder 1B (nach Maßgabe der Spielleiterin) angreifen. Der Angriffswert auf Sehr Nahe und Nahe Entfernung ist gleich deiner Athletik + Stärke, auf Mittlere Entfernung die Hälfte davon (aufgerundet). Beispielsweise ergeben sich aus Stärke 5 und Athletik 4 Angriffswerte von 9/9/5*/-/- (* max. 100 m).
adeptpower.missile_parry.desc=Mithilfe deiner übernatürlich guten Reflexe und Hand-Auge-Koordination gewährt dir diese Kraft eine zusätzliche Verteidigungsschicht gegen nicht explosive Wurf- und Projektilwaffen (zur Klarstellung: Kugeln zählen aufgrund der Art, wie sie beschleunigt werden, als Explosivwaffen). Wenn du auf diese Weise angegriffen wirst, kannst du die Nebenhandlung Blocken (SR6, S. 43) einsetzen und damit deine Nahkampf-Fertigkeit als Bonuswürfel auf deine Verteidigungsprobe addieren, obwohl du dich nicht im Nahkampf befindest. Wenn deine Nettoerfolge bei der Blockenprobe den Grundschaden des Projektils oder der Wurfwaffe übersteigen, kannst du - wenn du das möchtest - die Waffe fangen, anstatt sie lediglich in der Luft wegzuschlagen.
adeptpower.momentum.desc=Du bist in der Lage, eine ausgesprochen tiefe, fokussierte Konzentration zu erreichen, die nicht augmentierten Mundanen verschlossen bleibt. Die Kraft Durchhaltevermögen hilft dir dabei, weiter auf Erfolgskurs zu bleiben, ganz egal, wie lange du schon an einer Aufgabe arbeitest. Jede Stufe dieser Kraft erlaubt dir, eine Stufe des Würfelpoolmalus von -1 zu ignorieren, der deinen Würfelpool mit der Zeit immer kleiner werden lässt, wenn du eine Ausgedehnte Probe ablegst (SR6, S. 36). Beispielsweise kannst du mit Durchhaltevermögen 2 für das erste, zweite und dritte Intervall einer Ausgedehnten Probe deinen vollen Würfelpool einsetzen und erhältst dann für das vierte einen Würfelpoolmalus von -1, -2 beim fünften usw.
adeptpower.nerve_strke.desc=Du bist nicht nur auf den Fluss deines inneren Manas eingeschwungen, sondern auch in der Lage, diesen Fluss der Lebensenergie bei anderen zu stören, indem du Nervenzentren und andere Fokuspunkte angreifst, an denen sich dieses Mana sammelt. Bevor du eine Nahkampfprobe ablegst, sagst du an, dass du diese Kraft einsetzen möchtest. Anschließend führst du deinen normalen Angriff durch, und auch das Ziel verteidigt sich normal. Anstatt Schaden zu verursachen, nachdem die Angriffs- und Verteidigungsprobe durchgeführt wurden, kannst du die Geschicklichkeit oder Reaktion (deine Wahl) des Ziels pro Nettoerfolg um 1 senken. Wenn das Zielattribut dadurch auf 0 oder weniger sinkt, ist das Ziel gelähmt. Die verlorenen Attributspunkte regenerieren sich mit einer Geschwindigkeit von 1 Punkt pro Stunde, wenn das Ziel sich ausruht. Der Angriff verursacht weder Körperlichen noch Betäubungsschaden, selbst wenn im Normalfall noch Sekundäreffekte auftreten würden (beispielsweise beim Zuschlagen mit einem Betäubungsschlagstock oder bei einem waffenlosen Angriff, der durch die Kraft Elementarer Schlag verstärkt wurde). Diese Kraft kann nicht nur gegen Metamenschen, sondern auch gegen Critter eingesetzt werden. Sie ist jedoch wirkungslos gegen Gegner ohne funktionierendes Nervensystem oder biologische Lebensenergie (Drohnen, Geister und Ähnliche).
adeptpower.nimble_fingers.desc=Du verfügst über eine beeindruckende Geschicklichkeit und Fingerfertigkeit. Die erste Stufe dieser Kraft senkt die Kosten von Edge-Boosts bei Proben wie Heimlichkeit (Fingerfertigkeit) für Taschenspielerei oder Taschendiebstahl, Mechanik (Schlosser) zum Öffnen von Schlössern oder Überreden (Vorführen) für bestimmte subtile Manipulationen um 1. Jede weitere Stufe dieser Kraft gewährt dir einen Würfelpoolbonus von +1 auf derartige Proben und eine zusätzliche Nebenhandlung, die ausschließlich genutzt werden darf, um die Kosten an Haupt-/Nebenhandlungen für die Handlungen Gegenstand aufheben/ablegen, Waffe nachladen, Einfaches Gerät verwenden und andere Handlungen zu begleichen, bei denen es auf schnelle und geschickte Finger ankommt. Beispielsweise würde Geschickte Finger 3 die Haupthandlung (= vier Nebenhandlungen) Waffe nachladen auf zwei Nebenhandlungen verkürzen. Diese Handlungsvergünstigung gilt nicht für die Handlung Waffe bereitmachen - siehe dazu wie Kraft Schnellziehen (S. 96).
adeptpower.pain_relief.desc=Indem du die Nervenknoten, Qi-Punkte und andere Stellen beeinflusst, an denen sich Mana und Lebensenergie im metamenschlichen Körper sammeln, bist du in der Lage, Anspannung, Erschöpfung und Unwohlsein temporär zu lindern. Du legst eine Probe auf Geschicklichkeit + Magie ab, um die entsprechenden Punkte am Körper mit einem schnellen Hagel aus Nervenschlägen präzise zu treffen. Für jeden Erfolg darf das Ziel bei der Berechnung von Schadensmodifikatoren einen Punkt Betäubungsschaden ignorieren. Der Schaden wird dadurch nicht geheilt, aber das Ziel fühlt sich erfrischt und voll neuer Energie und ist dadurch besser in der Lage, trotz seiner Blessuren oder seiner Erschöpfung weiterzumachen. Die Schmerzlinderung verfliegt nach [Magie] Stunden. Alternativ kann das Ziel auch von den Auswirkungen der Kraft Nervenschlag befreit werden, anstatt Schaden zu ignorieren. In diesem Fall macht jeder Erfolg eine gesenkte Stufe durch Nervenschlag rückgängig, bis maximal zur ursprünglichen Attributsstufe des Ziels. Dieser Effekt ist permanent (zumindest, bis das Ziel erneut von einem Nervenschlag getroffen wird).
adeptpower.penetrating_strike.desc=Du bist im Nahkampf übernatürlich präzise, kraftvoll oder auch beides. Für jede Stufe dieser Kraft erhöhst du deinen Angriffswert bei Nahkampfangriffen um +1.
adeptpower.power_throw.desc=Du bist mit Wurfwaffen außergewöhnlich gefährlich. Für jede Stufe dieser Kraft erhöhst du bei Angriffen mit nichtexplosiven Wurfwaffen entweder den Schadenswert um +1 oder die Angriffswerte um +2 (wähle den Bonus beim Erwerb dieser Kraft). Waffen, die keinen Angriffswert haben, können durch diesen Bonus keinen Angriffswert erhalten. Ebenso kann auf diese Weise der normale Schadenswert oder Angriffswert eines Angriffs maximal verdoppelt werden. Das bedeutet, dass die Obergrenze für ein Wurfmesser (2K, 10/9/3/-/-) bei einem Angriffsprofil von (4K, 20/18/6/-/-) liegt, ganz egal, wie viele Stufen dieser Kraft aufgewendet werden. Im Zusammenspiel mit der Kraft Geschossmeisterschaft (S. 93) kann maximal eine Stufe von Wurfkraft eingesetzt werden, sodass die Boni auf Schadenswert +2 und Angriffswerte +1 oder auf Schadenswert +1 und Angriffswerte +3 beschränkt sind.
adeptpower.quick_draw.desc=Diese Kraft erlaubt es dir, die Nebenhandlung Schnellziehen auch für Waffen einzusetzen, die größer als die normalerweise dafür zulässigen Pistolen oder kleinen Wurfwaffen sind. Außerdem kannst du diese Kraft einsetzen, um für Schnellziehen zulässige kleine Waffen schnell zu ziehen, ohne dafür ein spezielles Holster, entsprechende Bodytech oder einen Vorteil zu besitzen.
adeptpower.quick_strike.desc=Es gibt schnell, und es gibt unglaublich schnell. Mit dieser Kraft gehörst du in letztere Kategorie. Beim Bestimmen der Initiative legst du deine Initiativeprobe normal ab, kannst dich dann jedoch entscheiden, in dieser Runde (und nur in dieser) einfach als Erster zu handeln, anstatt deine Handlungen gemäß der Initiativereihenfolge durchzuführen. Dein Initiativewert wird dadurch nicht modifiziert. Du erhältst durch diese Kraft keine zusätzlichen Nebenhandlungen. Wenn zwei Adepten mit dieser Kraft sie gleichzeitig einsetzen, werden die Ergebnisse ihrer Initiativeproben verglichen, um den Gleichstand aufzulösen. In diesem Fall handelt der Adept zuerst, der die meisten Erfolge erzielt hat. Danach handelt der in diesem Vergleich unterlegene Adept, und anschließend läuft die Initiative normal weiter.
adeptpower.side_step.desc=Diese Kraft macht dich zu einem Experten dafür, eingehenden Angriffen mit möglichst präzisen und effizienten Bewegungen um Haaresbreite auszuweichen. Jede Stufe dieser Kraft verleiht dir einen Würfelpoolbonus von +1 für Proben, bei denen du zusätzlichen Aufwand in die Verteidigung investierst, zum Beispiel - aber nicht nur - bei den Nebenhandlungen Blocken, Ausweichen oder Volle Deckung. Grundsätzlich gilt der Bonus bei Verteidigungsproben, die wie die obigen Beispiele durch das Aufwenden zusätzlicher Handlungen verbessert werden, nicht aber bei normalen Verteidigungsproben. Diese Boni sind kumulativ mit den Bonuswürfeln, die durch Blocken und Ausweichen generiert werden, ebenso wie mit Kampfsinn und anderen ähnlichen Modifikatoren.
adeptpower.spell_shroud.desc=Du bist für alle, die dich mithilfe von Magie aufzuspüren versuchen, nur unscharf und undeutlich zu erkennen. Für jede Stufe dieser Kraft erhältst du einen Würfelpoolbonus von +1 auf alle Proben gegen Wahrnehmungszauber.
adeptpower.sustenance.desc=Du bist in der Lage, die normalen Bedürfnisse deines Körpers zu überwinden, sei es durch Disziplin, die Nutzung des Manafeldes des Planeten, die Ernährung von Sonnenlicht, das Essen von Abfällen oder indem du deinen Hunger und deine Erschöpfung mit Meditation verschwinden lässt. Diese Kraft erlaubt es dir, mit einer guten Mahlzeit am Tag und drei Stunden Schlaf so viele Nährstoffe aufzunehmen und Erholung zu finden, wie die meisten Metamenschen durch drei volle Mahlzeiten und gute acht Stunden Schlaf erhalten. Deine Lebensstilkosten sinken um 250 Nuyen pro Monat (weniger essen zu müssen macht für einen Squatter einen himmelweiten Unterschied, allerdings nicht für jemanden, der sich regelmäßig von Kaviar und Wachteleiern ernährt).
adeptpower.three_dimensional_memory.desc=Mit dieser Kraft kannst du dir ein Gebiet detailliert einprägen, wenn du es mit eigenen Augen sehen kannst und ein wenig Zeit (mindestens eine Haupthandlung) zur Verfügung hast. Zu einem späteren Zeitpunkt kannst du eine Probe auf Erinnerungsvermögen (Logik + Intuition) ablegen und dabei eins der beiden Attribute durch dein Magieattribut ersetzen, falls du das möchtest. Der Schwellenwert dieser Probe ist davon abhängig, wie weit in der Vergangenheit die Erinnerung liegt (1 für den gestrigen Tag, 2 für eine Woche, 3 für einen Monat, 4 für ein Jahr oder mehr). Das in der Erinnerung eingeprägte Gebiet ist auf das begrenzt, was du tatsächlich sehen konntest - es ist also eine gute Idee, mehr als eine Haupthandlung zu investieren. Wenn du beispielsweise einen Schrank oder eine Schreibtischschublade nicht geöffnet hast, dann weißt du auch nicht, was dort eventuell versteckt war.

