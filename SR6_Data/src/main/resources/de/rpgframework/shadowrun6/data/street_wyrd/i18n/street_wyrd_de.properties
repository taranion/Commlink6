metaecho.animal_attunement.desc=Voraussetzung: Tierempathie. Du kannst dich mit einem freundlichen, mundanen Critter anfreunden und dabei sein Vertrauen gewinnen, deine Macht mit ihm teilen und auf diese Weise eine mächtige Manaverbindung zwischen euch entstehen lassen. Der Bindungsprozess sollte passend für das betreffende Tier und deinen Adeptenweg rollenspielerisch dargestellt werden. Am Ende dieser Zeit gibst du [15 - Essenz des Tiers] Karma aus. Nachdem die Verbindung aufgebaut wurde, kannst du auf eine Reichweite von [Magie] Kilometern die Welt mit den Sinnen des Tiers sehen und dabei mit einer Nebenhandlung zwischen deiner eigenen Wahrnehmung und der des Tiers wechseln. Du kannst deinem Tiergefährten zudem kurze, lautlose Befehle übermitteln, wenn ihr euch innerhalb dieser Reichweite befindet. Außerdem erhält der Critter auf alle seine Proben einen Würfelpoolbonus in Höhe deines Initiatengrads.
metaecho.astral_projection.desc=Voraussetzung: Astrale Wahrnehmung. Wenn du bereits in der Lage bist, die Astralebene wahrzunehmen, kannst du dich mithilfe dieser Metamagie vollkommen auf sie projizieren (s. Astrale Projektion, SR6, S. 162). Es gelten alle normalen Regeln für astrale Projektion und den Astralkampf, allerdings mit zwei Ausnahmen: Zum einen können alle deine Adeptenkräfte auch auf dein astrales Selbst angewendet werden, zum anderen verlieren Adepten weitaus schneller als Vollzauberer Essenz, wenn sie zu lange im Astralraum verweilen. Du kannst nur für [Magie] Stunden auf der Astralebene bleiben (nicht für [Magie × 2] Stunden) und verlierst nicht für jede darüber hinausgehende Stunde 1 Punkt Essenz, sondern pro Minute.
metaecho.finding_your_way.desc=Wenn du initiierst, kannst du diese Metamagie wählen, um einen Adeptenweg (S. 88) zu erhalten, ohne Karma dafür ausgeben zu müssen. Du kannst auf diese Weise einerseits deinen ersten Weg erhalten, aber diese Art der Introspektive kann auch für einen Paradigmenwechsel stehen und bedeuten, dass du deinen bisherigen Weg verlässt und fortan einen neuen beschreitest (in diesem Fall verlierst du alle Vorteile deines ursprünglichen Wegs und erhältst alle Vorteile des neuen Wegs).
metaecho.infusion.desc=Voraussetzung: Adeptenzentrierung. Diese Metamagie ermöglicht es dir, temporär Mana in deinen Körper zu ziehen und es so zu kanalisieren, dass deine anderen Kräfte verstärkt werden. Dabei handelt es sich jedoch um einen äußerst anstrengenden Prozess. Nachdem du eine Haupthandlung aufgewendet hast, um dich zu fokussieren und zu zentrieren, kannst du in eine deiner bestehenden Adeptenkräfte [Initiatengrad × 0,5] KP temporäre Kraft investieren. Dieser Schub hält für [Magie] Kampfrunden an (oder bis er vorzeitig beendet wird). Nach dem Abklingen der Infusion ist dein Körper durch das Kanalisieren dieser zusätzlichen Energie ausgebrannt, sodass du einem Entzug in Höhe deines Magieattributs widerstehen musst.
metaecho.item_attunement.desc=Du bist in der Lage, eine mächtige Bindung zwischen dir selbst und deinem Lieblingsfahrzeug, deiner Lieblingswaffe oder einem anderen Ausrüstungsteil herzustellen. Die Fäden der Macht, die zwischen dir und dem Gegenstand gewebt werden, verwandeln den Gegenstand in eine Erweiterung deines Körpers und lassen beim Einsatz der betreffenden Ausrüstung das Unglaubliche wahr werden. Das Aufbauen der Bindung zu dem Gegenstand (oder seine Herstellung) sollte rollenspielerisch passend zu deinem Charakter, dem Gegenstand und deinem Adeptenweg dargestellt werden (es kommen die normalen Regeln zum Herstellen von Foki oder andere Fertigkeiten zum Bauen/Reparieren zum Einsatz). Am Ende des Herstellungs- oder Bindungsprozesses investierst du einen Teil deiner Fähigkeiten in den gewählten Gegenstand und gibst Karma gemäß der Tabelle Einstimmung (Gegenstand) aus. Wenn du mit einem Gegenstand, auf den du eingestimmt bist, eine mundane Probe ablegst - also keine Probe auf Astral, Beschwören, Hexerei oder Verzaubern -, erhältst du einen Würfelpoolbonus in Höhe deines Initiatengrads.
metaecho.virtuoso.desc=Künstlerisch ausgerichtete Adepten mit dieser Metamagie haben die Summe all ihrer Kreativität in eine einzelne, leuchtende Schöpfung oder Komposition geleitet, die damit zu einem Zeugnis ihrer Macht, ihrer Hingabe zu ihrem Weg und ihrer praktizierten Fähigkeiten in ihrem gewählten künstlerischen Medium wird. Bei der Schöpfung eines Virtuosen kann es sich um physische Kunstwerke, aber auch um Performance-Kunst handeln. Um ein solches Werk zu erschaffen, musst du nicht dem Weg des Künstlers folgen - ein Krieger oder Athlet könnte eine Lieblings-Kata oder einen besonderen Klingentanz haben, ein Handwerker könnte ein technologisch fortschrittliches Meisterstück herstellen, ein Adept auf dem Weg des Zauberers könnte einige besonders beeindruckende Illusionszauber entwickeln usw. Diese Meisterstücke sind gleichermaßen von Macht und Talent erfüllt und schlagen alle, die sie sehen oder erleben, in ihren Bann und nehmen ihre Aufmerksamkeit gefangen. Die Emotionen, die in die Erschaffung des Kunstwerks eingeflossen sind, hallen noch nach und färben den Astralraum in seiner Nähe auf eine Weise, die vorteilhaft für den talentierten Schöpfer dieses Wunders ist.
metaecho.cleansing.desc=Diese Metamagie kann auf zwei verschiedene Arten eingesetzt werden, die separat erfolgen müssen: Du kannst mit Reinigung erstens einen Gegenstand oder ein Gebiet von astralen Rückständen reinigen. Dafür legst du mit einer Haupthandlung eine Probe auf Astral + Magie + Initiatengrad gegen einen Schwellenwert ab, der anhand der Tabelle Reinigung nach Häufigkeit und letztem Vorkommen des verursachenden Ereignisses bestimmt wird. Gelingt die Probe, werden die astralen Rückstände permanent entfernt. Diese Anwendung von Reinigung verursacht keinen Entzug.Zweitens kannst du mit Reinigung die Auswirkungen von Manablasen zeitweise unterdrücken. In einer Manablase (S. 185) legst du eine Probe auf Astral + Magie + Initiatengrad gegen einen Schwellenwert ab, der in der Tabelle Reinigung zu finden ist. Pro 2 Nettoerfolgen bei dieser Probe sinkt die Wirkung der Manablase um 1 Stufe, bis zu einem Minimum von keiner Wirkung. Dann musst du einem Entzug gleich dem Schwellenwert der Probe widerstehen. Die Reinigung hält für [Initiatengrad] Kampfrunden an. Während dieser Zeit wird beim Einsatz von Magie (also wenn Magie Teil des Würfelpools ist) einer der Würfel zu einem Schicksalswürfel (das gilt auch für weitere Reinigungsproben, um die Reinigung zu verlängern, solange die aktuelle Reinigung noch wirkt).
metaecho.divination.desc=Zauberer, die diese metamagische Technik lernen, haben einen sechsten Sinn für Gefahren und wissen instinktiv, wann diese drohen und wann sie sich darauf vorbereiten müssen. Diese Initiaten erhalten 1 Edge für Überraschungsproben. Sie haben auch Zugang zu Ritualen der Weissagung wie Prophezeiung und Wahrzauber (s. Kasten). Zusätzliche Rituale werden in zukünftigen Büchern vorgestellt werden. Um Weissagung außerhalb eines Rituals zu nutzen, muss der Zauberer ein Ziel (einen Ort, einen Gegenstand oder ein Lebewesen) einige Minuten lang astral studieren und sich den Energien rund um dieses Ziel öffnen. Dann legt er eine Probe auf Astral + Magie + Initiatengrad (10 - [Anzahl der Minuten der Untersuchung des Ziels]; mindestens 3) ab. Wenn der Zauberer dabei Nettoerfolge erzielt, erhält er eine Vision eines zukünftigen Ereignisses, das mit dem Ziel zu tun hat. Je mehr Nettoerfolge der Charakter erzielt, desto detaillierter ist die Vision. Er muss außerdem einem Entzug in Höhe der erzielten Erfolge (nicht Nettoerfolge) widerstehen. Einige Zauberer, die diese Methode verwenden, setzen dabei einen Fetisch, oft in Form einer Kristallkugel, ein, um sich den Energien besser öffnen zu können. Solche Fetische senken den Entzug der Weissagung vor der Entzugswiderstandsprobe um 2. Misslingt die Probe, erhält der Zauberer keine Visionen, muss aber trotzdem dem Entzug widerstehen. Bei einem Patzer ist die Vision irreführend, bei einem kritischen Patzer wird der Entzug verdoppelt (verwendet der Zauberer einen Fetisch, wird der Entzug erst durch den Fetisch gesenkt und dann verdoppelt). Die Spielleiterin kann dem Zauberer erlauben, eine Probe auf Astral + Logik abzulegen, um die Visionen zu entschlüsseln, die aus einer Weissagung entstehen. Der Schwellenwert muss zum Ziel und zu der Geschichte passen, die es umgibt. Beispiele dafür finden sich in der Tabelle Weissagung.
metaecho.durable_astral_form.desc=Diese Metamagie erlaubt einem Initiaten, bei Schadenswiderstandsproben im Astralkampf die abgerundete Hälfte seines Initiatengrads (mindestens 1) zu seinem Würfelpool zu addieren.
metaecho.extended_masking.desc=Voraussetzung: Maskierung. Der Zauberer kann eine Anzahl von Zaubern und/oder Erzeugnissen bis zur Höhe seines Initiatengrads (zusätzlich zu gebundenen Foki durch die Metamagie Maskierung) maskieren. Der Entzugswert bzw. die Wirksamkeit jeder auf diese Weise maskierter Aura muss kleiner sein als das Magieattribut des Zauberers . Gemäß den Regeln für Maskierung (SR6, S. 170) ist eine Vergleichende Probe auf Astral + Intuition gegen Magie + Initiatengrad des Zauberers erforderlich, um solche Gegenstände zu sehen. Wenn der Beobachter keine Nettoerfolge erzielt, erscheinen ihm maskierte Auren als gewöhnliche Fluktuationen entweder im lokalen Umgebungsmana oder der Aura des maskierenden Zauberers. Erzielt der Beobachter Nettoerfolge, sieht er alle entsprechenden Auren. Je nach Anzahl der Nettoerfolge erkennt er gemäß der Tabelle Askennen (SR6, S. 161) weitere Details zu den Auren der Zauber/Erzeugnisse.
metaecho.improved_astral_form.desc=Diese Technik lässt einen Charakter die Zeitdauer, die er sicher projizieren kann, um seinen Initiatengrad in Stunden verlängern. Wenn sie benutzt wird, bedeutet der tiefere Schlummer, dass es eine Minute dauert, bis der Körper des Zauberers nach seiner Rückkehr erwacht; in dieser Zeit gilt er als bewusstlos.
metaecho.paradigm_shift.desc=Ein Paradigmenwechsel erlaubt dem Charakter, seine alte Tradition abzulegen und eine neue auszuwählen. Wenn diese ausgewählt wurde, definiert sie seinen Einsatz der Magie, und der Zauberer verliert jeden Zugang zu seiner alten Tradition. Diese Metamagie kann mehrmals gewählt werden, wobei jedes Mal die Tradition gewechselt wird. Paradigmenwechsel werden oft vom Wechsel eines Schutzgeistes oder der Annahme eines Schutzgeistes begleitet, aber das ist nicht unbedingt erforderlich. Die Darstellung des Wechsels im Rollenspiel ist oft der perfekte Zeitpunkt, um die Beziehung des Zauberers zu Schutzgeistern zu behandeln, was aber auch zu anderer Zeit stattfinden kann. Die einzige Ausnahme bildet die Tradition der Insektenschamanen, weil die Initiaten dabei einen passenden Insektengeist als Schutzgeist annehmen müssen (der oft diese Metamagie lehrt und dem Charakter den dafür nötigen Initiatengrad als Belohnung für seinen Wechsel verleiht). In allen Fällen ist dieser Wechsel permanent. Toxische Magier haben ihr Paradigma oft zu einer toxischen Version ihrer Tradition gewandelt, aber das ist keine unabänderliche Regel.
metaecho.psychometry.desc=Um einen Eindruck zu "lesen", legt der Zauberer eine Probe auf Astral + Intuition + Initiatengrad ab. Die Modifikatoren und Ergebnisse dafür finden sich in der Tabelle Psychometrie. Während er einen Eindruck liest, erhält der Zauberer einen Würfelpoolmalus von -4 auf alle anderen Handlungen. Leider hat er keine Kontrolle darüber, wie lange dieses Lesen dauert, und kann es auch nicht unterbrechen, bis es abgeschlossen ist. Das Interpretieren der Eindrücke dauert normalerweise 1W6 Minuten, aber der Spielleiter kann die Dauer je nach der psychometrischen Erfahrung anpassen.
metaecho.sensing.desc=Der Zauberer kann die Handlung Genau beobachten (SR6, S. 45) durchführen und eine Probe auf Wahrnehmung + Intuition (4) ablegen. Gelingt die Probe, kann er Manaflüsse, Manablasen und Manahohlräume (Schlagschatten, S. 152) innerhalb von [Initiatengrad] Kilometern Entfernung spüren, ohne seine Wahrnehmung auf die Astralebene verlagern zu müssen. Wenn ein Manafluss oder eine Manablase auf die Tradition des Zauberers ausgerichtet ist, erhält er für diese Probe einen Würfelpoolbonus von +2. Adepten ohne die Kraft Astrale Wahrnehmung können diese Technik lernen. Sensibilisierung kann nicht verwendet werden, um astrale Gestalten, Zauber, Manabarrieren, Geister oder Foki zu spüren. Der Spielleiter kann dem Charakter auch die Chance geben, eine ungewöhnliche Änderung in der Nähe zu fühlen, wenn er die Sensibilisierung nicht aktiv einsetzt. In diesem Fall sollte der Spielleiter die Probe für den Spieler verdeckt ablegen, um nicht zu viel zu verraten.
metaecho.channeling.desc=Kanalisierung kann von Zauberern aller Traditionen verwendet werden, die die Fertigkeit Beschwören besitzen, um einen Geist in sich selbst hineinzuziehen. Das stärkt die körperliche Gestalt des Zauberers und gestattet ihm Zugriff auf die Kräfte des Geistes, hat aber seinen Preis. Während der Kanalisierung vereinen sich Zauberer und Geist zu einem einzigen Dualwesen, wobei der Zauberer die Kontrolle behält. Um einen Geist zu kanalisieren, legt der Zauberer eine Probe auf Beschwören + Magie gegen Kraftstufe × 2 des Geistes ab, um den Geist wie üblich herbeizurufen (und widersteht dann dem Entzug). Dann legt er als Teil derselben Haupthandlung eine Probe auf Beschwören + Magie + Initiatengrad gegen Kraftstufe × 2 des Geistes ab. Die Nettoerfolge dieser zweiten Probe erhöhen die Dienste, die der Geist dem Zauberer schuldet, und die Erfolge (nicht Nettoerfolge) des Geistes werden zum Entzug, dem der Zauberer widerstehen muss, wenn die Kanalisierung endet oder der Geist aus anderen Gründen den Körper des Zauberers verlässt. Misslingt diese zweite Probe, erhält der Zauberer keine zusätzlichen Dienste, muss aber trotzdem dem festgelegten Entzug widerstehen. Während der Kanalisierung erhält der Zauberer die Critterkraft Dualwesen (SR6, S. 222) und zusätzlich alle Kräfte des Geistes mit einer Dauer von Immer. Der Zauberer kann auch andere Kräfte des Geistes (außer Materialisierung und Verschlingen) einsetzen, aber das kostet jedes Mal einen Dienst. Außerdem werden alle körperlichen Attribute des Zauberers, die niedriger als die Kraftstufe des Geistes sind, um die halbe Kraftstufe (abgerundet) erhöht (es gilt die übliche maximale Erhöhung von +4, s. SR6, S. 39). Der Charakter ignoriert außerdem Verletzungsmodifikatoren bis zur Höhe der Kraftstufe des Geistes. Aber täuscht euch nicht: Ihr seid nicht unverwundbar. Bisher klingt das alles ziemlich cool, oder? Tja, es gibt ein paar Nachteile. Erstens ist der Geist mit dir zusammen in deinem Körper und wird nur von deiner Magie unterdrückt, daher kann er Schaden erleiden. Weil dein Körper als ein lebendes Geistergefäß dient, erleidest du und nur du alleine Schaden aus körperlichen Quellen, aber Schaden durch Mana-Kampfzauber und Astralkampf trifft dich und den Geist gleichermaßen. Und du spürst zwar vielleicht die süße Umarmung des Schmerzes durch den Schaden nicht, aber wenn du bewusstlos wirst oder der Geist verdrängt wird, endet die Kanalisierung, und du musst sofort dem Entzug der zweiten Beschwören-Probe zur Kanalisierung des Geistes widerstehen. Der Geist kehrt unter einer der folgenden Bedingungen auf seine Heimatebene zurück: nach einem Sonnenaufgang und Sonnenuntergang (oder umgekehrt) wie für herbeigerufene Geister üblich, wenn der Zauberer einschläft oder bewusstlos wird, wenn der Zauberer astral projiziert, wenn der Geist durch Exorzismus aus dem Körper vertrieben wird oder wenn der Zauberer den Geist entlässt. Wenn ein anderer Magieanwender den kanalisierenden Zauberer askennt und dabei 3 oder mehr Nettoerfolge erzielt, kann er sehen, wo in der gemeinsamen Aura der Geist beginnt und der Wirt endet. Das ermöglicht es ihm, den Geist zu verbannen. Dabei wird der Initiatengrad des kanalisierenden Zauberers zum Würfelpool des Geistes addiert, um dem Verbannen zu widerstehen, weil der Körper des Zauberers versucht, den Geist festzuhalten.
metaecho.exorcism.desc=Exorzismus erfordert den physischen Kontakt mit dem Gefäß und ist eine Initiative-Haupthandlung. Der Exorzist legt eine Vergleichende Probe auf Willenskraft + Charisma + Initiatengrad gegen Kraftstufe × 2 des Geistes ab, um den Geist aus seinem Gefäß zu zwingen (wird der Geist aus einem kanalisierenden Zauberer gezwungen, erhält er nicht den Initiatengrad des Zauberers als Würfelpoolbonus). Wenn der Exorzist die Fertigkeit Beschwören hat, kann er seine Willenskraft als Bonus zu folgenden Versuchen addieren, den Geist zu verbannen. Der Exorzist muss bei jedem Versuch einem Entzug gleich der doppelten Anzahl der Erfolge (nicht Nettoerfolge) des Geistes widerstehen. Zauberer widerstehen dem Entzug gemäß ihrer Tradition, Adepten mit Konstitution + Willenskraft.Um einen Geist aus seinem Gefäß zu zwingen, benötigt man eine kumulierte Anzahl an Nettoerfolgen gleich der Kraftstufe des Geistes. Der Geist hält sich danach im Astralraum auf. Nettoerfolge jedes Exorzismus-Versuchs bleiben bis zum nächsten Sonnenaufgang oder Sonnenuntergang (dem späteren der beiden Zeitpunkte) bestehen, sodass der Exorzist den Geist nicht mit einem einzigen Versuch austreiben muss.
metaecho.great_form_channeling.desc=Voraussetzung: Anrufung, Kanalisierung. Die Kanalisierung eines Geistes in Großer Gestalt funktioniert genauso wie die eines anderen Geistes, mit zwei wichtigen Unterschieden. Erstens muss dieser Geist wie immer angerufen werden, was zwischen dem Herbeirufen und der Kanalisierung geschieht. Das heißt, dass man zweimal dem Entzug widerstehen muss, bevor die Kanalisierung passiert. Zweitens erhält der Zauberer nicht die Dienste des Geistes aus Herbeirufung, Anrufung und Kanalisierung, sondern nur aus Herbeirufung und Anrufung. Drittens, und das ist einer der wichtigsten Anziehungspunkte dieser Technik, erhält man die Kraft Immunität gegen Normale Waffen. Immunität gegen Normale Waffen: Der Zauberer erhält die Kraft Immunität gegen Normale Waffen (SR6, S. 224), als würde seine Essenz das abgerundete Drittel der Kraftstufe des Geistes (mindestens aber 1) betragen - unabhängig von seiner tatsächlichen Essenz.
metaecho.invocation.desc=Das Herbeirufen eines Geistes in Großer Gestalt (S. 64) ähnelt einem gewöhnlichen Herbeirufen, nur muss der Zauberer als Teil derselben Haupthandlung den Geist anrufen, indem er eine Vergleichende Probe auf Beschwören + Magie + Initiatengrad gegen Kraftstufe × 2 des Geistes ablegt. Dabei muss einer der Würfel, die durch den Initiatengrad zum Würfelpool addiert werden, ein Schicksalswürfel sein. Wenn der Zauberer Nettoerfolge erzielt, werden diese zu den Nettoerfolgen der Probe zum Herbeirufen addiert, um die Anzahl der Dienste zu bestimmen, die der Geist in Großer Gestalt schuldet. Werden bei der Anrufungsprobe 4 oder mehr Nettoerfolge erzielt, erhält der Geist verbesserte Fähigkeiten (s. Tabelle Anrufung von Geistern in Großer Gestalt, S. 64). Wenn der Zauberer keine Nettoerfolge erzielt, läuft der Geist Amok und greift für eine Anzahl von Kampfrunden gleich der Anzahl seiner Nettoerfolge jeden und alles in einem Umkreis von [Kraftstufe × 10] Metern an. In jedem Fall muss der Zauberer einem Entzug in Höhe der Anzahl der Erfolge (nicht Nettoerfolge) des Geistes widerstehen. Wenn der Schaden durch den Entzug so hoch ist, dass der Zauberer bewusstlos wird oder stirbt, läuft der Geist für zusätzliche 1W6 Kampfrunden Amok.
metaecho.master_summoner.desc=Ein Initiat mit dieser Metamagie kann mehr Geister kontrollieren als Otto Normalbeschwörer. Ein Meisterbeschwörer kann gleichzeitig Geister mit einer summierten Kraftstufe von maximal (Magie + Initiatengrad) × 4 in seinen Diensten haben.
metaecho.absorption.desc=Voraussetzung: Abschirmung. Wenn ein Zauber jemanden zum Ziel hat, den der Initiat mit Zauberabwehr beschützt, kann der Initiat jederzeit eine Nebenhandlung verwenden, um zu versuchen, das Mana aus dem Zauber zu absorbieren. Lege eine Probe auf Hexerei + Magie + Initiatengrad ab. Jeder Erfolg bei dieser Probe hebt einen Erfolg der gegnerischen Hexereiprobe auf, indem er ein wenig Mana abzieht und eine "Manaladung" in der Aura des Initiaten erzeugt. Wenn der Initiat die Nettoerfolge des Gegners auf oder unter 0 senkt, misslingt dessen Zauber. Manaladungen sind ziemlich flüchtig, also müssen sie schnell verbraucht werden, weil sie sonst die physische Gestalt der Aura des Initiaten schädigen: seinen Körper. Die Ladungen einer bestimmten Absorptionsprobe bleiben für [Initiatengrad] Kampfrunden bestehen; dann erreichen sie einen kritischen Zustand. Wenn das geschieht, verursachen sie einen Entzug in Höhe der Anzahl der Ladungen aus dieser Absorptionsprobe, die in der Aura des Initiaten gespeichert sind. Eine Warnung: Diese Technik kann auch verwendet werden, wenn man astral projiziert, aber wegen des Mangels an physischer Stabilität durch einen Körper beträgt der Entzug das Doppelte der Anzahl der Manaladungen. Manaladungen sind aber auch sinnvoll, weil sie dem Initiaten beim Wirken seiner eigenen Magie helfen können. Der Entzug der nächsten Handlung des Initiaten, die Entzug verursacht (egal ob Hexerei, Beschwören oder andere Magie), wird um die Anzahl der Manaladungen gesenkt. Alle Ladungen werden automatisch für den nächsten Entzug verbraucht, der vor der Widerstandsprobe um 1 pro Ladung (maximal aber auf 2) gesenkt wird. Absorption und Spiegelung können von einem einzelnen Charakter nicht gegen denselben Zauber eingesetzt werden.
metaecho.reflection.desc=Voraussetzung: Abschirmung. Wenn jemand oder etwas unter dem Schutz der Zauberabwehr des Initiaten zum Ziel eines Zaubers wird, kann der Initiat mit einer Nebenhandlung jederzeit eine Vergleichende Probe auf Hexerei + Magie + Initiatengrad gegen die ursprüngliche Probe des Zaubernden auf Hexerei + Magie ablegen. Die Nettoerfolge des Initiaten zählen als Erfolge einer Hexerei-Probe, mit der dieser Zauber auf den Gegner zurückgeworfen wird; das ursprüngliche Ziel muss dem Zauber nicht widerstehen. Der Initiat muss dem Entzug des gewirkten Zaubers (inklusive Modifikatoren durch Anpassungen) +1 widerstehen. Wenn der Zauber eine Flächenwirkung hat, müssen nur Ziele, die von der Zauberabwehr des Initiaten geschützt waren, dem Zauber nicht widerstehen, wenn die Spiegelung erfolgreich war. Alle anderen Ziele im Bereich müssen wie üblich widerstehen. Davon ausgenommen sind indirekte Kampfzauber mit Flächenwirkung, die als Ganzes reflektiert werden, wenn die Spiegelung erfolgreich ist. Gespiegelte Zauber können wieder zurück gespiegelt werden, wobei der Entzug jedes Mal um +1 steigt. Das kann zu einem "Zauber-Pingpong" führen, bis einer der Kontrahenten keine Nebenhandlungen mehr zur Verfügung hat oder vom Entzug ausgeschaltet wird.
metaecho.severing.desc=Voraussetzung: Abschirmung. Diese Technik gibt einem Initiaten die Chance, eine "Sendung" zu bemerken. Das ist der Aufbau einer mystischen Verbindung zum Ziel eines Zaubers, der in Schritt 5: Ritual durchführen (SR6, S. 146) stattfindet. Und wenn man die Sendung erkannt hat, kann man Schritte zur eigenen Verteidigung unternehmen.Diese Technik lässt einen Initiaten eine Sendung erkennen, die auf ihn oder auf ein Ziel innerhalb von [Initiatengrad] Metern gerichtet ist, egal ob ein Späher oder eine materielle Verbindung verwendet wird. Um das zu erreichen, legt der Charakter eine Probe auf Astral + Intuition + Initiatengrad (4 + nötige Anzahl an Stunden zur Vollendung des Rituals - Anzahl der Stunden, die das Ritual bereits durchgeführt wurde) ab. Wenn der Initiat während der Sendung schläft, erhält er auf diese Probe einen Würfelpoolmalus von -6. Die Probe findet automatisch einmal pro Stunde des Rituals statt, und der Spielleiter kann sie je nach Wunsch verdeckt ablegen. Wenn ein Zauberer eine Sendung bemerkt hat, hat er mehrere Möglichkeiten: Er kann die Sendung askennen (er braucht 2 Erfolge, um die Art des Zaubers und die astrale Signatur des Ritualleiters zu erkennen), er kann Zauberabwehr oder andere Abwehrmagie verwenden, um mit dem Zauber fertigzuwerden, oder er kann astrales Spurenlesen (SR6, S. 163) einsetzen, um die Sendung zum Ritualplatz zurückzuverfolgen. Wenn der Zauberer einen Geist einsetzen will, muss der Geist die Sendung nicht erkennen. Wenn er einen anderen Zauberer bittet, die Sendung zu verfolgen, muss dieser das Ziel der Sendung mit 3 Erfolgen askennen, um sie zu sehen.
metaecho.resilient_artificing.desc=Mit dieser Metamagie kann sich ein Initiat besser vor solchen Gegenreaktionen des Manas schützen. Nicht perfekt, aber es hilft. Bei einem kritischen Patzer in Schritt 5: Den Fokus herstellen (SR6, S. 155) wird der Essenzverlust um Initiatengrad × 0,1 (bis auf ein Minimum von 0) verringert.
metaecho.advanced_rites.desc=Wenn der Ritualleiter diese Metamagie beherrscht, erhält kein Mitglied des Teams einen Malus, wenn es einer anderen Tradition angehört. Wenn der Initiat nicht der Ritualleiter ist, profitiert nur er von dieser Technik.
metaecho.efficient_ritual.desc=Wenn der Ritualleiter diese Metamagie kennt, sinkt die Zeit zur Vollendung eines Rituals um die Hälfte.
metaecho.sympathetic_linking.desc=Ein Initiat, der die Metamagie Sympathetische Verbindung kennt, kann sie einsetzen, um Rituale mit dem Merkmal Materielle Verbindung durchzuführen. Der Schwellenwert steigt um 2, wenn eine sympathetische Verbindung benutzt wird.
metaecho.sacrifice.desc=Diese metamagische Technik lässt einen Initiaten den Pfad des Blutes beschreiten (üblicherweise als Blutmagie bezeichnet) und kann von Vollzauberern, Aspektzauberern, und (Magier-)Adepten erlernt werden. Im Kern gestattet die Technik einem Magieanwender, die Macht des Blutes anzuzapfen, indem er einem lebenden Opfer körperliche Wunden zufügt, um Blutmagiepunkte (BMP) zu erzeugen, die dann die Magieanwendung verbessern und verstärken können. Das Wann, Wer, Wie und Warum bestimmen, welche Variante der Blutmagie eingesetzt wird, und die Art der Magie, die der Nutzer einsetzt, bestimmt, was er erreichen kann. Opferung kann nur von einem anderen Initiaten oder von einen Geist gelernt werden, der sie kennt; es gibt keine Möglichkeit zum Selbststudium. Blutmagie hat zwei "Geschmacksrichtungen": Lebensmagie und Todesmagie. Welche benutzt wird, bestimmt, wie Blutmagiepunkte erworben werden, welches Resultat ihr Einsatz erzielt, und ob der Initiat Gefahr läuft, der Verdammnis anheimzufallen.

