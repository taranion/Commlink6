tradition.egyptian.desc=Unser Wissen über die antike ägyptische Religion hat sich seit der Zeit vor dem Erwachen vermutlich nicht besonders stark weiterentwickelt, aber eins ist sicher: Die Ankunft der Metamenschen und der Magie hat den alten Geschichten über all diese antiken Religionen definitiv eine gewisse Glaubwürdigkeit verliehen. Schamanen, die eine Verbindung zu einem der Götter des Alten Ägypten spüren, müssen dazu nicht zwingend eine kulturelle Verbindung zu ihnen haben - das gilt für viele der aus Religionen abgeleiteten Traditionen auf dieser Liste -, sondern sich vor allem der Aufgabe verschreiben, zu verstehen, was wir über die Sitten und den Glauben Ägyptens wissen - und darüber, wie es in Wechselwirkung mit der metamenschlichen Seele steht. Das ist nicht überraschend, da die Seele im ägyptischen Glauben eine zentrale Rolle einnimmt. Ein Zauberer könnte eine Verbindung zu einem Gott spüren, der einen Aspekt des Daseins repräsentiert, zu dem sich besagter Zauberer besonders stark hingezogen fühlt. Angesichts der Tatsache, dass das Pantheon des Alten Ägypten eine Vielzahl von Göttern umfasst, gibt es für so gut wie alles die passende Gottheit. Tod, Leben, sogar Nilpferde, verdammt noch mal. Könnt ihr euch das vorstellen? Ein Nilpferdschamane? Ich würde gutes Geld bezahlen, um das zu sehen. Aber wir schweifen vom Thema ab. Anhänger dieser Tradition messen ihren Taten in diesem Leben große Bedeutung bei, da sie glauben, dass auf jene, die mit einem schweren Herzen in das Leben nach dem Tod gehen, großes Leid wartet.
tradition.roman_greek.desc=Die römischen und die griechischen Traditionen weisen zahlreiche Ähnlichkeiten auf, da sich die alten Römer ziemlich viele ihrer Götter von den Griechen vor ihnen abgeschaut haben. Natürlich wären die Vertreter besagter Traditionen eventuell empört, in einen Topf geworfen zu werden, aber Leute, ernsthaft. Stellt euch nicht so an. Wie bei allen polytheistischen Traditionen hängt die Disposition eines einzelnen Schamanen immer stark davon ab, zu welcher Gottheit er sich am meisten hingezogen fühlt. Ein Zauberer, der sich Mars verschrieben hat, wird um einiges reizbarer sein als einer, der beispielsweise Bacchus folgt. Wobei es unwahrscheinlich ist, dass ihr auf irgendeinem Run mal einen Bacchus-Schamanen treffen werdet. Die sind viel zu sehr damit beschäftigt, Spaß zu haben. Ihre Magie wirken sie vielleicht auf Latein oder Griechisch - je nachdem, auf welcher Seite der Trennlinie sie stehen. Ebenfalls nicht ungewöhnlich ist der Einsatz von Ritualen, die religiösen Rekonstruktionen aus der Zeit vor dem Erwachen entnommen sind. Die meisten der ursprünglichen Riten gerieten in Vergessenheit, als monotheistische Religionen die Region übernahmen. Was wirklich eine Schande ist, weil dabei zweifellos Unmengen an faszinierenden Informationen verloren gegangen sind. Diese Traditionen sind zudem von einer ordentlichen Mischung aus griechischer Philosophie durchzogen, die oftmals als leitender moralischer Kodex für die Kunst dieser Schamanen dient. Da dieser Teil der Welt gemeinhin als Wiege der Philosophie - zumindest der westlichen Philosophie - angesehen wird, ergibt das durchaus Sinn.
tradition.norse.desc=Okay, vielleicht denkt ihr, dass alle Anhänger einer nordischen Tradition Möchtegern-Wikinger sind, die durch die Gegend rennen und irgendwelchen Kram über Ehre und das Plündern der örtlichen Taverne oder dergleichen grölen. Die gibt es natürlich auch, und sie sind für alle Beteiligten definitiv eine peinliche Angelegenheit. Echte Anhänger der Traditionen, die sich aus dem nordischen Glauben ableiten, sind deutlich nuancierter. Odin selbst wird oft als Sinnbild des Magiers schlechthin angesehen, da er ein Auge opferte, um Wissen und die Fähigkeit zu erlangen, das zu sehen, was zwischen den Welten liegt. Viele Zauberer, die dieser Tradition folgen, versuchen, einen Pfad der Weisheit zu beschreiten. Sie wollen diejenigen um sich herum leiten und ihre Kameraden beschützen - obwohl zugegebenermaßen auch dann und wann ein Schamane auftaucht, der sich den eher zwielichtigen Elementen des nordischen Pantheons verschrieben hat. Ob ihr's glaubt oder nicht, Loki ist hierbei meist vor allem nervig. Wirklich auf der Hut müsst ihr vor Fenrir oder Jormungandr sein. Angesichts der Geschichten darüber, wie die Weltenschlange am Ende der Welt Gift in den Himmel spucken wird, steht die Frage im Raum, ob die Anhänger der Weltenschlange bereits in die Kategorie "toxischer Schamane" fallen. Sie klingen zumindest, als wäre das eine treffende Beschreibung.
tradition.islamic.desc=Islamische Theurgen sind als exzellente Magietheoretiker bekannt, da ihnen in den madrasas (Magieschulen) eine sehr gründliche und analytische Herangehensweise an die Magie beigebracht wird. Je nachdem, wie progressiv sie eingestellt sind, verhalten sich theurgische Gelehrte mehr oder weniger zögerlich, wenn es darum geht, ihre Erkenntnisse mit dem Rest der Welt zu teilen (oder gar mit weiblichen Schülern). Noch zögerlicher sind sie, was die Beschwörung von Dschinnen betrifft. Diese gerissenen und hinterlistigen Geister gelten als Wesen, die ihre eigene undurchsichtige Agenda verfolgen, und passen daher nicht recht in das moralische Weltbild der Theurgen - ganz im Gegensatz zu den Ifriit (Dämonen), die als das pure Böse angesehen und nur von den verdorbensten Zauberern beschworen werden. Ein blinder Fleck im missbilligenden Auge der Religion ist die Kunst der Alchemie. Die Auswirkungen alchemistischer Magie werden in der Regel den intrinsischen Eigenschaften der verwendeten Materialien zugeschrieben - weniger dem Alchemisten selbst. Daher genießt die Alchemie in muslimischen Gesellschaften eine höhere Akzeptanz als andere Spielarten der Magie.
tradition.qabbalists.desc=Für die Kabbalisten hingegen war gesellschaftliche Akzeptanz nie ein Problem: Als Mystiker des Judentums genießen sie sowohl in Israel als auch in den jüdischen Gemeinden weltweit großes Ansehen. Dies liegt jedoch nicht in ihren magischen Kräften begründet (denen man teils sogar missbilligend begegnet), sondern vielmehr an ihrem Status als Gelehrte und ihrer (damit verbundenen) Frömmigkeit. Die Kabbalisten werden oftmals als die Gelehrteste unter allen magischen Traditionen angesehen. Ihr Lehrplan umfasst nicht nur die Miqra (die hebräische Bibel, auch Tanach genannt), sondern auch Kabbala-Schriften wie das Sefer Jetzira ("Buch der Schöpfung"), den Zohar ("Glanz"), das Sefer ha-Bahir ("Buch des hellen Glanzes") und das Sefer ha-Razim ("Buch der Geheimnisse"). Ein weitverbreitetes Credo der abrahamitischen Religionen besagt, dass man nur das wirklich verdient hat, was man sich hart erarbeitet hat - und es ist in der Tat harte Arbeit, das in den Schriften enthaltene Wissen zu entziffern und zu verstehen, denn sie sind notorisch dem Verstand entrückt, so komplex, dass sie unser Verständnis sprengen, und, um das alles noch schlimmer zu machen, verfasst in einer Variation antiker semitischer Dialekte (die man zuerst meistern musst, denn es heißt, dass die Schriften all ihre Geheimnisse erst dann preisgeben, wenn man sie in der Originalsprache liest). Da die Schriften der Kabbala jedoch angeblich von den Engeln an die Menschen weitergegeben wurden, wird das in ihnen enthaltene Wissen als göttliche Offenbarung angesehen. Somit erweitert es nicht nur das Verständnis der Kabbalisten von den magischen Künsten, sondern führt sie auch näher zu Gott. In den letzten Jahrzehnten haben sich weltlichere Schulen des Kabbalismus entwickelt, deren Verständnis der Magie effektiv einem hermetischen Ansatz folgt. Allerdings bestand zwischen der Hermetik und dem Kabbalismus schon immer eine intellektuelle Intimität, was kaum überrascht - schließlich bilden die Schriften der Kabbala einen beträchtlichen Teil der antiken hermetischen Weisheit. Im Zuge der abrahamitischen Vorbehalte, was das Beschwören von Geistern angeht, erlauben es sich die meisten kabbalistischen Schulen nicht, die elohim, wie Geister genannt werden, dazu zu zwingen, sich in der physischen Welt zu materialisieren. Das macht den Kabbalismus effektiv zu einer Besessenheitstradition. Stattdessen stellten die Kabbalisten den Geistern vorbereitete Geistergefäße zur Verfügung, unter denen die Golems ("die Unfertigen") - vage menschenähnliche Tonstatuen - am bekanntesten sind. Den wenigen (und mit Missbilligung betrachteten) Kabbalisten, die tatsächlich die Beschwörungstechniken meistern, die eine physische Manifestation erlauben, erscheinen die elohim in Gestalt von Engeln, die jedoch ein archaischeres Aussehen haben als die von den christlichen Theurgen beschworenen Geister.
tradition.christian.desc=Von allen abrahamitischen Traditionen hat die christliche Theurgie - vor allem die katholische Kirche - den steinigsten Weg in Bezug auf die Magie hinter sich. Genau genommen bestand die einzige Aufgabe der Heiligen Inquisition darin, alle abergläubischen und esoterischen Praktiken im Europa des Mittelalters auszuradieren, sodass unzählige "Hexen" und "Hexer" auf dem Scheiterhaufen ihr Ende fanden. Als die Magie in die Welt zurückkehrte, bestand der erste Reflex der katholischen Kirche darin, diese Feuer aufs Neue anzufachen, aber da der Klerus seine einst allumfassende Macht längst verloren hatte, musste er sich erneut der Realität geschlagen geben und einen Weg finden, sich mit ihr zu arrangieren - was schließlich mit der berühmten Enzyklika In Imago Dei geschah. Dennoch hält die Kirche ihre katholischen Theurgen an der kurzen Leine. Eng eingebettet in Organisationen wie den Orden des Hl. Sylvester oder die Neuen Tempelritter halten sich die Theurgen gegenseitig unter Kontrolle. Da in den Archiven des Vatikans Millionen magischer Folianten und mystischer Artefakte ruhen, die die Kirche über die Jahrhunderte hinweg gesammelt hat, ist die Diskrepanz zwischen dem theoretisch verfügbaren Wissen und dem tatsächlich im Umlauf befindlichen Wissen ein ziemliches Hemmnis. In den meisten Fällen entwickeln sich katholische Theurgen nicht zu brillanten Beschwörern (auch wenn es schon Berichte über mächtige Geister mit eindeutig engelsähnlichen Merkmalen gab, die Kirchen bewachten), aber ihre Fähigkeiten als Zauberwirker sind ziemlich solide, vor allem auf dem Gebiet der Heilmagie. Einige Theurgen folgen Schutzgeistern in Gestalt eines der zahllosen Heiligen der Kirche. Auch einige andere Zweige des Christentums haben eigene theurgische Traditionen entwickelt, insbesondere die orthodoxen Kirchen und die Mormonen. Während die orthodoxen Traditionen ebenfalls die katholische Steifheit aufweisen, legen Theurgen der evangelikalen Konfessionen ein entspannteres Verhalten an den Tag.
tradition.buddhism.desc=Sowohl Buddhismus als auch Hinduismus sind klassische Beispiele für karmabasierte Glaubenssysteme. Die Ursprünge und Philosophien beider Religionen sind eng miteinander verbunden, sodass es nicht überrascht, dass auch ihre Magietraditionen einige Gemeinsamkeiten aufweisen. Abgesehen vom offensichtlichen Streben nach karmischer Reinheit haben sich beide Traditionen aus tantrischen Denkschulen entwickelt. Sowohl Buddhisten als auch Hindus beschwören Geister als "Devas" und "Asuras" und nutzen für ihre mentale Vorbereitung Yoga-Asanas und Meditationstechniken sowie asketische Episoden. Ihre Rituale vollführen sie, indem sie heilige Mantras auf Sanskrit rezitieren - eine Sprache, die schon in sich selbst als magisch gilt. Und letztlich haben beide das Ziel, den Kreislauf von Tod und Wiedergeburt zu durchbrechen und Transzendenz zu erreichen. Natürlich gibt es zwischen ihnen auch Unterschiede: Buddhistische Zauberer beispielsweise haben in Bezug auf Schutzgeister keine besonderen Präferenzen oder Abneigungen, während sich Hindus oftmals entschließen, einer der zahlreichen Gottheiten ihres Pantheons zu folgen. Die Buddhistische Tradition verfügt über keine wirklichen Verzauberungspraktiken, für Hindu-Alchemisten hingegen ist die Herstellung von Schutzamuletten eine ihrer wichtigsten Einnahmequellen. Und im Gegensatz zum Buddhismus, in dem sich die verschiedensten Arten von Magieanwendern wiederfinden, sind Hindus meist Magieradepten und Aspektzauberer und weisen nur relativ wenige Vollzauberer auf (die allesamt Angehörige der Brahmanen-Kaste sind).
tradition.zoroastric.desc=Studenten der Zarathustrischen Tradition sehen die Welt als im ständigen Kampf zwischen den dualistischen Kräften von Gut und Böse begriffen. Mit jeder ihrer Taten und mit jeder Entscheidung, die sie treffen, leisten sie unweigerlich einen Beitrag auf einer Seite dieses Konflikts. Obwohl die Tradition explizit postuliert, dass jeder ihrer Anhänger nur seinem eigenen Gewissen gegenüber Rechenschaft ablegen muss (jedenfalls in Bezug auf die moralischen Konsequenzen), zielt sie dennoch darauf ab, ihre Getreuen dazu zu motivieren, aus sich heraus für das Gute in dieser Welt zu streiten. Die Tradition leitet sich von der antiken persischen Religion des Zarathustrismus ab, die wiederum der Vorgänger der meisten monotheistischen Religionen (inklusive der abrahamitischen Religionen) war. Abgesehen von einem gemeinsamen Gedankengebäude teilen die Anhänger des zarathustrischen Glaubens jedoch keinerlei offizielle Infrastruktur. Auch hier ermutigt die Tradition die Gläubigen zu Eigeninitiative, um Gemeinschaften überall auf der Welt aufzubauen, ihr Wissen weiterzugeben und voneinander zu lernen. Aufgrund ihres Glaubens an den ewigen Konflikt können Zarathustrer teils etwas kampflustige Zeitgenossen sein, die mitunter als "besorgte dritte Partei" agieren, um die Agenda derjenigen Gruppierungen voranzutreiben, die ihrer Meinung nach im Recht sind. So sehr sie jedoch danach streben, das Gute siegen zu lassen: Für sie ist es eine Selbstverständlichkeit, das Leben besiegter Feinde zu verschonen. Für Außenstehende ist diese auf archaische Weise ritterliche Haltung im besten Fall irritierend. Anhänger der Zarathustrischen Tradition sind überwiegend Magieradepten mit herausragenden Fähigkeiten in der Kampfmagie. Wenn sie einen Schutzgeist annehmen, dann bevorzugen sie dabei abstrakte Konzepte.
tradition.path_of_the_wheel.desc=Wenn man so will, ist der Pfad des Rades ebenfalls eine karmabasierte Tradition, auch wenn er einige fundamentale Unterschiede zu diesen aufweist. Beispielsweise wird die spirituelle Erleuchtung des Individuums erlangt, indem fünf aufeinander folgende Pfade beschritten werden, die den gesellschaftlichen Rollen im Tír entsprechen: Krieger, Hüter, Barde, Druide und Rígh ("Herrscher"). Diese Tradition wird in der Elfennation Tír na nÓg praktiziert und steht nur Elfen offen. Die fünf Pfade repräsentieren die gesellschaftliche Ordnung des Landes, und während die Lernenden auf den Pfaden voranschreiten, erhöht sich gleichzeitig ihr gesellschaftlicher Status. Für jeden Pfad existiert ein sehr strenger und formalisierter Lehrplan, der jedoch nur denjenigen offensteht, die sich bereits dafür qualifiziert haben. Wissen mit Außenstehenden zu teilen ist ein Verbrechen, auf das die Todesstrafe steht. Die Anhänger des Pfads des Rades haben sich mit Leib und Seele dem Tír verschrieben. Die gesamte Tradition dient dem Zweck, das Land vor externen - und internen - Feinden zu schützen. Da die Zauberer nur dann voranschreiten können, wenn sie ihren derzeitigen Pfad gemeistert haben, sind sie ausgesprochen stark auf die Verbesserung ihrer Fähigkeiten fokussiert. Als kompetente Beschwörer behandeln sie Geister wie jedes andere Mitglied ihrer Gesellschaft - weder mit Ehrerbietung noch von oben herab. Die Wahl eines Schutzgeists verändert sich mit der Zeit und passt sich dem jeweiligen Pfad an.
tradition.shaman.desc=Die schamanische Tradition, die von den First-Nation-Stämmen Amerikas praktiziert wird, ist nicht nur die bekannteste unter den animistischen Traditionen, sondern vermutlich auch die bekannteste Magietradition überhaupt. Sie ist namensgebend für ein komplettes System aus Traditionen, die auf Glaube und Intuition basieren. Man muss jedoch zwischen dem traditionellen Schamanismus, der auf den Überlieferungen der First Nations basiert und auf Lehrer-Schüler-Basis weitergegeben wird, und dem modernen Schamanismus unterscheiden, der die grundlegenden schamanischen Lehren aufgegriffen, um externe Konzepte erweitert und sie in das Mindset der westlichen Kultur transferiert hat. Dennoch halten alle schamanischen Schulen an einer undogmatischen, praktisch orientierten Herangehensweise fest. Sie wiederholen immer wieder, dass die Magie in all ihrer Komplexität erlebt werden muss, anstatt sie mithilfe von Büchern zu studieren - denn sie überlastet den intellektuellen Geist. Alle Bemühungen, die Magie wissenschaftlich zu erfassen, werden als vergebliche und unnötige Selbstbeschränkung angesehen, was die angespannte Beziehung zwischen schamanischen und hermetischen Traditionen (wenn auch nicht zwangsläufig zwischen ihren Anhängern) weiter intensiviert. Paradoxerweise hat diese Kluft nicht verhindert, dass einige moderne schamanische Schulen die Vereinheitlichte Magietheorie für sich angenommen haben und ihre Herangehensweise an die Magie weltweit an Universitäten unterrichten.
tradition.shinto.desc=Der Shintoismus, die Staatsreligion des Japanischen Kaiserreichs, hat sich dessen Expansion angepasst - aber lediglich innerhalb der japanischen Gemeinschaften, die sich entwickelten, als sich die Megakonzerne des Kaiserreichs überall auf der Welt ansiedelten. Der überwiegende Teil der Shinto-Gläubigen lebt jedoch nach wie vor in Japan und betet dort an unzähligen Schreinen die kami ("Götter" oder "Geister") an. Der offizielle Status der zugrunde liegenden Religion verschafft der Shinto-Tradition ein hohes Ansehen in der japanischen Konzernwelt. Dies ist bemerkenswert für eine "schamanische" Tradition, da die Konzerne in der Regel die logischer ausgerichteten und daher vorhersehbareren Hermetiker bevorzugen. (Natürlich haben auch die individuellen Talente der Shinto-Zauberer - meist Beschwörer, aber auch Ritualmagier, Spruchzauberer und einige wenige Adepten - ihren Teil zu dieser breiten Akzeptanz beigetragen.) Shinto-Zauberer gelten als Experten für schützende Talismane (ofuda) und Amulette (omamori). Entsprechend sind auch ihre magischen Kampftaktiken grundsätzlich defensiv. Die Beziehung der Tradition zu den Geistern ist von ehrerbietigem Respekt geprägt: Kami werden gebeten, dem Beschwörer einen Gefallen zu tun, statt dass es einfach erwartet wird. Da alle kami gleichermaßen geehrt werden müssen, gilt es für Shinto-Zauberer als unangemessen, einen Schutzgeist zu wählen.
tradition.wuxing.desc=Anhänger der chinesischen Magietradition Wuxing verehren keine individuellen Geister. Für sie erfolgt die Beseelung der Welt durch eine heilige, alles durchdringende Energie namens qi. Die Philosophie dahinter, die "Lehre der fünf Wandlungsphasen" (die wörtliche Übersetzung von Wuxing) ist keine Religion, sondern ein taoistisches System, das dem Verständnis und der Beschreibung der Natur gewidmet ist. Die fünf Elemente - Feuer, Erde, Metall, Wasser und Holz - werden als fließende, sich abwechselnde Zustände von Materie angesehen. Die Wujen, wie die Schamanen der Wuxing-Tradition genannt werden, nutzen ihr Verständnis der Natur, um ihre Umgebung aus einem chaotischen und turbulenten Zustand (yang) in Richtung von Ordnung und Harmonie (yin) zu verlagern. Für Außenstehende kann das Wuxing-Denksystem sehr aufgeräumt und unnötig bürokratisch erscheinen, aber für die Wujen ist diese Ordnung gleichbedeutend mit Kontrolle. Sie wenden Prinzipien des feng shui an, um den Qi-Fluss zu optimieren, und nutzen Bewegungsmeditationstechniken aus dem qi gong oder taiji - die Wujen sind berühmt für die Manipulation des sie umgebenden Manaflusses zu ihren Gunsten. Das beispiellose Wissen der Wuxing-Tradition über das Reinigen von Hintergrundstrahlung und die Nutzung der Leylinien macht ihre Magieanwender zu gefragten Spezialisten auf diesem Gebiet - nicht nur bei dem gleichnamigen chinesischen Megakonzern, sondern überall auf der Welt. Wujen sehen Geister als Manifestationen des qi und setzen sie wie Werkzeuge ein - allerdings natürlich hochgeschätzte und mit Respekt verwendete Werkzeuge. Ihre holistische Sicht auf das qi lässt es ihnen sinnlos erscheinen, einem individuellen Schutzgeist zu folgen. Einige von ihnen haben jedoch eine besondere Vorliebe für ein abstraktes moralisches Konzept oder einen Wuxing-Meister aus der Geschichte, der effektiv die gleiche Rolle wie ein Schutzgeist einnimmt (obwohl der Wujen ihn niemals so nennen würde). Durch den starken Einfluss der Wuxing-Philosophie hassen Wujen Chaos und Kontrollverlust und versuchen in jeder Situation zuerst, wieder die Oberhand zu gewinnen, bevor sie sich dem Problem an sich widmen. Wujen-Zauberer und -Adepten sind ausgezeichnete Heiler und Kämpfer.
tradition.aztec.desc=Die aztekische Tradition wird normalerweise als Synonym für die Magie Aztechnologys angesehen. Und für dieses Missverständnis kann man niemandem einen Vorwurf machen - genau genommen stellt Aztechnology, das sich als einziger Vertreter der "wahren" aztekischen Renaissance ausgibt, es gern selbst so dar. Aber obwohl die nahualli (magische Priester) in den Rängen des AAA-Staatskonzerns nach außen hin als Anhänger der aztekischen Tradition wahrgenommen werden, beschreiten die meisten von ihnen in Wahrheit deutlich dunklere Pfade. Ein "echter" nahualli glaubt, das jedes Wesen mit einem Bewusstsein - und sogar jeder Gott - einen spirituellen Zwilling in Tiergestalt hat, der einige seiner Eigenschaften teilt und andere ergänzt. Die Suche nach einem kompatiblen Tierzwilling ist das erste spirituelle Unterfangen, dem sich ein Schüler der aztekischen Tradition stellen muss. Sobald der tierische Zwilling gefunden wurde, nimmt er die Rolle eines Schutzgeists ein. Entsprechend ist es für die nahualli essenziell, stets im spirituellen Kontakt mit ihrem Schutzgeist zu bleiben (was sich außerhalb der Städte im natürlichen Lebensraum des Tiers als einfacher erweist). Während konservative Schulen Ritualmagie, traditionellen Gewändern und antiken zeremoniellen Waffen einen hohen Stellenwert einräumen, verfolgen liberaler eingestellte Anhänger dieser Tradition eher praktische Ansätze. Ihre Priorität liegt auf der Spruchzauberei, und sie erlauben die Verwendung sämtlicher Hilfsmittel, die sich beim Aufbau der Verbindung zur Geisterwelt als hilfreich erweisen könnten. Beschworene Geister (sogar Elementargeister) haben normalerweise die Gestalt aztekischer Krieger oder eines passenden Tiers und sind somit Ausdruck der Dualität zwischen Mensch und Tier.
tradition.sioux.desc=In der schamanischen Tradition der Sioux sind Tiergeister keine individuellen Gefährten, sondern bilden ein Pantheon mächtiger Entitäten, die Einfluss auf das Leben der Menschen nehmen. Einige Beispiele aus den Reihen dieser vielfältigen Charaktere sind Iktomi, die Spinne, und Mica, der Kojote, beide gerissene Gauner, Ptesan-Wi, die gütige weiße Büffelfrau, oder Wakinyan, der mächtige Donnervogel. Interessanterweise unterscheiden sich die Eigenschaften der Tiere teils drastisch von denen, die ihnen in der europäischen Folklore zugeschrieben werden. Obwohl jeder dieser Tiergeister seine eigenen Ziele verfolgt, nehmen sie alle eine Rolle als Mittler zwischen den Menschen und Wakan Tanka, dem "Großen Geist", ein - der allumfassenden Macht des Lebens selbst. Der Große Geist wird auch als das "Große Mysterium" bezeichnet, und seine Wege entziehen sich jeglichem menschlichem Verständnis. Um die spirituellen Kräfte in sich selbst und in ihrer Umgebung zu meistern, müssen die Schamanen der Sioux-Tradition den Hinweisen folgen, die von den Tiergeist-Mittlern hinterlassen wurden. Dadurch sind sie aufmerksame und empfängliche Beobachter ihrer Umgebung, die die Auren um sich herum vorurteilsfrei betrachten und immer bereit sind, auf mehr oder weniger freundliche Fingerzeige zu reagieren - auch wenn sie von außen betrachtet dadurch manchmal wirken, als würden sie sich irrational verhalten. Die meisten Zauberer verspüren eine Neigung - eine besondere Bindung - zu einem der Tiergeister und wählen ihn als Schutzgeist. Wann immer Sioux-Schamanen mit Geistern diskutieren - sogar mit ihrem eigenen Schutzgeist -, sind sie meist unnachgiebig, aber nicht nachtragend. Sie akzeptieren die Tatsache, dass andere Wesen gute Gründe haben, aus denen sie ihre eigenen Interessen verfolgen, und sie akzeptieren auch, dass sowohl die physische als auch die spirituelle Welt zu einem gewissen Grad für immer ein Rätsel für sie bleiben werden. Man findet innerhalb der Sioux-Tradition Zauberer sämtlicher Arten, auch wenn ihre Adepten-Späher, die Experten für Aufklärung und das Überleben in der Wildnis sind, vermutlich am meisten im Rampenlicht stehen.
tradition.red_magic.desc=Auch wenn ihr sowohl der Legendenschatz als auch die Feinheit der aztekischen Tradition und der Sioux-Tradition fehlen, ist die Rote Magie dennoch die wohl älteste der Tiergeist-Traditionen. Ein Archäologiekonzern namens Tzuri Group führte die Rote Magie vor ein paar Jahren ein - oder, wie die Forscher des Unternehmens beharren: brachte sie zurück - und behauptete, sie in einer seiner Ausgrabungsstätten entdeckt zu haben. Die Anhänger der Tradition der Roten Magie glauben, dass das instinktive Verständnis für die eigenen magischen Kräfte bei Zauberern zwar blockiert sein kann, dass man jedoch trotzdem darauf zugreifen kann, indem man sich in den "tierischen Geist" zurückversetzt, in die eigene innere tierische Seite, am besten ausgedrückt durch den Geist eines seelenverwandten (oftmals wilden) Tiers, das zum eigenen Schutzgeist wird. Durch den Schutzgeist erhalten sie Zugang zu etwas, das sie als die "Domäne des Rot" bezeichnen. Dabei handelt es sich nicht um einen Ort, sondern vielmehr um eine Energie, die alles tierische Leben auf der Welt und im gesamten Universum miteinander verbindet. (Metasapiente und die Metamenschheit werden großzügigerweise in ihre Definition von "tierischem Leben" eingeschlossen.) Rote Magier "lernen" nicht, ihre Magie einzusetzen, sondern versuchen stattdessen, Erlerntes zu "verlernen", um ihre Vernunft temporär abzustreifen. Obwohl die archaische Natur (und der Name) dieser Tradition es nicht vermuten lassen würden, stellen sich die Anhänger der Roten Magie aktiv gegen Blutmagie, da sie derartige Praktiken als Kontaminierung ihrer Domäne des Rot betrachten. Sie entscheiden sich entweder, sich an das urbane Leben anzupassen und ihre Abscheu gegenüber der degenerierten Lebensart der viel zu domestizierten Menschen für sich zu behalten, oder sie verweigern sich dieser "Farce" komplett, zelebrieren offen ihre animalische Seite und stellen sich stur den damit verbundenen Konsequenzen. Unter den Anhängern dieser Tradition findet man Magiebegabte aller Art. Die von ihnen beschworenen Geister nehmen eine breite Vielfalt von Tiergestalten an.
tradition.drudic.desc=Die druidischen Traditionen sind eine Gemeinschaft aus sehr unterschiedlichen druidischen Schulen: Die zivilisierten, fast eher an Freimaurer erinnernden englischen Druiden aus dem britischen Adel, die deutlich weniger zivilisierten, urweltlichen wilden Druiden und die zahlreichen Gruppen, die sich von klassischen keltischen Druiden ableiten - um nur die größten Schulen zu nennen. Obwohl sie sich in vielen Punkten stark unterscheiden, haben all diese Schulen ein sehr territoriales Verhalten gemeinsam (böse Zungen behaupten, dass das daran liegt, dass die Anhänger dieser Tradition hauptsächlich Männer sind). Druiden neigen dazu, "ein Land" für sich zu beanspruchen. Dabei kann es sich bei den Kelten um einen klassischen Hain handeln, bei den Wilden Druiden um eine ansonsten unbewohnte Insel oder bei den englischen Druiden um die recht großen und dicht besiedelten Britischen Inseln. Die Druiden gehen eine tiefe Bindung zu diesem Land ein und verteidigen es mit Zähnen und Klauen gegen alle Einmischungen von außen, indem sie es vor sämtlicher Verschmutzung - mundan wie astral - abschirmen. Diese Territorialität der Druiden überträgt sich auch auf Geister. Mithilfe ihrer langwierigen Rituale sichern sich die Druiden die Kooperation der einheimischen Geister. Im Zusammenspiel mit ihrem detaillierten Wissen über die Umgebung sind sie auf heimischem Boden eine Kraft, mit der man rechnen muss. Druiden brauchen in der Regel eine ausgesprochen gute Ausrede, um ihren Hain zu verlassen, und die meisten dieser Gründe hören sich für Außenstehende absurd altertümlich an: ein Botengang für einen der Ältesten ihres Zirkels, eine heilige Queste zur Rettung ihres Heimathains oder eine grauenvolle Vision, die sie genauer ergründen müssen. Die meisten Druiden sind fähige Beschwörer. Ihre Fähigkeiten als Zauberwirker sind zwar überdurchschnittlich, aber wenn es darum geht, Hintergrundstrahlung und Leylinien zu beeinflussen, dann können ihnen nur die Wujen der Wuxing-Tradition das Wasser reichen. Innerhalb eines Druidenzirkels nehmen Adepten eher untergeordnete Rollen ein und haben die Aufgabe, die Gemeinschaft zu bewachen und zu schützen.
tradition.witchcraft.desc=Ganz ohne Territorialität und mit umgekehrten Verhältnissen, was die männliche Vorherrschaft angeht, huldigt die Hexenkunst-Tradition Mutter Erde, indem sie ihr Leben voll ausschöpft. Die nächtlichen Treffen der Hexen in abgelegenen Auen, die mit ekstatischen Tänzen und berauschenden Tränken begangen werden, sind der Stoff von Legenden. Abseits dieser Zusammenkünfte leben die Hexen meist allein oder in kleinen Gemeinschaften, in denen sie ihre magischen Fähigkeiten schulen. Ihre Fähigkeiten auf dem Gebiet der Verzauberung sind den meisten anderen Traditionen überlegen. Da sie Jahrhunderte der grausamen Verfolgung hinter sich haben, bleiben sie am liebsten unauffällig. Hexen werden oft von einem Schutzgeist, meist einem Tier, begleitet, das sie als ihren Vertrauten bezeichnen und mit dem sie auf Augenhöhe kommunizieren. Die Hexenkunst ist eine Besessenheitstradition.
tradition.witchcraft_street.desc=Anstatt das urbane Chaos der Sprawl-Moloche der Sechsten Welt zu verachten, machen die Straßenhexen es sich untertan. Sie erkennen die Lebenskraft von Mutter Erde in dem Überfluss an menschlicher Energie, die in den Sprawls pulsiert. Ihre Zusammenkünfte sind orgienartige Raves, und sie fühlen sich im Neonlicht der Innenstadt ebenso zu Hause wie in vermüllten Seitengassen. Die meisten Straßenhexen sind Adepten, vom diebischen Slumkind bis zur glamourösen Trickbetrügerin, stets bereit, die menschliche Energie der Stadt anzuzapfen, um sich ihren Lebensunterhalt zu verdienen. Einige traditionelle Hexen verurteilen ihre Cousinen aus der Stadt und werfen ihnen vor, einem toxischen Pfad zu folgen (was nicht der Fall ist).
tradition.wicca.desc=Die philosophische Abgrenzung zwischen traditioneller Hexerei und Wicca ist ziemlich schwammig. Der hauptsächliche Unterschied ist die Offenheit von Wicca-Zirkeln für mundane Gläubige. Genau genommen sind die mundanen Mitglieder des Zirkels, die Wicca lediglich als Religion erleben, gegenüber den Erwachten oft in der Überzahl. Die Magieanwender unter den Wicca folgen üblicherweise dem Schutzgeist Große Mutter (S. 75). Sie sind kompetente Beschwörer und gute Ritualmagier, brillieren jedoch in der magischen Heilung.
tradition.green.desc=Keine Auflistung über ökogläubige Magietraditionen wäre vollständig ohne eine Erwähnung der dogmatischen Hardliner aus der Tradition der Grünen Magie. Diese durch die mysteriöse Tzuri Group gleichzeitig mit der Roten Magie (wieder)entdeckte Tradition glaubt an die Domäne des Grün, die Kraft, die das gesamte pflanzliche Leben im Universum miteinander verbindet. Obwohl die Grüne Magie scheinbar eine Ergänzung der Roten Domäne der Roten Magie ist, deuten die archäologischen Funde aus den Ausgrabungsstätten der Tzuri Group darauf hin, dass einst ein Konflikt zwischen diesen beiden Traditionen herrschte. Da sie der Ansicht sind, dass pflanzliches Leben absoluten Vorrang hat, sind grüne Schamanen in der Regel alles andere als freundliche Zeitgenossen und werden oft als "Sonderlinge" bezeichnet.
tradition.hermetic.desc=Wenn man an einen Magier denkt, kommt einem in der Regel zuerst der klassische Hermetiker in den Sinn. Natürlich haben sie heutzutage wenig mit den spitzen Hüten, Stäben und schäbigen, tintenbefleckten Roben gemein, die man aus den Fantasy-Trids kennt. Stattdessen handelt es sich um Zauberer, die sich auf Formeln und die wissenschaftliche Methode verlassen, um ihre Art des Zugriffs auf ihre Kraft zu entwickeln. Studium, Experimente und sorgfältige Planung sind der Schlüssel zur Entwicklung hermetischer Magie, und wenn ihr irgendeine der ganzen Magie-Universitäten auf der Welt besucht, dann wird man euch dort mit großer Wahrscheinlichkeit in dieser Art der Magie unterrichten. Natürlich bedeutet das auch, das sich unter den Hermetikern die verschiedensten Arten von Persönlichkeiten finden, da mit ihren Lehren nur sehr wenig Moral verwoben ist. Jeder einzelne Magier dieser Tradition wird von seinem eigenen moralischen Kompass geleitet. Das ist vermutlich auch der Grund dafür, dass Hermetiker zu den Zauberwirkenden gehören, die am häufigsten bei den großen Kons landen. Nicht, dass die meisten von ihnen dabei groß eine Wahl hätten, wenn wir mal ehrlich sind. Für Hermetiker ist Magie ein Werkzeug. Es ist weder gut noch böse - das wird durch die Absichten des Anwenders bestimmt. Das ist eine vernünftige Sichtweise, aber auch eine, die bereits mehrfach zu einem Missbrauch magischer Macht geführt hat, wenn sich ein Magier zu sehr vom Rausch der Macht mitreißen ließ, um zu erkennen, dass er gerade etwas Falsches tut - oder es ihm schlicht egal war. Das ist einer der Gründe dafür, dass die allgemeine Öffentlichkeit Magieanwendern meist mit Vorsicht begegnet. Und kann man es ihr verdenken?
tradition.chaos.desc=Hier wird es kompliziert. Chaosmagie ist eine weit gefasste Kategorie, die sich in verschiedener erwähnenswerter Hinsicht von der hermetischen Tradition unterscheidet - vor allem darin, dass sie deutlich offener ist, wenn es darum geht, sich einzelne Teile anderer Traditionen außerhalb der recht starren Struktur der hermetischen Magiepraxis anzueignen. Es wird oft gesagt, dass eine Variante der Hermetik, die sich auf die Vereinheitlichte Magietheorie gründet, viel von den Praktiken und Ansichten der Chaosmagie in sich trägt oder sich zumindest auf eine sehr ähnliche Art entwickelt hat. Woran genau glauben Chaosmagier also? Nun, in der Chaosmagie wird die Magie oftmals als Methode zur Veränderung des Codes der Realität gesehen - was einige Vertreter dieser Tradition wörtlicher nehmen als andere. Die Realität selbst ist ein Code, eine Reihe von Gleichungen, und Magier dieser Tradition sind der Ansicht, dass man diesen Code beim Wirken eines Zaubers unweigerlich verändert, um den Willen des Magieanwenders Gestalt werden zu lassen - genauso, wie ein Hacker aus dem gleichen Grund Schwachstellen in Software ausnutzt. Die wissenschaftlicher orientierten und besser organisierten unter den Chaosmagiern mögen sich auf den ersten Blick kaum von ihren hermetischen Kollegen unterscheiden, aber einige ihrer unorthodoxen Methoden sorgen meist rasch dafür, die Unterschiede klarzumachen. Natürlich gibt es auch eine praktischer orientierte Variante der Chaosmagie, die in der Regel jedoch weniger Beachtung findet. In vielen Fällen liegt das daran, dass ihre Vertreter gern mit Straßenmagiern in einen Topf geworfen werden, weil sie versuchen, wo immer möglich zu lernen, was immer sie können. Ihre traditioneller ausgebildeten Kollegen betrachten das oft mit Geringschätzung. Aber letzten Endes ist das Endergebnis mehr oder weniger das Gleiche - eine große, in der Wissenschaft verwurzelte Tradition, die sich nicht zu schade ist, sämtliche Methoden anzuwenden, mit denen sie sich weiterentwickeln kann - ganz egal, ob es sich um Techniken aus anderen Magietraditionen oder um den Einsatz von Technologie handelt.
tradition.black.desc=Die Schwarze Magie ist eine Tradition, die viel gescholten und von den meisten nur unzureichend verstanden wird. Sie leitet sich von der hermetischen Tradition ab, speist sich jedoch zu einem guten Teil aus hedonistischen Emotionen und dem Exzess. "Tu, was sich für dich gut anfühlt, denn du bist nur dir selbst Rechenschaft schuldig" - das ist die grundlegende Lebenseinstellung typischer Anhänger der Schwarzen Magie. Natürlich kommt dazu für gewöhnlich noch ein ordentlicher Schuss Nihilismus, der dazu führen kann, dass sie ziemlich gleichgültig auf die Welt blicken. Angesichts dessen ist es wenig überraschend, dass sie meist so negativ betrachtet werden. Dennoch ist die Schwarze Magie wie andere hermetische Traditionen mehr ein Werkzeug als eine Kraft mit eigenen moralischen Tendenzen. Die Welt ist nicht so simpel, dass sie sich einfach in Gut und Böse unterteilen ließe, und die Schwarze Magie bewegt sich irgendwo innerhalb der vielfältigen Grauschattierungen, aus denen die Realität wirklich besteht. Die Schwarze Magie wird durch das Ego getrieben, und durch das, was das für jeden ihrer Anwender am Ende bedeutet - im Guten wie im Schlechten.
tradition.qabbalists_secular.desc=Obwohl er eng mit seiner abrahamitischen Schwester verwandt ist und vielfach auf den gleichen Traditionen beruht, verdient der weltliche Arm der Kabbala hier zumindest eine Fußnote. Da er sich größtenteils von seinen religiösen Anleihen gelöst hat, lässt er sich deutlich leichter bei den bisher aufgelisteten hermetischen Traditionen einordnen. Dennoch sind die Unterschiede abgesehen von der weniger religiösen Herangehensweise recht marginal.
tradition.practical_theurgy.desc=Die Praktische Theurgie ist mit heidnischen Praktiken verbunden, die man in einigen Rekonstruktionen schamanischer Kulturen vorfindet. Die Tradition hat viel von diesen Wurzeln übernommen, gleichzeitig aber auch das integriert, was sie die Erfahrung gelehrt hat, zu einem gewissen Teil von den Göttern und Geistern getrennt zu sein, die ihre weniger weltlichen Kollegen leiten. Ihre Rituale und Zauber haben oftmals etwas Spirituelles an sich, allerdings ohne den leitenden Geist, dem heidnische Schamanen dienen würden.
tradition.romani.desc=Die Roma haben ihre eigenen Praktiken. Wir werden an dieser Stelle nicht zu tief darin eintauchen, denn der allzu energische Versuch, ihre Fähigkeiten zu beschreiben, ohne tief in diese Kultur eingetaucht zu sein, ist ... nun ja, nicht besonders klug. Also lassen wir das. Die Roma hatten schon immer einen starken Glauben, der ihr Volk schon in der Zeit vor dem Erwachen leitete und es heute umso mehr tut. Und sie neigen dazu, diese Art der Magie niemandem beizubringen, der nicht ihrem Volk angehört. Was wir wissen, ist, dass es eine sehr starke Verbindung zum Geist ihres Volkes gibt, die sich auch in ihrer Magie widerspiegelt. Die Kunst wird mündlich weitergegeben und niemals in Grimoires oder anderen dauerhaften Schriftstücken niedergeschrieben.
tradition.storyteller.desc=Der Tradition der Geschichtenerzähler, die auf Geschichten mit kulturübergreifenden Gemeinsamkeiten fußt, wird nachgesagt, sich die Macht des kollektiven Unterbewusstseins zunutze zu machen. Bilder und Geschichten sind tief in dem kulturellen Verständnis verankert, das wir von der Welt um uns herum und von Wesen wie Drachen, Geistern und anderen übernatürlichen Kreaturen haben, die in Geschichten aus zahlreichen Kulturen auftauchen. Die Geschichtenerzähler behaupten, die Kraft für ihre Magie aus diesen Gemeinsamkeiten zu beziehen, und sie versuchen, ein "großes Narrativ" über diese Geschichten hinweg zu zeichnen, während sie gleichzeitig neue Spuren verfolgen und Elemente untersuchen, die in moderneren Geschichten zum Vorschein kommen. Sie entscheiden sich oft für Schutzgeister, die Helden aus den Legenden oder Protagonisten großer Geschichten aus vergangenen Zeiten repräsentieren.
