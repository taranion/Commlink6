focus.athame.desc=Athame ist der Name einer Art von Fokus, die ausschließlich von Blutmagiern benutzt wird. Traditionelle Athames waren zeremonielle Dolche oder Messer, und die ersten modernen Foki hatten ebenfalls diese Gestalt. Aztekische Blutmagier gehörten zu den Ersten, bei denen diese Foki (in Gestalt scharfer Obsidiandolche) nach dem Erwachen gesehen wurden. Neuerdings stellen auch Blutmagier anderer Traditionen Athames her, deren Gestalt sie ihrer Tradition anpassen, wie bei den rasiermesserscharfen Feuersteinäxten indianischer Blutschamanen und den Sicheln indischer Blutmagier. Ein Initiat muss die Metamagie Opferung kennen, um einen Athame herzustellen oder zu binden.

#item.improvised_throwing_weapon.desc= Mit einer improvisierten Wurfwaffe - einer Münze, einer Gewehrkugel, einer Spielkarte, einem leeren Magazin, einem Essstäbchen, einem Flashpack, was immer dir in den Sinn kommt! - kannst du auf bis zu 100 Meter Entfernung mit einem Schadenswert von 1K oder 1B (nach Maßgabe der Spielleiterin) angreifen. Der Angriffswert auf Sehr Nahe und Nahe Entfernung ist gleich deiner Athletik + Stärke, auf Mittlere Entfernung die Hälfte davon (aufgerundet). Beispielsweise ergeben sich aus Stärke 5 und Athletik 4 Angriffswerte von 9/9/5*/–/– (* max. 100 m).

item.acid_on_demand.desc=Dieses Erzeugnis ist eine kleine Phiole voller Säure, die als Herzstück eines gefährlichen Zaubers dient. Man sollte sehr vorsichtig damit umgehen, um beim Einsatz Verletzungen zu vermeiden. Um ein Ziel mit der Säurewirkung zu treffen, wird die Phiole berührt, der Zielbereich ausgewählt und der Auslöser "Schmelze!" ausgesprochen. Die Säure wird am Zielort erschaffen. Arkane Säure hat einen Vorteil, weil sie nach kurzer Zeit verschwindet (gemäß den Regeln des Zaubers) und keine chemischen Rückstände hinterlässt. Die Säure trifft einen Bereich von einem halben Quadratmeter.
item.acid_wash.desc=Dieses Erzeugnis wurde für wissenschaftliche Prozesse entwickelt und von Personen missbraucht, die auf dem Schwarzmarkt Zugang dazu bekamen. Es lässt Säure auf einen großen Bereich wirken. Ursprünglich sollte es mit einem regulierten Effekt gegen chemische Störfälle und für Hochleistungs-Oberflächenprüfungen eingesetzt werden. Wie die meisten Erzeugnisse ist es einfach zu benutzen. Man berührt oder hält die gewölbte Phiole voller Säure, wählt einen Wirkungsbereich aus und spricht den Auslöser "Mit Wasserstoffionen geflutet". Dann wird ein Bereich mit 2 Metern Radius mit Säure überflutet. Wie bei der kleineren Variante muss man vorsichtig sein, aber die Wirkung ist auch hier kurzzeitig.
item.arcane_taser.desc=Selbstverteidigung gibt es nun auch als arkane Variante. Man trägt dieses kleine Blitzamulett an einer Kette, einem Ohrring, einem Armband oder einfach in der Tasche oder dem Portemonnaie, damit es immer verfügbar ist, um unerwünschte Annäherungen abzuwehren. Ein schnelles Werkzeug zur Selbstverteidigung, das dich in dunkelster Nacht mit einem Strahl aus Elektrizität beschützt. Zur Aktivierung musst du das Amulett berühren, die Person, die du treffen willst (oder einen Teil davon), sehen, die Faust ballen und dann zusehen, wie das Ziel eine schockierende Überraschung erlebt.
item.arcane_taser_plus.desc=Eine Verbesserung des gewöhnlichen arkanen Tasers, mit der man eine ganze Gruppe unter Kontrolle bringt. Die Plus-Version trifft mehr als nur eine Person, aber man läuft Gefahr, selbst von der elektrischen Explosion getroffen zu werden, also muss man das Zentrum der Wirkung sorgfältig auswählen. Berühre die kleine Murmel (auch wenn sie noch versteckt ist), suche das Zentrum der Party aus, sage "Gezähmter Blitz" und mach dich bereit, vor ein paar geschockten Räubern davonzurennen.
item.aura_obscura.desc=Diese winzige Phiole enthält einen starken Trank mit einem angenehm fruchtigen Geschmack. Nimm einen Schluck und such das Ziel des Schabernacks aus. Stelle dir dessen neue Aura vor, lehn dich zurück und genieße die Show, wenn alle in der Umgebung, die Auren sehen können, sich wundern oder die von dir geschaffene Aura ignorieren. In den meisten Fällen braucht man eine gewisse Erfahrung im Betrachten von Auren, um eine glaubwürdige Aura zu schaffen. Das hält aber niemanden davon ab, etwas so Lächerliches zu erschaffen, dass es schnell durchschaut oder gebannt wird; mit wachsender Erfahrung werden die Ergebnisse besser und unauffälliger.
item.bean_counter_bean.desc=Wenn du einen sehr detailgenauen Blick brauchst, wirf diese Pille ein und konzentriere dich. Es könnte um Informationen über eine beobachtete Person gehen, um einen Bildschirm, den du dir einprägen musst, um ein Tastenfeld, das du im Auge behältst, um sehen zu können, was es schützt, oder um andere kleine Bereiche, die du genau analysieren willst. Die Pille wird einfach im Mund aktiv und gibt dir das Adlerauge, das du für diesen Job brauchst.
item.bench_clearer.desc=Dieses Erzeugnis sieht wie ein typischer Baseball aus. Sprich das Kommando (Standard: "Erwischt!"), wirf den Ball in ein Zielgebiet (egal mit welcher Wurftechnik), und du hast die Chance, deine Gegner einschlafen zu lassen oder sie zumindest so weit zu erschöpfen, dass sie noch mal darüber nachdenken, ihre Knarren rauszuholen, wenn ihr aus vollen Rohren feuernd auflauft. Für den Wurf ist eine Probe auf Athletik + Geschicklichkeit (1) erforderlich. Misslingt die Probe, landet der Ball nicht am gewünschten Ort (wenn gewünscht, kann dafür das Abweichungsdiagramm, SR6, S. 118, eingesetzt werden) und wird nicht aktiviert. Der Ball verliert seine Ladung dabei nicht, muss aber erfolgreich auf den ursprünglichen Zielpunkt geworfen werden, um seine Wirkung zu entfalten.
item.boomstick.desc=Dieser "Zauberstab" sieht eigentlich wie ein 20 Zentimeter langer Schusswaffenlauf mit hexagonalem Querschnitt und einem kleinen Visier aus. Wie üblich muss der Zauberstab nicht geschwungen werden, aber ein paar kreative Köpfe nutzen das Rohr zum Zielen. Der gewöhnliche BOOMStick! ist für ein einzelnes Ziel mit minimaler Wirkung auf die Umgebung gedacht. Zu Ehren des historischen Unterhaltungsfilms ist die Standard-Aktivierung: "Das ist mein Boomstick!" Wenn man eine Nebenhandlung verwendet, um durch den Lauf zu zielen, erhält man 1 Edge.
item.boomstick_extreme.desc=Dieser "Zauberstab" sieht eigentlich wie ein 20 Zentimeter langer Schusswaffenlauf mit hexagonalem Querschnitt und einem kleinen Visier aus. Wie üblich muss der Zauberstab nicht geschwungen werden, aber ein paar kreative Köpfe nutzen das Rohr zum Zielen. Der BOOMStick Extrem! hat einen vergrößerten Wirkungsbereich. Zu Ehren des historischen Unterhaltungsfilms ist die Standard-Aktivierung: "Das ist mein Boomstick!" Wenn man eine Nebenhandlung verwendet, um durch den Lauf zu zielen, erhält man 1 Edge.
item.boost_pill.desc=Es gibt eine Vielzahl dieser praktischen kleinen Pillen, die genau im richtigen Moment eine kleine Unterstützung bieten. Jede Pille unterstützt einen anderen Aspekt: Geschwindigkeit (Geschicklichkeit), Kraft (Stärke), Ausdauer (Konstitution) und Reflexe (Reaktion). Ob man die Pille in den Mund schiebt oder in der Handfläche darauf spuckt, ist für die Aktivierung egal.
item.bruce_lee_keychain.desc=Diese kleine Faust, die an einer kleinen Kette hängt, ist das Mittel der Wahl für Leute, die den berühmten "Ein-Zentimeter-Schlag" ausführen wollen, ohne ein Jahrzehnt lang zu trainieren. Berühre den Schlüsselanhänger, berühre das Ziel, sag "Wusch", und zack - eine Explosion telekinetischer Energie schießt aus deinen Fingerspitzen. Eine großartige Art, eine Kneipenschlägerei anzufangen (oder zu beenden), besonders wenn das Ziel jemandem anderen die Schuld für den Schlag geben kann. Haben wir erwähnt, dass das eine hervorragende Ablenkung sein kann?
item.climbing_gear_prep.desc=Dieser bezaubernde Karabiner ist keine gewöhnliche Kletterausrüstung. Er ist das Geheimnis des Kletterns ohne jede Kletterausrüstung. Die Aktivierung dieses Erzeugnisses besteht einfach aus Berühren und Sprechen. Wenn du eine Oberfläche berührst und "Kletterzeit" sagst, können deine Hände und Füße (und Knie und Ellenbogen) daran haften, sodass das Klettern leichter wird. Diese mystische Haftung wird nicht von gewöhnlicher Kleidung, Handschuhen oder Schuhen behindert, aber sperrigere Panzerung verhindert bei den von ihr bedeckten Körperteilen wie Ellenbogen oder Knien den notwendigen Kontakt. Man kann die Verbindung sogar benutzen, um kopfüber an einer Oberfläche zu hängen, die das Gewicht tragen kann. Das Erzeugnis macht zwar das Klettern leichter, verschafft dir aber nicht das Wissen oder die Fertigkeiten, die dir dabei nützen.
item.cold_as_ice.desc=Du willst bei einer Party voller Trolle und Zwerge angeben? Hier ist dein Ticket. Zerreiß es, sag die magischen Worte, und plötzlich rinnt Eis durch deine Adern. Nicht buchstäblich - das würde dich umbringen -, aber du kannst mit einem einfachen gemurmelten Auslöser deutlich cooler werden als die anderen in deiner Umgebung. Diese Erzeugnisse wurden ursprünglich für Militärangehörige vermarktet, die eine Entdeckung durch feindliche Wärmebilder vermeiden wollten. Jetzt werden sie der allgemeinen Öffentlichkeit angeboten, damit die Leute eine Party mit ein bisschen cooler Magie heißer machen können.
item.deep_breath_disc.desc=Diese winzige runde Oblate bietet sprudelnd frischen Atem, der nicht nur den Mund erfrischt, sondern das Blut auch mit manageschaffenem Sauerstoff füllt. Das Erzeugnis erlaubt es, länger die Luft anzuhalten, schützt dich vor hässlichen inhalierten Toxinen und erlaubt vor allem hübsche, tiefe Freitauchgänge.
item.free_dive_deep_breath_mask.desc=Diese Vollgesichtsmaske bietet mehrere Einschübe für Atemoblaten und einen kleinen Hebel, mit dem man sie in den Mund gleiten lassen kann. Mit der Maske wird eine Atemoblate mitgeliefert, weitere müssen extra bezahlt werden. Damit kann man tauchen ohne sich den lästigen Risiken des Gerätetauchens auszusetzen.
item.disco_distraction.desc=Diese praktische kleine Discokugel lässt dich einen Ort auswählen und mit den Worten "Disco stirbt nie" diesen Bereich mit allen möglichen ablenkenden und nervigen Effekten füllen, die alle mit der Discowelle des letzten Jahrhunderts zu tun haben. Das ist zwar ein Nischenphänomen, aber die Magie funktioniert. Jeder wird abgelenkt, wenn er Stayin' Alive hören muss, während er genau das versucht.
item.doctors_right_hand.desc=Dieser Handschuh, den es in verschiedenen Farben und Stilen gibt, ist eine schnelle, einfache Möglichkeit, herauszufinden, warum dein bester Kumpel aus allen Löchern blutet. Wenn er dem Ziel nahe ist, sag "Scan aktivieren", und schon weißt du, wann du abhauen oder dem Patienten raten solltest, weniger Schwermetall zu sich zu nehmen.
item.dont_piss_off.desc=Dieses Pulver kann über Nahrung gestreut werden, sodass die Person, die sie isst, gegen absolut alles allergisch wird! Das ist ein gemeiner kleiner Trick, eines dieser Güter, die für den Verkauf in Konzern- oder nationalen Rechtssystemen gewisse Veränderungen in den Geschäftsbedingungen verlangen. Es ist ganz einfach: Du streust das Pulver auf das Essen, sprichst die besonderen Worte ("Ist das ein Ausschlag?"), und wenn das verseuchte Essen gegessen wird, tritt die Wirkung ein.
item.door_what_door.desc=Aus dem Handgelenk wird die Flüssigkeit in dieser Phiole auf eine Tür gespritzt, und schon ist die Tür weg. Die Wirkung ist auf Türen begrenzt, aber Material oder Bauart der Tür spielen keine Rolle für die Einsetzbarkeit. Natürlich ist Plasstahl widerstandsfähiger als Holz, aber das lässt sich mit einem ausreichend starken Erzeugnis regeln. Der Einsatz des Erzeugnisses benötigt eine Nebenhandlung zum Öffnen der Phiole und Verspritzen der Flüssigkeit, was zusammen den Gesten-Auslöser bildet.
item.dream_weaver.desc=Wolltest du immer schon der Mann, die Frau, die Person in jemandes Träumen sein? Genau dazu ist dieses Erzeugnis da. Berühre den Traumweber, stelle eine geistige Traum- oder Albtraummenagerie zusammen, die das Ziel genießen kann (oder auch nicht), sage "Concrete Dreams" und implantiere nächtliche Vorgänge direkt in seinen Schlaf. Ja, das Ziel muss schlafen, damit dieses Erzeugnis funktioniert.
item.drop_it.desc=Dieser kleine Favorit jeder Party erlaubt exzellente Streiche mit fast garantiertem Erfolg und ist dabei vollkommen harmlos. Der Zauber lässt ein Objekt, das du siehst, sich tausend Grad heiß anfühlen. Der Reflex wirkt, noch bevor das Gehirn Zeit hat, sich irgendwelche Fragen zu stellen. Wähle einfach ein unbelebtes Objekt aus, das du jemanden in der Hand halten siehst. Wenn du es im Blick hast, berühre das kleine Eisen, sage "Heiß wie Feuer" und genieße den Slapstick eines fallen gelassenen Kommlinks, Glases oder anderen Gegenstands.
item.duvall_special.desc=Einige Zeilen bleiben einer Kultur erhalten, auch wenn das Pop-Phänomen, das sie hervorgebracht hat, schon ein Dutzend Remakes erlebt hat. Dieses Erzeugnis ist zu Ehren von Robert Duvall benannt, der die berühmte Zeile von sich gab: "Ich liebe den Geruch von Napalm am Morgen!" Die Aktivierungsworte "Riecht nach Sieg" sind eine kleine Hommage an eine folgende Zeile und die zerstörerische Macht dieses Zaubers. Dieses Erzeugnis sieht aus wie ein schmaler Zylinder mit spitzen Enden, in den ein Emblem mit Schild und Pferd geritzt ist. Das Erzeugnis muss mit einer Probe auf Athletik + Geschicklichkeit (1) ins Zielgebiet geworfen werden. Misslingt die Probe, trifft der Zylinder nicht (wenn gewünscht, kann dafür das Abweichungsdiagramm, SR6, S. 118, eingesetzt werden) und explodiert nicht in einem Flammenmeer. Das Erzeugnis wird bei einem Fehlwurf nicht verbraucht und kann geborgen werden, der Zauber ist aber bereits auf das Zielgebiet eingestimmt und muss dort mit einem erfolgreichen Wurf eingesetzt werden. Das Erzeugnis kann nirgendwo anders benutzt werden.
item.emergency_exit.desc=Ein seltsames Erzeugnis, aber manchmal muss man sich auf das Schlimmste vorbereiten. Niemand will aus einem Fenster im dritten Stock springen, aber manchmal gibt es echte Notfälle (und da geht es nicht um schlechte P2Match-Dates). Wenn es dazu kommt und du ohne Vorplanung diesen Sprung machen musst, ist dieses kleine Federamulett um den Hals das, was du brauchst. Berühre es, sage "Schweb", und die Magie fängt an zu wirken. Das ist wirklich ein Erzeugnis für Notfälle, und die Magie wirkt schneller, als man meinen sollte. Achtung vor einem Peitschenschlagsyndrom bei abrupt gebremsten Stürzen.
item.finger_of_death.desc=Nie war es so tödlich, jemandem den Stinkefinger zu zeigen. Dieser unauffällig aussehende Gummifinger kann einem Ziel gegeben oder in dessen Tasche geschmuggelt werden; dann kommt das verbale Kommando "Verpiss dich!". Der Zauber, der im Finger gespeichert ist, wird 12 Sekunden (4 Kampfrunden) nach dem Aussprechen des Kommandos ausgelöst. Dadurch kannst du dich etwas entfernen, eine Show abziehen und vor allem der Verwirrung durch die Folgen des Zaubers entgehen. Wenn du und das Ziel noch in Kontakt (bis zu 10 Zentimeter Entfernung) mit dem Finger sind, trifft der Zauber einen von euch beiden, der zufällig (gerade/ungerade auf 1W6) bestimmt wird.
item.firestick.desc=Wie viele moderne Erzeugnisse sieht auch dieses aus wie ein Zauberstab, der aber nicht wirklich voraussetzt, dass der Benutzer mit ihm herumwedelt wie ein Wizkid. In diesem Fall ist der "Zauberstab" ein 20 Zentimeter langes Plastikteil mit Flammenornamenten. Der Einsatz des FireStick benötigt einen Standardablauf: den Stab berühren, das Ziel anstarren und das Kommando "Burn, baby, burn" sprechen.
item.float_switch.desc=Du wolltest immer schon mal fliegen können? Oder den vollen Aufzug vermeiden? Besorg dir einen von diesen Schaltern, und du kannst zu deinem Balkon hoch- oder von ihm herunterschweben. Wie der Name andeutet, sieht das Erzeugnis aus wie ein Kippschalter, den man in der Hand hält. Man schaltet nach oben, sagt "Auf, auf und davon" und aktiviert damit den Zauber. Achte darauf, dass die Wirksamkeit noch zum Landen reicht - wenn der Zauber zwanzig Meter über dem Boden abbricht, ist das nicht schön.
item.four_eyes.desc=Der Erbsenzähler lässt dich alle Details eines einzelnen Objekts oder kleinen Bereichs erfassen, aber diese Brille ermöglicht dasselbe für einen größeren Bereich. Musst du die Waffen, Schlägertypen oder auch nur die Tische in einem Raum zählen? Dann ist das dein Erzeugnis der Wahl. Diese Brille wird normal getragen, muss aber mit den Worten "Bild einfrieren" berührt werden. Mit der Aktivierung wird ein Bild analysiert, das der Benutzer gerade sieht; was sich außerhalb des Sichtfelds befindet, wird nicht beachtet. Wenn man sich aber einen oder zwei Meter bewegt und wieder hinsieht, kann man mehrere Perspektiven zu einer Art 360-Grad-Bild vereinen.
item.frigid_lance.desc=Dieses Erzeugnis wird in begrenzten Stückzahlen produziert und erfordert passende Lizenzen. Der Einsatz wird von den Behörden vor Ort geregelt. Wir haben ausschließlich offensive Einsatzmöglichkeiten für dieses Erzeugnis erkannt und müssen daher Produktion und Verkauf ähnlich wie bei Handfeuerwaffen reglementieren - wenn es also erlaubt ist, eine Pistole zu tragen, sollte dieses Erzeugnis in derselben Gegend ebenfalls gestattet sein. Das Aktivieren erfordert den Kontakt mit dem Erzeugnis (einem Kristall von zehn Zentimetern Länge), die Auswahl eines einzelnen Ziels und das Wort "Gefrierbrand".
item.frigid_rain.desc=Stell dir Hagel vor, der spitz statt kugelförmig ist. Das ist die vorteilhafte Wirkung dieses Erzeugnisses. Es wird gesetzlich ähnlich betrachtet wie kleine automatische Waffen, daher muss man die örtliche Gesetzgebung beachten, um keine Schwierigkeiten zu bekommen. Das Erzeugnis sieht aus wie eine kleine Glaskugel voller scharfer Kristalle. Um den Zauber zu aktivieren, muss ein Bereich im Blickfeld ausgewählt werden, auf den die Eisscherben fallen sollen. Die Kugel wird auf den Boden geschleudert (nah oder weit entfernt spielt keine Rolle; ein dramatisches Zerspringen ist typisch, aber nicht notwendig), man sagt "Der Winter kommt", und der Bereich wird plötzlich mit rasiermesserscharfen Eisdolchen erfüllt, die sich schnell bewegen.
item.gap_in_their_shields.desc=Magische Verteidigungsmaßnahmen wie Hüter und Manabarrieren können wirklich unangenehm sein, und man kann sie nicht immer überwinden. Wenn man eine freie Sichtlinie braucht, kann diese kleine Spraydose genau das sein, was man braucht. Das Erzeugnis darin wurde speziell dafür entworfen, bei Kontakt mit der Luft und einer magischen Barriere aktiviert zu werden und ein kleines Fenster zu schaffen, um ein freies Blickfeld zu bekommen und zu sehen, was auf der anderen Seite liegt, ohne die Barriere zu zerstören und den Besitzer zu warnen.
item.get_into_rythm.desc=Diese praktische kleine Pfeife erinnert an die Flöte des Rattenfängers, nur dass sie eher eine kleine Melodie als einen hypnotischen Soundtrack ertönen lässt. Wähle eine kleine Gruppe aus, pfeife eine bestimmte Melodie, und alle tanzen plötzlich dazu. Das kann lästig sein, ist aber auch großartig für Events, Flashmobs und andere öffentliche Aufführungen geeignet. Ob es um eine Tanzvorführung, eine Show oder einfach einen coolen Spaziergang geht - dieses kleines Ding lässt alle in den Rhythmus einfallen.
item.go_juice.desc=Mach eine Flasche mit Schnellsaft auf, nimm einen Schluck, und dann geht's los - und es geht schnell los! Der Zauber wird durch den Kontakt mit Speichel aktiviert. Dann musst du dich bewegen, und schnell bewegen.
item.i_am_that_good.desc=Es ist nicht nett, mit den Emotionen anderer zu spielen, aber es ist auch übel, vor einer Menge von "Fans" auf der Bühne zu sein, die sich nicht für die Vorgruppe interessieren. Musiker und Künstler kaufen dieses kleine Ding, um das Publikum in den richtigen Gemütszustand zu versetzen. Das ist ein bisschen manipulativ und in einigen Rechtssystemen nicht erlaubt, aber die meisten Konzerne erlauben es. Ein paar Konzerne gehen sogar so weit, ein Lokal für einen Tag zu kaufen, um ihren Gesetzen dort Gültigkeit zu verschaffen und ihren Künstlern alles zu erlauben, was sie wollen. Halt die kleine Münze mit den Theatermasken in der Hand, wähle einen Teil der Menge (meistens direkt vor der Bühne), überlege, was sie fühlen sollen, schnipse die Münze in die Luft, sage "Ich bin, was ich bin" und tritt ins Rampenlicht!
item.infostick.desc=Magie und Technologie passen nicht immer zusammen, aber dieses Erzeugnis verschafft seit Jahren für einen kurzen Augenblick einen tieferen Einblick ohne intensive Tiefenanalyse. Zu den häufigsten Einsatzgebieten gehört die Analyse von Bomben, besonders solchen, die in manipulationssicheren Behältern verborgen sind. Jetzt kann sich jeder diese Informationen holen und endlich herausfinden, was die Silberscheibe wirklich ist, von der sein Großvater sagt, sie wäre zu seiner Zeit "echt heiß" gewesen. Der InfoStick sieht wie ein Standard-Dongle aus, muss aber zur Benutzung nicht eingesteckt werden. Man berührt den Dongle und das zu analysierende Gerät, sagt "Bootscan starten" und macht sich auf den Datenfluss bereit. Den InfoStick gibt es in verschiedenen Güteklassen - je komplexer ein Gerät ist, desto schwieriger sind die Details zu erkennen. Mit dem fortgeschrittenen Modell kann der Benutzer alles von der Steinschleuder bis zum modernen Kommlink analysieren. Die Elite-Version ist teuer, kann aber angeblich ein Evo Magdrive erklären, und das ist Monaden-Supertech.
item.instant_decorator.desc=Wie oft schon wolltest du deinem Heim den richtigen Look zur richtigen Zeit verpassen? Dieses Erzeugnis ist genau das Richtige, wenn du eine Party schmeißen, besondere Freunde einladen oder einfach ein bisschen Urlaub zu Hause machen willst. Du kannst dein Heim genau so aussehen lassen, wie du willst. Du musst nur das richtige Erzeugnis für die richtige Größe auswählen, weil unterschiedliche Hefte mit unterschiedlich großen Wohnungen fertigwerden. Die Veränderung ist leicht zu bewerkstelligen. Du wählst die Umgebung aus, die du verändern willst, berührst das Heft, das du benutzen willst, sagst "Renovieren" und genießt das neue Aussehen. Wichtig ist hier "Aussehen" - nichts, was von dem Zauber erschaffen wird, funktioniert. Achte also darauf, nur Dinge zu verändern, die nur optisch wirken müssen.
item.instant_garden.desc=Das Erzeugnis Pflanzen-Superfood in einem kompletten Garten einzusetzen, wäre langsam und ineffizient, daher bringt diese verbesserte Variante schnelle Lösungen für größere Bereiche. Die Wachstumseffekte sind bemerkenswert ähnlich, wirken aber in einem größeren Bereich. Die Methoden ähneln sich, nur dass man hier einen Vegetationsbereich statt einer einzelnen Pflanze auswählt. Nachdem du den Bereich ausgewählt hast, berühre das kleine Heft und sage "Herrlicher Garten". Das Resultat ist ein plötzliches, rasches Wachstum jeglicher Vegetation im gewählten Bereich. Man braucht ein bisschen Übung damit, wenn man vermeiden will, dass fruchttragende oder blühende Pflanzen überreife Ergebnisse produzieren. Einige Leute schlagen sogar den Einsatz dieses Erzeugnisses in Kombination mit gewissen Samen im selben Bereich vor, wenn man ein Gebiet mit etwas Bestimmten bepflanzen will.
item.instant_ice_rink.desc=Hattest du schon mal an einem heißen Sommertag, oder wenn keine gute Eisfläche in der Nähe war, das Bedürfnis nach Eislaufen oder Eishockey? Das ist dein Glückstag. Dieses Erzeugnis gibt es in verschiedenen Stärken mit unterschiedlichen Auswirkungen. Der Gegenstand hat die Form eines blaustichigen Knicklichts. Darin wartet das Erzeugnis darauf, mit der chemischen Mischung in Kontakt zu kommen, die für fünfzehn Minuten eine mildes blaues Licht erzeugt und auch den Zauber aktiviert. Du musst mental einen Ort auswählen, an dem die Eisfläche entstehen soll, bevor du das Knicklicht auslöst. Wenn du abgelenkt wirst oder keinen Ort auswählen kannst, aktiviert sich der Zauber direkt unter dir, was vielleicht zu einem interessanten Rutsch über einen nahen Vorsprung führen kann.
item.instant_makeover.desc=Du hast nicht die Zeit für einen Wellness-Tag oder ein paar Stunden in einem Stuhl, bis Make-up und Haare fertig sind? Verschaff dir eine Express-Typveränderung. Dieses Erzeugnis wird in großem Umfang von unseren Klienten aus der Trideo- und Simsinn-Branche genutzt, um schnell und effizient Haar und Make-up zu ändern. Bräute und Bräutigame sind ebenfalls begeistert davon. Der Einsatz eines Spiegels in dem Erzeugnis ist ein bisschen banal, aber Einfachheit hat ihre Vorzüge. Komm mit dem Spiegel in Kontakt (ihn vor dein Gesicht zu halten zählt dafür, ist aber nicht nötig), stelle dir den gewünschten Look vor (dabei kann ein Blick in den Spiegel helfen), sage dann "Spieglein, Spieglein" und zeichne ein Pentagramm in die Luft oder auf den Spiegel. Die Wirkung tritt sofort ein.
item.instant_outfit.desc=Du brauchst im Handumdrehen ein neues Outfit? Du möchtest keine Extrakleidung für ein schnelles Meeting mitschleppen? Du willst wirklich wie Siren Stormblade aussehen, bist aber im Cosplay nicht gut genug? Dann brauchst du diese kleine purpurne Pille. Du musst nur die Pille in den Mund schieben und dir das Outfit deiner Träume vorstellen. Die Wirkung ist keine Illusion: Die Kleidung wird physisch verändert, was die möglichen Outfits ein bisschen einschränkt. Denk daran, wenn du wie Stormblade aussehen willst, weil ihr Schulterpanzer allein voluminöser als die meisten Trenchcoats ist und das Erzeugnis seine Grenzen beim Verändern physischer Massen hat.
item.instant_rejuvenation.desc=Das ist die richtige Pille, bevor man zu einem wichtigen Treffen muss, wenn man bis morgens früh gefeiert hat. Wirf sie dir ein, lass sie zergehen und spüre das reinigende Leuchten, während dein perfekte Selbst zum Vorschein kommt. Das wird den Kater zwar nicht vertreiben, aber es lässt dich gut aussehen, während du über den Schmerz hinweggrinst.
item.instant_shield.desc=Du brauchst ein bisschen Schutz, würdest aber eine klobige Panzerjacke nicht mal dann anziehen, wenn dein Leben davon abhinge? Dieser kleine Glücksbringer kann dich im Handumdrehen schützen. Der kleine Schild (auf Wunsch mit Wappen, und in manchen Gegenden ist das Nachahmen von Polizeiabzeichen erlaubt) muss nur in körperlichem Kontakt mit dir sein, wenn du "Schilde hoch" sagst. Die Schutzwirkung des Erzeugnisses kann unterschiedlich sein, aber sie ist besser als nichts.
item.instant_wall.desc=Dieser kleine Ziegel ist nicht groß, hat aber eine große Wirkung. Oder kann zumindest eine große Wirkung haben, wenn jemand dich treffen will, nachdem du plötzlich eine funkensprühende Wand aus Energie erschaffen hast. Um das Erzeugnis auszulösen, berühre den Ziegelstein, wähle wie üblich den Ort der Wirkung aus, sag "Stein auf Stein" und genieße die Trennung zwischen dir und dem, was du nicht an dich heranlassen willst.
item.instant_window.desc=Dieser Zauber wird an Eltern vermarktet, die die Aktivitäten ihrer Kinder überwachen wollen. Man klappt den Rahmen auf, legt ihn an eine Oberfläche, sagt "Volle Transparenz", und - zack - der Zauber wird aktiv, und man kann sehen, was hinter der Oberfläche ist. Wenn es dort allerdings vor dem Wirken des Zaubers dunkel war, ist es danach immer noch dunkel. Dieses Erzeugnis hat verschiedene Stärken, weil es unterschiedlich schwierig ist, unterschiedliche Oberflächen transparent zu machen. Manche Nutzer haben gerne mehrere Varianten parat, um für mehrere Umstände vorbereitet zu sein.
item.its_not_paranoia.desc=Das Erzeugnis ist ein schmaler schwarzer Ring, der unter der Kampfausrüstung getragen werden kann und im Moment in großem Umfang für Polizei, Sicherheitsleute und Militär vermarktet wird. Das Marketing konzentriert sich darauf, ein Team psychisch auf ein Einschleichen oder Eindringen vorzubereiten. Damit das leise geht, muss der Ring nur getragen oder in der Tasche mitgeführt werden, und eine kleine Geste dient zur Aktivierung des Erzeugnisses (die Standardgeste ist ein schnelles Berühren mit allen fünf Fingern hintereinander). Mit dieser kleinen Handlung wird der Träger besser darauf vorbereitet, was sich ihm entgegenstellt.
item.lie_detector.desc=Ergebnisse dieses Gerätes sind vor Gericht nicht zugelassen, aber reiche Execs, die ihren Kindermädchen einen Vorteil verschaffen wollen, geben ihnen dieses kleine Schmuckstück, damit sie es im Kampf gegen rebellische Teenager (und jüngere Kinder) ein bisschen leichter haben. Um diesen arkanen Polygraphen zu aktivieren, berühre das Ziel mit dem facettenreichen Kristall und halte dabei die Silberkette. In Kontakt mit einer Aura leuchtet der Kristall, was die Verbindung anzeigt. Um den Zauber aktivieren, sage: "Sei ehrlich." Der Kristall leuchtet und verändert die Farbe bei jeder Frage, aber eine Lüge erkennt man daran, dass sich die Temperatur der Silberkette verändert. Sie wird kurz warm, wenn eine Unehrlichkeit erkannt wird.
item.long_range_headphones.desc=Diese kleinen Ohrstöpsel sind mit etwas verbunden, das wie ein Kabel aussieht, in Wirklichkeit aber ein Draht aus Orichalkum (Teil der Formel) ist. Damit sie funktionieren, werden sie ins Ohr gesteckt, dann sagt man: "Ich kann die Luft hören." Wenn die Kopfhörer aktiv sind, kannst du einen Ort auswählen, an dem du hören kannst, als würdest du mit deinen ganz gewöhnlichen Ohren dort sein. Mit ein bisschen Konzentration kannst du den Ort verschieben, damit du genau das Richtige hörst - besonders, wenn sich deine Ziele bewegen. Die meisten Leute sind bei der Wahrnehmung mit dem Gehör nicht so gut wie mit dem Gesichtssinn, aber man kann damit hervorragend jemanden belauschen - Feinde im Hinterhalt erkennt man damit eher nicht.
item.long_range_legerdemain.desc=Das ist das zusätzliche Paar Hände, die sich um Aufgaben in der Ferne kümmern können. Du willst deinen Griff in eine Schlucht oder auf eine Klippe reichen lassen, um dort etwas zu tun, ohne klettern zu müssen? Besorg dir dieses Erzeugnis. Egal, worum es geht - das Erzeugnis erschafft ein Paar Hände, die du in der Ferne einsetzen kannst, sobald du einen Einsatzort ausgewählt hast. Dieses Erzeugnis sieht aus wie ein Paar gefalteter Hände. Um es zu aktivieren, musst du in Kontakt mit dem Gegenstand sein (es in der Tasche oder an einer Halskette zu tragen genügt), dann wählst du einen Ort aus und sagst: "Viele Hände, schnelles Ende." Danach musst du dich auf die Tätigkeit konzentrieren, die deine Hände durchführen sollen. Sie sind von sich aus nicht besonders geschickt oder gewandt; die Fingerfertigkeit muss von dir kommen, und die Geschicklichkeit ist auf Entfernung immer so eine Sache.
item.long_range_lenses.desc=Ferngläser sind nett, aber wie wäre es, wenn man damit um Ecken oder durch Mauern sehen könnte? Um die Linsen zu aktivieren, setz sie auf und sage: "Gib mir mehr als nur Sicht." Dann bewege mit ein wenig mentalem Aufwand den Bereich, den du sehen möchtest. Du kannst damit keine coole Bodytech einsetzen, aber du kannst wenigstens den Blickwinkel um eine Ecke oder in ein Gebäude verlegen, ohne dorthingehen zu müssen.
item.louisville_slumberer.desc=Der Schlummerknüppel ist ein Miniatur-Baseballschläger, ähnlich wie ein Souvenir. Das Objekt funktioniert wie ein Zauberstab, man muss damit aber nicht deuten, herumfuchteln oder einen anderen Quatsch machen. Der Benutzer muss nur den Schläger berühren, ein Ziel anstarren, die Worte der Macht sprechen (Standard: "Kein Spaß in Mudville"), und die Magie des Schlägers erledigt den Rest.
item.magic_nozzle_hose.desc=Diese gewöhnlich aussehende Schlauchspritze hält eine ziemlich große Überraschung für alle bereit, die glauben, sie würde eine Wasserquelle benötigen. Einfach auf ein Ziel deuten, das eingewässert werden soll, einschalten, und schon fließt frisches, reines "Manawasser". Mit ein wenig mentaler Vorbereitung und einem schnellen Druck auf den Knopf werden die Person oder der Ort, auf die du eine große Wassermenge abladen willst, mit Wasser durchnässt, dessen Ursprung unbekannt ist. Als Trinkwasserquelle wird das Erzeugnis nicht empfohlen, weil das "Manawasser" schnell nach dem Wirken des Zauber zu existieren aufhört - auch, wenn es sich innerhalb eines Wesens befindet.
item.magic_nozzle_tsunami.desc=Diese gewöhnlich aussehende Schlauchspritze hält eine ziemlich große Überraschung für alle bereit, die glauben, sie würde eine Wasserquelle benötigen. Einfach auf ein Ziel deuten, das eingewässert werden soll, einschalten, und schon fließt frisches, reines "Manawasser". Mit ein wenig mentaler Vorbereitung und einem schnellen Druck auf den Knopf werden die Person oder der Ort, auf die du eine große Wassermenge abladen willst, mit Wasser durchnässt, dessen Ursprung unbekannt ist. Als Trinkwasserquelle wird das Erzeugnis nicht empfohlen, weil das "Manawasser" schnell nach dem Wirken des Zauber zu existieren aufhört - auch, wenn es sich innerhalb eines Wesens befindet.
item.magic_window.desc=Dieses altmodische Monokel erschafft eine kleine astrale Passage. Um diesen Zauber zu aktivieren, lass das Monokel an seiner Kette kreisen. Der Kreis, den es beschreibt, wird zu einer Kugel von einem halben Meter Durchmesser, in der der Astralraum für das mundane Auge sichtbar wird. Der Bereich kann ohne ein neues Aktivieren des Zaubers verschoben werden, um andere Punkte zu sehen. Das erlaubt ausschließlich die Wahrnehmung; nichts kann von einer Ebene zur anderen übergehen.
item.magiczap_marble.desc=Diese Murmel kann einen der beiden Zauber enthalten, die eine ähnliche Wirkung bieten. Die Murmel wird auf ein Ziel, das mindestens einen aktivierten Fokus hat, geworfen oder ihm übergeben. Die Standardversion mit Verdrängen betrifft den Fokus, der der Murmel am nächsten liegt (nach Maßgabe des Spielleiters). Wenn die Plus-Version mit Ektomagischer Impuls benutzt wird, werden alle Foki der Zielperson und Foki innerhalb des normalen Wirkungsbereichs des Zaubers getroffen - auch die von Verbündeten, wenn sie zu nahe sind.
item.magiczap_marble_plus.desc=Diese Murmel kann einen der beiden Zauber enthalten, die eine ähnliche Wirkung bieten. Die Murmel wird auf ein Ziel, das mindestens einen aktivierten Fokus hat, geworfen oder ihm übergeben. Die Standardversion mit Verdrängen betrifft den Fokus, der der Murmel am nächsten liegt (nach Maßgabe des Spielleiters). Wenn die Plus-Version mit Ektomagischer Impuls benutzt wird, werden alle Foki der Zielperson und Foki innerhalb des normalen Wirkungsbereichs des Zaubers getroffen - auch die von Verbündeten, wenn sie zu nahe sind.
item.manabenzoate.desc=Du möchtest eine Leiche frisch halten, bis die Leute von Tamanous endlich ankommen? Du willst deine Pizza frisch halten, bis du zu Hause bist? Das sind nur zwei der Dienste, die dir dieses mystische Pulver leisten kann. Streu diesen Staub über etwas, das frisch bleiben (oder zumindest nicht verwesen) soll, und sage die magischen Worte ("Immer frisch zubereitet").
item.mana_bread.desc=Sieht aus wie Brot, ist aber in Wirklichkeit nicht essbar. Berühre einfach das "Brot" und murmle die Aktivierungsworte ("Schmatz, schmatz, voller Bauch") und Tadaa! Du kannst dir mit Mana den Bauch vollschlagen (für Nachgeschmack oder möglichen Beigeschmack ist der Verkäufer nicht verantwortlich). Dieses wohlschmeckende Nahrungsergänzungsmittel verschafft dir das perfekte Energieniveau, aber Achtung - biologische Reaktionen sind immer noch möglich, selbst mit einem Bauch voll Mana.
item.manadyne_mb_10.desc=Diese Erzeugnisse sind Waffen und werden auch als solche verkauft. Die Straßenjungs müssen jetzt nicht mehr mit ihren Schrottknarren rumschießen, wenn sie an echte Zauberstäbe rankommen. Es erscheint lächerlich, aber Manadyne hat mit der Hilfe einiger strategischer Partner ein paar arkane Barrieren durchbrochen. Die Identität dieser Partner wird fast so streng geheim gehalten wie die Entwürfe dieser Erzeugnisse. Die Zauberstäbe haben eine begrenzte Einsatzzeit und eine begrenzte Zahl an "Ladungen". Der MB-10 verschießt ein Geschoss aus Mana, das nur auf lebende Ziele wirkt. Manadyne ist generell sehr restriktiv beim Lehren der Gesten und Worte, die das Erzeugnis aktivieren. Aber wir haben ein Testmodell gekauft, und es funktionierte nach dem üblichen Ablauf des Auswählens des Ziels, des Ausführens einer Reihe von Drehungen, Wirbel und Schlägen aus dem Handgelenk, des Aussprechens der Aktivierungsworte (in unserem Fall lauteten sie "Zorn des Jupiter", aber wir haben gehört, dass es hier große Unterschiede gibt), und dann lässt man der Magie ihren Lauf. Es war sehr befriedigend für mein inneres Kind.
item.manadyne_pb_10.desc=Diese Erzeugnisse sind Waffen und werden auch als solche verkauft. Die Straßenjungs müssen jetzt nicht mehr mit ihren Schrottknarren rumschießen, wenn sie an echte Zauberstäbe rankommen. Es erscheint lächerlich, aber Manadyne hat mit der Hilfe einiger strategischer Partner ein paar arkane Barrieren durchbrochen. Die Identität dieser Partner wird fast so streng geheim gehalten wie die Entwürfe dieser Erzeugnisse. Die Zauberstäbe haben eine begrenzte Einsatzzeit und eine begrenzte Zahl an "Ladungen". Der PB-10 wirkt, als würde ein magischer Felsbrocken geschleudert, der einen physischen statt eines psychischen Einschlags verursacht. Manadyne ist generell sehr restriktiv beim Lehren der Gesten und Worte, die das Erzeugnis aktivieren. Aber wir haben ein Testmodell gekauft, und es funktionierte nach dem üblichen Ablauf des Auswählens des Ziels, des Ausführens einer Reihe von Drehungen, Wirbel und Schlägen aus dem Handgelenk, des Aussprechens der Aktivierungsworte (in unserem Fall lauteten sie "Zorn des Jupiter", aber wir haben gehört, dass es hier große Unterschiede gibt), und dann lässt man der Magie ihren Lauf. Es war sehr befriedigend für mein inneres Kind.
item.manadyne_mb_100.desc=Die Serie 100 bietet Versionen der Serie 10 mit Flächenwirkung. Auch für diese Gegenstände braucht man in den meisten Gegenden Lizenzen, und in manchen Regionen der Welt sind sie einfach illegal. Wie bei den Modellen für Einzelziele läuft die Aktivierung durch eine Reihe von "arkanen" Gesten und eine Befehlsphrase, aber statt einer einzelnen Person oder eines physischen Ziels wählt man einen Wirkungsbereich aus. Wegen der Wirkung auf einen größeren Bereich sind diese Erzeugnisse noch stärker reglementiert als die der Serie 10. Die Gegenstände sind nicht für die Selbstverteidigung gedacht und werden deshalb kaum an Sicherheitsfirmen verkauft. Sie sollen bei manchen militärischen Spezialkräften im Einsatz sein, sind aber viel zu teuer für die Grundausstattung oder den breiten Einsatz.
item.manadyne_pb_100.desc=Die Serie 100 bietet Versionen der Serie 10 mit Flächenwirkung. Auch für diese Gegenstände braucht man in den meisten Gegenden Lizenzen, und in manchen Regionen der Welt sind sie einfach illegal. Wie bei den Modellen für Einzelziele läuft die Aktivierung durch eine Reihe von "arkanen" Gesten und eine Befehlsphrase, aber statt einer einzelnen Person oder eines physischen Ziels wählt man einen Wirkungsbereich aus. Wegen der Wirkung auf einen größeren Bereich sind diese Erzeugnisse noch stärker reglementiert als die der Serie 10. Die Gegenstände sind nicht für die Selbstverteidigung gedacht und werden deshalb kaum an Sicherheitsfirmen verkauft. Sie sollen bei manchen militärischen Spezialkräften im Einsatz sein, sind aber viel zu teuer für die Grundausstattung oder den breiten Einsatz.
item.mojo_scanner.desc=Wenn man vermutet, dass in einem Gebiet Magie benutzt wurde, und herausfinden will, was passiert ist, ist dieses Erzeugnis ideal. Konzernsicherheit und Detekteien kaufen es, weil sie dann mundanes Personal einsetzen können, das ein paar magische Worte spricht und einen Bericht darüber abliefern kann, welche Magie (wenn überhaupt) gewirkt wurde. Das alles funktioniert, ohne das eigene arkane Personal zu gefährden, sodass man "arkane" Ermittlungen mit mundanen Ressourcen durchführen kann. Der Scanner sieht aus wie ein Kommlink mit aufwendiger Ornamentik in Form altmodischer Schaltpläne. Man berührt das Kommlink (oder tut so, als würde man etwas darauf lesen), berührt Objekt oder Person, deren Aura und arkane Spuren man lesen will, sagt "Enthülle das Ungesehene", fährt auf dem Ziel ein Pentagramm nach und lässt sich vom Wissen der Aura erfüllen. Warnung: Das Erkennen feiner Nuancen in Auren und magischen Signaturen erfordert Training. Wenn man nicht richtig ausgebildet ist, wird es schwierig, gute Beschreibungen zu formulieren.
item.no_job_to_small.desc=Du möchtest dein Arbeitszimmer oder Büro vergrößern? Dafür haben wir etwas. Dieses praktische Erzeugnis sieht wie ein gewöhnlicher Hammer aus, ist aber so viel mehr. Du wählst den Wandabschnitt aus, den du loswerden willst, sagst "Schnellsanierung" und siehst zu, wie die Wand zerbröselt.
item.no_job_to_big.desc=Du möchtest dein Arbeitszimmer oder Büro vergrößern? Dafür haben wir etwas. Dieses praktische Erzeugnis sieht wie ein gewöhnlicher Hammer aus, ist aber so viel mehr. Du wählst den Wandabschnitt aus, den du loswerden willst, sagst "Schnellsanierung" und siehst zu, wie die Wand zerbröselt.
item.one_less_in_the_world.desc=Diese Erzeugnisse sind maßgeschneidert. Sie sind in vielen Gegenden gesetzlich eingeschränkt, weil sie potenziell tödlich sind. Die Benutzung ist einfach: Man wählt ein Ziel, spricht die magischen Worte (für jede Zielart unterschiedlich) und erfreut sich an der Sofortwirkung.
item.pain_stick.desc=Ursprünglich wurde dieser Gegenstand zur Selbstverteidigung vermarktet, aber etliche Scherzkekse erkannten, dass er sich hervorragend für Scherze eignet, weil der Schmerz keinen dauerhaften Schaden verursacht. Der Stab sieht aus wie ein zehn Zentimeter langer zylindrischer Bolzen und muss mit den Worten "Was uns nicht umbringt, macht uns stark" auf das Ziel gerichtet werden. Es muss beim Einsatz dieses Erzeugnisses beachtet werden, dass betroffene Personen Herzprobleme erleiden oder wertvolle Gegenstände fallen lassen könnten.
item.pay_no_attention.desc=Wer einfach nur in Ruhe gelassen werden will, kann mit dieser milchigen kleinen Glaskugel Störungen verhindern. Wähle einen Bereich, berühre die Glaskugel, wähle die Personen (auch dich selbst), die nicht betroffen sein sollen und sag "Weitergehen, hier gibt es nichts zu sehen." Der Zauber erschafft eine kleine Blase des Desinteresses, wo sich niemand wirklich dafür interessiert, was vor sich geht.
item.petspy.desc=Wirf die Pille ein, streichle dein Haustier, und du könntest herausfinden, warum es immer wieder aus dem Haus schleicht. Das Erzeugnis funktioniert bei allen möglichen Haustieren und Kreaturen (und man muss sie auch nicht wirklich streicheln, ein Aurenkontakt genügt), von denen man sich einen Sinn borgen kann. Die meisten Leute entscheiden sich für den Gesichtssinn, aber diese Pille hat bei geschmacksorientierten Personen eine Nische gefunden, die seltsame und exotische Geschmackserlebnisse vom Standpunkt von Tieren aus erleben wollen. Bei der Annäherung an wilde oder gefährliche Tiere muss man vorsichtig sein, und wenn das Tier besonders störrisch ist, funktioniert es vielleicht nicht, aber meistens funktioniert es.
item.plant_superfood.desc=Viele Leute mögen Pflanzen, sind aber furchtbar schlechte Gärtner. Ihnen wird mit diesem Erzeugnis geholfen, das Pflanzenwachstum in erstaunlicher Geschwindigkeit erlaubt und das Auge sofort mit wundervollen, voll ausgewachsenen Pflanzen erfreut. Nach dem Wachstum bleibt die Pflege zwar weiter dir überlassen, aber zumindest für kurze Zeit hast du eine gesunde Pflanze. Wähle einfach eine Pflanze aus, klopfe auf das magische Düngestäbchen, sage "Grüner Daumen" und sieh ihr beim Wachsen zu. Die Wirkung ist von der Pflanzenspezies abhängig, und es wird nicht empfohlen, das Erzeugnis bei alten Bäumen einzusetzen, weil ein paar Monate oder sogar Jahre an Wachstum bei ihnen selten sichtbare Effekte erzielen. Man sollte darauf hinweisen, dass die Pflanzen freiwillige Ziele dieses Erzeugnisses sein müssen; wenn du deinen Farn immer anschreist und gemein zu ihm bist, könnte er dich ignorieren.
item.privacy_pill.desc=Diese kleine, zweiteilige Waffel ist eine elegante Möglichkeit, private Gespräche zu führen oder in einer lauten Bar überhaupt miteinander reden zu können. Die Aktivierung ist einfach: Die beiden Teilnehmer teilen sich die Waffel und essen jeder einen Teil, während sie in Kontakt miteinander sind. Wenn der Zauber wirkt, können sie sich voneinander entfernen, aber sie müssen einander berühren, um die mentale Verbindung zu beginnen.
item.private_eye.desc=In aller Welt wurde dieses kleine Kristallauge verboten - und das mit gutem Grund. Der Zauber, der darin steckt, verletzt Persönlichkeitsrechte. Berühre das Auge, berühre dein Ziel, sag "Wenn ich nur einmal in deiner Haut stecken könnte", und du erschaffst eine psychische Verbindung, die dich seine Sinneseindrücke erleben lässt. Du hast keine Kontrolle über das Ziel, hast aber Zugriff auf dessen fünf Sinne. Das Marketing konzentriert sich auf Privatdetektive, die damit Veruntreuer, untreue Partner und alle möglichen korrupten Personen aufdecken wollen. Die Informationen können nur als Hintergrundinformation oder zur Erpressung benutzt werden, weil sie vor Gericht nicht als Beweismittel zugelassen sind. Wenn man aber ein paar Mal mit dem Opfer unterwegs war, findet sich oft der eine oder andere verwertbare Beweis.
item.private_property.desc=Dieses kleine Warnschild ist ein praktisches Schmuckstück, das andere viel zuverlässiger fernhält als "Betreten verboten" oder "Wir dürfen nicht hinein". Wähle einen Ort, an dem man sich nicht wohlfühlen soll, sprich die Worte "Nicht willkommen", und der Bereich füllt sich mit einem tiefen Gefühl des Unwohlseins, manchmal bis zu echtem Schrecken. Privatgrundstück ist für Ziele mit Bewusstsein gedacht und unterscheidet nicht zwischen Freund und Feind; Haustiere unerwünscht zielt auf einfachere Lebensformen ab - von Insekten bis hin zu Elefanten (es wird nicht empfohlen, Elefanten Todesangst einzujagen).
item.private_property_no_pets.desc=Dieses kleine Warnschild ist ein praktisches Schmuckstück, das andere viel zuverlässiger fernhält als "Betreten verboten" oder "Wir dürfen nicht hinein". Wähle einen Ort, an dem man sich nicht wohlfühlen soll, sprich die Worte "Nicht willkommen", und der Bereich füllt sich mit einem tiefen Gefühl des Unwohlseins, manchmal bis zu echtem Schrecken. Privatgrundstück ist für Ziele mit Bewusstsein gedacht und unterscheidet nicht zwischen Freund und Feind; Haustiere unerwünscht zielt auf einfachere Lebensformen ab - von Insekten bis hin zu Elefanten (es wird nicht empfohlen, Elefanten Todesangst einzujagen).
item.remodeling_ring.desc=Oft steht zwischen Sieg und Niederlage nur eine schlecht platzierte Wand. Dieses Erzeugnis, das in Form eines Rings gestaltet ist, bietet eine sinnvolle Lösung für dieses Problem. Lege eine Hand (mit dem Ring oder während der Ring mit dir in Kontakt ist) an eine Wand, sprich die Aktivierungsworte "Mach ein Loch", und puff! Das Hindernis ist überwunden.
item.remote_slapping_clout.desc=Leg dich mit einem an oder leg dich mit vielen an - mit diesem Erzeugnis kannst du jeden mit einem Schlag zum Duell fordern, den er nicht auf sich sitzen lassen kann. Oder eine lästige Wache flachlegen, die einfach nicht wegschauen will. Der Handschuh kann getragen oder in der Tasche mitgeführt werden. Dann benutzt man das patentierte Manöver "Starren, sprechen, schlagen", um eine Person oder einen Bereich liebevoll zurechtzuweisen.
item.remote_slapping_blast.desc=Leg dich mit einem an oder leg dich mit vielen an - mit diesem Erzeugnis kannst du jeden mit einem Schlag zum Duell fordern, den er nicht auf sich sitzen lassen kann. Oder eine lästige Wache flachlegen, die einfach nicht wegschauen will. Der Handschuh kann getragen oder in der Tasche mitgeführt werden. Dann benutzt man das patentierte Manöver "Starren, sprechen, schlagen", um eine Person oder einen Bereich liebevoll zurechtzuweisen.
item.runflat.desc=Jemandes Reifen aufzuschlitzen, ist so 2052 - besonders seit es so viele Notlaufreifen gibt, für die man eine Dikote-Klinge benutzen müsste. Dieses praktische kleine "Messer" macht das besser, ohne dass man Gefahr läuft, in dieser verdächtigen knienden Haltung erwischt zu werden und behaupten zu müssen, dass man sich die Schuhe zubinden will. Das verbale Kommando ist einfach: Sag "Reifen schlitzen" und - puff! Ein Reifen ist platt, zerfetzt oder mit dem Asphalt verschmolzen, je nachdem, wie groß der magische Druck ist. Mit der Version Auf vier blanken Felgen werden alle Reifen eines gewöhnlichen Bodenfahrzeugs gleichzeitig zerstört.
item.runflat_four.desc=Jemandes Reifen aufzuschlitzen, ist so 2052 - besonders seit es so viele Notlaufreifen gibt, für die man eine Dikote-Klinge benutzen müsste. Dieses praktische kleine "Messer" macht das besser, ohne dass man Gefahr läuft, in dieser verdächtigen knienden Haltung erwischt zu werden und behaupten zu müssen, dass man sich die Schuhe zubinden will. Das verbale Kommando ist einfach: Sag "Reifen schlitzen" und - puff! Ein Reifen ist platt, zerfetzt oder mit dem Asphalt verschmolzen, je nachdem, wie groß der magische Druck ist. Mit der Version Auf vier blanken Felgen werden alle Reifen eines gewöhnlichen Bodenfahrzeugs gleichzeitig zerstört.
item.satans_nut.desc=Dieses Erzeugnis sieht wie eine große Radmutter auf einem dunkelroten Bolzen aus. Der Auslöser wird mit einer schnellen Drehung aktiviert, die das Siegelwachs über einer dünnen Schwefelschicht bricht, dann folgen die Worte "Hell's Bells". Wenn die Mutter gedreht wurde, wirft der Benutzer das ganze Ding an den Explosionsort, den er haben möchte. Das Erzeugnis muss mit einer erfolgreichen Probe auf Athletik + Geschicklichkeit (1) ins Zielgebiet geworfen werden. Misslingt die Probe, trifft das Erzeugnis nicht (wenn gewünscht, kann dafür das Abweichungsdiagramm, SR6, S. 118, eingesetzt werden) und explodiert nicht als Inferno. Das Erzeugnis wird bei einem Fehlwurf nicht verbraucht und kann geborgen werden, der Zauber ist aber bereits auf das Zielgebiet eingestimmt und muss dort mit einem erfolgreichen Wurf eingesetzt werden. Das Erzeugnis kann nirgendwo anders benutzt werden.
item.secret_handshake.desc=Finde einen Bekannten, eröffne das Treffen mit einem einfachen Handschlag, aktiviere das Erzeugnis mit den kurzen Worten "Das Treffen ist eröffnet", und plötzlich kann niemand mehr diese Unterhaltung belauschen. Sprich über pikante Details gemeinsamer Erlebnisse oder tausche Insiderinformationen über den Aktienmarkt aus. Alles, was du sagst, bleibt zwischen dir und den anderen Gesprächsteilnehmern, und alle Außenstehenden erfahren etwas vom örtlichen Wetter, der tragischen Geschichte eines vermissten Hündchens oder viele Beschwerden über eine schwere Kindheit.
item.secret_handshake_cant.desc=Finde mehrere Bekannte, eröffne das Treffen mit einem einfachen Handschlag, aktiviere das Erzeugnis mit den kurzen Worten "Das Treffen ist eröffnet", und plötzlich kann niemand mehr diese Unterhaltung belauschen. Sprich über pikante Details gemeinsamer Erlebnisse oder tausche Insiderinformationen über den Aktienmarkt aus. Alles, was du sagst, bleibt zwischen dir und den anderen Gesprächsteilnehmern, und alle Außenstehenden erfahren etwas vom örtlichen Wetter, der tragischen Geschichte eines vermissten Hündchens oder viele Beschwerden über eine schwere Kindheit.
item.sizzler.desc=Dieser geätzte rote Ball ist etwa so groß und schwer wie ein Lacrosse-Ball und birgt riesige Gefahr in sich. Flüstere das Kommando "Große Feuerbälle" und wirf den Ball an den Punkt, wo du die Eruption haben möchtest. Ein Lacrosse-Stab kann zusätzliche Weite und Geschwindigkeit verschaffen. Das Erzeugnis muss mit einer erfolgreichen Probe auf Athletik + Geschicklichkeit (1) ins Zielgebiet geworfen werden, sonst verfehlt der Ball (wenn gewünscht, kann dafür das Abweichungsdiagramm, SR6, S. 118, eingesetzt werden) und explodiert nicht in einem Feuerball. Der Brutzler wird bei einem Fehlwurf nicht verbraucht. Er kann geborgen und wieder geworfen, aber nirgendwo anders eingesetzt werden. Der Zauber ist eingestimmt und wartet darauf, im Zielgebiet einzuschlagen.
item.sleeping_powder.desc=Dieses Pulver wird um ein Ziel herum in die Luft oder in sein Gesicht geworfen, während das Kommando "Gute Nacht" gesprochen wird. Die Zauberwirkung betrifft nur das Zielindividuum und wird durch Gasmasken oder Chemische Isolierung nicht verhindert oder geschwächt. Das Pulver muss nur Kontakt mit der Aura bekommen.
item.slowing_competition.desc=Betrügen oder das Schwächen des Gegners sind Standardmethoden in Konzern- und militärischen Konflikten. Dass dafür auch ein alchemistisches Erzeugnis geschaffen wurde, ist nicht überraschend. Wenn diese Erzeugnisse hergestellt werden, wird jeweils ein bestimmtes Pulver zusammengemischt, um einen bestimmten Aspekt des Ziels zu schwächen. Manche machen das Ziel körperlich schwächer oder langsamer, andere machen es mental leichter zu beeinflussen oder weniger aufmerksam. Kaufe die richtige Mischung für den Job und setze sie ein. Das geht recht einfach. Man muss das Ziel dazu bringen, das Pulver in den Mund zu nehmen. Das Erzeugnis aktiviert sich bei Kontakt mit Speichel. Man kann es also auf Essen oder in ein Getränk streuen.
item.spell_shield.desc=Wenn das Mana durch die Luft fliegt, ist man mit diesem praktischen Ding auf der sicheren Seite. Das Erzeugnis sieht wie eine Miniatur-Glaswand aus. Um den Zauber zu aktivieren, muss ein Muster aus neun Strichen darauf beschrieben werden; das Kommando ist "Arkaner Schutz".
item.snack_stoppers.desc=Diese praktischen Pillen beseitigen das Verlangen nach Nahrung und geben dir ein angenehmes Sättigungsgefühl, ohne dass du zum nächsten Stuffer Shack gehen musst. Ursprünglich wurden sie entwickelt, um Konzerntruppen das Gepäck leichter zu machen. Inzwischen sind sie auf dem zivilen Markt zu haben, um den Leuten zu helfen, die dem nächtlichen Heißhunger schwer widerstehen können, der diese lästigen Pfunde erzeugt.
item.stump_remover.desc=Es ist ziemlich anstrengend, den Stumpf eines gefällten Baumes aus der Erde zu holen. Dieses Pulver lässt den lästigen Stumpf (oder anderes organisches Material) zu feinem Mehl oder einer Schleimpfütze zerfallen. Wie bei den meisten Erzeugnissen in Pulverform muss man das Ziel nur bestreuen, die magischen Worte "Sicherer als Dynamit" murmeln und dann nur noch warten, bis die Magie das Problem verschwinden lässt.
item.strain_breaker.desc=Manchmal tun Treffer viel zu lange nachher noch weh. Wenn das Feuer weiterbrennt, das Gift weiter für Übelkeit sorgt, die Kälte weiter in den Knochen steckt oder irgendein anderes Leiden zuschlägt, ist dieses geätzte weiße Stäbchen die Lösung. Komm mit der Aura des Ziels in Kontakt, hol das Stäbchen heraus, zerbrich es, sag "Auf dem Weg der Besserung", und wusch - das Problem ist gelöst.
item.super_epipen.desc=Das Erzeugnis sieht vielleicht aus wie ein typischer Adrenalin-Injektor für Notfälle, ist aber ein Upgrade. Als arkane Alternative sorgt das Gerät mit seiner kleinen Nadel für ein wenig Blut zur Aktivierung und hält Allergien unter Kontrolle, bis die Magie endet. Dieses Erzeugnis ist für den einmaligen Einsatz gebaut, chemisch völlig unbedenklich und verkauft sich hervorragend bei Allergiebewussten und denen, die ohne Sorgen um lästige allergische Reaktionen essen gehen wollen.
item.superbinder.desc=Meistens ist stärkerer Klebstoff besser, aber dieses Werkzeug kann im Notfall schnell helfen oder beeindruckende Streiche ermöglichen. Man wählt die Oberfläche oder die Oberflächen aus, die haften sollen, berührt sie und sagt "Wie festgeklebt." Achtung: Superverbinder gibt es in verschiedenen Stärken für unterschiedliche Substanzen. Wegen der schwierigen Interaktion zwischen Magie und Technik sind komplexere oder stark verarbeitete Substanzen schwerer zusammenzukleben. Wenn eine besonders starke Verbindung vor dem Ablauf des Zaubers getrennt wird, kann das zu Struktur- oder bei Lebewesen zu Gewebeschäden führen.
item.sway_the_masses.desc=Manchmal wird der Floor einfach nicht voll oder ein Event hat einfach zu wenig Drive. Das ist der subtile Touch, der von vielen Clubbesitzern gekauft wird, um alle in Partylaune (und zum Geldausgeben) zu bringen. Es gibt einige Rechtssysteme, in denen der Einsatz des Erzeugnisses in der Öffentlichkeit verboten ist, aber in vielen ist er erlaubt, also bleibt subtil und lasst euch nicht erwischen. Wenn es Zeit wird, die Laune zu verändern, berühre die Statuette (zwei Personen, die einander zugewandt die Arme mit den Händen auf der Schulter überkreuzen), wähle einen Bereich aus, den du dem Zauber unterwerfen willst, kreuze die Arme vor der Brust, breite sie aus und kreuze sie wieder vor der Brust und sag dann "Sorgt für Stimmung."
item.trade_in_tonic.desc=Du willst deine Karre aufmotzen, hast aber nicht das Geld oder die Zeit für eine echt gute Lackierung und die Tuningteile? Dafür gibt es die Tuning-Limo. Diese kleine Flasche mit magischem Saft lässt deinen Wagen im Handumdrehen nach einer Million Nuyen aussehen. Stell dir das Ergebnis vor, berühre dein Fahrzeug und trinkt aus der Flasche. Dein Honda Spirit von 67 kann sofort wie ein Eurocar von 82 aussehen. Dieses Erzeugnis wird in unterschiedlichen Stärken je nach Fahrzeuggröße verkauft. Die Versionen für größere Fahrzeuge können bei kleineren verwendet werden, aber nicht umgekehrt.
item.translation_lenses.desc=Wolltest du schon mal alle Sprachen können? Diese Brille macht's möglich. Setze sie auf, berühre die Schrift auf dem Bügel und sage "Turm von Babel". Du und die Person, die du ansiehst, können einander verstehen. Der Zauber wirkt nur auf Lebewesen mit Bewusstsein - du kannst damit weder Sanskrit lesen noch mit der Katze reden.
item.twinsies.desc=Du brauchst eine Ablenkung? Einen Freund? Fragst dich, wie du in dem Kleid wirklich aussiehst? Das Warten hat ein Ende. Mit diesem praktischen kleinen Erzeugnis kannst du all das haben. Berühre die kleine Hand, deren Finger zum Peace-Zeichen gespreizt sind, berühre ein freiwilliges Ziel oder dich selbst, sage "Das ist kein Tumor" (starker Akzent nicht zwingend nötig), und plötzlich wird jemand doppelt so witzig wie zuvor. Nachdem das Erzeugnis losgelassen wird, kannst du das Spiegelbild in Maßen kontrollieren, oder du kannst es als perfektes Abbild der Person rumlaufen lassen, die du ausgewählt hast.
item.uv_cleanstick.desc=Dieses Erzeugnis mag wie ein gewöhnliches Knicklicht aussehen, aber unsere patentierte Verschmelzung des Arkanen und des Mundanen macht viel mehr daraus. Um den CleanStick einzusetzen, knicke ihn wie ein gewöhnliches Knicklicht und erfreue dich am reinigenden Leuchten des blauen Lichts. Der Zauber wird aktiviert, wenn das Erzeugnis im Inneren mit dem Chlor im Röhrchen in Berührung kommt. Anmerkung: Das blaue Leuchten macht in Wirklichkeit nichts Magisches, aber es sorgt nach der Aktivierung eine Stunde lang für ein cooles Ambiente oder eine Lichtquelle.
item.wizarding_wall.desc=Das Erzeugnis sieht aus wie ein schwarz glänzendes Taschentuch, aber dieses kleine Wunder ist bei jungen Zauberern sehr beliebt, die ihre Fähigkeiten üben wollen, ohne eine Hexenjagd auszulösen. Schüttle das Taschentuch gemäß Anweisung, such einen Bereich aus, in dem arkane Tricks veranstaltet werden sollen, und sprich dann die magischen Worte "Verborgene Magie". Dann wird der Großteil der Magie in diesem Bereich vor anderen verborgen. Es wird aussehen, als würde nichts geschehen. Wenn die Zauber, die abgefeuert werden, wirklich durchschlagskräftig sind, könnte der verbergende Effekt zu schwach sein, also trag nicht zu dick auf.


