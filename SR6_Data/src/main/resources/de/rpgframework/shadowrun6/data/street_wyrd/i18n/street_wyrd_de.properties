mentorspirit.dachshund.desc=Dackel ist ein sturer, rauflustiger Einzelgänger. Er stürzt sich ohne zu zögern auch auf größere Feinde und jagt ihnen mutig bis in engste, weitverzweigte Höhlen hinterher. Seine Hartnäckigkeit ist sprichwörtlich: Auf ihn wurde der Begriff "Wadenbeißer" gemünzt. Dackel gibt nicht viel auf die Meinung anderer und hat gelernt, sich nur auf sich selbst zu verlassen. Auch wenn er sich dabei bisweilen überschätzt, neigen seine Feinde noch öfter dazu, ihn zu unterschätzen - ein Fehler, den sie dann bitter bereuen.\n\nVorteile \nALLGEMEIN: 1 Stufe des Vorteils Überlebenswille (SR6, S. 76) gratis.\nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Wahrnehmung kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Eiserner Wille und 1 Stufe Kalte Entschlossenheit gratis
mentorspirit.dachshund.disadvantage=Immer wenn sich Anhänger von Dackel dem Willen einer anderen Person oder einer Gruppenentscheidung beugen müssen, legen sie eine Probe auf Willenskraft + Charisma (3) ab. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie sich von diesem aufgezwungenen Willen befreien (z. B. indem sie die Gruppenentscheidung offen missachten).
mentorspirit.squirrel.desc=Das freiheitsliebende Eichhörnchen ist stets in Bewegung. Als vorzüglicher Kletterer bewegt es sich selbst in größten Höhen furchtlos und sicher. Es behält gerne den Überblick und versteht es, sich in taktisch vorteilhafte Positionen zu manövrieren. Eichhörnchens größte Stärken sind Geschwindigkeit und Beweglichkeit. Für enge Räume ist es nicht geschaffen. Nur wenn es schwer verletzt oder in größter Gefahr ist, zieht es sich in den Schutz seines Verstecks zurück.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Athletik-Proben kosten \nZAUBERER: Edge-Boosts beim Herbeirufen von Luftgeistern oder Tiergeistern kosten 1 Edge weniger als normal (nach Wahl des Spielers) \nADEPT: 1 Stufe Freier Fall und 1 Stufe Großer Sprung gratis
mentorspirit.squirrel.disadvantage=Wann immer sich Anhänger von Eichhörnchen (nach Maßgabe der Spielleiterin) in engen Räumlichkeiten aufhalten, müssen sie eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie die beengenden Räumlichkeiten verlassen haben.
mentorspirit.magpie.desc=Eine flinke Diebin wie Elster erspäht und ergreift jede Gelegenheit, die sich ihr bietet. Sie handelt zuerst und überdenkt die Folgen erst später. Dank ihrer Geistesgegenwart und ihres Improvisationsgeschicks kann sie meistens, aber leider nicht immer, vermeiden, dass ihr daraus schwerwiegende Konsequenzen entstehen. Elster liebt Verstecke. Wo immer sie gerade ist, hält sie sich stets einen Unterschlupf für schwere Zeiten bereit.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Heimlichkeits-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Manipulation kosten 1 Edge weniger als normal \nADEPT: 2 Stufen Geschickte Finger gratis
mentorspirit.magpie.disadvantage=Anhänger von Elster neigen zur Kleptomanie. Wann immer sich ihnen eine günstige Gelegenheit bietet, einen Gegenstand "mitgehen zu lassen", müssen sie entweder diesem Impuls folgen oder eine Probe auf Willenskraft + Intuition (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie jenen Gegenstand (oder ein vergleichbares Objekt) in ihren Besitz gebracht haben.
mentorspirit.connoisseur.desc=Das Leben hält viele Freuden bereit, und Genießer hat es sich zum Ziel gesetzt, so viele von diesen Freuden wie nur möglich zu kosten. Er ist ein geselliger Schutzgeist, der seine Freuden bereitwillig und großzügig mit anderen teilt – schließlich ist er ein Hedonist, kein Egoist.<br/>Was auch immer ein Anhänger von Genießer tut, letztlich ist sein Handeln darauf ausgelegt, sich mit geringstmöglichem Aufwand die größtmöglichen Annehmlichkeiten zu verschaffen. Prinzipienfestigkeit ist nicht seine Stärke, denn die steht seinen Zielen meist im Weg.<br/><br/>
 <b>Vorteile:</b><br/>\
 <b>Allgemein:</b> 2 passende Wissensfertigkeiten gratis Zauberer: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Heilung kosten 1 Edge weniger als normal<br/>
 <b>Adept:</b> 3 Geschärfte Sinne (Geschmacks-, Geruchsund Tastsinn) gratis
 mentorspirit.connoisseur.disadvantage=Anhänger von Genießer neigen zu Ausschweifungen. Wann immer sie bei einer genussvollen Tätigkeit (z.B. Essen, Alkohol- und Genussmittelkonsum, Schlafen, Sex) gestört werden, müssen sie eine Probe auf Selbstbeherrschung (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie sich wieder ihrem Laster hingeben können.
mentorspirit.big_mama.desc=Für die meisten Wesen ist die Fürsorge einer liebenden Mutter die allererste Erfahrung, die sie in dieser Welt machen. Es überrascht nicht, dass Muttergöttinnen Urgottheiten sind, die in allen Gesellschaften angebetet wurden (oder immer noch werden). Die Große Mutter ist die Essenz einer wohlwollenden, zutiefst fürsorglichen Kraft, die alle Geschöpfe liebt und jedem, der darum bittet, Unterstützung bietet. Die Große Mutter ist eine Heilerin, aber auch eine Kämpferin, die die Menschen in ihrer Obhut vor allen Bedrohungen schützt. Und schließlich ist sie eine Erzieherin, die ihre Botschaft der moralischen Verpflichtung eifrig weitergibt.\n\nVorteile\nALLGEMEIN: Edge-Boosts für Biotech-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Heilung kosten 1 Edge weniger als normal \nADEPT: Empathische Heilung gratis
mentorspirit.big_mama.disadvantage=Eine Anhängerin der Großen Mutter neigt dazu, diejenigen zu "bemuttern", für die sie sich verantwortlich fühlt. Wann immer sie in der Position ist, Entscheidungen im Namen ihres Teams (oder einzelner Teammitglieder) zu treffen, verzichtet sie auf Rückfragen und handelt, wie sie es für richtig hält. Die Geisel freilassen, einen anderen Job annehmen, einen Waffenstillstand mit einer dritten Partei aushandeln - wenn sie der Meinung ist, dass es im besten Interesse ihrer Schützlinge ist, wird sie ohne Selbstzweifel handeln, selbst wenn ihre Entscheidungen das genaue Gegenteil des erklärten Willens ihrer Schützlinge sind. Was wissen sie schon ... Es ist die Mutter, die es am besten weiß! Wenn die Anhängerin diesem Impuls widerstehen will, muss ihr eine Probe auf Willenskraft + Charisma (4) gelingen.
mentorspirit.jester.desc=In der Vergangenheit hielten sich die Fürsten und Mächtigen an ihren Höfen Hofnarren. Deren Aufgabe war es, mit vordergründig albernen Späßen Kritik an den Herrschern zu üben und ihnen einen Spiegel vorzuhalten. Denn die Fürsten von einst wussten: Macht korrumpiert, und Erfolg macht arrogant und selbstgefällig. Die modernen Fürsten der Sechsten Welt haben es nicht so mit Selbstreflektion. Zum Glück lassen sich die modernen Hofnarren davon nicht beeindrucken, selbst wenn sie nicht mehr die sprichwörtliche Narrenfreiheit von einst genießen. Ihre Waffen sind die des Geistes: Humor, Subversion und öffentliche Bloßstellung. Anhänger von Hofnarr betrachten nicht die mächtigen Individuen, sondern die Macht selbst und ihren unweigerlich korrumpierenden Einfluss als ihre Feinde. Sie teilen stets nur nach oben aus, niemals würden sie unten treten: Die sozial Schwachen stehen ebenso unter Hofnarrs Schutz wie die einst Mächtigen, die von ihrem hohen Thron gestürzt sind (oder von dort heruntergeholt wurden) und ihre Lektion gelernt haben.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Überreden- und Menschenkenntnis-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Illusion kosten 1 Edge weniger als normal \nADEPT: Empathisches Gespür oder Fesselnde Vorstellung (nach Wahl des Spielers) gratis
mentorspirit.jester.disadvantage=Nachteile \nSo gerne ein Anhänger von Hofnarr die Charakterschwächen anderer anprangert, ist er selbst auch nicht frei von Eitelkeit. Er erhält den Nachteil Auffälliger Stil (SR6, S. 78) ohne Karmabonus.
mentorspirit.klabautermann.desc=Diese Sagengestalt gilt als die Stimme und die Seele eines Schiffs (manchmal auch eines anderen Gefährts). Sie gilt als launisch und verspielt, bisweilen gar auf kindlich-naive Weise grausam. Wer sich dennoch auf das körperlose Flüstern dieses Schutzgeistes einlässt, erhält ein tiefgehendes Verständnis von dem Schiff und den Elementen, in denen es sich bewegt. Es heißt, Klabautermann zeigt sich nur dann in seiner körperlichen, koboldhaften Gestalt, wenn größte Gefahr droht.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Mechanik- oder Steuern-Proben (nach Wahl des Spielers) kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts beim Herbeirufen von Helfergeistern kosten 1 Edge weniger als normal \nADEPT: Gefahrensinn (SR6, S. 158) gratis
mentorspirit.klabautermann.disadvantage=Klabautermanns ständige Einflüsterungen zehren selbst an den Nerven seiner treuesten Anhänger. Die Schwellenwerte aller Selbstbeherrschungs-Proben, die sie ablegen, sind um 1 erhöht.
mentorspirit.panthier.desc=Der Legende nach ist das Panthier (nicht zu verwechseln mit dem Panther) eine Chimäre, erschaffen von den Königen der Tiere, um den mächtigsten aller Wesen, den Drachen, Einhalt zu gebieten. Ausgestattet mit den tödlichsten Waffen, die die Tierwelt zu bieten hat, kämpft das aufbrausende und eigenbrötlerische Panthier aus schierer Lust an der Zerstörung - am liebsten gegen seine natürlichen Feinde, die Drachen, denen es sich todesverachtend entgegenwirft. Das Panthier ist eine Kreatur der Nacht und hält sich tagsüber gerne in Höhlen oder im Untergrund auf.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Nahkampf-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts beim Herbeirufen von Erdgeistern kosten 1 Edge weniger als normal \nADEPT: Elementarer Schlag gratis (auch dann einsetzbar, wenn die Kraft Todeskralle noch nicht erworben wurde)
mentorspirit.panthier.disadvantage=Gewalt ist eben doch eine Lösung, zumindest für Anhänger von Panthier, und zwar die Lösung für alles. Wenn sie ein auftretendes Problem nicht mit den Mitteln der Gewalt lösen, müssen sie eine Probe auf Willenskraft + Charisma (3) ablegen. Misslingt die Probe, erhalten sie so lange kein neues Edge, bis sie einen Kampf vom Zaun brechen.
mentorspirit.rotkaeppchen_wyrd.desc="Die Welt ist so, wie du sie siehst." Das ist das Credo dieses Schutzgeistes. Und da Rotkäppchen die Welt mit kindlicher Neugier und Unvoreingenommenheit betrachtet, zeigt sie sich ihm voller Wunder und spannender Begegnungen. Wer Rotkäppchen folgt, hat sich nicht von der Tristesse des Alltags und gesellschaftlichen Zwängen zermürben lassen. Als Gegenentwurf zum abgeklärten, zynischen Stadtmenschen behalten die Anhänger von Rotkäppchen stets ihren Optimismus und können auch der verfahrensten Situation etwas Positives abgewinnen. Doch Vorsicht: Bei aller Naivität verfügt Rotkäppchen auch über pragmatische und lebenskluge Seiten. Das musste schon der böse Wolf feststellen ...\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Wahrnehmungs-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts beim Herbeirufen von Ratgebergeistern kosten 1 Edge weniger als normal \nADEPT: Kraft Empathisches Gespür oder Tierempathie (nach Wahl des Spielers) gratis
mentorspirit.rotkaeppchen_wyrd.disadvantage=Anhänger von Rotkäppchen neigen auch in gefährlichen Situationen zu Arglosigkeit. Der Schwellenwert für Überraschungs-Proben beträgt 4 (statt der üblichen 3).
mentorspirit.shepherd_dog.desc=Als Sinnbild für Treue ist Schäferhund der beste Freund, den man sich wünschen kann - wenn man über seine Ungeduld, seine Prinzipienreiterei und seinen Hang zur Rechthaberei hinwegsehen kann. Als ehrliche Haut, die er zweifellos ist, lässt sich Schäferhund manchmal von seinen Feinden überlisten, doch mit einer Mischung aus Intelligenz, Belastbarkeit und seiner hohen Aufmerksamkeit kann er sich selbst aus größten Schwierigkeiten befreien.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Einfluss-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts bei Zaubern, alchemistischen Erzeugnissen und Ritualen der Kategorie Kampf kosten 1 Edge weniger als normal \nADEPT: 1 Stufe Kampfsinn (SR6, S. 159) gratis
mentorspirit.shepherd_dog.disadvantage=Anhänger von Schäferhund verlangen von anderen nichts, was sie nicht auch sich selbst auferlegen. Sie erhalten den Nachteil Ehrenkodex (SR6, S. 78) ohne Karmabonus.
mentorspirit.vigilant.desc=Konzernbürger wie Slumbewohner wissen: Recht haben ist etwas anderes als Recht bekommen. Vigilant arbeitet daran, diesen Unterschied aufzuheben. Von den offiziellen Behörden erwartet er gar nichts anderes als eigennütziges Verhalten, weswegen er die Gerechtigkeit in die eigene Hand nimmt. Vigilant bestraft diejenigen, die bislang straffrei ausgegangen sind - das ist sein Lebensinhalt, und seine Strafen sind deutlich härter als das, was die Gesetzbücher als Ermessensspielraum vorgeben. Häufig war ein Anhänger von Vigilant selbst einst Opfer eines ungesühnten Verbrechens.\n\nVorteile\nALLGEMEIN: Edge-Boosts bei Fernkampf-Proben kosten 1 Edge weniger als normal \nZAUBERER: Edge-Boosts beim Herbeirufen von Beschützergeistern kosten 1 Edge weniger als normal \nADEPT: Gegenangriff gratis
mentorspirit.vigilant.disadvantage=Ein Anhänger von Vigilant vergisst niemals eine Person, die ihm übel mitgespielt hat. Jedes Mal, wenn er die (erneute) Begegnung mit einer solchen Person verstreichen lässt, ohne Rache an ihr zu üben, muss er eine Probe auf Willenskraft + Charisma (3) ablegen. Misslingt die Probe, erhält er so lange kein neues Edge, bis er gegen seinen einstigen Peiniger vorgeht.

