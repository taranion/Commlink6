quality.arcane_resilience.desc=Alle Schüler der Magie erlernen die Standardtechniken ihrer Tradition, um gegen die Erschöpfung anzukämpfen, die einsetzt, nachdem sie ihre magischen Kräfte genutzt haben. Manche Ausbilder jedoch lehren Methoden, die an die individuellen Bedürfnisse der Schüler angepasst sind und ihnen so helfen, die kräftezehrenden Auswirkungen der Magie noch effektiver zu minimieren. Auswirkung: Du darfst entweder Logik, Intuition oder Charisma als  dein  neues Traditionsattribut festlegen und verwendest dieses Attribut bei allen Entzugswiderstandsproben.
quality.scholastic_mage.desc=Ein nicht unbeträchtlicher Anteil von Zauberern - vor allem in den hermetischen Traditionen - durchläuft keine Ausbildung bei einem persönlichen Lehrmeister, sondern besucht stattdessen Vorlesungen an einer Universität. Natürlich kostet eine akademische Ausbildung einiges an Geld, aber gemessen an dem auf diese Weise erlangten Wissen ist das eine lohnenswerte Investition. Auswirkung: Nur während der Charaktererschaffung kannst du Wissensfertigkeiten für jeweils 2 Karma kaufen. Du kannst zudem dein Startkapital (SR6, S. 70) ausgeben, um Wissensfertigkeiten alternativ für jeweils 1.000 Nuyen zu erwerben. Diese Vorteil kann mit dem Nachteil Verschuldet (SR6, S. 81) kombiniert werden; dadurch erhöhen sich die Kosten pro Wissensfertigkeit jedoch auf 2.000 Nuyen.
quality.shamanic_mask.desc=Manche Zauberer kanalisieren ihre arkane Macht über ihren Schutzgeist. Im Gegenzug manifestiert sich ihr Totem in Form einer sichtbaren, temporären Veränderung (tierische Züge, Elementareffekte usw.), wenn sie Magie einsetzen. Die Veränderung ist manabasiert, daher können nur Lebewesen sie sehen. Je mehr Erfolge du bei deiner Magieprobe erzielst, desto ausgeprägter ist die Veränderung und desto deutlicher ist dein Totem auch für Mundane erkennbar. Auswirkung: Du legst einen Effekt fest (z. B. ein durchscheinender Wolfskopf, der sich über dein Gesicht legt, oder mit magischem Feuer aufleuchtende Augen). Dieser Effekt begleitet den Einsatz aller Fertigkeiten, bei denen Magie im Spiel ist (oder im Falle von Adepten jeden Einsatz einer Adeptenkraft, die mit einer Haupt- oder Nebenhandlung aktiviert werden muss). Wenn du (zusätzlich zu der Handlung, die für die entsprechende mit Magie verknüpfte Probe erforderlich ist) eine Nebenhandlung investierst, erhältst du 1 Edge. Dieses Edge ist temporär und kann nur für genau diese Probe eingesetzt werden (Adepten: für die erste Probe, bei der die Adeptenkraft nach der Aktivierung zum Einsatz kommt). Es gibt jedoch auch einen Nachteil: Die Zaubermaske enttarnt dich sofort als Erwacht. Das könnte dazu führen, dass die Gegner ihr Feuer auf dich konzentrieren, was schnell lebensgefährlich werden kann.Um diesen Vorteil wählen zu können, muss ein Charakter den Vorteil Schutzgeist haben.
quality.pusillanimous_summoner.desc=Sei es aufgrund einer unangenehmen Erfahrung in der Vergangenheit oder aufgrund der Besonderheiten deiner magischen Ausbildung - wann immer du einen Geist herbeirufst, wirst du von Furcht ergriffen. Die Geister spüren dieses Unbehagen und gewinnen die Oberhand. Sie neigen dazu, deine Befehle genau dem Wortsinn nach auszuführen - nicht mehr, aber (wenn ihnen der Sinn danach steht) durchaus auch weniger. (Und währenddessen legen die Geister - je nach deiner Tradition - entweder ein sehr verschlagenes oder patziges Verhalten an den Tag.) Ein ängstlicher Beschwörer muss seine Worte äußerst präzise wählen, wenn er nicht von seinen Geistern an der Nase herumgeführt werden will. Dieser Nachteil kann nur von Charakteren gewählt werden, die die Fertigkeit Beschwören erlernen dürfen. Auswirkung: Alle Geister, die du beschwörst, versuchen nach Kräften, deine Anweisungen (nach Maßgabe des Spielleiters) falsch zu interpretieren. Wenn du sichergehen willst, dass deine Befehle wasserdicht sind, musst du dir vor der Beschwörung Zeit für eine Ausgedehnte Probe auf Beschwören + Intuition (8, 5 Minuten) nehmen, um sie genau zu durchdenken.
quality.possession_tradition.desc=Du hast niemals gelernt, Geister auf eine Weise zu beschwören, die es ihnen erlaubt, sich zu materialisieren - oder entscheidest dich aus irgendeinem Grund vielleicht sogar bewusst dagegen. Dieser Nachteil kann nur von Charakteren gewählt werden, die die Fertigkeit Beschwören erlernen dürfen. Auswirkung: Von dieser Tradition herbeigerufene Geister ersetzen ihre Kraft Materialisierung durch die Kraft Besessenheit (S. 78).
quality.representation1.desc=Es gibt magische Ausbilder, die ihren Schülern unterstützende Techniken - Repräsentationen - beibringen, um ihnen das Lernen zu erleichtern. Während viele Studenten diese Techniken Schritt für Schritt hinter sich lassen, wenn sie immer mehr an Sicherheit gewinnen, beschließen andere, an den Repräsentationen festzuhalten, da sie sie beruhigend und hilfreich finden. Dieser Nachteil kann nicht von Adepten gewählt werden, wohl aber von Magieradepten. Auswirkung: Du legst eine deutlich sicht- oder hörbare Handlung - Gesten, gesprochene Worte, Gesänge o. Ä. - fest, die du durchführen musst, wann immer du Magie einsetzen möchtest. Alternativ kann es sich dabei auch um ein spezielles Kleidungsstück oder Outfit handeln, das du tragen musst (oder sogar die komplette Abwesenheit von Textilien). Die Handlung oder das Kleidungsstück darf weder alltäglich noch anders interpretierbar sein (z. B. als Alltagskleidung oder modisches Statement), sondern sollte sogar mundane Personen vermuten lassen, dass gerade etwas Magisches vor sich geht. Bei der einfachen Variante dieses Nachteils (I) kannst du auf den Einsatz deiner Repräsentation verzichten, erhältst in diesem Fall jedoch einen Würfelpoolmalus von -4 auf alle Proben auf Astral, Beschwören, Hexerei und Verzaubern, solange du die Repräsentation nicht ausführst/trägst. In der ausgeprägteren Form (II) ist es dir effektiv unmöglich, die Fertigkeiten Astral, Beschwören, Hexerei und Verzaubern einzusetzen, wenn du nicht in der Lage bist, deine Repräsentation zum Einsatz zu bringen (z. B. weil du geknebelt bist, deine Hände gefesselt sind oder dein spezielles Gewand entfernt wurde). Ein weiterer Nachteil besteht darin, dass dieser Nachteil deinen Gegnern verrät, dass du der "Gefährliche" bist - und wenn deine Feinde dem alten Credo "Tötet den Magier zuerst" folgen, dann schwebst du damit in Lebensgefahr. Mit all diesen Nachteilen ist jedoch auch ein Vorteil verbunden: Einmal pro Tag erhältst du 1 Edge, wenn du beim Einsatz von Magie deine Repräsentation nutzt. Dieses Edge kann nur für die entsprechende Probe eingesetzt werden und verfällt ansonsten.
quality.representation2.desc=Es gibt magische Ausbilder, die ihren Schülern unterstützende Techniken - Repräsentationen - beibringen, um ihnen das Lernen zu erleichtern. Während viele Studenten diese Techniken Schritt für Schritt hinter sich lassen, wenn sie immer mehr an Sicherheit gewinnen, beschließen andere, an den Repräsentationen festzuhalten, da sie sie beruhigend und hilfreich finden. Dieser Nachteil kann nicht von Adepten gewählt werden, wohl aber von Magieradepten. Auswirkung: Du legst eine deutlich sicht- oder hörbare Handlung - Gesten, gesprochene Worte, Gesänge o. Ä. - fest, die du durchführen musst, wann immer du Magie einsetzen möchtest. Alternativ kann es sich dabei auch um ein spezielles Kleidungsstück oder Outfit handeln, das du tragen musst (oder sogar die komplette Abwesenheit von Textilien). Die Handlung oder das Kleidungsstück darf weder alltäglich noch anders interpretierbar sein (z. B. als Alltagskleidung oder modisches Statement), sondern sollte sogar mundane Personen vermuten lassen, dass gerade etwas Magisches vor sich geht. Bei der einfachen Variante dieses Nachteils (I) kannst du auf den Einsatz deiner Repräsentation verzichten, erhältst in diesem Fall jedoch einen Würfelpoolmalus von -4 auf alle Proben auf Astral, Beschwören, Hexerei und Verzaubern, solange du die Repräsentation nicht ausführst/trägst. In der ausgeprägteren Form (II) ist es dir effektiv unmöglich, die Fertigkeiten Astral, Beschwören, Hexerei und Verzaubern einzusetzen, wenn du nicht in der Lage bist, deine Repräsentation zum Einsatz zu bringen (z. B. weil du geknebelt bist, deine Hände gefesselt sind oder dein spezielles Gewand entfernt wurde). Ein weiterer Nachteil besteht darin, dass dieser Nachteil deinen Gegnern verrät, dass du der "Gefährliche" bist - und wenn deine Feinde dem alten Credo "Tötet den Magier zuerst" folgen, dann schwebst du damit in Lebensgefahr. Mit all diesen Nachteilen ist jedoch auch ein Vorteil verbunden: Einmal pro Tag erhältst du 1 Edge, wenn du beim Einsatz von Magie deine Repräsentation nutzt. Dieses Edge kann nur für die entsprechende Probe eingesetzt werden und verfällt ansonsten.

quality.innate_talent.desc=Der Fokus und die Hingabe, die durch das Beschreiten eines Wegs entstehen, verleihen einem Adepten die Fähigkeit, seinen Adeptenkräften regelmäßig einen kleinen Schub zu verleihen. Einmal pro Begegnung darf er die Kosten von Edge-Boosts bei einer beliebigen Probe, die in irgendeiner Form durch eine seiner Adeptenkräfte oder metamagischen Techniken beeinflusst wird, um 1 senken. Für jeden Initiatengrad kann diese Fähigkeit pro Begegnung ein weiteres Mal eingesetzt werden.
quality.focused_channeling.desc=Adepten, die sich auf einen Weg fokussieren, können der mit dem Einsatz von Mana verbundenen Anstrengung widerstehen, indem sie sich auf die für ihren Weg spezifische Geisteshaltung und Ausbildung besinnen, statt mit den Widerstandsattributen normaler Adepten zu arbeiten. Dieses alternative Entzugsattribut ist nicht verpflichtend, aber die Entscheidung für oder gegen den Wechsel muss getroffen werden, wenn der Vorteil für den Weg gewählt wird, und kann danach nicht mehr rückgängig gemacht werden (sofern der Adept nicht einen neuen Weg beschreitet, siehe dazu die Metamagie Schüler der Wege, S. 98).
quality.spark_of_brilliance.desc=Anhänger eines Weges erhalten eine kleine, für ihren Weg spezifische Verstärkung ihrer magischen Kräfte, die du der untenstehenden Beschreibung entnehmen kannst. Dies spiegelt wider, dass sie sich generell durch ein starkes Vertrauen in ihre magischen Fähigkeiten auszeichnen, was sich zwar dann und wann als unberechenbarer Faktor erweist, aber auch wahrhaft Beeindruckendes hervorbringen kann, wenn angeborene Affinität und erworbene Erfahrung zusammenkommen.
