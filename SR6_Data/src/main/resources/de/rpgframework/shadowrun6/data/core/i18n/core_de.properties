item.shock_gloves.page=250
item.shock_gloves.wifi=Zusätzliche Nebenhandlung, wenn man an der Reihe ist und eine Entladung auslöst. Aufladung per Induktion (1 Ladung/habe Std WiFi)
item.monofilament_whip=Monofilamentpeitsche
item.monofilament_whip.page=249
item.monofilament_whip.wifi=Die Peitsche greift auf die visuelle Zielerfassung des Benutzers zurück, um leichte Änderungen in der Flugbahn vorzunehmen. Das erhöht den Angriffswert um 2. Außerdem wird bei einem Kritischen Patzer die Schnur durch das automatische Sicherungssystem der Peitsche automatisch eingezogen, statt den Benutzer zu treffen.
item.combat_axe.desc=Ob du nun Neal, der Feuerwehrmann, oder Neil, der Orkbarbar, bist \u2013 eine Axt kann ein Werkzeug oder eine tödliche Waffe sein. Die Kampfaxt hat eine einfache oder doppelte Klinge und eine gehärtete, mit einer Sprungfeder versehene Stoßspitze am Stielende, um Glasscheiben einzuschlagen oder dem Gegner eine unangenehme Überraschung zu bereiten. In den übermuskulösen Händen eines Straßenkämpfers der 2080er kann diese Waffe tödlicher sein als eine Feuerwaffe.
item.combat_knife.desc=Ein einfaches, elegantes und effizientes Tötungswerkzeug mit einer Meißelspitze, die mit Leichtigkeit Panzerung durchdringen kann. Außerdem ist es karbonbeschichtet und geschwärzt, sodass keine Lichtreflexionen den anschleichenden Kämpfer verraten. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden.
item.forearm_snap_blades.desc=Du magst keine Implantate, hättest aber trotzdem gerne drei rasiermesserscharfe Klingen, die aus deinem Unterarm hervorschnappen? Dann ist dies die richtige Waffe für dich. Die Klingen lassen sich durch einen Unterarm-Muskelbefehl oder ein WiFi-Signal aus- und einfahren. Beides erfordert jeweils eine Nebenhandlung.
item.knife.desc=Ein Oberbegriff für eine Vielzahl unterschiedlicher tödlicher Klingenwaffen. Wie es genau aussieht, bleibt jedem selbst überlassen, aber die Werte sind alle gleich. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden.
item.katana.desc=Das legendäre zweihändige Schwert der Samurai gehört zur Standardausrüstung jedes Trideo-Shadowrunners. Draußen auf der Straße belehrt die tödliche Klinge all jene eines Besseren, die glauben, dieses Klischee diene nur der Angeberei.
item.survival_knife.desc=Dieses spezielle Design mit einer geraden Klinge auf der einen und einer gezahnten auf der anderen Seite hat den eigentlichen \u201EÜberlebens\u201C-Teil seines Namens im Griff versteckt. Dort findet man ein GPS, ein Miniatur-Multitool und ein Mikro-Feuerzeug. Die Klinge ist mit einer fotovoltaischen Schicht überzogen, die die Klinge schwärzt und vor unerwünschten Reflexionen schützt; in aufgeladenem Zustand kann diese Schicht aktiviert werden und liefert für zwei Stunden Licht. Die Kampfwerte sind die gleichen wie beim Kampfmesser. Mit der Fertigkeit Athletik kann es notfalls auch geworfen werden.
item.polearm.desc=Man nehme einen langen Stock und füge an einem Ende ein Dutzend Varianten an scharfen Klingen hinzu \u2013 fertig ist die Stangenwaffe. Da diese Waffen ursprünglich dem Zweck dienten, eine gewisse Distanz zwischen Angreifer und Verteidiger zu wahren oder berittene Kämpfer anzugreifen, findet man sie nicht allzu oft auf der Straße. Es ist praktisch unmöglich, sie zu verbergen, selbst für einen Troll, aber sie eignen sich sehr gut dazu, Probleme auf Distanz zu halten.
item.sword.desc=Eine schwere einhändige Klingenwaffe, die es in einer Vielzahl von Stilen gibt. Tausende von Jahren war dies die dominierende Kriegswaffe, bis die Feuerwaffe auf der Bildfläche erschien.
item.club.desc=Die aufgelisteten Werte können für eine große Auswahl an Gegenständen verwendet werden, etwa einen Axtstiel, einen Baseballschläger, einen Radschlüssel, einen Schraubenschlüssel oder einfach ein Kantholz mit ein paar Nägeln darin. Der angegebene Preis gilt für einen professionell hergestellten, altehrwürdigen Polizeischlagstock, aber es dürfte nicht schwierig sein, im Notfall irgendwo einen improvisierten Knüppel für lau zu finden.
item.extendable_baton.desc=Dieser ausfahrbare Knüppel kann mit einer Handgelenkbewegung oder einem WiFi-Signal ausgefahren werden. In eingezogenem Zustand ist er leichter zu verbergen (Tarnbarkeit 4 im eingefahrenen, 2 im ausgefahrenen Zustand).\nDas Ausfahren oder Zusammenschieben des Teleskopschlagstocks erfordert eine Nebenhandlung.
item.sab.desc=Ein kleiner, federnder Knüppel, ein Stück mit Leder überzogenes Eisen oder Blei, oder ein Säckchen voller Sand zu dem Zweck, jemandem damit eins überzuziehen. Der Totschläger lässt sich leicht verbergen, oft hat er in einer Handfläche Platz (Tarnbarkeit 4).
item.staff.desc=Ein langer, schwerer und sehr schlagkräftiger Stab. Es gibt ihn als Kompositstab, in Hartholz, Hartstahl und anderen Materialien.
item.stun_baton.desc=Diese elektrische Aufruhrbekämpfungswaffe gilt als Symbol der Konzern- und Regierungsunterdrücker, kann aber auch in den Schatten nutzbringend eingesetzt werden. Der Betäubungsschlagstock enthält zehn Ladungen. Wenn er am Stromnetz hängt, lädt sich der Schlagstock mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden wieder auf.
item.telescopic_staff.desc=Ein großer Stock, der als kleiner Stock anfängt. Dieser Metall- und Kompositstab kann zur Größe eines Betäubungsschlagstocks oder eines Schwertes zusammengeschoben werden. Ausgefahren und arretiert wird er, indem man ihn herumwirbelt oder in beide Richtungen ausschlägt und dann den Griff dreht, um ihn einzurasten. Alternativ kann er auch durch ein WiFi-Signal aktiviert werden. Einen Teleskopstab auszufahren oder einzuschieben erfordert eine Nebenhandlung.
item.bike_chain.desc=Go-Gangs verwenden gern die ausrangierten Ersatzteile ihrer Schrott-Bikes, um andere damit zu vermöbeln. Diese schweren Metallketten sind brutale Waffen, vor allem wenn sie vom fahrenden Motorrad aus geschwungen werden. Du erhältst eine zusätzliche Nebenhandlung, wenn du mit dieser Waffe die Nebenhandlung Zu Fall bringen ausführst.
item.bullwhip.desc=Die klassische Lederpeitsche, wie sie seit Jahrhunderten benutzt wird, um Nutzvieh und anderes \u201Elebendes Inventar\u201C unter Kontrolle zu halten. Gegen nackte Haut äußerst brutal, aber für jemanden mit Panzerung hauptsächlich eine Stolperfalle. Du erhältst eine zusätzliche Nebenhandlung, wenn du mit dieser Waffe die Nebenhandlung Zu Fall bringen ausführst.
item.knucks.desc=Ob eine Rolle Münzen in der Faust (aber wer hat die schon herumliegen?), ein Messing-Schlagring oder Handschuhe vom Typ Ares Hardliner \u2013 diese Waffen stufen eine Faust von \u201Evielleicht tödlich\u201C zu \u201Ewahrscheinlich tödlich\u201C hoch, indem sie die Hand durch Metall oder Komposit verstärken.
item.shock_gloves.desc=Isolierte Handschuhe mit einem integrierten System, das in aktiviertem Zustand bei Kontakt einen elektrischen Schock austeilt. Die Handschuhe verursachen beim Ziel zusätzlich zum Schaden für 2 Kampfrunden den Status Gebrutzelt (S.54) und enthalten zehn Ladungen, bevor sie an das Stromnetz angeschlossen und neu aufgeladen werden müssen (mit einer Geschwindigkeit von einer Ladung pro zehn Sekunden). Die Entladung wird durch einen Muskelbefehl oder ein WiFi-Signal ausgelöst, was eine Nebenhandlung erfordert.
item.monofilament_whip.desc=Seit den 2050ern eine der gefürchtetsten Waffen auf den Straßen der Sechsten Welt. In den Händen eines geübten Benutzers kann diese furchtbare Waffe mit jedem Millimeter ihrer zwei Meter langen Monofilamentschnur durch Panzerung, Haut und Knochen schneiden, als bestünden sie aus Butter. In den falschen Händen, aber auch schon mit einer falschen Bewegung einer geübten Hand, kann diese Waffe den Benutzer selbst auf die Suche nach einer Arm- oder Beinprothese schicken. Die Schnur wird in einem speziellen Fach im Griff verwahrt und hat ein kleines Gewicht am Ende, das sich aus der Verankerung löst, wenn die Waffe aktiviert wird. Patzer werden abgehandelt wie üblich, aber bei einem Kritischen Patzer muss der Benutzer immer gegen den Basisschaden der Waffe Widerstand leisten.

