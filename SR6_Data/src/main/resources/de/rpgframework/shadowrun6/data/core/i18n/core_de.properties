npc.courier.desc=Kurier-Sprites sind großartig für das sichere Übermitteln von Nachrichten und für Überwachungsaufgaben geeignet.
npc.crack=Infiltrator-Sprite
npc.crack.page=193
npc.crack.desc=Wenn du ein leises Sprite suchst, das sich unauffällig bewegen kann, ist dieses hier genau das Richtige.
npc.data=Daten-Sprite
