metaecho.adept_centering.desc=Adeptenzentrierung erlaubt dir, mögliche Nachteile durch schlechte Umgebungsbedingungen wie schlechte Beleuchtung, eine herausfordernde Umwelt oder sogar herumschwirrende Illusionen zu überwinden. Indem du eine Zentrierungshandlung durchführst, behältst du deine Konzentration bei, sodass Gegner dir gegenüber keinen Vorteil herausholen können. Wenn sie dich angreifen, können Gegner kein Edge durch Umweltbedingungen erhalten; ebenso können sie kein Edge durch Veränderungen der Angriffs- oder Verteidigungswerte durch Illusionszauber erhalten, wenn du dran bist und eine Zentrierungshandlung durchführst, oder wenn sie dran sind, nachdem du diese Handlung durchgeführt hast. Die Zentrierungshandlung kann sehr einfach sein, sollte aber für jeden aufmerksamen Beobachter offensichtlich sein. Vielleicht besteht sie aus Gesang, Schlachtenrufen, rituellen Gesten oder anderem. Solange sie deinen Geist und Körper in Einklang bringt, ist das in Ordnung. Das Durchführen der Zentrierungshandlung erfordert eine Nebenhandlung.
metaecho.centering.desc=Ein Zauberer, der die Zentrierung beherrscht, kann Entzug besser widerstehen. Indem du eine mundane Handlung durchführst, die zu deiner Tradition passt, deinen Geist beruhigt und Störungen ausblendet, erhältst du bei allen Entzugswiderstandsproben einen Würfelpoolbonus in Höhe deines Initiatengrads. Die Zentrierung ist eine Nebenhandlung. Die genaue Technik kannst du selbst bestimmen. Sie muss natürlich zu deiner Tradition passen. Es könnte sich um lateinische Sprechgesänge, das Spielen eines Instruments, Tanz, Gesang, geheimnisvolle Gesten, das Anrufen uralter Götter oder Ähnliches handeln - Hauptsache, es ist auffällig. Wenn du die Zentrierung nicht durchführen kannst (weil du zum Beispiel gefesselt bist und keine Gesten machen kannst), kannst du diese Metamagie nicht einsetzen.
metaecho.fixation.desc=Du lässt Karma in ein alchemistisches Erzeugnis fließen, um es länger haltbar zu machen. Wenn du das Erzeugnis herstellst, kannst du zwischen 1 Karma und [Wirksamkeit des Erzeugnisses] Karma ausgeben. Wenn die Wirksamkeit des Erzeugnisses zu schwinden beginnt, verliert es 1 Stufe Wirksamkeit pro Tag statt pro [gegenwärtige Wirksamkeit × 2] Stunden. Außerdem erhält das Erzeugnis beim Widerstand gegen das Trennen (S. 155) einen Würfelpoolbonus in Höhe des Karmas, das du ausgegeben hast.
metaecho.flexible_signature.desc=Du kannst deine astrale Signatur (S. 161) nach Belieben ändern. Du kannst sie so verändern, dass sie nicht zu deiner Identifizierung taugt, oder du kannst die astrale Signatur eines anderen Zauberers vortäuschen, den du askennt hast. Oder du kannst einfach das Schwinden deiner Signatur beschleunigen. Wenn jemand versucht, die verfälschte Signatur zu askennen, steigt der Schwellenwert um deinen Initiatengrad. Wenn also ein Initiat mit Initiatengrad 2 eine verfälschte Signatur hinterließe, könnte ein anderer Zauberer sie mit 3 Erfolgen wie üblich askennen, aber erst mit 5 Erfolgen die Wahrheit hinter der Fälschung sehen. Du kannst nur astrale Signaturen nachahmen, die du selbst askennt hast, und die Spielleiterin kann dafür eine Probe auf Erinnerungsvermögen (S. 37) verlangen. Du kannst auch die Haltbarkeit deiner astralen Signatur um deinen Initiatengrad in Stunden reduzieren.
metaecho.masking.desc=Du lernst, das Aussehen deiner Aura (und deiner astralen Gestalt) zu verändern. Du kannst sie mundan wirken lassen, oder als wäre dein Magieattribut um bis zu deinen Initiatengrad höher oder niedriger. Wenn jemand versucht, deine maskierte Aura zu askennen, wird die Askennenprobe eine Vergleichende Probe gegen deine Magie + Initiatengrad. Wenn der Gegner Nettoerfolge erzielt, sieht er sowohl die Maskierung als auch deine wahre Aura. Wenn du die astrale Wahrnehmung beherrschst, kannst du deine Aura sogar wie etwas anderes (die eines Geistes oder Fokus) aussehen lassen, was sich auf astralen Kostümpartys immer gut macht. Du kannst mit dieser Metamagie auch eine Anzahl von gebundenen Foki gleich deinem Initiatengrad maskieren.
metaecho.power_points.desc=Wenn du ein Adept bist, kannst du statt einer Metamagie einen Kraftpunkt erhalten. Du kannst das jedes Mal machen, wenn du einen neuen Initiatengrad erreichst.
metaecho.quickening.desc=Du kannst einen aufrechterhaltenen Zauber in eine Art Schleife zwingen, sodass er sich selbst ohne dein Zutun aufrechterhält. Um einen Zauber zu intensivieren, führe eine Haupthandlung durch und gib Karma aus, während du den Zauber aufrechterhältst. Du musst mindestens 1 Karma ausgeben, kannst aber maximal so viel Karma ausgeben, wie du Erfolge bei der Zauberprobe für diesen Zauber erzielt hast. Der Zauber wird permanent und erhält gegen Versuche, ihn zu bannen (S. 145), einen Würfelpoolbonus in Höhe des Karmas, das du für ihn ausgegeben hast.
metaecho.spell_shapening.desc=Du kannst deine Flächenzauber umformen, wodurch sie allerdings schwerer zu wirken sind. Für jeweils einen Würfelpoolmalus von -1 auf deine Zauberprobe kannst du die Flächenwirkung des Zaubers um 1 Meter Radius ausdehnen, verringern oder eine Kugel von 1 Meter Radius erschaffen, die nicht von der Zauberwirkung betroffen ist (denk daran, dass einige Critter und Metatypen größere „Schutzblasen“ brauchen als andere). Du musst den Einsatz dieser Metamagie beim Wirken des Flächenzaubers ansagen. Du darfst keinen höheren Würfelpoolmalus in Kauf nehmen, als dein Magieattribut beträgt. Anders als die Anpassung Fläche Vergrößern hat diese Metamagie keine Auswirkung auf den Entzugswert des Zaubers.
metaecho.shielding.desc=Ein Charakter mit der Metamagie Abschirmung kann sich und andere besser vor feindlichen Zaubern schützen. Wenn der Zauberer Zauberabwehr ansagt (S. 145), kann er dafür zusätzliche Würfel bis zu seinem Initiatengrad verwenden. Diese Zusatzwürfel sind nicht für andere Arten der Antimagie, wie zum Beispiel das Bannen von Zaubern, nutzbar.

