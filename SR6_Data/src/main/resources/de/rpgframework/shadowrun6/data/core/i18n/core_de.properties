metaecho.sleaze_upgrade.desc=Du kannst eines der Matrixattribute deiner Lebenden Persona um 1 erhöhen. Dieses Echo kann mehrmals gewählt werden, aber jedes Matrixattribut darf höchsten zweimal gesteigert werden.
metaecho.neurofilter=Neurofilter
metaecho.neurofilter.page=195
metaecho.neurofilter.desc=Du erhältst einen Würfelpoolbonus von +1 zum Widerstand gegen Schaden durch Biofeedback. Dieses Echo darf zweimal gewählt werden.
metaecho.overclocking=Übertakten
metaecho.overclocking.page=195
metaecho.overclocking.desc=Du beschleunigst deine Lebende Persona, damit du in der Matrix schneller handeln kannst. Du erhältst für die VR mit heißem Sim einen zusätzlichen W6 für Initiative und eine zusätzliche Nebenhandlung.
metaecho.resonance_link=Resonanzverbindung
metaecho.resonance_link.page=195
metaecho.resonance_link.desc=Dieses Echo erlaubt dir, mit einem anderen Technomancer deiner Wahl eine empathische Einweg-Verbindung aufzubauen. Solange ihr verbunden seid, kannst du die Stimmung und Emotionen des anderen Technomancers erkennen. Du weißt, wenn dieser angegriffen wird oder unter Stress steht, Schmerz empfindet oder in Gefahr ist. Diese Verbindung wirkt nur in eine Richtung (dein Partner erfährt nichts über dich). Wenn aber beide dieses Echo füreinander auswählen, können sie eine Verbindung in beide Richtungen haben.
metaecho.skin_link=Skinlink
metaecho.skin_link.page=195
metaecho.skin_link.desc=Du kannst dich mit einem Gerät verbinden, als würdest du ein DNI benutzen, indem du es einfach berührst. Dieses Echo kann nur einmal gewählt werden.

