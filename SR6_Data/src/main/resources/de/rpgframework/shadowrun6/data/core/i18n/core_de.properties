item.imaging_scope.wifi=Das Blickfeld des Zielfernrohrs kann geteilt werden, sodass das, was das Zielfernrohr sieht, auch vom Rest des Teams gesehen werden kann (und vom Charakter, falls er es benutzt, um damit um die Ecke zu schauen).
