item.cyberskull=Cyberschädel
item.cyberskull.page=290
item.cyberskull.desc=Der Cyberschädel ersetzt die Knochen und Muskeln des Kopfes, Gesichts und Halses. Einen Cyberschädel zu haben bedeutet auch, dass man über Cyberkiefer (S. 291) verfügt, die wirklich kraftvoll zubeißen können.
item.cyberskull.variant.synthetic=Cyberschädel, synthetisch
item.cyberskull.variant.obvious=Cyberschädel, offensichtlich
item.cybertorso=Cybertorso
item.cybertorso.page=290
item.cybertorso.desc=Der Cybertorso ersetzt die Knochen und Muskeln des Körperkerns unterhalb des Halses bis zu den Genitalien. Offensichtliche Cybertorsos entfernen die Genitalien und deren Funktion (bis auf die Ausscheidung). Die inneren Organe werden nicht ersetzt, aber sie sind alle durch abgetrennte Fächer geschützt. Synthetisches Cybertorsodesign gibt sich alle Mühe, so natürlich wie nur möglich auszusehen. Manche Kunden entscheiden sich gegen den geformten Look und wählen eine schlankere, straffere Erscheinung, während andere einen "durchschnittlichen" Körpertypus vorziehen, um weniger aufzufallen.
item.cybertorso.variant.synthetic=Cybertorso, synthetisch
item.cybertorso.variant.obvious=Cybertorso, offensichtlich
item.cyberarm=Cyberarm
item.cyberarm.page=290
item.cyberarm.desc=Bei einem Standardcyberarm wird alles von der Schulter abwärts ersetzt, aber es gibt auch die Möglichkeit eines Teilersatzes des Unterarms oder nur der Hand. Eine teilweise Cybergliedmaße muss Attribute haben, die mindestens so hoch sind wie der Rest der Gliedmaße.
