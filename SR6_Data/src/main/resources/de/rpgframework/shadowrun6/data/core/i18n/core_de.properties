item.concealable_holster.page=261
item.concealable_holster.wifi=Sensoren, ein smartes Gewebe und ein aktiver Haftklebstoff ermöglichen es dem Holster, Farbe und Struktur in Echtzeit zu verändern, wodurch sich die Tarnbarkeit noch einmal um 1 erhöht.
