metaecho.data_processing_upgrade.desc=Du kannst eines der Matrixattribute deiner Lebenden Persona um 1 erhöhen. Dieses Echo kann mehrmals gewählt werden, aber jedes Matrixattribut darf höchsten zweimal gesteigert werden.
