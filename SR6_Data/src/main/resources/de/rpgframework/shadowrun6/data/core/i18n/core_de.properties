#Weapon - Accessories
item.airburst_link=Airburst-Verbindung
item.airburst_link.page=259
item.airburst_link.wifi=Eine Airburst-Verbindung benötigt Wi-Fi, um überhaupt funktionieren zu können. Sowohl die Granaten oder Raketen als auch der Werfer müssen im eingeschalteten WiFi-Modus sein.
item.bipod=Zweibein
