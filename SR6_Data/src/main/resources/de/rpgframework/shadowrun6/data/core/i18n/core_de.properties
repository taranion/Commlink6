#Skills
skill.astral=Astral
skill.astral.page=95
skill.astral.desc=Diese Fertigkeit kann nur von Voll- und Aspektzauberern sowie von Adepten und Magieradepten, die die Adeptenkraft Astrale Wahrnehmung beherrschen, eingesetzt werden. Sie verfügt über zwei hauptsächliche Einsatzgebiete - zum einen das Askennen astraler Auren (siehe S. 161), zum anderen den Astralkampf (siehe S. 162).
skill.astral.astral_combat=Astralkampf
skill.astral.astral_signatures=Astrale Signaturen
skill.astral.emotional_stress=Gefühlszustände
skill.astral.spirit_types=Geisterarten
skill.athletics=Athletik
skill.athletics.page=95
skill.athletics.desc=Die Fertigkeit Athletik umfasst alles, was mit körperlicher Leistungsfähigkeit und Anmut zu tun hat. Als vielseitig verwendbare Fertigkeit kann Athletik auf unterschiedliche Art und Weise eingesetzt werden. Sie kommt bei Sprinten-Proben (S. 45) und beim Ausweichen (S. 42) zum Einsatz und ist im Fall von Projektil- und Wurfwaffen auch eine Angriffsfertigkeit. Meist werden Athletikproben mit dem Attribut Geschicklichkeit abgelegt, um flüssige Bewegungsabläufe abzubilden. Bei Proben, bei denen eher schiere Muskelkraft gefragt ist, kann als verknüpftes Attribut auch Stärke verwendet werden. Athletikproben sind meist Einfache Proben. Athletik wird auch zum Springen verwendet. Pro Erfolg bei einer Probe auf Athletik + Geschicklichkeit springt man aus dem Stand 1 Meter, mit Anlauf 2 Meter weit, maximal aber [Geschicklichkeit × 1,5] Meter weit. Mit derselben Probe springt man pro Erfolg 0,5 Meter hoch, maximal aber [Körpergröße × 1,5] Meter hoch. Auch Tauchen und freier Fall werden durch diese Fertigkeit abgedeckt.
skill.athletics.archery=Projektilwaffen
skill.athletics.climbing=Klettern
skill.athletics.flying=Fliegen
skill.athletics.gymnastics=Akrobatik
skill.athletics.sprinting=Sprinten
skill.athletics.swimming=Schwimmen
skill.athletics.throwing=Werfen
skill.biotech=Biotech
skill.biotech.page=95
skill.biotech.desc=Diese Fertigkeit ist das Einsatzgebiet aller Charaktere, die in der metamenschlichen Biologie versiert sind. In der Sechsten Welt gehen damit auch Kenntnisse über die Wechselwirkungen zwischen dieser Biologie und verschiedenen Bodytech-Implantaten und Ausrüstungsgegenständen einher. Die Fertigkeit Biotech kommt bei Erste Hilfe und sonstigen Heilungsproben (S. 122) zum Einsatz, kann aber auch bei der Untersuchung und Reparatur von Cyberware, Bioware und anderer Bodytech verwendet werden. Außerdem kann diese Fertigkeit genutzt werden, um Cyberware - aber keine anderen Arten von Bodytech - zu implantieren.\nAbseits der Ersten Hilfe oder Heilung ist Biotech in der Regel eine Einfache Probe, bei der der Charakter auf Biotech + Logik würfelt und auf Basis der erzielten Nettoerfolge Erkenntnisse gewinnt oder eine Reparatur durchführt. 
skill.biotech.biotechnology=Biotechnologie
skill.biotech.cybertechnology=Cybertechnologie
skill.biotech.first_aid=Erste Hilfe
skill.biotech.medicine=Medizin
skill.close_combat=Nahkampf
skill.close_combat.page=98
skill.close_combat.desc=Stehst du direkt neben jemandem? Versuchst du, ihm wehzutun? Dann nutze diese Fertigkeit! Egal, ob du schlägst, stichst, knüppelst oder eine andere Variante wählst, du legst eine Vergleichende Probe auf Nahkampf + Geschicklichkeit gegen Reaktion + Intuition ab.\nGenauere Informationen zum Kampf findest du im Kapitel Kampf auf Seite 107.
skill.close_combat.blades=Klingenwaffen
skill.close_combat.clubs=Knüppel
skill.close_combat.unarmed=Waffenloser Kampf
skill.con=Überreden
skill.con.page=98
skill.con.desc=Der Schlüssel zu dieser Fertigkeit ist Überzeugungskraft, denn beim Überreden geht es darum, sich als jemand oder etwas auszugeben, der oder das man nicht ist. Vielleicht willst du jemanden glauben machen, dass du der lange verschollene Erbe eines Teils von Dunkelzahns Hort bist; vielleicht tust du auch so, als wärst du ein vom Pech verfolgter Anzugträger, der es mit einem großen Coup wieder zurück an die Spitze schaffen will. Aber ganz egal, wie genau das Szenario aussieht: Überreden ist die Fertigkeit, die zum Einsatz kommt, wenn du andere davon überzeugen willst, dir deine Rolle abzunehmen.
skill.con.acting=Schauspielerei
skill.con.disguise=Verkleiden
skill.con.impersonation=Verkörpern
skill.con.performance=Vorführen
skill.conjuring=Beschwören
skill.conjuring.page=96
skill.conjuring.desc=Diese Fertigkeit erlaubt das Herbeirufen und Verbannen von Geistern. Für weitere Informationen siehe Beschwören, S. 148.
skill.conjuring.banishing=Verbannen
skill.conjuring.summoning=Herbeirufen
skill.cracking=Cracken
skill.cracking.page=96
skill.cracking.desc=In der Matrix hat man grundsätzlich die Wahl zwischen zwei Arten von Aktivitäten: legalen und illegalen. Cracken kommt immer dann zum Einsatz, wenn es um die illegalen Aktivitäten geht. Genaue Informationen zum Einsatz von Cracken findest du im Kapitel Matrix auf Seite 176.
skill.cracking.cybercombat=Matrixkampf
skill.cracking.electronic_warfare=Elektronische Kriegsführung
skill.cracking.hacking=Hacken
skill.electronics=Elektronik
skill.electronics.page=96
skill.electronics.desc=Diese Fertigkeit kommt bei der legalen Seite der Matrixaktivitäten zum Einsatz. Egal, ob du ein Kommlink oder einen Computer benutzt, mit einem schnellen, nicht unbedingt eleganten Fix ein Programm wieder zum Laufen bringst, deine Hardware frisierst oder andere ähnliche Tätigkeiten ausführst - Elektronik ist die passende Fertigkeit. Weitere Informationen zum Einsatz von Elektronik findest du im Kapitel Matrix auf Seite 176. 
skill.electronics.computer=Computer
skill.electronics.hardware=Hardware
skill.electronics.software=Software
skill.enchanting=Verzaubern
skill.enchanting.page=99
skill.enchanting.desc=Verzaubern wird genutzt, um alchemistische Erzeugnisse, Foki, Fetische und andere magische Gegenstände herzustellen - und bisweilen auch, um sie zu zerstören. Weitere Informationen dazu findest du im Abschnitt Verzaubern im Kapitel Magie auf Seite 151.
skill.enchanting.alchemy=Alchemie
skill.enchanting.artificing=Fokusherstellung
skill.enchanting.disenchanting=Entzaubern
skill.engineering=Mechanik
skill.engineering.page=97
skill.engineering.desc=Bei Mechanik geht es darum, Gegenstände dazu zu bringen, dass sie tun, was du willst - Autos sollen fahren, Flugzeuge fliegen, Boote schwimmen, Maschinen sollen anspringen und rattern und das tun, wofür sie gebaut wurden, und Waffen sollen gefälligst ihren Zweck erfüllen. Wie sich aus den Spezialisierungen erkennen lässt, werden mit dieser Fertigkeit teils sehr breite Themengebiete abgedeckt, aber im Grunde beschäftigt sich Mechanik mit vier grundlegenden Tätigkeiten: Bauen, Reparieren, Improvisieren und dem Einsatz fahrzeugmontierter Geschütze (s. hierzu den Abschnitt Fahrzeugkampf, S. 200). 
skill.engineering.aeronautics_mechanic=Luftfahrzeugmechanik
skill.engineering.armorer=Waffenbau
skill.engineering.automotive_mechanic=Fahrzeugmechanik
skill.engineering.demolitions=Sprengstoffe
skill.engineering.gunnery=Geschütze
skill.engineering.industrial_mechanic=Industriemechanik
skill.engineering.lockpicking=Schlösserknacken
skill.engineering.nautical_mechanic=Seefahrtmechanik
skill.exotic_weapons=Exotische Waffen
skill.exotic_weapons.page=97
skill.exotic_weapons.desc=Einige Waffen sind komplett anders als alle anderen, und es ist spezielles Training nötig, um sie einsetzen zu können. Die Fertigkeit Exotische Waffen bildet den Umgang mit derartigen Waffen ab. Damit diese Fertigkeit eingesetzt werden kann, muss eine Spezialisierung gewählt werden. Du kannst diese Fertigkeit nur dann einsetzen, wenn du auch über die passende Spezialisierung für die jeweilige Waffenart verfügst. Für diese Fertigkeit kann keine Expertise erworben werden. Du kannst diese Fertigkeit jedoch wie gewohnt steigern, und der entsprechende Wert gilt dann für alle deine Spezialisierungen. Diese Fertigkeit ist eine Ausnahme von der Regel, dass pro Fertigkeit immer nur eine Spezialisierung erlaubt ist.
skill.firearms=Feuerwaffen
skill.firearms.page=97
skill.firearms.desc=Du willst auf irgendetwas schießen? Dann ist eine Probe auf diese Fertigkeit fällig. Grundsätzlich legst du eine Probe auf Feuerwaffen + Geschicklichkeit gegen Reaktion + Intuition des Gegners ab. Alle weiteren Details findest du im Kapitel Kampf auf Seite 107.
skill.firearms.automatics=Automatikwaffen
skill.firearms.longarms=Maschinengewehre
skill.firearms.pistols=Pistolen
skill.firearms.rifles=Gewehre
skill.firearms.shotguns=Schrotflinten
skill.influence=Einfluss
skill.influence.page=96
skill.influence.desc=Diese Fertigkeit ist neben Überreden die zweite Möglichkeit, die Meinung anderer Leute zu beeinflussen. Man könnte sagen, dass Einfluss die „ehrlicheren“ Varianten dieses Vorhabens in sich vereint, aber das würde vielen aufrechten Betrügern unrecht tun und die Integrität von Verhandlungsführern aus der Wirtschaftswelt weit über ihren Scheffel stellen. Letztlich gilt: Wann immer du versuchst, deinen Runnerkollegen Mut zu machen, Mr Johnson noch ein paar Nuyen mehr abzuluchsen oder jemandem unmissverständlich klarzumachen, dass er dir besser nicht in die Quere kommen sollte, wenn er nicht ganz neue Dimensionen von Schmerz kennenlernen möchte, dann ist Einfluss die richtige Fertigkeit. 
skill.influence.etiquette=Gebräuche
skill.influence.instruction=Unterrichten
skill.influence.intimidation=Einschüchtern
skill.influence.leadership=Führen
skill.influence.negotiation=Verhandeln
skill.outdoors=Natur
skill.outdoors.page=98
skill.outdoors.desc=Es gibt schlechtere Dinge, als die eigenen vier Wände nie zu verlassen, vor dem Trideo zu sitzen und WhompSnappers in sich hineinzustopfen, aber manchmal lassen sich Ausflüge in die Außenwelt nicht vermeiden. Für diese Gelegenheiten gibt es die Fertigkeit Natur. Sie kommt zum Einsatz, wenn du einer Spur folgst, Nahrung auftreiben willst oder den kürzesten Weg zu deinem Ziel finden möchtest. Normalweise werden Naturproben als Einfache Probe auf Natur + Intuition abgelegt. Der Schwellenwert wird mithilfe der Richtlinien für Schwellenwerte (S. 37) festgelegt. Alternativ kann der Schwellenwert für Spurenlesenproben auch anhand der Anstrengungen bestimmt werden, die beim Verbergen der Spuren unternommen wurden.
skill.outdoors.navigation=Navigation
skill.outdoors.survival=Survival
skill.outdoors.tracking_woods=Umgebung Wald
skill.outdoors.tracking_desert=Umgebung Wüste
skill.outdoors.tracking_urban=Umgebung Stadt
skill.outdoors.tracking_other=Umgebung Sonstige
skill.perception=Wahrnehmung
skill.perception.page=99
skill.perception.desc=Schleicht da vorne jemand durch den Smog? Ist im Schreibtisch dieses Execs ein Geheimfach verborgen? Wo ist der Lichtschalter? Dies sind Beispiele für Fragen, die sich mit einer Wahrnehmungsprobe beantworten lassen. Wenn der Zweck der Probe eine genaue Untersuchung der Umgebung ist, wird eine Einfache Probe auf Wahrnehmung + Intuition abgelegt. Den Schwellenwert legt der Spielleiter in Abhängigkeit davon fest, wie schwer das Gesuchte zu entdecken ist (Beispielwerte findest du in der Tabelle Schwellenwerte für Wahrnehmungsproben). Wahrnehmung kommt außerdem immer dann zum Einsatz, wenn man jemanden entdecken möchte, der nicht gesehen werden will. 
skill.perception.visual=Sehen
skill.perception.aural=Hören
skill.perception.tactile=Tasten
skill.perception.scent=Riechen
skill.perception.taste=Schmecken
skill.perception.perception_woods=Umgebung Wald
skill.perception.perception_desert=Umgebung Wüste
skill.perception.perception_urban=Umgebung Stadt
skill.perception.perception_other=Umgebung Sonstige
skill.piloting=Steuern
skill.piloting.page=98
skill.piloting.desc=Steuern kommt immer dann zum Einsatz, wenn ein Charakter ein anspruchsvolles Manöver mit einem Fahrzeug durchführen möchte (und ist deshalb eine essenzielle Fähigkeit für alle Rigger). Generell sind Steuernproben Einfache Proben auf Steuern + Reaktion. Der Schwellenwert ist im Regelfall gleich dem Handlingwert des gesteuerten Fahrzeugs, kann aber in Abhängigkeit von der Komplexität des jeweiligen Manövers auch höher sein (Spielleiterentscheid). Manchmal werden Steuernproben auch eingesetzt, um Verfolger abzuschütteln, jemanden zu verfolgen oder andere Aktionen abzuhandeln, die mehr als ein Fahrzeug betreffen. 
skill.piloting.ground_craft=Bodenfahrzeuge
skill.piloting.aircraft=Luftfahrzeuge
skill.piloting.watercraft=Wasserfahrzeuge
skill.sorcery=Hexerei
skill.sorcery.page=98
skill.sorcery.desc=Die Anwendungsmöglichkeiten der Fertigkeit Hexerei sind vielfältig - zu vielfältig, um sie hier abdecken zu können. Im Kapitel Magie findest du genauere Informationen zu Zaubern (S. 133), Antimagie (S. 145) und anderen Einsatzgebieten.
skill.sorcery.counterspelling=Antimagie
skill.sorcery.ritual_spellcasting=Ritualzauberei
skill.sorcery.spellcasting=Spruchzauberei
skill.stealth=Heimlichkeit
skill.stealth.page=97
skill.stealth.desc=Wie der Name schon sagt, sollten Shadowrunner möglichst auf Unauffälligkeit bedacht sein. Das macht Heimlichkeit zu einer sehr wertvollen Fertigkeit. Sie deckt alle Aktivitäten ab, die Charaktere unbemerkt von anderen durchführen möchten: Wenn du in eine Forschungsanlage einbrechen oder einem Mafia-Don einen Credstick unter der Nase wegstehlen möchtest, dann kommt Heimlichkeit zum Einsatz. In der Regel wird zu Beginn eines solchen Unterfangens eine Probe auf Heimlichkeit + Geschicklichkeit abgelegt. Die dabei erzielten Erfolge bestimmen den Schwellenwert für andere, die bemerken wollen, was der Charakter im Schilde führt. Manchmal versucht ein Charakter auch spontan, sich möglichst heimlich zu verhalten. In diesem Fall wird eine Vergleichende Probe auf Heimlichkeit + Geschicklichkeit gegen Wahrnehmung + Intuition abgelegt.
skill.stealth.camouflage=Tarnung
skill.stealth.disguise=Verkleiden
skill.stealth.palming=Fingerfertigkeit
skill.stealth.sneaking=Schleichen
skill.tasking=Tasken
skill.tasking.page=98
skill.tasking.desc=Diese Fertigkeit wird von Technomancern für ihre Technomanceraktivitäten verwendet. Weitere Informationen dazu findest du im Abschnitt Technomancer auf Seite 188.
skill.tasking.compiling=Kompilieren
skill.tasking.decompiling=Dekompilieren
skill.tasking.registering=Registrieren
skill.language=Sprache
skill.language.page=100
skill.knowledge.desc=Da auf Wissensfertigkeiten keine direkten Fertigkeitsproben abgelegt werden, verfügen sie nicht über Fertigkeitswerte. Stattdessen kommen sie zum Einsatz, wenn ein Charakter die Chance hat, im Zuge anderer Proben zusätzliche Informationen zu erhalten. Verfügt ein Charakter beispielsweise über die Wissensfertigkeit Sicherheitssysteme und legt dann eine Wahrnehmungsprobe ab, um den Außenbereich einer Konzernanlage genauer unter die Lupe zu nehmen, dann kann er mit dieser Probe vielleicht erkennen, wo sich Kameras befinden und wann Streifen vorbeikommen. Wenn ein Charakter die Wissensfertigkeit Seattler Gangs besitzt, wird ihm eine erfolgreiche Wahrnehmungsprobe vielleicht verraten, dass die Personen, die sich ihm gerade nähern, Mitglieder der Gang der Halloweeners sind. Die Wissensfertigkeit Straßen von Seattle könnte sich bei Naturproben im Raum Seattle als hilfreich erweisen. Die Spieler können zudem Proben auf Erinnerungsvermögen (S. 37) ablegen, um sich an bestimmte Fakten aus Themengebieten zu erinnern, die durch ihre Wissensfertigkeiten abgedeckt sind.\nGrundsätzlich dürfen Wissensfertigkeiten nicht ungeübt eingesetzt werden.
skill.knowledge=Wissen
skill.knowledge.page=100
skill.language.desc=Die Sechste Welt ist die Heimat einer Vielzahl von Sprachen. Alle Sprachen, die wir aus unserer Welt kennen, existieren auch weiterhin, aber dazu kommen noch einige neue, beispielsweise Sperethiel, die Sprache der Elfen, Or’zet, die Sprache der Orks, und Stadtsprech, die Sprache der Straßen. Zu wissen, welche Sprache man wählen muss, kann entscheidend sein, wenn man jemandem eine geheime Information entlocken oder eine gute Beziehung zu einer wichtigen Connection aufbauen möchte.\nSprachfertigkeiten sind Wissensfertigkeiten mit Spezialisierungsstufen.

