itemmod.accessory_rail_left.desc=Current firearm industry standards call for most weapons to feature at least two integral accessory rails or mounts as standard. These usually are located over or under the barrel. For many shooters and professionals, however, this simply isn't enough. Typically attached to the firearm's sides, accessory rails enable shooters to add two more accessories than what the weapon could normally mount. These mounts may vary in exact size depending on the weapon, but one rail accepts one accessory. Pistols are unable to accept accessory rails on the sides because they interfere with the weapon's operation. accessory rails
itemmod.accessory_rail_right.desc=Current firearm industry standards call for most weapons to feature at least two integral accessory rails or mounts as standard. These usually are located over or under the barrel. For many shooters and professionals, however, this simply isn't enough. Typically attached to the firearm's sides, accessory rails enable shooters to add two more accessories than what the weapon could normally mount. These mounts may vary in exact size depending on the weapon, but one rail accepts one accessory. Pistols are unable to accept accessory rails on the sides because they interfere with the weapon's operation. accessory rails
itemmod.biometric_gun_lock.desc=On the list of things that absolutely suck during a firefight, having your weapon taken from and then used against you is near the top. Biometric locks (usually) prevent this by locking the weapon in a "safe" mode, rendering it inert if anyone other than the weapon's primary (or other authorized) user attempts to use it. Installed in the weapon's grip, biometric locks are programmed to read biometric profiles that are programmed into and then stored in a standard or weapon commlink to remotely activate/deactivate the weapon as needed. Additional profiles can be programmed so that friendlies can use the weapon in emergencies. And for additional fun, the biometric lock can also be linked to a weapon security system to trigger whatever security measures are installed. \nBe warned: The electronic system can be made wireless, which means it's hackable, which in turn means someone could get in and erase all stored biometric profiles, making the weapon unusable. \nNote: If not connected to a commlink or tactical network, the biometric gun lock has a device rating of 2.
itemmod.folding_stock.desc=A simple after-market modification for SMGs, shotguns, and rifles, folding stocks are often used to make the weapon more portable and concealable when not in use and provide some stability while firing. When in use, they simply fold out and act like a normal stock would. After-market folding stocks tend to be a bit weaker structurally, as well as uncomfortable. They also don't absorb as much recoil if the weapon is being used for full-auto fire or long-range shooting. \nFolding and unfolding the stock is a Minor Action. \nNote: If attached to a weapon, apply the following to the Attack Rating adjustments, remembering that Attack Ratings cannot go below zero: , /, / -1/ -2/ -3. Also, add +1 to the threshold of a Perception test for anyone attempting to spot this weapon when it is concealed.
itemmod.collapsible_stock.desc=Classic and simple versatility. Going long, slide it out. In close, tuck it tight. Bulked up in armor, set it for comfort. It may be simple, but it provides options. \nWireless: Changing the setting does not require an action. \nNote: The collapsible stock operates on two basic settings (full and tucked), which can be swapped with a Minor Action. On full, the collapsible stock alters AR as follows:  -2/, /+1/+2/+1. On tucked, it alters AR as follows: +1/+1/, / -2/ -2 and increases the concealability threshold by 1. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.barrel_extension.desc=Slapping a few extra inches on the end of a barrel makes a world of difference when you're putting hot lead way down range. It even helps when trying to do mid-range work with a short-range arm. Problem is, it makes it harder to tuck and run, and you start finding that when the barrel clears a corner first, lead often finds its way to you before you get a chance to fire some of your own. \nNote: The barrel extension mod moves the concealability threshold of a weapon down one, adds an available AR range category that starts at 0, and modifies the AR as follows:  -2/, /+1/+2/+2. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.easy_breakdown.desc=Being able to get that pistol, SMG, sniper rifle, or whatever down to its component bits is great when making a quick getaway or attempting to sneak it through scanners. Most sec forces are trained to recognize weapon parts, but it's better than nothing. Bigger arms often come with a case for a little extra (250 nuyen), and for the smaller ones you can usually find something to disguise it as. \nWireless: AR guides help break down larger arms in a single Major Action and smaller arms in a single Minor Action. \nNote: It takes two Major Actions to break down SMGs and larger weapons into their components for storage or stealth purposes, and one to break down pistols. When a weapon is broken into component form, increase its concealability threshold by 2. The assembly process takes the same amount of time.
itemmod.custom_style.desc=We all know most weapons carry an inherent level of social threat, but with the right touches, colors, and accents an instrument of death can easily become a work of art, while remaining deadly. The direction and purpose of that artistic flair can easily translate into a bit of social nudging. Which direction the nudge goes is all based on the user's desires. Plate it in gold to show your flashy side, matte black and some red highlights for some intimidation, or covered in expensive filigree to show your peers how elegant lethality can be, or a nice patriotic jade green and white to show your status within MCT. \nNote: There are four individual styles to choose from, each associated with an Influence skill specialization: Etiquette, Intimidation, Leadership, and Negotiations (sorry, no way to use your weapon to make you a better Instructor). When presenting the weapon, whether for display or attack, the character gains a bonus Edge for the associated Social test (but not for any other tests).
itemmod.dikote.desc=Through a process that deposits a thin diamond coat on a sharp surface such as a blade or arrowhead, the cutting and edge-retention abilities of an item can be enhanced. The process to apply dikote involves brief exposure of the base material to a plasma furnace, which limits the process to sufficiently durable materials like steel and ceramic. \nNote: Dikote increases the Attack Rating of a weapon or ammunition by 1, but it is limited to items that rely on a sharp edge.
itemmod.foregrip.desc=The simple installation of a grip along the barrel is such a game-changer across so many aspects of modern warfare. Sweeps and turns are quicker, grip and control are stronger, and recoil is easier to keep in check. A simple tool with so many versatile supports. \nNote: The mod alters the Attack Rating as follows: +1/+2/+1/, /,  and reduces the AR penalty for Burst Fire by 1. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.gas-vent_improved.desc=The street sammie's dream! Slap a sweet Ingram XI with this system, and it's like firing on a cloud. Muzzle rise is a thing of the past, and these systems make the spray and pray more of a you spray, and they pray they don't get tagged. \nNote: This system adjusts Attack Ratings as follows: , /+1/+2/+2/, . If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected. Attack Rating reductions for Semi Auto, Burst Fire, and Full Auto change to 1, 3, and 4 respectively. \nCannot be combined with a silencer or suppressor.
itemmod.gecko_grip.desc=The material has been great for climbing for decades and making stuff stick to other stuff really well. Deciding to take a layer and apply it to the grip of a weapon to make sure it stays in your hand is a genius move. The gecko grip isn't just about holding on, it can also be programmed to stick the weapon to a surface or a person for storage or sneaking. \nWireless: Activation or deactivation commands can be issued to multiple devices. Activating or deactivating provides a bonus Minor Action. \nNote: Gecko grip provides a bonus Edge that can only be used on tests to maintain a grip on a weapon. Activating or deactivating the sticking features requires a Minor Action.
itemmod.gyro_mount_ii.desc=Base models can always be upgraded, and the advancements made to improve the basic gyro mount are SOTA. Micro-articulate stabilization, nano-responsive energy absorption protocols, and wireless-commanded mounts make this the slickest recoil-absorbing articulated firing platform on the market. \nWireless: Exiting the harness using wireless quick-release is a Minor Action. The weapon's augmented reality firing control system can be used to free up the firer's hands to perform other actions while the weapon is firing. This includes making an attack with another weapon if a Major Action is available. \nNote: The gyro mount II negates the SA and BF modifiers to Attack Rating by 1 and reduces FA modifier to 2. This system also shifts the Strength requirements for medium and heavy machine guns to 2+ and 3+ respectively. While wearing the harness, characters lower both Agility and Reaction by 1. Attaching or removing a weapon from the mount takes a Minor Action. Putting on a gyro-mount harness takes about a minute, while the quick-release allows you to get out of it with a Major Action.
itemmod.heavy_weight.desc=Nice thing about a gun with some girth is that it never comes far off the target when you pull the trigger. It also gives you some real buff arms shooting that thing all day, but then again, if you know what you're doing, you never have to shoot for that long. \nNote: This mod alters a weapon's AR as follows:  -2/+2/+1/, /,  and changes the AR modification from Burst Fire from 4 to 3 (p. 109, SR6). If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.light_weight.desc=Even trimming just a few ounces off your favorite weapon can give you that momentary advantage you need to be the one slinging death instead of sucking lead. You might pay for it with some of those recoil monsters, since they are going to buck like a slitch, but life in the shadows is all about choices. \nNote: This mod alters a weapon's AR as follows: +2/, / -2/, /,  and changes the Burst Fire AR decrease from 4 to 5 (p. 109, SR6). If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.melee_hardening.desc=Sometimes in combat, you run out of options and have no other choice than to clobber a fragger with your firearm. And most modern firearms aren't exactly meant to take that kind of punishment without risking damage to the internal electronics or breaking the weapon itself. Or maybe you just like having a gun that doubles as a club. In either case, you'd better modify your weapon with melee hardening. Accomplished through a metallurgic enhancing process called Chemo- Forge™, this treatment structurally enhances the outside and internals, increasing the firearm's structural strength by approximately 150 percent. The process works just as advertised, but there's a drawback. The process permeates the weapon, and while the manufacturer claims the process has no side effects on maintenance or performance, multiple field reports say that after the melee hardening process, firearms are said to feel a bit "sticky." \nNote: When used as melee weapon: [DV 3S, 4/, /, /, /, ]. This modification takes up two modification slots.
itemmod.metahuman_adaption.desc=These are simple but necessary modifications for trolls, dwarfs, and other metatypes that live in a world built for human proportions. Balance, grip length and thickness, and sometimes even total weapon length are adapted your personal stature. \nNote: Metahuman adaptation negates the  -2 dice pool penalty on actions involving gear not designed for your metatype. Instead, humans using such weapons suffer a  -2 dice pool penalty when using the modified item.
itemmod.metahuman_adaption_close.desc=These are simple but necessary modifications for trolls, dwarfs, and other metatypes that live in a world built for human proportions. Balance, grip length and thickness, and sometimes even total weapon length are adapted your personal stature. \nNote: Metahuman adaptation negates the  -2 dice pool penalty on actions involving gear not designed for your metatype. Instead, humans using such weapons suffer a  -2 dice pool penalty when using the modified item. This modification does not count against the limit of one modification per melee weapon.
itemmod.nanoconstruction.desc=With the bulk of the damn Monads off on their grand space adventure, we can now get back to the regularly scheduled program of building things with nanoforges. The additional speed and efficiency with construction gives every item using nanconstructed parts the slightest of edges over standard manufacture. \nNote: Items with this mod use the wild die in place of one of the dice rolled as part of an attack.
itemmod.no_stock.desc=Chopping the stock off your shotgun or assault rifle is a common way to increase its ability to be concealed and to make it a hair more efficient in close quarters. You lose out on some accuracy at range, but you don't do this to hunting and sniping rifles. \nNote: This mod alters the AR as follows:+2/, / -1/ -2/ -3 and increases the concealability threshold by 1. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.personalized_grip_ranged.desc=Modifying a weapon to one's personal specs is one thing, but personalized grip takes that idea one step farther. Available for melee weaponry and firearms, a personalized grip fits the weapon specifically for a particular user's hands, making it more effective for them to use. The downside to this is that any weapon with a personalized grip modification is more difficult for anyone else to use. \nNote: If attached to a firearm, apply the following Attack Rating adjustments: +1/+1/, /, /, . If attached to a melee weapon, apply the following to the Attack Rating: +2/, /, /, /, .
itemmod.personalized_grip_melee.desc=Modifying a weapon to one's personal specs is one thing, but personalized grip takes that idea one step farther. Available for melee weaponry and firearms, a personalized grip fits the weapon specifically for a particular user's hands, making it more effective for them to use. The downside to this is that any weapon with a personalized grip modification is more difficult for anyone else to use. \nNote: If attached to a firearm, apply the following Attack Rating adjustments: +1/+1/, /, /, . If attached to a melee weapon, apply the following to the Attack Rating: +2/, /, /, /, .
itemmod.rigid_stock.desc=A solid mass at the back of a solid weapon can make all the difference in getting the right shot. It feels steady and strong tucked in tight and even slips under your armpit more comfortably than one of those thin pieces of plastic or polycarbonate. Even if you think that pretty walnut job is all the rage, a real rigid stock is a whole different animal. \nNote: The rigid stock replaces any other stock or adds a stock. When replacing another stock, it alters the AR as follows: , /+1/+1/+2/+1. When adding to a weapon without a stock, it alters AR as follows:  -1/+1/+1/+2/+1 and decreases the concealability threshold by 1. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.safe_firing_iff_system.desc=News flash: Combat is chaotic. And with the advent of modern tech and the inclusion of magical effects onto the battlefield, it's only gotten worse. The middle of this chaos is where you get casualties from friendly fire. To help prevent this, the Safe Firing IFF (identification friend/foe) System was developed. Designed to work in conjunction with the basic smartgun system, commlinks, and other sensor platforms, current Safe Firing Systems employ a combination of built-in, multiple, redundant detection/identification methods (including RFID tags, biometrics, and body/facial recognition software) to identify friendlies in combat. When active, the Safe System uses these methods to create an "ID profile" which helps prevent a weapon from firing at someone who has been identified as a friendly. For the system to work, it must be used in conjunction with a smartgun system. The current Safe Firing System can be programed with up to ten profiles, which can be deleted, updated, or replaced as needed. \nNote: Weapon must also be equipped with a smartgun system to use this modification. Safe Firing IFF System will not allow a weapon to fire at a target within Close range (0 -3m) of a friendly. This modification takes two slots.
itemmod.short_barrel.desc=Chopping down the barrel sacrifices some distance shooting, but it makes tucking that beast in around corners a whole lot easier. Not to mention tucking it under your coat. This mod works best with shotguns and assault rifles, but you can feel free to chop the end off that assault cannon if you want! \nNote: The short-barrel mod increases the concealability threshold of a weapon by 1, removes the longest-range Attack Rating available for the weapon (thus decreasing its range), and alters the AR as follows: +2/+1/ - 2/, /, . If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected.
itemmod.revolution_arms_collapsible_stock.desc=This ain't your grandpa's collapsible! Wireless tech and custom pneumatics provide an infinite level of customization of position along with recoil absorption. From full extension to full collapse, the wonderbrains at Evo are truly rEVOlutionizing wartech. \nWireless: Changing the setting does not require an action. \nNote: The rEVO stock operates across three basic settings: full, tucked, and collapsed, which can be swapped with a Minor Action. On full, the collapsible stock alters AR as follows:  -2/, /+1/+2/+1. On tucked, it alters AR as follows: +1/+1/, / -2/ -2 and increases the concealability threshold by 1. On collapsed, it alters the AR as follows: +2/, / -1/ -2/ -3 and increases the concealability threshold by 1. If a weapon has no Attack Rating in a given range category before this modification is applied, that category is not affected. When attacking with a weapon with this mod, replace one die from your dice pool with the wild die.
itemmod.side_ammo_mount.desc=It cannot be said enough: there's no such thing as having too much ammo during a prolonged battle. But there're also times when it's not the amount of ammo you have, but the type. It's not uncommon to find some fragger who has some kind of specialty armor or protection that requires a quick ammo changeup. Or mission parameters may change and require going from less-thanlethal to lethal ammo, or vice versa. Side ammo mounts allow shooters to have extra clips or shotgun shells ready for when the change is required without having to use an ammo pouch. Typically mounted on the weapon's side opposite the ejection port, the side ammo mount can hold one clip or five shotgun shells. Handy for keeping an extra clip or shells on hand, ammo mounts make the weapon bulkier and harder to conceal. Additionally, side mounts are incompatible with the use of any detachable drum magazines. \nNote: With this modification, the reload weapon action becomes a minor action. User can also load and ready one shotgun shell into the chamber as minor action. Threshold to perceive the weapon on concealment tests is lowered by one.
itemmod.stock.desc=It may seem obvious, but sometimes just throwing something as simple as a stock on a weapon can offer stability. This isn't anything more special than a piece of regular composite (or wood, if you're rich) that is mounted on the back of the weapon. You can even toss them on pistols, though you still don't get much benefit in the way of range. \nNote: The mod alters the AR as follows:  -1/+2/+1/, /, .
itemmod.trigger_removal.desc=A popular weapon modification for shooters who (for whatever reason) have difficulty manipulating a standard trigger, the trigger removal modification replaces the normal mechanisms with a remote trigger assembly. This assembly is linked directly to a smartgun system and allows the user to fire and otherwise operate the weapon with a mental or pre-programmed verbal/audio command. The major downside to this modification is that if wireless connectivity is lost, then all a shooter has is a hunk of metal and plastics. \nNote: Requires smartgun system and wireless connection to function. This modification takes two slots.
itemmod.underbarrel_weapon_mount_attach.desc=In combat, you need any edge you can get, and that sometimes means adding even more bang to your bang-bang. Underbarrel weapons first gained prominence in the late 1960s when grenade launchers were attached under the barrels of what we today consider assault rifles. And it wasn't long until other weapons were being attached. The underbarrel weapon attachment mount allows for multiple purpose- built weapon-types (each sold separately!) to be attached and integrated into the host weapon system. While this allows for some interesting combinations, using an underbarrel weapon that's not integrally designed into the host weapon makes it extremely bulky, so good luck trying to hide it. The current popular weapons to attach include: a small shotgun, a micro-grenade launcher, a micro combat chainsaw, bolo launcher, and grapple hook launcher. \nNote: The installation of an underbarrel weapon effectively removes the underbarrel slot for further accessories. Underbarrel weapons are not available for pistols and SMGs. This modification takes two slots. \nIf a hit on a target is successful with micro bolos, the target is receives the Hobbled status. \nSuccessful ‘attack' means grapple hook is secured. The micro line has maximum range of 100 meters and supports up to 100 kilos. Attachment hook is included; additional climbing gear sold separately.
itemmod.underbarrel_weight.desc=One way or the other, you can tweak your street howitzer to ignore that desire to rise upward after every shot by making the barrel too much to throw. It does a great job of bulking up your forearms on pistols and makes a great shoulder workout for the rest, but slinging lead downrange in rapid succession is a lot easier when the barrel doesn't keep bucking off target. \nNote: The mod alters the AR as follows:  -2/+1/+1/, /,  and decreases the AR modifier for Semi-Automatic and Burst Fire by 1 and Full-Auto by 2.
itemmod.weapon_security_system.desc=There are many times on or off the battlefield when someone will try to take your weapon from you. Maybe they've pulled off some wiz martial arts move or a lucky shot and disarmed you. Or maybe they've broken into your storage locker for a snatch and grab. Or maybe, they're taking it from your cold dead hands. To prevent the weapon from being used against you (or as a final "frag you" if you're geeked), some shooters install a weapon security system (WSS). A WSS has three components: a basic recognition system, a linked biometric lock, and the anti-theft countermeasure. Linked to a smartgun system and/or a weapon commlink, the WSS triggers the anti-theft countermeasure if anyone other than an authorized user attempts to use the weapon. \nThese countermeasures come in three varieties with different levels of severity: spring-loaded AP spikes, taser shock, or explosives. RFID trackers are also available for weapon location and recovery. \nWhile handy, a WSS's popularity is somewhat mixed. Some shooters like the security and final retaliation option they often provide, while others see them as more of a liability in the heat of combat. \nNote: This modification takes two slots. It comes with one anti-theft countermeasure. Additional countermeasures can be added at capacity cost.
itemmod.weapon_commlink.desc=With commlinks being a vital part of life in the Sixth World, it was inevitable that someone would put a commlink into a weapon. And then try to figure out why they wanted to do that. The first weapon commlinks debuted in 2074 and were designed to act as a sort of personal aid for the shooter as well as perform many of the commlink's standard functions. They did not, however, really catch on with professionals, who saw them as superfluous and often unnecessary. But with the ever-advancing threat of modern electronic and cyber-warfare, weapon commlinks found a new lease on life. In 2078, Renraku started producing (with other corps and companies quickly following suit) their version of the weapon commlink, which acts as a dedicated internal communication suite, as well as an additional line of defense against electronic attack. A weapon commlink is basically a micro-command and control router for a user's PAN. It collects and routes all data from broadcasting weapons/gear and encrypts the data making it more difficult to hack. It also provides a firewall that is accumulative when linked with other devices, PANs, or tactical networks. And because the data is routed through the commlink, the weapon commlink will take damage before the weapon itself does, acting s a sort of cyber-circuit breaker. Most electronics will still be shot, but at least the weapon will still go bang when the trigger is pulled. The main drawback to the weapon commlink continues to be how much internal capacity it takes up and the overall cost. \nNote: Weapon commlinks have a device rating 1, Data Processing 1, and Firewall 2. Its Firewall attribute is cumulative with other devices, such as commlinks, cyberjacks, or tactical networks. If the weapon is bricked, it loses all wireless connection/bonuses but can still fire manually. Repairs for weapon commlinks are the same as for cyberdecks.

