qpath.once_bitten.step.addiction.page=132
qpath.once_bitten.step.reconditioning=Reconditioning
qpath.once_bitten.step.reconditioning.page=132

qpath.once_bitten.desc=Characters enter this path after a severe and sudden injury, meaning they entered Physical overflow damage after only one or two attack rolls. The resulting effect is that they are more cautious, as represented by the Immediate Aftermath step. <br/>This step comes with neither a Karma cost or bonus.
qpath.once_bitten.step.immediate_aftermath.desc=In this step, characters receive qualities reflecting the immediate aftermath of the attack. They should receive either the Phobia or the Bad Memories quality to show the impact.
qpath.once_bitten.step.double_sure.desc=Characters with this quality exhibit extra caution when entering a potentially dangerous situation. They will not round a blind corner, enter a dark room, or any other such activity unless they are certain someone or something (like a drone or a spirit) has taken a look first. They will be certain to double-check all information they get from one contact with another contact, and they'll look for two sources for any information they need. This can make them slow in execution, but it's not without its benefits. The character gains a +2 dice pool bonus on any Surprise tests.
qpath.once_bitten.step.addiction.desc=The use of substances to deal with stress has led to a negative outcome, and the character has become addicted to whatever they were using. They receive a level 1 Addiction (p. 74, SR6) to that substance, but they do not gain the Karma bonus from the quality.
qpath.once_bitten.step.reconditioning.desc=The character develops habits and responses to their anxieties and become better able to handle them in the moment. For the most part they are able to function without their need for advance warning and double-checks, though when stress levels rise the gamemaster can require a Composure (2) test to see if the character slips back into their old Double Sure ways for the duration of the encounter.<br/>After half a year with Reconditioning, the character can drop the Phobia quality if they received it, but they should keep the Bad Memories quality if they have that.

