item.incendiary_grenade.desc=Made by manufacturers all over the world, the standard incendiary grenade does one job: It lights things on fire. Modern advancements have not changed the overall concept much. Instead, the updates simply make the incendiary explosive much more effective. First, the grenade sprays the area with a flammable gas, then it releases white phosphorous, igniting the gas and causing anything flammable to catch fire. \nIncendiary grenades do their damage as Fire damage (p. 110, SR6). \nGamemaster note: The damage and duration of the Burning status should be adjusted appropriately to the situation, but the recommended baseline value for the Burning status effect should be 4.
item.incendiary_grenade.variant.mini.desc=Made by manufacturers all over the world, the standard incendiary grenade does one job: It lights things on fire. Modern advancements have not changed the overall concept much. Instead, the updates simply make the incendiary explosive much more effective. First, the grenade sprays the area with a flammable gas, then it releases white phosphorous, igniting the gas and causing anything flammable to catch fire. \nIncendiary grenades do their damage as Fire damage (p. 110, SR6). \nGamemaster note: The damage and duration of the Burning status should be adjusted appropriately to the situation, but the recommended baseline value for the Burning status effect should be 4.
item.chemical_grenade.desc=At its heart, a grenade is just an empty shell with a small explosive charge inside that turns the metal casing into damage-causing shrapnel. However, things get interesting when that shell is filled with something even worse than metal. That's the case behind these insidious grenades. The shells are filled with a highly corrosive liquid substance, and when the explosive goes off inside, it disperses this corrosive liquid to everything within the blast radius. \nChemical grenades do their damage as Chemical damage (p. 109, SR6). \nGamemaster note: The damage and duration of the Corrosive status should be adjusted appropriately to the situation, but we recommend that the baseline value for the Corrosive status effect should be 4.
item.chemical_grenade.variant.mini.desc=At its heart, a grenade is just an empty shell with a small explosive charge inside that turns the metal casing into damage-causing shrapnel. However, things get interesting when that shell is filled with something even worse than metal. That's the case behind these insidious grenades. The shells are filled with a highly corrosive liquid substance, and when the explosive goes off inside, it disperses this corrosive liquid to everything within the blast radius. \nChemical grenades do their damage as Chemical damage (p. 109, SR6). \nGamemaster note: The damage and duration of the Corrosive status should be adjusted appropriately to the situation, but we recommend that the baseline value for the Corrosive status effect should be 4.
item.thermographic_flash-pak.desc=A variation on the standard flash-pak, the thermographic version emits intense infrared pulses, causing those with thermographic vision to suffer the effects of the flash-pak. Those without thermographic vision are spared the effects. The thermographic flash-pak has ten charges and uses one charge per combat round. Plugged in, it recharges one charge every ten seconds. \nWireless Bonus: The strobe sequence can avoid directing strong infrared flashes at the subscribed character, preventing any status for them. The device can recharge by induction, regaining one charge per hour. \nBlinded status is based on thermographic vision. The penalty is bumped down one level with flare compensation, and doesn't apply to normal, lowlight, or ultrasound vision.
item.zapper_grenade.desc=The zapper grenade discharges a massive pulse of electricity within its blast area. The capacitor that delivers this pulse is burned out after a single explosion, but when applied to the correct target, the electrical effects can be long-lasting. Zapper grenades do their damage as Electrical damage (p. 109, SR6).
item.zapper_grenade.variant.mini.desc=The zapper grenade discharges a massive pulse of electricity within its blast area. The capacitor that delivers this pulse is burned out after a single explosion, but when applied to the correct target, the electrical effects can be long-lasting. Zapper grenades do their damage as Electrical damage (p. 109, SR6).
item.paint_grenade.desc=In a world of high-tech sensors, light-bending camouflage technology, magical spells that can render individuals literally invisible, and other such pains in the hoop, it's nice to have a cheap, low-tech means to combat such things. Alternately, there are times when you simply want to slot someone off because you can. Or, because you simply think it's fun. Enter: the paint grenade. A paint grenade is simply a grenade filled with paint that is kept under pressure until it's deployed. Depending on the grenade's yield, it can coat an area between two and five meters, revealing anyone using the aforementioned methods of concealment. Paint grenades come in a variety of colors, but most often they are some kind of obnoxious, extremely bright, glow-in-the-dark neon color that will stand out even in low-light conditions. But when that's not enough, some paint grenades also include near-microscopic reflective matter (meaning glitter) that will reflect any light shined on it. And if that isn't enough, you can also fill a paint grenade with a radioactive tracking dye included that can be detected by any Geiger counter readily available at any major store in the hardware section for only twenty-five nuyen. Thrown paint grenades come in two sizes: standard and large. These operate like standard explosive or less-than lethal grenades.
item.paint_grenade.variant.large.desc=In a world of high-tech sensors, light-bending camouflage technology, magical spells that can render individuals literally invisible, and other such pains in the hoop, it's nice to have a cheap, low-tech means to combat such things. Alternately, there are times when you simply want to slot someone off because you can. Or, because you simply think it's fun. Enter: the paint grenade. A paint grenade is simply a grenade filled with paint that is kept under pressure until it's deployed. Depending on the grenade's yield, it can coat an area between two and five meters, revealing anyone using the aforementioned methods of concealment. Paint grenades come in a variety of colors, but most often they are some kind of obnoxious, extremely bright, glow-in-the-dark neon color that will stand out even in low-light conditions. But when that's not enough, some paint grenades also include near-microscopic reflective matter (meaning glitter) that will reflect any light shined on it. And if that isn't enough, you can also fill a paint grenade with a radioactive tracking dye included that can be detected by any Geiger counter readily available at any major store in the hardware section for only twenty-five nuyen. Thrown paint grenades come in two sizes: standard and large. These operate like standard explosive or less-than lethal grenades.
item.paint_grenade.variant.mini.desc=In a world of high-tech sensors, light-bending camouflage technology, magical spells that can render individuals literally invisible, and other such pains in the hoop, it's nice to have a cheap, low-tech means to combat such things. Alternately, there are times when you simply want to slot someone off because you can. Or, because you simply think it's fun. Enter: the paint grenade. A paint grenade is simply a grenade filled with paint that is kept under pressure until it's deployed. Depending on the grenade's yield, it can coat an area between two and five meters, revealing anyone using the aforementioned methods of concealment. Paint grenades come in a variety of colors, but most often they are some kind of obnoxious, extremely bright, glow-in-the-dark neon color that will stand out even in low-light conditions. But when that's not enough, some paint grenades also include near-microscopic reflective matter (meaning glitter) that will reflect any light shined on it. And if that isn't enough, you can also fill a paint grenade with a radioactive tracking dye included that can be detected by any Geiger counter readily available at any major store in the hardware section for only twenty-five nuyen. Thrown paint grenades come in two sizes: standard and large. These operate like standard explosive or less-than lethal grenades.
item.caltrops.desc=Technically caltrops are not grenades or explosives, but they utilize similar mechanics and serve a similar purpose to those items. Little triangular- shaped pieces of metal designed to impede or prevent the movement of a person through an area, caltrops have been used for centuries. They are one of the most basic area-denial munitions that exists, and functionally they have not needed to change much in all that time. Caltrops spread themselves out over an area and apply their damage to anyone who enters the area of effect. At the end of every Combat Round, anyone who moved through the area of effect must resist damage from the caltrops. Particularly vicious users of caltrops will coat the metal in poison, which applies its effects to any target damaged by the caltrops. Spotting caltrops is difficult, requiring a Perception + Intuition (2) test to see them.
item.cryo_grenade.desc=One of the newer grenade inventions, the cryo grenade disperses aerosolized liquid nitrogen into the blast radius. This results in a sort of flash-freeze effect, which causes everything within the blast radius to become either frozen or at least cold. The technology is still relatively new and has had to overcome several technical challenges. Despite this, the grenades are still making their way into the shadows and have proven more effective than not. Cryo grenades do their damage as Cold damage (p. 110, SR6).
item.cryo_grenade.variant.mini.desc=One of the newer grenade inventions, the cryo grenade disperses aerosolized liquid nitrogen into the blast radius. This results in a sort of flash-freeze effect, which causes everything within the blast radius to become either frozen or at least cold. The technology is still relatively new and has had to overcome several technical challenges. Despite this, the grenades are still making their way into the shadows and have proven more effective than not. Cryo grenades do their damage as Cold damage (p. 110, SR6).
item.glitter_grenade.variant.mini.desc=While the glitter grenade is not an explosive, the method by which it works is almost identical to explosive grenades. When the grenade is activated, a motor inside spins up and flings glitter and metal fragments into the area around the point of explosion. This causes anything invisible to become visible and makes it easy to identify and target those affected by the glitter grenade. Glitter grenades don't do damage on their own. Those affected by the glitter grenade lose Invisibility or Improved Invisibility statuses. Anyone attacking a target affected by a glitter grenade gets a point of Edge during their attack. The materials within the glitter grenade can be adjusted with an Engineering (5, 5 minutes) Extended test. The materials must be small, dry, metallic particles, similar to glitter. This can be done to make the grenade exploit a weakness or allergy, but it requires pre-planning. Removing the glitter requires an extensive and thorough shower, and sometimes a vacuum cleaner. Magic can help, Animate Metal can be used to make metal glitter dance away.
item.glitter_grenade.desc=While the glitter grenade is not an explosive, the method by which it works is almost identical to explosive grenades. When the grenade is activated, a motor inside spins up and flings glitter and metal fragments into the area around the point of explosion. This causes anything invisible to become visible and makes it easy to identify and target those affected by the glitter grenade. Glitter grenades don't do damage on their own. Those affected by the glitter grenade lose Invisibility or Improved Invisibility statuses. Anyone attacking a target affected by a glitter grenade gets a point of Edge during their attack. The materials within the glitter grenade can be adjusted with an Engineering (5, 5 minutes) Extended test. The materials must be small, dry, metallic particles, similar to glitter. This can be done to make the grenade exploit a weakness or allergy, but it requires pre-planning. Removing the glitter requires an extensive and thorough shower, and sometimes a vacuum cleaner. Magic can help, Animate Metal can be used to make metal glitter dance away.
item.krime_kaltrops.desc=A business that operates as fast and loose with accepted manufacturing practice as Krime is bound to have excessive waste. Krime executives realized that they had good slag metal just lying around the shop floors and decided to find a better use for it. Thus, the Krime Kaltrop was born. While a regular caltrop is made of dainty, hard-tospot metal slivers, the Krime Kaltrop takes all subtlety out of the equation. A twelve-pointed metal sphere of spikes about 5 centimeters in diameter, the Krime Kaltrop is capable of shredding a foot, tire, or even a tracked vehicle's tread. Damage is applied at the end of any Combat Round in which a target moves over the Kaltrops, and at the end of any Combat Round in which the target is still in the area of effect. Their ungainly construction makes Krime Kaltrops easier to see than normal caltrops, they require only a Perception + Intuition (1) test.
item.nano_grenade.desc=The most cutting-edge technology and the newest designs in grenades allowed Evo to create something that most people would try to avoid with a three-meter pole. Despite the apprehension of the public in using nanotechnology, Evo has still mass-produced these grenades and is actively marketing them to those who can afford them. One should assume that most Evo forces will carry at least a few of these in their ranks. Nano grenades can emulate the effects of fragmentation, high explosive, incendiary, and zapper grenades. The nanobots within the liquid magnetic suspension receive a wireless command from the grenade's owner and create the necessary materials to replicate the effects of the designated design. This means that the grenade must be wirelessly active in order to receive the command, and that it takes 1 Combat Round to "prime" the grenade, after which the grenade can no longer accept commands to change the contents.
item.nano_grenade.variant.mini.desc=The most cutting-edge technology and the newest designs in grenades allowed Evo to create something that most people would try to avoid with a three-meter pole. Despite the apprehension of the public in using nanotechnology, Evo has still mass-produced these grenades and is actively marketing them to those who can afford them. One should assume that most Evo forces will carry at least a few of these in their ranks. Nano grenades can emulate the effects of fragmentation, high explosive, incendiary, and zapper grenades. The nanobots within the liquid magnetic suspension receive a wireless command from the grenade's owner and create the necessary materials to replicate the effects of the designated design. This means that the grenade must be wirelessly active in order to receive the command, and that it takes 1 Combat Round to "prime" the grenade, after which the grenade can no longer accept commands to change the contents.
item.noise_grenade.desc=Similar in many ways to the flash-pak, the noise grenade is intended to non-lethally incapacitate a foe. It has similar dimensions to a flash-pak, but instead of having strobing light effects, the noise grenade is designed to generate a wide range of sounds across the lower parts of the aural spectrum. The sounds generated can cause disorientation within the blast radius, and in some cases can cause extreme nausea to occur. Those within the Ground Zero range suffer from the Nauseated and Dazed status effects (p. 52, SR6). Those outside of the Ground Zero range suffer from the Dazed status. Targets with Audio Dampening augmentations, or currently under the Silent or Silent (Improved) status, are treated as being one range category further away than they physically are. The device has ten charges and uses one charge per Combat Round. Plugged in, it recharges one charge per ten seconds.

