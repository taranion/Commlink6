item.ares_gunfighter_scabbard.desc=The Gunfighter Scabbard has been a staple among Ares Corporate Military Forces (ACMF) for almost two decades. It was originally available only to Firewatch teams and later to the ACMF or select clients, but in the past few months, Ares has made the Gunfighter available on the open market in limited numbers. Designed as a scabbard for larger firearms such as a shotgun or rifle (but also works just as well with larger bladed weapons) that's typically worn on the back, the Gunfighter is designed to provide the user with additional storage and ease of access while in the field. The Gunfighter accomplishes this through the use of memory materials that are pre-programmed with "weapon molds" to (mostly) enclose and secure a specific weapon. Past models only had the capability to be programmed for a single weapon, but recent Gunfighter models can be programmed with up to three different, specific weapon molds. The scabbard uses a proximity RFID sensor that is attached to the weapon in question, and old-fashioned pressure/leverage to know when to release or secure a weapon. Note that this system must be wirelessly active and able to communicate with the user's commlink in order to function properly. If this system is compromised or signal is otherwise lost, the Gunfighter defaults and remains in whatever mode it was previously in. In case of emergencies, it features a manual override switch that releases a secured weapon, just don't expect to be able to put the weapon back until normal functionality is restored. The one major drawback of the Gunfighter is that the memory materials take at least two seconds to release, so don't count on quick drawing with this. \nNote: RFID sensor attaches to the weapon but does not take up a modification or accessory slot. Weapons stored with this accessory cannot be quick-drawn. Removing weapons from this accessory is considered the same as the Ready Weapon major action. Re-programming a weapon mold requires either a Software + Logic or Engineering (Armorer) + Logic (3, 1 hour) test. \nSlot: None.
item.ammo_pouch.desc=This simple and inexpensive accessory is often forgotten about yet is nonetheless essential for the modern gunfighter. Regular ammo pouches are not designed for use on a MEMS. Typically looped onto a belt or sling, they provide easy access to and retention for loaded firearm clips up to assault rifles. Ammo pouches typically come with either a securable flap that goes over the clip, or are open-ended with a friction-retention system built in. Each pouch carries one clip that's based on the firearm type. Ammo pouches specifically for shotgun rounds are also available; these hold eight standard shells in external loops for the same kind of easy access. Ammo pouches can also be attached to other pouches and then attached to belts, slings, or directly to armor systems (excluding MEMS, which has its own pouches). \nNote: Use of ammo pouches makes Reload Weapon a Minor Action. When loading shotgun shells, a number of rounds equal to your Agility can be loaded and readied with a Minor Action. \nSlot: None.
item.ammo_sling.desc=Sometimes the simple things work the best. The ammo sling is basically an inexpensive synth-leather or synth-nylon bandolier with micro-hardpoints that allow ammo pouches to be attached. The idea is for a shooter (or some poor non-combatant) to carry extra ammo for when the shooting goes beyond expectations, but the individual isn't wearing tactical armor. Ammo slings can also be attached to a weapon, they're extremely popular with shotgunners, or simply worn on the waist or over the shoulder. For an additional fifteen nuyen, the sling includes a tactical gear pouch for when you need to store your non-bang-bang stuff or even more clips. \nSlot: None.
item.armored_retention_holster.desc=A staple among law-enforcement and security providers to help keep their primary duty sidearm secure, the armored retention holster (ARH) provides the user with two benefits: keeping the sidearm in question out of someone else's hands and providing the weapon with an extra bit of protection from stray (or targeted) weapons fire. Coming in a variety of styles and fitted to the specific weapon, the ARH is only available for holdout, light, or heavy pistols and features either a manual or wireless retention release; the latter requiring a biometric reader. An ARH is designed for function first, with concealability coming in a distant second. That means they tend to be a bit bulkier than standard holsters and are typically used for open carry. \nNote: Provides a +2 in opposed Stealth tests to sneak away a holstered weapon. Also provides +2 Defense Rating against called shots to a holstered weapon. \nSlot: None.
item.bayonet_standard.desc=Some consider the bayonet an archaic piece of military hardware. Others won't go into combat without one. A bayonet is a blade that attaches to a rifle, usually over or under the barrel, to be used when combat gets up-close and personal. Modern bayonets typically come in two flavors: fixed or retractable. Retractable bayonets are typically a triangular-shaped spike that can be controlled through a smartgun system, manually deployed, or programmed for voice command. Fixed models resemble a traditional blade. Both are the size of a standard combat knife and are readily available. Bayonets can be affixed to SMGs or any other large firearm. \nMaximum range is 25 meters when thrown after removal from weapon. \nSlot: Barrel or underbarrel.
item.bayonet_retractable.desc=Some consider the bayonet an archaic piece of military hardware. Others won't go into combat without one. A bayonet is a blade that attaches to a rifle, usually over or under the barrel, to be used when combat gets up-close and personal. Modern bayonets typically come in two flavors: fixed or retractable. Retractable bayonets are typically a triangular-shaped spike that can be controlled through a smartgun system, manually deployed, or programmed for voice command. Fixed models resemble a traditional blade. Both are the size of a standard combat knife and are readily available. Bayonets can be affixed to SMGs or any other large firearm. \nMaximum range is 25 meters when thrown after removal from weapon. \nSlot: Barrel or underbarrel.
item.concealbale_quickdraw_holster.desc=Having quick access to a well-hidden weapon is the best of both worlds. With a mix of smart materials and precision body measurements, these holsters can fit a pistol of any size and keep it in a spot with fast access. It's usually the small of the back, along the midriff, or against a limb and usually built with clothing in mind. Each holster is, of course, specific to its weapon. \nThis accessory increases the Concealability threshold of the weapon inside by 1. Only pistols (including machine pistols) and tasers fit in a concealable holster. Use of the holster provides a bonus Minor Action when the Quick Draw Action is taken. \nSlot: None
item.detachable_drum_magazine.desc=In any gun battle, there's no such thing as having too much ammo. The detachable drum magazine (DDM) is available for any clip-fed firearm except for hold-out pistols and MGs. DDMs of- fer a shooter the chance to carry additional ammunition in the weapon itself without necessarily having to carry as many extra clips. Sizes and shapes vary and are based on the class of weapon it's being used in. On average, a DDM doubles the weapon's ammunition capacity. This extra capacity comes with a few costs. First, attaching a DDM all but negates any chance of concealment, especially for any pistol type. Second, because of their size and shape, DDMs are difficult to conceal; there are no ammo pouches on the market that can accommodate them. A drum holster-clip is available for an additional 25 nuyen; this holster-clip can attach to any belt, waistband, or MEMS unit. And third, DDMs are known for being difficult to load ammunition into, which is not something recommended during combat. \nNote: Detachable Drum Magazines double a weapon's ammo capacity. They also take twice the time to reload ammunition as standard clips. When loaded into a weapon, detachable drum magazines lower the Concealability threshold by 2 for most weapons, by 3 for pistols. When worn on the body with the holder-clip, they lower the threshold by 1. If worn on a MEMS-style or other armor system, they are considered to have a capacity rating of 2. \nSlot: Barrel or underbarrel.
itemmod.dynamic_tension_system.desc=Not terribly useful to most archers, but a great benefit to Awakened archers whose strength can be augmented by their magic. This system autonomously modifies the rigidity of the smart materials lacing the limbs of the bow, increasing the draw strength. This allows Awakened archers to fully utilize their magically enhanced strength, without hampering themselves when their magical strength enhancements are not active. \nNote: This modification is capable of increasing the effective rating of a bow up to twice its original rating (maximum bow rating is still 14 as usual). Increasing or decreasing the effective Rating of a bow requires a Minor Action.
item.extended_clip.desc=Extended clips are meant to be the balance between having extra ammo on hand and not completely blowing your stealth profile by using drum mags, although larger extended clips stand out just as much as drum magazines, if not more so. Extended clips come in two styles: rating 1 and rating 2. Rating 1 extended clips offer a fiveround increase in ammo capacity, while rating 2 clips offer a ten-round increase. But like with any non-standard weapon clip, extended clips are more difficult to conceal, especially when loaded into a holstered weapon. \nNote: Rating 1 extended clips offer five additional rounds of ammunition per weapon but lowers the Conceaability threshold by 1. Rating 2 extended clips give ten additional rounds of ammunition per weapon but lowers the threshold by 2. \nSlot: None.
item.flashlight_thermographic.desc=This is basically a flashlight for trolls and dwarfs with thermographic vision along with those who use the tech enhancement version of it. It's not like it tosses out heat, that would be counterproductive,  but it instead tosses infrared light, which reflects back nicely (if a little strangely) for those able to detect it. \nThis flashlight is only visible to individuals with thermographic vision and provides a bonus point of Edge in situations where this item offers a suitable advantage. \nSlot: Any.
item.flashlight_low-light.desc=Even a small flashlight can be downright blinding when operating with low-light systems, so the engineering geniuses of the world designed this little baby. It looks like a regular flashlight, but the light it puts out registers and reflects far better with low-light-perceiving systems, whether they be biological or technological in nature. Those with low-light vision get a substantial improvement to their viewing, but those with unenhanced eyeballs see, at most, a dull purple glow. \nThis flashlight is only visible to individuals with low-light vision and provides a bonus point of Edge in situations where this item offers a suitable advantage.\ \nSlot: Any.
item.guncam.desc=Part targeting and imaging system, guncams fill a special niche in a shooter's arsenal. Originally designed as a monitoring and training tool, early guncams were almost phased out in favor of more advanced systems like the now-standard image link. But they remained popular within the shooting world as a training tool and were handy for calibrating weapons. Used in conjunction with the smartlink/smartgun system or other targeting systems, guncams use custom software to track a bullet or projectile's (this includes arrows/bolts, launched grenades, or rockets) actual trajectory in real time. When overlaid with smartgun data, guncams assist with follow-up shots when you miss or help map out full-auto fire patterns without having to use tracers. And if you just need a good camera to help assess the situation, guncams can also mount a limited number of visual enhancements. \nNote: When used as part of a Perception test before combat begins or when ambushing, guncams grant one point of Edge if the target is not concealed. If a shooter initially misses with a guncam-equipped weapon, they gain a +1 dice pool modifier to an attack roll if a Take Aim action is performed on the second shot. Guncams have a capacity rating of 2 for visual enhancements. \nSlot: Any.
item.hip_bad_bracing_system.desc=We've seen it in the trids. Hold the gun low and spray and pray, but somehow this inaccurate mess wipes out everyone in the room. Oh, unless it's the bad guys, and then the spray and pray misses everything. The point is, on the streets we understand the real value of firing from the hip and we actually have a well-designed system to make it morebeffective. You still lose accuracy at a distance but that is not what this is designed for.
item.laser_sight_low_power.desc=When operating in tight quarters, no one wants an errant beam warning the place down the street. For that, they use this laser option that only projects a relatively short distance. \nThis accessory can only be used at Close and Near ranges; it is undetectable at all other ranges. \nSlot: Top or Underbarrel.
item.laser_sight_standard.desc=This device uses a laser beam to project a visible dot (normal, low-light, or thermographic) on the target. This increases the weapon's Attack Rating by 1, not cumulative with smartlink modifiers. The laser sight can be mounted as either an underbarrel mount or top mount. Activating or deactivating a laser sight is a Minor Action. \nNote that in weapons with a laser sight included as standard equipment, this bonus is already calculated into the Attack Rating. \nWireless bonus: The bonus to the Attack Rating increases to 2. You gain a bonus Minor Action on a turn when you activate or deactivate the laser sight. \nThis accessory can only be used at Close, Near, and Medium ranges. \nSlot: Top or Underbarrel.
item.laser_sight_high_power.desc=These are the kind of lasers that make you wonder how you'll ever see the dot so far away. They're also tough to use, since bullets don't move like light over long distances. They make a good estimate, and in the right wind conditions and with someone who knows how to compensate for them, they can be used for long-range sighting. \nThis laser operates across all ranges but requires the user to have some kind of vision magnification to utilize at Far and Extreme ranges. The beam is so powerful that if it hits a target's eyes (Firearms + Agility vs. Reaction + Intuition Opposed Test), it causes one level of the Blinded status for every two net hits. Reduce the status by one level if the defender has flare compensation. \nSlot: Top or Underbarrel.
item.machine_gun_blast_shield.desc=Another low-tech accessory that's popular with machine gunners is the simple and effective blast shield. In a nutshell, blast shields are armor plates attached to the side of a machine gun in order to give the shooter additional protection. Exact dimensions and specs may vary, but blast shields typically come in two sizes: the smaller 30 x 60 centimeter plate for use on portable MGs, or the larger 60 x 120 centimeter plates use on fixed (or semi-fixed) positions. Blast shields also come in a variety of configurations and styles, but all are made from heavy anti-ballistic materials combined with some kind of additional deflective properties. This means they're simply angled in some way to deflect incoming fire, or they feature additional bits of armor attached to accomplish the same. And while extra protection is always a plus, blast shields are bulky and heavy, especially the larger ones. Even those made with modern lightweight materials will slow a machine gunner down if they try to maneuver too much while using them. \nNote: Small blast shields provide +1 to Defense Rating for each shield installed (max +2). Large blast shields provide +2 (max +4) for each shield installed. Large blast shields decrease movement by three meters per round in all categories when one is used, five meters if two are used. Use of two large blast shields also grants the user the Cover I status, but it does not require the additional Minor Action to employ/fire the weapon. \nSlot: Barrel, Top, Underbarrel.
item.machine_gun_blast_shield.variant.small.desc=Another low-tech accessory that's popular with machine gunners is the simple and effective blast shield. In a nutshell, blast shields are armor plates attached to the side of a machine gun in order to give the shooter additional protection. Exact dimensions and specs may vary, but blast shields typically come in two sizes: the smaller 30 x 60 centimeter plate for use on portable MGs, or the larger 60 x 120 centimeter plates use on fixed (or semi-fixed) positions. Blast shields also come in a variety of configurations and styles, but all are made from heavy anti-ballistic materials combined with some kind of additional deflective properties. This means they're simply angled in some way to deflect incoming fire, or they feature additional bits of armor attached to accomplish the same. And while extra protection is always a plus, blast shields are bulky and heavy, especially the larger ones. Even those made with modern lightweight materials will slow a machine gunner down if they try to maneuver too much while using them. \nNote: Small blast shields provide +1 to Defense Rating for each shield installed (max +2). Large blast shields provide +2 (max +4) for each shield installed. Large blast shields decrease movement by three meters per round in all categories when one is used, five meters if two are used. Use of two large blast shields also grants the user the Cover I status, but it does not require the additional Minor Action to employ/fire the weapon. \nSlot: Barrel, Top, Underbarrel.
item.machine_gun_blast_shield.variant.large.desc=Another low-tech accessory that's popular with machine gunners is the simple and effective blast shield. In a nutshell, blast shields are armor plates attached to the side of a machine gun in order to give the shooter additional protection. Exact dimensions and specs may vary, but blast shields typically come in two sizes: the smaller 30 x 60 centimeter plate for use on portable MGs, or the larger 60 x 120 centimeter plates use on fixed (or semi-fixed) positions. Blast shields also come in a variety of configurations and styles, but all are made from heavy anti-ballistic materials combined with some kind of additional deflective properties. This means they're simply angled in some way to deflect incoming fire, or they feature additional bits of armor attached to accomplish the same. And while extra protection is always a plus, blast shields are bulky and heavy, especially the larger ones. Even those made with modern lightweight materials will slow a machine gunner down if they try to maneuver too much while using them. \nNote: Small blast shields provide +1 to Defense Rating for each shield installed (max +2). Large blast shields provide +2 (max +4) for each shield installed. Large blast shields decrease movement by three meters per round in all categories when one is used, five meters if two are used. Use of two large blast shields also grants the user the Cover I status, but it does not require the additional Minor Action to employ/fire the weapon. \nSlot: Barrel, Top, Underbarrel.
item.quick_draw_quiver.desc=This hard-shelled, protective quiver securely holds up to twenty arrows or bolts. Automatic manipulators allow an archer to cycle between various types of shafts with a wireless command and easily draw the intended ammunition. \nWireless: Selecting the arrow does not cost a Minor Action, as the command automatically moves the arrow to the easiest access position. The rigid structure of the quiver makes arrow selection easier. With a Minor Action, the user can select the preferred arrow and gain a +1 to the Attack Rating. \nSlot: None.
item.quick_draw_scabbard.desc=Whether it's the magnetic plate, the quick release clips, or quick-flick wrist sheath, these scabbards are great to get a drop on a foe who sees an unarmed opponent. Several companies offer a myriad of designs for every potential melee weapon on the market, no matter the size. One moment it's stowed, the next it's ready for action. \nDesigned for melee weapons, the quick-draw scabbard allows the quickdraw action. Each scabbard is designed for its specific weapon. All melee weapons, regardless of size, have a design for this. \nSlot: None.
item.ranger_arms_eagle_eye.desc=Introduced by Ranger Arms in 2077, the Eagle Eye is a compact sensor suite that can be linked with a weapon's smartgun system or imaging scope. Originally designed for long-range shooting, the Eagle Eye features a laser rangefinder, micro- doppler radar system, and ultrasound sensor that work in conjunction to provide (as the advertisements claim) "the clearest sight and target picture ever, no matter the environment." While the Eagle Eye performs admirably at long range, it performs extremely poorly when used in any other fashion, especially when the shooter is moving or multiple rounds are fired in succession (read: burst or full auto mode). \nNote: When attached, changes an applicable weapon's AR by  -4/ -5/ - 4/+3/+2. For sensors to function properly, shooter must remain immobile and cannot take any other actions except Take Aim and firing the weapon. If a weapon has no Attack Rating in a given range category to start, that category is not affected. No Attack Rating can go lower than zero, but a weapon lowered to a zero Attack Rating can still fire at that range. \nSlot: Any.
item.regular_sling.desc=A firearm is no good if you can't aim and shoot it before your opponent does. And constantly carrying your primary weapon in an up-and-ready position (especially on long missions) can get tiring really fragging fast. Tactical slings help shooters keep and SMG, shotgun, or assault rifle in the lowready position while lessening arm fatigue, and retain the weapon even when they have do things things like going for another weapon or striking some fragger in the face. Tactical slings attach to the stock of the weapon and are made of a tough Kevlar-nylon weave that has a decent amount of stretchability. They go over the shoulder or attach directly to a MEMS harness. Regular slings are made of the same materials but are attached to points at the front and back of the weapon. They are basically for carrying weapons over the shoulder; they don't provide any advantages in bringing the weapon to bear in a fight. Ammo pouches are often attached to regular slings for extra ammo capacity. \nNote: Tactical slings keep attached weapons in a constant low-ready position in front of the user, changing the Ready Weapon Major Action to a Minor Action. \nSlot: None.
item.tactical_sling.desc=A firearm is no good if you can't aim and shoot it before your opponent does. And constantly carrying your primary weapon in an up-and-ready position (especially on long missions) can get tiring really fragging fast. Tactical slings help shooters keep and SMG, shotgun, or assault rifle in the lowready position while lessening arm fatigue, and retain the weapon even when they have do things things like going for another weapon or striking some fragger in the face. Tactical slings attach to the stock of the weapon and are made of a tough Kevlar-nylon weave that has a decent amount of stretchability. They go over the shoulder or attach directly to a MEMS harness. Regular slings are made of the same materials but are attached to points at the front and back of the weapon. They are basically for carrying weapons over the shoulder; they don't provide any advantages in bringing the weapon to bear in a fight. Ammo pouches are often attached to regular slings for extra ammo capacity. \nNote: Tactical slings keep attached weapons in a constant low-ready position in front of the user, changing the Ready Weapon Major Action to a Minor Action. \nSlot: None.

itemmod.ruthenium_coating.desc=Ruthenium in the wrong hands leads to some stupid stuff, but sometimes you find something for which it was perfectly suited. The sheath is a thin photovoltaic layer of ruthenium that covers every square centimeter of a weapon. The weapon essentially disappears into the background or blends with the surroundings. Even melee weapons can have this, but repeated impacts or any blood that gets on them damages the effect.

