dataset.name.short=FS
dataset.name=Firing Squad
dataset.desc=<b>Someone, somewhere, is about to get hurt.</b><br/><br/>\
 Guns will come out. Swords will unsheathe. Damage will be done. The same questions are at the center of it all: Who will suffer, and who will survive?<br/>\
 Shadowrunners stare violence in the face daily, deciding how much they’ll inflict, figuring out how they’ll remain alive. They know the prices that must be paid—the hard work of training, the challenge of recovery, and the continual effort to live with what you’ve done. Some shadowrunners develop a code to help them know what to do and what to avoid. Others decide to just develop a short memory.<br/>\
 <em>Firing Squad</em> is the book to help shadowrunners pay those costs. It has new weapons, qualities, and techniques to hone shadowrunners’ combat abilities while also looking at how to develop characters based on the codes they follow and the violence they face. Take your character through new twists and turns and experience the shadows in a brand-new way.<br/><br/>
 <em>>Firing Squad</em> is a core combat rulebook for Shadowrun, Sixth World.
#Thanks to KarmaInferno#5135 for providing the US Firing Squad .desc content

