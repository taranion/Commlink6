item.concealable_ammo_pouch.desc=When a shooter needs somewhere to store and secure their spare ammo clips without advertising that fact, accept no substitutes. Available for pistols, SMGs, carbines, and assault rifles. \nThe pouches provide a +1 increase to the threshold for the concealability of ammo in the pouch (a typical ammo clip has a Concealability threshold of 4 outside the pouch, 5 inside it). For an additional 100¥, the pouches can be chemically sealed, offering the same bonus (+1) against chemsniffers until the pouch seal is broken to extract the ammo.
item.concealable_ammo_pouch.variant.regular.desc=When a shooter needs somewhere to store and secure their spare ammo clips without advertising that fact, accept no substitutes. Available for pistols, SMGs, carbines, and assault rifles. \nThe pouches provide a +1 increase to the threshold for the concealability of ammo in the pouch (a typical ammo clip has a Concealability threshold of 4 outside the pouch, 5 inside it). For an additional 100¥, the pouches can be chemically sealed, offering the same bonus (+1) against chemsniffers until the pouch seal is broken to extract the ammo.
item.concealable_ammo_pouch.variant.sealed.desc=When a shooter needs somewhere to store and secure their spare ammo clips without advertising that fact, accept no substitutes. Available for pistols, SMGs, carbines, and assault rifles. \nThe pouches provide a +1 increase to the threshold for the concealability of ammo in the pouch (a typical ammo clip has a Concealability threshold of 4 outside the pouch, 5 inside it). For an additional 100¥, the pouches can be chemically sealed, offering the same bonus (+1) against chemsniffers until the pouch seal is broken to extract the ammo.
item.drag_handle.desc=This cheap but effective accessory makes it easier to pull chummers or other associates out of a hazardous situation, such as gunfire. Typically, a drag handle is attached to the back of an armor system just below the neck and between the shoulders, although it has been known to be attached to the front just below the neckline to facilitate removing an individual from a vehicle. \nThe drag handle provides a bonus point of Edge to be used for Strength tests to pull a chummer through a hazardous situation.
item.gear_access.desc=This modification makes it easier for the users to access equipment stored within or on their armor, i.e., weapons or ammunition. Not a specific modification, gear access represents several possible modifications to specific accessories such as ammo pouches that easily open, wider mouths of pockets/pouches that make it easier to grab, or methods to help accessories stay in the exact place they are mounted despite rough use. When pulling gear from armor with gear access, pick up/put down and manual reloading become Minor Actions.
item.gel_weave.desc=Reactive armor comes in two forms: plates and GelWeave. Plates are reminiscent of old trauma plate technology. Modern trauma plates are usually high-quality reactive armor plates meant to save a life in the event of a hard center-mass killshot. Plates are stored in special cloth pockets with built-in magnets that allow them to be installed alongside virtually any personal body armor or even attached to mundane clothing. GelWeave is a custom material used to fabricate armor in various styles that uses a hyper-reactive gel compound to dissipate energy across the armor. \nEither form (reactive plates or GelWeave, but not both) can be added to any armor. It reduces incoming DV by its rating, following the rules below. \nFor GelWeave, the armor can resist up to the rating of the GelWeave in incoming damage against each attack. However, the gel becomes rigid when absorbing more than a small hit (1 DV) each round, and reduces Agility, Reaction, and meters of movement by (DV resisted - 1) for three combat turns. These reductions are cumulative across combat rounds, and the duration for all reductions is three rounds after the latest hit. If Reaction or Agility is reduced to 0, the wearer gains the Immobilized status.
item.hidden_pocket.desc=This is a special little space sewn into the armor that blends in exceptionally well. There's a limit to a tailor's magic, but these little spots make great places to tuck away those precious items like credsticks or data chips, or even a hold-out pistol. The Concealability threshold for items in a hidden pocket increases by 2. Retrieving items from a hidden pocket requires a Major Action.
item.mystic_weave.desc=The key to Parashield's Mystic Tough armor is this stuff. This add-on accessory can be woven into existing armor to provide a little protection against incoming mojo. \nMystic Weave creates a threshold equal to its rating for all mana-based spells cast on a target but also imposes a negative dice pool modifier on all Magic-related tests equal to double its rating for any magician wearing the armor.
item.programmable_camouflage.desc=A simple and cheap modification common to most BDUs, armor clothing, and lighter armors, programmable camo may not be the most effective of concealment options, but it helps the user blend in better with the general surroundings so they don't stand out too much. Linked to the user's commlink, a single programmable camo package can hold up to three different patterns/styles. While styles/patterns may vary, the most common are based on environments, such as forest, jungle, desert, arctic, and urban. Custom patterns can also be uploaded. \nEnvironmental patterns offer +1 die to Stealth tests when the appropriate pattern is loaded. If not, the bonus becomes a dice pool penalty.
item.reactive_armor_plates.desc=Reactive armor comes in two forms: plates and GelWeave. Plates are reminiscent of old trauma plate technology. Modern trauma plates are usually high-quality reactive armor plates meant to save a life in the event of a hard center-mass killshot. Plates are stored in special cloth pockets with built-in magnets that allow them to be installed alongside virtually any personal body armor or even attached to mundane clothing. GelWeave is a custom material used to fabricate armor in various styles that uses a hyper-reactive gel compound to dissipate energy across the armor. \nEither form (reactive plates or GelWeave, but not both) can be added to any armor. It reduces incoming DV by its rating, following the rules below. For plates, this can only be done once and the plate is destroyed and needs to be replaced. Armor can have multiple plates at different ratings but is limited by capacity. The player can choose which plate to use for any incoming attack, and only one plate can be used against a single instance of incoming damage (no combining a bunch of rating 1 plates).
item.ruthenium_armor.desc=Considered by many to be the apex of tactical concealment technology, the ruthenium armor concealment system (RACS) is an extensive, highend armor modification that functions as a chameleon suit. Previous iterations had some issues when the user moved, forcing them to remain completely still for effectiveness. While that flaw has been (mostly) corrected with current technologies, the user must be completely covered (meaning all extremities and the head) with ruthenium-modified armor and move extremely slowly for the system to work properly. And because it's extremely effective, the RACS is considered mil-spec technology and therefore is extremely regulated; simply owning it without the proper credentials is considered a felony in most nations. This system includes a head piece that provides no armor benefit, but a helmet purchased (for the basic helmet price of 200 nuyen) along with the system can be integrated into the entire package. \nThis system offers a bonus Edge when performing Stealth tests and creates a threshold equal to its rating for the opposition's Perception test to detect the wearer. This threshold drops by one for every meter past three the user moves during a combat round. During combat, the system raises the wearer's Defense Rating by 2 due to the shifting patterns.
item.shockweave.desc=This modification can be a rather nasty surprise for someone who tries to go hands-on without permission. Special conductive filaments line the armor and are attached to a high-discharge battery pack. When the unwanted subject makes contact that exceeds a certain force (delivering at least DV 2 before the Body resistance roll), they receive an electrical shock (DV (Rating)S(e)). The battery can deliver four shocks before needing to recharge. To prevent friendlies from being affected, the shockweave system has a basic IFFB (identification friend/foe biometrics) system. \nTreat IFFB system as Safe Firing IFF System (p. 62) targeting system.
item.thermal_dissipation.desc=Special fibers combined with new breathable materials allow the user to fight or stave off the effects of heat in hot and/or humid climates such as the desert and jungle. While it doesn't help against fire damage, it's handy when you're spending long periods in the field. \nEach rank of thermal dissipation eliminates one level of being fatigued due to overheating or grants +1 resistance versus heat damage.
item.toughweave.desc=A new armor modification that went into service only six months ago courtesy of YNT (an Evo subsidiary), Toughweave reportedly has the potential to be a game-changer in armor technology. Exact specs are still highly classified, but this new modification is slowly being integrated into Evo corpsec forces for field testing. Not much is known about this highly secretive modification. What little YNT has revealed in limited press releases states that "The new Toughweave™ armor protection system not only offers maximum protection against all known forms of penetrative damage, but also effectively dissipates most kinetic damage as well." So far YNT has been stingy with its supply of Toughweave, preferring to keep it in-house for now. But rumors are starting to spread about the necessary materials making it into certain black markets in Central America, South America, and East Asia. \nEach level of Toughweave provides -1 to DV on every incoming attack but imposes the wild die on all damage resistance tests.
item.holster.desc=It holds a weapon, for convenience, not concealment. The holster should be reasonably appropriate to the size of the limb.

