quality.compulsion.choice.subselect.choice.time_spent=Time Spent
quality.compulsion.choice.time_spent.level1=5 minutes / day
quality.compulsion.choice.time_spent.level2=30 minutes / day
quality.compulsion.choice.time_spent.level3=1 hour / day
quality.compulsion.choice.time_spent.level4=2 hours / day
quality.compulsion.choice.time_spent.level5=4 hours / day
quality.compulsion.choice.time_spent.level6=8 hours / day
quality.compulsion.choice.time_spent.level1.desc=You have to spend minimum 5 minutes per day for your activity.
quality.compulsion.choice.time_spent.level2.desc=You have to spend minimum 30 minutes per day for your activity.
quality.compulsion.choice.time_spent.level3.desc=You have to spend minimum 1 hour per day for your activity.
quality.compulsion.choice.time_spent.level4.desc=You have to spend minimum 2 hours per day for your activity.
quality.compulsion.choice.time_spent.level5.desc=You have to spend minimum 4 hours per day for your activity.
quality.compulsion.choice.time_spent.level6.desc=You have to spend minimum 8 hours per day for your activity.
quality.flashbacks=Flashbacks
quality.flashbacks.page=130
quality.flashbacks.desc=You haven't been able to leave behind the effects of a trauma you experienced, to the point where certain triggers make you relive the whole experience. This goes beyond just having a recollection of the occurrence—you really feel you are there, and any other reality drops away.<br/><br/>\
 <b>Bonus:</b> 6 Karma<br/>\
 <b>Game Effect:</b> When selecting this quality, choose a specific event that is the subject of the flashbacks (this could be a specific in-game event that leads to the character gaining this quality). At least one, and possibly more, specific triggers should be identified. This should be multi-sensory and specific, so that it is not invoked regularly. When the character is subjected to the trigger, they must make a Composure (4) test or enter into a flashback. The flashback lasts three minutes. When the flashback starts, the character rolls a Composure (3) test; if they succeed, they recognize that they are in a flashback, and they are able to endure it. They receive a –4 dice pool penalty to any test involving Physical attributes for the duration. If they fail the second test, they cannot do anything but react to the flashback.
quality.maybe_you_missed_something=Maybe You Missed Something
quality.maybe_you_missed_something.page=130
quality.maybe_you_missed_something.desc=You can never take anyone's word for granted — after all, people make mistakes, or even intentionally “miss” things if they're trying to set you up for failure. With threats lurking everywhere, the only person you trust to spot danger is yourself, even if you're not always the best person for the job.<br/><br/>\
 <b>Bonus:</b> 2 Karma<br/>\
 <b>Game Effect:</b> Whenever you're in a potentially dangerous situation, you must take any feasible steps to search out potential threats. If another member of the team has already done so, you must spend at least as much time as they did completing the same task, with all the exasperation that entails (like the decker chewing out the street samurai for “checking their work”).
quality.phobia=Phobia
quality.phobia.page=130
quality.phobia.desc=You have an immediate negative reaction to a certain object, thing, or phenomenon, to the point that you will do whatever is in your power to avoid the thing in question.<br/><br/>\
 <b>Bonus:</b> Common: 12 Karma; Uncommon: 9 Karma; Rare: 6 Karma; Very Rare: 3 Karma<br/>\
 <b>Game Effect:</b> You will never willingly go near the subject of your phobia, and if you are compelled to be near it (meaning the subject is close enough for you to believe it can affect you immediately, you cannot gain or spend Edge, and you experience a –2 dice pool modifier to any test besides Damage Resistance tests while the Phobia is in effect. You also must make a Composure (3) test every five minutes or else shut down entirely, making you curl into a ball and hope the subject of your Phobia somehow goes away.
quality.phobia.choice.object=Object of Phobia
quality.phobia.choice.object.common=common
quality.phobia.choice.object.uncommon=uncommon
quality.phobia.choice.object.rare=rare
quality.phobia.choice.object.very_rare=very rare
quality.phobia.choice.object.very_rare.desc=Very rare: Dragon scales, vampire fangs
quality.phobia.choice.object.rare.desc=Rare: Awakened critters, Dissonance, the Infected, spirits, technocritters, technomancers, types of telesma
quality.phobia.choice.object.uncommon.desc=Uncommon: Awakened people, confined spaces, snakes, specific gangs
quality.phobia.choice.object.common.desc=Common: Ants, cats, dogs, heights, metatypes, the number 13

quality.broken_code=Broken Code
quality.broken_code.page=131
quality.broken_code.desc=The Honorbound quality has listed consequences for those who break the tenets of their code; this quality goes beyond those consequences. This replacement quality represents someone who no longer believes in the code that used to guide them. Maybe they view it as a luxury they can't afford, or maybe the world has made them believe the code simply does not lead to good results; whatever the case, they do not feel like they need to adhere to the tenets anymore.<br/>One of the tricks of abandoning a personal code is that, frequently, others knew that there was a code that helped define you. The fact that a character has given up on what was a central part of their identity tends to get a negative reaction from others, so the character cannot gain or spend Edge on social tests involving anyone who knew that they had once followed a code.<br/>On top of that, individuals with Broken Code often feel there is something missing in their lives, something that used to provide meaning and guidance. This can make them act erratically in social situations—though sometimes that works out for their benefit. <br/><br/>\
 <b>Game Effect:</b> An individual with the Broken Code quality replaces a die from their pool with the wild die on all social tests unless they spend Edge on that test (through any Edge function).
quality.penitent=Penitent
quality.penitent.page=131
quality.penitent.desc=There are three possible end stages of this path. Once the duration of Broken Code has passed, the character may decide that living life by a code is not the way they want to do things, so they receive the No Code quality. Alternately, they may decide to follow a new code, giving them the Re-Bound quality. Their final option is to return to the code they had previously left behind, giving them the Penitent quality. All three are described below.
quality.rebound=Re-bound
quality.rebound.page=131
quality.rebound.desc=Sometimes, life takes us in strange journeys, and we end up with a new set of beliefs than what we started with. The Re-Bound quality is identical to the Honorbound quality, except that no new Karma bonus comes with it. The character has gone through the challenging process of changing their beliefs, and now they have new guidance to live by.
quality.no_code=No Code
quality.no_code.page=132
quality.no_code.desc=In many ways, this is similar to how a lot of shadowrunners live their life—from moment to moment, without any over-arching philosophy guiding their actions. It could be compared to not having the Honorbound quality at all, but there's one key difference. Some things are not easily left behind, and there can be a certain bitterness and awkwardness when dealing with those who still follow the code.<br/><br/>\
 <b>Game Effect:</b> If the character encounters anyone who follows the code they left behind, they cannot earn Edge in any social situations with those individuals (if they have Edge, though, they can spend it).
quality.double_sure=Double Sure
quality.double_sure.page=132
quality.double_sure.desc=Characters with this quality exhibit extra caution when entering a potentially dangerous situation. They will not round a blind corner, enter a dark room, or any other such activity unless they are certain someone or something (like a drone or a spirit) has taken a look first. They will be certain to double-check all information they get from one contact with another contact, and they'll look for two sources for any information they need. This can make them slow in execution, but it's not without its benefits.<br/><br/>\
 <b>Game Effect:</b> The character gains a +2 dice pool bonus on any Surprise tests.
quality.reconditioning=Reconditioning
quality.reconditioning.page=132
quality.reconditioning.desc=The character develops habits and responses to their anxieties and become better able to handle them in the moment. For the most part they are able to function without their need for advance warning and double-checks, though when stress levels rise the gamemaster can require a Composure (2) test to see if the character slips back into their old Double Sure ways for the duration of the encounter.<br/>After half a year with Reconditioning, the character can drop the Phobia quality if they received it, but they should keep the Bad Memories quality if they have that.
quality.violence_prone=Violence Prone
quality.violence_prone.page=133
quality.violence_prone.desc=The character believes that the way to respond to a punch is with a punch, and they are always ready for a fight. On the negative, they cannot gain or spend Edge on social tests where they or their team attempts to talk their way out of a violent situation, and they must succeed on a Composure (2) test to avoid jumping into the fray whenever they see violence near them. On the positive side, they are tough to catch by surprise since they're almost always ready for a fight, so they get a point of situational Edge when making a Surprise test.
quality.heedless=Heedless
quality.heedless.page=133
quality.heedless.desc=By taking this quality, characters decide that their problems came from not being violent enough, and they should take no partial measures. They don't wait for violence to start — they start the violence themselves. They throw the first punch, fire the first shot, cast the first spell.<br/><br/>\
 <b>Game Effect:</b> With this quality, characters make a Composure (2) test in any opposed situation. If they fail, they move to attack whoever they perceive as the source of their problem. This does not mean they immediately resort to lethal measures—they may just slap or punch an opponent to get their attention or send a message. But since violence has a way of escalating a situation, they'll often cause more problems than they solve.<br/>Heedless characters are very difficult to catch by surprise, since they are always ready for a fight. Their threshold for Surprise tests is 1, and they get a point of situational Edge when making Surprise tests.
quality.coping=Coping
quality.coping.page=133
quality.coping.desc=By taking this quality, characters are recognizing that they react with violence too often, and they want to control those tendencies more. They may count to ten, or breathe deeply, or engage in any other technique that helps them relax and focus their mind on solutions beside violence. <br/><br/>\
 <b>Game Effect:</b> When they are not able to use their technique, they must make a Composure (2) test or resort to violence, as with the Violence Prone quality. They gain a point of situational Edge when they try to dissuade others from violence or defuse a tense situation (only one point of Edge per attempt, even if it involves a long discussion).
quality.selective_numbing=Selective Numbing
quality.selective_numbing.page=134
quality.selective_numbing.desc=One way to deal with repeated negative experiences is to numb yourself to them. Characters with this quality are capable of turning off their emotions, making it so that they do not feel anything so that they don't have to experience anything negative. This can be great for dealing with fear and anger, but it presents difficulties when it comes to interacting in social situations. Since emotions do not turn on and off like a light switch, muting them for a situation where it can be advantageous can also mean having them stay off when they could be useful. For this quality, a period of emotional numbing, once initiated, lasts for six hours. Once it ends, a new state of numbness cannot be started for twelve hours.<br/><br/>\
 <b>Game Effect:</b> While in this state, characters gain +2 dice for any Composure tests or tests to resist spells including Confusion, Chaos, and Control Thoughts, and critter powers including Confusion and Fear. They cannot gain or spend Edge on social tests.
quality.state_of_zen=State of Zen
quality.state_of_zen.page=134
quality.state_of_zen.desc=By reaching this step, the character has learned how to apply a level of calm to their emotions, selectively tamping them down when needed rather than just turning them off. They receive a +1 dice pool bonus when resisting spells including Confusion, Chaos, and Control Thoughts, and critter powers including Confusion and Fear.

quality.pacifist.desc=You are one of the few people remaining in the Sixth World who not only believes that violence isn't the answer, but who actively tries to avoid violence whenever possible ,  even against people who get so fed up with your peaceful ways that they want to smack you.\ \nThis quality may not be taken together with the White Hat version of the Honorbound quality, but may be taken with other versions of the Honorbound Quality at the gamemaster's discretion. (We recommend that this quality and the Honorbound quality be taken together when this quality would impose a more severe limitation than the Honorbound quality alone would.) \n- Bonus: 5 Karma per level \n• Game Effect: As the name implies, this quality limits the ways in which a character may use violence against other characters. If the character knowingly acts against their pacifist beliefs, they may not spend or earn Edge for twenty-four hours after committing the violent act. Any violent act committed during that twenty-four hours extends the duration of not being able to spend or regain Edge by another 24 hours.\ \nLevel 1 \nYou may only initiate violence (i.e., act in a way that results in damage being inflicted on a target) to stop a clear, imminent threat to another character, such as a hostile NPC aiming a weapon at them. You may take actions that would result in inflicting Physical damage on a target, but only if they could reasonably survive the damage inflicted.\ \nLevel 2 \nYou may not initiate violence under any circumstances, but you may attack targets who have already proven themselves to be a threat to you or others. You may take actions that would result in inflicting Physical damage to a target, but only if they could reasonably survive the damage inflicted.\ \nLevel 3 \nYou may not initiate violence under any circumstances, but you may attack targets who have already proven themselves to be a threat to you or others. You may not knowingly take actions that would result in inflicting Physical damage to a target, but you may still take actions that would result in inflicting Stun damage to a target.\ \nLevel 4 \nYou may not knowingly commit a violent act for any reason, even in defense of yourself or others.


#Quality Paths
qpath.boundaries_of_honor=The Boundaries of Honor
qpath.boundaries_of_honor.page=130
qpath.boundaries_of_honor.step.broken_code=Broken Code
qpath.boundaries_of_honor.step.broken_code.page=131
qpath.boundaries_of_honor.step.broken_code.desc=The biggest requirement here is time—the character needs to live with the Broken Code quality for a time so they can properly assess how they want to move on. The base duration of this quality is six months of in-game time, though certain decisions or actions may affect that duration. Different things that may affect this duration are described below.<br/>\
 <b>Positive Example:</b> The character may encounter someone with the Honorbound quality and be impressed at how the quality is working for them. This could be someone with the same code they once had or a different one. As with the incident that caused the character to leave their code, this either needs to be a very dramatic short-term incident or long-term, repeated exposure to this individual. When the gamemaster judges that the player character has seen enough of this person's code to be impressed by it, roll the Charisma + Logic of the character with the Honorbound quality; each hit reduces the minimum duration of the Broken Code quality by a week. This test cannot stack with any other similar tests or impressions from other individuals to shorten the duration even more. This could also work to push the character toward the No Code quality, if they are impressed by someone who lives by that philosophy.<br/>\
 <b>Personal Study:</b> The character may recognize that there is a void in their life and take it upon themselves to study different philosophies and find something that fits them. Have the character make a Logic + Intuition (6) test. Any net hits decrease the duration for Broken Code by a week; if there are fewer hits than the threshold, increase the duration for a number of weeks equal to the difference.<br/>\
 <b>Flash of Intuition: If the gamemaster and player agree to do this, the character can roll an Intuition + Edge (6) test at the beginning of each day. If they succeed, the first time they encounter some sort of personal code during that day, they will be inspired to adopt it for themselves. They receive the Re-Bound quality listed below, using the new code.<br/>\
 <b>Defeatism:/b> This only works to shorten the journey to the No Code quality. The character may continue to see problems resulting from personal codes, and they many decide that there is no point in having one. If they see at least four examples of people experiencing physical harm due to adherence to a code, or one example of someone receiving ten or more boxes of Physical damage due to adherence to a code, have the character roll Logic + Intuition; hits reduce the duration of the Broken Code by one week per hit, but only if the player intends to end on the No Code quality.
qpath.boundaries_of_honor.step.no_code=No Code
qpath.boundaries_of_honor.step.no_code.page=131
qpath.boundaries_of_honor.step.rebound=Re-Bound
qpath.boundaries_of_honor.step.rebound.page=131
qpath.boundaries_of_honor.step.penitent=Penitent
qpath.boundaries_of_honor.step.penitent.page=132

qpath.boundaries_of_honor.desc=To start on this path, a character must have the Honorbound quality, and they must violate the code enough (either in severity or frequency) that the character questions the code they had and the role it plays in their life.
qpath.boundaries_of_honor.step.broken_code.desc=
qpath.boundaries_of_honor.step.no_code.desc=In many ways, this is similar to how a lot of shadowrunners live their life—from moment to moment, without any over-arching philosophy guiding their actions. It could be compared to not having the Honorbound quality at all, but there's one key difference. Some things are not easily left behind, and there can be a certain bitterness and awkwardness when dealing with those who still follow the code.<br/><br/>\
 <b>Game Effect:</b> If the character encounters anyone who follows the code they left behind, they cannot earn Edge in any social situations with those individuals (if they have Edge, though, they can spend it).
qpath.boundaries_of_honor.step.penitent.desc=There are three possible end stages of this path. Once the duration of Broken Code has passed, the character may decide that living life by a code is not the way they want to do things, so they receive the No Code quality. Alternately, they may decide to follow a new code, giving them the Re-Bound quality. Their final option is to return to the code they had previously left behind, giving them the Penitent quality. All three are described below.
qpath.boundaries_of_honor.step.rebound.desc=Sometimes, life takes us in strange journeys, and we end up with a new set of beliefs than what we started with. The Re-Bound quality is identical to the Honorbound quality, except that no new Karma bonus comes with it. The character has gone through the challenging process of changing their beliefs, and now they have new guidance to live by.

qpath.once_bitten=Once bitten
qpath.once_bitten.page=132
qpath.once_bitten.step.immediate_aftermath=Immediate Aftermath
qpath.once_bitten.step.immediate_aftermath.page=132
