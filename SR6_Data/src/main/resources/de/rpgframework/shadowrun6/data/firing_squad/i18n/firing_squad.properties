item.hand_talons.desc=Designed to be both a weapon-retention tool and a last-ditch defensive weapon, "hand talons" is a generic term that describes a wide variety of small curved or straight blades between 2.5 and 8 centimeters. Talons come in multiple shapes/styles and are worn on the fingers, attached to a glove, gauntlet, or ring that can be used or worn in conjunction with a standard firearm with no loss of weapon performance. Although it's recommended that talons are worn on the off hand so to not interfere with normal firearm use and to prevent accidents.
item.horizon_flynn_pilum.desc=Building on the surprising success of the Horizon- Flynn Rapier, Horizon once again teamed up with Flynn Armaments to create another modern variation on a classic movie weapon. Horizon's latest trideo, Barbarax and the Space Gladiators, features a gorgeous woman in barely any armor fighting off legions of warriors that conspicuously look like Ares Macrotechnology goons. She uses a collapsible spear in the climax scene, where she throws the Pilum and impales two goons against a wall. Collapsing or extending the spear takes a Minor Action.
item.horizon_flynn_pilum.variant.movie.desc=The movie prop version does stun damage.
item.kami.desc=Basically a small handheld scythe, the kama were originally used in the rice-fields of Asia as a farming tool. But like a lot of other farming tools of the day, they were pressed into service as weapons and eventually adopted by martial artists. Although its popularity as a weapon waned for several decades, relegated mostly to exhibitions, the kama has made a comeback in recent years with the introduction of a folding model made of modern materials. Extremely effective in piercing attacks, the razor-sharp blade can also be used to block, disarm, and trap an opponent's weapon. \nStandard Bonuses: +1 to DV when defending against melee attacks,  -1 to threshold for climbing tests, +1 to concealability.
item.kami.variant.folding.desc=Folding kama.
item.kukri.desc=Legend states that if a kukri is drawn, it must draw blood. Originally made famous by the legendary Gurkhas of India and Nepal, the kukri is a curved combat blade known for its extraordinary cutting ability while slashing, although it makes a poor piercing or thrusting weapon. The kukri also makes a good cutting and hacking tool in the field when necessary. Combine that legend with cutting- edge nano-forging technology, and the kukri is one of the deadliest combat knives currently in use.
item.nodachi.desc=Also known as the odachi (large/great sword), the nodachi (or field sword) was originally used by the samurai in the feudal era of Japan mostly as an infantry and anti-cavalry weapon. It was too long to be carried on the hip or drawn quickly from a back scabbard and thus was often carried in-hand while still scabbarded. With the rise in popularity of weapons such as the katana, the nodachi also underwent a resurgence in popularity, especially among street samurai and other urban fighter-types. The original nodachi was notoriously difficult and expensive to make with traditional Japanese methods, but modern forging methods make the process significantly easier and cheaper; nodachis can be found at most weapon outlets with little effort. And they are considered legal in most countries. While not quite as popular as the katana, the nodachi is still a formidable weapon. The long blade makes it an ideal melee weapon for engaging multiple opponents at longer ranges than traditional blades. Modern go-gangs have also been known to employ a nodachi in slashing attacks from vehicles.
item.trench_knife.desc=Trench knives are what you get when you merge a pair of knucks and a combat knife. The concept first became popular during the deadly trench fighting of World War I, when combat became extremely up-close and personal. Designed to punch, stab, or slash as needed, trench knives come in a variety of styles (open-knuckle, ring, with/without studs or spikes, etc.), but the basic design has a finger/ knuckle guard attached to a blade that is typically between fourteen and eighteen centimeters. An inelegant weapon, trench knives are designed to be straightforward and all business. \n"S" Stun damage when punching with knucks part of weapon.

