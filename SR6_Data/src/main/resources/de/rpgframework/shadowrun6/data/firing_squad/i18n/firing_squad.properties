item.armante_suitdress.desc=The Armante name has long been synonymous with wealth. Only the most affluent (or those wanting to look rich) spend the kind of nuyen it takes to buy Armante.
item.av_big_game_hunter.desc=Added to the lineup a few years back, the Big Game Hunter became popular with shadowrunners who cared very little about living in the shadows. The camo patterns were never very urban-friendly, and most wore it because it was the best armor around for its price. Advances have taken some of its edge away, but Ares now has a bestseller with the "tactical black" and "urban camouflage" options that fit much better on the streets. They're still a little socially maligned, as the bulk and cut aren't fashion- friendly, but those who buy this line are more likely to shoot first and never ask questions. \nNotes: This armor includes rating elemental protection of choice.
item.av_globetrotter.desc=This line started the overall Ares Victory change when fashionable uniforms gained built-in armor. The line has shifted slightly to focus more heavily on this uniform angle, including Ares' major deal with the McHugh's fast-food chain. Yes, those stylish new uniforms are armored, and the employees who work in the rougher part of town are certainly appreciative . \nNotes: This armor includes rating 2 elemental resistance of choice.
item.av_rapid_transit.desc=Take those globetrotter uniforms and strip off the corporate logos, and you get the Rapid Transit line. This is everyday armor for those who want to feel safe and a half-step fashion forward at the same time. The RT line comes in Basic, Elite, Platinum, and Diamond editions, offering a little variety for your plain fashion . \nNotes: This armor includes rating 3 elemental protection of choice.
item.av_rapid_transit.choice.model.basic.desc=Basic model.
item.av_rapid_transit.choice.model.elite.desc=Elite model.
item.av_rapid_transit.choice.model.platinum.desc=Platinum model.
item.av_rapid_transit.choice.model.diamond.desc=Diamond model.
item.av_wild_hunt.desc=The Wild Hunt line is not a single pattern but a series of styles set up for different environments and climates. Along with the well-crafted armor, each suit has features to better protect against the hazards of nature . \nNotes: This armor includes rating 3 elemental resistance of choice.
item.cyclewear.desc=Seeing the success of designing armor for a group with money to spend and not much sense, Ares threw together a marketing campaign and managed to slap enough different brand tags onto very similar garb to practically corner the market on go-ganger armor. RacerWear, SpeedWear, CycleSafe, and MotoArmor are just four of the two-dozen lines of bike-racing armor Ares has got out there. Every line offers custom logos, light striping, and feedback 'ware among their myriad of features that let the gangs customize to their hearts' desires while sending all the nuyen to the same place. The popularity of this armor with combat biking and urban brawl fans and teams is also high.
item.mortimer_greatcoats.desc=Classic longcoat styles are available across the new Greatcoat line. The American drover, classic trenchcoat, stylish Loden, Havelock, Ulster, signature Ulysses, and fashion-forward Argentum styles are just a few. The important thing is the Mortimer logo crafted into semi-hidden points that owners and aficionados alike can spot.
item.mortimer_berwick_suit.desc=Nothing says money like a perfectly tailored British suit, and Mortimer fits that bill perfectly across all of their lines. The classic styling of the Berwick is updated yearly but rarely is any line changed by more than a few millimeters. The Crimson Sky style has skyrocketed in popularity, while the Summit line pairs a suit/dress combo that makes any couple look like a million bucks, while only spending half that!
item.mortimer_crimson_sky_suit.desc=Nothing says money like a perfectly tailored British suit, and Mortimer fits that bill perfectly across all of their lines. The classic styling of the Berwick is updated yearly but rarely is any line changed by more than a few millimeters. The Crimson Sky style has skyrocketed in popularity, while the Summit line pairs a suit/dress combo that makes any couple look like a million bucks, while only spending half that!
item.mortimer_summit_suit.desc=Nothing says money like a perfectly tailored British suit, and Mortimer fits that bill perfectly across all of their lines. The classic styling of the Berwick is updated yearly but rarely is any line changed by more than a few millimeters. The Crimson Sky style has skyrocketed in popularity, while the Summit line pairs a suit/dress combo that makes any couple look like a million bucks, while only spending half that!
item.nightshade_moonsilver_dress_suit.desc=While the Moonsilver line is limited to dresses with electroluminescent threading, the NightShade line offers style and class in a bullet-resistant package that wraps up even the homeliest troll and makes them fit in on the Horizon runways. The "For a killer night, wear NightShade!" slogan has kept this line from leaping into the ranks of Armante, but for an Ares product, its militant manufacturer is often overlooked.
item.realeather_armor.desc=Armor Made from actual leather, this status symbol is not as much about stopping bullets as it is about showing the thickness of your wallet. It has a little extra protection slipped in, but not much.
item.vi_ace_of_cups.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Cups is a high-collar, floor-length longcoat with back shoulder flaring and flowing-but-layered lower half.
item.vi_ace_of_swords.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Swords is a WWII Japanese pilot style jacket, complete with wakizashi scabbard built into the back. \nExtras: Scabbard.
item.vi_ace_of_wands.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Wands features some new-age wizard styling with lots of little pockets for reagents.
item.vi_ace_of_coins.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Coins pushes the limits with black juggernaut hide, platinum thread stitching, and solid gold accents.
item.vi_ace_of_spades.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Spades is a World War II U.S. fighter pilot style. \nExtras: Holster.
item.vi_ace_of_clubs.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Clubs kept the WWII motif but jumped the Atlantic to feature a British bomber pilot style. \nExtras: Holster.
item.vi_ace_of_hearts.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Hearts jumped a century plus forward to a modern military pilot style. \nExtras: Holster.
item.vi_ace_of_diamonds.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Aces lineup continues to wow with unique designs. The Ace of Diamonds took designs based on the Spitfire Resurrection trid series and is looking at making an entire spinoff line after the next installment is released in 2082. \nExtras: Hidden Pocket.
item.vi_steampunk.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Steampunk line is still going strong with a number of electronic security specialists fitting their new decks into the accoutrements of the suits and dresses. That is usually in addition to the custom link that comes built in (stats on p. 55).
item.vi_synergist.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Synergist line is still a strong seller with a touch of priciness, but nothing putting them off the charts in social circles.
item.vi_actioneer_buisness.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nThe Actioneer line is still a strong seller with a touch of priciness, but nothing putting it off the charts in social circles.
item.vi_sleeping_tiger.desc=The fashion masters at Vashon Island continue to maintain their perch atop the mid-level fashion armor market. A few of their creations are even pushing the limits and brushing elbows with some of the world's most well-known high-end names. \nSleeping Tiger came back on the scene just a few years back and now dominates the Vashon Island runways with its color-shifting abilities. Patterns for colors and styles sell for a premium, and several artists are making names for themselves designing one-of-a-kind patterns for wealthy clients.

