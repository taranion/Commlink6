qpath.eye_for_an_eye.step.conscientious_fighter.page=133

qpath.eye_for_an_eye.desc=The Sixth World is a violent place, and a high proportion of its residents have regularly seen and experienced violence. People adapt to this in any ways; one of them is to imitate the behavior they see. <br/>The first step in this path, Violence Prone, can be selected at character creation as part of the character’s background, or a character can gain it if they are experiencing a regular amount of violence.
qpath.eye_for_an_eye.step.violence_prone.desc=The character believes that the way to respond to a punch is with a punch, and they are always ready for a fight. On the negative, they cannot gain or spend Edge on social tests where they or their team attempts to talk their way out of a violent situation, and they must succeed on a Composure (2) test to avoid jumping into the fray whenever they see violence near them. On the positive side, they are tough to catch by surprise since they're almost always ready for a fight, so they get a point of situational Edge when making a Surprise test.
qpath.eye_for_an_eye.step.heedless.desc=By taking this quality, characters decide that their problems came from not being violent enough, and they should take no partial measures. They don't wait for violence to start — they start the violence themselves. They throw the first punch, fire the first shot, cast the first spell.<br/>With this quality, characters make a Composure (2) test in any opposed situation. If they fail, they move to attack whoever they perceive as the source of their problem. This does not mean they immediately resort to lethal measures—they may just slap or punch an opponent to get their attention or send a message. But since violence has a way of escalating a situation, they'll often cause more problems than they solve.<br/>
Heedless characters are very difficult to catch by surprise, since they are always ready for a fight. Their threshold for Surprise tests is 1, and they get a point of situational Edge when making Surprise tests.
qpath.eye_for_an_eye.step.coping.desc=By taking this quality, characters are recognizing that they react with violence too often, and they want to control those tendencies more. They may count to ten, or breathe deeply, or engage in any other technique that helps them relax and focus their mind on solutions beside violence. When they are not able to use their technique, they must make a Composure (2) test or resort to violence, as with the Violence Prone quality. They gain a point of situational Edge when they try to dissuade others from violence or defuse a tense situation (only one point of Edge per attempt, even if it involves a long discussion).
qpath.eye_for_an_eye.step.conscientious_fighter.desc=There is no set point where a character moves beyond the qualities in this step. It's quite possible they may keep either quality for the remainder of their shadowrunning career. Moving to the next step requires both a conscious decision and dedication. Characters need to learn from a martial arts specialist who is proficient in the philosophical underpinnings of their art. This means the person who teaches them needs to have an Instruction expertise and a martial arts specialization. Receiving training from them is neither quick nor inexpensive. The character needs to pay the instructor 200 nuyen per month for twelve months to reach the next stage.

