item.mtoc_mark1.desc=M-TOC (Mobile Tactical Operations Center) Tactical Network \nLike previous generations of tac-nets, the M-TOC is a man-portable network communication terminal roughly fifty percent the size of a standard cyberdeck. It can act on its own or link to a cyberdeck or RCC. The M-TOC works by accessing and correlating data from commlinks, sensors, smart weapon systems, audio and visual cybernetic augmentations, and other external sources. \nWhat makes the M-TOC stand out from other tac-nets is the use of special proprietary programs made specifically for it called Tac-Apps. These provide extra functionality and capabilities, similar to cyberdeck programs. Tac-Apps can be swapped as needed for specific mission profiles allowing for unprecedented customization and versatility. The M-TOC requires an operator to keep the system running properly. Typically this is a Matrix specialist, but a rigger with appropriate skills and gear can also do it. Whoever maintains the network also grants users access to all pertinent information gathered. \nCurrently, the M-TOC comes in three models,  the Mark I, II, and III, each with its own capabilities and utilities. Each M-TOC comes with the following capabilities standard:  \n- Enhanced audio and image link \n- Team member biomonitor \n- Team member weapon status/access (ammo count, operational status, biometric access) \n- Access to linked team members' gear (includes commlinks and other comm gear) \n- Real-time tactical and strategic evaluation software \n- GPS and mapsoft navigation software \nThe Mark I was designed for security and law enforcement officers during situations requiring enhanced coordination, such as hostage situations, when specialized response teams are unavailable. It was designed to be cost effective, so it can be distributed among rank-and-file patrol officers. The Mark I also features standard enhanced threat detection, identification friend/foe (IFF) software, and limited enhanced targeting for smartgun-equipped weapons. \nNotes: Lowers the threshold by  -1 for Perception tests to detect ambush. IFF software provides a +1 to Perception tests to determine if a target is carrying concealed weapons and to identify subjects via facial recognition software. Also grants a +1 to AR for all linked smartgun weapons. The Mark I can handle up to nine users.
item.mtoc_mark2.desc=M-TOC (Mobile Tactical Operations Center) Tactical Network \nLike previous generations of tac-nets, the M-TOC is a man-portable network communication terminal roughly fifty percent the size of a standard cyberdeck. It can act on its own or link to a cyberdeck or RCC. The M-TOC works by accessing and correlating data from commlinks, sensors, smart weapon systems, audio and visual cybernetic augmentations, and other external sources. \nWhat makes the M-TOC stand out from other tac-nets is the use of special proprietary programs made specifically for it called Tac-Apps. These provide extra functionality and capabilities, similar to cyberdeck programs. Tac-Apps can be swapped as needed for specific mission profiles allowing for unprecedented customization and versatility. The M-TOC requires an operator to keep the system running properly. Typically this is a Matrix specialist, but a rigger with appropriate skills and gear can also do it. Whoever maintains the network also grants users access to all pertinent information gathered. \nCurrently, the M-TOC comes in three models,  the Mark I, II, and III, each with its own capabilities and utilities. Each M-TOC comes with the following capabilities standard:  \n- Enhanced audio and image link \n- Team member biomonitor \n- Team member weapon status/access (ammo count, operational status, biometric access) \n- Access to linked team members' gear (includes commlinks and other comm gear) \n- Real-time tactical and strategic evaluation software \n- GPS and mapsoft navigation software \nDesigned for front-line military units, the Mark II has some of the same capabilities as the Mark I but is more specialized toward combat operations rather than law-enforcement/security duties. The Mark II is also known for being physically resistant to external and Matrix damage. And thanks to modular components, it is easier to repair in the field. \nNotes: Lowers threshold by  -2 for Perception tests to detect ambush. Grants +1 to AR for all linked smartgun weapons. Enhanced encryption raises the threshold for all Cracking tests by +1. Modular construction lowers the threshold for repairing damage by  -2. Rugged construction grants a  -1 to all physical damage taken. The Mark II can handle up to 15 users.
item.mtoc_mark3.desc=M-TOC (Mobile Tactical Operations Center) Tactical Network \nLike previous generations of tac-nets, the M-TOC is a man-portable network communication terminal roughly fifty percent the size of a standard cyberdeck. It can act on its own or link to a cyberdeck or RCC. The M-TOC works by accessing and correlating data from commlinks, sensors, smart weapon systems, audio and visual cybernetic augmentations, and other external sources. \nWhat makes the M-TOC stand out from other tac-nets is the use of special proprietary programs made specifically for it called Tac-Apps. These provide extra functionality and capabilities, similar to cyberdeck programs. Tac-Apps can be swapped as needed for specific mission profiles allowing for unprecedented customization and versatility. The M-TOC requires an operator to keep the system running properly. Typically this is a Matrix specialist, but a rigger with appropriate skills and gear can also do it. Whoever maintains the network also grants users access to all pertinent information gathered. \nCurrently, the M-TOC comes in three models,  the Mark I, II, and III, each with its own capabilities and utilities. Each M-TOC comes with the following capabilities standard:  \n- Enhanced audio and image link \n- Team member biomonitor \n- Team member weapon status/access (ammo count, operational status, biometric access) \n- Access to linked team members' gear (includes commlinks and other comm gear) \n- Real-time tactical and strategic evaluation software \n- GPS and mapsoft navigation software \nDesigned specifically for use by Special Forces - type units, the Mark III features some of the most advanced tactical software on the market, resulting in a network that's harder to crack and assists users with their own hacking attempts while still providing some of the best targeting enhancement known. All of these benefits come at a cost, of course. To prevent system overload, Pantheon had to cap the number of active users. While somewhat limiting, the relatively small numbers of SF teams made this a minor drawback. \nNotes: Lowers threshold by  -1 to all Perception tests to detect ambush. Grants +2 to AR for all linked and smartgun weapons. Enhanced encryption raises the threshold for enemy Cracking tests by +3. Modular construction lowers the threshold for repairing damage by  -2. Rugged construction grants a  -1 to all physical damage taken. Because of its specialized nature, the Mark III can only handle up to 10 members.
item.artillery_barrage.desc=[TacApp] This app provides additional targeting data for launch-type weapons such as grenade launchers, rocket launchers, or mortars, making them more accurate. It also enables a shooter to rain down fire from a smartgun-equipped assault rifle, machine gun, or assault cannon as if it were a miniature artillery piece.  \nRules: +1 to dice pool for grenade launchers, rocket launchers, and mortars. No weapon-related penalties for shooting assault rifles, machine guns, or assault cannons when app is active. Shooter must still have at least some line of sight or know a target's location.
item.co-pilot.desc=[TacApp] This app allows a team member to take control of a vehicle or drone linked into the network, so a rigger can focus on other tasks. Controlling a vehicle or drone with this app isn't considered optimal.  \nRules: When controlling a vehicle with this app, the new operator/driver can do so with their commlink or AR gloves, but at a  -1 dice pool penalty. When controlling drones, the new operator can only issue commands as if in the captain's chair.
item.door_gunner.desc=The Door Gunner app features advanced control and targeting software that allows a secondary team-member to control a mounted, remote-operation- capable vehicle weapon. Because of this app's narrow focus and SOTA software code, "it's just like having the weapon in your hands," as their advertising slogan says.  \nRules: This app enables a new operator/gunner to control a vehicle weapon with their commlink or AR glove with no penalties. However, the operator must be able to receive smartlink targeting data.
item.ecm_warrior_ii.desc=Matrix asset denial and attacks are mainstays of modern combat. To assist in attacking enemy networks and defending their own, the ECM warrior is designed to give an operator extra "electronic ammo" to engage enemy hackers and help cut through any noise.  \nRules: +2 to all offensive Cracking tests while using this app. Additionally, provides a  -2 to all noise within (Device Rating x5) meters of the device running the app.
item.junk_wall.desc=Junk Wall takes layers of benign "junk code" and adds them to the network and any other linked devices' firewalls. In order to access linked devices, an enemy hacker must get through the additional layers.  \nRules: Add one-half of the M-TOC's Device Rating (round up) to a linked cyberjack or RCC's Firewall rating.
item.mobile_medic.desc=Designed to work directly with a medkit, giving the user additional information or instruction when treating wounded. The app constantly updates with the latest emergency medical data, so if someone doesn't know how to administer aid, this app will guide them.  \nRules: Add half the Device Rating to the user's First Aid dice pool, or add +1 to a medkit's rating .
item.sneak_sneak.desc=[TacApp] Using a combination of tracking algorithms and image evaluation software, Sneak-Sneak hels the user increase their stealth by pointing out potential hazards or obstacles that could alert an enemy to their presence and suggests alternate paths/ methods.  \nRules: Grants a +2 on all Stealth (Sneaking) tests
item.target_artist.desc=[TacApp] Designed to work in conjunction with the Artillery Barrage app, Target Artist is used when a shooter doesn't have line of sight on their target or when a target is behind cover/concealment but still needs to be engaged. This app takes targeting data from a source that has line of sight (another team member or drone for example) and paints the target or target area for the shooter, allowing them to attempt the shot. This app also has a secondary feature in that it can be used to rapidly identify and designate targets, obstacles, or hazards on a mapsoft overlay.  \nRules: Allows shooter to attack without direct line of sight. Designated targets then can be targeted with the "called shot" action as an anytime action.
item.team_leader.desc=[TacApp] Leading a combat team during combat is a difficult and often chaotic situation. The Team Leader app presents the designated leader with data projections on current tactical situations based on sensor data, team biometrics, weapon status, and other environmental factors in order to assist with decision-making and team coordination.  \nRules: This app provides a pool of bonus dice equal to the M-TOC's device rating for use on the following tests: teamwork, navigation, perception, and maneuver. This dice pool can be broken up and assigned as needed but can only be used once per combat engagement.

