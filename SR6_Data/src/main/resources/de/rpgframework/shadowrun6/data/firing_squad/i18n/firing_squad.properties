item.under_shotgun.desc=In combat, you need any edge you can get, and that sometimes means adding even more bang to your bang-bang. Underbarrel weapons first gained prominence in the late 1960s when grenade launchers were attached under the barrels of what we today consider assault rifles. And it wasn't long until other weapons were being attached. The underbarrel weapon attachment mount allows for multiple purpose- built weapon-types (each sold separately!) to be attached and integrated into the host weapon system. While this allows for some interesting combinations, using an underbarrel weapon that's not integrally designed into the host weapon makes it extremely bulky, so good luck trying to hide it. The current popular weapons to attach include: a small shotgun, a micro-grenade launcher, a micro combat chainsaw, bolo launcher, and grapple hook launcher. \nNote: The installation of an underbarrel weapon effectively removes the underbarrel slot for further accessories. Underbarrel weapons are not available for pistols and SMGs. This modification takes two slots.
item.wss_ap_spikes.desc=Anti-personnel spikes are loaded into the weapon's handle and deploy into the target's hand to cause pain and injury.
item.wss_explosive.desc=The explosive countermeasure is located internally and comes with two settings ,  one simply bricks the weapon if activated, while the other turns the weapon into an HE grenade. \nExplosive damage when set to full HE mode, range is GZ only.
item.wss_rfid_tracker.desc=The RFID tracker is just that, a hidden beacon that can be set to broadcast if an unauthorized user attempts to use the weapon or if the weapon travels a specific distance from the primary user.
item.wss_taser_shock.desc=The taser-shock option is also located in the handle and hits the target with an electric attack.

