ammotype.handloaded_ammo=Handloaded Ammo
ammotype.handloaded_ammo.page=39
ammotype.match-grade_ammo=Match-Grade Ammo
ammotype.match-grade_ammo.page=39
ammotype.revo_rounds=Revo Rounds
ammotype.revo_rounds.page=45

ammotype.handloaded_ammo.desc=With a little extra care and TLC, a good gunsmith can handload their own ammo. This extra effort provides a decent boost across the board with a well-seated slug and hand-selected powder weight and grains. You'd be amazed at how often the powder load has foreign matter in it throwing off the burn. \nNote: Handloading requires an Engineering + Logic (4, 1 hour) Extended test for each set of 10 bullets made along with the cost for materials
ammotype.match-grade_ammo.desc=A perfectly weighted and seated slug and powder that is sifted grain by grain makes this ammo the best you can buy for accuracy over distance. The process tends to cost a little in the penetration department, because hitting the mark is much more important than going through the mark with this ammo.
ammotype.revo_rounds.desc=I'm not exactly sure why they found it necessary to develop an updated version of what looks like the old Firepower ammo, but they have. This cased ammo uses a proprietary chemical combination for the propellant and the slugs themselves are nanomanufactured with a unique bonding structure that holds together to punch through armor, but also fragments when hitting soft tissue, even if it hits the tissue instead of armor. Every box comes with a warning saying that the round cannot be taken apart without the propellent being ignited in order to prevent reverse engineering. You can't pull out the slug to analyze its structure, and you can't get access to the chemical propellent. This ammo is shrouded in a level of mystery that makes it both highly sought after but also feared by those who are worried about what manufacturing and nanotech were required to make a round like this.

