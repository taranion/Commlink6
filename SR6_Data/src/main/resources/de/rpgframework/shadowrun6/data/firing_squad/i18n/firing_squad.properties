itemmod.flashing_blade.desc=The blade has a miniaturized version of a Flash- Pak build into one side, allowing the wielder to temporarily blind an opponent. \nWireless: The strobe sequence can avoid directing strong ﬂashes at the subscribed character and requires only a single Minor Action to use. The device can recharge by induction, regaining one charge per hour. \nNote: Activating the flashing blade requires two Minor Actions. A designated opponent receives the Blinded II status (p. 51, SR6) on all tests that include vision due to the strobe effect. If the target has low-light vision, the status increases to Blinded III. Flare compensation drops the status down one level. The Flashing Blade has five charges and uses one charge per combat round. Plugged in, it regains one charge every ten seconds.
itemmod.spikes.desc=Whether as simple as nails hammered into a baseball bat or something individually machined and welded, spikes add a lethal sting to clubs of all kinds. \nNote: Clubs with this modification do Physical instead of Stun damage.
itemmod.spikes_retractable.desc=Same concept as regular spikes, but retractable so the weapon can look less deadly if you choose, and you can switch between the types of damage you inflict. \nWireless: You gain a bonus Minor Action on a turn when you retract or extend the spikes. \nNote: Clubs with this modification do Physical instead of Stun damage. Extending or retracting the spikes requires a Minor Action. Not compatible with clubs with a collapsing feature.
itemmod.zapper_coating.desc=The club has a special, highly conductive coating, and a charging unit is installed inside a sealed and nonconductive handle. Impact with the weapon lets out quite the zap on top of the normal wallop. \nWireless: The device can recharge by induction, regaining one charge per 15 minutes of wireless-enabled time. \nNote: When activated, the weapon deals (standard damage + 1) electrical damage. The coating holds 3 charges and recharges at a rate of 1 charge per minute when plugged in.
itemmod.glowcoat.desc=This option is a simple layer of electroluminescent paint and a small power source that turns your weapon into a flashlight. Why not just carry a flashlight? If you're swinging a combat axe in both hands, you don't have a free hand to hold a flashlight. Duh! \nWireless: You gain a bonus Minor Action when you turn the illumination on or off. You can double the range of the lighted area with a Minor Action. \nNote: Glowcoat reduces any Blinded penalties originating from darkness for you and anyone standing within the glow of the light (5 meters) by 1 level. Turning the illumination on or off requires a Minor Action.
itemmod.smart_materials_melee.desc=Even the smallest tweak of length or thickening a chisel point can make all the difference in a confrontation. Alterations to the carbon structure with a small electrical push and some preset basics provide the advantage you need. Connectivity adds plenty of other options. \nWireless: The user gains a point of Edge while attacking with this weapon when the wireless settings are activated. \nNote: When the wielder uses a Minor Action, the weapon gains a +2 bonus to the Attack Rating (in categories where it has an Attack Rating). The bonus lasts until the situation changes according to the gamemaster, usually between opponents.

item.concealable_sheath.desc=This is a small sheath worn just about anywhere on the body where it can be hidden. It is attached with a smart adhesive that can be programmed to move to a new location. \nWireless: Sensors, smart-fabric, and active adhesive allow the holster to alter color and move small amounts in real time, increasing the Concealability threshold by an additional 1. \nNote: A melee concealable holster increases the Concealability threshold of the weapon inside by 1.
item.melee_quick_draw_sheath.desc=An easy-access sheath designed to hold melee weapons in the perfect spot for a quick and effective strike. \nNote: Use of the quick-draw sheath provides a bonus Minor Action when the Quick Draw Action is taken.
item.melee_hidden_arm_slide.desc=Attached to the forearm and worn under clothing, this slide can fit a small blade (no katanas), shuriken, throwing knives, or throwing spikes. \nWireless: You get a bonus Minor Action on any turn when you activate the slide. \nNote: Up to three shuriken, throwing knives, or throwing spikes can be loaded with a Minor Action. With a specific movement, the slide moves the weapon into your hand with no action cost. It also decreases the Concealability threshold by 1.

