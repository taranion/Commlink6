technique.baton_lock.desc=In the hands of a trained fighter, sticks of various lengths can be used as grappling aids. When using a blunt weapon, you may use any technique from the Grappling category as though you were unarmed, with the option of using the weapon's damage (including the bonus from Precision Strikes, if applicable) in place of your base unarmed damage.  \nCategory: Weapon
technique.bending_of_the_reed.desc=Gain a bonus Edge when using the Dodge Minor Action against melee or ranged attacks (choose which category when learning this technique). This technique may be taken up to twice in order to gain both the melee and the ranged Dodge bonus.  \nCategory: Mobility
technique.close-quarters_firearms.desc=When using a rifle, shotgun, or submachine gun in melee combat, that firearm may count as a Clubs weapon for the purposes of martial arts techniques. At the gamemaster's discretion, striking an opponent with an un-reinforced weapon may damage or even break the weapon. \n Category: Ranged\
technique.close-quarters_firearms_handguns.desc=When using a light pistol, heavy pistol, holdout pistol, machine pistol, or taser in melee combat, that firearm may count as a Clubs weapon for the purposes of martial arts techniques. At the gamemaster's discretion, striking an opponent with an un-reinforced weapon may damage or even break the weapon. \n Category: Ranged
technique.defiant_dance.desc=When caught in a Grapple (p. 111, SR6), the character may roll Athletics + Agility as though they were escaping from restraints in place of their normal Close Combat + Strength, using the opponent's net hits on the opposed Strength Test to initiate the grapple as the threshold for the Escape test. \n Category: Mobility
technique.dim_mak.desc=By making a Called Shot to target a specific limb, on a successful attack you may choose to inflict the Disabled status (p. 106) on the selected limb instead of inflicting damage, with every two net hits increasing the level of the status by 1. \n Category: Striking
technique.drunken_boxing.desc=You've been trained to move and attack in unpredictable ways, which can be both a benefit and a drawback. The number of 1s you need to glitch on any Unarmed attack is reduced by 1 due to the sloppy execution, but your target loses two dice from their Defense Tests against those attacks thanks to the difficulty in anticipating your movements.  \nCategory: Mobility
technique.elbows_tight.desc=Gain a bonus Edge when using the Block Minor Action without a weapon. If not used immediately, the bonus Edge is lost. \n Category: Mobility
technique.end_them_rightly.desc=When using a melee weapon, you may apply the bonus granted by the Feint Maneuver to an attack with a throwing weapon instead of a melee weapon. If the throwing weapon is fitted to the melee weapon as a weapon attachment, you may detach and throw it without spending a Ready Weapon Minor Action to draw the thrown weapon. \n Category: Weapon
technique.entanglement.desc=This functions the same as the Edge Action (p. 93) but without the Edge cost. When using exotic weapons such as whips, chains, bolos, and lariats as part of grapple, roll Exotic Weapon + Agility vs. Agility + Reaction. If successful, not only is the opponent restrained, but with a Minor Action, the weapon now restrains the opponent, leaving the attacker free to do other things. If net hits of the attack exceed the opponent's Agility, the opponent gains the Hobbled status for a number of combat rounds equal to the number of net hits. \n Category: Weapon
technique.feint.desc=By spending a Minor Action and succeeding at a Close Combat + Agility (3) test, you may reduce your target's Defense test dice pool against your next Close Combat attack by 3 dice. \n Category: General
technique.flying_kick.desc=You've trained yourself to become a metahuman projectile, battering opponents down with your soaring feet of fury. By spending an extra Minor Action and succeeding at an Athletics + Agility (3) test, you may extend your Close range bracket by 0.5 meters/hit (not net hit) and increase your DV by 2 (stacking with the bonus from Kick Attack, for a total bonus of +3). However, a glitch on either the Athletics + Agility test to launch yourself successfully or the Close Combat + Agility test for the attack roll results in gaining the Unbalanced status until your next action, and a critical glitch on either roll makes you take a tumble, inflicting both the Prone status and the Disabled II status (p. 106) on one of your legs (randomly determined) as you twist your joints in a way they weren't intended to move. \n Category: Striking; requires the Kick Attack technique
technique.ground_fighter.desc=You're used to fights ending up as a mass of tangled limbs rolling around on the nearest flat surface. You never suffer penalties for attacking or defending while you have the Prone status (p. 53, SR6), and the penalty to your Defense tests while restrained is reduced by half (rounded down). \n Category: Grappling
technique.half-sword.desc=Increase the Attack Rating of the weapon by 2 when making Half-Sword attacks, but reduce the Close Range bracket by 1 meter. \n Category: Weapon; may only be used with swords
technique.iaijutsu.desc=Like the samurai of old (or at least the ones in the trids), the character may use the Quick Draw Minor Action (p. 42, SR6) with any properly stored melee weapon that is small enough to be wielded in one hand, no quick-drawing polearms, unless it's dwarf-sized and you're a troll. The character must still use the Quick Draw action together with the Attack Major Action. \n Category: Weapon
technique.iron_limbs.desc=Add +1 DV to your base unarmed damage. \n Category: Striking
technique.jiao_di.desc=This probably wasn't what your parents meant when they told you to "use your head," but it works. You may use a head butt to make unarmed attacks at half your normal Close range increment even when your limbs are otherwise immobile, including while grappling or being grappled, and you gain +1 DV to those attacks (does not stack with Iron Limbs or Ti Khao). Also, when defending against a grapple, you may attempt to damage your opponent as though you were the attacker (p. 111, SR6). \n Category: Grappling
technique.joint_lock.desc=When executing a grapple (p. 111, SR6), the character may use the "Inflict Damage" option to inflict the Disabled status (p. 106) on the grappled arm or leg, with every two net hits increasing the level of the status by 1. \n Category: Grappling
technique.kick_attack.desc=You've been trained to use all sorts of kicks effectively in combat, whether they're front kicks, side kicks, or even the legendary roundhouse kick (beard optional). When attacking with Kick Attack, add +1 to your unarmed Damage Value and 2 meters to your Close Range. Rolling a glitch on a Kick Attack inflicts the Off-Balance status on you, while rolling a critical glitch inflicts the Prone status.  \nCategory: Striking
technique.mean_right_hook.desc=Reduce the Edge cost of the Knockout Blow Edge Action (p. 47, SR6) by 1. \n Category: Striking
technique.meridian_strike.desc=By combining their Awakened talents with their martial arts expertise, adept practitioners of Hapsum-Do may disrupt the flow of mana in their opponent's bodies. When making an unarmed attack against an Awakened opponent, if the adept has the Killing Hands power active, they may choose to reduce the dice pool for their target's next Magic- linked test by 1 per net hit instead of inflicting damage. \n Category: Striking; requires Killing Hands
technique.multiple_opponent_combat.desc=When using the Multiple Attacks Minor Action to attack multiple targets, add 1 die to your attack pool for every two targets you attack. (For the purposes of this technique, attacking multiple locations on the same target counts as one target.) \nCategory: Mobility
technique.multiple_opponent_defense.desc=When you're attacked by multiple attackers in the same Combat Round, gain +2 to your Defense Rating on all attacks after the first. This bonus is not cumulative; if you're attacked three times, you get +2 to your Defense Ratings against the second and third attacks, not +2 against the second and +4 against the third. \n Category: Mobility
technique.neijia.desc=You might not be Awakened, but you've learned to channel your qi (or ki, prana, ruach, pneuma, "spirit energy," or sheer meanness) into a strike that reaches across the boundaries between material and immaterial. You may make unarmed attacks against astral entities as though you were Awakened (see Astral Combat, p. 160, SR6), with a Damage Value of (WILL/2 + net hits). This technique does not give you the ability to perceive astrally or bond weapon foci. \n Category: General
technique.oaken_stance.desc=Gain a bonus Edge when resisting attempts to knock you prone in melee combat. If not used immediately, the bonus Edge is lost. \n Category: Mobility
technique.parry.desc=Gain a bonus Edge when using the Block Minor Action with a weapon. If not used immediately, the bonus Edge is lost. \n Category: Weapon
technique.pin.desc=This works the same as the Edge Action of the same name, only without the Edge cost. With this attack, if the number of hits exceeded the Defense Rating of the target, regardless if whether attack inflicted actual any damage or not, then the opponent has been pinned to the wall or floor, giving them the Immobilized status. The opponent must spend a Pick Up/Put Down Object action to remove the Immobilized status. \n Category: Weapon; may only be used with sharp weapons.
technique.precision_strike_blades.desc=Thanks to extensive training with your chosen weapon, you may add (STR/3, rounded up) to the DV of your attacks when using weapons from the specified category. This technique may be taken multiple times, applying to a different category of weapon (Blades, Clubs, Exotic) each time it's taken.  \nCategory: Weapon.
technique.precision_strike_clubs.desc=Thanks to extensive training with your chosen weapon, you may add (STR/3, rounded up) to the DV of your attacks when using weapons from the specified category. This technique may be taken multiple times, applying to a different category of weapon (Blades, Clubs, Exotic) each time it's taken.  \nCategory: Weapon.
technique.precision_strike_exotic.desc=Thanks to extensive training with your chosen weapon, you may add (STR/3, rounded up) to the DV of your attacks when using weapons from the specified category. This technique may be taken multiple times, applying to a different category of weapon (Blades, Clubs, Exotic) each time it's taken.  \nCategory: Weapon.
technique.releasing_talons.desc=Reduce the Edge cost of the Wrest Edge Action (p. 47, SR6) by 1. \nCategories: Grappling, Striking
technique.rolling_clouds.desc=This works the same way as the Edge Action of the same name (p. 95), only without the Edge cost. With an Athletics + Agility test, each success extends the number of meters that you can fall without suffering damage \nCategory: Weapon
technique.sacrifice_throw.desc="If I'm going down, I'm taking you with me!" If an attacker manages to knock you prone, you may immediately spend a Minor Action (if you have one) to attempt to knock them down as though you were tackling them (see Grapple, p. 111, SR6).  \nCategory: Grappling
technique.striking_the_darkness.desc=When in melee combat in low-light conditions (see Environment and Visibility, p. 118, SR6), you are treated as having a vision enhancement for the purposes of gaining Edge. \n Category: General
technique.sweep_the_leg.desc=When performing the Trip Minor Action while unarmed, you receive a free point of situational Edge that goes away if you do not use it on the Trip test. \nCategories: Grappling, Striking
technique.tameshiwari.desc=Boards might not hit back, but you never know when it'll be useful to break through a solid surface with your hands, feet, head, or other part of your body. When attacking a barrier (including magical barriers that impede the user's physical movement) with an unarmed attack, treat the barrier as if the Structure rating were 4 lower for the purposes of determining damage. At the gamemaster's discretion, a glitch or critical glitch may result in the attacker breaking their own hand/foot/head on the offending object. \n Category: Striking
technique.threatening_edge.desc=This works the same as the Edge Action of the same name, only without the Edge cost. For the duration of an encounter, while wielding a melee weapon, the character's Defense Rating is replaced by the Close Attack Rating of the weapon. \n Category: Weapon
technique.ti_khao.desc=You've been trained to use your knees to attack an opponent while grappling, whether by kneeling on them to choke them out or striking them for a bit of extra oomph. Add +1 DV to damage you inflict while grappling (see Grapple, p. 111, SR6).  \nCategory: Grappling
technique.tricking.desc=Flashy spinning kicks, twirling staves, and shooting the cigarette out of an opponent's mouth might not be practical in the normal sense, but if done right, they can impress your friends and scare your enemies. Whenever you make a Teamwork test to help an ally intimidate a target, including using the Big Speech Edge Action (p. 47, SR6), you may roll Weapon Skill + Agility in place of Influence + Charisma. (When using this technique with the Big Speech Edge Action, only the first Influence + Charisma test may be replaced with Weapon Skill + Agility, not both.) \nCategory: General
technique.two-weapon_fighting.desc=When using the Multiple Attacks Minor Action with more than one weapon, gain an additional two dice to split between your attacks. \n Category: Weapon.
technique.weapon_breaker.desc=When using Called Shot, Disarm, reduce either the Edge cost (if spending Edge) or the dice pool penalty (if not spending Edge) by 1. \n Category: General.

#Qualities
quality.pacifist=Pacifist
quality.pacifist.page=120

quality.always_late=Always Late
quality.always_late.page=129
quality.always_late.desc=It doesn't matter how many alarms you set or how many times your teammates call you to remind you; whether you're constantly distracted or can't drag yourself out of bed, you cannot show up anywhere on time to save your life. Most of the time you shrug it off, but sometimes—like when you're supposed to meet with Mr. Johnson — it makes your team look sloppy.<br/>\
 <b>Bonus:</b> 2 Karma<br/>\
 <b>Game Effects:</b> You always arrive at least fifteen minutes late for any scheduled event. When the event in question includes a meeting with a prospective employer, your entire team suffers a –1 penalty to social tests against Mr. Johnson due to your unprofessional behavior.
quality.bad_memories=Bad Memories
quality.bad_memories.page=129
quality.bad_memories.desc=You can't enjoy all those trids where the main character “faces their inner demons,” because they hit a little too close to home. Some nasty drek happened in the past, and it's lurking around even today, popping up when you least expect it—and at the least convenient times.<br/>br/>\
 <b>Bonus:</b> 3 Karma<br/>\
 <b>Game Effect:</b> When you take (or are assigned) this quality, choose a subject of your Bad Memories. Whenever you're required to be in the presence of that subject, you may only gain a maximum of one point of Edge per combat round, instead of the usual two.
quality.compulsion=Compulsion
quality.compulsion.page=129
quality.compulsion.desc=Some people alleviate their suffering by stuffing themselves to the gills with illicit substances. You've chosen another way: a behavior you can't help but indulge in, that's less poisonous but equally toxic. This can represent anything from psychological addictions like gambling or Matrix gaming to “obsessive-compulsive” behaviors like arranging items in a certain order or repetitive handwashing.<br/><br/>\
 <b>Bonus:</b> 2 Karma per level<br/>\
 <b>Game Effect:</b> You must indulge in your chosen activity for a specified amount of time per day, depending on the level of the quality. Failing to do so results in you suffering withdrawal, inflicting a –2 dice pool penalty on all tests, increasing by 1 with each withdrawal period that elapses. As with the Addiction quality, you cannot earn Edge or spend Edge in any form while suffering withdrawal. However, like the modified Addiction quality described above, characters do not suffer the effects of the Anxiety, Depression, or Paranoia negative qualities while indulging their compulsion. (The player and gamemaster should work together to decide whether the character is capable of performing any other acts at the same time as their compulsion.)
