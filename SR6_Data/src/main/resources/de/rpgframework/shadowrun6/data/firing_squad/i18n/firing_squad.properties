martialart.52blocks.desc=Known by a wide variety of other names, 52 Blocks evolved from fighting styles practiced by African American slaves and was further developed by inmates in American prison systems throughout the twentieth century. The style is highly defensive and mobile, highlighted by the "52 blocks" that give it its name, while also incorporating striking and knife techniques. \n Category: Mobility, Striking\ \n Signature Technique: Elbows In
martialart.aikido.desc=Widely known as the "pacifist's martial art," aikido is a "soft" martial art that relies on using the opponent's force against them. The techniques are almost purely defensive, emphasizing disarming and restraining attackers without inflicting harm. Aikido also possesses a strong spiritual element, combining traditional Buddhist and Shinto beliefs with a philosophy of peace and non-violence. \n Similar Styles: Baguazhang (China), Taijiquan (China)\ \n Category: Grappling \n Signature Technique: Sacrifice Throw
martialart.arnis.desc=An umbrella term for a collection of Filipino martial arts, arnis (also known as arnis de mano, escrima, or kali) emphasizes the use of paired rattan sticks (baston) or daggers (baraw/daga), as well as longer blunt and bladed weapons, unarmed strikes, and joint locks. \n Similar Styles: Banshay (Myanmar), gatka/shastar vidya (India), krabi-krabong (Thailand), Nguni stick fighting (Azania)\ \n Category: Weapon\ \n Signature Technique: Two-Weapon Fighting
martialart.bartitsu.desc=Known as the "gentleman's martial art" and made famous by literary heroes like Sherlock Holmes and John Steed, bartitsu teaches the use of a cane or umbrella, back in the day, those were objects people might carry on an everyday basis,  as a self-defense tool. \n Similar Styles: Bataireacht (Tír na nÓg)\ \n Category: Weapon\ \n Signature Technique: Parry
martialart.boxing.desc=Ah, good ol' fisticuffs. Boxing is the ancient art of punching someone until they fall over, hopefully before they punch you until you fall over. The styles of individual boxers vary greatly, some are highly mobile and throw flurries of punches, while others focus on taking punishment until they can knock their opponent out in a single blow. The chief difference is that unlike other styles of unarmed combat, boxing relies on fists alone. \n Similar Styles: Dornálaiocht (Tír na nÓg)\ \n Category: Mobility, Striking\ \n Signature Technique: Mean Right Hook
martialart.capoeira.desc=Developed in Amazonia (then known as Brazil) by slaves of African heritage, capoeira has practitioners who avoid detection by disguising their art as a dance. Since the practitioners' hands were often shackled, preventing them from attacking or defending effectively with their arms, capoeira emphasizes highly evasive movements and leg techniques like kicks and sweeping the legs. \n Similar Styles: Engolo (Angola)\ \n Categories: Mobility, Striking\ \n Signature Technique: Feint
martialart.careomeleg.desc=The much-celebrated elven martial art relies on quick, accurate strikes (both unarmed and with various bladed weapons) and highly mobile defenses, often leading to the claim that there are "no stances" in carromeleg. Claims that the style was actually developed in a previous age of the world continue to swirl, and traditionally minded carromeleg instructors will only accept elves as students,  but a handful of carromeleg masters have begun sharing their style with non-elves, leading to a great deal of friction within the carromeleg community (such as it is). \n Categories: Mobility, Striking, Weapon\ \n Signature Technique: Bending of the Reed (Melee)
martialart.chakram_fighting.desc=The chakram is originally a throwing weapon from the Indian subcontinent, though it was widely used across various parts of Asia. It typically takes the form of a sharpened ring that can be worn as jewelry until it was needed in combat. The chakram can also be worn as a sharpened knuckle- duster, provided the user is willing to risk cutting their own hand. \n Similar Styles: Shurikenjutsu (Japan)\ \n Categories: Ranged\ \n Signature Technique: Pin
martialart.close_quarters_combat.desc="Combatives" is a general description for practically focused, "tactical" martial arts developed for use by law enforcement and military personnel, rather than traditional styles carried into the present day. They often include a mix of grappling and striking techniques, including baton techniques, disarming opponents with weapons, and methods of using firearms in hand-to-hand combat. \n Similar Styles: Krav Maga, MCMAP, Systema \n Categories: Grappling, Mobility\ \n Signature Technique: Releasing Talons
martialart.european_fencing_longsword.desc=One of many weapons flying the banner of "historical European martial arts," the longsword is the archetypal two-handed sword used throughout Europe during the Middle Ages. Its resurgence in the Sixth World came about thanks to the re-discovery of manuals by masters like Fiore dei Liberi and Johannes Lichentauer, which gained special traction among street samurai who disdain the katana as being over-hyped. Originally developed for the battlefield, longsword fencing is perfect for those who intend to cut through swathes of opponents in a single swing. \n Category: Weapon\ \n Signature Technique: Half-Sword
martialart.european_fencing_rapier.desc=This is not modern sport fencing, but rather combat in the style of Bonetti, Capo Ferro, Thibault, Agrippa, and that one classic flatvid duel from the 1980s. Most twenty-first-century fencing is based on techniques that originated in France and Italy, although the Spanish style of la verdadera destreza has gained quite a bit of traction in recent years. European duelists often paired their rapiers with an off-hand weapon like a dagger, a tradition that's survived into the modern day. \n Category: Weapon\ \n Signature Technique: Ballestra
martialart.gun_kata.desc=More of a performance art than a combat art in its twentieth-century flatvid incarnations, Gun Kata (also known as Gun Fu) has taken on a new practicality in an era of supernaturally and technologically enhanced reflexes and aim. The style focuses on the use of the pistol as both a melee and ranged weapon, and many Gun Kata practitioners modify their guns to increase their sturdiness in melee (and disable the annoying warnings from their smartlinks about improper shooting posture). Gun Kata retains some of the flashiness of its showbiz origins, and Gun Kata stylists have been known to incorporate both acrobatics and trick shots into their fighting style. \n Categories: Mobility, Ranged\ \n Signature Technique: Close-Quarters Firearms (Handguns)
martialart.hapsum_do.desc=Though adepts practice a wide variety of martial arts styles with fearsome effectiveness, hapsum-do (or the Way of Unified Mana) is the first martial arts style developed specifically to make use of an adept's supernatural powers. Grandmaster "Barghest" Knorr, an adept who travels around the world to share his techniques, is widely acknowledged as the founder of the style. Functionally similar to other "hybrid" arts that include both grappling and striking techniques (and thus usable by non-adepts in many respects), certain hapsum-do techniques rely on the practitioners' Awakened abilities to be effective. \n Categories: Grappling, Striking\ \n Signature Technique: Meridian Strike
martialart.jeet_kune_do.desc=The style of Jeet Kune Do was first developed by the legendary martial artist Bruce Lee, combining elements of many existing martial arts styles under a philosophy of "whatever works",  the same philosophy applied by practitioners of mixed martial arts, who often study both grappling and striking styles (jujutsu and Muay Thai is a popular combination) to ensure their effectiveness in the ring. \n Similar Styles: Hapkido (Korea)\ \n Categories: Grappling, Striking\ \n Signature Technique: Sweep the Leg
martialart.jogo_do_pao.desc=Developed in Portugal, Jogo do Pao is effectively staff fighting. It evolved from the techniques that residents of rural areas used to fend off dangerous wildlife with long walking sticks. Its popularity fell as time passed and more people moved into the city, but it maintained enough of a following to survive into the Sixth World. \n Similar Styles: Ball de bastons (Iberian peninsula), canne de combat (France)\ \n Category: Weapon\ \n Signature Technique: Threatening Edge
martialart.jujutsu.desc=Jujutsu (and its combat-sport variant, judo) is an unarmed combat style from Japan that focuses heavily on grappling, restraining/subduing, and throwing techniques. It's frequently studied by police officers for the purposes of disarming and arresting suspects, and by bouncers for escorting unruly customers off the premises. \n Similar Styles: Malla-yuddha (India), sambo (Russia), shuai jiao (China)\ \n Categories: Grappling\ \n Signature Technique: Joint Lock
martialart.karate.desc=One of the first Asian martial arts introduced to the Western world, karate originates from Okinawa and focuses primarily on striking, with particular emphasis on the fists and other parts of the hand ("karate" translates as "empty hand"). Kicking techniques are relatively common in karate, while grappling and weapon use is more rare. \n Similar Styles: Tang Soo Do (Korea)\ \n Category: Striking\ \n Signature Technique: Tameshiwari
martialart.kenjutsu.desc=A term well-known to both street samurai and anyone within earshot of a Japanese culture enthusiast, kenjutsu is the art of fighting with the Japanese sword. It's strongly associated with the katana, but most kenjutsu styles also include techniques for using the kodachi/wakizashi (short swords) and tanto (dagger), as well as the related art of battojutsu/iaijutsu (the art of drawing the sword and attacking in the same motion). The sport form, kendo, is widely popular in Japan. \n Similar Styles: Geom beop (Korea)\ \n Categories: Weapon\ \n Signature Technique: Iaijutsu
martialart.kickboxing.desc=As one might guess from the name, kickboxing is boxing with the addition of feet, and often elbows, knees, and other body parts, including the head. Much like its hands-only cousin, kickboxing relies almost exclusively on striking, with relatively little in the way of grappling or weapons techniques (though many kickboxing styles have companion arts focusing on the use of weapons). \n Similar Styles: Lethwei (Myanmar), Muay Boran/Muay Thai (Thailand), Muay Lao (Laos), Musti-yuddha (India), Pradal Serey (Cambodia), sanshou (China)\ \n Categories: Grappling, Striking\ \n Signature Technique: Ti Khao
martialart.knight_errant_tactical.desc=These two combat systems, developed by the law-enforcement corps whose names they bear, are essentially Sixth World spins on the CQC combatives of the twentieth century. Practitioners of either style would swear that their approach was completely different than the other guys. At the end of the day, though, both Knight Errant and Lone Star deal with basically the same situations in the course of their duties, and each corp's approach to dealing with those situations is fundamentally similar. The primary difference between the two styles is that Knight Errant places more emphasis on disarming individual attackers (you never know when they might be a SINner who can file a complaint and cause a PR headache), while Lone Star focuses on crowd control. \n Categories: Grappling, Ranged, Striking\ \n Signature Techniques: Releasing Talons
martialart.kung_fu.desc=More properly a group of related martial arts styles, the term "kung fu" usually applies to the "external" or "hard" styles characterized by dynamic, physically strenuous techniques with a heavy emphasis on striking. Popular examples of kung fu styles include the Five Animals style, the Shaolin styles, Wing Chun, and wushu. \n Similar Styles: Silat/pencak silat (Indonesia), silat Melayu (Malaysia), Shorinji kempo (Japan)\ \n Categories: Mobility, Striking\ \n Signature Technique: Drunken Boxing
martialart.kung_fu_18.desc=Historically, many styles of martial arts integrated the study of weapons into the same curriculum as unarmed techniques. In China, the four main martial arts weapons were the spear (qiang), staff (gun), saber (dao), and straight sword (jian), along with more exotic weapons like the halberd, three-section staff, and rope dart. \n Similar Styles: Bojutsu (Japan), kobudo (Okinawa), quarterstaff fighting\ \n Categories: Mobility, Weapon\ \n Signature Technique: Tricking
martialart.kyujutsu.desc=Kyujutsu is a Japanese form of archery using an unusually long bow called a yumi, the largest of which were sometimes taller than their wielders. Originally practiced by the samurai, kyujutsu fell out of mainstream use with the introduction of firearms, but it has regained popularity in the Sixth World for both cultural and practical reasons. \n Similar Styles: Turkish archery (Turkey)\ \n Categories: Ranged\ \n Signature Technique: Pin
martialart.lone_star_tactical.desc=These two combat systems, developed by the law-enforcement corps whose names they bear, are essentially Sixth World spins on the CQC combatives of the twentieth century. Practitioners of either style would swear that their approach was completely different than the other guys. At the end of the day, though, both Knight Errant and Lone Star deal with basically the same situations in the course of their duties, and each corp's approach to dealing with those situations is fundamentally similar. The primary difference between the two styles is that Knight Errant places more emphasis on disarming individual attackers (you never know when they might be a SINner who can file a complaint and cause a PR headache), while Lone Star focuses on crowd control. \n Categories: Grappling, Ranged, Striking\ \n Signature Techniques: Multiple Opponent Combat
martialart.ninjutsu.desc=Though widely known in popular culture as assassins, ninja were historically infiltrators and spies. In contrast to the samurai (and much like shadowrunners), ninjas were willing to employ any number of "dishonorable" techniques to win battles and achieve their objectives. Stealth and quickly disabling opponents were key tenets of ninjutsu (sometimes known as taijutsu). Ninja combat arts also included many weapons techniques, most notably the use of the shuriken. \n Categories: Mobility, Striking\ \n Signature Technique: Dim Mak
martialart.okichitaw.desc=Originating with the Plains Cree of North America, Okichitaw is one of the few indigenous North American fighting styles to have survived into the Sixth World. The style is highly aggressive and focuses neutralizing opponents with rapid takedowns. The primary weapon used in Okichitaw is the gunstock war club, though the style also incorporates the tomahawk and dagger. \n Categories: Grappling, Ranged\ \n Signature Technique: Close-Quarter Firearms (Longarms)
martialart.oni_ryu_taijutsu.desc=The Oni Do Kai is a group of Yakuza "ninja" (freelance operatives) composed almost entirely of orks and trolls. Early on, Oni Do Kai members recognized that their imposing size and strength would put them at a disadvantage in the same country that produced judo and jujutsu, and they began modifying their style of ninjutsu to turn those weaknesses into strengths, and thus, Oniryu taijutsu was born. Nobody's quite sure why the Oni Do Kai decided to share their techniques with outsiders, but that hasn't stopped orks and trolls around Japan (and in other countries with large Japanese communities) from signing up for classes in droves. After the Oni Do Kai went semi-public, other tusker-focused martial arts groups with their own styles (under names like Trog Kwan Do and Tuskrima, among others) followed suit, and the community is growing rapidly. \n Categories: Grappling, Mobility, Striking\ \n Signature Technique: Oaken Stance
martialart.parkour.desc=Not strictly a martial art, parkour was developed as a form of quick and effective movement through dense urban environments. Many of the techniques used in parkour can be adapted to martial arts practice, whether to gain a tactical advantage over an opponent or just run the hell away from a fight you shouldn't have picked. \n Categories: Mobility\ \n Signature Technique: Rolling Clouds
martialart.sangre_y_acero.desc=After the invention of functional cybernetic limbs in the 2030s, it was only a matter of time before someone designed cyberlimbs that were optimized for combat. Originating in the gladiator pits of Tenochtitlán, Sangre y Acero (also known as Etzilitzli and Ars Cybernetica) makes the best possible use of the advantages granted by cyberlimbs, especially against other melee weapons. \n Categories: Striking, Weapon\ \n Signature Technique: Iron Limbs
martialart.tae_kwon_do.desc=Like its Japanese counterpart, karate, tae kwon do was synthesized from indigenous Korean fighting styles and external styles of kung fu imported from China. Tae kwon do is famous for its flashy high and spinning kicks, often complimented with rapid hand strikes, and continues to be one of the most popular combat sports in Korea. \n Similar Styles: Savate (France)\ \n Categories: Striking\ \n Signature Technique: Flying Kick
martialart.the_cowboy_way.desc=Popularized by flatvids set in the American West, the art now referred to as the Cowboy Way, using the lasso to entangle enemies at range, arguably has its origins with the Huns and other nomadic cultures of central Asia. The additions of fisticuffs, gun-twirling, and ten-gallon hats are almost certainly American innovations. Given the similarities of the weapons, many of the techniques used in the Cowboy Way can also be applied to. \nSimilar Styles: Latigo y daga (Philippines), nawajutsu (Japan), whip fighting\ \n Category: Weapon\ \n Signature Technique: Entanglement
martialart.wildcat.desc=When the Sioux Wildcats finally lifted their ban on cybernetics in unit members in 2080, it was anyone's guess whether their in-house martial art would flourish or suffer because of it. The jury's still out, but the style, a blend of Okichitaw, aikido, karate, and Muay Thai that focuses on disabling opponents as quickly as possible, is as effective as ever, particularly against non-augmented opponents (like the Wildcats' arch-rivals, the Tír Ghosts). \n Categories: Grappling, Ranged, Striking\ \n Signature Techniques: Releasing Talons
martialart.wrestling.desc=Although "wrestling" is an extremely broad category (in much the same way as "kung fu"), in a general sense, wrestling consists of grabbing a part of your opponent's body (or an item of clothing), then bending it into a pretzel or pinning them to the ground until they beg you to stop. In some cases, like in Japanese sumo, it's possible to win matches by pushing the opponent out of the ring. \n Category: Grappling\ \n Signature Technique: Sacrifice Throw

