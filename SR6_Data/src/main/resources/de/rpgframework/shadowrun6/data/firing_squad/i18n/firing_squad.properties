item.ares_charybdis.desc=Designed to be the counterpart to the Ares Scylla, the Charybdis provides another non-lethal weapon. It's essentially a massive water cannon, designed to be mounted on anti-riot vehicles, like a converted Ares Roadmaster. It sprays water using the Spray Attack rules (p. 117, SR6), and applies the Wet status to everything that the attack touches (ties go to the attacker rather than the defender). This gun is intended to be mounted, and users need to have a Strength of 6 or higher to carry it. Otherwise, it must be fired from a mounted position. \nThe Charybdis must draw water from a source, either provided in the vehicle or via an external source (such as a fire hydrant). The Charybdis cannot move more than 5 meters from the water supply. So long as the water supply is available, the Charybdis has unlimited ammunition.
item.ares_scylla.desc=What would happen if you took a Tesla coil and attached it to the end of a barrel? Not much, normally. Tesla coils can't really hurt anyone, and directing the charge would be almost impossible. However, the engineers at Ares have figured out how to amplify the electrical effects and direct it into a small "stream" of lightning, delivering Electric damage (p. 109, SR6) using the Spray Attacks rules (p. 117, SR6). This gun is intended to be mounted, and users need to have a Strength of 6 or higher to carry it. Otherwise, it must be fired from a mounted position. \nThe Scylla must be attached to a power source. The Scylla must draw power from a source, either provided by the vehicle or an external source (such as an industrial-grade electrical outlet). The weapon cannot move more than 5 meters from the power source. When attached to a vehicle, it draws electricity at a rapid rate, interrupting all other vehicle systems (meaning the vehicle must be stationary for the weapon to function). So long as the power supply is available, the Scylla has an unlimited ammunition capacity.
item.crackshot_arms_regulator.desc=The only way to survive in the modern firearms industry is to either A) have a popular enough brand or product that everyone will follow/buy regardless of things like reliability or quality (corporate backing doesn't hurt either) or B) provide something new or innovative. Crackshot Arms has put another entry into the gun race with something from option B, albeit barely. Their Regulator gauntlets aren't actually a firearm but rather, as the advertising says, a "forearm mounting and deployment system." Yeah, you read that right. The basic Regulator gauntlet uses a series of magnets and fasteners that can be reconfigured to hold (almost) any kind of firearm. Actual operation is achieved only through the weapon's smartgun/smartlink remote firing system option; standard operation is not possible when mounted. The gauntlets themselves provide a stable firing platform and are able to assist with dissipating recoil. On most gauntlets, there's also space for one additional clip/magazine for quicker reload. Size is the primary factor in determining what class of weapon the Regulator can mount. For averagesized metahumans (dwarfs, elves, humans, orks) the Regulator can mount a firearm up to heavy pistol or machine pistol size. For troll-sized users, it can mount up to a standard assault rifle size. \nNote: Includes internal smartgun system; it can only be fired with a smartlink.
item.horizon_flynn_dcom_holdout.desc=Not every job or operation requires a massive show of force; sometimes the job requires a high degree of stealth, subterfuge, and ability to blend in. Or sometimes, you just don't want anyone to know you have a weapon. For those times, you may not even have the option of carrying anything that even looks like a weapon. This is where the Defense-Com line of commlink weapons comes in. Developed with assistance from renowned blade-master Dante Flynn, the Defense-Com (or D-Com) line has evolved significantly since its debut only three years ago. Horizon recently expanded the line with a new light pistol version to complement the original hold-out pistol, taser, and blade models. They've also released a garrote version, but that particular model isn't publicly advertised. While the first D-Com production run featured inert, non-functioning links, it was discovered that these devices still attracted too much attention. Newer models now hold functioning commlinks, but they are barebones models at best. Don't rely on them doing much more than turning on and looking just good enough to fool inspectors. As for their main purpose, the holdout pistol is as adequate as a hold-out can be (but now comes with more ammo). Concealability threshold is 3, but it is 6 to recognize the item as something other than a commlink.
item.horizon_flynn_dcom_light_pistol.desc=Not every job or operation requires a massive show of force; sometimes the job requires a high degree of stealth, subterfuge, and ability to blend in. Or sometimes, you just don't want anyone to know you have a weapon. For those times, you may not even have the option of carrying anything that even looks like a weapon. This is where the Defense-Com line of commlink weapons comes in. Developed with assistance from renowned blade-master Dante Flynn, the Defense-Com (or D-Com) line has evolved significantly since its debut only three years ago. Horizon recently expanded the line with a new light pistol version to complement the original hold-out pistol, taser, and blade models. They've also released a garrote version, but that particular model isn't publicly advertised. While the first D-Com production run featured inert, non-functioning links, it was discovered that these devices still attracted too much attention. Newer models now hold functioning commlinks, but they are barebones models at best. Don't rely on them doing much more than turning on and looking just good enough to fool inspectors. As for their main purpose, the new light pistol packs a bit more damage and versatility if not ammo capacity. Concealability threshold is 3, but it is 6 to recognize the item as something other than a commlink.
item.horizon_flynn_dcom_taser.desc=Not every job or operation requires a massive show of force; sometimes the job requires a high degree of stealth, subterfuge, and ability to blend in. Or sometimes, you just don't want anyone to know you have a weapon. For those times, you may not even have the option of carrying anything that even looks like a weapon. This is where the Defense-Com line of commlink weapons comes in. Developed with assistance from renowned blade-master Dante Flynn, the Defense-Com (or D-Com) line has evolved significantly since its debut only three years ago. Horizon recently expanded the line with a new light pistol version to complement the original hold-out pistol, taser, and blade models. They've also released a garrote version, but that particular model isn't publicly advertised. While the first D-Com production run featured inert, non-functioning links, it was discovered that these devices still attracted too much attention. Newer models now hold functioning commlinks, but they are barebones models at best. Don't rely on them doing much more than turning on and looking just good enough to fool inspectors. The taser/stun gun is adequate but a little underpowered; Horizon still hasn't quite figured out how to incorporate a better battery. Concealability threshold is 3, but it is 6 to recognize the item as something other than a commlink. Max taser range 20 meters.
item.horizon_flynn_dcom_knife.desc=Not every job or operation requires a massive show of force; sometimes the job requires a high degree of stealth, subterfuge, and ability to blend in. Or sometimes, you just don't want anyone to know you have a weapon. For those times, you may not even have the option of carrying anything that even looks like a weapon. This is where the Defense-Com line of commlink weapons comes in. Developed with assistance from renowned blade-master Dante Flynn, the Defense-Com (or D-Com) line has evolved significantly since its debut only three years ago. Horizon recently expanded the line with a new light pistol version to complement the original hold-out pistol, taser, and blade models. They've also released a garrote version, but that particular model isn't publicly advertised. While the first D-Com production run featured inert, non-functioning links, it was discovered that these devices still attracted too much attention. Newer models now hold functioning commlinks, but they are barebones models at best. Don't rely on them doing much more than turning on and looking just good enough to fool inspectors. The knife is solid, with a ceramic, nano-sharpened blade and a locking device that holds up even after extreme use. Concealability threshold is 3, but it is 6 to recognize the item as something other than a commlink.
item.horizon_flynn_dcom_garotte.desc=Not every job or operation requires a massive show of force; sometimes the job requires a high degree of stealth, subterfuge, and ability to blend in. Or sometimes, you just don't want anyone to know you have a weapon. For those times, you may not even have the option of carrying anything that even looks like a weapon. This is where the Defense-Com line of commlink weapons comes in. Developed with assistance from renowned blade-master Dante Flynn, the Defense-Com (or D-Com) line has evolved significantly since its debut only three years ago. Horizon recently expanded the line with a new light pistol version to complement the original hold-out pistol, taser, and blade models. They've also released a garrote version, but that particular model isn't publicly advertised. While the first D-Com production run featured inert, non-functioning links, it was discovered that these devices still attracted too much attention. Newer models now hold functioning commlinks, but they are barebones models at best. Don't rely on them doing much more than turning on and looking just good enough to fool inspectors. The new garrote can be a bit tricky to use at first, but with practice gets the grisly job done. \nNote: Use the wild die on garrote attacks. Concealability threshold is 3, but it is 6 to recognize the item as something other than a commlink.
item.narcojet_hornet.desc=In the mid-2040s and throughout the 2050s, the Narcoject brands of defensive tools (I can't exactly call them weapons) were modest sellers with a dedicated customer base. By the 2060s, the defensive tools started to fall out of popularity and eventually disappeared from the market, save for a few bits of surplus here and there. The toxin/ drug itself remained popular as a less-than-lethal alternative or when a target required capture and not elimination. Then, in the late 2070s, Narcoject (the company) found itself with a new CEO who quickly became a media darling and began pushing her brand like never before. \nThe result was a relaunch of the Narcoject defensive tool line, starting with the Narcoject One. In early 2080, based on field reports and R&amp;D, Narcoject began producing the new Hornet. Whereas the Narcoject One could only be used in extremely close ranges, the Hornet is able to reach ranges comparable to most light pistols. This is accomplished twofold: from a new enhanced gas-propulsion system, and updated darts that are specifically, aerodynamically designed to maximize the output from the new propulsion system. This also has the benefit of having their penetration power increased by forty percent over the Narcoject One, making them extremely accurate.  \nShaped like a flat pistol, the Hornet can carry eight darts in an internal magazine on the left side and one in the firing chamber. The chamber can be accessed by pulling the "slide" back, just like most semi-auto firearms. The miniature gas propellant tanks are concealed in the covered housing just under the barrel. Up to three additional darts can also be stored in the grip for emergencies. The two propellant tanks can fire up to ten shots each before having to be refilled or replaced. The Hornet can be equipped with an external smartgun system, laser sight, and all standard firearm mods, though none of these is included. But while the Hornet is an improvement over the Narcoject One, early evaluations say that the Hornet is somewhat on the fragile side and is prone to damage if dropped.
item.ammo_hornet_gas.desc=The two propellant tanks can fire up to ten shots each before having to be refilled or replaced.
item.shiawase_blazer.desc=A classic, simple design for a flamethrower, combined with portable and easy-to-replace tanks, makes the Blazer a favorite for shadowrunners, deforesters, and military forces around the world. The newest design of the Blazer allows for the tanks to be swapped out even when being used. The Blazer is small enough that it can be mounted with a standard weapon mount. When swapping tanks on the fly, the tank must be replaced within one Combat Round to make the switch seamless. Each tank can be used to make up to five Combat Rounds worth of attacks. Successful attacks from the Shiawase Blazer are treated as Fire damage (p. 110, SR6). \nGamemaster note: The damage and duration of the Burning status should be adjusted appropriately to the situation, but the recommended baseline is 4.
item.ammo_blazer.desc=Tank for the Shiawase Blazer flame thrower. Each tank can be used to make up to five Combat Rounds worth of attacks.
item.sungard_jewelry.desc=Produced by Aztechnology's Dassault subsidiary, the Sungard Jewelry line comes in a wide variety of styles and shapes. The materials used are electrically capacitive, which allows a small pulse of electricity to be applied to generate light within the gem. \nSungard Jewelry can be used in three ways: At the lowest setting, Sungard accessories can provide low-level light to the area immediately in front of the wearer and uses 1 charge per hour. The technology subtly enhances the attractiveness of the jewels. This gives the wearer a point of Edge in Social Tests where the jewelry may be noticed and impressive. \nAt the medium setting, the Sungard accessories provides full light to the area immediately in front of the wearer and uses 1 charge per half hour. The use of this level of illumination also makes the wearer easier to spot, and gamemasters should apply Edge, dice penalties, and dice bonuses as appropriate. \nAt the highest setting, the Sungard accessories strobe extremely bright light through the gems, turning the wearer into a walking flash-pak at the cost of 1 charge per Combat Round. Treat the effect as if a flash-pak were operating, with the wearer as the center of the effect. The wearer is immune to the flash-pak effects. \nThe jewelry has 10 charges; it recovers 1 charge per hour in sunlight, or 1 charge per minute when connected to a power source.

