item.colt_secret_agent.desc=The Colt Agent Special has long been one of their standbys, so the company decided to enter the hold-out market to see if their name would give a punch to a frequently punchless market. The Secret Agent doesn't pack a serious punch, it's still a hold-out, after all, but its flatness makes it one of the most concealable guns on the market. On top of that, its non-metal construction keeps it from being picked up by scanners that catch other guns. All that, and you don't sacrifice a ton of accuracy. \nNote: The base Concealability threshold for this weapon is 6; metal scanners do not detect it.
item.colt_agent_special.desc=Based on a frame that's over a century old, the Colt Agent Special (often mistakenly called the Special Agent) is a firearm that isn't quite sure what it wants to be. It fires heavy pistol rounds, but because of its small barrel size has the range profile of a light pistol. Yet, it's almost small enough to be a hold-out pistol, which means it is easily concealed. Still, no matter what the weapon is, the Agent Special makes an excellent choice as a backup or secondary weapon because of its accuracy and raw hitting power in such a small platform. \nThe Agent Special's only drawbacks are the limited ammo capacity and the inability to accept any internal modifications such as a smartgun system or mount any accessory rails. The only modification the Agent Special can accept is a proprietary laser sight made by Colt that can be mounted in the top of the grip just under the slide rail.
item.colt_agent_special_laser_sight.desc=Proprietary laser sight for the Colt Agent Special.
item.hk_p50.desc=All the features of the P50 with a bigger kick to the head. A similar frame shape and interchangeable grips make the pair a perfect combo for sprawls with rules on how big your bang bang can be. The 50 and 60 can have custom grips swapped for a similar grip feel, though the trigger position and mass will be a tad different due to the bulkier bullets. \nNote: Includes Easy Breakdown, smartlink, laser sight.
item.cavalier_marshal.desc=Building on their reputation as the preeminent revolver manufacturer (according to their PR), Cavalier Arms recently introduced the Marshal, their first "variable loadout" heavy revolver in direct competition with the Ares Predator VI, which features a similar ammunition selection system. Comprising a powered cylinder, an under-barrel boxy ammunition reservoir/collection system for spent brass, and ammunition transfer system, the Marshal can reload without opening the cylinder by accessing the weapon's internal smartgun system. However, the weapon can only hold twelve rounds total; six in the cylinder and six in the reservoir along the weapon's left side. And while the transfer system has proven to be more reliable than the Predator VI's, the weight of the extra ammunition along one side of the weapon sometimes causes balance and accuracy issues at longer ranges. \nNote: Includes internal smartgun system.
item.hk_p60.desc=All the features of the P50 with a bigger kick to the head. A similar frame shape and interchangeable grips make the pair a perfect combo for sprawls with rules on how big your bang bang can be. The 50 and 60 can have custom grips swapped for a similar grip feel, though the trigger position and mass will be a tad different due to the bulkier bullets. \nNote: Includes Easy Breakdown, smartlink, laser sight.
item.nemesis_arms_praetorian_ii.desc=Even though Nemesis' marketing calls the Praetorian II a "spectacular upgrade to a timeless classic," this heavy pistol is nothing more than a functional yet unspectacular gun with a slightly above-average knife attached in an attempt to create a weapon that is greater than the sum of its parts, but in truth is pretty much just a gimmick. Even though it's a gimmick weapon, it's a popular one, especially among street-warrior types. As a sidearm, the Praetorian II features an adequate damage profile and smartgun system, but it lacks the ammunition capacity when compared with other weapons in its class. As a melee weapon, the attached blade is serviceable but best utilized as a slashing weapon, which can sometimes be tricky in extreme close melee combat, where thrusting is a better tactic. \nNote: Includes internal smartgun system.
item.praetorian_ii_blade.desc=Blade of the Nemesis Arms Praetorian II.
item.colt_arms_m24.desc=Building on the success of their M-23 rifle and M-23A2 carbine, Colt introduced their M-24 "machine pistol," which is also based on the M-22/AR platform. Slightly larger than a standard machine pistol but smaller than an SMG, the M-24 looks like a stripped-down M-23A2 with the buttstock removed and a shorter barrel. Marketed as a personal defense weapon, the M-24 is meant to be deployed in extremely tight quarters, such as a vehicle. But the higher caliber, short barrel, and lack of any standard recoil compensation make this weapon somewhat difficult to control in burst or full-auto fire. To compensate for this, Colt also offers an after-market "stabilizing arm-brace" for an additional 100 nuyen. \nNote: Arm-brace add-on increases the Near and Medium Attack Ratings by 1.
item.colt_arms_arm-brace.desc=Arm-brace add-on for  the Colt Arms M24.
item.ultimax_71.desc=A little old-fashioned but still effective, the Ultimax 71 is a gun for people who don't think it requires electronics to make lead fly. There's a beautiful simplicity in a handgun designed to fling enough bullets to keep an entire squad nervous about getting closer to you. It's got a laser sight to help with targeting, and the biggest change from the old 70 to the new 71 is the smaller design. It's still a machine pistol, so it's not going to be easy to just tuck under your shirt and hope no one notices, but you might have an easier time putting it under a jacket or in a handbag than you would have with the 70.
item.cavalier_parashield_emergency_responder.desc=Cavalier Arms made a decent impression with the law enforcement/security community in North America when they released their Lancer shotgun/ grenade launcher combo back in '74. So when Parashield, Narcoject's prime competition in the less-than-lethal weapon market came to them with a proposal to develop a new weapons platform that can fire with both lethal and non-lethal force, Cavalier was more than willing to play ball. After years of R&amp;D and testing, the Emergency Responder was born in 2078, answering a question no one was asking. \nA combination SMG and dart gun, the Responder was intended to give officers and/or first responders a primary non-lethal option when dealing with subjects who may not deserve immediate termination. The Responder's SMG component (supplied by Cavalier) is a compact bullpup design that is reliable and fairly accurate. The dart gun component (supplied by Parashield) is fixed underneath the SMG's barrel, just forward of the trigger assembly, and features a ten-dart mini-clip and small gas reservoir good for ten uses. An electronic firing system and integrated smartgun system allow the shooter to switch between the two weapons with only a thought or voice command. An optional manual switch is also available as an aftermarket accessory. \nWhile distributed to several law enforcement and security contractors throughout North America, the Responder never truly caught on. It may have had something to do with several incidents where officers, thinking they had the dart gun engaged, accidentally employed the SMG, with disastrous results. Most of these departments and security companies blamed Cavalier and Parashield for defective equipment contributing to the incidents. In most of these cases, Cavalier and Parashield were cleared of any wrongdoing, but the Emergency Responder gained a negative reputation that persists to this day. \nNote: Includes electronic firing, internal smartgun system.
item.cavalier_parashield_dartgun.desc=Cavalier Arms made a decent impression with the law enforcement/security community in North America when they released their Lancer shotgun/ grenade launcher combo back in '74. So when Parashield, Narcoject's prime competition in the less-than-lethal weapon market came to them with a proposal to develop a new weapons platform that can fire with both lethal and non-lethal force, Cavalier was more than willing to play ball. After years of R&amp;D and testing, the Emergency Responder was born in 2078, answering a question no one was asking. \nA combination SMG and dart gun, the Responder was intended to give officers and/or first responders a primary non-lethal option when dealing with subjects who may not deserve immediate termination. The Responder's SMG component (supplied by Cavalier) is a compact bullpup design that is reliable and fairly accurate. The dart gun component (supplied by Parashield) is fixed underneath the SMG's barrel, just forward of the trigger assembly, and features a ten-dart mini-clip and small gas reservoir good for ten uses. An electronic firing system and integrated smartgun system allow the shooter to switch between the two weapons with only a thought or voice command. An optional manual switch is also available as an aftermarket accessory. \nWhile distributed to several law enforcement and security contractors throughout North America, the Responder never truly caught on. It may have had something to do with several incidents where officers, thinking they had the dart gun engaged, accidentally employed the SMG, with disastrous results. Most of these departments and security companies blamed Cavalier and Parashield for defective equipment contributing to the incidents. In most of these cases, Cavalier and Parashield were cleared of any wrongdoing, but the Emergency Responder gained a negative reputation that persists to this day. \nNote: Includes electronic firing, internal smartgun system.
item.shiawase_arms_tactical_model_71a.desc=Released to the general market in 2079, the Tactical Model 71A is an upgrade of Shiawase's popular Model 71. With a well-earned reputation as a rugged SMG, the original Model 71 was developed as part of a Shiawase product initiative known as "Mobile Warrior" and packs as many features into the weapon's frame as possible. Made of the same lightweight materials, the 71A is designed to be extremely user-friendly (read: usable by less-skilled shooters) and comes with the following standard features: an electronic firing system, Safe Targeting system, internal smartgun system, collapsible stock, and integrated foregrip. While these systems are useful, in the Model 71 they frequently overtaxed the weapon's power supply, sometimes to the point of complete failure. To remedy this, the 71A comes with a larger and reportedly more efficient power system. To make room for this, designers went with a lower-caliber round. Whether these changes have been effective is unknown, as the weapon hasn't been in service long enough to be properly evaluated.
item.colt_ms-27.desc=In recent years, Colt has been criticized of milking the AR-style platform for all it's worth instead of coming up with more innovative designs. In reply, Colt said "if it ain't broke, why fix it?" With the rise of the "assault shotgun" concept, Colt got in on the act late last year by releasing an assault shotgun version of their classic M-23. Called the MS-27, the entire weapon frame was re-tooled to accommodate standard twelve-gauge shotgun shells and then reinforced to handle the additional recoil and stress. The result was a solid overall weapon capable of up to full-auto fire. Those familiar with the M-23/23A2 line can easily transition to the MS-27 with little or no training. In fact, both the M-23 and the MS-27 are approximately the same size and share several of the same parts, which makes field repair and overall logistics simpler. And while the MS-27 doesn't come with any accessories or modifications in order to keep the overall price down, it comes with four accessory rails standard on the top, sides, and under barrel, making it easy to modify and accessorize.
item.defiance_t-285.desc=Sometimes you just need a plain, simple, inyour- face, no-frills, boom-stick; especially if that boom-stick has three barrels. What started out as a joke within the Defiance Corporation quickly became a serious issue for the company. Starting out as a personal project by one of Defiance's gunsmiths and intended as a gag gift for the company's CEO, word of "a secret new project" reached the ears of a corporate spy within Defiance, who quickly attempted to acquire the non-existent specs, only to find crude sketches (on a bar napkin) of a tri-barrel, pistol-griped, breakaway shotgun. Through a series of misadventures and blunders, these images ended up on Matrix and quickly went viral. Seizing the opportunity, Defiance quickly drew up proper specs for copyright purposes and then began limited production, which ran out in short order and forced a second, third, and forth production run. Considered a novelty, albeit a powerful one, the T-285 is nothing more than three sawed-off T-280 shotgun barrels welded together in a pyramid formation. Manual switches behind the barrel-break control the number of shots fired (one, two, or all three), and the choke if applicable. There is no smartlink, no accessories, and no frills of any kind. What one gets from the T-285 is exactly what they should expect: power at the risk of breaking one's wrist. Increase DV by +1 for every additional barrel fired \nNote: Includes break-away loading system; use wild die when firing two or more barrels.
item.franchi_spas-25.desc=The SPAS line of shotguns has been a staple among paramilitary and security forces for the better part of a half-century and isn't showing any signs of slowing down. The current SPAS-25 is a relatively simple and straightforward design that harkens back to the earlier SPAS-22 yet still retains many of the innovative features that made the SPAS-24 popular. Highly adaptable and reliable, the normally semi-automatic SPAS-25 can also operate as a pump-action to quickly clear jams or facilitate emergency tactical reloads. The SPAS-25 also comes standard with a smartgun system and folding stock for ease of storage. In addition, the SPAS-25 also features serrated breaching teeth on the barrel. These teeth assist with barrel seating against a door for breaching actions, helping hold the barrel in place during discharge. \nNote: Includes folding stock, internal smartgun.
item.ranger_arms_aa16_warhammer.desc=Three years ago, Ranger Arms bought the rights to the venerable AA-16 assault shotgun. The consensus at the time was they had just obtained a gold mine of sales. That turned out to be the case. Considered to be the pinnacle of assault shotguns, the AA-16, better known as "The Warhammer," is a heavy-hitting, short-to-medium-range, full-auto-capable weapons platform known for being able to take down even the toughest of adversaries while still having one of the lowest recoil profiles of any weapon currently in service. The Warhammer also comes with an internal smartgun system and foregrip (which does not interfere with under-barrel accessories) as standard. Maintenance is also incredibly easy, as the firing mechanisms and bolt actions are constructed from a chrome/stainless-steel alloy that resists all but the most extreme grime and dirt buildup. \nThe only real problem the Warhammer suffers from, aside from its extremely hefty price tag, is that it's almost too good and popular a design. While Ranger Arms is making money hand over fist producing the Warhammer, their production lines are severely backlogged. This has made the weapon a hot commodity on the streets and black markets. Unless you have a good contact with an inside track, happen to find one in-store (good luck with that), or want to wait for delivery from Ranger Arms, expect at least a fifty to seventy percent markup when you do find one. \nNote: Includes foregrip, internal smartgun system.
item.onotari_arms_rhino_hunter.desc=The Original Rhino Hunter entered the sporting rifle market about ten years ago. Designed specifically for "larger metahumans" (you know who they mean), the Rhino Hunter is very straightforward in its design: Build a rifle around one of the most powerful hunting rounds in the world and then make it large enough to comfortably fit in the hands of the larger metahumans who can typically handle its massive recoil. And then market it! But despite the awkward marketing, the Rhino Hunter became a popular weapon within the troll and ork communities. \nThen two years ago, demand for a more "traditional" sized Rhino Hunter became great enough that Onotari started making two versions: the traditional Alpha, and the smaller Beta. Although all Onotari did was re-size the Alpha's grips and controls, then slap a new name on it. The Rhino Hunter is made of heavily reinforced materials to resist damage from recoil (even though it does next to nothing to mitigate it). The aforementioned ammo is held in an internal magazine that contains seven shots. While this ammo capacity is normally insufficient for most modern battlefields, the purpose of the Rhino Hunter is not technically traditional combat, but to select a target and put it down. \nBoth the Alpha and Beta lack any standard upgrades, but it's expected the owner will customize their rifle to meet their specific needs and preferences.
item.izom_artemis.desc=The Artemis is one of those weapon systems that can be effective in the right hands, but a liability in others. Designed almost exclusively for close-quarters battle, it features shortened barrels for both the carbine and grenade launcher and no buttstock. This has (rightfully) earned the Artemis a reputation of being extremely inaccurate (and dangerous in inexperienced hands), yet the weapon remains popular in certain circles because of the grenade launcher. Instead of a smartgun system, the Artemis comes with a laser sight as standard. \nNote: Includes laser sight.
item.izom_artemis_launcher.desc=Underbarrel grenade launcher of the Izom Artemis.
item.onotari_arms_jp-k51.desc=The history and evolution of the JP-K series of battle rifles is a long and convoluted one. Originally conceived to fight the next round of Euro Wars that never happened, the first runs of the original JP-K49 sat collecting dust in European warehouses for decades before the production lines were re-started with a new model, an upgraded version known as the JP-K50. The 49 and 50 gained popularity during the Dragon Civil War because they proved to be somewhat effective against (some) dracoforms (in mass fire situations) and were used exclusively by forces loyal to Lofwyr. Those who survived the battles were allowed to keep these powerful weapons as partial payment for services rendered. After the Civil War, the JP-K lines slowed to almost a crawl, and those produced were used almost (key word there) exclusively by Saeder- Krupp corporate military or affiliated forces. \nIn 2077, Onotari announced they were producing a new model, the JP-K51, for mass-market release. This new model varied little from the previous two, except that it now included a smartgun system as standard. The JP-K doesn't quite fit securely in any traditional weapon category, but with its range and damage profile, combined with its burstfire capability, it's usually classified as an enhanced battle rifle. Designed with a high degree of engineering and precision machining, and made from the highest quality materials, the JP-K51 is expensive but is also extremely good at what it does: providing long-range precision fire on a platoon or even fire-team level. The only complaints about the weapon so far are that it's extremely bulky and nose-heavy, especially when accessories (such as a bipod) are attached. \nNote: Includes laser sight.
item.onotari_arms_kali_ii.desc=Based on the same "AR"-style weapon that eventually evolved into modern weapons such as Colt's M-22A2, M-23, 23A2, and so on, the Kali II is Onotari Arms' version of that venerable platform. Overall, the Kali II is a rugged, no-frills, hard-hitting carbine based on the original Kali assault rifle. And while it's based on the AR, functionally it has more in common with the also-classic AK line of weapons in terms of durability and damage profile. Like an AK, a Kali II requires minimal maintenance to remain combat-ready and can be easily serviced in the field. The Kali II's hardened design also allows it to be used as an impromptu melee weapon in emergency situations with minimal loss of function. Designed specifically to dominate in short- to mid-range combat, the Kali II is extremely accurate up to standard long ranges before weapon performance drops off. Additionally, the Kali II is melee hardened and features four standard powered weapon rails, one long rail along the top, two on the barrel's sides, and one under-barrel, that make it extremely customizable. \nNote: Includes melee hardening.
item.onotari_arms_war_hound.desc=Conceived to be an effective weapon system at almost all ranges and suitable for multiple combat environments/situations, the War Hound is a bullpup- style assault rifle based on Onotari's successful Room Sweeper line (not to be confused with Remington's Roomsweeper pistol/shotgun). Using the Room Sweeper as a base, designers trimmed a lot of fat to make the War Hound lighter and more compact. And with the same barrel-length as standard assault rifles, the War Hound remains effective at longer ranges despite a shorter overall length. Additionally, the War Hound stands out because it's on average eighty to seventy-five percent smaller and lighter than other weapons in its class. To make it even more effective in close-quarters, an under-barrel six-round shotgun was added for additional punch and for use as a breaching weapon. The Hound also features as standard an electronic firing system, two side rails, and an internal smartgun system that is housed and almost completely contained on the top of the weapon, which allows for ease of repair/replacement in the field. The War Hound isn't an optimized weapon, but it's damn close. \nNote: Includes electronic firing, internal smartgun system.
item.under_shotgun_war_hound.desc=Underbarrel shotgun of the Onotari Arms War Hound.
item.shiawase_arms_tactical_model_73.desc=In the early 2070s, Shiawase Arms partnered with subsidiary Nemesis and initiated a program called "Mobile Warrior." Comprising a series of weapons, armor, and gear, the intent was to create a comprehensive, integrated combat system for the average soldier. The program never panned out because of massive cost overruns and problems with the armor and main communications gear. But the planned main weapons of Mobile Warrior, the Model 71 SMG and Model 73 "Fatal Light" assault rifle, were enough of a success that Shiawase Arms put them into full production. Like the 71, the Tactical Model 73 is packed with several advanced systems and ergonomic features to make it extremely user-friendly, reliable, and accurate in the field. But the 73's designers also made several … curious design choices. First is the proprietary helical magazine that attaches below the buttstock, which has been known to not seat properly in the weapon, causing the powered feed system not to engage. And while the magazine can hold a staggering 100 rounds, these rounds are also basically high-powered, custom SMG rounds specially designed for distance and specific to the Model 73; they cannot be used in other weapons. But despite these apparent shortcomings, the 73 is a popular weapon with security and mercenary forces; it's even rumored to be the top contender to become the new Imperial Japanese Military standard service rifle.
item.ultimax_83.desc=Not every independent contractor, security, or mercenary outfit can afford the latest and greatest in weaponry or gear. This is where weapons like the Ultimax 83 come in. With horrible ballistics and a simple laser sight being its only standard accessory, the Ultimax 83 is the ultimate in bargain- basement weaponry. But despite these drawbacks, the Ultimax 83 has some (shocking) positive attributes. First, it's rugged, melee hardened, and can handle just about any environment it's put into. Second, when it does hit, it hits hard. And third, it's so damn cheap, more affordable than just about any other standard assault rifle, which is great when you need to equip a force quickly and on the cheap. This alone keeps Ultimax in production and in the field. \nNote: Includes laser sight.
item.psg_enforce_ii.desc=Produced by Heckler and Koch (HK), the original Enforcer was the go-to anti-personnel rifle used by law enforcement and security providers worldwide. Approximately seventy-five percent smaller than most weapons in its class, the Enforcer was easy to transport in an (often-cramped) armored response vehicle. And while the Enforcer wasn't the most accurate weapon system at extreme ranges, its uncanny accuracy at mid to long ranges made it exceptionally lethal in an urban setting where range wasn't often that much of an issue. Many "threats" have been neutralized by a sharpshooter employing an Enforcer; some of them even lived. But the Enforcer's most distinguishing feature is the patented dual-ammunition feed system linked to the weapon's smartgun system. This allowed the operator to employ different ammo types in order to customize their response to whatever situation/threat they're facing. Most often this was having one magazine loaded with lethal rounds, the other with less-lethal ones. This ability was only further enhanced with the recent introduction of ammo selection technology. To take full advantage, HK began production on the Enforcer II, with the first production runs being sent to law-enforcement providers across Europe, the Middle East, and certain regions of North America. In most respects, the Enforcer and Enforcer II are still the same weapon. The Enforcer II is a bit bulkier in order to house the ammo selection/feed system, which can now employ more than two different ammunition types. The Enforcer's two clips are housed side by side in an expanded well just forward of the trigger guard. The operator can use the weapon's smartgun system to select and load the desired ammunition type in order to engage their threat. In addition to the ammo-selection and smartgun systems coming standard, the Enforcer II also comes with a detachable targeting scope. Because of various contracts, the Enforcer and Enforcer II are technically not available for sale to anyone not affiliated with a law enforcement or security provider. \nNote: Includes internal smartgun system
item.ranger_arms_m1400.desc=In 2077, as part of their acquisition spree, Ranger Arms secured the rights and designs to the Springfield M-1A, a century-plus-old sporting rifle (that was based off an old twentieth century military rifle) still being produced as a knock-off by multiple disreputable firearm companies spread across the Pacific Rim. At first, this move puzzled those in the firearms industry who wondered what could be gained by such an acquisition. In early 2080, Ranger Arms answered this question by revealing the M-1400 "Springfield" enhanced battle rifle. Based on both the M-1A and the older M-14 but made of modern materials, the M-1400 is a simple, reliable, and most importantly accurate weapon designed to provide EBR performance to individual shooters or units operating on a more conservative budget. Other than a precision barrel forged to mil-spec standards for enhanced ballistics, the rest of the M-1400 is made of reliable yet cost-effective materials. This also makes the M-1400 easy to repair and service.
item.shiawase_arms_tactical_model_69.desc=Designed alongside other weapons of the "Mobile Warrior" program, the Model 69 is a hard-hitting anti-materiel rifle that's also designed to operate in the sniper role, providing long-range precision fire to platoons or fire teams. Made of the same lightweight materials as the Model 71 and 73, the 69 was specifically designed for field use. Original models featured an integral weapons commlink, but as of 2076 these were removed from all current and future production models because of crippling glitches caused by harsh environments. To compensate, the commlinks were replaced with state-of-the-art smartgun targeting systems. Since then, field reports from users have been mostly positive about the weapon's performance, especially with regard to its accuracy and high damage profile, which can be summed up in two words: "Holy frag!" But the one issue Model 69 users constantly cite is the weapon's long barrel, which sometimes can be a hindrance in certain tactical environments such as urban and jungle battlefields. \nNote: Includes internal smartgun system.
item.crackshot_arms_roaring_thunder.desc=When it comes to firearms design, sometimes it takes years of R&amp;D and substantial amounts of nuyen to test and finely tune a new weapon system for final production, to find any obvious (and potentially catastrophic) flaws while trying to enhance the platform's positive features. The time it takes to accomplish this can be lengthy and costly as the final product comes into being. And then there are people who just slap drek together to see what it does, or because they're fragging desperate. Both of these succinctly describe Crackshot Arms, a new weapons company (term used loosely) based out of Motor City. During the unpleasantness before Ares moved out, Crackshot's owners/lead designers assembled a true firearms monstrosity that's basically a tri-barrel rotary shotgun/LMG. Created to deal with the local hostilities, the prototype Roaring Thunder was cobbled together as desperation measure to help defend a civilian aid station. \nEven though its firepower and ability to spray ungodly amounts of buckshot or slugs downrange is impressive, the prototype was notoriously inaccurate, somewhat unreliable with the shot spread, and prone to breakdown. But, when it managed to hit, it usually obliterated the target. After hostilities were over, word of mouth about the Roaring Thunder spread, and locals wanted one of their own. After (somewhat) refining the weapon, they began selling it on the local shadow markets. The weapon itself is on the heavier end of the LMG spectrum, and at just over 1.25 meters long, it looks like a crude metal box with a tri-barrel assembly at the front end, a belt-feed mechanism in the middle, a handle/trigger assembly on the top, and an armbrace to help the shooter with recoil. It should also be noted that the Roaring Thunder has next to no recoil compensation. Its high rate of fire makes it difficult to employ without some kind of gyro-stabilization, fixed position mount such as a tripod, or a high level of raw strength. The Roaring Thunder is a bare-bones weapon, but it can accept all standard modifications and applicable accessories.
item.ingram_white_knight.desc=Like other Ingram MGs, the White Knight LMG has been a popular staple among military, paramilitary, and security forces for decades. With constant upgrades, it shows no signs of slowing down anytime soon. Reliable and hard-hitting, the White Knight was also popular because it was considered deployable right out of the box, meaning all one had to do before going into combat was simply load it. Part of this was because of the standard features already built into the weapon: smartgun system, a high-rated recoil compensation system, and a detachable folding stock for storage and transport. Additionally, the latest versions of the White Knight feature a SOTA ammunition feed system that allows for precise targeting. But these features come at a cost. The White Knight is so precisely designed and engineered that it cannot accept any other internal modifications and has limited external space for mounting accessories. But because of its performance specs, many consider this a fair trade-off. However, three years ago Ingram announced the new "Knight" line of MGs. The first in this new line is the White Knight Mod 2. Almost exactly the same as its predecessor, the Mod 2 features a new detachable, interchangeable barrel system (with handle) that allows the White Knight to mount a shorter barrel, allowing it to be used more effectively in close quarters and in vehicles. While the shorter barrel changes the weapon's range profile, it can easily be switched to the longer one for longer-range engagements. Otherwise, besides the barrel, all components of the original White Knight (known as Mod 1 to differentiate) and Mod 2 are completely interchangeable. \nAttack Ratings are for when short barrel is attached; use Mod 1 Attack Ratings for the long barrel. \nNote: Changing the barrel in the Mod 2 is a Major action. Both weapons include detachable folding stock, internal smartgun.
item.ingram_white_knight.variant.model1.desc=Like other Ingram MGs, the White Knight LMG has been a popular staple among military, paramilitary, and security forces for decades. With constant upgrades, it shows no signs of slowing down anytime soon. Reliable and hard-hitting, the White Knight was also popular because it was considered deployable right out of the box, meaning all one had to do before going into combat was simply load it. Part of this was because of the standard features already built into the weapon: smartgun system, a high-rated recoil compensation system, and a detachable folding stock for storage and transport. Additionally, the latest versions of the White Knight feature a SOTA ammunition feed system that allows for precise targeting. But these features come at a cost. The White Knight is so precisely designed and engineered that it cannot accept any other internal modifications and has limited external space for mounting accessories. But because of its performance specs, many consider this a fair trade-off. However, three years ago Ingram announced the new "Knight" line of MGs. The first in this new line is the White Knight Mod 2. Almost exactly the same as its predecessor, the Mod 2 features a new detachable, interchangeable barrel system (with handle) that allows the White Knight to mount a shorter barrel, allowing it to be used more effectively in close quarters and in vehicles. While the shorter barrel changes the weapon's range profile, it can easily be switched to the longer one for longer-range engagements. Otherwise, besides the barrel, all components of the original White Knight (known as Mod 1 to differentiate) and Mod 2 are completely interchangeable. \nAttack Ratings are for when short barrel is attached; use Mod 1 Attack Ratings for the long barrel. \nNote: Changing the barrel in the Mod 2 is a Major action. Both weapons include detachable folding stock, internal smartgun.
item.ingram_white_knight.variant.model2.desc=Like other Ingram MGs, the White Knight LMG has been a popular staple among military, paramilitary, and security forces for decades. With constant upgrades, it shows no signs of slowing down anytime soon. Reliable and hard-hitting, the White Knight was also popular because it was considered deployable right out of the box, meaning all one had to do before going into combat was simply load it. Part of this was because of the standard features already built into the weapon: smartgun system, a high-rated recoil compensation system, and a detachable folding stock for storage and transport. Additionally, the latest versions of the White Knight feature a SOTA ammunition feed system that allows for precise targeting. But these features come at a cost. The White Knight is so precisely designed and engineered that it cannot accept any other internal modifications and has limited external space for mounting accessories. But because of its performance specs, many consider this a fair trade-off. However, three years ago Ingram announced the new "Knight" line of MGs. The first in this new line is the White Knight Mod 2. Almost exactly the same as its predecessor, the Mod 2 features a new detachable, interchangeable barrel system (with handle) that allows the White Knight to mount a shorter barrel, allowing it to be used more effectively in close quarters and in vehicles. While the shorter barrel changes the weapon's range profile, it can easily be switched to the longer one for longer-range engagements. Otherwise, besides the barrel, all components of the original White Knight (known as Mod 1 to differentiate) and Mod 2 are completely interchangeable. \nAttack Ratings are for when short barrel is attached; use Mod 1 Attack Ratings for the long barrel. \nNote: Changing the barrel in the Mod 2 is a Major action. Both weapons include detachable folding stock, internal smartgun.
item.shiawase_arms_nemesis_ii.desc=Named after the Greek goddess of divine justice and vengeance, the original Nemesis was designed to be a user-friendly, person-portable infantry squad support weapon. Built around a high-rated safe-targeting system, the idea was to help prevent friendly- fire incidents among lower-tier or less-experienced troops while still providing a solid weapon for higher- tier experienced ones. On many counts, the Nemesis was a success. Among the units it was designed for, reports indicated that friendly-fire incidents did in fact decline among those who used it. Although those same reports indicated that the safe-system was somewhat prone to hacking and that the ammo-feed system was extremely susceptible to foreign objects and debris. The new Nemesis II for the most part has corrected these problems but is now made of stronger, lighter-weight materials similar to those used in the proposed "Mobile Warrior" line of weapons. The result is a weapon system that is twenty-five percent lighter than its predecessor. While still a decent weapon system, these lightweight materials don't handle recoil like the previous model, making the Nemesis II slightly less accurate in combat. \nNote: Includes safe firing IFF system and smartgun system.
item.ares_m22a1.desc=Leave it to Ares to take an already powerful weapon system and make it bigger in all respects just because they can. In the case of the M-22A1, that's exactly what they did and then some. Based on the old Browning M-2 heavy machine gun that was often used as the primary weapon on light to medium vehicles, the M-22 concept was originally developed by Browning as a modern update of the classic weapon system. But through a series of legal maneuvers and back-door deals, Ares Arms managed to steal secure all rights to the M-22 platform. \nNow known as the M-22A1, the (ultra) heavy machine gun was initially produced exclusively for use by Ares' Firewatch Special Forces units. The "Mad Mamma," as it became known, saw extensive use during recent action in Detroit and quickly gained a reputation as a "bug killer." After that little conflict, Ares Arms announced that the Mad Mamma would become available for limited sale to "preferred and qualified customers" by second-quarter 2081. However, a number of M-22A1s have been reported to already be available via gunrunners and black marketeers in North America and North Africa. \nLike its predecessor, the M-22A1 is not meant to be a person-portable weapon system, even as a crew-supported weapon. Its large size, weight, heavy caliber, and massive recoil can typically be handled only when the weapon is (securely) mounted to a vehicle or heavy combat drone or planted into the ground via tripod. There's a reason it's technically classified as an "ultra" heavy machine gun.
item.ingram_grey_knight.desc=The second in Ingram's "Knight" line of MGs, the Grey Knight is a basic medium machine gun. Essentially a beefier, higher-caliber, belt-fed version of Ingram's White Knight LMG, the Grey Knight was designed as a middle-ground weapon, typically for use as a crew-serviced weapon platform, or as a mounted weapon on a vehicle or drone. However, the Grey Knight has been employed solo by those of a more robust stature or with significant strength augmentations. Like the White Knight, the Grey Knight comes standard with the same recoil and ammo-feed system as well as a smartgun system. But the folding stock has been replaced with a detachable rigid stock that also holds a small weapon repair kit. And like the White Knight, the Grey Knight does not accept any additional modifications. \nNote: Includes detachable stock, internal smartgun system, weapon repair kit.
item.ingram_black_knight.desc=The last, and heaviest, of Ingram's Knight MG line, the Black Knight is a beast even by heavy machine gun standards. Looking superficially like its sister MGs, the White and Grey Knights, the Black Knight is almost fifty percent bigger and comes in at just shy of 1.6 meters in overall length. Using heavy .50 caliber rounds, the Black Knight has a slightly slower rate of fire than most HMGs, but it makes up for this with an accuracy not found in most weapons of its class. Instead of having a standard recoil compensation system, the Black Knight features an advanced attenuated-barrel and hybrid gas-recoil system that keeps overall recoil to a minimum, allowing for optimum target acquisition, especially at long ranges. Weighing in at approximately thirty kilos, the Black Knight is often used as either a fixed weapon or mounted on a vehicle or drone. It should also be noted that despite its performance profile, the Black Knight can be extremely finicky and requires constant maintenance to ensure that all of its systems remain fully functional. The Black Knight also comes with smartgun and safe firing systems standard. \nNote: Includes gas-vent system, safe firing IFF system, and smartgun system.
item.ares_arms_vigorous.desc=Designed to be a direct competitor to the legendary Panther Assault Cannon, the Vigorous was plagued by poor word of mouth soon after its release. Subsequently, sales of the Vigorous tanked and production eventually slowed to a trickle, with barely a dozen being produced a month. In fact, Ares only continued production in order to satisfy various contracts with parts suppliers and had plans to scrap the line as soon as those contracts were met. But while the Vigorous was being slammed on the Matrix, social media, and any weapon outlet, those who actually purchased the weapon (at a massive discount) actually found it to be a solid performer in all aspects. Eventually word of mouth started to change, and the Vigorous' reputation slowly began to shift. But entrenched opinions die hard, and the Vigorous still suffers from poor reception despite having proved itself multiple times in the field. Designed to be a bare-bones basic assault cannon, the Vigorous didn't have any fancy targeting or recoil compensation systems common to other cannons at the time. Instead, the Vigorous was purposely built to be customized to its user's specific preferences. As such, it's extremely easy to modify and service in the field. Performance-wise, the Vigorous is on par with other assault cannons in terms of damage profile. But it suffers from some ballistic drop-off at longer ranges, which is one of the most common (and petty) criticisms levied against the weapon. The Vigorous doesn't come with many standard features, but it has a rigid stock/shock pad and a bipod. If one can look past the bad press, the Vigorous is a reliable assault cannon for a discount price, but the low cost may not last much longer. \nNote: Incudes bipod, rigid stock, shock pad.
item.krime_thumper.desc=Ever wanted to spray grenades at your foes with reckless abandon? Ever wanted to get the benefits of an airburst system without the cost? Ever wanted to throw massive pieces of shrapnel at someone? Look no further! Krime Has You Kovered™. \nThe Krime Thumper is a triple- barreled grenade launcher capable of firing any variant of grenade, much like other grenade launchers. The Thumper has a unique fire mode, allowing all three barrels to fire at once. The grenades will land in an overlapping configuration, which increases the overall area of effect. Additionally, targets that are caught in the overlapping area get the effect of multiple grenades, each treated as a separate attack. \nAs if this wasn't enough, Krime executives have recently heard rumors of street runners using the grenade launcher as a makeshift shotgun. They have loaded it up with Krime Kaltrops (each sold separately) and fired the balls of slivered metal at targets to devastating effect. The Thumper is incapable of accepting ammunition that is not a grenade or explosive.

