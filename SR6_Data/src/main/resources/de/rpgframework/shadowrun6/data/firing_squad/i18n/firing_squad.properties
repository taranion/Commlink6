item.iron_bear_combat_axe.desc=Wallacher better watch their hoops. The Iron Bear is a lightweight titanium double-bladed axe with a meter of razor-sharp edge divided between the twin heads. It lacks the spike but makes up for it with a thick-handled base that can be used for less-than-lethal takedowns, unless you're a troll with swing control issues.
item.iron_fang_combat_knife.desc=How do you make a combat knife special? Use smart materials for a blade that can vary its shape to suit the needs of the current situation! Serrated, variable saw tooth, straight edge, blunt tip … you name it, the Iron Fang can fit the bill.
item.steel_claw_combat_broadsword.desc=I'm thinking this design is going to be taking over from the classic katana as the blade of choice for street swordmasters. Everyone with a trid sees the sword fights with all those blocks and sword clashes, but anyone trained in the blade knows you don't dull your edge like that, unless you have the Steel Claw. Another smart-material masterpiece, the blade knows when it's on the offensive and when it's blocking based on your pre-programmed fighting style, providing quite the edge against an ill-prepared foe.
item.iron_hawk_composite_bow.desc=rEVOlution is mastering the concept of building a better mousetrap while using classic concepts plus some solid innovations. The Iron Hawk is a classic compound bow with a twist. In this case, it's the arrows and the bow together. Iron Hawk arrows are heavier than standard models but contain a small thruster in the shaft that's ignited by the pressure of the launch. The thruster helps compensate for the weight-to-power issues, allowing the heavier arrow to hit harder and travel farther. \nNote: This item uses the wild die.
item.iron_hawk_arrow.desc=Arrow for the Iron Hawk bow.
item.steel_falcon_crossbow.desc=Similar to its Iron Hawk cousin, the Steel Falcon uses a little explosive innovation to add more impact to its projectiles and propel itself to the front of the crossbow market. Heavy rods, smart stabilizers, and one of the fastest reload systems on the market means the Steel Falcon will be truly rEVOlutionary. \nNote: This item uses the wild die.
item.steel_falcon_crossbow_bolt.desc=Bolt for the Steel Falcon crossbow.
item.fire_ant.desc=Little guns always get a bad rap, but the Fire Ant is going to toss that viewpoint to the wayside. Side-by-side barrels fed from a single magazine offer some unique features for this pint-sized powerhouse, including a pseudo-burst option. *SA is Burst; decrease Attack Rating by 1, increase DV by 1, expend 2 rounds. \nNote: This item uses the wild die.
item.raven.desc=The light-pistol market is pretty saturated with quality arms, but Evo didn't want to leave any gaps in their arsenal, so they ventured forth. The Raven only comes in one color: black. To distinguish this pistol from others, Evo went with tech theft rather than innovation. Unless you believe the internal memos that claim Ares stole the tech and sabotaged Evo's production. The point is, the Raven has the same ammo swap feature as the Predator VI. \nNote: This item uses the wild die and has ammo swap capabilities.
item.ocelot.desc=Machine pistols are too often afterthoughts or mods that don't really offer quality with their quantity of bullets. The Ocelot is looking to change that, with a focus on building a quality standalone machine pistol from the ground up. Reminiscent of the mini Uzi of last century, the Ocelot offers quality on its own rather than serving as an add-on to another model. \nNote: This item uses the wild die.
item.iron_eagle.desc=Orks and trolls rejoice, there is a heavy pistol you can pretty much call your own again. This monster offers power unattained by other semi-auto heavy pistols but leaves those with a smaller frame a bit the worse for wear after too much time behind the trigger. \nNote: This item uses the wild die.
item.cheetah.desc=Like its namesake, the Cheetah isn't about power, but makes a fine demonstration of how speed kills. Designed with a specialized firing system that offers an unmatched rate of fire, the Cheetah offers burst options that stack bullets within centimeters of one another. Sustained fire isn't an option yet, but rEVOlution is looking to change that. \nNarrow Burst increases DV by 3 \nNote: This item uses the wild die.
item.black_wolf.desc=Another saturated and well-covered market left Evo with a need for innovation, and innovate they did. They may have innovated themselves right out of the race, though, because their price point and small production runs thus far aren't getting them a lot of customers. \nNote: This item uses the wild die and ammo swap capabilities, and it has a smartlink.
item.iron_bull.desc=Not sure if it was just a last-minute thing or if no one at Evo considered the shotgun as a place for innovation. The Iron Bull has some aesthetic advances, but internally it's little more advanced than any of its combat shotgun counterparts. Pretty isn't going to kill your enemies. \nNote: This item uses the wild die.
item.steel_tiger.desc=I respect the effort to make a rifle of this level that isn't some bulky beast. She may lack a little grip versatility, but this class of guns isn't designed to be versatile. It's just supposed to drop a target from a thousand meters, then drop another target, and another target, all before anyone hears that first shot coming. The Tiger is a stealth killer, and a good one at that. This weapon also breaks down easily into the lightweight case that checks in at under 10 kilos with a decent scope in the case. \nNote: This item uses the wild die and has a silencer. It also has the Easy Breakdown quality.
item.rhino.desc=I got to handle and test the full spectrum of "machine guns." The nice thing about the design plan from rEVOlution is that they thought about the user, but didn't try to build all these big guns with the assumption that an ork or a troll is going to be running the heavy ordnance. First off, the adjustable handle plan is great for swapping the Rhino and Behemoth between hip and shoulder fire, while the same system on the Juggernaut seemed like some kind of joke. Then again, firing a gun of that size anywhere but on a mount is a bit ridiculous. The Rhino is a tight shooter with enough weight trimmed that firing it like an AR isn't out of the question. Your arms will tire if you get into a sustained engagement like that, but the Rhino is great for ending those kinds of engagements quickly. The Behemoth can come up to the shoulder, but you better have a ledge to lay her on for anything past a single spray and pray. rEVOlution trimmed some mass with their production and they pull off a good bit of fluff while integrating protective and ergonomic features into the same package. Barrel heat can be a problem, but they made sure all the grips and shields were in all the right places to keep those precious fingers from getting barrel-fried. Mounted, they all operate like a dream. Recoil evaporates, weight is well balanced to the connection point, and you'd swear the bullets gain a guidance system as the weapon settles comfortably into pouring a river of bullets downrange. That said, they jam more often than other designs, and I can't find the culprit mechanism. \nNote: These items use the wild die.
item.behemoth.desc=I got to handle and test the full spectrum of "machine guns." The nice thing about the design plan from rEVOlution is that they thought about the user, but didn't try to build all these big guns with the assumption that an ork or a troll is going to be running the heavy ordnance. First off, the adjustable handle plan is great for swapping the Rhino and Behemoth between hip and shoulder fire, while the same system on the Juggernaut seemed like some kind of joke. Then again, firing a gun of that size anywhere but on a mount is a bit ridiculous. The Rhino is a tight shooter with enough weight trimmed that firing it like an AR isn't out of the question. Your arms will tire if you get into a sustained engagement like that, but the Rhino is great for ending those kinds of engagements quickly. The Behemoth can come up to the shoulder, but you better have a ledge to lay her on for anything past a single spray and pray. rEVOlution trimmed some mass with their production and they pull off a good bit of fluff while integrating protective and ergonomic features into the same package. Barrel heat can be a problem, but they made sure all the grips and shields were in all the right places to keep those precious fingers from getting barrel-fried. Mounted, they all operate like a dream. Recoil evaporates, weight is well balanced to the connection point, and you'd swear the bullets gain a guidance system as the weapon settles comfortably into pouring a river of bullets downrange. That said, they jam more often than other designs, and I can't find the culprit mechanism. \nNote: These items use the wild die.
item.juggernaut.desc=I got to handle and test the full spectrum of "machine guns." The nice thing about the design plan from rEVOlution is that they thought about the user, but didn't try to build all these big guns with the assumption that an ork or a troll is going to be running the heavy ordnance. First off, the adjustable handle plan is great for swapping the Rhino and Behemoth between hip and shoulder fire, while the same system on the Juggernaut seemed like some kind of joke. Then again, firing a gun of that size anywhere but on a mount is a bit ridiculous. The Rhino is a tight shooter with enough weight trimmed that firing it like an AR isn't out of the question. Your arms will tire if you get into a sustained engagement like that, but the Rhino is great for ending those kinds of engagements quickly. The Behemoth can come up to the shoulder, but you better have a ledge to lay her on for anything past a single spray and pray. rEVOlution trimmed some mass with their production and they pull off a good bit of fluff while integrating protective and ergonomic features into the same package. Barrel heat can be a problem, but they made sure all the grips and shields were in all the right places to keep those precious fingers from getting barrel-fried. Mounted, they all operate like a dream. Recoil evaporates, weight is well balanced to the connection point, and you'd swear the bullets gain a guidance system as the weapon settles comfortably into pouring a river of bullets downrange. That said, they jam more often than other designs, and I can't find the culprit mechanism.\nNote: These items use the wild die.
item.megalodon.desc=A panther has nothing on a Megaladon! You might as well trademark that slogan right now and figure out a couple dozen other witty ad taglines, because rEVOlution is going to need them. If they can maintain production, this gun will be taking over the market (it's a small market but hey, product placement). They gave it a big name, and "The Meg" has become the go-to street reference, but overall they seem to have focused a bit too much on ergonomics and not enough on economics. Unless the goal was to make a trophy gun that can put a hole in anything, the biggest drawback is going to be sales (based on price). \nNote: These items use the wild die.
item.pulse.desc=With the Polymodal Ulterior L S Emitter (the PULSE), Evo veered away from both the animal names and the standard arms-race plan. This weapon is clearly the first step in a massive non-lethal arms race that rEVOlution will be spurring on. The Pulse is a straight-up knockout punch for anything with a brain. At its highest setting, it will blackout just about anyone or anything, but even on its lowest setting, it at very least discourages people from further engagement. Designed as a stun gun for the brain, the weapon fires a pulse of energy in a wavelength specifically focused on disrupting neural pathways. Low levels just leave you a little dazed, making it hard to think, but the higher levels will black you out and, if street testing is to be believed, can possibly cause permanent neurological damage. Based on the emitter and a pistol variant in the works, miniaturization is rapidly progressing, and a wide-area version, such as a grenade, is quite possible in the near future. \nNote: This item uses the wild die. Batteries cost 100¥ each and are not rechargeable.
item.ammo_battery_pulse.desc=Battery (non rechargeable) for the Evo Pulse.
item.hell_turtle.desc=It's a funny name but a hell of a weapon. The name comes from the alternate extended fuel source, a backpack with a design taken from a turtle shell with individual compartments that are separated and sealed off if the pressure in a chamber alters quickly from a rupture. The thing has almost no risk of a catastrophic failure from a standard impact, but certain rounds can ignite a tank and cause a rupture that cascades between the cells. Without the turtle pack, the ammo supply is limited but not too small. It depends on your attack style and whether you're a fan of the sprayand- pray method or prefer the focused burn. The adjustable choke is a nice touch as well, especially since it allows a wide but heavy spray without the risk of wide swings in the area of effect. The smartlink system is great for identifying the spray area and allowing a safer attack. This thing certainly changed my views on smartlinking a weapon similar to a flamethrower. *Use 1 ammo per DV; apply Burning 3 status to targets who are hit. \nNote: This item uses the wild die.
item.ammo_hell_turtle.desc=Fuel for the Hell Turtle.
item.honey_badger.desc=Every time I toggled the trigger, my mind went back to the old advert links I found when I started searching "Honey Badger." Every one said "Honey Badger don't care," and looking into this pre-Awakening psycho predator, I get the name. This thing launches and sometimes it flies true, but other times it just dips a bit off course and blasts anything in its way. The fin design seems to be the fatal flaw, but not every time. Sometimes it just goes after something else, because, well, Honey Badger don't care! \nNote: This item uses the wild die.
item.tarantula_hawk.desc=On the other hand, I also got to test out this beauty, and I did it in what had to be the best way ever for its namesake, I swatted bugs in Chicago. The place isn't overrun with them, but that made it easier to hunt and test rather than fighting for my life against the hordes! The targeting system software is top-notch, and rather than using just heat or straight radar, the lock-on process involves a shape and background temperature variation analysis that makes this system tough to trick, even with a full array of countermeasures. The design was nice as well, with a relatively simple reloading system. It is best run through a better protected network, as all that software requires big computing power, and protection is a must since the warheads can get spoofed with new target signatures if the firewall is bypassed. \nNote: This item uses the wild die.
item.crimson_wasp.desc=For years, the laser market has been a very narrow field, with research and manufacturing cost keeping most other arms companies out of the game. Even those that reverse-engineered someone else's design still had a hard time getting a budget to build them for the limited market. This weapon offers competition and innovation on the current market leader, along with a strong market in the ever-growing space operations field, which is Evo's primary reason for focusing on this weapon. A familiar design and operation style make this laser ideal for classically trained soldiers. The battery pack changes out just like a removable magazine, the ergonomics of the gun remind the user of its minimal recoil, and the sighting system aligns with the "barrel" in order to increase accuracy. Like most laser weapons, they have fantastic accuracy at range but lose beam focus, and thus damage, over distance. But since modern armor is not designed for heat and radiation energy dissipation, the trade-off is often worth it. \nNote: This item uses the wild die.
item.red_fox.desc=I was impressed with the Wasp, but I am in love with the Fox. The extended barrel adds beam focusing that pushes the effective range past any other laser on the market. It still suffers from particulate disruption over distance, but rEVOlution did something in the design to mitigate that. The look and feel are also awesome, with the same battery exchange style to give it a more classic rifle feel and a sharp design to fit its futuristic operation. > I watched a misfire once, the gun melted. They're built tough, but a hard jostle could put the emitters out of alignment, causing a myriad of issues, the worst of which is a catastrophic meltdown. *Decreases to 3P at Medium \nNote: This item uses the wild die.
item.ammo_battery_laser.desc=Batteries for the Crimson Wasp and Red Fox. Not rechargeable.

