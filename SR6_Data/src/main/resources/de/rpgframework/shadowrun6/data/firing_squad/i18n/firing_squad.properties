item.long_tooth.desc=Spears, staffs, and polearms in general have long been effective melee weapons in the right circumstances. They're fairly versatile, have good reach, and can be used in a variety of offensive and defensive strategies that would take too much time to cover in detail. While not effective in modern combat scenarios where firearms and launch weapons still rule, spears and staffs are still considered a major threat in a melee combat arena where they can give one hell of an old-fashioned beatdown. But like any weapon, they have drawbacks. They're fragging large, hard to hide, and not as effective in tight terrain or close quarters. Various attempts were made to make polearms collapsible, the first being the use of an old-style friction lock system commonly used by extendable batons. But these were often weak, and the lock often broke after a few good strikes. \nCougar Weapons Company found a way around this in the mid 2070s when they introduced their first collapsible spear made from a memory-steel alloy. This alloy could collapse into a shape the size of a standard knife and then expand again with no loss in tensile strength. In 2079, Cougar upped the ante by introducing the Long Tooth, a newer and advanced collapsible staff/spear system made of the same memory steel. When collapsed, the Long Tooth is slightly longer than a combat knife blade handle. When activated, the Long Tooth can extend to 0.5, 1.0, 1.5, or 2.0 meters. The Long Tooth comes with an optional twelve-centimeter detachable blade that can be utilized with both collapsed and extended modes, making it a true spear.
item.long_tooth.variant.blade.desc=The Long Tooth comes with an optional twelve-centimeter detachable blade that can be utilized with both collapsed and extended modes, making it a true spear.
item.dassault_alpenstock_blade.desc=Knife blade hidden inside Dassault ALpenstock.
item.dassault_alpenstock_spear.desc=While other companies might look at this two meter long metallic stick and think it's just a stick, Dassault has taken an old classic and implemented a suite of fancy features that make this an invaluable tool for climbing, hiking, and survival. It can serve as a walking stick, but it's also made of lightweight and strong titanium, so that it can break trees, rocks, and other hard objects that get in the way (think faces and bones). Additionally, it holds a suite of tools within the stick, allowing it to be used as a spear (this can help with moving along icy surfaces), a short knife, a fish scaler, a flint, a whistle, a glass breaker, and even a multi-tool. And it also comes with a compass, flashlight, and a rod that can be used to purify water when submerged for a couple minutes. The water purification rod can be reused but requires a full twelve hours between uses to keep it fresh.
item.dassault_alpenstock.desc=While other companies might look at this two meter long metallic stick and think it's just a stick, Dassault has taken an old classic and implemented a suite of fancy features that make this an invaluable tool for climbing, hiking, and survival. It can serve as a walking stick, but it's also made of lightweight and strong titanium, so that it can break trees, rocks, and other hard objects that get in the way (think faces and bones). Additionally, it holds a suite of tools within the stick, allowing it to be used as a spear (this can help with moving along icy surfaces), a short knife, a fish scaler, a flint, a whistle, a glass breaker, and even a multi-tool. And it also comes with a compass, flashlight, and a rod that can be used to purify water when submerged for a couple minutes. The water purification rod can be reused but requires a full twelve hours between uses to keep it fresh.
item.tactical_hammer.desc=Sometimes a problem really is a nail that needs to be hit, hard. For those times, the tactical hammer is the right tool for the job. Available in both short- and long-handled versions, the tactical hammer typically comes with a spiked striking face to embed into the target in order to prevent target skip and ensure kinetic energy transfer, while a weighted head helps enhance the overall profile. Some models also come with either a reinforced blade or heavy spike attached for those times when switching to another weapon isn't feasible.
item.tactical_hammer.variant.long.desc=Long tactical hammer.
item.tactical_hammer.variant.spike.desc=Spiked tactical hammer.
item.tactical_hammer.variant.long_spike.desc=Long spiked tactical hammer.
item.ash_arms_combat_chainsaw.desc=Despite how impractical a weapon it may actually be in combat, someone will inevitably try and employ it at some point because of the "rule of cool." And Ash Arms is cashing in on this saying with their combat chainsaw. What differentiates the combat chainsaw from the standard cutting tool are two main things. First, several key components are reinforced to handle more rigorous use and not break down because of overstress and rough handling. Second, combat chainsaws are melee hardened for another layer of protection, which also allows them to be used to bash an opponent if attacking with the saw component isn't feasible. While the combat chainsaw may be somewhat impractical in most combat situations save a back-alley brawl, they have a certain intimidation factor that can be used to provide multiple advantages. Ash offers its combat chainsaw in two types: a standard and monofilament version, the latter supposedly providing more damage potential. But most often it's more hazardous to the user than the target.
item.ash_arms_combat_chainsaw.variant.monofilament.desc=Monofilament version of the combat chainsaw.
item.bates_brown_combat_boots.desc=Sure, with years of training you can break a board or a person with your foot without hurting yourself. Throw these on your feet and plant that toe or heel plate into someone, and it ain't your foot that's going to break. Reinforced all around for breaking doors and faces, these boots are a must-have for the combat-conscious.
item.manriki_chain.desc=Also known as a kusari-fundo or manrikigusari (ten thousand power chain), the manriki chain is a handheld weapon dating back to feudal Japan, where it was used as a "non-bloodletting weapon." While the specs may vary, a manriki chain is made up of the kusari (chain) and the fundo, a weight attached to the ends of the chain. The manriki's total length varies between 30 and 120 centimeters (although longer ones are common), and the fundo typically weighs between 60 and 120 grams. In combat, the manriki can be used to strike an opponent with the fundo ends, or entrap an opponent's limbs with the kusari. Additionally, the manriki is also a popular weapon to disarm opponents. However, the manriki chain is not an easy weapon to deploy without extensive training and practice.
item.tonfa.desc=Just can't beat the simple designs. Ancient wisdom meets modern materials for a simple and anachronistic hoop whooping. These angled sticks with a handle protruding about two-thirds of the way up can be spun, swung, jabbed, used for blocking, hooking, and a myriad of other techniques in the hands of a trained fighter.
item.urban_tribe_tomahawk_mkii.desc=Native designs meet modern materials with a touch of faux retro with their "Old Ways" model that looks straight out of Algonquian history. The designers took the weight from the hilt and bulked up the head weight with an osmium core. It's a fast swing and a hard hit, but a light enough handle for good twists and maneuvers once you get used to the balance.
item.xiphos_tactical_gladius.desc=Katanas are so cliché. Not to mention bulky. The discerning street gladiator prefers to keep the Xiphos tucked beneath their trench coat and ready for battle. Designed for both offense and defense, the Xiphos is a thick but lightwieght and razorsharp tool for those who care about the kill more than the flash.
item.bearded_axe.desc=Zoé has carefully curated a selection of classical weapon designs that they believe will be most in demand around the world and across a wide range of cultures. Each of the weapons are custom-made to the design needs of the buyer and come with the personalized grip and metahuman adjustment modifications built in (the stats reflect this modification). Moreover, these weapons can add two additional modifications of the user's choice at no additional cost.
