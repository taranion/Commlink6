item.crossbow_collapsible_light.desc=The modern crossbow is made of high-tech materials that allow it to be easily collapsed into itself, condensing itself down to a much smaller size. This makes these weapons ideal when concealability is a concern, especially as the materials are not metallic and contain no chemical agents that can be detected with chemical detection sensors. \nLight models are single-handed. To collapse or expand a collapsible crossbow requires a Major Action. These crossbows can only support internal modifications when collapsed. When expanded, these crossbows can accept any modifications that can be top-mounted on a firearm.
item.crossbow_collapsible.desc=The modern crossbow is made of high-tech materials that allow it to be easily collapsed into itself, condensing itself down to a much smaller size. This makes these weapons ideal when concealability is a concern, especially as the materials are not metallic and contain no chemical agents that can be detected with chemical detection sensors. \nStandard designs require two hands to operate. To collapse or expand a collapsible crossbow requires a Major Action. These crossbows can only support internal modifications when collapsed. When expanded, these crossbows can accept any modifications that can be top-mounted on a firearm.
item.crossbow_collapsible_heavy.desc=The modern crossbow is made of high-tech materials that allow it to be easily collapsed into itself, condensing itself down to a much smaller size. This makes these weapons ideal when concealability is a concern, especially as the materials are not metallic and contain no chemical agents that can be detected with chemical detection sensors. \nHeavy designs require two hands to operate. To collapse or expand a collapsible crossbow requires a Major Action. These crossbows can only support internal modifications when collapsed. When expanded, these crossbows can accept any modifications that can be top-mounted on a firearm.

