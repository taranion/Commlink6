itemmod.land_mine_modification.page=38

itemmod.gecko_grip_modification.desc=Gecko grip adhesive can be used to adhere an explosive to a surface. This methodology is similar to the techniques used by limpet mines, using magnetism to adhere a mine to a ship. The gecko grip material is applied to the casing of any grenade or mine, making the explosive stick to the surface of the first thing it touches. This can be tricky when throwing a grenade, resulting in an Attack Rating penalty of 2. When launched, the adhesive activates when more than 5 meters from the launch point. Breaking free of the gecko grip's adhesive requires a Strength + Body (4) test.
itemmod.land_mine_modification.desc=Essentially, a landmine is a grenade with a special triggering mechanism. This "modification" is just a shorthand way to describe a landmine that has the properties of a grenade. A landmine can be loaded with any of the explosives and contents of a grenade. Applied pressure arms the landmine, then the subsequent release of that pressure triggers it.
itemmod.directional_mine_modification.desc=Essentially, a directional mine is a grenade with a special triggering mechanism. This "modification" is just a shorthand way to describe a directional mine that has the properties of a grenade. A directional mine can be loaded with any of the explosives and contents of a grenade. A directional mine is activated by a trigger, often a tripwire that ensures a target is within range. This tripwire can be a laser (visible, ultraviolet, thermographic) or a physical wire. The blast radius for a directional mine describes a forty- five-degree cone extending from Ground Zero.

