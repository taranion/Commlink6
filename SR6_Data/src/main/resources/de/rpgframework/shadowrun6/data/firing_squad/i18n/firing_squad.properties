item.ares_bug_stomper.desc=Armor Considered by some to be the pinnacle of modern armor designs, Ares' "Bug Stomper" tactical armor system was designed with the sole purpose of allowing Firewatch operators to go mano-a-mano with bugs of all kinds and have a reasonable chance of survival. Until recently, very little was known about the armor system, as Ares kept the specs a closely guarded secret. But after recent events, more information about the Bug Stomper system has come to light. Made of extremely durable and lightweight materials, Bug Stomper armor is approximately the size of medium milspec but only three quarters the weight. Special joint systems also allow for unrestricted, smooth movement. Some variants can deploy one micro and one small drone. But by the time the debacle in Detroit went down, Ares was already on the Mark II. Deployed for testing in select units, this model features special "reactive" armor plates that can be applied to the legs, torso, and arms. While Ares still has no plans to put the Bug Stomper on the open market, many suits (or pieces of) have been popping up on the black markets and have been fetching extremely high prices; IF one can even find them. \nNote: Includes four Reactive plate slots (see Reactive Armor, p. 53).
item.ballistic_mask.desc="Protect the face" is more than just street talk for keeping your front man alive and kicking. Scars may look tough on the street, but everywhere else they raise questions and draw attention. Not to mention all the squishy and important stuff located behind that face. Not being identified is a great bonus, too, especially for people whose job is not being noticed. The basic design is simple, but the mask comes in a wide array of styles, including an entire line of "masquerade" styles that provide protection during those strange events where the rich want anonymity. \nNotes: Has Cumulative quality (DR bonus is cumulative with other worn armor, excluding helmets).
item.basic_duty_utilities.desc=Also known as "combat fatigues," BDUs are either a pair of matching pants and a long-sleeved shirt or a jumpsuit. BDUs have been a staple of military and paramilitary units for over one hundred and fifty years (give or take), are made of durable, breathable, and (relatively) comfortable materials, and are designed for general everyday use. Although made with Kevlar-weave to provide some basic protection against smaller caliber weapons, BDUs are often used as the basic undergarment for higher-rated armor systems. As a utility garment, most BDUs feature several pockets and pouches on the arms and legs for equipment storage. They are also extremely popular with civilians because of their durability, utility, and military styling. \nNote: Includes 1 level of element protection of choice.
item.mil_spec_armor.desc="Top of the line," "state of the art," and "bleeding edge" have all been used to describe mil-spec armor types. Mil-spec armor is the stuff one sees slugging it out in open combat and is typically only issued to elite units. Everything about mil-spec armor is designed to give as much protection as possible. Mil-spec armor comes in three basic types: light, medium, and heavy. Light is typically used by operators who need more mobility, medium is the standard issue that balances mobility with protection, while heavy suits tell the concept of mobility to go straight to hell. Exact specs vary, but all milspec armors utilize some kind of lightweight metal in various configurations and thickness as the primary layer of protection. Mil-spec suits are purpose built and cannot be combined with any other armor systems except personal augmented or magical enhancements. Standard armor modifications can be added as well. Every set of mil-spec armor is custom-fit specifically to the user and features powered micro-servo joints that allow for maximum ergonomics. Mil-spec armor comes in a variety of styles and colors depending on the military and unit that deploys it. Custom helmets packed with the latest in sensor and communications gear are often employed as well. \nThere are three major downsides to using milspec armor. The first is cost; most mil-spec armor is out of the price range of most shadowrunners and even most mercenary units. Second, it's highly restricted and regulated; if you're not part of a military, have the proper (and up-to-date) security credentials, or a private military contractor in good standing (key words there) with the International Mercenary Association, expect to have a giant bullseye on your back every time you wear your precious suit. And three, the medium and heavy armors trade at least some mobility for protection. \nNote: Heavy armor reduces incoming DV by 3, reduces walking rates by 3 meters, and Sprint by 5 meters.
