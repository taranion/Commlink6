item.mems_tactical_armor_vest.desc=Filling a niche between purpose-built obvious tactical armors and concealed armor systems, the MEMS tactical vest is for when you may need to start out with subtlety, but then have to quickly transition to something that provides more substantial protection, mobility, and tactical flexibility. An armored version of the MEMS system, the tactical armor vest (or simply tac-vest) comprises modern Kevlar-weave plates encased in a vest-like carrier that goes over the front and back. Even when fully loaded, the tac-vest can be easily stored in a vehicle or small suitcase and then quickly employed when needed. \nNotes: This armor has the MEMS basic harness built in.
