item.murder_armor.desc=This stuff was a kitschy gimmick right up until Corinne Potter, a Seattle gubernatorial candidate at the time, took some shots right in the chest as part of an ambush, and then stood up on live trid, dusted herself off, and thanked Horizon for the fantastic protective wear. She avoided calling it by its brand name, but everyone knew what she meant. Few people care that the name's a little vulgar; they just care that they can take a round, feign injury, and let their security detail deal with the rest . \nNotes: Characters shot while wearing Murder Armor may use a Minor Action to play dead with an opposed Con + Charisma vs. Perception + Intuition Test with a  -4 dice pool modifier on the attacker. Success means the attacker ignores the character, assuming they are down, effectively giving them the Invisible 4 status. If the user makes an attack on their previous attacker, the Invisible status is lost after the attack. \nMurder armor simulates injuries with built-in Gorepaks, which must be replaced after each use. This costs 200¥ and requires an Engineering + Logic (4, 1 hour) Extended Test. Gorepaks cost 200¥.
item.parashield_mystic_tough.desc=The Sixth World is certainly a place of mayhem and magic. Technology has long tried to take the edge away from its mortal foe, especially in the arena of defenses for the mundane. Parashield has taken their expertise in paranormal critter training and physiology and merged this data with the basics of ballistic protection to create materials that stop bullets as well as they stop blasts of mana. \nNotes: Mystic Tough Body Armor has the Mystic Weave 2 property, which means it imposes a threshold of 2 for any mana-based spells cast at or on the wearer. It also imposes a  -4 dice pool modifier on any magic worked by a person wearing the armor.
item.securetech_aas.desc=While they struggle in other areas, several Ares execs have found ways to keep the nuyen flowing toward lost causes. The "acquisition" of the "Securetech" brand (notice the lack of a capital T) is allowing them to bolster their armor line even further, thanks to some serious rip-offs. The AAS resembles the PPP system and includes additional padding and armor for gaps in some standard armor or key points to protect. They are still quality, but the real SecureTech is making it rain in the shadows to frag Ares on this, and the runners enjoying the windfall don't care one way or the other. Ego is great for the bank account! \nNote: Has Cumulative quality (the DR bonus for the AAS is cumulative with other worn armor).
item.securetech_skinshield.desc=Armor Built as the successor of the ever-popular form-fitting body armor, SecureTech has revolutionized the concealable armor market with this line, which was something they needed desperately with Ares' theft of their PPP market share. While corpsec and military forces might want their armor to have some intimidation factor, executives and their protection specialists want no sign of their own personal fear while still being protected from whatever may come. \nNotes: Has Cumulative quality (DR bonus is cumulative with other worn armor).
item.securetech_invisishield.desc=Obviously Ares got more from SecureTech (capital T) than just the PPP data. They also snagged some data on the ruthenium-enhanced SecondSkin line and have merged it all to make the SkinShield system, the next level of clandestine protection. The ruthenium system is upgraded to not just appear nearly invisible but also to alter skin tone for the perfect tan or ghostly pallor, add tattoos for that bit of edge, or, if you have a decent hacker, make you mostly transparent. \nNotes: Includes Concealable holster, RACS 2 (see p. 259, SR6)
item.security_armor.desc=Built on the merger of civilian and military needs, this stuff is a fair middle ground for those who want the protection of military-grade tech, but without all the additional bells and whistles. Thus far, this stuff is mainly seen on private security forces working convoys for rich corporate clients, but those security forces aren't always corp employees and sometimes runners don't mind taking their payment in the form of premium gear. \nNotes: Security armor reduces incoming DV by 1, reduces the Move action by 2 meters, and reduces the Sprint action by 4 meters.

