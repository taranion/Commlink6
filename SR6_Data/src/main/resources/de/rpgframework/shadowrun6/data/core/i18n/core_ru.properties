item.taste_booster.desc=Усилитель вкуса анализирует химический состав пищи и питья, мгновенно обнаруживая яды.
item.taste_booster.wifi=Добавьте рейтинг усилителя вкуса как модификатор к проверкам Восприятия на основе вкуса.
item.tooth_compartment=Тайник в зубе
