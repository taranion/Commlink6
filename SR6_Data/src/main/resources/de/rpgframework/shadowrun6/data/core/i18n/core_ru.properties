item.silencer.wifi=Глушитель предупреждает вас через ДР, если звук выстрела превысил допустимый порог скрытности.
item.silencer.variant.cyberimplantweapon=Встроенное оружие
item.silencer.variant.cyberimplantweapon.desc=Глушитель снижает звук выстрела и скрывает дульную вспышку, затрудняя обнаружение стрелка.
