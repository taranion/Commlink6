item.tear_gas.desc=CS / Слезоточивый газ — химическое вещество для контроля толпы. Наносит оглушающий урон, Ошеломление и Тошноту. Скорость: 1 боевой раунд. Сила: 8.
item.gamma_scopolamine.desc=Гамма-скополамин — токсин инъекционного действия, вызывающий состояние Неподвижности (сыворотка правды). Скорость: немедленно. Сила: 12.
item.narcoject.desc=Наркоджект — стандартный транквилизатор инъекционного действия, обычно используемый с дротиковым оружием. Наносит оглушающий урон без побочных эффектов. Скорость: немедленно. Сила: 15.
item.nausea_gas.desc=Рвотный газ — вдыхаемый газ, используемый для подавления беспорядков. Вызывает сильную тошноту и Ошеломление. Скорость: 3 боевых раунда. Сила: 9.
item.neuro_stun_viii.desc=«Нейроподавитель VIII» — вдыхаемый или контактный токсин без цвета и запаха. Наносит оглушающий урон и накладывает Ошеломление. Скорость: 1 боевой раунд. Сила: 9.
item.neuro_stun_ix.desc=«Нейроподавитель IX» — вдыхаемый или контактный токсин без цвета и запаха. Наносит оглушающий урон и накладывает Ошеломление. Скорость: 1 боевой раунд. Сила: 12.
item.neuro_stun_x.desc=«Нейроподавитель X» — вдыхаемый или контактный токсин без цвета и запаха. Наносит оглушающий урон и накладывает Ошеломление. Скорость: 1 боевой раунд. Сила: 15.
item.pepper-punch.desc=«Перечный удар» — вдыхаемый или контактный спрей/газ. Наносит оглушающий урон и накладывает Ослепление I и Ошеломление. Скорость: 1 боевой раунд. Сила: 11.
capsaicin, which is derived from the active ingredient in hot peppers, along with other chemicals. It is typically deployed as a liquid spray for personal defense and deterrence; this agent is often tagged with RFID tags or special dyes to identify victims later. Someone dosed with pepper punch feels an intense burning on any affected skin; this affect is even more pronounced if it gets in the eyes, nose, or mouth. Victims sprayed in the eyes have trouble seeing, and breathing becomes difficult.
item.seven_7.desc=«Семь-7» — боевой газ без цвета и запаха, преодолевающий химическую защиту. Наносит физический урон, Ослепление I, Ошеломление и Тошноту. Скорость: 1 боевой раунд. Сила: 12.
item.alcohol.desc=Алкоголь — распространённый по всему миру депрессант. Даёт Устойчивость к боли ценой штрафа -1 к Реакции и -1 к Логике. Скорость: 1 минута. Сила: 6.
item.bliss.desc=«Блаженство» — опиатный транквилизатор, синтезированный из цветов мака. Назван в честь вызываемой им эйфории. Даёт Устойчивость к боли (-1 к Реакции, -1 к Воле). Скорость: 1 боевой раунд. Сила: 8.
item.cram.desc=«Крэм» — дешёвый стимулятор бодрости и ускорения. Даёт +1 к Реакции и +1D6 кубиков инициативы. Скорость: 10 минут. Сила: 4.
item.deepweed.desc=«Глубинная трава» — наркотическое вещество из пробуждённых водорослей. Пробуждает астральное восприятие у любого принявшего, вызывая при этом сонливость. Скорость: немедленно. Сила: 6.
item.jazz.desc=«Джаз» — стимулятор, разработанный для офицеров полиции против аугментированных противников. Даёт +1 к Реакции и +2D6 кубиков инициативы. Поставляется в одноразовых ингаляторах. Скорость: немедленно. Сила: 9.
item.kamikaze.desc=«Камикадзе» — военный боевой стимулятор. Значительно повышает силу, реакцию и устойчивость к боли, вводя бойца в боевое неистовство. Скорость: немедленно. Сила: 8.
item.long_haul.desc=«Долгий путь» — комбинация синтетических гормонов, полностью блокирующая потребность во сне на 4 дня подряд. Скорость: 10 минут. Сила: 11.
item.nitro.desc=«Нитро» — гремучая смесь стимуляторов и обезболивающих для уличных бойцов. Даёт +2 к Силе, +1 к Воле и Устойчивость к боли. Скорость: немедленно. Сила: 9.
item.nova_coke.desc=«Новакока» — популярный синтетический эйфоретик и стимулятор. Повышает Харизму и Реакцию, вызывает сильнейшее привыкание. Скорость: немедленно. Сила: 7.
item.psyche.desc=«Психея» — ноотроп, стимулирующий логику, интуицию и аналитические способности. Чрезвычайно популярен среди декеров и магов. Скорость: 10 минут. Сила: 6.
item.zen.desc=«Дзэн» — сильный психоделик и седативный препарат. Погружает в глубокое созерцательное состояние, снижая физическую активность. Скорость: 5 минут. Сила: 7.

