#Adept Powers
adeptpower.adrenaline_boost=Прилив адреналина
adeptpower.adrenaline_boost.page=156
adeptpower.adrenaline_boost.desc=Всплеск энергии позволяет действовать быстрее других. Добавьте 2 к показателю инициативы за каждый уровень способности на (Магия) боевых раундов. В конце перенесите истощение, равное уровню способности.
adeptpower.astral_perception=Внимание в астрале
adeptpower.astral_perception.page=156
adeptpower.astral_perception.desc=Вы получаете способность воспринимать астрал (стр. 159). Во время использования вы обладаете двойственной природой и можете атаковать астральные формы.
adeptpower.attribute_boost=Усиление характеристики
adeptpower.attribute_boost.page=156
adeptpower.attribute_boost.desc=Мана усиливает врожденные физические способности (Тело, Проворство, Реакция или Сила). Успехи временно повышают выбранную характеристику на 1 (до максимума +4) на время проверок на (чистые успехи) боевых раундов.
adeptpower.combat_sense=Боевое чутьё
adeptpower.combat_sense.page=156
adeptpower.combat_sense.desc=Способность предчувствовать опасность и избегать урона. Бонус +1 кубик за уровень ко всем защитным проверкам и проверкам внезапности (стр. 108).
adeptpower.critical_strike=Критический удар
adeptpower.critical_strike.page=156
adeptpower.critical_strike.desc=Увеличивает силу урона атак ближнего боя на 1 за каждый уровень этой способности.
adeptpower.danger_sense=Предчувствие опасности
adeptpower.danger_sense.page=156
adeptpower.danger_sense.desc=Шестое чувство опасности. Вы получаете очко преимущества перед совершением проверок внезапности.
adeptpower.direction_sense=Чувство направления
adeptpower.direction_sense.page=156
adeptpower.direction_sense.desc=Вы отлично ориентируетесь в пространстве и помните свой маршрут. Получите очко преимущества при проверке Ориентирования на направление.
adeptpower.enhanced_perception=Повышенное внимание
adeptpower.enhanced_perception.page=157
adeptpower.enhanced_perception.desc=Обостренные чувства восприятия. Получите очко преимущества при действии Рассмотреть поближе или проверке Внимания на поиск скрытого.
adeptpower.enhanced_accuracy=Повышенная точность
adeptpower.enhanced_accuracy.page=157
adeptpower.enhanced_accuracy.desc=Оружие в ваших руках смертоноснее и точнее. Значение атаки любого используемого оружия увеличивается на 2.
adeptpower.improved_ability=Улучшение навыка
adeptpower.improved_ability.page=157
adeptpower.improved_ability.desc=Выбранный навык получает постоянное усиление, равное рейтингу способности (максимум до 1.5 от базового значения).
adeptpower.improved_ability_combat=Улучшение боевого навыка
adeptpower.improved_ability_combat.page=157
adeptpower.improved_ability_combat.desc=Выбранный боевой навык получает постоянное усиление, равное рейтингу способности.
adeptpower.improved_physical_attribute=Улучшение физической характеристики
adeptpower.improved_physical_attribute.page=157
adeptpower.improved_physical_attribute.desc=Выбранная физическая характеристика (Тело, Проворство, Реакция или Сила) получает постоянное усиление, равное уровню способности.
adeptpower.improved_reflexes=Улучшение рефлексов
adeptpower.improved_reflexes.page=157
adeptpower.improved_reflexes.desc=Быстрые рефлексы. За каждый уровень способности добавьте 1 кубик инициативы и увеличьте Реакцию на 1 (максимум 4 уровень).
adeptpower.improved_sense=Улучшение чувства
adeptpower.improved_sense.page=157
adeptpower.improved_sense.desc=Выберите чувство (зрение, слух, осязание, вкус или обоняние). Получите очко преимущества при проверках с участием этого чувства.
adeptpower.killing_hands=Убийственные кулаки
adeptpower.killing_hands.page=157
adeptpower.killing_hands.desc=Ваши руки смертоносны и наполнены магией. В безоружном бою вы можете наносить как оглушающий, так и физический урон. Атаки считаются магическими.
adeptpower.kinesics=Кинесика
adeptpower.kinesics.page=157
adeptpower.kinesics.desc=Магическое владение языком тела. Получите очко преимущества при сопротивлении социальным проверкам, чтению эмоций и проницательности.
adeptpower.mystic_armor=Магическая броня
adeptpower.mystic_armor.page=157
adeptpower.mystic_armor.desc=Мана образует защитный щит: +1 к Броне за каждый уровень способности, суммируется с надетой броней и повышает Значение защиты. Действует в астрале.
adeptpower.pain_resistance=Сопротивляемость боли
adeptpower.pain_resistance.page=157
adeptpower.pain_resistance.desc=Повышенная способность игнорировать боль. Отрицательные штрафы от ранений сдвигаются на 1 ячейку дальше за каждый уровень способности.
adeptpower.rapid_healing=Быстрое исцеление
adeptpower.rapid_healing.page=158
adeptpower.rapid_healing.desc=Магия способствует ускоренному сращиванию костей и заживлению тканей: +1 успех за уровень к проверкам лечения.
adeptpower.spell_resistance=Сопротивление заклинаниям
adeptpower.spell_resistance.page=158
adeptpower.spell_resistance.desc=Заклинания отскакивают от вас: получите очко преимущества, когда становитесь целью заклинания.
adeptpower.traceless_walk=Бесследный шаг
adeptpower.traceless_walk.page=158
adeptpower.traceless_walk.desc=Вы не оставляете следов на пыли, снегу, воде или земле и не активируете нажимные ловушки и растяжки.
adeptpower.vocal_control=Контроль голоса
adeptpower.vocal_control.page=158
adeptpower.vocal_control.desc=Управление тембром, тональностью и высотой голоса: получите преимущество при проверках Обмана или Убеждения с голосом.
adeptpower.wall_running=Бег по стенам
adeptpower.wall_running.page=158
adeptpower.wall_running.desc=Способность совершать рывок по вертикальным поверхностям сложным действием Рывок.

