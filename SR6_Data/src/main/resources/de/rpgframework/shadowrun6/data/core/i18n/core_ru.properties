item.scratch_built_junk.desc=Риггерская панель управления (РПУ), собранная на коленке. Позволяет риггеру контролировать несколько дронов одновременно, распределять автософты и защищать их от взлома.
item.allegiance_control_center.desc=Центр управления «Аллидженс». Риггерская панель управления (РПУ), дающая возможность контролировать группу дронов, распределять программы и снижать шум.
item.essy_motors_drone_master.desc=РПУ «Изи Моторс ДронМастер». Позволяет управлять сетью дронов, разделять автософты и обеспечивать сетевую защиту.
item.horizons_overseer.desc=РПУ «Горизонт Оверсир». Продвинутая консоль управления дронами с высоким сетевым экраном и вычислительной мощностью.
item.maersk_spider.desc=РПУ «Мерск Спайдер». Надёжная капитанская консоль для одновременного контроля дронов и снижения матричного шума.
item.vulcan_liegelord.desc=РПУ «Вулкан Лиджлорд». Одна из самых популярных риггерских консолей на улицах, обеспечивающая превосходную защиту и распределение автософтов.
item.proteus_poseidon.desc=РПУ «Протеус Посейдон». Высокопроизводительная консоль управления дронами военного и охранного класса.
item.transys_eidolon.desc=РПУ «Трансис Эйдолон». Продвинутая консоль управления с высокой вычислительной мощностью.
item.ares_red_dog_series.desc=РПУ серии «Арес Ред Дог». Риггерская консоль тактического назначения для боевых дронов.
item.aztechnology_tlaloc.desc=РПУ «Ацтехнолоджи Тлалок». Мощная риггерская консоль корпоративного класса.

