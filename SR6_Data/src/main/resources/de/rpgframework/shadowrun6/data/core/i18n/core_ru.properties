item.stealth.desc=Скрытность: при выполнении действия Спрятаться даёт 1 очко преимущества, которое нужно немедленно потратить на это действие, или оно исчезнет. Эта программа связана с характеристикой Ускользания.
item.stealth.variant.regular.desc=Скрытность: при выполнении действия Спрятаться даёт 1 очко преимущества, которое нужно немедленно потратить на это действие, или оно исчезнет. Эта программа связана с характеристикой Ускользания.
item.stealth.variant.rcc.desc=Скрытность: при выполнении действия Спрятаться даёт 1 очко преимущества, которое нужно немедленно потратить на это действие, или оно исчезнет. Эта программа связана с характеристикой Ускользания.
