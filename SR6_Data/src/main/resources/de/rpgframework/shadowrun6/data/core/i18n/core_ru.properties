item.docwagon_contract.desc=Медицинский контракт с корпорацией DocWagon, гарантирующий экстренную эвакуацию при ранении.
item.docwagon_contract.variant.monthly.desc=Медицинский контракт с корпорацией DocWagon, гарантирующий экстренную эвакуацию при ранении.
item.docwagon_contract.variant.yearly.desc=Медицинский контракт с корпорацией DocWagon, гарантирующий экстренную эвакуацию при ранении.
item.docwagon_basic_year.desc=Базовый годовой контракт DocWagon: выезд стандартной бригады медиков.
item.docwagon_gold_year.desc=Золотой годовой контракт DocWagon: ускоренное время прибытия и вооружённый эскорт.
item.docwagon_platinum_year.desc=Платиновый годовой контракт DocWagon: прибытие штурмовой реанимационной группы на летающей платформе.
item.docwagon_superplatinum_year.desc=Суперплатиновый контракт DocWagon: максимальный приоритет, боевая группа СВВП и бесплатная реанимация.
item.disposable_syringe.desc=Стерильный одноразовый шприц для инъекций медикаментов и препаратов.
item.first_aid_kit.desc=Базовый набор медицинских принадлежностей для оказания первой помощи при ранениях.
item.medkit.desc=Продвинутая аптечка с диагностическим компьютером, хирургическими зажимами и набором медикаментов.
item.medkit.wifi=Медкит даёт модификатор +1 кубик к проверкам первой помощи и лечения.
item.medkit_supplies.desc=Расходные медицинские материалы для пополнения полевой аптечки или медкита.
item.antidote_patch.desc=Пластырь-антидот с широким спектром нейтрализаторов органических и синтетических токсинов.
item.chem_patch.desc=Трансдермальный пластырь для введения жидких химических препаратов сквозь кожу.
item.stim_patch.desc=Стимулирующий пластырь временно снимает штрафы от оглушающего урона.
item.tranq_patch.desc=Транквилизирующий пластырь с успокоительным средством быстрого действия.
item.trauma_patch.desc=Травматологический реанимационный пластырь с дефибриллятором для стабилизации умирающего.

