focus.alchemical_focus.desc=Служит вместилищем алхимических сил и добавляет свою Мощь к проверкам Зачарования при изготовлении препаратов.
focus.disenchanting_focus.desc=Усиливает проверки снятия зачарования при временном нарушении или постоянном уничтожении астральных конструкций и чужих источников.
focus.centering_focus.desc=Метамагический источник, помогающий успокоить разум и добавляющий Мощь к сопротивлению истощению при центрировании.
focus.flexible_signature_focus.desc=Метамагический источник, облегчающий изменение, сокрытие и подделку астрального следа заклинателя.
focus.masking_focus.desc=Метамагический источник, позволяющий маскировать ауру владельца под обывателя или скрывать истинный уровень Магии.
focus.spell_shaping_focus.desc=Источник изменения заклинаний: ваш уровень Магии считается увеличенным Мощью этого источника при определении, насколько вы можете изменить своё заклинание.
focus.power_focus.desc=Источник силы добавляет свою Мощь ко всем проверкам Магии владельца.
focus.qi_focus.desc=Источник для адептов. Наполняет маной выбранную силу адепта, увеличивая её уровень на величину Мощи источника / 2.
focus.counterspelling_focus.desc=Контрзаклинание: добавляет кубики в количестве, равном его Мощи, к любой проверке контрзаклинания, если отменяемое заклинание той же категории, что и источник. Также добавляет свою Мощь к вашему набору кубиков, когда вы выбираете магическую защиту в качестве контрзаклинания (стр. 142).
focus.spellcasting_focus.desc=Сотворение заклинаний: добавляет свою Мощь к вашему набору кубиков для проверки Сотворения заклинаний, если заклинание имеет ту же категорию, что и источник.
focus.ritualspellcasting_focus.desc=Ритуальное заклинание: добавляет свою Мощь к вашему набору кубиков для проверок Ритуального заклинания (неважно, лидер вы или участник). Если ритуал не включает в себя заклинание, этот источник всё ещё можно использовать. Однако если ритуал с заклинанием из другой категории, то источник использовать в этом ритуале нельзя.
focus.sustaining_focus.desc=Поддерживает сотворённое заклинание вместо мага, избавляя его от штрафа за поддержание.
focus.summoning_focus.desc=Призыв: добавляет свою Мощь к вашему набору кубиков для проверки призыва, если источник настроен на тот вид духа, который хотят призвать.
focus.banishing_focus.desc=Изгнание: изгоняющий источник добавляет свою Мощь к набору кубиков для изгнания, если он настроен на тот вид духа, который хотят изгнать.
focus.weapon_focus.desc=Оружейный источник добавляет свою Мощь к проверкам атаки в ближнем бою и в астрале.

