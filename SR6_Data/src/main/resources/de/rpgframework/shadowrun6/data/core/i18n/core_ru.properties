item.gyro_mount.wifi=Быстрое отсоединение гирокрепления беспроводным сигналом является простым действием.
item.gyro_mount.desc=Гирокрепление компенсирует отдачу и вес тяжёлого стрелкового оружия за счёт гироскопической подвески на теле стрелка.
