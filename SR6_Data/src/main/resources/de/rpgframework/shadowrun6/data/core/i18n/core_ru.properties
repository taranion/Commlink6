item.diving_gear.desc=Водолазное снаряжение: гидрокостюм, маска с регулятором дыхания и баллоны со сжатым воздухом.
item.flashlight.desc=Тактический подствольный фонарь высокой мощности для освещения целей в темноте.
item.gas_mask.desc=Тактический противогаз со сменными фильтрами для защиты органов дыхания и глаз от газов и дыма.
item.gas_mask.wifi=Противогаз анализирует состав окружающего воздуха и выводит предупреждения о токсинах в ДР.
item.gecko_tape_gloves.desc=Перчатки с микроприсосками геккона позволяют легко карабкаться по гладким стенам и стеклу.
item.gecko_tape_gloves.wifi=Клейкий внешний слой можно временно нейтрализовать беспроводным сигналом, что облегчает надевание и снятие перчаток.
item.hazmat_suit.desc=Костюм полной химической и радиационной защиты с замкнутым контуром дыхания.
item.hazmat_suit.wifi=Костюм химзащиты анализирует и передаёт данные о токсичности и радиоактивности окружающей среды.
item.light_stick.desc=Химический источник света (ХИС) — надломить и потрясти для 3 часов мягкого свечения.
item.magnesium_torch.desc=Магниевый факел горит ярким ослепительным пламенем в течение пяти минут даже под водой.
item.microflare_launcher.desc=Микроракетница для запуска сигнальных цветных ракет на высоту до 200 метров.
item.microflares.desc=Сигнальные микроракеты для компактной пусковой установки.
item.rappelling_gloves.desc=Спусковые перчатки из термостойкого кевлара для скоростного спуска по тросам.
item.respirator.desc=Компактный респиратор для фильтрации пыли, спор и токсичных аэрозолей.
item.survival_kit.desc=Набор выживания: нож, компас, сухое горючее, фильтр для воды, сигнальное зеркало и термоодеяло.
item.grapple_gun.desc=Пневматический пистолет с кошкой и сверхпрочной микронитью для подъёма на высотные здания.
item.grapple_gun.variant.cyberware.desc=Пневматический пистолет с кошкой и сверхпрочной микронитью для подъёма на высотные здания.
item.microwire.desc=Сверхтонкий высокопрочный трос из композитной микронити, выдерживающий огромную нагрузку.
item.myomeric_rope.desc=Миомерный канат из искусственных мышц, способный сжиматься, сгибаться и ползти по радиокомандам.
item.standard_rope.desc=Синтетический альпинистский трос высокой прочности (100 метров).
item.stealth_rope.desc=Скрытная верёвка, полностью растворяющаяся при контакте с каталитическим стержнем без следов.
item.catalyst_stick.desc=Каталитический стержень для быстрого растворения скрытной верёвки.

