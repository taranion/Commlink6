item.smart_firing_platform.desc=Смарт-платформа позволяет закрепить оружие и вести огонь удалённо через систему смартлинка.
item.smart_firing_platform.wifi=Вы можете вести огонь из установленного оружия удалённо через имплантированный смартлинк в ВР или через ДР.
