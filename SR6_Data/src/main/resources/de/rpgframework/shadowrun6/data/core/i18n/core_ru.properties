item.adrenaline_pump.desc=Адреналиновая помпа выбрасывает синтетический адреналин в кровь в момент опасности, взвинчивая характеристики.
item.bone_density_augmentation.desc=Аугментация плотности костей насыщает костную ткань биокерамикой, повышая прочность скелета.
item.cats_eyes.desc=«Кошачьи глаза» — трансгенный выращенный в чане биоимплант со щелевидным зрачком для ночного видения.
item.enhanced_articulation.desc=Улучшенная суставная артикуляция и укреплённые связки делают движения плавными и точными.
action. Enhanced articulation provides you with a +1 Agility and a bonus Edge when trying to move through cramped or confining spaces.
item.muscle_augmentation.desc=Укреплённые суставы и мышечная масса увеличивают физическую Силу персонажа.
item.muscle_toner.desc=Укрепитель мускулов заменяет мышечные волокна на тонкие высокоэластичные нити, повышая Ловкость.
item.orthoskin.desc=Ортокожа — генетически модифицированная дерма с полимерным армированием, повышающая естественную броню.
item.platelet_factories.desc=Фабрика тромбоцитов ускоряет свертывание крови, снижая тяжесть физических ранений на 1.
item.skin_pocket.desc=Потайной кожный карман со скрытностью 10 для провоза мелких запрещённых предметов.
item.suprathyroid_gland.desc=Сверхщитовидная железа разгоняет метаболизм, повышая силу, ловкость, выносливость и скорость носителя.
item.symbiotes.desc=Симбиоты — генетически выведенные организмы в крови, значительно ускоряющие восстановление от ранений.
item.synthacardium.desc=Синтокардий — искусственное синтетическое сердце повышенной выносливости для бега и физических нагрузок.
item.tailored_pheremones.desc=Адаптированные феромоны выделяются по воле носителя, повышая обаяние и убедительность в разговоре.
item.toxin_etractor.desc=Вытягиватель токсинов — модифицированная ткань печени, нейтрализующая яды и токсины в организме.
item.tracheal_filter.desc=Трахеальный фильтр перекрывает дыхательные пути при обнаружении токсичных газов и микробов.
item.cerebral_booster.desc=Церебральный усилитель увеличивает плотность нейронов коры головного мозга, повышая Логику и Интуицию.
item.damage_compensator.desc=Компенсатор урона блокирует сигналы болевого шока в нервной системе, уменьшая штрафы от ранений.
item.mnemonic_enhancer.desc=Мнемонический усилитель развивает объём памяти и скорость ассоциативного мышления.
item.pain_editor.desc=Регулятор боли полностью отключает восприятие боли, позволяя бойцу сражаться до потери сознания.
item.reflex_recorder.desc=Датчик рефлексов оптимизирует нервные импульсы для конкретного физического навыка.
item.sleep_regulator.desc=Регулятор сна позволяет носителю восстанавливать силы всего за три часа глубокого сна в сутки.
item.synaptic_booster.desc=Синаптический усилитель ускоряет передачу сигналов в спинном мозге, повышая Реакцию и инициативу.

