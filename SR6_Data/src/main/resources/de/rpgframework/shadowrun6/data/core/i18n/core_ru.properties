item.laser_sight.wifi=Бонус к значению атаки увеличивается до +2. Вы получаете бонусное простое действие для прицеливания.
item.laser_sight.desc=Лазерный целеуказатель проецирует яркую световую точку на цель, повышая точность неприцельной стрельбы.
