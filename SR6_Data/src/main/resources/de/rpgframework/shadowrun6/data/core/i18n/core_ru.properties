item.fork.desc=Разветвление: позволяет использовать одно действие в Матрице на двух целях без разделения набора кубиков.
item.fork.variant.regular.desc=Разветвление: позволяет использовать одно действие в Матрице на двух целях без разделения набора кубиков.
item.lockdown=Программа «Захват цели»
