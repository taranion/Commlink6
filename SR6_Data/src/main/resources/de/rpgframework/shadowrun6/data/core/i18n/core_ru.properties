#Qualities - Positive
quality.magician=Маг
quality.magician.page=67
quality.adept=Адепт
quality.adept.page=67
quality.mysticadept=Мистический адепт
quality.mysticadept.page=67
quality.aspectedmagician=Аспектный маг
quality.aspectedmagician.page=67
quality.technomancer=Техномант
quality.technomancer.page=67

quality.ambidextrous=Амбидекстр
quality.ambidextrous.page=71
quality.ambidextrous.desc=Вы одинаково хорошо владеете как правыми, так и левыми вашими конечностями. Стреляя, кидая гранату или перебрасывая мячик, вам не так важно, делаете ли вы это справа или слева.<br/><br/><b>Стоимость:</b> 4 кармы<br/><b>Игровой эффект:</b> Нет штрафа за использование оружия во второй руке (см. стр. 110).
quality.analytical_mind=Аналитический ум
quality.analytical_mind.page=71
quality.analytical_mind.desc=Вы мастерски решаете проблемы. Вы можете анализировать информацию, чтобы помочь придумать решение и при этом отделять полезные части информации от различных отвлечений и белого шума.<br/><br/><b>Стоимость:</b> 3 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества при совершении проверок, основанных на Логике, кроме проверок сопротивления истощению.
quality.aptitude=Выдающийся (навык)
quality.aptitude.page=71
quality.aptitude.desc=Лучшие из лучших считают вас примером. У вас есть естественный потенциал стать ещё лучше, чем первоклассные умельцы в определённом навыке.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Максимальный уровень выбранного навыка равен 10 вместо 9, а ваш максимальный начальный уровень равен 7 вместо 6.
quality.astral_chameleon=Астральный хамелеон
quality.astral_chameleon.page=71
quality.astral_chameleon.desc=Ваша аура надолго стабильной не бывает. У вас есть способность сливаться с астральным окружением вокруг вас, что усложняет процесс идентификации и чтения вашей ауры и астрального следа.<br/><br/><b>Стоимость:</b> 9 кармы<br/><b>Игровой эффект:</b> Персонажи получают штраф -2 кубика к проверкам для опознания вашей ауры или астрального следа. Ваш астральный след исчезает вдвое быстрее обычного (см. стр. 160).
quality.blandness=Заурядность
quality.blandness.page=71
quality.blandness.desc=Вы — самая скучная личность во всём мире. У вас средний рост, вес, строение тела и вообще всё. Ничто в вас не выбивается из общей картины... что порой бывает весьма полезно.<br/><br/><b>Стоимость:</b> 8 кармы<br/><b>Игровой эффект:</b> Персонажи получают штраф -2 кубика к проверкам Памяти (стр. 68) при попытке вспомнить, видели ли они вас раньше, а порог проверок, для того чтобы заметить, как вы следуете или наблюдаете за ними, увеличивается на 1.
quality.built_tough=Живучесть
quality.built_tough.page=71
quality.built_tough.desc=Вы крепкий, как кирпичный сортир, и вы способны выдержать несколько больше тумаков, прежде чем отрубитесь.<br/><br/><b>Стоимость:</b> 4 кармы за каждый уровень<br/><b>Игровой эффект:</b> Вы получаете некоторое количество дополнительных ячеек на счётчике здоровья, равное уровню этого качества.
quality.catlike=Грациозность
quality.catlike.page=72
quality.catlike.desc=Вы с рождения столь грациозны, что вас могут посчитать родственником семейства кошачьих. Ваши шаги мягки, и вы всегда приземляетесь на четыре лапы. Буквально, а не метафорически.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества для всех проверок на баланс, падение и безопасное приземление (см. стр. 46).
quality.dermal_deposits=Подкожные наросты
quality.dermal_deposits.page=72
quality.dermal_deposits.desc=На вашей плоти или через неё прорастают костяные наросты, что делает вас крепче и жёстче. В прямом смысле слова.<br/><br/><b>Стоимость:</b> 7 кармы<br/><b>Игровой эффект:</b> Вы получаете 1 уровень естественной брони. Ваши безоружные атаки ближнего боя базово наносят физический урон.
quality.double_jointed=Гибкость
quality.double_jointed.page=72
quality.double_jointed.desc=Благодаря тренировкам или же генетике, большинство суставов в вашем теле способны гнуться куда лучше стандартных метачеловеческих.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества ко всем проверкам захвата, освобождения от пут, гибкости или влезания в узкие места.
quality.elemental_resistance=Сопротивление (стихии)
quality.elemental_resistance.page=72
quality.elemental_resistance.desc=Благодаря тренировкам или же генетике ваше тело куда лучше противостоит определённой стихии.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Выберите вид стихийного урона (стр. 109). Когда вы подвергаетесь атаке оружием или заклинанием, наносящей урон этой стихией, получите очко преимущества перед совершением проверки защиты.
quality.exceptional_attribute=Исключительность (характеристика)
quality.exceptional_attribute.page=72
quality.exceptional_attribute.desc=Вы можете быть крайне энергичным, выдержать удар тролля, спокойно принимать синтаголь, увернуться от правого хука или своей грацией посрамить кошку — так или иначе, вы просто лучше других.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Выберите физическую или психическую характеристику. Максимальный уровень этой характеристики увеличивается на 1. Это качество можно приобрести только 1 раз.
quality.first_impression=Первое впечатление
quality.first_impression.page=72
quality.first_impression.desc=Вы знаете, как себя подать и сделать первую встречу лучшей. Ваш острый ум, очарование и аккуратная лесть застают всех врасплох.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете 2 очка преимущества для проверок социальных навыков в ходе вашей первой встречи с другими персонажами. Ваши уровни розыска и репутации при этом игнорируются.
quality.focused_concentration=Сосредоточенность
quality.focused_concentration.page=72
quality.focused_concentration.desc=Вы знаете, как расставлять приоритеты и управлять магическими энергиями, при этом не перенапрягаясь.<br/><br/><b>Стоимость:</b> 12 кармы за уровень<br/><b>Игровой эффект:</b> Вы можете поддерживать несколько заклинаний или сложных форм одновременно без штрафа. За каждый уровень вы можете поддерживать 1 дополнительное заклинание или сложную форму, не получая соответствующий штраф.
quality.gearhead=Технарь
quality.gearhead.page=72
quality.gearhead.desc=Вы прекрасно понимаете всё, у чего есть двигатель или движущиеся детали, и знаете, как заставить их работать лучше. Или же просто быстрее.<br/><br/><b>Стоимость:</b> 10 кармы<br/><b>Игровой эффект:</b> Вы получаете очко преимущества при проверке починки для любого транспорта и можете тратить преимущество в свободное время, чтобы совершить продолжительную проверку починки.
quality.guts=Смелость
quality.guts.page=72
quality.guts.desc=Это вы не страх потеряли, а трусость! Вы можете противостоять самым устрашающим противникам и держать язык за зубами в ходе самых суровых допросов.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Персонажи получают штраф -2 кубика к проверкам Запугивания, направленным против вас. Стоимость очков преимущества для сопротивления эффектам Страха снижается на 1.
quality.hardening=Стойкость
quality.hardening.page=73
quality.hardening.desc=После пары неприятных встреч со льдом или другими аватарами в Матрице вы создаёте собственный барьер против них.<br/><br/><b>Стоимость:</b> 10 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества при совершении проверок сопротивления урону в Матрице. Получая урон в Матрице, вы можете заменить 2 или менее урона в Матрице на оглушающий урон, защищая свой аватар ценой собственного тела.
quality.high_pain_tolerance=Устойчивость к боли
quality.high_pain_tolerance.page=73
quality.high_pain_tolerance.desc=Боль — лишь иллюзия разума. Ну или у вас врождённая анальгезия. Так или иначе, в отличие от остальных вы не получаете негативных эффектов от ранений и боли.<br/><br/><b>Стоимость:</b> 7 кармы<br/><b>Игровой эффект:</b> Когда вы ранены, снизьте ваш штраф за ранение на 1 (до минимума 0).
quality.home_ground=Родная земля
quality.home_ground.page=73
quality.home_ground.desc=Проведя где-либо достаточно времени, вы будете знать это место как свои пять пальцев. Вам знаком каждый закоулок и магазинчик.<br/><br/><b>Стоимость:</b> 10 кармы<br/><b>Игровой эффект:</b> Выберите район или сервер Матрицы каждый раз, когда получаете это качество. Проверки Ориентирования или Внимания, выполненные на вашей Родной земле, дают вам очко преимущества для этой проверки.
quality.human-looking=Человекоподобный
quality.human-looking.page=73
quality.human-looking.desc=Маленькие орки, высокие дварфы и уродливые эльфы существуют. Будь то генетика или модификации, вы не похожи на представителя своего метатипа и больше смахиваете на человека.<br/><br/><b>Стоимость:</b> 8 кармы<br/><b>Игровой эффект:</b> На первый взгляд вы в целом похожи на человека и потому получаете +2 кубика к проверкам Маскировки при скрытии своего метатипа и при попытке выдать себя за человека. Тролль и человек не могут получить это качество.
quality.indomitable=Упорство
quality.indomitable.page=73
quality.indomitable.desc=Благодаря глубоким исследованиям, естественному отбору или усиленным тренировкам ваш разум не так податлив. Вы можете дольше держаться под допросом, с лёгкостью оправляться от лёгких ранений и не терять голову под потоком маны.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Стоимость бонусов преимущества снижена на 1 для проверок Воли.
quality.juryrigger=Самопальник
quality.juryrigger.page=73
quality.juryrigger.desc=Даже если у вас нет времени или запчастей для того, чтобы всё сделать правильно, вы всё ещё на это способны. Налепив изоленту, скрутив вместе провода, которые лучше бы не соединять, или же попросту вдарив посильнее, вы способны креативно заставить машину работать, пусть и временно.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Выполняя проверку Самоделки (см. стр. 95), вы получаете очко преимущества, которое нужно потратить на эту проверку, иначе оно исчезнет.
quality.long_reach=Длинный
quality.long_reach.page=73
quality.long_reach.desc=Благодаря длинным рукам, ногам или же исключительной физической ловкости, вам куда проще доставать людей оружием ближнего боя.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> При использовании оружия ближнего боя дистанция вплотную увеличивается с 3 метров до 5.
quality.low-light_vision=Сумеречное зрение
quality.low-light_vision.page=73
quality.low-light_vision.desc=Природная мутация или же импланты позволяют вам видеть в темноте не хуже хищников Шестого мира.<br/><br/><b>Стоимость:</b> 6 кармы<br/><b>Игровой эффект:</b> Вы способны видеть при тусклом свете без штрафов. Если вокруг кромешная тьма, это качество не работает.
quality.magic_resistance=Сопротивление магии
quality.magic_resistance.page=73
quality.magic_resistance.desc=Возможно, вы родились под кровавой луной, ваше тело было наполнено инородными веществами или же часть вашей души высосал дух или вампир. Так или иначе, мана попросту с вами не соединяется.<br/><br/><b>Стоимость:</b> 8 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества для любых проверок сопротивления магии. Когда на вас используют заклинание исцеления, считается, что ваша Сущность на 2 ниже.
quality.mentor_spirit=Дух-наставник
quality.mentor_spirit.page=74
quality.mentor_spirit.desc=Вы верите, что нечто извне ведёт вас и помогает вам направлять магию и что это нечто в вас верит. Будь то тотем Волка, скандинавское божество Локи или же христианский Бог, ваша вера помогает вам использовать ваши магические способности.<br/><br/><b>Стоимость:</b> 10 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусы, указанные в описании вашего духа-наставника (см. стр. 162).
quality.photographic_memory=Фотографическая память
quality.photographic_memory.page=74
quality.photographic_memory.desc=Большинство запоминает свою жизнь лишь отрывками, но у вас словно идёт постоянная запись. Порой вам приходится справляться с огромным потоком информации, но вы способны победить в любой викторине и вспомнить любимый цвет вашего друга детства.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества, совершая проверку Памяти (стр. 68).
quality.quick_healer=Быстрое исцеление
quality.quick_healer.page=74
quality.quick_healer.desc=Обычно вы исцеляетесь от ран быстрее других, что крайне ценно в столь опасной профессии.<br/><br/><b>Стоимость:</b> 8 кармы<br/><b>Игровой эффект:</b> Снизьте интервал между любыми проверками естественного заживления (стр. 121) вдвое — вы восстанавливаете оглушающий урон через полчаса и физический урон через полдня.
quality.resistance_pathogens=Устойчивость к патогенам
quality.resistance_pathogens.page=74
quality.resistance_pathogens.desc=Говоря «я никогда в жизни не болел», вы, скорее всего, говорите правду. У вас очень крепкий иммунитет, способный противостоять всевозможным заразам, что пытаются проникнуть в ваше тело и ослабить вас.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества при проверке сопротивления патогенам.
quality.spirit_affinity=Родство с духами
quality.spirit_affinity.page=74
quality.spirit_affinity.desc=Вы заслужили уважение определённого вида духов. Своими действиями и оказанными услугами вы заработали положительную репутацию, так что к вам они будут весьма внимательны.<br/><br/><b>Стоимость:</b> 14 кармы<br/><b>Игровой эффект:</b> Выберите вид духа. Совершая проверку Воплощения для выбранного вида духов, вы можете получить бонусное очко преимущества, только если потратите его на эту же проверку.
quality.sprite_affinity=Родство со спрайтами
quality.sprite_affinity.page=74
quality.sprite_affinity.desc=Вы заслужили уважение определённого вида спрайтов. Своими действиями в коде вы заработали положительную репутацию, так что к вам они будут весьма внимательны.<br/><br/><b>Стоимость:</b> 14 кармы<br/><b>Игровой эффект:</b> Выберите вид спрайта. Совершая проверку Многозадачности для выбранного вида спрайтов, вы можете получить бонусное очко преимущества, только если потратите его на эту же проверку.
quality.thermographic_vision=Инфразрение
quality.thermographic_vision.page=74
quality.thermographic_vision.desc=Благодаря улучшениям или же банальной генетике, ваше зрение позволяет вам различать разницу в температуре предметов, людей и воздуха вокруг них.<br/><br/><b>Стоимость:</b> 8 кармы<br/><b>Игровой эффект:</b> Вы способны видеть тепло предметов в кромешной тьме (если они теплее или холоднее воздуха вокруг), что позволяет вам работать в подобных условиях.
quality.toughness=Закалённость
quality.toughness.page=74
quality.toughness.desc=Будь то тренировки разума, регулярное самоистязание или же природная выносливость, вы так или иначе способны выдержать больше повреждений и куда лучше справляетесь с полученными ранениями.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества, когда совершаете проверку сопротивления урону.
quality.toxin_resistance=Устойчивость к токсинам
quality.toxin_resistance.page=74
quality.toxin_resistance.desc=Возможно, у вас попросту органы лучше. А может быть, ежедневные укусы ядовитых змей вам кажутся весёлым времяпрепровождением. В любом случае вы куда лучше сопротивляетесь токсинам Шестого мира.<br/><br/><b>Стоимость:</b> 12 кармы<br/><b>Игровой эффект:</b> Вы получаете бонусное очко преимущества, когда совершаете проверку Сопротивления токсинам (стр. 122).
quality.will_to_live=Воля к жизни
quality.will_to_live.page=75
quality.will_to_live.desc=Сколь сильных тумаков вы бы ни получили, вы достаточно выносливы, чтобы продержаться до конца. С пулей .50 калибра в груди вы скорее встанете и дойдёте до госпиталя сами, нежели останетесь лежать на земле.<br/><br/><b>Стоимость:</b> 8 кармы за каждый уровень<br/><b>Игровой эффект:</b> За каждый уровень в этом навыке вы получаете две дополнительные ячейки критического урона (см. стр. 121).

#Qualities - Negative
quality.addiction=Зависимость
quality.addiction.page=75
quality.addiction.desc=От сигарет до ви-жвачки, от тридео-мыла до бёрна — в Шестом мире хватает вещей, вызывающих привыкание. У вас есть зависимость от какого-то вещества, и без него вам трудно функционировать.<br/><br/><b>Бонус:</b> 2 кармы за каждый уровень<br/><b>Игровой эффект:</b> Вы не можете получать или тратить преимущество в период воздержания (см. таблицу зависимости). Вы должны совершать проверки выгорания (стр. 122).
quality.allergy=Аллергия
quality.allergy.page=75
quality.allergy.desc=Возможно, у вас просто насморк и чих от пыльцы, а может быть, это сильная анафилактическая реакция на редкий натуральный арахис. Что бы это ни было, определённые вещества в Шестом мире причиняют вам дискомфорт.<br/><br/><b>Бонус:</b> от 2 до 20 кармы<br/><b>Игровой эффект:</b> Выберите аллерген и тяжесть, чтобы определить значение кармы. Вы не можете тратить или получать преимущество, находясь под действием аллергена.
• <b>Bonus:</b> 2 to 20 Karma. The highest bonus is for a common extreme allergy, with a Karma bonus of 20. The Allergy Table lists a bonus modifier for each other type of allergy. A severe allergy has a –3 modifier, while an uncommon allergen has a –6. These two combine to –9; combining that with 20 makes the bonus from an uncommon severe allergy 11<br/>\
• <b>Game Effect:</b> Select an allergen and severity to determine Karma value. You cannot spend or earn Edge while exposed to your allergen. You also suffer secondary effects, which are listed below.
quality.allergy.choice.allergen=Аллерген
quality.allergy.choice.allergen.rare=Редкий
quality.allergy.choice.allergen.rare.desc=Драгоценные металлы, некоторые виды рыб (иглобрюх, морской окунь)
quality.allergy.choice.allergen.uncommon=Необычный
quality.allergy.choice.allergen.uncommon.desc=Клубника, пшеница, молочные продукты
quality.allergy.choice.allergen.seasonal=Сезонный
quality.allergy.choice.allergen.seasonal.desc=Пыльца, укусы насекомых, сезонная плесень
quality.allergy.choice.allergen.common=Распространённый
quality.allergy.choice.allergen.common.desc=Трава, плесень, соя
quality.allergy.choice.severity=Тяжесть
quality.allergy.choice.severity.mild=Лёгкая
quality.allergy.choice.severity.mild.desc=Штраф -2 кубика ко всем проверкам при воздействии аллергена
quality.allergy.choice.severity.moderate=Умеренная
quality.allergy.choice.severity.moderate.desc=Штраф -4 кубика ко всем проверкам при воздействии аллергена
quality.allergy.choice.severity.severe=Тяжёлая
quality.allergy.choice.severity.severe.desc=Штраф -4 кубика и невозможность восстанавливать счётчик оглушения
quality.allergy.choice.severity.extreme=Экстремальная
quality.allergy.choice.severity.extreme.desc=Штраф -6 кубиков ко всем проверкам и постоянный физический урон
quality.allergy.choice.description=Описание аллергии
quality.ar_vertigo=Головокружение от ДР
quality.ar_vertigo.page=76
quality.ar_vertigo.desc=Все эти мигающие огоньки, окна чата и постоянно меняющиеся рекламные баннеры вызывают у вас тошноту. В прямом смысле.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Вы не можете получать или тратить преимущество, пока подключены к дополненной реальности. Сюда включается использование коммуникаторов, смартлинков и других устройств с интерфейсом ДР.
• <b>Bonus:</b> 10 Karma<br/>• <b>Game Effect:</b> You cannot gain or spend Edge while utilizing AR of any sort. You also gain the Nauseated status (p. 52) while using AR and for one hour after you exit it.
quality.astral_beacon=Астральный маяк
quality.astral_beacon.page=76
quality.astral_beacon.desc=Ваша астральная сигнатура сияет, словно сверхновая в тёмную ночь. Любой маг на районе способен вас опознать, а духи слетаются к вам, как мотыльки на пламя.<br/><br/><b>Бонус:</b> 10 кармы<br/><b>Игровой эффект:</b> Любые попытки выследить вас по астральному следу получают +2 кубика. Ваш астральный след держится вдвое дольше обычного (см. стр. 160).
quality.bad_luck=Неудача
quality.bad_luck.page=76
quality.bad_luck.desc=Вы родились под несчастливой звездой, разбили зеркало, просыпали соль, были прокляты, или же попросту вам не везёт. Какой бы ни была причина, всё вокруг вас попросту идёт наперекосяк. И часто.<br/><br/><b>Бонус:</b> 10 кармы<br/><b>Игровой эффект:</b> Сбои происходят чаще. Для определения сбоя считайте результаты 1 и 2 на кубиках. Это не влияет на критические сбои.
quality.bad_rep=Дурная репутация
quality.bad_rep.page=76
quality.bad_rep.desc=Возможно, вы бросили напарника в критический момент, провалили громкое дело или просто перешли дорогу не тому человеку. Как бы то ни было, улицы вас помнят — и не с лучшей стороны.<br/><br/><b>Бонус:</b> 8 кармы<br/><b>Игровой эффект:</b> Вы начинаете игру с 2 очками Дурной славы (см. стр. 68). Вы не можете избавиться от этой Дурной славы в ходе игры.
quality.combat_paralysis=Боевой паралич
quality.combat_paralysis.page=76
quality.combat_paralysis.desc=Когда начинается пальба, вы замираете. Ваш мозг отказывается обрабатывать происходящий кошмар, а тело не слушается команд.<br/><br/><b>Бонус:</b> 8 кармы<br/><b>Игровой эффект:</b> В первом раунде любого боя ваш уровень инициативы делится пополам (с округлением вверх). Вы не можете тратить преимущество в первом раунде боя.
quality.dependents=Иждивенцы
quality.dependents.page=76
quality.dependents.desc=Дети, любовники или кто-то ещё финансово зависят от вас. Они живут с вами, едят вашу еду, используют ваш тридео-аккаунт и в целом требуют затрат нюйен, что вынуждает вас искать следующую работу.<br/><br/><b>Бонус:</b> 4 кармы за каждый уровень<br/><b>Игровой эффект:</b> Выберите уровень качества (1-3). Соответствующий процент от любого вашего заработка уходит на содержание иждивенцев (5%, 10% или 15%).
• <b>Game Effect:</b> Choose a level for the dependents. <br/><em>Level 1</em> dependents are the equivalent of a family member who does not live with you but still needs support. Five percent of any score goes to this person. <br/><i>Level 2</i> dependents are more stable costs, like the support of a high-maintenance significant other, a child, or a small family. This level costs the runner 10 percent of every score. <br/><i>Level 3</i> dependents are rare in the shadows, because most runners don’t have a regular family and a second life outside the shadows, which is what this level entails. This level costs the runner 25 percent of all their scores.<br/><br/>\
For purposes of this quality, a “score” is any income that comes their way. Job payments, fencing stolen goods or paydata, or even gambling winnings. The people important to you prosper when you do!
quality.distinctive_style=Неповторимый стиль
quality.distinctive_style.page=77
quality.distinctive_style.desc=Неоновый ирокез, хромированные клыки, плащ из натуральной кожи дракона или светящиеся татуировки во всё тело. Вы выглядите так, что вас невозможно забыть.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Любые попытки найти или опознать вас получают +2 кубика. Вы не можете слиться с толпой или притвориться кем-то заурядным.
quality.elf_poser=Подражающий эльфам
quality.elf_poser.page=77
quality.elf_poser.desc=Вы человек (или орк), но отчаянно хотите быть эльфом. Пластическая хирургия, накладные уши, поддельный акцент Тира и постоянные попытки выглядеть изящно.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Эльфы получают очко преимущества при социальных проверках против вас, если понимают, что вы притворяетесь. Если обман раскрыт, вы получаете штраф -2 ко всем социальным проверкам с эльфами.
quality.glass_jaw=Стеклянная челюсть
quality.glass_jaw.page=77
quality.glass_jaw.desc=Один хороший хук — и вы в отключке. Вы совершенно не умеете держать удар в челюсть.<br/><br/><b>Бонус:</b> 4 кармы<br/><b>Игровой эффект:</b> Каждый раз, когда вы получаете физический или оглушающий урон в ближнем бою, вы получаете дополнительную ячейку оглушающего урона.
quality.gremlins=Гремлин
quality.gremlins.page=77
quality.gremlins.desc=Коммуникаторы затихают, оружие клинит, шины лопаются — техника просто ненавидит вас. Стоит вам взять в руки что-то сложнее кирпича, как оно ломается.<br/><br/><b>Бонус:</b> 4 кармы за каждый уровень<br/><b>Игровой эффект:</b> При использовании любых сложных устройств порог для определения сбоя увеличивается на 1 за каждый уровень качества.
quality.honorbound=Связан честью
quality.honorbound.page=77
quality.honorbound.desc=У вас есть строгий кодекс чести, которому вы следуете, несмотря ни на что. Будь то бусидо, рыцарский кодекс или простое правило никогда не стрелять в спину.<br/><br/><b>Бонус:</b> 10 кармы<br/><b>Игровой эффект:</b> Если вы нарушаете свой кодекс, вы теряете все накопленные очки преимущества и не можете получать или тратить преимущество до искупления вины.
• <b>Bonus:</b> 10 Karma<br/>\
• <b>Game Effect:</b> You cannot spend or earn Edge for twenty-four hours after you break a tenet of your code. If the same tenet is broken multiple times or broken again during the twenty-four hour period, each infraction adds another forty-eight hours onto the initial twenty-four. If a different tenet is broken, it’s twenty-four hours for that one added to any current infractions, and the same rules apply for additional violations. See the Honorbound sidebar for some sample codes and tenets.
quality.impaired=Слабак (характеристика)
quality.impaired.page=77
quality.impaired.desc=Кому-то матушка Природа попросту не отсыпала талантов. Искалеченное колено, плохая генетика или же детская болезнь привели к тому, что вы не сможете достичь того же уровня, что и ваши сверстники.<br/><br/><b>Бонус:</b> 8 кармы за каждый уровень<br/><b>Игровой эффект:</b> Максимальный уровень выбранной характеристики снижен на 1 за каждый уровень качества (до минимума 1).
• <b>Bonus:</b> 8 Karma per level<br/>\
• <b>Game Effect:</b> For each level, the character’s maximum for the chosen attribute decreases by 1, to a minimum of 2.
quality.incompetent=Неумёха (навык)
quality.incompetent.page=77
quality.incompetent.desc=Сколь бы вы ни тренировались и ни пытались всё понять, есть некоторые навыки, которые вы попросту неспособны освоить.<br/><br/><b>Бонус:</b> 10 кармы<br/><b>Игровой эффект:</b> Выберите навык. Вы не можете получать уровни в этом навыке и не можете использовать его даже без изучения.
• <b>Bonus:</b> 10 Karma<br/>\
• <b>Game Effect:</b> When this quality is chosen, select a skill. You are unable to gain ranks in the selected skill. You cannot be Incompetent in skills you have no chance to perform— so you cannot choose this quality for Magic skills if you do not have a Magic rating, and you cannot choose it for Tasking if you do not have a Resonance rating. This skill may only be selected once.
quality.in_debt=Задолженность
quality.in_debt.page=78
quality.in_debt.desc=Вы заняли деньги не у того человека или не у того синдиката. Теперь за вами висит долг, проценты капают каждую неделю, а коллекторы уже точат биты.<br/><br/><b>Бонус:</b> от 2 до 10 кармы<br/><b>Игровой эффект:</b> Вы должны выплачивать 10% от суммы долга каждую неделю только в качестве процентов. Если вы пропустите платёж, к вам придут гости.
• <b>Bonus:</b> None<br/>\
• <b>Game Effect:</b> When you spend Karma for cash, every point of Karma you spend gets you 5,000 instead of 2,000 nuyen. Each point of Karma spent also puts you 5,000 nuyen into debt with someone very dangerous and capable of collecting. You must pay a monthly interest rate of 500 nuyen per Karma spent, in addition to any payment to the principal. If the interest is not paid, the lenders come searching for you. The quality can be bought off purely with money; if the principal is repaid the quality is eliminated.<br/>This quality can be obtained only during character creation, not during gameplay.
quality.insomnia=Бессонница
quality.insomnia.page=78
quality.insomnia.desc=Вы ворочаетесь часами, глядя в потолок, а когда наконец засыпаете, вас мучают кошмары. Утром вы чувствуете себя так, словно вас переехал грузовик.<br/><br/><b>Бонус:</b> 4 кармы<br/><b>Игровой эффект:</b> Пройдите проверку Воли + Тела (2) после отдыха. При провале вы не восстанавливаете счётчик оглушения и получаете штраф -1 кубик ко всем проверкам на следующий день.
• <b>Bonus:</b> 4 Karma<br/>\
• <b>Game Effect:</b> Without proper rest, you can’t regain Edge or spend it as you might like. Each day the runner must make a Body + Willpower (3) test to get a successful night of rest. If they fail, they cannot earn more than two Edge from any source that day. Also, they cannot spend more than 2 Edge on any given test. The purchase and use of a sleep regulator reduces the threshold on the test to 1. The runner can also purchase medication (50 nuyen/dose) that reduces the threshold to 2.
quality.loss_confidence=Неуверенность
quality.loss_confidence.page=79
quality.loss_confidence.desc=Крупный провал в прошлом подорвал вашу веру в себя в критической области. Стоит делу коснуться этого вопроса, как вы начинаете сомневаться в каждом шаге.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Выберите навык. При совершении проверок с этим навыком вы не можете тратить преимущество.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> During any encounter, the runner must make a Willpower (2) test as a Minor Action. Failure means they cannot earn or spend Edge for the entire encounter.
quality.low_pain_tolerance=Низкий болевой порог
quality.low_pain_tolerance.page=79
quality.low_pain_tolerance.desc=Даже царапина кажется вам смертельной раной, а синяк заставляет скулить от боли. Вы совершенно не приспособлены переносить физические страдания.<br/><br/><b>Бонус:</b> 10 кармы<br/><b>Игровой эффект:</b> Все штрафы от ранений удваиваются (штраф -2 за каждые 3 ячейки урона вместо -1).
• <b>Bonus:</b> 10 Karma<br/>\
• <b>Game Effect:</b> All wound modifiers are doubled.
quality.ork_poser=Подражающий оркам
quality.ork_poser.page=79
quality.ork_poser.desc=Вы завидуете грубой силе и уличной культуре орков. Накладные клыки, искусственная кожа и попытки говорить на ор’зете.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Настоящие орки и тролли легко видят фальшь и получают очко преимущества при социальных проверках против вас.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> Elves, orks, and trolls gain a point of Edge in Influence (Etiquette) tests made against you.
quality.prejudiced=Предубеждение (группа)
quality.prejudiced.page=79
quality.prejudiced.desc=У вас достаточно укоренившиеся взгляды и мнение по поводу определённой группы, и сколь бы вас ни переубеждали, вы знаете, что нет в них ничего хорошего.<br/><br/><b>Бонус:</b> 4 или 8 кармы<br/><b>Игровой эффект:</b> Вы получаете штраф -2 кубика ко всем социальным проверкам при взаимодействии с представителями этой группы.
• <b>Bonus:</b> 8 Karma<br/>\
• <b>Game Effect:</b> Select a specific group or type of people. You are unable to gain or use Edge while the object of your prejudice is present (unless you’re directly opposing them).<br/>\
• <b>Note:</b> Gamemasters and players should use this quality carefully. Everyone in the group should be on board with it being used, and it should never be used as a veiled excuse to state real-world prejudices or verbally attack, either directly or indirectly, other players.
quality.scorched=Выжженный
quality.scorched.page=79
quality.scorched.desc=Матрица, симсенс или жучок поджарил вам нейроны до такой степени, что воспоминания об этом преследуют вас постоянно.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> При получении урона от биоотдачи вы получаете на 1 ячейку урона больше. В горячем симе вы получаете состояние Паника.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> You cannot spend Edge while accessing the Matrix. This includes through use of commlinks, smartlinks, and any other source of data coming in from the ether.
quality.sensitive_system=Чувствительная система
quality.sensitive_system.page=79
quality.sensitive_system.desc=Ваш организм категорически отвергает инородные тела. Металл и пластик киберимплантов вызывают воспаление и отторжение плоти.<br/><br/><b>Бонус:</b> 8 кармы<br/><b>Игровой эффект:</b> Потеря Сущности от всех киберимплантов (но не биоимплантов) удваивается.
• <b>Bonus:</b> 8 Karma<br/>\
• <b>Game Effect:</b> Essence costs are doubled for all cyberware, bioware, and nanoware. Geneware suffers no ill effects.<br/>You cannot have this quality if you have a Magic or Resonance rating.
quality.simsense_vertigo=Головокружение от симсенса
quality.simsense_vertigo.page=79
quality.simsense_vertigo.desc=Вас начинает тошнить, когда вы используете Матрицу с виртуальной реальностью.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Вы не можете получать или тратить преимущество, когда входите в Матрицу через ВР. Вы также получаете состояние Тошнота (стр. 54) на время использования ВР и ещё час после выхода из неё.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> You cannot gain or spend Edge while accessing the Matrix via VR. You also receive the Nauseated status (p. 52) for one hour after you log off the Matrix.
quality.sinner=Грешник
quality.sinner.page=79
quality.sinner.desc=У вас есть официальный идентификационный номер (SIN) — национальный, корпоративный или даже статус гражданина мегакорпорации.<br/><br/><b>Бонус:</b> от 4 до 12 кармы<br/><b>Игровой эффект:</b> Вы платите налоги с каждого дохода (от 10% до 20%) и находитесь в базах данных властей или корпорации.
• <b>Bonus:</b> 8 Karma<br/>\
• <b>Game Effect:</b> You pay taxes to the issuer of your SIN, either a megacorporation or a nation. This cost comes as a 10 percent increase in the cost of the lifestyle associated with this SIN.<br/>Due to data within the Global SIN Registry, you are easier to track or identify, giving opponents a point of Edge every time they attempt a Trace Icon action against you.
quality.social_stress=Стрессовое расстройство
quality.social_stress.page=79
quality.social_stress.desc=Травмирующее событие в прошлом заставляет вас терять контроль над собой в определённых стрессовых ситуациях.<br/><br/><b>Бонус:</b> 8 кармы<br/><b>Игровой эффект:</b> В стрессовой ситуации пройдите проверку Воли + Харизмы (2). При провале вы получаете штраф -2 ко всем проверкам до конца сцены.
• <b>Bonus:</b> 8 Karma<br/>\
• <b>Game Effect:</b> Select a specific social stressor. When encountering your social stressor, you must make a Charisma (2) test as a Minor Action. Failure means you cannot earn or spend Edge until you succeed. You can choose not to take the test but if so, any tests made against you gain a bonus Edge.
quality.spirit_bane=Проклятый духом (вид)
quality.spirit_bane.page=80
quality.spirit_bane.desc=Возможно, вы оскорбили великого духа или осквернили священное место. Определённый вид духов искренне ненавидит вас.<br/><br/><b>Бонус:</b> 12 кармы<br/><b>Игровой эффект:</b> Духи этого вида получают бонусное очко преимущества при атаках против вас и всегда выбирают вас приоритетной целью.
• <b>Bonus:</b> 12 Karma<br/>\
• <b>Game Effect:</b> When selecting this quality, choose a type of spirit or sprite. Spirits/sprites from that category gain a bonus point of Edge when you attempt a Conjuring or Tasking test against them. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.<br/>In combat, spirits/sprites of the chosen type will attack you first and relentlessly, often to the point of savaging a dead body or bricking a deck if they have nothing else to do.
quality.sprite_bane=Проклятый спрайтом (вид)
quality.sprite_bane.page=80
quality.sprite_bane.desc=Определённый вид резонансных сущностей питает к вам врождённую неприязнь. Стоит вам появиться в узле, как они нападают.<br/><br/><b>Бонус:</b> 12 кармы<br/><b>Игровой эффект:</b> Спрайты этого вида получают бонусное очко преимущества в атаках против вашего аватара и стремятся скомпрометировать ваши файлы.
• <b>Bonus:</b> 12 Karma<br/>\
• <b>Game Effect:</b> When selecting this quality, choose a type of spirit or sprite. Spirits/sprites from that category gain a bonus point of Edge when you attempt a Conjuring or Tasking test against them. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.<br/>In combat, spirits/sprites of the chosen type will attack you first and relentlessly, often to the point of savaging a dead body or bricking a deck if they have nothing else to do.
quality.uncouth=Грубиян
quality.uncouth.page=80
quality.uncouth.desc=Тактичность, манеры, эмпатия — эти слова вам неизвестны. Вы грубы, резки и способны оскорбить любого собеседника за первые три секунды разговора.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Вы не можете использовать навык Убеждения без изучения. Стоимость очков преимущества в социальных проверках для вас увеличивается на 1.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> You cannot spend Edge on any test using Charisma.
quality.uneducated=Необразованный
quality.uneducated.page=80
quality.uneducated.desc=Вы выросли на помойке, в изоляции или в глуши, где никто не учил вас читать сложные тексты или понимать науку.<br/><br/><b>Бонус:</b> 6 кармы<br/><b>Игровой эффект:</b> Вы не можете тратить преимущество во всех проверках Логики. Технические и научные навыки стоят вдвое дороже при повышении.
• <b>Bonus:</b> 6 Karma<br/>\
• <b>Game Effect:</b> You cannot spend Edge on any test using Logic.
quality.unsteady_hands=Дрожь в руках
quality.unsteady_hands.page=80
quality.unsteady_hands.desc=Ваши руки дрожат — от нервов, последствий стимуляторов или старой травмы. Тонкая моторика даётся вам с огромным трудом.<br/><br/><b>Бонус:</b> 4 кармы<br/><b>Игровой эффект:</b> Вы получаете штраф -2 кубика ко всем проверкам ловкости рук, взлома замков и стрельбы, если перед этим двигались.
• <b>Bonus:</b> 4 Karma<br/>\
• <b>Game Effect:</b> You cannot spend Edge on any test using Agility that directly involves your hands (that is, a Stealth test to pull off sleight-of-hand would directly involve the hands, as would an Attack test with any weapon held in the hands, but an Athletics test involving running would not, even though the hands are in motion while running).
quality.weak_immune_system=Слабый иммунитет
quality.weak_immune_system.page=80
quality.weak_immune_system.desc=Любой сквозняк оборачивается пневмонией, а царапина гноится неделями. Ваша иммунная система практически не сопротивляется инфекциям.<br/><br/><b>Бонус:</b> 8 кармы<br/><b>Игровой эффект:</b> Порог проверок сопротивления болезням и патогенам увеличивается на 2. Вы получаете на 1 ячейку урона больше от токсинов контактного действия.
• <b>Bonus:</b> 8 Karma<br/>\
• <b>Game Effect:</b> You cannot spend Edge to resist the effects of an infection. The threshold for fighting off any infection you are exposed to is increased by 1. While suffering the ill effects of an illness, you suffer a –1 dice pool modifier to all tests.

#Rituals
ritualfeature.anchored=Привязанный
ritualfeature.anchored.page=144
ritualfeature.anchored.desc=Привязанные ритуалы накладываются на физический объект или мистический символ.
ritualfeature.material_link=Материальная связь
ritualfeature.material_link.page=144
ritualfeature.material_link.desc=Ритуал требует материальной связи с целью (прядь волос, кровь, предмет одежды).
ritualfeature.minion=Слуга
ritualfeature.minion.page=144
ritualfeature.minion.desc=Ритуал создаёт полуавтономную сущность, обычно магического слугу.
ritualfeature.spell=Заклинание
ritualfeature.spell.page=144
ritualfeature.spell.desc=Ритуал проводится в связке с заклинанием, известным лидеру ритуала.
ritualfeature.spotter=Наводчик
ritualfeature.spotter.page=144
ritualfeature.spotter.desc=Если цель ритуала не находится в зоне видимости лидера, лидеру требуется назначить наводчика.
The target does not have to be astrally active (and it’s often safer for the spotter if they aren’t); the spotter merely must be able to assense them to establish the necessary mystic link. If the spell is an area spell, the spotter must be able to assense the target location.<br/>\
For the duration of the ritual, a link is present between the spotter’s aura and the ritual group. If the spotter is noticed by the target, it is possible to use the link to track them back to the ritual team’s physical location. The spotter doesn’t make a Teamwork test with the rest of the participants but still suffers the same drain as everyone else.
ritual.circle_of_healing=Круг исцеления
ritual.circle_of_healing.page=144
ritual.circle_of_healing.desc=Этот ритуал используется для одновременного наложения заклинания категории Исцеление на несколько целей сразу в пределах круга.
ritual.circle_of_protection=Круг защиты
ritual.circle_of_protection.page=144
ritual.circle_of_protection.desc=Круг защиты создаёт небольшой астральный и физический барьер, препятствующий проходу незваных духов и рассеивающий враждебную ману.
The barrier lasts for a number of hours equal to the net hits from the sealing step. Anyone or anything within the barrier is protected from outside physical objects and magical attacks. If something crosses the barrier from the inside, then the ward ends. This ritual takes four hours to perform.
ritual.curse=Проклятие
ritual.curse.page=145
ritual.curse.desc=Проклятие позволяет сотворить заклинание категории Иллюзия на субъекта через материальную связь на любом расстоянии.
The link is used as part of the offering and is destroyed during the ritual. The spell is cast normally (using teamwork, if applicable) with all the tests and appropriate Drain.<br/>\
For the duration of the ritual, a link is present between the target and the ritual group while the spell portion is sustained. It is possible to spot the link astrally and track it back to the ritual team’s physical location.<br/>This ritual requires three hours to complete.
ritual.prodigal_spell=Блуждающее заклинание
ritual.prodigal_spell.page=145
ritual.prodigal_spell.desc=Позволяет сотворить боевое заклинание на цель на любом расстоянии через материальную связь.
ritual.remote_sensing=Дистанционное восприятие
ritual.remote_sensing.page=145
ritual.remote_sensing.desc=Позволяет сотворить заклинание Обнаружения на удалённую точку через материальную связь или наводчика.
This ritual takes three hours to perform. Afterward, if any of the participants stops sustaining the ritual, it ends.
ritual.renascence=Возрождение
ritual.renascence.page=145
ritual.renascence.desc=Поддерживает заклинание управления по области в течение длительного времени.
ritual.ward=Оберег
ritual.ward.page=145
ritual.ward.desc=Оберег создаёт долговременный астральный барьер вокруг помещения или здания, блокирующий астральное зрение и проход астральных сущностей.
ritual.watcher=Наблюдатель
ritual.watcher.page=146
ritual.watcher.desc=Создаёт духа-наблюдателя для слежки, передачи сообщений и поиска астральных следов.

#Skills
skill.astral=Астрал
skill.astral.page=93
skill.astral.desc=Этот навык могут использовать только полноценные и аспектные маги, а также адепты и мистические адепты со способностью Астральное восприятие. Навык имеет два основных применения: считывание астральных аур (см. стр. 160) и астральный бой (см. стр. 161).
skill.astral.skillspec.astral_combat=Астральный бой
skill.astral.skillspec.astral_signatures=Астральные следы
skill.astral.skillspec.emotional_stress=Эмоциональный стресс
skill.astral.skillspec.spirit_types=Типы духов
skill.athletics=Атлетика
skill.athletics.page=93
skill.athletics.desc=Навык Атлетики отвечает за физическую форму, ловкость и выносливость метачеловека. Он охватывает бег, прыжки, лазание, плавание, гимнастику, а также метание предметов и стрельбу из лука.
skill.athletics.skillspec.archery=Стрельба из лука
skill.athletics.skillspec.climbing=Лазание
skill.athletics.skillspec.flying=Полёт
skill.athletics.skillspec.freefall=Свободное падение
skill.athletics.skillspec.gymnastics=Гимнастика
skill.athletics.skillspec.sprinting=Рывок
skill.athletics.skillspec.swimming=Плавание
skill.athletics.skillspec.throwing=Метание
skill.biotech=Биотехнологии
skill.biotech.page=94
skill.biotech.desc=Этот навык предназначен для персонажей, разбирающихся в биологии метачеловека. В Шестом мире это также включает понимание того, как плоть взаимодействует с хромом и кремнием имплантов, первую помощь, хирургию и медицину.
skill.biotech.skillspec.biotechnology=Биотехнология
skill.biotech.skillspec.cybertechnology=Кибертехнология
skill.biotech.skillspec.first_aid=Первая помощь
skill.biotech.skillspec.medicine=Медицина
skill.close_combat=Ближний бой
skill.close_combat.page=94
skill.close_combat.desc=Вы рядом с противником? Хотите сделать ему больно? Используйте этот навык! Будь то удары кулаками, ногами, когтями, ножами, мечами, дубинками или боевыми топорами — этот навык покрывает всё рукопашное оружие.
skill.close_combat.skillspec.blades=Клинки
skill.close_combat.skillspec.clubs=Дробящее оружие
skill.close_combat.skillspec.unarmed=Безоружный бой
skill.close_combat.skillspec.unarmed.short=Безоружное
skill.con=Обман
skill.con.page=94
skill.con.desc=Ключевой аспект этого навыка — убеждение, при котором вы выдаёте себя за другого, вводите в заблуждение, манипулируете фактами, блефуете, соблазняете или притворяетесь кем-то, кем на самом деле не являетесь.
skill.con.skillspec.acting=Актёрство
skill.con.skillspec.disguise=Маскировка
skill.con.skillspec.impersonation=Подражание
skill.con.skillspec.performance=Выступление
skill.con.skillspec.seduction=Соблазнение
skill.conjuring=Воплощение
skill.conjuring.page=94
skill.conjuring.desc=Этот навык позволяет вам призывать и изгонять духов. Подробнее см. раздел «Воплощение» на стр. 146.
skill.conjuring.skillspec.banishing=Изгнание
skill.conjuring.skillspec.summoning=Призывание
skill.cracking=Взлом
skill.cracking.page=94
skill.cracking.desc=Навык взлома позволяет преодолевать защиту узлов, взламывать устройства, искать уязвимости, вести кибербой и подавлять вражеские электронные сигналы в Матрице.
skill.cracking.skillspec.cybercombat=Кибербой
skill.cracking.skillspec.electronic_warfare=Радиоэлектронная борьба
skill.cracking.skillspec.hacking=Хакерство
skill.electronics=Электроника
skill.electronics.page=94
skill.electronics.desc=Этот навык охватывает использование, настройку и программирование компьютеров, коммуникаторов и дек, а также работу с программным обеспечением и сложными формами техномантов.
skill.electronics.skillspec.computer=Компьютеры
skill.electronics.skillspec.hardware=Техника
skill.electronics.skillspec.software=Программирование
skill.electronics.skillspec.complex_forms=Сложные формы
skill.enchanting=Зачарование
skill.enchanting.page=95
skill.enchanting.desc=Этот навык позволяет создавать алхимические препараты, изготавливать магические источники и снимать зачарование с чужих магических предметов (см. стр. 151).
skill.enchanting.skillspec.alchemy=Алхимия
skill.enchanting.skillspec.artificing=Создание артефактов
skill.enchanting.skillspec.disenchanting=Разочарование
skill.engineering=Инженерное дело
skill.engineering.page=95
skill.engineering.desc=Инженерное дело отвечает за ремонт, модификацию и создание машин, оружия, транспортных средств, замков, а также за подрывные работы и стрельбу из тяжёлых турелей.
skill.engineering.skillspec.aeronautics_mechanic=Авиамеханика
skill.engineering.skillspec.armorer=Оружейник
skill.engineering.skillspec.automotive_mechanic=Автомеханика
skill.engineering.skillspec.demolitions=Подрывное дело
skill.engineering.skillspec.gunnery=Орудийное дело
skill.engineering.skillspec.industrial_mechanic=Промышленная механика
skill.engineering.skillspec.lockpicking=Взлом замков
skill.engineering.skillspec.nautical_mechanic=Судовая механика
skill.exotic_weapons=Экзотическое оружие
skill.exotic_weapons.page=95
skill.exotic_weapons.desc=Этот навык охватывает всё необычное вооружение: монофиламентные хлысты, лазеры, огнемёты, распылители и природные метагенетические атаки.
skill.exotic_weapons.skillspec.air=Пневматическое оружие
skill.exotic_weapons.skillspec.brawling=Оружие ближнего боя
skill.exotic_weapons.skillspec.chainsaws=Бензопилы
skill.exotic_weapons.skillspec.emitter=Энергетическое оружие
skill.exotic_weapons.skillspec.laser=Лазерное оружие
skill.exotic_weapons.skillspec.launchers=Пусковые установки
