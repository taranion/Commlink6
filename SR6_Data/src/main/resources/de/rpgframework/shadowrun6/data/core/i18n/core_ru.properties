item.wired_reflexes=Проводные рефлексы
item.wired_reflexes.page=287
item.wired_reflexes.desc=Прошивка рефлексов — имплантированная система разгона нервной системы, дающая огромный бонус к инициативе.
item.wired_reflexes.wifi=Система совместима с беспроводными усилителями реакции. Активация и деактивация требует простого действия.

