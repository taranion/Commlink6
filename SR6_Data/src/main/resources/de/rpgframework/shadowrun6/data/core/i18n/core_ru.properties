item.voice_modulator.desc=Голосовой модулятор позволяет идеально имитировать чужие голоса и воспроизводить звуки на любых частотах.
item.voice_modulator.wifi=Добавьте рейтинг модулятора голоса к пулу кубиков проверки навыка Убеждения на основе голоса.
item.cybereye=Киберглаза
