#Complex Forms
complexform.cleaner=Чистильщик
complexform.cleaner.page=190
complexform.cleaner.desc=Проверка Электроники + Резонанса. Каждый успех снижает показатель надзора на 1.
complexform.diffusion=Диффузия
complexform.diffusion.page=190
complexform.diffusion.desc=Встречная проверка Электроники + Резонанса против Воли + Сетевого экрана. Чистые успехи снижают характеристику цели.
complexform.editor=Редактор
complexform.editor.page=190
complexform.editor.desc=Действие Редактировать файл без необходимого уровня доступа к файлу.
complexform.emulate=Эмулятор
complexform.emulate.page=190
complexform.emulate.desc=Эмуляция работы программы или автософта с рейтингом, равным текущей Вычислительной мощности техноманта.
complexform.infusion=Инфузия
complexform.infusion.page=190
complexform.infusion.desc=Проверка Электроники + Резонанса (порог 4). Чистые успехи увеличивают характеристику цели вплоть до удвоенного значения.
complexform.mirrored_persona=Зеркальный аватар
complexform.mirrored_persona.page=190
complexform.mirrored_persona.desc=Создание точной копии аватара техноманта в Матрице для отвлечения атак противников.
complexform.pulse_storm=Импульсная буря
complexform.pulse_storm.page=190
complexform.pulse_storm.desc=Проверка Электроники + Резонанса против Логики + ВМ. Чистые успехи увеличивают уровень шума цели на 1.
complexform.puppeteer=Кукловод
complexform.puppeteer.page=190
complexform.puppeteer.desc=Действие Контролировать устройство без необходимого уровня доступа.
complexform.resonance_channel=Резонансный канал
complexform.resonance_channel.page=190
complexform.resonance_channel.desc=Проверка Электроники + Резонанса. Успехи снижают уровень шума для техноманта на 1.
complexform.resonance_spike=Резонансный шип
complexform.resonance_spike.page=190
complexform.resonance_spike.desc=Проверка Взлома + Резонанса против Воли + Сетевого экрана цели; чистые успехи наносят урон в Матрице без сопротивления.
complexform.resonance_veil=Резонансная вуаль
complexform.resonance_veil.page=190
complexform.resonance_veil.desc=Создание иллюзии матрицы с визуальными, звуковыми и сенсорными данными.
complexform.static_bomb=Взрыв помех
complexform.static_bomb.page=190
complexform.static_bomb.desc=Встречная проверка против всех наблюдателей: цели теряют вас из виду и должны заново искать через Внимание в Матрице.
complexform.static_veil=Вуаль помех
complexform.static_veil.page=191
complexform.static_veil.desc=Пока форма поддерживается, цель не накапливает показатель надзора от поддержания незаконного доступа.
complexform.stitches=Заплатка
complexform.stitches.page=191
complexform.stitches.desc=Проверка Электроники + Резонанса. Каждый чистый успех восстанавливает 1 ячейку урона в Матрице спрайту.
complexform.tattletale=Донос
complexform.tattletale.page=191
complexform.tattletale.desc=Проверка Электроники + Резонанса. Каждый успех увеличивает показатель надзора цели на 1.

#Critter Powers - Sprites
critterpower.camouflage=Маскировка
critterpower.camouflage.page=194
critterpower.camouflage.desc=Спрайт скрывает файл внутри другого файла, делая его невидимым без специальной проверки Взлома.
critterpower.cookie=Куки
critterpower.cookie.page=194
critterpower.cookie.desc=Спрайт метит аватар цели скрытым файлом-маячком, позволяя отслеживать все перемещения и действия в Матрице.
critterpower.diagnostics=Диагностика
critterpower.diagnostics.page=194
critterpower.diagnostics.desc=Спрайт оценивает внутреннюю структуру электронного устройства и оптимизирует его работу, повышая эффективность.
critterpower.electron_storm=Электрошторм
critterpower.electron_storm.page=194
critterpower.electron_storm.desc=Спрайт окутывает аватар цели шквалом паразитных потоков данных, нанося продолжительный урон в Матрице и создавая помехи.
critterpower.hash=Хеш
critterpower.hash.page=194
critterpower.hash.desc=Спрайт временно защищает файл уникальным резонансным алгоритмом, снять который может только он сам.
critterpower.override=Вмешательство
critterpower.override.page=194
critterpower.override.desc=Спрайт перехватывает управление устройством, действующим на автопилоте, заменяя рейтинг автопилота своим уровнем.
critterpower.phantom=Фантом
critterpower.phantom.page=194
critterpower.phantom.desc=Спрайт маскирует аватар или иконку устройства в коде Матрицы, скрывая его от посторонних глаз.
critterpower.stability=Стабильность
critterpower.stability.page=194
critterpower.stability.desc=Спрайт защищает аватар или устройство от шума и деградации сигнала, восстанавливая стабильность соединения.
critterpower.suppression=Подавление
critterpower.suppression.page=194
critterpower.suppression.desc=Спрайт подавляет защитные программы хоста, задерживая активацию защитного софта.
critterpower.trap=Капкан
critterpower.trap.page=194
critterpower.trap.desc=Атака позволяет заблокировать целевой аватар, препятствуя выходу из системы и разрыву связи с узлом.
critterpower.watermark=Водяной знак
critterpower.watermark.page=195
critterpower.watermark.desc=Спрайт помечает иконку невидимой меткой, позволяя техноманту безошибочно опознавать её в будущем.

#Critter Powers
critterpower.accident=Несчастный случай
critterpower.accident.page=221
critterpower.accident.desc=Криттер вызывает цепочку нелепых случайностей, заставляя цель спотыкаться, ронять оружие или попадать в аварии.
critterpower.animal_control=Контроль животных
critterpower.animal_control.page=221
critterpower.animal_control.desc=Позволяет подчинять своей воле обычных животных того же биологического вида.
critterpower.armor=Броня
critterpower.armor.page=221
critterpower.armor.desc=Чешуя, костяные наросты, толстая шкура или покров маны повышают значение защиты криттера.
critterpower.astral_form=Астральная форма
critterpower.astral_form.page=222
critterpower.astral_form.desc=Криттер существует исключительно на астральном плане и неуязвим для физических атак.
critterpower.binding=Связывание
critterpower.binding.page=222
critterpower.binding.desc=Паутина, слизь или клейкие выделения обездвиживают цель, лишая её возможности двигаться.
The range of this power depends on how the critter binds its targets; it may shoot something (Range: LOS), have a sticky body (Range: Touch), or just be good at sticking to things (Range: Self).<br/>\
For LOS range, the critter makes an attack using Magic + Agility vs. Athletics + Reaction. A successful hit applies the Immobilized status. The target is affected and must spend a Major Action on its turn in order to make an escape attempt.<br/>\
For Touch range, the critter makes an attack using Magic + Agility vs. Close Combat + Reaction. A successful hit applies the Immobilized status with a small variation. In this case, the target is stuck to the creature and cannot move away without first breaking free, but the creature can move with the target as long as its Strength is at least 1/2 the target’s Body. Breaking free is described below.<br/>\
For the Self range, no roll is made, and the critter is allowed to move along vertical and inverted surfaces at their normal Movement rate.<br/>\
Breaking free from this power requires a Major Action. Roll Strength + Body against the critter’s Magic + Willpower. If the target prevails, they have escaped. If they fail, the Immobilized status remains until the next time they can attempt an escape.
critterpower.compulsion=Принуждение
critterpower.compulsion.page=222
critterpower.compulsion.desc=Криттер ментально принуждает цель выполнить простое конкретное действие.
critterpower.concealment=Сокрытие
critterpower.concealment.page=222
critterpower.concealment.desc=Мистическим образом скрывает криттера или его союзников от обычного и астрального обнаружения.
Concealment can be used simultaneously on a number of average metahuman-sized targets (Body up to 5; Body over 5 counts as 2 targets) equal to the critter’s Magic, or a number of much smaller targets (cats, babies, rats, etc.) equal to the critter’s Magic x 5. Concealed subjects can see each other if the critter allows it. The effect lasts until the critter stops sustaining the power.
critterpower.confusion=Замешательство
critterpower.confusion.page=222
critterpower.confusion.desc=Дезориентирует цель, накладывая состояния Ошеломление и В замешательстве.
critterpower.corrosive_spit=Разъедающий плевок
critterpower.corrosive_spit.page=222
critterpower.corrosive_spit.desc=Криттер выплёвывает струю едкой кислоты, наносящей химический урон и разъедающей броню.
critterpower.dual_natured=Двойственная природа
critterpower.dual_natured.page=223
critterpower.dual_natured.desc=Существо одновременно активно на физическом и астральном плане, способно воспринимать оба мира.
critterpower.elemental_attack=Стихийная атака
critterpower.elemental_attack.page=223
critterpower.elemental_attack.desc=Дыхание пламенем, ледяные копья или разряды молний, наносящие стихийный урон выбранного типа.
critterpower.energy_aura=Энергетическая аура
critterpower.energy_aura.page=223
critterpower.energy_aura.desc=Тело криттера окружено смертоносным полем стихии, наносящим урон любому при контакте.
critterpower.engulf=Поглощение
critterpower.engulf.page=223
critterpower.engulf.desc=Криттер захватывает цель в свою стихийную массу (воду, пламя, песок), постепенно удушая и нанося урон.
<b>Air Engulf:</b> The target resists Stun damage with a DV equal to (Magic + 2). If the victim passes out from Stun damage, they continue to take damage, with the Stun damage overflowing into Physical damage as normal. Victims gain the Fatigued I status.<br/>\
<b>Earth Engulf:</b> The target resists Physical damage with a DV equal to (Magic + 2). Victims gain the Fatigued I status.<br/>\
<b>Fire Engulf:</b> The victim resists Physical damage and gains the Burning status for as long as they are engulfed + 1 combat round.<br/>\
<b>Water Engulf:</b> The victim resists Stun with a DV of (Magic + 2). This is rougher than normal drowning, because the critter is capable of exerting great pressure on the victim. Victims who pass out from Stun damage continue to take damage after falling unconscious, with the Stun damage overflowing into Physical damage as normal. The victim suffers the Wet and Fatigued I statuses.
critterpower.enhanced_sense=Обострённые чувства
critterpower.enhanced_sense.page=223
critterpower.enhanced_sense.desc=Сверхъестественно развитые чувства восприятия (слух, обоняние, эхолокация, инфразрение).
critterpower.essence_drain=Поглощение Сущности
critterpower.essence_drain.page=224
critterpower.essence_drain.desc=Криттер безвозвратно вытягивает жизненную силу (Сущность) из жертвы для поддержания своего существования.
If the critter is disturbed or interrupted before this test ends, the Essence point is not drained. Lost Essence affects a target character’s Magic or Resonance Rating (see Essence, p. 38). If a target character’s Essence is drained to 0, the character dies. <br/>\
A critter can only increase its Essence to twice its natural maximum. Any Essence drained beyond this point is lost.<br/>\
A critter that drains Essence can pump their stolen life force into other attributes, including Magic, with a Minor Action. Every point of Essence spent may temporarily boost one Physical or Mental attribute, or Magic, by 1. Multiple points of Essence can be pumped into a single attribute if so desired, but only one point can be moved per Minor Action. The maximum boost an attribute can receive in this fashion is 4. This attribute boost wears off after 12 hours, and the Essence points used to fuel the boost are lost.
critterpower.fear=Страх
critterpower.fear.page=224
critterpower.fear.desc=Вселяет в сердце жертвы непреодолимый панический ужас, заставляя спасаться бегством.
critterpower.guard=Охрана
critterpower.guard.page=224
critterpower.guard.desc=Защищает криттера и его подопечных от воздействия способности Несчастный случай и бытовых опасностей.
critterpower.hardened_armor=Крепкая броня
critterpower.hardened_armor.page=224
critterpower.hardened_armor.desc=Несокрушимая броня драконов и могучих созданий. Атаки с силой урона ниже рейтинга брони не наносят урона вовсе.
critterpower.hardened_mystic_armor=Крепкая магическая броня
critterpower.hardened_mystic_armor.page=224
critterpower.hardened_mystic_armor.desc=Усиленная астральная броня, отражающая даже самые разрушительные магические заклинания.
critterpower.immunity=Невосприимчивость
critterpower.immunity.page=224
critterpower.immunity.desc=Абсолютный или усиленный иммунитет к определённому типу атак (обычному оружию, огню, токсинам).
<b>Immunity to Age:</b> This immunity halts the effects of aging, effectively making the being with it immortal … unless they live a dangerous life.<br/>\
<b>Immunity to Normal Weapons:</b> This applies to all attacks that are not magical in nature; weapon foci, spells, and adept or critter powers function normally. If the critter also has the Allergy or Vulnerability weakness, then the Immunity does not apply against non-magical attacks made using the allergen or vulnerability.
critterpower.infection=Заражение
critterpower.infection.page=225
critterpower.infection.desc=Вектор передачи вируса вампиризма (ВВЧМЧ), обращающий умирающую жертву в нежить.
critterpower.influence=Внушение
critterpower.influence.page=225
critterpower.influence.desc=Внедряет в сознание цели внушённую мысль или желание, которое жертва принимает за собственное.
critterpower.innate_spell=Врождённое заклинание
critterpower.innate_spell.page=225
critterpower.innate_spell.desc=Криттер от рождения владеет конкретным заклинанием и способен сотворять его без изучения.
critterpower.innate_spell.choice.spell=Врождённое заклинание
critterpower.materialization=Материализация
critterpower.materialization.page=225
critterpower.materialization.desc=Позволяет астральному существу обрести физическое тело и взаимодействовать с материальным миром.
critterpower.mimicry=Мимикрия
critterpower.mimicry.page=225
critterpower.mimicry.desc=Идеально воспроизводит любые услышанные звуки, голоса и сигналы.
critterpower.mindspeech=Телепатия
critterpower.mindspeech.page=225
critterpower.mindspeech.desc=Прямая бессловесная ментальная связь с разумом других существ.
critterpower.mist_form=Форма тумана
critterpower.mist_form.page=226
critterpower.mist_form.desc=Тело существа обращается в облако плотного тумана, способное просачиваться сквозь щели и неуязвимое для пуль.
critterpower.movement=Движение
critterpower.movement.page=226
critterpower.movement.desc=Мистическим образом ускоряет или замедляет скорость перемещения цели.
For unwilling targets, the critter makes an opposed test using its Magic + Willpower against the target’s Logic + Willpower. If successful, the critter applies the Hobbled status (p. 52) for a number of rounds equal to the net hits.<br/>\
Using Movement on vehicles is tougher than it is on critters and characters. If the target is a vehicle, the critter makes a Magic + Willpower test with a threshold of half the vehicle’s Body (round up, minimum of 2). If the critter meets the threshold, add the hits to the vehicle’s Acceleration attribute and then add the result to (or subtract it from) the vehicle’s Speed in the next Combat Round, as if accelerating or decelerating the vehicle. The critter can continue to make Magic + Willpower tests to increase or decrease the vehicle’s speed each combat round that it sustains this power and the vehicle remains in its domain/terrain. Based on the situation, these sudden changes in speed may call for Crash tests (p. 200) or a Piloting test for the vehicle.
critterpower.mystic_armor=Магическая броня
critterpower.mystic_armor.page=226
critterpower.mystic_armor.desc=Защищает от магических атак и заклинаний прямого действия.
The critter’s natural Armor increases the Defense Rating of the critter and is cumulative with the boost from any worn armor.
critterpower.natural_weapon=Естественное оружие
critterpower.natural_weapon.short=Естественное оружие
critterpower.natural_weapon.page=226
critterpower.natural_weapon.desc=Клыки, когти, рога или шипастый хвост, служащие смертоносным оружием в ближнем бою.
A dual-natured critter with a Close Combat Natural Weapon can use it against astral targets that are within its reach. Use the critter’s normal Close Combat skill and physical Damage Value (typically Strength / 2 unless otherwise noted) for this attack. Ranged Natural Weapons, like other ranged combat options, do not work on the astral plane. Critters without a Natural Weapon may still make a Close Combat attack with attributes defined on the critter.
critterpower.noxious_breath=Вредоносное дыхание
critterpower.noxious_breath.page=226
critterpower.noxious_breath.desc=Облако зловонного или токсичного газа вызывает у целей сильную тошноту и паралич.
critterpower.paralyzing_howl=Парализующий вой
critterpower.paralyzing_howl.page=226
critterpower.paralyzing_howl.desc=Жуткий вой сковывает мышцы всех услышавших его существ, лишая их возможности двигаться.
critterpower.paralyzing_touch=Парализующее касание
critterpower.paralyzing_touch.page=227
critterpower.paralyzing_touch.desc=Касание парализует нервную систему жертвы при физическом контакте.
This power causes targets to slow or stiffen up.It affects everyone who hears it within a radius of (Magic x 15) meters around the howling creature, with the exception of other critters with the same power. The critter makes a Magic + Charisma vs. Intuition + Willpower Opposed test. The rating of any area-effect sound-dampening devices, personal sound-dampening devices (such as cyberware, or earbuds with sound dampening), or hits scored by Hush or Silence spells, is added to the target’s Opposed test, with only the highest single modifier applying. If the target wins, they suffer no ill effects. If the critter wins, the target gains the Immobilized status. If the critter gets 4 or more net hits, the target gains the Stilled status.
critterpower.petrification=Окаменение
critterpower.petrification.page=227
critterpower.petrification.desc=Постепенно обращает живую плоть жертвы в неподвижный монолитный камень.
critterpower.psychokinesis=Психокинез
critterpower.psychokinesis.page=227
critterpower.psychokinesis.desc=Перемещение предметов силой мысли на расстоянии.
critterpower.regeneration=Регенерация
critterpower.regeneration.page=227
critterpower.regeneration.desc=Мгновенное затягивание ран каждый боевой раунд (не восстанавливает урон от огня и магии).
Regeneration can’t heal everything. Damage to the brain via a called shot (Call a Shot p. 42 or Called Shot: Vitals p. 47), magical damage from weapon foci, damage from a Vulnerability, and damage from drain can’t be healed by Regeneration. If the critter is damaged by something it has an Allergy to, it can heal the damage, but it can’t make a Regeneration test as long as it is in contact with the allergen.<br/>\
Regeneration is incompatible with augmentations. Critters with Regeneration cannot receive augmentations, as surgical incisions close too quickly to perform the implantation. Critters with augmentations who gain this power will reject their augmentations as the power repairs their existing genetic template.
critterpower.sapience=Разум
critterpower.sapience.page=227
critterpower.sapience.desc=Криттер обладает полноценным самосознанием и разумом наравне с метачеловеком.
Most sapient critters are mundane, but they are capable of Awakening or Emerging and possessing a Magic or Resonance attribute. These special sapient critters are capable of learning Magic and Resonance-based skills and follow the same rules as normal characters.
critterpower.search=Поиск
critterpower.search.page=227
critterpower.search.desc=Позволяет отыскать любой искомый предмет или персону по запаху, следу или ментальному образу.
The critter must have seen the thing it’s searching for at some point before the search begins. Spirits may search for anything for which their summoner can provide them a mental image. Critters who can enter astral space may use this power there but still need to materialize while searching for an inanimate target in the physical world. Living things with auras can be searched for from the astral plane.
critterpower.venom=Яд
critterpower.venom.page=228
critterpower.venom.desc=Впрыскивает опасный биологический токсин при укусе или ударе когтями.
critterpower.weather_control=Контроль погоды
critterpower.weather_control.page=228
critterpower.weather_control.desc=Вызывает штормы, туманы, грозы или ясную погоду в обширной области.

#Echos
metaecho.living_network=Живая сеть
metaecho.living_network.page=195
metaecho.living_network.desc=Ваш живой аватар может быть частью ПС (PAN). Этот отголосок выбирается только один раз.
metaecho.machine_mind=Разум машины
metaecho.machine_mind.page=195
metaecho.machine_mind.desc=Вы получаете преимущества модуля контроля транспорта 1 уровня (стр. 283). Этот отголосок выбирается только один раз.
metaecho.attack_upgrade=Улучшение Атаки
metaecho.attack_upgrade.page=195
metaecho.attack_upgrade.desc=Увеличьте одну из матричных характеристик вашего живого аватара на 1. Каждую характеристику можно улучшить не более двух раз.
metaecho.data_processing_upgrade=Улучшение Вычислительной мощности
metaecho.data_processing_upgrade.page=195
metaecho.data_processing_upgrade.desc=Увеличьте одну из матричных характеристик вашего живого аватара на 1. Каждую характеристику можно улучшить не более двух раз.
metaecho.firewall_upgrade=Улучшение Сетевого экрана
metaecho.firewall_upgrade.page=195
metaecho.firewall_upgrade.desc=Увеличьте одну из матричных характеристик вашего живого аватара на 1. Каждую характеристику можно улучшить не более двух раз.
metaecho.sleaze_upgrade=Улучшение Скрытности
metaecho.sleaze_upgrade.page=195
metaecho.sleaze_upgrade.desc=Увеличьте одну из матричных характеристик вашего живого аватара на 1. Каждую характеристику можно улучшить не более двух раз.
metaecho.neurofilter=Нейрофильтр
metaecho.neurofilter.page=195
metaecho.neurofilter.desc=Вы получаете бонус +1 к набору кубиков для сопротивления урону от биоотдачи. Этот отголосок можно выбрать дважды.
metaecho.overclocking=Разгон
metaecho.overclocking.page=195
metaecho.overclocking.desc=Вы ускоряете свой живой аватар в Матрице, получая дополнительное простое действие и +1D6 к инициативе в горячем симе.
metaecho.resonance_link=Резонансная связь
metaecho.resonance_link.page=195
metaecho.resonance_link.desc=Позволяет установить одностороннюю эмпатическую связь с другим техномантом, чувствуя его состояние и опасность.
metaecho.skin_link=Скинлинк
metaecho.skin_link.page=195
metaecho.skin_link.desc=Вы можете одним прикосновением подключиться к устройству, как если бы использовали прямое нейроподключение (ПНИ).

#Interpretations
interpretation.core=Основная книга правил
interpretation.core.page=
interpretation.core.desc=Интерпретация правил согласно официальной книге правил
interpretation.core_de=Немецкие правила
interpretation.core_de.page=
interpretation.core_de.desc=Интерпретация правил согласно немецкому изданию книги правил
interpretation.core_seattle=Стандарт (Сиэтл)
interpretation.core_seattle.page=
interpretation.core_seattle.desc=Интерпретация правил согласно изданию «Сиэтл»
interpretation.houserules=Настраиваемая
interpretation.houserules.page=
interpretation.houserules.desc=Интерпретация правил согласно домашним правилам
interpretation.srm=Миссии Shadowrun
interpretation.srm.page=
interpretation.srm.desc=Интерпретация правил согласно руководству Shadowrun Missions

#Weapons - Close Combat
item.deprecated_item=Устаревший предмет (удалите)
item.deprecated_item.page=0
item.unarmed=Безоружный бой
item.unarmed.page=68
item.combat_axe=Боевой топор
item.combat_axe.page=247
item.combat_axe.desc=Хоть вы Нил-пожарный, хоть Нил — орк-варвар, махать топором можно как для дела, так и для насилия. Боевой топор имеет одно или два лезвия и подпружиненный колющий шип для выбивания стёкол или неприятных сюрпризов. В мускулистых руках уличного бойца это оружие гораздо смертоноснее огнестрела.
item.combat_knife=Боевой нож
item.combat_knife.page=247
item.combat_knife.desc=Простое, элегантное и эффективное орудие убийства с клинком длиной от 15 до 30 сантиметров.
item.forearm_snap_blades=Наручные клинки
item.forearm_snap_blades.page=247
item.forearm_snap_blades.wifi=Вы получаете дополнительное простое действие в ход, когда втягиваете или выбрасываете клинки.
item.forearm_snap_blades.desc=Вам не нравятся импланты, однако всё же хочется, чтобы из предплечья неожиданно выскакивали три острых лезвия? Тогда это оружие — для вас. Клинки выбрасываются и втягиваются при помощи усилия мускулов или беспроводного сигнала. Для этого в любом случае требуется простое действие.
item.knife=Нож
item.knife.page=247
item.knife.desc=Обобщающий термин для различных смертоносных боевых клинков. Стиль — на ваш вкус, но вот характеристики одинаковые.
item.katana=Катана
item.katana.page=247
item.katana.desc=Традиционный двуручный меч самураев является чуть ли не стандартом уличных самураев в шестом мире.
item.polearm=Копьё
item.polearm.page=247
item.polearm.desc=Берёте длинную деревяшку, прикрепляете одну из дюжин вариаций смертоносных лезвий на конец — и получаете древковое оружие. Может быть нагинатой, копьём, алебардой или глефой.
item.survival_knife=Нож для выживания
item.survival_knife.page=248
item.survival_knife.desc=Специально создан с режущей кромкой с одной стороны и пилой с другой. В полой рукояти содержатся спички, компас, мини-мультитул и прочее снаряжение для выживания.
item.survival_knife.wifi=В руке нож проецирует значок ДР с картами местности, вашим GPS-положением и данными биомонитора.
item.sword=Меч
item.sword.page=248
item.sword.desc=Тяжёлый одноручный клинок различных видов. Главное оружие мачетеманов и любителей абордажа.
item.club=Дубинка
item.club.page=248
item.club.desc=Указанные характеристики можно использовать для различных предметов, например рукояти топора, бейсбольной биты, лома, монтировки, гаечного ключа или деревянного бруска с гвоздями.
item.extendable_baton=Телескопическая дубинка
item.extendable_baton.page=248
item.extendable_baton.wifi=Вы получаете дополнительное простое действие в ход, когда складываете или раскладываете дубинку.
item.extendable_baton.desc=Телескопическая дубинка выдвигается лёгким движением запястья или беспроводным сигналом. В собранном виде её легче спрятать (порог Сокрытия 4 в сложенном, 2 в разложенном). Для складывания или раскладывания требуется простое действие.
item.sap=Слеппер
item.sap.page=248
item.sap.desc=Известная также как «блэкджек», эта небольшая гибкая дубинка или обмотанный кожей мешочек со свинцом или песком отлично подходит для оглушения. Легко скрыть в ладони (порог Сокрытия 4).
item.staff=Посох
item.staff.page=249
item.staff.desc=Говори мягко, но держи в руках большую дубинку. Вот та самая большая дубинка. Может быть композитной, из твёрдого дерева или высокоуглеродной стали.
item.stun_baton=Оглушающая дубинка
item.stun_baton.page=249
item.stun_baton.wifi=Оглушающая дубинка перезаряжается по беспроводной сети методом индукции, восстанавливая один заряд за полчаса.
item.stun_baton.desc=Будучи стандартным оружием для подавления бунта и символом угнетения, этот электрический жезл полезен и тем, кто находится в тенях. Имеет десять зарядов и восстанавливает один заряд за десять секунд при подключении к сети.
item.telescopic_staff=Телескопический посох
item.telescopic_staff.page=249
item.telescopic_staff.wifi=Вы получаете дополнительное простое действие в ход, когда складываете или раскладываете посох.
item.telescopic_staff.desc=Большая палка, которая сначала выглядит как маленькая. Этот металлический композитный посох можно сложить до размеров оглушающей дубинки простым действием.
item.bike_chain=Велосипедная цепь
item.bike_chain.page=249
item.bike_chain.desc=Банды байкеров обожают сдирать цепи со своих старых байков и хлестать ими пешеходов и соперников.
item.bullwhip=Кнут
item.bullwhip.page=249
item.bullwhip.desc=Плетёный кнут длиной от двух до четырёх метров. На конце закреплён утяжелитель или шип.
item.knucks=Кастет
item.knucks.page=249
item.knucks.desc=Кастет из латуни, стали или прочного пластика, защищающий пальцы и усиливающий удар кулаком.
item.shock_gloves=Шоковые перчатки
item.shock_gloves.page=249
item.shock_gloves.wifi=Вы получаете дополнительное простое действие в ход, когда активируете разряд. Перчатки перезаряжаются методом индукции за полчаса.
item.shock_gloves.desc=Электрошоковые перчатки наносят электрический урон током при прикосновении. Имеют 10 зарядов и восстанавливают заряд за десять секунд от сети.
item.monofilament_whip=Монофиламентный хлыст
item.monofilament_whip.page=249
item.monofilament_whip.wifi=Хлыст использует ваши встроенные сенсоры для предотвращения запутывания и снижает риск критического промаха.
item.monofilament_whip.desc=Невероятно опасный хлыст из мономолекулярной нити толщиной в одну молекулу, способный рассекать плоть, кости и металл как горячий нож масло. Хранится в специальной катушке.

#Weapons - Projectiles
item.bow=Лук
item.bow.page=250
item.bow.desc=Современный блочный лук из композитных материалов, обеспечивающий бесшумную и смертоносную стрельбу стрелами.
item.bow.wifi=Умный лук передаёт данные натяжения и траектории напрямую на смартлинк стрелка.
item.crossbow_light=Лёгкий арбалет
item.crossbow_light.page=250
item.crossbow_light.desc=Лёгкий современный арбалет с автозарядным механизмом и встроенным колчаном.
item.crossbow_standard=Средний арбалет
item.crossbow_standard.page=250
item.crossbow_standard.desc=Стандартный арбалет с автозарядным механизмом и натяжителем.
item.crossbow_heavy=Тяжёлый арбалет
item.crossbow_heavy.page=250
item.crossbow_heavy.desc=Тяжёлый мощный арбалет с лебёдочным взводом для пробивания брони.
item.throwing_knives=Метательные ножи
item.throwing_knives.page=251
item.throwing_knives.wifi=При успешном попадании вы получаете базовые биометрические данные о состоянии цели.
item.throwing_knives.desc=Балансированные метательные ножи, рассчитанные на бросок с высокой точностью.
item.throwing_stars=Сюрикены
item.throwing_stars.page=251
item.throwing_stars.wifi=При успешном попадании вы получаете базовые биометрические данные о состоянии цели.
item.throwing_stars.desc=Сюрикены и метательные звёздочки различных форм, удобные для скрытого ношения и внезапных атак.

#Weapons - Firearms
item.defiance_super_shock=Дефайанс Супер Шок
item.defiance_super_shock.page=251
item.defiance_super_shock.wifi=При успешном попадании вы узнаёте о базовых счётчиках состояния цели (оценочные значения ячеек урона).
item.defiance_super_shock.desc=«Дефайанс Супер Шок» — самый популярный шокер в мире. Стреляет электродротиками на проводах, нанося мощный электрический оглушающий урон.
item.yamaha_pulsar_1=Ямаха Пульсар I
item.yamaha_pulsar_1.page=251
item.yamaha_pulsar_1.wifi=При успешном попадании вы узнаёте о базовых счётчиках состояния цели (оценочные значения ячеек урона).
item.yamaha_pulsar_1.desc=«Ямаха Пульсар» стреляет дротиками с батареями, наносящими электрический урон без использования проводов. Модель 1/11.
item.yamaha_pulsar_2=Ямаха Пульсар II
item.yamaha_pulsar_2.page=251
item.yamaha_pulsar_2.wifi=При успешном попадании вы узнаёте о базовых счётчиках состояния цели (оценочные значения ячеек урона).
item.yamaha_pulsar_2.desc=«Ямаха Пульсар» — модификация беспроводного шокера повышенной мощности.
item.fichetti_tiffani_needler=Игольщик «Фичетти Тиффани»
item.fichetti_tiffani_needler.page=251
item.fichetti_tiffani_needler.wifi=Вы можете изменить цвет «Фикетти Тиффани Нидлер» простым действием.
item.fichetti_tiffani_needler.desc=«Игольщик Фичетти Тиффани» — гламурный карманный пистолет, стреляющий облаком микроигл (флешетт). Популярен среди корпоративной элиты.
item.streetline_special=Стритлайн Спешиал
item.streetline_special.page=251
item.streetline_special.desc=«Стритлайн Спешл» — сверхдешёвый пистолет из полимеров, практически не обнаруживаемый металлодетекторами.
item.walther_palm_pistol=Вальтер Палм Пистол
item.walther_palm_pistol.page=251
item.walther_palm_pistol.desc=«Вальтер Палм Пистол» — двухствольный миниатюрный пистолет (дерринджер), легко скрываемый в рукаве или ладони.
item.ares_light_fire_70=Арес Лайт Фаер 70
item.ares_light_fire_70.page=252
item.ares_light_fire_70.desc=«Арес Лайт Фаер 70» — лёгкий пистолет для спецопераций со встроенным глушителем и лазерным прицелом.
item.ares_light_fire_75=Арес Лайт Фаер 75
item.ares_light_fire_75.page=252
item.ares_light_fire_75.desc=«Арес Лайт Фаер 75» — версия пистолета спецназначения с предустановленным смартлинком и глушителем.
item.beretta_101t=Беретта 101Т
item.beretta_101t.page=252
item.beretta_101t.desc=«Беретта 101Т» — лёгкий пистолет с высокой надёжностью, стоящий на вооружении служб безопасности по всему миру.
item.beretta_201t=Беретта 201Т
item.beretta_201t.page=252
item.beretta_201t.desc=«Беретта 201Т» — модификация пистолета серии Т со съёмным прикладом и режимом стрельбы очередями.
item.colt_america_l36=Кольт Америка L36
item.colt_america_l36.page=252
item.colt_america_l36.wifi=Пользователь может сменить владельца оружия, потратив простое действие.
item.colt_america_l36.desc=«Кольт Америка L36» — дешёвый, легко скрываемый и повсеместно распространённый лёгкий пистолет.
item.fichetti_security_600=«Фичетти Секьюрити 600»
item.fichetti_security_600.page=252
item.fichetti_security_600.desc=«Фичетти Секьюрити 600» — лёгкий пистолет со складным прикладом и магазином повышенной ёмкости на 30 патронов.
item.rudger_redhawk=«Ругер Редхок»
item.rudger_redhawk.page=252
item.rudger_redhawk.wifi=Вы получаете дополнительное простое действие в ход, когда меняете режим стрельбы.
item.rudger_redhawk.desc=«Ругер Рэдхок» — мощный крупнокалиберный револьвер классической компоновки с высокой останавливающей силой.

item.ares_crusader_ii=Арес Крусейдер II
item.ares_crusader_ii.page=252
item.ares_crusader_ii.desc=«Арес Крусейдер II» — автоматический пистолет с высокой ёмкостью магазина и компенсатором отдачи.
item.ceska_black_scorpion=Ческа Блэк Скорпион
item.ceska_black_scorpion.page=253
item.ceska_black_scorpion.desc=«Ческа Блэк Скорпион» — популярный чешский пистолет-пулемёт компактного класса со складным прикладом.
item.steyr_tmp=Штайр ТАП
item.steyr_tmp.page=253
item.steyr_tmp.desc=«Штайр ТАП» (TMP) — тактический автоматический пистолет с высоким темпом стрельбы, используемый телохранителями.

item.ares_predator_vi=Арес Предатор VI
item.ares_predator_vi.page=253
item.ares_predator_vi.desc=«Арес Предатор VI» — легендарный тяжёлый пистолет шестого поколения со встроенным смартлинком, золотой стандарт наёмников.
item.variable_ammo=Вариативная система боеприпасов
item.variable_ammo.page=253
item.ares_viper_slivergun=Арес Вайпер Сливерган
item.ares_viper_slivergun.page=253
item.ares_viper_slivergun.desc=«Арес Вайпер Сливерган» — тяжёлый пистолет, стреляющий смертоносными очередями флешетт со встроенным глушителем.
item.browning_ultra_power=Браунинг Ультра Пауэр
item.browning_ultra_power.page=254
item.browning_ultra_power.desc=«Браунинг Ультра Пауэр» — мощный тяжёлый пистолет с лазерным прицелом, надёжный конкурент «Предатора».
item.colt_government_2076=«Кольт Гавермент 2076» / «Мэнхантер»
item.colt_government_2076.page=254
item.colt_government_2076.desc=«Кольт Гавермент 2076» — современное перерождение классического армейского пистолета 45-го калибра.
item.colt_manhunter=«Кольт Мэнхантер»
item.colt_manhunter.page=254
item.colt_manhunter.desc=«Кольт Мэнхантер» — тяжёлый служебный пистолет с интегрированным лазерным прицелом для сил правопорядка.
item.ruger_super_warhawk=Ругер Супер Ворхок
item.ruger_super_warhawk.page=254
item.ruger_super_warhawk.desc=«Ругер Супер Вархок» — устрашающий крупнокалиберный револьвер, способный пробивать лёгкую броню и двигатели.
item.fn_p93_flashlight=Фонарик для «ФН Р93 Претор»
item.fn_p93_flashlight.page=254
item.fn_p93_flashlight.desc=Тактический трёхпозиционный фонарь, интегрированный в пистолет-пулемёт FN P93.
item.folding_stock=Складной приклад
item.folding_stock.page=254
item.folding_stock.desc=Складной приклад обеспечивает компромисс между удобством скрытого ношения и точностью стрельбы.
item.colt_cobra_tz100=«Кольт Кобра TZ-100»
item.colt_cobra_tz100.page=254
item.colt_cobra_tz100.desc=«Кольт Кобра TZ-100» — базовый пистолет-пулемёт серии «Кобра» со встроенным складным прикладом.
item.colt_cobra_tz110=«Кольт Кобра TZ-110»
item.colt_cobra_tz110.page=254
item.colt_cobra_tz110.desc=«Кольт Кобра TZ-110» — пистолет-пулемёт со встроенным складным прикладом и подствольным креплением.
item.colt_cobra_tz120=«Кольт Кобра TZ-120»
item.colt_cobra_tz120.page=254
item.colt_cobra_tz120.desc=«Кольт Кобра TZ-120» — топовая модель серии «Кобра» со встроенным смартлинком и улучшенным контролем отдачи.
item.fn_p93_praetor=ФН-P93 Претор
item.fn_p93_praetor.page=254
item.fn_p93_praetor.desc=«ФН Р93 Претор» — тактический пистолет-пулемёт компоновки булл-пап со встроенным фонарём и лазером.
item.hk_227=ХК-227
item.hk_227.page=254
item.hk_227.desc=«ХК-227» — стандартный пистолет-пулемёт спецназа с предустановленным смартлинком, выдвижным прикладом и глушителем.
item.ingram_smartgun_xi=«Инграм Смартган XI»
item.ingram_smartgun_xi.page=254
item.ingram_smartgun_xi.desc=«Инграм Смартган XI» — оружие улиц со встроенным смартлинком, глушителем и складным прикладом.
item.sck_model_100=«СТК модель 100»
item.sck_model_100.page=255
item.sck_model_100.desc=«СТК Модель 100» — сверхкомпактный пистолет-пулемёт для скрытного ношения оперативниками.
item.uzi_iv=Узи IV
item.uzi_iv.page=255
item.uzi_iv.desc=«Узи V» — новейшая итерация знаменитого израильского пистолета-пулемёта со складным прикладом.

item.defiance_t250=«Дефайанс Т-250»
item.defiance_t250.page=255
item.defiance_t250.desc=«Дефайанс Т-250» — надёжный помповый дробовик, рабочая лошадка охранников и уличных самураев.
item.defiance_t250_shortbarrel=«Дефайанс Т-250» (укороченный ствол)
item.defiance_t250_shortbarrel.page=255
item.defiance_t250_shortbarrel.desc=«Дефайанс Т-250» (укороченный ствол) — полуавтоматический помповый дробовик для боя на коротких дистанциях.
item.mossberg_cmdt=Моссберг CMDT
item.mossberg_cmdt.page=255
item.mossberg_cmdt.desc=«Моссберг CMDT» — армейский автоматический дробовик со съёмным коробчатым магазином на 10 патронов.
item.pjss_model_55=«PJSS модель 55»
item.pjss_model_55.page=255
item.pjss_model_55.desc=«PJSS Модель 55» — классическая двустволка переломного типа высочайшего качества для охоты и охраны дома.
item.remington_roomsweeper=Ремингтон Румсвипер
item.remington_roomsweeper.page=255
item.remington_roomsweeper.desc=«Ремингтон Румсвипер» — короткоствольный штурмовой дробовик для зачистки помещений в упор.
item.remington_900=«Ремингтон 900»
item.remington_900.page=256
item.remington_900.desc=«Ремингтон 900» — охотничий карабин со скользящим затвором, отличающийся исключительной точностью.
item.ruger_101=Ругер 101
item.ruger_101.page=256
item.ruger_101.desc=«Ругер 101» — надёжная охотничья и спортивная винтовка высокой точности с оптическим прицелом.
item.ak_97=АК-97
item.ak_97.page=256
item.ak_97.desc=«АК-97» — легендарная штурмовая винтовка калибра 7.62, безотказная в любых условиях от радиоактивных пустошей до джунглей.
item.ares_alpha=Арес Альфа
item.ares_alpha.page=256
item.ares_alpha.desc=«Арес Альфа» — непревзойдённая штурмовая винтовка спецназа с интегрированным подствольным гранатомётом и смартлинком.
item.ares_alpha.item.alpha_launcher=Подствольный гранатомёт «Арес Альфа»
item.ares_alpha.item.alpha_launcher.page=256
item.ares_alpha.item.alpha_launcher.desc=Подствольный гранатомёт, интегрированный в штурмовую винтовку «Арес Альфа».
item.colt_m23=Кольт М23
item.colt_m23.page=256
item.colt_m23.desc=«Кольт М23» — дешёвая и неприхотливая армейская штурмовая винтовка для призывников и охранных корпораций.
item.fn_har=ФН-ХАР
item.fn_har.page=256
item.fn_har.desc=«ФН-ХАР» — тяжёлая штурмовая винтовка европейского производства с лазерным прицелом и компенсатором.
item.yamaha_raiden=Ямаха Рейден
item.yamaha_raiden.page=256
item.yamaha_raiden.desc=«Ямаха Рейден» — высокотехнологичная штурмовая винтовка для корпоративного спецназа с предустановленным подствольным оружием и глушителем.
item.yamaha_raiden.item.raiden_shotgun=Подствольный дробовик
item.yamaha_raiden.item.raiden_shotgun.page=256
item.yamaha_raiden.item.raiden_shotgun.desc=Подствольный дробовик, интегрированный в штурмовую винтовку «Ямаха Рейден».
item.yamaha_raiden.item.raiden_launcher=Подствольный гранатомёт
item.yamaha_raiden.item.raiden_launcher.page=256
item.yamaha_raiden.item.raiden_launcher.desc=Подствольный гранатомёт, интегрированный в штурмовую винтовку «Ямаха Рейден».
item.ares_desert_strike=Арес Дезерт Страйк
item.ares_desert_strike.page=257
item.ares_desert_strike.desc=«Арес Дезерт Страйк» — дальнобойная снайперская винтовка повышенной мощности для работы в экстремальных условиях.
item.cavalier_arms_crocket_ebr=«Кавалер Армс Крокетт EBR»
item.cavalier_arms_crocket_ebr.page=257
item.cavalier_arms_crocket_ebr.desc=«Кавальер Армс Крокетт EBR» — высокоточная марксманская винтовка со встроенным дульным тормозом.
item.ranger_arms_sm6=«Рейнджер Армс SM-6»
item.ranger_arms_sm6.page=257
item.ranger_arms_sm6.desc=«Рейнджер Армс SM-6» — легендарная винтовка наёмных убийц, разбирающаяся на компоненты в чемоданчике за минуту.
item.barret_model_122=«Баррет модель 122»
item.barret_model_122.page=257
item.barret_model_122.desc=«Баррет Модель 122» — крупнокалиберная антиматериальная снайперская винтовка со встроенным сошками и мощным прицелом.
item.ingram_valiant=Ингрэм Валиант
item.ingram_valiant.page=257
item.ingram_valiant.desc=«Ингрэм Вэлиант» — единый ручной пулемёт с ленточным или коробчатым питанием и встроенным гирокреплением.
item.stoner_ares_m202=«Стоунер-Арес M202»
item.stoner_ares_m202.page=257
item.stoner_ares_m202.desc=«Стоунер-Арес М202» — крупнокалиберный ручной пулемёт с огромной убойной силой, излюбленное оружие троллей.
item.rpk_hmg=«РПК» (крупнокалиберный пулемёт)
item.rpk_hmg.page=257
item.rpk_hmg.desc=«РПК» — тяжёлый крупнокалиберный пулемёт для огневой поддержки и установки на станки и технику.
item.panther_xxl=Пантера XXL
item.panther_xxl.page=257
item.panther_xxl.desc=«Пантера XXL» — монструозная штурмовая пушка калибра 20 мм, разносящая бронетехнику и укрепления на куски.
item.ares_s3_super_squirt=«Арес S-III Супер Сквирт»
item.ares_s3_super_squirt.page=258
item.ares_s3_super_squirt.desc=«Арес Супер Сквирт» — пневматическое оружие, распыляющее струи химикатов и ДМСО на цель через контакт с кожей.
item.parashield_dart_pistol=Дротикомёт «Парашилд»
item.parashield_dart_pistol.page=258
item.parashield_dart_pistol.desc=«Парашилд Дарт Пистол» — бесшумный дротиковый пистолет для дистанционного введения транквилизаторов.
item.parashield_dart_pistol.wifi=Дротик передаёт сигнал об успешном попадании и введении препарата, а также сообщает о его эффекте.
item.parashield_dart_rifle=Дротиковая винтовка «Парашилд»
item.parashield_dart_rifle.page=258
item.parashield_dart_rifle.wifi=Дротик передаёт сигнал об успешном попадании и введении препарата, а также сообщает о его эффекте.
item.parashield_dart_rifle.desc=«Парашилд Дарт Райфл» — дальнобойная дротиковая винтовка с оптикой для охоты на параживотных и захвата целей живыми.
item.ares_antioch-2=«Арес Антиох-2»
item.ares_antioch-2.page=258
item.ares_antioch-2.wifi=Вы можете использовать беспроводной канал детонации гранат через ОДР на вашем коммлинке, даже если у вас нет прямого нейроинтерфейса.
