item.bug_scanner.desc=Сканер жучков анализирует радиоэфир для обнаружения подслушивающих устройств и скрытых меток.
item.bug_scanner.wifi=Вы получаете 2 автоматических успеха на проверку и должны лишь сравнять результат встречной проверки.
item.data_tap=Прослушиватель данных
item.data_tap.page=269
item.data_tap.desc=Отвод данных врезается в кабель или шину данных, создавая прямое проводное подключение к сети.
item.data_tap.wifi=Отвод данных можно самоуничтожить простым действием по беспроводному сигналу, мгновенно разорвав соединение.
item.headjammer=Глушитель сигналов
