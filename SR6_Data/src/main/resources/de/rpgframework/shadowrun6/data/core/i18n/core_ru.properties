item.periscope.variant.standalone=Отдельное устройство
item.periscope.variant.standalone.desc=Оптический перископ позволяет вести огонь и наблюдение из-за угла или поверх укрытия без риска получить пулю.
item.quick_draw_holster=Кобура для быстрого выхватывания
item.quick_draw_holster.page=260
item.quick_draw_holster.desc=Кобура быстрого выхватывания снижает время на извлечение оружия и открытие огня.
item.shock_pad=Амортизатор отдачи
item.shock_pad.page=260
item.shock_pad.desc=Амортизирующий затыльник приклада снижает воздействие отдачи на плечо стрелка.
item.silencer=Глушитель
