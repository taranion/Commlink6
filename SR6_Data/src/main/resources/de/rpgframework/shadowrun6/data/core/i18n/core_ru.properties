item.smartgun_system=Смартган-система
item.smartgun_system.page=260
item.smartgun_system.desc=Смартган-система соединяет оружие с кибернетическим смартлинком через процессор оружия, камеру и лазерный дальномер.
The smartgun features are accessed either by universal access port cable to an imaging device (like glasses, goggles, or a datajack for someone with cybereyes) or by a wireless connection working in concert with direct neural interface. <br/>\
Internal smartgun systems add 500 nuyen to the weapon price. An external smartgun system can be attached to the top mount or underbarrel mount with an Engineering + Logic (4, 1 hour) Extended Test. <br/>\
The small camera has a capacity of 1 and can be equipped with vision enhancements (p. 275).
item.smartgun_system.wifi=Вы получаете бонус +1 к пулу кубиков атаки. Бонусное простое действие для смены режима огня или перезарядки.
item.smartgun_system.variant.internal=Внутренний
item.smartgun_system.variant.internal.desc=Смартган-система соединяет оружие с кибернетическим смартлинком через процессор оружия, камеру и лазерный дальномер.
The smartgun features are accessed either by universal access port cable to an imaging device (like glasses, goggles, or a datajack for someone with cybereyes) or by a wireless connection working in concert with direct neural interface. <br/>\
Internal smartgun systems add 500 nuyen to the weapon price. An external smartgun system can be attached to the top mount or underbarrel mount with an Engineering + Logic (4, 1 hour) Extended Test. <br/>\
The small camera has a capacity of 1 and can be equipped with vision enhancements (p. 275).
