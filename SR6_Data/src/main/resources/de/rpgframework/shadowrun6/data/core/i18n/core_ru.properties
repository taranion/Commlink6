item.control_rig.variant.echo_machine_mind.desc=Модуль контроля транспорта (МКТ) подключает нервную систему риггера напрямую к бортовому компьютеру машины или дрона.
item.control_rig.variant.quality_pilot_origin=Истоки пилота
item.control_rig.variant.quality_pilot_origin.desc=Модуль контроля транспорта (МКТ) подключает нервную систему риггера напрямую к бортовому компьютеру машины или дрона.
item.control_rig.variant.control_rig_codemod=Интеграция модуля контроля
item.control_rig.variant.control_rig_codemod.desc=Модуль контроля транспорта (МКТ) подключает нервную систему риггера напрямую к бортовому компьютеру машины или дрона.
item.cortex_kink_bomb=Кортикальная изгибная бомба
item.cortex_kink_bomb.page=283
item.cortex_kink_bomb.desc=Изгибная кортикальная бомба наносит смертельный урон носителю при попытке взлома или предательстве.
The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed to destroy specific components.
item.cortex_microbomb=Кортикальная микробомба
item.cortex_microbomb.page=283
item.cortex_microbomb.desc=Микробомба в черепе, достаточная для гарантированного уничтожения носителя по сигналу контролёра.
The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed to destroy the entire limb.
item.cortex_area_bomb=Кортикальная зональная бомба
item.cortex_area_bomb.page=283
item.cortex_area_bomb.desc=Зональная кортикальная бомба уничтожает носителя и всех находящихся рядом людей в радиусе поражения.
The bombs can be remote- or time-detonated, or even set to discharge by sound recognition. If installed in cyberlimbs, these bombs are designed tob last the area and damage the bearer.
