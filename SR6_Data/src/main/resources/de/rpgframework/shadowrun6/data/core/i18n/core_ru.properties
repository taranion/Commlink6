item.datalock.page=283
item.datalock.desc=Инфозамок — защищённое хранилище зашифрованных данных в нервной системе носителя.
item.olfactory_booster=Усилитель обоняния
item.olfactory_booster.page=283
item.olfactory_booster.wifi=Добавьте рейтинг усилителя обоняния как модификатор к проверкам Восприятия на основе запахов.
item.olfactory_booster.desc=Усилитель обоняния — кибернетическое обоняние, позволяющее анализировать и запоминать тончайшие запахи.
item.olfactory_booster.wifi=Добавьте рейтинг усилителя обоняния как модификатор к проверкам Восприятия на основе запахов.
item.skilljack=Прошивка навыков (скиллджек)
item.skilljack.page=284
item.skilljack.wifi=Подключение к Матрице повышает максимальный суммарный рейтинг программ до Рейтинг x 4, а также позволяет использовать Преимущество.
item.skilljack.desc=Интерфейс подключения программ навыков (ноусофтов и софта активности) напрямую в нервную систему.
item.skilljack.wifi=Подключение к Матрице повышает максимальный суммарный рейтинг программ до Рейтинг x 4, а также позволяет использовать Преимущество.
item.taste_booster=Усилитель вкуса
