item.trodes.desc=Троды — эластичная повязка с электродами на голову для мысленного управления коммлинком без киберимплантов.
item.standard_tag=Стандартная RFID-метка (10x)
item.standard_tag.desc=Стандартная миниатюрная радиометка (RFID) для маркировки и учёта предметов.
RFID tags are devices that can hold one or more files, but not much else. The physical location of a tag can be found via the Matrix (Trace Icon, p. 184). Tag data can be erased with a tag eraser (p. 270) or programmed with an Edit File action (p. 181). RFID tags have owners like all other devices, but unlike other devices a tag’s owner can be changed to “nobody.”
item.standard_tag.page=269
item.datachip=Датачип
item.datachip.page=269
item.datachip.desc=Инфочип — компактный накопитель данных без беспроводных интерфейсов для безопасного физического переноса файлов.
item.security_tag=Защитная RFID-метка
item.security_tag.page=269
item.security_tag.desc=Защищённая метка с шифрованием сигнала и тревожным оповещением при повреждении.
item.security_tag.variant.stealth_tag=Скрытая
item.security_tag.variant.stealth_tag.desc=Защищённая метка с шифрованием сигнала и тревожным оповещением при повреждении.
item.sensor_tag=Сенсорная RFID-метка
item.sensor_tag.page=269
item.sensor_tag.desc=RFID-метка с встроенным микросенсором (микрофон, камера или датчик температуры).
item.sensor_tag-wifi=Вы можете отслеживать данные сенсора в реальном времени, если являетесь владельцем метки.
item.bug_scanner=Сканер жучков
