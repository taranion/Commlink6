spell.acid_stream.desc=Выпускает струю едкой кислоты по одиночной цели, немедленно нанося урон, причиняя химический урон и накладывая состояние Разъедание.
spell.toxic_wave.desc=Захлёстывает волной едкой кислоты целую область, нанося урон всем в радиусе поражения и накладывая состояние Разъедание.
spell.clout.desc=Сгусток сжатого воздуха с силой врезается в цель, нанося оглушающий физический урон на расстоянии.
spell.blast.desc=Мощный взрыв сжатого воздуха поражает область, раскидывая противников и нанося оглушающий урон всем в радиусе действия.
spell.flamestrike.desc=Сноп бушующего пламени испепеляет одиночную цель, нанося физический урон огнём и поджигая горючие материалы.
spell.fireball.desc=Классика боевой магии. Сфера ревущего пламени взрывается в указанной точке, нанося физический урон огнём всем целям в области.
spell.ice_spear.desc=Копьё из зазубренного твёрдого льда пронзает цель, нанося физический урон холодом и замораживая противника.
spell.ice_storm.desc=Шквал ледяных осколков и морозного ветра засыпает область, нанося урон холодом всем попавшим под удар.
spell.lightning_bolt.desc=Ослепительный разряд электричества поражает цель, нанося урон электричеством и выводя из строя электронику.
spell.lightning_ball.desc=Шаровая молния взрывается каскадом искр и дуговых разрядов, поражая электричеством всех в области действия.
spell.manabolt.desc=Сгусток чистой магической силы поражает напрямую ауру и жизненную силу цели, игнорируя физическую броню.
spell.manaball.desc=Вспышка чистой маны бьёт по аурам всех живых существ в области поражения, нанося физический урон в обход обычной брони.
spell.powerbolt.desc=Удар грубой магической кинетической энергии по одиночной цели. Наносит физический урон как живым существам, так и неживым объектам.
spell.powerball.desc=Взрыв магической энергии крушит всё в области поражения — как плоть, так и технику, дробя препятствия и нанося физический урон.
spell.stunbolt.desc=Ментальный разряд оглушает цель без причинения необратимых увечий, заполняя счётчик оглушения противника.
spell.stunball.desc=Волна оглушающей ментальной энергии накатывает на область, сбивая с ног и погружая в бессознательное состояние всех в радиусе действия.
spell.analyze_device.desc=Позволяет заклинателю мгновенно понять принцип работы, конструкцию и назначение любого материального или электронного устройства.
spell.analyze_magic.desc=Раскрывает природу заклинаний, ритуалов, источников и магических следов, давая подробную информацию об их силе и создателе.
spell.analyze_truth.desc=Позволяет определить, говорит ли цель правду или намеренно лжёт при ответе на вопросы.
spell.clairaudience.desc=Создаёт невидимую сенсорную точку, позволяя заклинателю удалённо слышать происходящее в выбранном месте.
spell.clairvoyance.desc=Создаёт невидимую точку обзора, позволяя заклинателю удалённо видеть происходящее в выбранном месте без выхода в астрал.
spell.combat_sense.desc=Обостряет интуицию мага перед лицом смертельной опасности, давая бонусы к проверкам защиты от атак и защищая от засад.
spell.detect_enemies.desc=Обнаруживает присутствие существ с враждебными намерениями по отношению к заклинателю в пределах области действия.
spell.detect_life.desc=Фиксирует присутствие и местоположение всех живых металюдей, животных и криттеров в радиусе действия заклинания.
spell.detect_magic.desc=Показывает заклинателю присутствие всех активных магических эффектов, источников, фокусов, духов и Пробуждённых существ.
spell.mindlink.desc=Устанавливает прямой телепатический канал между магом и согласной целью, позволяя мгновенно и беззвучно обмениваться мыслями.
spell.mind_probe.desc=Заклинатель вторгается в сознание цели, считывая её поверхностные мысли, воспоминания или глубоко запрятанные секреты.
spell.antidote.desc=Помогает организму цели нейтрализовать яды и токсины, добавляя успехи заклинания к проверкам сопротивления яду.
spell.cleansing_heal.desc=Удаляет из организма цели токсины, патогены и радиационные заражения одновременно с исцелением физического урона.
spell.cooling_heal.desc=Охлаждающее исцеление действует аналогично Исцелению, но также снимает эффекты Горения.
spell.decrease_attribute.desc=Прикосновение мага ослабляет выбранную характеристику цели на количество чистых успехов.
spell.heal.desc=Восстанавливает ячейки физического урона на счётчике здоровья цели за счёт чистых успехов при сотворении.
spell.increase_attribute.desc=Прикосновение мага усиливает выбранную характеристику цели на количество чистых успехов.
spell.increase_reflexes.desc=Колоссально ускоряет восприятие и скорость реакции цели, давая дополнительные кубики и очки инициативы.
spell.resist_pain.desc=Блокирует болевые сигналы в теле цели, снимая штрафы от полученных ранений.
spell.stabilize.desc=Останавливает кровотечение и предотвращает гибель тяжелораненого персонажа на грани смерти.
spell.warming_heal.desc=Согревающее исцеление действует аналогично Исцелению, но также снимает эффекты переохлаждения.
spell.agony.desc=Заставляет цель испытывать невыносимую иллюзорную боль, накладывая штрафы ранений без реального физического вреда.
spell.confusion.desc=Затуманивает восприятие цели, делая её нерешительной и медлительной.
spell.chaos.desc=Перегружает сенсорные каналы цели калейдоскопом иллюзорных вспышек и воя, накладывая штрафы на любые действия.
spell.hush.desc=Заклинание заставляет цель замолчать, накладывая состояние Безмолвие.
spell.silence.desc=Поглощает звуковые колебания в области действия, создавая зону абсолютного безмолвия.
spell.invisibility.desc=Делает цель невидимой для живого оптического зрения металюдей (но не для технических сенсоров).
spell.improved_invisibility.desc=Делает цель полностью невидимой как для живых глаз, так и для технических камер, дронов и сенсоров.
spell.mask.desc=Изменяет видимый физический облик цели для живых наблюдателей (рост, черты лица, одежда).
spell.physical_mask.desc=Изменяет видимый физический облик цели как для живых существ, так и для камер и оптических датчиков.
spell.phantasm.desc=Маг проецирует иллюзорный образ, воздействующий на оптическое восприятие живых существ.
spell.trid_phantasm.desc=Создаёт реалистичную трёхмерную иллюзию, воспринимаемую как живыми глазами, так и видеокамерами.
spell.sensor_sneak.desc=Позволяет скрыть цель от технических сенсоров, радаров и детекторов движения.
spell.animate_metal.desc=Оживляет металлическую конструкцию или предмет, заставляя его двигаться по воле мага.
spell.animate_plastic.desc=Оживляет пластиковые предметы, придавая им подвижность.
spell.animate_stone.desc=Оживляет камень или бетонный блок, превращая его во временную подвижную фигуру.
spell.animate_wood.desc=Оживляет деревянный предмет, превращая его во временного слугу.
spell.armor.desc=Создаёт вокруг цели мерцающее магическое силовое поле, увеличивающее её значение защиты против физических атак.
spell.control_actions.desc=Заклинатель захватывает контроль над телом цели, словно марионеткой, заставляя выполнять физические движения против её воли.
spell.control_thoughts.desc=Заклинатель полностью подчиняет разум цели, внедряя мысли и прямые приказы, которые цель считает своими собственными.
spell.darkness.desc=Каждый чистый успех снижает уровень освещённости в области, погружая её в глубокую тень.
spell.light.desc=Создаёт парящую сферу яркого мягкого света, разгоняющую тьму в радиусе действия.
spell.elemental_armor.desc=Создаёт магический доспех из выбранной стихии, защищающий от физического и стихийного урона.
spell.fling.desc=Телекинетический бросок предмета на высокой скорости во врага или сквозь препятствие.
spell.focus_burst.desc=Вспышка маны временно перегружает и отключает активные вражеские источники.
spell.levitate.desc=Телекинетически поднимает в воздух и плавно перемещает живое существо или груз на расстоянии.
spell.mana_barrier.desc=Создаёт непроницаемый астральный барьер из маны, блокирующий духов и астральные атаки.
spell.mystic_armor.desc=Укрепляет астральную форму цели магической бронёй, отражающей заклинания прямого действия.
spell.overclock.desc=Магический импульс разгоняет процессор целевого электронного устройства, повышая его характеристики.
spell.physical_barrier.desc=Создаёт прозрачную полусферу или стену физической твёрдой силы, останавливающую пули и атаки.
spell.shape_metal.desc=Делает металл податливым, словно глина, позволяя лепить из него нужные формы без нагрева.
spell.shape_plastic.desc=Позволяет изменять форму пластика и синтетических полимеров без нагрева.
spell.shape_stone.desc=Размягчает камень, бетон и кирпич, позволяя создавать проходы в стенах или формировать укрытия.
spell.shape_wood.desc=Позволяет изгибать и придавать новую форму древесине.
spell.strengthen_wall.desc=Магически укрепляет существующую стену или дверь, увеличивая её структурную прочность.
spell.thunder.desc=Оглушительный раскат грома дезориентирует и оглушает противников в области поражения.
spell.vehicle_armor.desc=Покрывает корпус транспортного средства магическим защитным слоем, повышая броню.

