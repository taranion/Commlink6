lifestyle.street.desc=У вас нет крыши над головой. Вы ночуете на лавочках в парках, в заброшенных машинах, под мостами или на вентиляционных решётках мегаполиса, постоянно опасаясь банд и непогоды.
lifestyle.squatter.desc=Вы живёте в полуразрушенном заброшенном здании без электричества и постоянного водопровода. Это шаг вперёд по сравнению с улицей, но безопасность здесь иллюзорна.
lifestyle.low.desc=Крошечная каморка в неблагополучном районе, полурабочая плита, замок на двери и соевый рацион. Большинство начинающих бегущих в тенях начинают именно с этого уровня.
lifestyle.middle.desc=Приличная квартира в охраняемом жилом комплексе, настоящая еда по праздникам, надёжная матричная связь и относительное спокойствие за свою жизнь.
lifestyle.high.desc=Просторный пентхаус или дом в хорошем районе с корпоративной охраной, свежие натуральные продукты, персональный сервис и высокий социальный статус.
lifestyle.luxury.desc=Особняк, закрытая территория, взвод частной охраны, персональный транспорт с водителем, деликатесы и всё, что только можно купить за деньги в Шестом мире.
lifestyle.z_zone.desc=Хуже жизни на улице может быть только одно... жизнь на улице в зоне боевых действий трущоб.
lifestyle.aaa_zone.desc=Золотая клетка, которую корпорации используют для заточения своих самых ценных сотрудников.

#Metamagics
metaecho.adept_centering=Концентрация адепта
metaecho.adept_centering.page=167
metaecho.adept_centering.desc=Позволяет адепту преодолевать негативные модификаторы неблагоприятных условий окружения и иллюзий за счёт простого действия.
metaecho.centering=Центрирование
metaecho.centering.page=167
metaecho.centering.desc=Маг успокаивает разум ритуальным действием своей традиции, добавляя кубики, равные степени инициации, к сопротивлению истощению.
metaecho.fixation=Закрепление
metaecho.fixation.page=167
metaecho.fixation.desc=Наполняет алхимический препарат кармой, значительно продлевая срок его хранения и защищая от снятия зачарования.
metaecho.flexible_signature=Изменяемый астральный след
metaecho.flexible_signature.page=167
metaecho.flexible_signature.desc=Позволяет по желанию изменять, подделывать или скрывать свой астральный след, усложняя его считывание.
metaecho.masking=Маскировка
metaecho.masking.page=168
metaecho.masking.desc=Позволяет изменять вид своей ауры и астральной формы, маскируя её под обывателя или скрывая уровень Магии.
metaecho.power_points=Очки способностей
metaecho.power_points.page=168
metaecho.power_points.desc=Адепт или мистический адепт получает 1 дополнительное очко способностей вместо метамагии.
metaecho.quickening=Закольцовывание
metaecho.quickening.page=168
metaecho.quickening.desc=Позволяет магу закрепить поддерживаемое заклинание с помощью кармы, делая его постоянным без необходимости поддержания.
metaecho.spell_shaping=Изменение заклинания
metaecho.spell_shaping.page=168
metaecho.spell_shaping.desc=Позволяет изменять область действия заклинания или создавать безопасный пузырь внутри зоны поражения ценой штрафа к проверке.
metaecho.shielding=Заслон
metaecho.shielding.page=168
metaecho.shielding.desc=Усиливает контрзаклинание, добавляя кубики, равные степени инициации, к защите от враждебных заклинаний.

