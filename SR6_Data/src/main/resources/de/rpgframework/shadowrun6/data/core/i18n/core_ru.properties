item.dermal_plating.page=286
item.dermal_plating.desc=Кожные пластины из композитных материалов под кожей повышают значение защиты тела.
item.fingertip_compartment=Отсек в кончике пальца
item.fingertip_compartment.page=287
item.fingertip_compartment.wifi=Помещение или извлечение предмета из пальцевого отсека требует простого действия, включая заправку мононити.
item.fingertip_compartment.desc=Пальцевый отсек позволяет прятать мононить, инфочип или яд в кончике пальца.
item.internal_air_tank=Внутренний дыхательный баллон
item.internal_air_tank.page=287
item.internal_air_tank.wifi=Дополнительное простое действие в ход включения/выключения баллона. Вы всегда знаете точный уровень и чистоту воздуха.
item.internal_air_tank.desc=Внутренний воздушный баллон в грудной клетке обеспечивает до 2 часов дыхания под водой или в ядовитом газе.
item.muscle_replacement=Замена мускулов
item.muscle_replacement.page=287
item.muscle_replacement.desc=Замена мышц на синтетические полимерные волокна, увеличивающая физическую Силу и Ловкость.
