metatype.dwarf        = Dwarf
metatype.dwarf.page   = 53
metatype.dwarf.desc   =<b> \u2022 Average height:</b> 1.2 meters<br/>\
 <b>\u2022 Average weight:</b> 54 kg<br/>\
 <b>\u2022 Ears:</b> Slightly pointy<br/>\
 <b>\u2022 Known for:</b> Short size; stocky build; perseverance<br/>\
 <b>\u2022 Racial qualities:</b> Dwarfs have thermographic vision (p. 73) and toxin resistance (p. 73).<br/><br/>\
 Sixth World dwarfs are often accepted into mainstream society without being fully valued. The taller metatypes seem to be happiest when dwarfs fit the roles they have preconceived for them sidekicks, drivers, mechanics, that sort of thing. It doesn't help that their size helps them squeeze into vehicles that orks, humans, and elves might have difficulty with, ones that trolls couldn\u2019t even consider using. Still, they get work and little direct hate. They\u2019re treated nicely, but they can't help but feel that they\u2019re being, well, overlooked.<br/>  \
 Dwarfs across the globe are dedicated to showing that they cannot be ignored. Dwarf deckers, street samurai, covert ops specialists, faces, and more are popping up in the international shadows, and others underestimate them at their peril.<br/>  \
 The lack of heightened antipathy against dwarfs helped them assimilate in human communities better than other metatypes. This means that they do not have as many of their own enclaves as some of the other metatypes (it also doesn\u2019t help that they don\u2019t have access to whatever stream of revenue the elves tap into build their kingdoms). With the founding of the dwarf-centric Biloxi Technical Institute, southern Mississippi in the CAS is becoming a dwarf haven. What that will grow into and how that will shape the world is anyone\u2019s guess.
metatype.elf          = Elf
metatype.elf.desc     =  <b>\u2022 Average height:</b> 1.9 meters<br/>\
 <b>\u2022 Average weight:</b> 80 kg<br/>\
 <b>\u2022 Ears:</b> Pointy<br/>\
 <b>\u2022 Known for:</b> Slender, lithe build; being attractive and knowing it<br/>\
 <b>\u2022 Racial qualities:</b> Elves have low-light vision (p. 72).<br/><br/>\
 Perhaps the most infuriating thing about elves to the other metatypes is that you can resent them like hell, and they just won\u2019t care. They have two prosperous nations\u2014TÌr na n”g (formerly known as Ireland) and TÌr Tairngire (in the western part of North America)\u2014they have people in some of the most powerful positions in the world, and celebrities whose MeFeed hits are in the billions. They are envied, not looked down on.<br/>\
 But plenty of elves know that this envy does not extend to every elf. If you\u2019re an elf who is not rich, elegant, or graceful, you\u2019re often viewed as a failure, someone who had all the gifts of life handed to them and somehow screwed them up. And it\u2019s not just non-elves who hold this view. Never mind that you might have grown up poor, never mind what obstacles you had to face\u2014people think you automatically had it easy because you\u2019re an elf. But elf society is not easy to survive. The upper crust can be absolutely ruthless about enforcing their status quo, labeling those who don\u2019t fit as malcontents and finding ways to cast them aside. The barrens of the major sprawls of the world have plenty of elves who were thrown out because they wouldn\u2019t cave to what society wanted them to be. Their anger could burn the whole earth.
metatype.elf.page     = 54
metatype.human        = Human
metatype.human.desc   = <b>\u2022 Average height:</b> 1.75 meters<br/>\
 <b>\u2022 Average weight:</b> 78 kg<br/>\
 <b>\u2022 Ears:</b> Rounded<br/>\
 <b>\u2022 Known for:</b> Average size; average build; freaking out about people who don\u2019t meet their averages<br/>\
 <b>\u2022 Racial qualities:</b> Humans have no extra racial qualities.<br/><br/>\
 As the majority of the sentient beings of the world, humans create existing definitions of \u201Cnormal,\u201D and then some of them set out to abuse those definitions as hard as they can. These humans know that they lack the pure physical strength and social cohesion of some of the other metatypes, so they shape the world in a way that keeps the individuals they don\u2019t like from ever realizing what they can do, and what they can become.<br/>\
 The side effect of this, of course, is that many humans are caught up in the demoralizing machinery that the ruling corporate class has assembled, because they don\u2019t fit into this artificial average. They are grist for the mill, people to be chewed up and spat out in the name of greater wealth and power for the people at the top. Because they\u2019re humans, and there are so many of them, who\u2019s going to notice how they\u2019re ground down, and who is going to miss them when they\u2019re gone?<br/>\
 The shadows are full of humans who could not find a way to be normal or average.
metatype.human.page   = 55
metatype.ork.page     = 55
metatype.ork          = Ork
metatype.ork.desc     = <b>\u2022 Average height:</b> 1.9 meters<br/>\
 <b>\u2022 Average weight:</b> 128 kg<br/>\
 <b>\u2022 Ears:</b> Pointy<br/>\
 <b>\u2022 Known for:</b> Big, powerful physique; tusks; constantly being seen as outsiders<br/>\
 <b>\u2022 Racial qualities:</b> Orks have low-light vision (p. 72) and the Built Tough (1) quality (see p. 70)<br/><br/>\
 Orks make people nervous, and people don\u2019t like to be nervous. Their tusks, bone structure, and pointed ears mark them as something altogether else, and their strength and size clearly show the damage they could do. As humans have done for centuries, they address the thing they fear by pushing them aside, keeping orks from building collective strength, and crushing them with the sheer force of numbers.<br/>\
 That approach works as long as you can keep fear stoked and have it immobilize the masses. Because if people can move past the fear and start to understand the deliberate injustice that has been forced on some groups, they separate themselves from society\u2019s machine, and the number of people used to enforce oppression gets smaller. Oppressors aren\u2019t especially good at developing new solutions to such problems\u2014they usually just resort to oppressing harder.<br/>\
 So while realization of the injustices they deal with is spreading, orks across the Sixth World are preparing for things to get worse so that they can survive and set about the work of making things better. They already have some enclaves carved out for themselves\u2014Seattle\u2019s Underground, Atlanta\u2019s Sweetwater Creek, Dharavi in the Indian Union\u2014and they hope those locales will be the starting points for societies that include orks instead of fearing them.
metatype.troll.page   = 56
metatype.troll        = Troll
metatype.troll.desc   = <b>\u2022 Average height:</b> 2.5 meters<br/>\
<b>\u2022 Average weight:</b> 300 kg<br/>\
<b>\u2022 Ears:</b> Slightly pointy, often hidden by horns<br/>\
<b>\u2022 Known for:</b> Being so big, you guys. Just huge. And horns.<br/>\
<b>\u2022 Racial qualities:</b> Trolls have thermographic vision (p. 73), the Built Tough (2) quality (see p. 70), and dermal deposits (which provide +1 to trolls\u2019 Defense Rating).<br/><br/>\
 It\u2019s not easy to live in a society where you look like the walking embodiment of everyone else\u2019s nightmares. Being two to three times as large as everyone else doesn\u2019t help much, either. It\u2019s not a troll\u2019s world, and most of the other residents of the world aren\u2019t inclined to change that fact. Who wants to make space for imposing monsters? Trolls are going to have to force their way into a place in the world\u2014of course, when they force their way in anywhere, they\u2019re inevitably called vandals and destroyers.<br/>\
 A significant number of trolls have looked at the way the deck is stacked against them and decided they don\u2019t need to play the rest of the world\u2019s game anymore. They\u2019ll stand aside and watch the world burn\u2014and maybe throw on an extra match every now and then. The Black Forest Troll Republic is one of the most important troll communities in the world, acting as a beacon and vision for what troll society can be while keeping a certain distance from everyone else. Whether they assimilate or build a higher wall is an open question.<br/>\
 Trolls have the most difficult time adapting to other metatypes because their bodies are so different. It\u2019s more than just the size and the horns\u2014 they have dermal deposits all over their bodies that make knobs, bumps, and other formations. They scrape up furniture and clothing, and make some people think twice about giving a troll a big bear hug. Especially since there are few people who can wrap their arms around a whole troll.
 
mor.mundane=Mundane
mor.mundane.desc=Choosing to be mundane means no access to Magic or Resonance. Simple as that. Your special attribute points will have to be spent elsewhere.
mor.adept=Adept
mor.adept.desc=Adepts focus all of their magic inward, fueling their talents with their innate ability to pull mana in rather than channel it outward. Due to this physical connection to their magic, they cannot astrally project and only gain the ability to astrally perceive through training. Adepts have a pool of points equal to their Magic that they use to purchase adept powers. For more information on adepts, see p. 156.
mor.aspectedmagician=Aspected Magician
mor.aspectedmagician.desc=Aspected magicians are only able to utilize one of the three aspects of magic: spellcasting (Sorcery), summoning (Conjuring), or enchanting (Enchanting). They can access the astral plane with astral perception and projection.
mor.magician=Magician
mor.magician.desc=Full magicians gain access to the full range of magical abilities, spellcasting, summoning, and enchanting, as well as offering full access to the astral plane with both astral perception (p. 159) and astral projection (p. 160).
mor.mysticadept=Mystic Adept
mor.mysticadept.desc=Mystic adepts are a blend of inward and outward magic. They are capable of casting spells, summoning spirits, and enchanting items, but they also channel a portion of their magic inward to fuel adept talents. They are not able to astrally project due to the anchoring effect of their adept powers, but they can astrally perceive. They must split their Magic between spells and adept powers.
mor.technomancer=Technomancer
mor.technomancer.desc=Technomancers have a special connection to the Matrix, which is measured in an attribute called Resonance. They have the ability to create programs and sprites on the fly along with the ability to manipulate the energies of the Matrix to bend it to their will.

