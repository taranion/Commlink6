npc.barghest=Barghest
npc.barghest.page=216
npc.barghest.desc=A metaspecies of the English mastiff, the barghest stands about eighty-five centimeters at the shoulder and weighs approximately ninety kilograms. Short, sleek fur, either pure white or pure black, lies flat on its massively muscled body, creating the illusion of a naked hide. Sharp spines protrude along the length of its back. Its eyes shine red, and its teeth glow slightly in the dark because of luminescent bacteria in their saliva. During breeding season, they hunt alone or in pairs; at other times they hunt in packs of twelve or more. A number of corps have attempted to use barghests as guard animals, with mixed results, especially with the use of the howl.<br/><b>Natural Habitat/Range:</b> Urban areas in North America and northern Europe, particularly the British Isles. Barghests have also turned up in Australia, East Asia, and Nairobi, pretty much anywhere the British Empire once touched.
npc.barghest.item.barghest_claws=Claws/Bite

npc.basilisk=Basilisk
npc.basilisk.page=216
npc.basilisk.desc=A metaspecies of the komodo dragon, the basilisk averages approximately 2.6 meters from its snout to the tip of its tail, and it weighs around 100 kilograms. They stand about 50 centimeters at the shoulder, are somewhat broader than their progenitor, and have a spiny dorsal fan, about thirty centimeters in height at its tallest point, running most of their length. Their scales are heavy. Usual coloration is black and bright yellow, with a solid black snout and tail tip. Their maws are filled with sharp, saw-edged teeth that are constantly replaced as they\u2019re lost. Not surprisingly, they\u2019re aggressively carnivorous, typically feeding on fish and small mammals. They cheerfully glut themselves on anything they can catch, up to and including metahumans. Extremely territorial, they are relatively easy to train and are used extensively as guard animals by a number of megacorps throughout the Sixth World but usually cannot be prevented from eating things they kill.<br/><b>Natural Habitat/Range:</b> Native to Indonesia, basilisks can now be found in temperate and tropical woodlands worldwide thanks to corporate escapes and ridiculous attempts to make them pets. They are powerful swimmers, so their natural lairs are always near running water.

