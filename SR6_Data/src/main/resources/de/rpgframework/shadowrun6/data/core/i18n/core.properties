mentorspirit.bear=Bear
mentorspirit.bear.page=163
mentorspirit.bear.desc=This mentor symbolizes strength and protection. He is a healer and cannot turn down those in need without good reason, and he defends those under his care. Bear also has a fierce side; he is a dedicated protector, disregarding his own safety in combat if wounded or if someone he is protecting is injured.<br/><br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for tests to resist damage (not including drain)<br/>Magician: Edge Boosts cost 1 less for Health spells, preparations, and Health spell rituals<br/>Adept: 1 free level of Rapid Healing
mentorspirit.bear.disadvantage=You might go berserk when you take Physical damage in combat or if someone under your care is badly injured. Make a <b>Charisma + Willpower Test</b> (wound modifiers apply). You go berserk for 3 combat rounds minus 1 round per hit, so 3 or more hits averts the berserk rage entirely. If you\u2019re already going berserk, increase the duration. When you\u2019re berserk, you go after your attackers without regard for your own safety. If you incapacitate the targets before the time is up, the berserk fury dissipates.
mentorspirit.cat=Cat
mentorspirit.cat.page=163
mentorspirit.cat.desc=Cat is honored in cultures around the world. Cat is often seen as the guardian of mystical secrets, including those involving the afterlife. She knows many secrets but rarely shares them, and never with anyone who is not worthy (according to her own definition of worthiness). She is stealthy, sly, and arrogant. Cat toys with her prey\u2014threatening, taunting, and confusing her targets\u2014rather than going directly for the kill.<br/><br/>\
 <b>Advantages</b><br/>\
 <em>All:</em> Edge Boosts cost 1 less for Athletics or Stealth tests (choose one)<br>\
 <em>Magician:</em> Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Illusion category<br/>\
 <em>Adept:</em> Traceless Walk power for free
mentorspirit.cat.disadvantage=Cat magicians toy with their prey. Unless you succeed in a Willpower + Charisma (3) test at the start of combat, you cannot make an attack that incapacitates your target. If you take any Physical damage, all this playing around stops.
mentorspirit.coyote=Coyote
mentorspirit.coyote.page=163
mentorspirit.coyote.desc=Coyote is the master of tricks, the spirit who is never where you are looking for her and always one step ahead of you. Her best tricks are the ones you never knew she pulled, perfect cons where the mark just feels like the victim of bad luck and doesn\u2019t know how badly they got taken. Coyote\u2019s tricks aren\u2019t necessarily malicious, but they also aren\u2019t necessarily innocent. They are what she needs them to be, and her bag of tricks is bottomless.<br/><br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Con tests<br/>\
 Magician: Edge Boosts cost 1 less for spells, preparations, and spell rituals in the Manipulation category<br/>\
 Adept: Free Vocal Control power
mentorspirit.coyote.disadvantage=You must make a Willpower + Charisma (3) test to avoid exploiting someone else\u2019s misfortune to your own advantage or to pull a clever trick or prank even if it\u2019s to the disadvantage of your friends.
mentorspirit.dog=Dog
mentorspirit.dog.page=163
mentorspirit.dog.desc=Dog is a loyal friend. She fights ferociously to defend her home and those under her protection. Dog protects people from harmful magic and dangerous spirits. Dog is loyal, generous, and helpful to those who show her kindness. She is single-minded, often to the point of stubbornness.<br/><br/>
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Outdoors tests<br/> 
 Magician: Edge Boosts cost 1 less for Detection spells, preparations, and rituals<br/>\
 Adept: 2 free Improved Sense powers
mentorspirit.dog.disadvantage=A Dog magician is stubbornly loyal. You can never leave someone behind, betray your comrades, or let another sacrifice themselves in your place without making a successful Willpower + Charisma (3) test.
mentorspirit.dragonslayer=Dragonslayer
mentorspirit.dragonslayer.page=163
mentorspirit.dragonslayer.desc=This most heroic of mentor spirits is also the most fun-loving. Though she fights to protect her own against all dangers, she loves a good party even more. She is a big sister who takes a friendly interest in everything her family does. Though sometimes na�ve, she makes a staunch friend and a deadly enemy. The dragons she slays have changed with the times: current beasts include crime, pollution, corruption, and of course, actual dragons. Dragonslayer fights hard and plays hard. Once she has given her oath, she never breaks it. A Dragonslayer magician behaves with honor and respect and demands the same from those around them.<br/><br/>\
 <b>Advantages</b><br/>\
 All: Edge Boosts cost 1 less for Influence tests<br/>\
 Magician: Edge Boosts cost 1 less for Combat spells, preparations, and rituals<br/>
 Adept: Danger Sense power for free
mentorspirit.dragonslayer.disadvantage=If you break a promise, whether by choice or by accident, you take a \u20131 dice pool modifier to all actions until you make good on your promise.
