skill.astral.desc=This skill can only be used by full or aspected magicians, or by adepts and mystic adepts who have chosen the Astral Perception adept power. It has two primary uses\u2014one is for assensing astral auras, as described on p. 159. The other is for astral combat, as described on p. 160.<br/><br/><b>Primary Linked Attribute:</b> Intuition<br/><b>Secondary Linked Attribute:</b> Willpower, for astral combat.
