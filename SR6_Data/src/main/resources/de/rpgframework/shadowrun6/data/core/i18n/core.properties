spirit.air.desc=Each spirit receives an optional power for every 3 full points of Force (so Force 1\u20132 spirits have no optional powers, Force 3\u20135 have one, Force 6\u20138 have two, and so on). The summoner selects the optional powers at the time of summoning, and they cannot be changed once the spirit is summoned.<br/>\n
 Spirits\u2019 stats are based on their Force (abbreviated F in the stat blocks). A spirit\u2019s attribute cannot be lower than one, even if the adjustment listed would make it so. Any skills they have are at a rank equal to their Force.
