item.datasoft=Datasoft
item.datasoft.page=271
item.datasoft.desc=Datasofts are like mini-library sections. Each holds a database on a specific subject (i.e., a Knowledge skill). An appropriate datasoft provides you with a narrow version of a Knowledge skill\u2014for example, since Seattle Gangs is a Knowledge skill, a datasoft might cover the Ancients or the Halloweeners, or might just focus on Puyallup gangs. The datasoft is then used the same as a Knowledge skill (p. 97).
item.mapsoft=Mapsoft
item.mapsoft.page=271
item.mapsoft.desc=Mapsofts are downloaded data featuring detailed information about a single specific area approximately 5,000 square kilometers. It includes everything: streets, business/residential listings, topographical, census, GPS, and environmental data. An interactive interface allows you to quickly determine the best routes and directions, locate the nearest spot of your choice, or create your own customized maps.<br/>If a wireless link is maintained, the map automatically self-updates with the latest data from GridGuide. Of course, this feature also means that the mapsoft can be used to track your location. Mapsofts add a +1 dice pool bonus on any test to find directions.
item.shopsoft=Shopsoft
item.shopsoft.page=271
item.shopsoft.desc=Shopping programs like Clothes Horse, Caveat Emptor, and Guns Near Me provide pricing breakdowns and user reviews for comparison shopping purposes for standard goods. An appropriate shopsoft\u2014one exists for each type of product like electronics, firearms, melee weapons, armor, etc.\u2014provides a +1 dice pool bonus to Matrix Search tests you make to buy and sell items.
item.knowsoft=Knowsofts
item.knowsoft.page=272
item.knowsoft.desc=Knowsofts replicate Knowledge skills, actively overwriting the user\u2019s knowledge with their own data. Knowsofts must be accessed with a skilljack, and the number you can use at once is limited by the skilljack rating. Knowsofts, like Knowledge skills, do not have ratings.
item.linguasoft=Linguasoft
item.linguasoft.page=272
item.linguasoft.desc=Linguasofts replicate language skills, allowing a user to speak a foreign language. Linguasofts must be accessed with a skilljack, and the number you can use at once is limited by the skilljack rating. Linguasoft ratings are equal to Language skill abilities as follows: 1 = basic language facility, 2 = language specialist, 3 = language expert, 4 = language expert. Linguasofts cannot go above rating 4.
item.tutorsoft=Tutorsoft
item.tutorsoft.page=272
item.tutorsoft.desc=These virtual private tutors aid you in learning a specific skill. The tutorsoft makes Instruction tests with a dice pool equal to its rating x 2. Tutorsofts cannot teach skills based on Magic or Resonance, and they are available in ratings from 1 to 6.
item.activesoft=Activesoft
item.activesoft.page=272
item.activesoft.desc=Activesofts replace physical active skills, basically every active skill that isn\u2019t based on Magic or Resonance. A skillwire system (p. 287) is needed to translate the muscle memory data properly. The limit to the number of skills you can use at once is based on the skillwire\u2019s rating.
item.credstick_standard=Credstick Standard
item.credstick_standard.page=272
item.credstick_standard.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who\u2019s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.credstick_silver=Credstick Silver
item.credstick_silver.page=272
item.credstick_silver.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who\u2019s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.credstick_gold=Credstick Gold
item.credstick_gold.page=272
item.credstick_gold.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who\u2019s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.credstick_platin=Credstick Platinum
item.credstick_platin.page=272
item.credstick_platin.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who\u2019s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.credstick_ebony=Credstick Ebony
item.credstick_ebony.page=272
item.credstick_ebony.desc=Untraceable funds for the late twenty-first century. A certified credstick is not registered to any specific person. The funds encoded on it belong to the holder, requiring no special ID or authorization to use, which means they can be stolen, but who\u2019s going to mug a runner? To use them, you have to slot them into a universal data connector to transfer cash onto or off of them. This makes them enduringly popular with shadowrunners and the Mr. Johnsons who love to hire them. <br/>Each color of credstick can only hold up to a certain amount of money. This figure is the maximum amount the stick can be loaded with, not the amount it always has on it. The only external identifier of a type of stick is a narrow band on the case, which is often scraped off on the streets to hide the type of stick during transactions.
item.fake_sin=Fake SIN
item.fake_sin.page=272
item.fake_sin.desc=Getting by without a SIN can be a pain, so most runners settle for the next best thing: a fake. High quality fakes are difficult for the Man to spot; low quality fakes are \u2026 less good. The rating of the fake SIN is used in tests against verification systems, and SINs are available in ratings from 1 to 6.<br/>Just like a real SIN, anytime you use a fake SIN for legitimate activity, you leave a datatrail in your wake. The fact that criminal activities can be tracked to fake SINs makes fake SINs inherently disposable. Most runners operate two or more fake SINs at a time\u2014one for legal activity like paying rent and going shopping, another for shadier activity, and possibly a third to be used only when it\u2019s time to get the hell outta Dodge.
item.kit=Kit
item.kit.page=273
item.kit.desc=A kit is portable and contains the basic gear to make standard repairs. Without at least a kit in the field, a skill may not be able to be used actively.
item.shop=Shop
item.shop.page=273
item.shop.desc=A shop is transportable in the back of a van and contains more advanced tools for building and repairing. A shop offers a +1 dice pool modifier for appropriate tests on site. Shops are stocked with standard spare parts.
item.facility=Facility
item.facility.page=273
item.facility.desc=A facility needs a building and is immobile because of the bulky and heavy machines involved, but it can be used for very advanced constructions and modifications. A facility offers the same bonus and parts as a shop, as well as a bonus Edge, and Edge can be used for Extended tests within the appropriate facility.
item.binoculars=Binoculars
item.binoculars.page=274
item.binoculars.desc=Typically handheld, binoculars come with built-in vision magnification. Binoculars are available in optical (which can only take the image link enhancement) and electronic versions (which can take a variety of vision enhancements). Spellcasters can use optical binoculars for casting spells at distant targets.
item.binoculars.variant.electronic=Binoculars (Electronic)
item.binoculars.variant.optical=Binoculars (Optical)
