metaecho.adept_centering=Adept Centering
metaecho.adept_centering.page=167
metaecho.adept_centering.desc=Adept centering allows you to overcome possible negatives from adverse conditions, such as poor lighting, challenging environment, or even swirling illusions. By performing a centering action, you retain your focus so that your opponents cannot take advantage of you. When acting against you, opponents cannot gain Edge from advantages due to environmental conditions, or from changes in Attack or Defense Ratings tied to Illusion spells on your turn when you perform a centering action, or their next turn after the action was performed. <br/>The centering action can be simple, but it should be obvious to anyone who is paying attention. Maybe it\u2019s singing, chanting, making ritualistic hand gestures, whatever. As long as it aligns mind with body, it\u2019s good. Performing your centering action requires a Minor Action.
metaecho.centering=Centering
metaecho.centering.page=167
metaecho.centering.desc=A magician who learns to center has an easier time resisting drain. By using a mundane activity appropriate to your tradition to quiet your mind and block out distractions, you add a number of dice equal to your Initiate Grade to all your Drain Resistance tests. Centering is a Minor Action. The actual activity you use to center is something you choose for yourself (appropriate to your tradition, of course), and it could be something like chanting in Latin, playing a musical instrument, dancing, singing, making arcane gestures, screaming the names of ancient gods\u2014just about anything that isn\u2019t subtle. If you\u2019re prevented from performing your centering technique of choice (for example, you are manacled and can\u2019t make hand gestures), you can\u2019t use this metamagic.
metaecho.fixation=Fixation
metaecho.fixation.page=167
metaecho.fixation.desc=You magically infuse an alchemical preparation with Karma, extending its shelf life. When you create the preparation, spend at least 1 Karma (up to the Potency of the preparation). When the preparation\u2019s Potency starts to decay, instead of losing 1 Potency every [current Potency x 2] hours it loses 1 every day. It also gets a dice pool bonus against Disjoining (p. 153) equal to the amount of Karma you spent on it.
metaecho.flexible_signature=Flexible Signature
metaecho.flexible_signature.page=167
metaecho.flexible_signature.desc=You can alter your astral signature (p. 159) at will. You can disguise your aura so that it can\u2019t be used to identify you, or you can forge the astral signature of another magician you\u2019ve assensed, or simply reduce the amount of time your astral signature lasts. When someone attempts to assense your faked signature, add your Initiate Grade to the Assensing test threshold\u2014if a Grade 2 initiate leaves a forged astral signature, another magician could read the signature with 3 hits as usual, but at 5 hits would realize the signature is fake and spot the true signature underneath. You can only forge astral signatures you\u2019ve read through assensing (your gamemaster may ask for a Memory test\u2014 see p. 67). You can also reduce the longevity of the astral signatures you leave behind by your grade in hours.
metaecho.masking=Masking
metaecho.masking.page=168
metaecho.masking.desc=You learn to change the appearance of your aura (and astral form). You can make it look mundane or make your Magic rank look higher or lower by up to your Initiate Grade. When someone tries to read your masked aura, the Assensing test becomes opposed by your Magic + Initiate Grade\u2014if they get any net hits, they see both your mask and your real aura. If you can use astral perception, you can even make your aura look like a different type (like a spirit or a focus\u2014great for astral costume parties). You can also use this metamagic to mask the auras of a number of bonded foci equal your Initiate Grade.
metaecho.power_points=Power Points
metaecho.power_points.page=168
metaecho.power_points.desc=If you\u2019re an adept or mystic adept, you can gain a Power Point instead of a metamagic. You can take this as many times as you like.
metaecho.quickening=Quickening
metaecho.quickening.page=168
metaecho.quickening.desc=You can manipulate your sustained spells into a sort of loop, so that they sustain themselves instead of relying on you to do it for them. To quicken a spell, take a Major Action and spend Karma while you\u2019re sustaining the spell. You must spend at least 1 Karma but may spend up to the number of hits on the Spellcasting test that generated spell. The spell becomes permanent and gets a dice pool bonus against dispelling (p. 143) equal to the amount of Karma you spent on it.
metaecho.spell_shaping=Spell shaping
metaecho.spell_shaping.page=168
metaecho.spell_shaping.desc=You can reshape your area spells at the cost of making casting them harder. For every \u20131 dice pool penalty you take to your Spellcasting test, you may either increase an area spell\u2019s radius by 1 meter, decrease it by 1 meter, or create a one-meter-radius spherical \u201Cbubble\u201D within the area of your spell that remains unaffected by it (note that some creatures and metatypes need a larger protective bubble than others). You must declare the use of this metamagic when you cast the area spell. You may not take more dice worth of penalty than your Magic rank. Unlike the Increase Area effect, this has no effect on the spell\u2019s Drain Value.
metaecho.shielding=Shielding
metaecho.shielding.page=168
metaecho.shielding.desc=A character with the shielding metamagic learns to better protect themself and others against hostile spells as they are cast. When the magician declares Boosted Defense (p. 143), they can add additional dice directly to the spell defense pool equal to their Initiate Grade. These additional dice cannot be used for any other use of Counterspelling, including dispelling.

