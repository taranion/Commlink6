skill.close_combat.desc=Are you near someone? Are you trying to hurt them? Then use this skill! Whether you\u2019re punching, stabbing, clubbing, or whatever, roll Close Combat + Agility vs. Reaction + Intuition (Athletics can be added for Dodge; see p. 43)<br/>Base Unarmed damage is 2S. Full details on Combat are in the Combat chapter (p. 104).<br/><br/><b>Linked Attribute</b>: Agility
