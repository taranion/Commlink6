item.combat_axe=Combat Axe
item.combat_axe.page=247
item.combat_axe.desc=Whether you\u2019re Neal the Firefighter or Neil the Ork Barbarian, you can swing an axe for both utility and violence. The combat axe come with a single or double blade and a hardened spring-loaded thrusting point for breaking glass or providing an unpleasant surprise. In the overmuscled hands of a 2080s street warrior, this weapon can be far deadlier than a firearm.
item.combat_knife=Combat Knife
item.combat_knife.page=247
item.combat_knife.desc=A simple, elegant, efficient killing device with a chisel point to make light work of armor. It\u2019s also carbon-coated black, so no reflections give away your approach.
item.survival_knife=Survival Knife
item.survival_knife.page=248
item.survival_knife.desc=Specifically designed with a cutting edge on one side and a serrated sawing edge on the other, the true \u201Csurvival\u201D piece of this knife is in the handle and its collection of accessories. In the handle you\u2019ll find a GPS monitor, mini-multitool, and micro-lighter. The blade is coated with a photovoltaic skin that blacks out the blade to prevent unwanted reflection; when charged, the skin can be activated to provide two hours of light. Combat stats are the same as the combat knife.
item.forearm_snap_blades=Forearm Snap Blades
item.forearm_snap_blades.page=247
item.forearm_snap_blades.wifi=The blades grant an extra Minor Action on the turn when they are extended or retracted.
item.forearm_snap_blades.desc=Don\u2019t like getting implants but still want three razor sharp blades to pop out of your forearm? This is the weapon for you. The blades extend and retract through either a forearm muscle command or a wireless signal. Either way, it takes a Minor Action.
item.knife=Knife
item.knife.page=247
item.knife.desc=A catchall term for a variety of different deadly fighting blades. The style is up to you, but the stats are all the same.
item.katana=Katana
item.katana.page=247
item.katana.desc=The iconic two-handed sword of the samurai is standard issue for trid-series shadowrunners. Out on the street, the deadly blade teaches lessons to those who think the trope is solely about looks.
item.polearm=Polearm
item.polearm.page=247
item.polearm.desc=Take a long stick, add any of a dozen varieties of blades to the head, and you\u2019ve got a polearm. Designed to keep distance between attacker and defender or strike at a mounted target, they\u2019re not common street weapons. They\u2019re nearly impossible to conceal, even for a troll, but they\u2019re great at keeping problems at a safe distance.
item.survival_knife=Survival Knife
item.survival_knife.page=248
item.sword=Sword
item.sword.page=248
item.sword.desc=A heavy blade on a one-handed grip that comes in a variety of styles. The world\u2019s dominant combat weapon for thousands of years until the firearm came along.
item.club=Club
item.club.page=248
item.club.desc=The stats listed can be used for a range of objects, including an axe handle, baseball bat, crowbar, tire iron, wrench, or even a two-by-four with a couple nails in it. The price listed is for a professionally made, old-style police baton, but it would be relatively easy to find one for free in a pinch.
item.extendable_baton=Extendable baton
item.extendable_baton.page=248
item.extendable_baton.wifi=You gain a bonus Minor Action on a turn when you retract or extend the baton.
item.extendable_baton.desc=This telescoping club can be extended with a wrist flick or a wireless signal. In its retracted form, it\u2019s easier to conceal (Concealability threshold 4 when retracted, 2 when extended). Retracting or extending it is a Minor Action.
item.sap=Sap
item.sap.page=248
item.sap.desc=Also known as a blackjack, this is a short, flexible club or a leather-wrapped iron, lead, or sand filled sack for thumping heads. It\u2019s designed to be concealable, often fitting in the palm of the hand (Concealability threshold 4).
item.staff=Staff
item.staff.page=249
item.staff.desc=Speak softly and carry a big stick. This is that big stick. Available in composite, hardwood, high-carbon steel, and other materials.
item.stun_baton=Stun baton
item.stun_baton.page=249
item.stun_baton.wifi=The stun baton recharges without being plugged in, regaining one charge per half hour of wireless-enabled time.
item.stun_baton.desc=A riot-control staple and viewed as a symbol of corporate-government oppression, this handy electrical prod is still useful for everyone in the shadows. The stun baton holds ten charges and regains one charge per ten seconds when plugged in.
item.telescopic_staff=Telescoping staff
item.telescopic_staff.page=249
item.telescopic_staff.wifi=You gain a bonus Minor Action on a turn when you retract or extend the baton.
item.telescopic_staff.desc=A big stick that starts out as a small stick. This metal and composite staff can telescope down to the size of a stun baton or a sword. It can be extended and locked in place by spinning or snapping it out in each direction and giving the handle a twist to lock it. Or it can use a wireless signal to activate the telescoping effect. Extending or retracting it takes a Minor Action.
item.bike_chain=Bike Chain
item.bike_chain.page=249
item.bike_chain.desc=Go-gangs love to pull the old equipment off their scrap bikes and smack other people with it. These heavy metal chains are brutal weapons, especially when backed by the speed of a motorcycle. You gain a bonus Minor Action on a turn when you use the Trip Minor Action with this weapon.
item.bullwhip=Bullwhip
item.bullwhip.page=249
item.bullwhip.desc=The classic leather cord used for centuries to keep cattle, and other types of \u201Clivestock\u201D in check. Brutal on bare flesh, these things are mainly a tripping hazard for anyone with armor. You gain a bonus Minor Action on a turn when you use the Trip Minor Action with this weapon.
item.knucks=Knucks
item.knucks.page=249
item.knucks.desc=Everything from a roll of quarters in the palm (though who has that lying around?) to brass knuckles to Ares Hardliner Gloves, these weapons move a fist from potentially deadly to a probably deadly by augmenting the structure of the hand with metals or composites.
item.shock_gloves=Shock Gloves
item.shock_gloves.page=249
item.shock_gloves.wifi=You gain a bonus Minor Action on a turn when you activate a charge. The shock gloves recharge by induction, regaining one charge per half hour of wireless-enabled time.
item.shock_gloves.desc=Insulated gloves with an integrated system that discharges electric current with any contact after they\u2019ve been activated. The gloves inflict the Zapped status (p. 53) and are good for ten charges before they need to be plugged in and recharged (at a rate of one charge per ten seconds). The charge is activated with a muscle command or via wireless signal, which takes a Minor Action.
item.monofilament_whip=Monofilament Whip
item.monofilament_whip.page=249
item.monofilament_whip.wifi=The whip uses your visuals on the target to make small adjustments in targeting, and the whip adjusts its trajectory. This increases the Attack Rating by 2. Also, the whip\u2019s built-in safety system retracts automatically instead of hitting you on a critical glitch.
item.monofilament_whip.desc=Striking fear in the hearts of those who have warily watched its serpentine glow since the 2050s. In the hands of a trained user, this terrifying weapon can cut through armor, flesh, and bone as easy as butter with every millimeter of its two meters of monofilament line. In the wrong hands, or even with a bad twist of a skilled wrist, that line can send you to the street doc looking for a new limb. The whip is stored in the specially designed compartment in the handle with a small weight that detaches when the weapon is activated. Glitches are handled as usual, but a critical glitch always requires the wielder to resist the base damage of the weapon.
item.bow=Bow
item.bow.page=250
item.bow.desc=Everything from the traditional longbow of fiberglass or wood to the modern compound bow. These archaic weapons aren\u2019t common on the streets of 2080. They have the advantage of being hacker-proof as long as you leave off the fancy add-ons. Nocking an arrow takes a Minor Action (<b>Ready Weapon</b>, p. 43). Bows have a rating that indicates the minimum Strength you need to use the weapon. The weapon\u2019s rating is also used to determine damage (maximum rating is 14). Arrows also have ratings, and they must equal or exceed that of the bow.
item.crossbow_light=Crossbow, light
item.crossbow_light.page=250
item.crossbow_light.desc=Modern crossbows are designed with autoloading systems, internal magazines that hold up to four bolts, and come in light, medium, and heavy designs. Light models are single-handed, while medium and heavy designs require two hands.
item.crossbow_standard=Crossbow, standard
item.crossbow_standard.page=250
item.crossbow_standard.desc=Modern crossbows are designed with autoloading systems, internal magazines that hold up to four bolts, and come in light, medium, and heavy designs. Light models are single-handed, while medium and heavy designs require two hands.
item.crossbow_heavy=Crossbow, heavy
item.crossbow_heavy.page=250
item.crossbow_heavy.desc=Modern crossbows are designed with autoloading systems, internal magazines that hold up to four bolts, and come in light, medium, and heavy designs. Light models are single-handed, while medium and heavy designs require two hands.
item.throwing_knives=Throwing Knives
item.throwing_knives.page=251
item.throwing_knives.wifi=Successful hits leave wireless weapons in targets that can be used to predict movement patterns and offer an estimated location. A successful hit offers anyone wirelessly linked to the throwing weapon and using a smartlink system a +1 dice pool bonus for their attacks.
item.throwing_knives.desc=From stars to spikes and everything in between, these stats cover all the muscle-powered, small throwing weapons on the market. Up to (Agility/2) of these weapons can be readied for throwing with a Ready Weapon action.
item.throwing_stars=Throwing Stars
item.throwing_stars.page=251
item.throwing_stars.wifi=Successful hits leave wireless weapons in targets that can be used to predict movement patterns and offer an estimated location. A successful hit offers anyone wirelessly linked to the throwing weapon and using a smartlink system a +1 dice pool bonus for their attacks.
item.throwing_stars.desc=From stars to spikes and everything in between, these stats cover all the muscle-powered, small throwing weapons on the market. Up to (Agility/2) of these weapons can be readied for throwing with a Ready Weapon action.

item.defiance_super_shock=Defiance Super Shock
item.defiance_super_shock.page=251
item.defiance_super_shock.wifi=A successful hit informs you of the status of the target\u2019s basic health in terms of Condition Monitors (general statements, rather than exact number of boxes left).
item.defiance_super_shock.desc=This heavy-duty taser can fire up to four darts with twenty-meter-long wires. The wired connection to the battery allows for a more powerful shock but limits range. It can also be used point-blank in Close Combat for the same damage. After a successful hit, if the target does not knock the lines free, the attacker may use a Major Action to inflict the base damage of the weapon again by opening another set of capacitors.
item.yamaha_pulsar_1=Yamaha Pulsar I
item.yamaha_pulsar_1.page=251
item.yamaha_pulsar_1.wifi=A successful hit informs you of the status of the target\u2019s basic health in terms of Condition Monitors (general statements, rather than exact number of boxes left).
item.yamaha_pulsar_1.desc=The Pulsar uses wireless capacitors, meaning that the Pulsar has increased range compared to other wired tasers. As a trade-off, it packs a little less punch than wired models, but it fires faster and delivers repeated hits. The Pulsar I has no melee contacts.
item.yamaha_pulsar_2=Yamaha Pulsar II
item.yamaha_pulsar_2.page=251
item.yamaha_pulsar_2.wifi=A successful hit informs you of the status of the target\u2019s basic health in terms of Condition Monitors (general statements, rather than exact number of boxes left).
item.yamaha_pulsar_2.desc=The Pulsar uses wireless capacitors, meaning that the Pulsar has increased range compared to other wired tasers. As a trade-off, it packs a little less punch than wired models, but it fires faster and delivers repeated hits. The Pulsar II includes a pair of contacts on the base of the grip to use in melee (treat these as a Close Combat attack as a Club).
item.yamaha_pulsar_2_club=Yamaha Pulsar II (as Club)
item.yamaha_pulsar_2_club.page=251
item.fichetti_tiffani_needler=Fichetti Tiffani Needler
item.fichetti_tiffani_needler.page=251
item.fichetti_tiffani_needler.wifi=You can change the color of the Fichetti Tiffani Needler with a Minor Action. Applying a camouflage pattern to the Needler increases the concealability threshold by 1 for visual Perception tests.
item.fichetti_tiffani_needler.desc=Pretty and deadly are not mutually exclusive. Fichetti gunsmithing combined with Tiffani style makes the Needler the single most popular designer handgun in the world. The base model is matte grey, but its special color-changing coating can be manipulated via wireless signal with an infinite number of patterns and designs. The coating allows your gun to match your shoes, your handbag, or the camo pattern of your fatigues. The Needler only chambers caseless flechette rounds, which are already factored into its damage code.
item.streetline_special=Streetline Special
item.streetline_special.page=251
item.streetline_special.desc=Designed for cheap 3D nanoprinting, the Streetline Special is made of composite materials, making it harder to detect with MAD scanners (increasing the threshold to detect it by 1).
item.walther_palm_pistol=Walther Palm Pistol
item.walther_palm_pistol.page=251
item.walther_palm_pistol.desc=Walther keeps the double-barreled derringer with the classic over-under design alive in the latter half of the twenty-first century with the Palm Pistol. Capable of Burst Fire by firing from both barrels at once, the limited ammo supply only offers a six-shot capacity\u2014so tread carefully how often you go with a burst.
item.ares_light_fire_70=Ares Light Fire 70
item.ares_light_fire_70.page=252
item.ares_light_fire_70.desc=The Light Fire Series is designed for special operators. The 70 is a street standard, while the 75 is not commonly available through regular dealers and standard legal channels. But what runner uses those? The integration of a barrel-mounted silencer in both designs makes the Light Fire series nearly trid-flick silent.<br/>The 75 comes preloaded with smartlink hardware and software, and both come with a laser sight. The silencer for these models increases the threshold for audio Perception tests by 3 for the Light Fire Series when equipped and costs 750¥.
item.ares_light_fire_75=Ares Light Fire 75
item.ares_light_fire_75.page=252
item.ares_light_fire_75.desc=The Light Fire Series is designed for special operators. The 70 is a street standard, while the 75 is not commonly available through regular dealers and standard legal channels. But what runner uses those? The integration of a barrel-mounted silencer in both designs makes the Light Fire series nearly trid-flick silent.<br/>The 75 comes preloaded with smartlink hardware and software, and both come with a laser sight. The silencer for these models increases the threshold for audio Perception tests by 3 for the Light Fire Series when equipped and costs 750¥.
item.beretta_101t=Beretta 101T
item.beretta_101t.page=252
item.beretta_101t.desc=The preferred sidearm of many security forces around the world, the T-series is classified as a light pistol, even though the 201 design offers automatic fire capability, making it popular in nations that limit heavy and machine pistols. Since the frame is the same, it\u2019s easier to disguise as a 101. The 201 also comes with a detachable shoulder stock, though it is often lost before the gun reaches the street market.
item.beretta_201t=Beretta 201T
item.beretta_201t.page=252
item.beretta_201t.desc=The preferred sidearm of many security forces around the world, the T-series is classified as a light pistol, even though the 201 design offers automatic fire capability, making it popular in nations that limit heavy and machine pistols. Since the frame is the same, it\u2019s easier to disguise as a 101. The 201 also comes with a detachable shoulder stock, though it is often lost before the gun reaches the street market.
item.colt_america_l36=Colt America L36
item.colt_america_l36.page=252
item.colt_america_l36.wifi=The user can alter ownership data with a Minor Action.
item.colt_america_l36.desc=A tribute to Colt\u2019s world-class reputation, the L36 is cheap, easily concealed, and abundant on the streets. In order to be easily transferred between corporate security rookies, the weapon feaures an ownership swap feature that has been abused by cops and crooks alike. A perfect throwaway weapon.
item.fichetti_security_600=Fichetti Security 600
item.fichetti_security_600.page=252
item.fichetti_security_600.desc=Designed as a light sidearm for security forces, the thirty-round magazine allows them to miss a ton and not worry about running out of ammo. This also makes it great for deckers. The Security 600 comes with a detachable folding stock and laser sight.
item.rudger_redhawk=Ruger Redhawk
item.rudger_redhawk.page=252
item.rudger_redhawk.wifi=You get an extra Minor Action in a turn where you change the action selection.
item.rudger_redhawk.desc=This rugged revolver is the kid brother of the legendary Super Warhawk. Designed with precision and fun shooting in mind, the Redhawk has a revolutionary single/double firing selector. Classic double action allows a shot with each trigger pull (Semi-Auto Fire), while the single setting lets you play old-west gunslinger and \u201Cfan\u201D the hammer (Burst Fire).

item.ares_crusader_ii=Ares Crusader II
item.ares_crusader_ii.page=252
item.ares_crusader_ii.desc=High capacity and comfortable styling make the Ares Crusader II a standout in its class. The Ares brand is synonymous with functionality, and the Crusader II integrates a gas-vent recoil compensation system and comes standard with smartgun systems and software preloaded.
item.ceska_black_scorpion=Ceska Black Scorpion
item.ceska_black_scorpion.page=253
item.ceska_black_scorpion.desc=Small and lethal, but not designed for beauty. Burst Fire capable from the get-go, it also comes equipped with an integral folding stock.
item.steyr_tmp=Steyr TMP
item.steyr_tmp.page=253
item.steyr_tmp.desc=A lightweight polymer-frame and full autofire capability are not an ideal design combo, but spraying enough lead to make everyone duck for cover is the goal with the TMP. A top-mounted laser sight comes standard to make users think they\u2019ll be aiming.

item.ares_predator_vi=Ares Predator VI
item.ares_predator_vi.page=253
item.ares_predator_vi.desc=The Predator V rode on the laurels of its name. The Predator VI is genuine innovation built into some classic styling. Built on the framing of the original Predator, the VI comes with the standard smartgun operations but adds Burst Fire capability and a new variable ammunition system that will make it king of the streets and warzones once again, even if it comes with a price tag to match that innovation. The variable ammunition system allows a single specially designed magazine (30¥ per spare) to be loaded with different ammo types.<br/>The smartgun is used to select ammo types and cycles them to the chamber in whatever quantity is necessary and available. If there aren\u2019t enough rounds of a particular kind, the ammo counter reads empty and the weapon stops firing.
item.ares_viper_slivergun=Ares Viper Slivergun
item.ares_viper_slivergun.page=253
item.ares_viper_slivergun.desc=The unique Slivergun hangs out in the Heavy Pistol class, but it\u2019s a creature all its own. The Slivergun fires metal slivers that count as flechette ammunition and are bought as such, but they aren\u2019t interchangeable with any other flechette weapon.<br/>The weapon remains capable of Burst Fire and has a silencer integrated into the barrel, and the large ammo capacity makes it a terror on the streets.
item.browning_ultra_power=Browning Ultra Power
item.browning_ultra_power.page=254
item.browning_ultra_power.desc=Once the Predator\u2019s primary competition as the world\u2019s best heavy pistol, the Ultra Power has ceded its claim to the title since it has not kept pace with the tech advances in the Pred-VI. The Browning is cheaper, though, and offers a built-in top-mounted laser sight.
item.colt_government_2076=Colt Government 2076/Manhunter
item.colt_government_2076.page=254
item.colt_government_2076.desc=Governments need new weapons contracts for bribe purposes, so having a new standard issue after only ten years seems about par for the course. The years of technomancer and hacker fear since the \u201960s have left the electronic firing 2066 in a lot of storage cabinets for fear of hacking. The 2076 takes a jump back to the style of the classic Manhunter (in fact, the model with an integrated smartgun system has that denotation) and comes with an integral laser sight.
item.colt_manhunter=Colt Manhunter
item.colt_manhunter.page=254
item.colt_manhunter.desc=Governments need new weapons contracts for bribe purposes, so having a new standard issue after only ten years seems about par for the course. The years of technomancer and hacker fear since the \u201960s have left the electronic firing 2066 in a lot of storage cabinets for fear of hacking. The 2076 takes a jump back to the style of the classic Manhunter (in fact, the model with an integrated smartgun system has that denotation) and comes with an integral laser sight.
item.ruger_super_warhawk=Ruger Super Warhawk
item.ruger_super_warhawk.page=254
item.ruger_super_warhawk.desc=Boom and glitz! That\u2019s the standard street tag for the Super Warhawk. This revolver is shiny and chrome and makes holes the size of a troll\u2019s fist straight out of the box. Upgrade the ammo or the features and those holes get real precise.
item.fn_p93_flashlight=FN P93 Praetor Flashlight
item.fn_p93_flashlight.page=254
item.folding_stock=Folding Stock
item.folding_stock.page=254
item.colt_cobra_tz100=Colt Cobra TZ100
item.colt_cobra_tz100.page=254
item.colt_cobra_tz100.desc=Colt loves variety, and the Cobra TZ series highlights the options they offer with this line. The 100 is the base model with an integral folding stock, the 110 adds a top-mounted laser sight, the 120 features the folding stock, top-mounted laser sight, and a barrel-mounted gas-vent system, making it a hit with security forces all over the world and with trid shows that love all the fancy features.
item.colt_cobra_tz110=Colt Cobra TZ110
item.colt_cobra_tz110.page=254
item.colt_cobra_tz110.desc=Colt loves variety, and the Cobra TZ series highlights the options they offer with this line. The 100 is the base model with an integral folding stock, the 110 adds a top-mounted laser sight, the 120 features the folding stock, top-mounted laser sight, and a barrel-mounted gas-vent system, making it a hit with security forces all over the world and with trid shows that love all the fancy features.
item.colt_cobra_tz120=Colt Cobra TZ120
item.colt_cobra_tz120.page=254
item.colt_cobra_tz120.desc=Colt loves variety, and the Cobra TZ series highlights the options they offer with this line. The 100 is the base model with an integral folding stock, the 110 adds a top-mounted laser sight, the 120 features the folding stock, top-mounted laser sight, and a barrel-mounted gas-vent system, making it a hit with security forces all over the world and with trid shows that love all the fancy features.
item.fn_p93_praetor=FN P93 Praetor
item.fn_p93_praetor.page=254
item.fn_p93_praetor.desc=An unmistakable bullpup design offers a built-in fear response from anyone who sees these guns in the hand of corpsec forces. The Praetor offers an integrated rigid stock, a laser sight, and a flashlight with three settings to benefit low-light, thermographic, or regular vision.
item.hk_227=HK-227
item.hk_227.page=254
item.hk_227.desc=Heckler &amp; Koch know how to design an SMG, since the 227 has been built off the same frame (the venerable MP5) for over a century. A top choice for corporate and military security forces, the HK\u2013227 offers a retractable stock, integrated smartgun system, and an integral barrel-mounted silencer.
item.ingram_smartgun_xi=Ingram Smartgun XI
item.ingram_smartgun_xi.page=254
item.ingram_smartgun_xi.desc=Street samurai create legendary reputations that they don\u2019t always deserve, but the Smartgun has maintained its street rep as a grade-A bang bang for decades. Famous as the weapon of choice for many legendary street samurai since the 2050s, the Ingram Smartgun comes tricked out with a gas-vent system, a smartgun system, and an integral silencer.
item.sck_model_100=SCK Model 100
item.sck_model_100.page=255
item.sck_model_100.desc=Shin Chou Kyogo has made the Model 100 the corp-suit equivalent of the Smartgun with the help of the elite Red Samurai. Across the Japanacorps, their security forces are issued the SCK 100. The Model 100 features an internal smartgun system and a folding stock.
item.uzi_iv=Uzi V
item.uzi_iv.page=255
item.uzi_iv.desc=A new design for a new world. The latest model Uzi is a big market entry for Spinrad Global. The V model features an integral folding stock and built-in top-mounted laser sight.

item.defiance_t250=Defiance T-250
item.defiance_t250.page=255
item.defiance_t250.desc=A solid street howitzer, this semi-automatic shotgun is available in either a normal-length or short-barreled version. It is gas operated and features a secondary pump action for situations where preventing jams is more important than quickly firing a second shot (clear glitch jams with a Minor Action).
item.defiance_t250_shortbarrel=Defiance T-250 (Short barrel)
item.defiance_t250_shortbarrel.page=255
item.defiance_t250_shortbarrel.desc=A solid street howitzer, this semi-automatic shotgun is available in either a normal-length or short-barreled version. It is gas operated and features a secondary pump action for situations where preventing jams is more important than quickly firing a second shot (clear glitch jams with a Minor Action).
item.mossberg_cmdt=Mossberg CMDT
item.mossberg_cmdt.page=255
item.mossberg_cmdt.desc=This assault shotgun provides classic bang for the buck. It can either be loaded with ten-round ammo clips or a big boy twenty-four-round drum. The best features are burst fire mode and a top-mounted laser sight.
item.pjss_model_55=PJSS Model 55
item.pjss_model_55.page=255
item.pjss_model_55.desc=Rich people own shotguns too. Small production runs, usually purchased by rich European hunters and trap shooters, make this a status symbol made for killing. The Model 55 comes with a rigid stock equipped with an integrated shock pad.<br/>Both barrels can be shot at once as a short burst (see Not Enough Rounds, p. 109).
item.remington_roomsweeper=Remington Roomsweeper
item.remington_roomsweeper.page=255
item.remington_roomsweeper.desc=Double-barreled and pistol gripped makes this little beast bad news when it slips out of a pocket. If you\u2019re not a fan of flechette shooters, load some Heavy Pistol rounds into a Roomsweeper and she shoots like a really inaccurate hand cannon.
item.ares_alpha_grenade_launcher=Ares Alpha Grenade Launcher
item.ares_alpha_grenade_launcher.page=256
item.remington_900=Remington 900
item.remington_900.page=256
item.remington_900.desc=A high-powered bolt-action hunting rifle with a classic wooden body. The base model is sold with a top-mounted imaging scope, but it cannot mount underbarrel accessories.
item.ruger_101=Ruger 101
item.ruger_101.page=256
item.ruger_101.desc=Like futuretech in a hunting-rifle format, this gas-operated favorite sits in the hands of many professional hunters and hobbyists. It features a built-in imaging scope and a rigid stock with shock pad.
item.ak_97=AK-97
item.ak_97.page=256
item.ak_97.desc=The AK-97 will never go out of style, especially since it still looks like its mid-twentieth-century predecessor. Built for reliability and endurance, it\u2019s not the prettiest girl at the dance, but it can sure shake a tailfeather.
item.ares_alpha=Ares Alpha
item.ares_alpha.page=256
item.ares_alpha.desc=Made famous in the hands of Ares Firewatch teams, the Alpha quickly became a worldwide success with UCAS and CAS special operators along with a myriad of Desert Wars teams. The integrated underbarrel grenade launcher, smartgun system, and an innovative design for superior handling make it special.
item.colt_m23=Colt M23
item.colt_m23.page=256
item.colt_m23.desc=Cheap, mass-produced, and infinitely adaptable, the M23 finds its ways to the hands of everyone from gangbangers to pirates to delta-level government operators. The M23 can accept two additional underbarrel accessories for a total of three.
item.fn_har=FN HAR
item.fn_har.page=256
item.fn_har.desc=Fabrique Nationale is the name to fear when facing private security forces and corporate high-threat-response teams around the world. They made this weapon, which features a laser sight and a gas-vent system.
item.yamaha_raiden=Yamaha Raiden
item.yamaha_raiden.page=256
item.yamaha_raiden.desc=While Ares made the Alpha, the Japanacorps, through Yamaha, developed the Raiden. Electronic firing and exceptional accuracy are integral to the design. Japanacorp security forces and the Japanese Imperial Marines now swear by the Raiden. It features an integral silencer, smartgun system, and underbarrel shotgun/grenade launcher.
item.ares_desert_strike=Ares Desert Strike
item.ares_desert_strike.page=257
item.ares_desert_strike.desc=\u201CThe Desert Strike for the Desert Wars\u201D is the tagline today. Built to fight in the harshest conditions, the Desert Strike comes equipped with a rigid stock with shock pad and a detachable imaging scope.
item.cavalier_arms_crocket_ebr=Cavalier Arms Crockett EBR
item.cavalier_arms_crocket_ebr.page=257
item.cavalier_arms_crocket_ebr.desc=Cavalier played a dangerous game by offering a sniper rifle capable of burst fire. The Crockett EBR can stay accurate at long range, but those bursts don\u2019t allow repeated accuracy. The Crockett comes standard with a rigid stock with shock pad and a detachable imaging scope.
item.ranger_arms_sm6=Ranger Arms SM-6
item.ranger_arms_sm6.page=257
item.ranger_arms_sm6.desc=Ranger Arms knows what the SM line has always been about\u2014silently neutralizing targets. This sniper rifle features a silencer, an imaging scope, a smartgun system, and a rigid stock with shock pad.<br/>The SM\u20136 carries on the line\u2019s ability to quickly get into the action and then get out just as fast. It can fit into a standard briefcase; setting it up or breaking it down takes a Firearms + Logic (6, Major Action) Extended test. The SM-6 has dealt with the line\u2019s fragility issues, and once put together it has no problem operating in any capacity.
item.barret_model_122=Barret Model 122
item.barret_model_122.page=257
item.barret_model_122.desc=Sometimes you need to shoot an enemy; sometimes you need to shoot an enemy through the side of an APC. The Barret Model 122 excels at tearing through metal and getting to the things it attempts to protect, ripping apart machines and vehicles with horrible tearing sounds that are music to the ears of the shooter. It has a silencer, smartgun system, and folding bipod.
item.ingram_valiant=Ingram Valiant
item.ingram_valiant.page=257
item.ingram_valiant.desc=The Valiant light machine gun sits in the hands of mercenary units the world over. Basic equipment includes a rigid stock with shock pad, a laser sight, and a barrel-mounted gas-vent system.
item.stoner_ares_m202=Stoner-Ares M202
item.stoner_ares_m202.page=257
item.stoner_ares_m202.desc=This medium machine gun packs a tremendous punch and is often found in the hands of trolls with no concept of subtlety. It\u2019s a brutally simple weapon, but accessorizing is always an option for those with a taste for more complexity.
item.rpk_hmg=RPK HMG
item.rpk_hmg.page=257
item.rpk_hmg.desc=This heavy machine gun is used by militaries across eastern Europe and Asia. Usually set up as a vehicle-mounted weapon, it comes standard with a detachable tripod, as the RPK is best fired from a prone, sitting, or kneeling position when not mounted on a vehicle.
item.panther_xxl=Panther XXL
item.panther_xxl.page=257
item.panther_xxl.desc=Bulky, ugly, deadly, and as destructive as they come. Panther\u2019s XXL model of assault cannon is the thing of nightmares on the street. To make sure every shot counts, it comes with a built-in smartgun system.
item.ares_s3_super_squirt=Ares S-III Super Squirt
item.ares_s3_super_squirt.page=258
item.ares_s3_super_squirt.desc=That name is terrible. Everyone thinks the Super Squirt is some kind of water gun, but it\u2019s basically a glorified paintball marker that fires nonlethal dimethyl sulfoxide (DMSO) gel packs. The DMSO forces the skin to absorb whichever chemicals the operator wishes to deliver. The attack itself causes no damage, but when the target is hit successfully, the DMSO delivers the substance directly into the target\u2019s bloodstream as a Contact-vector toxin (see Toxins and Drugs, p.121). <br/>The Super Squirt can accept top- and under-barrel-mounted accessories.
item.parashield_dart_pistol=Parashield DART Pistol
item.parashield_dart_pistol.page=258
item.parashield_dart_pistol.desc=Bringing down trolls with a little plastic, steel, and chemical cocktail for decades, Parashield sets the industry standard for dart weapons. The pistol model can accept top-mounted accessories only.
item.parashield_dart_pistol.wifi=The dart reports whether or notit has struck home and successfully injected along with the effect based on heart rate and pulse levels, although its medical sensors are not very sophisticated (Device Rating of 1 for the dart).
item.parashield_dart_rifle=Parashield DART Rifle
item.parashield_dart_rifle.page=258
item.parashield_dart_rifle.wifi=The dart reports whether or notit has struck home and successfully injected along with the effect based on heart rate and pulse levels, although its medical sensors are not very sophisticated (Device Rating of 1 for the dart).
item.parashield_dart_rifle.desc=Bringing down trolls with a little plastic, steel, and chemical cocktail for decades, Parashield sets the industry standard for dart weapons. The pistol model can accept top-mounted accessories only.<br/>The rifle includes a top-mounted imaging scope and can mount top and underbarrel accessories.
item.ares_antioch-2=Ares Antioch II
item.ares_antioch-2.page=258
item.ares_antioch-2.wifi=You can use the wireless link trigger for your grenades, even if you don\u2019t have DNI.
item.ares_antioch-2.desc=The Antioch II is the fanciest tube with a trigger around, complete with an integral smartgun system. A secondary trigger setting allows for wireless activation of launched projectiles.
item.armtech_mgl6=ArmTech MGL-6
item.armtech_mgl6.page=258
item.armtech_mgl6.wifi=When active the launcher will not detonate any ordnance loaded into the weapon within five meters of the weapon, even if a spoofed command tells it to do otherwise.
item.armtech_mgl6.desc=Semi-auto grenade launchers in a bullpup pistol and rifle style that can send a whole lot of bad news downrange real fast.
item.armtech_mgl12=ArmTech MGL-12
item.armtech_mgl12.page=258
item.armtech_mgl12.wifi=When active the launcher will not detonate any ordnance loaded into the weapon within five meters of the weapon, even if a spoofed command tells it to do otherwise.
item.armtech_mgl12.desc=Semi-auto grenade launchers in a bullpup pistol and rifle style that can send a whole lot of bad news downrange real fast.
item.aztechnology_striker=Aztechnology Striker
item.aztechnology_striker.page=259
item.aztechnology_striker.wifi=Connecting this launcher to the local Matrix provides a +1 dice pool bonus as long as no other bonus-applying systems are in use.
item.aztechnology_striker.desc=Deadly and disposable, the Striker is a great analogy for runners. The launch tube can be reused, which is nice considering recent price increases.
item.onotari_interceptor=Onotari Interceptor
item.onotari_interceptor.page=259
item.onotari_interceptor.wifi=The safety system cannot be disengaged, but the firer gains the smartlink wireless bonus. item.onotari_interceptor.desc=Saeder-Krupp developed this multipurpose missile launcher for military use. It has two separate barrels that can load two missiles at once, which don\u2019t need to be the same type. Both barrels cannot be fired simultaneously, though this safety feature has been known to be removed, much to the dismay of the target\u2014and the firer, as it turns out. It features an internal smartgun system that controls the fire-safety system. Firing both barrels launches both weapons. Split the attack dice pool and resolve each projectile independently. The firer must resist 6P Fire damage when launching both tubes.

item.airburst_link=Airburst link
item.airburst_link.page=259
item.airburst_link.wifi=An airburst link requires wireless functionality to function at all. Both the grenades and the launcher must have wireless mode turned on for the system to function.
item.airburst_link.desc=A smartgun accessory for grenade and rocket launchers uses a rangefinder to air-burst the explosive projectile in close proximity to the target. An airburst link reduces the scatter distance for a launched weapon by two meters per net hit instead of one meter per hit (Blast Attacks and Scatter, p. 114) when you use the wireless link trigger.<br/>The airburst link also prevents the defender from using the Hit the Dirt Action to reduce damage, as the Prone status offers no benefit against the airburst.
item.bipod=Bipod
item.bipod.page=259
item.bipod.wifi=The Attack Rating bonus increases to +3 if used when prone or sitting. item.bipod.desc=A two-legged brace extends down from the weapon, allowing it to be fired low to the ground with the user in a prone or sitting position. A bipod can be attached to the underbarrel mount of a weapon and provides a +2 to the Attack Rating when properly deployed. Attaching a bipod takes a Major Action. Folding up or deploying a bipod is a Minor Action.
item.concealable_holster=Concealable holster
item.concealable_holster.page=259
item.concealable_holster.wifi=Sensors, smart-fabric, and active adhesive allow the holster to alter color and move small amounts in real time, increasing the Concealability threshold by an additional 1.
item.concealable_holster.desc=A small holster worn just about anywhere on the body it can\u2019t be seen, attached with a smart adhesive. It increases the Concealability threshold of the weapon inside by 1. Only pistols (including machine pistols) and tasers fit in a concealable holster.
item.gas-vent_system=Gas-vent system
item.gas-vent_system.page=259
item.gas-vent_system.desc=Gas-vent recoil compensation systems are barrel-mounted accessories that vent a weapon\u2019s barrel gases at a specific vector to counter muzzle climb. Once installed, a gas-vent cannot be removed. Gas-vent systems remove the Attack Rating penalty for Semi-Automatic fire and reduce it to 2 for Burst Fire.
item.gyro_mount=Gyro mount
item.gyro_mount.page=259
item.gyro_mount.wifi=Activating the harness\u2019s quick-release with a wireless signal to exit the harness is a Minor Action.
item.gyro_mount.desc=This heavy harness features an articulated and motorized gyro-stabilized arm. The mount can hold a rifle or machine gun. The system negates the Attack Rating adjustment for Semi-Auto and Burst Fire and provides a +3 Attack Rating for Full-Auto. This system also shifts the Strength requirements for medium and heavy machine guns to 2+ and 4+ respectively. Attaching or removing a weapon from the mount takes a Minor Action.<br/>Putting on a gyro-mount harness takes about a minute, while the quick-release allows you to get out of it with a Major Action.
item.hidden_arm_slide=Hidden arm slide
item.hidden_arm_slide.page=260
item.hidden_arm_slide.wifi=You get a bonus Minor Action on any turn when you activate the slide.
item.hidden_arm_slide.desc=Attached to the forearm and worn under clothing, this slide can fit a Hold-out, Light Pistol, or Taser. With a Minor Action and a specific movement, the slide moves the weapon into your hand. The use of a hidden arm slide provides a bonus Edge when first used. It also increases the Concealability threshold by 1.
item.imaging_scope=Imaging scope
item.imaging_scope.page=260
item.imaging_scope.wifi=The scope\u2019s \u201Cline of sight\u201D can be shared, allowing you to share what your scope sees with your team (and yourself if you\u2019re using it to look around a corner).
item.imaging_scope.desc=The classic top-mounted scope that includes a micro camera and vision magnification, along with a Capacity of 3 for additional vision enhancements (p. 275). Attachment or removal takes only a Minor Action. The Take Aim Minor Action must be used in order to gain the benefits of an imaging scope, though the dice pool bonus from that action is not gained for the first action of use. <br/>When you are using an imaging scope, your target cannot gain Edge by having a higher Defense Rating.
item.laser_sight=Laser sight
item.laser_sight.page=260
item.laser_sight.wifi=The bonus to the Attack Rating increases to 2. You gain a bonus Minor Action on a turn when you activate or deactivate the laser sight.
item.periscope=Periscope
item.periscope.page=260
item.periscope.wifi=The dice pool penalty noted above is reduced to 0.
item.quick_draw_holster=Quick-draw holster
item.quick_draw_holster.page=260
item.shock_pad=Shock pads
item.shock_pad.page=260
item.silencer=Silencer
item.silencer.page=260
item.silencer.wifi=The silencer features systems and simple software that alerts you via AR if someone nearby moves quickly in response to the sound of the silenced weapon.
item.ares_lf_silencer=Ares Light Fire Series Silencer
item.ares_lf_silencer.page=260
item.ares_lf_silencer.wifi=The silencer features systems and simple software that alerts you via AR if someone nearby moves quickly in response to the sound of the silenced weapon.
item.smart_firing_platform=Smart firing platform
item.smart_firing_platform.page=260
item.smart_firing_platform.wifi=You can fire the mounted weapon remotely using an implanted smartlink using VR, replacing the system\u2019s dice pools with your own.
item.smartgun_system=Smartgun system
item.smartgun_system.page=260
item.smartgun_system.wifi=You gain a +1 dice pool bonus. Gain a bonus Minor Action on a turn when you use the Reload Smartgun or Change Device Mode actions to eject a clip or change fire mode
item.spare_clip=Spare clip
item.spare_clip.page=261
item.spare_clip.wifi=The clip provides a current ammo count even without a smartgun system.
item.spare_clip_predator=Spare clip for Ares Predator VI
item.spare_clip_predator.page=253
item.speed_loader=Speed loader
item.speed_loader.page=261
item.speed_loader.wifi=The speedloader transmits the type and count of rounds.
item.tripod=Tripod
item.tripod.page=261
item.tripod.wifi=The player gains a free Minor Action on a turn when they fold up, deploy, or remove the tripod.

