skill.con=Con
skill.con.page=94
skill.con.desc=The key aspect of this skill is persuasion where you act as someone or something you\u2019re not. Maybe you\u2019re acting like the long-lost heir to a portion of Dunkelzahn\u2019s hoard, or maybe you\u2019re pretending to be a down-on-their-luck business suit looking to make a big score to launch them back to the top. Whatever the case may be, Con is the skill you use to convince other people that you are something you are not.<br/><br/><b>Linked Attribute:</b> Charisma
