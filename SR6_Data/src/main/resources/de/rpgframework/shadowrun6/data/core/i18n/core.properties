npc.go_ganger=Go-ganger
npc.go_ganger.descEye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Street gangs and go-gangs alike have a rep for working together, but they\u2019re still just gangers.<br/>They\u2019re a step above an angry mob, but not much better. Knee breakers and debt collectors for crime syndicates aren\u2019t much better. They have a rep, they follow orders, and they\u2019ve got some weight behind them pushing them to succeed.
npc.go_ganger.page=206
npc.go_ganger.item.gang_leathers=Gang Leathers
npc.debt_collector=Debt Collector (Augmented)
npc.debt_collector.desc=Eye-Fivers. Rock Lobsters. Brain Eaters. Red Rovers. Street gangs and go-gangs alike have a rep for working together, but they\u2019re still just gangers.<br/>They\u2019re a step above an angry mob, but not much better. Knee breakers and debt collectors for crime syndicates aren\u2019t much better. They have a rep, they follow orders, and they\u2019ve got some weight behind them pushing them to succeed.
npc.debt_collector.page=206
npc.brute=Brute
npc.brute.desc=Ancients. Cutters. Sons of Sauron. Halloweeners. These are names feared for something more than just random violence (well, maybe that\u2019s exactly why the Halloweeners are feared). They are professional gangs and organizations designed to be the more militant arm of nicer policlubs.<br/>They\u2019ve gotten more time under fire, but they\u2019re still not pros, and they all have enough ego and rep that they push themselves a little harder to keep in the fight.
