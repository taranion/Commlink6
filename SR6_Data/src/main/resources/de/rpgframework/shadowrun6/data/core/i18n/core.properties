item.feedback_feature=Feedback Feature
item.feedback_feature.page=265
item.feedback_feature.desc=This haptic clothing allows for a tactile component to an augmented reality experience.
item.electrochromic_feature=Electrochromic Feature
item.electrochromic_feature.page=265
item.electrochromic_feature.desc=Electrochromic threads can change color with voltage, letting you alter the color of your clothing or display text, images, or patterns. This is good for fashion, but great for vanishing into a crowd if you need a quick costume change. You can even get armored clothing in electrochromic styles. It takes a Minor Action to change the settings on your electrochromic clothes, but two combat rounds to complete the change.
item.electrochromic_feature.wifi=You gain a free Minor Action during any turn when you change your clothes� settings, and your clothing can display images, text files, or video from your commlink.
item.clothing_street=Clothing (Street)
item.clothing_street.page=265
item.clothing_street.desc=Clothing in 2080 has some serious functionality options: commlinks, music players, and other electronic devices can be woven right in, powered by interwoven batteries or special energy-gathering fabrics.<br/>On the other side of the economy, cheap soybased \u201Cflats\u201D can be had for ten nuyen a set from vending machines around whatever sprawl you find yourself in. Spend more money, look more chic\u2014simple as that.
item.clothing_squatter=Clothing (Squatter)
item.clothing_squatter.page=265
item.clothing_squatter.desc=Clothing in 2080 has some serious functionality options: commlinks, music players, and other electronic devices can be woven right in, powered by interwoven batteries or special energy-gathering fabrics.<br/>On the other side of the economy, cheap soybased \u201Cflats\u201D can be had for ten nuyen a set from vending machines around whatever sprawl you find yourself in. Spend more money, look more chic\u2014simple as that.
