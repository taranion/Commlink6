item.attribute_increase=Attribute Increase
item.attribute_increase.page=288
item.attribute_increase.desc=Cyberlimbs can be used to add to either Agility, Armor, or Strength of the user. The maximum augmented increase of 4 is in place here, so don\u2019t buy an attribute increase that would increase one of your attributes higher than 4, as it would be a waste.<br/>\
 Increases to Armor increase your Defense Ratings at all times\u2014it is part of your overall protection, which is what Defense Rating represents. Increases to Agility and Strength only apply when the limb is used in some way in the process. For example, if a cyberarm has an increase to the user\u2019s Strength, that would increase their damage when doing an unarmed attack with that arm, but not when kicking. If an activity could reasonably be interpreted to use the whole body in some way (e.g., sprinting, climbing, swimming), then the cyberlimb increase would not apply.<br/>Note that Strength and Agility increases have no effect when they are included in a cyberskull.
item.armor_increase=Armor increase
item.armor_increase.page=288
item.armor_increase.desc=Cyberlimbs can be used to add to either Agility, Armor, or Strength of the user. The maximum augmented increase of 4 is in place here, so don\u2019t buy an attribute increase that would increase one of your attributes higher than 4, as it would be a waste.<br/>\
 Increases to Armor increase your Defense Ratings at all times\u2014it is part of your overall protection, which is what Defense Rating represents. Increases to Agility and Strength only apply when the limb is used in some way in the process. For example, if a cyberarm has an increase to the user\u2019s Strength, that would increase their damage when doing an unarmed attack with that arm, but not when kicking. If an activity could reasonably be interpreted to use the whole body in some way (e.g., sprinting, climbing, swimming), then the cyberlimb increase would not apply.<br/>Note that Strength and Agility increases have no effect when they are included in a cyberskull.
