skill.athletics=Athletics
skill.athletics.page=92
skill.athletics.desc=The Athletics skill is about physical grace and prowess, which is a combination of a number of factors\u2014strength, speed, quickness, nimbleness, and so on. More than that, it is the ability to coordinate all those qualities together, to draw on your abilities to meet what the situation demands.<br/>As a skill with a variety of uses, it can be employed in different ways. It is used in Sprint tests (p. 44) and Dodge Actions (p. 43), and it is an attack skill for thrown weapons. In general, it is paired with Agility to express a certain fluidity of movement, but it also can be linked to Strength for tests when sheer muscle power is needed. These tests are often Simple tests (Full Defense being an exception). Diving and free-falling are covered with this skill.<br/><br/><b>Primary Linked Attribute</b>: Agility<br/><b>Secondary Linked Attribute</b>: Strength (used for tests where extra resistance might be offered, like running through mud or something)
