item.dodge_scoot=Dodge Scoot
item.dodge_scoot.page=295
item.dodge_scoot.desc=It\u2019s exactly what you would expect from something called a Scoot. It\u2019s compact, fuel-efficient, and super-affordable, not something for shadowrunners, unless they were trying to blend in or intentionally get attacked by a go-gang.
item.harley-davidson_scorpion.desc=Big, bad, and built tough. The typical heavy-bodied, chromed road hog, with some armor and a whole lot of attitude. Usually seen on the streets under go-gangers, the Scorpion is still quite popular with the regular population thanks to the reputation of Harley-Davidson.
item.harley-davidson_scorpion=Harley-Davidson Scorpion
item.harley-davidson_scorpion.page=295
item.yamaha_growler=Yamaha Growler
item.yamaha_growler.page=295
item.yamaha_growler.desc=Popular with the thrill seeker, wilderness buff, and light-freight drug smuggler crowds, the best PR for the Growler came from its recent use by Sherman Kane on <i>Blood Hunters</i>.
item.suzuki_mirage.desc=Speed is the name of the game with the Mirage. A racing bike with a top end most never feel comfortable reaching, the Mirage is popular with go-gangers and other speed freaks.
item.suzuki_mirage=Suzuki Mirage
item.suzuki_mirage.page=295
item.chrysler-nissan_jackrabbit=Chrysler-Nissan Jackrabbit
item.chrysler-nissan_jackrabbit.page=295
item.chrysler-nissan_jackrabbit.desc=These little electric subcompacts are everywhere. Built with only the slightest styling changes for several decades this vehicle\u2019s popularity and anonymity draw runners to it for stakeouts and tailing targets. Just don\u2019t get into a car chase.
item.honda_spirit.desc=The three-wheeled electric sprawl commuter only has two seats, and both of them barely fit a human, let alone a more robust metatype. The price is their major draw, and while they don\u2019t have the numbers of the Jackrabbit, they\u2019re still pretty much everywhere.
item.honda_spirit=Honda Spirit
item.honda_spirit.page=295
item.eurocar_westwind_x80=Eurocar Westwind X80
item.eurocar_westwind_x80.page=296
item.eurocar_westwind_x80.desc=Speed and opulence in one hot package. The Westwind name has been near the top of luxury street machines since the \u201950s. With other luxury lines snagging engineers and designs from Eurocar, the competition has grown, hence the newly remodeled X80, which pushes the limits of performance and the verge of street legality right to the edge.
item.hyundai_shin-hyung.desc=If you want options, then this is the sedan for you. It\u2019s built around a fairly powerful motor, and the tuner community has latched onto this ride like a barghest with a piasma bone. Flash and performance can all be bought with the right investment.<br/>This setup has made it a popular choice in the Asian criminal factions as well as a way to seem tough if you\u2019re a spoiled corporate rich kid looking to slum with the street toughs.
item.hyundai_shin-hyung=Hyundai Shin-Hyung
item.hyundai_shin-hyung.page=296
item.ford_americar=Ford Americar
item.ford_americar.page=296
item.ford_americar.desc=Back with a vengeance, this four-door sedan is redesigned and just as boring as it was before. The vengeance part comes with the dip in the price tag to retake its top seat from the Mercury Comet, especially after the Comet had all those costly recalls. Nothing special to look at, but it will get you from here to there with no one giving you a second glance (unless you pack a pair of trolls in and you\u2019re scraping the frame at every bump).
item.saeder-krupp-bentley_concordat=Saeder-Krupp-Bentley Concordat
item.saeder-krupp-bentley_concordat.page=296
item.saeder-krupp-bentley_concordat.desc=The SK-Bentley Concordat is the kind of car that simstars and orxploitation rappers drive after they\u2019ve gotten some extremely ostentatious paint job on it. For the rest, the colors are classics, though a matte black has been very popular with young execs of late. This sedan is a dream car for corp youth, whether they\u2019re shooting for daddy\u2019s CEO spot, or want to be the next Krime.
item.mitsubishi_nightsky.desc=This is the armored limousine used by corp executives, media stars, and Mr. Johnsons to show you how the better half live. Sleek, stylish, and no slouch on performance, the Nightsky is a dangerous target and a decadent ride.
item.mitsubishi_nightsky=Mitsubishi Nightsky
item.mitsubishi_nightsky.page=296
item.toyota_gopher=Toyota Gopher
item.toyota_gopher.page=297
item.toyota_gopher.desc=The transformation of the Gopher from one of the most laughed-at trucks on the road to one of the pinnacle pickups of the late \u201970s was a long road of design, power, and feature upgrades. Now flaunted as <em>the</em> pickup to own, the Gopher offers off-road capability, great storage, and a roomy four-door cabin with plenty of creature comforts to go around.
item.gmc_bulldog.desc=The Bulldog is everywhere. As one of the best-selling delivery vans around the world, thanks to the protection of built-in armor, this van is also a staple of runners who enjoy the protection and anonymity of this abundant hauler. It has plenty of space for gear, drones, packages, or a few trolls. With the right paint job, it can blend in anywhere.
item.gmc_bulldog=GMC Bulldog Step-Van
item.gmc_bulldog.page=297
item.range_rover_model_2080=Range Rover Model 2080
item.range_rover_model_2080.page=297
item.range_rover_model_2080.desc=While its price tag makes it a status symbol for most, no one can deny the value the Model 2080 offers in terms of amenities and options. Though usually rolling through nothing more dangerous than a gated community, it is fully capable of taking a run in the dirt or mud. Due to the size, amenities, and rich-neighborhood anonymity, several security firms have been using these for a while, meaning several are available on the secondhand market if you don\u2019t mind cleaning up some blood and patching a few bullet holes. And what runner does?
item.ares_roadmaster.desc=This is a long-haul commercial van built like a tank. The Roadmaster is used across the wide-open spaces around the world, which are often full of go-gangs and nomadic hunters. It\u2019s heavily armored and designed for easy installation of a pair of remote turrets. Within the urban streets, they usually sport the logos of security firms that use them to transport valuables, both personnel and property.
item.ares_roadmaster=Ares Roadmaster
item.ares_roadmaster.page=297
item.samuvani_criscraft_otter=Samuvani CrisCraft Otter
item.samuvani_criscraft_otter.page=297
item.samuvani_criscraft_otter.desc=This five-meter-long craft is pretty, but also boring as the day is long. She\u2019s sold kitted for a variety of uses, including pleasure boating, fishing, light hauling, and utility work, but her open-hull design leaves only a small cabin to duck into in inclement weather. Best thing about her is that every body of water in the world has these things all over it.
item.aztechnology_sunrunner_nightrunner.desc=After gaining too much of an illicit reputation, the Nightrunner got an overhaul and a bunch of government contracts in places very friendly to Aztechnology, including Aztlan. It was retagged the Sunrunner, but there\u2019s no hiding that distinctive sealable canopy and the excess of cargo space (which make ample berths if you actually want to use it for cruising).
item.aztechnology_sunrunner_nightrunner=Aztechnology Sunrunner
item.aztechnology_sunrunner_nightrunner.page=297
item.gmc_riverrine=GMC Riverine
item.gmc_riverrine.page=297
item.gmc_riverrine.desc=Big guns and sweet sensors keeping the waterways of the world safe. This baby is a gunboat, plain and simple, but several folks around the world appreciate the armored hull and just keep the arms hidden to avoid looking like the law.
item.proteus_lamprey.desc=The oceans are no longer such a mystery. With aquacologies and arkoblocks all over the planet, watercraft to access them are becoming more common. The Lamprey is a sea-sled designed for underwater inspection and transportation. It has enough space for four passengers who can have their own scuba gear or use systems built onto the sled, though that doubles the cost and provides a total of sixteen metahuman-hours of air. <br/>Military models of the Lamprey, dubbed the Sea Snake, are used for aquatic insertions by spec-ops forces like the UCAS Navy SEAL teams or British SAS. Each seating space can be substituted for a drone rack with a small drone, or two slots can be traded for a medium drone. <br/>Depths with individuals on board are limited to 100 meters, but drone-loaded models can get down to 200 meters on a tether or with remote instructions. Wireless signals don\u2019t reach those depths.
item.proteus_lamprey=Proteus Lamprey
item.proteus_lamprey.page=297
item.ynt_delfin=YNT Delfin
item.ynt_delfin.page=297
item.ynt_delfin.desc=This three-person sub is ideal for underwater work with its wide array of interchangeable attachments. With the extensive military contracts under the purview of YNT, some of those attachments are offensive in nature. Whether being used for deep-sea rescue, arkoblock patrols, or recon and resupply for the latest aquacology construction, the Delfin has tools for every task.
item.artemis_industries_nightwing.desc=The Nightwing is a stealth glider masquerading as a toy for amateur aviation enthusiasts. With its shrouded electric motor, it makes practically no noise and has the same heat signature as a large hawk. In the country, it\u2019s found on the backs of fun-loving sky-junkies. In more urban settings, you\u2019ll see it on the backs of spec-ops forces gliding in undetected, and around the world it\u2019s attached to smugglers with bundles of lightweight but valuable goods.
item.artemis_industries_nightwing=Artemis Industries Nightwing
item.artemis_industries_nightwing.page=298
item.cessna_c750=Cessna C750
item.cessna_c750.page=298
item.cessna_c750.desc=A twin-prop civilian aircraft designed for carrying passengers and/or light cargo (legit or smuggled). It can also be used for surveillance in a pinch. Affordable and easy to maintain, it\u2019s a common sight at airfields around the world.
item.mct-sikorsky-bell_seahawk.desc=Saved during the acquisition of Sikorsky-Bell by MCT, the Seahawk program was headed for the dumps after MCT\u2019s troubles in the Algonkian-Manitou Council. The aircraft firm found the project, took it as theirs, and now offers a high-speed personal amphibious jet, capable of hauling six passengers or a decent stack of cargo at high speeds. Great for restocking remote spots or ducking off into the middle of nowhere to hide from the heat. <br/>This craft is amphibious and comes standard with buoyancy and flotation upgrades, meaning it can take off from land and water.
item.mct-sikorsky-bell_seahawk=MCT-Sikorsky-Bell Seahawk
item.mct-sikorsky-bell_seahawk.page=298
item.ares_dragon=Ares Dragon
item.ares_dragon.page=298
item.ares_dragon.desc=By churning these out year after year for corps, nations, and individuals, Ares has made the Dragon the most commonly identifiable cargo helicopter in the world. The double-rotor design gives it the lifting capability to handle heavy cargo, Firewatch strike teams, or an ordnance load that would give its namesakes pause.
item.mct-sikorsky-bell_wolfhound.desc=After a bad batch of rotor couplings put dozens of Nissan Hounds on the dirt permanently, MCT swooped in, stole the contract for the Imperial Japanese Marines, and has been creeping its newest rotorcraft into every market MCT touches\u2014and since MCT is the top mega, that\u2019s a lot of markets.<br/>Built for battle but sleek enough to make execs swoon, the Wolfhound is fast gaining a popularity similar to the Black Hawk at the turn of the century.
item.mct-sikorsky-bell_wolfhound=MCT-Sikorsky-Bell Wolfhound
item.mct-sikorsky-bell_wolfhound.page=298
item.northrup_wasp=Northrup Wasp
item.northrup_wasp.page=298
item.northrup_wasp.desc=This single-seater is standard fare for police and security forces. A heavy weapon mount, some light armoring, and a whole lot of speed and maneuverability make this thing a bane of runners, especially when flying in teams.
item.ares_venture=Ares Venture
item.ares_venture.page=298
