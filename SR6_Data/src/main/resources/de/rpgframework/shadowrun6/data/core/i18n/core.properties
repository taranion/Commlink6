npc.shaman.descThese are the brutes who grew up relying on their size or their anger in order to intimidate others for money or a cause. They typify the standard \u201Cangry mob\u201D that gathers at protests to rile one side or the other into violence. Often garbed in the street-scum style of Humanis, or the everyperson-casual of TerraFirst!, they only stay tough until someone gets tough back. Any real combatant, even a decker with a little street time behind him, can usually break these goobers.
