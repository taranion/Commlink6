quality.ambidextrous=Ambidextrous
quality.ambidextrous.page=70
quality.ambidextrous.desc=You are equally adept at using either your right or left side. Whether shooting a gun, throwing a grenade, or kicking a ball, you can switch it up with the best of them.<br/><br/><b>Cost:</b> 4 Karma<br/><b>Game Effect:</b> No penalty for off-hand weapon use (see p. 110).
quality.analytical_mind=Analytical Mind
quality.analytical_mind.page=70
quality.analytical_mind.desc=You are a master problem solver. You can analyze information to help deduce solutions, while separating useful bits from the distractions and noise.<br/><br/><b>Cost:</b> 3 Karma<br/><b>Game Effect:</b> You gain a bonus Edge when you make any Logic-based test.
quality.aptitude=Aptitude
quality.aptitude.page=70
quality.aptitude.desc=The best look up to you. You have the natural potential to be even better than the best in a particular skill.<br/><br/><b>Cost:</b> 12 Karma<br/><b>Game Effect:</b> Your skill maximum for the selected skill is 10, instead of 9, and your maximum starting rank is 7, instead of 6.
quality.astral_chameleon=Astral Chameleon
quality.astral_chameleon.page=70
quality.astral_chameleon.desc=Your aura never seems to stabilize for very long. You have the ability to blend in with the astral environment around you and make it harder to identify and read your aura and astral signature.<br/><br/><b>Cost:</b> 9 Karma<br/><b>Game Effect:</b> Characters receive \u20132 dice on tests to recognize your aura or astral signature. Your astral signature fades in half the normal time (see p. 159).
quality.blandness=Blandness
quality.blandness.page=70
quality.blandness.desc=You are the least interesting person in the world. You\u2019re average height, average weight, average build, average everything. Nothing at all about you tends to stand out, and that can be extremely useful.<br/><br/><b>Cost:</b> 8 Karma<br/><b>Game Effect:</b> Characters take a \u20132 penalty on Memory tests (p. 67) to remember if they have seen you before, and the threshold on tests to notice if you are following or observing them is increased by 1. \nIf the character acquires something permanent and distinctive\u2014obvious, unusual cyberware, a unique tattoo, that sort of thing\u2014they lose this quality. If they acquire something temporarily distinctive, such as an extreme hairdo, the effects are negated until those changes are reversed.
quality.built_tough=Built Tough
quality.built_tough.page=70
quality.built_tough.desc=You\u2019re built like a brick drekhouse. You\u2019re pretty good at taking a few extra hits before the lights go out.<br/><br/><b>Cost:</b> 4 Karma per level<br/><b>Game Effect:</b> You have a number of additional boxes on your Physical Condition Monitor equal to the rank of this quality.
quality.catlike=Catlike
quality.catlike.page=71
quality.catlike.desc=You have an innate grace usually seen only in the genus Felis that translates into smooth movements and a propensity for always landing on your feet\u2014literally, if not figuratively.<br/><br/><b>Cost:</b> 12 Karma<br/><b>Game Effect:</b> You gain a bonus Edge on all tests for balance, falling, and landing safely.<br/>Note the rules in the <b>Preventing Edge Abuse</b> section, p. 45.
quality.dermal_deposits=Dermal Deposits
quality.dermal_deposits.page=71
quality.dermal_deposits.desc=You have calciferous deposits growing on or through your flesh, making you tougher and a little rough around the edges. Literally.<br/><br/><b>Cost:</b> 7 Karma<br/><b>Game Effect:</b> You gain 1 level of natural Armor. Your Unarmed Melee attacks inflict Physical damage.
quality.double_jointed=Double Jointed
quality.double_jointed.page=71
quality.double_jointed.desc=Through practice or genetics, you\u2019ve managed to make most of the joints in your body bend beyond normal metahuman ranges. Your hands narrow to as small as your wrists, your shoulders rotate and bend in every direction, your body folds neatly in half both forward and backward, and you can rotate your head to look behind you without turning your shoulders, just to name a few of your neatest party tricks.<br/><br/><b>Cost:</b> 12 Karma<br/><b>Game Effect:</b> You gain a bonus Edge on all tests involving grappling, escaping bonds,flexibility, or fitting into tight spaces. Note the rules on <b>Preventing Edge Abuse</b>, p. 45
quality.elemental_resistance=Elemental Resistance
quality.elemental_resistance.page=71
quality.elemental_resistance.desc=Through genetics or training, you have developed a powerful resistance and tolerance for certain forms of damaging energy (or lack of energy, in the case of cold).<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> When choosing this quality, select an elemental form of damage (p. 109). When attacked with a weapon or spell (including unarmed combat by a spirit) that does this form of damage, gain a point of Edge before making your Defense test.
quality.exceptional_attribute=Exceptional Attribute
quality.exceptional_attribute.page=71
quality.exceptional_attribute.desc=Whether it\u2019s being a powerhouse, taking a hit from a troll, holding your synthahol, ducking a fast right, holding that inside turn, selling coal in Newcastle, or making a cat look clumsy, you\u2019re just naturally built to be better.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> Select a Physical or Mental attribute. That attribute's maximum (but not current) rank increases by 1. This quality can only be purchased once per attribute.
quality.first_impression=First Impression
quality.first_impression.page=71
quality.first_impression.desc=You know how to make an entrance and make that first meeting the best meeting. Your wit, charm, and subtle flattery put everyone you meet off their guard and let you make the most of a first encounter.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain 2 Edge for Social Tests during your first meeting with anyone, and both your Heat and Reputation are ignored for this first encounter.
quality.focused_concentration=Focused Concentration
quality.focused_concentration.page=71
quality.focused_concentration.desc=You know how to compartmentalize your mind and keep hold of arcane and emergent manipulations without straining yourself.<br/><br/>\u2022 <b>Cost:</b> 12 Karma per level<br/>\u2022 <b>Game Effect:</b> You can sustain multiple spells or complex forms without penalty. For each level, you can sustain 1 additional spell or complex form without suffering the associated penalty. The spell cannot have a modified Drain Value of 7 or greater.
quality.gearhead=Gearhead
quality.gearhead.page=71
quality.gearhead.desc=If it\u2019s meant to move but currently isn\u2019t moving so well, you know how to get it back into tip-top shape in a jiffy.<br/><br/>\u2022 <b>Cost:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> You gain an Edge on Repair tests for any vehicle and can spend Edge during downtime to make Extended Repair tests.
quality.guts=Guts
quality.guts.page=71
quality.guts.desc=It\u2019s not a lack of fear, just a lack of cowardice! You can stand up to the most intimidating opponents and hold your tongue under the toughest interrogations.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain an Edge when resisting Intimidation or effects that cause the Frightened status.
quality.hardening=Hardening
quality.hardening.page=72
quality.hardening.desc=Get clipped by IC and other personas enough times in the Matrix, and you can start to build defenses against it. Your physical form actually helps absorb some of the injuries coming at your Matrix persona.<br/><br/>\u2022 <b>Cost:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus Edge when making Matrix Damage Resistance tests. If you do not use that point of Edge immediately on the Damage Resistance test, it goes away. When struck by any damage in the Matrix, you can convert up to two boxes to Stun Damage, rather than Matrix damage, protecting your persona at the cost of yourself.
quality.high_pain_tolerance=High Pain Tolerance
quality.high_pain_tolerance.page=72
quality.high_pain_tolerance.desc=Pain is but an illusion of the mind. Either that, or you were born with congenital analgesia. Either way, you don\u2019t suffer the ill effects of injury and pain like others.<br/><br/> \u2022 <b>Cost:</b> 7 Karma<br/>\u2022 <b>Game Effect:</b> When wounded, reduce your wound penalty by one (to a minimum of 0).
quality.home_ground=Home Ground
quality.home_ground.page=72
quality.home_ground.desc=Spend enough time somewhere, and you get to know it like the back of your hand. In the local neighborhood, you know every turn, every back alley, every shop on the block, the local rivalries and romances, and you can use all of it to your advantage. In the Matrix, you\u2019ve spent countless hours in the code, you know its gremlins, its quirks, the local avatars, and the ones that are out of place.<br/><br/>\u2022 <b>Cost:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> Select a neighborhood or Matrix host each time you take this quality. Outdoors and Perception tests made in your Home Ground gain an Edge for use on that test; if you do not use the Edge on that test, it goes away.
quality.human-looking=Human-Looking
quality.human-looking.page=72
quality.human-looking.desc=Small orks, tall dwarfs, and ugly elves do exist. Whether through genetics or modifications, you do not look like your birth metatype; you appear human. The points in your ears are easily overlooked, your tusks are filed down to mere teeth, your cheekbones are rounder, your legs longer\u2014 that sort of thing. You can pass for human, which might help with humans or cause obstacles with non-humans.<br/><br/>\u2022 <b>Cost:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> You generally appear human at first glance and gain +2 dice on Disguise tests to hide your metatype and appear more human.
quality.indomitable=Indomitable
quality.indomitable.page=72
quality.indomitable.desc=Whether through deep studies, natural selection, or intense training, your mind is hard to break. You can hold out longer under interrogation, shrug off mild injuries with ease, and hold your mind against the onslaught of incoming mana.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> Edge Boost costs are reduced by 1 on tests involving Willpower.
quality.juryrigger=Juryrigger
quality.juryrigger.page=72
quality.juryrigger.desc=When you don\u2019t have the time or the parts to do it right, you can still get it done. Whether it\u2019s slapping on duct tape, twisting together wires that maybe shouldn\u2019t be connected, or just giving the thing a swift kick, you find a creative way to get a machine working, even if only briefly.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> When performing a Juryrigging test (see p. 95), you gain a point of Edge that must be spent on that test, or it goes away.
quality.long_reach=Long Reach
quality.long_reach.page=72
quality.long_reach.desc=Whether it\u2019s because of long arms, long legs, or some exceptional physical grace, you are able to reach people with melee weapons easier than others.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:<b/> When you are using a melee weapon, Close range is extended to 5 meters instead of 3.
quality.low-light_vision=Low-Light Vision
quality.low-light_vision.page=72
quality.low-light_vision.desc=Thanks to an increase in the number of rod cells in your natural eyes, an implanted increase of said rod cells, or an augmentation that enhances the light level of incoming data, you are capable of operating in light levels that would leave others essentially blind.<br/><br/>\u2022 <b>Cost:</b> 6 Karma<br/>\u2022 <b>Game Effect:</b> You can see clearly in any light level that is not total darkness (see Environment and Visibility, p. 118).
quality.magic_resistance=Magic Resistance
quality.magic_resistance.page=72
quality.magic_resistance.desc=You could have been born under a blood moon, filled your body with foreign substances, or had bits of your soul sucked out by a spirit or vampire. For good or ill, mana just doesn\u2019t seem to want to connect with you. Whether it\u2019s a manabolt trying to melt your brain, a fireball trying to cook you alive, or a healing spell trying to mend your wounds, it\u2019s just harder to get magic to work on you.<br/><br/>\u2022 <b>Cost:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus Edge for use on any Magic Resistance test; if you do not use it on that test, that point goes away. When a Health spell is cast on you, treat your Essence as if it were 2 points lower than it actually is.
quality.mentor_spirit=Mentor Spirit
quality.mentor_spirit.page=73
quality.mentor_spirit.desc=You believe in something other than yourself to help guide and channel your magic, and that something believes in you. Whether it be the totem of Wolf, the Norse god Loki, or the Christian God, you utilize your beliefs to shape and focus your arcane abilities more easily.<br/><br/>\u2022 <b>Cost:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> You gain the benefits listed with the description of your mentor spirit (see p.162). If you fail to keep aligned with one of those tenets, you lose your faith and connection to your mentor and all associated bonuses.
quality.photographic_memory=Photographic Memory
quality.photographic_memory.page=73
quality.photographic_memory.desc=Most people store life in clips, but you keep the recording running all the time. It\u2019s a ton of information to deal with at times, but it has made you great for trivia night and remembering the favorite color of your childhood friend.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus Edge point when making a Memory test (p. 67). If you do not use this point of Edge on the test, it goes away.
quality.quick_healer=Quick Healer
quality.quick_healer.page=73
quality.quick_healer.desc=You tend to heal from injury quicker than your peers, which is incredibly valuable in a profession that is all about putting your body on the line.<br/><br/>\u2022 <b>Cost:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> Cut the interval for any natural healing test (p. 120) in half, meaning you can heal Stun Damage after half an hour and Physical Damage after half a day.
quality.resistance_pathogens=Resistance To Pathogens
quality.resistance_pathogens.page=73
quality.resistance_pathogens.desc=When you claim, \u201CI\u2019ve never been sick a day in my life,\u201D there\u2019s a good chance it may be true. You have a very healthy immune system that has mastered the art of fighting off any and all comers that try to slip into your body and make you sick.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus point of Edge when you make a Pathogen Resistance test. If you do not use it on that test, it goes away.
quality.spirit_affinity=Spirit Affinity
quality.spirit_affinity.page=73
quality.spirit_affinity.desc=You have earned respect among a particular group of spirits/sprites. Through actions and favors, you\u2019ve gained a positive reputation that makes them treat you with extra consideration.<br/><br/>\u2022 <b>Cost:</b> 14 Karma<br/>\u2022 <b>Game Effect:</b> When selecting this quality, choose a type of spirit or sprite. You gain a bonus point of Edge when making a Conjuring or Tasking test for your chosen class of spirits/sprites. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.
quality.sprite_affinity=Sprite Affinity
quality.sprite_affinity.page=73
quality.sprite_affinity.desc=You have earned respect among a particular group of spirits/sprites. Through actions and favors, you\u2019ve gained a positive reputation that makes them treat you with extra consideration.<br/><br/>\u2022 <b>Cost:</b> 14 Karma<br/>\u2022 <b>Game Effect:</b> When selecting this quality, choose a type of spirit or sprite. You gain a bonus point of Edge when making a Conjuring or Tasking test for your chosen class of spirits/sprites. This quality can be taken multiple times, selecting a new class of spirits/sprites each time.
quality.thermographic_vision=Thermographic Vision
quality.thermographic_vision.page=73
quality.thermographic_vision.desc=Thanks to enhancements or just genetics, your vision allows you to see differences in temperature on and around objects and people, though most of the time ambient regular light overrides the heat signature. Large local sources of heat can create a glare of sorts, but usually something giving off that much heat is also giving off light, so your regular vision takes over.<br/><br/>\u2022 <b>Cost:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> You can see the heat of objects in total darkness (assuming they are warmer or colder than the ambient temperature), allowing you to operate in such conditions.
quality.toughness=Toughness
quality.toughness.page=73
quality.toughness.desc=Whether it\u2019s mental training, a physical regimen of self-inflicted injury, or you\u2019re just one tough bastard, you can take a bit more of a beating and shrug off the injuries better than most.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus point of Edge when making Damage Resistance tests. If you do not use it on the test, it goes away.
quality.toxin_resistance=Toxin Resistance
quality.toxin_resistance.page=73
quality.toxin_resistance.desc=Whether through naturally superior organs or because you think getting bit by a snake on a daily basis is a fun way to pass the time, you\u2019re able to better resist the effects of toxins in the Sixth World.<br/><br/>\u2022 <b>Cost:</b> 12 Karma<br/>\u2022 <b>Game Effect:</b> You gain a bonus point of Edge when you make a Toxin Resistance test (p. 121). If you do not use it on that test, it goes away.
quality.will_to_live=Will To Live
quality.will_to_live.page=74
quality.will_to_live.desc=No matter how hard the hit, you have the tenacity to hold on to the bitter end. You are quite capable of taking a .50-cal round to the chest and waking up in the hospital, rather than never waking up at all.<br/><br/>\u2022 <b>Cost:</b> 8 Karma per level<br/>\u2022 <b>Game Effect:</b> For every rank of this quality you possess, you gain two additional Damage Overflow boxes (see p. 121).
quality.addiction=Addiction
quality.addiction.page=74
quality.addiction.desc=Some habits just can\u2019t be kicked. It might be as simple as a need for a drag off that nic-stick to cool your nerves, or as life-twisting as a need for something better-than-life, but whatever it is, it\u2019s got a firm grip on you.<br/><br/>\u2022 <b>Bonus:</b> 2 Karma per level<br/>\u2022 <b>Game Effect:</b> You cannot earn Edge or spend Edge in any form while suffering withdrawal. Withdrawal times (the time that passes before you need your next hit) and requirements are based on the level of addiction and can be found on the Addiction Withdrawal table. When in withdrawal, take a \u20132 dicepool penalty on all tests; increase that penalty by 1 each time you pass another Withdrawal time period.
quality.allergy=Allergy
quality.allergy.page=74
quality.allergy.desc=Maybe it\u2019s a runny nose and poorly timed sneezes from pollen, or a full-blown anaphylactic reaction from some of those rare natural peanuts. Whatever it is, you suffer some level of discomfort from a substance found in the Sixth World.<br/><br/>\
 \u2022 <b>Bonus:</b> 2 to 20 Karma. The highest bonus is for a common extreme allergy, with a Karma bonus of 20. The Allergy Table lists a bonus modifier for each other type of allergy. A severe allergy has a \u20133 modifier, while an uncommon allergen has a \u20136. These two combine to \u20139; combining that with 20 makes the bonus from an uncommon severe allergy 11<br/>\
 \u2022 <b>Game Effect:</b> Select an allergen and severity to determine Karma value. You cannot spend or earn Edge while exposed to your allergen. You also suffer secondary effects, which are listed below.
quality.allergy.choice.allergen=Trigger
quality.allergy.choice.allergen.rare=Rare
quality.allergy.choice.allergen.uncommon=Uncommon
quality.allergy.choice.allergen.seasonal=Seasonal
quality.allergy.choice.allergen.common=Common
quality.allergy.choice.severity=Severity
quality.allergy.choice.severity.mild=Mild
quality.allergy.choice.severity.desc=You experience a \u20132 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you.
quality.allergy.choice.severity.moderate=Moderate
quality.allergy.choice.severity.moderate.desc=You experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you.
quality.allergy.choice.severity.severe=Severe
quality.allergy.choice.severity.severe.desc=You experience a \u20134 dice pool modifier to any test involving a Physical attribute while the allergen is affecting you. You also suffer 1 box of unresisted Physical Damage for every minute you are exposed to the allergen.
quality.allergy.choice.severity.extreme=Extreme
quality.allergy.choice.severity.extreme.desc=You experience a \u20136 dice pool modifier to all actions and suffer 1 box of unresisted Physical Damage for every 30 seconds you are exposed to the allergen.
quality.allergy.choice.description=Description
quality.ar_vertigo=AR Vertigo
quality.ar_vertigo.page=75
quality.ar_vertigo.desc=Whether it\u2019s just too much information, a focal issue in your visual field, or just an inability to focus when there\u2019s so much to look at, you get dizzy and nauseated when utilizing AR.<br/><br/>
\u2022 <b>Bonus:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> You cannot gain or spend Edge while utilizing AR of any sort. You also gain the Nauseated status (p. 52) while using AR and for one hour after you exit it.
quality.astral_beacon=Astral Beacon
quality.astral_beacon.page=75
quality.astral_beacon.desc=Whenever people talk about someone having a \u201Cbright soul,\u201D they make it sound like a good thing. You know it\u2019s not. Your bright aura makes you stick out like a sore thumb on the astral. You have a hard time hiding or masking your aura, you can\u2019t hide your feelings worth a damn, and attempts to locate you magically can be managed by first-year dropouts from Hagerstown Community College\u2019s Arcane Studies program.<br/>\u2022 Bonus: 10 Karma<br/>\u2022 <b>Game Effect:</b> You are considered Untrained for all Stealth tests in the astral plane. You can never take the masking metamagic. Assensing tests made against you get a free Edge, and all thresholds are reduced by 1. Astral Tracking tests made against you gain 2 Edge, and all thresholds are reduced by half.
quality.bad_luck=Bad Luck
quality.bad_luck.page=75
quality.bad_luck.desc=You were born under a bad sign, broke a mirror, spilled some salt, got the evil eye laid on you, or just can\u2019t catch a break. No matter the reason, things just go wrong around you. Often.<br/><br/>\u2022 <b>Bonus:</b> 10 Karma<br/>\u2022 <b>Game Effect:</b> Glitches occur more frequently. Count dice showing both 1 and 2 for determining a glitch. This does not affect critical glitches, only regular glitches.
quality.bad_rep=Bad Rep
quality.bad_rep.page=75
quality.bad_rep.desc=Word on the street does not speak favorably of you. Maybe you lost a team or got kicked from a team for breaking during interrogation. Whatever it is, your reputation precedes you, and never in the way you want it to.<br/><br/>\u2022 <b>Bonus:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> You cannot spend Edge on Social tests. If you engage in a Teamwork test to assist a Social test, no one can spend Edge, and the opposing individual gains a point of Edge.
quality.combat_paralysis=Combat Paralysis
quality.combat_paralysis.page=75
quality.combat_paralysis.desc=No matter how many times the street sam takes you to the range, you just can\u2019t help but jump and freeze that first time they start shooting. Sure, you recover, but you always feel a half step behind in the fight.<br/><br/>\u2022 <b>Bonus:</b> 8 Karma<br/>\u2022 <b>Game Effect:</b> Your Initiative Score is divided in half at the start of combat. You cannot take a Move or Sprint action in the first round, and you act last in that round. Your movement is restored to normal after the first round, but your Initiative Score is unchanged.
quality.dependents=Dependents
quality.dependents.page=75
quality.dependents.desc=Children, lovers, or something other, you have people relying on you for financial support. They live in your doss, eat your food, use your trid account, and generally cost you enough nuyen to keep you looking for that next score.<br/><br/>\u2022 <b>Bonus:</b> 4 Karma per level<br/>\
 \u2022 <b>Game Effect:</b> Choose a level for the dependents. <br/><em>Level 1</em> dependents are the equivalent of a family member who does not live with you but still needs support. Five percent of any score goes to this person. <br/><i>Level 2</i> dependents are more stable costs, like the support of a high-maintenance significant other, a child, or a small family. This level costs the runner 10 percent of every score. <br/><i>Level 3</i> dependents are rare in the shadows, because most runners don\u2019t have a regular family and a second life outside the shadows, which is what this level entails. This level costs the runner 25 percent of all their scores.<br/><br/>\
 For purposes of this quality, a \u201Cscore\u201D is any income that comes their way. Job payments, fencing stolen goods or paydata, or even gambling winnings. The people important to you prosper when you do!
quality.distinctive_style=Distinctive Style
quality.distinctive_style.page=76
quality.distinctive_style.desc=You only fit in when you\u2019re in places where no one fits in. The way you dress and look are unique to you. This isn\u2019t just a pink mohawk or a signature black trenchcoat. This is a two-meter-tall SURGEd lizard with a rainbow head frill, a head full of piercings including a bullring in his snout, dressed in full punk regalia. This is an albino ork who wears white sunglasses and a white trench coat over a head-to-toe white suit. A distinctive style is more than just what you choose to put on each day\u2014it\u2019s a way of life.<br/><br/>\u2022 <b>Bonus:</b> 6 Karma</br>\u2022 <b>Game Effect:</b> You cannot gain or spend Edge when you\u2019re not rocking your distinctive look. Others get a +2 dice pool bonus when conducting a Memory test (p. 67) to recall your appearance or remember if they have seen you before.
quality.elf_poser=Elf Poser
quality.elf_poser.page=76
quality.elf_poser.desc=Your blood may be human or ork, but your ears, cheekbones, and hoity-toity attitude are all elf. A surgery here and there, maybe a Sperethiel class on the Matrix, and a lot of time watching footage of the TÌr princes has you all set to join those you feel you truly belong with, no matter how round your ears or broad your tusks were at birth.<br/><br/>\u2022 <b>Bonus:</b> 6 Karma<br/>\u2022 <b>Game Effect:</b> Elves, orks, and trolls gain a point of Edge in Influence (Etiquette) tests made against you.
quality.glass_jaw=Glass Jaw
quality.glass_jaw.page=76
quality.glass_jaw.desc=Doesn\u2019t take much to lay you on your hoop. You just never could take a punch.<br/><br/>\u2022 <b>Bonus:</b> 4 Karma per level<br/>\u2022 <b>Game Effect:</b> You have 1 less Stun Box for each level of this Quality, down to a minimum of 2.
quality.gremlins=Gremlins
quality.gremlins.page=76
quality.honorbound=Honorbound
quality.honorbound.page=76
quality.impaired=Impaired
quality.impaired.page=76
quality.incompetent=Incompetent
quality.incompetent.page=76
quality.in_debt=In Debt
quality.in_debt.page=77
quality.insomnia=Insomnia
quality.insomnia.page=77
