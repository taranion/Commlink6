skill.biotech=Biotech
skill.biotech.page=84
skill.biotech.desc=This skill is for characters who know metahuman biology. In the Sixth World, that also means knowing how different augmentations and gear interact with it. This skill is used in First Aid tests (p. 119) and Healing tests (p. 120), and it also can be used when analyzing and repairing cyberware, bioware, and other augmentations. Another use is installing cyberware, but not other kinds of \u2019ware.<br/><br/><b>Primary Linked Attribute</b>: Logic<br/><b>Secondary Linked Attribute</b>: Intuition (this is rarely used\u2014it is applied when characters try to do something that is not exactly by the books)
