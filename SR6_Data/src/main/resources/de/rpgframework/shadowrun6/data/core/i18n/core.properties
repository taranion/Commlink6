adeptpower.adrenaline_boost=Adrenaline Boost
adeptpower.adrenaline_boost.page=156
adeptpower.adrenaline_boost.desc=You get a surge of energy so you can get the jump on others. For each level of the power, add 2 to your initiative score for (Magic) combat rounds. At the the end of those combat rounds, experience drain equal to the level of the power, which you can resist as normal.
adeptpower.astral_perception=Astral Perception
adeptpower.astral_perception.page=156
adeptpower.astral_perception.desc=You gain the ability to astrally perceive and follow the rules involved in so doing (see p. 159). You are dual-natured while using this power and can attack astral forms.
adeptpower.attribute_boost=Attribute Boost
adeptpower.attribute_boost.page=156
adeptpower.attribute_boost.desc=Mana flows into your body and enhances your inherent abilities, carrying you to a superior level. When purchasing this ability, it must be applied to a specific Physical attribute (Body, Agility, Reaction, or Strength); if this power is purchased multiple times, it can be used to either increase the rank connected to an already-selected attribute (up to 6) or to apply to a new attribute. It cannot be applied to Mental or Special attributes.<br/><br/>When this power is activated, roll Magic + Attribute Boost rating. Each hit temporarily boosts the rating of the designated attribute by 1, up to the augmented maximum of +4. This only affects dice pools, so your Initiative rank, Condition Monitor, Defense Rating, and so forth is not changed. The effect lasts for (net hits) combat rounds, and when it runs out, the adept takes drain equal to the level of this power, resisted as normal.
adeptpower.combat_sense=Combat Sense
adeptpower.combat_sense.page=156
adeptpower.combat_sense.desc=This power gives you the ability to anticipate and avoid harm. Gain a +1 dice pool bonus per level on any defensive tests. This bonus also applies to any surprise tests (p. 108) you make.
adeptpower.critical_strike=Critical Strike
adeptpower.critical_strike.page=156
adeptpower.critical_strike.desc=Increase the DV of your melee attacks by 1 per level of this power. This power is compatible with other enhancements from weapons and adept powers unless otherwise prohibited.
adeptpower.danger_sense=Danger Sense
adeptpower.danger_sense.page=156
adeptpower.danger_sense.desc=You have a sixth sense for danger, instinctively knowing when it\u2019s nearby and preparing for it. Gain an Edge before making Surprise tests.
adeptpower.direction_sense=Direction Sense
adeptpower.direction_sense.page=156
adeptpower.direction_sense.desc=You have a good sense of where you have been, where you\u2019re going, and a few of the obstacles in between. When making an Outdoors test related to directions, you may gain an Edge point, provided you spend it immediately on that test.
adeptpower.enhanced_perception=Enhanced Perception
adeptpower.enhanced_perception.page=157
adeptpower.enhanced_perception.desc=Your senses are keenly honed, giving you information in enough time for you to figure out what to do about it. Gain an Edge when Observing in Detail or making a Perception test to find something hidden or listen to something you\u2019re not supposed to hear.
adeptpower.enhanced_accuracy=Enhanced Accuracy
adeptpower.enhanced_accuracy.page=157
adeptpower.enhanced_accuracy.desc=Weapons are more accurate and deadly in your hands than in those of normal people. Increase the Attack Rating of any weapon you wield by 2.
adeptpower.improved_ability=Improved Ability
adeptpower.improved_ability.page=157
adeptpower.improved_ability.desc=A skill must be selected when this power is chosen. That skill receives an ongoing boost equal to the rating of the power. The maximum boosted value of the skill is 1.5 times the original (rounded up) or the augmented maximum, whichever is lower. You need to have at least one rank in a skill to buy this power for it, and the power can be purchased for multiple skills.
adeptpower.improved_ability_combat=Improved Combat Ability
adeptpower.improved_ability_combat.page=157
adeptpower.improved_ability_combat.desc=A skill must be selected when this power is chosen. That skill receives an ongoing boost equal to the rating of the power. The maximum boosted value of the skill is 1.5 times the original (rounded up) or the augmented maximum, whichever is lower. You need to have at least one rank in a skill to buy this power for it, and the power can be purchased for multiple skills.
adeptpower.improved_physical_attribute=Improved Physical Attribute
adeptpower.improved_physical_attribute.page=157
adeptpower.improved_physical_attribute.desc=Select a Physical attribute (Body, Agility, Reaction, or Strength) when purchasing this skill. That attribute receives an ongoing boost equal to the level of this power. The maximum boost to the attribute is 1.5 times the current level or the augmented maximum, whichever is lower.
adeptpower.improved_reflexes=Improved Reflexes
adeptpower.improved_reflexes.page=157
adeptpower.improved_reflexes.desc=This power gives you quick reflexes and anticipation, allowing you to act and react much faster than the normies. For each level of this power, add an Initiative Die and increase your Reaction by 1. The maximum level of this power is 4, and it cannot be combined with any other Initiative or Reaction boosts.
adeptpower.improved_sense=Improved Sense
adeptpower.improved_sense.page=157
adeptpower.improved_sense.desc=When this power is purchased, select a sense (sight, hearing, touch, taste, or smell). When making a test involving that sense, you get a bonus Edge, but only if you use it (either alone or in combination with other Edge points) on that test. Edge points from this power cannot be gained more than once when the same sense (noise, sight, flavor, etc.) is involved. This power can be selected more than once, each time for a different sense.
adeptpower.killing_hands=Killing Hands
adeptpower.killing_hands.page=157
adeptpower.killing_hands.desc=Your hands become lethal and magical, useful both in shadowrunning and cheesy pickup lines. When fighting unarmed, you can choose to deal Stun or Physical damage. Killing Hands can be combined with other powers affecting unarmed combat. Attacks made with Killing Hands are considered magical, meaning they bypass protections against normal weapons and can be made against astral beings.
adeptpower.kinesics=Kinesics
adeptpower.kinesics.page=157
adeptpower.kinesics.desc=Your command of body language and nonverbal communication is, well, magical, and it helps you be incredibly difficult to read. When you are resisting Social tests and tests to read your emotions, judge your intentions, or gauge your truthfulness, you gain an Edge point. Only one such Edge point can be gained per encounter.
adeptpower.mystic_armor=Mystic Armor
adeptpower.mystic_armor.page=157
adeptpower.mystic_armor.desc=Mana forms a shield around you, enhancing your protection. Gain 1 point of Armor for each level of this power, cumulative with worn Armor, which also increases your Defense Rating. Mystic Armor is also active on the astral plane.
adeptpower.pain_resistance=Pain Resistance
adeptpower.pain_resistance.page=157
adeptpower.pain_resistance.desc=Pain hurts, but you gain an elevated ability to ignore it. For each level of this power, the negative modifiers from damage move one box farther down the Condition Monitor\u2014for example, at level 1, you don\u2019t suffer the \u20131 penalty until 4 boxes are filled on a Condition Monitor, rather than 3. It works for both Stun and Physical Condition Monitors.
adeptpower.rapid_healing=Rapid Healing
adeptpower.rapid_healing.page=158
adeptpower.rapid_healing.desc=The magic that flows through you helps knit your bones and regrow your flesh, making you heal quickly. Add one hit per level on Healing tests performed to heal you.
adeptpower.spell_resistance=Spell Resistance
adeptpower.spell_resistance.page=158
adeptpower.spell_resistance.desc=Spells have a tendency to bounce off you rather than affect you. Gain a point of Edge when targeted by spells.
adeptpower.traceless_walk=Traceless Walk
adeptpower.traceless_walk.page=158
adeptpower.traceless_walk.desc=You don\u2019t disturb the dust, dirt, snow, water, or anything else under your feet as you move, so there is no evidence of your passing. You don\u2019t trigger tripwires, pressure pads, or other traps based on leg movement. Hearing tests to listen for your passage and Outdoors tests to perceive your tracks cannot gain or spend Edge.
adeptpower.vocal_control=Vocal Control
adeptpower.vocal_control.page=158
adeptpower.vocal_control.desc=You can control the pitch and modulation of your voice to make it sound the way you want\u2014 loud, quiet, resonant, or like some person you want to imitate. Gain Edge when attempting a Con or Influence test that somehow involves your voice. Only one point of Edge may be earned per encounter with this power.
adeptpower.wall_running=Wall Running
adeptpower.wall_running.page=158
adeptpower.wall_running.desc=Running horizontally is so pedestrian (get it?). Running up a wall is how you show you\u2019re special. When using this power, you can use a Sprint action (see p. 44) to run up a vertical surface. You cannot use this power for two actions in a row; you have to spend at least one turn moving across a horizontal surface before using this power again. So if you run up a wall and don\u2019t find a good foot or handhold, you\u2019ll be falling right back down.

