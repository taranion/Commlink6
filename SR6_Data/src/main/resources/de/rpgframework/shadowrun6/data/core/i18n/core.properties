item.cerebral_booster.desc=The convolutions and gyri of your cerebrum are augmented and amplified with additional nervous tissue, improving overall brain function. Your cerebral booster increases your Logic attribute by its rating.
item.damage_compensator=Damage compensator
item.damage_compensator.page=293
item.damage_compensator.desc=Damage compensators are essentially cut-offs stored in the nervous pathways that report pain from the body back to your brain. You ignore a number of damage boxes (your choice of Physical, Stun, or a combination of the two) equal to the compensator\u2019s rating before determining your injury modifiers.
