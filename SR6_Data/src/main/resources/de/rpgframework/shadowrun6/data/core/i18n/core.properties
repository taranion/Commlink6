skill.knowledge=Knowledge
skill.knowledge.page=98
skill.knowledge.desc=Knowledge skills do not have ranks, because they are not used directly in skill tests. Instead, they are used to provide opportunities to gain knowledge connected to other tests. For example, if a character has Security Systems knowledge and performs a Perception test to look over a corporate facility exterior, their test might give them a chance to see where cameras are located and when patrols go by. If they have the Seattle Gangs knowledge skill, a successful Perception test might help them know that the people walking up to them are members of the Halloweeners gang. The Seattle Streets Knowledge skill would help them when making Outdoors tests in the Seattle area. Players may also make Memory tests (p. 67) to see if they can recall certain facts about areas where they have a Knowledge skill.<br/>\
 By definition, Knowledge skills cannot be used untrained. 
skill.language.desc=Language skills are Knowledge skills with specialization ranks. That means they have four levels, like so:<br/>\
 \u2022 Sperethiel<br/>\
 \u2022 Sperethiel (Specialist)<br/>\
 \u2022 Sperethiel (Expert)<br/>\
 \u2022 Sperethiel (Native)<br/>\
 At the first level, you gain the ability to use Perception tests to understand things in that language, which you could not have done before. This functions the same as other Knowledge skills. At the second level, you gain 2 dice on tests related to understanding the language. At the third level, the dice pool bonus on tests to understand the language increases to 3. Native speakers do not have to roll a test to understand that language.

