item.adrenaline_pump=Adrenaline pump
item.adrenaline_pump.page=291
item.adrenaline_pump.desc=This enhanced gland is implanted in the lower abdomen, connected to both supradrenal glands. When dormant, the pump is merely a reservoir for adrenaline. When activated, a small muscular sac contracts, sending a surge of concentrated adrenaline into the blood stream. Physical and emotional stress can force your pump to activate if you fail a Composure test (p. 67); otherwise you can trigger it as a Minor Action. While the pump is active, you ignore injury modifiers, don\u2019t fall unconscious even if your Stun Condition Monitor is filled, you can\u2019t rest, and the adrenaline pump\u2019s rating is added to your Strength, Agility, Reaction, and Willpower attributes. The pump works for (rating x 1D6) combat rounds, and it can\u2019t be switched off early. <br/>When time\u2019s up, you crash and take Stun damage equal to one half, rounded up, of the number of combat rounds the pump was active (use unaugmented Body to resist the damage).<br/>After the effect\u2019s end, your attribute values return to normal and you stop ignoring injury modifiers or unconsciousness from Stun damage. After use, the pump requires one hour to regenerate its supply. During that time, it cannot be activated.
item.bone_density_augmentation=Bone density augmentation
item.bone_density_augmentation.page=291
item.bone_density_augmentation.desc=The molecular structure of your bones is altered to increase density and tensile strength. Ligaments are strengthened, and the greater bone density increases your weight by fifteen percent. You gain its rating as extra Body when resisting physical damage. Your unarmed combat damage becomes Physical and your Damage Value and Attack Rating increase per the table below. Bone density augmentation is incompatible with other augmentations to bones, including bone lacing cyberware.
item.cats_eyes=Cat\u2019s eyes
item.cats_eyes.page=291
item.cats_eyes.desc=These transgenic vat-grown implants are very literally cats\u2019 eyes with a modified DNA profile and occipital connecting structures. The structure of cat\u2019s eyes amplifies light and enhances night vision, providing low-light vision (p. 72). Cat\u2019s eyes are slit and reflective, just like, well, a cat\u2019s. This bioware is obviously not compatible with cyberware eye replacements, but individual vision enhancements can be purchased.
