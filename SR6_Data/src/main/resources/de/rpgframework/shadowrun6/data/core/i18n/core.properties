complexform.cleaner=Cleaner
complexform.cleaner.page=190
complexform.cleaner.desc=Make an Electronics + Resonance test. Each hit reduces your Overwatch Score by 1
complexform.diffusion=Diffusion
complexform.diffusion.page=190
complexform.diffusion.desc=Make an Electronics + Resonance vs Willpower + Firewall opposed test. Each net hit reduces (attribute) by 1, to a minimum of 1. Can be purchased multiple times, with each time targeting a different attribute.
complexform.editor=Editor
complexform.editor.page=190
complexform.editor.desc=You can take the Edit File action on a file even if you do not have the proper access level. You must still be able to detect the file.
complexform.emulate=Emulate
complexform.emulate.page=190
complexform.emulate.desc=This form can be purchased multiple times; each time you can choose 1 program to run. Includes autosofts, whose rating equals the technomancer\u2019s current Data Processing rating.
complexform.infusion=Infusion
complexform.infusion.page=190
complexform.infusion.desc=Make a simple Electronics + Resonance (4) test, each net hit increases (attribute) by 1 up to twice the targets normal rating. Can be purchased multiple times, each time for a different attribute.
complexform.mirrored_persona=Mirrored Persona
complexform.mirrored_persona.page=190
complexform.mirrored_persona.desc=You can create a proxy persona that looks and acts identical to you in the Matrix. When launching this form, roll Electronics + Resonance; the number of hits serves as the rating of the duplicate persona you create. When targeting the Technomancer with a Matrix Action, opponents must succeed on a Matrix Perception test with a threshold of that rating.<br/>If they fail, opponents target the proxy with their Matrix Action and then Mirrored Persona ends.
complexform.pulse_storm=Pulse Storm
complexform.pulse_storm.page=190
complexform.pulse_storm.desc=Make an Electronics + Resonance vs. Logic + Data Processing test. Each net hit increases the target\u2019s noise rating by 1.
complexform.puppeteer=Puppeteer
complexform.puppeteer.page=190
complexform.puppeteer.desc=You may take the Control Device action on a device even if you do not have the proper access level. You must still be able to detect the device.
complexform.resonance_channel=Resonance Channel
complexform.resonance_channel.page=190
complexform.resonance_channel.desc=Make an Electronics + Resonance test. Each hit reduces your noise level by 1.
complexform.resonance_spike=Resonance Spike
complexform.resonance_spike.page=190
complexform.resonance_spike.desc=Make a Cracking + Resonance vs. Willpower + Firewall test; each net hit causes 1 box of unresisted Matrix damage.
complexform.resonance_veil=Resonance Veil
complexform.resonance_veil.page=190
complexform.resonance_veil.desc=Create an illusion of Matrix activity that has the sights, sounds, and other sensory inputs of a genuine Matrix occurrence. Make an Electronics + Resonance vs. Intuition + Data Processing test. Even if the target has reason to believe what it\u2019s seeing is fake, they must make a Matrix Perception test with a threshold equal to your net hits to see through the illusion.
complexform.static_bomb=Static Bomb
complexform.static_bomb.page=190
complexform.static_bomb.desc=Make an Electronics + Resonance vs. Intuition + Data Processing test against all targets that can detect you. Any target that doesn\u2019t roll any net hits loses perception of you and must perform a Matrix Perception test to locate you once more before they may take any further action against you.
complexform.static_veil=Static Veil
complexform.static_veil.page=191
complexform.static_veil.desc=Make an Electronics + Resonance vs. Willpower/Firewall + Firewall test. While this form is sustained, the target will not accumulate Overwatch Score from maintaining illegal access to a host on a sprite. OS will still increase due to illegal actions, though.
complexform.stitches=Stitches
complexform.stitches.page=191
complexform.stitches.desc=Make an Electronics + Resonance test. Each net hit repairs 1 box of Matrix damage on a sprite.
complexform.tattletale=Tattletale
complexform.tattletale.page=191
complexform.tattletale.desc=Make an Electronics + Resonance test. Each hit increases the target\u2019s Overwatch Score by 1.

critterpower.accident=Accident
critterpower.accident.page=221
critterpower.accident.desc=Critters with this power can cause seemingly normal accidents to occur. The exact nature of the accident is up to the gamemaster, based on what the target is doing and what\u2019s going on around him. This power isn\u2019t dangerous in and of itself, but circumstance and environment can come into play to make it so. For example, blowing a tire and swerving in front of an oncoming drone bus could be hazardous to your health.<br/>When a critter targets someone with this power, make an Opposed test, using the critter\u2019s Magic + Willpower against the target\u2019s Reaction + Charisma. If the critter wins, treat it as if the target rolled a glitch on a test and use the Glitch Ideas (p.233) if you want. If the critter scores 4 or more net hits, the accident is treated as a critical glitch\u2014it\u2019s not just an embarrassing fumble, it\u2019s a potential catastrophe.
critterpower.animal_control=Animal Control
critterpower.animal_control.page=221
critterpower.animal_control.desc=Some critters can manipulate other critters, usually mundane ones, but not always. The behavior must be \u201Cnormal\u201D for the target animal. A flock of birds couldn\u2019t steal a motorcycle, but they could certainly empty their bowels on it, follow it, or land all over it. New control commands can only be issued while still in the controlling critter\u2019s line of sight, but targets will continue to follow any orders they had already been given for the critter\u2019s Charisma in minutes. The critter may control a number of small animals (cats, rats, etc.) equal to its Charisma x 5, a number of larger animals (wolves, lions, bears, etc.) equal to its Charisma, or a single appropriate paranormal critter. This power may not be used on any critter with the Sapience power.
critterpower.armor=Armor
critterpower.armor.page=221
critterpower.armor.desc=Scales, dermal bone deposits, a thick hide, or a heavy layer of fur and fat all offer a critter with this power some inherent protection from physical attacks. The critter\u2019s natural Armor increases the Defense Rating of the critter and is cumulative with the boost from any worn armor.
critterpower.astral_form=Astral Form
critterpower.astral_form.page=222
critterpower.astral_form.desc=A critter with this power only exists on the astral plane. It can only be affected by astral attacks or mana spells/powers; physical attacks or spells/powers have no effect. An astral critter can only affect dual-natured beings or those on the astral plane, whether through astral projection or astral perception. Critters with this power may manifest on the physical plane in the same ghostly way as astrally projecting magicians (see p. 160).
critterpower.binding=Binding
critterpower.binding.page=222
critterpower.binding.desc=It may be webbing, a sticky goo, a sticky tongue, or some magical force that allows a critter with this power to maker its target stick to any surface the target happens to be touching, including the critter itself.<br/>\
 The range of this power depends on how the critter binds its targets; it may shoot something (Range: LOS), have a sticky body (Range: Touch), or just be good at sticking to things (Range: Self).<br/>\
 For LOS range, the critter makes an attack using Magic + Agility vs. Athletics + Reaction. A successful hit applies the Immobilized status. The target is affected and must spend a Major Action on its turn in order to make an escape attempt.<br/>\
 For Touch range, the critter makes an attack using Magic + Agility vs. Close Combat + Reaction. A successful hit applies the Immobilized status with a small variation. In this case, the target is stuck to the creature and cannot move away without first breaking free, but the creature can move with the target as long as its Strength is at least 1/2 the target\u2019s Body. Breaking free is described below.<br/>\
 For the Self range, no roll is made, and the critter is allowed to move along vertical and inverted surfaces at their normal Movement rate.<br/>\
 Breaking free from this power requires a Major Action. Roll Strength + Body against the critter\u2019s Magic + Willpower. If the target prevails, they have escaped. If they fail, the Immobilized status remains until the next time they can attempt an escape.
critterpower.compulsion=Compulsion
critterpower.compulsion.page=222
critterpower.compulsion.desc=This power enables the critter to compel a target to perform a specific action, even if that action might not be in the target\u2019s best interests, including actions harmful to themselves or others. The critter must make an Opposed test using its Magic + Charisma against the target\u2019s Willpower + Logic; if the target loses, they must fulfill the compulsion on their next available action, before taking any other actions.<br/>The critter must sustain the power until the action is complete for it to work, but can choose to drop it at any time, releasing the target from the compulsion.<br/>The victim immediately recognizes that they were compelled to act after this power is used. This power can\u2019t be used to plant suggestions for future compelled actions; once the power is dropped or the task completed, the target\u2019s mind is their own once again, along with the horror of what they just did.
critterpower.concealment=Concealment
critterpower.concealment.page=222
critterpower.concealment.desc=Critters with this power can mystically hide themselves, other people, or things that someone else is seeking. Concealment applies the Invisible (Improved) status equal to the critter\u2019s Magic attribute. In combat, an Observe in Detail Major Action must be used to allow a Perception test to attempt to overcome the concealment. Success means the target is spotted by that character until the critter can hide again or the end of the character\u2019s next player turn, whichever comes last.<br/>\
 Concealment can be used simultaneously on a number of average metahuman-sized targets (Body up to 5; Body over 5 counts as 2 targets) equal to the critter\u2019s Magic, or a number of much smaller targets (cats, babies, rats, etc.) equal to the critter\u2019s Magic x 5. Concealed subjects can see each other if the critter allows it. The effect lasts until the critter stops sustaining the power.
critterpower.confusion=Confusion
critterpower.confusion.page=222
critterpower.confusion.desc=This power causes the target to become indecisive, forgetful, and befuddled. This power causes the target to become indecisive, forgetful, and befuddled. The critter makes an Opposed test using its Magic + Willpower against the target\u2019s Willpower + Logic. If the critter scores any net hits, the target gains the Dazed status and the Confused status at a rating equal to the net hits.
critterpower.corrosive_spit=Corrosive Spit
critterpower.corrosive_spit.page=222
critterpower.corrosive_spit.desc=The critter can project an extremely caustic substance as an attack. Make a ranged combat attack, using the critter\u2019s Magic + Agility. The attack has a DV of (Magic)P (Chemical), Attack Ratings of Near (Magic x 2), Close (Magic x 2) \u2013 2, Medium (Magic x 2) \u2013 8, Far (Magic x 2) \u2013 10. If the Attack Value drops to 0, the spit attack cannot reach those ranges.
critterpower.dual_natured=Dual Natured
critterpower.dual_natured.page=223
critterpower.dual_natured.desc=Dual-natured critters are active on both the astral and physical plane at the same time. They can interact with both astral and physical beings. They perceive the astral plane similarly to characters using astral perception (see <b>The Astral Plane</b>, p. 159), but being dual natured is different from astral perception. Dual-natured critters always sense both the physical and astral planes, meaning their minds are accustomed to processing both astral and physical sensations, so dual-natured critters don\u2019t suffer the \u20132 dice pool modifier for interacting with the physical world while astrally perceiving.
critterpower.elemental_attack=Elemental Attack
critterpower.elemental_attack.page=223
critterpower.elemental_attack.desc=Whether it\u2019s a burst of flame, a spear of ice, a bolt of lightning, or a glob of caustic chemicals, a critter with this power can project a damaging bolt of elemental energy. The power is selected with a specific element type: Electricity, Fire, Chemical, or Cold.<br/>Make a ranged combat attack, using the critter\u2019s Magic + Agility. The attack has a DV of (Magic)P (Damage Type), Attack Ratings of Near (Magic x 2), Close (Magic x 2) \u2013 2, Medium (Magic x 2) \u2013 8, Far (Magic x 2) \u2013 10. If the Attack Rating drops to 0 or lower, the elemental attack cannot reach those ranges. <br/>The target also gains the appropriate Status Effect for the attack type: Zapped (Electricity), Burning (Fire), Corroded (Chemical), or Chilled (Cold)
critterpower.energy_aura=Energy Aura
critterpower.energy_aura.page=223
critterpower.energy_aura.desc=This critter is surrounded by a field of damaging energy, which can take the form of fire, cold, electricity, or a caustic brew of chemicals. The power is selected with a specific element type. The critter adds its (Magic/2, rounded up) to the Damage Value of any Close Combat attack it makes. The damage inflicts the appropriate status\u2014Zapped (Electricity), Burning (Fire), Corrosive (Chemical), Chilled (Cold)\u2014and increases the Attack Rating by the critter\u2019s Magic.<br/>Successful unarmed Close Combat attacks against a critter with Energy Aura also damage the attacker. The attacker makes a Damage Resistance test against a DV equal to the critter\u2019s (Magic)P and gains the appropriate Status tied to the energy type as above.<br/>Unless indicated in the critter\u2019s description, this power is always on and cannot be turned off.
critterpower.engulf=Engulf
critterpower.engulf.page=223
critterpower.engulf.desc=This power allows a critter to envelop a target within itself or the terrain it controls, smothering the target and causing damage. This is a Close Combat attack with a DV equal to (Magic)P (Damage Type) as well as specific effects by element, an increase to the Attack Value of +Magic, and the critter has engulfed its target in its grasp. Net hits on the Close Combat attack increase damage normally, and the target gets a standard Damage Resistance test. Even if all the damage is resisted, the target is still engulfed. Once engulfed, a target suffers the Immobilized status. On its player turn, the critter automatically inflicts damage as above on an engulfed target and the target gets to resist each time as above. On the target\u2019s player turn, they may use a Major Action to attempt escape by making an Opposed test, rolling the target\u2019s Strength + Athletics against the critter\u2019s Magic + Body. If the target wins, they escape and take no more damage from the attack. Some Engulf powers have secondary effects, as described below.<br/>\
 <b>Air Engulf:</b> The target resists Stun damage with a DV equal to (Magic + 2). If the victim passes out from Stun damage, they continue to take damage, with the Stun damage overflowing into Physical damage as normal. Victims gain the Fatigued I status.<br/>\
 <b>Earth Engulf:</b> The target resists Physical damage with a DV equal to (Magic + 2). Victims gain the Fatigued I status.<br/>\
 <b>Fire Engulf:</b> The victim resists Physical damage and gains the Burning status for as long as they are engulfed + 1 combat round.<br/>\
 <b>Water Engulf:</b> The victim resists Stun with a DV of (Magic + 2). This is rougher than normal drowning, because the critter is capable of exerting great pressure on the victim. Victims who pass out from Stun damage continue to take damage after falling unconscious, with the Stun damage overflowing into Physical damage as normal. The victim suffers the Wet and Fatigued I statuses.
critterpower.enhanced_senses=Enhanced Senses
critterpower.enhanced_senses.page=223
critterpower.enhanced_senses.desc=This power includes any improved or augmented senses beyond the normal human range of awareness. This includes low-light and thermographic vision, improved hearing and smell, heat-sensing organs, natural sonar, and so on. The actual enhanced senses are specified in the description. For the effects of the enhanced senses, locate their technological equivalent in the Gear chapter (p. 275).
critterpower.essence_drain=224
critterpower.essence_drain.page=Essence Drain
critterpower.essence_drain.desc=This power allows a critter to permanently take away another being\u2019s Essence and add it to its own. Essence Drain can only target physical, sapient beings (characters and non-astral critters with the Sapience power). The target must be naturally sapient, not made sapient through another power, magic, or tech. <br/>Essence can\u2019t be drained while the victim is actively, physically resisting. They must either be willing or subdued (restrained, paralyzed, mentally controlled, etc.). Essence transfer can only take place through a strong emotional connection, whether that emotion is passion, anger, or terror. The emotion must also be focused on the critter using the power. Abstract terror is not enough; the victim must be specifically terrified of his attacker in order for the attacker to drain the victim\u2019s Essence. Though there is often a transfer of living material involved in an Essence Drain attack (a vampire drinking their victim\u2019s blood, for instance), nothing but the emotional connection is actually required for this power to work. Draining a point of Essence takes a Charisma + Magic (10 \u2013 target\u2019s Essence, 1 minute) Extended test. Victims suffer the Fatigued Status Effect equal to the number of Essence points drained.<br/>\
 If the critter is disturbed or interrupted before this test ends, the Essence point is not drained. Lost Essence affects a target character\u2019s Magic or Resonance Rating (see Essence, p. 38). If a target character\u2019s Essence is drained to 0, the character dies. <br/>\
 A critter can only increase its Essence to twice its natural maximum. Any Essence drained beyond this point is lost.<br/>\
 A critter that drains Essence can pump their stolen life force into other attributes, including Magic, with a Minor Action. Every point of Essence spent may temporarily boost one Physical or Mental attribute, or Magic, by 1. Multiple points of Essence can be pumped into a single attribute if so desired, but only one point can be moved per Minor Action. The maximum boost an attribute can receive in this fashion is 4. This attribute boost wears off after 12 hours, and the Essence points used to fuel the boost are lost.
critterpower.fear=Fear
critterpower.fear.page=224
critterpower.fear.desc=This power allows a critter to fill its victim with
overwhelming terror. The victim flees in panic and doesn\u2019t stop until they are safely away and out of the critter\u2019s sight, at which point they gain both the Panicked and Frightened statuses. The critter makes an Opposed test using its Willpower + Magic against the target\u2019s Willpower + Logic. The terror lasts for 1 combat round per net hit scored by the critter, while the status lasts double that number of combat rounds. Even once the fear fades, the target must succeed in a Willpower + Logic (Critter\u2019s Magic/2) test to gather the nerve to face the critter again.
critterpower.guard=Guard
critterpower.guard.page=224
critterpower.guard.desc=This power allows the critter to protect againstthe Accident power and glitches caused by dice rolls. Guard may be used on a number of targets at once equal to the critter\u2019s Magic attribute. When under the Guard power, critical glitches are downgraded to glitches and glitches are simply failures, unless the Accident power is in use, and then the Guard power simply cancels the effects of Accident and all is normal.
critterpower.hardened_armor=Hardened Armor
critterpower.hardened_armor.page=224
critterpower.hardened_armor.desc=This power is the reason you don\u2019t hunt dragons with a heavy pistol. This power provides its rating as an addition to Defense Rating. It also provides its rating as automatic hits on the Damage Resistance test. Finally, if the modified Damage Value of an attack is less than the Hardened Armor rating, the attack does no damage. Don\u2019t make a Damage Resistance test for the critter, as the attack bounces harmlessly off its hide. The attacker is allowed to be annoyed.
critterpower.hardened_mystic_armor=Hardened Mystic Armor
critterpower.hardened_mystic_armor.page=224
critterpower.hardened_mystic_armor.desc=This power provides protection from all attacks on the astral plane, including spells and critter powers. This power provides its rating as an addition to Defense Rating. It also provides its rating as automatic hits on the Damage Resistance test. Finally, if the modified Damage Value of an attack is less than the Hardened Armor rating, the attack does no damage. Don\u2019t make a Damage Resistance test for the critter, as the attack bounces harmlessly off its hide. The attacker is allowed to be annoyed.
critterpower.immunity=Immunity
critterpower.immunity.page=224
critterpower.immunity.desc=A critter with Immunity has an enhanced resistance to a certain type of attack or affliction. Effectively, the critter has a Hardened Armor with a rating equal to its Essence against that particular kind of damage (see Hardened Armor, above).<br/><br/>\
 <b>Immunity to Age:</b> This immunity halts the effects of aging, effectively making the being with it immortal \u2026 unless they live a dangerous life.<br/>\
 <b>Immunity to Normal Weapons:</b> This applies to all attacks that are not magical in nature; weapon foci, spells, and adept or critter powers function normally. If the critter also has the Allergy or Vulnerability weakness, then the Immunity does not apply against non-magical attacks made using the allergen or vulnerability.
critterpower.infection=Infection
critterpower.infection.page=225
critterpoqwe.infection.desc=This power is the vector by which the human-metahuman vampiric virus (HMHVV) is transmitted. When a critter with this power uses Essence Drain on a victim, this power attempts to pass the critter\u2019s own infection on to the victim when Essence is drained to 0. To see if the victim is Infected, make an Opposed test of the critter\u2019s Magic x 2 against the victim\u2019s Body + Willpower.<br/>If the critter wins, the victim is Infected and enters a coma-like state as the virus reshapes the victim physically, mentally, and spiritually. Twenty-four hours later, the victim rises as a new Infected critter (as determined by its original metaspecies) with a single point of Essence and an insatiable, bestial hunger for more. The new Infected critter must do everything in its power to use the Essence Drain power on the first source it finds.<br/>Player characters transformed through the Infection power automatically become NPCs when they enter their coma and are controlled by the gamemaster from that point forward (for now, mwahahahahaha).
critterpower.influence=Influence
critterpower.influence.page=225
critterpower.influence.desc=This power gives the critter the ability to implant a suggestion in the target\u2019s mind. Make a Magic + Charisma vs. Willpower + Logic Opposed test. If the critter succeeds, its target acts on the suggestion as if it were their own idea. If the target is confronted with the wrongness of the suggestion (such as \u201Cshoot your spouse in the face\u201D), the subject can make a Willpower (critter\u2019s Magic) test to overcome it. Any hits on this test allow a dice-pool penalty on whatever action must be performed. If the character fails at the Willpower test, Edge Boosts and Actions can be used in reverse, i.e., 4 Edge to subtract your Edge from your dice pool or 5 Edge to create an event like the gun jamming.
critterpower.innate_spell=Innate Spell
critterpower.innate_spell.page=225
critterpower.innate_spell.desc=This power allows the critter to cast a single, specific spell. To use this power effectively, the critter has to have the Sorcery skill, but if they don\u2019t, they can simply roll Magic with no penalty. Innate Spells come from the list of spells cast by magicians and can be opposed with Counterspelling actions. Innate Spells also produce drain as normal and cause a \u20132 penalty on actions when they are sustained.<br/>Critters and spirits resist drain with Willpower + Intuition or Charisma (whichever is higher).
critterpower.materialization=Materialization
critterpower.materialization.page=225
critterpower.materialization.desc=This power allows astral beings to take shape in the physical world and form a temporary \u201Cbody\u201D to inhabit while they\u2019re here. This lets them interact with, and affect, physical beings. Their form pulls from local resources appropriate to the type of spirit but never creates loopholes to be manipulated, like summoning a spirit to remove a section of wall to make its physical form. Additionally, they gain Immunity to Normal Weapons while materialized. Materializing requires a Major Action, while dematerializing to return to the astral plane requires a Minor Action.
critterpower.mimicry=Mimicry
critterpower.mimicry.page=225
critterpower.mimicry.desc=This power allows a critter to imitate sounds perfectly, including speech and the hunting calls of other creatures to which the mimicking critter has been exposed. Noticing that the mimicked sound is false requires a Perception + Intuition + vs. Charisma + Magic Opposed test.
critterpower.mindspeech=Mindspeech
critterpower.mindspeech.page=225
critterpower.mindspeech.desc=Some sapient critters, for example dragons, don\u2019t have complex vocal cords. These critters are able to communicate telepathically with beings within their line of sight using this power. Language barriers do not inhibit the power. This telepathic communication can\u2019t be detected by technological means, so critters communicating this way using modern technology must employ a \u201Ctranslator\u201D to speak for them. This power lets the critter project speech, but the targets cannot respond the same way without their own telepathic ability.
critterpower.mist_form=Mist Form
critterpower.mist_form.page=226
critterpower.mist_form.desc=This power allows the critter to transform itself into a cloud of mist. Shifting into and out of mist form are both Major Actions. When shifting into mist form, the critter transforms itself and any bonded foci it is carrying, active or not. The mist form has a movement rate of five meters per Move action or about six kilometers per hour; the critter can control some of its movement in this form, though it is susceptible to wind speeds greater than its movement speed when moving against them. These can push or disrupt the mist, which can temporarily disorient the critter. The mist form can pass through any cracks or crevices as long as they are not airtight. Systems that defend against gases, bacteria, or viral infiltration will stop a critter in mist form. <br/>While in mist form, the critter has Immunity to Normal Weapons but is considered to have a moderate Allergy to Fire. If the being is exposed to a substance to which it is allergic or vulnerable, it is immediately forced back into its normal form. While in mist form, the critter can perceive normally but cannot use any of its other powers until it resumes its normal form.
critterpower.movement=Movement
critterpower.movement.page=226
critterpower.movement.desc=This power allows the critter to speed up or slow down the target\u2019s movement rate. The power only works on things that are predisposed to locomotion, namely vehicles, characters, or critters. The critter can multiply the target\u2019s movement by up to its Magic attribute.<br/>\
 For unwilling targets, the critter makes an opposed test using its Magic + Willpower against the target\u2019s Logic + Willpower. If successful, the critter applies the Hobbled status (p. 52) for a number of rounds equal to the net hits.<br/>\
 Using Movement on vehicles is tougher than it is on critters and characters. If the target is a vehicle, the critter makes a Magic + Willpower test with a threshold of half the vehicle\u2019s Body (round up, minimum of 2). If the critter meets the threshold, add the hits to the vehicle\u2019s Acceleration attribute and then add the result to (or subtract it from) the vehicle\u2019s Speed in the next Combat Round, as if accelerating or decelerating the vehicle. The critter can continue to make Magic + Willpower tests to increase or decrease the vehicle\u2019s speed each combat round that it sustains this power and the vehicle remains in its domain/terrain. Based on the situation, these sudden changes in speed may call for Crash tests (p. 200) or a Piloting test for the vehicle.
critterpower.mystic_armor=Mystic Armor
critterpower.mystic_armor.page=226
critterpower.mystic_armor.desc=This power functions in the same way as Armor, except that it only provides protection from attacks on the astral plane.<br/>\
 The critter\u2019s natural Armor increases the Defense Rating of the critter and is cumulative with the boost from any worn armor. 
critterpower.natural_weapon=Natural Weapon
critterpower.natural_weapon.page=226
critterpower.natural_weapon.desc=Teeth. Claws. A spiked tail. Whatever shape it takes, this critter possesses some means of inflicting Physical damage. The description of this power describes the nature of the attack, as well as its Damage, Attack Rating, and appropriate stats. Natural weapons may be either Close Combat or ranged attacks, and critters follow standard combat rules when using them. Critters use the Close Combat skill to attack with melee weapons, and the Exotic Weapons skill to attack with ranged weapons. Natural weapons are considered normal for purposes of the Immunity to Normal Weapons power; exceptions are noted in individual critter descriptions.<br/>\
 A dual-natured critter with a Close Combat Natural Weapon can use it against astral targets that are within its reach. Use the critter\u2019s normal Close Combat skill and physical Damage Value (typically Strength / 2 unless otherwise noted) for this attack. Ranged Natural Weapons, like other ranged combat options, do not work on the astral plane. Critters without a Natural Weapon may still make a Close Combat attack with attributes defined on the critter.
critterpower.noxious_breath=Noxious Breath
critterpower.noxious_breath.page=226
critterpower.noxious_breath.desc=This power can incapacitate targets with a nauseating stench. This is treated as a Spray Ranged Attack (p. 117) using the critter\u2019s Agility + Magic, with an Attack Rating of Near (Magic x 2), Close (Magic), Medium \u2014, Far \u2014, Extreme \u2014. The attributes for the toxin attack are Vector: Inhalation, Speed: Immediate, Power: critter\u2019s Magic, Effect: Stun damage, Dazed, Nauseated). Armor is useless against this attack, but an active chemical seal operates as normal.
critterpower.paralyzing_howl=Paralyzing Howl
critterpower.paralyzing_howl.page=226
critterpower.paralyzing_howl.desc=This power causes targets to slow or stiffen up.It affects everyone who hears it within a radius of (Magic x 15) meters around the howling creature, with the exception of other critters with the same power. The critter makes a Magic + Charisma vs. Intuition + Willpower Opposed test. The rating of any area-effect sound-dampening devices, personal sound-dampening devices (such as cyberware, or earbuds with sound dampening), or hits scored by Hush or Silence spells, is added to the target\u2019s Opposed test, with only the highest single modifier applying. If the target wins, they suffer no ill effects. If the critter wins, the target gains the Immobilized status. If the critter gets 4 or more net hits, the target gains the Stilled status.
critterpower.paralyzing_touch=Paralyzing Touch
critterpower.paralyzing_touch.page=227
critterpower.paralyzing_touch.desc=This is the Touch-range version of the Paralyzing Howl power. The critter must touch the target; if the target is surprised or otherwise unaware of the critter, this is an automatic hit. If the target is aware of the critter, treat this as a Close Combat attack that causes no damage. The critter then makes an Agility + Magic vs. Reaction + Willpower Opposed test. The effect is the same as Paralyzing Howl.<br/>\
 This power causes targets to slow or stiffen up.It affects everyone who hears it within a radius of (Magic x 15) meters around the howling creature, with the exception of other critters with the same power. The critter makes a Magic + Charisma vs. Intuition + Willpower Opposed test. The rating of any area-effect sound-dampening devices, personal sound-dampening devices (such as cyberware, or earbuds with sound dampening), or hits scored by Hush or Silence spells, is added to the target\u2019s Opposed test, with only the highest single modifier applying. If the target wins, they suffer no ill effects. If the critter wins, the target gains the Immobilized status. If the critter gets 4 or more net hits, the target gains the Stilled status.
critterpower.petrification=Petrification
critterpower.petrification.page=227
critterpower.petrification.desc=This is the unfun way of getting stoned. The critter makes a Magic + Intuition vs. Reaction + Willpower Opposed test. If the critter wins, the target suffers the Immobilized status. If the critter gets 4 or more net hits, the target gains the Petrified status. Repeated attacks with this power accumulate net hits between attacks. While transformed, the victim is unaware of their surroundings and events happening around them. This power is often used over and over to keep slowing a target until they are petrified.
critterpower.psychokinesis=Psychokinesis
critterpower.psychokinesis.page=227
critterpower.psychokinesis.desc=This power enables a critter to move an object with its mind. The invisible \u201Chand\u201D has Strength and Agility equal to the number of hits scored on a Magic + Willpower Test, can move 10 meters per combat round, and can make a Close Combat or Ranged Attack with the appropriate skill of the critter.
critterpower.regeneration=Regeneration
critterpower.regeneration.page=227
critterpower.regeneration.desc=This power allows rapid healing of any damage a critter has taken. At the end of each combat round, if the critter has any damage at all, it makes a Magic + Body test, adds its Body to the number of hits scored, and heals that many boxes of damage, first from Overflow boxes, then from the Physical Condition Monitor, and finally from the Stun Condition Monitor. If the critter has exceeded its maximum Overflow boxes, it\u2019s not dead yet. It still gets a Regeneration test. If, after this test, its Overflow boxes still exceed its (Body x 2), then it\u2019s really dead.<br/>\
 Regeneration can\u2019t heal everything. Damage to the brain via a called shot (Call a Shot p. 42 or Called Shot: Vitals p. 47), magical damage from weapon foci, damage from a Vulnerability, and damage from drain can\u2019t be healed by Regeneration. If the critter is damaged by something it has an Allergy to, it can heal the damage, but it can\u2019t make a Regeneration test as long as it is in contact with the allergen.<br/>\
 Regeneration is incompatible with augmentations. Critters with Regeneration cannot receive augmentations, as surgical incisions close too quickly to perform the implantation. Critters with augmentations who gain this power will reject their augmentations as the power repairs their existing genetic template.
critterpower.sapience=Sapience
critterpower.sapience.page=227
critterpower.sapience.desc=Sapient critters are self-aware, no longer primarily driven by instinct, and generally at or above the level of Homo sapiens. Most critters are considered unaware, meaning they can\u2019t make tests involving skills they don\u2019t possess, but sapient critters are merely Untrained (see p. 93). They are also capable of learning new skills if they so choose.<br/>\
 Most sapient critters are mundane, but they are capable of Awakening or Emerging and possessing a Magic or Resonance attribute. These special sapient critters are capable of learning Magic and Resonance-based skills and follow the same rules as normal characters.
critterpower.search=Search
critterpower.search.page=227
critterpower.search.desc=You can find your lost keys really fast with this power. To find a target, the critter makes a Magic + Intuition (5, 10 minutes) Extended test. Lots of things can make this harder; apply the appropriate threshold modifiers from the Search Modifiers table.<br/>\
 The critter must have seen the thing it\u2019s searching for at some point before the search begins. Spirits may search for anything for which their summoner can provide them a mental image. Critters who can enter astral space may use this power there but still need to materialize while searching for an inanimate target in the physical world. Living things with auras can be searched for from the astral plane.
critterpower.venom=Venom
critterpower.venom.page=228
critterpower.venom.desc=The critter secretes a toxin (see p. 122) that is dangerous and harmful to others. Typically, the attributes for this poison are Vector: Injection; Speed: 1 combat round; Power: Magic; Effect: Dazed, Poisoned (Magic)P. Some critters may have venoms with different attributes, such as a Contact vector, that will be noted in their individual descriptions.
critterpower.weather_control=Weather Control
critterpower.weather_control.page=228
critterpower.weather_control.desc=This allows a critter to manipulate, within reason, certain local weather conditions. The desired weather must be realistically possible in the environment. It builds up over time, reaching its peak when the critter completes a Magic + Willpower (10, 30 minutes) Extended Test. In spite of the power\u2019s name, the critter only summons conditions and moves them in the desired direction. A critter can summon a thunderstorm, for instance, but can\u2019t aim the lightning bolts.


