item.aztechnology_striker.page=259
item.aztechnology_striker.wifi=Eine Verbindung des Werfers zur örtlichen Matrix liefert einen Würfelpoolbonus von +1, sofern nicht bereits andere Systeme in Anwendung sind, die einen Bonus liefern.
