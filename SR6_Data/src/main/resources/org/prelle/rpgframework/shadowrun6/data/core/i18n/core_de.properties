item.onotari_interceptor.page=259
item.onotari_interceptor.wifi=Das Sicherheitssystem kann nicht abgeschaltet werden, aber der Schütze erhält den Smartlink-WiFi-Bonus.

item.airburst_link=Airburst-Verbindung
item.airburst_link.page=259
item.airburst_link.wifi=Eine Airburst-Verbindung benötigt Wi-Fi, um überhaupt funktionieren zu können. Sowohl die Granaten oder Raketen als auch der Werfer müssen im eingeschalteten WiFi-Modus sein.
item.bipod=Zweibein
item.bipod.page=259
item.bipod.wifi=Der Bonus auf den Angriffswert erhöht sich auf +3, wenn liegend oder sitzend gefeuert wird.
item.concealable_holster=Tarnholster
item.concealable_holster.page=261
item.concealable_holster.wifi=Sensoren, ein smartes Gewebe und ein aktiver Haftklebstoff ermöglichen es dem Holster, Farbe und Struktur in Echtzeit zu verändern, wodurch sich die Tarnbarkeit noch einmal um 1 erhöht.
