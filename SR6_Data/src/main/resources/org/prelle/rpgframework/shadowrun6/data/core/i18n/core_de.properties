item.armtech_mgl6=ArmTech MGL-6
item.armtech_mgl6.page=258
item.armtech_mgl6.wifi=Bei aktivierter WiFi-Funktionalität lässt der Werfer keine in die Waffe geladene Munition innerhalb von 5 Metern Entfernung von der Waffe detonieren, selbst wenn ein vorgetäuschter Befehl der Waffe andere Anweisungen erteilt.
