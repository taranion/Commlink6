item.laser_sight=Lasermarkierer
item.laser_sight.page=260
item.laser_sight.wifi=Die Angriffswerte werden um 2 erhöht. Du erhältst eine Nebenhandlung, wenn du an der Reihe bist und den Lasermarkierer aktivierst oder deaktivierst.
item.periscope=Periskop
item.periscope.page=260
item.periscope.wifi=Das Blickfeld des Periskops kann geteilt werden, sodass das, was das Periskop sieht, auch vom Rest des Teams gesehen werden kann.
